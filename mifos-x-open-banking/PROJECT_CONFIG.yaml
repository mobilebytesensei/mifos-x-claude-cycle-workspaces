  updated: 2026-05-25

# ─── Tech Stack ───────────────────────────────────────────────────────────────
tech:
  language: kotlin                   # Kotlin 2.1.20
  ui_framework: compose-multiplatform  # Compose Multiplatform 1.8.2
  architecture: stream-first         # BaseViewModel + ScreenDataStream + Store5
  di: koin                           # Koin 4.1.0 + koin-annotations 2.1.0
  network: ktor-ktorfit              # Ktor 3.2.0 + Ktorfit 2.5.2
  database: room-kmp                 # Room 2.7.2 + sqlite-bundled 2.5.2
  navigation: androidx-navigation    # Jetpack Navigation Compose (type-safe @Serializable routes)
