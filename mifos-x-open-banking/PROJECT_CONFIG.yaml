  # fifth tab; flows/app-main.yaml and design-system/COMPONENTS.md both derive from it, so the
  # apparent "three files agree on five" was one wrong line cited three times.
  # `cards` and `card-detail` remain real screens — reached from Accounts, not from a tab.
  bottom_nav: [Home, Accounts, Pay, More]

# ─── Backend ─────────────────────────────────────────────────────────────────
# CORRECTED 2026-08-07 (/idea-sync): this read "Primary backend: Open Bank Project (OBP) API
# v7.0.0". OBP was evicted on 2026-08-06; the app is an HSBC/OBIE client.
# Primary backend: HSBC UK Open Banking — OBIE Read/Write v4.0 (AIS + PIS), OAuth v1.1
#   resource host  secure.sandbox.ob.hsbc.co.uk   (mTLS, FAPI 1.0 Advanced)
#   authorize host sandbox.ob.hsbc.co.uk          (oauth2/authorize ONLY)
#   open data      api.hsbc.com                   (OBIE Open Data v2.2 — unauthenticated, LIVE)
# Secondary: Firebase (observability only — Crashlytics + Performance)
#
# IMPORTANT — EXTERNAL API CONSUMER, NO OWNED BACKEND:
# This project OWNS NO backend and NO database. It is a pure KMP client that
# CONSUMES the external HSBC UK OBIE REST API. There is intentionally NO `server.backends`
# block → RULE-IDEA-SERVER-DATA-001 (owned-DB checks: server/tables/, apis↔flows
# 1:1) MUST SKIP entirely (rule Enforcement line 145 / Evaluation line 168).
# The artifacts under idea-layer/server/apis/ + api_manifest.yaml are CLIENT
# contracts for Ktorfit codegen — they are NOT owned-backend schema. Screens
# declare `capabilities: [has_ui]` only; none declare `has_api` (no owned data layer).
backend:
  owned: false                       # no backend/DB built or owned by this project
  provider: rest                     # HSBC UK OBIE REST API (external, not Supabase/Firebase data)
  environments:
    sandbox:
      api_base_url: https://secure.sandbox.ob.hsbc.co.uk    # mTLS resource host
      api_base_path: /obie/open-banking/v4.0                # /aisp/… and /pisp/… resources
      authorize_url: https://sandbox.ob.hsbc.co.uk/obie/open-banking/v1.1/oauth2/authorize
      token_url: https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v1.1/oauth2/token
      open_data_url: https://api.hsbc.com                   # OBIE Open Data v2.2 — unauthenticated, LIVE
      api_version: v4.0                                     # OBIE R/W v4.0; OAuth endpoints are v1.1
      auth_method: fapi_private_key_jwt                     # mTLS + private_key_jwt (PS256) + auth-code
      security_profile: fapi-1.0-advanced
      # Credentials resolve through /secrets — never hardcode, never .env (RULE-SECRETS-VAULT-001).
      # NOTE: these aliases still need registering in core/registries/SECRETS_ALIAS_REGISTRY.yaml.
      secrets:
        client_id: hsbc-ob-sandbox-client-id
        signing_kid: hsbc-ob-sandbox-signing-kid
        signing_key: hsbc-ob-sandbox-signing-key            # PS256 private key (PKCS#8)
        transport_cert: hsbc-ob-sandbox-transport-cert      # mTLS client certificate
      # The path segment names the evicted backend, but this value is REGISTERED with HSBC in the
      # SSA (software_redirect_uris). OAuth requires an exact match — renaming it requires
      # re-registration with HSBC first. Do NOT edit unilaterally.
      redirect_uri: https://thekalpeshpawar.github.io/obp-callback/callback/
    production:
      api_base_url: TBD                                     # HSBC production OB access not provisioned
      api_base_path: /obie/open-banking/v4.0
      api_version: v4.0
      auth_method: fapi_private_key_jwt
      security_profile: fapi-1.0-advanced
  observability:
    provider: firebase
    services: [crashlytics, performance]
    firebase_project_id: TBD

# ─── Platforms ───────────────────────────────────────────────────────────────
platforms: [android, ios, desktop, web]

# ─── Layers ──────────────────────────────────────────────────────────────────
layers:
  plan:        { enabled: true }
  design-spec: { enabled: true, design_tool: figma }
  server:      { enabled: true }   # OBIE REST — client/server contract via Ktorfit interfaces
  client:      { enabled: true }   # Ktorfit services + Store5 repos per OBIE resource group
  feature:     { enabled: true }
  infrastructure: { enabled: true }
  platform:    { enabled: true }   # expect/actual: cmp-android, cmp-ios, cmp-desktop, cmp-web
  testing:     { enabled: true, frameworks: [kotlin-test] }

# ─── Design (icon-library lock) ──────────────────────────────────────────────
# Added 2026-08-03 (/idea-heal). The block was absent entirely, which silently bypassed the
# idea-render scan gate: RULE-PROTO-RENDER-LLM-001 RV-016 locks renders to a single icon
# library declared here, and /idea-verify-e2e gates its 15-pt render check on this key being
# present. With it missing the check scored `—` and redistributed, so 12 features with NO
# rendered previews at all were invisible in the health score rather than penalised.
# VERIFY_LOG has carried "design block absent — idea-render scan gate partially bypassed"
# since the 07-28 sync; this closes it.
#
# The key is `icon_library`, confirmed against all four consumers — RULE-PROTO-RENDER-LLM-001
# (RV-016), idea-feature-render.md, project-verify.md and IDEA_CAPABILITY_REGISTRY.yaml.
#
# `material-icons` is not a guess. Every icon name across the 46 screens is Material Symbols
# vocabulary — cloud_off, warning_amber, credit_card_off, receipt_long_outlined, calendar_today,
# expand_more, link_off, camera_alt — and the `_outlined` suffix is the Compose
# `Icons.Outlined.*` convention this CMP Material 3 app already compiles against.
design:
  icon_library: material-icons

# ─── Stitch (mockup generation) ──────────────────────────────────────────────
# Live .stitch/ infra + .env.stitch present in the project.
stitch:
  enabled: true

