schema_version: 2
tech_stack: "kmp-app"
project:
  name: mifos-x-open-banking
  display_name: Mifos X Open Banking
  type: kmp
  subtype: kmp-app
  status: planning
  workspace: mifos-x
  created: 2026-10-21
  org_domain: org.mifosx
  package_name: org.mifosx.openbanking
repository:
  origin: "https://github.com/therajanmaurya/mifos-x-open-banking"   # fork

  upstream: "https://github.com/openMF/mifos-x-open-banking"
  default_branch: dev
tech:
  language: kotlin
  ui_framework: compose-multiplatform
  architecture: mvi
  di: koin
  network: ktor-ktorfit
  database: room-kmp
backend:
  provider: rest            # first-party Cloudflare Worker BFF (bff/, TD-008) in front of the HSBC UK Open Banking sandbox
  note: >-
    TypeScript Cloudflare Worker mifos-x-open-banking-bff on workers.dev (Workers Free), source in bff/ of the
    app repo. It alone holds the HSBC transport certificate (mTLS binding), the PS256 signing key
    (non-extractable WebCrypto), the client id / KID / software statement / signing issuer and every PSU token
    (Durable Objects). The KMP app is a plain HTTPS client of its route table (FR-053, NFR-010, NFR-013).
    Readiness for provider rest: server-layer/rest/API.md mirrors bff/docs/API.md (goal hsbc-identity-cloudflare-bff, phase 08).
  environments:
    local:
      auto_generated: true
      base_url: "http://127.0.0.1:8787"   # wrangler dev (mTLS binding only works with --remote)
    production:
      base_url: "https://mifos-x-open-banking-bff.mifos-x-open-banking-bff.workers.dev"   # first deployed 2026-10-22 (phase 02)
platforms: [android, ios, desktop, web]
layers:
  plan:
    enabled: true
  design-spec:
    enabled: true
    design_tool: figma
  server:
    enabled: true
  client:
    enabled: true
  feature:
    enabled: true
  infrastructure:
    enabled: true
  platform:
    enabled: true
  testing:
    enabled: true
idea:
  stitch_pipeline_version: v4
