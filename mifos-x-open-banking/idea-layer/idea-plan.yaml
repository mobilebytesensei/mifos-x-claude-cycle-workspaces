  _last_updated: "2026-10-21"
  base_url: "https://{HSBC_BANK_HOST}/obie/open-banking/"
  api_gap_analysis:
    spec: "UK Open Banking Read/Write API v4.0"
    coverage_note: "All AIS reads the app needs, plus single, scheduled and standing-order PIS (domestic + international) and domestic VRP are wired."
    unused_or_missing:
      - { area: "AIS /accounts/{id}/parties", status: "client method exists, never called", impact: "joint account holders not shown" }
      - { area: "AIS /accounts/{id}/offers", status: "not implemented", impact: "no product offers" }
      - { area: "AIS /statements query filters (fromStatementDateTime/toStatementDateTime)", status: "not used", impact: "full statement list always fetched" }
      - { area: "AIS /transactions date filters", status: "not used", impact: "date-range filter runs only on loaded pages (DEF-009)" }
      - { area: "PIS file payments", status: "not implemented", impact: "no bulk/batch payments" }
      - { area: "PIS international scheduled/standing-order funds confirmation", status: "N/A per spec", impact: "none" }
      - { area: "VRP funds-confirmation", status: "implemented, never called", impact: "submit without funds check (DEF-005)" }
      - { area: "CBPII confirmation of funds", status: "not implemented", impact: "out of scope" }
      - { area: "Event notifications / aggregated polling", status: "not implemented", impact: "status refresh is manual" }
      - { area: "Dynamic Client Registration", status: "out-of-band on HSBC DevHub", impact: "SSA generated into config but unused in code" }
  error_catalogue:
    - { http: 400, ob_code: "UK.OBIE.Unsupported (U000 in HSBC sandbox)", meaning: "Endpoint/product not supported for this account", client_kind: Unsupported, retriable: false }
    - { http: 400, ob_code: "UK.OBIE.Signature.Invalid (U019 in HSBC sandbox)", meaning: "Detached JWS rejected", client_kind: SignatureRejected, retriable: false }
    - { http: 400, ob_code: "UK.OBIE.Field.Invalid / Field.Missing", meaning: "Malformed request", client_kind: MalformedRequest, retriable: false }
    - { http: 401, ob_code: null, meaning: "Access token expired or invalid", client_kind: TokenExpired, retriable: "after refresh, else LoginRenew" }
    - { http: 403, ob_code: "UK.OBIE.Resource.ConsentMismatch / consent revoked", meaning: "Consent revoked, expired or lacks the permission", client_kind: ConsentRevoked, retriable: false }
    - { http: 404, ob_code: "UK.OBIE.Resource.NotFound", meaning: "Resource not found", client_kind: NotFound, retriable: false }
    - { http: 429, ob_code: null, meaning: "Rate limited", client_kind: RateLimited, retriable: "after back-off" }
    - { http: 5xx, ob_code: "UK.OBIE.UnexpectedError", meaning: "ASPSP error", client_kind: ServerError, retriable: true }
  fapi_headers:
    - { header: x-fapi-interaction-id, sent_on: "PISP + VRP", rule: "UUID per request; echoed back by the ASPSP" }
    - { header: x-fapi-financial-id, sent_on: "never (hardcoded blank)", rule: "Required by many production ASPSPs — make configurable" }
    - { header: x-fapi-customer-ip-address, sent_on: never, rule: "Required when the PSU is present — consider for production" }
    - { header: x-fapi-auth-date, sent_on: never, rule: "Optional; last PSU authentication time" }
    - { header: x-jws-signature, sent_on: "PISP + VRP writes", rule: "Detached JWS, PS256, OBIE v4.0.1 claims in crit, no b64" }
    - { header: x-idempotency-key, sent_on: "PISP + VRP writes", rule: "≤ 40 chars; distinct key per consent and per payment" }
  timeout_retry_policy:
    connect_timeout_ms: 15000
    request_timeout_ms: 30000
    retry:
      idempotent_get: "Up to 2 retries with exponential back-off (500ms, 1500ms) on 5xx / network; never on 4xx"
      writes: "Never auto-retry; user-triggered retry reuses the same x-idempotency-key"
      token_refresh: "Exactly one refresh_token attempt per 401 (RETRIED_AFTER_REFRESH guard)"
      rate_limited: "Honour Retry-After when present; otherwise back off ≥ 5s"
    note: "Policy values are the proposed target; verify current Ktor HttpTimeout/retry config before implementing"
