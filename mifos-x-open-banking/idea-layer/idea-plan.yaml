    - { id: FR-041, priority: should, description: "VRP consent setup: payer, payee, per-payment + periodic ceilings, period type, optional end date", acceptance_criteria: ["Per-payment < periodic", "End date ≥ today+2 UTC", "Sort code 6 digits", "No eligible payer → NoEligiblePayers"] }
    - { id: FR-042, priority: should, description: "Stage VRP consent and launch bank authorisation", acceptance_criteria: ["Staging failures classified"] }
    - { id: FR-043, priority: should, description: "VRP redirect: validate, exchange, read consent back", acceptance_criteria: ["Mismatched/declined/code-less exchange nothing", "Card payer → Unusable"] }
    - { id: FR-044, priority: should, description: "List/view VRP consents with limits, usage, history, revoke", acceptance_criteria: ["Headline is largest periodic ceiling", "Revoked marked"] }
    - { id: FR-045, priority: should, description: "Pay under a VRP consent within remaining allowance", acceptance_criteria: ["Remaining from tightest ceiling", "Below a penny refused", "RetrySubmission + RefreshOutcome"] }
    - { id: FR-046, priority: should, description: "Sign out from Settings (currently only via consent revoke)", acceptance_criteria: ["Sign-out clears PSU tokens + history and returns to AuthGraph"], _source: gap_analysis }
    - { id: FR-047, priority: should, description: "'Manage consents' from payment flows navigates to ConsentList (currently onNavigateToConsents = {})", acceptance_criteria: ["Tapping Manage consents in send/schedule/standing-order opens ConsentList"], _source: gap_analysis }
    - { id: FR-048, priority: should, description: "Accounts list and Payments Hub reachable from the authenticated shell (bottom-nav tabs or Home entry points)", acceptance_criteria: ["navigateToAccounts() and PaymentsHubRoute each have ≥1 caller", "G-IMPL-NAV-CONN passes for both Route files"], _source: gap_analysis }
    - { id: FR-050, priority: must, description: "Consent relay reads the bank response (fragment first, query fallback) and delivers it: desktop loopback 127.0.0.1:8765 when a listener answers, otherwise the mobile app", acceptance_criteria: ["Desktop delivery never also triggers the mobile hand-off", "iOS gesture block → 'Reopen the app' button", "Empty response → 'Nothing to return'"], _source: idea-plan-add }
    - { id: FR-051, priority: must, description: "Consent relay leaves no authorisation code behind: fragment scrubbed from history, page never cached, never framed, no referrer", acceptance_criteria: ["history.replaceState clears the fragment after read", "Cache-Control no-store", "frame-ancestors 'none'", "Referrer-Policy no-referrer"], _source: idea-plan-add }
    - { id: FR-052, priority: should, description: "Redirect opens only the verified app: Android App Links + iOS Universal Links on the relay domain, custom scheme kept only as fallback", acceptance_criteria: ["/.well-known/assetlinks.json lists the release signing-cert SHA-256", "apple-app-site-association lists the app ID", "autoVerify intent-filter on the https callback path"], _source: idea-plan-add }
    - { id: FR-049, priority: must, description: "401 / 403 on every AIS screen route to LoginRenew (session) or Consents (revoked) instead of a dead-end Retry", acceptance_criteria: ["TokenExpired → LoginRenewRoute action", "ConsentRevoked → ConsentListRoute action", "No Retry offered for non-retriable kinds"], _source: gap_analysis }
    - { id: FR-053, priority: must, description: "The TPP identity (signing key, mTLS transport certificate and key, client id, kid, software statement, signing issuer) is held only by the Cloudflare Worker bank gateway; no Android, iOS, desktop or web build reads, bundles or can reach it", acceptance_criteria: ["No certs/ directory, PEM or PKCS#12 in any built artefact", "No HSBC_* identity constant or mTLS code in core/, cmp-*, feature/", "Every bank call goes through the bank gateway"], _source: idea-plan-add }
    - { id: FR-054, priority: must, description: "The bank gateway fully verifies the id_token returned with the authorisation code before exchanging the code: PS256 signature against the HSBC JWKS, iss, aud (client id), exp, nonce, c_hash (binds the code) and s_hash (binds the state)", acceptance_criteria: ["Bad signature, wrong iss, wrong aud, expired, nonce mismatch, wrong c_hash or wrong s_hash → 400 and the code is never exchanged", "Valid token → code exchanged and an opaque session returned"], _source: idea-plan-add }
    - { id: FR-056, priority: must, description: "Bank authorisation (sign-in, payment, VRP) opens in the OS in-app browser tab — Android Custom Tabs, iOS ASWebAuthenticationSession — never an embedded WebView (RFC 8252 / FAPI) and never by leaving the app; desktop keeps the system browser + loopback, web keeps the same-tab redirect", acceptance_criteria: ["Android: authorize URL opens in a Custom Tab (external browser only if no Custom Tabs provider exists)", "iOS: ASWebAuthenticationSession with callbackURLScheme org.mifosx.openbanking returns the callback URL to the app", "No WebView anywhere in the authorisation path"], _source: user-request-2026-10-22 }
    - { id: FR-055, priority: must, description: "Consent creation and /v1/auth/complete calls from Android carry a Play Integrity token and from iOS an App Attest attestation or assertion; the bank gateway rejects them without a valid one. Desktop and web rely on bank-login-gated sessions and rate limits", acceptance_criteria: ["platform=android|ios without attestation → 401/403", "Tampered nonce, wrong package or bundle, non-increasing App Attest counter → rejected", "Desktop/web requests are rate-limited (429 past the threshold)"], _source: idea-plan-add }
  # Defect → violated requirement links
  defect_requirement_links:
    DEF-001: [FR-022]
    DEF-002: [FR-029]
    DEF-003: [FR-025, NFR-006]
    DEF-004: [FR-010]
    DEF-005: [FR-045]
    DEF-006: [FR-021, FR-043]
    DEF-007: [FR-020]
    DEF-008: [FR-040, FR-049]
    DEF-009: [FR-008, NFR-004]
    DEF-010: [FR-035]
    DEF-011: [FR-017, FR-018]
    DEF-012: [FR-033]
    DEF-013: [NFR-008]
    DEF-014: [FR-011, FR-013, FR-040]
    DEF-015: [FR-029, FR-053, NFR-006]
  # Defects found in source by the STEP 2.5 screen-file pass (2026-10-21). Each is recorded
  # as known_gaps in the feature's screens/{feature}/ui.yaml. Severity is triage, not verified on device.
  source_defects:
    - { id: DEF-001, severity: high, feature: consent-callback, description: "A Rejected consent still completes sign-in (poll status ignored); Awaiting state unreachable" }
    - { id: DEF-002, severity: high, feature: send-money, description: "Error-screen Retry dispatches RetryStaging not RetryLoad — can stage a payment that skipped Review; same in payments-schedule-payment and payments-standing-order" }
    - { id: DEF-003, severity: high, feature: consent-detail, description: "Revoke logs out even when the bank DELETE fails — consent can stay live at the bank; VRP revoke marks revoked locally on refusal" }
    - { id: DEF-004, severity: high, feature: transaction-detail, description: "Looks up the transaction in page 1 only — transactions from page 2+ show 'not found'" }
    - { id: DEF-005, severity: medium, feature: vrp, description: "Funds confirmation implemented but never called before domestic-vrps submit" }
    - { id: DEF-006, severity: medium, feature: consent-callback, description: "Error screen always says 'declined' — network/token-exchange failures look like user denial; VRP callback likewise shows a security message on decline" }
    - { id: DEF-007, severity: medium, feature: login, description: "Cancel on first-run Login exits the app (no onBack); Authorising has no cancel/timeout" }
    - { id: DEF-008, severity: medium, feature: account-detail, description: "401/403 errors across AIS screens only offer Retry — no route to LoginRenew/Consents (violates FR-040); empty data maps to Loading forever on account-detail and statement-detail" }
    - { id: DEF-009, severity: medium, feature: transactions, description: "Bypasses the Store5 transactionsStream (no offline cache, NFR-004); filters run only on loaded pages; page-2+ rows get empty accountId" }
    - { id: DEF-010, severity: medium, feature: payment-consent, description: "'Authorise again' and VRP callback outcomes all return to Home instead of the originating flow" }
    - { id: DEF-011, severity: medium, feature: statement-detail, description: "Shows 'Statement PDF saved' on web no-op or when the save dialog is cancelled; always saves .pdf even for CSV" }
    - { id: DEF-012, severity: low, feature: payments-standing-order, description: "Infinite spinner when no payment-capable accounts; 6 unused test tags" }
    - { id: DEF-013, severity: low, feature: login, description: "Hardcoded strings (errors, permission labels, HSBC text, payments-hub cards) bypass strings.xml" }
    - { id: DEF-014, severity: low, feature: scheduled-payments, description: "Reference line uses 'To:' prefix; no Unsupported state for U000; 403 offers Retry" }
    - { id: DEF-015, severity: high, feature: send-money, description: "Every PIS/VRP write is refused by HSBC (UK.OBIE.Signature.InvalidClaim on http://openbanking.org.uk/iss) when HSBC_SIGNING_ISSUER holds the OBIE org_id/software_id form — HSBC requires the signing certificate's subject DN (RFC 2253). Found by the bank gateway spike 2026-10-22; the vaulted issuer now holds the DN, and payments also need RemittanceInformation.Structured[0].CreditorReferenceInformation.Reference (U004 otherwise)", _source: bank-gateway-spike }
  # Data entities — the domain the client reads/writes. Source = OBIE v4.0 endpoint (remote) or local store.
  data_entities:
    - { name: Account, source: "GET /v4.0/aisp/accounts[/{AccountId}]", local: "Room accounts", fields: [accountId, type, subType, nickname, scheme, identification, currency, isCard], relationships: ["has many Balance", "has many Transaction", "has many Statement", "has one Product", "has one Party"] }
    - { name: Balance, source: "GET /v4.0/aisp/accounts/{AccountId}/balances", fields: [accountId, type, amount, currency, creditDebit, dateTime, creditLine], relationships: ["belongs to Account"] }
    - { name: Transaction, source: "GET /v4.0/aisp/accounts/{AccountId}/transactions (Links.Next)", local: "Room transactions", fields: [transactionId, accountId, description, amount, currency, creditDebit, status, bookingDateTime, reference, balanceAfter, mcc], relationships: ["belongs to Account"] }
    - { name: Statement, source: "GET /v4.0/aisp/accounts/{AccountId}/statements[/{StatementId}[/transactions|/file]]", fields: [statementId, accountId, startDate, endDate, closingBalance, fees, interest], relationships: ["belongs to Account", "has many Transaction"] }
    - { name: StandingOrder, source: "GET /v4.0/aisp/accounts/{AccountId}/standing-orders", fields: [standingOrderId, accountId, payee, amount, frequency, nextPaymentDate, status], relationships: ["belongs to Account"] }
    - { name: DirectDebit, source: "GET /v4.0/aisp/accounts/{AccountId}/direct-debits", fields: [directDebitId, accountId, name, mandateRef, lastAmount, lastCollected, status], relationships: ["belongs to Account"] }
    - { name: ScheduledPayment, source: "GET /v4.0/aisp/accounts/{AccountId}/scheduled-payments", fields: [scheduledPaymentId, accountId, payee, amount, executionDate, reference, type], relationships: ["belongs to Account"] }
    - { name: Beneficiary, source: "GET /v4.0/aisp/accounts/{AccountId}/beneficiaries", fields: [beneficiaryId, name, scheme, identification, reference], relationships: ["belongs to Account", "used as payee by PaymentConsent and VrpConsent"] }
    - { name: Product, source: "GET /v4.0/aisp/accounts/{AccountId}/product", fields: [productName, monthlyFee, feeFree, overdraftTiers, creditInterestTiers, features], relationships: ["belongs to Account"] }
    - { name: Party, source: "GET /v4.0/aisp/accounts/{AccountId}/party", fields: [partyId, name, email, phone, address], relationships: ["belongs to Account"] }
    - { name: AccountAccessConsent, source: "POST/GET/DELETE /v4.0/aisp/account-access-consents", local: "secure Settings (consentId, expiry)", fields: [consentId, status, permissions, creationDateTime, expirationDateTime, transactionFromDateTime], relationships: ["authorises AIS reads"] }
    - { name: PaymentConsent, source: "POST/GET /v4.0/pisp/{domestic|international}[-scheduled|-standing-order]-payment-consents", fields: [consentId, kind, status, initiation, risk, cutOffDateTime], relationships: ["consumed by one Payment"] }
    - { name: Payment, source: "POST/GET /v4.0/pisp/{domestic|international}[-scheduled|-standing-order]-payments", fields: [paymentId, consentId, kind, status, amount, currency, creationDateTime, charges], relationships: ["created from PaymentConsent"] }
    - { name: PaymentHistoryEntry, local: "Room payment_history (cap 200, cleared on logout)", fields: [id, product, payee, amount, currency, reference, paymentId, status, createdAt], relationships: ["references Payment"] }
    - { name: VrpConsent, source: "POST/GET/DELETE /v4.0/pisp/domestic-vrp-consents", local: "Room vrp_consent", fields: [consentId, payerAccountId, payee, maxIndividualAmount, periodicLimits, validToDateTime, status], relationships: ["has many VrpPayment"] }
    - { name: VrpPayment, source: "POST/GET /v4.0/pisp/domestic-vrps", local: "Room vrp_payment", fields: [vrpId, consentId, amount, status, creationDateTime], relationships: ["belongs to VrpConsent"] }
    - { name: PendingAuth, local: "secure Settings (single-use)", fields: [state, nonce, consentId, leg, createdAt], relationships: ["one per in-flight authorisation (SignIn | Payment | Vrp)"] }
    - { name: PsuTokens, local: "bank gateway SessionDO (Cloudflare Durable Object) — per session, per leg (ais, payment:{consentId}, vrp:{consentId}); never on the device", fields: [accessToken, refreshToken, idToken, expiresAt, scope], relationships: ["issued per authorised consent", "reachable from the app only through its GatewaySession"] }
    - { name: GatewaySession, local: "secure Settings (opaque session id + expiresAt only)", fields: [session, expiresAt, legs], relationships: ["minted by POST /v1/auth/complete after id_token verification", "owns the PsuTokens held server-side"], _source: idea-plan-add }
  non_functional_requirements:
    - { id: NFR-001, category: security, description: "mTLS on every bank call; certs + keys never committed; secrets via vault → local.properties" }
    - { id: NFR-002, category: security, description: "Single-use PendingAuth (state/nonce); redirect dedupe so a single-use authorisation is never spent twice" }
    - { id: NFR-003, category: reliability, description: "Idempotent payment writes (x-idempotency-key ≤ 40)" }
    - { id: NFR-004, category: offline, description: "Cached Room data shown offline via Store5" }
    - { id: NFR-005, category: quality, description: "Kover coverage floor enforced in CI" }
    - { id: NFR-006, category: security, description: "FAPI 1.0 Advanced conformance: revocation confirmed at the ASPSP before local logout; nonce/state single-use; PS256 everywhere" }
    - { id: NFR-007, category: security, description: "No secrets, keystore passwords or certificates in the repository — vault-materialised only (RULE-SECRETS-VAULT-001)" }
    - { id: NFR-008, category: i18n, description: "All user-facing strings in strings.xml; 20 tier-1 locales shipped (see locales:)" }
    - { id: NFR-010, category: security, description: "TPP private keys (mTLS transport key, private_key_jwt / JWS signing key, p12 password) never ship inside an app build for a production or public store release — they live in the Cloudflare Worker bank gateway (mTLS certificate binding + Workers secrets)", applies_to: "any release beyond developer sandbox builds", _source: idea-plan-add }
    - { id: NFR-011, category: security, description: "Consent relay is open source (MPL-2.0) under openMF, hosted on an org-controlled Cloudflare account, served with strict security headers and zero third-party script; secrets never in the repo", _source: idea-plan-add }
    - { id: NFR-009, category: accessibility, description: "WCAG 2.1 AA: 48dp touch targets, content descriptions on every interactive element, screen-reader announcements for amounts and status" }
    - { id: NFR-012, category: performance, description: "On the Workers Free plan every bank gateway route's p99 cpuTime is under 10 ms, measured on the deployed Worker; a route over the limit halts the run and records the Workers Paid decision in bank-gateway/docs/RUNBOOK.md", verify: "bash bank-gateway/scripts/cpu-report.sh --since 24h → exit 0", _source: idea-plan-add }
    - { id: NFR-013, category: security, description: "No HSBC credential or key material (PEM, PKCS#12, certs/, HSBC_* identity values) in any built APK, IPA, desktop package or web bundle — enforced by the no-tpp-identity CI job on every PR", verify: ".github/workflows/bank-gateway.yml green", _source: idea-plan-add }

