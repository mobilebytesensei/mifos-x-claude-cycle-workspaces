      severity: critical
      description: >-
        Android upload-keystore + key passwords committed in plain text in fastlane-config/project_config.rb
        (public upstream). Treat the keystore as compromised: rotate before any store release, move the
        values into the vault (/secrets adopt), and remove them from the file.
