    ais_reads: "PSU bearer from secure Settings (hsbc_tokens), auto-attached + refresh-on-401"
    pis_vrp_writes: "per-call bearer + x-jws-signature (detached JWS, iss=HSBC_SIGNING_ISSUER) + x-idempotency-key ≤ 40"
    authorize: "front-channel PS256 request object, response_type 'code id_token', fragment relay"
