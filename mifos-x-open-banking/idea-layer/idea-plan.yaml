  vision:
    _tag: "§vision"
    _status: draft
    _quality_score: 80
    _source: wizard
    content:
      elevator_pitch: "A reference Account Information app that shows the full power of UK Open Banking — with your consent, securely read every account, balance, transaction, standing order and direct debit from your bank, with no passwords shared."
      problem_statement: "Bank account data is locked inside each bank's own app, and the only way to share it used to be insecure password sharing. UK Open Banking provides a regulated, consent-based, API-first alternative — but few apps demonstrate the standard's full AISP surface end to end."
      target_users:
        - "UK retail bank customers (PSUs) who want to view and share their account information securely."
        - "Open Banking / fintech developers and reviewers evaluating a complete, standards-strict AISP implementation."
      success_metrics:
        - "Every HSBC sandbox AIS resource (accounts, balances, transactions, beneficiaries, standing-orders, direct-debits, scheduled-payments, statements, product, party) is reachable and renders real sandbox data."
        - "End-to-end FAPI consent journey (DCR → create consent → app-to-app authorize → token → resource) completes against the live HSBC sandbox."
        - "Consent dashboard supports revoke + 90-day reconfirmation."
      solution_statement: "A Kotlin Multiplatform (Compose) AISP client that performs the OBIE FAPI 1.0 Advanced consent journey against HSBC and surfaces the complete Account & Transaction API as clear, accessible screens — read-only, no money movement."
      value_propositions:
        - "Complete UK Open Banking AISP coverage in one reference app."
        - "Standards-strict: OBIE Read/Write v4.0 + FAPI 1.0 Advanced security."
        - "Consent-first and transparent — clear permissions, expiry, and revocation."
        - "Cross-platform: Android, iOS, Desktop, Web from one codebase."
      scope:
        # ── SCOPE REVERSAL 2026-07-30 (/idea-evolve) ────────────────────────
        # PISP moved out_of_scope -> in_scope. Rationale: core/network already shipped a
        # complete unconsumed PISP wire-model surface for six payment types, and the Pay
        # bottom-nav tab already pointed at it via the SendMoneyRoute placeholder — recorded
        # as §api_surface.out_of_scope_drift on 2026-07-28. This reversal closes that drift
        # by making the declaration match both the shipped code and the product intent.
        # Scoped to DOMESTIC single payments only; scheduled, standing-order and every
        # international variant stay out of scope for now.
        in_scope:
          - "AISP read-only account information across all HSBC sandbox AIS resources."
          - "Full FAPI consent journey + consent lifecycle management (dashboard, revoke, 90-day reconfirm)."
          # Reworded 2026-07-30 (/idea-sync): the old claim was "Multi-currency account
          # display (Global Money / Global Wallet)", which implied a dedicated surface that
          # was never built. What ships is list rendering, so the claim now says only that.
          - >-
            Global Money / Global Wallet accounts rendered in the accounts list and account
            detail — no dedicated multi-currency surface and no Global filter chip.
          # ── PISP SCOPE WIDENED 2026-08-06 (/idea-sync — PISP-tests research) ──
          # Was "domestic single payment only". The pisp-tests capture corpus exercised all
          # seven HSBC UK Personal payment types end to end against the live sandbox, so the
          # declaration now matches what has been proven to work rather than what had been
          # tried. Evidence: captures/PAYMENT-TYPES-RESEARCH.md (the seven-type table),
          # captures/by-type/*.md (289 classified scenarios) and the 20 authorised
          # flow-*.md end-to-end runs.
          - >-
            PISP consumer-initiated payments across ALL SEVEN HSBC UK Personal payment types —
            domestic single, domestic scheduled, domestic standing order, international single,
            international scheduled, international standing order, and domestic Variable
            Recurring Payments. Reached from a Payments grid hub where each type is a square
            tile opening its own screen.
          - >-
            Consumer payment context on every type. Risk.PaymentContextCode is restricted to
            the consumer values TransferToThirdParty and TransferToSelf; the merchant-checkout
            contexts and the merchant Risk fields are forbidden. This now binds all seven types,
            not just domestic single — HSBC's own Postman bodies use the merchant shape
            (EcommerceMerchantInitiatedPayment, and PispPayee on VRP), so copying them verbatim
            would model the wrong application.
          - >-
            Full status tracking on every type — both the consent-status GET and the
            resource-status GET for all seven families. This is load-bearing rather than
            cosmetic: OBIE exposes NO per-execution status for standing orders or scheduled
            payments, so the resource GET is the only tracking that exists for them.
          - >-
            VRP mandate lifecycle — create the long-lived consent once, pay under it many times
            (POST funds-confirmation then POST /domestic-vrps), and revoke it via DELETE. VRP is
            the only family in the whole standard with a DELETE, and the only one whose consent
            never reaches Consumed.
          - >-
            Event subscription and polling (POST /v4.0/event-subscriptions, POST /v4.0/events)
            for UK.OBIE.Consent-Authorization-Revoked. The only mechanism that surfaces an
            out-of-band revocation — load-bearing for the long-lived VRP mandate, whose consent
            GET returns a bare 400 U011 once revoked and can never report a revoked state.
          - "Detached JWS (x-jws-signature, PS256, b64:false) and x-idempotency-key on every PISP write."
          # Moved back from out_of_scope 2026-08-02 (/idea-sync): the 07-30 pass demoted this
          # because nothing had been built, but it is planned work, not abandoned work. The
          # idea-layer spec (screens/atm-locator/), its exports, mockups, the `atm` API group
          # and the AtmLocation / Branch / BranchRouting / GeoLocation / PostalAddress /
          # LobbyHours / DriveUpHours DTOs are all retained as the input to /implement.
          - >-
            ATM / branch locator via HSBC Open Data. Specified, not yet built —
            AccountDetailChip.AtmLocator ships and navigates, but currently only to
            PlaceholderScreen("ATM locator").
        out_of_scope:
          # 2026-08-06 (/idea-sync): the four PISP exclusions below were deleted — domestic
          # scheduled, domestic standing order, the three international shapes and VRP are all
          # in_scope now. What remains excluded is genuinely excluded.
          - "Merchant-initiated / e-commerce checkout payment contexts — this is a consumer app."
          - "File payments and multi-bill payments — HSBC ships no file-payments folder for this brand."
          - >-
            Amending or cancelling a standing order or a scheduled payment. NOT a UX gap — OBL's
            Customer Experience Guidelines state a PISP cannot do either, and impose a MANDATORY
            obligation on the PISP to tell the PSU to use the bank's own channel. No ASPSP offers
            a proprietary extension, and the regulatory direction is to route mutable recurring
            payments through VRP instead. VRP revocation IS in scope precisely because it is the
            one rail where the standard grants it.
          - "Confirmation of Funds (CBPII) as a standalone capability — funds-confirmation is used only inside the payment flow."
          - "Beneficiary edits — the beneficiaries surface stays read-only."
          - >-
            Commercial VRP (cVRP) under the UK Payments Initiative MLA. Only
            UK.OBIE.VRPType.Sweeping is used; CVRP1 is accepted by HSBC per its Implementation
            Guide but its enumerations sit behind the UKPI MLA and are not in the public OBL
            specification, so they cannot be implemented from public sources.
          # 2026-08-02 (/idea-sync): the field-officer idea-layer was deleted outright —
          # 12 screens, the field-officer flow, 3 fo-* journeys, 7 API groups and 10 DTOs.
          # This is a consumer-only app; there is no fieldOfficer flavour or persona.
          - "Field-officer / agent-banking surfaces (removed — consumer-only app)."
          - "Production TPP enrolment (sandbox only; production hosts are TBD)."
          # Moved from in_scope 2026-07-30 (/idea-sync): declared in scope but never built.
          # 2026-08-02 (/idea-sync): PFM deleted outright — pfm-dashboard, pfm-settings and
          # business-insights screens, exports, mockups and the pfm API group are gone.
          # The client-side primitives (SpendingCalculator, SpendingSnapshot,
          # TransactionCategory) remain unreferenced in source; only the per-transaction
          # category tag under FR-011 stays in scope.
          - >-
            PFM dashboard, spending-by-category, budgets, recurring-subscriptions and
            business-insights screens.
        scope_change_log:
          - at: "2026-07-30"
            by: "/idea-evolve"
            change: "PISP domestic single payment moved out_of_scope -> in_scope"
            drift_closed: "§api_surface.out_of_scope_drift (recorded 2026-07-28)"
            regulatory_note: >-
              PISP is a distinct FCA permission from AISP. Sandbox operation is unaffected;
              production payment initiation would require payment-initiation authorisation
              this project does not hold. Tracked as an ADR, not a blocker.
          - at: "2026-08-02"
            by: "/idea-sync"
            change: >-
              Field-officer and PFM idea-layers deleted; atm-locator moved
              out_of_scope -> in_scope.
            removed:
              features: 15
              detail: >-
                12 field-officer screens (fo-dashboard, customer-search, customer-detail,
                customer-profile, customer-onboarding, corporate-onboarding, kyc-review,
                account-applications, application-detail, customer-messages, meetings,
                agent-registration) plus pfm-dashboard, pfm-settings and business-insights.
                Also removed: flows/field-officer.yaml, 3 fo-* journeys, 7 API groups
                (customers, kyc, account_applications, customer_messages, meetings,
                field_officer, pfm) and 10 orphaned DTOs.
            retained: >-
              atm-locator in full — screen spec, exports, mockups, the `atm` API group and
              its 7 DTOs. It is planned work, and the idea-layer is what /implement builds
              from, so the spec stays.
            rationale: >-
              This is a consumer-only app. The dual-persona (consumer + field officer)
              framing is retired everywhere it appeared; there is no fieldOfficer flavour.
          - at: "2026-08-06"
            by: "/idea-sync — PISP-tests research corpus"
            change: >-
              Payments rewritten from one type to seven. Domestic scheduled, domestic standing
              order, international single, international scheduled, international standing order
              and domestic VRP all moved out_of_scope -> in_scope. A Payments grid hub is added
              as the Pay tab's landing surface. standing-order-edit is deleted outright.
            evidence_base:
              corpus: /home/kalpesh/OpenBankingProject/HSBC_Sandbox/pisp-tests/
              primary: >-
                captures/** — observed API responses against the live HSBC sandbox. Tier 1;
                beats every document. 289 scenarios classified by type in captures/by-type/,
                20 authorised end-to-end runs in captures/flow-*.md.
              analysis: [captures/PAYMENT-TYPES-RESEARCH.md, captures/VRP-RESEARCH.md, captures/OBSERVATIONS.md]
              request_shapes: >-
                sandbox-prod-ob-ukce-postman/…collection.json, UK Personal brand folder —
                HSBC-shipped, authoritative for request shape and journey structure. Silent on
                responses (all 202 items carry `response: []`), which is why the captures rank above it.
              never_cite: >-
                UKPersonal BrandAPI/*.yaml and _downloads/*_SPEC.md are LLM-generated, not
                HSBC documents (confirmed by the repository owner 2026-08-06). vrp-4.0-personal.yaml
                in particular is invention. Where a local yaml and an observed response disagree,
                the observed response wins.
            added:
              features: 8
              detail: >-
                payments (grid hub) plus one feature per type: pay-domestic-single,
                pay-domestic-scheduled, pay-domestic-standing-order, pay-international-single,
                pay-international-scheduled, pay-international-standing-order, pay-vrp-mandate.
            removed:
              detail: >-
                standing-order-edit deleted — PISP amendment of a standing order is prohibited by
                OBL CEG, so the screen specified an action the app is not permitted to perform.
                standing-order-detail gains the mandatory use-your-bank-channel notice in its place.
                The OBP-era send-money-amount / send-money-confirm / payment-result screens are
                superseded by the per-type specs.
            rationale: >-
              The previous scope was drawn when only the domestic single rail had been exercised.
              The research corpus then proved all seven types work against the sandbox and, more
              importantly, established the per-type divergences that make a single generic payment
              form wrong: the amount field differs by rail and the two shapes are mutually
              exclusive (U005 either way), international refuses RemittanceInformation and
              requires ChargeBearer + CurrencyOfTransfer, only the two single-payment rails have
              funds-confirmation, and VRP inverts nearly every assumption. One screen per type is
              the shape the evidence dictates.
          - at: "2026-08-07"
            by: "/idea-sync — develop.hsbc.com Open Data research"
            change: >-
              branch-locator added as a SEPARATE feature (decided by the repository owner), and
              the products catalogue meaning RESTORED after the 2026-08-06 pass wrongly withdrew it.
            added:
              features: 1
              detail: >-
                branch-locator — screens/branch-locator/ with all 7 siblings (api, ui, flow, docs,
                data-flow, demo-data, tests) plus the Branch, BranchAvailability and
                BranchContactInfo DTOs.
            branch_locator_decision:
              decided_by: "repository owner, 2026-08-07"
              choice: "A separate feature, not a second operation or a tab inside atm-locator."
              rationale: >-
                Branches were previously a deferred second operation inside atm-locator against an
                unresolved host. The Branch Locator is a distinct HSBC API product with a
                materially richer payload: opening hours, 11 observed services, 8 customer
                segments, a sort code array, a phone number and real accessibility data, all
                populated 25/25 — where the ATM feed populates NONE of its five optional fields
                across 135 records. Accessibility in particular is 25/25 on branches and 0/135 on
                ATMs, so an accessibility filter is real on one surface and impossible on the
                other. Two capabilities, two screens. They share a host and an auth model (none)
                but not a payload; ATM.Branch carries only { Identification } and joins to
                Branch.Identification at the cost of a second call.
            products_scope_restored:
              what_was_withdrawn: >-
                The 2026-08-06 pass concluded, in capitals, "OBIE HAS NO PRODUCT CATALOGUE", then
                redefined the products screen from "browse what the bank offers" to "the terms of
                my account" and deleted the bank-selection and audience-split logic as purposeless.
              why_it_was_wrong: >-
                It reasoned about OBIE Read/Write — the consented AIS surface — and concluded about
                OBIE ENTIRE. The OBIE **Open Data** standard has a product catalogue, HSBC
                publishes it as the UK Product Finder, and it needs no consent, no token and no
                session. https://develop.hsbc.com/ob-api-overview/api-overview-6
              what_is_restored: >-
                The catalogue meaning of screens/products. Both readings now coexist as distinct
                capabilities: `products` is the public catalogue (Open Data, unauthenticated) and
                `product` is the PSU's own account terms (AIS, ReadProducts consent). They answer
                different questions, live on different hosts and have opposite auth models.
              scope: >-
                All four product families per the repository owner — personal current accounts,
                business current accounts, commercial credit cards and unsecured SME loans. This
                widens the app past its consumer-only framing, and is coherent on its own terms:
                Open Data is a PUBLIC catalogue, not PSU data, so listing business products is a
                browse-and-compare surface rather than a business-banking capability. Nothing in
                it reads or writes anything belonging to the PSU.
              evidence:
                tier_1_live:
                  summary: >-
                    Live responses captured 2026-08-07, all HTTP 200, re-probed and byte-identical
                    the same day: PCA (10 records / 7 distinct products, 2 brands), BCA (14,
                    966 KB), CCC (1), SME loans (1).
                  reproduce: >-
                    Four unauthenticated GETs, each with header
                    `Accept: application/prs.openbanking.opendata.v2.2+json`, against
                    https://api.hsbc.com/open-banking/v2.2/{personal-current-accounts,
                    business-current-accounts, commercial-credit-cards, unsecured-sme-loans}.
                  local_capture: >-
                    /home/kalpesh/OpenBankingProject/HSBC_Sandbox/open-data-specs/{pca-probe,
                    pf-business-current-accounts, pf-commercial-credit-cards,
                    pf-unsecured-sme-loans}.json — OUTSIDE this repository, captured 2026-08-07.
                    Not checked in; use `reproduce` above.
                tier_2_spec:
                  summary: "Product Finder swagger 2.0, info.version 2.2.1."
                  reproduce: "Download from https://develop.hsbc.com/ob-api-documentation/product-finder-uk/endpoints — public, no credential."
                  local_capture: "/home/kalpesh/OpenBankingProject/HSBC_Sandbox/open-data-specs/open-product-finder-swagger.json — OUTSIDE this repository, captured 2026-08-07. Not checked in; use `reproduce` above."
            corrections_made_the_same_day:
              note: >-
                Recorded here because they reverse claims this log's 2026-08-06 entry and
                screens/products/api.yaml still carry. Full detail in the four product DTOs.
              items:
                - >-
                  The SME loan family is NOT empty. Its wire key is `SMELoan`, not `SMELending` —
                  the swagger DEFINITION is named SMELendingDefinition but declares the property
                  SMELoan. Reading the definition name as the wire key returned nothing, and
                  "nothing" was recorded as "the catalogue is empty". HSBC publishes one
                  unsecured SME loan (Small Business Loan, £1,000-£25,000).
                - >-
                  meta.TotalResults counts PRODUCT RECORDS, not brand blocks. Proved by probe: an
                  unmatched segment returns TotalResults 0, and the two-brand PCA feed returns 10.
                  The "counts brand blocks" reading was inferred solely from the mis-parsed SME
                  response.
                - >-
                  OnSaleIndicator IS observed false — on 9 of 14 business current accounts and on
                  the BCA brand block. It is not "never observed, so untested". It is also absent
                  entirely from the CCC and SMELoan schemas, so a shared `filter { it.onSale }`
                  drops those two families.
                - >-
                  An unrecognised segment returns HTTP 200 with `data: []`, not 400, and carries
                  meta.LastUpdated "1970-01-01T00:00:00.000Z" — a second sentinel alongside the
                  2099-12-31 indefinite-date one.
            rationale: >-
              Both halves of this entry are the same correction discipline applied twice: a
              capability was declared absent on the strength of a reading rather than a call.
              Branches were deferred against an "unresolved host" that a published HSBC swagger
              names outright; the product catalogue was declared not to exist on the strength of a
              different OBIE surface. In both cases the live API settled it.
          - at: "2026-08-07"
            by: "repository owner"
            change: >-
              cards and card-detail DELETED outright. Not deferred, not demoted to `could`, not
              folded into accounts — removed, with their screens, exports, mockups, approvals and
              flow edges. Screen roster 44 -> 42.
            removed:
              features: 2
              detail: >-
                screens/cards/ and screens/card-detail/ (40 files), exports/cards/ and
                exports/card-detail/ (8 files), mockups/cards/ and mockups/card-detail/
                (43 files), the two app-flow approve stubs, both rows in screens/_list.json,
                both IDEA_MATRIX rows, both EXPORT_MATRIX output rows, the four
                consumer-banking nav edges (home->cards, cards->card-detail,
                cards->transaction-detail, card-detail->transactions) and the first two steps of
                the consumer-cards-financing journey.
            rationale: >-
              OBIE has NO card resource. A card is an Account whose Account[].SchemeName is
              UK.OBIE.PAN — there is no card entity to model, no card endpoint to call and no
              card write of any kind. This is the same finding that deleted the Card and
              CardAccountRef DTOs on 2026-08-06; those two duplicated Account.yaml while
              describing OBP fields that do not exist.
            why_the_2026_08_06_reprieve_is_overruled: >-
              On 2026-08-06 the DTOs went but the screens were kept, on the argument that
              filtering the accounts list down to PAN entries is a legitimate presentation
              surface. That argument is now overruled by the repository owner: the feature
              originated in the OLD OBP PLANNING and goes with it. The reprieve also did not
              survive contact with the specs it spared — screens/card-detail/ui.yaml still
              shipped a freeze/unfreeze toggle (~line 228) and Spending Limits sections
              (~lines 263-282) while carrying, twenty lines below the toggle, its own comment
              that "OBIE HAS NO CARD WRITE OF ANY KIND". The screen's central interactions were
              impossible against this API by its own admission, and CAPABILITY_GAPS carried the
              contradiction as the open CARD-WRITE-UNBACKED finding.
            what_is_NOT_affected:
              - >-
                dtos/CccProduct.yaml — commercial credit cards from the Open Data Product
                Finder. A different resource on a different host with no auth, part of the live
                products catalogue restored earlier the same day. Untouched.
              - >-
                The UK.OBIE.PAN references under FR-018 payments (the credit card refused as a
                debtor on every rail). Those are about payment eligibility, not about these
                screens.
              - >-
                statements — still credit-card-only (400 on every other account). The account
                that happens to be a card is unaffected; only the card SCREENS are gone.
      constraints:
        technical:
          - "Mutual TLS (mTLS) with HSBC-issued sandbox certs — platform-specific TLS config (expect/actual)."
          - "FAPI 1.0 Advanced: signed request object, PKCE S256, private_key_jwt client auth, app-to-app redirect."
          - "Read-only — AIS GETs require no detached x-jws-signature."
        business:
          - "Credentials never hardcoded (RULE-CREDS-LIFECYCLE-001); env-var / gitignored materials only."
          - "GDPR / consent transparency per OBIE Customer Experience Guidelines."
        assumptions:
          - "Developer has HSBC sandbox certs + client_id + SSA at /home/kalpesh/OpenBankingProject/HSBC_Sandbox/."
          - "Target brand: HSBC UK Personal, OBIE v4.0."
      known_limitations:
        - description: "Sandbox account subtypes limited to CurrentAccount, Savings, CreditCard, Global Money, Global Wallet (no loans/FD)."
          planned_version: null

  personas:
    _tag: "§personas"
    _status: draft
    _quality_score: 78
    _source: wizard
    content:
      personas:
        - name: Priya
          role: Retail bank customer (PSU)
          jobs_to_be_done:
            - "See all my balances and recent transactions in one place."
            - "Understand and control exactly what data I'm sharing, and revoke it anytime."
          pain_points:
            - "Juggling multiple banking apps."
            - "Not knowing what a third party can see."
          goals:
            - "A clear, trustworthy view of my money."
            - "Confidence that sharing is secure and reversible."
        - name: Sam
          role: Open Banking developer / reviewer
          jobs_to_be_done:
            - "Evaluate a complete, standards-strict AISP implementation against the HSBC sandbox."
            - "See the full FAPI consent journey and every AIS resource working end to end."
          pain_points:
            - "Most demos cover only accounts + balances."
            - "FAPI security details (mTLS, JWS, PKCE) are hard to get right."
          goals:
            - "A reference that proves the full UK Open Banking AISP surface."

  requirements:
    _tag: "§requirements"
    _status: draft
    _quality_score: 75
    _source: wizard
    content:
      functional_requirements:
        - id: FR-001
          description: "Perform Dynamic Client Registration (DCR) once per brand using the signed SSA to obtain client credentials."
          priority: must
          acceptance_criteria: ["POST /register with PS256-signed JWS returns a client_id stored securely."]
        - id: FR-002
          description: "Run the FAPI consent journey: client_credentials token → create account-access-consent → app-to-app authorize (auth code + PKCE + signed request object) → token exchange."
          priority: must
          acceptance_criteria: ["Consent reaches Authorised; PSU-bound access token + refresh token obtained against the HSBC sandbox."]
        - id: FR-003
          description: "List authorised accounts and show account detail."
          priority: must
          acceptance_criteria: ["GET /accounts and GET /accounts/{id} render real sandbox data."]
        - id: FR-004
          description: "Show balances per account."
          priority: must
        - id: FR-005
          description: "Show transactions with date and credit/debit filtering, plus transaction detail."
          priority: must
        - id: FR-006
          description: "Show beneficiaries, standing orders, direct debits, scheduled payments (read-only)."
          priority: should
        - id: FR-007
          description: "Show statements (list + detail) and account product information and party (account holder) details."
          priority: should
        - id: FR-008
          description: "Provide a consent dashboard: active consents, granted permissions, expiry, revoke, and 90-day reconfirmation."
          priority: must
          acceptance_criteria: ["DELETE /account-access-consents/{id} revokes; reconfirm re-runs authorize before 90 days."]
        # ── FR-009 + FR-010 REMOVED 2026-07-30 (/idea-sync stale reconciliation) ──
        # Both were orphaned: no features[] entry referenced either, because the
        # multi-currency and atm-locator features were deleted in the 2026-07-28
        # reverse sync while their requirements were left behind.
        #
        #   FR-009 "Display multi-currency accounts (Global Money / Global Wallet)."
        #     Removed as a REQUIREMENT, not as behaviour. There is no dedicated
        #     multi-currency surface and AccountFilter deliberately offers no Global
        #     chip (a Global Money wallet reports CACC, indistinguishable from a
        #     current account, so the chip could never match). Global Money and Global
        #     Wallet accounts DO render in the accounts list under Current, and
        #     AccountUiType still carries GLOBAL_MONEY / GLOBAL_WALLET — that behaviour
        #     stays documented in screens/accounts and screens/home.
        #
        #   FR-010 "ATM locator via HSBC Open Data (unauthenticated)."
        #     No screen, no repository, no Aisp call. AccountDetailChip.AtmLocator
        #     ships and navigates, but only to PlaceholderScreen("ATM locator"); that
        #     chip stays documented in screens/account-detail as an explicit
        #     placeholder binding.
        - id: FR-011
          description: "Client-side personal finance management derived from AIS transactions: categorization, spending-by-category, monthly budgets, recurring/subscription detection, income-vs-expense, and net worth. No payment initiation; no additional API."
          priority: should
          acceptance_criteria: ["Transactions are categorized and summarized in-app; budgets track against category spend; recurring payments are detected from transaction patterns."]
          retained_because: >-
            NOT orphaned — the transactions feature still claims it, and the client-side
            primitives genuinely ship: SpendingCalculator.computeSpendingSnapshot,
            SpendingSnapshot and the 7-value TransactionCategory enum all exist in
            core/data. Only the four PFM SCREENS were removed. Scoped down accordingly:
            the dashboard, budgets and drill-down surfaces are out of scope; the
            per-transaction category tag is not.
        # ── PISP requirements added 2026-07-30 (/idea-evolve scope reversal) ──
        # ── Generalised from one type to seven 2026-08-06 (/idea-sync, PISP-tests research) ──
        - id: FR-012
          description: >-
            Initiate a consumer payment on any of the seven HSBC UK Personal payment types. In
            every type the PSU selects one of their own authorised accounts as debtor, a creditor,
            an amount, and whatever timing dimension that type carries (none / one execution date /
            a recurrence mandate / VRP control parameters), reviews, and confirms.
          priority: must
          acceptance_criteria:
            - "POST {family}-consents returns 201 with Status AWAU on all seven families."
            - "POST {family} returns 201 with the family's resource id after authorisation."
            - "Amount is validated against the selected account's available balance before the review step."
            - "The debtor picker offers only accounts eligible for the chosen type (see FR-018)."
        - id: FR-012a
          description: >-
            Present the seven payment types as a grid of square tiles on a Payments hub screen,
            each tile opening that type's own screen. The hub is the Pay bottom-nav tab's landing
            destination, replacing the SendMoneyRoute placeholder.
          priority: must
          acceptance_criteria:
            - "Seven tiles render, each navigating to a distinct route."
            - "No tile resolves to a PlaceholderScreen."
        - id: FR-013
          description: >-
            Complete the PISP app-to-app authorisation round trip on scope=payments: validate
            the redirect state and nonce, exchange the code for a PSU access token, and poll
            the payment consent until it reaches Authorised.
          priority: must
          acceptance_criteria:
            - "A state or nonce mismatch is rejected before any token exchange is attempted."
            - "The payments-scope token is never persisted into ConsentSession — the AIS session token is untouched."
            - "Submit is gated on the consent reaching Authorised, since a non-Authorised consent returns 400 U009."
        - id: FR-014
          description: >-
            Track a submitted payment to settlement via GET /domestic-payments/{PaymentId},
            mapping OBIE status onto the four-value disposition vocabulary: in-progress /
            terminal-success / terminal-failure / instruction-established.
          priority: must
          acceptance_criteria:
            - "AcceptedSettlementInProcess renders as in progress and is never described as sent or complete."
            - "Polling stops on a terminal disposition and never starts on one."
            - >-
              The shared mapper carries all four dispositions, including INCO to
              instruction-established. This rail never emits INCO, but the mapper is the same one
              the deferred rails use and it must not be built as a three-way.
            - >-
              Fail-open is a SAFETY NET for codes nobody anticipated, not a substitute for mapping
              a status that is in the enum. Every value in ObStatusCode maps explicitly; an
              unrecognised status fails open to in progress rather than being guessed as success
              or failure.
        - id: FR-015
          description: >-
            Restrict every payment this app initiates to a consumer payment context.
            Risk.PaymentContextCode must be TransferToThirdParty or TransferToSelf; the
            merchant fields MerchantCategoryCode, MerchantCustomerIdentification and
            DeliveryAddress must never be sent.
          priority: must
          rationale: >-
            OBInternalPaymentContext1Code offers six contexts, four of which describe a
            merchant collecting from a customer. HSBC's own Postman examples use the merchant
            shape, so copying them verbatim — the obvious thing to do — would model the wrong
            application.
          acceptance_criteria:
            - "Every staged consent and submitted payment carries a consumer PaymentContextCode."
            - "No request body contains any of the three merchant Risk fields."
        - id: FR-016
          description: >-
            Sign every PISP write with a detached JWS in the x-jws-signature header (PS256,
            b64:false plus the crit claims), extending the existing signPs256 primitive.
          priority: must
          acceptance_criteria:
            - "POST /domestic-payment-consents and POST /domestic-payments both carry x-jws-signature."
            - "Absence of the header is verified to produce 400 U019, and that error is surfaced as non-recoverable with a support reference rather than a Retry."
        - id: FR-017
          description: >-
            Attach an x-idempotency-key (max 40 characters) to every PISP write, generated
            once per staged payment and reused across the consent stage, the submit, and every
            retry of either.
          priority: must
          acceptance_criteria:
            - "A retry after a network failure reuses the original key and creates no second payment."
            - "The same key is used for the consent stage and the subsequent submit."

        # ── Added 2026-08-06 (/idea-sync, PISP-tests research corpus) ─────────
        # Every acceptance criterion below is an OBSERVED sandbox result, not a documented
        # rule. Where HSBC's Implementation Guide and the observation disagree the observation
        # is what is encoded here, and the divergence is named in the rationale.
        - id: FR-018
          description: >-
            Offer only eligible debtor accounts per payment type. Eligibility is enforced by the
            DEBTOR SCHEME, not the account product: a UK.OBIE.SortCodeAccountNumber account is
            payable, a UK.OBIE.PAN account (the credit card) is not, and Global Money may not be
            named by the TPP at all except on the international same-account conversion.
          priority: must
          rationale: >-
            HSBC's Guide §17.5.1 states a product-based matrix (SO not on savings, VRP PCA-only).
            Observation contradicts it in both directions: savings authorised and settled two VRP
            payments, and Global Money funded a VRP when the bank nominated it. The rule that
            actually fires is the scheme gate, stated in prose only on the VRP endpoint —
            U021 "the Debtor Identification is not a UK.OBIE.SortCodeAccountNumber account".
            The card is refused on every rail and by both routes.
          acceptance_criteria:
            - "The credit card is never offered as debtor on any of the seven types."
            - "Global Money is offered only where the observed evidence supports it, never as a TPP-named domestic debtor."
            - "Choosing an ineligible account is impossible in the UI rather than surfaced as a 400 after submit."
        - id: FR-019
          description: >-
            Apply the correct per-rail field contract. Domestic standing orders send
            FirstPaymentAmount (plus optional Recurring/Final); international standing orders send
            InstructedAmount plus mandatory CurrencyOfTransfer and ChargeBearer. International
            shapes must never send RemittanceInformation. Domestic creditors are
            SortCodeAccountNumber; international creditors are IBAN.
          priority: must
          rationale: >-
            The two amount shapes are mutually exclusive and each rail refuses the other's field
            outright with U005 — proven in round 15 by crossing them deliberately, in both
            directions and with both present. RemittanceInformation returns U005 on every
            international shape. A sort-code creditor returns U027 on international in every
            form tried; an IBAN creditor returns U027 on domestic.
          acceptance_criteria:
            - "No international request body contains RemittanceInformation."
            - "No domestic standing order sends InstructedAmount, and no international standing order sends FirstPaymentAmount."
            - "ChargeBearer is present on all three international shapes — omitting it returns U004."
        - id: FR-020
          description: >-
            Constrain recurrence and dates to the observed limits. Frequency offers exactly the
            five accepted values WEEK, FRTN, MNTH, QURT and YEAR. A scheduled execution date must
            be strictly after today and no more than 365 days ahead. A standing order's final
            payment date must be after the first and within 12 months.
          priority: must
          rationale: >-
            All nine OBIE OBFrequency6Code values were tested on the domestic rail; exactly five
            are accepted and ADHO, INDA, MIAN and DAIL return U002. The date ceiling was measured
            precisely — T+365 accepted, T+366 refused, T+0 refused as in the past — identically on
            both rails. The 12-month mandate horizon came from the most descriptive error HSBC
            produced anywhere in the testing (U003 on FinalPaymentDateTime).
          acceptance_criteria:
            - "The frequency picker offers five values and no others."
            - "The date picker cannot select today, a past date, or a date beyond T+365."
            - "A final payment date at or before the first payment date is rejected in-app before submit."
        - id: FR-021
          description: >-
            Track every payment through both its consent-status GET and its resource-status GET,
            on all seven families, mapping the four observed status ladders onto the four-value
            disposition vocabulary: in-progress / terminal-success / terminal-failure /
            instruction-established.
          priority: must
          rationale: >-
            OBIE exposes no per-execution status for standing orders or scheduled payments — the
            resource status describes the mandate's setup, not the Nth payment — so these GETs are
            the only tracking that exists. A TPP cannot learn that execution #3 failed by any API
            means.
          acceptance_criteria:
            - "Single payments map ACSP then ACCC; domestic deferred map PDNG then INCO; international deferred map INCO throughout; VRP payments map ACSP then ACCC."
            - "The status mapper accepts BOTH the v4.0 short codes and the v3.1 long forms — domestic-vrps returns AcceptedCreditSettlementCompleted where every other endpoint returns ACCC."
            - "Authorisation is detected from the Status field alone; StatusUpdateDateTime is never used, because it does not move on AWAU to AUTH."
            - >-
              INCO maps to instruction-established, the fourth disposition — never to
              terminal-success (which would tick a payment that has not happened) and never via
              fail-open to in-progress (which would render a dormant standing order as live).
            - >-
              Fail-open is a SAFETY NET for codes nobody anticipated, not a substitute for mapping
              a status that is in the enum — INCO was in the enum and still fell through because
              the vocabulary had nowhere to put it. Every value in ObStatusCode maps explicitly;
              an unrecognised status fails open to in progress rather than being guessed as
              success or failure.
            - >-
              The UI never claims a standing order or scheduled payment has 'paid' — only that the
              instruction is set up. The instruction-established label names the INSTRUCTION
              ('Standing order set up'), and its treatment is hue-less (surfaceVariant /
              onSurfaceVariant, icon event_repeat), never a success tick and never a clock.
        - id: FR-022
          description: >-
            Create a VRP mandate once and reuse it. The consent carries ControlParameters
            (MaximumIndividualAmount and at least one PeriodicLimit, GBP only), requires
            SortCodeAccountNumber on both sides, and accepts only
            PSUAuthenticationMethods UK.OBIE.SCANotRequired. Each subsequent payment does a POST
            funds-confirmation with an explicit amount on the PSU token, then POST /domestic-vrps.
          priority: must
          rationale: >-
            The defining VRP property, observed on three runs: two payments per run on a single
            authorisation with no PSU re-authentication, and the consent remains AUTH afterwards.
            Every other family moves its consent to COND on first use. ControlParameters,
            PeriodicLimits and MaximumIndividualAmount are all mandatory (U004 each). UK.OBIE.SCA
            returns U002 — HSBC's enum contains only SCANotRequired. Non-GBP returns U023.
          acceptance_criteria:
            - "The mandate is created once; paying under it triggers no re-authorisation."
            - "Funds-confirmation uses the PSU authorisation-code token — a client-credentials token returns 401."
            - "A payment above MaximumIndividualAmount is refused with U014 and surfaced as a limit breach."
            - "The first period's pro-rated limit is stated at creation, not the headline figure."
            - "If a reference is fixed at consent time the UI states it cannot be changed without a new mandate."
        - id: FR-023
          description: >-
            Revoke a VRP mandate via DELETE, and treat the resulting 400 U011 on any later consent
            GET as 'you revoked this' rather than an error. The app persists its own revoked
            record because the API can no longer report one.
          priority: must
          rationale: >-
            DELETE returns 204 with an empty body and a subsequent GET returns 400 U011
            "Resource cannot be found" — OBIE mandates exactly this. VRP is the only family with a
            DELETE, because PSD2 Article 80 forbids revoking an authorised payment order while the
            VRP profile grants revocation at any point in time.
          acceptance_criteria:
            - "DELETE returns 204 and the mandate moves to a locally-recorded revoked state."
            - "A later consent GET returning U011 renders as revoked, never as a generic failure."
            - "Payments already made under the revoked mandate still read back correctly."
        - id: FR-024
          description: >-
            Subscribe to and poll OBIE events for UK.OBIE.Consent-Authorization-Revoked so an
            out-of-band revocation is surfaced, and detect the VRP trusted-beneficiary failure
            mode where the consent stays Authorised while payments silently fail.
          priority: should
          rationale: >-
            A long-lived VRP consent can be revoked by the PSU in the HSBC app, after which the
            consent GET only ever 400s — event polling is the sole way to learn this happened.
            Separately, HSBC documents that VRPs are rejected at fulfilment if the PSU deletes the
            payee from their beneficiary list; the consent remains AUTH and payments fail with
            StatusReason UK.OBIE.ExemptionNotApplied. Neither condition is observable from the
            consent status alone.
          acceptance_criteria:
            - "A revoked-elsewhere mandate is reflected in the app without the PSU having to open it."
            - "A mandate whose payments are failing with ExemptionNotApplied renders as authorised-but-failing, not as healthy."
      third_party_services:
        - name: HSBC UK Open Banking sandbox
          purpose: "Account & Transaction (AIS) API — the data source."
          integration_type: api
        - name: Firebase
          purpose: "Crash + performance observability only."
          integration_type: sdk

  features:
    _tag: "§features"
    _status: draft
    _quality_score: 82
    _source: wizard
    content:
      features:
        - name: consent-onboarding
          priority: must
          description: "User onboarding → OAuth login with HSBC. The app stages an account-access-consent (Permissions array); the PSU authenticates, approves the permission set and selects accounts on HSBC's portal; callback → token. No in-app bank picker (HSBC only) and no in-app permission toggles (approval is on the bank)."
          acceptance_criteria: ["Consent created with explicit permission list; PSU authenticates + approves on HSBC; token obtained on accept; rejection yields no token and surfaces a clear retry."]
          requirement_refs: [FR-001, FR-002]
        - name: consent-dashboard
          priority: must
          description: "Active consents, granted permissions, expiry, revoke, and 90-day reconfirmation."
          acceptance_criteria: ["Revoke calls DELETE consent; reconfirm re-runs authorize."]
          requirement_refs: [FR-008]
        - name: home
          priority: must
          description: "Home landing tab (bottom-nav order 0) showing the currently selected account — hero balance card, quick actions (Transactions, Statements, Manage consents), recent transactions, and a spending snapshot. An account switcher changes the selected account, which drives the whole screen. Aggregates AIS accounts/balances/transactions client-side; no new endpoint. Consents are surfaced here (and in Settings) since they were removed from the bottom-nav rail."
          requirement_refs: [FR-003, FR-004, FR-005]
          dependencies: [accounts, balances, transactions]
        - name: accounts
          priority: must
          description: "List of authorised accounts + account detail."
          requirement_refs: [FR-003]
        - name: balances
          priority: must
          description: "Current/available balances per account."
          requirement_refs: [FR-004]
          dependencies: [accounts]
        - name: transactions
          priority: must
          description: "Transaction history with date + credit/debit filters, search, and per-transaction detail; transactions carry a category tag (auto-categorized) that feeds the PFM feature."
          requirement_refs: [FR-005, FR-011]
          dependencies: [accounts]
        - name: beneficiaries
          priority: should
          description: "Saved payees (read-only)."
          requirement_refs: [FR-006]
          dependencies: [accounts]
        - name: standing-orders
          priority: should
          description: >-
            Recurring outbound orders (read-only). Read-only is now a REGULATORY position rather
            than a scoping convenience: OBL's Customer Experience Guidelines state a PISP cannot
            amend or cancel a standing order and must tell the PSU to use the bank's own channel.
            The standing-order-edit screen was deleted 2026-08-06 for that reason, and
            standing-order-detail carries the mandatory notice in its place. Creating a NEW
            standing order is a separate, permitted action and lives in pay-domestic-standing-order.
          requirement_refs: [FR-006]
          dependencies: [accounts]
          amendment_policy:
            permitted: false
            basis: "OBL Customer Experience Guidelines — mandatory PISP obligation to redirect the PSU"
            notice_required: true
            alternative: "VRP is the rail the regulator points at for mutable recurring payments — see pay-vrp-mandate."
        - name: direct-debits
          priority: should
          description: "Direct-debit mandates (read-only)."
          requirement_refs: [FR-006]
          dependencies: [accounts]
        - name: scheduled-payments
          priority: should
          description: "Future-dated one-off payments (read-only)."
          requirement_refs: [FR-006]
          dependencies: [accounts]
        - name: statements
          priority: should
          description: "Statement list + statement detail."
          requirement_refs: [FR-007]
          dependencies: [accounts]
        - name: product
          priority: could
          description: "Account product terms (fees/rates) for BCA/PCA accounts."
          requirement_refs: [FR-007]
          dependencies: [accounts]
        - name: account-holder
          priority: could
          description: "Account holder / PSU party details. Renamed from `party` 2026-07-28 to match the shipped module feature/account-holder."
          requirement_refs: [FR-007]
          dependencies: [accounts]
        - name: settings
          priority: should
          description: "App settings: appearance (theme dropdown), a Manage Consents shortcut, and About & Legal (privacy policy in a browser, in-app open-source licences, static app version). Reverse-synced 2026-07-28 — biometric app-lock, session timeout and notification preferences were specified but never built."
          dependencies: [consent-dashboard]
        - name: licences
          priority: should
          description: "Open-source licence readout — a pushed, arg-less screen inside the settings module rendering the bundled MPL text. Source-originated; added to the plan 2026-07-28 because it ships but was never specified."
          dependencies: [settings]

        # ── PISP features added 2026-07-30 (/idea-evolve scope reversal) ─────
        # ── Rewritten to seven types 2026-08-06 (/idea-sync, PISP-tests research) ──
        # The single `send-money` feature is replaced by a hub plus one feature per payment
        # type. One-feature-per-type is the shape the evidence dictates, not a stylistic
        # choice: the seven families diverge in endpoint, mandatory fields, amount field name,
        # creditor scheme, funds-confirmation verb (or its absence) and status ladder. A single
        # parameterised form would have to describe seven mutually-contradictory wire contracts
        # — two of which refuse each other's amount field outright with U005.
        - name: payments
          id: payments
          priority: must
          status: scaffold
          scaffolded_at: "2026-08-06T00:00:00Z"
          category: payment-initiation
          description: >-
            Payments hub — the Pay bottom-nav tab's landing screen. A grid of seven square tiles,
            one per HSBC UK Personal payment type, each opening that type's own screen. Replaces
            the SendMoneyRoute -> PlaceholderScreen("Pay") placeholder. Pure navigation: it makes
            no network calls of its own.
          acceptance_criteria:
            - "Seven tiles render in a grid, each navigating to a distinct type route."
            - "No tile resolves to a PlaceholderScreen."
            - "The hub itself issues no PISP call."
          requirement_refs: [FR-012a]
          dependencies: []

        - name: pay-domestic-single
          id: pay-domestic-single
          priority: must
          status: scaffold
          scaffolded_at: "2026-08-06T00:00:00Z"
          category: payment-initiation
          description: >-
            Domestic single payment — pay a person now. domestic-payment-consents ->
            domestic-payments. One of only two families with a funds-confirmation step (a GET,
            because a PISP consent carries one fixed amount). Charges 0.05 GBP at staging.
            Consent goes COND on first use.
          acceptance_criteria:
            - "Stages with a consumer PaymentContextCode, a detached JWS and an idempotency key."
            - "Funds-confirmation runs before submit and blocks on FundsAvailable false."
            - "Status maps ACSP then ACCC; an in-progress payment is never described as sent."
          requirement_refs: [FR-012, FR-015, FR-016, FR-017, FR-018, FR-021]
          dependencies: [accounts, beneficiaries, payment-consent, payment-status]

        - name: pay-domestic-scheduled
          id: pay-domestic-scheduled
          priority: must
          status: scaffold
          scaffolded_at: "2026-08-06T00:00:00Z"
          category: payment-initiation
          description: >-
            Domestic scheduled payment — pay a person on one future date.
            domestic-scheduled-payment-consents -> domestic-scheduled-payments. Data.Permission
            "Create" is mandatory. RequestedExecutionDateTime is mandatory, must be strictly after
            today and within 365 days, and is normalised to midnight. No funds-confirmation —
            today's balance says nothing about execution day. RemittanceInformation is accepted on
            this rail. Cannot be amended or cancelled through a PISP.
          acceptance_criteria:
            - "The date picker cannot select today, the past, or beyond T+365."
            - "Data.Permission Create is always sent — omitting it returns U004."
            - "Status maps PDNG then INCO, and the UI says the payment is scheduled, never that it has paid."
            - "The screen states that changing or cancelling it must be done in the bank's own channel."
          requirement_refs: [FR-012, FR-015, FR-016, FR-017, FR-018, FR-020, FR-021]
          dependencies: [accounts, beneficiaries, payment-consent, payment-status]

        - name: pay-domestic-standing-order
          id: pay-domestic-standing-order
          priority: must
          status: scaffold
          scaffolded_at: "2026-08-06T00:00:00Z"
          category: payment-initiation
          description: >-
            Domestic standing order — a recurring mandate. domestic-standing-order-consents ->
            domestic-standing-orders. Uses FirstPaymentAmount, NOT InstructedAmount. Carries
            MandateRelatedInformation with a five-value frequency, a first payment date and an
            optional final date within 12 months. Drops DebtorAccount, RemittanceInformation and
            the transactional identity fields; Risk is empty. Cannot be amended or cancelled
            through a PISP.
          acceptance_criteria:
            - "FirstPaymentAmount is sent and InstructedAmount is never sent — the rail refuses it with U005."
            - "Frequency offers exactly WEEK, FRTN, MNTH, QURT, YEAR."
            - "A final date at or before the first date, or beyond 12 months, is rejected in-app."
            - "The screen states that changing or cancelling it must be done in the bank's own channel."
          requirement_refs: [FR-012, FR-015, FR-016, FR-017, FR-018, FR-019, FR-020, FR-021]
          # No `accounts` — DebtorAccount is not in the standing-order schema, so this rail has
          # no funding-account step. The source account is chosen by the PSU at the bank.
          dependencies: [beneficiaries, payment-consent, payment-status]

        - name: pay-international-single
          id: pay-international-single
          priority: must
          status: scaffold
          scaffolded_at: "2026-08-06T00:00:00Z"
          category: payment-initiation
          description: >-
            International single payment — pay an overseas account now.
            international-payment-consents -> international-payments. Creditor is an IBAN;
            a sort-code creditor returns U027. CurrencyOfTransfer and ChargeBearer are mandatory,
            RemittanceInformation is refused with U005. Has funds-confirmation. The only shape in
            the whole surface that returns NO charge at any stage, through to ACCC.
          acceptance_criteria:
            - "CreditorAccount uses UK.OBIE.IBAN and CreditorAgent, when sent, is an 11-character BIC."
            - "ChargeBearer and CurrencyOfTransfer are always present; RemittanceInformation never is."
            - "The instructed currency and the transfer currency may differ."
          requirement_refs: [FR-012, FR-015, FR-016, FR-017, FR-018, FR-019, FR-021]
          dependencies: [accounts, payment-consent, payment-status]

        - name: pay-international-scheduled
          id: pay-international-scheduled
          priority: must
          status: scaffold
          scaffolded_at: "2026-08-06T00:00:00Z"
          category: payment-initiation
          description: >-
            International scheduled payment — pay an overseas account on one future date.
            international-scheduled-payment-consents -> international-scheduled-payments. Combines
            the international field contract with the scheduled date contract. No
            funds-confirmation. Never emits PDNG — it goes AWAU, AUTH, then INCO directly.
            Charges nothing until resource creation, then 0.50 in the instructed currency.
          acceptance_criteria:
            - "Data.Permission Create, ChargeBearer and CurrencyOfTransfer are all present."
            - "RemittanceInformation is never sent."
            - "Status maps INCO throughout — the PDNG state is never expected on this rail."
          requirement_refs: [FR-012, FR-015, FR-016, FR-017, FR-018, FR-019, FR-020, FR-021]
          dependencies: [accounts, payment-consent, payment-status]

        - name: pay-international-standing-order
          id: pay-international-standing-order
          priority: must
          status: scaffold
          scaffolded_at: "2026-08-06T00:00:00Z"
          category: payment-initiation
          description: >-
            International standing order — a recurring overseas mandate.
            international-standing-order-consents -> international-standing-orders. Uses
            InstructedAmount, NOT FirstPaymentAmount — the one field-level divergence from the
            domestic mandate. CurrencyOfTransfer and ChargeBearer mandatory. Cannot be amended or
            cancelled through a PISP.
          acceptance_criteria:
            - "InstructedAmount is sent and FirstPaymentAmount is never sent — the rail refuses it with U005."
            - "The screen does not promise a fixed exchange rate; OBIE has no per-execution FX model."
            - "The screen states that changing or cancelling it must be done in the bank's own channel."
          requirement_refs: [FR-012, FR-015, FR-016, FR-017, FR-018, FR-019, FR-020, FR-021]
          # The leanest dependency set of any payment feature. No `accounts` — DebtorAccount is
          # not in the standing-order schema, so there is no funding-account step. No
          # `beneficiaries` — saved payees are sort-code addressed and this rail refuses them
          # with U027. No `fx-rates` — OBIE has no FX endpoint and this screen promises no rate.
          dependencies: [payment-consent, payment-status]

        - name: pay-vrp-mandate
          id: pay-vrp-mandate
          priority: must
          status: scaffold
          scaffolded_at: "2026-08-06T00:00:00Z"
          category: payment-initiation
          description: >-
            Variable Recurring Payments — the only mutable recurring rail. Three surfaces in one
            feature: create the long-lived mandate once (ControlParameters, GBP only,
            SortCodeAccountNumber both sides), pay under it repeatedly with no re-authentication
            (POST funds-confirmation on the PSU token, then POST /domestic-vrps), and revoke it
            with DELETE. The consent never reaches COND. Revocation leaves the consent GET
            returning 400 U011 forever, so the app keeps its own record.
          acceptance_criteria:
            - "One authorisation funds many payments; the consent stays AUTH throughout."
            - "Funds-confirmation is a POST carrying an explicit amount, on the PSU token."
            - "A breach of MaximumIndividualAmount surfaces as a limit breach from U014."
            - "DELETE revokes, and a later U011 renders as revoked rather than as an error."
            - "An authorised-but-failing mandate (ExemptionNotApplied) is distinguishable from a healthy one."
          requirement_refs: [FR-012, FR-015, FR-016, FR-017, FR-018, FR-021, FR-022, FR-023, FR-024]
          dependencies: [accounts, beneficiaries, payment-consent, payment-status]

        - name: payment-consent
          id: payment-consent
          priority: must
          status: scaffold
          scaffolded_at: "2026-07-30T00:00:00Z"
          category: payment-initiation
          description: >-
            Return leg of the PISP app-to-app authorisation on scope=payments — the analogue of
            the shipped consent-callback, but for a payment consent. Shared by all seven payment
            types (generalised from domestic-single-only 2026-08-06): validates state and nonce,
            exchanges the code, and polls the family's consent-status GET to AUTH before handing
            back to the originating type screen. Deliberately does NOT persist its token into
            ConsentSession, which holds the AIS data-sharing session.
          acceptance_criteria:
            - "State or nonce mismatch is rejected before the single-use authorisation code is spent."
            - "ConsentSession is never written to."
            - "Return to the type screen is gated on the consent reaching AUTH."
            - "Authorisation is detected from the Status field alone — StatusUpdateDateTime does not move on AWAU to AUTH."
            - "The consent-status GET is dispatched to the correct family endpoint for the type that initiated it."
          requirement_refs: [FR-013, FR-021]
          dependencies: [payments]

        - name: payment-status
          id: payment-status
          priority: must
          status: scaffold
          scaffolded_at: "2026-07-30T00:00:00Z"
          category: payment-initiation
          description: >-
            Settlement tracking for a submitted payment, shared by all seven types (generalised
            from domestic-single-only 2026-08-06). Exists because a successful submit returns
            AcceptedSettlementInProcess, not a completed settlement — without it the PSU is told
            "sent" with no way to learn whether the money actually moved. Reads both the
            consent-status GET and the resource-status GET, maps the four observed status ladders
            onto a FOUR-value disposition vocabulary (in-progress / terminal-success /
            terminal-failure / instruction-established — the fourth added 2026-08-07 because INCO,
            the terminal status of every deferred rail, was true in neither of the two answers the
            triad offered), and polls only while in progress. For standing orders
            and scheduled payments this is the ONLY tracking that exists — OBIE has no
            per-execution status, so the screen reports the instruction's setup and must not imply
            anything about individual executions.
          acceptance_criteria:
            - "An in-progress payment is never described as sent, complete or successful."
            - "Polling stops on a terminal disposition and never starts on one."
            - "INCO renders as instruction-established, neutrally — never a success tick, never a perpetual clock."
            - >-
              An unmapped status fails open to in progress. Fail-open is a safety net for codes
              nobody anticipated, never a substitute for mapping an enum member.
            - "Both the v4.0 short codes and the v3.1 long forms are accepted — domestic-vrps returns AcceptedCreditSettlementCompleted where the rest return ACCC."
            - "A mandate resource is described as set up, never as paid — there is no per-execution status to report."
          requirement_refs: [FR-014, FR-021]
          dependencies: [payments]

        # ── Open Data locator added 2026-08-07 (/idea-sync) ──────────────────
        # Split OUT of atm-locator rather than added beside it. See scope_change_log 2026-08-07.
        - name: branch-locator
          id: branch-locator
          priority: could
          status: draft
          created_at: "2026-08-07T00:00:00Z"
          category: open-data
          description: >-
            Find an HSBC UK branch by location, postcode, town or sort code. Unauthenticated
            OBIE Open Data (api.hsbc.com, no token, no consent, no session), so the screen works
            before the PSU has connected an account. A separate feature from atm-locator, not a
            second tab inside it: the Branch Locator is a distinct HSBC API with a materially
            richer payload — opening hours, 11 observed services, 8 customer segments, a sort
            code array and real accessibility data, all populated 25/25 where the ATM feed
            populates NONE of its five optional fields. The two share a host and an auth model
            but not a payload, and Branch.Identification is the only join between them
            (ATM.Branch carries an id and nothing else).
          acceptance_criteria:
            - "Branches render before login, with no token and no consent."
            - "The week is built from a fixed Monday-Sunday list; days absent from the API render as Closed. No branch publishes Sunday, so a renderer that iterates only what it receives drops Sunday from every branch."
            - "No 'Open now' indicator is shown — the feed carries StandardAvailability only and no bank-holiday data, so live status cannot be computed correctly."
            - "The published phone number is labelled as HSBC's national line, not as a per-branch direct dial — all 25 branches return the same number."
            - "Accessibility is a first-class filter here (populated 25/25), unlike on atm-locator where it is never sent."
            - "A sort code carried by a beneficiary, standing order or transaction resolves to a named branch with no consent."
          requirement_refs: [FR-010]
          dependencies: []
          related:
            atm-locator:
              relationship: sibling
              join: "ATM.Branch.Identification → Branch.Identification"

# ── REMOVED 2026-07-28 (reverse sync from source) ────────────────────
# The following features were specified but have no source implementation.
# Their screens, exports and mockups were deleted from the idea-layer so the
# layer describes only what the app actually does.
#
#   atm-locator  (FR-010) — AtmLocatorRoute exists but resolves to PlaceholderScreen;
#                           still reachable from the account-detail Explore chip.
#                           CORRECTION 2026-08-02: the atm-locator idea-layer was never
#                           actually deleted, and it is now deliberately RETAINED and back
#                           in_scope — it is planned work, not abandoned work.
#   profile      (FR-007) — no route, no module. Sign-out exists only as a side
#                           effect of revoking a consent (AppLogout).
#   pfm          (FR-011) — no pfm-dashboard / spending-by-category / budgets /
#                           recurring-subscriptions screens. Partial primitives DO
#                           ship in core: SpendingCalculator.computeSpendingSnapshot,
#                           SpendingSnapshot and the 7-value TransactionCategory enum,
#                           consumed only by the home spending snapshot.
#                           2026-08-02: the pfm-dashboard, pfm-settings and
#                           business-insights idea-layers are now deleted for real.
#   multi-currency        — no dedicated surface; AccountUiType carries GLOBAL_MONEY
#                           and GLOBAL_WALLET but AccountFilter offers no Global chip.
#
# ── REMOVED 2026-08-02 (/idea-sync — consumer-only scope) ────────────
#   field-officer         — the entire persona: 12 screens, flows/field-officer.yaml,
#                           3 fo-* journeys, 7 API groups and 10 DTOs. This app has a
#                           single consumer persona; there is no fieldOfficer flavour.

  screens:
    _tag: "§screens"
    _status: draft
    _quality_score: 72
    _source: wizard
    content:
      screens:
        - name: user-onboarding
          archetype: onboarding
          feature_refs: [consent-onboarding]
          description: "Intro to the app + UK Open Banking — what account data is requested and why, before connecting. No bank picker (HSBC only)."
        - name: login
          archetype: login
          feature_refs: [consent-onboarding]
          description: "Start OAuth with HSBC. The app stages an account-access-consent (Permissions array), then app-to-app redirects to HSBC where the PSU authenticates (SCA), approves the requested permission set and selects which accounts to share. Permission approval happens on HSBC's portal, not in-app."
        - name: consent-callback
          archetype: empty_state
          feature_refs: [consent-onboarding]
          description: "Return leg from the bank's app-to-app authorize; exchanges code for token."
        - name: consent-list
          archetype: index_list
          feature_refs: [consent-dashboard]
          description: "Active consents with status and expiry."
        - name: consent-detail
          archetype: detail_screen
          feature_refs: [consent-dashboard]
          description: "Granted permissions, expiry, revoke, reconfirm."
        - name: home
          archetype: dashboard
          feature_refs: [home, accounts, balances, transactions]
          description: "Home landing — currently selected account hero balance, quick actions, recent transactions, spending snapshot, account switcher."
        - name: accounts
          # feature_refs cleaned 2026-07-30 (/idea-sync): multi-currency was deleted from
          # features[] in the 2026-07-28 reverse sync but left dangling here.
          feature_refs: [accounts]
          archetype: index_list
          description: >-
            Authorised accounts with balance preview. Global Money / Global Wallet accounts
            render in this list under the Current filter — there is deliberately no Global
            filter chip, because such a wallet reports AccountTypeCode CACC and is
            indistinguishable here from an ordinary current account.
        - name: account-detail
          archetype: detail_screen
          feature_refs: [accounts, balances]
          description: "Account info + balances + entry points to transactions/statements/recurring."
        - name: transactions
          archetype: index_list
          feature_refs: [transactions]
          description: "Transaction history with date + credit/debit filters."
        - name: transaction-detail
          archetype: detail_screen
          feature_refs: [transactions]
          description: "Single transaction details."
        - name: beneficiaries
          archetype: index_list
          feature_refs: [beneficiaries]
          description: "Saved payees on the account (read-only) — name, account identifier and reference."
        - name: standing-orders
          archetype: index_list
          feature_refs: [standing-orders]
          description: "Recurring outbound orders — amount, frequency, next payment date and payee (read-only)."
        - name: direct-debits
          archetype: index_list
          feature_refs: [direct-debits]
          description: "Direct-debit mandates — originator, status and most-recent amount (read-only)."
        - name: scheduled-payments
          archetype: index_list
          feature_refs: [scheduled-payments]
          description: "Future-dated one-off payments — amount, execution date and payee (read-only)."
        - name: statements
          archetype: index_list
          feature_refs: [statements]
          description: "Statement list for the account — period, type and available dates."
        - name: statement-detail
          archetype: detail_screen
          feature_refs: [statements]
          description: "Single statement — period, opening/closing balances and statement transactions."
        - name: product
          archetype: detail_screen
          feature_refs: [product]
          description: "Account product terms — fees, rates and features (BCA/PCA accounts)."
        - name: account-holder
          archetype: detail_screen
          feature_refs: [account-holder]
          description: "Account holder / PSU details — display name, role label, email, mobile and a single flattened address line (gated by ReadParty). Renamed from `party` 2026-07-28."
        - name: settings
          archetype: settings
          feature_refs: [settings]
          description: "Settings hub — appearance (theme), manage consents, and about & legal (privacy, licences, app version)."
        - name: licences
          archetype: detail_screen
          feature_refs: [licences]
          description: "Open-source licence readout, pushed from the settings About section. Source-originated screen."

        # ── PISP screens added 2026-07-30 (/idea-evolve scope reversal) ──────
        # ── Rewritten to seven types 2026-08-06 (/idea-sync, PISP-tests research) ──
        - name: payments
          archetype: dashboard
          feature_refs: [payments]
          description: >-
            Payments hub — the Pay tab's landing screen. A three-column grid of seven square
            tiles: Domestic single, Domestic scheduled, Domestic standing order, International
            single, International scheduled, International standing order, and VRP mandate. Each
            tile carries an icon, a short label and a one-line description of what that type does,
            and opens that type's screen. Navigation only — no network calls.
        - name: pay-domestic-single
          archetype: form
          feature_refs: [pay-domestic-single, accounts, beneficiaries]
          description: >-
            Pay a person now, domestically. Funding account (eligible accounts only), payee from
            beneficiaries or a manually entered sort code and account number, amount and optional
            reference, then review. Runs funds-confirmation before submit.
        - name: pay-domestic-scheduled
          archetype: form
          feature_refs: [pay-domestic-scheduled, accounts, beneficiaries]
          description: >-
            Pay a person on one future date, domestically. As the single-payment form plus a
            mandatory execution date bounded to tomorrow through T+365. No funds-confirmation
            step. Carries the notice that it cannot be changed or cancelled from this app.
        - name: pay-domestic-standing-order
          archetype: form
          feature_refs: [pay-domestic-standing-order, beneficiaries]
          description: >-
            Set up a recurring domestic mandate. Frequency (five values), first payment date,
            optional final date within 12 months, and a first payment amount with optional
            recurring and final amounts. No debtor account field — the mandate is implied by the
            authorising customer. Carries the cannot-be-amended notice.
        - name: pay-international-single
          archetype: form
          feature_refs: [pay-international-single, accounts]
          description: >-
            Pay an overseas account now. IBAN creditor, optional 11-character BIC, transfer
            currency, and a charge-bearer choice. No reference field — the international rail
            refuses RemittanceInformation. Runs funds-confirmation before submit.
        - name: pay-international-scheduled
          archetype: form
          feature_refs: [pay-international-scheduled, accounts]
          description: >-
            Pay an overseas account on one future date. The international field set plus the
            bounded execution date. Carries the cannot-be-amended notice.
        - name: pay-international-standing-order
          archetype: form
          feature_refs: [pay-international-standing-order]
          description: >-
            Set up a recurring overseas mandate. Frequency, first and optional final date,
            instructed amount, transfer currency and charge bearer. States plainly that the
            exchange rate is not fixed for the life of the mandate. Carries the
            cannot-be-amended notice.
        - name: pay-vrp-mandate
          archetype: index_list
          feature_refs: [pay-vrp-mandate, accounts, beneficiaries]
          description: >-
            VRP mandates. Lists the PSU's mandates with their control parameters, remaining
            periodic headroom and health (authorised / authorised-but-failing / revoked), with a
            create action and a per-mandate pay and revoke. The only payment surface that both
            creates and destroys.
        - name: payment-consent
          archetype: empty_state
          feature_refs: [payment-consent]
          description: >-
            Headless return leg of the PISP authorisation, shared by all seven types — validates
            the redirect, exchanges the code, polls the originating family's consent-status GET to
            AUTH, then hands control back to that type's screen. Renders progress and terminal
            error only.
        - name: payment-status
          archetype: detail_screen
          feature_refs: [payment-status]
          description: >-
            Settlement tracking for a submitted payment or a created mandate, shared by all seven
            types — status disposition chip, the echoed details, and a bounded poll that runs only
            while the instruction is still moving. For mandates it reports setup only, because
            OBIE exposes no per-execution status.

# ── REMOVED 2026-07-28 (reverse sync from source) ────────────────────
# Screens with no source implementation: atm-locator (specified, planned), profile.
# The pfm-dashboard, spending-by-category, budgets, recurring-subscriptions and
# business-insights specs were deleted 2026-08-02 along with the field-officer persona.

  flows:
    _tag: "§flows"
    _status: draft
    _quality_score: 74
    _source: wizard
    content:
      flows:
        - name: onboarding-consent
          type: happy
          feature_ref: consent-onboarding
          steps:
            - "Splash → user onboarding (what Open Banking is + what data is requested)"
            - "Login — start OAuth with HSBC"
            - "App stages an account-access-consent with the requested Permissions array"
            - "App-to-app redirect to HSBC: PSU authenticates (SCA), approves the requested permission set, selects accounts to share"
            - "Callback exchanges authorization code for PSU access token (rejection → error, no token, no data access)"
            - "Land on Accounts"
        # Added 2026-07-31 (/idea-sync Phase B). flows/home-dashboard.yaml has existed since
        # the 2026-07-28 reverse sync and is bound by screens/home/flow.yaml#flow_ref, but the
        # plan's flow inventory never declared it — 8 declared vs 9 on disk. The plan is the
        # docset SoT for that inventory, so the omission made the app's start-destination flow
        # invisible to every consumer that reads flows from here.
        - name: home-dashboard
          type: happy
          feature_ref: home
          release_phase: P0
          steps:
            - "Home tab (bottom-nav order 0) — also the authenticated NavHost start destination"
            - "Hero balance card renders the selected account"
            - "Tap the account switcher — AccountSelectorSheet opens in-screen, no navigation"
            - "Pick an account chip — persists selectedAccountId and re-drives the whole screen"
            - "Tap a recent transaction row → transaction-detail (cross-flow → transaction-review)"
            - "Tap 'View all' → transactions (cross-flow → transaction-review)"
          # homeGraph exposes exactly two outward callbacks; the account-detail, statements,
          # consent-list and pfm-dashboard exits were struck in the 07-28 reverse sync and are
          # recorded under removed_in_sync in flows/home-dashboard.yaml.
        - name: account-browsing
          type: happy
          feature_ref: accounts
          steps: ["Accounts list", "Open account detail", "View balances", "Open transactions / statements / recurring"]
        - name: transaction-review
          type: happy
          feature_ref: transactions
          steps: ["Transactions list", "Apply date / credit-debit filter", "Open transaction detail"]
        - name: consent-management
          type: happy
          feature_ref: consent-dashboard
          steps: ["More → Consents", "Open consent detail", "Revoke or reconfirm before 90 days"]
        - name: recurring-and-statements
          type: happy
          feature_ref: standing-orders
          steps: ["Account detail", "Standing orders / Direct debits / Scheduled payments", "Statements → statement detail"]
        - name: consent-expired
          type: error
          feature_ref: consent-dashboard
          steps: ["Resource call returns consent expired/revoked", "Prompt re-consent", "Re-run onboarding-consent"]
        - name: settings-and-profile
          type: happy
          feature_ref: settings
          steps: ["More tab", "Open Settings (appearance, manage consents, about & legal)", "Open Licences", "Shortcut to Consents"]
          # Reverse-synced 2026-07-28: the profile step was removed — no profile screen ships.
        # pfm-review flow removed 2026-07-28 — none of its four screens were built.

        # ── PISP flow added 2026-07-30 (/idea-evolve scope reversal) ─────────
        # ── Replaced by 8 per-type flows 2026-08-06 (/idea-sync, PISP-tests research) ──
        # The old single `send-money-payment` flow is superseded. The stages common to all six
        # PIS rails (stage consent -> app-to-app authorise -> poll to AUTH -> submit -> track)
        # are shared, but the fields gathered before staging and the status ladder afterwards
        # differ per type, so each rail carries its own flow.
        - name: payments-hub
          type: happy
          feature_ref: payments
          release_phase: P3
          steps:
            - "Pay tab → payments hub (replaces the SendMoneyRoute placeholder)"
            - "Grid of seven square payment-type tiles renders"
            - "Tap a tile → that payment type's screen"

        - name: pay-domestic-single
          type: happy
          feature_ref: pay-domestic-single
          release_phase: P3
          steps:
            - "Payments hub → Domestic single"
            - "Choose the funding account — only scheme-eligible accounts are offered"
            - "Choose a saved payee, or enter a sort code and account number manually"
            - "Enter amount and optional reference; validated against available balance"
            - "Review and confirm"
            - "App stages a domestic-payment-consent (payments-scope CC token + detached JWS + idempotency key)"
            - "App-to-app redirect to HSBC: PSU authenticates (SCA) and approves"
            - "payment-consent validates the redirect, exchanges the code and polls the consent GET to AUTH"
            - "App runs funds-confirmation on the PSU token"
            - "App submits reusing the same idempotency key and the byte-identical staged Initiation"
            - "payment-status polls the resource GET: ACSP → ACCC"

        - name: pay-domestic-scheduled
          type: happy
          feature_ref: pay-domestic-scheduled
          release_phase: P3
          steps:
            - "Payments hub → Domestic scheduled"
            - "Choose funding account, payee, amount and optional reference"
            - "Choose an execution date — bounded to tomorrow through T+365"
            - "Review and confirm; Data.Permission Create is sent"
            - "Stage → authorise → poll consent GET to AUTH → submit (no funds-confirmation on this family)"
            - "payment-status polls the resource GET: PDNG → INCO, reported as scheduled, not paid"
            - "Screen states that changing or cancelling must be done in the bank's own channel"

        - name: pay-domestic-standing-order
          type: happy
          feature_ref: pay-domestic-standing-order
          release_phase: P3
          steps:
            - "Payments hub → Domestic standing order"
            - "Choose the payee — no debtor field; the mandate is implied by the authorising customer"
            - "Choose frequency from the five accepted values"
            - "Choose a first payment date, and optionally a final date within 12 months"
            - "Enter the first payment amount, and optionally recurring and final amounts"
            - "Review and confirm; FirstPaymentAmount is sent, InstructedAmount never is, Risk is {}"
            - "Stage → authorise → poll consent GET to AUTH → submit"
            - "payment-status polls the resource GET: PDNG → INCO, reported as set up"
            - "Screen states that changing or cancelling must be done in the bank's own channel"

        - name: pay-international-single
          type: happy
          feature_ref: pay-international-single
          release_phase: P4
          steps:
            - "Payments hub → International single"
            - "Choose the funding account"
            - "Enter the creditor IBAN and name, and optionally an 11-character BIC"
            - "Enter the instructed amount and currency, and the transfer currency — they need not match"
            - "Choose a charge bearer"
            - "Review and confirm; no reference field, because the rail refuses RemittanceInformation"
            - "Stage → authorise → poll consent GET to AUTH → funds-confirmation → submit"
            - "payment-status polls the resource GET: ACSP → ACCC, with no charges at any stage"

        - name: pay-international-scheduled
          type: happy
          feature_ref: pay-international-scheduled
          release_phase: P4
          steps:
            - "Payments hub → International scheduled"
            - "Gather the international field set, plus an execution date bounded to tomorrow through T+365"
            - "Review and confirm; Data.Permission Create, CurrencyOfTransfer and ChargeBearer all sent"
            - "Stage → authorise → poll consent GET to AUTH → submit (no funds-confirmation)"
            - "payment-status polls the resource GET: INCO throughout — this rail never emits PDNG"
            - "Screen states that changing or cancelling must be done in the bank's own channel"

        - name: pay-international-standing-order
          type: happy
          feature_ref: pay-international-standing-order
          release_phase: P4
          steps:
            - "Payments hub → International standing order"
            - "Choose the IBAN creditor, frequency, first and optional final date"
            - "Enter the instructed amount, transfer currency and charge bearer"
            - "Review and confirm; InstructedAmount is sent, FirstPaymentAmount never is"
            - "Stage → authorise → poll consent GET to AUTH → submit"
            - "payment-status polls the resource GET: INCO throughout"
            - "Screen states the rate is not fixed for the life of the mandate, and that changes must go through the bank"

        - name: pay-vrp-mandate
          type: happy
          feature_ref: pay-vrp-mandate
          release_phase: P5
          steps:
            - "Payments hub → VRP mandate → list of existing mandates"
            - "Create: choose debtor and creditor (SortCodeAccountNumber both sides), set MaximumIndividualAmount and at least one periodic limit, GBP only"
            - "Screen states the first period's PRO-RATED limit, and whether a fixed reference is being locked in"
            - "Stage the consent → app-to-app authorise → poll consent GET to AUTH"
            - "Mandate is now live and STAYS AUTH — it never reaches COND"
            - "Pay under it: POST funds-confirmation with an explicit amount on the PSU token, then POST /domestic-vrps"
            - "Repeat with no re-authentication; a breach of the limits returns U014 and renders as a limit breach"
            - "payment-status maps the v3.1 long status form this endpoint returns"
            - "Revoke: DELETE returns 204; the app records it locally because the consent GET now returns 400 U011 forever"

        - name: vrp-revoked-elsewhere
          type: error
          feature_ref: pay-vrp-mandate
          release_phase: P5
          steps:
            - "PSU revokes the mandate in the HSBC app, or deletes the payee from their beneficiary list"
            - "Event poll returns UK.OBIE.Consent-Authorization-Revoked, or payments begin failing with StatusReason UK.OBIE.ExemptionNotApplied while the consent still reads AUTH"
            - "Mandate renders as revoked, or as authorised-but-failing — never as healthy"
            - "A consent GET returning 400 U011 is shown as revoked, not as a generic error"

  api_surface:
    _tag: "§api_surface"
    _status: draft
    _quality_score: 80
    _source: wizard
    content:
      external_api_ref: API-001
      endpoints:
        - { path: /account-access-consents, method: POST, description: "Create account-access-consent (permissions + expiry).", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/account-access-consents/{ConsentId}", method: GET, description: "Consent status.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/account-access-consents/{ConsentId}", method: DELETE, description: "Revoke consent.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: /accounts, method: GET, description: "List authorised accounts.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}", method: GET, description: "Account detail.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/balances", method: GET, description: "Account balances.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/transactions", method: GET, description: "Transactions (date/credit-debit filters).", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/beneficiaries", method: GET, description: "Beneficiaries.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/standing-orders", method: GET, description: "Standing orders.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/direct-debits", method: GET, description: "Direct debits.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/scheduled-payments", method: GET, description: "Scheduled payments.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/statements", method: GET, description: "Statements list.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/statements/{StatementId}", method: GET, description: "Statement detail.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/statements/{StatementId}/transactions", method: GET, description: "Transactions within a single statement.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/statements/{StatementId}/file", method: GET, description: "Statement file / PDF download.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/product", method: GET, description: "Account product.", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/party", method: GET, description: "Account holder — single party (OBReadParty2).", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: "/accounts/{AccountId}/parties", method: GET, description: "Account owner(s)/holder(s)/operator(s) — multiple parties (OBReadParty3).", auth_required: true, source: external_api, source_ref: API-001 }
        - { path: /oauth2/token, method: POST, description: "Token endpoint — OAuth2 v1.1 (client_credentials + authorization_code; private_key_jwt). From the OIDC well-known config, not the AIS swagger.", auth_required: false, source: external_api, source_ref: null }
        - { path: /oauth2/authorize, method: GET, description: "PSU authorisation — OAuth2 v1.1 (signed request object, PKCE, app-to-app). From the OIDC well-known config, not the AIS swagger.", auth_required: false, source: external_api, source_ref: null }
        - { path: /register, method: POST, description: "Dynamic Client Registration — DCR v3.2.1, signed SSA (separate dcr-uk.yaml spec).", auth_required: false, source: external_api, source_ref: API-002 }
        # ── PISP endpoints added 2026-07-30 (/idea-evolve scope reversal) ────
        # ── Widened to all 7 families 2026-08-06 (/idea-sync, PISP-tests research) ──
        # Base path v4.0/pisp (AIS resources are v4.0/aisp). Enumerated from the HSBC-shipped
        # Postman collection, UK Personal brand folder — the authoritative source for request
        # shape. 32 PISP endpoints.
        #
        # HEADER CONTRACT, as observed (captures/OBSERVATIONS.md "Header contract"):
        #   POST *-consents        -> x-jws-signature REQUIRED + x-idempotency-key REQUIRED, CC token
        #   GET  *-consents/{id}   -> no JWS, no key, CC token
        #   GET  .../funds-confirmation -> no JWS, no key, PSU token (CC returns 401)
        #   POST *-payments        -> JWS + key REQUIRED, PSU token
        #   GET  *-payments/{id}   -> no JWS, no key, CC token
        # Omitting the signature on a write returns 400 U019. Sending it on an AIS consent is
        # REJECTED (UK.OBIE.Header.Unexpected) — PISP writes only.

        # 1 — Domestic single payment
        - { path: /domestic-payment-consents, method: POST, description: "Stage a domestic payment consent. Client-credentials token on scope=payments. Requires x-jws-signature + x-idempotency-key. Risk.PaymentContextCode restricted to TransferToThirdParty | TransferToSelf. Charges 0.05 GBP at staging.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-payment-consents/{ConsentId}", method: GET, description: "CONSENT STATUS. Polled to AUTH before submit (a non-Authorised consent returns 400 U009). Goes COND on first use. StatusUpdateDateTime does NOT move on AWAU->AUTH — read Status only.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-payment-consents/{ConsentId}/funds-confirmation", method: GET, description: "Pre-submit funds check. PSU token; requires an Authorised consent. Only the two single-payment families have this, and only as a GET — a PISP consent carries one fixed amount.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /domestic-payments, method: POST, description: "Submit the payment. PSU token. Requires x-jws-signature + the SAME x-idempotency-key used to stage, and a byte-identical echo of the staged Initiation (mismatch returns U008).", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-payments/{DomesticPaymentId}", method: GET, description: "PAYMENT STATUS. ACSP at creation, ACCC on read-back. Pure read: no JWS, no idempotency key.", auth_required: true, source: external_api, source_ref: API-003 }

        # 2 — Domestic scheduled payment
        - { path: /domestic-scheduled-payment-consents, method: POST, description: "Stage a domestic scheduled payment consent. Data.Permission 'Create' MANDATORY (U004 if omitted). RequestedExecutionDateTime mandatory, strictly > today and <= T+365, normalised to midnight. RemittanceInformation accepted on this rail. Accepts optional Authorisation + SCASupportData blocks.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-scheduled-payment-consents/{ConsentId}", method: GET, description: "CONSENT STATUS. AWAU -> AUTH -> COND.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /domestic-scheduled-payments, method: POST, description: "Submit the scheduled payment. No funds-confirmation exists on this family — today's balance says nothing about execution day.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-scheduled-payments/{DomesticScheduledPaymentId}", method: GET, description: "PAYMENT STATUS. PDNG at creation, INCO on read-back. There is NO per-execution status — this describes the instruction's setup only.", auth_required: true, source: external_api, source_ref: API-003 }

        # 3 — Domestic standing order
        - { path: /domestic-standing-order-consents, method: POST, description: "Stage a domestic standing order consent. Data.Permission 'Create' MANDATORY. Uses FirstPaymentAmount (+ optional Recurring/Final) — InstructedAmount returns U005. MandateRelatedInformation carries Frequency (5 values), FirstPaymentDateTime and optional FinalPaymentDateTime (within 12 months, after the first). PointInTime returns U005. DebtorAccount, RemittanceInformation and the identity fields are dropped; Risk is {}.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-standing-order-consents/{ConsentId}", method: GET, description: "CONSENT STATUS. AWAU -> AUTH -> COND.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /domestic-standing-orders, method: POST, description: "Create the standing order mandate. Cannot subsequently be amended or cancelled by a PISP — OBL CEG requires redirecting the PSU to the bank's own channel.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-standing-orders/{DomesticStandingOrderId}", method: GET, description: "MANDATE STATUS. PDNG at creation, INCO on read-back. Describes the mandate's setup, never the Nth payment. A PIS-created standing order does not surface in the AIS standing-orders read at creation time.", auth_required: true, source: external_api, source_ref: API-003 }

        # 4 — International single payment
        - { path: /international-payment-consents, method: POST, description: "Stage an international payment consent. CurrencyOfTransfer and ChargeBearer MANDATORY (U004 each). RemittanceInformation REFUSED (U005). Creditor must be UK.OBIE.IBAN — a sort-code creditor returns U027. CreditorAgent, when sent, must be an 11-character BIC. The only shape returning NO charge at any stage.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/international-payment-consents/{ConsentId}", method: GET, description: "CONSENT STATUS. AWAU -> AUTH -> COND; RJCT if the PSU denies at the bank.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/international-payment-consents/{ConsentId}/funds-confirmation", method: GET, description: "Pre-submit funds check. PSU token.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /international-payments, method: POST, description: "Submit the international payment. PSU token, JWS + same idempotency key.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/international-payments/{InternationalPaymentId}", method: GET, description: "PAYMENT STATUS. ACSP at creation, ACCC on read-back, no Charges at any point.", auth_required: true, source: external_api, source_ref: API-003 }

        # 5 — International scheduled payment
        - { path: /international-scheduled-payment-consents, method: POST, description: "Stage an international scheduled payment consent. Data.Permission 'Create' + CurrencyOfTransfer + ChargeBearer all mandatory; RemittanceInformation refused (U005). Same T+1..T+365 date window as the domestic rail.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/international-scheduled-payment-consents/{ConsentId}", method: GET, description: "CONSENT STATUS. AWAU -> AUTH -> COND.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /international-scheduled-payments, method: POST, description: "Submit. No funds-confirmation on this family. Charges nothing until resource creation, then 0.50 in the INSTRUCTED currency.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/international-scheduled-payments/{InternationalScheduledPaymentId}", method: GET, description: "PAYMENT STATUS. INCO at creation and on read-back — this rail never emits PDNG.", auth_required: true, source: external_api, source_ref: API-003 }

        # 6 — International standing order
        - { path: /international-standing-order-consents, method: POST, description: "Stage an international standing order consent. Uses InstructedAmount, NOT FirstPaymentAmount (which returns U005) — the one field-level divergence from the domestic mandate. CurrencyOfTransfer + ChargeBearer mandatory. Same 5-value frequency enum.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/international-standing-order-consents/{ConsentId}", method: GET, description: "CONSENT STATUS. AWAU -> AUTH -> COND.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /international-standing-orders, method: POST, description: "Create the overseas mandate. OBIE has NO per-execution FX model — the rate applied at each execution is neither quoted nor documented. Cannot be amended or cancelled by a PISP.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/international-standing-orders/{InternationalStandingOrderId}", method: GET, description: "MANDATE STATUS. INCO throughout. Charge 0.50 in the instructed currency.", auth_required: true, source: external_api, source_ref: API-003 }

        # 7 — Domestic VRP. Structurally distinct: ControlParameters replace both the mandate
        # and the execution date, funds-confirmation is a POST, and it is the ONLY family with
        # a DELETE. Domestic only — there is no international VRP.
        - { path: /domestic-vrp-consents, method: POST, description: "Stage a VRP consent — the long-lived mandate, created ONCE. ControlParameters + PeriodicLimits + MaximumIndividualAmount all MANDATORY (U004 each). GBP only (U023 otherwise). SortCodeAccountNumber required on BOTH sides (U021). PSUAuthenticationMethods accepts only UK.OBIE.SCANotRequired (UK.OBIE.SCA returns U002). Max six periodic limits, one per period type; the first period is PRO-RATED.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-vrp-consents/{ConsentId}", method: GET, description: "CONSENT STATUS. AWAU -> AUTH and stays AUTH forever — the VRP state model omits Consumed. Returns 400 U011 'Resource cannot be found' once deleted, which is the ONLY signal that a revocation happened.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-vrp-consents/{ConsentId}", method: DELETE, description: "REVOKE the mandate. 204 with an empty body. The only DELETE in the whole payment surface — PSD2 Art.80 forbids revoking an authorised payment order, while the VRP profile grants revocation at any point in time.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-vrp-consents/{ConsentId}/funds-confirmation", method: POST, description: "Funds check for ONE prospective payment. A POST, not a GET, because a VRP consent has no fixed amount — the TPP supplies one in the body. REQUIRES the PSU authorisation-code token; a client-credentials token returns 401.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /domestic-vrps, method: POST, description: "Pay under the mandate. No PSU re-authentication. The Initiation MUST be taken from the AUTHORISED consent, not from what was staged — the bank overwrites Initiation.DebtorAccount with the PSU's choice when the TPP omits it. Breaching a control parameter returns 400 U014.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/domestic-vrps/{DomesticVRPId}", method: GET, description: "PAYMENT STATUS. ACSP then ACCC — but returned as the v3.1 LONG form 'AcceptedCreditSettlementCompleted', unlike every other endpoint which returns the v4.0 short code. The status mapper must accept both encodings.", auth_required: true, source: external_api, source_ref: API-003 }

        # ── Event notification (v4.0, not under /pisp) ───────────────────────
        # The only mechanism that surfaces an out-of-band consent revocation. Load-bearing for
        # the long-lived VRP mandate, whose consent GET can never report a revoked state.
        - { path: /event-subscriptions, method: POST, description: "Subscribe to event types — UK.OBIE.Consent-Authorization-Revoked. Requires x-jws-signature.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /event-subscriptions, method: GET, description: "List active event subscriptions.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: "/event-subscriptions/{EventSubscriptionId}", method: DELETE, description: "Remove an event subscription.", auth_required: true, source: external_api, source_ref: API-003 }
        - { path: /events, method: POST, description: "Poll for events (aggregated polling). Body carries returnImmediately + maxEvents.", auth_required: true, source: external_api, source_ref: API-003 }
      api_gap_analysis:
        # Reverse-synced 2026-07-28 against core/network/api/Aisp.kt + OAuth.kt.
        total_features: 15
        api_covered: 13
        coverage_percent: 86.7
        gaps:
          - feature: settings
            needed_endpoints: []
            gap_strategy: client_only
            notes: "Settings reads and writes UserDataRepository only — no external API."
          - feature: licences
            needed_endpoints: []
            gap_strategy: client_only
            notes: "Static bundled asset read from module Compose resources."
      implemented_client_surface:
        # Aisp.kt — every method that ships on the network client.
        aisp: [createConsent, getConsent, deleteConsent, getAccounts, getAccountDetails,
               getBalances, getBeneficiaries, getDirectDebits, getProduct, getParty,
               getParties, getTransactions, getTransactionsPage, getStandingOrders,
               getScheduledPayments, getStatements, getStatementDetails,
               getStatementTransactions, getStatementFile]
        oauth: [clientCredentialsToken, exchangeAuthorizationCode, refreshToken]
        unconsumed:
          - method: getParties
            note: "No store, repository or feature consumes it. account-holder reads getParty (singular) only."
      out_of_scope_drift:
        - area: PISP
          status: resolved
          resolved_at: "2026-07-30"
          resolved_by: "/idea-evolve — scope reversal; PISP domestic single payment moved in_scope"
          finding: >-
            §vision.scope.out_of_scope declares payment initiation out of scope, but
            core/network ships a complete PISP wire-model surface — domestic payment,
            domestic scheduled payment, domestic standing order, international payment,
            international scheduled payment and international standing order, each with
            request + response models and serialization tests. No feature module or
            repository consumes any of it, so nothing is reachable from the UI; the Pay
            bottom-nav tab points at a SendMoneyRoute placeholder in that direction.
          consumed_by: [send-money, payment-consent, payment-status]
          recorded_at: "2026-07-28"
          resolution_note: >-
            Only the DOMESTIC SINGLE payment models are brought into scope. The domestic
            scheduled, domestic standing order and three international model sets remain
            shipped-but-unconsumed and are now declared out_of_scope explicitly rather than
            implicitly, so this is narrowed drift rather than closed drift. Re-audit if those
            surfaces stay unconsumed.
          residual_unconsumed:
            - "core/network/.../pisp/domesticScheduledPayment (request + response, serialization-tested)"
            - "core/network/.../pisp/domesticStandingOrder (request + response)"
            - "core/network/.../pisp/internationalPayment (request + response, no serialization tests)"
            - "core/network/.../pisp/internationalScheduledPayment (request + response, no serialization tests)"
            - "core/network/.../pisp/internationalStandingOrder (request + response, no serialization tests)"

