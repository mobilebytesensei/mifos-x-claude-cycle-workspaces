vision:
  _status: approved
  _approved_at: "2026-10-21"
  _approved_by: "user (matrix [A])"
  _source: source_analysis
  _quality_score: 92
  _enrichment_count: 1
  _last_updated: "2026-10-21"
  differentiator: "Open-source, client-only, no aggregator lock-in — the integrator holds the certificates and talks to the ASPSP directly."
  elevator_pitch: >-
    One Kotlin Multiplatform codebase that acts as a UK Open Banking TPP — see every account and initiate
    single, scheduled, standing-order and VRP payments against the HSBC UK sandbox with FAPI-grade security.
  problem_statement: >-
    Banks and fintechs in the Mifos/Fineract ecosystem have no open-source, production-shaped reference for
    building a UK Open Banking (OBIE v4.0) TPP app. mTLS client certs, private_key_jwt, OIDC hybrid-flow
    consent redirects across mobile and desktop, detached-JWS payment signing and idempotent submission must
    otherwise be rebuilt from scratch on every platform.
  solution_statement: >-
    A Compose Multiplatform app with one shared networking core (Aisp, Pisp, Vrp, OAuth) and a Store5/Room
    data layer running the full consent lifecycle: client-credentials token → create consent → PS256-signed
    authorize URL → PSU authorises in the browser → HTTPS relay page hands the fragment back (custom scheme on
    mobile, loopback on desktop) → validate state/nonce → exchange code → read accounts or submit payment.
  target_users:
    - "Retail bank customers (PSUs) with HSBC UK personal accounts (sandbox)"
    - "TPP / fintech developers forking a reference Open Banking client"
    - "Mifos/Fineract institutions evaluating Open Banking AIS/PIS"
  value_propositions:
    - "One codebase for AIS + PIS on Android, iOS and desktop with FAPI security built in"
    - "Complete consent lifecycle: create, authorise via browser relay, callback, status poll, revoke"
    - "Every OBIE PIS product: domestic + international single, scheduled, standing order, plus domestic VRP"
    - "Unified account view: balances, paginated transactions, statements + PDF/CSV, standing orders, direct debits, beneficiaries, product, party"
    - "Fork-friendly: credentials/certs per developer, git-ignored, config generated from local.properties"
  success_metrics:
    - { metric: "AIS consent completion rate", target: "≥ 95%", measure: "consent-callback Success ÷ Login StartOAuth (analytics)" }
    - { metric: "Payment submission success after PSU authorisation", target: "≥ 95%", measure: "payment-status accepted ÷ payment-consent entered" }
    - { metric: "Duplicate payment writes", target: "0", measure: "idempotency-key collisions + redirect dedupe hits in Crashlytics breadcrumbs" }
    - { metric: "Fork-to-first-sandbox-call time", target: "< 60 min", measure: "timed onboarding walkthrough per release" }
    - { metric: "Platform parity", target: "Android + desktop + iOS verified against sandbox each release", measure: "device/desktop smoke run" }
    - { metric: "Crash-free sessions", target: "≥ 99.5%", measure: "Crashlytics" }
  scope:
    in_scope:
      - "AIS: account-access-consents CRUD; accounts, balances, transactions (Links.Next paging), statements (+detail, +transactions, +file), standing orders, scheduled payments, direct debits, beneficiaries, product, party"
      - "PIS: domestic + international single, scheduled and standing-order consents, funds confirmation, submit, receipt"
      - "VRP: domestic-vrp-consents create/get/delete, funds confirmation, domestic-vrps submit/get"
      - "Consent management: list/detail, revoke (logs out), renew via LoginRenew"
      - "Local payment history per product; settings (theme, licences, consents)"
      - "Platforms: Android, desktop (JVM), iOS (experimental), web (UI shell only)"
    out_of_scope:
      - "Web bank connectivity — browsers cannot present an mTLS client certificate"
      - "In-app Dynamic Client Registration (done out-of-band on HSBC DevHub)"
      - "Multi-ASPSP selection (HSBC UK only)"
      - "Cards, PFM insights, FX, ATM locator, change/forgot password, ToS/privacy (placeholder routes)"
      - "CBPII confirmation-of-funds API, file payments, event notifications"
  constraints:
    technical:
      - "mTLS on every bank call; PS256 private_key_jwt client auth"
      - "OIDC hybrid flow (code id_token) → fragment → HTTPS relay page (docs/consent-callback-page) required"
      - "Scheme org.mifosx.openbanking + desktop loopback 8765 duplicated across bridge.js, AndroidManifest, Info.plist, cmp-shared, cmp-desktop"
      - "PIS/VRP writes need detached JWS (x-jws-signature) + x-idempotency-key ≤ 40 chars"
      - "Secrets via local.properties → :core:network:generateHsbcConfig; blank secrets fail at client construction"
    business:
      - "Sandbox only — production needs FCA authorisation + OB/eIDAS certificates"
      - "MPL-2.0; contributions require a signed CLA"
      - "PSD2 / UK OB: AIS consent 90-day expiry and 90-day history window"
    assumptions:
      - "Each developer registers their own HSBC sandbox TPP and hosts their own relay page"
      - "Sandbox accepts PISP calls without x-fapi-financial-id"
  known_limitations:
    - { description: "iOS mTLS implemented but never built or verified on a Mac", planned_version: "2026.11.0" }
    - { description: "Web targets cannot reach the bank; statement download on web is a no-op", planned_version: "2027.1 (web bank gateway)" }
    - { description: "Single ASPSP; hosts and paths hardcoded to /obie/open-banking (authorize path in 5 repos)", planned_version: "2027.1 (config-driven ASPSP)" }
    - { description: "AIS consent always requests OBPermission.ALL — no user scope choice", planned_version: "2027.1" }
    - { description: "x-fapi-financial-id hardcoded blank — will fail on production ASPSPs", planned_version: "2027.1 (config-driven ASPSP)" }

personas:
  _status: approved
  _approved_at: "2026-10-21"
  _approved_by: "user (matrix [A])"
  _source: source_analysis
  _quality_score: 88
  _enrichment_count: 1
  _last_updated: "2026-10-21"
  pain_to_feature_map:
    - { pain: "Unsure whether the payment went through", addressed_by: [payment-status, payment-consent], open_defects: [DEF-010] }
    - { pain: "Consents silently expire", addressed_by: [consent-list, consent-detail], open_defects: [DEF-008] }
    - { pain: "Opaque failures without a next step", addressed_by: [payment-consent, FR-030, FR-040], open_defects: [DEF-006, DEF-008] }
    - { pain: "Certificate preparation / scheme-port sync", addressed_by: [README setup], open_defects: [] }
    - { pain: "Consent revoked in-app but still live at the bank", addressed_by: [consent-detail], open_defects: [DEF-003] }
  personas:
    - name: "Priya the PSU"
      role: "Retail HSBC UK personal account holder using a third-party money app"
      jobs_to_be_done:
        - "Connect my bank once and see every account's balance on one home screen"
        - "Browse and search transactions, open statements and download the PDF"
        - "Send a one-off domestic or international payment without opening my bank's app"
        - "Schedule a future payment or set up a standing order"
        - "Set up a VRP mandate with limits, then pay against it"
        - "See and revoke what I have consented to"
      pain_points:
        - "Bounced to the bank's site and unsure whether the payment went through"
        - "Consents that silently expire and force re-authentication"
        - "Opaque failures (insufficient funds, revoked consent) without a next step"
      goals: ["A clear receipt and status for every payment", "Control and visibility of active consents"]
    - name: "Dev the TPP integrator"
      role: "Fintech or bank developer forking the reference client"
      jobs_to_be_done:
        - "Plug in my sandbox client_id, kid, SSA and certs and get a working app quickly"
        - "Reuse the FAPI building blocks (client assertion, request object, detached JWS, mTLS) on every platform"
        - "Host my own redirect relay and custom scheme"
      pain_points:
        - "Certificate preparation (PKCS#8, PKCS#12 with a non-empty password)"
        - "Keeping scheme and port in sync across six files"
        - "No in-app DCR; README omits HSBC_SIGNING_ISSUER"
      goals: ["Time-to-first-call under an hour", "A pattern extensible to more ASPSPs"]
    - name: "Mifos institution product owner"
      role: "Product lead at a Mifos/Fineract-powered institution or the Mifos community"
      jobs_to_be_done:
        - "Evaluate Open Banking AIS/PIS as a member capability"
        - "Demonstrate a multi-platform reference on the Mifos KMP template"
      pain_points: ["Only one sandbox bank", "iOS and web unverified or unsupported"]
      goals: ["Show a credible, compliant TPP experience end to end"]
    - name: "Sam the security/compliance reviewer"
      role: "Security engineer or compliance officer auditing the TPP before production"
      jobs_to_be_done:
        - "Verify FAPI 1.0 Advanced conformance (mTLS, private_key_jwt, PS256 request objects, nonce/state, detached JWS)"
        - "Confirm consent handling matches PSD2/OBIE rules (90-day expiry, revoke really revokes at the ASPSP)"
        - "Check secret hygiene — no keys, passwords or certs in the repo; secrets from a vault"
      pain_points:
        - "Signing passwords committed in fastlane-config (BLK-001)"
        - "Revoke logs out locally even when the bank DELETE fails (DEF-003)"
        - "A Rejected consent still completes sign-in (DEF-001)"
      goals: ["A clean security review with zero critical findings", "Evidence (tests, logs) for each FAPI control"]

