flows:
  _status: enriched
  _reapproval_reason: "/idea-plan-add 2026-10-21 — ConsentRelay added to 7 redirect flows"
  _approved_at: "2026-10-21"
  _approved_by: "user (matrix [A])"
  _source: source_analysis
  _quality_score: 95
  _enrichment_count: 2
  _last_updated: "2026-10-21"
  flows:
    - id: payment-declined
      screens: [PaymentConsent, SendMoney]
      name: "Payment declined at the bank"
      type: error
      feature_ref: payment-consent
      steps:
        - "PSU authorises, but consent status comes back Rejected or submit returns a bank error"
        - "PaymentConsent → Declined state with bank code, message and support reference"
        - "Failure recorded in the product's local history"
        - "Options: back to the originating form with the draft kept, or abandon"
    - id: ais-consent-expired
      screens: [ConsentList, LoginRenew, ConsentRelay, ConsentCallback, Home]
      name: "AIS consent expired → renew"
      type: edge
      feature_ref: consent-list
      steps:
        - "Any AIS read returns 403 ConsentRevoked/expired, or ConsentList shows the expired banner"
        - "User taps Renew → LoginRenewRoute (no Intro)"
        - "New account-access-consent created → browser → relay → consent-callback"
        - "Return to the screen that triggered the renew"
    - id: revoke-fails-at-bank
      screens: [ConsentDetail]
      name: "Revoke fails at the bank"
      type: error
      feature_ref: consent-detail
      steps:
        - "ConfirmRevoke → DELETE account-access-consents/{id} (or domestic-vrp-consents/{id})"
        - "Non-2xx / network error → stay signed in, show a revoke-failed message with Retry"
        - "Only a confirmed DELETE logs out / marks the VRP consent revoked (DEF-003, NFR-006)"
    - id: rate-limited
      screens: [Home]
      name: "Rate limited (429)"
      type: edge
      feature_ref: home
      steps:
        - "Any bank call returns 429"
        - "ErrorKind.RateLimited → message with a wait hint; Retry enabled after a back-off"
        - "No automatic retry storm"
    - id: redirect-after-app-killed
      screens: [ConsentRelay, Splash, ConsentCallback]
      name: "Redirect arrives after the app was killed"
      type: edge
      feature_ref: consent-callback
      steps:
        - "OS restarts the app from the custom-scheme / loopback redirect"
        - "Single-use PendingAuth loaded from secure Settings validates state and nonce"
        - "RootNavScreen routes the redirect leg (SignIn / Payment / VRP) once — lastRoutedRedirect dedupe"
        - "Missing or expired PendingAuth → SecurityError, never a silent exchange"
    - id: connect-bank
      screens: [Splash, Intro, Login, ConsentRelay, ConsentCallback, Home]
      name: "First launch and connect bank (AIS consent)"
      type: happy
      feature_ref: login
      steps:
        - "Splash: RootNavViewModel checks ConsentSession.isActive(); inactive → AuthGraphRoute"
        - "IntroRoute → Continue → LoginRoute (OBPermission.ALL list)"
        - "client_credentials token (scope accounts, private_key_jwt) → POST account-access-consents (90d) → ConsentId"
        - "PS256 request-object JWT (intent id, state, nonce) → BrowserLauncher opens authorize"
        - "PSU authenticates at HSBC → HTTPS relay page → org.mifosx.openbanking://callback (mobile) or 127.0.0.1:8765 (desktop)"
        - "ConsentRedirectBus → RootNavScreen classifies SignIn leg → ConsentCallbackRoute"
        - "Validate state/nonce (single-use PendingAuth) → authorization_code exchange → PSU tokens in secure Settings"
        - "Poll consent status → Success → AuthenticatedGraph / Home"
    - id: consent-callback-failures
      screens: [ConsentCallback, Login]
      name: "Consent callback failures"
      type: error
      feature_ref: consent-callback
      steps:
        - "error=access_denied → AccessDeniedStep → back to Login"
        - "State/nonce mismatch or expired PendingAuth → SecurityErrorStep"
        - "No code → Error; still AwaitingAuthorisation → AwaitingStep"
        - "Duplicate redirect (activity recreate) suppressed by lastRoutedRedirect dedupe"
    - id: view-accounts
      screens: [Home, Accounts, AccountDetail, AccountHolder, ScheduledPayments, StandingOrders, DirectDebits, Beneficiaries, Product, Placeholder]
      name: "View accounts and account detail"
      type: happy
      feature_ref: home
      steps:
        - "Home loads accounts + balances"
        - "Home 'See all' (or Accounts tab) → Accounts list with type filters (FR-048)"
        - "Tap account → AccountDetailRoute(accountId)"
        - "Explore chips → transactions, statements, standing orders, direct debits, scheduled payments, beneficiaries, product, party, ATM (placeholder)"
    - id: browse-transactions
      screens: [Transactions, TransactionDetail]
      name: "Browse transactions"
      type: happy
      feature_ref: transactions
      steps: ["TransactionsRoute(accountId) → GET transactions", "Scroll → follow Links.Next", "Tap → TransactionDetailRoute"]
    - id: statements-download
      screens: [Statements, StatementDetail, TransactionDetail]
      name: "Statements and download"
      type: happy
      feature_ref: statements
      steps: ["StatementsRoute → GET statements", "Tap → StatementDetailRoute", "Download → GET statements/{id}/file (PDF, then CSV) → platform handler (no-op on web)", "Tap statement txn → TransactionDetailRoute"]
    - id: send-money
      screens: [Home, SendMoney, ConsentRelay, PaymentConsent, PaymentStatus, SendMoneyHistory]
      name: "Send money (single domestic/international payment)"
      type: happy
      feature_ref: send-money
      steps:
        - "Home → SendMoneyRoute: rail, payer (or bank chooses), payee, amount, currency, charge bearer, reference"
        - "Review → client_credentials (payments) → POST {domestic|international}-payment-consents (JWS + idempotency)"
        - "Signed authorize URL → browser → relay → Payment leg → PaymentConsentRoute"
        - "Exchange code → GET consent → GET funds-confirmation → POST payment"
        - "PaymentStatusRoute(paymentId) receipt; SendMoneyHistoryRoute"
    - id: payment-failure-recovery
      screens: [PaymentConsent, SendMoney, Home]
      name: "Payment failure and recovery"
      type: error
      feature_ref: payment-consent
      steps: ["Not yet authorised → Check again (bounded)", "Insufficient funds / revoked / JWS rejection (U019) → typed ErrorKind", "RestartAuthorisation or Abandon → authenticated graph"]
    - id: schedule-payment
      screens: [Home, SchedulePayment, ConsentRelay, PaymentConsent, PaymentStatus, SchedulePaymentHistory]
      name: "Schedule a future payment"
      type: happy
      feature_ref: payments-schedule-payment
      steps: ["Home → SchedulePaymentRoute; execution date; Review", "POST {domestic|international}-scheduled-payment-consents → authorize → relay → payment-consent", "POST scheduled-payments → PaymentStatus; history"]
    - id: standing-order
      screens: [Home, StandingOrder, ConsentRelay, PaymentConsent, PaymentStatus, StandingOrderHistory]
      name: "Set up a standing order"
      type: happy
      feature_ref: payments-standing-order
      steps: ["Home → StandingOrderRoute; frequency, amounts, dates; Review", "POST {domestic|international}-standing-order-consents → authorize → relay → payment-consent", "POST standing-orders → PaymentStatus; history"]
    - id: vrp
      screens: [VrpConsentList, VrpSetup, ConsentRelay, VrpCallback, VrpConsentDetail, VrpPayment]
      name: "Variable Recurring Payments"
      type: happy
      feature_ref: vrp
      steps:
        - "Home → VrpConsentListRoute → Setup"
        - "VrpSetup (per-payment + period limits, validity) → Review → POST domestic-vrp-consents → authorize"
        - "Relay → Vrp leg → VrpCallbackRoute → exchange code (VRP token session)"
        - "VrpConsentDetail → VrpPayment: POST domestic-vrps → GET status (funds-confirmation implemented but not called — gap)"
        - "Revoke from detail → DELETE domestic-vrp-consents/{id}"
    - id: manage-consent
      screens: [Settings, ConsentList, ConsentDetail, LoginRenew, Intro]
      name: "Manage and revoke AIS consent"
      type: happy
      feature_ref: consent-list
      steps: ["Settings → ConsentListRoute → ConsentDetailRoute", "Renew → LoginRenewRoute", "Revoke → confirm → DELETE consent → LoggedOut → AuthGraph"]
    - id: settings-licences
      screens: [Home, Settings, Licences]
      name: "Settings and licences"
      type: happy
      feature_ref: settings
      steps: ["Home avatar → SettingsRoute: theme, consents, privacy URL", "LicencesRoute → fetch LICENSE"]
    - id: expired-psu-token
      screens: [Home, LoginRenew]
      name: "Expired PSU token"
      type: edge
      feature_ref: home
      steps: ["AIS read 401 → refresh_token once → retry (RETRIED_AFTER_REFRESH guard)", "pisp/, consent and token calls excluded from PSU bearer injection"]
    - id: offline
      screens: [Home]
      name: "Offline"
      type: edge
      feature_ref: home
      steps: ["isOffline → indefinite snackbar; cached Room data via Store5"]
    - id: payments-hub
      screens: [PaymentsHub, SendMoney, SchedulePayment, StandingOrder, VrpConsentList, SendMoneyHistory]
      name: "Payments hub"
      type: happy
      feature_ref: payments-hub
      steps:
        - "Payments tab → PaymentsHub (FR-048)"
        - "Pick a product: Send money / Schedule a payment / Standing order / Sweeping (VRP)"
        - "History rows → product history → PaymentStatus"

