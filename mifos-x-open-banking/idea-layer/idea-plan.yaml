    - { step: 2, item: "High-severity defects DEF-001, DEF-002, DEF-003, DEF-004 + consent-relay on Cloudflare Pages (task cloudflare-pages-consent-relay, HSBC redirect URI re-registered)" }
    - { step: 3, item: "Navigation reachability FR-048 + sign-out FR-046 + manage-consents FR-047 + AIS 401/403 routing FR-049" }
    - { step: 4, item: "BLK-002 branding (/idea-branding) + BLK-003 store listing + about-legal screens" }
    - { step: 5, item: "iOS build + sandbox verification on a Mac" }
