      progress: "Certs issued and verified against the key; all 7 secrets in the mifos-x vault (registry group mifos-x-open-banking-project, project secrets-manifest.yaml); local private.key and transport.p12 deleted after checksum match. Public certs + CSR remain in ~/.config/mifos-x-open-banking/hsbc/."
      remaining:
        - "Register https://mifos-x-open-banking-relay.pages.dev/callback/ as the redirect URI on HSBC DevHub (human)"
        - "Move consumption from the app to the Worker bank gateway (task cloudflare-bank-gateway, phases 02 and 07)"
    - task: cloudflare-pages-consent-relay
      kind: platform-consolidation
      prompt: "Move the OAuth consent relay from personal GitHub Pages (obp-callback) into relay/ in openMF/mifos-x-open-banking, deploy to Cloudflare Pages (*.pages.dev) with _headers (CSP/HSTS/no-store/no-referrer/frame-ancestors), history scrub, App Links + Universal Links .well-known files; re-register the HSBC redirect URI; retire docs/consent-callback-page/"
      added_at: "2026-10-21T10:00:00Z"
      status: in-progress
      progress: "Deployed to https://mifos-x-open-banking-relay.pages.dev (relay/ in source, docs/consent-callback-page retired). 2026-10-22: Android App Links live (FR-052) — /.well-known/assetlinks.json lists org.mifosx.openbanking + org.mifosx.openbanking.demo.debug with the debug signing SHA-256 (Google Digital Asset Links API confirms both), manifest autoVerify filter on https://mifos-x-open-banking-relay.pages.dev/callback, so the bank redirect opens the app with no 'Reopen the app' tap; web return path (w<i>. state) live. Remaining: add the release / Play App Signing SHA-256 to assetlinks.json, iOS (ASWebAuthenticationSession already returns automatically, Universal Links optional), archive obp-callback."
      feature_ref: consent-relay
    - task: cloudflare-bank-gateway
      kind: platform-consolidation
      prompt: "Cloudflare Worker bank gateway (separate Worker mifos-x-open-banking-gateway on workers.dev, source in bank-gateway/ of the app repo): transport cert via mTLS certificate binding, signing key + identifiers as Worker secrets from the vault; performs every token grant, client assertion, OIDC request object and detached-JWS payment signature; verifies the id_token; keeps all HSBC tokens in Durable Objects and issues the app an opaque session (+ Play Integrity / App Attest on mobile); removes every certificate and key from app builds (NFR-010, NFR-013). Response mode stays fragment via the static relay."
      added_at: "2026-10-21T10:00:00Z"
      status: in-progress
      started_at: "2026-10-22T09:45:00Z"
      plan_ref: plan-layer/project-plans/mifos-x/mifos-x-open-banking/active/hsbc-identity-bank-gateway/
      decision_ref: TD-008
      phase_breakdown:
        - "01 idea-layer — this materialization"
        - "02 deploy + spike — bank-gateway/ scaffold, vault-driven deploy, mTLS + one signed payment consent from the deployed Worker, first CPU reading"
        - "03 Worker core — signer, client assertion, request object, detached JWS, id_token verification, route table, Durable Objects"
        - "04 AIS + auth — consent, /v1/auth/complete, account reads, statements, session gating, rate limits"
        - "05 PIS + VRP — six payment products and VRP with detached JWS"
        - "06 attestation — Play Integrity + App Attest"
        - "07 app cutover — core/network bank gateway client, delete on-device identity, web enabled, no-identity CI gate"
        - "08 docs + end-to-end — bank-gateway/docs, READMEs, final CPU report, device/desktop/web runs"
      requirement_refs: [NFR-010, FR-053, FR-054, FR-055, NFR-012, NFR-013]
