technical_decisions:
  _status: enriched
  _reapproval_reason: "/idea-plan-add 2026-10-22 — TD-008 Worker bank gateway shape, cloudflare-bank-gateway in progress, credentials task vaulted; earlier 2026-10-21 TD-007, TD-002 resolved, tasks[] added"
  _last_enriched: "2026-10-22"
  _approved_at: "2026-10-21"
  _approved_by: "user (matrix [A])"
  _source: source_analysis
  _quality_score: 95
  _enrichment_count: 1
  _last_updated: "2026-10-21"
  tradeoff_register:
    - id: TD-001
      topic: "Alpha dependencies (Store5 5.1.0-alpha08, Room 3.0.0-alpha05)"
      decision: "Keep (template-inherited); pin exact versions, track upgrades via the template retrain loop"
      risk: "Breaking API changes between alphas; KMP Room migrations"
    - id: TD-002
      topic: "Web cannot present an mTLS client certificate"
      options: ["(a) Web stays a UI/demo shell — current", "(b) Server-layer bank gateway terminates mTLS and signs requests (keys server-side)", "(c) Drop the web target"]
      decision: "(b) — a Cloudflare Worker bank gateway on the relay domain (decided 2026-10-21, see TD-007). It serves mobile + desktop + web, not just web: it is also the fix for NFR-010 (keys off device)."
      risk: "Moves the TPP's private keys to a server — needs its own security review; Workers mTLS cannot target a Cloudflare-proxied host (HSBC is not, verify before build)"
    - id: TD-003
      topic: "Three near-copy payment forms (send-money 802, schedule 899, standing-order 975-line ViewModels)"
      decision: "Extract shared core/payment-form (payer/payee pickers, amount + reference rules, date rules, review + staging) — fixes DEF-002 once"
      risk: "Large refactor across 3 features with ~420 tests; do behind green tests"
    - id: TD-004
      topic: "ASPSP hosts/paths hardcoded (authorize path in 5 repositories)"
      decision: "Config-driven AspspProfile (hosts, base path, financial id, supported products) — prerequisite for multi-ASPSP"
    - id: TD-005
      topic: "Two refresh-token implementations (OAuth.refreshToken without redirect_uri vs HSBCSandboxHttpClient.refreshAccessToken with it)"
      decision: "Unify on one TokenRefresher used by AIS and VRP"
    - id: TD-006
      topic: "Redirect scheme + loopback port duplicated across 6 files"
      decision: "Single source (gradle property → generated constants + manifest placeholders); bridge.js reads a query param"
    - id: TD-007
      topic: "Where the OAuth consent relay (and later the bank gateway) is hosted"
      options: ["(a) Cloudflare — Pages for the relay + Worker for the bank gateway, one domain", "(b) Supabase — Edge Functions", "(c) Keep personal GitHub Pages (thekalpeshpawar.github.io/obp-callback)"]
      decision: "(a) Cloudflare, permanently (user decision 2026-10-21 — no later migration)"
      rationale:
        - "Supabase Edge Functions rewrite text/html GET responses to text/plain — they cannot serve the relay page"
        - "Cloudflare Pages sets security headers via _headers and serves /.well-known App Links / Universal Links files on the same domain"
        - "Cloudflare Workers have a documented mTLS certificate binding for outbound fetch — the bank gateway can hold the transport cert server-side"
        - "Project has no Supabase backend (backend.provider: none) — one platform instead of two"
        - "A personal account controlling the registered redirect URI is a supply-chain risk"
      future_data_store: "If the app later needs a database: Cloudflare D1, or Supabase for data only — neither touches the relay/bank gateway"
      open_source: "Yes — relay + Worker code public under openMF (MPL-2.0); secrets only in Cloudflare secrets / mTLS bindings / the vault (RULE-SECRETS-VAULT-001)"
      repo: "openMF/mifos-x-open-banking/relay/ — versioned with the app so scheme/port/redirect constants never drift"
      domain: "*.pages.dev for now (user decision 2026-10-21); a branded domain later requires re-registering the HSBC redirect URI"
    - id: TD-008
      topic: "Shape of the Cloudflare Worker bank gateway (how TD-002b is built)"
      options: ["(a) Pass-through proxy — app still signs; keys stay in builds", "(b) Closed route-table gateway on a separate workers.dev Worker that alone holds the TPP identity", "(c) Journey-orchestration backend that also builds the OBIE bodies"]
      decision: "(b) — Worker mifos-x-open-banking-gateway (source bank-gateway/). ~45 declarative routes (anything else 404); mTLS certificate binding for the transport cert; one non-extractable PS256 WebCrypto key for client assertions, request objects and detached JWS; full id_token verification; all HSBC tokens in Durable Objects; the app holds an opaque session gated by bank login, plus Play Integrity (Android) and App Attest (iOS). Workers Free; hard cutover; reuse of the current never-exposed key. Decided 2026-10-22 (goal hsbc-identity-bank-gateway)."
      proven: "2026-10-22 phase 02 spike from the deployed Worker: client_credentials over the mTLS binding 200, signed domestic-payment-consent 201; per-route p99 CPU 8 ms for key import + 2 signatures (warm). Gotchas: upload the cert/key as plain PEM (pkcs12 Bag Attributes make the binding fail with an empty 500); JWS iss = signing-cert DN (DEF-015)."
      risk: "Workers Free 10 ms CPU per request on signed and attestation routes (measured in phase 02; Workers Paid is the documented fallback; cold-isolate requests reached 12 ms Worker-wide). HSBC must accept mTLS from Cloudflare egress (proven in phase 02). The Worker signs payment bodies the app built — mitigated by session-owned consent checks and PSU approval at the bank."
      rationale:
        - "HSBC access tokens are certificate-bound, so once the transport cert lives on Cloudflare only the Worker can use PSU tokens — token custody follows the cert"
        - "A closed route table keeps the server surface auditable; the app keeps its OBIE models and method shapes, so only core/network and core/data constructors change"
        - "(c) would rewrite ~15 core/data repositories into TypeScript for a sandbox reference app"
  tasks:
    - task: hsbc-sandbox-credentials
      kind: build-config
      prompt: "HSBC DevHub sandbox project (UK/Europe) — CSR generated 2026-10-21 (RSA-2048/SHA-256, subject O=Mifos Initiative, L=Seattle, C=US, organizationIdentifier=PSDUS-SANDBOX-MIFOS, CN=mifos.org); upload CSR, receive transport + signing certs, register redirect URI https://mifos-x-open-banking-relay.pages.dev/callback/"
      added_at: "2026-10-21T11:10:00Z"
