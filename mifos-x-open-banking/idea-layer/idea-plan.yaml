      backend_provider: rest
      platform_targets: [android, ios, desktop, web]
      kmp_arch: "stream-first@latest"

  layers:
    _tag: "§layers"
    _status: draft
    _quality_score: 85
    _source: wizard
    content:
      enabled: [idea, design-spec, server, client, feature, infrastructure, platform, testing, release]
      disabled: []
      auto_derived: true
      suggestion_source: source_analysis
      layer_rationale:
        server:
          status: enabled
          reason: "Holds CLIENT contracts for the external HSBC AIS API (Ktorfit interfaces) — no owned DB."
          can_enable_later: true
        platform:
          status: enabled
          reason: "expect/actual for mTLS, secure storage, and app-to-app redirect handling."

  release_plan:
    _tag: "§release_plan"
    _status: draft
    _quality_score: 72
    _source: wizard
    content:
      milestones:
        - version: "0.1.0"
          features: [consent-onboarding, consent-dashboard, accounts, balances, transactions]
        - version: "0.2.0"
          features: [beneficiaries, standing-orders, direct-debits, scheduled-payments]
        - version: "0.3.0"
          features: [statements, product, account-holder, settings, licences]
      epic_breakdown:
        - epic_name: "FAPI consent + core account information"
          features: [consent-onboarding, consent-dashboard, accounts, balances, transactions]
          milestone_ref: "0.1.0"
        - epic_name: "Payments-context read surfaces"
          features: [beneficiaries, standing-orders, direct-debits, scheduled-payments]
          milestone_ref: "0.2.0"
        - epic_name: "Statements, product, account holder & settings"
          features: [statements, product, account-holder, settings, licences]
          milestone_ref: "0.3.0"
      # Reverse-synced 2026-07-28: multi-currency and atm-locator dropped from 0.3.0 —
      # neither was built. settings + licences moved in, since both ship.

  release_phases:
    _tag: "§release_phases"
    _status: draft
    _quality_score: 70
    _source: wizard
    content:
      phases:
        # Reverse-synced 2026-07-28: statuses reflect what is actually built in source.
        - id: P0
          label: "MVP — Consent + core account information"
          flows: [onboarding-consent, account-browsing, transaction-review, consent-management, settings-and-profile, consent-expired]
          target_features: [consent-onboarding, consent-dashboard, accounts, balances, transactions, settings, licences]
          status: implemented
          derived_by: claude-subagent
          sync_note: "profile dropped — never built. licences added — ships in source."
        - id: P1
          label: "Payments-context read surfaces"
          flows: [recurring-and-statements]
          target_features: [beneficiaries, standing-orders, direct-debits, scheduled-payments]
          status: implemented
          dependencies: [P0]
          derived_by: claude-subagent
        - id: P2
          label: "Statements, product & account holder"
          flows: []
          target_features: [statements, product, account-holder]
          status: implemented
          dependencies: [P1]
          derived_by: claude-subagent
          sync_note: "multi-currency, atm-locator and pfm dropped — none were built. The pfm-review flow was removed with its screens."
        - id: P3
          label: "PISP — payments hub + the three domestic rails"
          flows: [payments-hub, pay-domestic-single, pay-domestic-scheduled, pay-domestic-standing-order]
          target_features: [payments, pay-domestic-single, pay-domestic-scheduled, pay-domestic-standing-order, payment-consent, payment-status]
          status: planned
          dependencies: [P2]
          derived_by: /idea-sync
          scaffolded_at: "2026-07-30"
          rescoped_at: "2026-08-06"
          note: >-
            The app's first WRITE phase — P0 through P2 are entirely read-only AIS. Rescoped
            2026-08-06 from "domestic single only" to the hub plus all three domestic rails,
            because the shared prerequisites below are the real cost and they are paid once for
            all seven types. The three domestic rails are the cheapest place to prove the
            plumbing: SortCodeAccountNumber on both sides, no FX, and a charge model that is a
            flat 0.05 GBP. Without the JWS signer every write returns 400 U019, so nothing in P3
            can be device-verified until it lands.
          prerequisites:
            - "core/network/api/Pisp.kt — Ktorfit interface for the 32 PISP endpoints"
            - "Detached JWS (PS256, b64:false + crit) extending the shipped signPs256"
            - "x-idempotency-key generation, persisted across retries of a staged payment"
            - "payments-scope client-credentials token path (OAuth.kt mints accounts scope only)"
            - "A shared debtor-eligibility filter keyed on the account's scheme, not its product (FR-018)"
            - "A shared status mapper covering the four ladders and both v4.0/v3.1 encodings (FR-021)"

        - id: P4
          label: "PISP — the three international rails"
          flows: [pay-international-single, pay-international-scheduled, pay-international-standing-order]
          target_features: [pay-international-single, pay-international-scheduled, pay-international-standing-order]
          status: planned
          dependencies: [P3]
          derived_by: /idea-sync
          scaffolded_at: "2026-08-06"
          note: >-
            Separated from P3 because the international rails add a distinct field contract on
            top of working plumbing — IBAN creditors, mandatory CurrencyOfTransfer and
            ChargeBearer, forbidden RemittanceInformation, 11-character BICs — plus an FX story
            the standard does not actually define for recurring instructions. Nothing here is
            reachable until P3's signer and status mapper are proven.
          prerequisites:
            - "IBAN entry + validation, and an 11-character BIC field (8-character BICs are refused)"
            - "A charge-bearer choice surface (BorneByCreditor | Shared | BorneByDebtor all stage 201)"

        - id: P5
          label: "PISP — VRP mandates + event notification"
          flows: [pay-vrp-mandate]
          target_features: [pay-vrp-mandate]
          status: planned
          dependencies: [P4]
          derived_by: /idea-sync
          scaffolded_at: "2026-08-06"
          note: >-
            Last because VRP inverts nearly every assumption the other six share: the consent is
            long-lived rather than single-use, funds-confirmation is a POST carrying an amount,
            there is a DELETE, the status encoding is the v3.1 long form, and revocation leaves
            the consent GET returning 400 forever. It also needs the event-polling surface, which
            no other feature uses. Building it on top of six proven rails is far cheaper than
            discovering these divergences while the plumbing is still unproven.
          prerequisites:
            - "ControlParameters editor incl. pro-rated first-period disclosure"
            - "A local mandate record that survives the consent GET returning 400 U011 after revoke"
            - "Event subscription + polling for UK.OBIE.Consent-Authorization-Revoked"

# ═══════════════════════════════════════════════════════════════════
# NETWORK POLICY
# ═══════════════════════════════════════════════════════════════════
network_policy:
  default: cellular_allowed
  large_download_threshold_kb: 500

# ═══════════════════════════════════════════════════════════════════
# DEFERRED ROUTES  (RULE-IMPL-NAVIGATION-CONNECTED-001 NAV-2)
# ═══════════════════════════════════════════════════════════════════
# Routes that ship in cmp-navigation but resolve to PlaceholderScreen. Declaring
# them here is what makes the deferral an explicit product decision rather than
# dead code, and exempts them from NAV-1.
#
# Added 2026-07-31: account-detail/ui.yaml drove the AtmLocator chip through a
# project-local `target: _placeholder:atm-locator` string. That prefix is not a
# registered framework convention — no evaluator recognises it, so the target was
# simultaneously unresolvable to the dead-nav gate and invisible to NAV-2. The
# declaration below is the sanctioned form; the ui.yaml target now points at it.
deferred_routes:
  - feature: account-detail
    route_class: AtmLocatorRoute
    reason: >-
      Chip renders and navigates, but resolves to PlaceholderScreen("ATM locator")
      in cmp-navigation because no feature module implements atm-locator.
      AtmLocatorRoute is an arg-less data object — no accountId is passed.
    target_milestone: unscheduled
    reconciled:
      at: "2026-08-04"
      by: /idea-sync
      note: >-
        The prior reason stated the atm-locator idea-layer screen "was removed in the 2026-07-28
        reverse sync". That is no longer true — screens/atm-locator/ is present in the 46-feature
        roster and was enriched this run with action_contract blocks on its three result rows.
        The DEFERRAL still stands, but on the surviving half of the original justification: the
        absent feature module, not an absent spec.

# ═══════════════════════════════════════════════════════════════════
# SHIP GATE
# ═══════════════════════════════════════════════════════════════════
ship_gate:
  requires_converge: true
  requires_smoke_run: false
  coverage_threshold: 80
  max_staleness_hours: 24
  requires_behavior_verification: true
  permission_codegen_platforms: [android, ios]

# ═══════════════════════════════════════════════════════════════════
# /idea-agent CONFIGURATION
# ═══════════════════════════════════════════════════════════════════
agent:
  approve_quality_threshold: 95
  max_token_budget: null
  max_iterations: 100
  t3_self_heal_enabled: true
