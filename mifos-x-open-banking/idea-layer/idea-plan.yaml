        iOS bundle certs/ + compiled-in p12 password). Anyone who unpacks a public build can act as the TPP.
        A public store release requires the Cloudflare Worker bank gateway (NFR-010) first — or the release stays a
        developer sandbox build. Release-order decision pending (see release_2026_11_0_order note).
