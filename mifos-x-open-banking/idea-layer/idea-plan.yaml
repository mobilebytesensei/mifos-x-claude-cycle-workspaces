# DESIGN READ
# ═══════════════════════════════════════════════════════════════════
design_read:
  _schema_version: "1.0"
  # ── REFRESHED 2026-08-07 (/idea-sync), ahead of a /design-system regeneration ──
  # The previous reading described an ACCOUNT-INFORMATION app and was inferred 2026-06-29.
  # It pre-dated the PISP scope reversal (2026-07-30), the seven-type payments rewrite
  # (2026-08-06), branch-locator and the Open Data product catalogue (2026-08-07). Regenerating
  # the design system from that reading would have produced a system for an app two major
  # capabilities out of date. Brand constraints are UNCHANGED — only the reading of what the
  # app now IS has moved.
  reading: >-
    Trustworthy UK Open Banking app that both READS account data and INITIATES payments across
    seven distinct rails; calm, secure, data-legible retail banking; minimalist Material 3,
    accessibility-first regulated fintech. The payment surface is the design challenge: seven
    rails that differ irreconcilably (immediate vs dated vs recurring vs mandate) must read as
    one coherent family without a generic form flattening their real differences, and money
    movement is irreversible in a way account reading never is.
  page_kind: consumer-mobile
  audience: >-
    UK retail bank customers (PSUs) sharing account data and making payments, plus Open Banking
    developers/reviewers evaluating full AISP + PISP capability.
  vibe_language: "trustworthy, calm, secure, clear, minimalist, data-legible, regulated, deliberate"
  aesthetic_family: minimalist-ui
  dials:
    variance: 3
    motion: 2
    density: 5
  brand_constraints:
    accent_color: "#266489"
    typography: "Roboto"
    theme: auto
    radius_system: soft
  quiet_constraints: [accessibility-first, regulated-industry, irreversible-actions]
  # ── What the design system must now account for, added 2026-08-07 ──
  surfaces_added_since_last_inference:
    payment_initiation:
      rails: 7
      note: >-
        Domestic and international × single/scheduled/standing-order, plus domestic VRP. They
        share a visual family but NOT a form: the amount field differs by rail and the two
        shapes are mutually exclusive, international refuses a reference field entirely, only
        the two single-payment rails have funds confirmation, and VRP is a long-lived mandate
        rather than a one-shot instruction.
      design_consequences:
        - "A payment disposition is NOT a boolean, and it is NOT a triad — in-progress / terminal-success / terminal-failure / instruction-established, and none may shout louder than the others."
        - "ACSP means accepted-not-settled. No visual treatment may read as 'sent' or 'paid' at that state."
        - >-
          instruction-established (INCO) is the fourth disposition, added 2026-08-07. It is the
          TERMINAL status of all four deferred families, and the triad had nowhere true to put
          it: terminal-success renders a success tick on an instruction whose first payment has
          not happened and may be months away, and letting the fail-open rule catch it renders a
          standing order as perpetually in-progress, implying live activity on something dormant.
          Its treatment is deliberately NEUTRAL rather than tonal — surfaceVariant /
          onSurfaceVariant, icon event_repeat, never a tick and never a clock. A hue-less
          treatment makes no claim about money, which is exactly the claim available.
        - "Deferred rails have NO per-execution status, so nothing may imply a mandate has 'paid'. The label names the INSTRUCTION — 'Standing order set up', never 'Paid'."
        - "A VRP mandate can be simultaneously authorised and incapable of paying — health is not a function of consent status."
    open_data:
      surfaces: [atm-locator, branch-locator, products]
      note: >-
        Unauthenticated, reachable with no session or consent. These are the only screens a
        prospective customer can see before connecting anything, and they must NOT render
        sign-in prompts or session-expired states — those states cannot occur there.
  _last_inferred_at: "2026-08-07T00:00:00Z"
  _previous_inference: "2026-06-29T00:00:00Z (AIS-only reading, superseded)"
  _signal_sources: [PROJECT_CONFIG.yaml, "idea-plan.identity.one_liner", "OB-standards research", "HSBC AIS catalogue", "HSBC PISP capture corpus (pisp-tests/captures, 289 scenarios)", "HSBC Open Data swaggers + live captures (api.hsbc.com)", "material-theme/ui/theme (Material Theme Builder export — seed primary #266489)"]

