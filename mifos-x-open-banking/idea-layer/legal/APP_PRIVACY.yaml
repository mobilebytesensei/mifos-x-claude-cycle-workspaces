# Apple App Store Privacy Nutrition Labels — Mifos-X Open Banking
# Platform: iOS (KMP - cmp-ios module)
# Schema: Apple App Privacy Declaration (App Store Connect format)
# Last updated: 2026-05-30

app:
  name: Mifos-X Open Banking
  bundle_id: org.mifos.openbanking
  apple_id: TBD                        # assigned on App Store Connect submission
  version_applicable: "1.0.0+"

# ─── Privacy Practices Overview ──────────────────────────────────────────────

privacy_practices:
  # Does the app collect data?
  collects_data: true

  # Does the app track users across apps/websites owned by other companies?
  tracks_users: false
  tracking_notes: "No third-party advertising networks or cross-app tracking SDKs on iOS. Firebase is Android-only."

# ─── Data Used to Track You ──────────────────────────────────────────────────
# Data linked to your identity, used to track you across apps and websites

data_used_to_track_you: []            # None — Firebase (Crashlytics/Performance) is Android-only; no iOS tracking

# ─── Data Linked to You ──────────────────────────────────────────────────────
# Data collected and linked to your Apple ID / user identity

data_linked_to_you:

  - category: financial_info
    data_types:
      - bank_account_numbers
      # Retained 2026-08-07 despite the cards / card-detail screens being deleted. This
      # declaration is about DATA the app receives, not about screens that display it: a card is
      # an Account whose SchemeName is UK.OBIE.PAN, so masked PAN data still arrives in the
      # accounts list, and the transactions resource returns the PAN UNMASKED (see
      # IDEA.md#backend-integration). Removing this category would under-declare.
      - credit_card_info           # Masked PAN + expiry, received as account identification
      - transaction_history
    purposes:
      - app_functionality          # Core banking services — account view, transactions, payments
    notes: >-
      Accessed from the user's own bank via the UK Open Banking (OBIE v4.0) API, under a
      consent the user grants at the bank, and cached locally. Not shared with third parties.

  - category: contact_info
    data_types:
      - name
      - email_address
    purposes:
      - app_functionality
    notes: >-
      Account holder details read from the bank's OBIE party resource, and only when the
      ReadParty permission is in the granted consent. phone_number and address were dropped
      2026-08-02 — they existed only for the field-officer KYC workflow, which no longer exists.

  - category: identifiers
    data_types:
      - user_id                    # Bank-issued consent identifier
    purposes:
      - app_functionality
    notes: >-
      The consent identifier issued by the bank, used to manage and revoke the data-sharing
      session. There is no app-level user account. Not used for advertising.

  - category: credentials
    data_types:
      - auth_credentials           # OAuth access/refresh token scoped to the consent — NOT a password
    purposes:
      - app_functionality
    notes: "Session token stored in iOS Keychain. Password is never stored."

# ─── Data NOT Linked to You ──────────────────────────────────────────────────
# Data collected but not linked to your identity

data_not_linked_to_you:
  # Firebase is Android-only — no crash or performance data collected on iOS
  # App activity data on iOS is limited to local analytics not shared with third parties
  []

# ─── No Data Collected ───────────────────────────────────────────────────────

no_data_collected_categories:
  - health_and_fitness             # No health data
  - location                       # ATM locator uses HSBC Open Data; no device GPS collected
  - sensitive_info                 # No biometrics, race, religion, sexual orientation
  - contacts                       # No device address book access
  - photos_and_videos              # No camera or photo library (except KYC document upload — see below)
  - audio                          # No microphone
  - gameplay_content               # N/A
  - search_history                 # N/A
  - browsing_history               # No in-app browser
  - diagnostics                    # Firebase = Android only; no iOS diagnostics collected

# ─── Photos / Camera ─────────────────────────────────────────────────────────
# Removed 2026-08-02: the only camera / photo-library access was KYC identity-document
# upload in the field-officer persona, which no longer exists. This app requests no
# camera or photo-library permission and collects no photos or videos.

# ─── Privacy Policy URL ──────────────────────────────────────────────────────

privacy_policy_url: "https://mifos.org/privacy-policy"

# ─── App Store Connect Submission Notes ──────────────────────────────────────

submission_notes:
  - "Firebase Crashlytics and Firebase Performance Monitoring are Android-only. These SDKs are not compiled into the iOS (cmp-ios) build. Declare NO crash data or performance telemetry for iOS."
  - "App does NOT use AppTrackingTransparency (ATT) — no cross-app tracking on iOS."
  - "Session tokens stored in iOS Keychain (encrypted by Secure Enclave)."
  - "App is categorized as Finance > Banking. Apple review note: this is a UK Open Banking (OBIE v4.0) client and requires enrolled HSBC sandbox certificates for full functionality. Sandbox endpoint: https://secure.sandbox.ob.hsbc.co.uk"
  - "The App has NO password field. Authentication is FAPI 1.0 Advanced — the user authenticates on HSBC's own site and the App receives only a scoped token. Reviewers testing sign-in will be redirected out of the app; that is the intended flow, not a defect."
  - "Sandbox credentials for App Store review: provide enrolled test certificates and a sandbox PSU login in review notes — never in the App binary."
  - "Age rating: 4+ (banking app — no violent or adult content; age-gated at account level by banking institution)."
