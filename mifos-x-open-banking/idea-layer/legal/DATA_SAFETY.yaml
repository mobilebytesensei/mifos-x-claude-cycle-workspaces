# Google Play Data Safety Form — Mifos-X Open Banking
# Platform: Android (KMP - cmp-android module)
# Form version: Google Play Data Safety Schema 2024
# Last updated: 2026-05-30

app:
  name: Mifos-X Open Banking
  package: org.mifos
  version_applicable: "1.0.0+"

# ─── Section 1: Data Collection and Sharing ──────────────────────────────────

data_collection_and_sharing:
  collects_or_shares_data: true
  data_encrypted_in_transit: true
  users_can_request_deletion: true

# ─── Section 2: Data Types ────────────────────────────────────────────────────

data_types:

  # --- Financial Info ---
  financial_info:
    - type: bank_account_number
      collected: true
      shared: false
      required_or_optional: required
      purposes:
        - app_functionality          # Display account overview, transactions
      ephemeral: false               # Cached locally in encrypted Room KMP DB
      user_visible_notes: "Account numbers are masked (last 4 digits shown). Read from your own bank under a UK Open Banking consent you grant at the bank; not transmitted to any party other than your bank."

    - type: credit_debit_card_number
      collected: true
      shared: false
      required_or_optional: optional  # Only for Consumer persona card management
      purposes:
        - app_functionality          # Card management screen
      ephemeral: false
      user_visible_notes: "Card numbers are masked on account records. Read from your own bank under a UK Open Banking consent, and only where the ReadPAN permission was granted."

    - type: purchase_history
      collected: true
      shared: false
      required_or_optional: optional
      purposes:
        - app_functionality          # Transaction history, spending summary
      ephemeral: false
      user_visible_notes: "Transaction data cached locally for offline access. Cleared on logout."

    - type: other_financial_info
      description: "Account balances, standing orders, beneficiary details, FX rates"
      collected: true
      shared: false
      required_or_optional: optional
      purposes:
        - app_functionality
      ephemeral: false

  # --- Personal Info ---
  personal_info:
    - type: name
      collected: true
      shared: false
      required_or_optional: required
      purposes:
        - app_functionality          # Profile display
      ephemeral: false

    - type: email_address
      collected: true
      shared: false
      required_or_optional: optional
      purposes:
        - app_functionality          # Profile display
      ephemeral: false

    - type: user_ids
      description: "Bank-issued consent identifier, Firebase Installation ID (anonymous). There is no app-level user account."
      collected: true
      shared: false
      required_or_optional: required
      purposes:
        - app_functionality          # Session management
        - analytics                  # Firebase crash/performance aggregation (anonymous)
      ephemeral: false

    # address + phone_number entries removed 2026-08-02: both existed only for the
    # field-officer KYC onboarding workflow, which no longer exists. This app collects
    # no third-party customer personal data.

  # --- Authentication ---
  authentication:
    - type: auth_or_account_credentials
      description: "OAuth access and refresh tokens scoped to the consent, obtained after you authenticate at your bank. The app never receives or stores a password."
      collected: true
      shared: false
      required_or_optional: required
      purposes:
        - app_functionality
      ephemeral: false
      storage: "Encrypted Room KMP datastore (Android Keystore); cleared on logout"
      user_visible_notes: "Your password is never stored. Only the session token is retained."

  # --- App Activity ---
  app_activity:
    - type: crash_logs
      collected: true
      shared: true
      required_or_optional: optional
      purposes:
        - analytics                  # Firebase Crashlytics crash reports
      third_party_sharing:
        - provider: Firebase Crashlytics (Google LLC)
          purpose: Crash diagnostics and app stability monitoring
          pii_included: false
          notes: "Stack traces only — no account numbers, tokens, or financial data"
      ephemeral: false

    - type: app_interactions
      description: "Screen rendering performance metrics, cold start time"
      collected: true
      shared: true
      required_or_optional: optional
      purposes:
        - analytics
      third_party_sharing:
        - provider: Firebase Performance Monitoring (Google LLC)
          purpose: App performance optimization
          pii_included: false
          notes: "Network URL slugs only — auth tokens and query parameters are stripped"
      ephemeral: false

    - type: other_app_performance_data
      description: "Network request latency (anonymized), frame timing"
      collected: true
      shared: true
      required_or_optional: optional
      purposes:
        - analytics
      third_party_sharing:
        - provider: Firebase Performance Monitoring (Google LLC)
          purpose: Performance monitoring
          pii_included: false
      ephemeral: false

  # --- Device or Other IDs ---
  device_or_other_ids:
    - type: device_or_other_ids
      description: "Firebase Installation ID (anonymous, per-device)"
      collected: true
      shared: true
      required_or_optional: optional
      purposes:
        - analytics                  # Aggregate crash + performance telemetry
      third_party_sharing:
        - provider: Firebase (Google LLC)
          purpose: Crash and performance aggregation
          pii_included: false
      ephemeral: false

# ─── Section 3: Security Practices ───────────────────────────────────────────

security_practices:
  data_encrypted_in_transit:
    applies: true
    notes: "All bank API calls use mutual TLS (mTLS, TLS 1.2+) under the FAPI 1.0 Advanced profile; payment writes are additionally signed with a detached JWS. Firebase SDKs use TLS."

  data_encrypted_at_rest:
    applies: true
    notes: "Room KMP database encrypted via Android SQLCipher / Keystore. Session tokens via Android Keystore."

  users_can_request_data_deletion:
    applies: true
    how: "Revoking the Open Banking consent — in this app or in your bank's app — stops all data access immediately and clears the cached data and tokens. Logging out has the same local effect. For deletion of data held by the bank itself, contact the bank. Email privacy@mifos.org for Firebase telemetry deletion requests."

  follows_families_policy:
    applies: false
    reason: "Banking app — adults only (18+). Not directed at children."

  independent_security_review:
    applies: false
    notes: "No third-party security audit of this version. Deploying institutions are responsible for their security posture."

# ─── Section 4: Data Safety Summary Labels ───────────────────────────────────
# These map directly to Google Play Console Data Safety form checkboxes

google_play_form:
  # Q1: Does your app collect or share any of the required user data types?
  collects_or_shares: true

  # Q2: Is all of the user data collected by your app encrypted in transit?
  all_data_encrypted_in_transit: true

  # Q3: Do you provide a way for users to request that their data is deleted?
  deletion_request_mechanism: true
  deletion_instructions_url: "https://mifos.org/privacy-policy#your-rights"

  # Data safety section short description (50 words max for Play Console)
  short_description: >
    Mifos-X Open Banking reads your account data and initiates payments through your
    bank's UK Open Banking API, under a consent you grant at your bank. It never asks
    for your banking password. Crash and performance diagnostics are collected via
    Firebase on Android only — no financial data is included. All data is encrypted in
    transit and at rest, and you can revoke access at any time.
