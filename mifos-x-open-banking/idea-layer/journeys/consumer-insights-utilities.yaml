id: consumer-insights-utilities
version: "1.0.0"
name: "Consumer Insights & Utilities"
description: "Consumer reviews recent transactions, checks FX rates before a transfer, locates a nearby ATM, browses banking products, and reviews notifications."

persona:
  archetype: "returning consumer"
  jtbd: "review my recent spending and find the best way to send money abroad"
  context: "planning a transfer abroad, wants to check rates and recent activity first"
  knowledge_level: familiar
  emotional_state: "curious"

goal: "Review recent transactions, check FX rates, and locate a nearby ATM within one session."

success_metric:
  name: intl_payment_activation_rate
  kind: activation
  target: ">=60% of consumers who open the payments hub proceed to an international payment form"
  measurement: "analytics: payments_hub_opened → intl_type_tile_tapped event count"
  # Retargeted 2026-08-06. The old metric measured fx_rates_opened → send_money_opened. The
  # fx-rates screen has NO OBIE data source (there is no FX rate endpoint) and is flagged as a
  # deletion candidate, so a funnel that starts there measures a surface that may not survive.

screen_sequence:
  - screen_id: transactions_content
    feature_id: transactions
    state: content
    user_intent: "review recent spending activity"
    success_signal: "transaction list loaded"
  # fx_rates_main removed from the sequence 2026-08-06. OBIE exposes no FX rate endpoint, so
  # "live FX rates visible" is not a signal this app can produce. The screen is flagged as
  # orphaned pending a deletion decision.
  - screen_id: payments
    feature_id: payments
    state: content
    user_intent: "pay someone abroad"
    success_signal: "taps the International single tile"
  - screen_id: pay-international-single
    feature_id: pay-international-single
    state: content
    user_intent: "enter the IBAN, amount and transfer currency"
    success_signal: >-
      form accepts an IBAN creditor and a transfer currency distinct from the instructed one;
      states that the bank sets the final converted amount rather than showing a rate
  - screen_id: atm_locator_main
    feature_id: atm-locator
    state: content
    user_intent: "find the nearest ATM"
    success_signal: "map loaded with ATM pins"
  - screen_id: products
    feature_id: products
    state: content
    user_intent: "browse available banking products"
    success_signal: "product catalogue visible"
  - screen_id: notifications
    feature_id: notifications
    state: content
    user_intent: "check recent bank notifications"
    success_signal: "notification list loaded"

expected_outcome: "Consumer has reviewed recent transactions, started an international payment, located an ATM, and browsed their account's product terms."

flows:
  - feature_id: transactions
    flow_id: consumer-banking
    role: primary
  - feature_id: payments
    flow_id: consumer-banking
    role: primary
  - feature_id: pay-international-single
    flow_id: consumer-banking
    role: primary
  - feature_id: atm-locator
    flow_id: consumer-banking
    role: primary

capabilities_used: [has_ui, has_api]

tier: medium

preconditions:
  - "user is authenticated as consumer"
  - "device is online"
  - "location permissions granted (ATM locator)"

failure_modes:
  - cause: "location permission denied"
    recovery_screen: atm_locator_main
    notes: "Shows empty state with permission request CTA"
  - cause: "IBAN fails its local checksum"
    recovery_screen: pay-international-single
    notes: "Inline validation on the Recipient step, before any request is sent."
  - cause: "an 8-character BIC is pasted"
    recovery_screen: pay-international-single
    notes: >-
      Blocked locally. 8 characters is the form most bank directories publish and the form
      HSBC refuses — catching it here avoids an Invalid Bank Code the PSU cannot act on.
  # "FX rate API unavailable" removed 2026-08-06 with the fx-rates screen. There is no FX rate
  # API in OBIE to be unavailable, and no cached rate to fall back on.

tags: [consumer, transactions, payments, atm, products, notifications]
deprecated: false
