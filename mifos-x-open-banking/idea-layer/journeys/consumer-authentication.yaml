id: consumer-authentication
version: "1.0.2"
name: "Consumer Authentication"
description: "Retail banking consumer launches the app for the first time or returns after session expiry — authenticates and lands on the home dashboard."

persona:
  archetype: "first-time consumer"
  jtbd: "securely sign in to access my bank account on my mobile device"
  context: "at home or on the go, freshly installed or returning after logout"
  knowledge_level: novice
  emotional_state: "anxious"

goal: "Navigate from app launch through authentication to a populated home dashboard."

success_metric:
  name: consumer_login_completion
  kind: task_completion
  target: ">=95% of sessions reach home after entering credentials"
  measurement: "funnel: splash_shown → login_submitted → home_content_loaded"

screen_sequence:
  - screen_id: splash
    feature_id: splash
    state: loading
    user_intent: "wait for app to initialise"
    success_signal: "splash transitions automatically"
  - screen_id: login
    feature_id: login
    state: content
    user_intent: "enter credentials and sign in"
    success_signal: "taps Sign In, navigates to home"
  - screen_id: home_content
    feature_id: home
    state: content
    user_intent: "see account summary"
    success_signal: "home dashboard loads with balance widgets"

expected_outcome: "User has an authenticated session and sees their account summary on the home screen."

flows:
  - feature_id: splash
    flow_id: app-main
    role: primary
  - feature_id: login
    flow_id: app-main
    role: primary
  - feature_id: home
    flow_id: consumer-banking
    role: primary

capabilities_used: [is_auth_feature, has_ui]

tier: maximum

preconditions:
  - "app is installed"
  - "device is online"
  - "the PSU holds an HSBC sandbox account and can authenticate on HSBC's own site"
  - "the app's mTLS transport certificate and signing key are provisioned"

failure_modes:
  # "wrong credentials" removed 2026-08-06 — the app has no credential fields. A bad password
  # is rejected by HSBC on HSBC's site, and this app never sees it.
  - cause: "PSU abandons authorisation at HSBC"
    recovery_screen: login
    notes: "No token is issued and no consent is authorised. Restart the journey."
  - cause: "PSU denies the consent at HSBC"
    recovery_screen: login
    notes: "Consent reaches Rejected. Offer a fresh consent, not a retry of the denied one."
  - cause: "redirect state or nonce mismatch"
    recovery_screen: login
    notes: >-
      Rejected BEFORE the single-use authorisation code is spent. Restart the journey — the
      code cannot be reused.
  - cause: "network offline"
    recovery_screen: login
    notes: "Error toast; retry button"
  - cause: "bank endpoint unreachable"
    recovery_screen: login
    notes: "Error message with retry CTA"
  - cause: "mTLS handshake fails (certificate missing, expired or not enrolled)"
    recovery_screen: login
    notes: >-
      Not user-recoverable — a deployment fault. Surface a support reference rather than a
      Retry, because retrying cannot fix it.

tags: [auth, consumer, onboarding]
deprecated: false
