id: consumer-profile-settings
version: "1.0.1"
name: "Consumer Profile & Settings"
description: "Consumer updates their profile, changes their password, manages open banking consent, and accesses app information."

persona:
  archetype: "returning consumer"
  jtbd: "keep my account secure and manage which third-party apps can access my data"
  context: "received a security notification or wants to review data sharing permissions"
  knowledge_level: expert
  emotional_state: "focused"

goal: "Update password and review consent grants for connected apps within one session."

success_metric:
  name: settings_task_completion
  kind: task_completion
  target: ">=90% of users who start password change complete it"
  measurement: "funnel: change_password_opened → password_change_success_event"

screen_sequence:
  - screen_id: profile
    feature_id: profile
    state: content
    user_intent: "view and edit personal profile details"
    success_signal: "profile details visible"
  - screen_id: settings
    feature_id: settings
    state: content
    user_intent: "access account settings"
    success_signal: "settings list loaded"
  # change-password removed 2026-08-06 — there is no in-app password under FAPI. The PSU
  # authenticates at HSBC, so there is no credential this app could change.
  - screen_id: consent-manager
    feature_id: consent-manager
    state: content
    user_intent: "review and revoke open banking consent"
    success_signal: "consent grants listed with revoke option"
  - screen_id: about
    feature_id: about
    state: content
    user_intent: "see app version and legal information"
    success_signal: "about page loaded"
  - screen_id: privacy-policy
    feature_id: privacy-policy
    state: content
    user_intent: "read the app's privacy policy and understand how personal data is collected and used"
    success_signal: "privacy policy document loaded with GDPR compliance banner visible"
  - screen_id: terms-of-service
    feature_id: terms-of-service
    state: content
    user_intent: "review the terms of service governing use of the app"
    success_signal: "terms of service document loaded with all sections visible"
  - screen_id: licences
    feature_id: licences
    state: content
    user_intent: "view the open-source licence for the libraries used in the app"
    success_signal: "the bundled MPL licence text is rendered"

expected_outcome: "Consumer has updated their password, reviewed open banking consent grants, and is back on the settings screen."

flows:
  - feature_id: settings
    flow_id: consumer-banking
    role: primary
  - feature_id: profile
    flow_id: app-main
    role: branch
  - feature_id: consent-manager
    flow_id: consumer-banking
    role: branch

capabilities_used: [is_auth_feature, has_ui, has_api]

tier: maximum

preconditions:
  - "user is authenticated as consumer"
  - "device is online"

failure_modes:
  - cause: "consent revoke API error"
    recovery_screen: consent-manager
    notes: "Error toast; consent remains active"
  - cause: "consent already revoked at the bank"
    recovery_screen: consent-manager
    notes: >-
      Not an error. Reflected from the event poll (UK.OBIE.Consent-Authorization-Revoked) or
      from the next resource call returning 403.
  - cause: "consent lapsed at the 90-day reconfirmation point"
    recovery_screen: consent-manager
    notes: >-
      The designed default, not a failure. UK Open Banking requires reconfirmation every 90
      days; doing nothing ends access.

tags: [consumer, profile, settings, security, consent]
deprecated: false
