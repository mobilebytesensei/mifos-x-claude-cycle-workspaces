id: consumer-cards-financing
version: "1.1.0"
name: "Consumer Recurring Payments Review"
description: "Consumer reviews recent transactions, checks standing orders, and monitors direct debits — the recurring-outgoings review."

# ─── 2026-08-07: the two OPENING steps were removed with the cards / card-detail screens ───
# The journey opened on `cards` -> `card-detail` and was named for them. The repository owner
# deleted both: OBIE has no card resource — a card is an Account whose Account[].SchemeName is
# UK.OBIE.PAN — and the feature came from the OLD OBP PLANNING. The Card and CardAccountRef DTOs
# had already gone on 2026-08-06 for the same reason.
#
# The journey SURVIVES because its remaining six steps never depended on the card framing: they
# walk transactions, standing orders and direct debits, none of which is card-scoped. What is
# lost is the entry point and the success metric, both of which were card-only:
#   was: target ">=80% of users who open cards view >=1 card detail"
#        measurement "funnel: cards_opened -> card_detail_viewed"
# Retargeted below onto the direct-debit drill-down, which is the same shape of signal (list ->
# detail) on a surface that still exists.
#
# The `id` is deliberately NOT renamed. It is referenced by flow.yaml files on the surviving
# screens (standing-order-detail, direct-debit-detail) and by journeys/INDEX.md; renaming would
# break those refs to buy a better label. `name` and `description` carry the current meaning.
version_note: "1.0.1 -> 1.1.0: opening cards + card-detail steps removed; success metric retargeted."

persona:
  archetype: "returning consumer"
  jtbd: "keep my recurring payments organised and know what is leaving my account"
  context: "end of month, reviewing outgoings"
  knowledge_level: familiar
  emotional_state: "focused"

goal: "Review recent activity, check standing orders, and inspect direct debits within one session."

success_metric:
  name: recurring_outgoings_review_completion
  kind: task_completion
  target: ">=80% of users who open direct-debits view >=1 direct-debit detail"
  measurement: "funnel: direct_debits_opened → direct_debit_detail_viewed"

screen_sequence:
  - screen_id: transactions_content
    feature_id: transactions
    state: content
    user_intent: "see the account's full transaction history"
    success_signal: "transaction list loaded for the selected account"
    note: >-
      Reworded 2026-08-07. The intent read "see full card transaction history" and the signal
      "filtered transactions for card shown" — both were written for the deleted card-detail
      hand-off. The transactions screen is account-scoped, never card-scoped, so this is now the
      journey's entry step.
  - screen_id: standing-orders
    feature_id: standing-orders
    state: content
    user_intent: "view and manage recurring payments"
    success_signal: "standing order list loaded"
  - screen_id: direct-debits
    feature_id: direct-debits
    state: content
    user_intent: "review all direct debits"
    success_signal: "direct debit list loaded"
  - screen_id: direct-debit-detail
    feature_id: direct-debit-detail
    state: content
    user_intent: "see detail for a specific direct debit"
    success_signal: "direct debit detail loaded with amount and schedule"
  - screen_id: standing-order-detail
    feature_id: standing-order-detail
    state: content
    user_intent: "inspect a standing order's schedule, amount and payee"
    success_signal: >-
      standing order detail loaded with next payment date, AND the mandatory notice that
      changing or cancelling it must be done in the HSBC app
    note: >-
      "execution history" removed from the intent 2026-08-06. OBIE exposes NO per-execution
      status for any deferred family — the resource describes the mandate's setup, never the
      Nth payment. A success signal asking for recent executions asks for data that cannot be
      obtained.
  # standing-order-edit removed 2026-08-06. A PISP may not amend or cancel a standing order —
  # OBL Customer Experience Guidelines make redirecting the PSU to their bank a MANDATORY
  # obligation, not a courtesy. This is a regulatory boundary, not a missing feature.
  - screen_id: payments
    feature_id: payments
    state: content
    user_intent: "set up a NEW standing order, since the existing one cannot be edited here"
    success_signal: "taps the Domestic standing order tile"

expected_outcome: "Consumer has reviewed recent activity, checked standing orders, and inspected their direct debits."

flows:
  # The `cards` primary-flow ref was removed 2026-08-07 with the screen. `transactions` takes its
  # place as the journey's entry feature; it is in the same consumer-banking flow.
  - feature_id: transactions
    flow_id: consumer-banking
    role: primary
  - feature_id: standing-orders
    flow_id: consumer-banking
    role: primary
  - feature_id: direct-debits
    flow_id: consumer-banking
    role: primary

capabilities_used: [has_ui, has_api]

tier: maximum

preconditions:
  # "at least one card linked to account" removed 2026-08-07 — there is no card entity to link.
  - "user is authenticated as consumer"
  - "at least one account on the consent carries standing orders or direct debits"
  - "device is online"

failure_modes:
  # The "card data load failure" mode, recovering to `cards`, was removed 2026-08-07 with the
  # screen. Replaced by the 403-on-stale-SCA case, which is the real load failure on this
  # journey: standing-orders and direct-debits both sit behind the PSD2 RTS Article 10 boundary
  # and return 403 with an EMPTY BODY when the token's SCA is stale, while balances and
  # transactions keep working. There is no error code to key on.
  - cause: "standing-orders or direct-debits returns 403 with an empty body (stale SCA)"
    recovery_screen: transactions
    notes: "Re-authenticate at the bank; the transactions step is unaffected and stays readable"
  - cause: "direct debit cancel fails"
    recovery_screen: direct-debit-detail
    notes: "Error toast; user contacts support"

tags: [consumer, direct-debits, standing-orders, recurring-payments]
deprecated: false
