    - "semantic.payment_disposition._contract.no_disposition_shouts — the 0.041 spread invariant, previously prose-only in DESIGN.md"
    - "semantic.payment_disposition._contract.unknown_status_policy_correction_2_4_0 — INCO/BLCK no longer swallowed by fail-open"
    - "semantic.payment_disposition._contract.settlement_is_batched — ACSP persists for MINUTES on five-minute boundaries"
