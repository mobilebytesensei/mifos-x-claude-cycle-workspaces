coherence_2026_08_07:
  # Mandatory post-write check for the 1.4.0 / 2.4.0 run. design-tokens.yaml takes precedence
  # on any mismatch; none was found, so precedence was not exercised.
  design_md_vs_tokens:
    result: consistent
    divergences: 0
    checked_at: "2026-08-07"
    pairs:
      - { pair: "DESIGN.md colors.primary <-> token primary", design_md: "#266489", tokens: "#266489", tokens_path: "colors.light.primary / colors_primary / seed_color", verdict: match }
      - pair: "DESIGN.md colors.accent <-> token accent"
        verdict: "no-such-key-either-side"
        detail: >-
          NEITHER file declares an `accent` key — DESIGN.md front matter has no `accent`, and
          the token file has no `accent` token. So there is nothing to diverge. The term is
          OVERLOADED in idea-plan.yaml and resolves two different ways, both of which agree
          with the token file: design_read.brand_constraints.accent_color is #266489 (the
          Material Theme Builder SEED, == primary), while sections.branding.accent_color is
          #64597B (== colors.light.tertiary / colors_tertiary / DESIGN.md colors.tertiary).
          Recorded as an idea-plan naming ambiguity, NOT a design-system divergence.
      - { pair: "DESIGN.md typography.body.family <-> token font", design_md: Roboto, tokens: Roboto, tokens_path: "typography.font_family.body", verdict: match }
      - { pair: "DESIGN.md rounded <-> token radius", verdict: match, detail: "All six keys agree in both spellings — none 0==0, small 8==sm 8, medium 12==md 12, large 16==lg 16, extra_large 28==xl 28, full 9999==full 9999. The declared long/short invariant holds." }
    also_checked:
      - { key: theme, design_md: auto, tokens: auto, tokens_path: theme_mode, verdict: match }
      - { key: aesthetic_family, design_md: minimalist-ui, tokens: minimalist-ui, verdict: match }
      - { key: "typography.mono", design_md: "Roboto Mono", tokens: "Roboto Mono", verdict: match }
      - { key: "colors.tertiary", design_md: "#64597B", tokens: "#64597B", verdict: match }
      - { key: "colors.error / negative", design_md: "#BA1A1A", tokens: "#BA1A1A", verdict: match }
      - { key: "colors.positive", design_md: "#266489", tokens: "#266489", tokens_path: "semantic.money.credit.light", verdict: match }
  design_read_vs_design_system:
    result: consistent
    detail: >-
      seed #266489, Roboto, theme auto, radius_system soft and dials 3/2/5 all match
      idea-plan.yaml#design_read.brand_constraints unchanged. density 5 remains outside
      minimalist-ui's [2,3] range — carried as pre-existing accepted drift, not introduced here.
  app_shell_vs_design_md:
    result: consistent
    detail: >-
      app-shell.yaml rail (Home / Accounts / Pay / More, tab 2 retargeted to `payments`
      2026-08-07) matches DESIGN.md §Layout. app-shell.yaml was NOT modified this run.
  known_divergence_outside_this_run:
    - id: DIV-1
      files: [COMPONENTS.md, PROJECT_CONFIG.yaml, app-shell.yaml, DESIGN.md]
      detail: >-
        COMPONENTS.md 4.0.0 BottomNav documents a FIVE-tab rail (Home, Accounts, Pay, Cards,
        More) citing PROJECT_CONFIG#tech.bottom_nav, which does say five. app-shell.yaml —
        reverse-synced from source and corrected 2026-08-07 — and DESIGN.md both say FOUR
        (Home, Accounts, Pay, More). Source is the tiebreaker and app-shell records it, so
        COMPONENTS.md and PROJECT_CONFIG are the drifted pair. NOT reconciled this run:
        COMPONENTS.md was not re-derived (its token_source_version still reads 2.3.0) and
        PROJECT_CONFIG is outside this capability. `cards` and `card-detail` screens DO exist,
        so the five-tab claim may be intent rather than error — it needs a decision, not a
        mechanical fix.

