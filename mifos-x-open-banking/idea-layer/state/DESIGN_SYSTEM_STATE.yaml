changes_1_4_0:
  run_at: "2026-08-07"
  motivation: >-
    idea-plan.yaml#design_read was refreshed 2026-08-07 and its prior reading described an
    ACCOUNT-INFORMATION app inferred 2026-06-29. The design system was written against that
    reading. Two capability areas had landed since and the system described neither: the
    2026-08-06 seven-type payments rewrite, and branch-locator + the Open Data catalogue.
