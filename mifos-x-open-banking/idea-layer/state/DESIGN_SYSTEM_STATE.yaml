    dials: { variance: 3, motion: 2, density: 5 }
    note: >-
      Confirmed byte-identical against design_read.brand_constraints. This was a REFRESH of what
      the app IS, not a re-inference of what it looks like. Zero colour roles changed; the 29+29
      M3 role set, the full type scale, spacing, radius, icon, border, opacity, elevation and
