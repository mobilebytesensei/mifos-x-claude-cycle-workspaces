changes_1_2_0:
  motivation: >-
    /design-validate 2026-08-02 F-004 (critical): 49 token references across 17 screen files
    resolved against nothing, while design-tokens.yaml's own header claims to be the rendering
    source of truth for Compose codegen. The root cause was namespace divergence — screens and
    the framework component registry both use the DESIGN_TOKENS_SCHEMA vocabulary
    (spacing.md, radius.lg, icon.md), and this file declared none of it.
  added_token_families:
    - "spacing.{none,xxs,xs,sm,md,lg,xl,xxl,xxxl} — named steps beside the existing numeric scale"
    - "icon.{xs,sm,md,lg,xl} — new family; screens referenced icon.md and icon.lg against nothing"
    - "border.{none,thin,medium,thick,focus} — new family"
    - "opacity.{disabled,loading,hover,focus,pressed,dragged} — new family"
    - "touch_targets.{minimum,comfortable,spacious} — new family"
  structural_changes:
    - id: SC-1
      change: "radius promoted from `spacing.radius.*` to top-level `radius.*`"
      not_additive: true
      why: >-
        Nesting was the defect. EVERY consumer already addressed it top-level —
        components.yaml (radius.none, radius.medium), 12 screen references
        (radius.md / .sm / .lg), and DESIGN.md's own `rounded:` block. Promoting fixes all of
        them; duplicating would have created a second source to drift.
      compat: >-
        Both spellings are declared with identical values — short form canonical
        (none/xs/sm/md/lg/xl/full, what the registry and screens use), long form retained
        (extra_small/small/medium/large/extra_large) because components.yaml and DESIGN.md are
        authored in it. Declared invariant: the two must never diverge.
      residual_risk: >-
        Any consumer still reading the literal path `spacing.radius.*` breaks. No such reader
        was found — all four known consumers were already top-level — but the path is gone, so
        this is the one change in 1.2.0 that could surprise something unexamined.
    - id: SC-2
      change: "spacing.scale gained the value 2"
      not_additive: true
      why: >-
        The schema's xxs is 2, and the framework registry's badge `dot` variant declares
        `padding: spacing.xxs`. Mapping xxs to 4 to preserve a pure 4dp grid would have
        rendered badge dots at nearly twice their M3 size — recreating F-004's real problem
        (project and framework meaning different things by the same token) in a subtler form.
      constraint: >-
        2 is documented in the token file as permitted ONLY for badge dots and intra-row text
        gaps. Structural spacing stays on the 4dp grid. This is a declared exception, not a
        loosening of the grid.
  deviations_from_schema:
    - { token: "radius.xl", schema: 24, kept: 28,
        why: "28 is M3's actual extra-large corner and is already in use by DESIGN.md and every 2.1.0 consumer. Retro-fitting 24 across a shipped system for one digit of conformance is the worse trade." }
    - { token: "icon.{xs,sm,lg}", note: "16 / 20 / 32 conflict with validation-rules iconography-002's [18,24,36,48] (severity: info). Schema values taken verbatim; md (24) and xl (48) conform. Namespace agreement with the framework was the priority, and iconography-002 is advisory, not a gate." }
  design_md:
    - "version 1.1.0 -> 1.2.0"
    - >-
      rounded: gained `none: 0` and `full: 9999`. `full` was a LIVE DANGLING REFERENCE —
      the front matter's button_filled component declares `radius: \"{rounded.full}\"` against
      a key the same block never defined. Pre-existing defect, unrelated to F-004, found while
      resolving the fourth radius vocabulary.
  not_changed:
    - "all 29 light + 29 dark M3 colour roles"
    - "full type scale and font families"
    - "elevation levels, motion durations, mood gradients"
    - "semantic.money, semantic.payment_disposition, form.*, irreversible_action (the hand-authored 2.1.0 blocks)"
  regeneration_avoided: >-
    Run as a targeted additive edit, NOT a full /design-system regeneration. The 2.1.0 semantic
    blocks (payment_disposition, form.field, form.amount_field, form.validation,
    irreversible_action) are hand-authored with per-token contrast measurements and rationale
    prose; regenerating would have put them at risk to add five token families.

