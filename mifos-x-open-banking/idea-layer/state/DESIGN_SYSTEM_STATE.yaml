aesthetic:
  family: minimalist-ui
  variant_file: "layers/idea/templates/aesthetic-variants/minimalist-ui.yaml"
  design_read_source: "idea-plan.yaml#design_read"
  dials: { variance: 3, motion: 2, density: 5 }
  dial_conformance:
    variance: { value: 3, variant_range: [3, 5], verdict: in_range }
    motion:   { value: 2, variant_range: [2, 4], verdict: in_range }
    density:  { value: 5, variant_range: [2, 3], verdict: OUT_OF_RANGE }
  dial_drift_note: >-
    density 5 (comfortable) sits outside minimalist-ui's declared airy range [2,3]. NOT
    auto-corrected. The project set it deliberately: quiet_constraints are accessibility-first
    and regulated-industry, and 48dp touch targets with generous row spacing are worth more
    here than the variant's preferred airiness. Recorded as known, accepted drift rather than
    silently reconciled in either direction.

change_type: additive-surfaces
change_summary: >-
  Accounted for two capability areas that landed after 1.3.0 and that the system described
  neither of: payment initiation across SEVEN rails, and three unauthenticated Open Data
  surfaces. Added a FOURTH payment disposition (instruction_established) for the four DEFERRED
  rails, which have no per-execution status; a mandate_health vocabulary that is never derived
  from consent status; an open_data_states vocabulary that FORBIDS authentication states; and
  rail_form_shape. irreversible_action widened from one deleted screen to all seven rails.
  Brand untouched — seed #266489, Roboto, theme auto, dials 3/2/5 and the soft radius system are
  byte-identical. No new hue minted and NO new contrast pair measured: every addition reuses a
  pair already validated. One bug fix: form.field.radius pointed at the deleted
  `spacing.radius.small` path.
previous_change_summary_1_3_0: >-
  Closed /design-validate C-2: added semantic.status, mapping the `warning` and `success`
  families the app references onto existing M3 roles (tertiary, primary) rather than minting new
  hues. Four contrast pairs measured (W-16..W-19). Purely additive — no existing role, scale,
  radius or spacing value changed. The consuming screens still carry the old undeclared names;
  that edit is not this capability's file.
previous_change_summary_1_2_0: >-
  1.2.0 — Closed /design-validate F-004: the token file did not declare the families its own
  consumers reference. Added the named spacing steps and the icon / border / opacity families verbatim
  from DESIGN_TOKENS_SCHEMA.md, and PROMOTED radius from spacing.radius to top level. No colour
  role, type scale, elevation level or motion duration changed. Two changes are structural
  rather than additive and are recorded as such below.
previous_change_summary: >-
  1.1.0 — Extended the system for money MOVEMENT. Every prior version described a strictly
  read-only AISP app; the PISP scope reversal added the app's first forms, its first field
  validation and its first irreversible action. Purely additive on tokens. Three factual
  corrections applied to prose.

