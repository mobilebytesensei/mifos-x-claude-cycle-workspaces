run_2026_08_04_1205:
  scope: "the two design-scoped findings from /design-validate 2026-08-04 (C-1, W-1)"
  design_system_version_unchanged: "1.3.0 — no token value changed; the token file was found CORRECT"

  fixed:
    - id: C-1
      severity: critical
      title: "send-money/success rendered a terminal-success signal for a non-terminal payment"
      fix_applied: true
      what_changed: >-
        Removed four hexes that existed nowhere in design-tokens.yaml (#B6F2C4 / #00210D light,
        #00522A / #9BD8AC dark) and the 96px green check_circle hero they coloured. The hero now
        renders secondary-container with a clock glyph — the In-progress disposition — matching
        the status chip directly beneath it and matching payment-status.
      why: >-
        Two DESIGN.md rules broke at once. The palette ships no green ("success maps to primary",
        "no celebratory colour"), and the disposition table maps AcceptedSettlementInProcess —
        exactly what payment_submit_response.Data.Status carries in the fixture — to In progress,
        not to terminal Success. The cell's copy was already honest; the largest element on the
        screen contradicted the sentence beside it.
      files: [screens/send-money/preview/success.html, screens/send-money/preview/.cache.json]

  decided_not_changed:
    - id: W-1
      title: "design-tokens.yaml vs the 95 rendered preview cells — 9 colour roles disagree"
      verdict: "TOKENS ARE TRUTH (user decision). No token value changed; the previews are wrong."
      evidence: >-
        The disposition triad in design-tokens.yaml computes to 7.22 / 7.27 / 7.24:1 — matching
        the figures DESIGN.md publishes, to the hundredth — with a spread of 0.041. Three values
        that close is a calibration, not an accident. The previews' near-black on-container
        values compute to 13.32 / 13.24 / 13.26:1: higher contrast, still AA, but the blue /
        slate / red distinction collapses toward black, which undercuts this system's
        "colour never alone" rule.
      design_md_amended: >-
        DESIGN.md's disposition section now states the calibration explicitly, the tone-30 rule,
        and that renderers must read values from design-tokens.yaml rather than deriving their
        own M3 ramp — which is the failure mode that produced this drift and hid it behind a
        passing contrast gate.

  owed_to_render:
    id: W-1-PROPAGATION
    status: APPLIED 2026-08-04T12:40:00Z via /idea-render-mockup
    applied:
      files: 95
      substitutions: 727
      roles: 11
      residual_undeclared_hexes: 1   # #DB0011, the HSBC brand red — accepted exception I-2
    count_corrections:
      predicted_537_actual_727: >-
        The pre-run estimate of 537 counted FILES per role, not occurrences. #101418 appears
        twice in every cell (--background and --surface), which alone accounts for 95 of the
        difference; the 11th role found mid-run accounts for another 95.
      eleventh_role_found_mid_run: >-
        The declared table listed 10 roles. A post-sweep undeclared-hex sweep surfaced
        `--on-primary: #003353` in the dark block of all 95 cells against a declared #00344E —
        missed because the original delta table was built from a 42-hex extraction of the token
        file rather than a role-by-role diff. Applied as an 11th substitution and re-verified.
    why_this_vehicle: >-
      /idea-feature-render, which /idea-render-mockup wraps, has no token-only or restyle mode —
      --regenerate means a full LLM re-render of every cell. That was rejected on two grounds:
      95 re-renders is not one turn's work, and a fresh render re-derives its own M3 ramp, which
      is precisely how the drift arose. A deterministic substitution cannot reintroduce it.
      Hard Rule 4 was relaxed for this sweep with explicit user consent, scoped to generated
      preview artifacts and to a mechanical value swap with no content authored by script.
    verified_safe_before_applying: >-
      Each drifted hex binds to exactly ONE css custom property across all 95 cells (checked),
      and no source value equals any target value, so the substitutions are order-independent
      and cannot corrupt the opposite theme block. A tar snapshot was taken first.
    verification_after:
      residual_source_hexes: 0
      structural_gate: "95/95 PASS"
      contrast: "28/28 pairs PASS in both themes against the declared palette"
      disposition_triad: "7.22 / 7.27 / 7.24:1, spread 0.041 — calibration restored exactly"
      preflight_source_of_truth_sync: PASS
      preflight_mockup_theme_consistency: "PASS, 0 findings"
      render_convergence_floor: PASS
      cache_hash_agreement: "95/95"
    render_hash_markers_deliberately_unchanged: >-
      The cache `hash` is an INPUT sha, not a content sha — the runtime's staleness test is
      `cache[state].hash != current_input_sha`. design-tokens.yaml did not change in this run;
      the previews were brought into agreement with inputs that were always correct. So the
      recorded input hashes still describe these cells truthfully and were left alone. This is
      also a clean demonstration of PREVIEW-CONTENT-STALE-ALL: an output-only defect of this
      exact kind is structurally invisible to the cache, which is why W-1 survived unnoticed
      across 95 cells and a full /design-validate pass.
    substitutions:
      - { from: "#101418", to: "#101417", role: "dark surface + background",      cells: 95 }
      - { from: "#004B75", to: "#004B6F", role: "dark primaryContainer",          cells: 95 }
      - { from: "#001E2F", to: "#004B6F", role: "light onPrimaryContainer",       cells: 95 }
      - { from: "#37474F", to: "#384956", role: "dark secondaryContainer",        cells: 94 }
      - { from: "#0C1D29", to: "#384956", role: "light onSecondaryContainer",     cells: 24 }
      - { from: "#410002", to: "#93000A", role: "light onErrorContainer",         cells: 27 }
      - { from: "#64547B", to: "#64597B", role: "light tertiary",                 cells: 95 }
      - { from: "#20005D", to: "#4C4162", role: "light onTertiaryContainer",      cells: 4 }
      - { from: "#4B3E62", to: "#4C4162", role: "dark tertiaryContainer",         cells: 4 }
      - { from: "#32363A", to: "#313539", role: "dark surfaceContainerHighest (--shimmer-hi)", cells: 4 }
      - { from: "#003353", to: "#00344E", role: "dark onPrimary — 11th role, found post-sweep", cells: 95 }
    note_on_collisions: >-
      Two pairs converge on one target by design, and that is correct rather than a mistake:
      #001E2F and #004B75 both become #004B6F because the token file assigns #004B6F to BOTH
      light onPrimaryContainer and dark primaryContainer. #0C1D29 and #37474F both become
      #384956 for the same reason on the secondary pair.
    after_applying: "re-stamp each touched cell's render-hash and .cache.json entry"

  not_in_scope_for_this_command:
    - "R-1 (93 `value:` sites where the text primitive requires `content:`) — registry conformance, owed to /idea-sync or /idea-feature-enrich"
    - "D-2 (174 on_click without action_contract, all cohort-A) — same"
    - "D-4 (states rendering zero components) — still unmeasured since 2026-08-03"

