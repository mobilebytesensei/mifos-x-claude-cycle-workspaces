    - "semantic.open_data_states — vocabulary + forbidden_states + rate_limited + location_denied + empty_semantics"
    - "rail_form_shape — amount-field mutual exclusion, reference refusal, funds-confirmation presence, the VRP funds trap"
  extended_tokens:
    - "irreversible_action.applies_to — 1 payment screen -> 7 rails (+ consent_revoke)"
    - "irreversible_action.cta_label_by_rail / deferred_rails_are_not_lesser / review_rows_by_rail / reversibility_note"
    - "accessibility.validated_pairs 15 -> 32 (corrected to match the recorded W-01..W-32 corpus; the 15 was stale from 1.1.0)"
  fixed:
    - id: F-2.4.0-1
      severity: defect
      what: "form.field.radius resolved against `{spacing.radius.small}` — a path DELETED by the 2.2.0 promotion."
      now: "`{radius.sm}` — same 8dp value, resolvable path."
      note: >-
        This is exactly the reader OI-6 predicted ("any unexamined reader of the literal nested
        path would break"), and it was inside the token file itself. OI-6 can now be closed for
        this file; external Compose-codegen readers are still unverified.
    - id: F-2.4.0-2
      severity: staleness
      what: "DESIGN.md and two component YAMLs referenced `send-money`, deleted 2026-08-06."
      now: >-
        DESIGN.md §Layout multi-step-forms retargeted to all seven rails; DESIGN.md Don't-rule
        retargeted to "a payment confirm CTA on any of the seven rails"; design-tokens
        irreversible_action.applies_to enumerated per rail; amount_field.yaml and
        review_card.yaml consumers retargeted to the seven pay-* screens.
      rules_preserved: "Every retargeted RULE was kept verbatim in force — only its target moved."

  no_new_contrast_pairs:
    count: 0
    rationale: >-
      Every 1.4.0 semantic reuses a pair already measured — W-30 (surfaceVariant neutral, 7.28
      light / 5.52 dark), W-02/W-05 (primaryContainer, 7.27), W-16/W-17 (tertiaryContainer,
      7.27), W-03/W-06 (errorContainer, 7.24). This is a consequence of minting no new hue, not
      a shortcut. NOTHING was asserted that was not previously computed.

  design_md:
    - "version 1.3.0 -> 1.4.0, previous_version recorded, description widened to seven rails + Open Data"
    - "front matter components[] gained mandate_health_chip and status_chip.established"
    - "§Overview — new 'Changed in 1.4.0' note"
    - "§Colors — disposition table gained a fourth row (Instruction set up)"
    - "§Colors — new subsection 'Mandate health is not consent status' with the four-state table"
    - "§Colors — new subsection 'Open Data surfaces have a different state vocabulary'"
    - "§Colors — tertiary bullet widened: it now also carries mandate `failing` and `rate_limited`"
    - "§Colors — pairs measured corrected 19 -> 32; W-32's failure surfaced in prose for the first time"
    - "§Layout — multi-step forms retargeted; new 'seven rails are one family' passage"
    - "§Components — 1.4.0 additions + review-card extension; state-surfaces bullet corrected"
    - "§Do's and Don'ts — 2 Do rules and 5 Don't rules added; send-money Don't retargeted"
  structure_preserved: "YAML front matter + the same 8 H2 sections. No section added, renamed or reordered."

  # ─── The findings that CONTRADICTED the shipped system ────────────────────
  contradictions_found:
    - id: X-1
      severity: critical
      title: "The disposition triad could not express four of the seven rails."
      detail: >-
        SC-3 / unknown_status_policy said an unmapped OBIE status renders as in_progress. INCO
        (InitiationCompleted) was unmapped AND is the TERMINAL status of all four deferred
        families. The shipped rule therefore rendered every scheduled payment and every standing
        order as perpetually "in progress" — a payment surface implying live activity on an
        instruction that will not execute until a date possibly months away. This is the same
        class of falsehood the system was built to prevent for ACSP, one rail over.
      resolved: "Fourth disposition added; INCO mapped explicitly. BLCK still unmapped — see OI-8."
    - id: X-2
      severity: high
      title: "review_card's row order and CTA label were one deleted screen's, presented as the contract."
      detail: >-
        row_order [funding_account, payee, amount, reference] and label_pattern "Send {amount}"
        were specified for send-money. Applied unchanged they are WRONG on five of seven rails:
        the three international rails refuse a reference field (U005), and on the four deferred
        rails "Send £850.00" claims a transfer that does not occur — the customer taps it and no
        money leaves.
      resolved: "Rows and CTA label declared per-rail in tokens + review_card.yaml. RC-1 unchanged."
    - id: X-3
      severity: medium
      title: "mandate_health.active reuses terminal_success's pair — the one place this vocabulary can lie."
      detail: >-
        `active` maps to semantic.status.success, which is the SAME primaryContainer pair as
        payment_disposition.terminal_success. A mandate being active is not a settled payment,
        so the identical treatment risks reading as "paid" — precisely what the deferred-rail
        rule forbids.
      resolved_partially: >-
        Held apart by icon (autorenew, never check_circle) and by a label contract that names the
        mandate state and never an amount. Recorded rather than re-mapped: changing it would mean
        minting a fifth treatment, and the icon+label guard is the same mechanism the system
        already trusts for colour_is_never_the_only_signal.
      open: true
    - id: X-4
      severity: high
      title: "atm-locator and products declare an `unauthenticated` state their own api.yaml calls unreachable."
      detail: >-
        Both screens declare `unauthenticated` in states_handled. Both api.yaml files declare
        `auth: none` and `no_auth_errors: "No 401 and no 403 on any path."` atm-locator's block
        notes it renders "session expired" via the shared error branch — so an unreachable state
        ships a false message on the first screen a prospective customer sees. branch-locator
        gets this right and says so in its own YAML.
      screen_layer: true
      resolved: >-
        DECLARED, not applied. semantic.open_data_states.forbidden_states names it and DESIGN.md
        carries the Don't rule. This capability owns DESIGN.md, the token file and the component
        catalog — not screen YAML. Closing it is /idea-heal or /idea-feature-enrich work.
    - id: X-5
      severity: low
      title: "Stale idea-plan wording: `products` was reported as ambiguous between Open Data and account-scoped."
      detail: >-
        products/api.yaml is unambiguous — `auth: none`, catalogue from the public Open Data
        Product Finder, and an explicit rule "Do not merge them: `products` is the catalogue;
        `product` is the PSU's own terms (permission ReadProducts)". But products/ui.yaml ALSO
        declares get_account_product (permission ReadProducts) and get_accounts
        (ReadAccountsBasic) among its operations, which is where the confusion originates and is
        also why it grew an `unauthenticated` state.
      resolved: >-
        Design system treats all three as Open Data per api.yaml. The products/ui.yaml operation
        list contradicting its own api.yaml is a screen-layer defect, filed as OI-9.

  not_changed:
    - "all 29 light + 29 dark M3 colour roles — every 1.4.0 semantic references an existing role"
    - "seed #266489, Roboto / Roboto Mono, theme auto, dynamic_color, contrast_variants"
    - "full type scale, spacing scale + named steps, radius (both spellings), icon, border, opacity, touch_targets"
    - "elevation levels, motion durations, mood gradients"
    - "semantic.money, semantic.status, form.field / amount_field / validation (values — only form.field.radius's PATH was fixed)"
    - "design-system/app-shell.yaml — corrected 2026-08-07, deliberately untouched this run"

  screens_not_touched: >-
    Same boundary as 1.3.0. atm-locator and products still declare `unauthenticated`;
    consent-detail still references the warning family and still maps Expired to warning. The
    token file records what they SHOULD resolve to; applying it is /idea-heal work.

# ═══════════════════════════════════════════════════════════════════════
# CHANGE LOG 1.2.0 -> 1.3.0   (tokens 2.2.0 -> 2.3.0)
# ═══════════════════════════════════════════════════════════════════════
changes_1_3_0:
  motivation: >-
    /design-validate 2026-08-02 C-2 (critical): four references in consent-detail — the expiry
    banner's container, its icon, its text, and the status_chip's `Expired` entry — named a
    `warning` colour family that exists in no spelling. M3 has no warning role, the Material
    Theme Builder export has none, and this system declared none. The surface that tells a PSU
    their bank connection is about to lapse resolved to nothing. C-2 was filed NOT auto-fixable
    because closing it needs a design decision, which is this capability's job.
  decision:
    chosen: "map warning -> tertiary, success -> primary; mint no new hues"
    rejected: "add dedicated amber and green tonal families"
    rationale: >-
      Follows the precedent semantic.payment_disposition already set — that block faced the same
      shape of problem (a vocabulary the theme does not ship) and solved it by mapping onto
      secondary/primary/error rather than inventing colours. A new family is four more pairs to
      keep accessible across two themes and two contrast variants, to express a state the
      existing palette already distinguishes. It would also put an amber into a system whose
      stated identity is calm regulated restraint.
    warning_is_tertiary_not_error: >-
      A consent expiring in seven days has not failed; the PSU has full access and a working
      reconfirm path. Error-red would frame a live healthy connection as broken — the same
      overstatement the system refuses for in-progress payments. Error stays reserved for
      Revoked / Rejected / Expired, where access is actually gone.
    success_reuses_terminal_success: >-
      success maps to the SAME primaryContainer pair as payment_disposition.terminal_success,
      deliberately, because they mean the same thing. No new pair measured — W-02 / W-05 cover it.
  added:
    - "semantic.status.warning — role tertiary, 6.13 light / 10.89 dark against surface"
    - "semantic.status.warning_container — tertiaryContainer pair, 7.27 both modes"
    - "semantic.status.success — primaryContainer pair, 7.27 both modes (reuses W-02/W-05)"
    - "semantic.status._contract — icon + text_label required per state, mirroring payment_disposition"
  wcag_added: [W-16, W-17, W-18, W-19]
  design_md:
    - "version 1.2.0 -> 1.3.0"
    - "§Colors — tertiary bullet rewritten: it now CARRIES the warning semantic rather than being 'currently unused in production'"
    - "§Colors — new subsection 'Warning and success have no hue of their own' with the mapping table and the tertiary-not-error reasoning"
    - "§Colors — pairs measured 15 -> 19"
  not_changed:
    - "all 29 light + 29 dark M3 colour roles — semantic.status references existing roles, it does not add any"
    - "type scale, spacing, radius, icon, border, opacity, elevation, motion"
    - "semantic.money, semantic.payment_disposition, form.*, irreversible_action"
  screens_not_touched: >-
    consent-detail still references warning-container / on-warning-container / warning. This
    capability owns DESIGN.md, design-tokens.yaml and the component catalog — not screen YAML.
    The token block records what the screens should resolve to, including the correction that
    `Expired` belongs on error rather than warning; applying it is /idea-heal or
    /idea-feature-enrich work. C-2 is therefore DECIDED and DECLARED here, and CLOSED only when
    those four references are repointed.

