          detail: >-
            20 components declared `type: empty_state, id: error_state, variant: error, state_binding: [error]` — they
            ARE the error state, mistyped. The registry ships a dedicated error_state whose a11y role is `alert`
            (assertive); empty_state's role is `status` (polite), so a screen reader may not announce a failure
            promptly. DESIGN_HEURISTICS names this exact anti-pattern ("Using placeholder / error_state / empty_state
