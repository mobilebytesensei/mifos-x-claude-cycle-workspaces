        note: >-
          The remaining 33 are all framework-registry vocabulary questions with cross-project blast radius, deliberately
          NOT decided unilaterally. Each is a real expressive need the registry currently has no word for.
        items:
          - >-
            empty_state tones (11): info=5, neutral=3, success=2, informational=1. empty_state inherits only
            vertical/horizontal from stack — the registry has no vocabulary for an empty state's emotional tone. Either
            add tone variants or drop them as decoration.
          - >-
            skeleton shapes (5): detail=2, list_card=1, progress=1, list=1. Same shape of gap — skeleton inherits the
            layout axis and has no word for which composition it is mimicking, though mirroring the real layout is
            exactly what a skeleton is for.
          - >-
            badge tonal (4): allowed dot/count. `tonal` is an M3 colour emphasis, not a badge shape — likely belongs in
            style, not variant.
          - >-
            input outlined_readonly (4): allowed values are input TYPES (text/email/...). The name conflates appearance
