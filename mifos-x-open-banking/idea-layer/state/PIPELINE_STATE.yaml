          implementations agreeing on the same output is the strongest evidence available here that the substitution is
          right.
      script:
        path: .claude-runtime/scripts/migrate-palette.ts
        precedent: migrate-stitch-to-prompts.ts — an existing framework script that writes idea-layer files
        authorised_by: 'user decision 2026-08-04 (Hard Rule #4 boundary call, explicitly put to them)'
        design: >-
          Maps BY ROLE, never by hex. Each `--{role}: #hex` resolves against design-tokens.yaml colors.{light,dark} for
          the mode of the region it sits in. Bare literals recover their role by reverse lookup in the RETIRED token
          file. Colour only — no layout, copy, component id or test attribute is touched. Dry-run by default.
        bugs_found_by_dry_run:
          - id: SNAKE-CASE-ROLES
            detail: >-
              The retired v3.0.0 file uses snake_case (on_primary) while the canonical file uses camelCase (onPrimary)
              and previews use kebab (--on-primary). The normaliser only handled camelCase, so only single-word roles
              matched — 218 rewrites instead of 586 on the first sample. Fixed by folding underscores too.
          - id: COLORS-VS-COLOR-KEY
            detail: >-
              v2.0.0 spells the block `color:` (singular); v3.0.0 and canonical use `colors:`. The loader now accepts
              either.
          - id: CARDS-VAR-PREFIX
            detail: >-
              cards uses --color-primary where every other screen uses --primary, so it matched nothing (vars=0). Fixed
              with a roleKey() prefix strip.
          - id: NOT-SELECTOR-MODE-INVERSION
            severity: would have been a silent regression
            detail: >-
              Dark blocks are commonly `@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { ... }
              }`. That selector contains a literal [data-theme="light"] INSIDE the dark region, which the region
              splitter read as a light marker — so every dark value after it would have been rewritten to its LIGHT
              counterpart. Caught because an already-hand-converted file (terms-of-service) showed 14 pending rewrites
              when it should have shown zero. Fixed with a (?<!:not\() guard. This is the case for dry-run-before-apply.
      judgement_calls:
        - id: NAV-ACTIVE-INDICATOR
          detail: >-
            The retired palette declared `nav_active_indicator` (#DCE7C8) and the canonical 35-role M3 set has no
            counterpart; app-shell.yaml declares no nav colour either. Mapped to `secondary-container` because Material
            Design 3 specifies that role for a NavigationBar active indicator — a spec fact, not a guess about this
            project. Recorded as an explicit SUPPLEMENT map in the script rather than buried in a value table, so it is
            auditable and reversible. It is the only such mapping.
      cache_metadata_closed:
        at: '2026-08-04'
        by: migrate-palette.ts --stamp-cache
        result: all 46 screens now carry tokens_version 2.3.0 — 18 stamped, 5 caches created, 23 left untouched
        evidence_gated: >-
          A screen is only stamped if every one of its previews verifies clean (0 green, 0 role/value mismatches) at
          stamp time. All 46 passed; 0 skipped. A stamp is a claim about the artifact, so it is earned per screen rather
          than applied because the migration ran.
        tier_a_deliberately_untouched: >-
          The 23 screens that were never green are NOT stamped with a palette_migration note and their files were not
          rewritten. No migration happened to them — they were already Trust Blue and were re-stamped earlier against
          separate evidence. Writing "palette migrated" on them would have been a false claim, and reformatting their
          caches would have churned the rich per-screen design notes for nothing.
        hash_never_invented: >-
          states[].hash was not written or recomputed anywhere. The 5 created caches carry hash: null with hash_pending:
          true and a note saying why — the ledger now exists and is honest about what it does not know instead of
          fabricating a checksum. 19 states carry that flag.
        losslessness_verified: >-
          The 18 stamped caches round-tripped through JSON.parse/stringify. Spot-checked that pre-existing rendered_at
          and hash values survived on transaction-tags, notifications, cards, card-detail, splash and products. Those
          files legitimately had only `version` + `states` before — nothing was dropped.
      still_open:
        - id: ORPHAN-CACHE-STATE-ROWS
          severity: info
          detail: >-
            Some caches carry state rows for previews that no longer exist — splash has 5 rows against 2 html files,
            notifications 5 against 4. Residue of the orphan-preview sweep recorded in run_2026_08_04_1018
            (orphan_previews_deleted: 39), which removed the files but not their ledger rows. Pre-existing, not
            introduced by the migration, and harmless to rendering. Noted rather than fixed — it was outside this run's
            ask.
        - id: COMPONENTS-MD-REGEN
          detail: COMPONENTS.md still documents the retired palette — flagged by /idea-sync, needs /design-system.
      approach:
        chosen: surgical palette substitution, NOT re-render
        why: >-
          The drifted previews are structurally correct — layout, copy, component ids, test attributes and the design
          notes in their caches all describe the right screens. Only the colour values are from the retired earth-green
          brand. Re-rendering would churn correct content to fix colour. Substituting the palette against the canonical
          token file preserves everything else and is exactly verifiable.
        source_prerequisite: >-
          Only safe because /idea-sync retired the green token files first. Converting the artifacts while
          design-tokens.v3.0.0.yaml still claimed to be canonical SoT would have left the next render free to
          reintroduce green.
      converted:
        - screen: splash
          cells: 2
          states:
            - loading
            - navigating
        - screen: terms-of-service
          cells: 1
          states:
            - content
        - screen: privacy-policy
          cells: 1
          states:
            - content
      verification:
        method: >-
          light/dark-aware comparison of every --{role}: #hex against design-tokens.yaml colors.{light,dark}, plus a
          green-family literal + rgba(76,102,43) scan
        result: 172 token vars matched canonical, 0 mismatches, 0 green literals across the 4 converted cells
        verifier_note: >-
          The verifier had to split light/dark on the FIRST dark marker of either kind — [data-theme="dark"] often
          precedes @media (prefers-color-scheme). An earlier version split only on @media and reported 11 false
          mismatches on splash, because correct dark values sat in the light segment. Same class of probe error as the
          665/1330 one.
      measurement_correction: >-
        An earlier claim in this session — "18 of 23 screens have green confined entirely to the --var: declarations,
        zero hexes elsewhere" — was WRONG. The probe tested whether the LINE containing a hex also contained a --var:
        declaration, but these files are minified onto one line, so body/gradient/shadow hexes on the same line counted
        as in-var. It also could not see rgba() forms at all, and rgba(76,102,43,...) IS #4C662B. Correct figures: 3152
        green values inside var declarations, 44 hexes outside them, and 6 rgba triples. 17 screens are var-only; 6 leak
        into gradients/shadows — about, atm-locator, cards, products, splash, transaction-tags. splash was converted
        first precisely because it leaks, to prove the harder path.
      why_stopped:
        rate: ~5-6 tool calls per cell — 1 Read, 2-6 Edits, 1 verify
        remaining: 82 cells across 20 screens, so roughly 450+ calls
        no_universal_replacement: >-
          There is no single find/replace that covers the corpus. Formatting differs per file (`--primary: #4C662B` vs
          the minified `--primary:#4C662B`), the set of declared roles differs, some files carry a [data-theme] block
          and some do not, and 6 screens carry gradients and rgba triples. Every file needs its own exact match, which
          is what makes hand-editing slow rather than merely tedious.
        constraint: >-
          Hard Rule #4 (RULE-CI-001) bans python/bash/jq/sed/awk on idea-layer files, so the substitution has been done
          through Read/Edit only. That is the binding limit here, not the difficulty of the transform — the transform
          itself is deterministic and the verifier already exists.
      open: >-
        82 cells / 20 screens still carry the retired palette. Source is clean, so they cannot get worse; they are
        simply not yet converted.
