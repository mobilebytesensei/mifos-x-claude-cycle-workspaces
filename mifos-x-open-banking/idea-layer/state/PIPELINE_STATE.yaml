          which the project used before the Trust Blue rebrand. It survives in design-tokens.v2.0.0.yaml,
          design-tokens.v3.0.0.yaml, the .bak-20260528T155300Z copy, PROMPTS_STITCH.md and COMPONENTS.md — all sitting
          in the SAME directory as the canonical design-tokens.yaml.
        fieldofficer_verdict: >-
          ADJACENT, NOT CAUSAL. design-tokens.v3.0.0.yaml does contain fieldOfficer-era content ("teal secondary
          gradient for field-officer surfaces", "Field-officer mode header, KYC progress bar"), so it IS residue that
          outlived the 2026-08-02 persona removal. But the green is BRAND history, not flavour theming — there was never
          a per-flavour palette. Removing the flavour could not have fixed this, and did not.
        the_actual_trap: >-
          design-tokens.v3.0.0.yaml ended its header with "Canonical SoT for Compose codegen, /idea-render-screen,
          prototype renderer." It was regenerated 2026-05-29 — the same day the 22 drifted screens rendered. A renderer
          resolving which token file is authoritative by reading the files would have believed that line. It was false
          from the moment the brand moved to Trust Blue.
