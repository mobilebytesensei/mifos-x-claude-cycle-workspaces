          PROMPTS_STITCH.md was not merely stale, it was a BANNED artifact: framework-verify-stitch-prompt-shape.sh PC1
          fails on any PROMPTS_STITCH.md outside _archived/. The gate was failing and the failing file was the same one
          carrying "Primary brand color: #4C662B (earth green)" and "BottomNav: #F9FAEF bg" — the two values found in
          the drifted splash preview. Investigating the palette found a live CI-gate failure that was not being reported
          anywhere.
