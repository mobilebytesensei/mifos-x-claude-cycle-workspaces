          - >-
            RESP-001 (8 registry types): stack, list, empty_state, error_state, chip_group, skeleton, tab_bar,
            stat_block declare no `responsive` block. Adding one defines what a breakpoint override MEANS for each — a
            design decision, not a mechanical edit.
          - >-
            A11Y-005 (1): icon_button omits focus_visible from supported_states. Precedent exists — the 2026-08-04
            backlog sweep added keyboard.focusable to 11 interactive registry patterns for the same class of gap.
