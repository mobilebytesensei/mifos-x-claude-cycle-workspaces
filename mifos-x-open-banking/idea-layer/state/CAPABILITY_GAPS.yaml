      - "file:idea-layer/screens/standing-orders/ui.yaml:15      -> states: [loading, content, empty, unsupported, error]"
      - "file:idea-layer/screens/direct-debits/ui.yaml:252-263   -> unsupported_direct_debits component block to mirror"
      - "file:idea-layer/screens/direct-debits/ui.yaml:46        -> records that direct-debits' unsupported state was BACK-FILLED from source; 'the idea-layer never declared it'"
    feature: scheduled-payments
    screen: scheduled-payments
    source: gap-discovery
    scope: cross-feature
    discovery_id: "DISCOVERY:scheduled-payments:missing-unsupported-state"
    confidence: 95
    removal_tier: high
    delegated_to: "/idea-feature-enrich"
    recurrence: 1
    # RECLASSIFIED 2026-08-02 by /idea-sync (source-truth reverse pass), from
    # `partially-resolved` (an OPEN idea-layer defect) to `source-owed` (a CLOSED idea-layer
    # obligation with an open SOURCE obligation). The distinction matters: nothing further is
    # owed on the idea side — the state, its component block, strings, preview and test all
    # exist and are correct. What remains is a source change, and counting it as an open
    # idea-layer finding made every verify run report a defect against a file that is right.
    #
    # The user's 2026-08-02 direction was source-is-truth. Applied literally this state would
    # have been PRUNED to match source. It is deliberately kept instead, because source itself
    # already records the refusal (BankingStores.kt:377 recordIfUnsupported) and only fails to
