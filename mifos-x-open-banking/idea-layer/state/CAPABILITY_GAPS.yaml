    # Deleting it would erase the specification of a live user-visible defect.
    status: source-owed
    owed_by: /implement
    idea_layer_obligation: CLOSED
    source_obligation: OPEN
    declared_in: "screens/scheduled-payments/ui.yaml#spec_ahead_of_source"
