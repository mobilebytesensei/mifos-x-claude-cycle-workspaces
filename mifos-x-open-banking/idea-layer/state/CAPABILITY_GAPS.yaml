        degradation to plain alphabetical order while reporting success. Root cause:
        screen-order-from-flows.ts derives order by walking each flow's `happy_path[]`, but
        FLOW_SCHEMA.schema.yaml REQUIRES `screens` + `entry_screen` + `connections` and does not
        define `happy_path` at a flow group at all (it is a journeys concept, per
        RULE-IDEA-HAPPY-PATH-COVERAGE-001). The generator's core algorithm could therefore never
        fire on ANY schema-conformant project.
      fix: >-
