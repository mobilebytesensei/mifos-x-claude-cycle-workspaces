run_2026_08_03_heal_infra:
  mode: inline
  rounds: 1
  halt_reason: k-dry-terminated
  augmentations_applied: 2
  escalated_gaps: 6

  fixed:
    - id: DESIGN-ICON-LIBRARY-ABSENT
      severity: warn
      gap_class: gate-silently-bypassed
      detail: >-
        PROJECT_CONFIG.yaml had no `design:` block at all. RULE-PROTO-RENDER-LLM-001 RV-016 locks
        renders to a single icon library declared at `design.icon_library`, and four consumers gate
        on it — the rule itself, idea-feature-render.md, project-verify.md and
        IDEA_CAPABILITY_REGISTRY.yaml. With the key absent the /idea-verify-e2e render check
        scored `—` and redistributed its 15 pts, so the 12 features with NO rendered previews were
        INVISIBLE in the health score rather than penalised. The project's own VERIFY_LOG has
        carried this since the 07-28 sync with the exact fix written out.
      fix: 'design: { icon_library: material-icons }'
      evidence: >-
        Not a guess. Every icon name across the 46 screens is Material Symbols vocabulary —
        cloud_off, warning_amber, credit_card_off, receipt_long_outlined, calendar_today,
        expand_more, link_off, camera_alt — and the `_outlined` suffix is the Compose
        `Icons.Outlined.*` convention this CMP Material 3 app already compiles against.
      self_correction: >-
        This heal was first written as `design: { n: material-icons }` on the belief that
        `design.n` was the canonical key. It is not — `design.n` appears NOWHERE in the framework.
        The error was mine: I read the framework with `rg -rn 'icon_library'`, where `-r n` is
        ripgrep's REPLACE flag, so every match was substituted with the literal `n` in the output
        and `design.icon_library` rendered as `design.n`. Corrected before any consumer read it;
        verified `design.n` is absent from every project file.

    - id: STITCH-ACTIVE-YAML-ABSENT
      severity: warn
      gap_class: missing-binding-pointer
      detail: >-
        idea-layer/.stitch/active.yaml did not exist, so preflight-stitch-project-state exited 2
        with "active.yaml has no project_id; first-time setup?" and Phase 0.5 stitch-reconcile
        skipped itself via its "no active.yaml (pre-Stitch project)" clause — on a project that is
        demonstrably not pre-Stitch.
      fix: 'wrote .stitch/active.yaml with project_id + design_system_id'
      evidence: >-
        Nothing invented. Three on-disk sources already agreed: .stitch/shared_project_id
        (17153754672098888646), .stitch/design_system_id (2005644667042354169), and
        PROJECTS_INDEX.yaml, whose every feature entry carries the same pair. The index also
        records SUCCESSFUL generations (about: 4/4 `result: success` with real screen_ids,
        2026-05-30), so the binding worked historically and only the pointer went missing.
      result: 'preflight-stitch-project-state ERROR -> WARN (project_id resolves; MCP probe unreachable here, degrades to local-state-trusted)'
      ledger_disagreement_noted: >-
        PROJECTS_INDEX records successful 2026-05-30 runs that STITCH_STATUS.yaml does not
        reflect (it holds 0 success / 15 error). Which ledger is authoritative was NOT established
        and is not assumed — restoring the pointer does not by itself resolve STITCH-ALL-ERROR.

