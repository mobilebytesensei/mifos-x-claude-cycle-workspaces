    Impossible before D-1. 39 screens wrote colour as raw hex, so there was no declared pair to
    measure against; the 19 pairs in DESIGN_SYSTEM_STATE covered the pairs the SYSTEM declares,
    never the pairs the SCREENS compose.
  method: >-
    15 distinct foreground-on-background pairs extracted from all 62 ui.yaml, measured light and
    dark. Controls W-11 (primary/surface 6.11) and W-02 (onPrimaryContainer/primaryContainer 7.27)
    reproduced EXACTLY before any new pair was trusted — the method DESIGN_SYSTEM_STATE prescribes.
  result: "all 15 composed pairs PASS AA. Recorded as W-20..W-32."
  tightest: >-
    W-21 primary / primaryContainer — 4.97 light, 0.47 above AA, at 15 sites (avatar initials,
    status chips). Ported faithfully from the green original. Flagged so primaryContainer is not
    lightened without re-measuring.
  found_and_fixed:
    - id: A11Y-FIX-1
      wcag: "1.4.11 non-text contrast"
      defect: "outlineVariant (1.62:1 on surface) used as border_color on 8 input fields — change-password x3, profile x3, forgot-password x2. A control's visual boundary needs 3.0."
      fix: "-> outline (4.24:1), which is exactly what the system's own form.field.outline_default declares and what W-09 already measured."
    - id: A11Y-FIX-2
      wcag: "1.4.11 non-text contrast"
      defect: "outlineVariant carrying 4 link glyphs on the about screen — the trailing icons that signal a row opens an external URL, at 1.62:1."
      fix: "-> onSurfaceVariant (8.93:1), matching how every other screen styles a trailing icon."
    - note: >-
        BOTH are pre-existing and were faithfully ported: the green source was #C5C8BA, which
        measured ~2.1:1 on white and had never been checked. The migration did not introduce
        them — it made them measurable.
  residual:
    - "10 outlineVariant borders remain, all on box / card / text hairlines — decorative, exempt from 1.4.11."
    - "W-32 is recorded as a standing FAIL with a decorative-only constraint, so the next run has the rule rather than the incident."

render_run_2026_08_02T16_40:
  command: "/idea-feature-render --all"
  outcome: "budget-halt — the runtime's declared behaviour for --all (exit 0, ledger printed, rendered files left in place, re-run resumes)"
  rendered: 1
  remaining: 276
  ledger:
    - { screen: profile, state: content, result: written, checks: "RV-023 both palettes · 0 raw hex outside :root · 1 runtime script · shell root+topbar+nav present · 4/4 nav items · 16 component annotations · click parity 5/5 · no device frame · no fixed root px · sticky bottom nav · 0 placeholders" }
  why_halted: >-
    Measured, not estimated: ~950 lines of per-screen input (ui.yaml + api + demo-data + prompt +
    DESIGN.md + app-shell) on top of the ~860-line shared contract (PROMPT_SCREEN + CRAFT_RULES),
    then a ~200-line HD document out. ~31K tokens per render x 277 renders. That is a multi-session
    job by construction, which is why the runtime ships --budget-tokens and cache-resume.
  cache_note: >-
    NO .cache.json entry was written for profile/content. Writing a hash the runtime did not
    compute risks a FALSE cache hit that silently skips a screen on the next run. Re-rendering
    one screen is cheaper than that failure mode.
  discovery: >-
    CRITICAL and wider than D-1 as filed. The existing previews are green for BOTH cohorts, not
    just the 39. home/preview/content.html is a cohort-B screen whose ui.yaml was already
    token-based, and its :root still declares --primary #4C662B / --background #F9FAEF /
    --pending #E8A317. The render injects `design_tokens_css_root`, and at the time these 277
    files were produced that slot resolved to the v3.0.0 GREEN token file. So the D-1 migration
    fixed the SOURCE; every one of the 277 previews remains stale regardless of cohort, and all
    277 must be re-rendered — not the 39 the finding implied.
  new_drift_found_while_binding_content:
    - id: DR-1
      severity: warning
      detail: >-
        profile/ui.yaml declares content "Maria Santos" / initials "MS", while
        profile/demo-data.yaml resolves the same fields to Amina Wanjiru
        (amina.wanjiru@gmail.com). The render contract says demo-data drives data_driven fields,
        so the render used Amina Wanjiru — but the two files disagree and one of them is wrong.
    - id: DR-2
      severity: warning
      status: CLOSED 2026-08-02T18:50Z via /idea-sync
      detail: >-
        Screen YAML referenced `Outfit/*` typography throughout while design-tokens.yaml 2.3.0
        declares Roboto / Roboto Mono. D-1's exact shape one family over.
      correction_to_my_earlier_note: >-
        I wrote "Outfit is declared in NO token version" and "~55 references". BOTH WRONG.
        Outfit IS declared — in design-tokens.v2.0.0.yaml and v3.0.0.yaml, the two SUPERSEDED
        green-era files, exactly like the #4C662B palette. And the count was 651 refs across
        36 files, not 55; my earlier grep matched only the `textStyle:` key and missed the 596
        under `typography:`.
      evidence_that_settled_it:
        - "Outfit appears ONLY in design-tokens.v2.0.0.yaml and v3.0.0.yaml — both superseded."
        - "design-tokens.yaml 2.3.0 (the declared rendering SoT) says Roboto / Roboto Mono."
        - "DESIGN.md — the design-system contract the render uploads to Stitch — says 'Roboto throughout (Material 3 default)' with Roboto Mono for monetary amounts."
        - "design-tokens.yaml's own header records `Type.kt = Typography()`, i.e. the SHIPPED source uses the M3 default, which is Roboto. Source agrees with the token file."
        - "0 Roboto references existed in any screen — the screens had never been migrated, same as the colour half of D-1."
      resolution: >-
        Roboto wins; Outfit is superseded-era residue in the same cohort-A files that held the
        green hex. All 651 refs rewritten across 36 files. The FAMILY was dropped entirely rather
        than swapped for "Roboto/*" — a per-component font family is a token-file concern, and
        re-encoding it in 651 places is what let the two drift apart in the first place. Screens
        now carry the ROLE only.
      transform: '`typography: "Outfit/body_medium"` -> `typography: bodyMedium`'
      verification:
        outfit_refs_remaining: 0
        role_refs_emitted: 521
        distinct_roles: 14
        all_resolve: "every one of the 14 is a declared key under design-tokens.yaml#typography.roles"
      note: >-
        Roles were also normalised snake_case -> camelCase to match the token file's own keys,
        the same convention D-1 settled on for colour roles (onSurfaceVariant, not
        on_surface_variant).
    - id: DR-3
      severity: info
      detail: >-
        Icon library is inconsistent across existing previews — home/content.html loads Material
        Symbols Outlined, profile/content.html loaded Material Icons. PROMPT_SCREEN §7 locks the
        icon library to one declared choice. The new render uses Material Symbols Outlined.

