# ═══════════════════════════════════════════════════════════════════════
# ROOT CAUSE — why the corpus split, and why every prior run missed it
# ═══════════════════════════════════════════════════════════════════════
root_cause:
  id: TWO-COHORTS
  finding: >-
    The 62 ui.yaml files are authored in two mutually exclusive conventions, and the split is
    exact — no file mixes them. Cohort B is the 23 screens every prior run measured; cohort A
    is the 39 it never opened. D-1, D-2, D-6 and the i18n gap are all one symptom of this split.
  cohort_b:
    count: 23
    members: [account-detail, account-holder, accounts, beneficiaries, consent-callback,
              consent-detail, consent-list, direct-debits, home, licences, login,
              payment-consent, payment-status, product, scheduled-payments, send-money,
              settings, standing-orders, statement-detail, statements, transaction-detail,
              transactions, user-onboarding]
    convention: "accessibility_label: flat key · text property `value` · colour by token role · {strings.*} copy · action_contract on every on_click"
  cohort_a:
    count: 39
    convention: "a11y: {role,label} block · text property `content` · colour by literal hex · copy inlined · no action_contract"
    what_it_gets_right: >-
      Cohort A is NOT simply older or sloppier. It uses `content` (which the registry actually
      requires and cohort B does not), it carries `role: heading` semantics cohort B lacks
      entirely, and it resolves 629 spacing / radius / icon token references correctly.
  the_asymmetry: >-
    Spacing, radius and icon tokens WERE migrated across both cohorts. Colour was not. That is
    the whole of D-1: a rename-driven migration cannot reach a value written as `#4C662B`,
    so the colour half of the token migration stopped at the cohort boundary and nothing
    reported it, because the only reader was scoped to the cohort that had no hex.

