    question_was: >-
      components.yaml struck bar_chart on 2026-07-31 recording PFM as out of scope, while
      pfm-dashboard (1,392 lines) and pfm-settings are live. Stale strike, or two screens that
      should not be here?
    answer: >-
      NOT stale. idea-plan.yaml#vision.scope.out_of_scope explicitly lists "PFM dashboard,
      spending-by-category, budgets and recurring-subscriptions screens", moved there on
      2026-07-30 with the rationale "declared in scope but never built". FR-011 says the same in
      its own words: "the dashboard, budgets and drill-down surfaces are out of scope; the
      per-transaction category tag is not." Three artifacts agree — components.yaml, the scope
      block, and the requirement itself. PFM screens are OUT.
    but_this_is_not_a_pfm_problem:
      finding: >-
        The same out_of_scope block lists TWO more entries that also have live, approved screens:
        "ATM / branch locator via HSBC Open Data. No screen, repository or Aisp call exists."
        (atm-locator ships a 192-line demo-data and a full ui.yaml), and "Field-officer /
        agent-banking surfaces (removed — consumer-only app)."
      screens_affected: 16
      list: [pfm-dashboard, pfm-settings, atm-locator, fo-dashboard, kyc-review, customer-search,
             customer-detail, customer-profile, customer-messages, customer-onboarding,
             corporate-onboarding, agent-registration, meetings, account-applications,
             application-detail, business-insights]
      all_at: "status: approved"
      why_this_is_the_real_issue: >-
        RULE-GAP-IDEA-FIRST-001 makes the idea-layer the single source of truth, and here it
        contradicts ITSELF: idea-plan says these capabilities are out of scope and removed,
        while 16 screen docsets say approved. Every downstream consumer — /implement, the
        matrix, the render — reads the screens, not the plan, so the plan's exclusion has no
        force. PFM was one visible instance of a 16-screen drift.
    my_earlier_claim_was_wrong: >-
      I told the user the Kenya/KES content across fo-dashboard, kyc-review, customer-* and
      agent-registration was intentional — "two audiences per design_read" — and wrote _persona
      notes into ~10 demo-data files on that basis. idea-plan#out_of_scope says field-officer
      surfaces are REMOVED. design_read's audience line does mention field officers, so the two
      genuinely disagree, but I asserted the reconciliation as settled when it is not. The
      _persona notes should be treated as unverified until this is decided.
    not_acted_on_deliberately: >-
      Deferring or deleting 16 approved screens is a product decision with a large blast radius,
      and only the PFM pair was asked about. Marking 14 more as out-of-scope on my own reading —
      after having just got the field-officer reading wrong once — would be exactly the kind of
      unilateral scope call that should not happen inside a sync.
    needs_decision:
