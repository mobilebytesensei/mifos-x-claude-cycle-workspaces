        line-based count reported 100 unlabelled; that was an artefact of inverting a multiline
        match line-by-line, and is not a real finding.
    MOTION_001_reduced_motion:
      result: "PASS — 0 violations"
      detail: "every cell that declares an animation also declares a prefers-reduced-motion fallback."

  method_note: >-
    Two scanner errors were made and corrected during this run, recorded because both produced
    confident-looking false results. (1) `rg -h` was used intending --no-filename; in ripgrep -h
    is --help, so a hash-uniqueness check silently compared help text. The short flag is -I.
    (2) Cohort-B was first isolated by grepping for a render-hash marker, but cohort-A carries
    that marker too in a shorter form (13 chars vs 16), so the filter matched all 181 files;
    scoping by the explicit 23-screen list fixed it. Both checks were re-run before any number
    above was recorded.

