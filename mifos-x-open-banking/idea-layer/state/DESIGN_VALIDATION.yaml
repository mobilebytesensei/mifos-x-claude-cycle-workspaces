reconciliation_20260803:
  - id: D-2
    verdict: CONFIRMED-OPEN
    severity: critical
    measured: "262 on_click blocks; 167 declare no action_contract; 20 screens affected"
    prior: "324 across 36 screens"
    delta_explained: >-
      The drop is the field-officer/PFM removal taking sites with it, not repair. Worst
      offenders: consent-manager 28, notifications 24, transaction-tags 17, card-detail 13.

  - id: D-4
    verdict: CONFIRMED-OPEN (reduced)
    severity: critical
    measured: "15 declared states render zero components"
    prior: "18 across 8 screens"
    scanner_correction: >-
      A first pass reported 28. That was wrong: this corpus uses BOTH
      `layout.visible_components` AND `layout.show_components`, and the scanner only knew the
      first, so every atm-locator and fx-rates state was false-flagged. 15 is the corrected count.

  - id: R-1
    verdict: CONFIRMED-OPEN
    severity: critical
    measured: "text: 81 sites use `value` where the registry requires `content` (249 use content). list_item: 5 of 39 satisfy the required `headline` slot."
    prior: "82 use value/style; headline satisfied at 5 of ~35"
    note: >-
      Reproduced to within one site of the prior measurement, from a different scanner. That
      independent agreement is why this stays critical. Its framework half is still FW-3.

  - id: D-3
    verdict: DOWNGRADED critical -> warning
    measured: "6 api-backed screens do not compose the canonical loading/content/error/empty set"
    evidence_for_downgrade: >-
      All six were opened and read. Five are naming variance, not absence — send-money-confirm
      has review/submitting/failed, sca-challenge has content/submitting/error,
      standing-order-create has loading/content/submitting/error/created. The sixth,
      payment-result, documents itself as "Stateless screen — rendered directly from nav args".
      The rule asserts canonical state NAMES; this corpus uses domain names. That is a rule/corpus
      vocabulary mismatch and should not carry a 15-point critical penalty per screen.

  - id: F-005
    verdict: DOWNGRADED critical -> warning, and reframed
    measured: "payment-status#payment_summary is 1 of 9 data-driven containers with no static children; 6 of the 9 declare required_fields"
    evidence_for_downgrade: >-
      It was singled out as uniquely broken. It is not unique — `data_driven: true` is used 270
      times across the app and 193 components DO nest children, so both conventions coexist
      deliberately. payment_summary declares `data_driven: true` AND
      `required_fields: [content.amountLabel, content.creditorName, content.debtorAccountLabel,
      content.submittedAtLabel]`, so its contract IS specified. The real residue is the 3 of 9
      that declare neither children nor required_fields — that is the warning now recorded.

