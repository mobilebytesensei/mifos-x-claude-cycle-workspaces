run_2026_08_04_1140:
  lens: "rendered preview HTML (95 cohort-B cells) + design-tokens.yaml + PRIMITIVES.yaml"
  not_measured: [D-4, A11Y warnings from 08-03, SCHEMA warnings from 08-03]

  new_findings:
    - id: C-1
      severity: critical
      category: COLOR / antipattern
      title: "send-money/success renders a terminal-success signal for a non-terminal payment"
      measured: >-
        success.html declares 4 hexes that exist nowhere in design-tokens.yaml — #B6F2C4 /
        #00210D (light) and #00522A / #9BD8AC (dark) — and uses them for a 96px check_circle hero.
      why_critical: >-
        Two independent rules, both in DESIGN.md. (1) "This palette ships M3's five families and
        no more. There is no amber and no green, so warning maps to tertiary and success maps to
        primary", reinforced by "Don't use green/red money semantics or celebratory colour — this
        is calm, regulated finance." (2) The disposition table maps AcceptedSettlementInProcess —
        which is exactly what payment_submit_response.Data.Status carries in the fixture — to
        **In progress** (secondary #D3E5F5 / #384956, `schedule` icon), NOT to Success (terminal).
        DESIGN.md states the reason directly: "A successful submit returns
        AcceptedSettlementInProcess: accepted, not settled. Showing that as success is a false
        statement about someone's money."
      nuance: >-
        The copy on the cell is honest — the chip reads "Accepted — settlement in process" in
        secondary-container, and the body says the bank has accepted it. The defect is that the
        largest, first-read element on the screen contradicts the text beside it. payment-status
        was praised in the 08-03 record for avoiding exactly this; send-money/success does not.
      introduced_by: "/idea-render-mockup 2026-08-04 — invisible to the 08-03 run, which predates the cell"
      fix: >-
        Drop the four green hexes; render the hero as secondary-container #D3E5F5 / #384956 with
        the `schedule` glyph, matching payment-status and the disposition table. Reserve
        primary-container + check_circle for a genuinely settled payment.
      fixable: true

    - id: W-1
      severity: warning
      category: COLOR
      title: "all 95 cohort-B cells render an M3 derivation that differs from design-tokens.yaml"
      measured: "9 roles differ between the previews and the declared token file"
      deltas:
        dark_surface_background: "tokens #101417 -> previews #101418"
        dark_primaryContainer:   "tokens #004B6F -> previews #004B75"
        light_onPrimaryContainer: "tokens #004B6F -> previews #001E2F"
        light_onSecondaryContainer: "tokens #384956 -> previews #0C1D29"
        dark_secondaryContainer: "tokens #384956 -> previews #37474F"
        light_onErrorContainer:  "tokens #93000A -> previews #410002"
        light_tertiary:          "tokens #64597B -> previews #64547B"
        tertiaryContainer_pair:  "tokens #EADDFF/#4C4162 -> previews #20005D/#4B3E62"
        dark_surfaceContainerHighest: "tokens #313539 -> previews #32363A (as --shimmer-hi)"
      severity_reasoning: >-
        Warning, not critical: every differing pair still passes WCAG AA (measured below), and
        several previews are MORE contrasty than the declared token would be — #001E2F on #C9E6FF
        is 13.24:1 where the declared #004B6F pair is the 7.27:1 quoted in DESIGN.md. So this is a
        conformance defect, not an accessibility one. But it means DESIGN.md's published contrast
        table does not describe what actually renders.
      fixable: true

    - id: I-2
      severity: info
      category: COLOR
      title: "#DB0011 in login/content is HSBC brand red — accepted exception"
      detail: >-
        Sits inside the HSBC logo SVG. A third-party brand asset is legitimately outside the
        app palette; recorded so a future token sweep does not re-flag it as a violation.

    - id: I-1
      severity: info
      category: STATE
      title: "4 api-bearing screens omit a STATE-001 required state with no explicit waiver"
      measured:
        consent-callback: "missing empty"
        payment-consent:  "missing loading, content, empty"
        payment-status:   "missing empty"
        send-money:       "missing empty"
      assessment: >-
        All four look semantically correct rather than defective — a deep-link callback and a
        payment status have no meaningful zero-result state, payment-consent runs its own
        transient vocabulary (validating/exchanging/checking/authorised/error), and send-money's
        omission is already reasoned in demo-data (the no-payees case is an inline affordance so
        the screen is never a dead end). Filed as info because none of the four carries an
        explicit waiver, so each currently reads as an accidental gap.
      also_confirmed: >-
        settings has endpoints: [] and therefore needs no loading state — which independently
