      states: 12
      was: >-
        STN2 gate failure on every state of both screens — assembled prompt 8598 / 8555 chars
        against an 8000 cap — so nothing was rebuilt and all 12 prompts remained pre-migration
        green.
      root_cause: >-
        A splitter bug, not a screen-size problem, and NOT caused by the D-1 migration (the
        migration added roughly +118 chars to consent-manager; it was ~480 over the cap already).
        `splitIntoSections` in .claude-runtime/scripts/stitch-prompt-build.ts bailed on
        `chunks.length < 2`. But the caller only reaches the splitter when the ASSEMBLED prompt
        is already over cap, and moving the composition into a section file shrinks the parent to
        header + refs + manifest regardless of how many chunks the composition needs. So the
        splitter refused exactly the screens it exists for: ones whose composition fits in a
        single chunk but whose header+manifest pushes the total over. Guard relaxed to
        `chunks.length < 1`.
      result: "12/12 rebuilt, 0 failed. consent-manager avg 854 chars (was 8547), pfm-dashboard avg 843. Both render-ready."
