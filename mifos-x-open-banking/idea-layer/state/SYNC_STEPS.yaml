        `contract_versions.current` had to resolve under its own parent to reach 2.0.0. Axes whose
        glob matches nothing, whose watermark key is absent, or whose framework locator still holds
        an unexpanded `{slug}` now classify as n/a — never a halt. Added a positional-arg guard;
