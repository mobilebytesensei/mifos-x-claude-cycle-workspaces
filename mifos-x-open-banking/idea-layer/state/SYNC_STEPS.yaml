        order is not significant, and this project writes `- type:` first: 1011 such list items
        against 87 starting with `- id:`. The gate therefore evaluated 87 of ~1033 components
        (8%) and reported "0 violations" over that sample. RULE-IDEA-ACTION-CONTRACT-001 is
        severity:error with no waiver, so it read as green while dormant on 92% of the surface.
        This is the origin of the "87 component blocks" figure carried in CAPABILITY_GAPS.
      fix: >-
        Buffer opens on any `- <key>:` list item; a buffer is counted and checked only if it
        declares a `type:` (matching action-contract-walk.ts semantics), and the component id is
        recovered from the buffer when it is not the opening key.
      verified: >-
        46 files / 1334 blocks / 0 violations (superset of the walker's 1033, so nothing is
        skipped, and no false failure was introduced). Canaries: red exit 1, green exit 0,
        red-nested exit 1 attributing to the nested notify_row, interaction-contract exit 0.

    - id: ACTION-CONTRACT-VOCABULARY-HOLE
      severity: error
      scope: project
      detail: >-
        action-contract-walk.ts reports 95 on_click components NOT evaluated because their `type`
        is outside the rule's INTERACTIVE vocabulary — by type box=44, stack=31, icon=9, text=3,
        chip_group=2, date_picker=2, bottom_sheet=1, image=1, menu=1, tab_bar=1; by feature
        consent-manager=23, notifications=23, transaction-tags=12, card-detail=8, fx-rates=7,
        send-money-confirm=7, standing-order-create=5, products=4, atm-locator=3, cards=2,
        send-money-amount=1. Every one of the 10 types is genuinely interactive (tappable
        containers, icons, pickers, sheets), so this is a coverage hole, not a correct exclusion.
      measured: >-
        Widening the vocabulary in a scratch copy of the walker turns all 95 into AC1 failures:
        every one of them has on_click and NO action_contract block at all. This is NOT the
        zero-impact widening the 2026-07-31 precedent performed — it is 95 real authoring gaps.
      not_done: >-
        The framework INTERACTIVE set was deliberately NOT widened in this run. Widening first
        would turn a severity:error gate red across every project before the data exists to
        satisfy it. Correct order is: author the 95 action_contract blocks, then widen, at which
        point the widening is a no-op-safe tightening.
      surfaced_to_user: true

    - id: WALKER-UNTYPED-TRUNCATED
      severity: warn
      scope: framework
      file: .claude-runtime/scripts/action-contract-walk.ts
      detail: >-
        The coverage-hole list was hard-truncated to the first 20 rows with no flag to see the
        rest and no rollup, so the hole could be seen but not triaged — the 20 printed rows all
        came from one feature, which reads as a one-feature problem rather than 95 across 11.
      fix: "Added by-type and by-feature rollups (always printed) plus a --report-untyped flag for the full list."

