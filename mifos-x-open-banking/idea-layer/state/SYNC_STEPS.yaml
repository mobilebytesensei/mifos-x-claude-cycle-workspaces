        the SH-1 header remediation was incomplete — 272 of 293 files carried the
        sibling/schema_version/feature_id triple and the 21 that did not were ALL ui.yaml.

    - step: STEP 3 (enrichment)
      status: complete
      scope: 'targeted — SH-1 ui.yaml header completion across 21 features'
      detail: >-
        Not a full enrichment pass. /idea-feature-enrich-loop --auto established earlier today
        that the corpus has zero screen-level findings at every category the validator measures,
        so there was nothing to enrich. This run closes the one concrete, mechanical gap that
        remained.
      applied:
        - features: 18
          change: 'prepended sibling: ui / schema_version: "4.0" / feature_id: {f}'
          list: >-
            about, atm-locator, card-detail, cards, change-password, consent-manager,
            direct-debit-detail, forgot-password, fx-rates, notifications, payment-result,
            products, profile, sca-challenge, send-money-amount, send-money-confirm, splash,
            transaction-tags
        - features: 3
          change: 'prepended sibling: ui / feature_id: {f} ONLY — no second schema_version'
          list: 'privacy-policy, standing-order-detail, terms-of-service'
          why: >-
            These three already self-declare schema_version: "3.1" deeper in the file. Blindly
            prepending a "4.0" line would have produced a DUPLICATE MAPPING KEY — the exact
            corruption class that made 8 ui.yaml unparseable on 08-02. Their self-declaration is
            left intact and a comment records why the triple is split.
      why_4_0_and_not_3_1: >-
        The bodies use the old dialect (`id:`, no `screens[]` array), so they do NOT satisfy
        ui.sibling.schema.json — which requires sibling + schema_version + feature_id + screens +
        components + states + state_model. Declaring "4.0" is therefore a TARGET claim, not a
        conformance claim. That is the convention this project already runs on: the docs.yaml
        files prepended earlier declare "4.0" while missing required `id` and `review_package`
        (verified on about, splash, profile — and on home and accounts, which are the older
        "good" generation). Declaring "3.1" on ui.yaml while docs.yaml says "4.0" for the same
        feature would have introduced a NEW inconsistency rather than removing one.
        SH-1 stays OPEN as a warn for exactly this reason — the body-shape divergence is
        untouched, and this run does not claim otherwise.
      verification:
        - '293/293 parse clean after the edits (duplicate keys would fail here — none did)'
        - '0 files carry a duplicate schema_version key'
        - 'all 21 resolve sibling + schema_version + feature_id on parse, including the 3 split ones'

    - step: STEP 4 (artifacts)
      status: complete
      verdict: 'no regeneration owed'
      detail: >-
        Judged on content per $skip_if_fresh, not mtime. The change is a pure header prepend:
        no component, tag, nav edge, endpoint or screen-set change. APP_FLOW.mmd derives from
