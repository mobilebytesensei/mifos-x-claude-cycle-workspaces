      - "27 of 34 features with previews render at least one data-component-id that no longer exists in their ui.yaml. Raw counts overstate it — some are presentational wrappers the idea-layer legitimately does not model (the same class TRAINING_MASTER#test_tags.unbound_class describes) — so the count is a signal, not a verdict."
    why_no_gate_caught_it:
      mechanism: >-
        preview/.cache.json stores the input hash AS OF RENDER TIME and is never re-derived
        against the current ui.yaml. It is write-only provenance, not a freshness check, so it
        cannot report stale — it reported home's 2026-05-29 render as fresh indefinitely. Same
        ghost-fresh class the EXPORT_MATRIX audit found on 2026-08-03 (a `fresh` cell whose
        output_path never existed), in a different ledger.
      compounding: "/idea-verify-e2e's V1-RENDER-PREVIEW-EXISTS is presence-only. A file that exists and renders another app's data passes it."
    corrects_this_sessions_own_record:
      target: "PIPELINE_STATE#capabilities.idea-verify-e2e.run_2026_08_03_1620"
      detail: >-
        That run scored render 15/15 for 22 features on presence + `.cache.json` fresh. The cache
        cannot establish freshness, so those 22 scores measured the existence of files rendered
        against a ui.yaml that no longer exists. The roster mean of 72 is overstated; the render
        column needs re-scoring once a content-level detector exists. Recorded here rather than
        silently re-scoring, because inventing a corrected number without a detector would repeat
        the original mistake.
    delegated_to: /idea-feature-render
    why_not_healed_here: >-
      ~130 LLM-rendered HTML states across 34 features is a generation tranche, not a heal step —
      the same disposition /idea-heal took for ZERO-PREVIEW-12 on 2026-08-03. Hand-writing preview
      HTML in a sync would also bypass the renderer that owns the artifact.

  not_fixed_by_design:
    # Each of these has a determinate fix ONLY if a decision is made first. Guessing would
    # silently make that decision — the /idea-heal TWO-GENERATIONS precedent.
    - id: RETRY-ON-403-SPLIT
      severity: warn
      why_not: >-
        7 features specify a 403 path and split 4-3 on offering Retry. Both sides state sound
        reasoning in their own scenario text (direct-debits "retry cannot help — consent must be
        re-authorised" vs standing-orders "user can attempt to re-consent and retry"). Picking
        either presupposes the answer for the other four. Needs one product decision, then a
        mechanical sweep.
    - id: PRIORITY-VOCABULARY-FIVEFOLD
