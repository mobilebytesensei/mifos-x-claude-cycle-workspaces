    - id: TWO-GENERATIONS
      severity: warn
      why_not: "unchanged — blocked on product decision; still gates NAV-ORPHAN-13 and ZERO-PREVIEW-12"
    - id: SIB-TESTS-22
      severity: warn
      why_not: "22 features have no tests.yaml. Authoring scenarios belongs to /idea-feature-enrich; this command consumes them"
    - id: REGISTRY-GAPS-310
      severity: warn
      scope: framework
      why_not: "editing the shipped component registry changes rendering for every project on this framework"

  artifacts_no_op:
    verdict: "STEP 4 correctly a no-op this run"
    why: >-
      APP_FLOW.mmd reads flows/ + screens/*/flow.yaml; TAG_REGISTRY reads ui.yaml + data-flow.yaml
      + idea-plan.yaml; DEV_STATUS reads PIPELINE_STATE + idea-plan. This run touched four
      tests.yaml, one PROJECT_CONFIG and two state files — no input to any of the three. Declared
      rather than blind-regenerated so the ledger records a reasoned skip, not a missing step.

  method: >-
    Preflight suite executed (5/5 PASS). Shipped gates re-executed rather than read from the last
    record. Every fix was verified against a source outside the file being changed — source Kotlin
    for the home contradiction, disk directory listing for the module list, a repo-wide consumer
