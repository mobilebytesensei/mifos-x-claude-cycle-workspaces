    - id: PF25-LOCATOR-COMPARE
      severity: error
      scope: framework
      file: .claude-runtime/scripts/preflight-probe-idea-migration.sh
      detail: >-
        The probe compared `declared_version_at` against `framework_version_at` as raw strings.
        Both manifest fields are LOCATORS (`<path-or-glob>#<key>`), never version values, so the
        compare was between two different path strings and reported drift on 4/4 axes for every
        project on every run — a `production-affecting` halt by construction. It also never
        dereferenced either side, so it could not have detected real drift.
      fix: >-
        Added indentation-scoped YAML key resolution (`read_yaml_key`) and dereferenced both sides
        before comparing. A leaf-name grep was not sufficient: `current:` occurs twice in
