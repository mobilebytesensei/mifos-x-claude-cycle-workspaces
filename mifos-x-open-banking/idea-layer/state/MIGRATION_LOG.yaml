    sh1_not_addressed:
      finding: SH-1
      note: >-
        This run does NOT close SH-1 (161 sibling YAMLs missing the v4.0 header triple
        sibling/schema_version/feature_id), and no invocation of this command could.
      why:
        - >-
          schema-contract axis — engine_writes is [contract_version, status, approve_hash,
          last_verify] per core/registries/idea-migration/schema-contract/transform_ref.yaml.
          The header triple is not in the engine's authorised write set, so even a version
          mismatch would not have added it.
        - >-
          schema-split axis — scoped to monoliths, of which this project has none. The header
          triple is emitted by that axis only when SPLITTING a monolith into siblings; files
          already in sibling form are never revisited.
      disposition: >-
        Hand-applied in the follow-on step as a purely additive 3-line prepend per file.
