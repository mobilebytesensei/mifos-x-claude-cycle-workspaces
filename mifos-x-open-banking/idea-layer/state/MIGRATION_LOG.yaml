      scratch_root: ".claude-runtime/scratchpad/idea-migration/20260803-081347-phase0"
      diff_path: ".claude-runtime/scratchpad/idea-migration/20260803-081347-phase0/DIFF.txt"
      diff_shape: "23 files · +46 / -61 lines · reviewed before --confirm"
      post_apply_check: "all 23 real files byte-identical to the reviewed dry-run output"
