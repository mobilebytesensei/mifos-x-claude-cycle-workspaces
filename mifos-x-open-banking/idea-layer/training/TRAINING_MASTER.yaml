# ─── Test tags ────────────────────────────────────────────────────────────────
# Added 2026-08-02 by /idea-sync (source-truth pass). Before that pass only 7 of 23 features
# declared any test_tag at all while source carried 282 TestTags constants across 18 modules —
# so a generator had no way to emit a tag a shipped test already asserts on.
test_tags:
  rule: RULE-KMP-COMPOSE-UITEST-001
  direction: source-is-truth
  bound_across_roster: 254           # re-counted 2026-08-04 across all 46 features
  coverage: >-
    20 of 46 features carry at least one test_tag. The 2026-08-02 entry read "20 of 23", which
    was near-complete coverage; the same 20 features against a 46-feature roster is 43%. The 26
    unbound features are the roster growth since — they have no *TestTags.kt in source to copy
    from yet, so binding them is blocked on implementation, not on this file.
  contract: >-
    Copy the tag string VERBATIM from feature/{f}/.../{F}TestTags.kt onto the matching
    ui.yaml component's `test_tag:`. The value is what onNodeWithTag asserts on, so a
    "tidied" string silently breaks every Robolectric and instrumented test for that screen.
  conventions_in_use:
    # Three coexist and ALL are source truth. Do not harmonise them.
    - { form: "feature:camelCase", examples: ["accountDetail:headerCard", "consentDetail:statusChip"], features: 11 }
    - { form: "feature_snake_case", examples: ["transactions_period_summary", "home_hero_card"], features: 5 }
    - { form: "bare",              examples: ["hsbc_explainer_card", "intro_continue", "authorising_spinner"], features: 2 }
  intra_file_breaks:
    note: >-
      Two modules mix forms WITHIN one TestTags object: statements uses "statements:camelCase"
      for flat consts but "statements_snake_$id" for its three per-row builders, and
      statement-detail does the same with txnRow. Both are source truth.
  builder_keys:
    note: >-
      Per-row tags come from builder fns, so the suffix is whatever source passes — not always
      the obvious domain id. Three cases worth knowing before authoring a test:
    cases:
      - "transactions row/pendingBadge -> transactionId.ifBlank { \"txn-$index\" }, because OBIE makes TransactionId optional"
      - "account-detail chip -> the AccountDetailChip ENUM CASE (Transactions, StandingOrders, ...), not a slug"
      - "consent-detail dateRow -> a private DateSlot enum's slug (connected / expires / txnFrom / txnTo)"
  unbound_class:
    note: >-
      ~60 source tags have no component to bind to and are recorded per feature under
      ui.yaml#test_tags.unbound rather than dropped. They are almost all one of three shapes:
      a content-root tag on a wrapper column the idea-layer does not model, a *Title / *Body
      tag on a Text node modelled as the parent component's `title:` / `body:` FIELD, or a
      generic BASE const (settings:section, settings:row) never applied on its own.
    do_not: >-
      Do NOT synthesise child components to give these tags an anchor — it would inflate the
      component inventory this file counts, and design-validate's REG checks with it.

# ─── State patterns ───────────────────────────────────────────────────────────
state_patterns:
  architecture: stream-first
  note: >-
    BaseViewModel<S,E,A> + ScreenDataStream + Store5. Screens declare states in ui.yaml
    and each declared state gets a rendered preview under screens/{f}/preview/{state}.html.
  shape: >-
    `states:` is a MAP keyed by state name, not a list, and some files carry a scalar
    `initial_state:` inside that map while others put it at document level. A reader that
    assumes a list silently counts zero states.
  canonical_four:
    description: The baseline every data-backed screen carries.
    states: [loading, content, error, empty]
    coverage:                  # re-measured 2026-08-04 over 46 screens
      content: 41
      error: 38
      loading: 36
      empty: 30
  domain_states:
    description: >-
      Consent- and payment-journey screens add states beyond the canonical four. These
      are OBIE journey stages, not generic UI states — reuse the exact name when the
      same stage recurs rather than coining a synonym.
    consent_journey: [intro, checking, awaiting, authorising, authorised, exchanging,
                      access_denied, error_auth, security_error, revoke_confirm, revoking]
    payment_journey: [validating, submitting, success, created, failed, review]
    connectivity: [no_network, unauthenticated]   # 7 screens each — added since the 08-02 pass
    editing: [edit_mode, view_tags, save_success, cancel_confirm, populated, idle, navigating]
    card_lifecycle: [frozen]
    platform: [unsupported]   # 3 screens — capability not available on the target platform

# ─── API patterns ─────────────────────────────────────────────────────────────
api_patterns:
  ownership: external-consumer
  note: >-
    This project OWNS NO backend and NO database. idea-layer/server/apis/* are CLIENT
    contracts for Ktorfit codegen against the HSBC UK/CE sandbox (OBIE Read/Write
    Standard) — never owned schema. RULE-IDEA-SERVER-DATA-001 owned-DB checks SKIP here.
  shape: >-
    Operations live under `api:` (a list), NOT `operations:`, and the HTTP verb is the first
    token of the `endpoint:` string ("GET /obp/v5.1.0/..."), not a separate `method:` field.
    17 of 46 features declare a non-empty api[].
  operations_by_verb:            # re-measured 2026-08-04 over 46 features
    GET: 20        # AIS read surface — accounts, balances, transactions, standing orders, ...
    POST: 10       # PIS write surface + consent creation (PSU instruction only)
    DELETE: 3      # consent revocation, standing-order + tag deletion
    PUT: 3         # standing-order edit, card controls, profile update
  role:
    AISP: read-only account information
    PISP: >-
      domestic single payment initiation, in scope since the 2026-07-30 reversal. Writes
      occur ONLY on the PSU's explicit instruction and always behind an authorised consent.
  conventions:
    - Every operation that touches account data requires a live consent; model the
      consent check as an explicit state, not an implicit precondition.
    - requires_permission on an operation drives platform permission codegen
      (RULE-PERMISSION-CODEGEN-001).

# ─── DTO registry ─────────────────────────────────────────────────────────────
# Captured 2026-08-04 by /idea-data-dtos Step 7 (RULE-TRAINING-EVOLVE-001). This section was
# owed on the 08-04 run that grew the registry 55 -> 90 and was not written then; the gap was
# flagged by /idea-verify-e2e as TRAINING-CAPTURE-SKIPPED across two runs before being closed.
dto_registry:
  total: 90
  authority: source
  authority_note: >-
    The registry is bound to SOURCE, not to the OBIE wire vocabulary. Bindings came from
    core/network/api/Aisp.kt return types and core/data/banking/*Repository.kt stream types.
    A DTO name in api.yaml#response_dto names the DOMAIN model the repository yields, not the
    envelope the bank sends — the mapper sits between them.
  cohorts:
    source_bound:
      count: 35
      detail: >-
        Every one carries source.source_binding naming the Kotlin file it was derived from.
        These are what screens/*/api.yaml resolves against.
    obp_era:
      count: 55
      detail: >-
        Pre-existing, consumed by screens/*/data-flow.yaml. 40 of their used_by[].api_id values
        name OBP-vocabulary operations that exist in no api.yaml — live D5 drift, left visible
        rather than papered over. Do NOT treat these as a naming precedent for new work.
  before_authoring_a_dto:
    - Check whether the shape already exists in core/model/banking (domain) or
      core/network/model (wire). Author from source; do not invent a name.
    - Prefer the DOMAIN model where a repository yields one. Fall back to the wire type only
      where no domain model exists — that is why the PISP and consent-create entries are wire.
    - "A DTO with no Kotlin counterpart MUST declare source.spec_ahead_of_source: true and say
      in source_binding_note where its fields actually came from. Six entries do."
  naming_lesson: >-
    The 2026-07-28 reverse-sync wrote 17 OBIE names (OBReadAccount6, OBWriteDomesticConsent4, …)
    into api.yaml. Those names appear in ZERO Kotlin files — `rg 'OBRead|OBWrite' --type kt`
    returns nothing — and no field schema for them existed anywhere in the project, so they
    could be neither resolved nor authored. RULE-DTO-REGISTRY-001 D2 failed on 21 features for
    a week. The lesson is not "OBIE names are bad"; it is that a spec name with no source
    counterpart and no field schema is unresolvable by construction.
  worked_example:
    endpoint: "GET /open-banking/v3.1/aisp/accounts"
    wire: "AccountsResponse (core/network/model/ais/accounts/) — the OBIE Data.Account[] envelope"
    domain: "BankAccount (core/model/banking/BankAccount.kt) — what AccountsRepository.accountsStream yields"
    registered_as: BankAccount
    why: "response_dto names what the consumer receives after mapping, which is the domain model."

