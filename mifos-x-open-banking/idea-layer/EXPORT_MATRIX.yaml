      carried_from_source_not_paraphrase:
        - "consent-detail: a 404 on DELETE is SUCCESS, not failure — treated idempotently as already-revoked, same local cleanup, navigate to consent-list with NO error surfaced. Showing an error would tell the customer revocation failed when access is in fact gone."
        - "consent-callback: AwaitingAuthorisation maps to `awaiting` with a poll CTA, NOT to error — HSBC may lag in flipping status after the PSU authorises. A state/nonce mismatch is a CSRF/replay signal and must never be retried silently. The two calls authenticate differently: token-exchange via private_key_jwt, status via client_credentials (not the PSU bearer just obtained)."
        - "consent-list: there is NO list endpoint — the list is assembled client-side by calling consent-status per locally-stored ConsentId, so consents granted through another channel are invisible by construction. Sandbox allows only ONE active consent at a time. ErrorAuth is a fifth state with a Re-authenticate CTA because retrying an expired session cannot succeed."
        - "consent-manager: manages OBP consumer-scoped consents (third parties at this bank) — a DIFFERENT object from the OBIE account-access-consents that consent-list/consent-detail manage. Revoke (active, live API call) vs Remove (expired, nothing to end) are distinct events for that reason."
        - "beneficiaries: the error state carries TWO CTAs because ConsentRevokedError is not retry-recoverable — View Consents is the only route that resolves a missing ReadBeneficiariesDetail permission."
