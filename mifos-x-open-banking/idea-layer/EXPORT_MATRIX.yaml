# ═══════════════════════════════════════════════════════════════════════════════════════════
# COPY GAP — RAISED 2026-08-07, RESOLVED 2026-08-07 (same day, second pass).
#
# ⚠ THE FINDING BELOW IS HISTORY, NOT A WORK-LIST. The `payment.*` and `vrp.*` namespaces now
# EXIST in _strings/strings.yaml and every {strings.*} reference in the seven payment ui.yaml
# files resolves. Read `resolution_2026_08_07` for what closed it and `residual_gap` for what
# genuinely remains — which is a DIFFERENT class and must not be confused with this one.
#
# CORRECTED IN PLACE rather than deleted, per this file's convention (see the fx-rates and
# cards corrections in mass_invalidation_2026_08_06). The original measurement is the only
# record of what the prompts looked like before the catalogue was completed, and one of its
# observations — marker_coverage_is_incomplete — is a finding in its own right that outlived
# the gap it described. Erasing the block would erase that too.
#
# `blocks:` IS LIFTED. /idea-feature-stitch is no longer gated on this. See resolution.
# ═══════════════════════════════════════════════════════════════════════════════════════════
copy_gap_2026_08_07:
  status: RESOLVED
  raised_at: "2026-08-07"
  resolved_at: "2026-08-07"
  resolved_by: "/idea-sync — catalogue completion + prompt re-binding pass"
  applies_to: "cells[] rows with output_type: prompts_per_state and exported_at: 2026-08-07 (43 rows, all carry copy_gap_ref)"
  applies_to_note: >-
    The EIGHT content.{review,schedule} rows added later the same day do NOT carry copy_gap_ref
    and are not in scope. They were authored after the catalogue was completed, so they were
    never part of the unbound population this block measured.

  # ── AS MEASURED WHEN RAISED. Every figure below is the pre-resolution state. ──────────────
  as_measured_when_raised:
    namespaces_absent_from_catalogue: ["payment.*", "vrp.*"]
    catalogue: "idea-layer/_strings/strings.yaml"
    measured_2026_08_07:
      unresolved_key_references: 81
      distinct_unresolved_keys: 37
      files_carrying_inline_COPY_GAP_marker: 18   # of 43
      COPY_GAP_marker_occurrences: 58
    estimate_correction: >-
      This gap was carried into the run as "~96 unresolved string keys". The measured figures are
      81 references over 37 distinct keys. Recorded as measured rather than as estimated — 96
      matches neither the reference count nor the distinct-key count, and an unreproducible number
      in a staleness ledger is the same class of defect as an unverified `fresh`.
    per_feature:
      # key_refs = occurrences of a payment.* / vrp.* key; gap_files = prompt files carrying an
      # inline COPY GAP marker; states = prompt files for that feature.
      payments:                         { key_refs: 0,  gap_files: 0, states: 1, verdict: catalogue-clean }
      pay-domestic-single:              { key_refs: 9,  gap_files: 4, states: 5, verdict: unresolved-keys }
      pay-domestic-scheduled:           { key_refs: 9,  gap_files: 4, states: 5, verdict: unresolved-keys }
      pay-domestic-standing-order:      { key_refs: 5,  gap_files: 3, states: 4, verdict: unresolved-keys }
      pay-international-single:         { key_refs: 1,  gap_files: 0, states: 5, verdict: unresolved-keys-UNMARKED }
      pay-international-scheduled:      { key_refs: 5,  gap_files: 4, states: 5, verdict: unresolved-keys }
      pay-international-standing-order: { key_refs: 6,  gap_files: 3, states: 3, verdict: unresolved-keys }
      pay-vrp-mandate:                  { key_refs: 45, gap_files: 0, states: 7, verdict: unresolved-keys-UNMARKED }
      payment-consent:                  { key_refs: 0,  gap_files: 0, states: 5, verdict: catalogue-clean }
      payment-status:                   { key_refs: 1,  gap_files: 0, states: 3, verdict: unresolved-keys-UNMARKED }
    not_stale:
      detail: >-
        These 43 rows are `fresh`, and that is correct: they were regenerated from the current YAML
        and match it. The gap is in the STRING CATALOGUE, not in the prompts — re-running
        /idea-feature-export would reproduce the same output. Marking them stale would put 43
        regenerations on a work-list that cannot fix anything. The fix is to author the
        `payment.*` and `vrp.*` keys into _strings/strings.yaml.
    blocked_at_the_time: "/idea-feature-stitch for the eight affected features — do not GENERATE against unbound copy"

  # ── THE OBSERVATION WORTH KEEPING, independent of the gap it was made about ───────────────
  # Retained at top level, not folded into as_measured_when_raised: it is a finding about how
  # this class of work gets SIZED, and it stays true for the next unbound-copy episode.
  marker_coverage_is_incomplete:
    severity: warn
    still_applies: true
    still_applies_reason: >-
      The gap closed; the lesson did not. An inline marker is authored by whoever noticed, so its
      coverage tracks attention rather than incidence — the next copy gap will be mis-sized the
      same way unless it is measured rather than searched for.
    detail: >-
      The inline COPY GAP markers covered only 18 of the 43 files, across FIVE features. Three
      more features carried unresolved keys with NO marker at all, and one of them —
      pay-vrp-mandate — held 45 of the 81 references, the whole `vrp.*` namespace, more than
      every other feature combined and with ZERO markers. Anyone sizing this work by searching
      for the string "COPY GAP" would have missed the largest offender entirely, and would have
      read pay-international-single and payment-status as clean. The markers were a partial
      signal; the per_feature table was the complete one. Measure, do not grep.

  # ── WHAT CLOSED IT ────────────────────────────────────────────────────────────────────────
  resolution_2026_08_07:
    catalogue_change:
      renamed: 63          # send_money.* -> payment.*, error.send_money.* -> error.payment.*
      dropped: 3           # screen_title, step_indicator, step_indicator_a11y — send-money-only
      dropped_detail: >-
        All three belonged to the deleted screen and had nowhere true to go. step_indicator /
        step_indicator_a11y were its three-step pager's "Step N of M"; every new rail renders a
        stepper with per-step captions (payment.step.*) and none renders an N-of-M string.
        screen_title named the deleted screen; each of the six per-type rails now carries its own
        pay_*.title.
      authored: 113        # 71 payment.* + 36 vrp.* + 6 pay_*.title
      net_effect: "all 129 {strings.*} references across the seven payment ui.yaml files resolve"
    prompt_change:
      files_rebound: 43
      mockups_rebound: 10  # mockups/{f}/MOCKUP.md
      files_created: 8     # the content.{review,schedule} rows registered in cells[] above
      old_shapes_corrected: ["send_money.*", "review_*_label", "confirm_cta", "submitting_label"]
      old_shapes_note: >-
        These four were the pre-rename shapes. Eight keys changed SHAPE as well as prefix during
        the rename (review_from_label -> review.from and its four siblings, confirm_cta ->
        confirm, cancel_cta -> cancel, submitting_label -> submitting), so a prompt carrying the
        old shape would have gone on resolving to nothing even after the namespace existed. Every
        occurrence was re-pointed at the value the catalogue actually holds.
    blocks_lifted: true
    blocks_lifted_detail: >-
      The `blocks:` assertion on /idea-feature-stitch is discharged for the unbound-namespace
      reason. It is NOT discharged for the residual_gap below — that is a different class and
      carries its own, narrower gate.
    what_this_does_NOT_change: >-
      The 43 rows stay `fresh` and their source_hash stays null. They were fresh before this pass
      for the reason not_stale gives, and nothing here recomputed a stripped content_hash. A
      resolved copy gap is not a freshness event.

  # ── WHAT GENUINELY REMAINS — a DIFFERENT class ───────────────────────────────────────────
  residual_gap:
    status: OPEN
    class: component-not-declared
    class_detail: >-
      NOT unbound keys. Every key a component references now resolves. What remains is copy the
      screens need for which ui.yaml declares NO COMPONENT — and until the component exists there
      is nothing for a key to label, so authoring one would put an orphan in the catalogue of
      exactly the kind the 2026-07-30 prune had to sweep (9 home.quick_actions.* keys, see the
      foot of strings.yaml). The fix is a ui.yaml enrichment pass, NOT a strings.yaml pass, and
      running the latter first would produce keys with nothing to bind to.
    owed_by: /idea-feature-enrich
    not_owed_by: /idea-sync
    confirmed_items:
      pay-vrp-mandate:
        - "pay-sheet submit CTA — payment_amount_field and payment_reference_field are declared on the Paying state; the control that sends the payment is not. state_model declares the action (ConfirmFundsAndPay) with no component to fire it."
        - "revoke-dialog dismiss — revoke_confirm_dialog declares title, body and confirm. There is no dismiss control at all, so a modal on a destructive action has one exit and it is the destructive one. See ux_defect_2026_08_07."
        - "create-step CTA — create_step_indicator advances four steps with no Next/Create control declared on any of them."
        - "per-payment charge note — Charges come back on the PAYMENT (0.05 GBP UK.OBIE.CHAPSOut on all eight settled payments), never on the consent. create_review_card's own note says a mandate has no cost and each draw under it does; nothing on the pay sheet tells the PSU that."
        - "amount / reference field helpers — payment_amount_field validates against MaximumIndividualAmount AND every periodic limit, and its note says the app must name the limit that stopped it because the bank's U014 never does. No helper_text is declared to carry any of it. payment_reference_field likewise."
      error_payment_namespace:
        - "no U027 copy — the creditor-scheme refusal, and the most-hit code across the corpus (eight scenarios on the domestic rail alone)."
        - "no U003 copy — the date rejections: T+0 and T+366 on the scheduled rails, and the three-rule final-payment-date refusal on the domestic mandate."
        - "no U005 copy — the field-refused-on-this-rail class (RemittanceInformation on international, InstructedAmount on the domestic mandate, FirstPaymentAmount on the international one)."
        - "no date-rejection copy generally — error.payment.* holds ten keys and none of them is about a date."
        - "consequence: error_panel selects copy by ErrorCode + Path (never Message, per every rail's own note). A code with no key selects nothing, so these rows render blank — the exact failure the never-key-on-Message rule was written to avoid."
      error_panel_header:
        - "No error-panel HEADER key is bound on either international deferred rail. pay-international-scheduled/prompts/error.md and pay-international-standing-order/prompts/error.md both say so in the artifact itself and instruct the renderer to emit the error rows alone rather than invent one."
      international_rails:
        - "ui.yaml declares no next_button, and the catalogue holds no key for the label, on THREE step-advance controls the prompts render: pay-international-single/prompts/content.md (a 'Next' button, no id), pay-international-scheduled/prompts/content.md (id `next_button`), and pay-international-standing-order/prompts/content.schedule.md ('Next', advances to the Amount step). Each prompt marks its own label UNSOURCED. Either the component is owed or the prompts are ahead of the contract; recorded rather than resolved by assumption in either direction."
    marker_evidence:
      measured_at: "2026-08-07 (second pass, post-re-binding)"
      scope_measured: >-
        25 of the 51 prompt files — the pay-international-{single,scheduled,standing-order},
        payment-consent and payment-status sets. The remaining 26 (payments, the three domestic
        rails, pay-vrp-mandate) were NOT re-swept for surviving markers in this pass.
      surviving_markers: 8
      surviving_marker_files:
        - "screens/pay-international-scheduled/prompts/error.md — 5 (one is a checklist back-reference, not a slot)"
        - "screens/pay-international-standing-order/prompts/error.md — 3 (one is a checklist back-reference)"
      old_key_shapes_remaining: 0
      old_key_shapes_note: >-
        Zero hits for send_money.* / review_*_label / confirm_cta / cancel_cta / submitting_label
        across all 25 measured files. The review prompts use `confirm_button` and literal row
        labels; payment-status uses camelCase `content.*Label` bindings. This is the direct
        evidence for resolution_2026_08_07#prompt_change.old_shapes_corrected on that subset.
      not_yet_measured:
        files: 26
        detail: >-
          The domestic and VRP prompt sets were not re-swept. Their surviving-marker count is
          UNKNOWN and is deliberately not estimated here — an unreproducible number in this
          ledger is the defect estimate_correction was written about, and the 43-file population
          this block originally measured is not a valid basis for a post-re-binding count.
        how_to_close: "Read the 26 remaining prompt files and extend surviving_marker_files."
      what_the_markers_mean_now: >-
        The markers that SURVIVED are residual_gap, not a regression of the resolved copy gap.
        The resolved gap was keys that did not exist for components that DID; these are copy
        needed for a slot ui.yaml never declared. Same marker string, opposite direction,
        different owner (/idea-feature-enrich, not /idea-sync).
      and_still_incomplete: >-
        marker_coverage_is_incomplete applies to THIS list too, and more sharply: the surviving
        markers cover TWO files on TWO features, while confirmed_items names items on four —
        pay-vrp-mandate carries the largest confirmed set and ZERO markers, exactly as it carried
        45 of the 81 unresolved references with zero markers when the gap was raised. Size this
        from confirmed_items, never from a marker search.
    struck_items:
      # Carried into this pass as residual gaps, checked against the catalogue, and NOT upheld.
      # Recorded rather than dropped: an item silently removed from a gap list is indistinguishable
      # from one silently forgotten, and the next pass would re-raise it. Same discipline as
      # estimate_correction above — a gap list is only useful if its entries are reproducible.
      - item: "no base `payment.confirm` key for the two instant rails' amount-bearing CTA"
        verdict: NOT-UPHELD
        evidence: >-
          payment.confirm EXISTS in _strings/strings.yaml with the value "Send %1$s", alongside
          payment.confirm_a11y "Send %1$s to %2$s. This cannot be undone." Both instant rails bind
          it: pay-domestic-single#confirm_button and pay-international-single#confirm_button both
          carry label "{strings.payment.confirm}". It was one of the eight keys that changed shape
          in the rename (confirm_cta -> confirm), which is the likeliest source of the report.
      - item: >-
          Review-card row labels ("From", "To", "Amount", "Reference", "HSBC's charge") and the
          Schedule field labels hardcoded in ui.yaml with no keys
        verdict: NOT-UPHELD
        evidence: >-
          Every review row on all seven rails binds a key, and every key exists: payment.review.
          {from,to,amount,reference,fee,date,bank,arrives_in,charges,frequency,first_payment,
          final_payment}, plus vrp.review.{to,max_per_payment,period_limits} and
          vrp.detail.status on the VRP cards. The Schedule step likewise —
          payment.{frequency_label,first_payment_date_label,has_end_date_label,
          final_payment_date_label} and the five payment.frequency.* options are all declared and
          all bound. No hardcoded label was found in any of the seven ui.yaml files.
    residual_blocks: >-
      /idea-feature-stitch is NOT blocked by residual_gap. The affected surfaces render an
      incomplete control set, not unbound copy — a Stitch run against them produces a mockup
      missing a button, which is visible on inspection, rather than one displaying a key name,
      which is what the original gap would have produced. Do not re-raise the lifted block on the
      strength of this list.

  # ── UX DEFECT found during the re-binding pass ────────────────────────────────────────────
  # Not a copy gap and not a residual one: both strings involved are authored and bound. It is a
  # collision between two correct strings, and it is recorded here because this pass is where it
  # became visible — reading the revoke dialog's copy next to its (absent) dismiss control.
  ux_defect_2026_08_07:
    id: VRP-REVOKE-DIALOG-CANCEL-COLLISION
    severity: error
    feature: pay-vrp-mandate
    component: revoke_confirm_dialog
    detail: >-
      The confirm CTA is vrp.revoke_confirm_cta = "Yes, cancel it" — correct in isolation, because
      the whole feature calls revocation "cancelling a variable payment" in consumer language and
      never says "revoke" to a PSU. But the dialog's dismiss control is still unsourced (see
      residual_gap), and the default label a dismiss gets is "Cancel". Placed beside "Yes, cancel
      it", the word means the OPPOSITE thing on the two adjacent controls: dismiss the dialog on
      one, destroy the mandate on the other. A PSU reading left to right sees two cancels and no
      safe answer.
    why_it_is_not_just_a_label_choice: >-
      The destructive path is the one with an affirmative label and the safe path is the one with
      the ambiguous one. That is the wrong way round for a dialog whose own body says the action
      "cannot be undone" and that after DELETE the consent is unreadable forever — there is
      nothing to restore even in principle, so a mis-tap here has no recovery.
    prior_art_in_this_project: >-
      consent-detail solved the identical problem: its revoke dialog pairs
      consent_detail.revoke_dialog.cancel = "Keep access" with .confirm = "Yes, revoke". The
      dismiss names what the PSU KEEPS rather than echoing the verb of the destructive action.
      Whatever key is authored for this dismiss should follow that shape and must not be the bare
      word "Cancel".
    owed_by: /idea-feature-enrich
    do_not_close_by: "authoring a vrp.* dismiss key alone — the component does not exist yet; see residual_gap#class_detail"

