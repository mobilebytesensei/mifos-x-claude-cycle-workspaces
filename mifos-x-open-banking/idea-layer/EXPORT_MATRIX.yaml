      carried_from_source_not_paraphrase:
        - "scheduled-payments: the `unsupported` state is spec-ahead-of-source BY DESIGN — source already records the OBIE U000 refusal (BankingStores.kt:377 recordIfUnsupported), what it lacks is the UI branch. Its two siblings declare the state; the 2026-07-28 reverse sync back-filled them and missed this one. The export now says so rather than presenting 5 states as unexplained."
        - "account-holder: 403 SUPPRESSES the retry CTA — the consent lacks ReadParty, so retrying re-sends an identical request for an identical refusal. A 200 with a blank displayName is Empty, not an error."
        - "accounts: balances fan out per-account (async/awaitAll) with preference InterimAvailable → InterimBooked → OpeningBooked; a 403 on balances renders the card WITHOUT a balance row rather than failing the list; GlobalWallet balances display in native currency with no GBP conversion."
