# LEDGER REPAIR — 2026-08-04 /idea-feature-export (matrix mode, option [R])
#
# WHY. 23 features had exports on disk and NO row in this ledger. That is the
# inverse of the ghost-cell class the 2026-08-03 run closed, and it is worse:
# a ghost row lies about an export, an ABSENT row means the feature is not a
# candidate at all. `--changed-only` and the default Phase 1 path both build
# their work-list from cells[], so an untracked feature can never be reported
# stale and never gets re-exported, however far its source moves.
#
# It is not hypothetical. `products` is in this set: its SPEC.md documented a
# four-product catalogue with Details / Apply Now buttons routing to an
# `application-detail` screen, while products/flow.yaml states `navigates_to: []`
# and "there is no apply journey". `login` drifted the same way across the
# consumer-only pivot. Both were found by reading, not by this ledger.
#
# WHAT THESE ROWS ASSERT — and what they do not. `stale: null` is the schema's
# explicit "unknown" (EXPORT_MATRIX.schema.yaml, cells[].stale: "null = unknown").
# It is used deliberately instead of `fresh`: the artifacts exist, but nothing in
# this run verified their CONTENT against current source, and this ledger's own
# history records what a false `fresh` costs — it suppresses the export it claims
# to have performed. `source_hash` is therefore a BASELINE captured now, not a
# claim of correctness: from here on a divergence is detectable.
#
# derived_from IS POPULATED. Every pre-existing cell in this file omits it
# although the schema marks it required (v1 -> v2 carry-overs; the schema notes
# "next /idea sync populates it", which never ran). With derived_from empty there
# is no cascade graph, so staleness had degraded to one `source_hash` snapshot
# plus human judgement about materiality — which is why the 2026-08-02 pass could
# touch every ui.yaml and correctly leave every cell `fresh`, and why a raw hash
# comparison today reports 0/42 fresh and means nothing. The input list below
# mirrors the 9-artifact set that core/scripts/staleness-resolve.sh hashes, so a
# cell and the sanctioned primitive agree on what "changed" means.
#
# NO CONTENT WAS REGENERATED by this repair. Bookkeeping only.
# ═══════════════════════════════════════════════════════════════════════════════

