name: FundsConfirmationResponse
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/pisp/domestic-payment-consents/{ConsentId}/funds-confirmation"
  api_ref: API-003
  spec: "OBIE Read/Write v4.0"
  verb_note: >-
    A GET on the two SINGLE-payment families, because a PISP consent carries one fixed amount.
    VRP inverts it: POST /domestic-vrp-consents/{ConsentId}/funds-confirmation, carrying an
    explicit InstructedAmount, because a VRP consent has no fixed amount. Both require the PSU
    authorisation-code token — a client-credentials token returns 401.
  no_such_endpoint_on: [domestic-scheduled-payment, domestic-standing-order, international-scheduled-payment, international-standing-order]
  absence_rationale: >-
    Funds-confirmation exists only where execution is NOW. Today's balance says nothing about
    the balance on a future execution date, so the deferred families have no such step by design.
  source_binding: null
  source_binding_note: >-
    The ONLY DTO in this registry with no Kotlin counterpart. core/network ships the full
    domestic-payment request and response models but declares no funds-confirmation call, and
    Aisp.kt has no matching function. Fields below come from the inline response_shape block in
    screens/send-money/api.yaml, which is spec, not source. Re-derive from source the moment the
    call is implemented.
  spec_ahead_of_source: true
description: "Answer to the pre-submission funds check on an authorised payment consent. A false FundsAvailable is an advisory, not a hard block — the PSU may still submit, and the ASPSP decides."
fields:
  - name: Data
    type:
      dto_ref: FundsAvailableResult
    required: true
    pii: false
    description: "Envelope carrying the single FundsAvailableResult block"
    primary_key: false
used_by:
  # Repointed 2026-08-06. Only the three families that HAVE a funds-confirmation step.
  - { feature: pay-domestic-single, api_id: funds_confirmation, role: response }
  - { feature: pay-international-single, api_id: funds_confirmation, role: response }
  - { feature: pay-vrp-mandate, api_id: vrp_funds_confirmation, role: response }
enums: []
