name: DomesticPaymentRequest
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obie/open-banking/v4.0/pisp/domestic-payments"
  api_ref: API-003
  spec: "OBIE Read/Write v4.0"
  source_binding: "core/network/src/commonMain/kotlin/org/mifosx/openbanking/core/network/model/pisp/domesticPayment/request/DomesticPaymentRequest.kt"
description: "The payment submission itself, sent only after the consent it references reaches Authorised. Structurally identical to DomesticPaymentConsentRequest but a distinct type in source, because submitting is a separate authorised act from consenting."
fields:
  - name: Data
    type: Object
    required: false
    pii: true
    description: "ConsentId plus the initiation block, which must match the authorised consent exactly"
    primary_key: false
  - name: Risk
    type: Object
    required: false
    pii: false
    description: "OBIE Risk block, repeated from the consent"
    primary_key: false
used_by:
  # Repointed 2026-08-06 — send-money was superseded by the seven per-type payment screens.
  - feature: pay-domestic-single
    api_id: submit_domestic_payment
    role: request
    echo_rule: >-
      Data.Initiation must be a byte-identical echo of the AUTHORISED consent's Initiation
      (mismatch returns U008) — taken from the re-read consent, not from what was staged
      locally, because the bank overwrites DebtorAccount when the TPP omits it.
enums: []
