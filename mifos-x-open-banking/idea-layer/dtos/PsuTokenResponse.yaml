name: PsuTokenResponse
version: "1.0.0"
source:
  origin: project
  api_path: "POST /oauth2/token"
  source_binding: "core/network/src/commonMain/kotlin/org/mifosx/openbanking/core/network/model/oauth/PsuTokenResponse.kt"
description: "The FAPI token-exchange response returned when a PSU's authorisation code is swapped for tokens. Every field is nullable in source because the authorisation server omits refresh_token and id_token on some grant types — treat presence, not shape, as the contract."
fields:
  - name: access_token
    type: String
    required: false
    pii: true
    description: "Bearer token authorising subsequent AIS and PIS calls. Never logged, never surfaced"
    primary_key: false
  - name: token_type
    type: String
    required: false
    pii: false
    description: "Token scheme, in practice Bearer"
    primary_key: false
  - name: refresh_token
    type: String
    required: false
    pii: true
    description: "Token used for silent refresh. Absent on grant types that do not issue one"
    primary_key: false
  - name: expires_in
    type: Int
    required: false
    pii: false
    description: "Access-token lifetime in seconds from issue"
    primary_key: false
  - name: scope
    type: String
    required: false
    pii: false
    description: "Space-delimited scopes actually granted, which may be narrower than those requested"
    primary_key: false
  - name: id_token
    type: String
    required: false
    pii: true
    description: "OIDC identity token. Absent when the request carried no openid scope"
    primary_key: false
used_by:
  - feature: consent-callback
    api_id: fapi-token-exchange
    role: response
  - feature: payment-consent
    api_id: payment-token-exchange
    role: response
enums: []
