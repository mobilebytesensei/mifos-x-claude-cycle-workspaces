name: Account
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0"
  # Retargeted 2026-08-06 (/idea-sync, OBP eviction). Was the Open Bank Project accounts list.
  # OBIE observations that shape this type:
  #   - AccountSubType and AccountType are ABSENT from every account record in the sandbox,
  #     despite the published profile table listing sub-types.
  #   - The credit card's Identification is MASKED here (xxxx-xxxx-xxxx-3456) but returned
  #     UNMASKED on the transactions resource.
  #   - Global Money reports Currency GBP despite the profile table listing GBP/EUR/USD, and
  #     carries only UK.OBIE.SortCodeAccountNumber — no second IBAN identification.
description: "Represents a bank account element of the `Data.Account[]` array returned by the OBIE AISP accounts list endpoint, `GET /obie/open-banking/v4.0/aisp/accounts`. Contains the account identifier, display label, product type, current balance, and routing information."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique account identifier within the bank"
    primary_key: true
  - name: label
    type: String
    required: true
    pii: false
    description: "Human-readable display label for the account"
    primary_key: false
  - name: account_type
    type: String
    required: true
    pii: false
    description: "Product type of the account (e.g. CURRENT, SAVINGS)"
    primary_key: false
  - name: balance
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "Current balance of the account expressed as a currency and amount pair"
    primary_key: false
  - name: account_routings
    type:
      list_of:
        dto_ref: AccountRouting
    required: true
    pii: false
    description: "List of routing schemes (IBAN, sort-code/account-number) associated with this account"
    primary_key: false
used_by:
  # Repointed 2026-08-06 (/idea-sync). Both prior entries named DELETED features —
  # send-money and send-money-amount, superseded by the seven per-type payment screens.
  - { feature: accounts, api_id: get_accounts }
  - { feature: account-detail, api_id: get_account_detail }
  - { feature: home, api_id: get_accounts }
  # Removed 2026-08-07: { feature: cards, api_id: get_accounts_for_cards } — the screen was
  # deleted, and `get_accounts_for_cards` was never a distinct operation, only a card-framed
  # alias for the accounts list this DTO already serves four other consumers from.
  - { feature: pay-domestic-single, api_id: get_accounts }
  - { feature: pay-domestic-scheduled, api_id: get_accounts }
  - { feature: pay-international-single, api_id: get_accounts }
  - { feature: pay-international-scheduled, api_id: get_accounts }
  - { feature: pay-vrp-mandate, api_id: get_accounts }
enums: []
