name: Charge
version: "1.0.0"
source:
  origin: project
  api_path: "Charges[] on every PISP consent and resource response — /obie/open-banking/v4.0/pisp/**"
  api_ref: API-003
  spec: "OBIE Read/Write v4.0"
  # Retargeted 2026-08-06 (OBP eviction). Was an OBP SEPA transaction-request. There is no SEPA
  # rail — every domestic Initiation declares UK.OBIE.FPS.
  #
  # WHEN A CHARGE APPEARS, per family (all observed):
  #   domestic single / scheduled / standing order  0.05 at CONSENT staging
  #   international single                          NONE at any stage, through to ACCC
  #   international scheduled / standing order      none at consent, 0.50 at RESOURCE creation
  #   VRP                                           0.05 per payment
  # The charge follows the INSTRUCTED currency, not the transfer currency — proven by 19918
  # (GBP instructed, USD transfer, charged 0.50 GBP).
  # Type is UK.OBIE.CHAPSOut on every charge in the corpus, even where LocalInstrument is FPS.
description: "Transaction/transfer fee charge object returned with a transaction request. Describes the fee summary and monetary value applied to the transaction."
fields:
  - name: summary
    type: String
    required: true
    pii: false
    description: "Human-readable description of the charge (e.g. 'SEPA transfer fee')"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code for the charge amount"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Decimal string representation of the charge amount"
    primary_key: false
used_by:
  # Repointed 2026-08-06 (/idea-sync, OBP eviction). Both prior entries named DELETED features
  # against DELETED operations — send-money / send-money-confirm on obp_create_sepa_transfer
  # and obp_confirm_sepa_transfer. There is no SEPA rail: every domestic Initiation declares
  # UK.OBIE.FPS.
  #
  # Charges[] arrives on PISP consent and resource responses, and WHEN it arrives differs per
  # family — see this DTO's api_path note. The consumers are therefore the type screens that
  # can display a fee, plus the shared status tracker.
  - { feature: pay-domestic-single, api_id: stage_domestic_payment_consent }
  - { feature: pay-domestic-scheduled, api_id: stage_domestic_scheduled_consent }
  - { feature: pay-domestic-standing-order, api_id: stage_domestic_standing_order_consent }
  - { feature: pay-international-scheduled, api_id: submit_international_scheduled_payment }
  - { feature: pay-international-standing-order, api_id: submit_international_standing_order }
  - { feature: pay-vrp-mandate, api_id: create_vrp_payment }
  - { feature: payment-status, api_id: get_payment_status }
  # pay-international-single is deliberately ABSENT: it is the only shape that returns no
  # Charges at any stage, through to ACCC. Listing it would imply a fee row that never populates.
enums: []
