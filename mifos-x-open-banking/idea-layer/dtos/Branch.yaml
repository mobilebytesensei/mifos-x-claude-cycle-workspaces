name: Branch
version: "2.1.0"
source:
  origin: external_api
  api_path: "GET /open-banking/v2.2/branches and the five /x-open-banking/v2.2/branches/… extensions"
  host: api.hsbc.com
  host_status: resolved
  host_resolved:
    at: "2026-08-07"
    by: "/idea-sync — develop.hsbc.com Open Data research"
    evidence:
      summary: >-
        HSBC's published Branch Locator swagger (swagger 2.0, info.version 2.2.1, host
        api.hsbc.com) PLUS 25 live branches captured the same day (HTTP 200), later widened to
        a full 327-branch census — see population_scan_2026_08_07 below.
      reproduce: >-
        Swagger: download from
        https://develop.hsbc.com/ob-api-documentation/branch-locator-uk/endpoints (public, no
        credential). Live: curl -H "Accept: application/prs.openbanking.opendata.v2.2+json"
        "https://api.hsbc.com/open-banking/v2.2/branches"
      local_capture: >-
        /home/kalpesh/OpenBankingProject/HSBC_Sandbox/open-data-specs/branch-probe.json and
        open-branch-locator-swagger.json — OUTSIDE this repository, captured 2026-08-07. Not
        checked in; use `reproduce` above, which is stronger provenance than a snapshot because
        the endpoint is public and free while the snapshot goes stale.
    supersedes: "The 2026-08-06 `host_status: unresolved` marker, which withdrew an invented endpoint."
  api_ref: API-OD-BRANCH
  spec: "OBIE Open Data v2.2 — unauthenticated, outside the OBIE consent surface"

description: >-
  One HSBC UK branch as published by Open Data. Rewritten 2026-08-07 from the HSBC swagger and
  live responses; v1.0.0 described the OBP sandbox shape (snake_case id/bank_id/name/lobby_hours
  as a human-readable STRING) and shares no field name or type with what the API returns. The
  opening-hours change is the largest: it is a structured per-day array, not a display string.

envelope:
  shape: "{ meta, data } — both required"
  path_to_this_dto: "data[].Brand[].Branch[]"
  depth_warning: "THREE levels. `data` is an array, observed length 1. Same shape as the ATM feed."
  flatten_rule: >-
    Flatten across data[].Brand[] and carry BrandName down. Keep the traversal generic — the
    { meta, data[].Brand[] } envelope is SHARED with the Product Finder feed, where the brand
    split is real and a naive flatten destroys it. But do not expect a split HERE: see
    first_direct_is_structurally_absent below.

first_direct_is_structurally_absent:
  finding: "All 327 UK branches carry BrandName 'HSBC UK'. Brand[] has length 1 on the whole estate."
  reason: >-
    CORRECTED at 2.1.0. v2.0.0 read this as a sampling artefact and warned "do not hardcode —
    the Product Finder feed does return first direct". The Product Finder half is true, but the
    inference was wrong: first direct is a BRANCHLESS bank. Its absence from a BRANCH feed is
    correct and permanent, not a gap a wider sample would close. A census cannot find what the
    business model does not have.
  what_to_do: >-
    Keep the Brand[] loop — it costs nothing and the envelope is shared. Do not build a brand
    filter, a brand chip, or a "which bank" affordance on this surface; there is one brand and
    there always will be. Do NOT read this as licence to hardcode "HSBC UK" as a display string
    either — read it off the wire, just do not branch on it.

# ─────────────────────────────────────────────────────────────────────────
# POPULATION SCAN — the sample-vs-census distinction this DTO turns on
# ─────────────────────────────────────────────────────────────────────────
population_scan_2026_08_07:
  what: >-
    v2.0.0 was written entirely from a 25-branch LONDON SAMPLE (geo-location, radius 5 miles).
    v2.1.0 re-derives the population claims from a CENSUS of the entire HSBC UK estate —
    all 327 branches, meta.TotalResults 327, flattened count 327.
  reproduce: >-
    curl -H "Accept: application/prs.openbanking.opendata.v2.2+json"
    "https://api.hsbc.com/open-banking/v2.2/branches"
  why_it_matters: >-
    A London radius search is not a sample of the UK estate in any statistically useful sense,
    and the census DISPROVED parts of v2.0.0 rather than merely refining them. Every "N/327"
    figure below is a full count. Every "N/25" figure that survives is labelled as a SAMPLE and
    should be read as illustrative, never as a rate.
  overturned:
    - "NonStandardAvailability does not exist → it exists on 1 of 327. See availability_contract."
    - "Saturday 9/25 (36%) → Saturday 167/327 (51%). The sample understated it by 15 points."
    - "first direct absent because the sample was London → absent because it is a branchless bank."

field_population:
  measured_over: "SAMPLE — 25 branches, London radius 5 miles, 2026-08-07. Not a census; see population_scan_2026_08_07."
  fully_populated: "Name, SortCode, CustomerSegment, ServiceAndFacility, Accessibility, Availability, ContactInfo, PostalAddress — all 25/25"
  never_populated: { Photo: "0/25", Note: "0/25" }
  contrast_with_atms: >-
    The inverse of AtmLocation, where five optional fields are 0/135. Branch data is genuinely
    rich. In particular Accessibility is 25/25 HERE and 0/135 THERE — which is why an
    accessibility filter is real on this surface and impossible on the ATM one.

fields:
  - name: BrandName
    type: String
    required: true
    pii: false
    primary_key: false
    synthetic: true
    description: "NOT a field on the Branch object — lifted from the parent data[].Brand[] during flatten."

  - name: Identification
    type: String
    required: true
    pii: false
    primary_key: true
    observed: 'Numeric strings — "400106", "400107", "400231".'
    description: >-
      The branch key, and the target of AtmLocation.Branch.Identification. This is the ONLY join
      between the two Open Data APIs.

  - name: SequenceNumber
    type: String
    required: true
    pii: false
    primary_key: false
    observed: '"0" on all 25.'

  - name: Name
    type: String
    required: false
    pii: false
    primary_key: false
    observed: '25/25. e.g. "Baker Street - Counter Service Available (Monday-Friday)".'
    description: >-
      Branches HAVE a name, unlike ATMs — but it is editorial. Every observed value appends a
      service caveat to the place name. Render it, but derive CAPABILITY from ServiceAndFacility
      and Availability, never by parsing this string.

  - name: Type
    type: String
    required: true
    pii: false
    primary_key: false
    observed: '"Physical" on all 25. The enum permits other values; nothing else appeared.'

  - name: SortCode
    type:
      list_of: String
    required: false
    pii: false
    primary_key: false
    observed: '327/327, single-element, HYPHENATED — ["40-01-06"], ["40-08-09"]. Census, not sample.'
    description: >-
      An ARRAY, not a scalar — one branch can carry several. This is the field that makes the
      branch feed compose with the rest of the app: a sort code is what beneficiaries, standing
      orders and transactions already carry, so this resolves one to a named place with no
      consent. See sortcode_format_trap — the output format and the input format DISAGREE.

  - name: CustomerSegment
    type:
      list_of: String
    required: true
    pii: false
    primary_key: false
    enum_ref: BranchCustomerSegment
    observed: "327/327, all eight values on every branch. CENSUS — zero variance across the estate."
    description: >-
      CORRECTED at 2.1.0 (the sample read as "typically all eight"; the census says always all
      eight). A field with zero variance cannot filter, sort or distinguish anything. Do not
      render it and do not build a segment picker on it — every option would return every branch.
      Matches screens/branch-locator/api.yaml#corrections_from_population_scan C5.

  - name: ServiceAndFacility
    type:
      list_of: String
    required: false
    pii: false
    primary_key: false
    enum_ref: BranchServiceAndFacility
    observed: "25/25. 11 of the 28 declared values occur live."
    description: "Build filters from the observed 11. CounterServices and BureauDeChange carry the real user intent."

  - name: Accessibility
    type:
      list_of: String
    required: false
    pii: false
    primary_key: false
    enum_ref: BranchAccessibility
    observed: "25/25, and it DISCRIMINATES — Bishopsgate lacks LevelAccess where Baker Street and Balham have it."
    description: >-
      Real, populated, varying accessibility data published under a regulatory obligation. Deserves
      a first-class filter. Note this is the exact field AtmLocation never populates.

  - name: Availability
    type:
      dto_ref: BranchAvailability
    required: false
    pii: false
    primary_key: false
    observed: >-
      327/327 present. StandardAvailability on all 327; NonStandardAvailability on 1 of 327
      (branch 401118). CORRECTED at 2.1.0 — the 25-branch sample saw only StandardAvailability
      and v2.0.0 wrongly generalised that to "the ONLY key". See the trap below.

  - name: ContactInfo
    type:
      list_of:
        dto_ref: BranchContactInfo
    required: false
    pii: false
    primary_key: false
    observed: '25/25, always [{ ContactType: "Phone", ContactContent: "03457 404 404" }].'
    description: >-
      The observed number is HSBC's general UK line, identical on every branch — NOT a per-branch
      direct dial. Labelling it "Call this branch" would mislead.

  - name: PostalAddress
    type:
      dto_ref: PostalAddress
    required: true
    pii: false
    primary_key: false
    observed_present: [BuildingNumber, StreetName, TownName, CountrySubDivision, Country, PostCode, GeoLocation]
    description: >-
      Richer than the ATM address, which sends neither BuildingNumber nor CountrySubDivision.
      BuildingNumber arrives with a TRAILING SPACE ("90 ", "117 ", "1-3 ") — trim, or the composed
      address renders a double space.

  - name: Photo
    type:
      optional: String
    required: false
    pii: false
    primary_key: false
    observed: "0/25 — never sent."

  - name: Note
    type:
      optional: String
    required: false
    pii: false
    primary_key: false
    observed: "0/25 — never sent."

# ─────────────────────────────────────────────────────────────────────────
# SORT CODE — the API's own output is rejected by its own input
# ─────────────────────────────────────────────────────────────────────────
sortcode_format_trap:
  added_at: "2.1.0 — v2.0.0 carried no format contract for this field at all."
  lookup_path: "GET https://api.hsbc.com/x-open-banking/v2.2/branches/sortcode/{6-digits}"
  input_format: "SIX DIGITS, no hyphens, no spaces. Nothing else resolves."
  output_format: "HYPHENATED — `40-01-06` — on all 327 branches, without exception."
  the_trap: >-
    The feed emits `40-01-06`; the lookup accepts only `400106`. Feeding the API its own output
    back returns nothing. Any code path that reads SortCode from one response and passes it to
    the sortcode lookup is broken by construction.
  verified:
    - { request: "/sortcode/400106", result: "HTTP 200, meta.TotalResults 1" }
    - { request: "/sortcode/40-01-06", result: "HTTP 200, meta.TotalResults 0 — the SAME branch, in its own published format" }
    - { request: "/sortcode/99-99-99", result: "HTTP 200, meta.TotalResults 0 — a sort code that does not exist" }
  why_it_is_dangerous: >-
    A mis-formatted sort code and a non-existent sort code are INDISTINGUISHABLE. Both are
    HTTP 200, both empty, neither carries an error, a code or a message. There is no signal to
    branch on, so a UI cannot tell the user "check the format" apart from "no such branch" — it
    will say "not found" to someone who typed a perfectly valid sort code, with the hyphens the
    bank itself printed on their card.
  requirement: >-
    Strip every non-digit before issuing the request, and validate the result is exactly six
    digits before issuing it at all. Do the stripping in ONE shared normaliser rather than at
    each caller — the failure is silent, so a missed call site will not announce itself. Render
    the hyphenated form to the user; transmit the digits.
  reproduce: >-
    for sc in 400106 40-01-06 99-99-99; do curl -s -H "Accept:
    application/prs.openbanking.opendata.v2.2+json"
    "https://api.hsbc.com/x-open-banking/v2.2/branches/sortcode/$sc"; done

# ─────────────────────────────────────────────────────────────────────────
# OPENING HOURS — the trap on this DTO
# ─────────────────────────────────────────────────────────────────────────
availability_contract:
  path: "Availability.StandardAvailability.Day[]"
  day_shape: "{ Name: <weekday>, OpeningHours: [{ OpeningTime, ClosingTime }] }"
  closed_days_are_ABSENT:
    finding: "A day the branch is CLOSED is simply NOT IN THE ARRAY."
    evidence: >-
      CENSUS, all 327 UK branches, 2026-08-07. Saturday appears on 167/327 (51%). Sunday appears
      on 0/327 — not one branch in the estate publishes one. Illustrative pair from the sample:
      Baker Street publishes six Day entries (Mon-Sat), Balham publishes five (Mon-Fri).
    superseded_sample_figures: >-
      v2.0.0 read "Sunday 0/25" and "Saturday 9/25". Sunday held on the census; Saturday did not
      — the London sample's 36% understated the true 51% by fifteen points. Cite the /327 figures.
    requirement: >-
      Build the week from a FIXED Monday-to-Sunday list and mark every day the API did not send as
      Closed. Absence means closed, not unknown. A renderer that iterates only what it receives
      drops Sunday from EVERY branch — this fires on all 327 records, not on an edge case — and
      drops Saturday from the 160 branches that are genuinely shut then.
  opening_hours_is_a_list:
    note: >-
      OpeningHours is an array per day, modelling a lunchtime closure as two ranges. Every observed
      day had exactly one. Reading [0] works today and silently hides an afternoon session the
      first time HSBC publishes a split day.
  non_standard_availability_is_real:
    corrected_at: "2.1.0"
    v2_0_0_said: >-
      "StandardAvailability is the ONLY key under Availability across all 25 branches" and
      "BANK HOLIDAYS ARE NOT IN THIS FEED". The first half is FALSE and is withdrawn here. The
      second half is true and is kept below, restated.
    finding: >-
      NonStandardAvailability EXISTS. It is RARE — 1 of 327 branches across the whole UK estate —
      but it is real, live in production today, and invisible to any London-radius search, which
      is exactly why the 25-branch sample missed it.
    the_one_instance:
      identification: "401118"
      name: "Birmingham, New Street - Temporarily closed"
      non_standard_availability:
        Name: "Temporarily Closed"
        StartDate: "2025-10-06"
        EndDate: "2027-03-21"
        Notes: "Branch Temporarily Closed"
      and_yet_it_also_publishes: >-
        A completely ordinary StandardAvailability — Monday to Friday 09:30-16:30 and Saturday
        09:30-13:00. The closure and the weekly pattern are published SIDE BY SIDE, and the
        weekly pattern gives no hint that the building is shut.
      observed_shape: >-
        A single OBJECT, not an array — the sole live instance carries one closure window. The
        contract's plurality was not testable against a multi-window branch because none exists.
        Model it as BranchAvailability.NonStandardAvailability (NonStandardAvailabilityObject) and
        tolerate an array defensively if one ever appears.
    requirement: >-
      READ NonStandardAvailability FIRST, BEFORE rendering the weekly pattern. If it is present
      and today falls within [StartDate, EndDate], the closure WINS: show the closure banner and
      suppress or visibly override the opening hours. A client that ignores this field — or reads
      it after, as a footnote — sends a user to a building that has been shut since 2025-10-06 and
      will not reopen until 2027-03-21. It renders "Open today 09:30-16:30" over a locked door.
    why_rarity_is_not_safety: >-
      1-in-327 is not an edge case to defer; it is a live production defect waiting on one user
      searching Birmingham. Rarity means it will never surface in dev, never surface in a London
      fixture, and never surface in review — which makes it MORE dangerous, not less. The fixture
      for 401118 is pinned in screens/branch-locator/demo-data.yaml for exactly this reason.
  no_holiday_data:
    finding: >-
      Still true, and narrowed. There is no BANK HOLIDAY CALENDAR anywhere in this feed.
      NonStandardAvailability carries ad-hoc closures (the one live instance is a two-year
      refurbishment-scale closure), not Christmas Day, not Good Friday, not a bank holiday Monday.
    requirement: >-
      BANK HOLIDAYS ARE NOT IN THIS FEED. Never compute or render "Open now", "Closes in 20
      minutes", or a green/red open dot — none of them can be right on a bank holiday, and this
      is unchanged by NonStandardAvailability existing. Present the standard weekly pattern, say
      it is the standard pattern, and layer the closure banner above it when one applies.

enums:
  - name: BranchCustomerSegment
    declared: [Business, Corporate, Other, Personal, Private, Premier, Select, SME, Wealth]
    observed: [Business, Corporate, Personal, Premier, Private, SME, Select, Wealth]
  - name: BranchServiceAndFacility
    declared_count: 28
    observed: [BureauDeChange, CounterServices, ExternalATM, InternalATM, LodgementDevice, MeetingRooms, OnDemandCurrency, OnlineBankingPoint, SelfServiceAccountOpening, StatementPrinter, WiFi]
  - name: BranchAccessibility
    declared: [AutomaticDoors, AudioCashMachine, ExternalRamp, HelpingHandUnit, InductionLoop, InternalRamp, LevelAccess, LowerLevelCounter, Other, WheelchairAccess]
    observed: [AudioCashMachine, AutomaticDoors, InductionLoop, InternalRamp, LevelAccess, WheelchairAccess]

used_by:
  - { feature: branch-locator, api_id: get_all_branches, role: response }
  - { feature: branch-locator, api_id: get_branches_by_geolocation, role: response }
  - { feature: branch-locator, api_id: get_branch_by_sortcode, role: response }
  - { feature: branch-locator, api_id: get_branches_by_postcode, role: response }
  - { feature: branch-locator, api_id: get_branches_by_town, role: response }
  - { feature: atm-locator, api_id: get_all_atms, role: "reference target — AtmLocation.Branch carries only {Identification}" }

changed_2026_08_07_v2_1_0:
  from_version: "2.0.0"
  driver: >-
    v2.0.0 was derived entirely from a 25-branch LONDON SAMPLE and its claims were phrased as if
    they described the estate. A census of all 327 UK branches — the unfiltered
    GET /open-banking/v2.2/branches — disproved three of them. This revision separates SAMPLE
    evidence from CENSUS evidence everywhere the two disagree, and labels each figure with which
    it is. That distinction is the point of the bump: nothing about the API changed, only what
    we had actually looked at.
  changes:
    - id: B1
      was: '"StandardAvailability is the ONLY key under Availability across all 25 branches" — NonStandardAvailability asserted absent.'
      now: >-
        NonStandardAvailability exists on 1 of 327 (branch 401118, closed 2025-10-06 to
        2027-03-21, while still publishing a normal Mon-Sat schedule). It must be read BEFORE the
        weekly pattern.
      why: "An absence claim from a 25-record London sample. The field is rare, not missing."
      impact: "New availability_contract.non_standard_availability_is_real; renderer must layer a closure banner above opening hours."
    - id: B2
      was: "Saturday 9/25 (36%), Sunday 0/25 — sample rates read as estate rates."
      now: "Saturday 167/327 (51%), Sunday 0/327. Full census, not a sample."
      why: "The London sample understated Saturday opening by fifteen points. Sunday held."
      impact: "Figures restated as /327 and labelled census; the fixed Mon-Sun week requirement is unchanged and now applies to a known 160 Saturday-closed branches."
    - id: B3
      was: "No sort code format contract at all."
      now: >-
        Lookup accepts SIX DIGITS ONLY; the feed publishes the HYPHENATED form on all 327. The
        API's own output is rejected by its own input, and a mis-formatted code is
        indistinguishable from a non-existent one — both HTTP 200, empty, no error.
      why: "Verified: /sortcode/400106 → 1 result; /sortcode/40-01-06 → 0; /sortcode/99-99-99 → 0."
      impact: "New sortcode_format_trap; strip non-digits at every call site via one shared normaliser."
    - id: B4
      was: '"Observed HSBC UK on all 25; do not hardcode — the Product Finder feed does return first direct."'
      now: >-
        All 327 carry BrandName "HSBC UK". first direct is a branchless bank, so its absence from
        a BRANCH feed is correct and permanent — not a sampling artefact.
      why: "The advice was right, the reason was wrong. A census cannot find what the business model does not have."
      impact: "Brand[] traversal advice KEPT (the envelope is shared with feeds where the split is real); the brand-filter expectation dropped."
  unchanged_and_reconfirmed:
    - "Closed days are ABSENT from the Day[] array — build the week from a fixed Mon-Sun list."
    - "OpeningHours is a per-day ARRAY; every observed day has exactly one entry."
    - "No bank-holiday calendar exists in this feed, so 'Open now' remains uncomputable."

replaced_2026_08_07:
  was_version: "1.0.0"
  was_shape: "OBP snake_case — id, bank_id, name, address, location, lobby_hours (String), drive_up_hours (String), branch_type"
  reason: >-
    Not a rename. lobby_hours was a human-readable display STRING; Open Data publishes a structured
    per-day array with closed days omitted. drive_up_hours has no OBIE counterpart at all — HSBC
    publishes no drive-up concept. branch_type becomes Type with a different vocabulary. The DTO
    could not be migrated field-by-field.
  orphaned_siblings: >-
    LobbyHours and DriveUpHours were separate DTOs modelling the OBP hours shape. Both are now
    unreferenced — BranchAvailability replaces LobbyHours and nothing replaces DriveUpHours.
    They are deletion candidates once nothing else points at them.
