name: StatementPeriod
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/statements"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/StatementPeriod.kt"
  wire_type: "core/network/model/ais/statements/StatementsResponse.kt (Data.Statement[])"
description: "One statement in the account's statement list — the row projection, carrying only the period bounds and the closing balance. The full breakdown lives in StatementDetail, fetched per statement."
fields:
  - name: statementId
    type: String
    required: true
    pii: false
    description: "OBIE StatementId — the key the detail and file endpoints take"
    primary_key: true
  - name: statementReference
    type: String
    required: true
    pii: false
    description: "Bank's own reference for the statement, as printed"
    primary_key: false
  - name: startDateTime
    type: DateTime
    required: true
    pii: false
    description: "First moment the statement period covers"
    primary_key: false
  - name: endDateTime
    type: DateTime
    required: true
    pii: false
    description: "Last moment the statement period covers"
    primary_key: false
  - name: closingBalanceAmount
    type: String
    required: true
    pii: false
    description: "Closing balance for the period, as a decimal string"
    primary_key: false
  - name: closingBalanceCurrency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of closingBalanceAmount"
    primary_key: false
used_by:
  - feature: statements
    api_id: statements
    role: response
enums: []
