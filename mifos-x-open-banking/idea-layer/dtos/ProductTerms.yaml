name: ProductTerms
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/product"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0. 400 on Global Money.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/ProductTerms.kt"
  wire_type: "core/network/model/ais/product/ProductResponse.kt"
description: "The product terms attached to an account — interest tiers, overdraft tiers and headline features. ProductRepository.getProduct returns this nullable: not every account exposes a product block."
fields:
  - name: accountId
    type: String
    required: true
    pii: false
    description: "Account these terms describe"
    primary_key: true
  - name: productId
    type: String
    required: true
    pii: false
    description: "OBIE ProductId"
    primary_key: false
  - name: productName
    type: String
    required: true
    pii: false
    description: "Marketing name of the product"
    primary_key: false
  - name: productType
    type: String
    required: true
    pii: false
    description: "OBIE ProductType classification"
    primary_key: false
  - name: monthlyMaximumCharge
    type: String
    required: false
    pii: false
    description: "Cap on monthly charges as a decimal string. Absent when the product declares no cap"
    primary_key: false
  - name: creditInterestTiers
    type:
      list_of:
        dto_ref: CreditInterestTier
    required: true
    pii: false
    description: "Credit interest bands, in the order the bank returns them"
    primary_key: false
  - name: overdraftTiers
    type:
      list_of:
        dto_ref: OverdraftTier
    required: true
    pii: false
    description: "Overdraft rate bands, in the order the bank returns them"
    primary_key: false
  - name: features
    type:
      list_of: String
    required: true
    pii: false
    description: "Headline product features as free-text lines"
    primary_key: false
used_by:
  - feature: product
    api_id: product
    role: response
enums: []
