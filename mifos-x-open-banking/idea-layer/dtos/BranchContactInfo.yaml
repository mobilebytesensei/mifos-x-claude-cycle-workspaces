name: BranchContactInfo
version: "1.0.0"
source:
  origin: external_api
  api_path: "GET /open-banking/v2.2/branches and the five /x-open-banking/v2.2/branches/… extensions"
  host: api.hsbc.com
  host_status: resolved
  api_ref: API-OD-BRANCH
  spec: "OBIE Open Data v2.2 — unauthenticated, outside the OBIE consent surface"
  created:
    at: "2026-08-07"
    by: "/idea-sync — dangling-ref closure"
    reason: >-
      Branch v2.0.0 declared `ContactInfo` as `list_of: { dto_ref: BranchContactInfo }` but no
      such DTO existed.

description: >-
  One contact method for a branch. Branch.ContactInfo is an ARRAY of these. Structurally trivial
  — two required strings — and the entire difficulty is a labelling one: the number HSBC actually
  publishes is not the number the field name implies.

# ─────────────────────────────────────────────────────────────────────────
# THE TRAP — IT IS NOT A PER-BRANCH NUMBER
# ─────────────────────────────────────────────────────────────────────────
not_a_direct_dial:
  finding: >-
    Every branch publishes the SAME number. All 25 records carry exactly
    [{ ContactType: "Phone", ContactContent: "03457 404 404" }] — HSBC's general UK national
    line, not a line into that branch.
  evidence: >-
    The union of all ContactInfo elements across the 25-branch London sample has cardinality ONE.
    Not 25 similar numbers; one identical object repeated.
  consequence: >-
    A button labelled "Call this branch" is a lie. It dials a national IVR that cannot transfer
    to the counter and does not know which branch the user tapped. The user's expectation —
    "ask the branch whether they have my currency in stock" — cannot be met by this data.
  requirement: >-
    Label it for what it is: "Call HSBC" / "HSBC customer service", placed at screen level rather
    than inside a branch row. Repeating an identical national number on every card in a list is
    visual noise that reads as per-branch information.
  do_not: >-
    Do not dedupe it away silently either. The number IS the only contact channel published, so
    it belongs on the screen once — just not once per branch.

fields:
  - name: ContactType
    type: String
    required: true
    pii: false
    primary_key: false
    enum_ref: BranchContactType
    observed: '"Phone" on 25/25. One of seven declared values ever occurs.'
    description: >-
      The channel. Drives the tap action — tel: for Phone/AlternatePhone, mailto: for
      Email/AlternateEmail, nothing tappable for Fax. Switch on it; never assume Phone, even
      though it is all that has been seen.

  - name: ContactContent
    type: String
    required: true
    pii: false
    primary_key: false
    constraint: "minLength 1, maxLength 256"
    observed: '"03457 404 404" on 25/25.'
    description: >-
      The number or address itself, formatted for humans with spaces. Strip the spaces before
      building a tel: URI; render the spaced form to the user.

  - name: ContactDescription
    type:
      optional: String
    required: false
    pii: false
    primary_key: false
    constraint: "maxLength 70"
    observed: "0/25 — never sent."
    description: >-
      Declared free text — "main phone number", "alternate fax". Would have been the field that
      disambiguated a national line from a branch line. It is absent, which is why the ambiguity
      above has to be resolved by the client rather than read off the payload.

  - name: OtherContactType
    type:
      optional: OtherContactTypeCode
    required: false
    pii: false
    primary_key: false
    observed: "0/25 — never sent."
    description: >-
      The free-text partner of ContactType under the `Other` pairing rule. Shape is
      { Code (≤4 chars), Name, Description } with Name + Description required. Populated only when
      ContactType reads the literal `Other` — in which case rendering the enum alone shows the
      user the word "Other".

enums:
  - name: BranchContactType
    declared: [AlternateEmail, AlternateFax, AlternatePhone, Email, Fax, Other, Phone]
    observed: [Phone]
    note: >-
      One of seven. No branch publishes an email address, so there is no written channel to the
      branch in this feed either.

array_cardinality:
  declared: "Branch.ContactInfo is an array with no declared minimum or maximum."
  observed: "Exactly one element on all 25 branches."
  requirement: >-
    Iterate it. A single-element array today does not license reading [0] — and if HSBC ever adds
    an email, the one field a user would most want is the one a [0] read would discard.

used_by:
  - { dto: Branch, field: ContactInfo, role: "array element — optional, observed 25/25" }
  - { feature: branch-locator, api_id: get_all_branches, role: "response — nested" }
  - { feature: branch-locator, api_id: get_branches_by_geolocation, role: "response — nested" }
  - { feature: branch-locator, api_id: get_branch_by_sortcode, role: "response — nested" }
  - { feature: branch-locator, api_id: get_branches_by_postcode, role: "response — nested" }
  - { feature: branch-locator, api_id: get_branches_by_town, role: "response — nested" }
