name: MoneyAmount
version: "1.0.0"
source:
  origin: shared
  api_path: "OBIE shared value object — { Amount: String, Currency: String }"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0"
  # Retargeted 2026-08-06 (OBP eviction). Used across balances, transactions, charges and every
  # PISP amount field. Amount is a major-unit DECIMAL STRING on the wire — the app holds minor
  # units internally and converts once at the boundary with integer arithmetic, so a payment
  # amount cannot pick up a floating-point representation error.
  # The near-duplicate AmountOfMoney (an OBP PFM v6 artefact) was deleted 2026-08-06.
description: "Shared value object representing a monetary amount. Used wherever the OBIE API returns an `Amount` + `Currency` pair — account balances, transaction values, and new-balance snapshots."
fields:
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code (e.g. EUR, GBP, USD)"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Decimal string representation of the monetary value (e.g. \"1234.56\")"
    primary_key: false
used_by:
  # Repointed 2026-08-06 (/idea-sync, OBP eviction + payments rewrite). Both prior entries
  # named DELETED features: send-money (superseded by the seven per-type screens) and
  # standing-order-edit (removed — a PISP may not amend a standing order under OBL CEG, so
  # obp_update_standing_order has no OBIE successor to repoint at).
  - { feature: accounts, api_id: get_accounts }
  - { feature: pay-domestic-single, api_id: stage_domestic_payment_consent }
  - { feature: pay-domestic-scheduled, api_id: stage_domestic_scheduled_consent }
  - { feature: pay-domestic-standing-order, api_id: stage_domestic_standing_order_consent }
  - { feature: pay-international-single, api_id: stage_international_payment_consent }
  - { feature: pay-international-scheduled, api_id: stage_international_scheduled_consent }
  - { feature: pay-international-standing-order, api_id: stage_international_standing_order_consent }
  - { feature: pay-vrp-mandate, api_id: create_vrp_consent }
enums: []
