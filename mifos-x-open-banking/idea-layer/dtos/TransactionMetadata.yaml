name: TransactionMetadata
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0"
  # Retargeted 2026-08-06 (/idea-sync, OBP eviction). OBIE has NO transaction-metadata resource
  # and no tags, comments or images — the OBP v1.2.1 metadata API had no counterpart and the
  # transaction-tags screen was deleted with it. What survives here is the transaction's own
  # descriptive fields, which arrive inline on the transactions read.
description: "User-generated metadata attached to a transaction by the account holder. Holds an optional free-text narrative, a list of structured comments, and a list of classification tags."
fields:
  - name: narrative
    type:
      optional: String
    required: false
    pii: false
    description: "Optional free-text note written by the account holder describing the transaction"
    primary_key: false
  - name: comments
    type:
      list_of:
        dto_ref: TransactionComment
    required: true
    pii: false
    description: "Ordered list of comments added to the transaction by the user"
    primary_key: false
  - name: tags
    type:
      list_of:
        dto_ref: TransactionTag
    required: true
    pii: false
    description: "List of classification tags applied to the transaction (e.g. #groceries, #travel)"
    primary_key: false
used_by:
  # transaction-tags entry REMOVED 2026-08-06 (/idea-sync, OBP eviction). That feature was
  # deleted — it used the Open Bank Project v1.2.1 transaction-metadata API, which has no OBIE
  # counterpart. OBIE returns no tags, comments or images on a transaction, so
  # obp_transaction_tags_get has nothing to repoint at.
  - { feature: transaction-detail, api_id: get_transactions }
enums: []
