name: Transaction
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0"
description: >-
  Top-level transaction object returned by the OBIE transactions resource. OBIE has NO
  counterparty resource: it names the other party by DIRECTION — CreditorAccount and
  DebtorAccount, each carrying a Name and a SchemeName/Identification pair. The
  `other_account` / TransactionCounterparty references below are legacy naming that predates
  the OBIE retarget, describing OBIE data under a vocabulary the API does not use, and are
  owed a rename.

  ⚠ UNMASKED PAN: this resource returns the credit card number in full
  ("SchemeName":"UK.OBIE.PAN","Identification":"1234567890123456") where the `account` resource
  masks it. Anything that logs, caches or exports these records is handling a full PAN.
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Unique transaction identifier"
    primary_key: true
  - name: this_account
    type:
      dto_ref: TransactionAccount
    required: true
    pii: false
    description: "The bank account that owns this transaction"
    primary_key: false
  - name: other_account
    type:
      dto_ref: TransactionCounterparty
    required: true
    pii: false
    description: "The counterparty account or payee involved in the transaction"
    primary_key: false
  - name: details
    type:
      dto_ref: TransactionDetails
    required: true
    pii: false
    description: "Financial and temporal details of the transaction (type, amounts, dates)"
    primary_key: false
  - name: metadata
    type:
      dto_ref: TransactionMetadata
    required: true
    pii: false
    description: "User-generated metadata attached to the transaction (narrative, comments, tags)"
    primary_key: false
used_by:
  # Repointed 2026-08-02 (/idea-sync): used_by listed only pfm-dashboard, which was deleted
  # with the PFM removal. The real consumers are the transaction surfaces.
  - feature: transactions
    api_id: get_transactions
  - feature: transaction-detail
    api_id: get_transactions
enums: []
