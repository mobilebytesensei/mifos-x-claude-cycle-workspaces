name: DomesticPaymentData
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/pisp/domestic-payments/{DomesticPaymentId}"
  api_ref: API-003
  spec: "OBIE Read/Write v4.0"
  source_binding: "core/network/src/commonMain/kotlin/org/mifosx/openbanking/core/network/model/pisp/domesticPayment/response/Data.kt"
description: "The Data block shared by both PISP response envelopes. Named for its parent rather than the source's bare `Data`, which collides with five other per-package Data classes. DomesticPaymentId is null on a consent response and populated on a payment response — that difference is how a caller tells the two apart."
fields:
  - name: ConsentId
    type: String
    required: false
    pii: false
    description: "Consent the payment was authorised under. Present on both envelopes"
    primary_key: true
  - name: Status
    type: String
    required: false
    pii: false
    description: "Journey state — AwaitingAuthorisation, Authorised, Rejected on a consent; AcceptedSettlementInProcess and its siblings on a payment"
    primary_key: false
  - name: CreationDateTime
    type: DateTime
    required: false
    pii: false
    description: "When the consent or payment was created"
    primary_key: false
  - name: StatusUpdateDateTime
    type: DateTime
    required: false
    pii: false
    description: "When the status last changed. The field a poll compares against"
    primary_key: false
  - name: ReadRefundAccount
    type: String
    required: false
    pii: false
    description: "Whether the ASPSP will return refund-account details with the payment"
    primary_key: false
  - name: Initiation
    type: Object
    required: false
    pii: true
    description: "Echoed initiation block — debtor and creditor accounts, instructed amount, remittance information. Must match the authorised consent"
    primary_key: false
  - name: DomesticPaymentId
    type: String
    required: false
    pii: false
    description: "Identifier of the submitted payment. Null on a consent response — that is the discriminator between the two envelopes"
    primary_key: false
used_by:
  - feature: payment-status
    api_id: domestic-payment-read
    role: response
  - feature: payment-consent
    api_id: payment-consent-status
    role: response
  - feature: pay-domestic-single
    api_id: domestic-payment-submit
    role: response
enums: []
