name: PostalAddress
version: "1.0.0"
source:
  origin: project
  api_path: "nested"
description: "Reusable postal address value object embedded in AtmLocation, Branch, and customer onboarding records. Carries structured address lines, city, postcode, and country code so the ATM locator and onboarding screens can render a correctly formatted address without additional lookups."
fields:
  - name: line_1
    type: String
    required: true
    pii: false
    description: "First line of the street address (building number and street name)"
    primary_key: false
  - name: line_2
    type:
      optional: String
    required: false
    pii: false
    description: "Second address line (apartment, suite, floor — optional)"
    primary_key: false
  - name: line_3
    type:
      optional: String
    required: false
    pii: false
    description: "Third address line for extended addressing needs — optional"
    primary_key: false
  - name: city
    type: String
    required: true
    pii: false
    description: "City or town name"
    primary_key: false
  - name: county
    type:
      optional: String
    required: false
    pii: false
    description: "County, district, or region — optional"
    primary_key: false
  - name: state
    type:
      optional: String
    required: false
    pii: false
    description: "State or province code — optional, relevant for non-EU jurisdictions"
    primary_key: false
  - name: postcode
    type: String
    required: true
    pii: false
    description: "Postal or ZIP code"
    primary_key: false
  - name: country_code
    type: String
    required: true
    pii: false
    description: "ISO 3166-1 alpha-2 country code (e.g. GB, DE)"
    primary_key: false
used_by:
  - feature: atm-locator
    api_id: get_atms
  - feature: atm-locator
    api_id: get_branches
enums: []
