name: ScheduledPaymentItem
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/scheduled-payments"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # 400 on Global Money and the card, with U000 "This action is not allowed on the account type
  # in the request" — an HSBC-proprietary code absent from the Implementation Guide.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/ScheduledPaymentItem.kt"
  wire_type: "core/network/model/ais/scheduledPayments/ScheduledPaymentsResponse.kt (Data.ScheduledPayment[])"
description: "A future-dated one-off payment on an account. scheduledType says whether scheduledDateTime is the execution date or the arrival date — the two are not interchangeable to a PSU deciding whether a bill will clear."
fields:
  - name: scheduledPaymentId
    type: String
    required: true
    pii: false
    description: "OBIE ScheduledPaymentId for this instruction"
    primary_key: true
  - name: accountId
    type: String
    required: true
    pii: false
    description: "Account the payment is scheduled from"
    primary_key: false
  - name: payeeName
    type: String
    required: true
    pii: true
    description: "Creditor name the payment goes to"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Amount to be paid, as a decimal string"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of amount"
    primary_key: false
  - name: scheduledDateTime
    type: DateTime
    required: true
    pii: false
    description: "The scheduled date. Read it as an execution or arrival date according to scheduledType"
    primary_key: false
  - name: scheduledType
    type: ScheduledPaymentType
    required: true
    pii: false
    description: "Whether scheduledDateTime means execution or arrival. Unknown when the bank sends neither"
    primary_key: false
  - name: reference
    type: String
    required: true
    pii: false
    description: "Payment reference carried with the instruction"
    primary_key: false
  - name: creditorIdentification
    type: String
    required: true
    pii: true
    description: "Creditor account identifier the payment is sent to"
    primary_key: false
used_by:
  - feature: scheduled-payments
    api_id: scheduled-payments-list
    role: response
enums:
  - name: ScheduledPaymentType
    values: [Execution, Arrival, Unknown]
