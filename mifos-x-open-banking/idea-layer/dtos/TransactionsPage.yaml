name: TransactionsPage
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/TransactionsPage.kt"
  wire_type: "core/network/model/ais/transactions/TransactionsResponse.kt"
description: "One page of transactions, as TransactionsRepository.firstPage and nextPage return. Paging is link-driven, not offset-driven — nextLink is an opaque URL handed straight back to nextPage, never reconstructed from a page number."
fields:
  - name: items
    type:
      list_of:
        dto_ref: TransactionListItem
    required: true
    pii: false
    description: "Transaction rows in this page, in the order the bank returned them"
    primary_key: false
  - name: nextLink
    type: String
    required: false
    pii: false
    description: "Opaque URL for the following page. Null or blank means the last page (TransactionsPage.hasNextPage)"
    primary_key: false
  - name: totalPages
    type: Int
    required: false
    pii: false
    description: "Total page count when the bank supplies Meta.TotalPages. Absent otherwise, so never rely on it to detect the end"
    primary_key: false
used_by:
  - feature: transactions
    api_id: transactions
    role: response
enums: []
