name: Consent
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0"
  # Retargeted 2026-08-06 (/idea-sync, OBP eviction). Was /obp/v5.1.0/my/consents.
  # The OBIE account-access-consent carries an explicit Permissions array approved by the PSU
  # at the bank, an ExpirationDateTime and a transaction date window. It REJECTS
  # x-jws-signature — the only consent endpoint that does.
description: "Represents an Open Banking consent record, tracking authorization scope, lifecycle status, and associated JWT for third-party access."
fields:
  - name: consent_id
    type: String
    required: true
    pii: false
    primary_key: true
  - name: status
    type: String
    required: true
    pii: false
    primary_key: false
    # enum: [INITIATED, ACCEPTED, REVOKED, EXPIRED]
  - name: created_at
    type: DateTime
    required: true
    pii: false
    primary_key: false
  - name: valid_until
    type: DateTime
    required: true
    pii: false
    primary_key: false
  - name: consumer_id
    type: String
    required: true
    pii: false
    primary_key: false
  - name: json_web_token
    type: String
    required: true
    pii: false
    primary_key: false
used_by:
  - feature: consent-manager
    api_id: get_consent_status
