name: HSBCCreateConsentResponse
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obie/open-banking/v4.0/aisp/account-access-consents"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # Observed response: Status AWAU, ExpirationDateTime, TransactionFrom/ToDateTime, and the
  # 20-entry Permissions array the PSU approved at the bank.
  source_binding: "core/network/src/commonMain/kotlin/org/mifosx/openbanking/core/network/model/hsbcPermission/response/HSBCCreateConsentResponse.kt"
description: "The raw OBIE envelope returned when an account-access consent is created. Registered as the wire shape rather than a domain projection because login consumes the create response directly, before any consent exists to summarise. ConsentSummary is the mapped form the consent screens read."
fields:
  - name: Data
    type:
      dto_ref: HSBCCreateConsentData
    required: true
    pii: false
    description: "The consent payload — id, status, permissions and the date windows"
    primary_key: false
  - name: Links
    type: Object
    required: true
    pii: false
    description: "OBIE Links envelope block. Self link only on this endpoint"
    primary_key: false
  - name: Meta
    type: Object
    required: true
    pii: false
    description: "OBIE Meta envelope block"
    primary_key: false
  - name: Risk
    type: Object
    required: true
    pii: false
    description: "OBIE Risk block, echoed back from the create request"
    primary_key: false
used_by:
  - feature: login
    api_id: consent-create
    role: response
enums: []
