name: TransactionDetail
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # ⚠ This resource returns the credit card PAN UNMASKED, while the account resource masks it.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/TransactionDetail.kt"
  wire_type: "core/network/model/ais/transactions/TransactionsResponse.kt (Data.Transaction[])"
description: "The full transaction record behind the detail screen. Carries the running balance at the time of the transaction and the proprietary bank codes, none of which the list projections retain. There is no per-transaction OBIE endpoint — the detail is filtered out of the account's transaction list."
fields:
  - name: transactionId
    type: String
    required: true
    pii: false
    description: "OBIE TransactionId this record describes"
    primary_key: true
  - name: accountId
    type: String
    required: true
    pii: false
    description: "Account the transaction belongs to"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Transaction value as an unsigned decimal string. Direction lives in isCredit"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of amount"
    primary_key: false
  - name: isCredit
    type: Boolean
    required: true
    pii: false
    description: "True for money in, false for money out"
    primary_key: false
  - name: merchantName
    type: String
    required: false
    pii: true
    description: "Merchant name when the bank supplies MerchantDetails. Absent for non-merchant transactions"
    primary_key: false
  - name: status
    type: String
    required: true
    pii: false
    description: "OBIE transaction status — Booked or Pending"
    primary_key: false
  - name: bookingDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the transaction was booked to the account"
    primary_key: false
  - name: valueDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the transaction takes value. Can differ from bookingDateTime"
    primary_key: false
  - name: category
    type: TransactionCategory
    required: true
    pii: false
    description: "Spending category derived from merchantCategoryCode. OTHER when nothing matches"
    primary_key: false
  - name: merchantCategoryCode
    type: String
    required: false
    pii: false
    description: "Raw MCC, the input category is derived from"
    primary_key: false
  - name: balanceAmount
    type: String
    required: true
    pii: false
    description: "Account balance immediately after this transaction, as a decimal string"
    primary_key: false
  - name: balanceCurrency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of balanceAmount"
    primary_key: false
  - name: balanceIsCredit
    type: Boolean
    required: true
    pii: false
    description: "Direction of the running balance — false marks an overdrawn account"
    primary_key: false
  - name: transactionInformation
    type: String
    required: true
    pii: true
    description: "Free-text narrative the bank attached to the transaction"
    primary_key: false
  - name: proprietaryCode
    type: String
    required: true
    pii: false
    description: "Bank-proprietary transaction code"
    primary_key: false
  - name: proprietaryIssuer
    type: String
    required: true
    pii: false
    description: "Issuer that defines proprietaryCode"
    primary_key: false
used_by:
  - feature: transaction-detail
    api_id: transactions
    role: response
enums:
  - name: TransactionCategory
    values: [GROCERIES, DINING, SUBSCRIPTIONS, SHOPPING, TRANSPORT, TRANSFER, OTHER]
