name: BeneficiaryItem
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/beneficiaries"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # READ-ONLY: OBIE has no beneficiary write. 400 on the credit card. SCA-recency gated.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/BeneficiaryItem.kt"
  wire_type: "core/network/model/ais/beneficiaries/BeneficiariesResponse.kt (Data.Beneficiary[])"
description: "A saved payee on an account, as BeneficiariesRepository yields it. The scheme determines how identification should be read and rendered — it is not a free-text label."
fields:
  - name: beneficiaryId
    type: String
    required: true
    pii: false
    description: "OBIE BeneficiaryId for this saved payee"
    primary_key: true
  - name: accountId
    type: String
    required: true
    pii: false
    description: "Account the beneficiary is saved against"
    primary_key: false
  - name: creditorName
    type: String
    required: true
    pii: true
    description: "Payee's name as the PSU saved it"
    primary_key: false
  - name: scheme
    type: BeneficiaryScheme
    required: true
    pii: false
    description: "Identification scheme in use — decides how to parse and display identification"
    primary_key: false
  - name: identification
    type: String
    required: true
    pii: true
    description: "Payee account identifier, encoded per scheme (sort-code+number, IBAN, Paym mobile, card or account number)"
    primary_key: false
  - name: reference
    type: String
    required: true
    pii: false
    description: "Payment reference the PSU stored with this payee"
    primary_key: false
used_by:
  - feature: beneficiaries
    api_id: beneficiaries-list
    role: response
enums:
  - name: BeneficiaryScheme
    values: [SortCode, Iban, Paym, Card, Account]
