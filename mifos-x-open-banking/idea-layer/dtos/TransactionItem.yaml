name: TransactionItem
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/statements/{StatementId}/transactions"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/TransactionItem.kt"
  wire_type: "core/network/model/ais/statementTransactions/StatementTransactionsResponse.kt (Data.Transaction[])"
description: "The lean transaction projection used inside a statement. Deliberately narrower than TransactionListItem — a statement's transactions carry no spending category and no pending state, because a statement is closed by the time it is issued."
fields:
  - name: transactionId
    type: String
    required: true
    pii: false
    description: "OBIE TransactionId for this entry"
    primary_key: true
  - name: accountId
    type: String
    required: true
    pii: false
    description: "Account the statement belongs to"
    primary_key: false
  - name: description
    type: String
    required: true
    pii: true
    description: "Display line for the entry"
    primary_key: false
  - name: bookingDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the entry was booked"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Entry value as an unsigned decimal string. Direction lives in isCredit"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of amount"
    primary_key: false
  - name: isCredit
    type: Boolean
    required: true
    pii: false
    description: "True for money in, false for money out"
    primary_key: false
used_by:
  - feature: statement-detail
    api_id: statement-txns
    role: response
enums: []
