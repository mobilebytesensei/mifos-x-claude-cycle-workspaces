name: ConsentRedirect
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v1.1/oauth2/authorize"
  api_ref: API-001
  spec: "OBIE / FAPI 1.0 Advanced — app-to-app authorisation redirect"
  # Retargeted 2026-08-06 (OBP eviction). Carries the signed request object, the PKCE
  # challenge, the state and the nonce. The return leg validates state and nonce BEFORE
  # spending the single-use authorisation code.
description: "Open Banking PSD2 consent redirect info — contains the consent ID, redirect URI for the authorisation flow, current status, and creation timestamp."
fields:
  - name: consent_id
    type: String
    required: true
    pii: false
    description: "Unique identifier of the PSD2 consent"
    primary_key: true
  - name: redirect_uri
    type: String
    required: true
    pii: false
    description: "URI the consumer must visit to complete the consent authorisation"
    primary_key: false
  - name: status
    type: String
    required: true
    pii: false
    description: "Consent status — INITIATED | ACCEPTED | REVOKED | EXPIRED"
    primary_key: false
  - name: created_at
    type: String
    required: true
    pii: false
    description: "ISO 8601 UTC timestamp when this redirect was created"
    primary_key: false
used_by:
  - feature: consent-manager
    api_id: get_consent_status
enums:
  - field: status
    values: [INITIATED, ACCEPTED, REVOKED, EXPIRED]
