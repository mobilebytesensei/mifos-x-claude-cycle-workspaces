name: ConsentSummary
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/ConsentSummary.kt"
  wire_type: "core/network/model/hsbcPermission/response/HSBCCreateConsentResponse.kt"
description: "An account-access consent as ConsentDetailRepository streams it. status is the parsed ConsentStatus enum, not the raw OBIE code — ConsentStatus.fromString maps both the four-letter codes and the long forms, and falls back to Rejected on anything unrecognised."
fields:
  - name: consentId
    type: String
    required: true
    pii: false
    description: "OBIE ConsentId — the handle every AIS call is authorised against"
    primary_key: true
  - name: status
    type: ConsentStatus
    required: true
    pii: false
    description: "Parsed consent state. An unrecognised wire value resolves to Rejected rather than throwing"
    primary_key: false
  - name: permissions
    type:
      list_of: String
    required: true
    pii: false
    description: "Granted OBIE permissions — ReadAccountsDetail, ReadBalances and so on. Determines which endpoints will answer"
    primary_key: false
  - name: creationDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the consent was created"
    primary_key: false
  - name: expirationDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the consent lapses and the PSU must re-authorise"
    primary_key: false
  - name: transactionFromDateTime
    type: DateTime
    required: true
    pii: false
    description: "Start of the transaction window the consent covers"
    primary_key: false
  - name: transactionToDateTime
    type: DateTime
    required: true
    pii: false
    description: "End of the transaction window the consent covers"
    primary_key: false
used_by:
  - feature: consent-detail
    api_id: consent-status
    role: response
  - feature: consent-list
    api_id: consent-status
    role: response
  - feature: consent-callback
    api_id: consent-status
    role: response
enums:
  - name: ConsentStatus
    values: [AwaitingAuthorisation, Authorised, Rejected, Revoked, Expired, Consumed]
