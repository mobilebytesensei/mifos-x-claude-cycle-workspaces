name: DriveUpHours
version: "1.0.0"

# ═══════════════════════════════════════════════════════════════════════════
# ⚠ DEPRECATED 2026-08-07 — UNREFERENCED, DELETION CANDIDATE
# ═══════════════════════════════════════════════════════════════════════════
deprecated:
  at: "2026-08-07"
  by: "/idea-sync — Open Data research"
  status: orphaned
  referenced_by: []
  superseded_by: null
  why:
    nothing_replaces_it: >-
      Unlike its sibling LobbyHours — which BranchAvailability supersedes — this DTO has NO OBIE
      counterpart at all. The drive-up window is not a concept in the OBIE Open Data Branch
      schema: there is no DriveUp key, no second Availability channel, and nothing in the
      ServiceAndFacility enum (28 declared values) that names one.
    it_describes_something_hsbc_does_not_publish: >-
      Not "a field HSBC leaves empty" like AtmLocation.Access24HoursIndicator, which is at least
      in the contract. There is no field. A UK high-street bank does not operate drive-up lanes at
      scale, and the concept came in with the OBP sandbox model, which was US-shaped.
    modelling_it_would_be_invention: >-
      Any attempt to populate this would have to fabricate a source. That is the exact failure
      class the 2026-08-07 rewrite was correcting elsewhere in this layer.
  provenance: >-
    OBP sandbox era, structurally a copy of LobbyHours. `source.origin` still reads `project` and
    `host_status` still reads `unresolved` — stale on both counts.
  used_by_is_stale:
    declares: "{ feature: atm-locator, api_id: get_branches }"
    reality: >-
      No such operation exists. Branch v2.0.0 records the orphaning under
      `replaced_2026_08_07.orphaned_siblings`; branch-locator's api.yaml never references this DTO.
  deletion_guidance: >-
    The stronger deletion candidate of the two orphans — LobbyHours at least documents a shape
    that was genuinely replaced, whereas this documents a capability that never existed on this
    API and never will. RETAINED for now only so the removal is a deliberate act with a written
    reason rather than a silent one. Delete together with LobbyHours.
  do_not: "Do not extend, version-bump, or wire this to any branch-locator operation."

source:
  origin: project
  api_path: "UNRESOLVED — Open Data branch endpoint; host not established (see Branch.yaml)"
  host_status: unresolved
  api_ref: null
  spec: "UK Open Banking Open Data — outside the OBIE consent surface"
description: "Drive-up window opening hours for a bank branch, keyed by day of week. Structurally identical to LobbyHours but represents the drive-up lane schedule separately."
