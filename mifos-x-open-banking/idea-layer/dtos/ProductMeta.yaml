name: ProductMeta
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/product"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0"
description: "Product metadata — supplementary display and licensing information associated with a banking product."
fields:
  - name: license
    type: "String?"
    required: false
    pii: false
    description: "License type for product data (e.g. CC_BY_4.0)"
    primary_key: false
  - name: highlighted
    type: "Boolean?"
    required: false
    pii: false
    description: "Whether this product is featured/highlighted in the UI"
    primary_key: false
  - name: more_info_url
    type: "String?"
    required: false
    pii: false
    description: "URL to extended product information page"
    primary_key: false
  - name: product_code
    type: String
    required: true
    pii: false
    description: "Reference to the associated product code"
    primary_key: false
used_by:
  - feature: products
    api_id: get_account_product
enums: []
