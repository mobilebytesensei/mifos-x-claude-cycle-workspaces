name: ObAccountIdentification
version: "1.0.0"
source:
  origin: external_api
  api_ref: API-003
  api_path: "shared block — Data.Initiation.DebtorAccount and Data.Initiation.CreditorAccount on all 7 PISP families"
  spec: "OBIE Read/Write v4.0"
description: >-
  A bank account as OBIE addresses it. The SchemeName is the load-bearing field: it decides
  whether an account is payable at all on a given rail, and the eligibility rule observed
  against the HSBC sandbox is scheme-based rather than product-based.
fields:
  - name: SchemeName
    type: String
    required: true
    pii: false
    primary_key: false
    enum_ref: ObAccountScheme
    description: "Identification scheme. Determines rail eligibility — see ObAccountScheme."
  - name: Identification
    type: String
    required: true
    pii: true
    primary_key: false
    description: >-
      For UK.OBIE.SortCodeAccountNumber, 14 digits (6 sort code + 8 account number), unseparated.
      For UK.OBIE.IBAN, the IBAN. For UK.OBIE.PAN, the card number — masked on the AIS account
      resource but returned UNMASKED on the transactions resource.
  - name: Name
    type: String
    required: false
    pii: true
    primary_key: false
    description: >-
      Account holder name. Required in practice on CreditorAccount. The bank ENRICHES an omitted
      DebtorAccount with a Name when it selects the payer itself, but never alters one the TPP supplied.
  - name: SecondaryIdentification
    type: String
    required: false
    pii: true
    primary_key: false
    description: "Building society roll number or equivalent. Optional; never sent by this app."
enums:
  - name: ObAccountScheme
    values:
      - value: "UK.OBIE.SortCodeAccountNumber"
        description: "The only scheme accepted as a DOMESTIC debtor or creditor, and the only one accepted on BOTH sides of a VRP."
      - value: "UK.OBIE.IBAN"
        description: >-
          Accepted as an INTERNATIONAL creditor and as an international debtor. Returns U027 as a
          domestic creditor. A GB IBAN creditor on the international rail stages successfully.
      - value: "UK.OBIE.PAN"
        description: >-
          The credit card. Refused as a debtor everywhere: U027 on the domestic rail (the SCHEME
          is rejected), U002 on the international rail (the scheme is accepted but no valid VALUE
          was ever found), and U021 on VRP with an explicit prose message. The card is the one
          product bank-selection cannot rescue.
eligibility_matrix:
  note: >-
    Observed, and it contradicts HSBC Implementation Guide §17.5.1 in both directions. The Guide
    states a product matrix (SO not on savings, VRP PCA-only); savings authorised and settled two
    VRP payments, and Global Money funded a VRP when the bank nominated it. Only VRP states the
    real rule in prose — U021 "the Debtor Identification is not a UK.OBIE.SortCodeAccountNumber
    account". The same constraint appears elsewhere as a bare U027 with no explanation.
  tpp_named_debtor:
    current_account: "accepted on all 7 families"
    savings: "accepted on all 7 families"
    global_money: "REFUSED U002 — except the international same-account conversion, which is accepted"
    credit_card: "REFUSED — U027 domestic, U002 international, U021 VRP"
  bank_selected_debtor:
    note: >-
      Omitting DebtorAccount lets the PSU pick at the bank, which widens what is reachable —
      Global Money and the credit card both funded payments this way on the six PIS families.
      It does NOT rescue the card on VRP, which is refused by both routes.
used_by:
  - { feature: pay-domestic-single, api_id: domestic-payment-consent-create, role: nested }
  - { feature: pay-domestic-scheduled, api_id: domestic-scheduled-payment-consent-create, role: nested }
  - { feature: pay-domestic-standing-order, api_id: domestic-standing-order-consent-create, role: nested }
  - { feature: pay-international-single, api_id: international-payment-consent-create, role: nested }
  - { feature: pay-international-scheduled, api_id: international-scheduled-payment-consent-create, role: nested }
  - { feature: pay-international-standing-order, api_id: international-standing-order-consent-create, role: nested }
  - { feature: pay-vrp-mandate, api_id: domestic-vrp-consent-create, role: nested }
