name: StatementBalanceLine
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/statements/{StatementId}"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/StatementDetail.kt"
description: "One balance line inside a statement. Distinct from AccountBalanceLine: this is a historical figure fixed at statement issue, not a live account balance, and it carries a direction flag instead of a timestamp."
fields:
  - name: type
    type: String
    required: true
    pii: false
    description: "OBIE statement balance type — OpeningBooked, ClosingBooked and so on"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Balance value as an unsigned decimal string"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of amount"
    primary_key: false
  - name: isCredit
    type: Boolean
    required: true
    pii: false
    description: "Direction of the balance — false marks an overdrawn position"
    primary_key: false
used_by:
  - feature: statement-detail
    api_id: statement-detail
    role: response
enums: []
