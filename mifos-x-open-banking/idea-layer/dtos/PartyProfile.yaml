name: PartyProfile
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/party"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # Availability: 400 on Global Money. Also one of the five resources gated by SCA recency —
  # returns 403 with an EMPTY body on a stale-SCA token, with no error code to key on.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/PartyProfile.kt"
  wire_type: "core/network/model/ais/party/PartyResponse.kt"
description: "The account holder behind an account, as ProfileRepository.profileStream yields it. Every field except partyId and roleLabel is PSU personal data. A blank displayName is the model's own empty signal."
fields:
  - name: partyId
    type: String
    required: true
    pii: false
    description: "OBIE PartyId identifying the account holder"
    primary_key: true
  - name: displayName
    type: String
    required: true
    pii: true
    description: "Account holder's full name. Blank marks the profile empty (PartyProfile.isEmpty)"
    primary_key: false
  - name: roleLabel
    type: String
    required: true
    pii: false
    description: "Relationship of this party to the account — Sole, Joint and so on"
    primary_key: false
  - name: initials
    type: String
    required: true
    pii: true
    description: "Initials derived from displayName, for the avatar"
    primary_key: false
  - name: email
    type: String
    required: true
    pii: true
    description: "Account holder's email address"
    primary_key: false
  - name: mobile
    type: String
    required: true
    pii: true
    description: "Account holder's mobile number"
    primary_key: false
  - name: addressLine
    type: String
    required: true
    pii: true
    description: "Account holder's postal address, flattened to one line"
    primary_key: false
used_by:
  - feature: account-holder
    api_id: party
    role: response
enums: []
