name: DirectDebitsSummary
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/direct-debits"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/DirectDebitItem.kt"
  wire_type: "core/network/model/ais/directDebits/DirectDebitsResponse.kt"
description: "What DirectDebitsRepository actually streams — the mandate list plus its active and inactive tallies, pre-counted rather than derived in the ViewModel. This is the response shape, not the bare list."
fields:
  - name: items
    type:
      list_of:
        dto_ref: DirectDebitItem
    required: true
    pii: false
    description: "Every mandate on the account, active and inactive alike"
    primary_key: false
  - name: activeCount
    type: Int
    required: true
    pii: false
    description: "Count of items whose isActive is true"
    primary_key: false
  - name: inactiveCount
    type: Int
    required: true
    pii: false
    description: "Count of items whose isActive is false"
    primary_key: false
used_by:
  - feature: direct-debits
    api_id: direct-debits-list
    role: response
enums: []
