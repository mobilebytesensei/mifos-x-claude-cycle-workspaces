name: StandingOrderItem
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/standing-orders"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # StandingOrderId is ABSENT from every element, so an AIS-read mandate cannot be correlated
  # with a PIS-created one. This read also RETURNS Frequency.PointInTime, which the PIS write
  # side refuses with U005. 400 on savings, Global Money and the card. SCA-recency gated.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/StandingOrderItem.kt"
  wire_type: "core/network/model/ais/standingOrders/StandingOrdersResponse.kt (Data.StandingOrder[])"
description: "One standing order on an account. finalPaymentDateTime is only meaningful when hasFinalPayment is true — an open-ended order carries no end date."
fields:
  - name: standingOrderId
    type: String
    required: true
    pii: false
    description: "OBIE StandingOrderId for this instruction"
    primary_key: true
  - name: payeeName
    type: String
    required: true
    pii: true
    description: "Creditor name the payment goes to"
    primary_key: false
  - name: statusCode
    type: String
    required: true
    pii: false
    description: "Raw OBIE StandingOrderStatusCode as returned by the bank"
    primary_key: false
  - name: isActive
    type: Boolean
    required: true
    pii: false
    description: "Whether statusCode resolves to an active instruction — derived"
    primary_key: false
  - name: nextPaymentAmount
    type: String
    required: true
    pii: false
    description: "Amount due on the next execution, as a decimal string"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of nextPaymentAmount"
    primary_key: false
  - name: frequencyLabel
    type: String
    required: true
    pii: false
    description: "Human-readable rendering of the OBIE frequency expression"
    primary_key: false
  - name: nextPaymentDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the next payment is due"
    primary_key: false
  - name: finalPaymentDateTime
    type: DateTime
    required: false
    pii: false
    description: "When the last payment falls due. Only meaningful when hasFinalPayment is true"
    primary_key: false
  - name: hasFinalPayment
    type: Boolean
    required: true
    pii: false
    description: "False for an open-ended order, in which case finalPaymentDateTime must not be rendered"
    primary_key: false
  - name: creditorIdentification
    type: String
    required: true
    pii: true
    description: "Creditor account identifier the payment is sent to"
    primary_key: false
  - name: reference
    type: String
    required: true
    pii: false
    description: "Payment reference carried on each execution"
    primary_key: false
used_by:
  - feature: standing-orders
    api_id: standing-orders-list
    role: response
enums: []
