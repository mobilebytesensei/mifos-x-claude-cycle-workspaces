name: DomesticPaymentConsentResponse
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/pisp/domestic-payment-consents/{ConsentId}"
  api_ref: API-003
  spec: "OBIE Read/Write v4.0"
  status_ladder: "AWAU -> AUTH -> COND (RJCT if the PSU denies at the bank)"
  polling_trap: >-
    Data.StatusUpdateDateTime does NOT move on AWAU -> AUTH. All five authorised consents in
    the PISP-tests corpus transitioned with it still equal to CreationDateTime. Poll Data.Status
    and nothing else — a timestamp-keyed poll never fires.
  source_binding: "core/network/src/commonMain/kotlin/org/mifosx/openbanking/core/network/model/pisp/domesticPayment/response/DomesticPaymentConsentResponse.kt"
description: "State of a domestic-payment consent — what payment-consent polls to learn whether the PSU authorised, rejected or abandoned the journey. Data.Status is the field that decides; every envelope field is nullable in source."
fields:
  - name: Data
    type:
      dto_ref: DomesticPaymentData
    required: false
    pii: false
    description: "Consent state — id, status, timestamps and the echoed initiation"
    primary_key: false
  - name: Links
    type: Object
    required: false
    pii: false
    description: "OBIE Links envelope block"
    primary_key: false
  - name: Meta
    type: Object
    required: false
    pii: false
    description: "OBIE Meta envelope block"
    primary_key: false
  - name: Risk
    type: Object
    required: false
    pii: false
    description: "OBIE Risk block, echoed back from the consent request"
    primary_key: false
used_by:
  - feature: payment-consent
    api_id: payment-consent-status
    role: response
  - feature: pay-domestic-single
    api_id: domestic-payment-consent-create
    role: response
enums: []
