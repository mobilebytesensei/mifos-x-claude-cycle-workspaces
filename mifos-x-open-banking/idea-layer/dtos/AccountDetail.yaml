name: AccountDetail
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/AccountDetail.kt"
  wire_type: "core/network/model/ais/accountDetails/AccountDetailsResponse.kt"
description: "The single-account detail projection AccountDetailRepository.detailStream yields. Carries the servicer and status fields the list projection (BankAccount) omits, plus the inputs HsbcProductType.resolve derives productType from."
fields:
  - name: accountId
    type: String
    required: true
    pii: false
    description: "OBIE AccountId this detail record describes"
    primary_key: true
  - name: nickname
    type: String
    required: true
    pii: true
    description: "PSU-assigned display name for the account"
    primary_key: false
  - name: accountSubType
    type: String
    required: true
    pii: false
    description: "OBIE AccountSubType — one of the three inputs to productType resolution"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code the account is denominated in"
    primary_key: false
  - name: sortCode
    type: String
    required: true
    pii: true
    description: "UK sort code parsed out of the identification string"
    primary_key: false
  - name: accountNumber
    type: String
    required: true
    pii: true
    description: "UK account number parsed out of the identification string"
    primary_key: false
  - name: servicerIdentification
    type: String
    required: false
    pii: false
    description: "OBIE Servicer.Identification — the BIC of the institution servicing the account"
    primary_key: false
  - name: statusUpdateDateTime
    type: DateTime
    required: false
    pii: false
    description: "When the account status last changed"
    primary_key: false
  - name: accountTypeCode
    type: String
    required: false
    pii: false
    description: "OBIE AccountType — second input to productType resolution"
    primary_key: false
  - name: description
    type: String
    required: false
    pii: false
    description: "Free-text product description — third input to productType resolution"
    primary_key: false
used_by:
  - feature: account-detail
    api_id: account-detail
    role: response
enums: []
