name: TransactionAccount
version: "1.1.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0 — CreditorAccount / DebtorAccount on a transaction record"
  # Retargeted 2026-08-06 (OBP eviction). There is no /owner/ view segment in OBIE, and no
  # single-transaction endpoint — a transaction detail screen filters the list response.
description: "Represents the owning bank account on a transaction (the 'this_account' side). Carries the account id, bank id and its associated routing entries for display and deep-linking."
fields:
  - name: id
    type: String
    required: true
    pii: false
    description: "Identifier of the account that owns this transaction"
    primary_key: true
  - name: bank_id
    type: String
    required: true
    pii: false
    description: "Identifier of the bank that hosts this account. Under OBIE the counterparty side is expressed as `CreditorAccount`/`DebtorAccount` with a `SchemeName` (UK.OBIE.SortCodeAccountNumber, UK.OBIE.IBAN, UK.OBIE.PAN) plus an `Identification` value — there is no bank identifier on the wire, so deep-link routing resolves from that scheme/identification pair"
    primary_key: false
  - name: account_routings
    type:
      list_of:
        dto_ref: AccountRouting
    required: true
    pii: false
    description: "Routing entries (IBAN, sort-code, etc.) for the owning account"
    primary_key: false
used_by:
  - feature: transaction-detail
    api_id: get_transactions
enums: []
