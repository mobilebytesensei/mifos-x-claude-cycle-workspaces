  # ── Card / CardAccountRef REMOVED 2026-08-06 (/idea-sync, OBP eviction) ──
  # Both were verified against GET /obp/v7.0.0/cards on the Open Bank Project sandbox and
  # modelled a snake_case payload (bank_id, bank_card_number, on_hot_list, allows[], networks[]).
  #
  # OBIE HAS NO CARD RESOURCE. A payment card surfaces only as an entry in the accounts list,
  # identified by Account[].SchemeName == UK.OBIE.PAN. So a Card type was not merely
