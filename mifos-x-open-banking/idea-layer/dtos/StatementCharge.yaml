name: StatementCharge
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/statements/{StatementId}"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/StatementDetail.kt"
description: "One fee or interest line on a statement. The same shape serves both StatementDetail.fees and StatementDetail.interest — which list it came from is what distinguishes them, not a field on the row."
fields:
  - name: description
    type: String
    required: true
    pii: false
    description: "What the charge was for, as the bank describes it"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Charge value as an unsigned decimal string"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of amount"
    primary_key: false
  - name: isCredit
    type: Boolean
    required: true
    pii: false
    description: "Direction — true when the line credits the account, as with interest paid"
    primary_key: false
used_by:
  - feature: statement-detail
    api_id: statement-detail
    role: response
enums: []
