name: LobbyHours
version: "1.0.0"

# ═══════════════════════════════════════════════════════════════════════════
# ⚠ DEPRECATED 2026-08-07 — UNREFERENCED, DELETION CANDIDATE
# ═══════════════════════════════════════════════════════════════════════════
deprecated:
  at: "2026-08-07"
  by: "/idea-sync — Open Data research"
  status: orphaned
  referenced_by: []
  superseded_by: BranchAvailability
  why:
    the_shape_is_wrong: >-
      This DTO models opening hours as SEVEN OPTIONAL DISPLAY STRINGS keyed by weekday
      ("09:00-17:00"). OBIE Open Data publishes a STRUCTURED ARRAY —
      Availability.StandardAvailability.Day[] with { Name, OpeningHours[{ OpeningTime,
      ClosingTime }] } — confirmed against 25 live HSBC branches and the HSBC-published swagger.
      Not one field name or type survives. It is not migratable field-by-field.
    what_it_cannot_express: >-
      A split day (lunchtime closure), which OBIE models as two OpeningHours ranges and this DTO
      flattens into one string. And structured times, which are what make sorting, comparison and
      localisation possible at all.
    what_it_got_right: >-
      The absent-means-closed convention. OBIE uses the same rule one level up — a closed day is
      ABSENT from Day[] rather than flagged. That convention carried forward into
      BranchAvailability#closed_days_are_absent; the field layout did not.
  provenance: >-
    OBP sandbox era. `source.origin` still reads `project` and `host_status` still reads
    `unresolved` — both stale: the Branch Locator host was resolved to api.hsbc.com on 2026-08-07
    and this DTO was never part of that API.
  used_by_is_stale:
    declares: "{ feature: atm-locator, api_id: get_branches }"
    reality: >-
      No such operation exists. Branches moved out of atm-locator into the branch-locator feature
      on 2026-08-07, and branch-locator's api.yaml references BranchAvailability, never this.
      Branch v2.0.0 records the orphaning under `replaced_2026_08_07.orphaned_siblings`.
  deletion_guidance: >-
    Safe to delete once nothing points at it — which is already true. RETAINED for now only as the
    record of what the OBP model looked like, so a future reader can see WHY the Branch rewrite
    was a replacement rather than a migration. Delete together with DriveUpHours.
  do_not: "Do not extend, version-bump or 'fix' this DTO. Any hours work belongs in BranchAvailability."

source:
  origin: project
  api_path: "UNRESOLVED — Open Data branch endpoint; host not established (see Branch.yaml)"
  host_status: unresolved
  api_ref: null
  spec: "UK Open Banking Open Data — outside the OBIE consent surface"
description: "Lobby opening hours for a bank branch, keyed by day of week. Each field is optional — absent means the branch lobby is closed that day."
