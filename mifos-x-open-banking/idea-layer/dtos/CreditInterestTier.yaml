name: CreditInterestTier
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/product"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/ProductTerms.kt"
description: "One credit-interest band within a product's terms. Rates are decimal strings, not numbers — they are displayed verbatim and never arithmetic operands."
fields:
  - name: bandLimit
    type: String
    required: true
    pii: false
    description: "Upper balance limit this band applies to, as a decimal string"
    primary_key: false
  - name: aer
    type: String
    required: true
    pii: false
    description: "Annual equivalent rate for the band, as a decimal string"
    primary_key: false
  - name: applicationFrequency
    type: String
    required: true
    pii: false
    description: "How often interest is applied — Monthly, Annually and so on"
    primary_key: false
used_by:
  - feature: product
    api_id: product
    role: response
enums: []
