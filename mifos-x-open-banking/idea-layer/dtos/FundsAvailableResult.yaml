name: FundsAvailableResult
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/pisp/domestic-payment-consents/{ConsentId}/funds-confirmation"
  api_ref: API-003
  spec: "OBIE Read/Write v4.0"
  token_requirement: "PSU authorisation-code token. A client-credentials token returns 401 — reproduced on all three VRP runs."
  source_binding: null
  source_binding_note: >-
    Spec-only, same as its parent FundsConfirmationResponse. Fields come from the inline
    response_shape block in screens/send-money/api.yaml.
  spec_ahead_of_source: true
description: "The funds-availability verdict and the moment it was struck. The verdict is point-in-time — a later submission can still fail on funds, so the timestamp matters as much as the boolean."
fields:
  - name: FundsAvailable
    type: Boolean
    required: true
    pii: false
    description: "Whether the debtor account held sufficient funds when the check ran"
    primary_key: false
  - name: FundsAvailableDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the check was performed. The verdict is only valid as of this moment"
    primary_key: false
used_by:
  - feature: pay-domestic-single
    api_id: domestic-payment-funds-confirmation
    role: response
enums: []
