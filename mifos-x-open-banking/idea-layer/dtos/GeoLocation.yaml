name: GeoLocation
version: "1.0.0"
source:
  origin: project
  api_path: "nested"
description: "Latitude/longitude coordinate pair embedded in AtmLocation and Branch records. Consumed by the ATM locator map view to pin ATMs and branches on the device map and calculate walking/driving distance."
fields:
  - name: latitude
    type: Double
    required: true
    pii: false
    description: "WGS 84 latitude in decimal degrees, range -90.0 to 90.0"
    primary_key: false
  - name: longitude
    type: Double
    required: true
    pii: false
    description: "WGS 84 longitude in decimal degrees, range -180.0 to 180.0"
    primary_key: false
used_by:
  - feature: atm-locator
    api_id: get_atms
enums: []
