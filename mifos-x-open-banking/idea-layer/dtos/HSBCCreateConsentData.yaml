name: HSBCCreateConsentData
version: "1.0.0"
source:
  origin: project
  api_path: "POST /obie/open-banking/v4.0/aisp/account-access-consents"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # ⚠ This is the ONE consent endpoint that REJECTS x-jws-signature: sending it returns
  # UK.OBIE.Header.Unexpected. Note the error arrives in the v3.1 LONG form even on the v4.0
  # endpoint (v4.0 codes this condition U020) — HSBC serves both generations side by side.
  source_binding: "core/network/src/commonMain/kotlin/org/mifosx/openbanking/core/network/model/hsbcPermission/response/Data.kt"
description: "The Data block of the account-access-consent envelope. Named for its parent rather than kept as the source's bare `Data`, which would collide with the five other per-package Data classes in core/network. status is the raw OBIE string here; ConsentSummary.status is the parsed enum."
fields:
  - name: ConsentId
    type: String
    required: true
    pii: false
    description: "OBIE ConsentId every subsequent AIS call is authorised against"
    primary_key: true
  - name: CreationDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the consent was created"
    primary_key: false
  - name: ExpirationDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the consent lapses and re-authorisation is required"
    primary_key: false
  - name: Permissions
    type:
      list_of: String
    required: true
    pii: false
    description: "Granted OBIE permissions, which decide which endpoints will answer"
    primary_key: false
  - name: Status
    type: String
    required: true
    pii: false
    description: "Raw OBIE status code — AWAU, AUTH and so on. ConsentStatus.fromString maps these"
    primary_key: false
  - name: StatusUpdateDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the consent status last changed"
    primary_key: false
  - name: TransactionFromDateTime
    type: DateTime
    required: true
    pii: false
    description: "Start of the transaction window the consent covers"
    primary_key: false
  - name: TransactionToDateTime
    type: DateTime
    required: true
    pii: false
    description: "End of the transaction window the consent covers"
    primary_key: false
used_by:
  - feature: login
    api_id: consent-create
    role: response
enums: []
