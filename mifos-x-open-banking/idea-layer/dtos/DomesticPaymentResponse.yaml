name: DomesticPaymentResponse
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/pisp/domestic-payments/{DomesticPaymentId}"
  api_ref: API-003
  spec: "OBIE Read/Write v4.0"
  status_ladder: "ACSP at creation -> ACCC on read-back"
  source_binding: "core/network/src/commonMain/kotlin/org/mifosx/openbanking/core/network/model/pisp/domesticPayment/response/DomesticPaymentResponse.kt"
description: "Outcome of a submitted domestic payment. Data.DomesticPaymentId is the handle payment-status polls on; Data.Status carries the settlement state. Same envelope as the consent response, which is why both share DomesticPaymentData."
fields:
  - name: Data
    type:
      dto_ref: DomesticPaymentData
    required: false
    pii: false
    description: "Payment state — DomesticPaymentId, status, timestamps and the echoed initiation"
    primary_key: false
  - name: Links
    type: Object
    required: false
    pii: false
    description: "OBIE Links envelope block"
    primary_key: false
  - name: Meta
    type: Object
    required: false
    pii: false
    description: "OBIE Meta envelope block"
    primary_key: false
  - name: Risk
    type: Object
    required: false
    pii: false
    description: "OBIE Risk block, echoed from the submission"
    primary_key: false
used_by:
  - feature: payment-status
    api_id: domestic-payment-read
    role: response
  - feature: pay-domestic-single
    api_id: domestic-payment-submit
    role: response
enums: []
