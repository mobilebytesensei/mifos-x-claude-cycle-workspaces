name: AccountBalanceLine
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/AccountBalanceLine.kt"
  wire_type: "core/network/model/ais/balances/BalancesResponse.kt (Data.Balance[])"
description: "One OBIE balance row, kept unreduced. account-detail renders every type the bank returns (InterimAvailable, InterimBooked, OpeningBooked) rather than collapsing them the way AccountBalance does."
fields:
  - name: type
    type: String
    required: true
    pii: false
    description: "OBIE balance type — InterimAvailable, InterimBooked, OpeningBooked and so on"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Balance value as a decimal string"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code for this line"
    primary_key: false
  - name: dateTime
    type: DateTime
    required: false
    pii: false
    description: "When this balance was struck"
    primary_key: false
used_by:
  - feature: account-detail
    api_id: balances
    role: response
enums: []
