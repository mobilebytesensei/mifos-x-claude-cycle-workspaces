name: Product
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/product"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0"
  # Retargeted 2026-08-06 (OBP eviction). OBIE has no bank-wide product CATALOGUE — product
  # terms are read per-account, and return 400 on Global Money.
description: "Bank product record. The browsing catalogue this DTO backs is published by the HSBC UK Open Data v2.2 Product Finder on `https://api.hsbc.com` — unauthenticated, outside the OBIE consent surface; the OBIE AISP read declared in `source.api_path` returns product terms for a single held account only, never a bank-wide list. Covers savings accounts, current accounts, loans, cards, and mortgages. Used on the products browsing screen to present available offerings with their category, label, and terms URL so customers can explore and compare products before applying."
fields:
  - name: product_code
    type: String
    required: true
    pii: false
    description: "Unique product code within the bank, serves as the primary identifier"
    primary_key: true
  - name: name
    type: String
    required: true
    pii: false
    description: "Full product name as it appears in marketing material (e.g. Premier Current Account)"
    primary_key: false
  - name: category
    type: String
    required: true
    pii: false
    description: "High-level product category: SAVINGS, CURRENT, LOANS, CARDS, or MORTGAGES"
    primary_key: false
  - name: parent_product_code
    type:
      optional: String
    required: false
    pii: false
    description: "Product code of the parent product when this is a sub-product or variant — absent for top-level products"
    primary_key: false
  - name: label
    type: String
    required: true
    pii: false
    description: "Short display label used in list views and category chips (e.g. Current Account)"
    primary_key: false
  - name: meta_license
    type:
      optional: String
    required: false
    pii: false
    description: "Licence identifier for the product metadata — optional, used for open-data compliance"
    primary_key: false
  - name: description
    type:
      optional: String
    required: false
    pii: false
    description: "Long-form marketing description of the product — optional, rendered in the product detail card"
    primary_key: false
  - name: terms_url
    type:
      optional: Url
    required: false
    pii: false
    description: "URL linking to the full terms and conditions document for this product — optional"
    primary_key: false
used_by:
  - feature: products
    api_id: get_account_product
enums:
  - field: category
    values: [SAVINGS, CURRENT, LOANS, CARDS, MORTGAGES]
