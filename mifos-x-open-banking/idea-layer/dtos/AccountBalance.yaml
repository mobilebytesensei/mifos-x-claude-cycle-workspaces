name: AccountBalance
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/balances"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/AccountBalance.kt"
  wire_type: "core/network/model/ais/balances/BalancesResponse.kt (Data.Balance[])"
description: "The collapsed single-balance projection BalancesRepository yields for a list or hero card — the OBIE Balance array reduced to one current and one available figure. account-detail consumes the uncollapsed AccountBalanceLine list instead."
fields:
  - name: accountId
    type: String
    required: true
    pii: false
    description: "Account this balance belongs to"
    primary_key: true
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code — a multi-currency account reports its native currency, not GBP"
    primary_key: false
  - name: currentAmount
    type: String
    required: true
    pii: false
    description: "Booked balance as a decimal string. String, not a numeric type, so no precision is lost in transit"
    primary_key: false
  - name: availableAmount
    type: String
    required: true
    pii: false
    description: "Balance available to spend as a decimal string, after pending items and any overdraft"
    primary_key: false
used_by:
  - feature: accounts
    api_id: balances
    role: response
  - feature: home
    api_id: selected-account-balances
    role: response
enums: []
