name: BranchRef
version: "1.0.0"
source:
  origin: external_api
  api_path: "GET /open-banking/v2.2/atms and the four /x-open-banking/v2.2/atms/… extensions"
  host: api.hsbc.com
  host_status: resolved
  api_ref: API-OD-ATM
  spec: "OBIE Open Data v2.2 — unauthenticated, outside the OBIE consent surface"
  created:
    at: "2026-08-07"
    by: "/idea-sync — dangling-ref closure"
    reason: >-
      AtmLocation v2.1.0 declared `Branch` as `dto_ref: BranchRef` but no such DTO existed.

description: >-
  A REFERENCE STUB carrying a branch id and nothing else. This is the `Branch` object on an ATM
  record. It is NOT the Branch DTO and must never be modelled as a partial one — there is no
  Name, no address, no opening hours and no way for any of those to appear.

# ─────────────────────────────────────────────────────────────────────────
# THE WHOLE DTO — one field, and that is the point
# ─────────────────────────────────────────────────────────────────────────
fields:
  - name: Identification
    type: String
    required: false
    pii: false
    primary_key: true
    constraint: "minLength 1, maxLength 35"
    observed: '135/135 present. Numeric strings — "401874". 31 distinct branches across 135 ATMs.'
    description: >-
      The branch key. Matches Branch.Identification in the Branch Locator feed — the ONLY join
      between the two Open Data APIs.

emptiness_is_by_contract_not_by_luck:
  finding: >-
    The swagger declares this object with exactly ONE property (Identification) and sets
    `additionalProperties: false`. Nothing else is permitted to appear, ever.
  evidence:
    swagger: "open-atm-locator-swagger.json — ATMDefinition…ATM.items.properties.Branch"
    live: '135/135 ATM records carry Branch as exactly {"Identification": "401874"}. Union of all observed keys = ["Identification"].'
  why_it_matters: >-
    This is NOT an under-populated field that HSBC might fill in later, like
    AtmLocation.Access24HoursIndicator. It is a deliberate foreign key. A model that leaves room
    for Name / PostalAddress / Availability "in case they arrive" is modelling something the
    contract forbids.

resolving_it_costs_a_second_call:
  finding: >-
    Turning this id into anything a user can read requires a SEPARATE Branch Locator request.
  consequence: >-
    A UI string like "at HSBC Baker Street" or "inside a branch open until 16:30" is a second
    network round-trip per ATM, against a different endpoint, on a screen the user opened to find
    a cash machine. Decide deliberately whether that is worth it — it is not free, and it is not
    visible in the ATM payload that it is not free.
  the_cheap_path: >-
    135 ATMs map to only 31 distinct branch ids, so ONE unfiltered branch fetch and a client-side
    index resolves every ATM in a result set at the cost of a single extra call. Fetching per-ATM
    would issue 135 requests to learn 31 answers.
  the_honest_path: >-
    Show the id only if it is genuinely useful (it is not, to a consumer), or show nothing.
    Rendering a raw "401874" next to a cash machine communicates nothing.

join_contract:
  from: "AtmLocation.Branch.Identification"
  to: "Branch.Identification"
  cardinality: "many ATMs → one branch (observed 135 → 31)"
  caveat: >-
    Unverified in the other direction. The 25-branch sample and the 135-ATM sample were taken
    over different geographies, so no claim is made here that every ATM's branch id resolves to a
    branch the Branch Locator will return. Treat an unresolvable id as normal, not as an error.

used_by:
  - { dto: AtmLocation, field: Branch, role: "embedded reference — optional" }
  - { feature: atm-locator, api_id: get_all_atms, role: "response — nested" }
  - { feature: atm-locator, api_id: get_atms_by_geolocation, role: "response — nested" }
  - { feature: atm-locator, api_id: get_atms_by_postcode, role: "response — nested" }
  - { feature: atm-locator, api_id: get_atms_by_town, role: "response — nested" }
  - { feature: atm-locator, api_id: get_atms_by_country, role: "response — nested" }
