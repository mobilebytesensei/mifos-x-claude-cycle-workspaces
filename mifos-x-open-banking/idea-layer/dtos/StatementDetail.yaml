name: StatementDetail
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/statements/{StatementId}"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # Availability is INVERTED vs every other AIS resource: 200 on the credit card ONLY, 400 on
  # both current accounts, savings and Global Money.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/StatementDetail.kt"
  wire_type: "core/network/model/ais/statementDetails/StatementDetailsResponse.kt"
description: "The full breakdown for one statement — every balance line the bank struck plus its fees and interest. fees and interest share the StatementCharge shape but are separate lists; the bank distinguishes them and so does the screen."
fields:
  - name: accountId
    type: String
    required: true
    pii: false
    description: "Account the statement belongs to"
    primary_key: false
  - name: statementId
    type: String
    required: true
    pii: false
    description: "OBIE StatementId this detail describes"
    primary_key: true
  - name: reference
    type: String
    required: true
    pii: false
    description: "Bank's own reference for the statement, as printed"
    primary_key: false
  - name: type
    type: String
    required: true
    pii: false
    description: "OBIE StatementType — RegularPeriodic, Interim and so on"
    primary_key: false
  - name: periodStart
    type: DateTime
    required: true
    pii: false
    description: "First moment the statement period covers"
    primary_key: false
  - name: periodEnd
    type: DateTime
    required: true
    pii: false
    description: "Last moment the statement period covers"
    primary_key: false
  - name: created
    type: DateTime
    required: true
    pii: false
    description: "When the bank issued the statement"
    primary_key: false
  - name: balances
    type:
      list_of:
        dto_ref: StatementBalanceLine
    required: true
    pii: false
    description: "Every balance the bank struck for the period — opening, closing and any interim lines"
    primary_key: false
  - name: fees
    type:
      list_of:
        dto_ref: StatementCharge
    required: true
    pii: false
    description: "Fees charged during the period. Empty when none were levied"
    primary_key: false
  - name: interest
    type:
      list_of:
        dto_ref: StatementCharge
    required: true
    pii: false
    description: "Interest applied during the period, kept separate from fees. Empty when none applied"
    primary_key: false
used_by:
  - feature: statement-detail
    api_id: statement-detail
    role: response
enums: []
