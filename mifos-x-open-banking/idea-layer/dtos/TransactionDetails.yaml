name: TransactionDetails
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0"
description: "Financial and temporal details nested within a Transaction. Captures the transaction type, human-readable description, posting and completion timestamps, the resulting account balance, and the transaction value."
fields:
  - name: type
    type: String
    required: true
    pii: false
    description: "Transaction type code as returned by OBIE — the ISO-derived `BankTransactionCode.Code`/`BankTransactionCode.SubCode` pair, or the ASPSP's `ProprietaryBankTransactionCode` where present"
    primary_key: false
  - name: description
    type: String
    required: true
    pii: false
    description: "Free-text description of the transaction provided by the bank"
    primary_key: false
  - name: posted
    type: DateTime
    required: true
    pii: false
    description: "ISO 8601 timestamp when the transaction was posted to the ledger"
    primary_key: false
  - name: completed
    type: DateTime
    required: true
    pii: false
    description: "ISO 8601 timestamp when the transaction was fully settled/completed"
    primary_key: false
  - name: new_balance
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "Account balance immediately after this transaction was applied"
    primary_key: false
  - name: value
    type:
      dto_ref: MoneyAmount
    required: true
    pii: false
    description: "The monetary value of this transaction (positive for credits, negative for debits)"
    primary_key: false
used_by:
  - feature: transactions
    api_id: get_transactions
  - feature: transaction-detail
    api_id: get_transactions
enums: []
