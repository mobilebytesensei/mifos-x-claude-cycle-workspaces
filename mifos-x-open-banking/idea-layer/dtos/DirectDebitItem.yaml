name: DirectDebitItem
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/direct-debits"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  # READ-ONLY: OBIE provides NO direct-debit cancellation. 400 on savings, Global Money and the
  # card. SCA-recency gated.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/DirectDebitItem.kt"
  wire_type: "core/network/model/ais/directDebits/DirectDebitsResponse.kt (Data.DirectDebit[])"
description: "One direct-debit mandate on an account. Carries both the raw OBIE statusCode and the isActive boolean derived from it, so the UI never has to re-interpret the code."
fields:
  - name: mandateId
    type: String
    required: true
    pii: false
    description: "OBIE DirectDebitId for this mandate"
    primary_key: true
  - name: name
    type: String
    required: true
    pii: true
    description: "Originator name — who collects on this mandate"
    primary_key: false
  - name: statusCode
    type: String
    required: true
    pii: false
    description: "Raw OBIE DirectDebitStatusCode as returned by the bank"
    primary_key: false
  - name: isActive
    type: Boolean
    required: true
    pii: false
    description: "Whether statusCode resolves to an active mandate — derived, so callers need not decode the code"
    primary_key: false
  - name: previousPaymentAmount
    type: String
    required: true
    pii: false
    description: "Amount last collected, as a decimal string"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of previousPaymentAmount"
    primary_key: false
  - name: previousPaymentDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the last collection was taken"
    primary_key: false
used_by:
  - feature: direct-debits
    api_id: direct-debits-list
    role: response
  - feature: direct-debit-detail
    api_id: direct_debit_detail_by_id
    role: response
enums: []
