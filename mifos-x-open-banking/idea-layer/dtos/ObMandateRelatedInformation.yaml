name: ObMandateRelatedInformation
version: "1.0.0"
source:
  origin: external_api
  api_ref: API-003
  api_path: "Data.Initiation.MandateRelatedInformation on domestic-standing-order-consents and international-standing-order-consents"
  spec: "OBIE Read/Write v4.0"
description: >-
  The recurrence definition on both standing-order rails. Replaces the transactional identity
  fields (InstructionIdentification, EndToEndIdentification) and the execution date that the
  single and scheduled rails carry. Shape is the v4.0 NESTED object; no v3.1 flat frequency
  string appears anywhere in the capture corpus.
fields:
  - name: Frequency
    type: Object
    required: true
    pii: false
    primary_key: false
    description: "Nested object carrying Type. See ObFrequencyType."
  - name: Frequency.Type
    type: String
    required: true
    pii: false
    primary_key: false
    enum_ref: ObFrequencyType
    description: "One of exactly five values HSBC Personal accepts."
  - name: Frequency.PointInTime
    type: String
    required: false
    pii: false
    primary_key: false
    description: >-
      MUST NOT BE SENT. Returns U005 "Field is not expected" on write — confirmed across three
      shapes. But HSBC's own AIS read side RETURNS it ({"PointInTime":"01","Type":"WEEK"}), so
      the bank emits a field its write side refuses. An AIS-read standing order cannot be
      replayed as a PIS consent without stripping this first.
    forbidden_on_write: true
  - name: FirstPaymentDateTime
    type: DateTime
    required: true
    pii: false
    primary_key: false
    description: >-
      When the mandate starts. NOT normalised — echoes back byte-identical with the time
      component intact, unlike RequestedExecutionDateTime on the scheduled rails which is
      truncated to midnight. Weekend dates staged 201 in testing.
  - name: FinalPaymentDateTime
    type: DateTime
    required: false
    pii: false
    primary_key: false
    description: >-
      Optional. Omitting it stages 201 as an open-ended "until further notice" mandate.
      Three constraints, all delivered in a single U003 message: must be after
      FirstPaymentDateTime, must be within 12 months, and cannot be today or tomorrow. The
      12-month horizon appears nowhere in the Implementation Guide.
  - name: CountPerPeriod
    type: Integer
    required: false
    pii: false
    primary_key: false
    description: >-
      Accepted and echoed verbatim, including zero. The Guide §20.2.1 calls it mutually
      exclusive with FinalPaymentDateTime ("one and only one must be present"); neither half
      holds — all four combinations stage 201, and CountPerPeriod 0 is accepted despite
      §23.2.1's "Must be > 0". NOT OFFERED by this app: its termination semantics when combined
      with FinalPaymentDateTime are unknown and only observable over months.
    offered_in_ui: false
enums:
  - name: ObFrequencyType
    description: >-
      OBIE OBFrequency6Code defines nine values. All nine were tested on the domestic rail;
      HSBC Personal implements exactly five, matching Guide §20.3.1 precisely. All five are
      accepted on BOTH rails.
    values:
      - { value: WEEK, accepted: true, label: "Weekly" }
      - { value: FRTN, accepted: true, label: "Every 2 weeks" }
      - { value: MNTH, accepted: true, label: "Monthly" }
      - { value: QURT, accepted: true, label: "Every 3 months" }
      - { value: YEAR, accepted: true, label: "Yearly" }
      - { value: ADHO, accepted: false, error: "U002 Invalid value", note: "not named in Guide §20.3.1's exclusion list" }
      - { value: INDA, accepted: false, error: "U002 Invalid value", note: "named as unsupported in §20.3.1" }
      - { value: MIAN, accepted: false, error: "U002 Invalid value", note: "named as unsupported in §20.3.1" }
      - { value: DAIL, accepted: false, error: "U002 Invalid value", note: "not named in §20.3.1, but §20.3.3 names it for HSBCnet — the exclusion list is brand-scoped and incomplete for Personal" }
    guide_divergence: >-
      §23.3 adds FOWK in prose but FRTN in its own table, contradicting itself. FRTN is the one
      that works.
used_by:
  - { feature: pay-domestic-standing-order, api_id: domestic-standing-order-consent-create, role: nested }
  - { feature: pay-international-standing-order, api_id: international-standing-order-consent-create, role: nested }
