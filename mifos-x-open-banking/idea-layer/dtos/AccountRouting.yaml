name: AccountRouting
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts"
  api_ref: API-001
  spec: "OBIE Read/Write v4.0 — Account.Account[] identification block"
  # Retargeted 2026-08-06 (OBP eviction). In OBIE this is the SchemeName + Identification pair,
  # and SchemeName is load-bearing: it decides payment eligibility on every PISP rail.
description: "A single routing entry for a bank account. Holds the routing scheme name (e.g. IBAN, SortCodeAccountNumber) and the corresponding address value. Nested inside Account and TransactionAccount."
fields:
  - name: scheme
    type: String
    required: true
    pii: false
    description: "Name of the routing scheme (e.g. IBAN, SortCodeAccountNumber, AccountNumber)"
    primary_key: false
  - name: address
    type: String
    required: true
    pii: false
    description: "The routing address value for the given scheme (e.g. the IBAN string)"
    primary_key: false
used_by:
  - feature: accounts
    api_id: get_accounts
  - feature: account-detail
    api_id: get_account_detail
  - feature: home
    api_id: get_accounts
  - feature: transaction-detail
    api_id: get_transactions
enums: []
