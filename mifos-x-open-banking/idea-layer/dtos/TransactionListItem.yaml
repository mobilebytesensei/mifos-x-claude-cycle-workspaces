name: TransactionListItem
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/transactions"
  api_ref: API-001
  # Version corrected 2026-08-06 — was v3.1; observed calls are all v4.0.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/TransactionListItem.kt"
  wire_type: "core/network/model/ais/transactions/TransactionsResponse.kt (Data.Transaction[])"
description: "A transaction as it appears in a scrolling list — the row projection, carrying category and pending status that the leaner TransactionItem omits. transactionId is optional in OBIE, so rows may need an index-derived key."
fields:
  - name: transactionId
    type: String
    required: true
    pii: false
    description: "OBIE TransactionId. OBIE makes this optional, so source falls back to a txn-{index} key when blank"
    primary_key: true
  - name: accountId
    type: String
    required: true
    pii: false
    description: "Account the transaction belongs to"
    primary_key: false
  - name: description
    type: String
    required: true
    pii: true
    description: "Display line for the transaction, resolved by TransactionTitle from the OBIE fields"
    primary_key: false
  - name: bookingDateTime
    type: DateTime
    required: true
    pii: false
    description: "When the transaction was booked"
    primary_key: false
  - name: amount
    type: String
    required: true
    pii: false
    description: "Transaction value as an unsigned decimal string. Direction lives in isCredit, not in the sign"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency of amount"
    primary_key: false
  - name: isCredit
    type: Boolean
    required: true
    pii: false
    description: "True for money in, false for money out. The sole direction signal — amount is unsigned"
    primary_key: false
  - name: category
    type: TransactionCategory
    required: true
    pii: false
    description: "Spending category derived from the merchant category code. OTHER when nothing matches"
    primary_key: false
  - name: isPending
    type: Boolean
    required: true
    pii: false
    description: "True while the transaction is unbooked, which drives the pending badge"
    primary_key: false
used_by:
  - feature: home
    api_id: recent-transactions
    role: response
enums:
  - name: TransactionCategory
    values: [GROCERIES, DINING, SUBSCRIPTIONS, SHOPPING, TRANSPORT, TRANSFER, OTHER]
