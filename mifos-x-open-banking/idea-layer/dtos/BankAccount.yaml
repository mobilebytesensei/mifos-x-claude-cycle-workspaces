name: BankAccount
version: "1.0.0"
source:
  origin: project
  api_path: "GET /obie/open-banking/v4.0/aisp/accounts"
  api_ref: API-001
  # Version corrected 2026-08-06 (/idea-sync): was v3.1. Every observed call in the capture
  # corpus is v4.0. The generations are not interchangeable — v4.0 re-coded every UK.OBIE.*
  # error string to a short code, and HSBC serves BOTH forms on different endpoints.
  source_binding: "core/model/src/commonMain/kotlin/org/mifosx/openbanking/core/model/banking/BankAccount.kt"
  wire_type: "core/network/model/ais/accounts/AccountsResponse.kt (Data.Account[])"
description: "One account in the PSU's authorised account list. The domain projection AccountsRepository.accountsStream yields per account, mapped down from the OBIE AccountsResponse envelope."
fields:
  - name: accountId
    type: String
    required: true
    pii: false
    description: "OBIE AccountId — the identifier every downstream account-scoped call is keyed by"
    primary_key: true
  - name: nickname
    type: String
    required: true
    pii: true
    description: "PSU-assigned display name for the account"
    primary_key: false
  - name: accountSubType
    type: String
    required: true
    pii: false
    description: "OBIE AccountSubType — CurrentAccount, Savings, CreditCard and so on"
    primary_key: false
  - name: currency
    type: String
    required: true
    pii: false
    description: "ISO 4217 currency code the account is denominated in"
    primary_key: false
  - name: sortCode
    type: String
    required: true
    pii: true
    description: "UK sort code parsed out of the SortCodeAccountNumber identification string"
    primary_key: false
  - name: accountNumber
    type: String
    required: true
    pii: true
    description: "UK account number parsed out of the SortCodeAccountNumber identification string"
    primary_key: false
  - name: rawIdentification
    type: String
    required: false
    pii: true
    description: "Unparsed OBIE Identification value, retained when the sort-code/account-number split does not apply"
    primary_key: false
used_by:
  - feature: accounts
    api_id: accounts-list
    role: response
  - feature: home
    api_id: accounts-list
    role: response
enums: []
