<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        pending: "#E8A317",
                        background: "#12140E",
                        surface: "#1E201A",
                        "surface-variant": "#44483D",
                        "surface-container": "#1E201A",
                        "surface-container-high": "#282A24",
                        "on-surface": "#E3E3DC",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#8E9285",
                        "outline-variant": "#44483D"
                    },
                    borderRadius: {
                        sm: "4px",
                        md: "12px",
                        lg: "16px",
                        xl: "24px",
                        pill: "999px"
                    },
                    fontFamily: {
                        body: ["Outfit", "sans-serif"],
                        headline: ["Outfit", "sans-serif"]
                    },
                    spacing: {
                        margin: "16px",
                        unit: "8px"
                    }
                }
            }
        }
    </script>
<style>
        @keyframes shimmer {
            0% { background-color: #1E201A; }
            50% { background-color: #282A24; }
            100% { background-color: #1E201A; }
        }
        .shimmer-sweep {
            animation: shimmer 1200ms infinite ease-in-out;
        }
        body {
            background-color: #12140E;
            color: #E3E3DC;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen pb-24 overflow-y-auto">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 h-16 bg-[#12140E] flex items-center justify-between px-4">
<div class="w-10 h-10 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">menu</span>
</div>
<!-- Centered Shimmer Rectangle -->
<div class="absolute left-1/2 -translate-x-1/2 top-4 w-[120px] h-[20px] rounded-sm shimmer-sweep"></div>
<div class="w-10 h-10 rounded-full bg-surface-container shimmer-sweep overflow-hidden">
<div class="w-full h-full opacity-0">Avatar</div>
</div>
</header>
<main class="pt-20 px-4">
<!-- Header Section -->
<div class="mt-4 flex items-center justify-between mb-4">
<div class="w-[160px] h-6 rounded-sm shimmer-sweep"></div>
<div class="w-[64px] h-6 rounded-md shimmer-sweep"></div>
</div>
<!-- Skeleton Cards -->
<div class="space-y-3">
<!-- Card 1 -->
<div class="mt-4 bg-[#1E201A] rounded-md p-4 w-full h-[120px] flex flex-col justify-between border border-outline-variant/20">
<div class="flex justify-between items-start">
<div class="w-[200px] h-[18px] rounded-sm shimmer-sweep"></div>
<div class="w-[48px] h-[18px] rounded-sm shimmer-sweep"></div>
</div>
<div class="mt-2">
<div class="w-[160px] h-[14px] rounded-sm shimmer-sweep"></div>
</div>
<div class="flex justify-between items-end mt-auto">
<div class="w-[100px] h-[14px] rounded-sm shimmer-sweep"></div>
<div class="w-[80px] h-[14px] rounded-sm shimmer-sweep"></div>
</div>
</div>
<!-- Card 2 -->
<div class="bg-[#1E201A] rounded-md p-4 w-full h-[120px] flex flex-col justify-between border border-outline-variant/20">
<div class="flex justify-between items-start">
<div class="w-[200px] h-[18px] rounded-sm shimmer-sweep"></div>
<div class="w-[48px] h-[18px] rounded-sm shimmer-sweep"></div>
</div>
<div class="mt-2">
<div class="w-[160px] h-[14px] rounded-sm shimmer-sweep"></div>
</div>
<div class="flex justify-between items-end mt-auto">
<div class="w-[100px] h-[14px] rounded-sm shimmer-sweep"></div>
<div class="w-[80px] h-[14px] rounded-sm shimmer-sweep"></div>
</div>
</div>
<!-- Card 3 -->
<div class="bg-[#1E201A] rounded-md p-4 w-full h-[120px] flex flex-col justify-between border border-outline-variant/20">
<div class="flex justify-between items-start">
<div class="w-[200px] h-[18px] rounded-sm shimmer-sweep"></div>
<div class="w-[48px] h-[18px] rounded-sm shimmer-sweep"></div>
</div>
<div class="mt-2">
<div class="w-[160px] h-[14px] rounded-sm shimmer-sweep"></div>
</div>
<div class="flex justify-between items-end mt-auto">
<div class="w-[100px] h-[14px] rounded-sm shimmer-sweep"></div>
<div class="w-[80px] h-[14px] rounded-sm shimmer-sweep"></div>
</div>
</div>
<!-- Card 4 (Extra for scrolling feel) -->
<div class="bg-[#1E201A] rounded-md p-4 w-full h-[120px] flex flex-col justify-between border border-outline-variant/20 opacity-60">
<div class="flex justify-between items-start">
<div class="w-[200px] h-[18px] rounded-sm shimmer-sweep"></div>
<div class="w-[48px] h-[18px] rounded-sm shimmer-sweep"></div>
</div>
<div class="mt-2">
<div class="w-[160px] h-[14px] rounded-sm shimmer-sweep"></div>
</div>
<div class="flex justify-between items-end mt-auto">
<div class="w-[100px] h-[14px] rounded-sm shimmer-sweep"></div>
<div class="w-[80px] h-[14px] rounded-sm shimmer-sweep"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full z-50 rounded-t-xl bg-surface-container h-20 flex justify-around items-center px-2">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">home</span>
<span class="text-[11px] mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="text-[11px] mt-1">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1">
<span class="material-symbols-outlined">payments</span>
<span class="text-[11px] mt-1 font-bold">Payments</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">notifications</span>
<span class="text-[11px] mt-1">Alerts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined">person</span>
<span class="text-[11px] mt-1">Profile</span>
</div>
</nav>
</body></html>
