<script>
        // Simple micro-interactions for the FAB and cards
        document.querySelectorAll('section').forEach(card => {
            card.addEventListener('mousedown', () => {
                if(!card.classList.contains('opacity-60')) {
                    card.style.transform = 'scale(0.98)';
                }
            });
            card.addEventListener('mouseup', () => {
                card.style.transform = 'scale(1)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Toggle background of the top bar on scroll for depth
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-md', 'bg-surface-container-low');
            } else {
                header.classList.remove('shadow-md', 'bg-surface-container-low');
            }
        });
    </script>
