<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-effect {
            position: relative;
            overflow: hidden;
            background-color: #1E201A;
        }
        .shimmer-effect::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background: linear-gradient(
                90deg,
                transparent 0%,
                #282A24 50%,
                transparent 100%
            );
            animation: shimmer 1200ms infinite;
        }
        .skeleton-block {
            background-color: #282A24;
            border-radius: 4px;
        }
        body {
            background-color: #12140F;
            font-family: 'Hanken Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            color: #e3e3da;
        }
    </style>
<style>
    body {

<script>
        // Subtle ambient micro-interaction: slow pulse for background containers
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.shimmer-effect');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 150}ms`;
            });
        });
    </script>
