<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-sweep {
            position: relative;
            overflow: hidden;
            background-color: #1E201A; /* style_base_color */
        }
        .shimmer-sweep::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                #282A24, /* style_highlight_color */
                transparent
            );
            animation: shimmer 1200ms infinite linear;
        }
        body {
            background-color: #12140F; /* Level 0 Base */
            font-family: 'Outfit', sans-serif;
        }
    </style>

<body class="bg-background text-on-surface antialiased overflow-x-hidden">
<!-- Component 1: App Bar Shimmer (64dp tall) -->
<header class="fixed top-0 left-0 right-0 h-16 bg-surface z-50 flex items-center px-4 border-b border-outline/10">
<div class="flex items-center w-full justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full shimmer-sweep"></div>
<div class="w-[120px] h-5 rounded-lg shimmer-sweep"></div>
</div>
<div class="w-8 h-8 rounded-full shimmer-sweep opacity-50"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-16 pb-24 px-4 max-w-lg mx-auto">
<!-- Component 2: Today Section Header -->
<div class="mt-4 mb-4">
<div class="w-20 h-4 rounded-md shimmer-sweep"></div>
</div>
<!-- Component 3 & 4: Today List Rows -->
<div class="space-y-3">
<!-- Row 1 -->
<div class="h-[72px] bg-surface-container rounded-xl flex items-center p-4 border border-outline/5 relative">
<div class="w-10 h-10 rounded-full shimmer-sweep flex-shrink-0"></div>
<div class="ml-4 space-y-2">
<div class="w-[180px] h-3.5 rounded shimmer-sweep"></div>
<div class="w-[120px] h-3 rounded shimmer-sweep"></div>
</div>
<div class="absolute bottom-4 right-4 w-12 h-3 rounded shimmer-sweep"></div>
</div>
<!-- Row 2 -->
<div class="h-[72px] bg-surface-container rounded-xl flex items-center p-4 border border-outline/5 relative">
<div class="w-10 h-10 rounded-full shimmer-sweep flex-shrink-0"></div>
<div class="ml-4 space-y-2">
<div class="w-[180px] h-3.5 rounded shimmer-sweep"></div>
<div class="w-[120px] h-3 rounded shimmer-sweep"></div>
</div>
<div class="absolute bottom-4 right-4 w-12 h-3 rounded shimmer-sweep"></div>
</div>
</div>
<!-- Component 5: Earlier Section Header -->
<div class="mt-6 mb-4">
<div class="w-[72px] h-4 rounded-md shimmer-sweep"></div>
</div>
<!-- Component 6 & 7: Earlier List Rows -->
<div class="space-y-3">
<!-- Row 1 -->
<div class="h-[72px] bg-surface-container/50 rounded-xl flex items-center p-4 border border-outline/5 relative">
<div class="w-10 h-10 rounded-full shimmer-sweep flex-shrink-0 opacity-40"></div>
<div class="ml-4 space-y-2">
<div class="w-[200px] h-3.5 rounded shimmer-sweep"></div>
<div class="w-[140px] h-3 rounded shimmer-sweep"></div>
</div>
<div class="absolute bottom-4 right-4 w-12 h-3 rounded shimmer-sweep"></div>
</div>
<!-- Row 2 -->
<div class="h-[72px] bg-surface-container/50 rounded-xl flex items-center p-4 border border-outline/5 relative">
<div class="w-10 h-10 rounded-full shimmer-sweep flex-shrink-0 opacity-40"></div>
<div class="ml-4 space-y-2">
<div class="w-[160px] h-3.5 rounded shimmer-sweep"></div>
<div class="w-[100px] h-3 rounded shimmer-sweep"></div>
</div>
<div class="absolute bottom-4 right-4 w-12 h-3 rounded shimmer-sweep"></div>
</div>
<!-- Additional Rows for depth -->
<div class="h-[72px] bg-surface-container/50 rounded-xl flex items-center p-4 border border-outline/5 relative">
<div class="w-10 h-10 rounded-full shimmer-sweep flex-shrink-0 opacity-40"></div>
<div class="ml-4 space-y-2">
<div class="w-[190px] h-3.5 rounded shimmer-sweep"></div>
<div class="w-[110px] h-3 rounded shimmer-sweep"></div>
</div>
<div class="absolute bottom-4 right-4 w-12 h-3 rounded shimmer-sweep"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell (Consistent with Shared Components but as Skeletons) -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container flex justify-around items-center h-20 px-4 pb-2 rounded-t-xl">
<!-- Home -->
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full shimmer-sweep opacity-20"></div>
<div class="w-8 h-2 rounded shimmer-sweep opacity-10"></div>
</div>
<!-- Payments -->
<div class="flex flex-col items-center gap-1">
<div class="w-8 h-8 rounded-full shimmer-sweep opacity-20"></div>
<div class="w-8 h-2 rounded shimmer-sweep opacity-10"></div>
</div>
<!-- Notifications (Active State Representation) -->
<div class="flex flex-col items-center justify-center bg-secondary-container/50 rounded-full px-5 py-2">

</div>
<!-- Wealth -->

<div class="w-8 h-8 rounded-full shimmer-sweep opacity-20"></div>
<div class="w-8 h-2 rounded shimmer-sweep opacity-10"></div>
</div>

<div class="w-8 h-8 rounded-full shimmer-sweep opacity-20"></div>
<div class="w-8 h-2 rounded shimmer-sweep opacity-10"></div>
</div>
