<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notifications Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#8F9285",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        error: "#BA1A1A"
                    },
                    spacing: {
                        'margin-mobile': '16px',
                        'unit': '8px'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        headline: ['Outfit', 'sans-serif'],
                        body: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .app-bar-divider {
            border-bottom: 1px solid #44483D;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<!-- JSON Reference: TopAppBar. Casing and strings preserved exactly. -->
<header class="w-full h-[64px] flex items-center px-4 bg-background app-bar-divider sticky top-0 z-50">
<div class="flex items-center w-full">
<button aria-label="Back" class="mr-4 p-2 rounded-full hover:bg-surface-variant transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-[18px] font-medium text-[#E3E3D8]">Notifications</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-8 text-center">
<!-- Error Illustration -->
<div class="mt-[64px] w-[160px] h-[160px] flex items-center justify-center">
<img alt="Disconnected connection illustration" class="w-full h-auto object-contain" data-alt="A professional minimalist flat vector illustration of a broken chain link symbolizing a disconnected bank connection. The artwork uses a sophisticated palette of charcoal grey and muted olive green on a deep obsidian background. The lighting is low-key and moody, consistent with a high-end dark mode interface. The composition is centered and clean, evoking a sense of calm reliability even during a temporary technical failure." src="https://lh3.googleusercontent.com/aida/ADBb0uh9ORqckXiGYYTqE4YPrzp4iBFy2a0MRbyoF8rESpHe91RROCB1Jzs4H2r00nYIBc_tbn9uBqOL3l_rLZq7NwVDu40ofbOgS9JIbjLYEAUxXmAFX1c9pMRjUHKoBXgD9C-gbcjSXIMG4CHfGYrupW__CMrFBPBTLTCuvGvu5Q2WGDaoqjIPXSB4cDZh9TdQglYLSoZWH9LBxSprkyWT4YVebKgqClmBqq048USHMJU_0f9BNyZgKVSX6BQ"/>
</div>
<!-- Error Title -->
<h2 class="mt-6 text-[22px] font-semibold text-[#E3E3D8] leading-tight max-w-[280px]">
            Couldn't load notifications
        </h2>
<!-- Error Subtext -->
<p class="mt-2 text-[14px] font-normal text-[#8F9285] leading-relaxed max-w-[320px]">
            Check your connection and try again. Your notification history will load when you are back online.
        </p>
<!-- Action Container -->
<div class="w-full mt-auto mb-12 flex flex-col items-center">
<!-- Primary Button: Retry -->
<button class="w-full h-[48px] bg-[#B2D188] rounded-full flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[#1F3701]" data-icon="refresh">refresh</span>
<span class="text-[16px] font-semibold text-[#1F3701]">Retry</span>
</button>
<!-- Secondary Action: Go back -->
<button class="mt-4 text-[14px] font-medium text-[#8F9285] px-4 py-2 hover:text-[#E3E3D8] transition-colors">
                Go back
            </button>
</div>
</main>
<!-- Bottom Navigation Shell -->
<!-- Hidden for error state per "Relevance Check" and "The UX Goal" to prioritize focused recovery canvas -->
<nav class="hidden md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-surface-container">
<!-- Structural Placeholder for hidden component -->
</nav>
<script>
        // Micro-interaction for the retry button
        const retryBtn = document.querySelector('button.bg-\\[\\#B2D188\\]');
        if (retryBtn) {
            retryBtn.addEventListener('click', () => {
                const icon = retryBtn.querySelector('.material-symbols-outlined');
                icon.style.transition = 'transform 0.5s ease-in-out';
                icon.style.transform = 'rotate(360deg)';
                
                // Simulate reload
                setTimeout(() => {
                    icon.style.transform = 'rotate(0deg)';
                }, 500);
            });
        }
    </script>
</body></html>
