<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Connected Apps Error - Mifos X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-dark": "#B2D188",
                        secondary: "#386663",
                        accent: "#CDEDA3",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#75796C",
                        "outline-variant": "#44483D",
                        "text-grey": "#8F9285"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        "pill": "9999px",
                        "md": "12px",
                        "lg": "16px",
                        "xl": "24px"
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-active-state:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start overflow-hidden">
<!-- Component 1: Top App Bar -->
<header class="fixed top-0 w-full h-[64px] flex items-center px-4 z-50 bg-[#12140E] border-b border-[#44483D]/30">
<div class="flex items-center w-full max-w-[390px] mx-auto">
<button aria-label="Back" class="p-2 -ml-2 rounded-full hover:bg-white/10 transition-colors btn-active-state">
<span class="material-symbols-outlined text-[#B2D188] text-[24px]">arrow_back</span>
</button>
<h1 class="ml-4 text-[18px] font-medium text-[#E3E3D8] tracking-tight">Connected Apps</h1>
</div>
</header>
<!-- Main Content Container -->
<main class="flex flex-col items-center w-full max-w-[390px] px-8 pt-[128px] pb-10 flex-grow">
<!-- Component 2: Hero Illustration -->
<div class="relative w-[140px] h-[140px] flex items-center justify-center">
<div class="absolute inset-0 bg-[#44483D]/10 rounded-full blur-2xl"></div>
<img alt="Disconnected connection error illustration" class="w-full h-full object-contain relative z-10 opacity-90" src="https://lh3.googleusercontent.com/aida/ADBb0ujGS9jwMfF3FW2WGFrBzx6ziGlNEdekAtoJZpmg4mPXggGyh8AN31IMRgAE8BCEwHMqIPeyBhBVVMcBJaK2aOj-6wyva8JtuUtOBnRHb-hNoROnGrPR9JFdeiVUXGT-xZho2HGedVMKOdMoUT0gXstiW4BE4h4OSeCg_V3uOgTukiS-6aq_6YKt5MV86NLEByDzjlzfhYwRzR9GZHYV-9tFX1zPEvF5dupkwFkk3tww5S96i0SGVIYVYwWw"/>
</div>
<!-- Component 3: Error Message -->
<div class="mt-6 text-center space-y-2">
<h2 class="text-[20px] font-semibold text-[#E3E3D8] leading-tight">
                Couldn't load connected apps
            </h2>
<p class="text-[14px] font-normal text-[#C5C8BA] leading-relaxed px-2">
                Check your connection and try again. Your consent settings are safe.
            </p>
</div>
<!-- Component 4: Primary Button -->
<div class="mt-8 w-full">
<button class="w-full h-[48px] bg-[#B2D188] hover:bg-[#A3C179] text-[#1F3701] rounded-[24px] flex items-center justify-center gap-2 font-semibold text-[15px] shadow-lg shadow-[#1F3701]/20 btn-active-state transition-all">
<span class="material-symbols-outlined text-[20px]">refresh</span>
<span>Retry</span>
</button>
</div>
<!-- Component 5: Secondary Button -->
<div class="mt-3">
<button class="px-6 py-2 text-[#8F9285] hover:text-[#E3E3D8] font-medium text-[14px] transition-colors btn-active-state">
                Go back
            </button>
</div>
</main>
<!-- Footer Decoration (Optional visual weight) -->
<footer class="w-full max-w-[390px] pb-12 flex justify-center opacity-30">
<div class="h-1 w-24 bg-[#44483D] rounded-full"></div>
</footer>
<script>
        // Micro-interaction for the refresh button
        const retryBtn = document.querySelector('button.bg-\\[\\#B2D188\\]');
        if (retryBtn) {
            retryBtn.addEventListener('click', () => {
                const icon = retryBtn.querySelector('.material-symbols-outlined');
                icon.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                icon.style.transform = 'rotate(360deg)';
                
                // Simulate loading state
                retryBtn.classList.add('opacity-80');
                retryBtn.disabled = true;
                
                setTimeout(() => {
                    icon.style.transform = 'rotate(0deg)';
                    retryBtn.classList.remove('opacity-80');
                    retryBtn.disabled = false;
                }, 1000);
            });
        }
    </script>
</body></html>
