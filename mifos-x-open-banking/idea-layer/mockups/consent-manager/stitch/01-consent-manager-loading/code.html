<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Consent Manager - Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3DC",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#8F9285",
                        "outline-variant": "#44483D",
                        "surface-container": "#1E201A",
                        "surface-container-high": "#282A24",
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                    },
                    borderRadius: {
                        'pill': '9999px',
                        'md': '12px',
                        'lg': '16px'
                    },
                    animation: {
                        'shimmer': 'shimmer 1200ms cubic-bezier(0.4, 0, 0.2, 1) infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(100%)' }
                        }
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #12140E;
            color: #E3E3DC;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }
        .shimmer-base {
            position: relative;
            overflow: hidden;
            background-color: #1E201A;
        }
        .shimmer-base::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            background: linear-gradient(
                90deg,
                rgba(40, 42, 36, 0) 0%,
                rgba(40, 42, 36, 1) 50%,
                rgba(40, 42, 36, 0) 100%
            );
            animation: shimmer 1200ms infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full h-16 bg-[#12140E] flex items-center justify-center z-50 border-b border-outline-variant/30">
<div class="shimmer-base w-[120px] h-[20px] rounded-sm"></div>
</header>
<!-- Scrollable Content -->
<main class="pt-16 pb-24 flex flex-col items-center min-h-screen">
<!-- Component 2: Card Shimmer -->
<div class="mt-6 w-[calc(100%-32px)] bg-surface border border-outline-variant/50 rounded-md p-4 flex flex-col gap-4">
<!-- Header Row -->
<div class="flex items-center gap-4">
<div class="shimmer-base w-10 h-10 rounded-full shrink-0"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-base w-[160px] h-4 rounded-sm"></div>
<div class="shimmer-base w-[100px] h-3 rounded-sm"></div>
</div>
</div>
<!-- Content Area (96dp visual height context) -->
<div class="flex flex-col gap-4">
<div class="shimmer-base w-full h-12 rounded-sm opacity-20"></div>
<!-- Chip Row (3 Pills) -->
<div class="flex gap-2">
<div class="shimmer-base w-[72px] h-7 rounded-pill"></div>
<div class="shimmer-base w-[72px] h-7 rounded-pill"></div>
<div class="shimmer-base w-[72px] h-7 rounded-pill"></div>
</div>
</div>
<!-- Bottom Button -->
<div class="shimmer-base w-full h-11 rounded-pill mt-2"></div>
</div>
<!-- Component 3: Card Shimmer (2 Pills) -->
<div class="mt-3 w-[calc(100%-32px)] bg-surface border border-outline-variant/50 rounded-md p-4 flex flex-col gap-4">
<div class="flex items-center gap-4">
<div class="shimmer-base w-10 h-10 rounded-full shrink-0"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-base w-[160px] h-4 rounded-sm"></div>
<div class="shimmer-base w-[100px] h-3 rounded-sm"></div>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="shimmer-base w-full h-12 rounded-sm opacity-20"></div>
<!-- Chip Row (2 Pills) -->
<div class="flex gap-2">
<div class="shimmer-base w-[72px] h-7 rounded-pill"></div>
<div class="shimmer-base w-[72px] h-7 rounded-pill"></div>
</div>
</div>
<div class="shimmer-base w-full h-11 rounded-pill mt-2"></div>
</div>
<!-- Component 4: Card Shimmer (1 Pill) -->
<div class="mt-3 w-[calc(100%-32px)] bg-surface border border-outline-variant/50 rounded-md p-4 flex flex-col gap-4">
<div class="flex items-center gap-4">
<div class="shimmer-base w-10 h-10 rounded-full shrink-0"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-base w-[160px] h-4 rounded-sm"></div>
<div class="shimmer-base w-[100px] h-3 rounded-sm"></div>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="shimmer-base w-full h-12 rounded-sm opacity-20"></div>
<!-- Chip Row (1 Pill) -->
<div class="flex gap-2">
<div class="shimmer-base w-[72px] h-7 rounded-pill"></div>
</div>
</div>
<div class="shimmer-base w-full h-11 rounded-pill mt-2"></div>
</div>
<!-- Supplementary Placeholder to fill screen -->
<div class="mt-3 w-[calc(100%-32px)] bg-surface/40 border border-outline-variant/20 rounded-md p-4 flex flex-col gap-4 blur-[1px]">
<div class="flex items-center gap-4">
<div class="shimmer-base w-10 h-10 rounded-full shrink-0 opacity-50"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-base w-[120px] h-4 rounded-sm opacity-50"></div>
<div class="shimmer-base w-[80px] h-3 rounded-sm opacity-50"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Mock (Fixed Shell) -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-background border-t border-outline-variant/30 flex justify-around items-center px-4 z-50">
<div class="flex flex-col items-center gap-1 opacity-40">
<span class="material-symbols-outlined text-on-surface-variant">home</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Home</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-40">
<span class="material-symbols-outlined text-on-surface-variant">account_balance</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Accounts</span>
</div>
<div class="flex flex-col items-center gap-1 opacity-40">
<span class="material-symbols-outlined text-on-surface-variant">payments</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Payments</span>
</div>
<div class="flex flex-col items-center gap-1">
<div class="bg-[#4C662B]/20 rounded-pill px-4 py-1 flex flex-col items-center">
<span class="material-symbols-outlined text-primary">person</span>
<span class="text-[10px] font-medium uppercase tracking-wider text-primary">Profile</span>
</div>
</div>
</nav>
<script>
        // Micro-interaction: Subtle fade in on load
        document.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.6s ease-out';
                document.body.style.opacity = '1';
            }, 50);
        });
    </script>
</body></html>
