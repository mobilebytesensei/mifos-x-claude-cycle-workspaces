<style>
        .shimmer {
            position: relative;
            overflow: hidden;
            background: #1f201b; /* surface-container */
        }
        .shimmer::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(31, 32, 27, 0) 0,
                rgba(178, 209, 136, 0.08) 20%,
                rgba(178, 209, 136, 0.15) 60%,
                rgba(31, 32, 27, 0)
            );
            animation: shimmer-swipe 1.8s infinite;

        @keyframes shimmer-swipe {

            }

<script>
        // Micro-interaction: Subtle interaction on Tap Bar items even in skeleton state
        document.querySelectorAll('nav div').forEach(item => {
            item.addEventListener('click', () => {
                item.classList.add('scale-95');
                setTimeout(() => item.classList.remove('scale-95'), 150);
            });
        });

        // Simulate layout load fade-in for atmospheric effect
        document.body.style.opacity = '0';
        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.transition = 'opacity 0.6s ease-in-out';
            document.body.style.opacity = '1';
        });
    </script>
