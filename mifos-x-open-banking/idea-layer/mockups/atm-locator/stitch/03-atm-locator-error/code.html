<style>
        body {
            background-color: #12140F;
            color: #E3E3DA;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .primary-btn-interaction:active {
            opacity: 0.8;
            transform: scale(0.95);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

<body class="flex flex-col min-h-screen">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 w-full bg-background flex items-center justify-between px-md py-sm max-w-container-max mx-auto h-[64px]">
<div class="flex items-center justify-center w-12 h-12 cursor-pointer hover:bg-surface-container-high rounded-full transition-colors active:scale-90" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary-fixed-dim" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="text-on-surface font-title-md text-title-md tracking-normal">ATM &amp; Branches</h1>
<div class="w-12 h-12"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center px-lg max-w-[400px] mx-auto">
<!-- Hero Illustration -->
<div class="mt-xxl mb-lg">
<img alt="Illustration of a signal tower with connectivity issues" class="w-[160px] h-[160px] object-contain opacity-90" src="https://lh3.googleusercontent.com/aida/ADBb0ugm3FkCE0ZrH_9UZtV081whAioEl11nFelFyXKa-RqR-CvhXYYZeRnrUY8Q6pgLwIN2ucbQU3slJcKK77ryXnF4UvMtIQ1tYWBw6A5m7S5S4reg-VauMKsCZikXjYNQHj7vsY6HwWzYnQQz0KWo_YN1QmeqHSXphrlw0sAwPTu4A8IREUY4xPzdrJEri_9Y8-XWM-FFdqLHX-Y5CAoHA6l4AO6U-o-tBdHwjs4I2q2nB0hrOWaJ8JtSS13p"/>
</div>
<!-- Hero Content -->
<div class="text-center space-y-sm mb-xxl">
<h2 class="font-title-lg text-title-lg text-on-surface px-md">
                Could not load ATM locations
            </h2>
<p class="font-body-sm text-body-sm text-outline max-w-[280px] mx-auto leading-relaxed">
                Check your connection and try again. ATM data will load as soon as connectivity is restored.
            </p>
</div>
<!-- Action Area -->
<div class="w-full flex flex-col items-center gap-md">
<!-- Primary Retry Button -->
<button class="w-full h-[56px] bg-primary-container text-on-primary font-title-md text-title-md rounded-full flex items-center justify-center gap-sm primary-btn-interaction">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
                Retry
            </button>
<!-- Secondary Back Button -->
<button class="font-title-md text-title-md text-outline hover:text-on-surface transition-colors py-sm active:opacity-60">
                Go back
            </button>
</div>
</main>
<!-- Navigation Shell Placeholder (Not rendered as per task intent for error state) -->
<!-- Suppression logic applied: This is a task-focused error screen, suppressed BottomNavBar to focus on the retry action. -->
<script>
        // Micro-interaction for the retry button
        const retryBtn = document.querySelector('.primary-btn-interaction');
        if(retryBtn) {
            retryBtn.addEventListener('click', () => {
                // Visual feedback only for demo
                retryBtn.classList.add('animate-pulse');
                setTimeout(() => {
                    retryBtn.classList.remove('animate-pulse');
                }, 1000);
            });
        }
    </script>
</body></html>
