<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ATM Locator - Location Denied</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        primary_container: "#CDEDA3",
                        on_primary: "#FFFFFF",
                        on_primary_container: "#102000",
                        secondary: "#386663",
                        secondary_container: "#BCEBE7",
                        error: "#BA1A1A",
                        pending: "#E8A317",
                        background: "#12140E",
                        surface: "#1A1C16",
                        surface_variant: "#44483D",
                        surface_container: "#282A24",
                        outline: "#75796C",
                        outline_variant: "#C5C8BA",
                        "nav-active-indicator": "#DCE7C8",
                        "on-surface-variant": "#C5C8BA",
                        "on-primary-container": "#102000"
                    },
                    fontFamily: {
                        display: ["Outfit", "sans-serif"],
                        headline: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        sm: "4px",
                        md: "12px",
                        lg: "16px",
                        xl: "24px",
                        pill: "9999px"
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#12140E] flex items-center justify-between px-4 h-14 w-full">
<button aria-label="Go back" class="active:opacity-80 transition-opacity p-2">
<span class="material-symbols-outlined text-[#B2D188]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display text-[18px] font-medium text-[#E3E3D8] absolute left-1/2 -translate-x-1/2">
            ATM &amp; Branches
        </h1>
<div class="w-10 h-10 rounded-full flex items-center justify-center">
<!-- Avatar Placeholder or Trailing space -->
<img alt="User Profile" class="w-8 h-8 rounded-full border border-outline-variant/20" data-alt="A professional studio portrait of a modern user with a warm and friendly expression. The lighting is soft and cinematic, highlighting clear facial features against a dark, minimalist background. The overall aesthetic is clean, high-end, and fits a premium financial application's profile section." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5pagezMwMLFD4fT6vw0eMjKnduTbog2q2cISSwpGR0Pr5aVn7WFoImeprc_ClOcP79VqQtSfSaSoFcI5KCYo2VMMlS9GPpZaxxOjnDptw3yQFluljUgJRxqm7rjWLmLIcjedyKvI1VRYEZfVinwNhXtwV3Fc2gUp7BhR2pjDz9IloLvV8c7-8wqhnYv8OqoKIJ_j7Mi7mY87Bw4bU_V4vh3Wx4mN8zRNdPE778JhwuGyeUqwd8hqelikKWumTVtqAp-fD0FYmf1po"/>
</div>
</header>
<main class="flex-1 mt-14 px-4 pb-24 overflow-y-auto">
<!-- Disabled TextField -->
<div class="mt-4">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#8F9285]" data-icon="my_location">my_location</span>
</div>
<input class="block w-full pl-10 pr-3 py-4 bg-transparent border border-[#44483D] rounded-md text-[#8F9285] font-regular text-[14px] cursor-not-allowed" disabled="" placeholder="Find location" style="border-radius: 12px;" type="text"/>
<label class="absolute -top-2 left-3 bg-[#12140E] px-1 text-[11px] text-[#8F9285] font-medium">Find location</label>
</div>
</div>
<!-- Error Information Card -->
<div class="mt-4 bg-[#282A24] border-l-4 border-[#FFB4AB] p-4 flex gap-4" style="border-radius: 12px;">
<div class="shrink-0">
<span class="material-symbols-outlined text-[#FFB4AB] text-[24px]" data-icon="lock_location">lock</span>
</div>
<div class="flex flex-col">
<h3 class="text-[#E3E3D8] font-semibold text-[15px]">Location access denied</h3>
<p class="text-[#C5C8BA] font-regular text-[13px] mt-1">Mifos X needs location permission to find ATMs near you.</p>
</div>
</div>
<!-- Filled Button -->
<button class="mt-4 w-full bg-[#354E16] h-[48px] rounded-md flex items-center justify-center gap-2 active:scale-95 transition-transform duration-200" style="border-radius: 12px;">
<span class="material-symbols-outlined text-[#CDEDA3] text-[20px]" data-icon="settings">settings</span>
<span class="text-[#CDEDA3] font-semibold text-[15px]">Open Preferences</span>
</button>
<!-- Divider Decor -->
<div class="mt-8 flex items-center gap-4">
<div class="h-px flex-1 bg-outline-variant/10"></div>
<span class="text-[#8F9285] font-semibold text-[13px] tracking-wider">SEARCH BY ADDRESS</span>
<div class="h-px flex-1 bg-outline-variant/10"></div>
</div>
<!-- Active Outlined TextField -->
<div class="mt-4">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#B2D188]" data-icon="search">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-4 bg-transparent border border-[#B2D188] rounded-md text-[#E3E3D8] font-regular text-[14px] focus:ring-1 focus:ring-[#B2D188] outline-none" placeholder="Enter city, postcode or address" style="border-radius: 12px;" type="text"/>
<label class="absolute -top-2 left-3 bg-[#12140E] px-1 text-[11px] text-[#B2D188] font-medium">Enter city, postcode or address</label>
</div>
</div>
<!-- Outlined Button -->
<button class="mt-3 w-full h-[48px] border border-[#B2D188] flex items-center justify-center active:bg-[#B2D188]/10 transition-colors" style="border-radius: 12px;">
<span class="text-[#B2D188] font-semibold text-[15px]">Find ATMs</span>
</button>
<!-- Visual Map Placeholder (Decorative only for context) -->
<div class="mt-8 relative rounded-md overflow-hidden h-48 bg-surface_container/30 border border-outline-variant/10" style="border-radius: 12px;">
<img alt="Map" class="w-full h-full object-cover grayscale opacity-20" data-alt="A wide-angle, aerial perspective of a complex urban street grid at night. The image is rendered in a desaturated, high-contrast style with muted greens and deep shadows to match a dark-mode UI. Faint glowing lines trace the paths of major roads, creating a sophisticated and tech-focused cartographic aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWdfPmWRhSGX_GaoGANlI8FoxhsqShEBUGdCwDf3uM0umQlqChTv5GvKlYzsrr-G35q2f9ae0VjKpyqkgA_Hz-T6VOZbgj0SAcP7EL5qsiZzjckdMj7VzF0dnamPqOghKRKoENthFDYIjumtxq60xnPOZgDgJSI_hky9LOLVz6puBT0YMvJe_Ue08VYSC9Yql0MP95rNjxKapTlCRDdAX8Sb4g-1a_TC0EVAQfsBlYlJlRzmmyAY9uhWCeJbbtLx4OhCRReo5RWjlA"/>
<div class="absolute inset-0 flex items-center justify-center flex-col p-6 text-center">
<span class="material-symbols-outlined text-outline/30 text-[48px] mb-2" data-icon="map">map</span>
<p class="text-outline/40 text-[12px]">Interactive map restricted until location or address is provided.</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center px-2 border-t border-outline-variant/10 bg-[#12140E] z-50">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high rounded-pill transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="text-[12px] font-medium">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high rounded-pill transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-[12px] font-medium">Accounts</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high rounded-pill transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="text-[12px] font-medium">Payments</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high rounded-pill transition-colors">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="text-[12px] font-medium">Profile</span>
</button>
</nav>
<script>
        // Micro-interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 150);
            });
        });
    </script>
</body></html>
