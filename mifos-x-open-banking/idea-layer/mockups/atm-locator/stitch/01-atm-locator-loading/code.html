<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#4C662B",
            "primary-container": "#CDEDA3",
            "on-primary": "#FFFFFF",
            "on-primary-container": "#102000",
            secondary: "#386663",
            "secondary-container": "#BCEBE7",
            error: "#BA1A1A",
            background: "#12140E", // Requested background
            surface: "#FFFFFF",
            "surface-container": "#F0F1E6",
            "surface-container-high": "#EAECE1",
            "surface-container-highest": "#E1E4D5",
            "on-surface": "#1A1C16",
            "on-surface-variant": "#44483D",
            outline: "#75796C",
            "outline-variant": "#C5C8BA",
            "shimmer-base": "#1E201A", // Requested base
            "shimmer-highlight": "#282A24" // Requested highlight
          },
          fontFamily: {
            sans: ["Outfit", "sans-serif"],
            headline: ["Outfit", "sans-serif"],
            display: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            label: ["Outfit", "sans-serif"]
          },
          spacing: {
            'md': '16px',
            'sm': '8px',
            'lg': '24px'
          },
          animation: {
            'shimmer': 'shimmer 1200ms infinite linear'
          },
          keyframes: {
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' }
            }
          }
        }
      }
    }
  </script>
<style>
    .shimmer-box {
      background-color: #1E201A;
      position: relative;
      overflow: hidden;
    }
    .shimmer-box::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        #282A24,
        transparent
      );
      animation: shimmer 1200ms infinite linear;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#12140E] font-sans antialiased min-h-screen text-on-surface flex justify-center">
<!-- Mobile Container Baseline -->
<main class="w-full max-w-[390px] min-h-screen relative flex flex-col pb-24">
<!-- TopAppBar Shell (From Shared Components JSON) -->
<!-- Content: ATM Locator. Style: style_shell_layout, style_bg_color, style_typography -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-md h-16 bg-[#12140E]">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-white" data-icon="arrow_back">arrow_back</span>
<div class="shimmer-box w-[120px] h-[24px] rounded-sm"></div>
</div>
<span class="material-symbols-outlined text-white" data-icon="more_vert">more_vert</span>
</header>
<!-- Content Canvas -->
<div class="pt-16 px-md w-full flex flex-col">
<!-- Text Field Shimmer: 56dp tall, 12dp rounded, top margin 16dp -->
<div class="shimmer-box w-full h-[56px] rounded-[12px] mt-4"></div>
<!-- Card Shimmer: 56dp tall, 12dp rounded, top margin 12dp -->
<div class="shimmer-box w-full h-[56px] rounded-[12px] mt-3"></div>
<!-- Chip Row Shimmer: Horizontal row of 4 chips (80x32dp, 16dp radius), 8dp gap, top margin 16dp -->
<div class="flex gap-2 mt-4 overflow-hidden">
<div class="shimmer-box w-[80px] h-[32px] rounded-[16px] flex-shrink-0"></div>
<div class="shimmer-box w-[80px] h-[32px] rounded-[16px] flex-shrink-0"></div>
<div class="shimmer-box w-[80px] h-[32px] rounded-[16px] flex-shrink-0"></div>
<div class="shimmer-box w-[80px] h-[32px] rounded-[16px] flex-shrink-0"></div>
</div>
<!-- Section Header Shimmer: Rectangle (160x16dp), top margin 16dp -->
<div class="shimmer-box w-[160px] h-[16px] rounded-sm mt-4"></div>
<!-- Card Shimmer 1: 112dp tall, 12dp radius, top margin 8dp -->
<div class="w-full h-[112px] border border-[#282A24] rounded-[12px] mt-2 p-4 flex flex-col justify-between">
<div class="flex gap-4">
<div class="shimmer-box w-[20px] h-[20px] rounded-sm flex-shrink-0"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-box w-[180px] h-[14px] rounded-sm"></div>
<div class="shimmer-box w-[120px] h-[14px] rounded-sm"></div>
</div>
</div>
<div class="shimmer-box w-[80px] h-[16px] rounded-sm"></div>
</div>
<!-- Card Shimmer 2: 96dp tall, 12dp radius, top margin 8dp -->
<div class="w-full h-[96px] border border-[#282A24] rounded-[12px] mt-2 p-4 flex flex-col justify-between">
<div class="flex gap-4">
<div class="shimmer-box w-[20px] h-[20px] rounded-sm flex-shrink-0"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-box w-[180px] h-[14px] rounded-sm"></div>
<div class="shimmer-box w-[120px] h-[14px] rounded-sm"></div>
</div>
</div>
<div class="shimmer-box w-[80px] h-[16px] rounded-sm"></div>
</div>
<!-- Card Shimmer 3: 128dp tall, 12dp radius, top margin 8dp, bottom margin 24dp -->
<div class="w-full h-[128px] border border-[#282A24] rounded-[12px] mt-2 mb-6 p-4 flex flex-col justify-between">
<div class="flex gap-4">
<div class="shimmer-box w-[20px] h-[20px] rounded-sm flex-shrink-0"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-box w-[180px] h-[14px] rounded-sm"></div>
<div class="shimmer-box w-[140px] h-[14px] rounded-sm"></div>
<div class="shimmer-box w-[120px] h-[14px] rounded-sm"></div>
</div>
</div>
<div class="shimmer-box w-[80px] h-[16px] rounded-sm"></div>
</div>
</div>
<!-- BottomNavBar Shell (From Shared Components JSON) -->
<!-- Content: Home, Locator, Payments, Profile. Status: Locator Active. -->
<nav class="fixed bottom-0 w-[390px] z-50 flex justify-around items-center h-20 px-sm pb-safe bg-[#1E201A] rounded-t-xl shadow-lg">
<div class="flex flex-col items-center justify-center text-[#44483D] active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</div>
<!-- style_active_navigation applied to Locator -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="font-label-md text-label-md">Locator</span>
</div>
<div class="flex flex-col items-center justify-center text-[#44483D] active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-md text-label-md mt-1">Payments</span>
</div>
<div class="flex flex-col items-center justify-center text-[#44483D] active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</div>
</nav>
</main>
<script>
    // Lightweight atmospheric effect: subtle gradient following mouse/touch (if on desktop)
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;
      const bg = document.body;
      bg.style.background = `radial-gradient(circle at ${x}px ${y}px, #161812 0%, #12140E 60%)`;
    });
  </script>
</body></html>
