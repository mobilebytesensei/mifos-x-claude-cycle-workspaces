<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1E201A",
                        "surface-variant": "#44483D",
                        "on-surface": "#E3E3D8",
                        "on-surface-variant": "#8F9285",
                        outline: "#44483D",
                        "outline-variant": "#C5C8BA",
                        "brand-green": "#B2D188",
                        "dark-accent": "#1F3701"
                    },
                    fontFamily: {
                        display: ["Outfit", "sans-serif"],
                        headline: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    spacing: {
                        md: "16px",
                        lg: "24px",
                        xl: "32px"
                    }
                }
            }
        };
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D8;
            margin: 0;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pill-button {
            border-radius: 9999px;
        }
        .custom-outline {
            border: 1px solid #44483D;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-md h-16 bg-[#12140E] transition-all" id="app-bar">
<div class="flex items-center space-x-4">
<button aria-label="Go back" class="p-2 active:scale-95 duration-100 hover:bg-surface-variant/20 rounded-full">
<span class="material-symbols-outlined text-[#B2D188]">arrow_back</span>
</button>
<h1 class="text-[18px] font-medium text-[#E3E3D8] absolute left-1/2 -translate-x-1/2">ATM &amp; Branches</h1>
</div>
<div class="flex items-center">
<button class="p-2 active:scale-95 duration-100 hover:bg-surface-variant/20 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant">more_vert</span>
</button>
</div>
</header>
<main class="flex-grow pt-24 pb-24 px-md flex flex-col items-center">
<!-- Search Field -->
<div class="w-full max-w-[358px] mb-12">
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-[#C5C8BA]">search</span>
<input class="w-full h-[56px] pl-12 pr-4 bg-transparent custom-outline rounded-[12px] text-on-surface placeholder:text-[#8F9285] focus:ring-1 focus:ring-brand-green focus:border-brand-green transition-all outline-none text-[14px] font-normal" placeholder="Search location" type="text"/>
</div>
</div>
<!-- Empty State Container -->
<div class="flex flex-col items-center justify-center flex-grow">
<div class="w-[280px] bg-[#1E201A] rounded-[16px] p-8 flex flex-col items-center text-center space-y-6">
<!-- Illustration -->
<div class="w-20 h-20 rounded-full flex items-center justify-center overflow-hidden">
<img alt="Map pin illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ujvx3dJIaJZhi2WjBsaYEorbQ5XSQK2-2ZDR75Bkbstq97D4cDxV72E1eZb5_slIypDo5xMETeZ69K3UHeGm7-7q4wXR3wV7lFdOqBxTMebq9-Ye8e75TAN67VHJniaLqzQ42O6OVPgGU24FXCt7vQ-1r9tcroHC_YeAu3Mx_qSy4MPnqT4ortx7q2uBo6J0YaHq_L0biCpHs8qe4MsS4rkbbjCInoPsNZlGwecKCvoZtXswGHrqJUNjiFh"/>
</div>
<!-- Content -->
<div class="space-y-3">
<h2 class="text-[22px] font-semibold text-[#E3E3D8] leading-tight">
                        No ATMs or Branches Found
                    </h2>
<p class="text-[14px] font-normal text-[#8F9285] leading-relaxed">
                        Try searching a different address or enable location access to find nearby ATMs.
                    </p>
</div>
<!-- Actions -->
<div class="w-full pt-2 flex flex-col space-y-4">
<button class="w-full h-[48px] bg-[#B2D188] flex items-center justify-center space-x-2 pill-button active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-[#1F3701]">location_on</span>
<span class="text-[16px] font-semibold text-[#1F3701]">Enable Location</span>
</button>
<button class="w-full py-2 text-[14px] font-medium text-[#8F9285] hover:text-[#E3E3D8] transition-colors active:scale-95">
                        Search Manually
                    </button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden for transactional/empty state focus, but mapped for structure) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-sm pb-safe bg-[#1E201A] shadow-lg rounded-t-xl md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[12px] font-medium mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">location_on</span>
<span class="text-[12px] font-medium mt-1">Locator</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="text-[12px] font-medium mt-1">Payments</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 transition-all px-4 py-1" href="#">
<span class="material-symbols-outlined">account_circle</span>
<span class="text-[12px] font-medium mt-1">Profile</span>
</a>
</nav>
<script>
        // Subtle interaction for the search field and app bar on scroll
        window.addEventListener('scroll', () => {
            const appBar = document.getElementById('app-bar');
            if (window.scrollY > 20) {
                appBar.classList.add('shadow-md', 'bg-opacity-90', 'backdrop-blur-md');
            } else {
                appBar.classList.remove('shadow-md', 'bg-opacity-90', 'backdrop-blur-md');
            }
        });
    </script>
</body></html>
