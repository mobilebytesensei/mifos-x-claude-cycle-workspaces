<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#B2D188",
                        "on-primary": "#1F3701",
                        "primary-container": "#354E16",
                        "on-primary-container": "#CDEDA3",
                        secondary: "#A0CFCB",
                        "on-secondary": "#003735",
                        "secondary-container": "#1F4E4B",
                        "on-secondary-container": "#BCEBE7",
                        error: "#FFB4AB",
                        "on-error": "#690005",
                        "error-container": "#93000A",
                        background: "#12140E",
                        "on-background": "#E3E3D8",
                        surface: "#12140E",
                        "on-surface": "#E3E3D8",
                        "surface-variant": "#44483D",
                        "on-surface-variant": "#C5C8BA",
                        "surface-container": "#1E201A",
                        "surface-container-high": "#282A24",
                        outline: "#8F9285",
                        "outline-variant": "#44483D",
                        "nav-active-indicator": "#354E16"
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "sm": "8px",
                        "md": "12px",
                        "lg": "16px",
                        "xl": "24px",
                        "full": "9999px",
                        "pill": "9999px"
                    },
                    fontFamily: {
                        headline: ["Outfit", "Public Sans", "sans-serif"],
                        display: ["Outfit", "Public Sans", "sans-serif"],
                        body: ["Outfit", "Public Sans", "sans-serif"],
                        label: ["Outfit", "Public Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .app-bar-blur {
            backdrop-filter: blur(12px);
            background-color: rgba(18, 20, 14, 0.85);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 w-full max-w-md h-16 flex items-center justify-between px-4 border-b border-outline-variant bg-surface">
<button class="w-12 h-12 flex items-center justify-left active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary text-[24px]">arrow_back</span>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 font-headline text-[18sp] font-medium text-on-surface">About</h1>
<div class="w-12"></div>
</header>
<main class="w-full max-w-md px-4 flex flex-col overflow-y-auto">
<!-- Card 1: Brand & Logo -->
<section class="mt-6 p-6 rounded-md bg-surface-container border border-outline-variant flex flex-col items-center">
<div class="w-[72px] h-[72px] rounded-full overflow-hidden mb-4 border-2 border-primary-container">
<img alt="Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/ADBb0ui4SOuY26YpmIF0TxEqNGhIQbBzP1wBIIr4W1NHOF5J5uncxliMMr95ohvRu2MXunRjTEPyf0LyDpTzmKronb7WN574vBPfxaG6nxlbdiq1ElCOURvxZP51sCBJTEHt5ecZP5iKnKchzQm5efUTV6pHp9-m9JnbeCLbeo0UB7lgFGX-RTz4Et7VisXUUjNlBw3x4iP6WxTTInWSJrityA46yXM2yO2gLo4lkC8gHeEREqCfyHorWXno2N6H"/>
</div>
<h2 class="font-headline text-[20sp] font-semibold text-on-surface text-center mb-1">Mifos X Open Banking</h2>
<p class="font-body text-[13sp] text-on-surface-variant text-center">Open Banking for Everyone</p>
</section>
<!-- Card 2: Version Info -->
<section class="mt-4 rounded-md bg-surface-container border border-outline-variant overflow-hidden">
<div class="h-14 flex items-center justify-between px-4 border-b border-outline-variant">
<span class="text-on-surface-variant text-[14sp]">Version</span>
<span class="text-on-surface font-medium text-[14sp]">1.0.0</span>
</div>
<div class="h-14 flex items-center justify-between px-4">
<span class="text-on-surface-variant text-[14sp]">Build</span>
<span class="text-on-surface font-medium text-[14sp]">2026.05.001</span>
</div>
</section>
<!-- Card 3: Legal -->
<section class="mt-4 rounded-md bg-surface-container border border-outline-variant overflow-hidden">
<div class="h-10 flex items-center px-4">
<h3 class="text-primary font-medium text-[14sp] uppercase tracking-wider">Legal</h3>
</div>
<!-- Terms of Service -->
<button class="w-full h-14 flex items-center justify-between px-4 border-t border-outline-variant active:bg-surface-variant/20 transition-colors">
<span class="text-on-surface text-[14sp]">Terms of Service</span>
<span class="material-symbols-outlined text-outline text-[18px]">open_in_new</span>
</button>
<!-- Privacy Policy -->
<button class="w-full h-14 flex items-center justify-between px-4 border-t border-outline-variant active:bg-surface-variant/20 transition-colors">
<span class="text-on-surface text-[14sp]">Privacy Policy</span>
<span class="material-symbols-outlined text-outline text-[18px]">open_in_new</span>
</button>
<!-- Open Source Licenses -->
<button class="w-full h-14 flex items-center justify-between px-4 border-t border-outline-variant active:bg-surface-variant/20 transition-colors">
<span class="text-on-surface text-[14sp]">Open Source Licenses</span>
<span class="material-symbols-outlined text-outline text-[18px]">chevron_right</span>
</button>
</section>
<!-- Rate Button -->
<div class="mt-6 mb-8 px-4">
<button class="w-full h-12 flex items-center justify-center border border-primary rounded-pill active:bg-primary/10 transition-all">
<span class="text-primary font-medium text-[14sp]">Rate This App</span>
</button>
</div>
</main>
<!-- BottomNavBar (Predicted Component) -->
<nav class="fixed bottom-0 w-full max-w-md h-20 flex justify-around items-center px-2 pb-safe bg-surface border-t border-outline-variant z-50">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high rounded-pill transition-all active:scale-95">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label text-label-medium">Home</span>
</button>
<!-- Accounts -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high rounded-pill transition-all active:scale-95">
<span class="material-symbols-outlined mb-1">account_balance_wallet</span>
<span class="font-label text-label-medium">Accounts</span>
</button>
<!-- Payments -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high rounded-pill transition-all active:scale-95">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-label text-label-medium">Payments</span>
</button>
<!-- Profile (Active for context of About/Settings) -->
<button class="flex flex-col items-center justify-center bg-nav-active-indicator text-on-primary-container rounded-pill px-5 py-1 transition-all active:scale-95">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label text-label-medium">Profile</span>
</button>
</nav>
<!-- Space for Bottom Nav -->
<div class="h-20 w-full"></div>
</body></html>
