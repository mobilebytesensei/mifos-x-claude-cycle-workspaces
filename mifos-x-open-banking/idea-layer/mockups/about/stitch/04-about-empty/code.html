<script>
        // Micro-interaction: Subtle pulse for the empty state icon
        const iconContainer = document.querySelector('.w-\\[96px\\]');
        if (iconContainer) {
            let scale = 1;
            let direction = 1;
            setInterval(() => {
                scale += 0.005 * direction;
                if (scale > 1.05 || scale < 0.95) direction *= -1;
                iconContainer.style.transform = `scale(${scale})`;
            }, 50);
        }

        // Ripple effect for button
        document.querySelector('button.bg-\\[\\#354E16\\]').addEventListener('mousedown', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const ripple = document.createElement('span');
            ripple.style.position = 'absolute';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.style.width = '0';
            ripple.style.height = '0';
            ripple.style.background = 'rgba(255, 255, 255, 0.2)';
            ripple.style.borderRadius = '50%';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.transition = 'width 0.4s ease, height 0.4s ease, opacity 0.4s ease';
            
            this.appendChild(ripple);
            this.style.overflow = 'hidden';
            this.style.position = 'relative';

            requestAnimationFrame(() => {
                ripple.style.width = '300px';
                ripple.style.height = '300px';
                ripple.style.opacity = '0';
            });

            setTimeout(() => ripple.remove(), 500);
        });
    </script>
