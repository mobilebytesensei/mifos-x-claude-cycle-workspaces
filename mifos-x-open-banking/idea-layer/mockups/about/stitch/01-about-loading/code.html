<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-base {
            background-color: #1E201A;
            position: relative;
            overflow: hidden;
        }
        .shimmer-base::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                #282A24 50%,
                transparent
            );
            animation: shimmer 1200ms linear infinite;
        }
        .shimmer-divider {
            height: 1px;
            background-color: #282A24;
        }
        body {
            background-color: #12140E;
            color: #E3E3D9;
        }
    </style>
