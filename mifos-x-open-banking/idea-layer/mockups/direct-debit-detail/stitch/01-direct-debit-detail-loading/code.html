<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos X - Direct Debit Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "primary-container": "#CDEDA3",
                        "on-primary": "#FFFFFF",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        background: "#12140E",
                        surface: "#1E201A",
                        "surface-variant": "#44483D",
                        "on-surface-variant": "#C5C8BA",
                        outline: "#75796C",
                        "outline-variant": "#44483D",
                        "nav-active-indicator": "#DCE7C8",
                        shimmer: {
                            base: "#1E201A",
                            highlight: "#282A24"
                        }
                    },
                    borderRadius: {
                        sm: "4px",
                        md: "12px",
                        lg: "16px",
                        xl: "24px",
                        pill: "9999px"
                    },
                    fontFamily: {
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    animation: {
                        'shimmer-pulse': 'shimmer 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%, 100%': { backgroundColor: '#1E201A' },
                            '50%': { backgroundColor: '#282A24' },
                        }
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #12140E;
            font-family: 'Outfit', sans-serif;
            color: #E1E4D5;
            -webkit-font-smoothing: antialiased;
        }
        .skeleton {
            animation: shimmer 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes shimmer {
            0%, 100% { background-color: #1E201A; }
            50% { background-color: #282A24; }
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Top App Bar (Shared Component Strategy) -->
<header class="w-full top-0 sticky bg-background flex items-center justify-between px-4 h-14 w-full z-50">
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer">arrow_back</span>
</div>
<!-- Centered Title Shimmer -->
<div class="skeleton h-[20px] w-[100px] rounded-sm"></div>
<div class="flex items-center opacity-0">
<span class="material-symbols-outlined">more_vert</span>
</div>
</header>
<main class="flex-grow flex flex-col gap-6 pb-24">
<!-- Hero Section -->
<section class="flex flex-col items-center pt-4">
<!-- Circular Shimmer (64dp) -->
<div class="skeleton w-[64px] h-[64px] rounded-full mb-4"></div>
<div class="flex flex-col items-center space-y-2">
<!-- Stacked column shimmers -->
<div class="skeleton w-[160px] h-[20px] rounded-sm mt-2"></div>
<div class="skeleton w-[80px] h-[14px] rounded-sm mt-2"></div>
<div class="skeleton w-[60px] h-[24px] rounded-lg mt-2"></div>
</div>
</section>
<!-- Amount Section -->
<section class="flex flex-col items-center">
<div class="skeleton w-[120px] h-[32px] rounded-md"></div>
<div class="skeleton w-[60px] h-[14px] rounded-sm mt-2"></div>
</section>
<!-- Information Card -->
<section class="px-4">
<div class="bg-surface rounded-md p-4 flex flex-col">
<div class="skeleton w-[120px] h-[15px] rounded-sm mb-4"></div>
<!-- Rows with Dividers -->
<div class="space-y-0">
<!-- Row 1 -->
<div class="h-[52px] flex items-center justify-between border-b border-outline-variant">
<div class="skeleton w-[80px] h-[12px] rounded-sm"></div>
<div class="skeleton w-[120px] h-[14px] rounded-sm"></div>
</div>
<!-- Row 2 -->
<div class="h-[52px] flex items-center justify-between border-b border-outline-variant">
<div class="skeleton w-[80px] h-[12px] rounded-sm"></div>
<div class="skeleton w-[120px] h-[14px] rounded-sm"></div>
</div>
<!-- Row 3 -->
<div class="h-[52px] flex items-center justify-between border-b border-outline-variant">
<div class="skeleton w-[80px] h-[12px] rounded-sm"></div>
<div class="skeleton w-[120px] h-[14px] rounded-sm"></div>
</div>
<!-- Row 4 -->
<div class="h-[52px] flex items-center justify-between">
<div class="skeleton w-[80px] h-[12px] rounded-sm"></div>
<div class="skeleton w-[120px] h-[14px] rounded-sm"></div>
</div>
</div>
</div>
</section>
<!-- History Card -->
<section class="px-4">
<div class="bg-surface rounded-md p-4 flex flex-col">
<div class="flex justify-between items-center mb-4">
<div class="skeleton w-[120px] h-[15px] rounded-sm"></div>
<div class="skeleton w-[50px] h-[15px] rounded-sm"></div>
</div>
<!-- History Rows -->
<div class="space-y-0">
<!-- History Row 1 -->
<div class="h-[56px] flex items-center justify-between border-b border-outline-variant">
<div class="flex gap-4">
<div class="skeleton w-[70px] h-[12px] rounded-sm"></div>
<div class="skeleton w-[60px] h-[12px] rounded-sm"></div>
</div>
<div class="skeleton w-[50px] h-[14px] rounded-sm"></div>
</div>
<!-- History Row 2 -->
<div class="h-[56px] flex items-center justify-between border-b border-outline-variant">
<div class="flex gap-4">
<div class="skeleton w-[70px] h-[12px] rounded-sm"></div>
<div class="skeleton w-[60px] h-[12px] rounded-sm"></div>
</div>
<div class="skeleton w-[50px] h-[14px] rounded-sm"></div>
</div>
<!-- History Row 3 -->
<div class="h-[56px] flex items-center justify-between">
<div class="flex gap-4">
<div class="skeleton w-[70px] h-[12px] rounded-sm"></div>
<div class="skeleton w-[60px] h-[12px] rounded-sm"></div>
</div>
<div class="skeleton w-[50px] h-[14px] rounded-sm"></div>
</div>
</div>
</div>
</section>
<!-- Action Area -->
<section class="px-4 mt-auto mb-8 space-y-2">
<div class="skeleton w-full h-[48px] rounded-md"></div>
<div class="skeleton w-full h-[48px] rounded-md"></div>
</section>
</main>
<!-- Bottom Navigation (Shared Component Strategy) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 bg-background border-t border-outline-variant">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-xs mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-xs mt-1">Accounts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="text-xs mt-1">Payments</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-xs mt-1">Profile</span>
</div>
</nav>
<script>
        // Micro-interaction: Subtle highlight shift on user tap (simulating interaction on shell)
        document.querySelectorAll('nav div').forEach(item => {
            item.addEventListener('click', () => {
                item.style.transform = 'scale(0.95)';
                setTimeout(() => item.style.transform = 'scale(1)', 100);
            });
        });
    </script>
</body></html>
