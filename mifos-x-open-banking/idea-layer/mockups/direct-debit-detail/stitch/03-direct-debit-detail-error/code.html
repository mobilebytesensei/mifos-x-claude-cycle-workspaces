<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Direct Debit Error - Mifos X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#4C662B",
            "primary-container": "#CDEDA3",
            "on-primary": "#FFFFFF",
            "on-primary-container": "#102000",
            secondary: "#386663",
            "secondary-container": "#BCEBE7",
            error: "#BA1A1A",
            background: "#12140E",
            surface: "#1A1C16",
            "surface-variant": "#44483D",
            "on-surface": "#E3E3D8",
            "on-surface-variant": "#8F9285",
            outline: "#75796C",
            "outline-variant": "#C5C8BA",
            "brand-light": "#B2D188",
            "brand-dark": "#1F3701",
          },
          fontFamily: {
            sans: ["Outfit", "sans-serif"],
            headline: ["Outfit", "sans-serif"],
            display: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            label: ["Outfit", "sans-serif"]
          },
          spacing: {
            'margin-mobile': '16px',
            'unit': '8px',
          },
          fontSize: {
            'title-lg': ['22px', '28px'],
            'label-sm': ['11px', '16px'],
            'body-large': ['16px', '24px'],
            'headline-lg-mobile': ['32px', '40px'],
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #12140E;
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
    }
    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar -->
<!-- Logic: The shell visibility rule dictates suppression for transactional/error pages, 
       but the prompt explicitly requests an App Bar for this detail screen. -->
<header class="w-full top-0 sticky bg-background z-50 flex items-center justify-between px-margin-mobile h-16 transition-colors duration-200">
<div class="flex items-center justify-center w-10 h-10">
<span class="material-symbols-outlined text-[24px] text-brand-light cursor-pointer" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-medium text-[18px] text-[#E3E3D8] absolute left-1/2 -translate-x-1/2">Direct Debit</h1>
<div class="w-10 h-10 flex items-center justify-end">
<!-- Trailing space for symmetry -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-8 fade-in">
<!-- Hero Illustration -->
<div class="mt-[80px] w-[140px] h-[140px] relative flex items-center justify-center">
<img alt="Disconnected cloud icon illustration" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ugM7eJDaA5Lp8SR5EOcqUN19TPAWx3s1fQT-Pt5viLRQskT9m4bAmTRj1Fq8JiAaJl9aB1YhQYqlJeKW7hNXGjrOh_a_2NBPV6iAOVUPOKmQ6c83kDWveT8gEcJ1xO1ThieNzD8oze8HZzhLWtlOQY5v5Dokp_OWJjCa6-JEv51WWvhwjE2uAlPGPr4QNM_95Kj69ClvfAbwWW8cHoPH7jjvkqDETZoBQDP32A6JIJLM_csCVwsjedU4IbV"/>
</div>
<!-- Error Headline -->
<h2 class="mt-6 text-center font-semibold text-[22px] leading-[32px] text-[#E3E3D8] px-4">
      Couldn't load mandate details
    </h2>
<!-- Error Subtitle -->
<p class="mt-2 text-center font-normal text-[14px] leading-[20px] text-[#8F9285] px-4 max-w-[280px]">
      Please try again. Your mandate data is safe.
    </p>
<!-- Primary Action -->
<div class="mt-8 w-full max-w-sm px-4">
<button class="w-full h-12 bg-brand-light hover:brightness-110 active:scale-[0.98] transition-all rounded-[999dp] flex items-center justify-center gap-2 text-brand-dark">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
<span class="font-semibold text-[14px]">Try Again</span>
</button>
</div>
<!-- Secondary Action -->
<button class="mt-3 py-2 px-6 font-medium text-[14px] text-[#8F9285] hover:text-on-surface transition-colors">
      Go back
    </button>
</main>
<!-- Bottom Shell Suppression Logic: 
       This is a task-focused error screen (Back action implied), 
       therefore we suppress the BottomNavBar and SideNav to prioritize focus. -->
<script>
    // Lightweight interaction for the "Try Again" button
    document.querySelector('button.bg-brand-light').addEventListener('click', function() {
      const btn = this;
      const icon = btn.querySelector('.material-symbols-outlined');
      
      // Visual feedback
      icon.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
      icon.style.transform = 'rotate(360deg)';
      
      // Simulate loading state
      const originalText = btn.querySelector('span:not(.material-symbols-outlined)').innerText;
      btn.querySelector('span:not(.material-symbols-outlined)').innerText = 'Retrying...';
      btn.style.opacity = '0.8';
      btn.disabled = true;

      setTimeout(() => {
        icon.style.transform = 'rotate(0deg)';
        btn.querySelector('span:not(.material-symbols-outlined)').innerText = originalText;
        btn.style.opacity = '1';
        btn.disabled = false;
      }, 1000);
    });

    // Back button interaction
    document.querySelector('[data-icon="arrow_back"]').parentElement.addEventListener('click', () => {
        window.history.back();
    });
  </script>
</body></html>
