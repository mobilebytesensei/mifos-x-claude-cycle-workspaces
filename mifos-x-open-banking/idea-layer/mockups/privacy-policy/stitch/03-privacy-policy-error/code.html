<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Privacy Policy - Mifos X Open Banking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4C662B",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CDEDA3",
                        "on-primary-container": "#102000",
                        secondary: "#386663",
                        "secondary-container": "#BCEBE7",
                        "on-secondary-container": "#00201E",
                        error: "#BA1A1A",
                        background: "#12140E",
                        surface: "#1A1C16",
                        "on-surface": "#E3E3D8",
                        "surface-variant": "#44483D",
                        "on-surface-variant": "#8F9285",
                        outline: "#75796C",
                        "outline-variant": "#C5C8BA",
                        "custom-green": "#B2D188",
                        "custom-dark-green": "#1F3701"
                    },
                    fontFamily: {
                        headline: ["Outfit", "sans-serif"],
                        display: ["Outfit", "sans-serif"],
                        body: ["Outfit", "sans-serif"],
                        label: ["Outfit", "sans-serif"]
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        "2xl": "1rem",
                        full: "9999px"
                    },
                    spacing: {
                        'safe-top': 'env(safe-area-inset-top)',
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                        md: "16px",
                        lg: "24px"
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #12140E;
            color: #E3E3D8;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for clean dark UI */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #12140E;
        }
        ::-webkit-scrollbar-thumb {
            background: #44483D;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="h-16 flex items-center justify-between px-4 fixed top-0 w-full z-50 bg-background border-b border-[#44483D]">
<div class="flex items-center w-full">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-custom-green active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-1 text-center">
<h1 class="text-[18px] font-medium text-on-surface leading-none">Privacy Policy</h1>
</div>
<!-- Spacer to balance centering -->
<div class="w-10"></div>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-lg pt-16 pb-safe-bottom">
<!-- Illustration Container -->
<div class="relative w-40 h-40 mb-8 flex items-center justify-center">
<div class="absolute inset-0 bg-surface-variant/10 rounded-full blur-3xl"></div>
<img alt="Privacy Policy Error Illustration" class="w-full h-full object-contain relative z-10 opacity-90" src="https://lh3.googleusercontent.com/aida/ADBb0ujEnW7Q4wbF1Wc6pRKevFdjcvnfcsBL9Y6ssws3S2CA1CIIn2AznkJFaE9LkT_lifLJsmJ8lFNGxzvAjJg-7SMef6IH9VSzCjLM-tyLgqQWZitgO3nOkb82pahFtCVvOcS3DfN1aszFf1e8QDctyTGB-2Uk5sr3j_Ds3NrmpOiQfXY_77JhPZsqqf69QbtzqLvGVPf0kn83nDJMZdxwvSouIhXY0K6eHORbxorASaCtzw-014qIuDI1wgOB"/>
</div>
<!-- Text Group -->
<div class="text-center max-w-[280px] space-y-3">
<h2 class="text-[22px] font-semibold text-on-surface leading-tight">
                Unable to load Privacy Policy
            </h2>
<p class="text-[14px] font-normal text-on-surface-variant leading-relaxed">
                Please check your connection and try again.
            </p>
</div>
<!-- Action Group -->
<div class="mt-12 flex flex-col items-center gap-4 w-full max-w-[320px]">
<!-- Primary Action -->
<button class="flex items-center justify-center gap-2 h-12 w-full bg-custom-green text-custom-dark-green rounded-full font-medium active:scale-95 transition-all duration-200 shadow-lg shadow-custom-green/5" onclick="handleRetry()">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
<span>Retry</span>
</button>
<!-- Secondary Action -->
<button class="h-10 px-6 text-[14px] font-medium text-on-surface-variant hover:text-on-surface transition-colors duration-200 active:scale-95">
                Go back
            </button>
</div>
</main>
<!-- Subtle Background Atmospheric Element -->
<div class="fixed top-1/4 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="fixed bottom-1/4 -left-20 w-64 h-64 bg-secondary/5 rounded-full blur-[100px] pointer-events-none"></div>
<script>
        function handleRetry() {
            // Visual feedback for retry action
            const button = document.querySelector('button[onclick="handleRetry()"]');
            const icon = button.querySelector('.material-symbols-outlined');
            
            button.classList.add('opacity-80', 'pointer-events-none');
            icon.classList.add('animate-spin');
            
            // Simulating a network check delay
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                button.classList.remove('opacity-80', 'pointer-events-none');
                
                // Show a brief toast or feedback logic here if needed
            }, 1500);
        }

        // Logic to suppress shell based on prompt: "exclude the navigation shell if the page intent is: Task-Focused... Close or Back action"
        // This screen is an error state with a Back action, so BottomNavBar is intentionally excluded.
    </script>
</body></html>
