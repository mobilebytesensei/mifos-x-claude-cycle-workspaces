<script>
        // Simple micro-interaction for clearing search
        const clearBtn = document.querySelector('button .material-symbols-outlined:contains("close")')?.parentElement;
        const searchInput = document.querySelector('input[type="text"]');
        
        if (clearBtn && searchInput) {
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchInput.focus();
            });
        }
    </script>
