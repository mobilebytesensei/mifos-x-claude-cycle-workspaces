<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, transparent 25%, rgba(206, 237, 162, 0.08) 50%, transparent 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #12140e;
            color: #e3e3d9;
            font-family: 'Outfit', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 h-[56px] bg-surface flex justify-between items-center px-margin-mobile w-full">
<div class="flex items-center gap-md">
<!-- Shimmer Avatar Placeholder -->
<div class="w-8 h-8 rounded-full bg-surface-variant shimmer"></div>
<h1 class="font-title-lg text-title-lg text-primary font-bold">Welcome</h1>
</div>
<div class="flex items-center gap-md">
<!-- Shimmer Notifications Placeholder -->
<div class="w-6 h-6 rounded-full bg-surface-variant shimmer"></div>
</div>
</header>
<main class="pt-[72px] pb-[88px] px-margin-mobile max-w-[1280px] mx-auto space-y-lg">
<!-- Balance Card -->
<section class="w-full h-[140px] bg-surface-container rounded-xl p-md flex flex-col justify-between shimmer border border-outline/10">
<div class="space-y-xs">
<!-- Label Bar -->
<div class="w-20 h-4 bg-surface-variant rounded-full opacity-60"></div>
<!-- Balance Bar -->
<div class="w-48 h-8 bg-surface-variant rounded-full"></div>
<!-- IBAN Bar -->
<div class="w-32 h-4 bg-surface-variant rounded-full opacity-40"></div>
</div>
<!-- Row of 3 shimmer pill buttons -->
<div class="flex gap-xs mt-md">
<div class="h-[36px] flex-1 bg-surface-variant rounded-full shimmer"></div>
<div class="h-[36px] flex-1 bg-surface-variant rounded-full shimmer"></div>
<div class="h-[36px] flex-1 bg-surface-variant rounded-full shimmer"></div>
</div>
</section>
<!-- Total Aggregate Row -->
<section class="w-full h-[40px] bg-surface-variant rounded-full shimmer border border-outline/10"></section>
<!-- Recent Transactions -->
<section class="space-y-md">
<h2 class="font-title-md text-title-md text-on-surface">Recent Transactions</h2>
<div class="space-y-xs">
<!-- Transaction Row 1 -->
<div class="flex items-center justify-between p-md bg-surface-container-high rounded-xl h-[56px] border border-outline/5 shimmer">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant"></div>
<div class="space-y-base">
<div class="w-[140px] h-4 bg-surface-variant rounded-full"></div>
<div class="w-[100px] h-3 bg-surface-variant rounded-full opacity-50"></div>
</div>
</div>
<div class="w-16 h-4 bg-surface-variant rounded-full"></div>
</div>
<!-- Transaction Row 2 -->
<div class="flex items-center justify-between p-md bg-surface-container-high rounded-xl h-[56px] border border-outline/5 shimmer">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant"></div>
<div class="space-y-base">
<div class="w-[140px] h-4 bg-surface-variant rounded-full"></div>
<div class="w-[100px] h-3 bg-surface-variant rounded-full opacity-50"></div>
</div>
</div>
<div class="w-16 h-4 bg-surface-variant rounded-full"></div>
</div>
<!-- Transaction Row 3 -->
<div class="flex items-center justify-between p-md bg-surface-container-high rounded-xl h-[56px] border border-outline/5 shimmer">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-variant"></div>
<div class="space-y-base">
<div class="w-[140px] h-4 bg-surface-variant rounded-full"></div>
<div class="w-[100px] h-3 bg-surface-variant rounded-full opacity-50"></div>
</div>
</div>
<div class="w-16 h-4 bg-surface-variant rounded-full"></div>
</div>
</div>
</section>

<!-- Feature Tile 1 -->
<div class="h-[80px] bg-surface-container rounded-xl flex flex-col items-center justify-center gap-xs shimmer border border-outline/10">
<div class="w-8 h-8 rounded-full bg-surface-variant"></div>

</div>

</div>

</div>

<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1">

</div>

</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</div>
</nav>
<script>
        // Simple micro-interaction for active nav states if user clicks
        document.querySelectorAll('nav > div').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('nav > div').forEach(i => {
                    i.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'rounded-full', 'px-4', 'py-1');
                    i.classList.add('text-on-surface-variant');
                });
                this.classList.remove('text-on-surface-variant');
                this.classList.add('bg-secondary-container', 'text-on-secondary-container', 'rounded-full', 'px-4', 'py-1');
            });
        });
    </script>
