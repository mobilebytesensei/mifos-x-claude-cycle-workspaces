<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Accounts - Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140e;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#b2d188",
                        "inverse-primary": "#4c662a",
                        "on-background": "#e3e3d9",

                        "on-surface-variant": "#c4c8b9",
                        "on-surface": "#e3e3d9",
                        "tertiary": "#ffd8f0",
                        "tertiary-fixed": "#ffd7f0",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "secondary": "#a0cfcb",
                        "primary-fixed-dim": "#b2d188",
                        "surface-container-highest": "#34362e",
                        "on-secondary-container": "#8fbeba",
                        "surface-bright": "#383a33",
                        "on-tertiary": "#4e1e44",
                        "on-primary": "#203700",
                        "inverse-on-surface": "#2f312a",
                        "outline": "#8e9284",
                        "background": "#12140e",
                        "surface-container": "#1e201a",
                        "surface-dim": "#12140e",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#f6b2e1",
                        "on-secondary-fixed": "#00201e",
                        "on-primary-fixed": "#102000",
                        "on-primary-container": "#415a1f",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0d0f09",
                        "primary-fixed": "#cdeda1",
                        "on-secondary": "#013735",
                        "secondary-fixed-dim": "#a0cfcb",
                        "primary": "#ceeda2",
                        "tertiary-container": "#f6b2e1",
                        "outline-variant": "#44483c",
                        "surface-tint": "#b2d188",
                        "on-tertiary-fixed": "#35072e",
                        "surface-variant": "#34362e",
                        "inverse-surface": "#e3e3d9",
                        "secondary-fixed": "#bcece7",
                        "on-primary-fixed-variant": "#354e14",
                        "nav_active_indicator": "#354e14"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "pill": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "64px",
                        "xl": "32px",
                        "base": "8px",
                        "sm": "8px",
                        "lg": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "gutter": "16px",
                        "margin-mobile": "16px"
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<!-- Content & Identity: Use exact labels from JSON. Style mapping from style_ keys. -->
<header class="fixed top-0 w-full z-50 bg-background flex items-center justify-between px-4 h-14 w-full border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors active:opacity-80">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline font-semibold text-primary text-[22px] tracking-tight">My Accounts</h1>
</div>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container transition-colors active:opacity-80">
<span class="material-symbols-outlined text-outline" data-icon="help">help</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start pt-[56px] px-margin-mobile">
<!-- Hero Section -->
<div class="mt-[64px] flex flex-col items-center">
<div class="w-[160px] h-[140px] flex items-center justify-center overflow-hidden">
<img alt="Technical connection error" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uib9SKBidhzU8ZMZZta8XXJJQhhgtxnJ1DxbRB4D4ch5fRPXd28H7ltIPj_8fhNWzHonBJLlh30S5nj_UiY_iuUpVozBxPtz4zWw3TYLdCRTeIz7grDQCpgjg4MA3cGwUA4XDvuvHxxlWVSHubFMtV6wmggU51TYriJxH4260shITnebM-_WAV2DwehJHm8CJi_TTQur3UjpXoOmIz4MVtc0XCOnrO-yGdCekHMqLSc6huxbKlFiURUslo"/>
</div>
</div>
<!-- Message -->
<h2 class="mt-lg text-on-surface font-semibold text-[22px] text-center leading-tight">
            Could not load accounts
        </h2>
<!-- Description -->
<p class="mt-base text-on-surface-variant font-normal text-[14px] leading-[20px] text-center max-w-[280px]">
            Check your internet connection and try again. Your account data is secure.
        </p>
<!-- Primary CTA: Filled Pill Button -->
<div class="mt-xl w-full px-xl">
<button class="w-full bg-primary-container text-on-primary font-semibold text-[16px] h-12 rounded-pill flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                Retry
            </button>
</div>
<!-- Secondary CTA: Text Button -->
<button class="mt-md text-outline font-medium text-[14px] hover:text-on-surface-variant transition-colors active:opacity-70">
            Go back
        </button>
</main>
<!-- BottomNavBar -->
<!-- Contextual Suppression: Hidden for error states to prioritize focus on recovery, but following JSON structure as defined for destination screens. -->
<nav class="fixed bottom-0 w-full z-50 h-20 bg-background border-t border-outline-variant flex justify-around items-center px-2">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[12px] mt-1">Home</span>
</a>
<!-- Accounts (Active State Logic applied based on 'My Accounts' title) -->
<a class="flex flex-col items-center justify-center bg-nav_active_indicator text-primary rounded-pill px-5 py-1 active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-label text-[12px] mt-1">Accounts</span>
</a>
<!-- Payments -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-[12px] mt-1">Payments</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label text-[12px] mt-1">Profile</span>
</a>
</nav>
<!-- Micro-interaction for the Retry button -->
<script>
        document.querySelector('button.bg-primary-container').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            setTimeout(() => {
                icon.classList.remove('animate-spin');
            }, 1000);
        });
    </script>
</body></html>
