<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#354e14",

                        "surface-variant": "#34362e",

                        "tertiary-fixed-dim": "#ffba3e",

                        "on-secondary": "#013735",
                        "surface-container-high": "#292b24",
                        "on-background": "#e3e3d9",
                        "on-tertiary-container": "#704c00",
                        "on-primary-fixed": "#102000",
                        "primary-fixed": "#cdeda1",
                        "inverse-on-surface": "#2f312a",
                        "on-secondary-fixed-variant": "#1f4e4b",
                        "on-secondary-fixed": "#00201e",
                        "secondary-fixed-dim": "#a0cfcb",
                        "on-primary-container": "#415a1f",
                        "background": "#12140e",
                        "surface-bright": "#383a33",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "surface": "#12140e",
                        "primary": "#ceeda2",

                        "on-tertiary-fixed-variant": "#604100",
                        "primary-fixed-dim": "#b2d188",
                        "inverse-surface": "#e3e3d9",
                        "inverse-primary": "#4c662a",
                        "on-surface-variant": "#c4c8b9",
                        "surface-container-lowest": "#0d0f09",
                        "secondary-container": "#1f4e4b",
                        "outline": "#8e9284",
                        "on-tertiary": "#432c00",

                        "on-secondary-container": "#8fbeba",
                        "surface-container": "#1e201a",

                        "secondary-fixed": "#bcece7",
                        "tertiary-container": "#ffba3f",
                        "on-surface": "#e3e3d9",
                        "on-primary": "#203700",
                        "surface-container-low": "#1a1c16",
                        "tertiary": "#ffdeae",
                        "surface-container-highest": "#34362e",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    "spacing": {
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "base": "4px",
                        "margin-tablet": "24px",
                        "margin-desktop": "40px",
                        "gutter": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "title-lg": ["Outfit"],
                        "headline-lg": ["Outfit"],

                        "display-lg": ["Outfit"],
                        "headline-lg-mobile": ["Outfit"],
                        "label-md": ["Outfit"],
                        "body-md": ["Outfit"]
                    },
                    "fontSize": {
                        "title-lg": ["22px", {"lineHeight": "28px", "letterSpacing": "0", "fontWeight": "500"}],

                        "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, #1E201A 25%, #282A24 50%, #1E201A 75%);
            background-size: 200% 100%;
            animation: shimmer 1200ms infinite linear;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #12140E;
            color: #E3E3D9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar Shell -->
<header class="fixed top-0 w-full z-50 bg-background flex justify-between items-center px-margin-mobile h-16 w-full max-w-screen-2xl mx-auto">
<div class="w-[140px] h-[22px] rounded-sm shimmer"></div>
<div class="w-[24px] h-[24px] rounded-full shimmer"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-16 pb-24 overflow-y-auto max-w-screen-2xl mx-auto w-full">
<!-- Chip Row -->
<div class="mt-[12px] px-margin-mobile flex gap-2 overflow-x-hidden">
<div class="w-[72px] h-[32px] rounded-xl flex-shrink-0 shimmer"></div>
<div class="w-[72px] h-[32px] rounded-xl flex-shrink-0 shimmer"></div>
<div class="w-[72px] h-[32px] rounded-xl flex-shrink-0 shimmer"></div>
<div class="w-[72px] h-[32px] rounded-xl flex-shrink-0 shimmer"></div>
</div>
<!-- Account Card 1 -->
<section class="mt-md px-margin-mobile">
<div class="bg-surface-container rounded-xl p-md outline-none border border-outline-variant/30 shadow-sm">
<div class="flex justify-between items-center">
<div class="w-[120px] h-[16px] rounded-sm shimmer"></div>
<div class="w-[60px] h-[20px] rounded-full shimmer"></div>
</div>
<div class="mt-[10px] w-[100px] h-[28px] rounded-sm shimmer"></div>
<div class="mt-[10px] flex items-center gap-3">
<div class="w-4 h-4 rounded-full shimmer"></div>
<div class="w-[200px] h-[12px] rounded-sm shimmer"></div>
</div>
</div>
</section>
<!-- Account Card 2 -->
<section class="mt-[12px] px-margin-mobile">
<div class="bg-surface-container rounded-xl p-md outline-none border border-outline-variant/30 shadow-sm">
<div class="flex justify-between items-center">
<div class="w-[130px] h-[16px] rounded-sm shimmer"></div>
<div class="w-[60px] h-[20px] rounded-full shimmer"></div>
</div>
<div class="mt-[10px] w-[110px] h-[28px] rounded-sm shimmer"></div>
<div class="mt-[10px] flex items-center gap-3">
<div class="w-4 h-4 rounded-full shimmer"></div>
<div class="w-[200px] h-[12px] rounded-sm shimmer"></div>
</div>
</div>
</section>
<!-- Account Card 3 -->
<section class="mt-[12px] px-margin-mobile">
<div class="bg-surface-container rounded-xl p-md outline-none border border-outline-variant/30 shadow-sm">
<div class="flex justify-between items-center">
<div class="w-[120px] h-[16px] rounded-sm shimmer"></div>
<div class="w-[60px] h-[20px] rounded-full shimmer"></div>
</div>
<div class="mt-[10px] w-[100px] h-[28px] rounded-sm shimmer"></div>
<div class="mt-[10px] flex items-center gap-3">
<div class="w-4 h-4 rounded-full shimmer"></div>
<div class="w-[200px] h-[12px] rounded-sm shimmer"></div>
</div>
</div>
</section>
<!-- Footer List Row (Transactions Preview Skeleton) -->
<div class="mt-md border-t border-surface-container-high">
<div class="h-[56px] px-margin-mobile flex justify-between items-center">
<div class="w-[140px] h-[13px] rounded-sm shimmer"></div>
<div class="w-[90px] h-[18px] rounded-sm shimmer"></div>
</div>
<!-- Repeated row for realism -->
<div class="border-t border-surface-container-high/50 h-[56px] px-margin-mobile flex justify-between items-center">
<div class="w-[110px] h-[13px] rounded-sm shimmer"></div>
<div class="w-[70px] h-[18px] rounded-sm shimmer"></div>
</div>
</div>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center pt-2 pb-safe px-4 bg-surface-container rounded-t-xl border-t border-outline-variant z-50">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</a>
<!-- Accounts (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="account_balance" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<span class="font-label-md text-label-md mt-1">Accounts</span>
</a>
<!-- Payments -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-md text-label-md mt-1">Payments</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</a>
</nav>
<script>
        // Simple micro-interaction for active feedback on non-skeleton elements
        document.querySelectorAll('a').forEach(anchor => {
            anchor.addEventListener('click', (e) => {
                e.preventDefault();
            });
        });
    </script>
</body></html>
