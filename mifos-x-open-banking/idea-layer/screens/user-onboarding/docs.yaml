# vm_actions EMPTIED 2026-08-01 (/idea-sync, from /idea-verify XS-3).
#
# This block still declared five actions — StepNext, StepBack, OpenObExplainer,
# CloseObExplainer, NavigateToLogin — driving a three-step pager and a bottom sheet that
# do not exist. Three of them named states this screen does not declare:
#   StepNext        -> "1→intro, 2→permissions_overview, 3→consent_explainer"
#   NavigateToLogin -> "Only callable from consent_explainer state (step 3)"
#   Open/CloseObExplainer -> showObExplainerSheet
# ui.yaml:66 declares states: [intro]. ui.yaml:34-40 records every one of these actions,
# both extra states and the sheet, as removed in the 2026-07-28 reverse sync because source
# never built them.
#
# The contradiction was INTERNAL to this file: the `description` above was corrected on
# 2026-07-30 to read "Stateless: no ViewModel, no I/O — the continue button is a nav-host
# callback, not a dispatched action", and these five actions survived directly beneath that
# correction. A codegen consumer reading vm_actions would have emitted a ViewModel for a
# screen the spec says has none.
#
# Empty is the correct value, not a placeholder: ui.yaml sets `state_model: {}` and
# `implementation.viewmodel: null`, and TC-ONB-003 asserts "No ViewModel is resolved — the
# composable takes only onContinue and a Modifier".
vm_actions: []
nav_callbacks:
  # The screen's only outward edge. Host-owned, NOT a dispatched action — which is precisely
  # why it does not appear in vm_actions above.
  - "onContinue -> navController.navigate(LoginRoute)"
