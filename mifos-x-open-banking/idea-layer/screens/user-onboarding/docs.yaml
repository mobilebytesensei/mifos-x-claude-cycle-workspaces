# ── Description corrected 2026-07-30 (/idea-feature-export stale-artifact fix) ──
# The prior text described a THREE-STEP pager (intro -> permissions_overview ->
# consent_explainer) plus an ob_explainer bottom sheet. Source ships ONE stateless screen:
# states [intro], IntroScreen.kt, viewmodel null, and TC-ONB-003 asserts no state and no I/O.
# Unbuilt scope from before the 2026-07-28 reverse sync, not a missing implementation.
description: >-
  Single-screen first-run education before the PSU connects an HSBC account. Establishes UK Open
  Banking as FCA-regulated and FAPI 1.0 Advanced-secured via a hero illustration, headline, body
  copy and trust chips, then hands off to login. Stateless: no ViewModel, no I/O — the continue
  button is a nav-host callback, not a dispatched action. Ships inside feature/login as
  onboarding/IntroScreen.kt; IntroRoute is the startDestination of AuthGraphRoute. Skipped on the
  re-consent path, which goes to LoginRenewRoute inside the authenticated host.
has_ui: true
has_server: false
# No has_api: zero operations — a static intro inside feature/login.
# has_system_integration: hands off to the bank authorisation redirect (deep_link).
capabilities: [has_ui, has_flow, has_static_content, has_system_integration]
# V1. V2/V3 N/A — zero device permissions app-wide (see login/docs.yaml).
system_capabilities:
  - kind: deep_link
    detail: "Terminal edge hands off to LoginRoute, which stages the consent and starts the bank redirect."
metadata:
  category: nav_only
  implementation_ready: true
  impl_ready_at: '2026-06-29T12:00:00Z'
  impl_ready_schema: v2
