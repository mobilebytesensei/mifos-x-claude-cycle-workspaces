sibling: data-flow
schema_version: "2.1.0"
feature_id: user-onboarding

screen_id: user-onboarding

on_mount: []

on_user_action:
  # ─── Step navigation ──────────────────────────────────────────────

  - trigger: step_next
    description: "PSU taps 'Next' — advance onboarding to the next step (intro→permissions_overview or permissions_overview→consent_explainer)."
    action_type: update_state
    state_mutation:
      field: currentStep
      state_op: increment
      bounds: [1, 3]
    note: "Purely client-side step transition; no network call. ViewModel tracks currentStep ∈ {1,2,3} and maps to UI state (intro/permissions_overview/consent_explainer)."

  - trigger: step_back
    description: "PSU taps 'Back' — retreat onboarding to the previous step (consent_explainer→permissions_overview or permissions_overview→intro)."
    action_type: update_state
    state_mutation:
      field: currentStep
      state_op: decrement
      bounds: [1, 3]
    note: "Back on step 1 (intro) is a no-op (no back navigation below first step)."

  # ─── OB Explainer sheet ───────────────────────────────────────────

  - trigger: open_ob_explainer
    description: "PSU taps 'How Open Banking works' — show OB explainer bottom sheet on top of consent_explainer state."
    action_type: update_state
    state_mutation:
      field: showObExplainerSheet
      value: true
    note: "Sheet overlays consent_explainer; step index remains at 3. Screen state switches to ob_explainer_open."

  - trigger: close_ob_explainer
    description: "PSU taps 'Got it' or dismisses the bottom sheet — return to consent_explainer."
    action_type: update_state
    state_mutation:
      field: showObExplainerSheet
      value: false
    note: "Returns screen to consent_explainer state; step index unchanged."

  # ─── Screen-level navigation ──────────────────────────────────────

  - trigger: navigate_to_login
    description: "PSU taps 'Connect with HSBC' on step 3 — navigate to login screen where OBReadConsent1 is staged and the FAPI app-to-app redirect to HSBC begins."
    navigate_to: login
    note: "Only reachable from consent_explainer state (step 3). No navigation from steps 1 or 2."
