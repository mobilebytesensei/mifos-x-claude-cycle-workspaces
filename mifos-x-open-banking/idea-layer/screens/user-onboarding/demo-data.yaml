sibling: demo-data
schema_version: "2.1.0"
feature_id: user-onboarding

screen_id: user-onboarding
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC/OBIE-grounded content only."

# ─── Step 1: intro ────────────────────────────────────────────────
intro:
  headline: "Share your HSBC data securely with Open Banking"
  body: "UK Open Banking is a regulated framework overseen by the Financial Conduct Authority. It lets you share your account information with authorised apps — without sharing your password."
  trust_badges:
    - label: "Secured by FAPI 1.0 Advanced"
      icon: verified_user
      note: "FAPI 1.0 Advanced is a banking-grade security profile — the same standard used by leading UK Open Banking providers."
    - label: "FCA Regulated"
      icon: account_balance
      note: "Mifos Open Banking is registered under the Payment Services Regulations 2017 (PSR 2017)."

# ─── Step 2: permissions_overview ─────────────────────────────────
permissions:
  section_header: "What we'll read"
  consent_duration_note: "Your consent lasts up to 90 days. You can revoke it at any time from Settings → Manage consents."
  obie_consent_id: OBReadConsent1
  permissions_requested:
    - obie_scope: ReadAccountsDetail
      icon: manage_accounts
      headline: "Account details"
      detail: "Account names, sort codes, IBANs, and currency for your HSBC accounts"
    - obie_scope: ReadBalances
      icon: account_balance
      headline: "Account balances"
      detail: "Current, available, and credit-limit balances across all authorised accounts in real time"
    - obie_scope: ReadTransactionsDetail
      icon: receipt_long
      headline: "Transaction history"
      detail: "Up to 90 days of debits and credits, merchant names, and transaction references"
    - obie_scope: ReadStandingOrdersDetail
      icon: autorenew
      headline: "Standing orders"
      detail: "Scheduled recurring payment mandates you have set up on your HSBC accounts"
    - obie_scope: ReadDirectDebits
      icon: subscriptions
      headline: "Direct debits"
      detail: "Active direct-debit mandates and the most recent amounts collected on your accounts"
    - obie_scope: ReadStatementsDetail
      icon: description
      headline: "Statements"
      detail: "Monthly statement summaries, opening and closing balances, and available PDF references"

# ─── Step 3: consent_explainer ────────────────────────────────────
trust:
  section_header: "What we never do"
  reassurances:
    - id: no_payments
      icon: money_off
      icon_color: "error"
      headline: "No payments or transfers"
      detail: "This app is Account Information only (AISP). We have no permission to initiate payments or move money from your account."
    - id: no_password
      icon: lock
      icon_color: "primary"
      headline: "We never see your password"
      detail: "You authenticate directly on HSBC's secure portal using their Strong Customer Authentication (SCA). Your credentials never leave HSBC."
    - id: revoke_anytime
      icon: cancel
      icon_color: "primary"
      headline: "Revoke access anytime"
      detail: "You can disconnect HSBC data sharing at any time from Settings → Manage consents, or directly from your HSBC app."
  legal_footer: "Regulated by the Financial Conduct Authority under the Payment Services Regulations 2017. Powered by UK Open Banking Read/Write API v4.0 (OBIE)."

# ─── OB Explainer bottom sheet ────────────────────────────────────
ob_explainer:
  title: "How UK Open Banking works"
  steps:
    - step: 1
      icon: how_to_reg
      title: "You approve the permission request"
      body: "We ask HSBC to prepare a consent with the list of data categories we want to read. You are then redirected to HSBC's secure app or website to review the exact permission set and approve it — choosing which accounts to include."
    - step: 2
      icon: login
      title: "You authenticate directly with HSBC"
      body: "You log in on HSBC's portal using your own HSBC credentials and complete Strong Customer Authentication (SCA). Mifos Open Banking never sees your password, card number, or security codes at any point."
    - step: 3
      icon: shield
      title: "A secure token is returned to us"
      body: "Once you approve, HSBC sends a short-lived, signed access token back to this app using FAPI 1.0 Advanced — a banking-grade security protocol. We use this token to read the account information you approved; it cannot be used to move money."
  revoke_note: "You can revoke this access at any time from Settings → Manage consents, or directly from your HSBC app or HSBC online banking."
  close_button_label: "Got it"

# ─── Legal / regulatory ───────────────────────────────────────────
legal_copy:
  regulated_by: "Financial Conduct Authority (FCA)"
  regulation: "Payment Services Regulations 2017 (PSR 2017)"
  fca_register_link: "https://register.fca.org.uk"
  ob_standard: "UK Open Banking Read/Write API v4.0 (OBIE)"
  data_access_period: "Up to 90 days per consent, renewable"
  aisp_type: "Account Information Service Provider (AISP)"
  no_pisp: true

# ── State index (added 2026-08-02 via /idea-data) ────────────────────────────
# ui.yaml declares states: [intro] — a single state, correctly. This is a stateless
# introductory composable with no fetch, no collection and nothing that can fail; already
# recorded in DESIGN_VALIDATION as a stateless-composable dismissal alongside licences.
states:
  - scope: intro
    intro: intro
    permissions: permissions
    trust: trust
    ob_explainer: ob_explainer
    legal_copy: legal_copy

_no_pisp_is_now_stale: >-
  legal_copy.no_pisp: true asserts this app never initiates payments. That was true when the
  copy was written and is NOT true now — the 2026-07-30 scope reversal brought PISP domestic
  single payments in scope, and send-money / payment-consent / payment-status / sca-challenge
  all ship. Onboarding legal copy that tells a PSU their data is read-only, on an app that
  moves money, is a compliance-shaped defect rather than a stale string. Flagged here rather
  than rewritten: the replacement wording is a legal-review decision, not a fixture edit.
