<!doctype html>
<!-- render-hash: 7c41ab90e2f3d518 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to Open Banking — intro</title>
<style>
  :root {
    --primary: #266489;
    --on-primary: #FFFFFF;
    --primary-container: #C9E6FF;
    --on-primary-container: #004B6F;
    --secondary: #50606E;
    --secondary-container: #D3E5F5;
    --on-secondary-container: #384956;
    --tertiary: #64597B;
    --background: #F7F9FF;
    --surface: #F7F9FF;
    --surface-container-low: #F1F4F9;
    --surface-container: #EBEEF3;
    --surface-container-high: #E5E8ED;
    --on-surface: #181C20;
    --on-surface-variant: #41474D;
    --outline: #72787E;
    --outline-variant: #C1C7CE;
    --error: #BA1A1A;

    --font-brand: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --fs-headline-medium: 1.75rem;
    --fs-body-medium: 0.875rem;
    --fs-body-large: 1rem;
    --fs-label-large: 0.875rem;

    --sp-xs: 4px;
    --sp-sm: 8px;
    --sp-md: 12px;
    --sp-lg: 16px;
    --sp-xl: 24px;
    --sp-2xl: 32px;
    --sp-3xl: 48px;

    --r-small: 8px;
    --r-medium: 12px;
    --r-large: 16px;
    --r-full: 9999px;

    --el-0: none;
    --el-1: 0 1px 2px rgba(24, 28, 32, .08), 0 1px 3px rgba(24, 28, 32, .06);
    --el-2: 0 1px 2px rgba(24, 28, 32, .10), 0 2px 6px rgba(24, 28, 32, .08);

    --hero-max: 280px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #95CDF7;
      --on-primary: #00344E;
      --primary-container: #004B6F;
      --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9;
      --secondary-container: #384956;
      --on-secondary-container: #D3E5F5;
      --tertiary: #CFC0E8;
      --background: #101417;
      --surface: #101417;
      --surface-container-low: #181C20;
      --surface-container: #1C2024;
      --surface-container-high: #262A2E;
      --on-surface: #E0E3E8;
      --on-surface-variant: #C1C7CE;
      --outline: #8B9198;
      --outline-variant: #41474D;
      --error: #FFB4AB;

      --el-1: 0 1px 2px rgba(0, 0, 0, .40), 0 1px 3px rgba(0, 0, 0, .30);
      --el-2: 0 1px 2px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--background);
    color: var(--on-surface);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .screen {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    padding: var(--sp-lg);
    padding-top: calc(var(--sp-2xl) + env(safe-area-inset-top, 0px));
    padding-bottom: calc(var(--sp-xl) + env(safe-area-inset-bottom, 0px));
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }

  .hero {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--sp-xl) 0;
    min-height: 0;
  }

  .hero__art {
    width: 100%;
    max-width: var(--hero-max);
    aspect-ratio: 1 / 1;
    display: block;
  }

  .copy {
    display: flex;
    flex-direction: column;
    gap: var(--sp-md);
  }

  .intro-headline {
    font-family: var(--font-brand);
    font-size: var(--fs-headline-medium);
    font-weight: 400;
    line-height: 1.25;
    letter-spacing: 0;
    color: var(--on-surface);
    margin: 0;
    text-wrap: balance;
  }

  .intro-body {
    font-size: var(--fs-body-medium);
    line-height: 1.55;
    color: var(--on-surface-variant);
    margin: 0;
  }

  .trust-chips {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-sm);
    margin-top: var(--sp-xs);
  }

  .assist-chip {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-xs);
    height: 32px;
    padding: 0 var(--sp-md);
    border: 1px solid var(--outline-variant);
    border-radius: var(--r-small);
    background: var(--surface-container-low);
    color: var(--on-surface-variant);
    font-size: 0.8125rem;
    font-weight: 500;
    letter-spacing: .01em;
    white-space: nowrap;
  }

  .assist-chip svg {
    width: 18px;
    height: 18px;
    display: block;
    color: var(--primary);
    flex: 0 0 auto;
  }

  .actions {
    padding-top: var(--sp-xl);
  }

  .button-filled {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 56px;
    padding: 0 var(--sp-xl);
    border: 0;
    border-radius: var(--r-full);
    background: var(--primary);
    color: var(--on-primary);
    font-family: var(--font-body);
    font-size: var(--fs-label-large);
    font-weight: 500;
    letter-spacing: .01em;
    cursor: pointer;
    box-shadow: var(--el-1);
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow .15s ease, filter .15s ease;
  }

  .button-filled:hover { box-shadow: var(--el-2); filter: brightness(1.05); }
  .button-filled:active { box-shadow: var(--el-0); filter: brightness(.96); }
  .button-filled:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 3px;
  }

  @media (min-width: 600px) {
    .screen { padding: var(--sp-2xl); }
    :root { --hero-max: 320px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .button-filled { transition: none; }
  }
</style>
</head>
<body>
<div class="screen" data-screen="user-onboarding" data-state="intro">

  <div class="hero">
    <svg class="hero__art"
         viewBox="0 0 240 240"
         role="img"
         data-component-type="image"
         data-component-id="hero_illustration"
         data-test-tag="intro_hero_illustration"
         aria-label="Illustration of secure bank data sharing">
      <defs>
        <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--primary-container)"/>
          <stop offset="100%" stop-color="var(--secondary-container)"/>
        </linearGradient>
      </defs>

      <circle cx="120" cy="120" r="104" fill="var(--surface-container)"/>
      <circle cx="120" cy="120" r="78" fill="var(--surface-container-low)"/>

      <rect x="26" y="104" width="52" height="34" rx="6" fill="var(--surface-container-high)" stroke="var(--outline-variant)" stroke-width="2"/>
      <path d="M32 116h40M32 124h28" stroke="var(--on-surface-variant)" stroke-width="3" stroke-linecap="round" opacity=".55"/>

      <path d="M86 121h44" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/>
      <path d="m128 115 7 6-7 6" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="M172 72c17 8 33 11 33 11v42c0 30-19 47-33 54-14-7-33-24-33-54V83s16-3 33-11z"
            fill="url(#shieldGrad)" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round"/>
      <path d="m158 122 10 11 21-23" fill="none" stroke="var(--primary)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="copy">
    <h1 class="intro-headline"
        data-component-type="text"
        data-component-id="intro_headline"
        role="heading"
        aria-level="1">Your bank data, shared securely</h1>

    <p class="intro-body"
       data-component-type="text"
       data-component-id="intro_body">Connect your HSBC account with UK Open Banking. Your bank verifies you directly, so you never share your password with this app.</p>

    <div class="trust-chips"
         data-component-type="chip_group"
         data-component-id="trust_chips"
         role="group"
         aria-label="Security and regulation badges">
      <span class="assist-chip" data-component-type="chip" data-component-id="fapi_chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
        FAPI 1.0 Advanced
      </span>
      <span class="assist-chip" data-component-type="chip" data-component-id="fca_chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>
        </svg>
        FCA regulated
      </span>
    </div>
  </div>

  <div class="actions">
    <button class="button-filled"
            type="button"
            data-component-type="button"
            data-component-id="continue_button"
            data-test-tag="intro_continue"
            data-nav-to="login"
            data-nav-type="push"
            data-action-id="navigate_login"
            aria-label="Continue">Continue</button>
  </div>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
