sibling: ui
schema_version: "4.0"
feature_id: user-onboarding

screen_id: user-onboarding
archetype: onboarding
name: "Welcome to Open Banking"
# status: REMOVED 2026-08-04 (CROSS_LEAK repair — sibling-layout.json assigns `status` to
# the docs sibling). This copy held `implemented`; docs.yaml is the single owner.
# RECONCILED 2026-08-07 (/idea-sync): was 88, disagreed with docs.yaml `score: 95`.
# The matrix averages every top-level quality_score under screens/user-onboarding/**.
# docs.yaml is the owner sibling.
quality_score: 95
initial_state: intro

# ─────────────────────────────────────────────────────────────────────
# SOURCE BINDING — reverse-synced from source 2026-07-28
#
# This screen does NOT have its own feature module. It ships as
# onboarding/IntroScreen.kt inside feature/login, reached via IntroRoute —
# the start destination of the AuthGraphRoute graph.
#
# The previously-declared three-step pager (intro / permissions_overview /
# consent_explainer), the ob_explainer_open bottom sheet, the loading /
# error / empty states, the UserOnboardingViewModel and all six actions
# were never built. Source ships ONE stateless composable with a single
# outward edge.
# ─────────────────────────────────────────────────────────────────────
implementation:
  status: implemented
  source_module: "feature/login"
  package: "org.mifosx.openbanking.feature.login.onboarding"
  file: "onboarding/IntroScreen.kt"
  route: "IntroRoute (data object) — startDestination of AuthGraphRoute"
  screen: IntroScreen
  viewmodel: null
  supporting_composables:
    - "onboarding/OnboardingHeroIllustration.kt"
    - "onboarding/AssistChip.kt"
  outward_edge: "onContinue -> navController.navigate(LoginRoute)"
  synced_from_source_at: "2026-07-28"
  removed_in_sync:
    - "UserOnboardingViewModel and the whole state_model — IntroScreen is a stateless composable with no view model"
    - "permissions_overview and consent_explainer states — no multi-step pager exists; the permission list lives on the login screen (components/PermissionList.kt)"
    - "ob_explainer_open state — no bottom sheet is implemented"
    - "loading, error, empty states — added by a 2026-07-14 /design-validate --fix pass; none were ever built"
    - "stepNext, stepBack, openObExplainer, closeObExplainer, retryOnboardingInit actions — none exist"
    - "OnboardingDataStore and NavigationController DI — nothing is injected; there is no onboarding_completed flag in source"

status_history:
  - { from: draft, to: enriched, at: "2026-06-29", by: "/idea-enrich" }
  - from: enriched
    to: implemented
    at: "2026-07-28"
    by: "/gap-analysis-project (reverse sync from source)"
    note: "Collapsed a speculative 7-state pager down to the single stateless intro composable that source actually ships."

business_logic:
  kind: nav_only
  description: "Static onboarding intro, and the first screen the app shows in the unauthenticated auth graph. IntroScreen renders a hero illustration, a headline, a body paragraph establishing UK Open Banking as FCA-regulated and password-free, two AssistChip trust badges (FAPI 1.0 Advanced, FCA-regulated), and a single continue button. It holds no state, performs no I/O and makes no API calls; onContinue is its only outward edge and navigates to LoginRoute, where the permission set is rendered and the consent is staged."
  external_library_refs: []
  description_author: claude
  description_authored_at: "2026-07-28T00:00:00Z"

# No state_model: IntroScreen is a stateless composable with no ViewModel,
# no actions and no error surface.
state_model: {}

shell:
  bottom_navigation_visible: false
  top_app_bar_visible: false
  fab_visible: false

states: [intro]

# TEST TAGS — reconciled against source 2026-08-02 by /idea-sync (source-truth pass).
test_tags:
  # This feature has NO module of its own. Its screen ships as IntroScreen.kt inside
  # feature/login (PIPELINE_STATE#capabilities.kmp-implement records it under
  # screens_without_own_module), so there is no UserOnboardingTestTags.kt to read.
  source: "feature/login/src/commonMain/kotlin/org/mifosx/openbanking/feature/login/onboarding/IntroScreen.kt"
  hosted_in_module: "feature/login"
  declared_in_source: 2
  bound: 2
  no_testtags_object: >-
    IntroScreen.kt applies both tags as INLINE STRING LITERALS (IntroScreen.kt:72 and :119),
    not as consts in a TestTags object — the only screen in the codebase that does. Recorded
    because a reader looking for the object will not find one, and because the /implement pass
    that gives this feature its own module should promote them to a real TestTags object.
  bound_tags:
    - { tag: "intro_hero_illustration", component: hero_illustration, source_ref: "IntroScreen.kt:72" }
    - { tag: "intro_continue",          component: continue_button,   source_ref: "IntroScreen.kt:119" }
  untagged_in_source:
    # Recorded so a future pass does not read these as MISSING bindings — source genuinely
    # applies no tag to them, so there is nothing to bind.
    - "trust_chips + its fapi_chip / fca_chip children — onboarding/AssistChip.kt applies no testTag"
    - "intro_headline, intro_body — plain Text nodes, untagged in source"

components:

  - type: image
    id: hero_illustration
    test_tag: "intro_hero_illustration"
    state_binding: [intro]
    source: OnboardingHeroIllustration
    decorative: false
    alt: "{strings.user_onboarding.hero_alt}"
    test_context:
      purpose: "OnboardingHeroIllustration.kt — the composable hero graphic"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_headline
    state_binding: [intro]
    role: heading
    content: "{strings.user_onboarding.intro_headline}"
    style: headlineMedium
    test_context:
      purpose: "feature_login_intro_headline"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: text
    id: intro_body
    state_binding: [intro]
    content: "{strings.user_onboarding.intro_body}"
    style: bodyMedium
    color: "onSurfaceVariant"
    test_context:
      purpose: "feature_login_intro_body — establishes FCA regulation and password-free access"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: chip_group
    id: trust_chips
    state_binding: [intro]
    selection_mode: none
    accessibility_label: "{strings.user_onboarding.trust_chips_a11y}"
    test_context:
      purpose: "Two non-interactive AssistChip trust badges"
      required_fields: []
      interaction_type: display
      data_driven: false
    chips:
      - id: fapi_chip
        label: "{strings.user_onboarding.fapi_chip}"
      - id: fca_chip
        label: "{strings.user_onboarding.fca_chip}"

  - type: button
    keyboard:
      focusable: true
    id: continue_button
    test_tag: "intro_continue"
    state_binding: [intro]
    variant: filled
    label: "{strings.user_onboarding.intro_continue}"
    accessibility_label: "{strings.user_onboarding.intro_continue}"
    test_context:
      purpose: "The screen's only interactive element and only outward edge"
      required_fields: []
      interaction_type: action
      data_driven: false
    on_click:
      action: navigate_login
      target: login
      action_contract:
        effect: navigate
        description: "Invokes the IntroScreen onContinue callback, which calls navController.navigate(LoginRoute) inside authGraph. The login screen then stages the account-access-consent and launches the FAPI app-to-app redirect."
