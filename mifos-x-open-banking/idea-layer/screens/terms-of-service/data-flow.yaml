sibling: data-flow
schema_version: "4.0"
feature_id: terms-of-service

# Terms of Service content is a static bundled asset (terms_of_service.html).
# No network API calls are made. Entries document the local-asset load
# that TermsOfServiceViewModel performs on screen open.

entries:
  - screen_id: terms-of-service
    trigger: on_mount
    endpoints: []
    direction: read
    transport: local_asset
    asset: "terms_of_service.html"
    dtos: []
    produces_state: content
    error_paths:
      - error_code: asset_unreadable
        behavior: error_state
    notes: "Defensive error path only; bundled asset should always be readable"

  - screen_id: terms-of-service
    trigger: on_interact
    event: OnRetry
    endpoints: []
    direction: read
    transport: local_asset
    asset: "terms_of_service.html"
    dtos: []
    produces_state: content
    error_paths:
      - error_code: asset_unreadable
        behavior: error_state
