    note: "SOURCE→SPEC truthfulness rewrite to shipped TermsOfServiceScreen.kt (static @Composable, tosSections baked in, no ViewModel/DI). Replaced the fabricated real-bank clauses (£100/12-month liability cap, Financial Ombudsman, LCIA arbitration, Governing Law England & Wales, FCA alignment, 14-day change notice) with the shipped sandbox-truthful 11-block set: Agreement Overview + 10 numbered clauses (1 Acceptance, 2 Demonstration Service Not a Real Bank, 3 Accounts & Credentials, 4 Acceptable Use, 5 Open-Source Licensing & IP, 6 Sandbox Data, 7 Disclaimer of Warranty aligned to MPL-2.0 §6, 8 Limitation of Liability, 9 Changes, 10 Contact). Component ids realigned to shipped test tags (added tos_demo_service_card, tos_licensing_card, tos_warranty_card, tos_changes_card, tos_contact_card; dropped tos_dispute_card, tos_governing_law_card). Removed: loading skeleton (tos_loading_skeleton), error+retry (tos_error_state/tos_retry_button), scroll tracking, TermsOfServiceViewModel state_model — screen does no network."
  - from: enriched
