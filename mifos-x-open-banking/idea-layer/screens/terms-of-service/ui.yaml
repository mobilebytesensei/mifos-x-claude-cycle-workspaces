screens:
  - id: terms-of-service
    name: "Terms of Service"
    route: /legal/terms

archetype: settings

shell:
  top_app_bar:
    show: true
    title: "Terms of Service"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: tos_root
    variant: vertical
    style:
      background: background
      padding: spacing.lg
    children:
      - tos_intro_card
      - tos_acceptance_card
      - tos_demo_service_card
      - tos_account_usage_card
      - tos_prohibited_card
      - tos_licensing_card
      - tos_data_handling_card
      - tos_warranty_card
      - tos_liability_card
      - tos_changes_card
      - tos_contact_card
      - tos_last_updated_text

  # ── Agreement Overview ────────────────────────────────────────────────────────

  - type: card
    id: tos_intro_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_intro_header
      - tos_intro_body

  - type: text
    id: tos_intro_header
    content: "Agreement Overview"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Agreement Overview"
    test_context:
      purpose: "Section header for the agreement overview"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_intro_body
    content: "These Terms of Service govern your use of Mifos X Open Banking, an open-source UK Open Banking reference client built by the Mifos Initiative community against the HSBC UK Open Banking sandbox. Please read them carefully: they explain what this app is, what it is not, and the rules that apply when you use it."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Agreement overview text"
    test_context:
      purpose: "Un-numbered overview paragraph summarising the terms agreement"
      interaction_type: display
      data_driven: false

  # ── 1. Acceptance of Terms ────────────────────────────────────────────────────

  - type: card
    id: tos_acceptance_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_acceptance_header
      - tos_acceptance_body

  - type: text
    id: tos_acceptance_header
    content: "1. Acceptance of Terms"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "1. Acceptance of Terms"
    test_context:
      purpose: "Section header for acceptance clause"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_acceptance_body
    content: "By installing the app, granting it an Open Banking consent at your bank, or otherwise using Mifos X Open Banking, you confirm that you have read, understood, and agree to be bound by these terms. If you do not agree, do not use the app. If you use the app on behalf of an organisation, you confirm that you are authorised to accept these terms for that organisation."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Acceptance of terms"
    test_context:
      purpose: "Acceptance clause covering install, sign-in and organisational authority"
      interaction_type: display
      data_driven: false

  # ── 2. A Demonstration Service, Not a Real Bank ───────────────────────────────

  - type: card
    id: tos_demo_service_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_demo_service_header
      - tos_demo_service_body

  - type: text
    id: tos_demo_service_header
    content: "2. A Demonstration Service, Not a Real Bank"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "2. A Demonstration Service, Not a Real Bank"
    test_context:
      purpose: "Section header clarifying the app is a demo, not a real bank"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_demo_service_body
    content: "Mifos X Open Banking is a reference application. It is not a bank and never holds or safeguards money — your bank executes every payment and applies its own checks first. Every account, balance, transaction, and payee shown in the app is synthetic data from the HSBC UK Open Banking sandbox. Sandbox data may be reset, changed, or deleted at any time without notice, and no balance shown in the app is covered by any deposit guarantee scheme."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Demonstration service disclaimer"
    test_context:
      purpose: "States the app is a sandbox demo with synthetic data and no deposit guarantee"
      interaction_type: display
      data_driven: false

  # ── 3. Accounts and Credentials ───────────────────────────────────────────────

  - type: card
    id: tos_account_usage_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_account_usage_header
      - tos_account_usage_body

  - type: text
    id: tos_account_usage_header
    content: "3. Accounts and Credentials"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "3. Accounts and Credentials"
    test_context:
      purpose: "Section header for account and credential terms"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_account_usage_body
    content: "Access is granted by the consent you approve at your bank. This app has no account and no password field — it will never ask for your banking credentials, and if any app claiming to be an Open Banking provider does, that is not how the standard works. Keep your banking credentials confidential and tell your bank promptly if you suspect they have been compromised. You can revoke this app's access at any time, from within the app or from your bank."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Accounts and credentials terms"
    test_context:
      purpose: "Sandbox credential confidentiality and no-real-password-reuse obligations"
      interaction_type: display
      data_driven: false

  # ── 4. Acceptable Use ─────────────────────────────────────────────────────────

  - type: card
    id: tos_prohibited_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_prohibited_header
      - tos_prohibited_body

  - type: text
    id: tos_prohibited_header
    content: "4. Acceptable Use"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "4. Acceptable Use"
    test_context:
      purpose: "Section header for acceptable-use rules"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_prohibited_body
    content: "You agree not to: (a) attack, overload, or attempt to circumvent the security controls or rate limits of the HSBC Open Banking sandbox; (b) attempt to access accounts or data your consent does not cover; (c) present the app or its synthetic data as a real banking service in order to mislead anyone; (d) introduce malicious code into the app or its backing services; or (e) use the app for any unlawful purpose."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Acceptable use list"
    test_context:
      purpose: "Enumerated acceptable-use prohibitions for the sandbox client"
      interaction_type: display
      data_driven: false

  # ── 5. Open-Source Licensing and Intellectual Property ────────────────────────

  - type: card
    id: tos_licensing_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_licensing_header
      - tos_licensing_body

  - type: text
    id: tos_licensing_header
    content: "5. Open-Source Licensing and Intellectual Property"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "5. Open-Source Licensing and Intellectual Property"
    test_context:
      purpose: "Section header for MPL-2.0 licensing and IP"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_licensing_body
    content: "The source code of Mifos X Open Banking is licensed under the Mozilla Public License, v. 2.0. A copy of the MPL is available at https://mozilla.org/MPL/2.0/. Your rights to use, modify, and redistribute the code are granted by that license rather than by these terms. The Mifos name and logo remain marks of the Mifos Initiative, and bundled third-party components remain subject to their own licenses. Use of the bank's Open Banking APIs is additionally subject to HSBC's developer terms."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Open-source licensing and IP clause"
    test_context:
      purpose: "MPL-2.0 license grant, marks, and third-party component licensing"
      interaction_type: display
      data_driven: false

  # ── 6. Sandbox Data ───────────────────────────────────────────────────────────

  - type: card
    id: tos_data_handling_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_data_handling_header
      - tos_data_handling_body

  - type: text
    id: tos_data_handling_header
    content: "6. Sandbox Data"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "6. Sandbox Data"
    test_context:
      purpose: "Section header for sandbox data handling"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_data_handling_body
    content: "Anything you enter into the app — a payee's details, an amount, a payment reference — is sent to the sandbox and should be treated as non-confidential test data. Do not enter real personal details, real account numbers, or real payment credentials. Periodic sandbox resets permanently remove stored data, and the maintainers cannot recover anything lost in a reset. How the app handles the limited data it does process is described in the Privacy Policy."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Sandbox data handling clause"
    test_context:
      purpose: "Treats entered data as non-confidential test data, references Privacy Policy"
      interaction_type: display
      data_driven: false

  # ── 7. Disclaimer of Warranty ─────────────────────────────────────────────────

  - type: card
    id: tos_warranty_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_warranty_header
      - tos_warranty_body

  - type: text
    id: tos_warranty_header
    content: "7. Disclaimer of Warranty"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "7. Disclaimer of Warranty"
    test_context:
      purpose: "Section header for the warranty disclaimer"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_warranty_body
    content: "The app and the sandbox services behind it are provided \"as is\" and \"as available\", without warranty of any kind, whether express, implied, or statutory. This includes, without limitation, any warranty of merchantability, fitness for a particular purpose, availability, or accuracy of data, and mirrors the warranty disclaimer in Section 6 of the MPL-2.0."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Disclaimer of warranty clause"
    test_context:
      purpose: "As-is warranty disclaimer aligned with MPL-2.0 Section 6"
      interaction_type: display
      data_driven: false

  # ── 8. Limitation of Liability ────────────────────────────────────────────────

  - type: card
    id: tos_liability_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_liability_header
      - tos_liability_body

  - type: text
    id: tos_liability_header
    content: "8. Limitation of Liability"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "8. Limitation of Liability"
    test_context:
      purpose: "Section header for liability limitation"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_liability_body
    content: "To the maximum extent permitted by applicable law, the Mifos Initiative and the project contributors are not liable for any indirect, incidental, special, consequential, or punitive damages, or for any loss of data, arising from your use of this reference app. Because the app never holds funds and every payment is executed by the bank, no claim can arise for monetary loss in respect of sandbox balances or transactions."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Limitation of liability clause"
    test_context:
      purpose: "Liability exclusions scoped to a no-real-funds demonstration app"
      interaction_type: display
      data_driven: false

  # ── 9. Changes to These Terms ─────────────────────────────────────────────────

  - type: card
    id: tos_changes_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_changes_header
      - tos_changes_body

  - type: text
    id: tos_changes_header
    content: "9. Changes to These Terms"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "9. Changes to These Terms"
    test_context:
      purpose: "Section header for changes to the terms"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_changes_body
    content: "These terms may be revised as the demonstration evolves. Material changes are announced in the app and in the project repository, and the version stamp at the bottom of this screen is updated with each revision. Continuing to use the app after a revision takes effect constitutes acceptance of the revised terms."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Changes to terms clause"
    test_context:
      purpose: "How revisions are announced and what continued use signifies"
      interaction_type: display
      data_driven: false

  # ── 10. Contact ───────────────────────────────────────────────────────────────

  - type: card
    id: tos_contact_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - tos_contact_header
      - tos_contact_body

  - type: text
    id: tos_contact_header
    content: "10. Contact"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "10. Contact"
    test_context:
      purpose: "Section header for contact details"
      interaction_type: display
      data_driven: false

  - type: text
    id: tos_contact_body
    content: "Questions about these terms are welcome through the Mifos Initiative community at mifos.org, by opening an issue on the project's GitHub repository, or by emailing legal@mifos.org. The community aims to respond within ten working days."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Contact details for terms questions"
    test_context:
      purpose: "Community contact path for terms questions"
      interaction_type: display
      data_driven: false

  # ── Last Updated Footer ───────────────────────────────────────────────────────

  - type: text
    id: tos_last_updated_text
    content: "Last updated: 28 May 2026 — Version 1.0"
    variant: body_small
    style:
      typography: bodySmall
      color: onSurfaceVariant
      alignment: center
      padding_top: spacing.md
      padding_bottom: spacing.xl
    a11y:
      role: text
      label: "Terms last updated 28 May 2026 version 1.0"
    test_context:
      purpose: "Version stamp so users know when terms were last revised"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: content
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - tos_intro_card
      - tos_acceptance_card
      - tos_demo_service_card
      - tos_account_usage_card
      - tos_prohibited_card
      - tos_licensing_card
      - tos_data_handling_card
      - tos_warranty_card
      - tos_liability_card
      - tos_changes_card
      - tos_contact_card
      - tos_last_updated_text

state_model:
  type: static_content
  note: "Static @Composable TermsOfServiceScreen(onBack, modifier). No ViewModel, no DI, no repository, no events, no network. The clauses are the compile-time constant tosSections (an un-numbered Agreement Overview followed by ten numbered TosSection entries) rendered verbatim inside a vertical scroll, closed by a last-updated stamp. No loading/error/empty states — content can never fail to load. Back navigation icon invokes the onBack lambda."

navigation:
  - id: nav_back
    target: about
    note: "Back navigation icon → onBack lambda (returns to the Settings entry point)"

dependencies:
  tier: feature
  features: [shared-core]
