# ── State index (added 2026-08-02 via /idea-data) ────────────────────────────
# Coverage was already complete via empty_scenario / error_scenario. Uniform index added.
states:
  - { scope: content, accountId: accountId, statements: statements }
  - { scope: loading, statements: statements }
  - { scope: empty,   fixture: empty_scenario }
  - { scope: error,   fixture: error_scenario, recoverable: false,
      _note: "401 — re-authenticate, do not retry. A retry loop on an expired session never resolves." }
