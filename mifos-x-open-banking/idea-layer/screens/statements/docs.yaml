flow_ref: recurring-and-statements
description: >-
  Chronological statement list for a selected account. Each row shows a ViewModel-derived period label ('May 2026'),
  closing balance in GBP (from OBStatement2.StatementAmount[ClosingBalance]), formatted date range, and a PDF/CSV
  download icon. Tapping the row navigates to statement-detail; tapping the download icon requests GET
  /statements/{id}/file via platform file handler.
has_ui: true
has_server: false
# NOT has_offline_cache despite cache_strategy: memory_lru — in-memory eviction is not
# offline read. That capability demands a stale-data indicator and conflict resolution.
capabilities: [has_ui, has_api, has_flow]
metadata:
  category: crud
  implementation_ready: true
  impl_ready_at: '2026-06-29'
  impl_ready_schema: v2
contracts: []
libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
  - capability: datetime
    library: kotlinx-datetime
    version: 0.6.1
    targets:
      - android
      - ios
      - desktop
      - web
    usage: Derive human-readable period label and formatted date strings from ISO-8601 UTC timestamps in OBStatement2
vm_actions:
  - name: statements_load
    signature: 'suspend fun statementsLoad(accountId: String)'
    state_mutations:
      - uiState = StatementsUiState.Loading
      - uiState = StatementsUiState.Content(statements = derivedAndSortedList)
      - uiState = StatementsUiState.Empty
      - uiState = StatementsUiState.Error(message)
    side_effects:
      - GET /accounts/{accountId}/statements → OBReadStatement2
      - >-
        Map each OBStatement2 → StatementRowUiModel{periodLabel, closingBalanceFormatted, startDateFormatted,
        endDateFormatted}
      - Sort descending by StartDateTime
    error_handling:
      http_401: emit Error('Session expired. Please re-authenticate.')
      http_403: emit Error('Consent does not include ReadStatements.')
      http_429: emit Error('Too many requests. Please wait and retry.')
      network: emit Error(e.localizedMessage)
  - name: navigate_statement_detail
    signature: 'fun navigateToStatementDetail(statementId: String, accountId: String)'
    state_mutations: []
    side_effects:
      - NavController.navigate(StatementDetailRoute(statementId = statementId, accountId = accountId))
    error_handling: {}
  - name: retry_load
    signature: 'suspend fun retryLoad(accountId: String)'
    state_mutations:
      - delegates to statementsLoad(accountId)
    side_effects: []
    error_handling: {}
  - name: download_statement
    signature: 'suspend fun downloadStatement(statementId: String, accountId: String)'
    state_mutations:
      - downloadState[statementId] = DownloadState.InProgress
      - downloadState[statementId] = DownloadState.Idle (on success or error)
    side_effects:
      - GET /accounts/{accountId}/statements/{statementId}/file → ByteArray
      - 'On success: dispatch bytes to platform file handler (ShareSheet / Downloads)'
      - 'On HTTP 501: emit toast strings.statements.download.toast_unavailable'
      - 'On other error: emit toast strings.statements.download.toast_error'
    error_handling:
      http_501: 'toast: Statement download not available for this account type'
      http_401: emit Error — token refresh required before retry
      network: 'toast: strings.statements.download.toast_error'
error_cases:
  - code: HTTP_401
    description: PSU access token expired; re-authentication required.
  - code: HTTP_403
    description: Consent scope does not include ReadStatements (ReadStatementsDetail).
  - code: HTTP_429
    description: HSBC AIS rate limit exceeded; surface Retry with back-off hint.
  - code: HTTP_501
    description: Statement file download not supported for this account/statement type by HSBC sandbox.
  - code: NETWORK_ERROR
    description: Device offline or AIS endpoint unreachable.
ui_model:
  StatementRowUiModel:
    StatementId: string
    StatementReference: string
    periodLabel: string — e.g. 'May 2026'; derived from StartDateTime
    closingBalanceFormatted: string — e.g. '£2,847.63'; from StatementAmount[?Type=='ClosingBalance']
    startDateFormatted: string — e.g. '1 May 2026'
    endDateFormatted: string — e.g. '31 May 2026'
