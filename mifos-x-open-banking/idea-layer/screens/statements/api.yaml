sibling: api
schema_version: "4.0"
feature_id: statements

screen_id: statements

endpoints:
  - id: statements
    method: GET
    path: "/accounts/{AccountId}/statements"
    response_dto: StatementPeriod
    permission: ReadStatementsDetail
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns all statements for the account. Uses ReadStatementsDetail permission so StatementAmount (OpeningBalance, ClosingBalance) is included in each OBStatement2 record."

  - id: statement_file
    method: GET
    path: "/accounts/{AccountId}/statements/{StatementId}/file"
    response_dto: null
    permission: ReadStatementsDetail
    requires_auth: true
    path_params:
      AccountId: string
      StatementId: string
    headers:
      Accept: "application/pdf, text/csv"
    notes: "Downloads the statement document as PDF or CSV. HSBC sandbox may return 501 Not Implemented for certain account types — surface as statements.download.toast_unavailable toast and do not retry automatically."
    # ── ADDED 2026-08-07: collection audit ──
    not_in_hsbc_collection:
      finding: >-
        This endpoint appears NOWHERE in HSBC's shipped Postman collection. The UK Personal
        Account Information Sharing folder ships exactly three statement calls:
        /statements, /statements/{StatementId}, and /statements/{StatementId}/transactions.
        There is no /file on any of the ten brand folders.
      status: obie-standard-but-unshipped
      reading: >-
        It IS in the OBIE v4.0 AIS standard, so specifying it is not an invention — but HSBC did
        not publish it, and no capture in the corpus exercises it. Treat as UNVERIFIED against
        HSBC specifically.
      consequence: >-
        The existing 501 note is the right instinct and should be treated as the LIKELY path,
        not an edge case. Do not build a download affordance that assumes success; the graceful
        unavailable state is the primary case until someone probes it.
      to_establish: "One authenticated call against a real StatementId settles it."
