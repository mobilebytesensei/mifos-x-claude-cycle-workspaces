sibling: tests
schema_version: "4.0"
feature_id: statements

screen_id: statements

scenarios:
  - id: TC-STMTS-001
    description: "Statement list loads and renders 6 rows for account 40051512345678"
    state: content
    priority: critical
    given: "Valid PSU access token; HSBC sandbox returns 6 statements (Dec 2025 – May 2026) for account 40051512345678"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Six statement rows render sorted descending by StartDateTime (May 2026 first)"
      - "Each row headline shows derived period label (e.g. 'May 2026')"
      - "Each row supporting text shows 'Closing balance: £2,847.63' for MAY-2026-STMT"
      - "Each row trailing shows formatted date range (e.g. '1 May 2026 – 31 May 2026')"
      - "Each row has a download icon button"

  - id: TC-STMTS-002
    description: "Skeleton loading state shown while statement list is fetched"
    state: loading
    priority: critical
    given: "Slow network; API call in flight"
    when: "Screen mounts"
    then:
      - "Skeleton list with 3 shimmer rows visible"
      - "Statement list not rendered"
      - "Accessibility label 'Loading statement list' announced"

  - id: TC-STMTS-003
    description: "Error state with Retry button on 401 token expired"
    state: error
    priority: critical
    given: "Access token is expired; statements endpoint returns HTTP 401"
    when: "Screen mounts"
    then:
      - "Error state renders with error_outline icon"
      - "Title 'Could not load statements' visible"
      - "Error message 'Session expired. Please re-authenticate.' visible"
      - "Retry button visible and labelled 'Retry'"
      - "Tapping Retry re-triggers retry_load which delegates to statementsLoad(accountId)"

  - id: TC-STMTS-004
    description: "Empty state when no statements returned"
    state: empty
    priority: normal
    given: "HSBC returns OBReadStatement2 with empty Data.Statement[] for this account"
    when: "Screen mounts"
    then:
      - "Empty state renders with description icon"
      - "Title 'No statements yet' visible"
      - "Body text explains statement history will appear once available"

  - id: TC-STMTS-005
    description: "Tap statement row navigates to statement-detail with correct params"
    state: content
    priority: critical
    given: "Statements list rendered in content state for account 40051512345678, including the 'May 2026' row (MAY-2026-STMT)"
    when: "User taps the 'May 2026' (MAY-2026-STMT) row body"
    then:
      - "Navigates to statement-detail screen"
      - "statementId param = 'STMT-2026-05-40051512345678'"
      - "accountId param = '40051512345678'"

  - id: TC-STMTS-006
    description: "Closing balance displayed correctly on statement rows"
    state: content
    priority: normal
    given: "StatementAmount includes ClosingBalance entries for each statement"
    when: "Content state renders"
    then:
      - "MAY-2026-STMT row shows 'Closing balance: £2,847.63'"
      - "APR-2026-STMT row shows 'Closing balance: £2,610.40'"
      - "DEC-2025-STMT row shows 'Closing balance: £1,502.88'"

  - id: TC-STMTS-007
    description: "Download icon triggers statement file request for correct StatementId"
    state: content
    priority: normal
    given: "Statements list rendered in content state; the 'May 2026' row (MAY-2026-STMT) shows its download affordance"
    when: "User taps download icon on the 'May 2026' row"
    then:
      - "GET /accounts/40051512345678/statements/STMT-2026-05-40051512345678/file fires with Accept: application/pdf, text/csv"
      - "Row-tap navigation does NOT fire (event propagation stopped)"
      - "On success, platform file handler receives statement bytes"
      - "On HTTP 501 from HSBC, toast 'Statement download not available for this account' shown"

  - id: TC-STMTS-008
    description: "Error state on HTTP 429 rate-limit shows rate-limit message"
    state: error
    priority: normal
    given: "HSBC AIS returns HTTP 429 for statements endpoint"
    when: "Screen mounts"
    then:
      - "Error state renders with message 'Too many requests. Please wait and retry.'"
      - "Retry button visible"

  - id: TC-STMTS-009
    description: "Error state on HTTP 403 shows consent scope message"
    state: error
    priority: normal
    given: "Consent does not include ReadStatements; HSBC returns HTTP 403"
    when: "Screen mounts"
    then:
      - "Error state renders with message 'Consent does not include ReadStatements.'"
      - "Retry button visible"
