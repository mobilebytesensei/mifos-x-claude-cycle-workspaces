sibling: flow
schema_version: "4.0"
feature_id: licences

feature: licences
flow_ref: app-main

entry_points:
  - source: settings
    label: "About section -> 'Licences' row"
    source_binding: "settingsScreen(onNavigateToLicences = { navController.navigate(LicencesRoute) })"

transitions:
  - from: licences
    to: settings
    trigger: "Back navigation (top app bar leading icon)"
    source_binding: "licencesScreen(onBack = { navController.popBackStack() })"

# Moved verbatim from docs.yaml 2026-07-31 (CROSS_LEAK repair).
dependencies:
  tier: 2
  features:
    - "settings — parent screen; the only entry point"
  external: []
