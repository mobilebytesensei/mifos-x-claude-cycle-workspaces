sibling: data-flow
schema_version: "2.1.0"
feature_id: licences

screen_id: licences

on_mount:
  - trigger: read_bundled_licence
    description: "produceState(initialValue = \"\") reads Res.readBytes(\"files/mpl_licence.txt\") and decodes it to a String. The composable renders the empty initial value until the read completes."
    steps:
      - read_resource: "files/mpl_licence.txt"
        module: "feature/settings"
        store_as: licence
    on_loading: content   # no distinct loading state — body is simply empty
    on_success: content
    on_error: content     # source models no error surface; body stays empty

on_user_action: []

cache:
  strategy: none
  note: "Asset is compiled into the module. produceState re-reads it per composition; nothing is persisted."
