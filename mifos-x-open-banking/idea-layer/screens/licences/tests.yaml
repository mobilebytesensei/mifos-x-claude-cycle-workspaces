sibling: tests
schema_version: "4.0"
feature_id: licences

screen_id: licences

scenarios:
  - id: TC-LICENCES-001
    description: "Licences screen renders the bundled MPL text"
    state: content
    priority: critical
    given: "feature/settings Compose resource files/mpl_licence.txt is present in the build"
    when: "User navigates from settings -> About -> Licences"
    then:
      - "settings:licences:screen is displayed"
      - "The intro paragraph renders in titleMedium"
      - "settings:licences:list renders the decoded licence text in a monospace bodySmall block"
      - "The column scrolls vertically"

  - id: TC-LICENCES-002
    description: "Back navigation returns to settings"
    state: content
    priority: normal
    given: "Licences screen is displayed"
    when: "User taps the KptScaffold navigation icon"
    then:
      - "onBack fires popBackStack(), returning to the settings screen"

  - id: TC-LICENCES-003
    description: "Body is empty before the resource read resolves"
    state: content
    priority: normal
    given: "produceState has not yet completed Res.readBytes"
    when: "The screen first composes"
    then:
      - "settings:licences:list renders the empty-string initial value"
      - "No spinner or loading state is shown — source models none"
