known_gaps:
  - id: view-consents-noop
    severity: error
    description: "schedulePaymentGraph(onNavigateToConsents = {}) — 'View consents' does nothing (FR-047)."
  - id: load-error-retry-dispatches-staging
    severity: error
    description: "Accounts-load Error shows Retry wired to RetryStaging; RetryLoad is never dispatched, so retry after a load failure is dead (no payee/date) or stages without review (filled form)."
  - id: duplicated-form-code
    severity: warn
    description: "Near-copy of send-money (VM 899 vs 802 lines; Content, Review, Error, TestTags, strings, AmountRules, OfferedValues duplicated). Only the date section, AbandonAuthorisation and three extra error kinds differ; payments-standing-order repeats the copy."
  - id: hardcoded-date-format
    severity: warn
    description: "formatExecutionDate uses hardcoded English weekday/month name lists instead of locale-aware formatting or string resources."
  - id: silent-confirm-on-stale-date
    severity: info
    description: "If midnight passes between Review and Confirm and the chosen date becomes today, buildDraft() returns null and Confirm silently does nothing; the date is only cleared on the next OpenDatePicker."
  - id: date-refused-recovery-is-backstep
    severity: info
    description: "Change date dispatches BackStep (to the form) rather than opening the date picker directly."
  - id: orphan-strings
    severity: info
    description: "charges_bearer_recipient, review_bank_charge and protected_by strings are declared but never referenced; TestTag REVIEW_CHARGE_BEARER is declared but unused (the row is tagged REVIEW_CHARGE_ROW)."
