# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, empty, error]. This file held only the populated
# set plus the period/group bindings, so empty and error bound to nothing.
states:
  - scope: content
    transactions: all
    period: period
    group: group

  - scope: loading
    transactions: all
    _skeleton_note: "Loading mirrors the content layout block-for-block — same date-group headers, same row heights (STATE-002)."

  - scope: empty
    transactions: []
    period:
      totalCredit: "0.00"
      totalDebit: "0.00"
    message: "No transactions in this period."
    detail: "Try a different date range."
    _period_must_zero: >-
      The period strip is the trap here. An empty transaction list still showing the populated
      totalCredit / totalDebit would tell a customer they received £2,400.00 in a period with
      no transactions. The strip is DERIVED from the list and must zero with it.

  - scope: error
    error_type: TransactionsLoadFailed
    message: "Could not load your transactions"
    recovery: "Check your connection and try again."
    recoverable: true
    _stale_data_policy: >-
      On error the list clears rather than leaving the previous period's rows visible under a
      new date filter — consistent with the memory-only cache every consent-scoped screen uses.
