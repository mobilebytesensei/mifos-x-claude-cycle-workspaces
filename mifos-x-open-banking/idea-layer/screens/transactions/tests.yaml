sibling: tests
schema_version: "4.0"
feature_id: transactions

screen_id: transactions

scenarios:
  - id: TC-TXN-001
    description: "Transaction list loads and renders 10 transactions grouped by date"
    state: content
    given: "Valid PSU access token; HSBC sandbox returns 10 transactions for account 40051512345678 across booking dates 2026-06-23 to 2026-06-28"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Circular progress indicator replaced by transaction list"
      - "Transactions grouped by BookingDateTime date (5 date-group headers visible)"
      - "Each row shows TransactionInformation, Category chip, and signed amount with currency symbol"
      - "Credit amounts shown in primary colour; debit amounts in error colour"
      - "Period summary strip shows totalCredit=£2,400.00 and totalDebit=£1,394.04"

  - id: TC-TXN-002
    description: "Loading state shown while transactions fetch is in flight"
    state: loading
    given: "Slow network; API call in flight"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Circular progress indicator visible and centred"
      - "Transaction list, filter chips, search field, and summary strip not rendered"

  - id: TC-TXN-003
    description: "Error state with Retry button on 401 token expired"
    state: error
    given: "Access token expired; GET /accounts/{AccountId}/transactions returns HTTP 401"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Error state renders with error_outline icon and 'Could not load transactions' title"
      - "Body text reads 'Session expired. Please log in again.'"
      - "Retry button visible (error.recoverable=true)"
      - "Tapping Retry re-triggers transactions_load"

  - id: TC-TXN-004
    description: "Error state without Retry button on 403 consent withdrawn"
    state: error
    given: "PSU consent withdrawn; GET /accounts/{AccountId}/transactions returns HTTP 403"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Error state renders with body 'Access to transactions has been withdrawn.'"
      - "Retry button NOT visible (error.recoverable=false)"

  - id: TC-TXN-005
    description: "Empty state when no transactions match active filter"
    state: empty
    given: "User activates 'Money in' filter; account 40051512345678 has zero Credit transactions in current date range"
    when: "User taps 'Money in' chip"
    then:
      - "Empty state renders with receipt_long icon"
      - "'No transactions found' title visible"
      - "'Try adjusting your filters or date range.' body visible"
      - "'Clear filters' button visible"
      - "Tapping 'Clear filters' resets filter to all and transitions to content state"

  - id: TC-TXN-006
    description: "Money in filter shows only Credit transactions"
    state: content
    given: "Transactions loaded for account 40051512345678"
    when: "User taps 'Money in' chip"
    then:
      - "Only transactions with CreditDebitIndicator=Credit displayed"
      - "SALARY ACME LTD row visible"
      - "TESCO STORES row not visible"
      - "Period summary strip totalCredit updates to £2,400.00; totalDebit to £0.00"

  - id: TC-TXN-007
    description: "Money out filter shows only Debit transactions"
    state: content
    given: "Transactions loaded for account 40051512345678"
    when: "User taps 'Money out' chip"
    then:
      - "Only transactions with CreditDebitIndicator=Debit displayed"
      - "TESCO STORES row visible"
      - "SALARY ACME LTD row not visible"

  - id: TC-TXN-008
    description: "Search filters transactions by TransactionInformation text"
    state: content
    given: "Transactions loaded for account 40051512345678"
    when: "User types 'Tesco' in search field"
    then:
      - "Only 'TESCO STORES 3476 LONDON' row displayed"
      - "All other rows hidden"

  - id: TC-TXN-009
    description: "Tapping a transaction row navigates to transaction-detail with correct params"
    state: content
    given: "Transactions loaded; Tesco Stores row visible"
    when: "User taps TESCO STORES row"
    then:
      - "Navigates to transaction-detail with transactionId=TX-20260626-0001 and accountId=40051512345678"

  - id: TC-TXN-010
    description: "Pending transaction shows 'Pending' badge; booked rows show no badge"
    state: content
    given: "Transactions loaded; SPOTIFY AB row has Status=Pending"
    when: "Transaction list renders"
    then:
      - "'Pending' warning badge visible on SPOTIFY AB row"
      - "TESCO STORES, SALARY ACME LTD, and all other booked rows have no badge"
      - "Screen reader announces 'Pending' suffix in accessibility label for Spotify row"

  - id: TC-TXN-011
    description: "Load more button appears and appends next page when Links.Next present"
    state: content
    given: "First-page response for account 40051512345678 contains Links.Next URL with 10 transactions; second page has 5 more transactions and no Links.Next"
    when: "User taps 'Load more' button"
    then:
      - "Linear progress indicator appears at list bottom during next-page fetch"
      - "Load more button hidden while is_paginating=true"
      - "5 new transactions appended to existing list after second-page fetch completes"
      - "Load more button disappears after final page (Links.Next absent in second response)"
      - "Total list now shows 15 transactions"

  - id: TC-TXN-012
    description: "Date range filter re-fetches with ISO-8601 bounds; resets pagination cursor"
    state: content
    given: "Transactions loaded; pagination cursor next_link points to page 2"
    when: "User opens date range picker, selects 2026-06-01 to 2026-06-28, and confirms"
    then:
      - "GET /accounts/40051512345678/transactions called with fromBookingDateTime=2026-06-01T00:00:00Z and toBookingDateTime=2026-06-28T23:59:59Z"
      - "Previous next_link cursor reset to null before new fetch"
      - "Transaction list replaced with date-bounded results"
      - "has_next_page re-evaluated from new response"
