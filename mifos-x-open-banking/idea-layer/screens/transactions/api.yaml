sibling: api
schema_version: "4.0"
feature_id: transactions

screen_id: transactions

endpoints:
  - id: transactions
    method: GET
    path: "/accounts/{AccountId}/transactions"
    response_dto: TransactionsPage
    permission: ReadTransactionsDetail
    requires_auth: true
    network_policy: cellular_allowed
    # future: a "Load more only on Wi-Fi" settings toggle could gate pagination calls for users on limited data plans
    path_params:
      AccountId: string
    query_params:
      fromBookingDateTime:
        type: string
        format: date-time
        required: false
        description: "ISO-8601 lower bound for BookingDateTime filter (e.g. 2026-06-01T00:00:00Z)."
      toBookingDateTime:
        type: string
        format: date-time
        required: false
        description: "ISO-8601 upper bound for BookingDateTime filter (e.g. 2026-06-28T23:59:59Z)."
    response_shape:
      Data:
        Transaction:
          type: array
          items: OBTransaction6
          description: "Booked and pending transactions for the account within the optional date range."
      Links:
        Self:
          type: string
          description: "Absolute URL for the current page."
        Next:
          type: string
          nullable: true
          description: >
            Absolute URL for the next page of results. Absent (null) when no further pages exist.
            Client stores this as next_link state and uses it as the URL override for
            load_more_transactions trigger. Page size is HSBC-controlled (~100 transactions/page).
        Last:
          type: string
          nullable: true
          description: "Absolute URL for the final page of results."
      Meta:
        TotalPages:
          type: integer
          nullable: true
          description: "Total number of pages available for this account's transaction list."
    notes: >
      Returns booked and pending transactions for the account within the optional date range.
      Supports OBIE-standard Links.Next pagination cursor — the client stores Links.Next from
      each response as next_link state and presents a 'Load more' affordance when non-null.
      Credit/debit filtering and text search are applied client-side against the accumulated
      in-memory list. Date-range changes reset the pagination cursor and trigger a fresh
      first-page fetch.
