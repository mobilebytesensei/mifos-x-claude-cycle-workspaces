    feature_transactions_money_in: "Money in"
    feature_transactions_money_out: "Money out"
    feature_transactions_filter_all: "All"
    feature_transactions_filter_money_in: "Money in"
    feature_transactions_filter_money_out: "Money out"
    feature_transactions_filter_date_range: "Date range"
    feature_transactions_search_hint: "Merchant, reference…"
