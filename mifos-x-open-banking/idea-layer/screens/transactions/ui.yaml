known_gaps:
  - id: TX-G1
    severity: medium
    description: "Filters (direction, search, date range) run client-side over only the pages already loaded — a date range older than the loaded pages shows Empty instead of fetching; no fromBookingDateTime/toBookingDateTime query is sent to the bank."
  - id: TX-G2
    severity: medium
    description: "No offline cache: the screen calls repository.firstPage/nextPage directly; TransactionsRepository.transactionsStream (Store5 + Room table transactions) is unused here, so offline shows NETWORK error rather than cached rows (NFR-004)."
  - id: TX-G3
    severity: low
    description: "Load-more failures are silent — isPaginating resets and the button reappears with no message (by design per FR-009, but no user feedback)."
  - id: TX-G4
    severity: low
    description: "Pages 2+ are mapped with accountId = \"\" (nextPage → toPage(accountId = \"\")); harmless today because navigation uses state.accountId, but TransactionListItem.accountId is wrong for appended rows."
  - id: TX-G5
    severity: low
    description: "A row with a blank transactionId still navigates with transactionId = \"\" to TransactionDetailRoute."
  - id: TX-G6
    severity: low
    description: "Empty state always offers 'Clear filters' even when no filter is active (bank returned zero transactions)."
  - id: TX-G7
    severity: low
    description: "Unused strings: error_title, error_retry, error_consent_hint, error_status_* (status-code headline never rendered). SESSION_EXPIRED retry does not route to re-auth. A dead placeholder data object TransactionsRoute also exists in cmp-navigation BankingDestinations (name collision with the real TransactionsRoute(accountId))."
