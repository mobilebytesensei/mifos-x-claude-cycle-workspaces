  - feature_transactions_category_shopping
  - feature_transactions_category_transport
  - feature_transactions_category_transfer
  - feature_transactions_category_other
  - feature_transactions_credit_icon_description
  - feature_transactions_debit_icon_description
  - feature_transactions_empty_title
  - feature_transactions_empty_body
  - feature_transactions_clear_filters
