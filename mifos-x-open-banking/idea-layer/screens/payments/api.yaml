sibling: api
schema_version: "4.0"
feature_id: payments

# ─────────────────────────────────────────────────────────────────────────
# The payments hub makes NO API call.
#
# It is a routing surface: seven static tiles, each opening a type screen that owns its own
# wire contract. Declaring operations here would be wrong in two ways — it would imply the hub
# fetches something before it can render (it cannot fail, and has no loading state), and it
# would duplicate contracts that belong to the seven type features.
#
# This file exists so the sibling set is complete and so a reader looking for the hub's network
# behaviour finds an explicit "none" rather than an absent file.
# ─────────────────────────────────────────────────────────────────────────

operations: []

no_api_rationale:
  reason: "Pure navigation surface — static tile list known at compile time."
  consequence: >-
    has_api is deliberately ABSENT from this feature's capabilities. The hub declares
    has_ui + has_flow only.
  where_the_contracts_live:
    - feature: pay-domestic-single
      family: "v4.0/pisp/domestic-payment-consents -> domestic-payments"
    - feature: pay-domestic-scheduled
      family: "v4.0/pisp/domestic-scheduled-payment-consents -> domestic-scheduled-payments"
    - feature: pay-domestic-standing-order
      family: "v4.0/pisp/domestic-standing-order-consents -> domestic-standing-orders"
    - feature: pay-international-single
      family: "v4.0/pisp/international-payment-consents -> international-payments"
    - feature: pay-international-scheduled
      family: "v4.0/pisp/international-scheduled-payment-consents -> international-scheduled-payments"
    - feature: pay-international-standing-order
      family: "v4.0/pisp/international-standing-order-consents -> international-standing-orders"
    - feature: pay-vrp-mandate
      family: "v4.0/pisp/domestic-vrp-consents -> domestic-vrps (+ DELETE, + POST funds-confirmation)"
    - feature: payment-consent
      family: "shared authorise return leg — polls the originating family's consent-status GET"
    - feature: payment-status
      family: "shared tracker — reads the originating family's resource-status GET"
