sibling: tests
schema_version: "4.0"
feature_id: payments

feature: payments
scenario_count: 6

scenarios:
  - id: TC-PAY-HUB-001
    priority: p0
    title: "The hub renders seven payment-type tiles"
    given: "The PSU is authenticated and selects the Pay tab"
    when: "The payments hub renders"
    then:
      - "Exactly seven grid_item tiles are present"
      - "Each carries a label and a one-line description"
      - "The tiles appear in the declared order: three domestic, three international, then VRP"
    asserts:
      - "onNodeWithTag(\"payments:typeGrid\").onChildren().assertCountEquals(7)"
    rationale: >-
      Seven is the number of payment types HSBC ships for UK Personal. A tile count that drifts
      means either a type was dropped or an unsupported one was invented.

  - id: TC-PAY-HUB-002
    priority: p0
    title: "Every tile resolves to an implemented route — no placeholders"
    given: "The payments hub is rendered"
    when: "Each of the seven tiles is tapped in turn"
    then:
      - "Each navigates to its declared route"
      - "No tap lands on a PlaceholderScreen"
    asserts:
      - "for each tile: onNodeWithTag(tag).performClick(); assert current route == declared route"
      - "assert no composable in the resulting hierarchy is PlaceholderScreen"
    rationale: >-
      The Pay tab spent a release cycle pointing at PlaceholderScreen(\"Pay\"). This is the
      regression guard for that class of defect, and the enforcement point for
      flow.yaml#navigation_invariant.

  - id: TC-PAY-HUB-003
    priority: p0
    title: "The hub issues no network call"
    given: "A network interceptor is recording all outbound requests"
    when: "The payments hub renders and is left idle for the poll interval of any other screen"
    then:
      - "Zero HTTP requests are made"
    asserts:
      - "assertEquals(0, recordedRequests.size)"
    rationale: >-
      The hub is a routing surface. A fetch here would give it a loading state and a failure
      mode it is specified not to have, and would be the first step toward a hub-level
      eligibility pre-check that data-flow.yaml#eligibility_deferral rules out.

  - id: TC-PAY-HUB-004
    priority: p0
    title: "All seven tiles stay enabled regardless of account eligibility"
    given: "The PSU holds only a credit card, which is refused as a debtor on every payment type"
    when: "The payments hub renders"
    then:
      - "All seven tiles are still present and enabled"
      - "No tile is greyed out, hidden, or marked unavailable"
    asserts:
      - "for each tile: assertIsEnabled()"
    rationale: >-
      Eligibility is a per-account scheme gate resolved at the debtor picker, not a per-PSU
      property the hub can evaluate. The research also showed the bank can nominate a debtor
      the TPP may not name, so a hub-level pre-check would hide routes that work. FR-018.

  - id: TC-PAY-HUB-005
    priority: p1
    title: "The amend notice is present"
    given: "The payments hub is rendered"
    when: "The screen is inspected below the grid"
    then:
      - "A notice states that an existing standing order or scheduled payment must be changed or cancelled in HSBC's own app"
    asserts:
      - "onNodeWithTag(\"payments:amendNotice\").assertIsDisplayed()"
    rationale: >-
      OBL's Customer Experience Guidelines make telling the PSU this a MANDATORY obligation,
      not a courtesy. Surfacing it on the hub puts it where a PSU is already thinking about
      recurring payments, rather than only after they have committed to one.

  - id: TC-PAY-HUB-006
    priority: p1
    title: "The grid reflows on a tablet width without distorting the tiles"
    given: "The viewport is at least 600dp wide"
    when: "The payments hub renders"
    then:
      - "The grid shows four columns"
      - "Tiles remain square (aspect ratio 1.0)"
      - "The page does not scroll horizontally"
    rationale: >-
      This app targets Android, iOS, desktop and web from one codebase, so the hub is the first
      payments surface a desktop user meets. Square tiles that stretch into rectangles read as
      a broken layout rather than a responsive one.
