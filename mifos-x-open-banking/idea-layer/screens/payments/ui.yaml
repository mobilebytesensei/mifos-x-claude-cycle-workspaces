sibling: ui
schema_version: "4.0"
feature_id: payments

id: payments
name: Payments
feature: payments
flavor: consumer
# RECONCILED 2026-08-07 (/idea-sync): was 0 — an unset scaffold default that was the ONLY
# top-level quality_score the matrix could see for this feature (docs.yaml carried `score: 86`
# and a nested metadata.quality_score, neither of which yaml_number_avg matches), so the
# payments hub reported 0/100. docs.yaml is the owner sibling; its 86 is the current value.
quality_score: 86
contract_version: "2.0.0"
capabilities:
  - has_ui

# ─────────────────────────────────────────────────────────────────────────
# Authored 2026-08-06 from the HSBC PISP-tests research corpus.
#
# Seven square tiles, three per row. Each tile is a distinct payment type with its own
# endpoint family and its own wire contract. Tapping a tile navigates; the hub itself makes
# no network call and holds no state beyond the tile list, which is static.
#
# The one-line description under each label is not decoration — it is the only place the PSU
# learns the difference between "scheduled" (one future date) and "standing order" (a
# recurring mandate) before committing to a form. Those two are the pair users confuse.
# ─────────────────────────────────────────────────────────────────────────

screens:
  - id: payments
    name: Payments
    archetype: dashboard
    shell:
      top_bar:
        title: "{strings.payments.title}"
        navigation_icon: none
        actions: []
      bottom_nav: true
    note: "Landing destination of the Pay tab (bottom-nav order 2), so the bottom bar stays visible."

components:
  - type: text
    id: hub_heading
    label: "How do you want to pay?"
    content: "{strings.payments.heading}"
    style:
      typography: titleMedium
      color: onSurface
    a11y:
      label: "{strings.payments.heading}"
      role: header
    test_context:
      tag: payments:heading

  - type: grid
    id: payment_type_grid
    label: "Payment types"
    columns: 3
    item_aspect_ratio: 1.0
    gap: 12
    a11y:
      label: "{strings.payments.grid_a11y}"
      role: list
    test_context:
      tag: payments:typeGrid
    note: >-
      Three columns on the 390dp baseline. Seven items means row 3 holds a single tile,
      left-aligned rather than centred, so the grid reads as a grid and not as a centred
      feature block.

  # ── The seven tiles ────────────────────────────────────────────────────
  # Each renders as a square card: icon, short label, one-line description.
  # `navigates_to` is the binding /kmp-implement generates the NavHost edge from.

  - type: grid_item
    id: tile_domestic_single
    parent: payment_type_grid
    icon: payments
    label: "{strings.payments.tile.domestic_single.label}"
    description: "{strings.payments.tile.domestic_single.description}"
    navigates_to: pay-domestic-single
    a11y:
      label: "{strings.payments.tile.domestic_single.a11y}"
      role: button
    test_context:
      tag: payments:tileDomesticSingle
    action_contract:
      on_click: OpenPaymentType(DOMESTIC_SINGLE)
      effect: "navigate to pay-domestic-single"
      writes_to: navigation

  - type: grid_item
    id: tile_domestic_scheduled
    parent: payment_type_grid
    icon: event
    label: "{strings.payments.tile.domestic_scheduled.label}"
    description: "{strings.payments.tile.domestic_scheduled.description}"
    navigates_to: pay-domestic-scheduled
    a11y:
      label: "{strings.payments.tile.domestic_scheduled.a11y}"
      role: button
    test_context:
      tag: payments:tileDomesticScheduled
    action_contract:
      on_click: OpenPaymentType(DOMESTIC_SCHEDULED)
      effect: "navigate to pay-domestic-scheduled"
      writes_to: navigation

  - type: grid_item
    id: tile_domestic_standing_order
    parent: payment_type_grid
    icon: repeat
    label: "{strings.payments.tile.domestic_standing_order.label}"
    description: "{strings.payments.tile.domestic_standing_order.description}"
    navigates_to: pay-domestic-standing-order
    a11y:
      label: "{strings.payments.tile.domestic_standing_order.a11y}"
      role: button
    test_context:
      tag: payments:tileDomesticStandingOrder
    action_contract:
      on_click: OpenPaymentType(DOMESTIC_STANDING_ORDER)
      effect: "navigate to pay-domestic-standing-order"
      writes_to: navigation

  - type: grid_item
    id: tile_international_single
    parent: payment_type_grid
    icon: public
    label: "{strings.payments.tile.international_single.label}"
    description: "{strings.payments.tile.international_single.description}"
    navigates_to: pay-international-single
    a11y:
      label: "{strings.payments.tile.international_single.a11y}"
      role: button
    test_context:
      tag: payments:tileInternationalSingle
    action_contract:
      on_click: OpenPaymentType(INTERNATIONAL_SINGLE)
      effect: "navigate to pay-international-single"
      writes_to: navigation

  - type: grid_item
    id: tile_international_scheduled
    parent: payment_type_grid
    icon: public_off
    label: "{strings.payments.tile.international_scheduled.label}"
    description: "{strings.payments.tile.international_scheduled.description}"
    navigates_to: pay-international-scheduled
    a11y:
      label: "{strings.payments.tile.international_scheduled.a11y}"
      role: button
    test_context:
      tag: payments:tileInternationalScheduled
    action_contract:
      on_click: OpenPaymentType(INTERNATIONAL_SCHEDULED)
      effect: "navigate to pay-international-scheduled"
      writes_to: navigation

  - type: grid_item
    id: tile_international_standing_order
    parent: payment_type_grid
    icon: currency_exchange
    label: "{strings.payments.tile.international_standing_order.label}"
    description: "{strings.payments.tile.international_standing_order.description}"
    navigates_to: pay-international-standing-order
    a11y:
      label: "{strings.payments.tile.international_standing_order.a11y}"
      role: button
    test_context:
      tag: payments:tileInternationalStandingOrder
    action_contract:
      on_click: OpenPaymentType(INTERNATIONAL_STANDING_ORDER)
      effect: "navigate to pay-international-standing-order"
      writes_to: navigation

  - type: grid_item
    id: tile_vrp_mandate
    parent: payment_type_grid
    icon: all_inclusive
    label: "{strings.payments.tile.vrp.label}"
    description: "{strings.payments.tile.vrp.description}"
    navigates_to: pay-vrp-mandate
    a11y:
      label: "{strings.payments.tile.vrp.a11y}"
      role: button
    test_context:
      tag: payments:tileVrpMandate
    action_contract:
      on_click: OpenPaymentType(VRP_MANDATE)
      effect: "navigate to pay-vrp-mandate"
      writes_to: navigation
    note: >-
      The only tile that opens a LIST rather than a form — a VRP mandate is created once and
      reused, so the landing surface is the mandate roster, not a payment composer.

  - type: text
    id: amend_notice
    label: "Changing a recurring payment"
    content: "{strings.payments.amend_notice}"
    style:
      typography: bodySmall
      color: onSurfaceVariant
    a11y:
      label: "{strings.payments.amend_notice}"
      role: text
    test_context:
      tag: payments:amendNotice
    note: >-
      Sits below the grid. States that an existing standing order or scheduled payment must be
      changed or cancelled in HSBC's own app. This is the OBL Customer Experience Guidelines
      obligation surfaced at the point a PSU is thinking about recurring payments, rather than
      only after they have already created one. The per-type screens carry it too.

responsive:
  mobile_only: false
  baseline_width: 390
  breakpoints:
    - min_width: 600
      columns: 4
      note: "Tablet and desktop widen the grid to 4 columns; the tiles stay square."

states:
  initial_state: content
  content:
    note: >-
      The only state. The tile list is static and known at compile time, so there is no
      loading, empty, error or unauthenticated variant — nothing here can fail. A PSU with no
      eligible accounts still sees all seven tiles and discovers the constraint inside the
      type screen, which is where the account picker lives.
    layout:
      visible_components:
        - hub_heading
        - payment_type_grid
        - tile_domestic_single
        - tile_domestic_scheduled
        - tile_domestic_standing_order
        - tile_international_single
        - tile_international_scheduled
        - tile_international_standing_order
        - tile_vrp_mandate
        - amend_notice

state_model:
  view_model: PaymentsViewModel
  ui_state_type: PaymentsUiState
  states:
    - Content
  reached_by: "Pay tab selection in the authenticated NavHost"
  actions:
    - OpenPaymentType
  events:
    - NavigateToPaymentType
  nav_params: []
  di: []
  di_note: >-
    Injects nothing. The hub makes no network call and reads no repository — a ViewModel is
    declared only to keep navigation events off the composable, matching the app's MVI shape.

dependencies:
  tier: feature
  features:
    - pay-domestic-single
    - pay-domestic-scheduled
    - pay-domestic-standing-order
    - pay-international-single
    - pay-international-scheduled
    - pay-international-standing-order
    - pay-vrp-mandate
