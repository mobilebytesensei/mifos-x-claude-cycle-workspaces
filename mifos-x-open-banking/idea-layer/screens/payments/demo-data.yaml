      charge_at_staging: "none until the resource is created, then 0.50"

    - id: VRP_MANDATE
      order: 7
      icon: all_inclusive
      label: "Variable payments"
      description: "Set limits once, pay any amount within them"
      route: pay-vrp-mandate
      family: domestic-vrp
      funds_confirmation: "POST"
      charge_at_staging: "0.05 GBP per payment"

# ─────────────────────────────────────────────────────────────────────────
# COPY NOTES
# ─────────────────────────────────────────────────────────────────────────
# The labels avoid OBIE jargon on purpose. A PSU does not know what "domestic single payment"
# means; they know "pay someone". The one-line descriptions do the disambiguating work,
# because the pair users genuinely confuse is scheduled-versus-standing-order, and "on a
# future date" against "repeating" separates them in four words.
#
# "Variable payments" for VRP rather than "Variable Recurring Payments": the acronym is
# industry vocabulary with no consumer recognition, and the defining property a PSU cares
# about is the limit, not the recurrence. The description states the mechanism directly.
copy_rationale:
  jargon_policy: "consumer language on the tile, OBIE vocabulary in the type screen's detail"
  disambiguation_pair: "scheduled ('on a future date') vs standing order ('repeating')"
  vrp_naming: "'Variable payments' — the acronym has no consumer recognition"

# ─────────────────────────────────────────────────────────────────────────
# STATES — added 2026-08-07. ONE state, and that is a contract.
# ─────────────────────────────────────────────────────────────────────────
# This block previously did not exist. Its absence read as an oversight — every other feature
# in the project declares states here — when in fact the hub genuinely has exactly one.
# Stating it explicitly is the point: an empty section invites someone to "fix" it by adding
# loading and error variants that can never occur.
states:
  - scope: content
    payment_types: all
    note: >-
      The ONLY state. The tile list is static and known at compile time — the hub makes no
      network call and holds no state beyond these seven items. Matches ui.yaml#states
      (initial_state: content) and docs.yaml#statelessness_invariant, verified 2026-08-07.

_states_that_must_not_be_added:
  loading: "There is nothing to load. The tiles are compile-time constants."
  empty: "The list cannot be empty — seven tiles, always, for every PSU."
  error: "No call is made, so no call can fail."
  unauthenticated: >-
    The hub is behind the app's auth like every other authenticated screen, but it has no
    call that could return 401, so it has no auth FAILURE state of its own.
  eligibility_variant: >-
    Tempting and wrong. A PSU with no accounts eligible for a given rail still sees all seven
    tiles; the constraint surfaces inside the type screen, which is where the debtor picker
    lives (FR-018). Filtering tiles by eligibility here would hide a rail rather than explain
    why it is unavailable, and would require the hub to fetch accounts — breaking the
    statelessness invariant that is the whole reason this screen is cheap and cannot fail.

_stitch_note: >-
  /idea-feature-stitch reads docs, ui, api, flow and tests — NOT this file — so per-state
  mockup generation is driven by ui.yaml#states. This block exists for the preview renderer
  and for readers, and must stay in agreement with ui.yaml.
