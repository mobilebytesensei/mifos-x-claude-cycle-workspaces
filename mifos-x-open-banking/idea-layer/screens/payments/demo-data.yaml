sibling: demo-data
schema_version: "4.0"
feature_id: payments

# The hub fetches nothing, so there is no API fixture. What follows is the STATIC tile
# content — the seven-item list the grid renders — expressed as data so the preview renderer
# and the UI tests read the same labels the shipped screen will.

content:
  payment_types:
    - id: DOMESTIC_SINGLE
      order: 1
      icon: payments
      label: "Pay someone"
      description: "One payment, sent now"
      route: pay-domestic-single
      family: domestic-payment
      funds_confirmation: "GET"
      charge_at_staging: "0.05 GBP"

    - id: DOMESTIC_SCHEDULED
      order: 2
      icon: event
      label: "Pay on a date"
      description: "One payment, on a future date"
      route: pay-domestic-scheduled
      family: domestic-scheduled-payment
      funds_confirmation: none
      charge_at_staging: "0.05 GBP"

    - id: DOMESTIC_STANDING_ORDER
      order: 3
      icon: repeat
      label: "Standing order"
      description: "Same payment, repeating"
      route: pay-domestic-standing-order
      family: domestic-standing-order
      funds_confirmation: none
      charge_at_staging: "0.05 GBP"

    - id: INTERNATIONAL_SINGLE
      order: 4
      icon: public
      label: "Pay abroad"
      description: "One overseas payment, sent now"
      route: pay-international-single
      family: international-payment
      funds_confirmation: "GET"
      charge_at_staging: "none at any stage"

    - id: INTERNATIONAL_SCHEDULED
      order: 5
      icon: public_off
      label: "Pay abroad on a date"
      description: "One overseas payment, on a future date"
      route: pay-international-scheduled
      family: international-scheduled-payment
      funds_confirmation: none
      charge_at_staging: "none until the resource is created, then 0.50"

    - id: INTERNATIONAL_STANDING_ORDER
      order: 6
      icon: currency_exchange
      label: "Overseas standing order"
      description: "Same overseas payment, repeating"
      route: pay-international-standing-order
      family: international-standing-order
