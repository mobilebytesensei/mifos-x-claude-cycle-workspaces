sibling: flow
schema_version: "4.0"
feature_id: payments

feature: payments
flow_ref: payments-hub

entry_points:
  - source: app_shell_bottom_nav
    label: "Pay tab (bottom-nav order 2)"
    params: []
    notes: >-
      The Pay tab's landing destination. Replaces the SendMoneyRoute -> PlaceholderScreen("Pay")
      binding that has stood since the tab was wired in.

transitions:
  - from: payments
    to: pay-domestic-single
    trigger: "Tap the Domestic single tile"
    params: []

  - from: payments
    to: pay-domestic-scheduled
    trigger: "Tap the Domestic scheduled tile"
    params: []

  - from: payments
    to: pay-domestic-standing-order
    trigger: "Tap the Domestic standing order tile"
    params: []

  - from: payments
    to: pay-international-single
    trigger: "Tap the International single tile"
    params: []

  - from: payments
    to: pay-international-scheduled
    trigger: "Tap the International scheduled tile"
    params: []

  - from: payments
    to: pay-international-standing-order
    trigger: "Tap the International standing order tile"
    params: []

  - from: payments
    to: pay-vrp-mandate
    trigger: "Tap the VRP mandate tile"
    params: []
    notes: "Opens the mandate LIST, not a payment form — a VRP mandate is created once and reused."

# Every tile resolves to a real feature. There is deliberately no _placeholder: target here:
# a hub whose tiles lead nowhere is the exact defect RULE-IMPL-NAVIGATION-CONNECTED-001 and
# RULE-IMPL-DEAD-CLICKABLE-001 exist to catch, and the Pay tab has already spent a release
# cycle pointing at a placeholder.
navigation_invariant:
  rule: "Every one of the seven tiles must resolve to an implemented route."
  enforced_by: "TC-PAY-HUB-002"

dependencies:
  tier: feature
  features:
    - name: pay-domestic-single
      relation: child
      params: []
    - name: pay-domestic-scheduled
      relation: child
      params: []
    - name: pay-domestic-standing-order
      relation: child
      params: []
    - name: pay-international-single
      relation: child
      params: []
    - name: pay-international-scheduled
      relation: child
      params: []
    - name: pay-international-standing-order
      relation: child
      params: []
    - name: pay-vrp-mandate
      relation: child
      params: []
  libraries: []
