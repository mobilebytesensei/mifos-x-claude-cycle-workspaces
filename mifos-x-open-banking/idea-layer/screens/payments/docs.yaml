contracts: []
libraries: []

vm_actions:
  - name: OpenPaymentType
    signature: 'fun openPaymentType(type: PaymentType)'
    state_mutations: []
    side_effects:
      - "Emits a navigation event to the route bound to `type`"
    error_handling: {}
    notes: >-
      PaymentType is a seven-value enum. The hub holds no other state — it is pure navigation,
      which is why this feature declares has_ui + has_flow and nothing else.

error_cases: []
# No error cases and no error state, deliberately. Nothing here can fail — see statelessness_invariant.

# ── STATELESSNESS IS A CONTRACT, NOT AN ACCIDENT ─────────────────────────
statelessness_invariant:
  rule: >-
    The hub makes NO network call and holds NO state beyond the static seven-item tile list.
    The ViewModel injects nothing and exists only to keep navigation events off the composable.
  verified_at: "2026-08-07"
  consequences:
    - "The only state is `content`. There is no loading, empty, error or unauthenticated variant, and none must be added."
    - "Tiles are never hidden on eligibility grounds — the hub does not know which account will be chosen, and the eligibility rule depends on it. Hiding a tile would leave a PSU unable to discover why a type is unavailable. Enforced inside each type screen by the debtor-account picker filter (FR-018)."
    - "No status, balance or charge data reaches this screen, so none of the payment-status or payment-error traps apply here. That is why it can afford to be this simple."
  pressure_to_watch: >-
    The obvious future request is a recent-payees strip or a per-tile availability badge. Either
    would make this screen stateful and network-bound, and would import the whole eligibility
    problem into a surface that currently cannot fail. If one is wanted, it belongs in a new
    component with its own feature record, not folded in here.

