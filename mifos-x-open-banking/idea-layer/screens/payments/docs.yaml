description: >-
  Payments hub — the Pay bottom-nav tab's landing screen. A three-column grid of seven square
  tiles, one per HSBC UK Personal payment type. Each tile opens that type's own screen. This
  screen replaces the SendMoneyRoute -> PlaceholderScreen("Pay") placeholder and supersedes the
  old single send-money form, which described only the domestic single rail.
has_ui: true
has_server: false
capabilities: [has_ui, has_flow]

# ─────────────────────────────────────────────────────────────────────────
# WHY A HUB AND NOT A SINGLE FORM
# ─────────────────────────────────────────────────────────────────────────
# The seven types are not variations on one payment. They diverge in endpoint, mandatory
# fields, amount field NAME, creditor scheme, whether funds-confirmation exists and by which
# verb, status ladder, and charge model. Two of them refuse each other's amount field outright:
#
#   InstructedAmount on a domestic standing order   -> U005 Field is not expected
#   FirstPaymentAmount on an international standing order -> U005 Field is not expected
#
# Both directions were tested deliberately in round 15 of the PISP-tests corpus and both were
# refused, so the shapes are proven mutually exclusive rather than assumed so. A single
# parameterised form would have to hold seven contradictory contracts in one ViewModel.
#
# The hub is therefore the routing layer, and each type owns its own contract.
#
# ── THE FULL DIVERGENCE LIST — folded down from idea-plan.yaml 2026-08-07 ────────────────
# The two mutually-exclusive amount fields above are the sharpest case but not the only one.
# This rationale previously lived ONLY in idea-plan.yaml#scope_changes, where the screen that
# embodies it could not cite it. It is recorded here because the hub's entire justification is
# that these differences exist and cannot be parameterised away.
seven_tiles_not_one_form:
  divergences:
    - id: amount_field_is_mutually_exclusive
      finding: >-
        The amount field NAME differs by rail, and the two shapes refuse each other outright:
        InstructedAmount on a domestic standing order returns U005 "Field is not expected", and
        FirstPaymentAmount on an international standing order returns U005 likewise.
      evidence: "Both directions tested deliberately in round 15 (R15-E01, R15-E03). Proven mutually exclusive, not assumed."
    - id: international_refuses_the_reference_field
      finding: >-
        The international rails REFUSE RemittanceInformation with U005 and REQUIRE ChargeBearer
        and CurrencyOfTransfer, both of which the domestic rails do not take. Omitting ChargeBearer
        returns U004.
      consequence: >-
        A generic form cannot even render a consistent field set — the reference input that is
        normal on domestic must be ABSENT, not merely optional, on international.
    - id: funds_confirmation_is_not_universal
      finding: "Only the two SINGLE-payment rails have funds-confirmation. The four deferred families have none, and VRP's is a different verb entirely (a POST with an explicit amount, not a GET)."
      consequence: "The pre-submit step exists on some tiles and not others. There is no single review-then-confirm sequence to share."
    - id: vrp_inverts_nearly_every_assumption
      finding: >-
        The VRP consent stays AUTH forever and never reaches COND; one authorisation funds many
        payments; the landing surface is a mandate roster rather than a payment composer; and
        after DELETE the consent GET returns 400 U011 and can never report a revoked state.
      consequence: "Its screen is not a variant of the others. It is a different object with a different lifetime."
    - id: status_ladders_and_encodings_differ
      finding: "Seven families, FOUR status ladders, TWO status encodings, and different charge shapes per rail."
      reference: "dtos/ObPaymentStatus.yaml and dtos/ObPaymentError.yaml carry the contracts; they are not restated here."
  conclusion: >-
    A single parameterised form would have to hold seven contradictory contracts in one
    ViewModel, and would have to hide or rename fields based on a rail the PSU has not yet
    chosen. One screen per type is the shape the evidence dictates.

# ── THE HUB'S OWN VALUE ──────────────────────────────────────────────────
why_this_screen_earns_its_place:
  claim: >-
    This is the ONLY place a PSU sees the seven rails as distinct things. Every other surface in
    the app shows one rail at a time, after the choice has already been made.
  consequence: >-
    The one-line description under each tile is therefore not decoration — it is the only point
    in the journey where a PSU can tell "scheduled" (one future date) from "standing order" (a
    recurring mandate) BEFORE committing to a form whose contract they cannot back out of
    cheaply. That pair is the one users confuse.
  what_the_hub_must_not_become: >-
    A step. It is a destination the Pay tab lands on, not a wizard page — there is no Back to it
    and no state carried through it.

grid_rationale:
  tile_count: 7
  layout: "3-column grid; the seventh tile sits alone on row 3"
  ordering: >-
    Domestic rails first (single, scheduled, standing order), then the same three
    international rails, then VRP. Reading order matches the structural progression the
    research identified: instruction -> deferred instruction -> mandate, domestic before
    international, with VRP last because it is the only mutable mandate.
  eligibility_note: >-
    Tiles are NEVER hidden on eligibility grounds. Every tile is always tappable; eligibility
    is enforced inside each type screen by filtering the debtor-account picker (FR-018). Hiding
    a tile would leave a PSU unable to discover why a payment type is unavailable, and the
    eligibility rule depends on which account is chosen, which the hub does not know.

