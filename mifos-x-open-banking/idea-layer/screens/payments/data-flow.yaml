sibling: data-flow
schema_version: "2.1.0"
feature_id: payments

screen_id: payments

cache_strategy: none
cache_rationale: >-
  Nothing to cache. The tile list is a compile-time constant, not fetched state. Declaring a
  store here would create an empty Store5 instance that never fetches, which the G-STORE5
  sub-gate would correctly flag as a bookkeeper-unwired anti-pattern.
store_shape: none

on_mount: []

on_user_action:
  - trigger: open_domestic_single
    description: "Open the domestic single payment form."
    navigates_to: pay-domestic-single
    params: {}

  - trigger: open_domestic_scheduled
    description: "Open the domestic scheduled payment form."
    navigates_to: pay-domestic-scheduled
    params: {}

  - trigger: open_domestic_standing_order
    description: "Open the domestic standing order form."
    navigates_to: pay-domestic-standing-order
    params: {}

  - trigger: open_international_single
    description: "Open the international single payment form."
    navigates_to: pay-international-single
    params: {}

  - trigger: open_international_scheduled
    description: "Open the international scheduled payment form."
    navigates_to: pay-international-scheduled
    params: {}

  - trigger: open_international_standing_order
    description: "Open the international standing order form."
    navigates_to: pay-international-standing-order
    params: {}

  - trigger: open_vrp_mandate
    description: "Open the VRP mandate list."
    navigates_to: pay-vrp-mandate
    params: {}

# ─────────────────────────────────────────────────────────────────────────
# WHY THE HUB DOES NOT PRE-CHECK ELIGIBILITY
# ─────────────────────────────────────────────────────────────────────────
# It would be possible to read /accounts here and grey out tiles the PSU has no eligible
# debtor for. That is deliberately NOT done:
#
#   1. Eligibility is per-ACCOUNT, not per-PSU. The rule observed in the research is a scheme
#      gate — a UK.OBIE.SortCodeAccountNumber account is payable, a UK.OBIE.PAN account is
#      not — so the answer depends on which account the PSU picks, which the hub does not know.
#   2. The bank may nominate a debtor the TPP is forbidden to name. Global Money is refused
#      with U002 when a TPP names it domestically, yet the bank itself successfully nominated
#      it to fund payments on five of the seven families. A hub-level pre-check would hide a
#      route that actually works.
#   3. Greying out a tile with no explanation is worse than an explained refusal. The type
#      screen can say WHICH account is ineligible and why; the hub can only say "no".
#
# So the hub always shows seven live tiles, and FR-018 is enforced at the debtor picker.
eligibility_deferral:
  enforced_at: "each type screen's debtor-account picker"
  requirement_ref: FR-018
  rationale_ref: "captures/OBSERVATIONS.md — 'The debtor rule is scheme-based, not product-based'"
