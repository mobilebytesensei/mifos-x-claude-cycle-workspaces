      - about_version_value

  - type: text
    id: about_version_label
    content: "Version"
    variant: body_large
    style:
      typography: bodyLarge
      color: onSurface
    a11y:
      role: text
      label: "Version"
    test_context:
      purpose: "Label for the current app version row"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_version_value
    content: "1.0.0"
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
    a11y:
      role: text
      label: "Version 1.0.0"
    test_context:
      purpose: "Displays the appVersion parameter passed to AboutScreen (default 1.0.0)"
      interaction_type: display
      data_driven: true

  - type: divider
    id: about_divider_1
    style:
      color: surfaceVariant
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between version and license rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_license_row
    variant: horizontal
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
