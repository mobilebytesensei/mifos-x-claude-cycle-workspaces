      - about_mifos_body
      - about_openbanking_subheading
      - about_openbanking_body

  - type: text
    id: about_project_header
    content: "About this app"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "About this app"
    test_context:
      purpose: "Section header for the project description prose"
      interaction_type: display
      data_driven: false

  # ── SPEC AHEAD OF SOURCE, declared 2026-08-06 (/idea-sync, OBP eviction) ──
  # The status_history notes at the top of this file describe what SHIPPED: AboutScreen.kt
  # renders "Open Bank Project sandbox" attribution and links to openbankproject.com. The copy
  # below is the corrected OBIE text, so this screen's spec now deliberately LEADS source.
  #
  # This is user-facing copy naming the wrong backend — the app currently tells its users it
  # reads from a project it does not read from — so it is a real defect rather than cosmetic
  # drift. /kmp-implement owes three changes: this prose block, the section heading, and the
  # external link (openbankproject.com -> openbanking.org.uk, component id about_obp_link ->
  # about_openbanking_link).
  - type: text
    id: about_project_body
    content: "Mifos X Open Banking is an open-source UK Open Banking reference client. It shows how a modern mobile banking experience — accounts, transactions, and all seven payment types — can be built entirely on the OBIE standard, with every screen backed by your bank's own regulated Open Banking API rather than a proprietary core."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
    a11y:
      role: text
      label: "What this app is"
    test_context:
      purpose: "Prose describing what the app is and how it is built"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_mifos_subheading
    content: "The Mifos Initiative"
    variant: title_small
    style:
      typography: titleSmall
      color: onSurface
      padding_top: spacing.md
      padding_bottom: spacing.xs
    a11y:
      role: heading
      label: "The Mifos Initiative"
    test_context:
      purpose: "Subheading for the Mifos Initiative attribution"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_mifos_body
    content: "Built and maintained by the Mifos Initiative, a global community working to expand financial inclusion through open-source banking technology. The app is part of the Mifos X platform family and is published under the Mozilla Public License 2.0."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
    a11y:
      role: text
      label: "About the Mifos Initiative"
    test_context:
      purpose: "Prose attributing the app to the Mifos Initiative"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_openbanking_subheading
    content: "HSBC UK Open Banking sandbox"
    variant: title_small
    style:
      typography: titleSmall
      color: onSurface
      padding_top: spacing.md
      padding_bottom: spacing.xs
    a11y:
      role: heading
      label: "HSBC UK Open Banking sandbox"
    test_context:
      purpose: "Subheading for the HSBC UK Open Banking sandbox data-source attribution"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_openbanking_body
    content: "All account, transaction, and payee data shown in this app comes from the HSBC UK Open Banking sandbox — a test environment that exposes realistic banking data over the OBIE Read/Write API v4.0, the same standard every UK bank must offer. No real money moves and no real customer data is used."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
    a11y:
      role: text
      label: "About the HSBC UK Open Banking sandbox"
    test_context:
      purpose: "Prose explaining the OBIE sandbox data source"
      interaction_type: display
      data_driven: false

  # ── Legal & resources Card (EXTERNAL links) ───────────────────────────────────

  - type: card
    id: about_legal_card
    variant: filled
    supported_states: [idle]
    style:
