screens:
  - id: about
    name: "About"

archetype: settings

shell:
  top_app_bar:
    show: true
    title: "About"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: about_root
    variant: vertical
    style:
      background: background
      padding: spacing.lg
    children:
      - about_logo_section
      - about_app_info_card
      - about_project_card
      - about_legal_card
      - about_attribution

  # ── Logo / Identity Section ──────────────────────────────────────────────────

  - type: stack
    id: about_logo_section
    variant: vertical
    style:
      alignment: center
      padding_top: spacing.xl
      padding_bottom: spacing.xl
    children:
      - about_logo_image
      - about_app_name_text
      - about_tagline_text
      - about_version_inline

  - type: image
    id: about_logo_image
    content: "account_balance"
    label: "Mifos X logo"
    style:
      width: "80dp"
      height: "80dp"
      tint: primary
      alignment: center
      padding_bottom: spacing.sm
    a11y:
      role: image
      label: "Mifos X Open Banking logo"
    test_context:
      purpose: "App brand logo (AccountBalance icon on primaryContainer surface) at top of About screen"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_app_name_text
    content: "Mifos X Open Banking"
    variant: headline_small
    style:
      typography: headlineSmall
      color: primary
      alignment: center
      padding_bottom: spacing.xs
    a11y:
      role: heading
      label: "Mifos X Open Banking"
    test_context:
      purpose: "App name displayed below logo for identity context"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_tagline_text
    content: "Open Banking for Everyone"
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      alignment: center
    a11y:
      role: text
      label: "Open Banking for Everyone"
    test_context:
      purpose: "App tagline beneath the name for brand identity"
      interaction_type: display
      data_driven: false

  - type: text
    id: about_version_inline
    content: "Version 1.0.0"
    variant: label_medium
    style:
      typography: labelMedium
      color: onSurfaceVariant
      alignment: center
    a11y:
      role: text
      label: "Version 1.0.0"
    test_context:
      purpose: "Inline version label under the identity block; appVersion parameter passed by host (default 1.0.0)"
      interaction_type: display
      data_driven: true

  # ── App Info Card ─────────────────────────────────────────────────────────────

  - type: card
    id: about_app_info_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - about_app_info_header
      - about_version_row
      - about_divider_1
      - about_license_row
      - about_divider_2
      - about_platform_row

  - type: text
    id: about_app_info_header
    content: "App"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "App information"
    test_context:
      purpose: "Section header for the app metadata rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_version_row
    variant: horizontal
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
