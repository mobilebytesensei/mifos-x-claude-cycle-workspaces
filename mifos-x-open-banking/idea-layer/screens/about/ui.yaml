      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Legal and resources section"
    test_context:
      purpose: "Section header grouping the external resource link rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_mifos_link_row
    variant: horizontal
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
      - about_mifos_link
      - about_mifos_link_icon

  - type: link
    id: about_mifos_link
    label: "Mifos Initiative"
    variant: inline
    style:
      typography: bodyLarge
      color: onSurface
    on_click:
      action: open_external
      target: "https://mifos.org"
      intent: system
      action_contract:
        effect: share_external
        external_library_refs: ["compose.ui.platform.LocalUriHandler"]
        description: >-
          Hands mifos.org to the platform browser via compose.ui.platform.LocalUriHandler; leaves the
          app entirely, so no in-app back stack entry is created.
    a11y:
      role: link
      label: "Open Mifos Initiative website, mifos.org"
    keyboard:
      focusable: true
    test_context:
      purpose: "Opens mifos.org externally via LocalUriHandler"
      interaction_type: action
      data_driven: false

  - type: icon
    decorative: true   # the link label beside it already names the destination
    id: about_mifos_link_icon
    content: "open_in_new"
    variant: default
    style:
      color: onSurfaceVariant  # A11Y-002: outlineVariant is 1.62:1 on surface — invisible for a glyph that signals "opens externally". onSurfaceVariant is 8.93:1.
      size: "18dp"
    a11y:
      role: image
      label: ""
    test_context:
      purpose: "Trailing open-in-new affordance for the Mifos Initiative external link"
      interaction_type: display
      data_driven: false

  - type: divider
    id: about_divider_3
    style:
      color: surfaceVariant
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between resource link rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_openbanking_link_row
    variant: horizontal
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
      - about_openbanking_link
      - about_openbanking_link_icon

  - type: link
    id: about_openbanking_link
    label: "HSBC Open Banking developer portal"
    variant: inline
    style:
      typography: bodyLarge
      color: onSurface
    on_click:
      action: open_external
      target: "https://develop.hsbc.com"
      intent: system
      action_contract:
        effect: share_external
        external_library_refs: ["compose.ui.platform.LocalUriHandler"]
        description: >-
          Opens develop.hsbc.com in the platform browser via LocalUriHandler.

          Retargeted TWICE on 2026-08-06. First from openbankproject.com, which names a project
          this app does not read through. Then from openbanking.org.uk, which was ALSO wrong —
          it is not a host this app has any relationship with. develop.hsbc.com is the portal the
          HSBC Implementation Guide was actually fetched from, so it is the one attribution
          target that is both correct and verifiable.
    a11y:
      role: link
      label: "HSBC Open Banking developer portal, develop.hsbc.com"
    keyboard:
      focusable: true
    test_context:
      purpose: "Opens develop.hsbc.com externally via LocalUriHandler"
      interaction_type: action
      data_driven: false

  - type: icon
    decorative: true   # the link label beside it already names the destination
    id: about_openbanking_link_icon
    content: "open_in_new"
    variant: default
    style:
      color: onSurfaceVariant  # A11Y-002: outlineVariant is 1.62:1 on surface — invisible for a glyph that signals "opens externally". onSurfaceVariant is 8.93:1.
      size: "18dp"
    a11y:
      role: image
      label: ""
    test_context:
      purpose: "Trailing open-in-new affordance for the UK Open Banking external link"
      interaction_type: display
      data_driven: false

  - type: divider
    id: about_divider_4
    style:
      color: surfaceVariant
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between resource link rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_github_link_row
    variant: horizontal
    style:
      alignment: center_space_between
      padding_top: spacing.sm
      padding_bottom: spacing.sm
    children:
      - about_github_link
      - about_github_link_icon

  - type: link
    id: about_github_link
    label: "Source code on GitHub"
    variant: inline
    style:
      typography: bodyLarge
      color: onSurface
    on_click:
      action: open_external
      target: "https://github.com/openMF"
      intent: system
      action_contract:
        effect: share_external
        external_library_refs: ["compose.ui.platform.LocalUriHandler"]
        description: >-
          Opens the openMF GitHub organisation in the platform browser via
          compose.ui.platform.LocalUriHandler; source-availability disclosure required by the MPL
          notice below it.
    a11y:
      role: link
      label: "Open source code on GitHub, github.com/openMF"
    keyboard:
      focusable: true
    test_context:
      purpose: "Opens github.com/openMF externally via LocalUriHandler"
      interaction_type: action
      data_driven: false

  - type: icon
    decorative: true   # the link label beside it already names the destination
    id: about_github_link_icon
    content: "open_in_new"
    variant: default
    style:
      color: onSurfaceVariant  # A11Y-002: outlineVariant is 1.62:1 on surface — invisible for a glyph that signals "opens externally". onSurfaceVariant is 8.93:1.
      size: "18dp"
    a11y:
      role: image
      label: ""
    test_context:
      purpose: "Trailing open-in-new affordance for the GitHub external link"
      interaction_type: display
      data_driven: false

  - type: divider
    id: about_divider_5
    style:
      color: surfaceVariant
      margin_top: spacing.xs
      margin_bottom: spacing.xs
    a11y:
      role: separator
      label: "Divider"
    test_context:
      purpose: "Visual separator between resource link rows"
      interaction_type: display
      data_driven: false

  - type: stack
    id: about_mpl_link_row
    variant: horizontal
    style:
      alignment: center_space_between
      padding_top: spacing.sm
