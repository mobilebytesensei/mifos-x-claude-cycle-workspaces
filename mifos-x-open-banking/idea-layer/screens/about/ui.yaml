    a11y:
      role: link
      label: "Open Mozilla Public License 2.0, mozilla.org/MPL/2.0"
    keyboard:
      focusable: true
    test_context:
      purpose: "Opens mozilla.org/MPL/2.0 externally via LocalUriHandler"
