  - type: text
    id: about_license_label
    content: "License"
    variant: body_large
    style:
      typography: bodyLarge
      color: onSurface
    a11y:
      role: text
      label: "License"
    test_context:
      purpose: "Label for the license row"
      interaction_type: display
      data_driven: false

  - type: text
