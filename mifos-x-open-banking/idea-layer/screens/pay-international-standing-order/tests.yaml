sibling: tests
schema_version: "4.0"
feature_id: pay-international-standing-order

feature: pay-international-standing-order
scenario_count: 13

scenarios:
  - id: TC-PISO-001
    priority: p0
    title: "InstructedAmount is sent; FirstPaymentAmount and its siblings never are"
    given: "Any staged or submitted body"
    when: "The request is inspected"
    then:
      - "Data.Initiation.InstructedAmount is present"
      - "Data.Initiation.FirstPaymentAmount is absent"
      - "Data.Initiation.RecurringPaymentAmount is absent"
      - "Data.Initiation.FinalPaymentAmount is absent"
    rationale: >-
      The single field-level divergence from the domestic mandate, and the highest-value test in
      this file. Round 15 crossed the two rails in both directions and each refused the other's
      field with U005. Copying the domestic mandate screen and changing the endpoint — the
      natural implementation route — fails on every request. FR-019.

  - id: TC-PISO-002
    priority: p0
    title: "CurrencyOfTransfer and ChargeBearer are always present"
    given: "Any staged or submitted body"
    then:
      - "Data.Initiation.CurrencyOfTransfer is present"
      - "Data.Initiation.ChargeBearer is present"
    rationale: "Both mandatory on all three international shapes; U004 each if omitted."

  - id: TC-PISO-003
    priority: p0
    title: "No debtor step, no DebtorAccount sent, and an empty Risk"
    given: "The full flow from entry to submit"
    then:
      - "The stepper opens on Recipient, with five steps"
      - "No account picker is presented"
      - "Data.Initiation.DebtorAccount is absent from the staged body"
      - "Risk is the empty object {}"
      - "no_debtor_note does not claim the API lacks a debtor field"
    rationale: >-
      CORRECTED 2026-08-07. The wire assertions are unchanged; the REASON was wrong. DebtorAccount
      IS in the international standing-order schema — optional and accepted. Intl-SO scenarios
      staged 201 with a current account, with a savings account and with the key omitted, and
      19918 carried one as both debtor and creditor. If ever sent it takes { SchemeName,
      Identification } and NEVER a Name. This form omits it as a product simplification, so the
      copy must not assert a schema fact that is false. Risk {} is genuine — this rail carries
      neither CategoryPurposeCode nor PaymentContextCode, unlike the single and scheduled rails
      which carry EPAY in 25 of 25 scenarios.

  - id: TC-PISO-004
    priority: p0
    title: "No exchange rate is displayed anywhere"
    given: "Instructed currency GBP with transfer currency USD"
    when: "Every step of the flow is inspected"
    then:
      - "No exchange rate is rendered"
      - "No projected total across the mandate is rendered"
      - "No estimated per-instalment received amount is rendered"
    rationale: >-
      OBIE has NO per-execution FX model. HSBC calls FX quoting 'not applicable' for this family
      and never states what rate is used. Any figure would be a fabricated multi-month financial
      projection.

  - id: TC-PISO-005
    priority: p0
    title: "The rate-not-fixed notice is prominent"
    given: "The Amount and Review steps"
    then:
      - "fx_not_fixed_notice is displayed on both"
      - "Its severity is warning, not info"
    rationale: >-
      A PSU setting up a multi-month overseas mandate will otherwise assume the amount they see
      is the amount that leaves every month. This is the most important sentence on the screen.

  - id: TC-PISO-006
    priority: p1
    title: "The fee is 0.50 in the INSTRUCTED currency, shown only after creation"
    given: "GBP instructed with USD transfer"
    when: "The Review step renders, then the resource is created"
    then:
      - "At review the fee reads unknown and deferred_charge_note is displayed"
      - "After creation the fee shows 0.50 GBP, not 0.50 USD"
    rationale: >-
      Resource 19918 is the decisive case — the two currencies differ and the charge follows the
      instructed one. 19917 (USD -> USD) charged 0.50 USD, which alone would not distinguish the rule.

  - id: TC-PISO-007
    priority: p1
    title: "The frequency picker offers exactly five values"
    given: "The Schedule step"
    then:
      - "WEEK, FRTN, MNTH, QURT and YEAR are offered"
      - "DAIL is absent"
    rationale: >-
      All five are accepted on BOTH rails. DAIL is the one refusal tested internationally;
      ADHO, INDA and MIAN were refused domestically and never sent here, so their exclusion
      follows the domestic result rather than a direct observation.

  - id: TC-PISO-008
    priority: p1
    title: "INCO at creation is accepted and never rendered as paid"
    given: "A submit response with Status INCO"
    then:
      - "The disposition resolves without falling through to unknown"
      - "No rendered string contains 'paid', 'sent' or 'completed'"
      - "The status reads as the standing order being set up"
    rationale: "This rail never emits PDNG, and OBIE has no per-execution status on any deferred family."

  - id: TC-PISO-009
    priority: p2
    title: "No varying-amounts option is offered, and its absence is explained"
    given: "The Amount step"
    then:
      - "No varying-amounts switch is present"
      - "no_varying_amounts_note is displayed"
    rationale: >-
      RecurringPaymentAmount and FinalPaymentAmount are siblings of FirstPaymentAmount, which
      this rail refuses. The domestic mandate screen offers the switch, so its absence here would
      otherwise read as an oversight.

  - id: TC-PISO-010
    priority: p0
    title: "No fee before authorisation, and the fee row never reads zero"
    given: "A consent response that OMITS Charges, CutOffDateTime, ExpectedExecutionDateTime and ExpectedSettlementDateTime"
    when: "Review renders, the consent hands off, and the app returns before submit"
    then:
      - "Charges parses as null/absent, not as an empty collection"
      - "The fee row reads unknown at all three points"
      - "The fee row never renders as blank, '0.00', 'free' or 'no fee'"
      - "No copy states or implies whether the 0.50 recurs per execution"
    rationale: >-
      The charge first appears at RESOURCE CREATION — absent at AWAU and absent at AUTH — so a
      PISP structurally cannot show an international deferred fee before the PSU authorises. The
      four keys are ABSENT, not empty: a defaulted [] would render a 0.50 mandate as free at the
      step where the PSU consents to it. And nothing in the API says whether the charge repeats,
      so the screen must not answer that either way. FR-021.

  - id: TC-PISO-011
    priority: p1
    title: "An open-ended mandate is labelled as one"
    given: "The Schedule step with the end-date switch left off"
    when: "The Review step renders and the consent stages"
    then:
      - "FinalPaymentDateTime is absent from the staged body"
      - "The consent stages 201"
      - "open_ended_mandate_note is displayed on Review"
      - "The copy says where the mandate can be stopped, given the app cannot stop it"
    rationale: >-
      Omitting FinalPaymentDateTime stages 201 as an OPEN-ENDED mandate. Combined with
      amendment_prohibition that is a recurring overseas payment the PSU cannot cancel from this
      app — a materially different commitment from a bounded one, separated by a single switch.

  - id: TC-PISO-012
    priority: p1
    title: "No ExchangeRateInformation is sent and no rate control exists"
    given: "Any staged body, and every step of the form"
    then:
      - "Data.Initiation.ExchangeRateInformation is absent from every request"
      - "No RateType control, no rate entry and no ContractIdentification field exists"
    rationale: >-
      REFUSED for all three RateType values on this rail — R16-O1, R16-O2, R16-O3 — including the
      Agreed form with a real ExchangeRate 1.15 and ContractIdentification 'FX-CONTRACT-001'.
      Controls R16-C1/C2/C3 with the block removed staged 201, and the same refusal holds on the
      single and scheduled rails. This closes what this feature previously recorded as the
      highest-value open FX experiment: a TPP cannot assert even a contracted rate.

  - id: TC-PISO-013
    priority: p1
    title: "Every entry of a multi-error response is rendered, in wire order"
    given: "A 400 whose Errors array carries two entries"
    when: "The error panel renders"
    then:
      - "Both rows are displayed, unsorted and unmerged"
      - "The scheme error (U027) precedes the business-rule error (U002) as sent"
      - "Row copy is keyed by ErrorCode + Path, not Message"
    rationale: >-
      SO-I04 returns two Global Money rules together, and SO-I05 fixes the first and receives the
      second alone — the batching behaviour of U002. Message is unstable: this rail's U004 reads
      'Field is missing' @ Data.Initiation.ChargeBearer (SO-I11) while the domestic mandate's
      reads 'Data.Permission is missing' (SO-D12). See dtos/ObPaymentError.yaml.
