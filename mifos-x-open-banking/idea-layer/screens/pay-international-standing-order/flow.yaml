sibling: flow
schema_version: "4.0"
feature_id: pay-international-standing-order

feature: pay-international-standing-order
flow_ref: pay-international-standing-order

entry_points:
  - source: payments
    label: "Tap the International standing order tile on the payments hub"
    params: []

transitions:
  - from: pay-international-standing-order
    to: payment-consent
    trigger: "Confirm on the Review step, after the consent stages 201"
    params: [consentId, paymentFamily]
    notes: "paymentFamily is 'international-standing-order'."

  - from: payment-consent
    to: pay-international-standing-order
    trigger: "Consent reaches AUTH"
    params: [consentId]
    notes: "Resumes directly at submit — no funds-confirmation on this family."

  - from: pay-international-standing-order
    to: payment-status
    trigger: "Submit returns 201 with an InternationalStandingOrderId"
    params: [paymentId, paymentFamily]

  - from: pay-international-standing-order
    to: payments
    trigger: "Back from the Recipient step, or Cancel"
    params: []

internal_step_transitions:
  steps: [Recipient, Schedule, Amount, Charges, Review]
  note: >-
    Five steps, opening on Recipient. No account step — CORRECTED 2026-08-07: a product
    simplification, not a schema constraint. DebtorAccount is OPTIONAL and ACCEPTED on the
    international standing-order rail (201 with a current account, with a savings account and
    with the key omitted; resource 19918 carried one). Adding a funding-account step is a product
    decision, not a blocked one.

post_creation_constraints:
  no_amendment_route:
    rule: "The success state offers no Edit and no Cancel."
    basis: "OBL Customer Experience Guidelines."
  no_ais_appearance:
    rule: "Do not attempt to display the new mandate in any AIS list."
    note: >-
      Same structural cause as the domestic mandate — AIS carries no identifier that could hold
      a PIS mandate id. The AIS standing-orders read is also refused outright (400) on savings,
      Global Money and the card.

dependencies:
  tier: feature
  features:
    - { name: payments, relation: parent, params: [] }
    - { name: payment-consent, relation: child, params: [consentId, paymentFamily] }
    - { name: payment-status, relation: child, params: [paymentId, paymentFamily] }
  note: >-
    Neither accounts nor beneficiaries. No debtor field on this rail, and sort-code payees are
    refused with U027 on the international rails. The leanest dependency set of any payment screen.
  libraries:
    - name: ktorfit
      coords: "de.jensklingenberg.ktorfit:ktorfit-lib:2.x"
      purpose: "REST client for the four international-standing-order endpoints"
