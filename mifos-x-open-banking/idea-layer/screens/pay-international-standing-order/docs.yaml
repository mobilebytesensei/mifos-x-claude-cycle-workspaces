vm_actions:
  - name: EnterInstructedAmount
    signature: 'fun enterInstructedAmount(minorUnits: String)'
    state_mutations:
      - "content.instructedAmountMinorUnits = minorUnits"
      - "content.amountProblem = validateAmount(minorUnits)"
    notes: >-
      Maps to InstructedAmount on the wire. There is no FirstPaymentAmount on this rail and no
      recurring or final sibling — the field name is the divergence.
  - name: ConfirmAndStageConsent
    signature: 'suspend fun confirmAndStageConsent()'
    state_mutations:
      - uiState = Submitting(StagingConsent)
      - uiState = Submitting(AwaitingAuthorisation, consentId = response.Data.ConsentId)
    side_effects:
      - "POST /international-standing-order-consents with Permission 'Create', InstructedAmount, CurrencyOfTransfer, ChargeBearer and Risk {}"
      - "Body carries NO FirstPaymentAmount, NO RemittanceInformation, NO DebtorAccount"
    error_handling:
      on_400_U005: uiState = Error(FieldNotExpected)
      on_400_U004: uiState = Error(MissingRequiredField)
      on_400_U003: uiState = Error(InvalidMandateDates)
      on_400_U002: uiState = Error(InvalidFieldValue)
      on_400_U019: uiState = Error(SignatureMissing)
  - name: SubmitStandingOrder
    signature: 'suspend fun submitStandingOrder(consentId: String)'
    state_mutations:
      - uiState = Submitting(SubmittingPayment)
      - "uiState = Success(mandateId = response.Data.InternationalStandingOrderId, status = INCO)"
    side_effects: ["POST /international-standing-orders echoing the AUTHORISED consent's Initiation"]

error_cases:
  - { id: FieldNotExpected, trigger: "400 U005", user_message: '{strings.error.payment.field_not_expected}', recovery: "Implementation fault — FirstPaymentAmount or RemittanceInformation was sent." }
  - { id: MissingRequiredField, trigger: "400 U004", user_message: '{strings.error.payment.missing_field}', recovery: "Implementation fault." }
  - { id: InvalidMandateDates, trigger: "400 U003", user_message: '{strings.error.payment.invalid_mandate_dates}', recovery: "Return to the schedule step." }
  - { id: InvalidFieldValue, trigger: "400 U002", user_message: '{strings.error.payment.invalid_bank_code}', recovery: "Return to the recipient or schedule step." }
  - { id: UnsupportedScheme, trigger: "400 U027", user_message: '{strings.error.payment.unsupported_scheme}', recovery: "Should be unreachable — the form takes an IBAN." }
  - { id: SignatureMissing, trigger: "400 U019", user_message: '{strings.error.payment.signature_missing}', recovery: "Not user-recoverable." }
  - { id: ConsentNotAuthorised, trigger: "400 U009", user_message: '{strings.error.payment.consent_not_authorised}', recovery: "Re-authorise." }
  - { id: NetworkError, trigger: "IOException / timeout", user_message: '{strings.error.payment.network_error}', recovery: "Retry — idempotency key reused." }

