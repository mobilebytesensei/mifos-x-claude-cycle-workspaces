sibling: flow
schema_version: "4.0"
feature_id: standing-orders

feature: standing-orders
flow_ref: consumer-banking

entry_points:
  - source: account-detail
    label: "Tap Standing Orders chip"
    params: [accountId]

transitions:
  - from: standing-orders
    to: account-detail
    trigger: "Back button"
    params: [accountId]

# Moved from docs.yaml 2026-07-31 (CROSS_LEAK repair) and normalised to the
# {tier, features[]} map every other feature uses. As authored it was a bare list of
# screen-relations — the sole outlier of the 13 dependencies blocks — which the flow
# schema rejects (`dependencies must be object`). tier: 1 matches its siblings reached
# one hop from account-detail (statements, scheduled-payments). No information dropped:
# relation/params/trigger are preserved as fields on the feature entry.
dependencies:
  tier: 1
  features:
    - name: account-detail
      relation: parent
      params: [accountId]
      entry_trigger: "Standing Orders chip tap"
