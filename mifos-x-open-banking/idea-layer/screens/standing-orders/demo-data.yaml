# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, empty, unsupported, error]. This file previously
# held only the populated collection, so empty / unsupported / error had nothing to bind to.
# `unsupported` is the important one and is specific to this screen. RE-GROUNDED 2026-08-07:
# the reasoning previously rested on OBP exposing no GET for standing orders at any version,
# against a backend this app no longer talks to. Under OBIE the read DOES exist —
# GET /accounts/{AccountId}/standing-orders (api.yaml#standing-orders-list) — but it is
# PERMISSION-GATED. It is readable only where the AIS consent the customer approved carries
# ReadStandingOrdersDetail; a consent granted without it returns 403 UK.OBIE.Field.Missing and
# the app sees nothing. The conclusion is unchanged and the state is still reachable: a
# customer can hold live standing orders the app cannot enumerate — which is NOT the same as
# the customer having none.
states:
  - scope: content
    standing_orders: all
    summary: "4 Active · 1 Inactive"

  - scope: loading
    standing_orders: all

  - scope: empty
    standing_orders: []
    summary: "No standing orders"
    message: "You do not have any standing orders set up."
    cta: "Set up a standing order"

  - scope: unsupported
    standing_orders: []
    message: "Your bank does not support viewing standing orders here."
    detail: "Standing orders you set up in this app will still appear. Others must be managed in your bank's own app."
    _why_distinct_from_empty: >-
      empty means "you have none". unsupported means "we cannot see them". Telling a customer
      with three live standing orders that they have none would be a false statement about
      their money — this is the same truthfulness invariant payment-status applies to
      unknown payment dispositions.

  - scope: error
    error_type: StandingOrdersLoadFailed
    message: "Could not load your standing orders"
    recovery: "Check your connection and try again."
    recoverable: true
