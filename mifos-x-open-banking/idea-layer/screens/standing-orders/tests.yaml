sibling: tests
schema_version: "4.0"
feature_id: standing-orders

screen_id: standing-orders
_last_enriched_at: "2026-06-29T15:00:00Z"

scenarios:
  # ── HAPPY PATH ──────────────────────────────────────────────────
  - id: TC-SO-001
    priority: p0
    description: "Standing orders list loads and renders all active orders"
    state: content
    given: "Valid PSU access token; HSBC sandbox returns 5 standing orders (4 Active, 1 Inactive) for account 40051512345678"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Five standing order cards render (Jameson Lettings, ISA Saver, PureGym, Oxfam GB, Marcus Savings)"
      - "Each card shows payee name, status badge, amount in GBP, human-readable frequency, next payment date, sort-code/account, and payment reference"
      - "Summary row reads '4 Active · 1 Inactive'"
      - "Frequency codes are mapped to human labels (IntrvlMnthDay:01:01 → 'Monthly on the 1st', IntrvlWkDay:01:5 → 'Weekly every Friday')"

  - id: TC-SO-002
    priority: p0
    description: "Loading state shown during standing orders fetch"
    state: loading
    given: "Slow network; API call in flight"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible"
      - "Standing orders list and summary row not rendered"
      - "Progress indicator accessibility_label reads 'Loading standing orders'"

  - id: TC-SO-003
    priority: p1
    description: "Empty state when no standing orders set up"
    state: empty
    given: "HSBC returns empty Data.StandingOrder[] for the account"
    when: "Screen mounts"
    then:
      - "Empty state renders with autorenew icon"
      - "Title reads 'No standing orders'"
      - "Body reads 'No standing orders are set up for this account.'"

  - id: TC-SO-004
    priority: p1
    description: "Error state with Retry button on 401 token expired"
    state: error
    given: "Access token is expired; standing-orders endpoint returns 401"
    when: "Screen mounts"
    then:
      - "Error state renders with error_outline icon"
      - "Title reads 'Could not load standing orders'"
      - "Error message reads 'Session expired. Please log in again.'"
      - "Retry button visible with label 'Retry'"
      - "Tapping Retry re-triggers LoadStandingOrders (RetryLoad ViewModel action)"

  - id: TC-SO-005
    priority: p1
    description: "Back button navigates to account-detail"
    state: content
    given: "Standing orders list rendered for account 40051512345678, reached from the account-detail StandingOrders chip"
    when: "User taps back button"
    then:
      - "NavigationEvent.Back emitted to NavController"
      - "Navigates to account-detail screen"

  # ── INACTIVE / SECONDARY BADGE ───────────────────────────────────
  - id: TC-SO-006
    priority: p1
    description: "Inactive standing order renders secondary badge variant and shows final payment date"
    state: content
    given: "HSBC returns SO-004 (Oxfam GB, Inactive, FinalPaymentDateTime=2025-12-28)"
    when: "Screen mounts"
    then:
      - "SO-004 card renders with badge variant='secondary' and text 'Inactive'"
      - "FinalPaymentDateTime row visible: 'Final: 28 Dec 2025'"
      - "NextPaymentDateTime row not shown (null value)"

  # ── ERROR CODE SPECIFICITY ────────────────────────────────────────
  - id: TC-SO-007
    priority: p1
    description: "403 Consent Revoked shows distinct error message from 401 Token Expired"
    state: error
    given: "AISP consent has been revoked; endpoint returns 403"
    when: "Screen mounts"
    then:
      - "Error message reads 'Account access consent has been revoked.'"
      - "Error title reads 'Could not load standing orders'"
      - "Retry button visible (user can attempt to re-consent and retry)"

  - id: TC-SO-008
    priority: p2
    description: "429 Rate Limited shows rate-limit specific message"
    state: error
    given: "HSBC sandbox rate limit exceeded; endpoint returns 429"
    when: "Screen mounts"
    then:
      - "Error message reads 'Too many requests. Please wait a moment and try again.'"
      - "Retry button visible"

  # ── FREQUENCY CODE DECODE ─────────────────────────────────────────
  - id: TC-SO-009
    priority: p1
    description: "Weekly frequency code IntrvlWkDay:01:5 decodes to 'Weekly every Friday'"
    state: content
    given: "HSBC returns SO-005 with Frequency=IntrvlWkDay:01:5"
    when: "Screen mounts"
    then:
      - "SO-005 card frequency row reads 'Weekly every Friday'"
      - "Frequency accessibility label reads 'Frequency: Weekly every Friday'"

  # ── PULL-TO-REFRESH ───────────────────────────────────────────────
  - id: TC-SO-010
    priority: p2
    description: "Pull-to-refresh re-triggers standing orders load"
    state: content
    given: "Screen already showing content state with standing orders"
    when: "User pulls down on the standing orders list"
    then:
      - "Loading indicator appears"
      - "LoadStandingOrders ViewModel action re-triggered"
      - "Updated list renders on completion"

  # ── ACCESSIBILITY ─────────────────────────────────────────────────
  - id: TC-SO-011
    priority: p2
    description: "All interactive elements and key data fields have accessibility labels"
    state: content
    given: "Screen in content state with 3 standing orders"
    when: "TalkBack/VoiceOver traverses the screen"
    then:
      - "Back button announces 'Navigate back to Account Detail'"
      - "Each payee name announces 'Payee: {name}'"
      - "Each amount announces 'Next payment: {amount} {currency}'"
      - "Each status badge announces 'Status: Active' or 'Status: Inactive'"
      - "Each sort-code announces 'Sort code / Account: {identification}'"
      - "Each next-date row announces 'Next payment date: {date}'"
      - "Each payment reference row announces 'Payment reference: {reference}'"
      - "Card container announces 'Standing order for {payee name}' for TalkBack grouping"
      - "Retry button (error state) announces 'Retry loading standing orders'"

  # ── NETWORK ERROR ──────────────────────────────────────────────────
  - id: TC-SO-012
    priority: p1
    description: "Network error (IOException) shows correct message and Retry button"
    state: error
    given: "Device has no network connectivity; Ktorfit throws IOException"
    when: "Screen mounts"
    then:
      - "Error state renders with error_outline icon"
      - "Error title reads 'Could not load standing orders'"
      - "Error message reads 'No network connection. Check your connection and retry.'"
      - "Retry button visible with label 'Retry'"
      - "Tapping Retry re-triggers LoadStandingOrders"

  # ── UNKNOWN FREQUENCY FALLBACK ────────────────────────────────────
  - id: TC-SO-013
    priority: p2
    description: "Unknown OBIE frequency code falls back to raw code string"
    state: content
    given: "HSBC returns a standing order with Frequency='IntrvlMnthDay:02:10' (not in decoder mapping)"
    when: "Screen mounts"
    then:
      - "Frequency row displays the raw OBIE code 'IntrvlMnthDay:02:10' (fallback={Frequency})"
      - "No crash or empty label; decoder gracefully falls back to raw value"
      - "Frequency accessibility label reads 'Frequency: IntrvlMnthDay:02:10'"

  # ── UNSUPPORTED STATE ─────────────────────────────────────────────
  - id: TC-SO-014
    priority: p1
    description: "Unsupported state shown when capability registry refuses standing orders for account type"
    state: unsupported
    given: "The servicer does not expose standing orders for this account type; ViewModel receives StandingOrdersUiState.Unsupported with a capability-refused message"
    when: "Screen mounts with accountId for an account that does not support standing orders"
    then:
      - "Unsupported empty-state component (standingOrders:unsupportedState) renders with info_outline icon and info variant"
      - "Title reads 'Standing orders unavailable' (strings.standing_orders_unsupported_title)"
      - "Body renders the runtime message from StandingOrdersUiState.Unsupported(message) — not a static i18n key"
      - "No Retry button present — the capability registry refused the call outright; this is not a transient network or auth failure"
