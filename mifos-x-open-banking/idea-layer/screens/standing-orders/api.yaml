sibling: api
schema_version: "4.0"
feature_id: standing-orders
_source: source_analysis

api:
  - id: get_standing_orders
    function: "Aisp.getStandingOrders(accountId)"
    method: GET
    path: "/v4.0/aisp/accounts/{AccountId}/standing-orders"
    description: "OBIE v4.0 read standing orders (OBReadStandingOrder6) for one account, returned unpaginated; read-only in this feature."
    auth: "PSU bearer token (Ktor Auth plugin) + mTLS transport cert"
    params:
      AccountId: { type: String, required: true, source: nav_params.accountId }
    response:
      dto: StandingOrdersResponse
      items: "Data.StandingOrder[]"
      domain_mapper: "StandingOrderMapper.toStandingOrdersSummary() → StandingOrdersSummary(items sorted active-first, activeCount, inactiveCount)"
    pagination:
      type: none
    cache:
      strategy: memory-only
      ttl: null
      offline: none
      note: "Store5 memory store, no Room SourceOfTruth — consent can be withdrawn at any moment"
    errors:
      400_U000: "Unsupported for product → Unsupported state (bank message verbatim, no retry) + AccountCapabilityRegistry.markUnsupported"
      401: "Unauthorized → TokenExpired (retry)"
      403: "Forbidden → ConsentRevoked (retry shown)"
      429: "RateLimited (retry)"
      5xx: "ServerError (retry)"
      network: "NetworkError (retry)"
