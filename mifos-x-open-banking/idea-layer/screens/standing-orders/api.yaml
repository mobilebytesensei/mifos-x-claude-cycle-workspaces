sibling: api
schema_version: "4.0"
feature_id: standing-orders

screen_id: standing-orders

endpoints:
  - id: standing-orders-list
    method: GET
    path: "/accounts/{AccountId}/standing-orders"
    response_dto: StandingOrdersSummary
    permission: ReadStandingOrdersDetail
    requires_auth: true
    path_params:
      AccountId: string
    response_headers:
      - name: x-fapi-interaction-id
        description: "Echoed request/response correlation UUID; log for support triage"
    notes: >-
      Returns all standing orders for the given AccountId. Frequency field uses OBIE ISO 20022
      codes (e.g. IntrvlMnthDay:01:01 = monthly on 1st). ReadStandingOrdersDetail permission
      is required — ReadStandingOrders alone omits NextPaymentAmount and Reference.
    error_codes:
      - status: 401
        obie_code: UK.OBIE.Unauthorized
        description: "Access token expired or invalid. Re-authenticate to obtain fresh token."
        vm_error_type: TokenExpired
      - status: 403
        obie_code: UK.OBIE.Field.Missing
        description: "Consent does not include ReadStandingOrdersDetail permission."
        vm_error_type: ConsentRevoked
      - status: 429
        obie_code: UK.OBIE.RateLimit
        description: "HSBC rate limit exceeded. Retry after delay indicated in Retry-After header."
        vm_error_type: RateLimited
      - status: 500
        obie_code: UK.OBIE.UnexpectedError
        description: "HSBC internal server error. Transient — retry is appropriate."
        vm_error_type: ServerError
      - status: 503
        obie_code: UK.OBIE.ServiceUnavailable
        description: "HSBC AIS endpoint temporarily unavailable. Retry with exponential backoff."
        vm_error_type: ServerError
