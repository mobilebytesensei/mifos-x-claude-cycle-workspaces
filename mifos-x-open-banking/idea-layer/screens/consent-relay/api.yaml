sibling: api
schema_version: "4.0"
feature: consent-relay
endpoints: []          # the relay calls no server API and holds no secrets
handoffs:
  - id: desktop_loopback
    method: GET
    url: "http://127.0.0.1:8765/callback?{raw}"
    consumer: "cmp-desktop ConsentRedirectListener"
    mode: "fetch no-cors, cache no-store — only resolution vs rejection matters"
    note: "fragment rewritten to query because a server cannot see a fragment"
  - id: mobile_app_link
    url: "https://<relay-domain>/app/callback?{raw}"
    consumer: "Android App Link (autoVerify) / iOS Universal Link"
    status: planned (FR-052)
  - id: mobile_custom_scheme
    url: "org.mifosx.openbanking://callback?{raw}"
    consumer: "cmp-android intent-filter / iOS CFBundleURLSchemes"
    status: current (fallback once App Links land)
static_assets:
  - { path: "/.well-known/assetlinks.json", purpose: "Android App Links verification (release signing-cert SHA-256)", content_type: application/json }
  - { path: "/.well-known/apple-app-site-association", purpose: "iOS Universal Links (team ID + bundle ID)", content_type: application/json }
response_headers:   # Cloudflare Pages _headers (NFR-011, FR-051)
  Content-Security-Policy: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:8765; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
  Strict-Transport-Security: "max-age=63072000; includeSubDomains; preload"
  Referrer-Policy: "no-referrer"
  Cache-Control: "no-store"
  X-Content-Type-Options: "nosniff"
  X-Robots-Tag: "noindex"
  Permissions-Policy: "camera=(), microphone=(), geolocation=()"
registered_redirect_uri:
  value: "https://mifos-x-open-banking-relay.pages.dev/callback/"
  hsbc_registration: pending (human step on HSBC DevHub)
  must_match: "local.properties HSBC_REDIRECT_URI + HSBC DevHub registration, byte-for-byte"
