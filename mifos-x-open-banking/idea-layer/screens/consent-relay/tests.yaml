schema_version: v1.0.0
feature: consent-relay
runner: playwright      # web page — node --test for bridge.js units, Playwright for the page (Maestro n/a, see docs.yaml)
scenarios:
  - id: desktop_listener_takes_response
    preconditions: ["a local HTTP listener answers on 127.0.0.1:8765"]
    actions: ["open /callback/#code=X&state=Y"]
    assertions: ["listener received GET /callback?code=X&state=Y", "heading reads 'Consent received'", "no navigation to org.mifosx.openbanking:// happened"]
    priority: high
  - id: mobile_handoff_when_no_listener
    preconditions: ["nothing listens on 127.0.0.1:8765"]
    actions: ["open /callback/#code=X&state=Y"]
    assertions: ["navigation to the app URL is attempted with ?code=X&state=Y"]
    priority: high
  - id: open_app_prompt_after_block
    preconditions: ["nothing listens on 127.0.0.1:8765", "custom-scheme navigation is blocked"]
    actions: ["open /callback/#code=X&state=Y", "wait 1600 ms"]
    assertions: ["heading reads 'Open the app to continue'", "'Reopen the app' button is visible and focusable"]
    priority: high
  - id: nothing_to_return
    preconditions: []
    actions: ["open /callback/ with no fragment or query"]
    assertions: ["heading reads 'Nothing to return'", "no loopback request is made"]
    priority: medium
  - id: history_scrubbed
    preconditions: []
    actions: ["open /callback/#code=X&state=Y"]
    assertions: ["location.hash is empty after load", "history entry no longer contains code=X"]
    priority: high
  - id: security_headers
    preconditions: ["deployed on Cloudflare Pages"]
    actions: ["GET /callback/"]
    assertions: ["Content-Security-Policy has default-src 'none' and frame-ancestors 'none'", "Referrer-Policy is no-referrer", "Cache-Control is no-store", "Strict-Transport-Security present", "page has no inline <script>"]
    priority: high
  - id: well_known_files
    preconditions: ["deployed on Cloudflare Pages"]
    actions: ["GET /.well-known/assetlinks.json", "GET /.well-known/apple-app-site-association"]
    assertions: ["both return 200 application/json", "assetlinks lists package org.mifosx.openbanking with the release cert SHA-256"]
    priority: medium
  - id: error_passthrough
    preconditions: ["a local listener answers on 127.0.0.1:8765"]
    actions: ["open /callback/#error=access_denied&state=Y"]
    assertions: ["listener received error=access_denied&state=Y unchanged"]
    priority: medium
