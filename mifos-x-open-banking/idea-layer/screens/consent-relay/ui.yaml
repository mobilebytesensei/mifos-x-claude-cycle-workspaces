sibling: ui
schema_version: "4.0"
screen_id: consent-relay
feature_id: consent-relay
name: "Consent relay"
status: draft
archetype: loading             # transient hand-off page; loading-archetype floor = logo
delivery_surface: web-hosted   # static HTML on Cloudflare Pages, not a Compose screen
states: [relaying, delivered_desktop, open_app_prompt, nothing_to_return]
initial_state: relaying        # ES3: the page starts by reading the fragment and probing the loopback
feature_profile:
  combo_id: static_content
  facets: [content]
  archetype: screen-content
  store_archetype: MEMORY_ONLY
  recipe_ref: FEATURE_LAYER_BUILD_GUIDE
  heal: auto
  profile_hash: scaffold-default
state_details:
  relaying:
    heading: "Returning to the app…"
    detail: "You can close this tab once the app reopens."
    renders: [relay_logo, heading, detail]
  delivered_desktop:
    heading: "Consent received"
    detail: "You can close this tab and return to the app."
    trigger: "loopback probe resolved — a desktop listener took the response"
    renders: [relay_logo, heading, detail]
  open_app_prompt:
    heading: "Open the app to continue"
    detail: "Your bank has authorised the request. Reopen the app to finish connecting."
    trigger: "1.5s after the mobile hand-off without the page being backgrounded (iOS Safari blocks non-gesture custom-scheme navigation)"
    renders: [relay_logo, heading, detail, reopen_button]
  nothing_to_return:
    heading: "Nothing to return"
    detail: "This page had no authorisation response to pass back to the app."
    trigger: "no fragment and no query on load"
    renders: [relay_logo, heading, detail]
components:
  - type: image
    id: relay_logo
    role: logo
    visual_asset_ref: consent_relay_logo
    testTag: "consent_relay_logo"
  - type: header
    id: heading
    label: "Returning to the app…"
    testTag: "consent_relay_heading"
    aria: { live: polite }      # state changes are announced
  - type: text
    id: detail
    label: "You can close this tab once the app reopens."
    testTag: "consent_relay_detail"
  - type: button
    id: reopen_button
    label: "Reopen the app"
    testTag: "consent_relay_reopen"
    visible_in: [open_app_prompt]
    on_click:
      action: reopen_app
      action_contract:
        effect: navigate
        library_refs: []
        description: "User-initiated navigation to the mobile app with the same relayed parameters (org.mifosx.openbanking://callback?...; App Link URL once FR-052 ships). A user gesture satisfies iOS Safari's custom-scheme rule."
        action_contract_hash: "pending-enrich"
        action_contract_author: "claude-via-idea-plan-add"
        action_contract_authored_at: "2026-10-21T10:00:00Z"
visual_assets:
  - { id: consent_relay_logo, kind: logo, role: logo, intent: "Mifos X Open Banking app mark shown while the browser hands the user back to the app — signals continuity with the app they started in", produced_by: /idea-branding, states: [relaying, delivered_desktop, open_app_prompt, nothing_to_return], consistency: none, note: "inline SVG (CSP forbids remote images); blocked on BLK-002 brand mark" }
strings:
  - { key: relay_heading_relaying, en: "Returning to the app…" }
  - { key: relay_detail_relaying, en: "You can close this tab once the app reopens." }
  - { key: relay_heading_delivered, en: "Consent received" }
  - { key: relay_detail_delivered, en: "You can close this tab and return to the app." }
  - { key: relay_heading_open_app, en: "Open the app to continue" }
  - { key: relay_detail_open_app, en: "Your bank has authorised the request. Reopen the app to finish connecting." }
  - { key: relay_button_reopen, en: "Reopen the app" }
  - { key: relay_heading_nothing, en: "Nothing to return" }
  - { key: relay_detail_nothing, en: "This page had no authorisation response to pass back to the app." }
accessibility:
  - "color-scheme light dark honoured"
  - "heading is an aria-live region so the state change is announced"
  - "reopen button ≥ 44px target, visible focus"
known_gaps:
  - "relay_logo / consent_relay_logo declared but the deployed relay/site/callback/index.html renders no logo yet — blocked on BLK-002 brand mark (inline SVG once available)"
