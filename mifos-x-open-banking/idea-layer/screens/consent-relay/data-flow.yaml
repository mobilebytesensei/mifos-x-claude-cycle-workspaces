sibling: data-flow
feature: consent-relay
entries:
  - trigger: on_mount
    source: "browser location.hash (fallback location.search)"
    target_state: relaying
    loading_state: relaying
    error_state: nothing_to_return
    persistence: none           # nothing is stored — no localStorage, no cookies, no server
    on_error:
      nav_target: null
      error_code: no_params
  - trigger: loopback_probe
    source: "handoff.desktop_loopback"
    target_state: delivered_desktop
    error_state: open_app_prompt   # rejection means mobile — not an error to the user
data_retention: "None. The authorisation code exists only in the URL until history.replaceState scrubs it; the page never writes it anywhere."
