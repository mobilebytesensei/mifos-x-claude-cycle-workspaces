known_gaps:
  - id: view-consents-noop
    severity: error
    description: "AuthenticatedNavHostScreen wires sendMoneyGraph(onNavigateToConsents = {}), so the 'View consents' error action does nothing (FR-047). Same defect in payments-schedule-payment and payments-standing-order."
  - id: load-error-retry-dispatches-staging
    severity: error
    description: "An accounts-load failure renders SendMoneyUiState.Error whose Retry button dispatches RetryStaging (confirmAndStageConsent), not RetryLoad. With no payee chosen buildDraft() returns null and Retry is dead; with a filled form it would stage a payment that skipped Review. SendMoneyAction.RetryLoad is handled but never dispatched by any UI."
  - id: duplicated-form-code
    severity: warn
    description: "SendMoneyViewModel (802 lines) and SchedulePaymentViewModel (899) are near-identical copies (Form, validation, render, error classification, history feed), as are the Content/Review/Error composables, TestTags and strings; payments-standing-order repeats the pattern. Validation rules can drift between products."
  - id: insufficient-funds-unreachable
    severity: info
    description: "SendMoneyErrorKind.InsufficientFunds has a message and an Edit amount action but classifySendMoneyError never produces it."
  - id: no-abandon-while-awaiting
    severity: warn
    description: "Submitting(AwaitingAuthorisation) has no cancel/abandon action (payments-schedule-payment has AbandonAuthorisation); if the PSU never completes at the bank the form is stuck behind the spinner until system back."
  - id: hardcoded-scheme-labels
    severity: info
    description: "creditorSupporting uses hardcoded 'Identification · ', 'IBAN · ', 'Paym · ', 'Card · ' prefixes built in the ViewModel."
  - id: review-not-guarded-in-vm
    severity: info
    description: "ReviewPayment unconditionally sets step=Review; canReview is enforced only by the button's enabled flag."
