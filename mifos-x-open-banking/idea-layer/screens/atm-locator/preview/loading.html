<style>

  .shim { background: linear-gradient(90deg, var(--surface-variant) 0%, var(--outline-variant) 50%, var(--surface-variant) 100%); background-size: 200% 100%; animation: shim 1.4s ease-in-out infinite; border-radius: 6px; }
  @keyframes shim { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skel-search { height: 44px; border-radius: 28px; margin: 4px 16px 12px; }
  .skel-map { height: 240px; border-radius: var(--radius-soft); margin: 0 16px 12px; }
  .skel-chips { display: flex; gap: 8px; padding: 4px 16px 14px; }
  .skel-chip { height: 28px; width: 70px; border-radius: 16px; }
  .skel-section { height: 16px; width: 40%; margin: 8px 16px 12px; }
  .skel-card { background: var(--surface); border-radius: var(--radius-soft); margin: 0 16px 8px; padding: 14px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); display: flex; gap: 12px; }
  .skel-avatar { width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0; }
  .skel-lines { flex: 1; }
  .skel-line-title { height: 14px; width: 60%; margin-bottom: 8px; }
  .skel-line-sub { height: 12px; width: 90%; margin-bottom: 6px; }
  .skel-line-meta { height: 14px; width: 50%; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--surface); border-top: 1px solid var(--outline-variant); padding: 6px 0 10px; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--on-surface-variant); font-size: 11px; font-weight: 500; }
  .nav-item.active { color: var(--primary); }
  .nav-item .material-icons { font-size: var(--icon-sm); }
