_replaced_2026_08_07: >-
  The previous fixtures were NAIROBI coordinates with KCB / Equity / Co-op / NCBA branches,
  inherited from the deleted field-officer persona and an East African market, in a UK app
  against HSBC. Wrong on both axes, and in the OBP snake_case shape (id/bank_id/name/
  is_accessible/services) which shares no field name with what the API returns. Fully replaced.

_branches_moved: >-
  This file previously also carried `branches:`. Branches are now their own feature
  (branch-locator) against their own API, so the branch fixtures moved there. The only branch
  data an ATM carries is the reference stub below.

# ─────────────────────────────────────────────────────────────────────────
# WHAT THE FIXTURES DELIBERATELY PRESERVE
# ─────────────────────────────────────────────────────────────────────────
_fixture_fidelity_notes:
  whitespace_defects_are_real: >-
    " 79 PICCADILLY" has a LEADING space; "HSBC 8CS RECEPTION ", "BISHOPSGATE " and
    "FULHAM BROADWAY " have TRAILING spaces. These are in the live feed and are kept verbatim so
    the renderer is tested against the string it will actually receive. A fixture set that
    silently trims them hides the bug until production.
  all_caps_is_real: >-
    Site names arrive upper-cased. Kept as-is. The screen title-cases for display and keeps the
    raw value for matching.
  no_atm_name: >-
    There is no Name field on an ATM. Location.Site.Name is a SITE label and is shared by every
    machine at that site — see the two Manchester records below. Identification is the only key.
  fields_hsbc_never_sends: >-
    Access24HoursIndicator, Accessibility, MinimumPossibleAmount, Note and OtherATMServices are
    ABSENT from every fixture because they are absent from all 135 live records sampled. They are
    deliberately NOT stubbed in — a fixture that invents them would let a 24-hour filter or an
    accessibility filter pass in the prototype and return nothing for every real user.

