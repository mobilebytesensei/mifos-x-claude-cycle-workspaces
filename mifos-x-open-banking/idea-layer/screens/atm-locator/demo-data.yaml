_colocation_is_real_not_authored: >-
  M01M1565 and M02M1566 are two DIFFERENT machines at the same site — identical Site.Name,
  StreetName, PostCode, coordinates AND Branch id, differing only in Identification. This is live
  data, not a constructed edge case. The map must not stack two pins at one point, and the list
  must not render the site twice with no way to tell the rows apart. The previous fixture set
  invented a colocation case; this one was found.

_identification_prefix_pattern:
  observed: "A24A…/A25A… on withdrawal-only machines; M01M…/M02M… on deposit-capable ones."
  caution: >-
    A real and consistent pattern across the sample, but HSBC documents no such scheme anywhere.
    Do NOT parse capability out of the id — read ATMServices. Recorded because it will be noticed,
    and someone will be tempted.

states:
  - { scope: content, atms: all, note: "6 records: 2 withdrawal-only, 4 deposit-capable, including the Manchester colocation pair." }
  - { scope: loading, atms: all }
  - { scope: empty, atms: [], note: "No ATMs within the search radius. Reachable in reality — the radius ceiling is 10 miles and rural areas return nothing." }
  - { scope: location_denied, atms: all, note: "Device location refused. The list still renders via the postcode/town paths, sorted by name rather than distance. This state is the REASON those extension endpoints matter." }
  - { scope: error, error_type: LocationsLoadFailed, message: "Could not load nearby ATMs", recovery: "Check your connection and try again." }
  - { scope: rate_limited, error_type: TooManyRequests, http: 429, message: "Too many searches. Try again in a moment.", note: "A real risk here and nowhere else in the app — an unauthenticated public API rate-limits by origin, and a map that refetches on every pan will hit it." }
  - { scope: no_network, error_type: Offline, message: "You are offline. Showing locations saved on this device." }

_removed_states:
  unauthenticated: >-
    DELETED 2026-08-07. The previous fixture carried a `unauthenticated / SessionExpired /
    "Sign in again to find ATMs near you"` state. That state is IMPOSSIBLE on this surface: the
    swagger declares no security scheme and no path returns 401 or 403. A session-expiry branch
    here is unreachable code and a misleading prompt — the screen works with no session at all.

