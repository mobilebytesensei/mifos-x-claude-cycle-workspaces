screens:
  - id: atm_locator_main
    name: "ATM Locator"
    archetype: index_list
    route: /atm-locator

archetype: index_list

shell:
  top_app_bar:
    show: true
    title: "ATMs"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
