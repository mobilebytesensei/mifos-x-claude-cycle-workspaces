ated ASPSP, no bankId path segment, no fan-out, and lat/long/radius ARE path and query parameters. The branch marker named here as obp_get_branches is now the separate branch-locator feature. See api.yaml#operations and api.yaml#removed_2026_08_06 for the current contract; this entry is retained as the record of what was reconciled on 2026-06-11, not as a live statement.]"
