      color: primary
      padding_top: 24
      padding_horizontal: 16
    a11y:
      role: heading
      level: 1
      label: "ATM and Branches screen"
    test_context:
      test_id: atm_locator_title
      assert: text_visible

  - type: image
    id: atm_map_area
    content: "ATM map"
    style:
      background: surfaceVariant
      height: 260
      margin_horizontal: 0
      margin_top: 0
      border_radius: 0
      object_fit: cover
    a11y:
      role: img
      label: "Map showing nearby ATMs across your banks"
      alt: "Map showing nearby ATMs across your banks"
    test_context:
      test_id: atm_map_view
      assert: map_renders_when_content

  - type: stack
    id: atm_search_row
    style:
      direction: horizontal
      align_items: center
      spacing: 8
      padding_horizontal: 12
      padding_vertical: 8
    a11y:
      role: group
      label: "Search ATMs by location and use my location"
    test_context:
      test_id: atm_search_row
      assert: visible

  - type: input
    id: location_search_input
    label: "Search location"
    content: ""
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: search
      placeholder: "Search city, postcode or address"
      background: background
      border_radius: 12
      padding_horizontal: 16
      padding_vertical: 12
      icon_leading: "search"
      weight: 1
    on_click:
      action: query_changed
      target: atm_locator_main
      action_contract:
        effect: transform_state
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Records each keystroke onto the locator query state and re-filters the loaded ATM list in
          memory; no network call, the set is already resident.
    a11y:
      role: searchbox
      label_source: visible_label
      label: "Search for ATMs by city, postcode or address"
      hint: "Search city, postcode or address"
    keyboard:
      focusable: true
    test_context:
      test_id: atm_search_field
