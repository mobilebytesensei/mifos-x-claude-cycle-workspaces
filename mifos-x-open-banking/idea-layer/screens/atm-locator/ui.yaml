responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      reduced_motion_fallback: static_placeholder
    layout:
      show_components:
        - atm_locator_title
      progress_components:
        - atm_progress_indicator
      hide_components:
        - atm_map_area
        - atm_search_row
        - nearby_results_header
        - atm_result_kcb_westlands
        - atm_result_equity_cbd
        - atm_result_coop_karen
        - atm_empty_state
        - atm_error_state
    note: "Centered CircularProgressIndicator while bank list + per-bank ATMs load (no skeleton)."
  content:
    layout:
      show_components:
        - atm_locator_title
        - atm_map_area
        - atm_search_row
        - location_search_input
        - use_my_location_button
        - nearby_results_header
        - atm_result_kcb_westlands
        - atm_kcb_name
        - atm_kcb_hours
        - atm_kcb_distance
        - atm_kcb_address
        - atm_kcb_accessible_chip
        - atm_kcb_deposits_chip
        - atm_kcb_directions
        - atm_result_equity_cbd
        - atm_equity_name
        - atm_equity_hours
        - atm_equity_distance
        - atm_result_coop_karen
        - atm_coop_name
        - atm_coop_hours
        - atm_coop_distance
      hide_components:
        - atm_empty_state
        - atm_error_state
    note: "Address + Accessible/Deposits chips + Directions appear only inside the selected (expanded) ATM row."
  empty:
    layout:
      show_components:
        - atm_locator_title
        - atm_empty_state
        - atm_empty_icon
        - atm_empty_title
        - atm_empty_message
      hide_components:
        - atm_map_area
        - atm_search_row
        - nearby_results_header
    note: "Shown when the user's banks expose no ATMs (RawState.Loaded with empty list)."
  error:
    layout:
      show_components:
        - atm_locator_title
        - atm_error_state
        - atm_error_icon
        - atm_error_title
        - atm_error_message
        - atm_retry_button
      hide_components:
        - atm_map_area
        - atm_search_row
        - nearby_results_header
    note: "ScreenState.Error — every bank fetch failed or accounts lookup failed."
  no_network:
    layout:
      show_components:
        - atm_locator_title
        - atm_error_state
        - atm_error_icon
        - atm_error_title
        - atm_error_message
        - atm_retry_button
      hide_components:
        - atm_map_area
        - atm_search_row
        - nearby_results_header
    note: "ScreenState.NoNetwork — rendered identically to error with retry."

# ─────────────────────────────────────────────────────────────────────────
# FORBIDDEN STATES — matches screens/branch-locator/ui.yaml#forbidden_states
# ─────────────────────────────────────────────────────────────────────────
forbidden_states:
  unauthenticated: >-
    REMOVED 2026-08-07. This screen declared an `unauthenticated` / session-expired state
    rendering "Sign in again to find ATMs near you". It is UNREACHABLE. api.yaml says
    `auth: none` and states plainly: "There is no 401 and no 403 in the spec, on any path.
    Nothing here can fail for a credential reason." The swagger declares no security scheme.
    data-flow.yaml already listed `401 -> navigate_login` as a forbidden error path.
    The state was therefore dead code shipping a FALSE message, and it shipped it on one of only
    three screens a prospective customer can see BEFORE connecting any account — the exact
    audience for whom "sign in again" is both untrue and a reason to leave. Same correction as
    branch-locator, which never had it.

state_model:
  view_model: AtmLocatorViewModel
  content_type: AtmLocatorContent
  screen_state: "ScreenState<AtmLocatorContent>"
  content_fields:
    - name: atms
      type: "List<AtmRow>"
      note: "Each row: id, name, addressLine, distanceLabel, distanceMeters?, lat, lng, hoursLabel, accessible, acceptsDeposits, moreInfo."
    - name: query
      type: String
      default: '""'
    - name: hasLocation
      type: Boolean
      default: "false"
    - name: resultSummary
      type: String
      note: "e.g. 'No matching ATMs' / '4 ATMs' / '4 ATMs near you'."
    - name: selectedAtmId
      type: String
      default: '""'
      note: "Id of the single expanded ATM row; tapping the open one clears it."
    - name: center
      type: "MapCoordinate?"
      note: "Device location when known, else centroid of matched ATMs."
  internal_filters:
    - name: query
      type: String
    - name: location
      type: "MapCoordinate?"
    - name: selectedAtmId
      type: String
  events:
    - onRetry
    - onQueryChanged
    - onUserLocation
    - onAtmSelected
  actions:
    - retry_load
    - query_changed
    - request_user_location
    - select_atm
    - open_directions
  di:
    - AtmRepository
    - AccountsRepository
  notes:
    - "Static @Composable host with koinViewModel(); device location obtained via rememberDeviceLocationRequester in the screen (no LocationService class)."
    - "Directions is a geo: URI built in the screen (directionsUri) and opened via LocalUriHandler — no DirectionsRequested event, no NavigationService."
    - "ATMs aggregated across all of the user's banks via atmRepository.atmsForBanks(bankIds); rows sorted nearest-first once device location is known."

# ─────────────────────────────────────────────────────────────────────────
# REWRITTEN 2026-08-06 by /idea-sync (OBP eviction)
#
# Was per-bank OBP endpoints (`/obp/v3.0.0/banks/{bankId}/atms`) aggregated across every bank
# the PSU holds an account at, with a 401 error path.
#
# TWO STRUCTURAL CHANGES:
#   1. Open Data is UNAUTHENTICATED. The 401 path is gone — there is no credential to expire,
#      and a 401 handler on this screen could eject a signed-out PSU from a screen that works
#      fine without them signing in.
#   2. There is no multi-bank aggregation. This is a single-brand app against HSBC, so
#      `atmsForBanks(bankIds)` collapses to one call. AccountsRepository is no longer needed to
#      discover which banks to query — which is what made this screen require a session at all.
# ─────────────────────────────────────────────────────────────────────────
api:
  - id: get_atms
    endpoint: "UNRESOLVED — Open Data ATM endpoint; host and path not established"
    spec: "UK Open Banking Open Data"
    auth: none
    note: >-
      One call. Distance sort happens on-device from the returned coordinates, as before.
    response:
      fields:
        - Identification: String
        - Name: String
        - PostalAddress: PostalAddress
        - GeoLocation: GeoLocation
        - Accessibility: "List<String>"
        - ATMServices: "List<String>"
        - Availability: LobbyHours
    errors:
      - 404: "No ATMs in the requested area"
      - 500: "Open Data service error"

  - id: get_branches
    endpoint: "UNRESOLVED — Open Data branch endpoint; host and path not established"
    spec: "UK Open Banking Open Data"
    auth: none
    status: deferred
    note: >-
      DEFERRED — branches were never built. The shipped feature is ATM-only; no
      BranchesApi/BranchRepository exists. Retained as a deferred marker, NOT consumed.
      This deferral is genuinely resumable: HSBC publishes a Branch Locator Open Data endpoint,
      so the work is scheduling, not discovery. Branches are their own feature (branch-locator).

dependencies:
  tier: consumer
  features:
    - atm-locator
