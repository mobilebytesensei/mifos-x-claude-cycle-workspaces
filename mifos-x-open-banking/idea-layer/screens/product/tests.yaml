sibling: tests
schema_version: "4.0"
feature_id: product

# ── TC-PROD-006 corrected 2026-07-30 (/idea-feature-export stale-artifact fix) ──
# It asserted state: error on 404. data-flow.yaml:29-33 maps 404 -> empty and cites api.yaml
# as its authority, while api.yaml said error — a three-way contradiction. Resolved to empty:
# a bank holding no product record is not a failure the customer can act on. api.yaml was
# corrected in the same pass, so all three now agree.
screen_id: product
scenarios:
- id: TC-PROD-001
  description: Product terms load and render all sections for HSBC Advance Account (tiered credit interest)
  state: content
  priority: critical
  given: Valid PSU access token; HSBC sandbox returns OBReadProduct2 for account 40051512345678 with two
    credit interest tiers
  when: Screen mounts with accountId=40051512345678
  then:
  - Product header card shows 'HSBC Advance Account' and type label 'PCA'
  - Product ID caption rendered
  - "Fees section: Monthly Maximum Charge shows \xA30.00"
  - "Credit Interest section: first tier shows 'Up to \xA31,000 \xB7 paid Monthly' with '0.00% AER'"
  - "Credit Interest section: second tier shows 'Up to \xA310,000 \xB7 paid Monthly' with '0.15% AER'"
  - 'Overdraft section: Arranged overdraft row shows 39.9% EAR'
  - 'Overdraft section: Unarranged overdraft row shows 49.9% EAR'
  - 'Features section: 6 feature rows each with check_circle icon'
  - All section headers and labels render in i18n-resolved text
- id: TC-PROD-002
  description: Loading state shown while product endpoint is in flight
  state: loading
  priority: critical
  given: Slow network; API call in flight
  when: Screen mounts
  then:
  - Circular progress indicator visible with accessibility label 'Loading product terms'
  - Product sections not rendered
  - Error and empty states not visible
- id: TC-PROD-003
  description: Error state with Retry button on 403 ReadProducts permission missing
  state: error
  priority: critical
  given: Consent does not include ReadProducts; GET /accounts/{id}/product returns 403
  when: Screen mounts
  then:
  - Error empty_state renders with error_outline icon
  - Title shows 'Could not load product terms'
  - 'Body shows ViewModel error message: ''Consent does not include ReadProducts.'''
  - Retry button visible with label 'Retry'
  - "Tapping Retry dispatches retry_load action \u2192 re-triggers product_load"
- id: TC-PROD-004
  description: "Error state on 401 \u2014 access token expired"
  state: error
  priority: normal
  given: PSU access token has expired; endpoint returns 401
  when: Screen mounts
  then:
  - Error state renders with message 'Session expired. Please re-authenticate.'
  - Retry button visible
- id: TC-PROD-005
  description: Empty state for account type with no OBProduct2 entry
  state: empty
  priority: normal
  given: Valid PSU access token; account is GlobalMoney type; OBReadProduct2 Data array is empty
  when: Screen mounts
  then:
  - Empty state renders with info_outline icon (informational variant, not error)
  - Title shows 'No product information'
  - Body shows 'No product data is available for this account.'
  - No Retry button (this is not a retriable error)
  - Product sections (Fees, Credit Interest, Overdraft, Features) not rendered
- id: TC-PROD-006
  description: "Empty state on 404 \u2014 no product record for AccountId (not an error)"
  state: empty
  priority: normal
  given: AccountId does not have an associated OBProduct2 record; endpoint returns 404
  when: Screen mounts
  then:
  - Empty state renders with the no-product-data message
  - No error icon and no Retry CTA are shown
  - "Outcome matches TC-PROD-005 \u2014 a Success with no PCA/BCA block and a 404 are the same thing to\
    \ the customer"
- id: TC-PROD-007
  description: Back navigation returns to account-detail
  state: content
  priority: normal
  given: "Product terms rendered in content state for account 40051512345678, reached from the account-detail Product chip"
  when: User taps back navigation arrow in top app bar
  then:
    - "Navigates back to account-detail screen; accountId preserved in back-stack"
- id: TC-PROD-008
  description: BCA account type renders product terms from product.BCA path
  state: content
  priority: normal
  given: Valid PSU access token; HSBC sandbox returns OBReadProduct2 for a Business Current Account (BCA)
    with product.BCA non-null, product.PCA null
  when: Screen mounts with accountId referencing a BCA
  then:
  - Product header card shows BCA ProductName and type label 'BCA'
  - ProductType overline reads 'BCA' (dynamic data, i18n:skip)
  - Fee, Credit Interest, Overdraft, and Features sections render from product.BCA.* paths
  - Empty state is NOT shown (BCA product data present)
  - Error state is NOT shown
- id: TC-PROD-009
  description: Error state on network failure (device offline)
  state: error
  priority: normal
  given: Device is offline; GET /accounts/{id}/product throws IOException or similar network exception
  when: Screen mounts
  then:
  - Error empty_state renders with error_outline icon
  - Title shows 'Could not load product terms'
  - Body shows localised network error message from ViewModel
  - Retry button visible with label 'Retry'
  - Tapping Retry re-dispatches product_load; if connection restored, transitions to content or empty
    state
