sibling: demo-data
schema_version: "2.1.0"
feature_id: product

screen_id: product
models: wire
maps_to_dto: [ProductTerms, CreditInterestTier, OverdraftTier]
_models_note: "Fixtures are the OBIE wire envelope, not the domain projection. api.yaml#response_dto names the domain DTO the repository yields; the mapper sits between. RULE-DEMO-DATA-001 DD5 compares against the wire contract for this file."
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC-sandbox-style OBIE v4.0 data only."

accountId: "40051512345678"

product:
  AccountId: "40051512345678"
  ProductId: "HSBC-ADVANCE-PCA-001"
  ProductType: "PCA"
  ProductName: "HSBC Advance Account"
  PCA:
    ProductDetails:
      MonthlyMaximumCharge: "0.00"
      Features:
        - "No monthly maintenance fee"
        - "Mobile and online banking included"
        - "Arranged overdraft buffer up to £25"
        - "HSBC Rewards cashback on eligible spend"
        - "Preferential rates on HSBC savings and mortgages"
        - "24/7 telephone banking support"
    CreditInterest:
      TierBandSet:
        - TierBandMethod: "Tiered"
          TierBand:
            - TierValueMinimum: "0.01"
              BandLimit: "£1,000"
              AER: "0.00"
              ApplicationFrequency: "Monthly"
            - TierValueMinimum: "1000.01"
              BandLimit: "£10,000"
              AER: "0.15"
              ApplicationFrequency: "Monthly"
    Overdraft:
      OverdraftTierBandSet:
        - OverdraftTierBand:
            - TierValueMinimum: "0.00"
              OverdraftType: "Arranged"
              EAR: "39.9"
            - TierValueMinimum: "0.00"
              OverdraftType: "Unarranged"
              EAR: "49.9"

# Alternate fixture — empty product data (for empty state rendering)
empty_product_fixture:
  AccountId: "40051599999999"
  # GlobalMoney account — no OBProduct2 PCA/BCA entry in OBIE catalogue
  ProductType: null
  ProductName: null
  PCA: null
  BCA: null

# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, empty, error]. empty_product_fixture covered the
# empty case; `error` had nothing.
states:
  - scope: content
    accountId: "40051512345678"
    product: product

  - scope: loading
    accountId: "40051512345678"

  - scope: empty
    accountId: "40051512345678"
    product: empty_product_fixture
    message: "No product details available for this account."
    detail: "Your bank has not published product information for this account type."
    _empty_is_a_catalogue_gap: >-
      Not "you have no product" — every account HAS one. OBIE's product endpoint simply has no
      OBProduct2 entry for some account subtypes (GlobalMoney and GlobalWallet in the HSBC
      sandbox), which is exactly what empty_product_fixture models with its null PCA/BCA.

  - scope: error
    error_type: ProductLoadFailed
    message: "Could not load product details"
    recovery: "Check your connection and try again."
    recoverable: true
