sibling: api
schema_version: "4.0"
feature_id: product
_source: source_analysis
base_url: "https://{HSBC_BANK_HOST} (HSBCUKSandboxConfig defaultRequest base; mTLS transport.p12 QWAC)"

auth:
  scheme: psu_bearer
  description: >-
    AIS read — PSU access token from secure Settings (hsbc_tokens) attached automatically by the Ktor Auth
    plugin; refresh-on-401 once (RETRIED_AFTER_REFRESH guard). Transport is mTLS. The PSU tokens were
    obtained via authorization_code (consent-callback) with a private_key_jwt PS256 client assertion.

api:
  - id: get_account_product
    method: GET
    path: "/v4.0/aisp/accounts/{AccountId}/product"
    source_ref: "core/network/.../api/Aisp.kt#getProduct"
    repository_ref: "core/data/.../banking/ProductRepository.kt#getProduct"
    description: >-
      OBIE v4.0 product endpoint. Returns PCA/BCA product terms (monthly maximum charge, credit interest
      tier bands, overdraft tier bands, features). Repository maps ProductResponse → ProductTerms? —
      null when neither PCA nor BCA is present (GlobalMoney, Savings, CreditCard).
    params:
      AccountId: { type: String, required: true, in: path, source: nav_params.accountId }
    headers:
      Authorization: "Bearer {psu_access_token}"
    response:
      type: ProductResponse
      domain: "ProductTerms?"
      fields:
        accountId: String
        productId: String
        productName: String
        productType: String
        monthlyMaximumCharge: "String?"
        creditInterestTiers: "List<CreditInterestTier{bandLimit, aer, applicationFrequency}>"
        overdraftTiers: "List<OverdraftTier{overdraftType, ear}>"
        features: "List<String>"
    request_dto: null
    response_dto: ProductResponse
    error_dto: ObErrorResponse
    errors:
      401: "Unauthorized → ProductErrorKind.TokenExpired (after one refresh attempt)"
      403: "Forbidden → ProductErrorKind.ConsentScope (consent lacks ReadProducts)"
      404: "NotFound → Empty state (no product record — not an error)"
      429: "RateLimited → ProductErrorKind.Network (not distinguished)"
      5xx: "Server → ProductErrorKind.Network"
    cache: none            # deliberate: no Store5; terms can be revised by the bank
    pagination: { type: none }
    required_permission: ReadProducts
