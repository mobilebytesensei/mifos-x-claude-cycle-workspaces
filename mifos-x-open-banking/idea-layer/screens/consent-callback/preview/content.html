<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consent Callback — content</title>
<style>
  :root {
    --primary: #266489; --on-primary: #FFFFFF; --primary-container: #C9E6FF; --on-primary-container: #004B6F;
    --secondary: #50606E; --secondary-container: #D3E5F5; --tertiary: #64597B;
    --background: #F7F9FF; --surface: #F7F9FF;
    --surface-container-low: #F1F4F9; --surface-container: #EBEEF3; --surface-container-high: #E5E8ED;
    --on-surface: #181C20; --on-surface-variant: #41474D;
    --outline: #72787E; --outline-variant: #C1C7CE; --error: #BA1A1A;
    --font-brand: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs-headline-small: 1.5rem; --fs-body-medium: 0.875rem; --fs-label-medium: 0.75rem;
    --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px; --sp-2xl: 32px;
    --r-small: 8px; --r-medium: 12px; --r-large: 16px; --r-full: 9999px;
    --el-0: none;
    --el-1: 0 1px 2px rgba(24,28,32,.08), 0 1px 3px rgba(24,28,32,.06);
    --el-2: 0 1px 2px rgba(24,28,32,.10), 0 2px 6px rgba(24,28,32,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #95CDF7; --on-primary: #00344E; --primary-container: #004B6F; --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9; --secondary-container: #384956; --tertiary: #CFC0E8;
      --background: #101417; --surface: #101417;
      --surface-container-low: #181C20; --surface-container: #1C2024; --surface-container-high: #262A2E;
      --on-surface: #E0E3E8; --on-surface-variant: #C1C7CE;
      --outline: #8B9198; --outline-variant: #41474D; --error: #FFB4AB;

      --el-2: 0 1px 2px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--background); color: var(--on-surface); font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  .success-mark svg { width: 52px; height: 52px; display: block; }

  .body { font-size: var(--fs-body-medium); line-height: 1.55; color: var(--on-surface-variant); margin: 0; max-width: 36ch; }

<body>
<div class="screen" data-screen="consent-callback" data-state="content"
     data-component-type="stack" data-component-id="success_layout" data-test-tag="callback_content"
     role="status" aria-live="polite" aria-label="Authorisation complete">

  <span class="success-mark" data-component-type="icon" data-component-id="success_icon" aria-label="HSBC authorisation successful">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="m8.2 12.2 2.6 2.6 5-5.6"/>
    </svg>
  </span>

  <h1 class="title" data-component-type="text" data-component-id="success_title">Connected to HSBC</h1>
  <p class="body" data-component-type="text" data-component-id="success_body">Your account data is ready. Taking you to your accounts now.</p>

  <span class="progress-linear" role="progressbar" aria-label="Redirecting to your accounts"
        data-component-type="progress_linear" data-component-id="redirect_progress"
        data-nav-to="accounts" data-nav-type="replace">
    <span class="progress-linear__bar"></span>
  </span>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
