sibling: api
schema_version: "4.0"
feature_id: consent-callback

screen_id: consent-callback

endpoints:
  - id: fapi-token-exchange
    method: POST
    path: "/oauth2/token"
    base_url: "https://api.hsbc.com/open-banking/v4.0"
    notes: >
      FAPI-1.0-Advanced authorization_code token exchange. Called with:
      grant_type=authorization_code, code={route_params.code},
      redirect_uri={registered_redirect_uri},
      client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer,
      client_assertion={private_key_jwt}. Returns access_token (PSU bearer),
      refresh_token, token_type=Bearer, expires_in. Stored in EncryptedSharedPreferences.
      HTTP 400 → Rejected/bad_code; HTTP 401 → private_key_jwt auth failed.
    request_body:
      grant_type: "authorization_code"
      code: "{route_params.code}"
      redirect_uri: "{registered_redirect_uri}"
      client_assertion_type: "urn:ietf:params:oauth:client-assertion-type:jwt-bearer"
      client_assertion: "{private_key_jwt}"
    response_dto: PsuTokenResponse
    permission: null
    requires_auth: false
    error_codes:
      400: "Bad code, expired code, or redirect_uri mismatch"
      401: "Private key JWT assertion invalid or key not registered"

  - id: consent-status
    method: GET
    path: "/account-access-consents/{ConsentId}"
    base_url: "https://api.hsbc.com/open-banking/v4.0"
    response_dto: ConsentSummary
    permission: null
    requires_auth: true
    auth_type: client_credentials
    path_params:
      ConsentId: string
    notes: >
      Called after auth-code → token exchange to confirm consent Status is Authorised.
      Authenticated with client_credentials token (NOT the PSU bearer token).
      Returns Status ∈ {Authorised, AwaitingAuthorisation, Rejected, Consumed, Revoked}.
      May need one poll if HSBC takes a moment to update status post-authorization.
    success_condition: "Data.Status == 'Authorised'"
    empty_condition: "Data.Status == 'AwaitingAuthorisation'"
    error_condition: "Data.Status == 'Rejected' || Data.Status == 'Revoked'"
    error_codes:
      401: "Client credentials token invalid or expired"
      404: "ConsentId not found (stale or already consumed)"

inbound_redirect_params:
  _note: "These are NOT API calls — they are route params carried in the deep-link URI from HSBC."
  success_params:
    code: "string — OAuth2 authorisation code (single-use, ~10 min TTL)"
    id_token: "string — OIDC hybrid-flow ID Token (JWT); its nonce claim MUST equal the nonce stored before redirect"
    state: "string — Opaque value; MUST equal the state stored before redirect"
  error_params:
    error: "access_denied | temporarily_unavailable | server_error"
    error_description: "string (optional) — human-readable detail from HSBC"
    state: "string — MUST still be validated even on error to prevent CSRF"
