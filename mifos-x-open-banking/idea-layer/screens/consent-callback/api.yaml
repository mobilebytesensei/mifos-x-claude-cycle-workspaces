sibling: api
schema_version: "4.0"
feature_id: consent-callback
_source: source_analysis
_last_enriched: "2026-10-22"
_enrichment_note: "/idea-plan-add 2026-10-22 — code exchange moved to the Cloudflare Worker bank gateway (TD-008, FR-053, FR-054); the app no longer holds client credentials, signs nothing and stores no HSBC token"
base_url: "{GATEWAY_BASE_URL} — the Cloudflare Worker bank gateway (bank-gateway/, TD-008). The Worker alone talks to https://{HSBC_BANK_HOST} over mTLS; the app needs no certificate."

auth:
  gateway_session: >-
    Opaque session minted by POST /v1/auth/complete after the Worker has verified the id_token and exchanged
    the code. Sent as `Authorization: Session <id>` on later calls. Stored in secure Settings with its expiry
    only (GatewaySession entity); HSBC access/refresh/id tokens never reach the device.
  attestation: "Android sends X-Attestation: play <token>; iOS sends X-Attestation: ios <keyId>.<assertion> (FR-055). Desktop and web send none and are rate-limited."
  client_headers: "X-Client-Platform (android|ios|desktop|web), X-Client-Instance (install-scoped random id)."

api:
  - id: complete_auth
    method: POST
    path: /v1/auth/complete
    source_ref: "core/network/.../api/Session.kt#completeAuth (phase 07 of goal hsbc-identity-bank-gateway)"
    repository_ref: "core/data/.../callback/ConsentCallbackRepository.kt#exchangeCode"
    description: >-
      Hands the validated redirect values to the bank gateway. The Worker: matches flowId + state to the flow it created
      when the consent was started; verifies the id_token (PS256 signature against the HSBC JWKS, iss, aud =
      client id, exp, nonce, c_hash, s_hash — FR-054) BEFORE exchanging the code; exchanges the code at HSBC
      (authorization_code grant, private_key_jwt, no scope); reads the consent status with a client_credentials
      token; if the consent is Rejected it discards the tokens and answers 409 (DEF-001); otherwise it stores the
      PSU tokens in its SessionDO and returns an opaque session.
    auth: attestation (android|ios) + rate limit
    content_type: application/json
    request:
      dto: AuthCompleteRequest
      fields: { flowId: String, code: String, idToken: String, state: String }
    response:
      type: AuthCompleteResponse
      fields: { session: String, expiresAt: Long, leg: "String (ais)", consentId: String, consentStatus: "String (Authorised | AwaitingAuthorisation)", consentExpiresAt: "String?" }
    response_dto: AuthCompleteResponse
    errors:
      400_invalid_id_token: "ScreenState.Error → SecurityError (id_token failed verification; code never exchanged)"
      400_state_mismatch: "SecurityError"
      401_403_attestation: "ScreenState.Error → Error(AUTHORISATION_FAILED)"
      409_consent_rejected: "Rejected (tokens discarded server-side, ConsentSession cleared)"
      429: "Error(TOKEN_EXCHANGE_FAILED) — rate limited, retry later"
      502_bank: "Error(TOKEN_EXCHANGE_FAILED)"
      network: "ScreenState.NoNetwork → Error(NETWORK_UNREACHABLE)"
    cache: none

  - id: get_account_access_consent
    method: GET
    path: "/v1/consents/ais/{ConsentId}"
    source_ref: "core/network/.../api/Aisp.kt#getConsent (bank gateway path)"
    repository_ref: "core/data/.../callback/ConsentCallbackRepository.kt#pollConsentStatus"
    description: "Re-reads the consent for the Awaiting state (PollConsentStatus). The Worker uses its cached client_credentials token; the app sends only its session."
    auth: gateway_session
    params:
      ConsentId: { type: String, required: true, in: path, source: "AuthCompleteResponse.consentId" }
    headers:
      Authorization: "Session {GatewaySession.session}"
    response:
      type: HSBCCreateConsentResponse
      domain: "ConsentStatusResult{status: ConsentStatus, expirationDateTime: String?}"
      fields: { data.consentId: String, data.status: String, data.expirationDateTime: "String?" }
    response_dto: HSBCCreateConsentResponse
    error_dto: ObErrorResponse
    errors:
      401: "session expired → Error(AUTHORISATION_FAILED)"
      default: "ignored — expiry saved as empty string"
    cache: none

  - id: authorization_redirect
    method: GET
    path: "org.mifosx.openbanking://callback?code=…&id_token=…&state=… (mobile) | http://127.0.0.1:8765/callback?… (desktop)"
    description: >-
      Inbound redirect (not an HTTP call). HSBC returns to the static HTTPS relay
      (https://mifos-x-open-banking-relay.pages.dev/callback/, relay/ in the app repo), which reads the URL
      fragment and forwards it to the app scheme or the desktop loopback. Parsed by parseCallbackUrl →
      {code, id_token, state, error, error_description}; the values are then sent to complete_auth.
    auth: authorization_code (front channel)
    response:
      type: redirect
      fields: { code: "String?", id_token: "String?", state: "String?", error: "String?", error_description: "String?" }

removed_operations:
  - { id: exchange_authorization_code, moved_to: "bank gateway /v1/auth/complete", reason: "private_key_jwt signing and mTLS leave the app (FR-053)" }
  - { id: create_client_credentials_token, moved_to: "bank gateway TokenCacheDO", reason: "client credentials are TPP identity (FR-053)" }
