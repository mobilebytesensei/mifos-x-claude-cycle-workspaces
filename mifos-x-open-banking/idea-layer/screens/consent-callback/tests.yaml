# screens/consent-callback/tests.yaml — emitted by /idea-feature-enrich Phase 3 (sub-plan 05 T4)
schema_version: v1.0.0
source: idea-feature-enrich
feature_id: consent-callback
scenarios:
  - id: loading_initial_render
    preconditions:
      - "PendingAuth stored by login within the last 1200s"
      - "redirect URL delivered via ConsentRedirectBus"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
    assertions:
      - "callback_loading visible with verifying copy"
      - "ProcessCallback dispatched exactly once for the redirect"
    priority: low

  - id: content_authorised_completes_sign_in
    preconditions:
      - "valid state, nonce and code"
      - "token exchange succeeds"
      - "consent status poll returns Authorised"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
      - "wait 1500ms"
    assertions:
      - "callback_content visible"
      - "ConsentSession holds PSU tokens, consentId and expiry"
      - "NavigateToHome emitted"
    priority: high

  - id: content_awaiting_poll_completes_sign_in
    preconditions:
      - "token exchange succeeds"
      - "consent status poll returns AwaitingAuthorisation"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
      - "wait 1500ms"
    assertions:
      - "callback_content visible"
      - "NavigateToHome emitted (FR-022 AC: Awaiting poll still completes sign-in)"
    priority: high

  - id: rejected_consent_blocks_sign_in
    preconditions:
      - "token exchange succeeds"
      - "consent status poll returns Rejected"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
    assertions:
      - "callback_rejected visible with 'Your bank rejected this request'"
      - "consentSession.save(tokens) never called — no PSU tokens persisted"
      - "ConsentSession cleared"
      - "NavigateToHome NOT emitted (DEF-001)"
    priority: high

  - id: rejected_tap_start_again
    preconditions:
      - "screen in rejected state"
    actions:
      - "tap callback_rejected_start_again"
    assertions:
      - "consentSession.clear() called"
      - "NavigateToLogin emitted → AuthGraph (Intro)"
    priority: medium

  - id: awaiting_check_again_rejected
    preconditions:
      - "screen in awaiting state with pendingConsentId set"
      - "re-poll returns Rejected"
    actions:
      - "tap callback_check_again"
    assertions:
      - "callback_rejected visible"
      - "NavigateToHome NOT emitted"
    priority: medium

  - id: access_denied_user_decline_is_neutral
    preconditions:
      - "redirect carries error=access_denied with matching state"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
    assertions:
      - "callback_access_denied visible with 'Access not shared' copy and neutral info icon"
      - "callback_error NOT shown (DEF-006)"
    priority: medium

  - id: error_network_unreachable_copy
    preconditions:
      - "valid redirect"
      - "device offline during token exchange"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
    assertions:
      - "callback_error visible with 'Unable to reach HSBC' title"
      - "no 'declined' wording rendered (DEF-006)"
    priority: medium

  - id: error_token_exchange_failed_copy
    preconditions:
      - "valid redirect"
      - "token endpoint returns 5xx"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
    assertions:
      - "callback_error visible with 'Couldn't finish connecting' title (TOKEN_EXCHANGE_FAILED)"
    priority: medium

  - id: error_authorisation_failed_copy
    preconditions:
      - "valid redirect"
      - "token endpoint returns 401"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
    assertions:
      - "callback_error visible with 'Authorisation failed' title (AUTHORISATION_FAILED)"
    priority: medium

  - id: error_missing_code_copy
    preconditions:
      - "redirect has matching state and nonce but no code"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
    assertions:
      - "callback_error visible with 'Authorisation incomplete' title (MISSING_CODE)"
    priority: medium

  - id: error_tap_try_again
    preconditions:
      - "screen in error state"
    actions:
      - "tap callback_error_retry"
    assertions:
      - "NavigateToLogin emitted → AuthGraph (Intro)"
    priority: medium

  - id: security_error_state_mismatch
    preconditions:
      - "redirect state differs from PendingAuth.state"
    actions:
      - "open ConsentCallbackRoute(redirectUrl)"
      - "tap callback_start_again"
    assertions:
      - "callback_security_error visible"
      - "ConsentSession cleared and NavigateToLogin emitted"
    priority: medium
