sibling: demo-data
schema_version: "2.1.0"
feature_id: consent-callback

screen_id: consent-callback
models: wire
maps_to_dto: [PsuTokenResponse, ConsentSummary]
_models_note: "Fixtures are the OBIE wire envelope, not the domain projection. api.yaml#response_dto names the domain DTO the repository yields; the mapper sits between. RULE-DEMO-DATA-001 DD5 compares against the wire contract for this file."
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC-sandbox-style data only."

# ── Success scenario ───────────────────────────────────────────────────────────
redirect_success_example:
  _note: "Deep-link URI params received from HSBC when PSU approves the consent (hybrid flow returns code + id_token)"
  code: "YTJhMTZjNjAtODQwZS00N2U1LTk0ODMtMGYwMjcyYzdlMDdk"
  id_token: "eyJhbGciOiJQUzI1NiIsImtpZCI6Imhzc..."
  state: "b5f2c3a1d4e8f9102b3c4d5e6f7a8b9c"

consent_authorised_example:
  _note: "GET /account-access-consents/{ConsentId} response when consent is Authorised"
  Data:
    ConsentId: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    Status: "Authorised"
    CreationDateTime: "2026-06-29T10:00:00Z"
    StatusUpdateDateTime: "2026-06-29T10:00:45Z"
    Permissions:
      - ReadAccountsDetail
      - ReadBalances
      - ReadTransactionsDetail
      - ReadBeneficiariesDetail
      - ReadStandingOrdersDetail
      - ReadDirectDebits
      - ReadScheduledPaymentsDetail
      - ReadStatementsDetail
      - ReadProducts
      - ReadParty
    ExpirationDateTime: "2026-09-26T00:00:00Z"
    TransactionFromDateTime: "2026-03-30T00:00:00Z"
    TransactionToDateTime: "2026-06-28T23:59:59Z"
  Links:
    Self: "https://api.hsbc.com/open-banking/v4.0/account-access-consents/aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
  Meta:
    TotalPages: 1

token_response_example:
  _note: "FAPI /oauth2/token response on successful authorization_code exchange"
  access_token: "eyJhbGciOiJQUzI1NiIsImtpZCI6Imhzc..."
  token_type: "Bearer"
  expires_in: 3600
  refresh_token: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
  scope: "accounts"

# ── AwaitingAuthorisation scenario ────────────────────────────────────────────
consent_awaiting_example:
  _note: "GET /account-access-consents/{ConsentId} response when HSBC update is delayed"
  Data:
    ConsentId: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    Status: "AwaitingAuthorisation"
    CreationDateTime: "2026-06-29T10:00:00Z"
    StatusUpdateDateTime: "2026-06-29T10:00:02Z"
    Permissions:
      - ReadAccountsDetail
      - ReadBalances
      - ReadTransactionsDetail
    ExpirationDateTime: "2026-09-26T00:00:00Z"
  Links:
    Self: "https://api.hsbc.com/open-banking/v4.0/account-access-consents/aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
  Meta:
    TotalPages: 1

# ── Rejection scenario ────────────────────────────────────────────────────────
consent_rejected_example:
  _note: "GET /account-access-consents/{ConsentId} response when PSU rejected via token exchange path"
  Data:
    ConsentId: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    Status: "Rejected"
    CreationDateTime: "2026-06-29T10:00:00Z"
    StatusUpdateDateTime: "2026-06-29T10:01:10Z"
    Permissions: []
    ExpirationDateTime: "2026-09-26T00:00:00Z"
  Links:
    Self: "https://api.hsbc.com/open-banking/v4.0/account-access-consents/aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
  Meta:
    TotalPages: 1

# ── Access Denied redirect scenario ──────────────────────────────────────────
redirect_access_denied_example:
  _note: "Deep-link URI params received from HSBC when PSU clicks Deny at the authorisation portal"
  error: "access_denied"
  error_description: "The resource owner or authorization server denied the request."
  state: "b5f2c3a1d4e8f9102b3c4d5e6f7a8b9c"

# ── Security Error scenario (state mismatch) ───────────────────────────────────
redirect_state_mismatch_example:
  _note: "Simulated CSRF attempt — state param in redirect does not match stored OAuth state"
  code: "YTJhMTZjNjAtODQwZS00N2U1LTk0ODMtMGYwMjcyYzdlMDdk"
  state: "0000000000000000000000000000000000"  # ← does NOT match stored b5f2c3a1...
  _stored_state: "b5f2c3a1d4e8f9102b3c4d5e6f7a8b9c"

# ── Token exchange error scenario ────────────────────────────────────────────
token_exchange_error_example:
  _note: "HSBC /oauth2/token HTTP 400 response on bad or expired auth code"
  status: 400
  body:
    error: "invalid_grant"
    error_description: "The provided authorization grant is invalid, expired, revoked, does not match the redirection URI used in the authorization request, or was issued to another client."

# ── State index (added 2026-08-02 via /idea-data) ────────────────────────────
# ui.yaml declares states: [loading, awaiting, content, access_denied, security_error, error].
# Like payment-consent this is an OAuth return leg, so it carries no `empty` — already recorded
# as a dismissal in DESIGN_VALIDATION ("neither renders a collection"). Every state below had a
# fixture under an ad-hoc *_example key; this block is the index over them.
states:
  - { scope: loading,  fixture: redirect_success_example }
  - { scope: awaiting, fixture: consent_awaiting_example,
      _meaning: "The bank accepted the redirect but has not finished authorising — poll, do not fail." }
  - { scope: content,  fixture: consent_authorised_example,
      _terminal: "Authorised. The token from token_response_example is now usable." }
  - { scope: access_denied, fixture: redirect_access_denied_example,
      recoverable: false,
      _meaning: "The PSU declined at their bank. NOT an error — a decision. The copy must not read as a failure or a retry prompt." }
  - { scope: security_error, fixture: redirect_state_mismatch_example,
      recoverable: false,
      _meaning: "The returned state parameter did not match the one we sent. Treated as a possible tampering signal: the flow is abandoned, never retried, and the consent is not used." }
  - { scope: error, fixture: token_exchange_error_example,
      recoverable: false,
      _meaning: "invalid_grant — the code was already spent, expired, or issued to another client. A retry re-sends the same dead code." }
