sibling: flow
schema_version: "4.0"
feature_id: consent-callback

feature: consent-callback
flow_ref: app-main

entry_points:
  - source: hsbc_oauth_redirect
    label: "Deep-link callback from HSBC authorisation portal — carries ?code=&id_token=&state= on success or ?error=&error_description= on denial"
    params:
      code: "OAuth2 authorisation code (present on success)"
      id_token: "OIDC hybrid-flow ID Token (JWT) — nonce claim must match locally stored value"
      state: "Opaque state param — must match locally stored value"
      error: "access_denied | temporarily_unavailable | server_error (present on failure)"
      error_description: "Human-readable error detail from HSBC (optional)"

transitions:
  - from: consent-callback
    to: accounts
    trigger: "Consent status confirmed Authorised — auto-navigate after 1.5 s (content state)"
  - from: consent-callback
    to: login
    trigger: "PSU rejected consent or token exchange failed — user taps 'Try again' (error state)"
  - from: consent-callback
    to: login
    trigger: "PSU chose not to share data at HSBC portal — user taps 'Start over' (access_denied state)"
  - from: consent-callback
    to: login
    trigger: "FAPI state parameter mismatch detected — user taps 'Start again' (security_error state)"

# Moved verbatim from ui.yaml 2026-07-31 (CROSS_LEAK repair).
dependencies:
  tier: 0
  features:
    - accounts
    - login
