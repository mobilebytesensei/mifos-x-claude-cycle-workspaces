sibling: flow
schema_version: "4.0"
feature_id: payments-hub
_source: source_analysis

navigates_to:
  - send-money
  - payments-schedule-payment
  - payments-standing-order
  - vrp

inbound_routes: []   # unreachable — no caller navigates to PaymentsHubDestination (see ui.yaml known_gaps.hub-graph-unreachable)

transitions:
  - { id: send_money, from: content, trigger: "tap Send money card", to: send-money, type: push }
  - { id: schedule, from: content, trigger: "tap Schedule card", to: payments-schedule-payment, type: push }
  - { id: standing_order, from: content, trigger: "tap Standing order card", to: payments-standing-order, type: push }
  - { id: vrp, from: content, trigger: "tap Variable Recurring Payments card", to: vrp, type: push }

flow_logic:
  on_load:
    - note: "static composable — no ViewModel, no data load; renders content immediately"
  on_send_money:
    - navigate: send-money
      route: SendMoneyRoute
  on_schedule_payment:
    - navigate: payments-schedule-payment
      route: SchedulePaymentRoute
  on_standing_order:
    - navigate: payments-standing-order
      route: StandingOrderRoute
  on_vrp:
    - navigate: vrp
      route: "navigateToVrpConsentList()"

error_handling: {}   # no failure modes — no I/O

journey_ids: []

dependencies:
  repositories: []
  services: []
