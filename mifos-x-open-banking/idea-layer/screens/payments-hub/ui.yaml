sibling: ui
schema_version: "4.0"
feature_id: payments-hub
screen_id: payments-hub
name: "Payments"
status: enriched
_source: source_analysis
_source_paths:
  - feature/payments-hub/src/commonMain/kotlin/org/mifosx/openbanking/feature/paymentshub/PaymentsHubScreen.kt
  - feature/payments-hub/src/commonMain/kotlin/org/mifosx/openbanking/feature/paymentshub/PaymentsHubContent.kt
  - feature/payments-hub/src/commonMain/kotlin/org/mifosx/openbanking/feature/paymentshub/PaymentsHubDestination.kt
  - cmp-navigation/src/commonMain/kotlin/cmp/navigation/authenticatednavhost/AuthenticatedNavHostScreen.kt
requirement_refs: [FR-026]
archetype: dashboard
states: [content]
initial_state: content          # static menu, no ViewModel, no api
feature_profile:
  combo_id: content_showcase_navigate
  facets: [content, navigate]
  archetype: screen-content
  store_archetype: NONE
  recipe_ref: FEATURE_LAYER_BUILD_GUIDE
  heal: auto
  profile_hash: scaffold-default

route: PaymentsHubRoute          # inside navigation<PaymentsHubDestination>(startDestination = PaymentsHubRoute)
entry_points: []                 # registered in AuthenticatedNavHost but NOTHING navigates to PaymentsHubDestination/Route
nav_params: {}

business_logic:
  kind: static
  description: >
    Stateless menu of the four payment products as a 2x2 grid of quick-action cards. No ViewModel,
    no repository, no network. Each card invokes a navigation lambda supplied by
    AuthenticatedNavHostScreen (send-money, payments-schedule-payment, payments-standing-order, vrp).
  library_refs: []

screens:
  - id: payments-hub-screen
    title: "Payments"   # i18n: skip — HARDCODED in PaymentsHubScreen (feature_payments_hub_title exists but unused; see known_gaps)
    type: dashboard
    archetype: dashboard
    states: [content]
    description: >
      KptScaffold with no navigation icon titled "Payments". Vertically scrollable column holding one
      QuickActionsSection: two rows of two equal-height outlined cards (min height = DesignToken.sizes.cardMin),
      each with a primaryContainer circular icon well, a semibold label and a bodySmall subtext.

state_model: {}   # no ViewModel by design (Static menu)

components:
  - id: top_bar
    type: top-bar
    impl: "KptScaffold(showNavigationIcon = false)"
    title: "Payments"   # i18n: skip — hardcoded literal in source

  - id: quick_actions_grid
    type: grid
    columns: 2
    test_tag: "paymentsHub:quickActionsGrid"
    style: { gap: KptTheme.spacing.md, padding_horizontal: KptTheme.spacing.lg }
    children:
      - id: quick_action_send_money
        type: card
        test_tag: "paymentsHub:quickActionSendMoney"
        icon: send
        label: "Send money"          # i18n: skip — hardcoded (feature_payments_hub_send_money unused)
        subtext: "Pay instantly"     # i18n: skip — hardcoded, no string resource
        style: { background: surface, border: outlineVariant hairline, icon_well: primaryContainer }
        on_click:
          action: onNavigateToSendMoney
          target: send-money
          action_contract:
            effect: navigate
            handler: "onNavigateToSendMoney → navController.navigate(SendMoneyRoute)"
            description: "Opens the send-money form (SendMoneyRoute) for an immediate domestic or international single payment; no state change on the hub."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: quick_action_schedule
        type: card
        test_tag: "paymentsHub:quickActionSchedule"
        icon: calendar_month
        label: "Schedule"            # i18n: skip — hardcoded
        subtext: "Pay on a date"     # i18n: skip — hardcoded
        on_click:
          action: onNavigateToSchedulePayment
          target: payments-schedule-payment
          action_contract:
            effect: navigate
            handler: "onNavigateToSchedulePayment → navController.navigate(SchedulePaymentRoute)"
            description: "Opens the future-dated single payment form (SchedulePaymentRoute)."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: quick_action_standing_order
        type: card
        test_tag: "paymentsHub:quickActionStandingOrder"
        icon: sync
        label: "Standing order"          # i18n: skip — hardcoded
        subtext: "Repeat on schedule"    # i18n: skip — hardcoded
        on_click:
          action: onNavigateToStandingOrder
          target: payments-standing-order
          action_contract:
            effect: navigate
            handler: "onNavigateToStandingOrder → navController.navigate(StandingOrderRoute)"
            description: "Opens the standing-order mandate form (StandingOrderRoute) owned by payments-standing-order."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: quick_action_vrp
        type: card
        test_tag: "paymentsHub:quickActionVrp"
        icon: speed
        label: "Variable Recurring Payments"   # i18n: skip — hardcoded
        subtext: "Pay without signing in"      # i18n: skip — hardcoded
        on_click:
          action: onNavigateToVrp
          target: vrp
          action_contract:
            effect: navigate
            handler: "onNavigateToVrp → navController.navigateToVrpConsentList()"
            description: "Opens the VRP consent list (vrp feature) where the user can set up or pay under a variable recurring payment consent."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"

state_components:
  content:
    components: [top_bar, quick_actions_grid]
    description: "The only state — four cards, always enabled."

visual_assets: []   # Material vector icons only (Send, CalendarMonth, Sync, Speed)

strings_ref: feature/payments-hub/src/commonMain/composeResources/values/strings.xml
i18n:
  en:
    # Declared in strings.xml but NONE are referenced by the Compose code (all UI text is hardcoded):
    feature_payments_hub_title: "Payments"
    feature_payments_hub_subtitle: "Manage your transfers and payments"
    feature_payments_hub_quick_actions: "Quick actions"
    feature_payments_hub_send_money: "Send money"
    feature_payments_hub_schedule: "Schedule"
    feature_payments_hub_standing_order: "Standing order"
    feature_payments_hub_international: "International"
    feature_payments_hub_check_funds: "Check funds"
    feature_payments_hub_recent_activity: "In-flight & Recent"
    feature_payments_hub_empty_activity: "No payments yet"
    feature_payments_hub_empty_activity_body: "Your payment activity will appear here after your first transfer."
    feature_payments_hub_error_title: "Couldn't load payments"
    feature_payments_hub_retry: "Try again"

known_gaps:
  - id: hub-graph-unreachable
    severity: error
    description: "paymentsHubGraph is registered in AuthenticatedNavHostScreen but no screen, tab or deep link navigates to PaymentsHubDestination/PaymentsHubRoute; Home calls the four payment routes directly. The hub is dead UI (FR-026 'Hub reachable from the shell')."
  - id: hardcoded-strings
    severity: error
    description: "Title 'Payments' and all four card labels/subtexts are string literals in PaymentsHubScreen/PaymentsHubContent while matching feature_payments_hub_* resources exist unused (RULE-IMPL-NO-HARDCODED-STRING-001). Subtext strings have no resources at all."
  - id: orphan-strings
    severity: info
    description: "subtitle, international, check_funds, recent_activity, empty_activity, error_title and retry strings describe an activity feed / error state that the hub does not implement."
  - id: default-noop-lambdas
    severity: warn
    description: "onNavigateToSchedulePayment / StandingOrder / Vrp default to {} in PaymentsHubScreen, PaymentsHubContent and paymentsHubGraph; a caller that omits them silently gets dead cards. The current NavHost passes all four."
  - id: no-back-affordance
    severity: info
    description: "showNavigationIcon = false although the hub would be pushed onto the authenticated stack, not a top-level tab."
