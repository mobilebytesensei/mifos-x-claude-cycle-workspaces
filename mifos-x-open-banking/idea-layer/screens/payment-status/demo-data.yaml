# ADDED 2026-08-07 with the FOURTH disposition. The tracker is shared by all seven rails but
# every fixture above is a domestic SINGLE payment, so instruction_established had no fixture at
# all — the disposition the four deferred families terminate in was untestable.
# Wire shape is DomesticStandingOrderResponse, not DomesticPaymentResponse: the deferred rails
# carry FirstPaymentAmount + Frequency and have no InstructedAmount. Mirrors standing order
# 19916 in pay-domestic-standing-order/demo-data.yaml so the two features track one instruction.
payment_instruction_established:
  Data:
    DomesticStandingOrderId: "19916"
    ConsentId: "45171"
    Status: "INCO"
    CreationDateTime: "2026-08-06T10:35:56+00:00"
    StatusUpdateDateTime: "2026-08-06T10:35:56+00:00"
    Initiation:
      MandateRelatedInformation:
        Frequency: { Type: "WEEK" }
        FirstPaymentDateTime: "2026-08-13T10:32:55+00:00"
        FinalPaymentDateTime: "2026-12-04T10:32:55+00:00"
      FirstPaymentAmount: { Amount: "0.01", Currency: "GBP" }
      CreditorAccount:
        SchemeName: "UK.OBIE.SortCodeAccountNumber"
        Identification: "80200110203349"
        Name: "Mr Mark"
    Charges:
      - { ChargeBearer: "BorneByDebtor", Type: "UK.OBIE.CHAPSOut", Amount: { Amount: "0.05", Currency: "GBP" } }
  Links:
    Self: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/pisp/domestic-standing-orders/19916"
  Meta:
    TotalPages: 1
  _expected_disposition: instruction_established
  _expected_chip: { icon: event_repeat, container: surfaceVariant, tonal: false }
  _forbidden_in_rendering: ["paid", "sent", "complete", "completed", "check_circle", "schedule"]
  _note: >-
    INCO is TERMINAL for this rail, not transient. It must render neutrally: a tick would claim
    the 0.01 moved when the first payment is not due until 13 August, and falling through to
    in_progress would claim live activity on a dormant instruction. Neither is true, which is why
    the disposition vocabulary grew rather than INCO being forced into it.
    Note the amount field: this rail carries FirstPaymentAmount and no InstructedAmount, so the
    tracker's amountLabel cannot read a single hardcoded path. It is also why the label must say
    what the first payment WILL be, never what was paid.

payment_unknown_status:
  # A status outside the mapped vocabulary. The app must fail open toward in_progress.
  # SCOPE (2026-08-07): AcceptedTechnicalValidation is genuinely absent from ObStatusCode — that
  # is what makes it a valid fixture for this branch. Fail-open is a safety net for codes nobody
  # anticipated; it is NOT a substitute for mapping an enum member. INCO was in the enum and
  # still landed here before the fourth disposition existed, which is the defect this fixture
  # must not be read as licensing.
  Data:
    DomesticPaymentId: "PMT-812774903-03"
    ConsentId: "812774905"
    Status: "AcceptedTechnicalValidation"
    CreationDateTime: "2026-07-30T11:20:00+00:00"
    StatusUpdateDateTime: "2026-07-30T11:20:00+00:00"
    Initiation:
      InstructedAmount:
        Amount: "12.50"
        Currency: "GBP"
      CreditorAccount:
        SchemeName: "UK.OBIE.SortCodeAccountNumber"
        Identification: "60000199887766"
        Name: "EDF Energy"
  Meta:
    TotalPages: 1
  _expected_disposition: in_progress

error_fixtures:
  not_found:
    http_status: 400
    body:
      Code: "400"
      Id: "b81f4a02-6c35-4d97-a1e8-53c9f720be44"
      Message: "Bad Request"
      Errors:
        - ErrorCode: "U011"
          Message: "Resource cannot be found"

  rate_limited:
    http_status: 429
    headers:
      Retry-After: "12"
    body:
      Code: "429"
      Id: "5e0c9a37-8b14-42f6-90d3-7a2e1c6b04f9"
      Message: "Too Many Requests"
      Errors:
        - ErrorCode: "U002"
          Message: "Rate limit exceeded"

_test_fixtures:
  poll_stops_on_terminal:
    sequence: [payment_in_process, payment_in_process, payment_settled]
    expected_poll_count: 3
    expected_polls_after_settled: 0
  poll_never_starts_on_terminal:
    first_read: payment_settled
    expected_poll_count: 1
  unknown_status_fails_open:
    first_read: payment_unknown_status
    expected_disposition: in_progress
    expected_polling: true
  rejected_offers_new_payment:
    first_read: payment_rejected
    expected_visible: [new_payment_button]
    expected_hidden: [refresh_button]
  # ADDED 2026-08-07. The poll's stop set previously omitted instruction_established, so a
  # domestic deferred payment started polling on PDNG and never stopped.
  poll_stops_on_instruction_established:
    sequence: [payment_in_process, payment_instruction_established]
    _note: "Stands in for the domestic deferred ladder PDNG -> INCO."
    expected_poll_count: 2
    expected_polls_after_instruction_established: 0
  poll_never_starts_on_instruction_established:
    first_read: payment_instruction_established
    _note: "The international deferred rails read INCO on the very first GET; they never emit PDNG."
    expected_poll_count: 1
  instruction_established_never_claims_payment:
    first_read: payment_instruction_established
    expected_visible: [status_chip, instruction_established_note]
    expected_hidden: [refresh_button, new_payment_button, in_progress_note]
    forbidden_substrings: ["paid", "sent", "complete"]

# ── State index (added 2026-08-02 via /idea-data) ────────────────────────────
# ui.yaml declares states: [loading, content, error] — deliberately NO `empty`, because this
# screen renders a single payment resource, never a collection (already recorded as a
# dismissal in DESIGN_VALIDATION). The five payment_* fixtures are all `content`: the
# disposition varies, the state does not. All FOUR dispositions are now represented (the fourth
# added 2026-08-07).
states:
  - { scope: loading, payment: payment_in_process }
  - { scope: content, payment: payment_in_process,     disposition: in_progress }
  - { scope: content, payment: payment_settled,        disposition: terminal_success }
  - { scope: content, payment: payment_rejected,       disposition: terminal_failure }
  - { scope: content, payment: payment_instruction_established, disposition: instruction_established,
      _rendering: "Neutral by design — surfaceVariant/onSurfaceVariant, icon event_repeat, never a tick and never a clock. A hue-less treatment makes no claim about money, which is exactly the claim available (design-tokens.yaml#semantic.payment_disposition.instruction_established)." }
  - { scope: content, payment: payment_unknown_status, disposition: in_progress,
      _unknown_status_policy: "An OBIE status outside the mapped vocabulary renders as in_progress, never success or failure — failing open toward 'still working' is the only safe guess (design-tokens.yaml#semantic.payment_disposition._contract). This is a safety net for unanticipated codes, NOT a mapping strategy for enum members." }
  - { scope: error,   fixture: error_fixtures }
