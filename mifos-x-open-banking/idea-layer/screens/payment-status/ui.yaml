known_gaps:
  - id: PST-GAP-1
    severity: should
    description: "PaymentStatusRoute is registered twice — at the root NavHost (RootNavScreen, reached after payment-consent submission; back → authenticated graph/Home) and inside the authenticated host NavHost (reached from history rows; back → popBackStack). Same route, two back behaviours."
    resolution: "Spec resolved in flow.yaml#route_registration — single registration in the authenticated host; consent submission enters the authenticated graph and pushes with popUpTo(Home). Pending /kmp-implement to remove the root registration."
  - id: PST-GAP-2
    severity: could
    description: "TokenExpired / ConsentRevoked / PaymentNotFound all render a Retry button even though a retry cannot succeed; there is no 'sign in again' route out of the error page."
  - id: PST-GAP-3
    severity: could
    description: "Copy typo in shipped string feature_payment_status_detail_actc ('Payement')."
  - id: PST-GAP-4
    severity: could
    description: "feature_payment_status_error_title and feature_payment_status_retry are declared but unused — the error page uses MifosErrorComponent's own title and retry label."
