description: >-
  Settlement tracking for a submitted payment or a created mandate, shared by ALL SEVEN payment
  families. Resolves its endpoint and its status ladder from the `paymentFamily` nav param, reads
  the family's resource-status GET (and, alongside it, the consent-status GET), and renders the
  current status with the echoed Initiation.

  Exists because a successful submit almost never means the money has landed: HSBC returns
  AcceptedSettlementInProcess and the terminal status arrives later. Without this screen the PSU
  is told "sent" and given no way to find out whether it settled.

  For the four DEFERRED families it does something narrower and must say so: OBIE exposes no
  per-execution status, so the screen reports that the instruction is set up and states plainly
  that individual future payments cannot be tracked here.

# ── GENERALISED 2026-08-06 (/idea-sync, PISP-tests research) ──────────────
# Was domestic-payments only. Now serves seven families with four status ladders and two
# status encodings. The full contract lives in the ObPaymentStatus DTO; the four rules that
# matter most:
#   1. Accept BOTH the v4.0 short codes and the v3.1 long forms. GET /domestic-vrps returns
#      'AcceptedCreditSettlementCompleted' where every other endpoint returns 'ACCC'.
#   2. Read Data.Status only. StatusUpdateDateTime does not move on AWAU -> AUTH.
#   3. Map every ObStatusCode member EXPLICITLY, across four dispositions — in_progress,
#      terminal_success, terminal_failure and instruction_established (added 2026-08-07 for INCO,
#      the terminal status of all four deferred families).
#   4. Fail open to in_progress on a GENUINELY unrecognised status. This is a safety net for
#      codes nobody anticipated, NOT a substitute for rule 3 — INCO was in the enum and still
#      fell through, because the vocabulary had nowhere to put it.
generalisation:
  from: "domestic-payment only"
  to: "all seven families"
  at: "2026-08-06"
  mechanism: "paymentFamily nav param resolves endpoint + ladder"
  ladders: 4
  encodings: 2
has_ui: true
has_server: false
# NOT has_offline_cache despite data-flow cache_strategy: memory — that capability means
# OFFLINE read with conflict resolution, and demands a stale-data indicator, eviction
# policy and a conflict strategy. This is an ephemeral in-memory cache, not offline support.
capabilities: [has_ui, has_api, has_flow]

