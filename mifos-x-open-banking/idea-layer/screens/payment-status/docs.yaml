# ─────────────────────────────────────────────────────────────────────────
# STATUS VOCABULARY — OBIE payment statuses are not a simple success/fail pair
# ─────────────────────────────────────────────────────────────────────────
# SUPERSEDED 2026-08-07 (/idea-sync). dtos/ObPaymentStatus.yaml is the single source of truth
# for the vocabulary, the four ladders and both traps. The list below is RETAINED for its
# psu_meaning and ui_treatment copy guidance only, and is deliberately not deleted — but as a
# code inventory it is wrong in two ways that are worth recording rather than quietly patching:
#   1. It lists LONG forms only. The corpus shows both encodings on every endpoint, and a mapper
#      built from this list alone renders a completed payment as permanently in progress.
#   2. It omitted INCO (InitiationCompleted) and BLCK (Blocked). INCO is the terminal status of
#      all four deferred families — i.e. the majority of the resources this screen tracks.
#      INCO's wording row was ADDED 2026-08-07 alongside the fourth disposition, because this
#      block is where the copy guidance lives and "instruction, never payment" is exactly a copy
#      rule. BLCK remains absent.
# Read the DTO for codes. Read this for wording.
vocabulary_superseded:
  by: dtos/ObPaymentStatus.yaml
  retained_for: "psu_meaning and ui_treatment copy only"
  known_gaps: ["long forms only, no short codes", "BLCK missing"]
  gaps_closed:
    - { gap: "INCO missing", closed_at: "2026-08-07", how: "InitiationCompleted row added with disposition instruction_established" }
payment_status_vocabulary:
  - code: "AcceptedSettlementInProcess"
    disposition: in_progress
    psu_meaning: "Accepted by the bank; the money has not moved yet."
    ui_treatment: "Progress chip; keep polling"
  - code: "AcceptedSettlementCompleted"
    disposition: terminal_success
    psu_meaning: "The money has left the account."
    ui_treatment: "Success chip; stop polling"
  - code: "AcceptedCreditSettlementCompleted"
    disposition: terminal_success
    psu_meaning: "The money has reached the payee."
    ui_treatment: "Success chip; stop polling"
  - code: "AcceptedWithoutPosting"
    disposition: in_progress
    psu_meaning: "Accepted but not yet posted to the account."
    ui_treatment: "Progress chip; keep polling"
  - code: "Pending"
    disposition: in_progress
    psu_meaning: "Still being processed by the bank."
    ui_treatment: "Progress chip; keep polling"
  - code: "Rejected"
    disposition: terminal_failure
    psu_meaning: "The bank did not make the payment."
    ui_treatment: "Error chip; stop polling; offer to start a new payment"
  # ADDED 2026-08-07 with the fourth disposition.
  - code: "InitiationCompleted"
    short_code: "INCO"
    disposition: instruction_established
    applies_to_rails: [domestic-scheduled, domestic-standing-order, international-scheduled, international-standing-order]
    psu_meaning: "The instruction is set up. No payment has been made — the first one may be months away."
    ui_treatment: >-
      Neutral chip (surfaceVariant / onSurfaceVariant, icon event_repeat); stop polling; offer
      nothing. Never a success tick and never a clock — a hue-less treatment makes no claim about
      money, which is exactly the claim available.
    copy_rule: >-
      The label names the INSTRUCTION, never the payment: "Standing order set up", "Scheduled for
      14 March". Never "Paid", "Sent" or "Complete".

payment_status_vocabulary_note: >-
  Never collapse this to a boolean, and do not collapse it to a triad either. Telling a PSU a
  payment "succeeded" when the status is AcceptedSettlementInProcess is a false statement about
  their money; so is a success tick on a standing order at INCO whose first payment has not
  happened. The fourth disposition exists because both of the triad's available answers for INCO
  were false — terminal_success claims money moved, and fail-open-to-in_progress claims live
  activity on something dormant.

# ═════════════════════════════════════════════════════════════════════════
# CAPTURE-CORPUS ENRICHMENT — 2026-08-07 (/idea-sync)
# Ladders, both traps and the fail-open rule live in dtos/ObPaymentStatus.yaml; the error
# contract in dtos/ObPaymentError.yaml. Neither is restated here.
# ═════════════════════════════════════════════════════════════════════════

# ── WHY ACSP MUST NEVER READ AS SENT — the mechanism, not just the rule ──
settlement_is_batched:
  finding: >-
    Every booking timestamp observed falls on a five-minute boundary at :01 or :02 seconds —
    09:10:01, 09:25:02, 09:35:02, 09:40:02, 09:45:02. Settlement is asynchronous and BATCHED; it
    does not happen on submit.
  consequence: >-
    ACSP means accepted-NOT-YET-BOOKED. A balance read taken immediately after submission can
    show no movement at all for a payment that settles minutes later. Absence of a balance change
    is NOT evidence of failure.
  ui_requirement:
    - "ACSP is never rendered as sent, paid or complete. This is the mechanism behind truthfulness_invariant, not a separate rule."
    - "Never corroborate settlement against a balance or transaction read taken in the same minute as the submit."
    - "The 3s -> 30s backing-off poll with a 10-minute ceiling is correctly sized for a five-minute batch cadence. Do not shorten it to feel responsive."

# ── THE STUB DATE FIELDS, AND THE ONE PLACE THEY ARE HONEST ─────────────
expected_datetime_fields:
  general_rule: >-
    ExpectedExecutionDateTime, ExpectedSettlementDateTime and CutOffDateTime are STUBS on the
    deferred families — all three equal CreationDateTime even when RequestedExecutionDateTime is
    T+7. They carry no usable information and are not rendered at all.
  vrp_exception:
    finding: >-
      On domestic-vrp, ExpectedExecution and ExpectedSettlement are identical and exactly
      CreationDateTime + 30 SECONDS on ALL 8 payments in the corpus (15:12:26 -> 15:12:56).
    reading: "The one place these fields are honest. A 30-second settling indicator is legitimate here."
    scope: "domestic-vrp ONLY. A per-family permission, never generalised."

# ── CHARGES ARE QUOTED BUT NOT APPLIED ───────────────────────────────────
charges_surface:
  quoted_vs_applied:
    finding: >-
      EVERY transaction record carries ChargeAmount 0.00 GBP — including domestic payments whose
      consent AND payment responses quoted 0.05 GBP UK.OBIE.CHAPSOut.
    ui_requirement: >-
      A quoted charge is a quote, not a fee. Show it as estimated or not at all. It must never be
      presented as what the PSU was charged, because the observed answer is always 0.00.
  no_fx_disclosed: >-
    No transaction carries a CurrencyExchange block, so no FX rate is disclosed on the AIS side.
    An international payment's true cost is not observable anywhere in this app.
  type_is_a_misleading_label:
    finding: >-
      Charges[].Type is "UK.OBIE.CHAPSOut" on ALL 116 charge objects observed, with NO other value
      anywhere — including weekly standing orders and USD/EUR international transfers, where CHAPS
      is not the settlement rail.
    ui_requirement: "NEVER render Type raw to a PSU. It is not a rail name and stating it would be a false claim about how the money travelled."
  bearer_contradicts_itself:
    finding: >-
      Charges[].ChargeBearer is always "BorneByDebtor" regardless of what Initiation.ChargeBearer
      requested. Resources 19917, 19918 and 19921 each carry BOTH values, contradicting themselves
      inside a single document.
    ui_requirement: "If a bearer is shown, show the Charges[] value, never the Initiation value. Preferably show neither."
  absent_not_empty: >-
    Domestic 201s carry Charges, CutOffDateTime and both Expected* fields; international 201s carry
    NONE of them — the keys are ABSENT, not empty. Parse Charges as nullable, never default to [],
    or "no charge information" becomes indistinguishable from "no charge".
  divergence_note: >-
    Recorded, not resolved. data-flow.yaml#feeLabel carries the comment "0.50 on deferred
    international"; the corpus quote observed on the domestic rail is 0.05 GBP. Different rails and
    different figures — neither refutes the other, and neither is what the transaction shows.

# ── NO PER-EXECUTION STATUS, AND NO WAY TO INFER ONE ─────────────────────
# The absence itself is contracted in dtos/ObPaymentStatus.yaml#per_execution_status. What this
# pass adds is that the obvious workaround is also closed.
no_ais_fallback:
  finding: >-
    A PIS-created standing order (19936) was NOT visible in AIS roughly five minutes after
    creation, while healthy at INCO on the PIS side. Separately, StandingOrderId is absent from
    EVERY AIS standing-order element.
  consequence: >-
    Write-then-read correlation is impossible IN PRINCIPLE, not merely delayed. Even once AIS
    catches up there is no shared identifier to match a PIS resource against an AIS one.
  ui_requirement:
    - "Never fall back to an AIS read to confirm a deferred instruction was created."
    - "Never tell a PSU to check the standing-orders list to verify it worked."
    - "The UI must never say a mandate 'paid'. It may only say the instruction is set up."

regulatory:
  note: >-
    PISP is a distinct FCA permission from AISP; production payment initiation requires
    payment-initiation authorisation. Sandbox unaffected. Captured as an ADR.
  affects_production: true
  affects_sandbox: false
  adr_required: true

contracts: []

libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets: [android, ios, desktop, web]

vm_actions:
  - name: LoadPaymentStatus
    signature: 'suspend fun loadPaymentStatus(paymentId: String)'
    state_mutations:
      - uiState = Loading
      - uiState = Content(status, disposition, amountLabel, creditorName, referenceLabel, submittedAtLabel)
    side_effects:
      - "GET /{familyResourcePath}/{paymentId} via the Pisp client — the path is resolved from the paymentFamily nav param, NEVER hardcoded (api.yaml#operations.get_payment_status.family_resolution). Corrected 2026-08-07; this line read /domestic-payments, which is right for one family of seven."
    error_handling:
      on_404: uiState = Error(type=PaymentNotFound, message=strings.error.payment_status.not_found)
      on_401: uiState = Error(type=TokenExpired, message=strings.error.payment_status.token_expired)
      on_403: uiState = Error(type=ConsentRevoked, message=strings.error.payment_status.consent_revoked)
      on_network: uiState = Error(type=NetworkError, message=strings.error.payment_status.network_error)

  - name: RefreshStatus
    signature: fun refreshStatus()
    state_mutations:
      - re-invokes LoadPaymentStatus with the same paymentId
    side_effects: []
    error_handling: {}
    notes: >-
      Also driven automatically while the disposition is in_progress, on a backing-off interval,
      and stopped the moment any RESTING disposition is reached — terminal_success,
      terminal_failure or instruction_established. The third was added to the stop set 2026-08-07
      with the fourth disposition; INCO does not change on a re-read, so polling it would burn
      requests suggesting a dormant instruction is still moving.

  - name: StartNewPayment
    signature: fun startNewPayment()
    state_mutations: []
    side_effects:
      - "Emits NavigationEvent to the ORIGINATING type screen (resolved from paymentFamily) with a cleared form"
    error_handling: {}
    visibility_condition: "disposition == terminal_failure"
    notes: >-
      Was "send-money" until 2026-08-07; that screen was deleted by the 2026-08-06 seven-type
      rewrite. data-flow.yaml#navigate_to_new_payment already carried the corrected target.
      Deliberately a NEW instruction, never a resubmit against the consumed consent.

  - name: NavigateBack
    signature: fun navigateBack()
    state_mutations: []
    side_effects:
      - "Emits NavigationEvent.Back to NavController"
    error_handling: {}

error_cases:
  - id: PaymentNotFound
    trigger: "HTTP 404 — the PaymentId is unknown"
    user_message: '{strings.error.payment_status.not_found}'
    recovery: "Back CTA; no retry — the resource does not exist"
    # CORRECTED 2026-08-07 (/idea-sync). This trigger read "HTTP 404 or 400 U011", which
    # CONTRADICTED api.yaml#error_cases and data-flow.yaml#u011_invariant — both of which say
    # 400 U011 on a VRP consent GET is a REVOKED MANDATE rendered from the local record, and
    # explicitly "NOT an error". Mapping it here to a not-found error would tell a PSU their
    # deliberately-revoked mandate had vanished. U011 now has its own row below.
  - id: MandateRevoked
    trigger: "HTTP 400 with ErrorCode U011 on the VRP consent GET — the mandate was deleted"
    user_message: '{strings.error.vrp.revoked}'
    recovery: >-
      Not an error state. Render as revoked from the LOCAL mandate record — after DELETE the
      consent GET can never report a revoked status, only U011. Offer a new mandate, never a retry.
    note: >-
      dtos/ObPaymentError.yaml#path_inconsistencies.url_path_not_field_path — the U011 Path is a
      URL ("/domestic-vrp-consents/45205"), not a JSON pointer. A generic Path-to-field mapper
      misfires on it and must special-case U011.
  - id: TokenExpired
    trigger: HTTP 401
    user_message: '{strings.error.payment_status.token_expired}'
    recovery: "Retry CTA after token refresh"
  - id: ConsentRevoked
    trigger: HTTP 403 — the payment consent was revoked
    user_message: '{strings.error.payment_status.consent_revoked}'
    recovery: >-
      Informational only. A revoked consent does not undo a payment that already settled, so the
      copy must not imply the money came back.
  - id: NetworkError
    trigger: IOException / timeout
    user_message: '{strings.error.payment_status.network_error}'
    recovery: "Retry CTA"

