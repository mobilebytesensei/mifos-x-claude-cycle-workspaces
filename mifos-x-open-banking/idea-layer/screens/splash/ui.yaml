sibling: ui
schema_version: "4.0"
feature_id: splash

id: splash
name: "Splash Screen"
feature: splash
flavor: shared
# status: REMOVED 2026-08-04 (CROSS_LEAK repair — sibling-layout.json assigns `status` to
# the docs sibling). This copy held `approved`; docs.yaml is the single owner.
# RECONCILED 2026-08-07 (/idea-sync): was 92, disagreed with docs.yaml `quality_score: 85`.
# The matrix averages every top-level quality_score under screens/splash/**.
# docs.yaml is the owner sibling.
quality_score: 85
contract_version: "1.1.0"
approve_hash: "sha256:c1170816b39ae352970a1dd8361c173ac40dbb6597679d9bf4f4d5b884d111ce"
approved_at: "2026-05-30T00:00:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-001]
status_history:
  - { from: draft, to: enriched, at: "2026-05-25", by: "/idea enrich" }
  - status: designed
    at: "2026-05-25T00:00:00Z"
    by: "/idea export"
    exports: [spec_md, api_md, mockup_md]
  - from: designed
    to: approved
    at: "2026-05-25T13:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []


screens:
  - id: splash
    name: "Splash"
    viewmodel: "SplashViewModel"

archetype: loading

components:
  - type: stack
    id: splash_root
    variant: vertical
    style:
      background: surface
      alignment: center
    children:
      - splash_logo
      - splash_app_name
      - splash_tagline
      - splash_loading_indicator

  - type: image
    id: splash_logo
    content: "mifos_logo"
    label: "Mifos X logo"
    style:
      width: "120dp"
      height: "120dp"
      tint: primary
    a11y:
      role: image
      label: "Mifos X application logo"
    test_context:
      test_id: splash_logo
      assert: visible
      purpose: "Brand logo displayed at app launch"
      interaction_type: display
      data_driven: false

  - type: text
    id: splash_app_name
    content: "Mifos X Open Banking"
    style:
      typography: displaySmall
      color: primary
      padding_top: spacing.lg
    a11y:
      role: heading
      label: "Mifos X Open Banking"
    test_context:
      test_id: splash_app_name
      assert: text_visible
      purpose: "Application name shown at startup"
      interaction_type: display
      data_driven: false

  - type: text
    id: splash_tagline
    content: "Banking for Everyone"
    style:
      typography: bodyLarge
      color: secondary
      padding_top: spacing.sm
    a11y:
      role: text
      label: "Banking for Everyone"
    test_context:
      test_id: splash_tagline
      assert: text_visible
      purpose: "App tagline displayed below app name"
      interaction_type: display
      data_driven: false

  - type: loading_indicator
    id: splash_loading_indicator
    variant: spinner  # `spinner` is loading_indicator's registered name for the circular indeterminate form
    style:
      color: primary
      size: "40dp"
      padding_top: spacing.xl
    motion:
      duration: short4
      max_duration: 10000
      reduced_motion_fallback: static_logo
    a11y:
      role: progressbar
      label: "Loading, please wait"
    test_context:
      test_id: splash_loading_indicator
      assert: visible
      purpose: "Animated loading indicator during session check and initialization"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout: { type: column, padding: spacing.lg, horizontal_alignment: center, vertical_alignment: center }
    visible_components: [splash_logo, splash_app_name, splash_tagline, splash_loading_indicator]
  navigating:
    layout: { type: column, padding: spacing.lg, horizontal_alignment: center, vertical_alignment: center }
    visible_components: [splash_logo, splash_app_name, splash_tagline, splash_loading_indicator]
    note: "Auto-navigates after session check completes"

state_model:
  SplashViewModel:
    screen_state: SplashUiState
    # RECONCILED 2026-05-30: session-check + auth routing is owned by RootNavViewModel
    # (cmp-navigation/rootnav) via RootNavState (Splash/Auth/ShowOnboarding/UserLocked/
    # UserUnlocked). SplashViewModel is a thin VISUAL HOST only — it drives the branded
    # loading visual + reduced-motion fallback. It does NOT read auth state, hold
    # LoginRepository/SessionManager, or decide navigation targets.
    state:
      - field: reducedMotion
        type: Boolean
        default: "false"
    errors: []
    events: []
    actions: []
    di: []

# Navigation targets below are RESOLVED BY RootNavViewModel (RootNavState → Auth /
# UserUnlocked / ShowOnboarding), NOT by SplashViewModel. Retained for the app-flow
# graph + journey linkage; trigger=auto reflects root-nav-driven transitions.
navigation:
  - id: nav_to_login
    target: login
    condition: "hasValidToken == false"
    trigger: auto
    delay_ms: 2000
    a11y:
      label: "Proceeding to login"
  # Role conditions dropped 2026-08-02 (/idea-sync): there is one persona, so there is
  # nothing to branch on. Post-splash routing is a plain authenticated / unauthenticated split.
  - id: nav_to_consumer_home
    target: home
    condition: "hasValidToken == true"
    trigger: auto
    delay_ms: 0
  - id: nav_to_home_authenticated
    target: home
    trigger: token_exists
    condition: "isAuthenticated == true"
    on_click:
      action: navigate
      target: home

api: []

dependencies:
  tier: feature
  # obp-auth dropped on reconcile: the splash VISUAL has no auth dependency. Auth state is
  # consumed by RootNavViewModel (cmp-navigation), which owns the post-splash routing.
  features: [shared-core]
