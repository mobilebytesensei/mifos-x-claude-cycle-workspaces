<!doctype html>
<!-- render-hash: splash-loading-01 -->
<html lang="en" data-screen="splash" data-state="loading" data-feature="splash" data-flavor="shared">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Splash — Mifos X Open Banking</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--on-primary-container:#004B6F;--secondary:#50606E;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:linear-gradient(135deg,#C9E6FF 0%,#F7F9FF 100%);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh;position:relative}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 32px}
.logo-container{width:108px;height:108px;background:var(--primary);border-radius:28px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 12px 32px rgba(38,100,137,0.28)}.logo-container .material-icons{font-size:var(--icon-2xl);color:var(--on-primary)}
.app-name{font-size:28px;font-weight:700;color:var(--on-primary-container);margin-bottom:6px;letter-spacing:-0.3px}
.tagline{font-size:14px;color:var(--on-surface-variant);margin-bottom:48px;letter-spacing:0.3px}
.spinner{width:36px;height:36px;border:3px solid rgba(38,100,137,0.2);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.version{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--outline);letter-spacing:0.4px}
[data-theme="light"]{--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--on-primary-container:#004B6F;--secondary:#50606E;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E}[data-theme="dark"]{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--on-primary-container:#C9E6FF;--secondary:#B7C9D9;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198}@media (prefers-color-scheme:dark){body{background:linear-gradient(135deg,#004B6F 0%,#101417 100%)}:root{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--on-primary-container:#C9E6FF;--secondary:#B7C9D9;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198}.app-name{color:var(--on-primary-container)}.logo-container{box-shadow:0 12px 32px rgba(0,0,0,0.4)}}</style>
</head>
<body><main>
<div class="logo-container" data-component-type="image" data-component-id="splash_logo" role="img" aria-label="Mifos X Open Banking logo"><span class="material-icons">account_balance</span></div>
<h1 class="app-name" data-component-type="text" data-component-id="splash_app_name">Mifos X Open Banking</h1>
<p class="tagline" data-component-type="text" data-component-id="splash_tagline">Banking for Everyone</p>
<div class="spinner" data-component-type="icon" data-component-id="splash_loading_indicator" role="progressbar" aria-label="Loading application"></div>
</main>
<span class="version">v1.0.0</span>
<script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
