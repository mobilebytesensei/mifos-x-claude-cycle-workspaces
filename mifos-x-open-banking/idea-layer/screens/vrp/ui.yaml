known_gaps:
  - id: VRP-GAP-1
    severity: should
    status: spec-healed-source-pending
    healed_in_spec: "2026-10-21 /idea-plan-preview --heal (DEF-005): VrpPayment Confirm now declares ConfirmingFunds → funds-confirmation → domestic-vrps; InsufficientFunds failure kind added."
    description: "SOURCE DRIFT — funds confirmation is never performed before a VRP payment in source. VrpPaymentRepository.checkFunds (POST domestic-vrp-consents/{ConsentId}/funds-confirmation) is implemented in core/data but no ViewModel calls it — only test fakes reference it. Close via /kmp-implement vrp."
  - id: VRP-GAP-2
    severity: should
    description: "No instrumented / device tests for any of the four vrp modules — only commonTest and androidUnitTest source sets exist (no androidInstrumentedTest)."
  - id: VRP-GAP-3
    severity: should
    status: spec-healed-source-pending
    healed_in_spec: "2026-10-21 /idea-plan-preview --heal (DEF-010): Completed(consentId) → VrpConsentDetail, new RestartSetup event → VrpSetup, Abandoned → VrpConsentList."
    description: "SOURCE DRIFT — after the bank redirect, both VrpCallback outcomes route to navigateToAuthenticatedGraph (Home) in source. Completed(consentId) is ignored by RootNavScreen (onCompleted = { navigateToAuthenticatedGraph }), so the new consent is not opened and 'Start again' does not return to VRP setup. Close via /kmp-implement vrp."
  - id: VRP-GAP-4
    severity: could
    status: spec-healed-source-pending
    healed_in_spec: "2026-10-21 /idea-plan-preview --heal (DEF-006): AccessDenied → UiState.Declined with neutral copy; CallbackInvalid no longer includes it."
    description: "SOURCE DRIFT — VrpCallback collapses AccessDenied (customer declined at the bank) and NoPending into CallbackInvalid ('We could not confirm this came from your bank'), so a deliberate decline reads as a security failure. Close via /kmp-implement vrp."
  - id: VRP-GAP-5
    severity: could
    description: "VrpPaymentErrorKind.StorageUnavailable is declared but never produced (observeConsent has no catch), and RetryLoad starts an additional collector without cancelling the previous one."
  - id: VRP-GAP-6
    severity: could
    description: "VrpSetup sends exactly one periodic limit and fixes interactionType to UK.OBIE.VRPType.Sweeping and currency to GBP; multiple periodic ceilings shown by list/detail can only come from the bank, never from this form."
  - id: VRP-GAP-7
    severity: should
    status: spec-healed-source-pending
    healed_in_spec: "2026-10-21 /idea-plan-preview --heal round 3 (gap-013, NFR-006): VrpConsentDetail gains revoke_failed (Content.revoke = Failed(RevokeFailureReason)) with banner 'Your bank didn't confirm the cancellation. Sweeping is still active.' + RetryRevoke; revoke marks Revoked locally ONLY on DELETE 2xx/404, otherwise local state untouched. bankRefusedRemoval removed from Ended."
    description: "SOURCE DRIFT — Revoke marks the consent revoked locally and drops its refresh token even when the bank DELETE fails (and even when the client-credentials token cannot be minted); the detail then shows 'Removed on this device. Your bank refused…' with no retry path. Close via /kmp-implement vrp."
