            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - { id: payee_identification, type: text, testTag: "vrpSetup:payeeIdentification", visible: "{{selectedPayee != null}}", value: "{{selectedPayee.identification}}" }  # i18n: skip — binding
      - { id: payee_error, type: text, testTag: "vrpSetup:payeeError", visible: "{{payeeProblem == SameAsPayer}}", value: "{strings.feature_vrp_setup_payee_error_same}" }
      - { id: new_payee_name, type: text_field, testTag: "vrpSetup:newPayeeName", visible: "{{payNewSelected}}", label: "{strings.feature_vrp_setup_payee_new_name_label}", error: "{strings.feature_vrp_setup_payee_error_name}", on_change: NewPayeeNameChanged }
      - { id: new_payee_sort_code, type: text_field, testTag: "vrpSetup:newPayeeSortCode", visible: "{{payNewSelected}}", keyboard: number, label: "{strings.feature_vrp_setup_payee_new_sort_code_label}", error: "{strings.feature_vrp_setup_payee_error_sort_code}", on_change: NewPayeeSortCodeChanged }
      - { id: new_payee_account_number, type: text_field, testTag: "vrpSetup:newPayeeAccountNumber", visible: "{{payNewSelected}}", keyboard: number, label: "{strings.feature_vrp_setup_payee_new_account_number_label}", error: "{strings.feature_vrp_setup_payee_error_account_number}", on_change: NewPayeeAccountNumberChanged }
      - { id: per_payment_amount, type: text_field, testTag: "vrpSetup:perPaymentAmount", error_testTag: "vrpSetup:perPaymentError", keyboard: decimal, label: "{strings.feature_vrp_setup_per_payment_label}", errors: { Missing: "{strings.feature_vrp_setup_amount_error_missing}", NotANumber: "{strings.feature_vrp_setup_amount_error_decimals}", BelowMinimum: "{strings.feature_vrp_setup_amount_error_min}", NotBelowPeriodic: "{strings.feature_vrp_setup_amount_error_ordering}" }, on_change: PerPaymentAmountChanged }
      - { id: periodic_amount, type: text_field, testTag: "vrpSetup:periodicAmount", error_testTag: "vrpSetup:periodicError", keyboard: decimal, label: "{strings.feature_vrp_setup_periodic_label}", on_change: PeriodicAmountChanged }
      - id: period_dropdown
