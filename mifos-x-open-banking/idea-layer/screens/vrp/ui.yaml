sibling: ui
schema_version: "4.0"
feature_id: vrp
status: enriched
_source: source_analysis
_source_modules: [":feature:vrp:vrp-consents", ":feature:vrp:vrp-setup", ":feature:vrp:vrp-callback", ":feature:vrp:vrp-payment"]
_source_paths:
  - feature/vrp/vrp-consents/src/commonMain/kotlin/org/mifosx/openbanking/feature/vrpconsents/
  - feature/vrp/vrp-setup/src/commonMain/kotlin/org/mifosx/openbanking/feature/vrpsetup/
  - feature/vrp/vrp-callback/src/commonMain/kotlin/org/mifosx/openbanking/feature/vrpcallback/
  - feature/vrp/vrp-payment/src/commonMain/kotlin/org/mifosx/openbanking/feature/vrppayment/
  - core/data/src/commonMain/kotlin/org/mifosx/openbanking/core/data/vrp/
  - core/network/src/commonMain/kotlin/org/mifosx/openbanking/core/network/api/Vrp.kt
requirement_refs: [FR-041, FR-042, FR-043, FR-044, FR-045]

screen_id: vrp-consent-list-screen
name: VrpConsentList
archetype: index_list
states: [loading, content, empty, error]
initial_state: loading
feature_profile:
  combo_id: read_paged_write
  facets: [consent-list, consent-detail, form, oauth-redirect, payment-submit, revoke, local-room-cache]
  archetype: list
  store_archetype: MUTABLE
  recipe_ref: FEATURE_LAYER_BUILD_GUIDE
  heal: auto
  profile_hash: scaffold-default
components:
  - { id: vrp_consent_list_root, type: screen, screen_ref: vrp-consent-list-screen, testTag: "vrpConsentList:content" }
  - { id: vrp_consent_detail_root, type: screen, screen_ref: vrp-consent-detail-screen, testTag: "vrpConsentDetail:content" }
  - { id: vrp_setup_root, type: screen, screen_ref: vrp-setup-screen, testTag: "vrpSetup:form" }
  - { id: vrp_callback_root, type: screen, screen_ref: vrp-callback-screen, testTag: "vrpCallback:working" }
  - { id: vrp_payment_root, type: screen, screen_ref: vrp-payment-screen, testTag: "vrpPayment:amountPage" }

route: VrpConsentListRoute
entry_points:
  - source: home
    trigger: "Quick action 'VRP' → onNavigateToVrp"
    via: "AuthenticatedNavHostScreen: navController.navigateToVrpConsentList()"
    params: {}
  - source: payments-hub
    trigger: "VRP card (hub graph itself unreachable)"
    via: "AuthenticatedNavHostScreen.paymentsHubGraph"
    params: {}
  - source: external-redirect
    trigger: "VRP authorisation redirect classified AuthorisationLeg.Vrp (checked first) → VrpCallbackRoute(redirectUrl) on the ROOT navigator"
    nav_role: external-entry
    params: { redirectUrl: String }
nav_params:
  consentId: { type: String, required: true, screens: [vrp-consent-detail-screen, vrp-payment-screen], saved_state_key: consentId }
  redirectUrl: { type: String, required: true, screens: [vrp-callback-screen], saved_state_key: redirectUrl }

business_logic:
  kind: composite
  description: >
    Domestic Variable Recurring Payments (sweeping) end to end across four modules. Setup stages a
    domestic-vrp-consent on a client-credentials token with per-payment and one periodic ceiling (GBP,
    UK.OBIE.VRPType.Sweeping) and launches bank authorisation; the callback validates the redirect,
    exchanges the code and persists a per-consent refresh token (VrpAuthSession) BEFORE reading the
    consent back into Room. List/detail read consents and payments from Room (vrp_consent, vrp_payment);
    detail refreshes status on open, derives usage of the headline periodic ceiling client-side and
    revokes via DELETE — the consent is marked revoked locally ONLY after the ASPSP confirms (2xx, or
    404 = already gone); any other outcome lands in RevokeFailed with Retry and leaves the local row,
    refresh token and sweeping untouched (NFR-006). Payment submits under the
    consent on a per-consent PSU access token (VrpTokenProvider) with a stable idempotency key, bounded
    by the tightest remaining ceiling.
  library_refs: [core-data, core-network, core-database]

screens:
  # ═════════════════════════════════════════════════════════════════════
  - id: vrp-consent-list-screen
    name: VrpConsentList
    module: ":feature:vrp:vrp-consents"
    route: VrpConsentListRoute
    archetype: index_list
    title: "{strings.feature_vrp_consents_list_title}"
    description: >
      KptScaffold with KptTopAppBar (back) and a bottom bar holding 'Set up a Variable Recurring
      Payment' (hidden only in Error). Body: skeleton while loading, a column of consent cards (payee,
      headline ceiling 'per {period}', status chip, 'Until {date}' or 'No end date'), an empty state
      with title + body (the CTA stays in the bottom bar), or an error state with Retry.
    states: [loading, content, empty, error]
    initial_state: loading
    state_descriptions:
      loading: "Loading — vrpConsentList:loadingSkeleton."
      content: "Content(consents) — vrpConsentList:content; rows vrpConsentList:row:{id} with rowLimit/rowStatus tags."
      empty: "Empty — vrpConsentList:emptyState with emptyTitle/emptyBody; bottom-bar create button still shown."
      error: "Error(StorageUnavailable) — vrpConsentList:errorState, errorBody, retryButton; bottom bar hidden."
    state_model:
      VrpConsentListViewModel:
        base: "BaseViewModel<VrpConsentListState, Nothing, VrpConsentListAction>"
        state:
          name: VrpConsentListState
          fields:
            uiState: { type: VrpConsentListUiState, default: Loading }
        ui_state:
          members:
            - { name: Loading }
            - { name: Content, fields: { consents: "List<ConsentRowUi>" } }
            - { name: Empty }
            - { name: Error, fields: { kind: "VrpConsentListErrorKind (StorageUnavailable)" } }
        row_model:
          ConsentRowUi: { consentId: String, payeeName: String, ceilingAmount: "String (largest periodic ceiling, else per-payment)", periodType: "PeriodType?", status: ConsentStatus, validUntil: "String?", isRevoked: Boolean }
        actions:
          name: VrpConsentListAction
          members:
            - { name: RetryLoad, trigger: "Tap Retry" }
            - { name: "Internal.ReceiveConsents", internal: true }
            - { name: "Internal.ReceiveFailure", internal: true }
        di: [VrpConsentRepository]
    components:
      - id: list_top_bar
        type: top-bar
        title: "{strings.feature_vrp_consents_list_title}"
        navigation_icon: arrow_back
        on_navigation_click:
          action: onBack
          target: back
          action_contract:
            effect: navigate
            description: "Invokes onBack → navController.popBackStack() in the authenticated host, returning to Home (or the hub)."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: consent_card
        type: card
        repeat_for: consents
        testTag: "vrpConsentList:row:{consentId}"
        content:
          - { id: row_payee, type: text, value: "{{payeeName}}" }  # i18n: skip — binding
          - { id: row_limit, type: text, testTag: "vrpConsentList:rowLimit:{consentId}", value: "{{ceilingAmount}} {strings.feature_vrp_consents_list_limit_format}" }  # i18n: skip — amount binding + key
          - { id: row_status, type: chip, testTag: "vrpConsentList:rowStatus:{consentId}", label: "{strings.feature_vrp_consents_status_*}" }
          - { id: row_validity, type: text, value: "{strings.feature_vrp_consents_list_valid_until | feature_vrp_consents_list_no_end_date}" }
        on_click:
          action: onOpenConsent
          target: vrp
          target_screen: vrp-consent-detail-screen
          params: { consentId: "{consentId}" }
          action_contract:
            effect: navigate
            description: "Opens VrpConsentDetailRoute(consentId) via navController.navigateToVrpConsentDetail for the tapped consent."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - { id: empty_state, type: empty-state, testTag: "vrpConsentList:emptyState", title: "{strings.feature_vrp_consents_list_empty_title}", body: "{strings.feature_vrp_consents_list_empty_body}" }
      - id: error_state
        type: error-state
        testTag: "vrpConsentList:errorState"
        title: "{strings.feature_vrp_consents_list_error_title}"
        body: "{strings.feature_vrp_consents_list_error_storage}"
        on_click:
          action: RetryLoad
          action_contract:
            effect: transform_state
            external_library_refs: ["VrpConsentRepository.observeActive (Room vrp_consent)"]
            description: "Sets uiState = Loading and re-subscribes to repository.observeActive(); a non-empty emission becomes Content, an empty one Empty, a thrown error Error(StorageUnavailable)."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: create_button
        type: button
        variant: filled-pill
        testTag: "vrpConsentList:createButton"
        pinned: bottom
        visible: "{{uiState !is Error}}"
        label: "{strings.feature_vrp_consents_list_create}"
        on_click:
          action: onNavigateToSetup
          target: vrp
          target_screen: vrp-setup-screen
          action_contract:
            effect: navigate
            description: "Navigates to VrpSetupRoute via navController.navigateToVrpSetup() to configure a new Variable Recurring Payment consent."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"

  # ═════════════════════════════════════════════════════════════════════
  - id: vrp-consent-detail-screen
    name: VrpConsentDetail
    module: ":feature:vrp:vrp-consents"
    route: "VrpConsentDetailRoute(consentId)"
    archetype: detail_screen
    title: "{{payeeName ?: strings.feature_vrp_consents_detail_title}}"  # i18n: skip — payee binding with key fallback
    description: >
      KptScaffold with DetailTopBar (back). Content: status header (status pill, 'Valid until …' /
      'No end date', 'Checked {relative}'), Paid-from card (or 'Chosen at your bank'), usage card for
      the headline periodic ceiling (remaining, linear progress, 'x of y used', advisory note), Limits
      card (per payment + each periodic ceiling), 'Send money' button (only when Authorised), payment
      history list, and a 'Remove access' button opening a confirmation dialog. When the bank does
      not confirm the DELETE, the same content re-renders with an error-container banner pinned above
      it ("Your bank didn't confirm the cancellation. Sweeping is still active." + Retry).
    states: [loading, content, revoke_confirm, revoking, revoke_failed, unusable, ended, not_found]
    initial_state: loading
    state_descriptions:
      loading: "Loading — vrpConsentDetail:loadingSkeleton (centred progress)."
      content: "Content — vrpConsentDetail:content."
      revoke_confirm: "Content.revoke = Confirming — AlertDialog vrpConsentDetail:revokeDialog with irreversible notice, Remove access / Keep it."
      revoking: "Content.revoke = Revoking — Pay and Remove access disabled while DELETE is in flight."
      revoke_failed: "Content.revoke = Failed(reason ∈ BankRejected | TokenUnavailable | Network) — the bank did NOT confirm the DELETE (anything but 2xx/404). Local row, revokedAt, refresh token and sweeping are UNTOUCHED (status still shown, Send money still available). vrpConsentDetail:revokeFailedBanner (live region) with 'Your bank didn't confirm the cancellation. Sweeping is still active.' + Retry (vrpConsentDetail:revokeRetryButton) which re-runs the DELETE (NFR-006)."
      unusable: "Unusable — consent Authorised but payer is not a 14-char UK.OBIE.SortCodeAccountNumber (e.g. a card chosen at the bank). vrpConsentDetail:unusableState."
      ended: "Ended(payeeName, payments) — revokedAt set (only ever after a bank-confirmed DELETE) or status Revoked/Rejected/Cancelled/Expired/Consumed. vrpConsentDetail:endedState. A failed DELETE never reaches Ended — it stays in revoke_failed."
      not_found: "NotFound — no local row. vrpConsentDetail:notFoundState."
    state_model:
      VrpConsentDetailViewModel:
        base: "BaseViewModel<VrpConsentDetailState, VrpConsentDetailEvent, VrpConsentDetailAction>"
        state:
          name: VrpConsentDetailState
          fields:
            consentId: { type: String, default: "savedStateHandle[consentId].orEmpty()" }
            uiState: { type: VrpConsentDetailUiState, default: Loading }
          private_fields:
            readBackPayments: "mutableSetOf<String>() — payments already refreshed this visit"
        ui_state:
          members:
            - { name: Loading }
            - name: Content
              fields:
                payeeName: String
                payer: "AccountIdentity?"
                status: ConsentStatus
                validUntil: "String?"
                syncedAt: "Instant?"
                perPaymentCeilingAmount: String
                limits: "List<LimitRowUi(periodType, ceilingAmount)>"
                periodicLimitUsage: "PeriodicLimitUsageUi?(periodType, sentAmount, ceilingAmount, remainingAmount, sentAmountFraction)"
                payments: "List<PaymentRowUi(localId, sentAmount, status, sentOn)>"
                revoke: { type: RevokePhase, default: Idle, values: [Idle, Confirming, Revoking, "Failed(reason: RevokeFailureReason)"] }
              derived:
                canPay: "status == Authorised && revoke != Revoking"
                canRevoke: "revoke != Revoking && status in [Authorised, AwaitingAuthorisation]"
                revokeFailed: "revoke is Failed"
            - { name: Unusable }
            - { name: Ended, fields: { payeeName: String, payments: "List<PaymentRowUi>" } }
            - { name: NotFound }
        revoke_failures:
          name: RevokeFailureReason
          note: "Outcomes of DELETE domestic-vrp-consents/{ConsentId} the bank did NOT confirm. Each keeps the local row, revokedAt = null, the VrpAuthSession refresh token and sweeping intact, and lands in Content.revoke = Failed (NFR-006). 2xx and 404 (already gone) are confirmations, never failures. Mirrors consent-detail RevokeFailureReason."
          types:
            - { type: BankRejected, http: "4xx except 404 / 5xx", retry: true, message_key: feature_vrp_consents_detail_revoke_failed }
            - { type: TokenUnavailable, http: "token mint failed", retry: true, message_key: feature_vrp_consents_detail_revoke_failed, note: "client_credentials (payments) token could not be minted for the DELETE" }
            - { type: Network, retry: true, message_key: feature_vrp_consents_detail_revoke_failed, note: "no response / timeout — outcome unknown, so treated as unconfirmed" }
        events:
          name: VrpConsentDetailEvent
          members:
            - { name: Revoked, handled_by: "onBack() — pops to the list" }
        actions:
          name: VrpConsentDetailAction
          members:
            - { name: RevokeRequested, trigger: "Tap Remove access" }
            - { name: RevokeDismissed, trigger: "Tap Keep it / dismiss dialog" }
            - { name: RevokeConfirmed, trigger: "Tap Remove access in the dialog" }
            - { name: RetryRevoke, trigger: "Tap Retry on the revoke-failed banner (only from revoke = Failed)" }
            - { name: "Internal.ReceiveConsent", internal: true }
            - { name: "Internal.ReceiveRevokeResult", internal: true }
        di: [SavedStateHandle, VrpConsentRepository, VrpPaymentRepository]
    components:
      - id: detail_top_bar
        type: top-bar
        title: "{{payeeName}}"  # i18n: skip — binding
        navigation_icon: arrow_back
        on_navigation_click:
          action: onBack
          target: back
          action_contract:
            effect: navigate
            description: "Invokes onBack → navController.popBackStack(), returning to the VRP consent list."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - { id: detail_hero, type: hero, role: hero, asset_ref: vrp_consent_detail_hero, aspect_ratio: "16:9", testTag: "vrpConsentDetail:hero", visible: "{{uiState is Content}}", decorative: true }
      - id: status_header
        type: section
        testTag: "vrpConsentDetail:header"
        children:
          - { id: status_pill, type: chip, testTag: "vrpConsentDetail:status", label: "{strings.feature_vrp_consents_status_*}" }
          - { id: validity, type: text, testTag: "vrpConsentDetail:validity", value: "{strings.feature_vrp_consents_detail_valid_until | feature_vrp_consents_detail_no_end_date}" }
          - { id: synced_at, type: text, testTag: "vrpConsentDetail:syncedAt", value: "{strings.feature_vrp_consents_detail_synced_at}" }
      - { id: payer_card, type: card, testTag: "vrpConsentDetail:payer", heading: "{strings.feature_vrp_consents_detail_payer}", value: "{{payer ?: strings.feature_vrp_consents_detail_payer_chosen_at_bank}}" }  # i18n: skip — binding with key fallback
      - id: usage_card
        type: card
        visible: "{{periodicLimitUsage != null}}"
        content:
          - { id: this_period, type: text, value: "{strings.feature_vrp_consents_detail_this_period}" }
          - { id: remaining, type: text, testTag: "vrpConsentDetail:remaining", value: "{strings.feature_vrp_consents_detail_remaining}" }
          - { id: usage_progress, type: progress-bar, value: "{{sentAmountFraction}}" }
          - { id: consumed, type: text, testTag: "vrpConsentDetail:consumed", value: "{strings.feature_vrp_consents_detail_consumed}" }
          - { id: advisory_note, type: text, value: "{strings.feature_vrp_consents_detail_remaining_note}" }
      - id: limits_card
        type: card
        heading: "{strings.feature_vrp_consents_detail_limits}"
        rows:
          - { testTag: "vrpConsentDetail:perPaymentLimit", label: "{strings.feature_vrp_consents_detail_per_payment_limit}", value: "{{perPaymentCeilingAmount}}" }  # i18n: skip — binding
          - { testTag: "vrpConsentDetail:periodicLimit", repeat_for: limits, label: "{strings.feature_vrp_consents_detail_periodic_limit}", value: "{{ceilingAmount}}" }  # i18n: skip — binding
      - id: pay_button
        type: button
        variant: filled-pill
        testTag: "vrpConsentDetail:payButton"
        icon: Send
        visible: "{{status == Authorised}}"
        enabled: "{{canPay}}"
        label: "{strings.feature_vrp_consents_detail_pay}"
        on_click:
          action: onNavigateToPayment
          target: vrp
          target_screen: vrp-payment-screen
          params: { consentId: "{consentId}" }
          action_contract:
            effect: navigate
            description: "Invokes onNavigateToPayment(consentId) → navController.navigateToVrpPayment(consentId), opening the payment form under this consent. Not routed through the ViewModel."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - { id: payment_history, type: list, component: MifosPaymentHistoryList, testTag: "vrpConsentDetail:history", empty_testTag: "vrpConsentDetail:historyEmpty", row_testTag: "vrpConsentDetail:paymentRow:{localId}", title: "{strings.feature_vrp_consents_detail_history_title}", empty_label: "{strings.feature_vrp_consents_detail_history_empty}" }
      - id: revoke_button
        type: button
        testTag: "vrpConsentDetail:revokeButton"
        enabled: "{{canRevoke}}"
        label: "{strings.feature_vrp_consents_detail_revoke}"
        on_click:
          action: RevokeRequested
          action_contract:
            effect: transform_state
            description: "Moves Content.revoke to Confirming, opening the irreversible confirmation dialog. No call is made."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: revoke_dialog
        type: dialog
        testTag: "vrpConsentDetail:revokeDialog"
        visible: "{{revoke == Confirming}}"
        title: "{strings.feature_vrp_consents_detail_revoke_title}"
        body: "{strings.feature_vrp_consents_detail_revoke_body}"
        body_testTag: "vrpConsentDetail:revokeIrreversibleNotice"
        actions:
          - id: revoke_confirm
            type: button
            testTag: "vrpConsentDetail:revokeConfirm"
            label: "{strings.feature_vrp_consents_detail_revoke_confirm}"
            on_click:
              action: RevokeConfirmed
              action_contract:
                effect: delete
                external_library_refs: ["VrpConsentRepository.revoke (core/data)", "Vrp.deleteConsent DELETE v4.0/pisp/domestic-vrp-consents/{ConsentId} (Ktor)"]
                handler: "VrpConsentDetailViewModel.executeRevoke() → VrpConsentRepository.revoke(consentId): RevokeResult → Confirmed: sendEvent(Revoked) · Unconfirmed(reason): Content.revoke = Failed(reason)"
                writes_to: "DELETE /v4.0/pisp/domestic-vrp-consents/{ConsentId}; then ONLY on 2xx/404: Room vrp_consent.revokedAt = now + VrpAuthSession refresh token removed + VrpTokenProvider.invalidateAccessToken(consentId); else VrpConsentDetailState.uiState = Content(revoke = Failed(reason)) with no local mutation"
                description: "Sets revoke = Revoking and DELETEs the domestic VRP consent at HSBC. The consent is marked Revoked locally (revokedAt, tokens dropped) ONLY after the bank confirms — 2xx, or 404 = already gone — then emits Revoked (pop to list). Any other result (4xx/5xx, token mint failure, network, timeout) leaves the local row, refresh token and sweeping untouched and moves to revoke = Failed(reason): the revoke-failed banner with Retry (NFR-006, VRP-GAP-7)."
                action_contract_author: "claude-via-idea-feature-enrich"
                action_contract_authored_at: "2026-10-21T00:00:00Z"
          - id: revoke_cancel
            type: button
            testTag: "vrpConsentDetail:revokeCancel"
            label: "{strings.feature_vrp_consents_detail_revoke_cancel}"
            on_click:
              action: RevokeDismissed
              action_contract:
                effect: transform_state
                description: "Returns Content.revoke to Idle and closes the dialog without any call."
                action_contract_author: "claude-via-idea-plan-source"
                action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: revoke_failed_banner
        type: banner
        visible: "{{revoke is Failed}}"
        pinned: top
        testTag: "vrpConsentDetail:revokeFailedBanner"
        content_description: "{strings.feature_vrp_consents_detail_revoke_failed}"
        live_region: polite             # announced to screen readers when it appears (NFR-009)
        icon: sync_problem
        style: { background: errorContainer, text_color: onErrorContainer, corner_radius: 12dp, padding: 16dp }
        message: { value: "{strings.feature_vrp_consents_detail_revoke_failed}", testTag: "vrpConsentDetail:revokeFailedBody" }
        cta:
          id: revoke_retry_button
          type: button
          variant: text
          testTag: "vrpConsentDetail:revokeRetryButton"
          label: "{strings.feature_vrp_consents_detail_revoke_failed_retry}"
          style: { text_color: onErrorContainer }
          on_click:
            action: RetryRevoke
            action_contract:
              effect: delete
              handler: "VrpConsentDetailViewModel.retryRevoke() → executeRevoke()"
              external_library_refs: ["VrpConsentRepository.revoke (core/data)", "Vrp.deleteConsent DELETE v4.0/pisp/domestic-vrp-consents/{ConsentId} (Ktor)"]
              writes_to: "DELETE /v4.0/pisp/domestic-vrp-consents/{ConsentId}; Content.revoke = Revoking → on 2xx/404: Room vrp_consent.revokedAt + VrpAuthSession refresh token removed + event Revoked | otherwise Content.revoke = Failed(reason) with no local mutation"
              description: "Re-runs the revoke DELETE from revoke = Failed. Same confirm gate as Remove access: the consent is marked Revoked locally and Revoked emitted only after the bank confirms (2xx/404); another unconfirmed result returns to Failed with the local row, tokens and sweeping intact. Ignored unless revoke is Failed."
              action_contract_author: "claude-via-idea-feature-enrich"
              action_contract_authored_at: "2026-10-21T00:00:00Z"
      - { id: unusable_state, type: message-state, testTag: "vrpConsentDetail:unusableState", body_testTag: "vrpConsentDetail:unusableBody", title: "{strings.feature_vrp_consents_detail_unusable_title}", body: "{strings.feature_vrp_consents_detail_unusable_body}" }
      - { id: ended_state, type: message-state, testTag: "vrpConsentDetail:endedState", title: "{{payeeName}}", body: "{strings.feature_vrp_consents_detail_ended}" }  # i18n: skip — payee binding
      - { id: not_found_state, type: message-state, testTag: "vrpConsentDetail:notFoundState", title: "{strings.feature_vrp_consents_detail_error_title}", body: "{strings.feature_vrp_consents_detail_not_found}" }

  # ═════════════════════════════════════════════════════════════════════
  - id: vrp-setup-screen
    name: VrpSetup
    module: ":feature:vrp:vrp-setup"
    route: VrpSetupRoute
    archetype: form
    title: "{strings.feature_vrp_setup_title | feature_vrp_setup_review_title}"
    description: >
      KptScaffold with KptTopAppBar (back); title switches to 'Review VRP' in the review phase. Form
      page: Pay from (MifosAccountPicker + 'Choose at my bank' + card warning), Pay to
      (MifosPayeeAvatarRow + 'Pay new' with name / sort code / account number), Maximum amount per
      payment, Maximum amount you can send + per {period} dropdown, Stop on (optional end date with
      Clear + earliest-date hint, DatePickerDialog). Pinned Continue. Review page: parties card, limits
      card (Up to … per payment / per period, validity), irreversible notice, staging failure notice;
      pinned 'Continue to your bank', 'Protected by UK Open Banking', Back.
    states: [loading, content, review, staging, staging_failed, no_eligible_payers, error]
    initial_state: loading
    state_descriptions:
      loading: "Loading — vrpSetup:loadingSkeleton (accounts overview loading)."
      content: "Content(phase = Form) — vrpSetup:form; Continue enabled when canContinue."
      review: "Content(phase = Review) — vrpSetup:review."
      staging: "Content.staging = Staging — confirm and back disabled while POST consent + authorize URL build run."
      staging_failed: "Content.staging = Failed(NetworkUnavailable | BankRefused) — vrpSetup:reviewError notice on the review page; confirm re-enabled."
      no_eligible_payers: "NoEligiblePayers — overview Empty or no account whose HSBC product can be a VrpPayer. vrpSetup:noAccountsState."
      error: "Error(AccountsUnavailable | NetworkUnavailable) — vrpSetup:errorState with Retry."
    state_model:
      VrpSetupViewModel:
        base: "BaseViewModel<VrpSetupState, VrpSetupEvent, VrpSetupAction>"
        state:
          name: VrpSetupState
          fields:
            uiState: { type: VrpSetupUiState, default: Loading }
        ui_state:
          members:
            - { name: Loading }
            - name: Content
              fields:
                phase: { type: SetupPhase, values: [Form, Review] }
                form: SetupFormUi
                staging: { type: StagingUi, default: NotStarted, values: [NotStarted, Staging, "Failed(StagingFailure: NetworkUnavailable | BankRefused)"] }
              derived:
                isStaging: "staging == Staging"
                canContinue: "!isStaging && form.isComplete"
            - { name: NoEligiblePayers }
            - { name: Error, fields: { kind: "VrpSetupErrorKind (AccountsUnavailable | NetworkUnavailable)" } }
        form_model:
          SetupFormUi:
            payerOptions: { type: "List<AccountWithBalance>", default: "emptyList()" }
            selectedPayerId: { type: "String?", default: "null" }
            chooseAtBank: { type: Boolean, default: "false" }
            payerExpanded: { type: Boolean, default: "false" }
            payeeOptions: { type: "List<BeneficiaryItem>", default: "emptyList()" }
            selectedPayeeId: { type: "String?", default: "null" }
            payNewSelected: { type: Boolean, default: "false" }
            newPayeeName: { type: String, default: '""' }
            newPayeeNameProblem: { type: "PayeeProblem?", default: "null" }
            newPayeeSortCode: { type: String, default: '""' }
            newPayeeSortCodeProblem: { type: "PayeeProblem?", default: "null" }
            newPayeeAccountNumber: { type: String, default: '""' }
            newPayeeAccountNumberProblem: { type: "PayeeProblem?", default: "null" }
            payeeProblem: { type: "PayeeProblem?", default: "null" }
            perPaymentAmount: { type: String, default: '""' }
            perPaymentProblem: { type: "AmountProblem?", default: "null" }
            periodType: { type: PeriodType, default: Month, values: [Day, Week, Fortnight, Month, HalfYear, Year] }
            periodicAmount: { type: String, default: '""' }
            periodicProblem: { type: "AmountProblem?", default: "null" }
            validTo: { type: "LocalDate?", default: "null" }
            datePickerOpen: { type: Boolean, default: "false" }
            earliestSelectableDate: { type: LocalDate, default: "todayUtc() + 2 days" }
            derived:
              hasPayer: "chooseAtBank || selectedPayerId != null"
              hasPayee: "selectedPayeeId != null || payNewSelected"
              payeeIdentification: "payNew ? sortCodeDigits + accountDigits : selectedPayee.identification"
              isComplete: "hasPayer && hasPayee && amounts valid && ordering valid && payee != payer && (new payee name/sort/account valid)"
        validation:
          amount: "checkAmount — blank → Missing; unparseable → NotANumber; < 1 minor unit (£0.01) → BelowMinimum"
          ceiling_ordering: "checkOrdering — perPayment >= periodic → NotBelowPeriodic (shown on the per-payment field); per-payment ceiling must be strictly below the periodic ceiling"
          currency: "Both ceilings are GBP (LIMIT_CURRENCY); interactionType UK.OBIE.VRPType.Sweeping; exactly one periodic limit is sent"
          end_date: "optional validTo; selectable only when date >= todayUtc() + 2 days (MIN_DAYS_AHEAD = 2, UTC); year range today..today+10; re-checked at selection and the floor recomputed when the picker opens (form can sit open across midnight)"
          payee_name: "non-blank (new payee only)"
          sort_code: "digits-only length == 6"
          account_number: "digits-only length == 8"
          payee_vs_payer: "payee digits == payer identification digits → SameAsPayer (only when a payer account is named)"
          payers: "accounts whose HsbcProductCapability supports AccountEndpoint.VrpPayer and are not refused by AccountCapabilityRegistry"
        events:
          name: VrpSetupEvent
          members:
            - { name: LaunchAuthorisation, params: { url: String }, handled_by: "onLaunchAuthorisation → BrowserLauncher.launch(url)" }
        actions:
          name: VrpSetupAction
          members:
            - { name: RetryLoad }
            - { name: PayerToggled }
            - { name: PayerSelected, params: { accountId: String } }
            - { name: ChooseAtBankSelected }
            - { name: PayeeSelected, params: { payeeId: String } }
            - { name: PayNewSelected }
            - { name: NewPayeeNameChanged, params: { value: String } }
            - { name: NewPayeeSortCodeChanged, params: { value: String } }
            - { name: NewPayeeAccountNumberChanged, params: { value: String } }
            - { name: PerPaymentAmountChanged, params: { value: String } }
            - { name: PeriodTypeSelected, params: { periodType: PeriodType } }
            - { name: PeriodicAmountChanged, params: { value: String } }
            - { name: DatePickerOpened }
            - { name: DatePickerDismissed }
            - { name: ValidToSelected, params: { date: LocalDate } }
            - { name: ValidToCleared }
            - { name: Continue }
            - { name: BackToForm }
            - { name: StageConsent }
            - { name: ReceiveAuthorisationUrl, internal: true }
        di: [AccountsOverviewRepository, BeneficiariesRepository, AccountCapabilityRegistry, VrpConsentRepository, VrpAuthRepository]
    components:
      - id: setup_top_bar
        type: top-bar
        title: "{strings.feature_vrp_setup_title}"
        navigation_icon: arrow_back
        on_navigation_click:
          action: onBack
          target: back
          action_contract:
            effect: navigate
            description: "Invokes onBack → navController.popBackStack(), returning to the VRP consent list; the form is discarded."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: payer_picker
