          - { id: review_per_payment, type: text, testTag: "vrpSetup:reviewPerPayment", value: "{strings.feature_vrp_setup_review_up_to} … {strings.feature_vrp_setup_review_per_payment}" }
          - { id: review_periodic, type: text, testTag: "vrpSetup:reviewPeriodic", value: "{strings.feature_vrp_setup_review_up_to} … {strings.feature_vrp_setup_review_per_period}" }
          - { id: review_validity, type: text, testTag: "vrpSetup:reviewValidity", value: "{strings.feature_vrp_setup_review_validity | feature_vrp_setup_review_no_end_date}" }
          - { id: review_irreversible, type: banner, testTag: "vrpSetup:reviewIrreversible", message: "{strings.feature_vrp_setup_review_irreversible}" }
          - { id: review_error, type: banner, testTag: "vrpSetup:reviewError", visible: "{{staging is Failed}}", message: "{strings.feature_vrp_setup_review_error_network | feature_vrp_setup_review_error_server}" }
      - id: review_confirm
