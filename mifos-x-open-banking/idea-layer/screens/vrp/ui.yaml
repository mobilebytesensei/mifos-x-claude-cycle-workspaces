                action_contract_authored_at: "2026-10-21T00:00:00Z"
          - id: date_picker_cancel
            testTag: "vrpSetup:datePickerCancel"
            label: "{strings.feature_vrp_setup_date_picker_cancel}"
            on_click:
              action: DatePickerDismissed
              action_contract:
                effect: transform_state
                description: "Closes the end-date picker without changing validTo."
                action_contract_author: "claude-via-idea-plan-source"
                action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: continue_button
        type: button
        variant: filled-pill
        testTag: "vrpSetup:continueButton"
        pinned: bottom
        visible: "{{phase == Form}}"
        enabled: "{{canContinue}}"
