        testTag: "vrpSetup:payerPicker"
        label: "{strings.feature_vrp_setup_payer_label}"
        on_toggle:
          action: PayerToggled
          action_contract:
            effect: transform_state
            description: "Toggles payerExpanded to show or hide the VRP-capable payer accounts."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
        on_click:
          action: PayerSelected
