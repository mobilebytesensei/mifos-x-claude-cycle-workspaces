            effect: transform_state
            description: "Sets chooseAtBank = true and clears selectedPayerId; the consent is staged without a DebtorAccount and the payer is picked at HSBC."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - { id: payer_card_warning, type: banner, testTag: "vrpSetup:payerCardWarning", visible: "{{chooseAtBank}}", message: "{strings.feature_vrp_setup_payer_card_warning}" }
      - id: payee_row
