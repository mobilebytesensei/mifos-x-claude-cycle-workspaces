          action_contract:
            effect: call_api
            external_library_refs: ["AccountsOverviewRepository.refresh (core/data, Store5)"]
            description: "Calls accountsOverviewRepository.refresh() so the payer stream re-fetches accounts and balances; the screen re-renders from the new ScreenState."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"

  # ═════════════════════════════════════════════════════════════════════
  - id: vrp-callback-screen
    name: VrpCallback
    module: ":feature:vrp:vrp-callback"
    route: "VrpCallbackRoute(redirectUrl)"
    archetype: loading
    title: "{strings.feature_vrp_callback_title}"
    description: >
      Root-level screen. KptScaffold with a centre-aligned 'Setting up' top bar and no back icon.
      Working page (spinner + stage message) while validating / exchanging / confirming; terminal pages
      for Success (payee named), Unusable (card or non-sort-code payer chosen at the bank), Declined
      (the customer said no at the bank — neutral copy, never the security/failure message, DEF-006)
      and Failed (kind-specific message + optional 'Reference: …'). The app logo sits above the
      working spinner so the redirect back from the bank visibly lands in this app. Bottom bar:
      'Start again' (→ VrpSetup) + 'Close' where starting again can help, otherwise a single 'Done'
      (→ the new consent's VrpConsentDetail). DEF-010: outcomes return to the VRP flow, never Home.
    states: [working, success, unusable, declined, failed]
    initial_state: working
    state_descriptions:
      working: "Working(stage ∈ Validating | Exchanging | Confirming) — vrpCallback:working + vrpCallback:workingMessage + vrpCallback:logo; no actions."
      success: "Success(consentId, payeeName) — vrpCallback:success / successBody; Done opens VrpConsentDetail(consentId)."
      unusable: "Unusable(consentId) — vrpCallback:unusable; Start again (→ VrpSetup) + Close (→ VrpConsentDetail(consentId))."
      declined: "Declined — customer declined at the bank (OAuth error=access_denied). vrpCallback:declined / declinedBody: neutral 'You declined at your bank, no limits were set up'. NO security/failure wording, NO support reference (DEF-006). Start again (→ VrpSetup) + Close (→ VrpConsentList)."
      failed: "Failed(kind, supportReference) — vrpCallback:failed / failedBody / supportReference. ConfirmationFailed reuses the success title and offers only Done (→ VrpConsentDetail(storedConsentId)); other kinds offer Start again (→ VrpSetup) + Close (→ VrpConsentList)."
    state_model:
      VrpCallbackViewModel:
        base: "BaseViewModel<VrpCallbackState, VrpCallbackEvent, VrpCallbackAction>"
        state:
          name: VrpCallbackState
          fields:
            redirectUrl: { type: String, default: "savedStateHandle[redirectUrl].orEmpty()" }
            uiState: { type: VrpCallbackUiState, default: "Working(Validating)" }
          private_fields:
            storedConsentId: "String? — set once the credential is persisted"
        ui_state:
          members:
            - { name: Working, fields: { stage: "CallbackStage (Validating | Exchanging | Confirming)" } }
            - { name: Success, fields: { consentId: String, payeeName: String } }
            - { name: Unusable, fields: { consentId: String } }
            - { name: Declined, note: "validateCallback → AccessDenied (customer chose not to approve). A distinct UiState, NOT a CallbackErrorKind — a decline is a choice, not an error (DEF-006)." }
            - { name: Failed, fields: { kind: CallbackErrorKind, supportReference: { type: String, default: '""' } } }
        errors:
          name: CallbackErrorKind
          types:
            - { type: CallbackInvalid, from: "SecurityError | NoPending | MissingCode | validation Error  # AccessDenied is NOT here — it maps to UiState.Declined", message_key: feature_vrp_callback_failed_invalid, start_again: true }
            - { type: CodeExpiredOrUsed, from: "exchange 400 / 401", message_key: feature_vrp_callback_failed_expired, start_again: true }
            - { type: AuthorityNotSaved, from: "exchange other errors (credential not persisted)", message_key: feature_vrp_callback_failed_not_saved, start_again: true }
            - { type: ConfirmationFailed, from: "consent read-back failed after the credential was stored", message_key: feature_vrp_callback_failed_confirmation, start_again: false, leaves_usable_consent: true }
            - { type: NetworkUnavailable, from: "exchange transport failure", message_key: feature_vrp_callback_failed_network, start_again: true }
        events:
          name: VrpCallbackEvent
          members:
            - { name: Completed, params: { consentId: String }, handled_by: "onCompleted(consentId) → root navigateToAuthenticatedGraph then navigateToVrpConsentDetail(consentId) (back stack: Home › VrpConsentList › VrpConsentDetail) — DEF-010" }
            - { name: Abandoned, handled_by: "onAbandoned → root navigateToAuthenticatedGraph then navigateToVrpConsentList() — DEF-010" }
            - { name: RestartSetup, handled_by: "onRestartSetup → root navigateToAuthenticatedGraph then navigateToVrpConsentList() + navigateToVrpSetup() (back stack: Home › VrpConsentList › VrpSetup) — DEF-010" }
        actions:
          name: VrpCallbackAction
          members:
            - { name: Dismiss, trigger: "Tap Done / Close" }
            - { name: StartAgain, trigger: "Tap Start again (Unusable, Declined, Failed except ConfirmationFailed)" }
            - { name: "Internal.ReceiveCredentialResult", internal: true }
            - { name: "Internal.ReceiveConsentResult", internal: true }
        di: [SavedStateHandle, VrpAuthRepository, VrpConsentRepository]
    components:
      - { id: callback_top_bar, type: top-bar, variant: center-aligned, title: "{strings.feature_vrp_callback_title}", navigation_icon: none }
      - { id: callback_logo, type: image, role: logo, asset_ref: vrp_callback_logo, testTag: "vrpCallback:logo", visible: "{{uiState is Working}}", content_description: "{strings.feature_vrp_callback_logo_description}" }
      - { id: working_page, type: progress-panel, testTag: "vrpCallback:working", message_testTag: "vrpCallback:workingMessage", message: "{strings.feature_vrp_callback_validating | feature_vrp_callback_exchanging | feature_vrp_callback_confirming}" }
      - { id: success_page, type: success-state, testTag: "vrpCallback:success", body_testTag: "vrpCallback:successBody", title: "{strings.feature_vrp_callback_success_title}", body: "{strings.feature_vrp_callback_success_body}" }
      - { id: unusable_page, type: message-state, testTag: "vrpCallback:unusable", title: "{strings.feature_vrp_callback_unusable_title}", body: "{strings.feature_vrp_callback_unusable_body}" }
      - { id: declined_page, type: message-state, tone: neutral, testTag: "vrpCallback:declined", body_testTag: "vrpCallback:declinedBody", title: "{strings.feature_vrp_callback_declined_title}", body: "{strings.feature_vrp_callback_declined_body}", note: "Neutral icon/tone — never the error-state styling, never a support reference (DEF-006)." }
      - { id: failed_page, type: error-state, testTag: "vrpCallback:failed", body_testTag: "vrpCallback:failedBody", title: "{strings.feature_vrp_callback_failed_title | feature_vrp_callback_success_title}", body: "{strings.feature_vrp_callback_failed_*}", reference: { testTag: "vrpCallback:supportReference", text: "{strings.feature_vrp_callback_support_reference}" } }
      - id: start_again_button
        type: button
        variant: filled-pill
        testTag: "vrpCallback:startAgainButton"
        visible: "{{uiState is Unusable || uiState is Declined || (uiState is Failed && kind != ConfirmationFailed)}}"
        label: "{strings.feature_vrp_callback_start_again}"
        on_click:
          action: StartAgain
          target: vrp
          target_screen: vrp-setup-screen
          action_contract:
            effect: navigate
            description: "Discards any pending authorisation (VrpAuthRepository.discardAuthorisation) and emits RestartSetup; the root navigator enters the authenticated graph and opens VrpSetupRoute on top of VrpConsentList, so the label's promise holds (DEF-010)."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: dismiss_button
        type: button
        variant: "text 'Close' beside Start again, otherwise filled-pill 'Done'"
        testTag: "vrpCallback:dismissButton"
        visible: "{{uiState !is Working}}"
        label: "{strings.feature_vrp_callback_dismiss | feature_vrp_callback_done}"
        on_click:
          action: Dismiss
          target: vrp
          target_screen: "vrp-consent-detail-screen | vrp-consent-list-screen"
          params: { consentId: "{consentId}" }
          action_contract:
            effect: navigate
            description: "Leaves the callback: emits Completed(consentId) for Success, Unusable or ConfirmationFailed with a stored credential → root opens VrpConsentDetailRoute(consentId) of the new consent; Declined and the other Failed kinds emit Abandoned → root opens VrpConsentList. Never lands on Home (DEF-010)."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"

  # ═════════════════════════════════════════════════════════════════════
  - id: vrp-payment-screen
    name: VrpPayment
    module: ":feature:vrp:vrp-payment"
    route: "VrpPaymentRoute(consentId)"
    archetype: form
    title: "{strings.feature_vrp_payment_title | feature_vrp_payment_review_title}"
    description: >
      KptScaffold with KptTopAppBar (back); title switches to 'Check this payment' on review. Amount
      page: 'To {payee}', 'From {payer}', large £ amount entry, inline amount error, 'Up to … in one
      payment', '… left this {period}' + advisory note; pinned Continue. Review page: AMOUNT, amount,
      'To {payee}', pinned 'Send payment' + Back. After submission the review page becomes Sent
      ('Payment sent', settled or processing copy, Check again + Done) or Failed ('Payment not sent',
      kind copy, 'Reference: …', Retry only for network + Done).
    states: [loading, content, review, confirming_funds, sending, sent, failed, unusable, error]
    initial_state: loading
    state_descriptions:
      loading: "Loading — vrpPayment:loadingSkeleton (consent not yet observed)."
      content: "Content(phase = Amount) — vrpPayment:amountPage."
      review: "Content(phase = Review, outcome = NotStarted) — vrpPayment:reviewPage."
      confirming_funds: "outcome = ConfirmingFunds — POST domestic-vrp-consents/{ConsentId}/funds-confirmation runs BEFORE any domestic-vrps submit (DEF-005); vrpPayment:confirmingFunds 'Checking the money is available…'; Send payment and Back disabled."
      sending: "outcome = Sending — funds confirmed available; POST domestic-vrps in flight; Send payment and Back disabled."
      sent: "outcome = Sent(payment) — vrpPayment:sentState; Check again (refreshButton) only while not settled; Done."
      failed: "outcome = Failed(kind, supportReference) — vrpPayment:failedState / failedBody / supportReference; Retry (retrySubmissionButton) only for NetworkUnavailable; Done."
      unusable: "Unusable — consent revoked, not Authorised, or payer not a 14-char sort-code account. vrpPayment:unusableState."
      error: "Error(ConsentUnavailable) — no local consent row. vrpPayment:errorState + Retry."
    state_model:
      VrpPaymentViewModel:
        base: "BaseViewModel<VrpPaymentState, VrpPaymentEvent, VrpPaymentAction>"
        state:
          name: VrpPaymentState
          fields:
            consentId: { type: String, default: "savedStateHandle[consentId].orEmpty()" }
            uiState: { type: VrpPaymentUiState, default: Loading }
          private_fields:
            idempotencyKey: "Uuid.random() — fixed for the ViewModel's life; instruction id = VRPINSTR + key.take(20), end-to-end id = VRPE2E + key.take(20)"
        ui_state:
          members:
            - { name: Loading }
            - name: Content
              fields:
                phase: { type: PaymentPhase, values: [Amount, Review] }
                form: "PaymentFormUi(payeeName, payerName, amount, problem: AmountProblem?, perPaymentCeilingAmount, remainingAmount, periodType)"
                outcome: { type: SubmissionUi, default: NotStarted, values: [NotStarted, ConfirmingFunds, Sending, "Sent(payment)", "Failed(kind, supportReference)"] }
              derived:
                inFlight: "outcome is ConfirmingFunds || outcome is Sending"
                canContinue: "!inFlight && form.isUsable (amount non-blank && problem == null)"
            - { name: Unusable }
            - { name: Error, fields: { kind: "VrpPaymentErrorKind (ConsentUnavailable | StorageUnavailable)" } }
        validation:
          amount: "blank → no problem (Continue disabled); unparseable → NotANumber; < 1 minor unit → BelowMinimum (£0.01); > maximumIndividualAmount → OverPerPayment; > remaining of the binding ceiling → OverRemaining"
          binding_ceiling: "usage.minByOrNull { remaining } — the periodic ceiling closest to exhaustion; remaining computed client-side from settled payments in the current UTC period window"
          currency: "payment currency = consent maximumIndividualAmount currency"
        errors:
          name: PaymentFailureKind
          types:
            - { type: InsufficientFunds, from: "funds-confirmation FundsAvailable == false (no domestic-vrps call is made)", retry: false, message_key: feature_vrp_payment_review_error_insufficient_funds }
            - { type: OverLimit, from: "OBIE outside-control-parameters code", retry: false, message_key: feature_vrp_payment_review_error_limit }
            - { type: ConsentUnusable, from: "403", retry: false, message_key: feature_vrp_payment_review_error_unusable }
            - { type: NeedsReauthorisation, from: "401", retry: false, message_key: feature_vrp_payment_review_error_reauthorise }
            - { type: Rejected, from: "other client/server errors", retry: false, message_key: feature_vrp_payment_review_error_rejected }
            - { type: Unconfirmed, from: "Serialization", retry: false, message_key: feature_vrp_payment_review_error_unconfirmed }
            - { type: NetworkUnavailable, from: "NetworkError.Network", retry: true, message_key: feature_vrp_payment_review_error_network }
        events:
          name: VrpPaymentEvent
          members:
            - { name: Finished, params: { localId: String }, handled_by: "onBack() — pops to the consent detail" }
        actions:
          name: VrpPaymentAction
          members:
            - { name: RetryLoad }
            - { name: AmountChanged, params: { value: String } }
            - { name: Continue }
            - { name: BackToAmount }
            - { name: Confirm }
            - { name: RetrySubmission }
            - { name: RefreshOutcome }
            - { name: Done }
            - { name: "Internal.ReceiveConsent", internal: true }
            - { name: "Internal.ReceivePaymentResult", internal: true }
        di: [SavedStateHandle, VrpConsentRepository, VrpPaymentRepository]
    components:
      - id: payment_top_bar
        type: top-bar
        title: "{strings.feature_vrp_payment_title}"
        navigation_icon: arrow_back
        on_navigation_click:
          action: onBack
          target: back
          action_contract:
            effect: navigate
            description: "Invokes onBack → navController.popBackStack(), returning to the VRP consent detail."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: amount_page
        type: section
        testTag: "vrpPayment:amountPage"
        visible: "{{phase == Amount}}"
        children:
          - { id: payee_line, type: text, value: "{strings.feature_vrp_payment_to}" }
          - { id: payer_line, type: text, visible: "{{payerName.isNotBlank()}}", value: "{strings.feature_vrp_payment_from}" }
          - { id: amount_field, type: text_field, testTag: "vrpPayment:amountField", keyboard: decimal, prefix: "{strings.feature_vrp_payment_currency_sign}", placeholder: "{strings.feature_vrp_payment_amount_resting}", on_change: AmountChanged }
          - { id: amount_error, type: text, testTag: "vrpPayment:amountError", visible: "{{problem != null}}", value: "{strings.feature_vrp_payment_amount_error_decimals | _min | _per_payment | _remaining}" }
          - { id: per_payment_limit, type: text, testTag: "vrpPayment:perPaymentLimit", value: "{strings.feature_vrp_payment_per_payment_limit}" }
          - { id: remaining, type: text, testTag: "vrpPayment:remaining", visible: "{{remainingAmount.isNotBlank()}}", value: "{strings.feature_vrp_payment_remaining}" }
          - { id: remaining_note, type: text, testTag: "vrpPayment:remainingNote", value: "{strings.feature_vrp_payment_remaining_note}" }
      - id: continue_button
        type: button
        variant: filled-pill
        testTag: "vrpPayment:continueButton"
        pinned: bottom
        visible: "{{phase == Amount}}"
        enabled: "{{canContinue}}"
        label: "{strings.feature_vrp_payment_continue}"
        on_click:
          action: Continue
          action_contract:
            effect: transform_state
            description: "Moves to the Review phase when the amount is usable and nothing is in flight; no network call."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: review_page
        type: section
        testTag: "vrpPayment:reviewPage"
        visible: "{{phase == Review}}"
        children:
          - { id: review_amount_label, type: text, value: "{strings.feature_vrp_payment_review_amount}" }
          - { id: review_amount, type: text, testTag: "vrpPayment:reviewAmount", value: "{{amount}}" }  # i18n: skip — binding
          - { id: review_payee, type: text, value: "{strings.feature_vrp_payment_to}" }
          - { id: confirming_funds, type: progress-inline, testTag: "vrpPayment:confirmingFunds", visible: "{{outcome is ConfirmingFunds}}", message: "{strings.feature_vrp_payment_review_confirming_funds}" }
          - { id: sent_state, type: success-state, testTag: "vrpPayment:sentState", visible: "{{outcome is Sent}}", title: "{strings.feature_vrp_payment_review_sent_title}", body: "{strings.feature_vrp_payment_review_settled | feature_vrp_payment_review_in_progress}" }
          - { id: failed_state, type: error-state, testTag: "vrpPayment:failedState", body_testTag: "vrpPayment:failedBody", visible: "{{outcome is Failed}}", title: "{strings.feature_vrp_payment_review_failed_title}", body: "{strings.feature_vrp_payment_review_error_*}", reference: { testTag: "vrpPayment:supportReference", text: "{strings.feature_vrp_payment_review_support_reference}" } }
      - id: confirm_button
        type: button
        variant: filled-pill
        testTag: "vrpPayment:confirmButton"
        visible: "{{phase == Review && outcome in [NotStarted, ConfirmingFunds, Sending]}}"
        enabled: "{{!inFlight}}"
        label: "{strings.feature_vrp_payment_review_confirm}"
        on_click:
          action: Confirm
          action_contract:
            effect: call_api
            external_library_refs: ["VrpPaymentRepository.checkFunds (core/data)", "Vrp.checkFunds POST v4.0/pisp/domestic-vrp-consents/{ConsentId}/funds-confirmation (Ktor, detached JWS)", "VrpPaymentRepository.pay (core/data)", "VrpTokenProvider (refresh_token → PSU access token)", "Vrp.createPayment POST v4.0/pisp/domestic-vrps (Ktor, detached JWS)"]
            writes_to: "Room vrp_payment (upsert on success)"
            description: "Sets outcome = ConfirmingFunds and calls payments.checkFunds(consentId, amount) FIRST (DEF-005). FundsAvailable == false → Failed(InsufficientFunds) and NO payment is submitted; a funds-check error → Failed(toFailureKind()). Only when funds are available: outcome = Sending and payments.pay(consent, amount, VRPINSTR/VRPE2E ids, idempotencyKey) as the customer; success → Sent(payment) persisted to Room, error → Failed(kind, supportReference)."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: back_button
        type: button
        variant: text
        testTag: "vrpPayment:backButton"
        visible: "{{phase == Review && outcome in [NotStarted, ConfirmingFunds, Sending]}}"
        enabled: "{{!inFlight}}"
        label: "{strings.feature_vrp_payment_review_back}"
        on_click:
          action: BackToAmount
          action_contract:
            effect: transform_state
            description: "Returns to the Amount phase (ignored while Sending) and resets the outcome to NotStarted; the entered amount is kept."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: refresh_button
        type: button
        variant: text
        testTag: "vrpPayment:refreshButton"
        visible: "{{outcome is Sent && !outcome.settled}}"
        label: "{strings.feature_vrp_payment_review_refresh}"
        on_click:
          action: RefreshOutcome
          action_contract:
            effect: call_api
            external_library_refs: ["VrpPaymentRepository.refreshStatus (core/data)", "Vrp.getPayment GET v4.0/pisp/domestic-vrps/{DomesticVRPId} (Ktor)"]
            description: "Re-reads the sent payment's status on a client-credentials token and replaces the outcome with the fresh Sent(payment) or a Failed kind."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: retry_submission_button
        type: button
        variant: filled-pill
        testTag: "vrpPayment:retrySubmissionButton"
        visible: "{{outcome is Failed && kind == NetworkUnavailable}}"
        label: "{strings.feature_vrp_payment_review_retry}"
        on_click:
          action: RetrySubmission
          action_contract:
            effect: call_api
            external_library_refs: ["VrpPaymentRepository.pay (core/data)"]
            description: "Resubmits the same payment under the SAME idempotency key so the bank cannot pay twice; only offered for NetworkUnavailable."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - id: done_button
        type: button
        testTag: "vrpPayment:doneButton"
        visible: "{{outcome is Sent || outcome is Failed}}"
        label: "{strings.feature_vrp_payment_review_done}"
        on_click:
          action: Done
          target: vrp
          target_screen: vrp-consent-detail-screen
          action_contract:
            effect: navigate
            description: "Emits Finished(localId) which the screen turns into onBack() — popping back to the consent detail, whose payment history now shows the new row."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"
      - { id: unusable_state, type: message-state, testTag: "vrpPayment:unusableState", body: "{strings.feature_vrp_payment_unusable}" }
      - id: payment_error_state
        type: error-state
        testTag: "vrpPayment:errorState"
        title: "{strings.feature_vrp_payment_error_title}"
        body: "{strings.feature_vrp_payment_error_body}"
        cta_testTag: "vrpPayment:retryButton"
        on_click:
          action: RetryLoad
          action_contract:
            effect: transform_state
            external_library_refs: ["VrpConsentRepository.observeById + VrpPaymentRepository.observeUsage (Room)"]
            description: "Starts another observation of the consent and its usage from Room; a found consent re-renders Content or Unusable."
            action_contract_author: "claude-via-idea-plan-source"
            action_contract_authored_at: "2026-10-21T00:00:00Z"

# RULE-SCREEN-VISUAL-ASSETS-001 — derived per screen from SCREEN_ARCHETYPES.yaml floors (STEP 5.VISUAL-ASSETS):
#   vrp-consent-list-screen  (index_list)    → 0 inherited; rows carry no leading imagery, empty state is title+body text (no illustration role)
#   vrp-consent-detail-screen (detail_screen) → 1 inherited (hero), refined to this consent's subject  [PROTOTYPE_GAPS gap-009]
#   vrp-setup-screen          (form)          → 0; pure form, no visual role
#   vrp-callback-screen       (loading)       → 1 inherited (logo)                                    [PROTOTYPE_GAPS gap-010]
#   vrp-payment-screen        (form)          → 0; pure form, no visual role
visual_assets:
  - id: vrp_consent_detail_hero
    kind: hero
    role: hero
    screen: vrp-consent-detail-screen
    intent: "Calm 16:9 header illustration for a sweeping Variable Recurring Payment: two minimal account cards linked by a gentle looping arrow that passes through a soft rounded ceiling bar (the agreed limit), suggesting money moving regularly but always within a cap. Flat, trustworthy, precise; muted brand palette, generous negative space, no text, no currency symbols, no bank logos."
    produced_by: /idea-feature-stitch-art
    states: [content]
    consistency: none
  - id: vrp_callback_logo
    kind: logo
    role: logo
    screen: vrp-callback-screen
    intent: "The Mifos X Open Banking app mark, centred above the working spinner while the bank redirect is validated, exchanged and confirmed — so the return from HSBC visibly lands in this app. Use the real brand mark from the brand kit at ~72dp, no wordmark text sampling."
    produced_by: /idea-branding
    states: [working]
    consistency: none

