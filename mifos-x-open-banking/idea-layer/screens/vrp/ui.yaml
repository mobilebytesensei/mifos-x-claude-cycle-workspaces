      - id: payer_bank_choice
        type: list_item
        component: MifosBankChoiceRow
        testTag: "vrpSetup:payerBankChoice"
        label: "{strings.feature_vrp_setup_payer_choose_at_bank}"
        supporting: "{strings.feature_vrp_setup_payer_choose_at_bank_supporting}"
        on_click:
          action: ChooseAtBankSelected
