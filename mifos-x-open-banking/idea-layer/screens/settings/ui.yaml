known_gaps:
  - id: SET-GAP-1
    severity: should
    requirement_ref: FR-046
    status: specified
    resolution: "Spec authored 2026-10-21 (sign_out_section + sign_out_confirm_dialog, SettingsEvent.LoggedOut → onLoggedOut). Source still lacks the row until /kmp-implement runs."
    description: "No sign-out row. Settings has Appearance, Account (consents only) and About sections; the only way to sign out today is revoking the AIS consent from consent-detail (onLoggedOut)."
