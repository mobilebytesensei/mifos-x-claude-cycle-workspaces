# ── Description corrected 2026-07-30 (/idea-feature-export stale-artifact fix) ──
# Listed security (biometric lock + session timeout), notifications, a Profile row and a
# Clear Local Data row. None ships: components are appearance_header/theme_row,
# account_header/consents_row, about_header/privacy_row/licences_row/app_version_row.
# idea-plan.yaml already recorded the reverse-sync note ("biometric app-lock, session
# timeout and notification preferences were specified but never built"); this prose was
# not updated to match. The Profile row was deleted when profile became account-holder.
description: >-
  App settings hub — appearance (theme dropdown), a Manage Consents shortcut, and About &
  Legal (privacy policy in a browser, in-app open-source licences, static app version).
  Client-only: no store, no core/data banking layer, no external API. SettingsViewModel reads
  and writes UserDataRepository and is the first production caller of setDarkThemeConfig.
  It *is* the More tab — MoreTab points at SettingsRoute, replacing the former MoreRoute
  placeholder.
has_ui: true
has_server: false
# has_local_preferences: DataStore-backed theme preference with a defaults path.
# No has_api: zero operations. NOT has_form_input — the single `select` is a preference
# toggle, not a form; the rule's sub-checks (validators[], submit loading state,
# required-field marking) describe something this screen does not have.
capabilities: [has_ui, has_flow, has_local_preferences]
# RULE-CAP-HAS-LOCAL-PREFERENCES-001 V1/V3. DataStore-backed, read and written by
# SettingsViewModel via UserDataRepository.setDarkThemeConfig.
# preferences: MOVED to ui.yaml 2026-07-31 (CROSS_LEAK repair — sibling-layout.json
# assigns `preferences` to the ui sibling, capability_gate has_local_preferences).
# V2 schema migration: none needed yet — dark_theme_config is the only key and has never
# been renamed or removed. Declared explicitly so a future rename records a migration here
# rather than silently orphaning a stored value.
preferences_migrations: []
# V4 cross-check (RULE-SEED-SECURITY-001 V1-AUTH-TOKEN-STORAGE): no auth tokens, credentials
# or PII live in preferences. OBIE access/refresh tokens go to ConsentSession over
# multiplatform-settings SECURE storage via core/datastore, never here.
preferences_security_note: "no tokens, credentials or PII in DataStore — secure storage only"
