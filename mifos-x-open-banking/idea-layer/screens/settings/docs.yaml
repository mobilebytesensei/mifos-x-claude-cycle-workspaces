libraries:
  - name: multiplatform-settings
    module: com.russhwolf:multiplatform-settings-no-arg (+ -coroutines)
    purpose: >-
      Preference storage. Consume the EXISTING core/datastore UserPreferencesRepository — this feature
      adds NO new preference keys and NO new persistence code. Its only persisted setting is the theme,
      already served by observeDarkThemeConfig: Flow<DarkThemeConfig> / setDarkThemeConfig(...).
      (The keys that would have been new — session_timeout, notify_consent_expiry,
      notify_security_alerts — belonged to the Security and Notifications sections, which are out of
      scope per the 2026-07-22 scope cut.) androidx.datastore is not in the version catalog and must
      not be introduced.
  - name: app design system
    module: core/ui (KptScaffold) + core-base/designsystem (KptTheme)
    purpose: >-
      Settings rows are composed from the app's own design system under the one-state-per-file
      Screen/Content/Skeleton/Empty/Error convention. No third-party settings-UI dependency —
      com.github.alorma:compose-settings-ui-m3 is not in the version catalog.
  - name: kotlinx-serialization
    module: org.jetbrains.kotlinx:kotlinx-serialization-json
    purpose: Serialization for structured preference types held in preferences
# vm_actions REWRITTEN 2026-08-01 (/idea-sync, from /idea-verify XS-3).
#
# /idea-verify flagged ONE action here — clearLocalDataConfirm, caught because it named the
# removed `clear_confirm` state. Reading the block revealed the finding was NARROWER than the
# defect: all 12 actions described the pre-2026-07-28 design, and 8 of them drove surfaces
# ui.yaml:29-37 explicitly records as removed in the reverse sync:
#
#   toggleBiometricLock, updateSessionTimeout          -> no Security section is rendered
#   toggleConsentExpiryNotification,                   -> no Notifications section is rendered
#     toggleSecurityAlertsNotification
#   navigateProfile                                    -> the profile screen was never built
#   clearLocalDataConfirm, dismissClearLocalData,      -> no destructive cache-erasure surface
#     executeClearLocalData                               exists; clear_confirm is not a state
#
# The remaining four were real behaviours under the wrong shape: `updateTheme(theme: String)`
# is the pre-sync name for SelectTheme(config: DarkThemeConfig), and navigateConsentList /
# openExternalUrl / openOssLicences are not SettingsActions at all — they are nav-host
# callbacks, which is why they are moved to nav_callbacks below rather than deleted.
#
# The block now mirrors ui.yaml#state_model.SettingsViewModel.actions verbatim: four members.
vm_actions:
  - name: SelectTheme
    signature: 'fun selectTheme(config: DarkThemeConfig)'
    state_mutations:
      - "content.themeConfig = config; content.themeLabel re-resolved from the new config"
    side_effects:
      - Writes DarkThemeConfig back through UserDataRepository (androidx.datastore)
      - The user-data stream re-emits and AppTheme retints the whole app
    error_handling:
      on_error: log_only
    notes: "The only persisted mutation on this screen. Surface: ui.yaml#theme_row on_select."
  - name: ToggleThemeMenu
    signature: fun toggleThemeMenu()
    state_mutations:
      - "content.isThemeMenuExpanded = !content.isThemeMenuExpanded"
    side_effects: []
    error_handling: {}
    notes: "Pure local dropdown state — nothing is persisted."
  - name: DismissThemeMenu
    signature: fun dismissThemeMenu()
    state_mutations:
      - "content.isThemeMenuExpanded = false"
    side_effects: []
    error_handling: {}
    notes: "Collapses the dropdown without changing the selected theme."
  - name: RetryLoad
    signature: fun retryLoad()
    state_mutations:
      - "uiState = Content on recovery, or Error again on repeat failure"
    side_effects:
      - Re-reads the UserDataRepository preference stream to rebuild Content
    error_handling: {}
    notes: "Both SettingsErrorKind values are retriable, so this is reachable from either."

nav_callbacks:
  # Host-owned; invoked by settingsScreen, NOT members of SettingsAction. Previously misfiled
  # in vm_actions as navigateConsentList / openExternalUrl / openOssLicences.
  - "onNavigateToConsents -> navigate(ConsentListRoute)   [surface: consents_row]"
  - "onNavigateToLicences -> navigate(LicencesRoute)      [surface: licences_row]"
  - "onOpenUrl -> LocalUriHandler.openUri(url)            [surface: privacy_row]"
error_cases:
  - trigger: load_settings_on_mount
    condition: DataStore preferences Flow throws IOException on initial collection (storage corruption, disk full)
    handling: >-
      Transition screen to Error state. Display error_outline icon, title, body, and a Retry button. Retry re-triggers
      Flow collection (Loading → Content on recovery, or Error again on repeat failure).
    severity: error
  - trigger: open_external_url
    condition: No browser app installed on device (ActivityNotFoundException on Android)
    handling: >-
      Show snackbar — URL not opened silently; no crash. Snackbar offers no retry (no viable action available without a
      browser).
    severity: warning
  # REMOVED 2026-08-01 (/idea-sync, same XS-3 sweep as vm_actions above): the
  # `toggle_biometric_lock` and `clear_local_data` error cases described failure modes of the
  # two surfaces the 2026-07-28 reverse sync deleted (no Security section, no cache-erasure
  # sheet). An error case for an action that cannot be dispatched is unreachable by
  # construction. Swept in the SAME edit as the actions that raised them rather than left for
  # a later pass — leaving them is how this file came to contradict its own ui.yaml.
  #
  # The two surviving cases below are the real ones, and they map to the two SettingsErrorKind
  # members ui.yaml declares: PreferencesUnavailable and Unknown. Both are retriable.
