sibling: demo-data
schema_version: "2.1.0"
feature_id: settings

screen_id: settings
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; realistic preference values only."

settings:
  theme: "System"
  biometric_lock_enabled: true
  session_timeout: "5 minutes"
  notify_consent_expiry: true
  notify_security_alerts: true
  # Dynamic at runtime — sourced from BuildConfig.VERSION_NAME + VERSION_CODE.
  # Shown in About & Legal section; never hard-coded in UI layer.
  app_version: "0.1.0 (build 1)"

# Runtime-resolved values — populated by the platform at launch, not persisted
# preferences. Declared here so ui.yaml {runtime.*} bindings resolve for preview.
runtime:
  gps_permission_state: "granted"   # granted | denied | not_asked (ATM-locator consent)

# Platform-resolved values — supplied by expect/actual platform module at runtime.
# Declared here so ui.yaml {platform.*} bindings resolve for preview.
platform:
  app_files_dir: "/data/data/org.mifosx.openbanking/files"

# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [content, empty, error] — deliberately no `loading`, because
# SettingsUiState has no Loading member in source (already recorded as a dismissal in
# DESIGN_VALIDATION). empty and error had no fixture, so both bound to nothing.
states:
  - scope: content
    settings: settings
    runtime: runtime
    platform: platform

  - scope: empty
    settings:
      theme: "System"
      biometric_lock_enabled: false
      session_timeout: "5 minutes"
      notify_consent_expiry: true
      notify_security_alerts: true
      app_version: "0.1.0 (build 1)"
    runtime:
      gps_permission_state: "not_asked"
    _what_empty_means_here: >-
      A settings screen is never empty of rows — it is empty of USER CHOICES. This fixture is
      a first launch: nothing customised, biometrics not yet enrolled, location never asked.
      It exists so the disclosure rows that read a permission state have a not_asked case to
      render, which is the one a new user actually sees.

  - scope: error
    error_type: PreferencesLoadFailed
    message: "Could not load your settings"
    recovery: "Your preferences are safe. Close and reopen the app to try again."
    recoverable: true
    _no_retry_button: >-
      Recovery is a relaunch, not an in-place retry: preferences are read once at construction
      from local storage, so there is no fetch for a retry affordance to re-issue.
