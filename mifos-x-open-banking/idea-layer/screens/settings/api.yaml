sibling: api
schema_version: "4.0"
feature_id: settings
_source: source_analysis

api:
  - id: get_license
    method: GET
    path: "https://raw.githubusercontent.com/openMF/mifos-x-open-banking/refs/heads/dev/LICENSE"
    client: "OpenSourceLicenceAPI.fetchLicence() (core/network, Ktor)"
    description: >
      Fetches the project LICENSE as plain text. Not a bank call: no mTLS bank host, no bearer token,
      no FAPI headers. Wrapped by OpenSourceLicenceStore (Store5) whose source of truth is user
      preferences, so the text is served offline from cache between launches.
    auth: none
    headers: {}
    params: {}
    response:
      type: text/plain
      body: String
    cache:
      ttl: 86400          # 24h DefaultValidator.withTtl(LICENCE_TTL)
      strategy: stale-while-revalidate
      offline: show_cached
      store: "OpenSourceLicenceStore.licenceStore (key OpenSourceLicenceStore)"
      persisted_in: "UserPreferencesRepository.openSourceLicenceText"
    errors:
      network: "ScreenState.NoNetwork → error (isNetworkError=true)"
      http_error: "NetworkResult.Error → thrown via toThrowable() → ScreenState.Error → error (message = error.message)"
      blank_body: "ScreenState.Empty (emptyIfContent) → error"

local_reads:
  - id: observe_dark_theme
    source: "UserDataRepository.observeDarkThemeConfig (multiplatform-settings)"
    response: DarkThemeConfig
  - id: get_third_party_libraries
    source: "ThirdPartyLibrariesRepo.getLibraries() — aboutlibraries-core Libs.Builder().withJson(Res.readBytes(\"files/aboutlibraries.json\"))"
    response: "List<LibraryUi(id, name, version?, licences: List<String>, website?)>"
    note: "Build-time generated by the com.mikepenz.aboutlibraries.plugin (already in libs.versions.toml, applied to cmp-android only today) — no network."
local_writes:
  - id: set_dark_theme
    source: "UserDataRepository.setDarkThemeConfig(config)"
    request: DarkThemeConfig
  - id: app_logout
    source: "AppLogout.logOut() (core/data AppLogoutImpl)"
    request: Unit
    side_effects: "forget PSU + payment tokens (ConsentSession, PaymentAuthSession), clearUserData, StoreCacheManager.clearAll, PaymentHistoryDao.clear, VRP sessions/DAOs (FR-046)"
