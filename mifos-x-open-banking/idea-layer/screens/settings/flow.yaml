sibling: flow
schema_version: "4.0"
feature_id: settings

feature: settings
flow_ref: app-main

entry_points:
  - source: app_shell_bottom_nav
    label: "More tab (order 3)"
    source_binding: "AuthenticatedNavBarTabItem.MoreTab -> SettingsRoute (flat tab: graphRoute == startDestinationRoute)"

transitions:
  - from: settings
    to: consent-list
    trigger: "Tap Manage Consents row (Account section)"
    source_binding: "onNavigateToConsents -> navigate(ConsentListRoute)"
  - from: settings
    to: licences
    trigger: "Tap Licences row (About section)"
    source_binding: "onNavigateToLicences -> navigate(LicencesRoute)"

external_transitions:
  - from: settings
    to: "privacy policy URL"
    trigger: "Tap Privacy row (About section)"
    source_binding: "onOpenUrl -> LocalUriHandler.openUri(url)"

removed_in_sync:
  - { to: profile, reason: "the profile screen was never built; no such row or callback exists" }
