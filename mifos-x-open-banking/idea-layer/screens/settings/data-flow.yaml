sibling: data-flow
schema_version: "2.1.0"
feature_id: settings

screen_id: settings

on_mount:
  - trigger: load_settings
    description: "Collect DataStore preferences Flow via SettingsViewModel.uiState (StateFlow). Emits Loading on subscription, then Empty on first cold start before defaults are written (transient — typically one frame), then Content on subsequent emissions. Emits Error when DataStore throws an IOException (storage corruption, disk full); error state exposes a Retry button that re-triggers the Flow collection."
    loading_state: loading
    empty_state: empty
    success_state: content
    error_state: error

on_user_action:
  - trigger: update_theme
    description: "Persist selected theme string ('Light' | 'Dark' | 'System') to DataStore via atomic update. Dynamic theming reacts via AppTheme collecting the same preferences Flow."

  - trigger: toggle_biometric_lock
    description: "Flip biometric_lock_enabled boolean in DataStore. Guard: check BiometricManager availability first — emit BiometricUnavailable event if no hardware/enrollment; skip DataStore write."

  - trigger: update_session_timeout
    description: "Persist selected session timeout string to DataStore. Only values from the whitelisted enum [2 minutes, 5 minutes, 10 minutes, 30 minutes] are accepted; reject and log any other value."

  - trigger: toggle_consent_expiry_notification
    description: "Flip notify_consent_expiry boolean in DataStore. Used by background notification scheduler to decide whether to post consent-expiry alerts."

  - trigger: toggle_security_alerts_notification
    description: "Flip notify_security_alerts boolean in DataStore. Used by FCM message handler to decide whether to display security-event notifications."

  - trigger: clear_local_data_confirm
    description: "Emit ShowClearDataConfirmation UI event to open confirmation bottom-sheet. No DataStore or database writes at this stage."

  - trigger: clear_local_data
    description: "On user confirmation: (1) Delete all cached account and transaction rows from Room/SQLDelight local database. (2) Reset DataStore cached-at timestamp keys to null so next navigation to dashboard triggers fresh AIS fetch. Emit LocalDataCleared event on success; emit LocalDataClearFailed on IOException."

  - trigger: open_oss_licences
    description: "Open system-provided OSS licence screen via AboutLibraries navigation; no DataStore interaction."

  - trigger: retry_load_settings
    description: "Re-trigger the DataStore preferences Flow collection after an I/O failure. Transitions screen state from Error → Loading before the new Flow subscription starts. On success emits Content; on repeat IOException returns to Error."
