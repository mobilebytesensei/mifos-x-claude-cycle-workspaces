_content_policy: >-
  RULE-PROTO-CONTENT-001 — zero placeholders. Every record below is a VERBATIM live response
  captured 2026-08-07, HTTP 200. The first three came from
  GET https://api.hsbc.com/x-open-banking/v2.2/branches/geo-location/lat/51.5074/long/-0.1278?radius=5
  and the fourth (401118) from the full-estate GET https://api.hsbc.com/open-banking/v2.2/branches.
  Field names, casing and whitespace defects preserved exactly.

_provenance_caveat: >-
  Earlier revisions cited `open-data-specs/branch-probe.json` as a bare relative path, which
  resolves from nowhere. CORRECTED 2026-08-07: that directory exists OUTSIDE this repository at
  /home/kalpesh/OpenBankingProject/HSBC_Sandbox/open-data-specs/ — one developer's machine, not
  checked in and not shared evidence. Do not cite it as if a reader could open it. Every record
  here is instead reproducible directly from the live public API, which needs no credential;
  see api.yaml#reproduction_commands for the exact requests, and prefer them — a reproduction
  command beats a snapshot, because the feed moves as meta.LastUpdated advances.

_source_of_truth: "GET /x-open-banking/v2.2/branches/… on api.hsbc.com — unauthenticated, live."

# ─────────────────────────────────────────────────────────────────────────
# WHY THESE THREE
# ─────────────────────────────────────────────────────────────────────────
_fixture_selection_rationale:
  baker_street: "Has a SATURDAY entry — six Day records."
  balham: >-
    Has NO Saturday — five Day records, Monday to Friday. Paired with Baker Street this is the
    negative case for the closed-days-are-absent trap: a renderer that iterates the array shows
    one branch with a Saturday row and the other with nothing there at all, and the user cannot
    tell that Balham is CLOSED on Saturday rather than unknown.
  bishopsgate: >-
    Identification 400231 is EXACTLY the Branch.Identification carried by ATM M01M0035 in
    screens/atm-locator/demo-data.yaml. This is a real, live cross-API join — the ATM feed's
    reference stub resolving to a real branch record. Both fixture sets were captured on the same
    day so the join is genuine, not staged.
  birmingham_new_street: >-
    ADDED 2026-08-07 after a full-population scan. The ONLY branch of 327 in the entire HSBC UK
    estate that publishes NonStandardAvailability — it is closed from 2025-10-06 to 2027-03-21
    and still advertises a normal Monday-to-Saturday 09:30-16:30 schedule. It is here because a
    developer working from any London radius search will never encounter this field and will
    ship a screen that sends users to a shuttered building. A 1-in-327 case that is live in
    production today cannot be left to chance in the fixtures.
  sunday_absent_everywhere: >-
    NOT ONE of the 327 UK branches publishes a Sunday — confirmed against the whole estate, not
    just this sample. Absence is universal, which is why the trap bites every record. Saturday
    is the only variable day: 167 of 327 publish one.

_fixture_fidelity_notes:
  whitespace_defects_are_real: >-
    BuildingNumber values "90 ", "117 " and "1-3 " all carry a TRAILING space in the live feed.
    Kept verbatim. A composed address that does not trim renders "117  Balham High Road" with a
    double space — a small, real, shipping-today bug.
  phone_is_not_per_branch: >-
    All four carry ContactContent "03457 404 404" — and so do all 327 branches in the national
    estate. There is exactly one distinct phone number in the whole feed. It is HSBC's general UK
    line, not a branch direct dial. Kept because it is what the API returns, but the screen must
    not label it "Call this branch", and repeating an identical national number on every list row
    is noise.
  name_carries_service_caveats: >-
    Three of these four Names end "- Counter Service Available (Monday-Friday)", which made the
    suffix look like boilerplate at sample scale. It is not. Across the estate the suffix splits
    the country: 164 branches read "Counter Service Available (Monday-Friday)", 149 read "Cash
    Withdrawals and Note Deposits Through Self-Service", 12 read "Not Wheelchair Accessible" and
    one reads "Temporarily closed". It is editorial free text, but it carries real signal —
    render the name, and derive capability from the structured fields, which agree with it.
  photo_and_note_absent: "Photo and Note are 0/25 live and are deliberately NOT stubbed in."

