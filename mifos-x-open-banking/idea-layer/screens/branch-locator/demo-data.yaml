_accessibility_varies:
  finding: "Bishopsgate lacks LevelAccess where the other two have it."
  why_it_matters: >-
    The accessibility filter is real and discriminating — it is not a field where every branch
    returns the same set. This is the concrete reason the filter belongs on this screen and is
    impossible on atm-locator, where the same field is never sent at all.

states:
  - { scope: content, branches: all, note: "4 records: one with Saturday, one without, one that is an ATM join target, one temporarily closed." }
  - { scope: loading, branches: all }
  - { scope: temporarily_closed, branches: ["401118"], note: "Birmingham New Street. Closure window 2025-10-06 to 2027-03-21 contains today, yet StandardAvailability reads Mon-Sat 09:30-16:30. The banner must win." }
  - { scope: empty, branches: [], note: "No branches within the radius. Genuinely reachable — the ceiling is 10 miles and branch density is far lower than ATM density. NOTE: an empty response is also what a bad radius or a mis-formatted sort code returns — validate input before trusting this state." }
  - { scope: location_denied, branches: all, note: "Device location refused. Falls back to the postcode / town / sortcode paths." }
  - { scope: error, error_type: BranchesLoadFailed, message: "Could not load nearby branches", recovery: "Check your connection and try again." }
  - { scope: rate_limited, error_type: TooManyRequests, http: 429, message: "Too many searches. Try again in a moment." }
  - { scope: no_network, error_type: Offline, message: "You are offline. Showing branches saved on this device." }

_no_unauthenticated_state: >-
  Deliberately absent. The swagger declares no security scheme and no path returns 401 or 403,
  so a session-expiry branch on this screen would be unreachable code — the same correction
  applied to atm-locator on 2026-08-07.

