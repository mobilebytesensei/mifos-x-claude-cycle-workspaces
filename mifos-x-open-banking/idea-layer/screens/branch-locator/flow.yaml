sibling: flow
schema_version: "4.0"
feature_id: branch-locator
flow_ids:
  - consumer-banking
navigates_to: []
flow_logic: []
journey_ids:
  - consumer-insights-utilities

entry_points:
  - from: settings
    via: "Find a branch"
    note: "Reachable with no session — see unauthenticated_reachability below."
  - from: atm-locator
    via: "branch reference on an ATM record"
    note: >-
      ATM.Branch.Identification resolves here. A cross-feature link, not a nav edge in the usual
      sense. The ATM feed carries only the id, never the name, so resolution costs a separate
      call — and 135 ATMs resolve to just 31 distinct branch ids, so one unfiltered fetch plus a
      client-side index beats per-id lookups.
  - from: beneficiaries
    via: "sort code on a saved payee"
    added: "2026-08-07"
    note: >-
      The sort-code lookup turns an opaque six-digit number into a named place with an address.
      No consent, no token, no session — it works even before the PSU connects an account.
  - from: standing-order-detail
    via: "sort code on the destination account"
    added: "2026-08-07"
  - from: transaction-detail
    via: "sort code on the counterparty account"
    added: "2026-08-07"

sortcode_entry_contract:
  why_these_three_were_added: >-
    api.yaml has always described the sort-code lookup as the one Open Data endpoint that
    composes with the rest of the app, but no entry point expressed it — the screen was reachable
    only from settings and from atm-locator. These three are where the app already holds a sort
    code, so they are where the capability actually pays off.
  mandatory_normalisation: >-
    Every one of these call sites must strip non-digits before issuing the lookup. The endpoint
    accepts six digits only; the hyphenated form these screens display returns zero results with
    HTTP 200 and no error. See api.yaml#operations[get_branch_by_sortcode].format_SETTLED.
  graceful_absence: >-
    A sort code that resolves to nothing must degrade quietly — not every sort code in a payment
    belongs to HSBC, and non-HSBC codes legitimately return empty. Show the branch link only
    when a branch was found; never render a dead affordance or an error for a rival bank's code.

unauthenticated_reachability: >-
  This screen and atm-locator are the ONLY two in the app reachable with no consent, no token and
  no session. That is a product property worth using deliberately — a prospective customer can
  find a branch before connecting anything — and it means the screen must never render a
  sign-in prompt or a session-expired state.
