resolved_questions:
  resolved_at: "2026-08-07, by live probe"
  items:
    - question: "Does /x-open-banking/v2.2/branches/sortcode/{sortcode} accept the hyphenated form (40-01-06), the 6-digit form, or both?"
      answer: "SIX DIGITS ONLY."
      evidence: "/sortcode/400106 → TotalResults 1. /sortcode/40-01-06 → TotalResults 0. /sortcode/99-99-99 → TotalResults 0, byte-identical to the hyphenated valid code."
      consequence: >-
        Worse than a formatting nicety: the API returns SortCode hyphenated on all 327 branches,
        so its own output cannot be fed back into its own input. A wrongly-formatted code and a
        non-existent one are indistinguishable, both HTTP 200 with an empty body, so the failure
        is silent. Normalisation at the call site is now a hard requirement in ui.yaml,
        data-flow.yaml and flow.yaml, covered by TC-BRANCH-014.
    - question: "Does first direct appear in the branch feed?"
      answer: "No — and this is structural, not a sampling artefact."
      evidence: >-
        The full 327-branch estate contains exactly one BrandName occurrence, 'HSBC UK'. Two
        first direct sort codes (404784, 402406) returned zero results.
      consequence: >-
        first direct is a branchless telephone and internet bank with no branch estate, so its
        absence from a BRANCH feed is correct and permanent. The brand split that is genuinely
        real in the Product Finder feed does not apply here. The Brand[] loop should still be
        traversed rather than flattened away, because the same envelope is shared with feeds
        where the split does occur.

open_questions:
  - question: "Does HSBC ever publish a split OpeningHours day (e.g. a lunchtime closure)?"
    status: "unobserved — all 1802 Day entries across the estate carry exactly one range"
    why_it_matters: >-
      OpeningHours IS a list in the contract, so a client reading [0] is conformant-looking and
      works today. TC-BRANCH-012 guards it synthetically. Low risk, cheap insurance, no action
      needed beyond keeping the guard.
  - question: "Is NonStandardAvailability ever an array, or always a single object?"
    status: "only one instance exists nationally (branch 401118) and it is an object"
    why_it_matters: >-
      A branch with two closure windows would need array handling. Cannot be settled from live
      data because there is only one example in the country.
  - question: "At what request rate does the 429 actually fire?"
    status: "not probed — deliberately"
    why_it_matters: >-
      The rate-limit risk is inferred from the API being unauthenticated and origin-limited, not
      measured. Provoking it against a public production endpoint would be abusive, so the
      caching and no-refetch-on-pan guidance is precautionary by design.
