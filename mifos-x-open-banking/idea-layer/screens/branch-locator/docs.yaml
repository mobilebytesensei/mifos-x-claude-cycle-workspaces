quality_score_justification:
  score: 88
  scale_reference: "Payment features scored 86-94 after a comparable pass; atm-locator, the closest sibling in maturity, scored 84."
  what_earns_it:
    - "Evidence is population-scale, not sampled — every N/327 figure is a full census of the UK estate, so the claims are not extrapolations."
    - "Both previously-open questions are closed by live probe, with the exact requests recorded so any reader can re-verify."
    - "Five incorrect claims inherited from the sample were found and corrected rather than left to be discovered during implementation."
    - "The fixture set now covers the one production case (1-in-327) that no local test would ever surface."
    - "Every screen decision — filter membership, radius default, contact placement, the closure banner — is tied to a measured frequency rather than an assumption."
  what_holds_it_back:
    - "NEVER IMPLEMENTED. There is no source, no ViewModel, no Compose screen — nothing here has survived contact with a compiler or a device."
    - "No mockup and no export. The feature has not been through /idea-feature-render or /idea-feature-stitch, so the layout is specified in prose and has never been seen."
    - "Three genuine unknowns remain (see tests.yaml#still_untested): split-day rendering is guarded but unobserved, the 429 threshold is inferred rather than measured, and NonStandardAvailability has only ever been seen as an object on a single record."
    - "The evidence directory the original spec cited does not exist, so provenance rests on live reproducibility rather than a checked-in capture."
  why_not_higher: >-
    A spec this well-evidenced would justify the low 90s once it had been rendered and
    implemented. Neither has happened, and a screen whose layout has never been seen cannot be
    scored as though its design were settled. 88 reflects strong, unusually well-verified
    analysis attached to zero delivery.
  why_not_lower: >-
    It is materially better evidenced than atm-locator at 84 — that feature's claims rest on a
    single sample where these rest on a census, and this pass actively disproved five of its own
    inherited assumptions. Scoring it at or below its sibling would misreport the difference.

