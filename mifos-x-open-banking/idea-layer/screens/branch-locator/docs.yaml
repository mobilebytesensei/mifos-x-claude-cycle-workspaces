feature_id: branch-locator
name: Branch Locator
feature: branch-locator
flavor: consumer
status: enriched
quality_score: 88
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_api

summary: >-
  Find an HSBC UK branch by location, postcode, town or sort code. Unauthenticated Open Data —
  the screen works before the PSU has connected an account, with no consent and no session.

the_three_things_that_will_break_this_screen:
  note: "Ordered by likelihood of shipping. Each is measured, not theorised, and each fails SILENTLY — there is no exception to catch for any of them."
  one_missing_sunday: >-
    A closed day is ABSENT from Availability.StandardAvailability.Day[], not marked closed. Zero
    of 327 UK branches publish a Sunday. A renderer that iterates what it receives drops Sunday
    from every branch in the country and leaves the user unable to distinguish 'closed' from 'no
    data'. Build the week from a fixed Mon-Sun list.
  two_the_shuttered_branch: >-
    Branch 401118 is closed until 2027-03-21 and still publishes a normal Mon-Sat schedule. The
    closure lives in NonStandardAvailability, which only 1 of 327 branches carries and which no
    London-based test will ever encounter. Read it FIRST and suppress the weekly pattern.
  three_the_sort_code_round_trip: >-
    The API returns sort codes hyphenated and accepts them only as six digits. Feeding its own
    output back into its own input returns an empty result with HTTP 200 and no error, which is
    indistinguishable from 'branch not found'. Strip non-digits at every call site.

created_2026_08_07:
  by: "/idea-sync — develop.hsbc.com Open Data research"
  decision_by: "repository owner, 2026-08-07"
  rationale: >-
    Branches were a deferred second operation inside atm-locator against an unresolved host.
    The Branch Locator is a separate HSBC API product with a materially richer payload —
    opening hours, 11 services, 8 customer segments, a sort code, a phone number and real
    accessibility data, all populated 25/25 where the ATM feed populates none of its optional
    fields. Two capabilities, two screens.

