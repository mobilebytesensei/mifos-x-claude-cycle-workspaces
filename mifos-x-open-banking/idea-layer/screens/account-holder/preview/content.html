<!doctype html>

<!-- NAV CORRECTED 2026-08-07: the bottom-nav Pay tab targeted `send-money`, deleted
     2026-08-06 by the seven-type payments rewrite. Retargeted to the `payments` hub per
     design-system/app-shell.yaml. Hand-correction; a full `/idea-feature-render` is owed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Account Holder — content</title>
<style>
  :root {
    --primary: #266489;
    --on-primary: #FFFFFF;
    --primary-container: #C9E6FF;
    --on-primary-container: #004B6F;
    --secondary: #50606E;
    --secondary-container: #D3E5F5;
    --tertiary: #64597B;
    --background: #F7F9FF;
    --surface: #F7F9FF;
    --surface-container-low: #F1F4F9;
    --surface-container: #EBEEF3;
    --surface-container-high: #E5E8ED;
    --on-surface: #181C20;
    --on-surface-variant: #41474D;
    --outline: #72787E;
    --outline-variant: #C1C7CE;
    --error: #BA1A1A;

    --font-brand: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --fs-headline-medium: 1.75rem;
    --fs-title-large: 1.375rem;
    --fs-title-small: 0.875rem;
    --fs-body-large: 1rem;
    --fs-body-medium: 0.875rem;
    --fs-label-medium: 0.75rem;
    --fs-label-small: 0.6875rem;

    --sp-xs: 4px;
    --sp-sm: 8px;
    --sp-md: 12px;
    --sp-lg: 16px;
    --sp-xl: 24px;
    --sp-2xl: 32px;

    --r-small: 8px;
    --r-medium: 12px;
    --r-large: 16px;
    --r-full: 9999px;

    --el-0: none;
    --el-1: 0 1px 2px rgba(24, 28, 32, .08), 0 1px 3px rgba(24, 28, 32, .06);
    --el-2: 0 1px 2px rgba(24, 28, 32, .10), 0 2px 6px rgba(24, 28, 32, .08);
    --el-3: 0 2px 4px rgba(24, 28, 32, .10), 0 4px 12px rgba(24, 28, 32, .10);

    --appbar-h: 64px;
    --navbar-h: 80px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #95CDF7;
      --on-primary: #00344E;
      --primary-container: #004B6F;
      --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9;
      --secondary-container: #384956;
      --tertiary: #CFC0E8;
      --background: #101417;
      --surface: #101417;
      --surface-container-low: #181C20;
      --surface-container: #1C2024;
      --surface-container-high: #262A2E;
      --on-surface: #E0E3E8;
      --on-surface-variant: #C1C7CE;
      --outline: #8B9198;
      --outline-variant: #41474D;
      --error: #FFB4AB;

      --el-1: 0 1px 2px rgba(0, 0, 0, .40), 0 1px 3px rgba(0, 0, 0, .30);
      --el-2: 0 1px 2px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
      --el-3: 0 2px 4px rgba(0, 0, 0, .50), 0 4px 12px rgba(0, 0, 0, .40);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--background);
    color: var(--on-surface);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .screen { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  .top-app-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: var(--sp-xs);
    height: var(--appbar-h); padding: 0 var(--sp-xs);
    background: var(--surface); color: var(--on-surface);
  }
  .top-app-bar__title {
    font-family: var(--font-brand); font-size: var(--fs-title-large);
    font-weight: 500; line-height: 1.3; margin: 0; padding-left: var(--sp-xs);
  }

  .icon-button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; min-width: 48px; min-height: 48px;
    border: 0; padding: 0; border-radius: var(--r-full);
    background: transparent; color: var(--on-surface); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-button:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .icon-button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .icon-button svg { width: 24px; height: 24px; display: block; }

  .content {
    flex: 1 1 auto;
    display: flex; flex-direction: column; gap: var(--sp-lg);
    padding: var(--sp-lg);
    padding-bottom: calc(var(--navbar-h) + var(--sp-xl));
    max-width: 720px; width: 100%; margin: 0 auto;
    overflow-y: auto;
  }

  .identity-card {
    display: flex; align-items: center; gap: var(--sp-lg);
    padding: var(--sp-xl) var(--sp-lg);
    background: var(--surface-container-low);
    border-radius: var(--r-large);
    box-shadow: var(--el-2);
  }

  .avatar {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 64px; min-width: 64px;
    aspect-ratio: 1 / 1;
    border-radius: var(--r-full);
    background: var(--primary-container);
    color: var(--on-primary-container);
    font-family: var(--font-brand);
    font-size: var(--fs-title-large);
    font-weight: 500;
    letter-spacing: .02em;
  }

  .identity-card__text { display: flex; flex-direction: column; gap: var(--sp-xs); min-width: 0; }

  .display-name {
    font-family: var(--font-brand);
    font-size: var(--fs-headline-medium);
    font-weight: 400; line-height: 1.2; letter-spacing: 0;
    color: var(--on-surface); margin: 0;
    overflow-wrap: break-word;
  }

  .role-label {
    font-size: var(--fs-body-medium); line-height: 1.4;
    color: var(--on-surface-variant); margin: 0;
  }

  .section-header {
    font-size: var(--fs-title-small); font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: var(--sp-sm) 0 calc(-1 * var(--sp-sm)) var(--sp-xs);
  }

  .identity-section {
    display: flex; flex-direction: column;
    background: var(--surface-container-low);
    border-radius: var(--r-medium);
    box-shadow: var(--el-1);
    overflow: hidden;
  }

  .list-item {
    display: flex; align-items: center; gap: var(--sp-lg);
    min-height: 72px; padding: var(--sp-md) var(--sp-lg);
  }
  .list-item + .list-item { border-top: 1px solid var(--outline-variant); }

  .list-item__icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; min-width: 40px;
    border-radius: var(--r-full);
    background: var(--surface-container-high);
    color: var(--on-surface-variant);
  }
  .list-item__icon svg { width: 20px; height: 20px; display: block; }

  .list-item__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }

  .list-item__label {
    font-size: var(--fs-label-medium); line-height: 1.3;
    letter-spacing: .02em; color: var(--on-surface-variant); margin: 0;
  }

  .list-item__value {
    font-size: var(--fs-body-medium); line-height: 1.45;
    color: var(--on-surface); margin: 0; overflow-wrap: anywhere;
  }
  .list-item__value--mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: flex-start; justify-content: space-around;
    height: calc(var(--navbar-h) + env(safe-area-inset-bottom, 0px));
    padding: var(--sp-md) var(--sp-sm) calc(var(--sp-md) + env(safe-area-inset-bottom, 0px));
    background: var(--surface-container);
    box-shadow: var(--el-2);
  }

  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-xs);
    flex: 1 1 0; min-width: 0; min-height: 48px;
    border: 0; padding: 0; background: transparent;
    color: var(--on-surface-variant); cursor: pointer;
    font-family: var(--font-body); font-size: var(--fs-label-medium); font-weight: 500;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-small); }
  .nav-item__indicator {
    display: inline-flex; align-items: center; justify-content: center;
    width: 64px; height: 32px; border-radius: var(--r-full);
  }
  .nav-item svg { width: 24px; height: 24px; display: block; }
  .nav-item[aria-current="page"] { color: var(--primary); }
  .nav-item[aria-current="page"] .nav-item__indicator { background: var(--secondary-container); }

  @media (min-width: 600px) {
    .content { padding: var(--sp-xl); }
  }
</style>
</head>
<body>
<div class="screen" data-screen="account-holder" data-state="content">

  <header class="top-app-bar" data-component-type="top_app_bar" data-component-id="account_holder_top_app_bar">
    <button class="icon-button" type="button"
            data-component-type="icon_button" data-component-id="back_button"
            data-nav-to="account-detail" data-nav-type="back"
            aria-label="Navigate back to account details">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
      </svg>
    </button>
    <h1 class="top-app-bar__title">Account Holder</h1>
  </header>

  <main class="content">

    <section class="identity-card"
             data-component-type="card"
             data-component-id="identity_card"
             data-test-tag="accountHolder:identityCard">
      <span class="avatar"
            data-component-type="avatar"
            data-component-id="avatar"
            data-test-tag="accountHolder:avatar"
            aria-label="Account holder initials">PS</span>
      <div class="identity-card__text">
        <h2 class="display-name"
            data-component-type="text"
            data-component-id="display_name"
            data-test-tag="accountHolder:displayName"
            aria-label="Name: Priya Sharma">Priya Sharma</h2>
        <p class="role-label"
           data-component-type="text"
           data-component-id="role_label"
           data-test-tag="accountHolder:roleLabel"
           aria-label="Role: Sole account holder">Sole account holder</p>
      </div>
    </section>

    <h3 class="section-header"
        data-component-type="section_header"
        data-component-id="identity_section_header">Identity</h3>

    <section class="identity-section"
             data-component-type="stack"
             data-component-id="identity_section"
             data-test-tag="accountHolder:identitySection">

      <div class="list-item"
           data-component-type="list_item"
           data-component-id="email_row"
           data-test-tag="accountHolder:emailRow"
           aria-label="Email address: priya.sharma@example.co.uk">
        <span class="list-item__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
          </svg>
        </span>
        <div class="list-item__text">
          <p class="list-item__label">Email</p>
          <p class="list-item__value">priya.sharma@example.co.uk</p>
        </div>
      </div>

      <div class="list-item"
           data-component-type="list_item"
           data-component-id="mobile_row"
           data-test-tag="accountHolder:mobileRow"
           aria-label="Mobile number: +44 7700 900482">
        <span class="list-item__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>
          </svg>
        </span>
        <div class="list-item__text">
          <p class="list-item__label">Mobile</p>
          <p class="list-item__value list-item__value--mono">+44 7700 900482</p>
        </div>
      </div>

      <div class="list-item"
           data-component-type="list_item"
           data-component-id="address_row"
           data-test-tag="accountHolder:addressRow"
           aria-label="Postal address: Flat 12, 48 Camden High Street, London, NW1 0LT, GB">
        <span class="list-item__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
        </span>
        <div class="list-item__text">
          <p class="list-item__label">Address</p>
          <p class="list-item__value">Flat 12, 48 Camden High Street, London, NW1 0LT, GB</p>
        </div>
      </div>

    </section>

  </main>

  <nav class="bottom-nav" data-component-type="bottom_nav" data-component-id="app_shell_bottom_nav" aria-label="Main navigation">
    <button class="nav-item" type="button" data-nav-to="home" data-nav-type="tab">
      <span class="nav-item__indicator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </span>Home
    </button>
    <button class="nav-item" type="button" aria-current="page" data-nav-to="accounts" data-nav-type="tab">
      <span class="nav-item__indicator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/></svg>
      </span>Accounts
    </button>
    <button class="nav-item" type="button" data-nav-to="payments" data-nav-type="tab">
      <span class="nav-item__indicator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </span>Pay
    </button>
    <button class="nav-item" type="button" data-nav-to="settings" data-nav-type="tab">
      <span class="nav-item__indicator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </span>More
    </button>
  </nav>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
