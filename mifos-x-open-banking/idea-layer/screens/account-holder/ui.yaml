sibling: ui
schema_version: "4.0"
feature_id: account-holder

screen_id: account-holder
archetype: detail_screen
name: "Account Holder"
# status: REMOVED 2026-08-04 (CROSS_LEAK repair — sibling-layout.json assigns `status` to
# the docs sibling). This copy held `implemented`; docs.yaml is the single owner.
quality_score: 96
initial_state: loading

# ─────────────────────────────────────────────────────────────────────
# SOURCE BINDING — reverse-synced from source 2026-07-28
# Renamed from `party` to match the shipped module `feature/account-holder`.
# ─────────────────────────────────────────────────────────────────────
implementation:
  status: implemented
  source_module: "feature/account-holder"
  package: "org.mifosx.openbanking.feature.accountholder"
  route: "AccountHolderRoute(accountId: String)"
  viewmodel: AccountHolderViewModel
  screen: AccountHolderScreen
  test_tags_object: AccountHolderTestTags
  synced_from_source_at: "2026-07-28"

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{strings.account_holder.screen_title}"
  top_app_bar_leading: back
  top_app_bar_leading_accessibility_label: "{strings.account_holder.nav_back}"
  fab_visible: false

business_logic:
  kind: crud
  description: "Renders the connected party's identity for one account. AccountHolderViewModel opens a per-screen ScreenDataStream via ProfileRepository.profileStream(accountId, viewModelScope); the stream is owned by the view model and dies with its scope. The store maps the AIS party response into the flat PartyProfile domain model (partyId, displayName, roleLabel, initials, email, mobile, addressLine). emptyIfContent collapses a blank displayName to Empty. ScreenState maps 1:1 onto AccountHolderUiState; RemoteException network errors are classified into AccountHolderErrorKind, so a 403 PermissionNotGranted surfaces as Error(ConsentMissingParty) with retry suppressed rather than as its own state. There is deliberately no refresh() on the repository — RetryLoad calls refresh() on the stream the view model already holds."
  external_library_refs:
    - "hsbc-obie-ais-v4.0:party"
    - "ktorfit"
  description_author: claude
  description_authored_at: "2026-07-28T00:00:00Z"

# ─────────────────────────────────────────────────────────────────────
# STATE MODEL — AccountHolderViewModel contract
# Mirrors ui/AccountHolderState.kt + ui/AccountHolderViewModel.kt verbatim.
# ─────────────────────────────────────────────────────────────────────
state_model:
  AccountHolderViewModel:
    state:
      name: AccountHolderState
      fields:
        - name: accountId
          type: String
        - name: uiState
          type: AccountHolderUiState
    screen_state:
      sealed_class: AccountHolderUiState
      members:
        - Loading
        - Content       # profile: PartyProfile
        - Empty         # PartyProfile.isEmpty — displayName blank
        - Error         # kind: AccountHolderErrorKind
    errors:
      types:
        - AccountHolderErrorKind.TokenExpired        # NetworkError.Client.Unauthorized — retriable
        - AccountHolderErrorKind.ConsentMissingParty # NetworkError.Client.Forbidden — NOT retriable
        - AccountHolderErrorKind.ProfileNotFound     # NetworkError.Client.NotFound — NOT retriable
        - AccountHolderErrorKind.LoadFailed          # fallback incl. NoNetwork — retriable
    actions:
      members:
        - RetryLoad     # stream.refresh()
    di:
      - SavedStateHandle   # supplies ACCOUNT_ID_ARG = "accountId"
      - ProfileRepository  # Koin single; profileStream(accountId, scope) -> ScreenDataStream<PartyProfile>

status_history:
  - from: draft
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich"
  - from: enriched
    to: implemented
    at: "2026-07-28"
    by: "/gap-analysis-project (reverse sync from source)"
    note: "Renamed party -> account-holder; consent_required state folded into Error(ConsentMissingParty); actions reduced to RetryLoad; DI corrected to ProfileRepository."

states: [loading, content, empty, error]

# ─────────────────────────────────────────────────────────────────────
# TEST TAGS — reconciled against source 2026-08-02 by /idea-sync (source-truth pass)
# ─────────────────────────────────────────────────────────────────────
# The 13 component-level `test_tag:` values below were already correct and are unchanged.
# This block records the FULL source inventory so the 5-tag shortfall is explained rather
# than silently carried: all five are structural nodes the idea-layer models as fields, not
# as components, so none of them has an anchor to bind to.
test_tags:
  source: "feature/account-holder/src/commonMain/kotlin/org/mifosx/openbanking/feature/accountholder/AccountHolderTestTags.kt"
  declared_in_source: 18
  bound_to_components: 13
  unbound:
    - tag: "accountHolder:content"
      source_ref: "AccountHolderContent.kt:82"
      why: >-
        Tags the content Column wrapping identity_card + identity_section. The idea-layer
        models those as sibling components bound to [content] with no wrapper.
    - tag: "accountHolder:emptyTitle"
      source_ref: "AccountHolderEmpty.kt:73"
      why: "Text node modelled as the empty_state component's `title:` field, not a child component."
    - tag: "accountHolder:emptyBody"
      source_ref: "AccountHolderEmpty.kt:82"
      why: "Text node modelled as the empty_state component's `body:` field, not a child component."
    - tag: "accountHolder:errorTitle"
      source_ref: "AccountHolderError.kt:84"
      why: "Text node modelled as the error_state component's `title:` field, not a child component."
    - tag: "accountHolder:errorBody"
      source_ref: "AccountHolderError.kt:93"
      why: "Text node modelled as the error_state component's `body:` field, not a child component."

state_layouts:
  loading:
    type: column
    alignment: center
    padding: 24dp
    children: [loading_indicator, loading_caption]
  content:
    type: column
    scroll: true
    spacing: 16dp
    children: [identity_card, identity_section_header, identity_section]
  empty:
    type: column
    alignment: center
    padding: 24dp
    children: [empty_state_view]
  error:
    type: column
    alignment: center
    padding: 24dp
    children: [error_state]

components:

  # ─── LOADING STATE ───────────────────────────────────────────────
  - type: progress_circular
    id: loading_indicator
    state_binding: [loading]
    test_tag: "accountHolder:loading"
    accessibility_label: "{strings.account_holder.loading_description}"
    test_context:
      purpose: "Shown while the ProfileRepository stream is in ScreenState.Loading"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: text
    id: loading_caption
    state_binding: [loading]
    content: "{strings.account_holder.loading_caption}"
    style: bodyMedium
    color: "onSurfaceVariant"
    test_tag: "accountHolder:loadingCaption"
    test_context:
      purpose: "Caption beneath the spinner"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ─── CONTENT STATE — identity card ────────────────────────────────
  - type: card
    id: identity_card
    state_binding: [content]
    elevation: 2
    test_tag: "accountHolder:identityCard"
    test_context:
      purpose: "Identity header: avatar initials, display name, role label"
      required_fields: [profile.initials, profile.displayName, profile.roleLabel]
      interaction_type: display
      data_driven: true
    children:
      - type: avatar
        id: avatar
        # `value` -> `initials` 2026-08-04 (/idea-sync, finding R-1c). media.yaml declares
        # avatar props [src, alt, initials, icon]; there is no value slot, and the binding
        # already resolved profile.initials, so the key was simply misnamed.
        initials: "{profile.initials}"
        test_tag: "accountHolder:avatar"
        accessibility_label: "{strings.account_holder.avatar_accessibility}"
        test_context:
          purpose: "PartyProfile.initials rendered as a monogram avatar"
          required_fields: [profile.initials]
          interaction_type: display
          data_driven: true
      - type: text
        id: display_name
        role: title
        content: "{profile.displayName}"
        style: headlineMedium
        test_tag: "accountHolder:displayName"
        accessibility_label: "{strings.account_holder.name_prefix}: {profile.displayName}"
        test_context:
          purpose: "PartyProfile.displayName — blank value routes the screen to Empty"
          required_fields: [profile.displayName]
          interaction_type: display
          data_driven: true
      - type: text
        id: role_label
        role: subtitle
        content: "{profile.roleLabel}"
        style: bodyMedium
        color: "onSurfaceVariant"
        test_tag: "accountHolder:roleLabel"
        accessibility_label: "{strings.account_holder.role_prefix}: {profile.roleLabel}"
        test_context:
          purpose: "PartyProfile.roleLabel — party relationship to the account"
          required_fields: [profile.roleLabel]
          interaction_type: display
          data_driven: true

  # ─── CONTENT STATE — identity detail rows ─────────────────────────
  - type: section_header
    id: identity_section_header
    state_binding: [content]
    label: "{strings.account_holder.section_identity}"
    test_context:
      purpose: "Section divider above the contact rows"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: stack
    id: identity_section
    state_binding: [content]
    direction: vertical
    test_tag: "accountHolder:identitySection"
    test_context:
      purpose: "Contact rows rendered from the flat PartyProfile fields"
      required_fields: [profile.email, profile.mobile, profile.addressLine]
      interaction_type: display
      data_driven: true
    children:
      - type: list_item
        id: email_row
        leading_icon: email
        headline: "{strings.account_holder.label_email}"
        trailing_content: "{profile.email}"
        trailing_style: bodyMedium
        test_tag: "accountHolder:emailRow"
        visibility: "visible when profile.email is non-empty"
        accessibility_label: "{strings.account_holder.email_a11y}: {profile.email}"
        test_context:
          purpose: "PartyProfile.email; row omitted when blank"
          required_fields: [profile.email]
          interaction_type: display
          data_driven: true
      - type: list_item
        id: mobile_row
        leading_icon: phone_android
        headline: "{strings.account_holder.label_mobile}"
        trailing_content: "{profile.mobile}"
        trailing_style: bodyMedium
        test_tag: "accountHolder:mobileRow"
        visibility: "visible when profile.mobile is non-empty"
        accessibility_label: "{strings.account_holder.mobile_a11y}: {profile.mobile}"
        test_context:
          purpose: "PartyProfile.mobile; row omitted when blank"
          required_fields: [profile.mobile]
          interaction_type: display
          data_driven: true
      - type: list_item
        id: address_row
        leading_icon: home
        headline: "{strings.account_holder.label_address}"
        trailing_content: "{profile.addressLine}"
        trailing_style: bodyMedium
        test_tag: "accountHolder:addressRow"
        visibility: "visible when profile.addressLine is non-empty"
        accessibility_label: "{strings.account_holder.address_a11y}: {profile.addressLine}"
        test_context:
          purpose: "PartyProfile.addressLine — a single pre-flattened string, not an OBPostalAddress8 array"
          required_fields: [profile.addressLine]
          interaction_type: display
          data_driven: true

  # ─── EMPTY STATE ──────────────────────────────────────────────────
  - type: empty_state
    id: empty_state_view
    variant: info
    state_binding: [empty]
    icon: person_off
    title: "{strings.account_holder.empty_title}"
    body: "{strings.account_holder.empty_body}"
    test_tag: "accountHolder:emptyState"
    accessibility_label: "{strings.account_holder.empty_a11y}"
    test_context:
      purpose: "Reached via emptyIfContent when PartyProfile.displayName is blank"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ─── ERROR STATE ──────────────────────────────────────────────────
  - type: error_state
    id: error_state
    state_binding: [error]
    icon: error_outline
    title: "{strings.account_holder.error_title}"
    body: "{strings.account_holder.error_body}"
    test_tag: "accountHolder:errorState"
    accessibility_label: "{strings.account_holder.error_a11y}"
    test_context:
      purpose: "One error surface for all four AccountHolderErrorKind values; body text varies by kind. 403 lands here as ConsentMissingParty — there is no separate consent_required state in source."
      required_fields: [uiState.kind]
      interaction_type: display
      data_driven: true
    children:
      - type: button
        keyboard:
          focusable: true
        id: retry_button
        variant: filled
        label: "{strings.account_holder.action_retry}"
        test_tag: "accountHolder:retryButton"
        visibility: "visible when uiState.kind.isRetriable — hidden for ConsentMissingParty and ProfileNotFound"
        accessibility_label: "{strings.account_holder.retry_a11y}"
        test_context:
          purpose: "Dispatches AccountHolderAction.RetryLoad -> stream.refresh()"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: RetryLoad
          action_contract:
            effect: call_api
            reads_from: ["party"]
            external_library_refs: ["ktorfit", "hsbc-obie-ais-v4.0:party"]
            description: "Dispatches AccountHolderAction.RetryLoad, which calls refresh() on the ScreenDataStream the view model already holds, re-running the party fetch and returning the screen to Loading then Content or Empty."

# Moved verbatim from docs.yaml 2026-07-31 (CROSS_LEAK repair — sibling-layout.json
# assigns `screens` to the ui sibling).
screens:
  - id: account-holder
    name: "Account Holder"
    viewmodel: AccountHolderViewModel
    entry_points:
      - from: account-detail
        via: nav_chip_party
