sibling: demo-data
schema_version: "2.1.0"
feature_id: account-holder

screen_id: account-holder
models: domain
maps_to_dto: [PartyProfile]
_models_note: "The one exception in this cohort — already domain-shaped, per the _shape_note below, and left that way. DD5 compares directly against PartyProfile here, with no mapper in between."
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC-sandbox-style data only."
_shape_note: "Reverse-synced 2026-07-28. Fixture now mirrors the flat PartyProfile domain model the view model actually renders, not the OBParty2 wire shape. The mapper flattens Address into a single addressLine string."

# ── DEFAULT STATE (content) ───────────────────────────────────────
# Primary fixture: Priya Sharma, sole account holder.
accountId: "40051512345678"

profile:
  partyId: "PARTY-PS-001"
  displayName: "Priya Sharma"
  roleLabel: "Sole account holder"
  initials: "PS"
  email: "priya.sharma@example.co.uk"
  mobile: "+44 7700 900482"
  addressLine: "Flat 12, 48 Camden High Street, London, NW1 0LT, GB"

# ── STATE-SPECIFIC OVERRIDES ──────────────────────────────────────
states:
  loading:
    _description: "ScreenState.Loading — the party stream has not yet emitted."

  empty:
    _description: "PartyProfile.displayName is blank, so emptyIfContent collapses Content to Empty. Applies to business accounts where PSU identity is not exposed."
    accountId: "40051999000001"
    profile:
      partyId: "PARTY-EMPTY-001"
      displayName: ""
      roleLabel: ""
      initials: ""
      email: ""
      mobile: ""
      addressLine: ""

  error:
    _description: "Network timeout — device lost connectivity mid-request. Retry CTA visible."
    uiState:
      kind: "LoadFailed"
      isRetriable: true

  # The former `consent_required` state fixture folds into the error surface:
  # HTTP 403 -> AccountHolderErrorKind.ConsentMissingParty, retry suppressed.
  error_consent_missing:
    _description: "HSBC returned 403 PermissionNotGranted — the active consent does not include ReadParty. Rendered on the shared error surface with the Retry CTA hidden (isRetriable = false)."
    uiState:
      kind: "ConsentMissingParty"
      isRetriable: false
