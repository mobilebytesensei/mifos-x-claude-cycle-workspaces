contracts:
  # Source calls the singular /party endpoint only. Aisp.getParties() exists on the
  # client but no repository or store consumes it — the parallel /party + /parties
  # merge previously declared here was never implemented.
  - endpoint_id: party
    permission: ReadParty
    response_dto: PartyResponse
    source_binding: "Aisp.getParty(accountId) -> PartyResponse -> toPartyProfile()"
    mapper: "core/data/banking/mapper/PartyMapper.kt"
    store: "BankingStores.partyStore(aisp): Store<String, PartyProfile>"
    notes: "Mapper derives displayName, roleLabel, initials, mobile and a single flattened addressLine from Party + PartyAddress. No capability-registry gate — there is no AccountEndpoint.Party, so a U000 refusal is not modelled."

libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets: [android, ios, desktop, web]

# dependencies: MOVED to flow.yaml · screens: MOVED to ui.yaml — 2026-07-31
