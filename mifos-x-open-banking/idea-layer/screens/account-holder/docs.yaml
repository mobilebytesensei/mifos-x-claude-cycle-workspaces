capability_completeness:
  storage_location: "No local storage — party data is read-only and not cached on device. Both endpoints fetched fresh on every screen mount."
  destructive_action_safety: "No destructive actions — screen is read-only AISP data view."
  nav_callback_wiring: "Single onBack callback wired to popBackStack() by accountHolderScreen(onBack = ...) in AuthenticatedNavbarNavigationScreen; returns to account-detail. No outbound navigation from this screen."
  user_data_export: "Party data (name, address, contact) is displayed on-screen only; no download or copy mechanism needed for AISP read-only access."
  permission_visibility: "ReadParty missing from consent → NetworkError.Client.Forbidden → AccountHolderErrorKind.ConsentMissingParty, rendered on the shared error surface with isRetriable=false so the Retry CTA is suppressed. There is no dedicated consent_required state and no in-screen re-authorise navigation in source."
  storage_budget_awareness: "No local caching; zero device storage impact from this screen."
  network_data_policy: "One ScreenDataStream opened per screen mount, scoped to viewModelScope and torn down with it. No prefetch, no background refresh, no pagination."
  cache_lifecycle: "Stream-backed via the party store; the repository exposes no refresh() — RetryLoad calls refresh() on the stream instance the view model already holds."
  error_recovery: "classifyAccountHolderError maps RemoteException.networkError: Unauthorized → TokenExpired (retriable), Forbidden → ConsentMissingParty (not retriable), NotFound → ProfileNotFound (not retriable), else → LoadFailed (retriable). ScreenState.NoNetwork → LoadFailed; ScreenState.Unauthenticated → TokenExpired. Blank displayName → Empty via emptyIfContent."

vm_actions:
  # Source declares exactly one action. Stream collection in init{} is not an action.
  - name: RetryLoad
    signature: "AccountHolderAction.RetryLoad -> handleAction() -> stream.refresh()"
    state_mutations:
      - "stream re-emits ScreenState.Loading, then Content | Empty | Error"
      - "uiState = screenState.toUiState()"
    side_effects:
      - "refresh() on the ScreenDataStream<PartyProfile> held by the view model"
    error_handling:
      unauthorized: "AccountHolderUiState.Error(TokenExpired)"
      forbidden: "AccountHolderUiState.Error(ConsentMissingParty) — retry suppressed"
      not_found: "AccountHolderUiState.Error(ProfileNotFound) — retry suppressed"
      other: "AccountHolderUiState.Error(LoadFailed)"

stream_wiring:
  description: "init{} collects repository.profileStream(accountId, viewModelScope), passes it through emptyIfContent { it.isEmpty }, and maps each ScreenState onto AccountHolderUiState. Not modelled as an action."
  source_ref: "ui/AccountHolderViewModel.kt"

error_cases:
  - code: TOKEN_EXPIRED
    maps_from: "NetworkError.Client.Unauthorized | ScreenState.Unauthenticated"
    retriable: true
    description: "PSU access token expired; Retry CTA shown."
  - code: CONSENT_MISSING_PARTY
    maps_from: "NetworkError.Client.Forbidden"
    retriable: false
    description: "Consent scope does not include ReadParty. Rendered on the shared error surface with the Retry CTA suppressed — source has no in-screen re-consent navigation."
  - code: PROFILE_NOT_FOUND
    maps_from: "NetworkError.Client.NotFound"
    retriable: false
    description: "No party record associated with this AccountId."
  - code: LOAD_FAILED
    maps_from: "any other RemoteException | ScreenState.NoNetwork"
    retriable: true
    description: "Device offline or AIS endpoint unreachable."

