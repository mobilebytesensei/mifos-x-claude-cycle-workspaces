sibling: api
schema_version: "4.0"
feature_id: account-holder

screen_id: account-holder

# Reverse-synced from source 2026-07-28.
# The previously-declared `parties` endpoint was removed: Aisp.getParties() exists on
# the network client but no store, repository or view model consumes it. This screen
# reads the singular /party endpoint only.

endpoints:
  - id: party
    method: GET
    path: "/accounts/{AccountId}/party"
    # RE-RETARGETED 2026-08-04 (/idea-data-dtos), reversing the 2026-07-30 change.
    # That change moved this ref from a source class name to `OBReadParty2` on the grounds
    # that the OBIE wire name "is what dtos/ registers". It was not: dtos/ held 55 entries in
    # OBP-sandbox vocabulary and no OBIE name at all, so the retarget moved a resolvable ref
    # to an unresolvable one and D2 has failed here ever since. The registry is now bound to
    # source, so this names the domain model ProfileRepository actually streams.
    response_dto: PartyProfile
    permission: ReadParty
    requires_auth: true
    path_params:
      AccountId: string
    source_binding:
      client: "Aisp.getParty(accountId): NetworkResult<PartyResponse, NetworkError>"
      store: "BankingStores.partyStore(aisp): Store<String, PartyProfile>"
      mapper: "PartyResponse.toPartyProfile() — core/data/banking/mapper/PartyMapper.kt"
      repository: "ProfileRepository.profileStream(accountId, scope): ScreenDataStream<PartyProfile>"
    notes: "Returns the single account holder linked to the account. Requires ReadParty in the active consent. The mapper flattens the wire shape into the PartyProfile domain model before it reaches the view model."
    response:
      status: 200
      schema: PartyResponse
      data_path: "Data.Party"
      wire_fields:
        - "PartyId: string"
        - "Name: string (optional)"
        - "FullLegalName: string (optional)"
        - "PartyType: string (optional)"
        - "EmailAddress: string (optional)"
        - "Phone: string (optional)"
        - "Mobile: string (optional)"
        - "Address: PartyAddress (optional)"
      domain_model:
        name: PartyProfile
        fields:
          - "partyId: String"
          - "displayName: String — Party.resolveName(); blank routes the screen to Empty"
          - "roleLabel: String — Party.resolveRoleLabel()"
          - "initials: String — derived from displayName via toInitials()"
          - "email: String"
          - "mobile: String — Party.resolveMobile()"
          - "addressLine: String — PartyAddress.toAddressLine(), a single flattened string (source does NOT model an OBPostalAddress8 array)"
    errors:
      http_401: "NetworkError.Client.Unauthorized -> AccountHolderErrorKind.TokenExpired (retriable)"
      http_403: "NetworkError.Client.Forbidden -> AccountHolderErrorKind.ConsentMissingParty (NOT retriable; retry CTA suppressed)"
      http_404: "NetworkError.Client.NotFound -> AccountHolderErrorKind.ProfileNotFound (NOT retriable)"
      http_200_empty: "PartyProfile.isEmpty (blank displayName) -> AccountHolderUiState.Empty via emptyIfContent"
      http_500: "-> AccountHolderErrorKind.LoadFailed (retriable)"
      network: "ScreenState.NoNetwork -> AccountHolderErrorKind.LoadFailed (retriable)"

unconsumed_client_surface:
  # Present on the network client but wired to nothing — recorded so the drift stays visible.
  - id: parties
    method: GET
    path: "/accounts/{AccountId}/parties"
    client: "Aisp.getParties(accountId): NetworkResult<PartiesResponse, NetworkError>"
    consumed_by: []
    note: "No store, repository or feature consumes this. Serialization test exists at core/network/desktopTest/model/ais/parties/PartiesSerializationTest.kt."
