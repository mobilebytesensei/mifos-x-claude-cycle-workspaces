sibling: api
schema_version: "4.0"
feature_id: account-holder
_source: source_analysis

base_url: "https://{HSBC_BANK_HOST}/obie/open-banking/"
auth:
  type: psu_bearer
  description: "PSU access token from secure Settings (hsbc_tokens), auto-attached by the Ktor Auth plugin; refresh_token grant on 401; mTLS on every call. Requires ReadParty in the AIS consent."
  refresh: { method: POST, endpoint: /v1.1/oauth2/token, grant_type: refresh_token }

api:
  - id: get_party
    function: "Aisp.getParty(accountId)"
    method: get
    endpoint: "/v4.0/aisp/accounts/{AccountId}/party"
    description: "Account-holder party for the account, via BankingStores.partyStore (Store5) and ProfileRepository.profileStream."
    params:
      AccountId: { type: String, required: true, source: nav_params.accountId }
    response:
      dto: PartyResponse
      maps_to: PartyProfile
      fields:
        partyId: String
        displayName: String        # Party.Name / FullLegalName
        roleLabel: String          # PartyType / AccountRole
        initials: String           # derived
        email: String              # EmailAddress
        mobile: String             # Mobile / Phone
        addressLine: String        # flattened Address
    errors:
      401: TokenExpired
      403: ConsentMissingParty    # ReadParty permission not granted
      404: ProfileNotFound
      500: LoadFailed
    cache:
      strategy: store5
      offline: show_cached

related_endpoints_not_called:
  - endpoint: "/v4.0/aisp/accounts/{AccountId}/parties"
    note: "Aisp.getParties exists but has no consumer — joint holders never displayed."

error_mapping:
  classifier: classifyAccountHolderError
  rules:
    - { network_error: "NetworkError.Client.Unauthorized", kind: TokenExpired, retriable: true }
    - { network_error: "NetworkError.Client.Forbidden", kind: ConsentMissingParty, retriable: false }
    - { network_error: "NetworkError.Client.NotFound", kind: ProfileNotFound, retriable: false }
    - { network_error: "other / NoNetwork", kind: LoadFailed, retriable: true }

dtos:
  PartyProfile:
    partyId: String
    displayName: String
    roleLabel: String
    initials: String
    email: String
    mobile: String
    addressLine: String
