sibling: api
schema_version: "4.0"
feature_id: statement-detail
_source: source_analysis
base_url: "https://{HSBC_BANK_HOST} (HSBCUKSandboxConfig defaultRequest base; mTLS transport.p12 QWAC)"

auth:
  scheme: psu_bearer
  description: >-
    AIS reads — PSU access token (secure Settings hsbc_tokens) auto-attached by the Ktor Auth plugin with
    refresh-on-401; mTLS transport.

api:
  - id: get_statement_detail
    method: GET
    path: "/v4.0/aisp/accounts/{AccountId}/statements/{StatementId}"
    source_ref: "core/network/.../api/Aisp.kt#getStatementDetails"
    repository_ref: "core/data/.../banking/StatementDetailRepository.kt#statementStream"
    description: "Statement metadata: reference, period start/end, type, created date, balances, fees, interest. Store5 stream key '{accountId}|{statementId}', cacheKey 'statementDetail:meta:{accountId}:{statementId}'."
    params:
      AccountId: { type: String, required: true, in: path, source: nav_params.accountId }
      StatementId: { type: String, required: true, in: path, source: nav_params.statementId }
    response:
      type: StatementDetailsResponse
      domain: StatementDetail
      fields:
        reference: String
        periodStart: String
        periodEnd: String
        type: String
        created: String
        balances: "List<StatementBalanceLine{type, amount, currency, isCredit}>"
        fees: "List<StatementCharge{description, amount, currency}>"
        interest: "List<StatementCharge{description, amount, currency, isCredit}>"
    response_dto: StatementDetailsResponse
    error_dto: ObErrorResponse
    errors:
      401: SessionExpired
      403: ConsentMissingReadStatements
      404: StatementNotFound
      default: NetworkError
    cache: { strategy: store5, key: "statementDetail:meta:{accountId}:{statementId}", offline: show_cached }
    pagination: { type: none }
    required_permission: ReadStatementsDetail

  - id: get_statement_transactions
    method: GET
    path: "/v4.0/aisp/accounts/{AccountId}/statements/{StatementId}/transactions"
    source_ref: "core/network/.../api/Aisp.kt#getStatementTransactions"
    repository_ref: "core/data/.../banking/StatementDetailRepository.kt#statementTransactionsStream"
    description: "Transactions booked within the statement period, mapped to TransactionItem (signed amounts). Store5 cacheKey 'statementDetail:txns:{accountId}:{statementId}'. No Links.Next paging is followed here."
    params:
      AccountId: { type: String, required: true, in: path, source: nav_params.accountId }
      StatementId: { type: String, required: true, in: path, source: nav_params.statementId }
    response:
      type: StatementTransactionsResponse
      domain: "List<TransactionItem>"
      fields:
        transactionId: String
        accountId: String
        bookingDateTime: String
        description: String
        amount: String
        currency: String
        isCredit: Boolean
    response_dto: StatementTransactionsResponse
    error_dto: ObErrorResponse
    errors:
      401: SessionExpired
      403: ConsentMissingReadStatements
      default: NetworkError
    cache: { strategy: store5, key: "statementDetail:txns:{accountId}:{statementId}", offline: show_cached }
    pagination: { type: none }
    required_permission: ReadTransactionsDetail

  - id: get_statement_file
    method: GET
    path: "/v4.0/aisp/accounts/{AccountId}/statements/{StatementId}/file"
    source_ref: "core/network/.../api/Aisp.kt#getStatementFile"
    repository_ref: "core/data/.../banking/StatementFileRepository.kt#downloadStatementFile"
    description: "Raw statement file (Accept application/pdf, then text/csv) returned as ByteArray and delivered via the platform StatementFileHandler — FileKit save dialog on android/ios/desktop; the web StatementFileHandler is an intentional no-op."
    params:
      AccountId: { type: String, required: true, in: path, source: nav_params.accountId }
      StatementId: { type: String, required: true, in: path, source: nav_params.statementId }
    headers:
      Accept: "application/pdf, text/csv"
    response:
      type: ByteArray
      content_types: [application/pdf, text/csv]
    response_dto: null
    error_dto: ObErrorResponse
    errors:
      404: "DownloadFailed(StatementFileNotFound)"
      default: "DownloadFailed(NetworkError)"
    cache: none
    required_permission: ReadStatementsDetail
