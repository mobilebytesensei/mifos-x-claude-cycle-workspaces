sibling: api
schema_version: "4.0"
feature_id: statement-detail

screen_id: statement-detail

endpoints:
  - id: statement-detail
    method: GET
    path: "/accounts/{AccountId}/statements/{StatementId}"
    response_dto: StatementDetail
    permission: ReadStatementsDetail
    requires_auth: true
    path_params:
      AccountId: string
      StatementId: string
    notes: "Returns single statement record with StatementAmount, StatementFee, StatementInterest arrays."

  - id: statement-txns
    method: GET
    path: "/accounts/{AccountId}/statements/{StatementId}/transactions"
    response_dto: TransactionItem
    permission: ReadTransactions
    requires_auth: true
    path_params:
      AccountId: string
      StatementId: string
    notes: "Returns transactions booked within the statement period. Requires ReadTransactions permission in addition to ReadStatementsDetail."

  - id: statement-file
    method: GET
    path: "/accounts/{AccountId}/statements/{StatementId}/file"
    response_dto: null
    permission: ReadStatements
    requires_auth: true
    path_params:
      AccountId: string
      StatementId: string
    notes: "Produces application/pdf binary stream. Client triggers native share/save sheet. Not JSON — no DTO mapping."
