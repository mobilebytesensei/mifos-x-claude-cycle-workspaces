sibling: data-flow
schema_version: "2.1.0"
feature_id: statement-detail

screen_id: statement-detail

on_mount:
  - trigger: statement_detail_load
    description: "Load statement detail and statement transactions in parallel for the given accountId and statementId."
    steps:
      - call: statement-detail
        path_params:
          AccountId: "{accountId}"
          StatementId: "{statementId}"
        store_as: statement
      - call: statement-txns
        path_params:
          AccountId: "{accountId}"
          StatementId: "{statementId}"
        store_as: statementTransactions
    on_loading: loading
    on_success: content
    on_empty: empty
    empty_condition: "statementTransactions.isEmpty()"
    on_error: error
    error_codes:
      HTTP_401: "Session expired. Please re-authenticate."
      HTTP_403: "Consent does not include ReadStatements."
      HTTP_404: "Statement not found."
      NETWORK: "{error.localizedMessage}"

on_user_action:
  - trigger: download_statement_pdf
    description: "Fetch statement PDF binary and trigger native share/save sheet. Drives secondary DownloadState machine independently of the primary UI state."
    steps:
      - call: statement-file
        path_params:
          AccountId: "{accountId}"
          StatementId: "{statementId}"
        store_as: statementPdfBlob
    on_loading: "downloadState = Downloading"
    on_success: "downloadState = Downloaded(uri)"
    on_error: "downloadState = DownloadError(message)"
    error_codes:
      HTTP_404: "Download failed"
      NETWORK: "Download failed"

  - trigger: navigate_transaction_detail
    description: "Navigate to transaction-detail screen passing the selected OBTransaction6 identifiers."
    navigates_to: transaction-detail
    params:
      transactionId: "{item.TransactionId}"
      accountId: "{item.AccountId}"

  - trigger: retry_load
    re_runs: [statement_detail_load]
