sibling: flow
schema_version: "4.0"
feature_id: statement-detail

feature: statements
flow_ref: consumer-banking

entry_points:
  - source: statements
    label: "Tap statement row in statements list"

transitions:
  - from: statement-detail
    to: statements
    trigger: "Back navigation"
  - from: statement-detail
    to: transaction-detail
    trigger: "Tap transaction row in statement transactions list"
    params:
      transactionId: "{item.TransactionId}"
      accountId: "{item.AccountId}"
