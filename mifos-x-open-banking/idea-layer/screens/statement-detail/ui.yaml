sibling: ui
schema_version: "4.0"
feature_id: statement-detail

screen_id: statement-detail
archetype: detail_screen
name: "Statement Detail"
# status: REMOVED 2026-08-04 (CROSS_LEAK repair — sibling-layout.json assigns `status` to
# the docs sibling). This copy held `implemented`; docs.yaml is the single owner.
quality_score: 95
initial_state: loading

# ─────────────────────────────────────────────────────────────────────
# STATE MODEL — StatementDetailViewModel contract
# Migrated to C6 format from v3 flat states list; DownloadState carried as field comment.
# Derived from docs.yaml#vm_actions + error_cases + libraries.
# ─────────────────────────────────────────────────────────────────────
state_model:
  StatementDetailViewModel:
    state:
      name: StatementDetailState
      fields:
        - name: uiState
          type: StatementDetailUiState
        - name: downloadState
          type: DownloadState # sealed: Idle | Downloading | Downloaded(uri: URI) | DownloadError(message: String)
    screen_state:
      sealed_class: StatementDetailUiState
      members:
        - Loading
        - Content # statement: OBStatement2, statementTransactions: List<OBTransaction6>
        - Empty   # statement: OBStatement2; statementTransactions empty — valid OBIE edge case for new accounts
        - Error   # message: String, errorCode: StatementDetailErrorCode
    errors:
      types:
        - StatementNotFound              # HTTP 404 — StatementId not found for this account
        - ConsentMissingReadStatements   # HTTP 403 — ReadStatementsDetail not in consent scope
        - SessionExpired                 # HTTP 401 — access token expired; re-authentication required
        - StatementFileNotFound          # HTTP 404 on /file — PDF not yet generated by HSBC
        - NetworkError                   # device offline or AIS endpoint unreachable
    actions:
      members:
        - RetryLoad
        - DownloadPdf     # fetches the statement file and hands it to StatementFileHandler
    state_fields_extra:
      - name: downloadState
        type: DownloadState   # tracks the in-flight PDF download
    nav_callbacks:
      - "onBack -> popBackStack()"
      - "onNavigateToTransactionDetail(transactionId, accountId) -> TransactionDetailRoute(...)"
    di:
      - SavedStateHandle           # supplies the accountId and statementId route args
      - StatementDetailRepository  # Koin single; statement + statement-transactions stream
      - StatementFileRepository    # fetches the statement file bytes
      - StatementFileHandler       # platform handler that opens/saves the downloaded file

# ─────────────────────────────────────────────────────────────────────
# SOURCE BINDING — reverse-synced from source 2026-07-28
# ─────────────────────────────────────────────────────────────────────
implementation:
  status: implemented
  source_module: "feature/statement-detail"
  package: "org.mifosx.openbanking.feature.statementdetail"
  route: "StatementDetailRoute(accountId: String, statementId: String)"
  viewmodel: StatementDetailViewModel
  screen: StatementDetailScreen
  test_tags_object: StatementDetailTestTags
  domain_model: StatementDetail
  reachable_from:
    - "statements — onNavigateToStatementDetail(statementId, accountId)"
  synced_from_source_at: "2026-07-28"
  added_in_sync:
    - "downloadState state field — DownloadState tracks the in-flight PDF fetch"
    - "onNavigateToTransactionDetail callback — statement transactions drill through to transaction-detail; the idea-layer declared no such route out of this screen"
    - "StatementFileHandler DI — the platform file handler is injected, provided by cmp-navigation/statements/StatementFileHandlerProvider with jsCommon and nonJs actuals"
  renamed_in_sync:
    - "downloadStatementPdf -> DownloadPdf"
    - "StatementsRepository -> StatementDetailRepository"
    - "StatementFileDownloader -> StatementFileRepository"
  removed_in_sync:
    - "statementDetailLoad action — the initial load is stream collection in init{}"

shell:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  top_app_bar_title: "{statement.StatementReference}"
  top_app_bar_title_fallback: "{strings.stmt_detail.screen_title}"
  top_app_bar_leading: back
  fab_visible: false

business_logic:
  kind: composite
  description: "Parallel fetch via ktorfit: GET statements/{StatementId} (OBStatement2), GET statements/{StatementId}/transactions (OBReadTransaction6), and GET statements/{StatementId}/file (application/pdf). Statement amounts, fees, and interest render from OBStatement2. PDF streams via ktor-client-download and hands off to the platform share/save sheet. A separate downloadState (Idle|Downloading|Downloaded|DownloadError) drives inline progress indicator and snackbar feedback without blocking the main content state. Empty state fires when statementTransactions returns an empty array — valid OBIE edge case for new accounts."
  external_library_refs:
    - "hsbc-obie-ais-v4.0:statements"
    - "ktor-client-download"
    - "ktorfit"
  description_author: claude
  description_authored_at: "2026-06-29T14:00:00Z"

status_history:
  - from: draft
    to: enriched
    at: "2026-06-29"
    by: "/idea-enrich"

states: [loading, content, empty, error]

# TEST TAGS — reconciled against source 2026-08-02 by /idea-sync (source-truth pass).
test_tags:
  source: "feature/statement-detail/src/commonMain/kotlin/org/mifosx/openbanking/feature/statementdetail/StatementDetailTestTags.kt"
  declared_in_source: 18         # 17 const val + 1 builder fn (txnRow)
  bound: 12
  interpolated:
    - { tag: "statementDetail_txn_{item.TransactionId}", builder: "fun txnRow(id: String)",
        convention_note: "underscores, unlike the colon-delimited flat consts in the same file — source truth, preserved" }
  unbound:
    - { tag: "statementDetail:contentList", why: "Tags the content column wrapping the header card and four sections; modelled here as siblings bound to [content] with no wrapper." }
    - { tag: "statementDetail:emptyList",   why: "Tags the screen-level empty surface; this screen's [empty] state renders through empty_txns_state, which carries emptyTransactions instead." }
    - { tag: "statementDetail:emptyTransactionsTitle", parent: empty_txns_state, why: "Text node modelled as the parent's `title:` field." }
    - { tag: "statementDetail:emptyTransactionsBody",  parent: empty_txns_state, why: "Text node modelled as the parent's `body:` field." }
    - { tag: "statementDetail:errorTitle", parent: error_state, why: "Text node modelled as the parent's `title:` field." }
    - { tag: "statementDetail:errorBody",  parent: error_state, why: "Text node modelled as the parent's `body:` field." }

components:

  # ── Loading ──────────────────────────────────────────────────────────────────
  - type: progress_circular
    state_binding: [loading]
    accessibility_label: "{strings.stmt_detail.loading}"
    test_tag: "statementDetail:loadingSkeleton"
    test_context:
      purpose: "Full-screen loading indicator while parallel fetch of OBStatement2 + OBReadTransaction6 is in flight"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Period header card ───────────────────────────────────────────────────────
  - type: card
    id: statement_header_card
    test_tag: "statementDetail:headerCard"
    state_binding: [content, empty]
    elevation: 2
    accessibility_label: "{strings.stmt_detail.a11y.header_card}"
    test_context:
      purpose: "Period header card showing statement identity fields from OBStatement2"
      required_fields: [statement.StatementReference, statement.StartDateTime, statement.EndDateTime, statement.Type, statement.CreationDateTime]
      interaction_type: display
      data_driven: true
    children:
      - type: text
        id: statement_reference
        role: overline
        content: "{statement.StatementReference}"
        style: labelMedium
        color: "secondary"
        test_context:
          purpose: "Human-readable statement reference (e.g. MAY-2026-STMT)"
          required_fields: [statement.StatementReference]
          interaction_type: display
          data_driven: true
      - type: text
        id: statement_period
        role: title
        content: "{statement.StartDateTime} – {statement.EndDateTime}"
        style: titleMedium
        test_context:
          purpose: "Statement period range in ISO-8601; formatted by ViewModel to 'dd MMM yyyy – dd MMM yyyy'"
          required_fields: [statement.StartDateTime, statement.EndDateTime]
          interaction_type: display
          data_driven: true
      - type: text
        id: statement_type
        role: body
        content: "{statement.Type}"
        style: bodySmall
        color: "onSurfaceVariant"
        test_context:
          purpose: "OBStatement2 Type field (e.g. RegularPeriodic)"
          required_fields: [statement.Type]
          interaction_type: display
          data_driven: true
      - type: text
        id: statement_created
        role: caption
        content: "{strings.stmt_detail.created_prefix} {statement.CreationDateTime}"
        style: labelSmall
        color: "onSurfaceVariant"
        test_context:
          purpose: "Localized 'Created' prefix followed by statement generation timestamp from HSBC AIS"
          required_fields: [statement.CreationDateTime]
          interaction_type: display
          data_driven: true

  # ── Balances ─────────────────────────────────────────────────────────────────
  - type: section_header
    id: balances_header
    test_tag: "statementDetail:balancesSection"
    state_binding: [content, empty]
    label: "{strings.stmt_detail.section.balances}"
    accessibility_label: "{strings.stmt_detail.section.balances}"
    test_context:
      purpose: "Section divider for OBStatement2.StatementAmount[] (OpeningBalance, ClosingBalance)"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: list
    id: balances_list
    state_binding: [content, empty]
    items_source: "{statement.StatementAmount}"
    accessibility_label: "{strings.stmt_detail.a11y.balances_list}"
    test_context:
      purpose: "Renders OBStatementAmount2 entries (Type, CreditDebitIndicator, Amount)"
      required_fields: [statement.StatementAmount]
      interaction_type: display
      data_driven: true
    children:
      - type: list_item
        id: balance_row
        headline: "{item.Type}"
        trailing_content: "{item.CreditDebitIndicator == 'Credit' ? '' : '-'}{item.Amount.Amount} {item.Amount.Currency}"
        trailing_style: titleMedium
        trailing_color: "{item.CreditDebitIndicator == 'Credit' ? 'primary' : 'error'}"
        accessibility_label: "{item.Type}: {item.Amount.Amount} {item.Amount.Currency} {item.CreditDebitIndicator}"
        test_context:
          # Colour corrected 2026-08-02 (/design-validate C-3): credit was `tertiary`, which
          # contradicted semantic.money.credit -> primary and DESIGN.md's "credit in primary"
          # rule. It became doubly wrong at tokens 2.3.0, where tertiary took on the WARNING
          # semantic. The old prose below said "Credit=green" — wrong twice over: the design
          # system explicitly rejects green/red money semantics for colour-blind safety, and
          # tertiary in this theme is #64597B, a purple-grey.
          purpose: "Single balance entry; sign and colour derived from CreditDebitIndicator (Credit=primary trust-blue, Debit=error — never green/red, per semantic.money)"
          required_fields: [item.Type, item.CreditDebitIndicator, item.Amount.Amount, item.Amount.Currency]
          interaction_type: display
          data_driven: true

  # ── Fees ─────────────────────────────────────────────────────────────────────
  - type: section_header
    id: fees_header
    test_tag: "statementDetail:feesSection"
    state_binding: [content, empty]
    label: "{strings.stmt_detail.section.fees}"
    accessibility_label: "{strings.stmt_detail.section.fees}"
    visible_when: "statement.StatementFee.length > 0"
    test_context:
      purpose: "Section divider for OBStatement2.StatementFee[]; hidden when array is empty"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: list
    id: fees_list
    state_binding: [content, empty]
    items_source: "{statement.StatementFee}"
    visible_when: "statement.StatementFee.length > 0"
    accessibility_label: "{strings.stmt_detail.a11y.fees_list}"
    test_context:
      purpose: "Renders OBStatementFee1 entries when present (Description, Amount)"
      required_fields: [statement.StatementFee]
      interaction_type: display
      data_driven: true
    children:
      - type: list_item
        id: fee_row
        headline: "{item.Description}"
        trailing_content: "{item.Amount.Amount} {item.Amount.Currency}"
        trailing_style: bodyMedium
        accessibility_label: "{strings.stmt_detail.a11y.fee_prefix} {item.Description}: {item.Amount.Amount} {item.Amount.Currency}"
        test_context:
          purpose: "Single fee entry from OBStatementFee1 (e.g. Monthly maintenance fee £0.00)"
          required_fields: [item.Description, item.Amount.Amount, item.Amount.Currency]
          interaction_type: display
          data_driven: true

  # ── Interest ──────────────────────────────────────────────────────────────────
  - type: section_header
    id: interest_header
    test_tag: "statementDetail:interestSection"
    state_binding: [content, empty]
    label: "{strings.stmt_detail.section.interest}"
    accessibility_label: "{strings.stmt_detail.section.interest}"
    visible_when: "statement.StatementInterest.length > 0"
    test_context:
      purpose: "Section divider for OBStatement2.StatementInterest[]; hidden when array is empty"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: list
    id: interest_list
    state_binding: [content, empty]
    items_source: "{statement.StatementInterest}"
    visible_when: "statement.StatementInterest.length > 0"
    accessibility_label: "{strings.stmt_detail.a11y.interest_list}"
    test_context:
      purpose: "Renders OBStatementInterest1 entries (Description, Amount)"
      required_fields: [statement.StatementInterest]
      interaction_type: display
      data_driven: true
    children:
      - type: list_item
        id: interest_row
        headline: "{item.Description}"
        trailing_content: "{item.Amount.Amount} {item.Amount.Currency}"
        trailing_style: bodyMedium
        trailing_color: "{item.CreditDebitIndicator == 'Credit' ? 'primary' : 'error'}"
        accessibility_label: "{strings.stmt_detail.a11y.interest_prefix} {item.Description}: {item.Amount.Amount} {item.Amount.Currency}"
        test_context:
          purpose: "Single interest entry (e.g. In-credit interest £0.21)"
          required_fields: [item.Description, item.Amount.Amount, item.Amount.Currency]
          interaction_type: display
          data_driven: true

  # ── Transactions ──────────────────────────────────────────────────────────────
  - type: section_header
    id: transactions_header
    test_tag: "statementDetail:transactionsSection"
    state_binding: [content, empty]
    label: "{strings.stmt_detail.section.transactions}"
    accessibility_label: "{strings.stmt_detail.section.transactions}"
    test_context:
      purpose: "Section divider for statement transactions from OBReadTransaction6"
      required_fields: []
      interaction_type: display
      data_driven: false

  - type: list
    id: statement_txns_list
    state_binding: [content]
    scroll_direction: vertical
    items_source: "{statementTransactions}"
    accessibility_label: "{strings.stmt_detail.a11y.transactions_list}"
    test_context:
      purpose: "Scrollable list of OBTransaction6 entries within the statement period"
      required_fields: [statementTransactions]
      interaction_type: display
      data_driven: true
    children:
      - type: list_item
        keyboard:
          focusable: true
        id: statement_txn_row
        # Note the convention break — the flat consts read "statementDetail:camelCase" but this
        # one builder emits "statementDetail_txn_$id" with underscores. Source truth; preserved.
        test_tag: "statementDetail_txn_{item.TransactionId}"   # fun txnRow(id) @ StatementDetailContent.kt
        overline: "{item.BookingDateTime}"
        headline: "{item.TransactionInformation}"
        trailing_content: "{item.CreditDebitIndicator == 'Credit' ? '+' : '-'}{item.Amount.Amount} {item.Amount.Currency}"
        trailing_style: titleSmall
        trailing_color: "{item.CreditDebitIndicator == 'Credit' ? 'primary' : 'error'}"
        accessibility_label: "{item.TransactionInformation} {item.CreditDebitIndicator} {item.Amount.Amount} {item.Amount.Currency} {strings.stmt_detail.a11y.on_date} {item.BookingDateTime}"
        on_click:
          action: navigate_transaction_detail
          target: transaction-detail
          params:
            transactionId: "{item.TransactionId}"
            accountId: "{item.AccountId}"
          action_contract:
            effect: navigate
            description: "Navigates to transaction-detail screen for the selected OBTransaction6 entry within the statement period, passing TransactionId and AccountId as route arguments."
        test_context:
          purpose: "Tappable OBTransaction6 row within statement period; overline=date, credit=primary trust-blue, debit=error; navigates to transaction-detail"
          required_fields: [item.TransactionId, item.AccountId, item.TransactionInformation, item.CreditDebitIndicator, item.Amount.Amount, item.Amount.Currency, item.BookingDateTime]
          interaction_type: action
          data_driven: true

  # ── Empty transactions state ───────────────────────────────────────────────────
  - type: empty_state
    id: empty_txns_state
    test_tag: "statementDetail:emptyTransactions"
    state_binding: [empty]
    icon: receipt_long
    title: "{strings.stmt_detail.empty_txns.title}"
    body: "{strings.stmt_detail.empty_txns.body}"
    accessibility_label: "{strings.stmt_detail.empty_txns.title}"
    test_context:
      purpose: "Shown when statementTransactions returns empty array — valid for new or inactive accounts in the period"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Download PDF button ────────────────────────────────────────────────────────
  - type: button
    keyboard:
      focusable: true
    id: download_pdf_button
    test_tag: "statementDetail:downloadButton"
    variant: outlined
    label: "{strings.stmt_detail.action.download_pdf}"
    icon: download
    state_binding: [content, empty]
    enabled_when: "downloadState != Downloading"
    accessibility_label: "{strings.stmt_detail.a11y.download_pdf}"
    test_context:
      purpose: "Triggers download_statement_pdf; calls GET statement-file (Accept: application/pdf) via ktor-client-download; disabled while Downloading"
      required_fields: []
      interaction_type: action
      data_driven: false
    on_click:
      action: download_statement_pdf
      action_contract:
        effect: persist_file
        external_library_refs: ["ktor-client-download", "hsbc-obie-ais-v4.0:statements-file"]
        description: "Calls GET statements/{StatementId}/file (Accept: application/pdf) via ktor-client-download, streams the PDF binary, and hands off to the platform share/save sheet; drives DownloadState from Idle through Downloading to Downloaded or DownloadError."

  # ── Download in-progress indicator ────────────────────────────────────────────
  - type: progress_linear
    id: download_progress
    test_tag: "statementDetail:downloadProgress"
    state_binding: [content, empty]
    visible_when: "downloadState == Downloading"
    accessibility_label: "{strings.stmt_detail.downloading}"
    test_context:
      purpose: "Indeterminate linear progress shown beneath Download PDF button while ktor streams the PDF binary"
      required_fields: []
      interaction_type: display
      data_driven: false

  # ── Download result snackbar ───────────────────────────────────────────────────
  - type: snackbar
    id: download_result_snackbar
    state_binding: [content, empty]
    visible_when: "downloadState == Downloaded || downloadState == DownloadError"
    message_success: "{strings.stmt_detail.download_success}"
    message_error: "{strings.stmt_detail.download_error}"
    auto_dismiss_ms: 4000
    accessibility_label: "{strings.stmt_detail.download_success}"
    test_context:
      purpose: "Transient snackbar confirming PDF saved to device or reporting download error after ktor-client-download completes"
      required_fields: [downloadState]
      interaction_type: display
      data_driven: true

  # ── Error state ────────────────────────────────────────────────────────────────
  - type: error_state
    id: error_state
    test_tag: "statementDetail:errorState"
    state_binding: [error]
    icon: error_outline
    title: "{strings.stmt_detail.error.title}"
    body: "{error.message}"
    accessibility_label: "{strings.stmt_detail.error.a11y}"
    test_context:
      purpose: "Full-screen error shown on 401/403/404/network error from statement or statement-transactions endpoints"
      required_fields: [error.message]
      interaction_type: display
      data_driven: true
    children:
      - type: button
        keyboard:
          focusable: true
        id: retry_button
        test_tag: "statementDetail:retryButton"
        variant: filled
        label: "{strings.stmt_detail.action.retry}"
        accessibility_label: "{strings.stmt_detail.a11y.retry}"
        test_context:
          purpose: "Re-triggers retry_load which delegates to statementDetailLoad"
          required_fields: []
          interaction_type: action
          data_driven: false
        on_click:
          action: retry_load
          action_contract:
            effect: call_api
            reads_from: ["statement-detail", "statement-txns"]
            external_library_refs: ["ktorfit", "hsbc-obie-ais-v4.0:statements"]
            description: "Re-triggers the parallel fetch of OBStatement2 and OBReadTransaction6 after a 401, 403, 404, or network failure, returning the screen to the Loading state."
