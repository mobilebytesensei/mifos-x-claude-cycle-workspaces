# Alt scenario: empty transactions (edge case for new or inactive accounts)
_alt_scenarios:
  empty_transactions:
    accountId: "40051500000001"
    statementId: "STMT-2026-05-40051500000001"
    statement:
      StatementId: "STMT-2026-05-40051500000001"
      AccountId: "40051500000001"
      StatementReference: "MAY-2026-NEW"
      Type: "RegularPeriodic"
      StartDateTime: "2026-05-01T00:00:00Z"
      EndDateTime: "2026-05-31T23:59:59Z"
      CreationDateTime: "2026-06-01T06:00:00Z"
      StatementAmount:
        - Amount:
            Amount: "500.00"
            Currency: "GBP"
          CreditDebitIndicator: "Credit"
          Type: "OpeningBalance"
        - Amount:
            Amount: "500.00"
            Currency: "GBP"
          CreditDebitIndicator: "Credit"
          Type: "ClosingBalance"
      StatementFee: []
      StatementInterest: []
    statementTransactions: []

# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, empty, error]. _alt_scenarios covered the empty
# case (a statement period with no transactions); `error` had nothing.
states:
  - scope: content
    accountId: "40051512345678"
    statementId: "STMT-2026-05-40051512345678"
    statement: statement

  - scope: loading
    statementId: "STMT-2026-05-40051512345678"

  - scope: empty
    statementId: "STMT-2026-05-40051512345678"
    statementTransactions: []
    message: "No transactions in this statement period."
    _statement_still_renders: >-
      Note what empty means here: the STATEMENT exists and its opening/closing balances,
      fees and interest still render — only the transaction list is empty. Blanking the whole
      screen would hide balances the customer came to read. This is why _alt_scenarios keeps
      the balance blocks populated alongside statementTransactions: [].

  - scope: error
    error_type: StatementLoadFailed
    message: "Could not load this statement"
    recovery: "Check your connection and try again."
    recoverable: true
