description: >-
  Single statement detail: period header, opening/closing balances, fees, interest, and transactions within the
  statement period. Download PDF action backed by statement-file endpoint (application/pdf) with inline progress and
  snackbar feedback. Empty state covers statementTransactions=[] edge case.
