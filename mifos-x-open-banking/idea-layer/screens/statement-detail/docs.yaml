has_server: false
capabilities: [has_ui, has_api, has_flow]
metadata:
  category: composite
  implementation_ready: true
  impl_ready_at: '2026-06-29'
  impl_ready_schema: v2
  i18n_coverage: true
  i18n_string_prefix: stmt_detail
contracts: []
libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
  - capability: file-download
    library: ktor-client
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
vm_actions:
  - name: statement_detail_load
    signature: 'suspend fun statementDetailLoad(accountId: String, statementId: String)'
    state_mutations:
      - uiState = StatementDetailUiState.Loading
      - uiState = StatementDetailUiState.Content(statement, statementTransactions)
      - uiState = StatementDetailUiState.Empty(statement) // when statementTransactions is empty
      - uiState = StatementDetailUiState.Error(message)
    side_effects:
      - GET /accounts/{accountId}/statements/{statementId} → OBStatement2 (parallel)
      - GET /accounts/{accountId}/statements/{statementId}/transactions → OBReadTransaction6 (parallel)
    error_handling:
      http_401: emit Error('Session expired. Please re-authenticate.')
      http_403: emit Error('Consent does not include ReadStatements.')
      http_404: emit Error('Statement not found.')
      network: emit Error(e.localizedMessage)
  - name: download_statement_pdf
    signature: 'suspend fun downloadStatementPdf(accountId: String, statementId: String)'
    state_mutations:
      - downloadState = Downloading
      - downloadState = Downloaded(uri)
      - downloadState = DownloadError(message)
    side_effects:
      - 'GET /accounts/{accountId}/statements/{statementId}/file (Accept: application/pdf) → ByteArray'
      - Platform share/save sheet presented with PDF binary
    error_handling:
      http_404: emit DownloadError('Download failed')
      network: emit DownloadError('Download failed')
  - name: retry_load
    signature: 'suspend fun retryLoad(accountId: String, statementId: String)'
    state_mutations:
      - delegates to statementDetailLoad(accountId, statementId)
    side_effects: []
    error_handling: {}
error_cases:
  - code: HTTP_401
    description: PSU access token expired; re-authentication required.
  - code: HTTP_403
    description: Consent scope does not include ReadStatementsDetail.
  - code: HTTP_404
    description: StatementId does not exist for this account.
  - code: HTTP_404_FILE
    description: Statement PDF file not yet generated by HSBC.
  - code: NETWORK_ERROR
    description: Device offline or AIS endpoint unreachable.
