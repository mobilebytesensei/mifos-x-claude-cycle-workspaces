# header prepend deliberately does NOT add a second schema_version key.

id: privacy-policy
name: "Privacy Policy"
feature: shared
flavor: shared
# status: REMOVED 2026-08-04 (CROSS_LEAK repair — sibling-layout.json assigns `status` to
# the docs sibling). This copy held `approved`; docs.yaml is the single owner.
quality_score: 92
schema_version: "3.1"
contract_version: "1.1.0"
approve_hash: "sha256:pp12b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0cd"
approved_at: "2026-06-11T14:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
tags: [FR-002, privacy, gdpr, legal]
status_history:
  - status: draft
    timestamp: "2026-05-28T00:00:00Z"
  - from: draft
    to: approved
    at: "2026-05-28T00:00:00Z"
    by: "/idea completeness"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: approved
    at: "2026-06-08T00:30:00Z"
    by: "/kmp-implement privacy-policy (legal batch)"
    contract_version: "1.1.0"
    note: "Implemented in feature/legal as a static scrollable screen: GDPR/sandbox notice banner + nine section cards (data touched, lawful basis, use, where data lives, diagnostics, sharing, retention, rights, contact) + last-updated footer. Deviation: spec prose claiming live-bank obligations (FCA reporting, AML/KYC, 7-year retention, Firebase SDKs, identity-document collection) replaced with truthful sandbox-demo content — the app touches only sandbox credentials/data plus local preferences, password never stored. ViewModel/repository/loading states dropped (static content). Entry: Settings → Privacy Policy."
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    contract_version: "1.1.0"
    note: "SOURCE→SPEC truthfulness rewrite to shipped PrivacyPolicyScreen.kt (static @Composable, privacyPolicySections baked in, no ViewModel/DI). Replaced the fabricated real-bank prose (SHA-256 token + FCA + AML/KYC + 7-year retention + Firebase/Crashlytics + KYC providers + DPO addresses + ICO escalation) with the shipped sandbox-truthful content: sandbox-scope GDPR banner + nine sections (Data This App Touches, Lawful Basis for Processing, How Your Data Is Used, Where Your Data Lives, Diagnostics & Crash Reporting, Data Sharing, Data Retention, Your Rights, Contact) + last-updated stamp. Component ids realigned to shipped test tags (added pp_local_storage_card, pp_diagnostics_card; pp_dpo_card now the Contact section). Removed: loading skeleton (pp_loading_skeleton), error+retry (pp_error_state/pp_retry_button), scroll-position tracking, PrivacyPolicyViewModel state_model — screen does no network."
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."

screens:
  - id: privacy-policy
    name: "Privacy Policy"
    route: /legal/privacy

archetype: settings

shell:
  top_app_bar:
    show: true
    title: "Privacy Policy"
    navigation_icon: arrow_back
    navigation_action: navigate_back
  bottom_nav: false

components:
  - type: stack
    id: pp_root
    variant: vertical
    style:
      background: background
      padding: spacing.lg
    children:
      - pp_gdpr_banner
      - pp_data_collection_card
      - pp_lawful_basis_card
      - pp_purpose_card
      - pp_local_storage_card
      - pp_diagnostics_card
      - pp_third_party_card
      - pp_retention_card
      - pp_user_rights_card
      - pp_dpo_card
      - pp_last_updated_text

  # ── Sandbox-scope notice banner ───────────────────────────────────────────────

  - type: banner
    id: pp_gdpr_banner
    variant: info
    style:
      background: primaryContainer
      border_radius: "8dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_gdpr_banner_text

  - type: text
    id: pp_gdpr_banner_text
    content: "Mifos X Open Banking is an open-source UK Open Banking reference client, maintained by the community around the Mifos Initiative. It connects to the HSBC UK Open Banking sandbox, so every account, balance and transaction shown here is synthetic test data. This policy describes, in terms aligned with UK GDPR and EU GDPR (Regulation 2016/679), how the app handles your data. The short version: the app never asks for your banking password, and you can revoke its access at any time."
    variant: body_small
    style:
      typography: bodySmall
      color: onSurface
    a11y:
      role: text
      label: "Sandbox-only demo notice and GDPR alignment"
    test_context:
      purpose: "Banner declaring the sandbox-only scope of the app, above all policy sections"
      interaction_type: display
      data_driven: false

  # ── Data This App Touches ─────────────────────────────────────────────────────

  - type: card
    id: pp_data_collection_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_data_collection_header
      - pp_data_collection_body

  - type: text
    id: pp_data_collection_header
    content: "Data This App Touches"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Data This App Touches"
    test_context:
      purpose: "Section header for what data the app handles"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_data_collection_body
    content: "The app handles only what it needs: (a) Access tokens — issued by your bank after you authorise there, never a password; the app has no password field; (b) Banking data — accounts, balances, transactions, beneficiaries, standing orders, scheduled payments, direct debits and statements, read only where the consent you approved permits it; (c) Payment instructions you compose, sent to your bank to execute; (d) App preferences — theme and notification choices made on this device. The app never requests your contacts, location, camera, microphone, photos or any other device data."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Data the app touches"
    test_context:
      purpose: "Describes the limited categories of data the app handles in the sandbox"
      interaction_type: display
      data_driven: false

  # ── Lawful Basis for Processing ───────────────────────────────────────────────

  - type: card
    id: pp_lawful_basis_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_lawful_basis_header
      - pp_lawful_basis_body

  - type: text
    id: pp_lawful_basis_header
    content: "Lawful Basis for Processing"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Lawful Basis for Processing"
    test_context:
      purpose: "Section header for GDPR lawful basis"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_lawful_basis_body
    content: "Where GDPR applies, processing rests on: (a) Contract performance — exchanging your sandbox credentials for a session token is necessary to deliver the sign-in you asked for; (b) Legitimate interests — keeping the app stable through crash diagnostics that carry no identifying data, balanced against your rights and freedoms; (c) Consent — for any optional diagnostics setting you switch on, which you can withdraw at any time from Settings."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Lawful bases for data processing"
    test_context:
      purpose: "GDPR lawful-basis enumeration scoped to the demo"
      interaction_type: display
      data_driven: false

  # ── How Your Data Is Used ─────────────────────────────────────────────────────

  - type: card
    id: pp_purpose_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_purpose_header
      - pp_purpose_body

  - type: text
    id: pp_purpose_header
    content: "How Your Data Is Used"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "How Your Data Is Used"
    test_context:
      purpose: "Section header for data purpose specification"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_purpose_body
    content: "Your sandbox credentials are sent once at sign-in and exchanged for a short-lived session token that authenticates every later API call; the password itself is never stored. Sandbox banking data is fetched on demand and rendered on screen so you can explore the product flows. Preferences are read solely to apply the appearance and behaviour you chose. Nothing is profiled, scored, sold or used for advertising."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Purposes for data use"
    test_context:
      purpose: "Limited purposes for which data is processed in the demo"
      interaction_type: display
      data_driven: false

  # ── Where Your Data Lives ─────────────────────────────────────────────────────

  - type: card
    id: pp_local_storage_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_local_storage_header
      - pp_local_storage_body

  - type: text
    id: pp_local_storage_header
    content: "Where Your Data Lives"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Where Your Data Lives"
    test_context:
      purpose: "Section header for on-device storage disclosure"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_local_storage_body
    content: "Your session token and preferences are kept in app-private storage on this device, protected by the operating system's application sandbox. Recently viewed sandbox data may be cached locally so screens stay responsive when the connection drops. The app has no backend of its own — nothing you do here is uploaded to servers run by the app's maintainers."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Where data is stored"
    test_context:
      purpose: "States that data lives in app-private storage with no maintainer backend"
      interaction_type: display
      data_driven: false

  # ── Diagnostics & Crash Reporting ─────────────────────────────────────────────

  - type: card
    id: pp_diagnostics_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_diagnostics_header
      - pp_diagnostics_body

  - type: text
    id: pp_diagnostics_header
    content: "Diagnostics & Crash Reporting"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Diagnostics and Crash Reporting"
    test_context:
      purpose: "Section header for diagnostics and crash reporting"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_diagnostics_body
    content: "Builds of this app may include a diagnostics module that records crash reports and anonymous performance measurements, such as app start time and screen render duration, so maintainers can find and fix defects. Diagnostic records never contain your sandbox credentials, session token, account numbers or transaction details. When a build ships with diagnostics enabled, a toggle in Settings lets you turn it off."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Diagnostics and crash reporting disclosure"
    test_context:
      purpose: "Describes optional, non-identifying crash diagnostics"
      interaction_type: display
      data_driven: false

  # ── Data Sharing ──────────────────────────────────────────────────────────────

  - type: card
    id: pp_third_party_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_third_party_header
      - pp_third_party_body

  - type: text
    id: pp_third_party_header
    content: "Data Sharing"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Data Sharing"
    test_context:
      purpose: "Section header for data sharing disclosure"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_third_party_body
    content: "Data leaves this app in exactly one direction: API requests to your bank's Open Banking endpoint, over mutual TLS. HSBC processes those requests under its own privacy notice. The app shares nothing with advertisers, data brokers or social networks, and it embeds no third-party tracking SDKs."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Data sharing disclosure"
    test_context:
      purpose: "States data only flows to the HSBC Open Banking sandbox, no advertisers or trackers"
      interaction_type: display
      data_driven: false

  # ── Data Retention ────────────────────────────────────────────────────────────

  - type: card
    id: pp_retention_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_retention_header
      - pp_retention_body

  - type: text
    id: pp_retention_header
    content: "Data Retention"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Data Retention"
    test_context:
      purpose: "Section header for retention statement"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_retention_body
    content: "Your banking data lives at your bank and follows its retention schedule — this app is a window onto it, never its custodian. The local cache and your tokens are cleared when you sign out or revoke the consent, and uninstalling the app removes everything it stored on this device. Under UK Open Banking rules an account-access consent must be reconfirmed every 90 days, so access lapses on its own if you do nothing. Crash reports, where enabled, are kept only as long as needed to diagnose the defect they describe."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Data retention statement"
    test_context:
      purpose: "Sandbox-scoped retention — operator-owned data, local clears on sign-out/uninstall"
      interaction_type: display
      data_driven: false

  # ── Your Rights ───────────────────────────────────────────────────────────────

  - type: card
    id: pp_user_rights_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_user_rights_header
      - pp_user_rights_body

  - type: text
    id: pp_user_rights_header
    content: "Your Rights"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Your Rights"
    test_context:
      purpose: "Section header for data subject rights"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_user_rights_body
    content: "Because personal data stays on your device, you can act on most rights directly: review preferences in Settings, revoke the consent to stop all access immediately, sign out to clear your tokens and cache, or uninstall to erase all local data. Where GDPR or similar law applies you also hold the rights of access, rectification, erasure, restriction of processing, data portability and objection. For data held by the bank itself, direct requests to HSBC. Note that a standing order or scheduled payment cannot be changed or cancelled from this app — Open Banking does not permit it, so use the HSBC app instead."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Data subject rights enumeration"
    test_context:
      purpose: "Rights the user can exercise directly plus GDPR rights, with HSBC referral for bank-held data"
      interaction_type: display
      data_driven: false

  # ── Contact ───────────────────────────────────────────────────────────────────

  - type: card
    id: pp_dpo_card
    variant: filled
    supported_states: [idle]
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - pp_dpo_header
      - pp_dpo_body

  - type: text
    id: pp_dpo_header
    content: "Contact"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      padding_bottom: spacing.sm
    a11y:
      role: heading
      label: "Contact"
    test_context:
      purpose: "Section header for contact details"
      interaction_type: display
      data_driven: false

  - type: text
    id: pp_dpo_body
    content: "Mifos X Open Banking is community-maintained open-source software associated with the Mifos Initiative. Questions about this policy are best raised as an issue on the project's GitHub repository, or by email to privacy@mifos.org. Concerns about how your bank processes your data should go to HSBC, which is the controller for your account and payment data. If you believe your data-protection rights have been infringed, you may also complain to your local supervisory authority — the ICO in the UK."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      line_height: "1.6"
    a11y:
      role: text
      label: "Contact details for privacy questions"
    test_context:
      purpose: "Community contact path for policy questions plus supervisory-authority right"
      interaction_type: display
      data_driven: false

  # ── Last Updated Footer ───────────────────────────────────────────────────────

  - type: text
    id: pp_last_updated_text
    content: "Last updated: 28 May 2026 · Version 1.0"
    variant: body_small
    style:
      typography: bodySmall
      color: onSurfaceVariant
      alignment: center
      padding_top: spacing.md
      padding_bottom: spacing.xl
    a11y:
      role: text
      label: "Privacy policy last updated 28 May 2026 version 1.0"
    test_context:
      purpose: "Date and version stamp for the bundled policy text"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: content
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components:
      - pp_gdpr_banner
      - pp_data_collection_card
      - pp_lawful_basis_card
      - pp_purpose_card
      - pp_local_storage_card
      - pp_diagnostics_card
      - pp_third_party_card
      - pp_retention_card
      - pp_user_rights_card
      - pp_dpo_card
      - pp_last_updated_text

state_model:
  type: static_content
  note: "Static @Composable PrivacyPolicyScreen(onBack, modifier). No ViewModel, no DI, no repository, no events, no network. The policy is the compile-time constant privacyPolicySections (nine PolicySection entries) rendered verbatim inside a vertical scroll, above the sandbox notice banner and below the last-updated stamp. No loading/error/empty states — content can never fail to load. Back navigation icon invokes the onBack lambda."

navigation:
  - id: nav_back
    target: about
    note: "Back navigation icon → onBack lambda (returns to the Settings entry point)"

dependencies:
  tier: feature
  features: [shared-core]
