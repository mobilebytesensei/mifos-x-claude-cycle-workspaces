sibling: data-flow
schema_version: "4.0"
feature_id: privacy-policy

# Privacy Policy content is a static bundled asset (privacy_policy.html).
# No network API calls are made. Entries document the local-asset load
# that PrivacyPolicyViewModel performs on screen open.

entries:
  - screen_id: privacy-policy
    trigger: on_mount
    endpoints: []
    direction: read
    transport: local_asset
    asset: "privacy_policy.html"
    dtos: []
    produces_state: content
    error_paths:
      - error_code: asset_unreadable
        behavior: error_state
    notes: "Defensive error path only; bundled asset should always be readable"

  - screen_id: privacy-policy
    trigger: on_interact
    event: OnRetry
    endpoints: []
    direction: read
    transport: local_asset
    asset: "privacy_policy.html"
    dtos: []
    produces_state: content
    error_paths:
      - error_code: asset_unreadable
        behavior: error_state
