sibling: tests
schema_version: "4.0"
feature_id: login

screen_id: login

scenarios:
  - id: TC-LOGIN-001
    description: "Content state renders all 10 OBIE read permissions and consent validity"
    state: content
    priority: high
    given: "User navigated from onboarding screen; permissions loaded from local constants"
    when: "Screen mounts (on_mount completes synchronously)"
    then:
      - "10 permission rows render each with label and description"
      - "'Continue to HSBC' button is visible and enabled"
      - "Consent validity note mentioning 90 days is visible"
      - "HSBC explainer card is visible with logo, badge, headline, body, and security notice"
      - "Formatted consent expiry label is visible (e.g. 'Expires 26 Sep 2026')"
      - "UK Open Banking regulated badge is visible"

  - id: TC-LOGIN-002
    description: "Loading state shown while consent-create POST is in flight"
    state: loading
    priority: high
    given: "User has tapped 'Continue to HSBC'; consent-create POST is in flight"
    when: "start_oauth trigger fires and API call is pending"
    then:
      - "Linear progress indicator visible"
      - "'Connecting to HSBC…' label visible"
      - "Content components hidden (card, permissions list, CTAs not visible)"

  - id: TC-LOGIN-003
    description: "Error state shown on consent-create failure with user-friendly message"
    state: error
    priority: high
    given: "HSBC sandbox returns 500 on consent-create POST"
    when: "start_oauth trigger fires and API returns 500"
    then:
      - "Error state renders with error_outline icon"
      - "'Could not connect to HSBC' title visible"
      - "User-friendly message 'HSBC is temporarily unavailable. Try again in a moment.' visible"
      - "'Try again' button visible and triggers start_oauth"

  - id: TC-LOGIN-004
    description: "Cancel navigates back to onboarding"
    state: content
    priority: medium
    given: "Login screen is in content state"
    when: "User taps 'Cancel'"
    then:
      - "App navigates back to user-onboarding screen"

  - id: TC-LOGIN-005
    description: "Successful consent-create stores ConsentId and transitions to authorising state"
    state: authorising
    priority: high
    given: "HSBC sandbox returns 201 with ConsentId aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    when: "start_oauth trigger fires successfully and redirect_to_bank_authorize is called"
    then:
      - "ConsentId stored in local storage"
      - "OAuth state and nonce stored for callback verification"
      - "FAPI /authorize URL constructed and app-to-app redirect launched"
      - "Screen transitions to authorising state"

  - id: TC-LOGIN-006
    description: "Authorising state displays correct holding UI after FAPI redirect launches"
    state: authorising
    priority: medium
    given: "Consent-create succeeded and FAPI redirect has been launched to HSBC"
    when: "on_redirect_launched fires"
    then:
      - "Circular progress indicator visible"
      - "'Opening HSBC…' label visible"
      - "Hint text visible instructing user to complete sign-in in HSBC then return"
      - "Content components hidden (permissions list and CTAs not visible)"

  - id: TC-LOGIN-007
    description: "Network error surfaces correct user-friendly message"
    state: error
    priority: medium
    given: "Device has no internet connectivity"
    when: "start_oauth trigger fires and consent-create throws NetworkException"
    then:
      - "Error state renders with 'Could not connect to HSBC' title"
      - "Body message reads 'Unable to reach HSBC. Check your connection and try again.'"
      - "'Try again' button visible"

  - id: TC-LOGIN-008
    description: "Empty state shown and prevents consent-create when no OBIE permissions are configured"
    state: empty
    priority: medium
    given: "ConsentOnboardingViewModel.loadPermissionsConfig() resolves an empty requested_permissions list (zero OBIE scopes)"
    when: "Screen mounts and loadPermissionsConfig completes with empty result"
    then:
      - "Empty state renders with manage_search icon"
      - "'Connection required' title visible"
      - "Body text explaining no active HSBC connection found is visible"
      - "'Go back' button visible and navigates to user-onboarding"
      - "'Continue to HSBC' CTA is NOT visible (state_binding: content only)"
      - "Consent-create POST is NOT triggered (zero-scope consent would be rejected by HSBC 400)"
