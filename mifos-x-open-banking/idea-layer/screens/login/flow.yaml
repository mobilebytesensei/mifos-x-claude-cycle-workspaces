sibling: flow
schema_version: "4.0"
feature_id: login

feature: consent-onboarding
flow_ref: app-main

entry_points:
  - source: user-onboarding
    label: "User taps 'Connect with HSBC' on the onboarding screen"

transitions:
  - from: login
    to: consent-callback
    trigger: "HSBC authorisation redirect returns (OAuth callback) with auth code"
  - from: login
    to: user-onboarding
    trigger: "User taps Cancel"

# Moved verbatim from ui.yaml 2026-07-31 (CROSS_LEAK repair).
dependencies:
  tier: 0
  features:
    - consent-callback
    - user-onboarding
  libraries:
    - id: ktorfit
      purpose: "POST /account-access-consents with OBReadConsent1 payload via client_credentials bearer token"
    - id: jose4j
      purpose: "PS256 request object signing for FAPI 1.0 Advanced /authorize URL construction"
