sibling: api
schema_version: "4.0"
feature_id: login

screen_id: login

endpoints:
  - id: consent-create
    method: POST
    path: "/account-access-consents"
    response_dto: HSBCCreateConsentResponse
    response:
      dto: HSBCCreateConsentResponse
      key_fields:
        - Data.ConsentId
        - Data.Status
        - Data.ExpirationDateTime
        - Data.Permissions
    errors:
      400: "Malformed OBReadConsent1 — invalid Permissions[] enum values or datetime format; HSBC returns OBErrorResponse1 body"
      401: "Client credentials bearer token invalid or expired — app must re-request token before retrying consent-create"
      500: "HSBC upstream error — transient; eligible for one automatic retry with 2-second exponential back-off"
      NetworkException: "Device offline or DNS failure — surface 'Check your connection and try again' to PSU"
      FapiRedirectException: "HSBC mobile app not installed or TPP redirect_uri scheme not registered on this device — prompt PSU to install HSBC app"
    permission: null
    requires_auth: true
    notes: "Authenticated with client_credentials grant (not PSU token). Request body is OBReadConsent1 containing the full Permissions[] array and 90-day ExpirationDateTime. Returns ConsentId used to construct the FAPI authorisation URL."
