known_gaps:
  - id: KG-LOGIN-1
    severity: medium
    plan_ref: DEF-007
    status: spec-healed-source-pending   # spec now: NavigateBack → onBack() pops to Intro; /implement must pass onBack on the AuthGraph LoginRoute
    description: "SOURCE: Cancel / Go back on the first-run AuthGraph LoginRoute calls LocalIntentManager.exitApplication() (no onBack is passed) instead of returning to Intro; there is also no top-bar back affordance on Intro/Login/LoginRenew."
  - id: KG-LOGIN-2
    severity: medium
    plan_ref: DEF-013
    status: spec-healed-source-pending   # spec now declares feature_login_error_* / feature_login_expiry_label keys; OBPermission labels still open
    description: "SOURCE: hardcoded user-facing English outside strings.xml (RULE-IMPL-NO-HARDCODED-STRING-001): all LoginUiState.Error messages and the 'Expires …' label are built in LoginViewModel; 'HSBC' brand text + logo contentDescription are literals in LoginScreen; OBPermission labels/descriptions (21 PermissionId entries) are hardcoded English in core/model — they need per-permission string keys (feature_login_perm_{id}_label / _description) resolved in PermissionList, which this enrichment has NOT yet enumerated."
  - id: KG-LOGIN-3
    severity: low
    description: "feature_login_hsbc_brand string is defined but LoginScreen renders the literal \"HSBC\" instead."
  - id: KG-LOGIN-4
    severity: medium
    plan_ref: DEF-007
    status: spec-healed-source-pending   # spec now: authorising_cancel_button + Internal.AuthorisationTimedOut (1200s)
    description: "SOURCE: Authorising has no cancel/timeout — if the PSU abandons the HSBC page the screen spins forever (PendingAuth expires after 1200s but nothing returns the UI to Content)."
  - id: KG-LOGIN-8
    severity: medium
    plan_ref: BLK-002
    status: open
    description: "SOURCE: SplashScreen (cmp-navigation/splash) is a blank white Surface and the Android system splash uses the template ic_launcher_foreground/background — no brand mark, backdrop or intro motion. Blocked on /idea-branding for splash_logo; splash_background / splash_intro follow once the mark exists."
  - id: KG-LOGIN-5
    severity: low
    description: "Retry from Error only reloads the static permission config (back to Content); it does not retry the failed OAuth call."
  - id: KG-LOGIN-6
    severity: low
    description: "AIS consent always requests OBPermission.ALL (20 permissions) — no user scope choice (idea-plan known limitation); Empty state is effectively unreachable because ALL is a non-empty constant."
  - id: KG-LOGIN-7
    severity: low
    description: "Onboarding hero is a code-drawn Compose illustration, not a generated asset — no {id}.gen.yaml provenance; archetype onboarding expects a /idea-feature-stitch-art illustration if a raster/vector asset is wanted."

