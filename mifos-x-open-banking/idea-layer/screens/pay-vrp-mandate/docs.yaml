open_questions:
  note: >-
    Recorded rather than resolved, because each would change a UI decision and none is answerable
    from the corpus. Listed in descending order of how much design rests on the answer.
  questions:
    - question: "Is first-period pro-rating live?"
      why_it_matters: "Decides whether pro_rating_notice can state a figure, and whether the local ledger must model a short first period."
      how_to_settle: "One authorised run: attempt a payment between the pro-rated and headline amounts mid-period."
    - question: "Does a consent-level RemittanceInformation.Reference bind every payment?"
      why_it_matters: "Decides whether the removed create-time reference step was right after all. Only `Unstructured` was ever sent."
      how_to_settle: "One staging call with Reference set. No authorisation needed."
    - question: "How many periodic limits are actually accepted?"
      why_it_matters: "Decides whether the limits step offers a second limit or an unbounded list."
      how_to_settle: "Stage three, then six. TWO is the maximum observed; six is documented."
    - question: "Does this payments token carry VRP rights in production?"
      why_it_matters: "OBIE permits the SCOPE ITSELF to gate sweeping versus non-sweeping, and there is NO DISCOVERY MECHANISM. The app cannot find out except by trying."
      how_to_settle: "Unanswerable in advance by design. The create flow must degrade gracefully on a scope refusal."

status_history:
  - from: null
    to: draft
    at: "2026-08-06"
    by: "/idea-sync — seven-type payments rewrite"
    note: >-
      Brought in scope. 18 scenarios in captures/by-type/vrp.md plus three authorised end-to-end
      runs (flow-vrp-debtor-current, -savings, -bankpick-gm) totalling eight settled payments,
      and a consent-deletion probe.
  - from: draft
    to: enriched
    at: "2026-08-07"
    by: "/idea-sync"
    note: >-
      Propagated the corrected api.yaml into every sibling and bound the screen to the shared
      dtos/ObPaymentError.yaml and dtos/ObPaymentStatus.yaml rather than restating them.

      TWO EXISTING CLAIMS WERE CONTRADICTED AND REMOVED — both had already been corrected in
      api.yaml and were still driving UI, fixtures and tests. (1) The reference-immutability
      constraint: a whole create step, a warning banner, a review row, a persisted field and
      TC-VRP-013 all encoded a rule the corpus refutes for the only field ever tested — per-payment
      remittance is INDEPENDENT of the consent's and the payment's value settles. The create form
      is now 4 steps and the reference moved to the pay sheet. (2) The pro-rated first-period
      figure: ui, demo-data and TC-VRP-012 required the app to print £250 as fact. NO pro-rating
      was ever observed; the figures are documentation. The notice was downgraded to a caution
      with no number.

      ADDED, all UI-consequential: a FOURTH health state `unpayable` for the defining failure —
      consent 45224 reached AUTH, funds-confirmation said "Available", and every payment then
      failed U021, three times, consent AUTH throughout, so a mandate can be simultaneously
      authorised and incapable of paying and health must never be derived from consent status.
      The local periodic-limit LEDGER, because the API exposes no pro-rating, no period window, no
      consumed or remaining amount and no PeriodicLimitsUsed member anywhere, and U014 does not
      name the limit it refused — headroom_list now shows every limit. Per-payment reference
      field. A 30-second settling indicator, legitimate here alone because Expected* are honest on
      this family and stubs on the deferred ones. Evening fraud-window handling with no
      auto-retry. Charges of 0.05 GBP CHAPSOut per payment and none on the mandate. The absent
      redirect link — the app constructs the authorise URL itself. No-expiry: VRP tokens live as
      long as the consent, not the AIS 90 days, so there is no renewal transition anywhere.
      Scheme-not-product eligibility including the bank's own default to a SAVINGS account.
      Error-rendering rules the create form cannot skip — batched same-level errors, parent
      short-circuit, both array notations, and U011's URL Path special-case.

      Six new test scenarios (TC-VRP-014..019); two rewritten. 13 → 19.
    score_rationale: >-
      92. The strongest evidence base of the seven rails — 18 scenarios, three authorised runs,
      eight settled payments, a deletion probe and a cold read — and every sibling now agrees with
      it. Held below the 94 of pay-domestic-single by four honest unknowns rather than by any gap
      in the spec: pro-rating unobserved, Reference untested, the limit ceiling untried, and the
      scope gate undiscoverable by design. No POST /domestic-vrps REQUEST body exists in the
      corpus either, so field placement is inferred from response echoes.
  - from: enriched
    to: designed
    at: "2026-08-07"
    by: "/idea-feature-export"
    exports_produced: [spec_md, api_md, mockup_md, prompts_figma_md, prompts_per_state]
    note: >-
      /idea-feature-export --all, owner-scoped to the ten payment-initiation features. Roundtrip
      verification PASSED on all five checks — state coverage, endpoint coverage, ViewModel
      coverage, forbidden content, and prompt size (7 per-state prompts — the largest state set
      of the ten — all under the 4000-char limit).
