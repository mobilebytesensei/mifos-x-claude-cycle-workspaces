sibling: flow
schema_version: "4.0"
feature_id: accounts

feature: accounts
flow_ref: consumer-banking

entry_points:
  - source: app_shell_bottom_nav
    # Corrected 2026-07-31 (/idea-sync STEP 4): was "order 0", which contradicted
    # design-system/app-shell.yaml#bottom_navigation.items (home 0, accounts 1, pay 2, more 3)
    # and duplicated home's claim on slot 0. APP_FLOW.mmd had reproduced the wrong label
    # verbatim, so the diagram asserted two different screens occupied the same tab slot.
    label: "Accounts tab (bottom-nav order 1)"
  - source: consent-callback
    label: "Successful OAuth callback → land on Accounts"
  - source: back_stack_pop
    label: "Back from account-detail → return to Accounts"

transitions:
  - from: accounts
    to: account-detail
    trigger: "Tap account card"
    params: [accountId]

  - from: accounts
    to: login
    trigger: "401 — access token expired or no active consent"
    guard: "error.code == 401"

  - from: accounts
    to: consent-detail
    trigger: "Tap 'Reconfirm access' in consent_expiring banner"
    params: [consentId]
    guard: "state == consent_expiring"

  - from: accounts
    to: consent-list
    trigger: "403 — consent revoked mid-session"
    guard: "error.code == 403"
