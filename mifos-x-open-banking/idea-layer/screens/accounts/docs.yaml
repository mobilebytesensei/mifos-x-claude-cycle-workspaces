archetype: index_list
# flow_ref backfilled 2026-08-02 (/idea-sync) from flows/*.yaml#screens[] membership.
# accounts appears in TWO flows. account-browsing is primary — accounts is its entry_screen
# and its feature_ref. The consent-expired appearance is a recovery re-entry, recorded below
# rather than dropped, so a reader does not conclude the second edge was missed.
flow_ref: account-browsing
secondary_flow_refs: [consent-expired]
# ── Description corrected 2026-07-30 (/idea-feature-export stale-artifact fix) ──
# Was "Primary bottom-nav anchor (tab order 0)" — Home is order 0, Accounts is 1. The
# multi-currency clause implied a dedicated surface; what ships is list rendering.
description: >-
  Authorised accounts list with a balance preview per account. Accounts tab, bottom-nav order 1
  (Home is 0). Entry point to account-detail. Global Money / Global Wallet accounts render in
  this list under the Current filter — there is deliberately no Global filter chip, because such
  a wallet reports AccountTypeCode CACC and is indistinguishable here from an ordinary current
  account. Shows a consent expiry warning when under 30 days remain.
has_ui: true
has_server: false
# Closed-enum capability declaration (capabilities.registry.json). Drives the
# capability-rule iterator: rules gate on requires_capability ⊆ capabilities.
capabilities: [has_ui, has_api, has_flow]

# ─────────────────────────────────────────────────────────────────────
# Authored 2026-08-02 by /idea-sync (source-truth reverse pass).
# ─────────────────────────────────────────────────────────────────────
# accounts was the only feature of 23 carrying NEITHER nav_callbacks/vm_actions NOR
# test_fixtures. Both are recovered verbatim from source rather than invented:
#   AccountsViewModel.kt:120-126  sealed interface AccountsAction { FilterAccounts, RetryLoad }
#   AccountsScreen.kt:32          onNavigateToAccountDetail is the screen's only nav parameter
# The ViewModel's own KDoc (AccountsViewModel.kt:131) states "Navigation is handled by the
# screen, so no events are emitted" — which is why the outward edge belongs under
# nav_callbacks and NOT under vm_actions. Same split the 2026-08-01 sync applied to
# settings and user-onboarding.
nav_callbacks:
  - signature: "onNavigateToAccountDetail(accountId: String) -> navigates to account-detail"
    source_ref: "feature/accounts/.../AccountsScreen.kt:32"
    note: >-
      The screen's ONLY nav parameter. Dispatched from AccountsContent#onAccountClick.
      Not an Action member and not an Event — the ViewModel's third generic is Nothing.

vm_actions:
  - name: FilterAccounts
    signature: "data class FilterAccounts(val filter: AccountFilter) : AccountsAction"
    source_ref: "feature/accounts/.../ui/AccountsViewModel.kt:122"
    precondition: none
    state_mutations:
      - "filter.value = action.filter — a MutableStateFlow combined into the content stream"
      - "recomputes AccountsData.rows via active.matches(accountSubType); activeFilter echoes back to the chip row"
    side_effects: []
    error_handling: {}
    note: >-
      Client-side only — no API round-trip. AccountFilter is a closed enum of ALL / CURRENT /
      SAVINGS / CREDIT. There is deliberately NO Global entry: HSBC UK Personal AIS v4.0 dropped
      AccountSubType from OBAccount6, so a Global Money account arrives as CACC and is already
      listed under CURRENT; a GLOBAL chip could never match and would render a permanently empty
      list (AccountsViewModel.kt:74-81).
  - name: RetryLoad
    signature: "data object RetryLoad : AccountsAction"
    source_ref: "feature/accounts/.../ui/AccountsViewModel.kt:125"
    precondition: none
    state_mutations:
      - "accountsRepository.refresh() — re-fetches accounts and re-resolves every balance"
    side_effects: []
    error_handling: {}
    note: >-
      Bound twice in AccountsScreen.kt:45,48 — once as ScreenContent's onRetry and once inside
      the error slot's own retry button.

impl_notes:
  # ── CORRECTED 2026-08-02 (/idea-sync source-truth pass) ──
  # This block described a pre-reverse-sync design and contradicted source in five ways. It
  # was invisible to every gate because no shipped check compares impl_notes against source.
  # Each correction is cited; the WAS lines are kept so the drift is auditable, not silently
  # overwritten.
  #   WAS 'BaseViewModel<AccountsState, AccountsEvent, AccountsAction>' -> the third generic is
  #       Nothing (AccountsViewModel.kt:136). No AccountsEvent type exists in source.
  #   WAS a 9-field AccountsState (accounts, filteredAccounts, activeFilter, totalBalanceFormatted,
  #       totalBalanceAccountCount, activeConsentId, consentDaysRemaining, isConsentExpiring,
  #       uiState) -> source declares ONE field (AccountsViewModel.kt:116-118). Everything else
  #       moved into ScreenState<AccountsData>, or was dropped with the consent-expiring surface.
  #   WAS 'UiState ∈ { Loading, Content, ConsentExpiring, Empty, Error(cause) }' -> ConsentExpiring
  #       does not exist. The state was pruned on 2026-07-28 (_strings/strings.yaml:58 records the
  #       matching string sweep) and ui.yaml:109 declares [loading, content, empty, error].
  #   WAS a consent_expiry_check block and a parallelism block -> neither is in the ViewModel.
  #       Balance resolution lives in core/data (AccountsOverviewRepository + BalanceMapper).
  #   WAS navigation listing three edges (account-detail, consent-detail, login) -> the Screen
  #       takes ONE callback (AccountsScreen.kt:32). The other two went with consent_expiring.
  viewmodel: 'AccountsViewModel : BaseViewModel<AccountsState, Nothing, AccountsAction>'
  viewmodel_source_ref: "feature/accounts/.../ui/AccountsViewModel.kt:134-136"
  state_model: |
    data class AccountsState(
      val uiState: ScreenState<AccountsData> = ScreenState.Loading
    )
    // ScreenState is template.core.base.common.screen.ScreenState — the shared stream-first
    // wrapper, NOT a feature-local enum. Its arms drive the four declared ui.yaml states:
    //   Loading -> loading   Content -> content   Empty -> empty
    //   Error / NoNetwork / Unauthenticated -> error
    data class AccountsData(
      val rows: List<AccountRowUi>,
      val activeFilter: AccountFilter
    )
    // AccountRowUi carries pre-formatted strings: the card renders, it does not compute.
  stream_wiring: >-
    init{} collects accountsRepository.overviewState(viewModelScope).combineContent(filter),
    mapping AccountWithBalance -> AccountRowUi. There is no explicit load action — the initial
    fetch is stream collection, which is why vm_actions holds no Load member.
  dto_refs:
    - OBReadAccount6
    - OBReadAccount6Data
    - OBAccount6
    - OBCashAccount3
    - OBReadBalance1
    - OBReadBalance1Data
    - OBCashBalance3
    - OBActiveOrHistoricCurrencyAndAmount
  api_calls:
    - 'GET /accounts → OBReadAccount6 (permission: ReadAccountsDetail)'
    - 'GET /accounts/{AccountId}/balances → OBReadBalance1 (permission: ReadBalances) — parallel per AccountId'
  # parallelism: REMOVED 2026-08-02. The balance fan-out is not in this feature. The ViewModel
  # collects a single repository stream; AccountsOverviewRepository owns any concurrency.
  # consent_expiry_check: REMOVED 2026-08-02 — no such code in source. The consent-expiring
  # surface was pruned 2026-07-28; reconfirmation now lives in consent-detail / consent-list.
  balance_display_rules:
    # Verified against core/data/.../mapper/BalanceMapper.kt:25-36 and
    # feature/accounts/.../ui/AccountsViewModel.kt:46-47,161-176 on 2026-08-02.
    - >-
      Available balance prefers the InterimAvailable row and falls back to the current figure;
      current itself prefers InterimBooked and falls back to the first row, so the card always
      resolves both (BalanceMapper.kt:27-34). Selection happens in core/data, not in this feature.
    - >-
      isBalanceOwed is true when the canonicalised AccountSubType is CreditCard — subtype ALONE
      (AccountsViewModel.kt:172). CORRECTED 2026-08-02: this rule previously read
      "CreditCard + CreditDebitIndicator=Debit". Source never reads CreditDebitIndicator here,
      so a credit card in credit was described as rendering differently than it does.
    - "All other accounts → no owed badge."
    - >-
      GBP renders with the currency symbol via formatMoney(amount, currency); every other
      currency renders as "CODE 250.00" (AccountsViewModel.kt:46-47).
    - "A missing balance renders the em-dash placeholder — (BALANCE_UNAVAILABLE)."
  account_type_icon_map:
    # AccountUiType -> Material icon, verified at components/AccountCard.kt:164-169.
    # Keyed by the normalised AccountUiType enum, not the raw OBIE subtype: canonicalSubtype()
    # (AccountsViewModel.kt:36-43) folds the ISO-20022 codes CACC / SVGS / CCRD onto the same
    # arms, so the bank may populate AccountSubType or only AccountTypeCode.
    CURRENT: AccountBalance
    SAVINGS: Savings
    CREDIT: CreditCard
    GLOBAL_MONEY: Public
    GLOBAL_WALLET: CurrencyExchange
    OTHER: AccountBalanceWallet      # added 2026-08-02 — the map omitted the fallback arm
  navigation:
    # CORRECTED 2026-08-02 — was three edges; source declares one.
    - 'accounts → account-detail (param: accountId) — AccountsScreen.kt:32'
    # REMOVED: 'accounts → consent-detail' and 'accounts → login'. Both belonged to the
    # consent_expiring surface pruned on 2026-07-28. AccountsScreen takes no such callback.
  i18n_keys_prefix: accounts.*
  i18n_keys_file: idea-layer/_strings/strings.yaml

