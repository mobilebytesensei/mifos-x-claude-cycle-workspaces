# Computed aggregate (derived by VM from GBP-denominated accounts):
totalBalanceFormatted: "£15,797.63"
totalBalanceAccountCount: 5

# Consent expiry scenario (used for consent_expiring state demo):
activeConsentId: "aac-7f3b9d2e-1a4c-4f8e-b3d1-9e2a5c6f0d4b"
consentDaysRemaining: 14

# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, empty, error]. The `empty` state had no fixture.
states:
  - scope: content
    accounts: all
    totalBalanceAccountCount: 5
    activeConsentId: "aac-7f3b9d2e-1a4c-4f8e-b3d1-9e2a5c6f0d4b"
    consentDaysRemaining: 14

  - scope: loading
    accounts: all

  - scope: empty
    accounts: []
    totalBalanceAccountCount: 0
    totalBalance: { Amount: "0.00", Currency: "GBP" }
    message: "No accounts shared."
    detail: "The consent you granted does not include any accounts, or they have since been removed."
    cta: "Manage connections"
    _empty_is_a_consent_outcome: >-
      An AISP account list is never empty because the customer has no accounts — it is empty
      because the CONSENT covers none. So the empty state points at consent management rather
      than offering to open an account, and totalBalance must zero with the list or the header
      will state a balance for accounts it is not showing.

  - scope: error
    error_type: AccountsLoadFailed
    message: "Could not load your accounts"
    recovery: "Check your connection and try again."
    recoverable: true
