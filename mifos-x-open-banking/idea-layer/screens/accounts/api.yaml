sibling: api
schema_version: "4.0"
feature_id: accounts

screen_id: accounts

endpoints:
  - id: accounts-list
    method: GET
    path: "/accounts"
    response_dto: BankAccount
    response_dto_path: "Data.Account[]"
    permission: ReadAccountsDetail
    requires_auth: true
    network_policy: cellular_allowed
    notes: "Returns all accounts the PSU authorised. Always the first resource call after consent. Empty Data.Account[] → empty state."
    error_codes:
      - code: 401
        cause: "Access token expired or invalid."
        recovery: "Clear token store → navigate to login."
      - code: 403
        cause: "Consent rejected, revoked, or ReadAccountsDetail permission absent."
        recovery: "Navigate to consent-list for re-authorisation."
      - code: 429
        cause: "HSBC rate-limit exceeded (OBIE mandates 500 calls/5 min PSU limit)."
        recovery: "Exponential back-off + surface retry CTA."
      - code: 503
        cause: "HSBC sandbox unavailable."
        recovery: "Surface retry CTA after brief delay."

  - id: balances
    method: GET
    path: "/accounts/{AccountId}/balances"
    response_dto: AccountBalance
    response_dto_path: "Data.Balance[]"
    permission: ReadBalances
    requires_auth: true
    network_policy: cellular_allowed
    path_params:
      AccountId:
        type: string
        description: "OBAccount6.AccountId — returned from accounts-list."
    notes: >
      Called for each AccountId returned by accounts-list. Parallel fan-out per account
      via coroutineScope async/awaitAll. Balance type preference order: InterimAvailable
      → InterimBooked → OpeningBooked. Multi-currency accounts (GlobalWallet) return
      native currency balance — display as-is without GBP conversion.
    error_codes:
      - code: 401
        cause: "Access token expired."
        recovery: "Mark all accounts as balance_unavailable; surface session-expired error."
      - code: 403
        cause: "ReadBalances permission not granted in consent."
        recovery: "Show account card without balance row; surface advisory chip."
      - code: 404
        cause: "AccountId not found — stale reference (consent revoked mid-session)."
        recovery: "Remove stale account card from list; show snackbar advisory."
