# ─────────────────────────────────────────────────────────────────────────
# REWRITTEN 2026-08-06 by /idea-sync (OBP eviction)
#
# Was obp_my_consents / obp_revoke_consent against
# /obp/v4.0.0/consumers/{consumerId}/consents — the Open Bank Project consent model, which
# listed the consents a CONSUMER (an OBP app registration) had been granted.
#
# THE OBIE MODEL IS DIFFERENT IN KIND, and the difference changes what this screen can honestly
# show. An account-access-consent is one this app itself staged and the PSU approved at the
# bank. There is NO way for a TPP to enumerate consents a PSU has granted to OTHER TPPs — that
# view exists only inside the bank's own app. The screen's old framing ("consents granted to
# third-party apps") promised a list this app cannot obtain.
# ─────────────────────────────────────────────────────────────────────────
api:
  - id: get_consent_status
    endpoint: "GET /obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}"
    auth: "client_credentials token on scope=accounts"
    description: "Status, granted Permissions, expiry and transaction window for THIS app's consent"
    response:
      fields:
        - { name: ConsentId, type: String }
        - name: Status
          type: String
          note: "AWAU | AUTH | Rejected | Revoked | Expired"
        - { name: CreationDateTime, type: String, note: "ISO-8601" }
        - name: StatusUpdateDateTime
          type: String
          note: "Present but UNRELIABLE as a change signal — does not move on AWAU -> AUTH"
        - name: Permissions
          type: "List<String>"
          note: "Approved by the PSU at the bank. NOT editable in this app, and cannot be added to a live consent."
        - { name: ExpirationDateTime, type: String }
        - { name: TransactionFromDateTime, type: String }
        - { name: TransactionToDateTime, type: String }
    errors:
      - { code: 401, message: "Token expired or invalid" }
      - { code: 403, message: "Consent revoked" }

  - id: revoke_consent
    endpoint: "DELETE /obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}"
    auth: "client_credentials token on scope=accounts"
    description: "Revoke. Access stops immediately and the local cache and tokens are cleared."
    path_params:
      - { name: ConsentId, type: String }
    errors:
      - { code: 401, message: "Token expired or invalid" }
      - { code: 404, message: "Consent not found" }

  - id: poll_revocation_events
    endpoint: "POST /obie/open-banking/v4.0/events"
    auth: "client_credentials token"
    description: >-
      Surfaces a consent the PSU revoked at the BANK rather than here. Without it this screen
      finds out only when the next resource call returns 403.
    event_type: "UK.OBIE.Consent-Authorization-Revoked"

consent_model_notes:
  scope_of_visibility: "This app sees ONLY its own consent. Third-party grants are not enumerable under OBIE."
  permissions_not_editable: "Approved on HSBC's portal at consent time. Adding one needs a NEW consent."
  ninety_day_reconfirmation: "Required by UK Open Banking. Lapsing is the designed default, not an error."
  jws_rejection: "The consent CREATE endpoint REJECTS x-jws-signature — the only consent endpoint that does."
  vrp_exemption: >-
    VRP consents are exempt from the 90-day expiry and are managed on pay-vrp-mandate, not here.

removed_operations_2026_08_06:
  - { id: obp_my_consents, was: "GET /obp/v4.0.0/consumers/{consumerId}/consents" }
  - { id: obp_revoke_consent, was: "DELETE /obp/v4.0.0/consumers/{consumerId}/consents/{consentId}" }
  - { concept: "consents granted to third-party apps", reason: "Not visible to a TPP under OBIE." }
  - { field: json_web_token, reason: "OBP consent JWT. No OBIE equivalent on this resource." }
  - { field: consumer_id, reason: "OBP app-registration identifier." }

