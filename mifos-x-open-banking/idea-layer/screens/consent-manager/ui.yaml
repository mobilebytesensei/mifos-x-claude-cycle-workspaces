      color: primary
      font_weight: bold
      padding_horizontal: spacing.md
      padding_top: spacing.md
      padding_bottom: spacing.xs
    a11y:
      label: "Connected Apps screen title"
      role: heading
    test_context:
      tag: consent_title
      assert_text: "Connected Apps"

  - type: text
    id: consent_subtitle
    label: "Manage third-party apps that have access to your account data"
    content: "Manage third-party apps that have access to your account data"
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      padding_horizontal: spacing.md
      padding_bottom: spacing.md
    a11y:
      label: "Manage third-party apps that have access to your account data"
      role: text
    test_context:
      tag: consent_subtitle
      assert_text: "Manage third-party apps that have access to your account data"

