      border_radius: 24
      elevation: 8
      padding_horizontal: 24
      padding_vertical: 28
      margin_horizontal: 32
    a11y:
      label: "Revoke access confirmation dialog"
      role: dialog
    keyboard:
      focusable: true
      shortcuts:
        Escape: dismiss_revoke_dialog
    test_context:
      tag: revoke_confirm_dialog
      assert_visible: false

  - type: text
    id: revoke_dialog_title
    label: "Revoke access?"
    content: "Revoke access?"
    style:
