      role: heading
    test_context:
      tag: revoke_dialog_title
      assert_text: "Revoke access?"

  - type: text
    id: revoke_dialog_body
    label: "This will immediately remove this app's access to your account data. You can reconnect it at any time."
    content: "This will immediately remove this app's access to your account data. You can reconnect it at any time."
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      padding_bottom: spacing.lg
    a11y:
      label: "Revoking will immediately remove this app's access to your account data. You can reconnect it at any time."
      role: text
    test_context:
      tag: revoke_dialog_body
      assert_text: "This will immediately remove this app's access to your account data. You can reconnect it at any time."

  - type: stack
    keyboard:
      focusable: true
    id: revoke_dialog_actions
    label: "Revoke dialog action buttons"
    style:
      orientation: horizontal
      spacing: 12
      justify: flex_end
    a11y:
      label: "Dialog actions"
      role: group
    test_context:
      tag: revoke_dialog_actions

  - type: button
    id: revoke_dialog_cancel_button
    label: "Cancel"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: text
      text_color: primary
      typography: labelLarge
      padding_horizontal: spacing.md
      padding_vertical: 10
    on_click:
      action: dismiss_revoke_dialog
      target: ""
      action_contract:
        effect: transform_state
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Clears the staged revoke target and dismisses the dialog, leaving the consent untouched.
    a11y:
      label: "Cancel, keep app connected"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: revoke_dialog_cancel_button
      assert_text: "Cancel"

  - type: button
    id: revoke_dialog_confirm_button
    label: "Revoke"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: filled
      background: error
      text_color: onError
      typography: labelLarge
      border_radius: 10
      padding_horizontal: spacing.md
      padding_vertical: 10
    on_click:
      action: confirm_revoke_consent
      target: ""
      action_contract:
        effect: delete
        writes_to: [consent-revoke]
        external_library_refs: [ktorfit, "hsbc-obie-ais-v4.0:account-access-consents"]
        description: >-
          Revokes the staged account-access consent through ktorfit against hsbc-obie-
          ais-v4.0:account-access-consents. Irreversible: re-granting requires the full authorise
          round trip, not an undo.
    a11y:
      label: "Confirm revoke access"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: revoke_dialog_confirm_button
      assert_text: "Revoke"

