  - type: box
    id: consent_moneymanager
    label: "MoneyManager Pro consent card"
    content: "MoneyManager Pro consent card"
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: surface
      border_radius: 16
      elevation: 2
      padding_horizontal: 16
      padding_vertical: 16
      border_color: background
      border_width: 1
      margin_horizontal: 20
      margin_bottom: 12
    on_click:
      action: view_consent_detail
      target: ""
      action_contract:
        effect: transform_state
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Opens the consent detail bottom sheet for this connected app, carrying its full scope
          list, grant date and expiry. An overlay on this screen rather than a route change, so
          the consent list keeps its scroll position when the sheet is dismissed.
    a11y:
      label: "MoneyManager Pro. Granted 1 March 2026. Expires 1 March 2027. Access: Read Accounts, View Transactions, Check Balances. Status: Active."
      role: region
    keyboard:
      focusable: true
    test_context:
      tag: consent_moneymanager
      assert_visible: true

