<!doctype html>
<!-- render-hash: cm-error-01 -->
<html lang="en" data-screen="consent-manager" data-state="error" data-feature="consent-manager" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connected Apps — Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--on-primary-container:#004B6F;--secondary:#50606E;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E;--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.error-icon{width:88px;height:88px;border-radius:44px;background:var(--error-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.error-icon .material-icons{font-size:var(--icon-xl);color:var(--error)}
.error-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.error-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;margin-bottom:28px;max-width:280px}
.actions{display:flex;gap:12px}.retry-btn{background:var(--primary);color:var(--on-primary);border:none;border-radius:999px;padding:12px 28px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}.alt-btn{background:transparent;color:var(--primary);border:1px solid var(--outline);border-radius:999px;padding:12px 24px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
[data-theme="light"]{--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--on-primary-container:#004B6F;--secondary:#50606E;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E}[data-theme="dark"]{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--on-primary-container:#C9E6FF;--secondary:#B7C9D9;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198}@media (prefers-color-scheme:dark){:root{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--on-primary-container:#C9E6FF;--secondary:#B7C9D9;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198}}</style>
</head>
<body><div class="top-bar"><span class="material-icons" data-nav-to="settings" tabindex="0" aria-label="Go back">arrow_back</span><h1>Connected Apps</h1></div><main><div class="error-icon"><span class="material-icons">cloud_off</span></div><h2 class="error-title">Unable to load connected apps</h2><p class="error-msg">Check your connection and try again. Your existing consents remain active.</p><div class="actions"><button class="alt-btn" data-nav-to="settings" tabindex="0" aria-label="Go back">Go Back</button><button class="retry-btn" data-action="retry_load_consents" tabindex="0" aria-label="Retry">Retry</button></div></main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
