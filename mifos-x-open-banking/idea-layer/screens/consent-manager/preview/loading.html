<!doctype html>
<!-- render-hash: cm-loading-01 -->
<html lang="en" data-screen="consent-manager" data-state="loading" data-feature="consent-manager" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connected Apps — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#266489;--primary-container:#C9E6FF;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline-variant:#C1C7CE;--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);display:flex;flex-direction:column;min-height:100vh}main{flex:1}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;color:var(--on-background);letter-spacing:-0.2px}
.subtitle-skel{height:14px;width:75%;margin:0 20px 24px;background:var(--surface-variant);border-radius:7px;animation:pulse 1.5s ease-in-out infinite}
.skel-card{margin:0 20px 12px;padding:16px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:16px;display:flex;flex-direction:column;gap:12px}
.skel-row{display:flex;align-items:center;gap:12px}
.skel-logo{width:44px;height:44px;border-radius:12px;background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;flex-shrink:0}
.skel-info{flex:1;display:flex;flex-direction:column;gap:6px}
.skel-line{height:14px;background:var(--surface-variant);border-radius:7px;animation:pulse 1.5s ease-in-out infinite}.skel-line.w70{width:70%}.skel-line.w50{width:50%}.skel-line.w30{width:30%}.skel-line.w90{width:90%}
.skel-badge{width:60px;height:20px;border-radius:999px;background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite}
.skel-chips{display:flex;gap:6px}.skel-chip{height:20px;width:80px;border-radius:8px;background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
[data-theme="light"]{--primary:#266489;--primary-container:#C9E6FF;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline-variant:#C1C7CE}[data-theme="dark"]{--primary:#95CDF7;--primary-container:#004B6F;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline-variant:#41474D}@media (prefers-color-scheme:dark){:root{--primary:#95CDF7;--primary-container:#004B6F;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline-variant:#41474D}}</style>
</head>
<body><main><div class="top-bar"><span class="material-icons">arrow_back</span><h1>Connected Apps</h1></div><div class="subtitle-skel"></div>
<div class="skel-card"><div class="skel-row"><div class="skel-logo"></div><div class="skel-info"><div class="skel-line w70"></div><div class="skel-line w50"></div></div><div class="skel-badge"></div></div><div class="skel-chips"><div class="skel-chip"></div><div class="skel-chip"></div><div class="skel-chip"></div></div></div>
<div class="skel-card"><div class="skel-row"><div class="skel-logo"></div><div class="skel-info"><div class="skel-line w70"></div><div class="skel-line w50"></div></div><div class="skel-badge"></div></div><div class="skel-chips"><div class="skel-chip"></div><div class="skel-chip"></div></div></div>
<div class="skel-card"><div class="skel-row"><div class="skel-logo"></div><div class="skel-info"><div class="skel-line w70"></div><div class="skel-line w50"></div></div><div class="skel-badge"></div></div><div class="skel-chips"><div class="skel-chip"></div></div></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
