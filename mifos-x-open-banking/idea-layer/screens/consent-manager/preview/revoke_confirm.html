<!doctype html>
<!-- render-hash: cm-revokeconfirm-01 -->
<html lang="en" data-screen="consent-manager" data-state="revoke_confirm" data-feature="consent-manager" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Revoke Access?</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--secondary:#50606E;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--on-surface:#181C20;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E;--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:rgba(0,0,0,0.5);display:flex;flex-direction:column;min-height:100vh;align-items:center;justify-content:center;padding:24px}
main{background:var(--surface);border-radius:24px;padding:28px 24px 20px;max-width:340px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
.dialog-icon{width:56px;height:56px;border-radius:28px;background:var(--error-container);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}.dialog-icon .material-icons{font-size:var(--icon-lg);color:var(--error)}
.dialog-title{font-size:20px;font-weight:700;color:var(--on-background);text-align:center;margin-bottom:8px;letter-spacing:-0.1px}
.dialog-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;text-align:center;margin-bottom:8px}
.app-chip{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-variant);border-radius:12px;padding:10px 14px;margin:12px 0 20px}.app-chip .material-icons{font-size:var(--icon-sm);color:var(--on-surface-variant)}.app-chip .name{font-size:13px;font-weight:600;color:var(--on-background)}
.dialog-actions{display:flex;gap:12px;justify-content:flex-end}
.btn-cancel{padding:10px 20px;background:transparent;border:none;color:var(--primary);font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.btn-revoke{padding:10px 22px;background:var(--error);color:var(--on-error);border:none;border-radius:999px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
[data-theme="light"]{--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--secondary:#50606E;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--on-surface:#181C20;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E}[data-theme="dark"]{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--secondary:#B7C9D9;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--on-surface:#E0E3E8;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198}@media (prefers-color-scheme:dark){:root{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--secondary:#B7C9D9;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--on-surface:#E0E3E8;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198}}</style>
</head>
<body><main role="dialog" aria-labelledby="dlg-title" aria-modal="true">
<div class="dialog-icon"><span class="material-icons">link_off</span></div>
<h2 id="dlg-title" class="dialog-title">Revoke access?</h2>
<p class="dialog-msg">This will immediately remove this app's access to your account data. You can reconnect it any time.</p>
<div class="app-chip"><span class="material-icons">account_balance_wallet</span><span class="name">MoneyManager Pro</span></div>
<div class="dialog-actions"><button class="btn-cancel" data-action="dismiss_revoke_dialog" tabindex="0" aria-label="Cancel">Cancel</button><button class="btn-revoke" data-action="confirm_revoke_consent" tabindex="0" aria-label="Confirm revoke">Revoke</button></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
