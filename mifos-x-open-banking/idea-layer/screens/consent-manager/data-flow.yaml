sibling: data-flow
schema_version: "4.0"
feature_id: consent-manager
entries:
  - screen_id: consent-manager
    trigger: on_mount
    endpoints:
      - get_consent_status
    direction: read
    dtos:
      - name: Consent
        role: response
        api_id: get_consent_status
    produces_state: populated
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state

  - screen_id: consent-manager
    trigger: on_interact
    event: RevokeConsentConfirmed
    endpoints:
      - revoke_consent
    direction: write
    dtos:
      - name: Consent
        role: response
        api_id: revoke_consent
    produces_state: populated
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: error_state
