_status_vocabulary: >-
  OBIE account-access-consent Status is one of AWAU (awaiting PSU authorisation), AUTH
  (authorised), RJCT (rejected at the bank) or COND. There is NO revoked and NO expired member:
  a revoked consent is DELETEd and the ConsentId then fails on read, and an expired consent
  stays AUTH while its ExpirationDateTime is in the past. This is a real mismatch with ui.yaml,
  which still renders a `budgetwise_expired_badge` and a REVOKED history row — those need a
  derived predicate, not a status field. Flagged, not resolved here.

_ninety_day_window: >-
  ExpirationDateTime sits 90 days after CreationDateTime on every row, which is the UK Open
  Banking reconfirmation interval. The old fixture used 3- and 6-month windows that no OBIE
  consent can have.

_dropped_fields_2026_08_07: >-
  consumer_id, consumer_name, has_active_token and redirects[] are gone. An
  account-access-consent names no TPP — this app can only ever read its OWN consent, so there
  is no third-party identity in the payload to render. `has_active_token` was a local inference
  that Status already carries.

_revoked_at_removed_2026_08_07: >-
  Previously `_revoked_at_added`: "REVOKED consents carried no revocation timestamp, so a
  History row could state that access ended without saying when." The concern stands, but
  `revoked_at` cannot be sourced — OBIE returns no revocation record. After DELETE the consent
  is simply unreadable, so the app can only stamp the moment it issued the DELETE itself.

revoke_responses:
  - ConsentId: "aac-5d90f31c-6a24-4b87-9e13-a08c47d2b6ef"
    http_status: 204
    body: null
    _note: >-
      DELETE /account-access-consents/{ConsentId} returns 204 with no body. There is no revoked
      consent object to render afterwards — the previous fixture returned one, which does not
      exist.

states:
  - { scope: content,        consents: all }
  - { scope: loading,        consents: all }
  - { scope: populated,      consents: all, note: "cohort-A naming — canonical is `content` (D-3); both declared so the rename is one line" }
  - { scope: empty,          consents: [], note: "this app holds no account-access-consent — staged none, or its own was revoked" }
  - { scope: revoke_confirm, consent: "aac-2b6e04a7-9c15-4f38-8d2a-71be3f0c9a55", note: "destructive-but-reversible — re-authorisation is possible, unlike a payment" }
  - { scope: error,          error_type: ConsentsLoadFailed, message: "Could not load your connected apps", recovery: "Check your connection and try again." }

