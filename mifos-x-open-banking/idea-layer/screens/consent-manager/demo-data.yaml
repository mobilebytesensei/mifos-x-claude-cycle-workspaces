screen_id: consent-manager
_content_policy: >-
  RULE-PROTO-CONTENT-001 — zero placeholders. The shapes below are OBIE account-access-consents:
  ConsentId, an explicit Permissions array approved by the PSU at the bank, Status drawn from
  AWAU/AUTH/RJCT/COND, ExpirationDateTime, and a transaction window.
_source_of_truth: "GET /obie/open-banking/v4.0/aisp/account-access-consents/{ConsentId}"
_rebased_2026_08_07: >-
  RE-BASE OWED (declared 2026-08-06) is now discharged for the field shapes. The fixture was
  Open Bank Project consents — consent_id, consumer_id, json_web_token, has_active_token,
  redirects[], and status INITIATED/ACCEPTED/REVOKED/EXPIRED — none of which exist under OBIE.
  Field names are now OBIE-cased and the status vocabulary is the OBIE one. consumer_id /
  consumer_name / redirects[] are gone: a TPP does not appear in an account-access-consent at
  all, and the app cannot see another TPP's consent to name one.
_scope_correction: >-
  STILL OWED. The old fixture modelled a LIST of consents granted to multiple third parties.
  Under OBIE this app can only ever see its OWN consent — one row, not a list. Three rows are
  retained below ONLY because ui.yaml still declares three hard-coded app cards
  (consent_moneymanager / consent_taxhelper / consent_budgetwise) in its populated and
  revoke_confirm states, and collapsing the fixture without collapsing those leaves the screen
  with nothing to bind. Collapsing both is one change and belongs in ui.yaml's re-base, not here.
_migrated_from: "schema 4.0 content:{obp_my_consents:{items}, obp_revoke_consent:{items}} shape, 2026-08-02 via /idea-data"
_persona: "Field-officer / East Africa half (Safaricom, Equity, NCBA, PesaLink). Intentional — see idea-plan#design_read."

_dd6_violation_fixed: >-
  Every consent in the 4.0 fixture carried a json_web_token ending in the literal string
  "SIGNATURE_PLACEHOLDER" — a DD6 placeholder that the content:{endpoint:{items}} nesting kept
  out of sight. Removed entirely rather than replaced with a fabricated signature: a demo
  fixture must not carry something shaped like a signed bearer token. Nothing in the UI renders
  a JWT — the screen shows consumer, status and validity — so the field was decoration with a
  placeholder inside it. `has_active_token` replaces it, which is the fact the UI actually needs.

