sibling: api
schema_version: "4.0"
feature_id: consent-manager

# ═══════════════════════════════════════════════════════════════════════════
# REWRITTEN 2026-08-06 by /idea-sync (OBP eviction)
#
# Was `GET`/`DELETE /obp/v4.0.0/consumers/{consumerId}/consents` — the Open Bank Project
# consent model, which listed consents granted to a CONSUMER (an OBP app registration).
#
# The OBIE model is different in kind: a consent is an account-access-consent this app itself
# staged, the PSU approved at the bank, and which carries an explicit Permissions array. There
# is no "consents granted to third parties" list — this app can only see its own.
# ═══════════════════════════════════════════════════════════════════════════

base_path: "/obie/open-banking/v4.0/aisp"
api_source_ref: API-001

api:
  - id: get_consent_status
    endpoint: "GET /account-access-consents/{ConsentId}"
    auth: "client_credentials token on scope=accounts"
    description: "Status, granted Permissions, expiry and transaction window for this app's consent."
    response:
      dto: Consent
      status_ladder: "AWAU -> AUTH -> (Rejected | Revoked | Expired)"

  - id: revoke_consent
    endpoint: "DELETE /account-access-consents/{ConsentId}"
    auth: "client_credentials token on scope=accounts"
    description: "Revoke. Access stops immediately and cached data is cleared."

  - id: poll_revocation_events
    endpoint: "POST /obie/open-banking/v4.0/events"
    auth: "client_credentials token"
    description: >-
      Surfaces a consent the PSU revoked at the bank rather than in this app. Without it the
      app finds out only when the next resource call returns 403.
    event_type: "UK.OBIE.Consent-Authorization-Revoked"

consent_model_notes:
  scope_of_visibility: >-
    This app sees ONLY its own consent. OBIE provides no way to enumerate consents a PSU has
    granted to other TPPs — that lives in the bank's own app. The screen's copy must not imply
    otherwise, which the OBP-era version did by listing "consents granted to third-party apps".
  permissions_are_not_editable: >-
    The Permissions array is approved by the PSU on HSBC's portal at consent time. There are no
    in-app permission toggles, and a permission cannot be added to a live consent — that needs
    a new consent.
  ninety_day_reconfirmation: >-
    UK Open Banking requires the PSU to reconfirm an account-access consent every 90 days.
    Lapsing is not an error state; it is the designed default.
  jws_rejection: >-
    The consent CREATE endpoint is the one consent endpoint that REJECTS x-jws-signature
    (UK.OBIE.Header.Unexpected). Detached JWS is for PISP writes only.
  vrp_exemption: >-
    VRP consents are explicitly exempt from the 90-day expiry — "unlike AIS consents, VRP access
    tokens should not be set to expire at 90 days" — and are managed on the VRP mandate screen,
    not here.

removed_2026_08_06:
  - { operation: obp_my_consents, was: "GET /obp/v4.0.0/consumers/{consumerId}/consents", reason: "OBP consumer-scoped consent list." }
  - { operation: obp_revoke_consent, was: "DELETE /obp/v4.0.0/consumers/{consumerId}/consents/{consentId}", reason: "Same." }
  - { concept: "consents granted to third-party apps", reason: "Not visible to a TPP under OBIE. Only this app's own consent is readable." }
