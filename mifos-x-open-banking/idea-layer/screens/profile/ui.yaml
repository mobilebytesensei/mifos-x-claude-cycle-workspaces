screens:
  - id: profile
    name: "Profile"
    viewmodel: "ProfileViewModel"

archetype: profile

components:
  - type: stack
    id: profile_root
    variant: vertical
    style:
      background: background
      padding: spacing.lg
    children:
      - profile_avatar_section
      - profile_form_section
      - profile_change_password_button
      - profile_logout_button

  - type: stack
    id: profile_avatar_section
    variant: vertical
    style:
      alignment: center
      padding_bottom: spacing.xl
    children:
      - profile_avatar_initials
      - profile_avatar_edit_icon
      - profile_display_name

  - type: box
    id: profile_avatar_initials
    content: "AW"   # DR-1: was "MS" (Maria Santos) while demo-data resolves Amina Wanjiru. demo-data is SoT for data_driven fields.
    style:
      width: "96dp"
      height: "96dp"
      shape: circle
      border_color: primary
      border_width: "2dp"
      background: primaryContainer
      typography: headlineMedium
      font_weight: 700
      color: primary
      alignment: center
    a11y:
      role: image
      label: "Your profile initials"
    test_context:
      purpose: "Initials avatar — shipped renders a circular primaryContainer box with up to two uppercase initials from the display name (initialsOf). No profile photo; there is no image fetch."
      interaction_type: display
      data_driven: true

  - type: icon
    id: profile_avatar_edit_icon
    content: "edit"
    variant: filled
    style:
      background: primary
      color: onPrimary
      size: "32dp"
      offset: "{ x: 2dp, y: 2dp }"
    a11y:
      role: image
      label: "Edit"
    test_context:
      purpose: "Decorative edit badge overlaid on the initials avatar (contentDescription 'Change profile photo'). NOT interactive in shipped — no photo picker is wired."
      interaction_type: display
      data_driven: false

  - type: text
    id: profile_display_name
    content: "amina.wanjiru"   # DR-1: was "Maria Santos". displayName is username per shipped ProfileContent.displayName; demo-data resolves usr-amina-wanjiru-ke-001.
    variant: title_large
    style:
      typography: titleLarge
      color: primary
      font_weight: 600
      alignment: center
      padding_top: spacing.sm
    a11y:
      role: heading
      label: "Profile name"
    test_context:
      purpose: "Display name — shipped uses ProfileContent.displayName (username, or email local-part when username is blank). Real data, not placeholder."
      interaction_type: display
      data_driven: true

  - type: stack
    id: profile_form_section
    variant: vertical
    style:
      background: surface
      border_radius: "12dp"
      padding: spacing.lg
      margin_bottom: spacing.md
    children:
      - profile_section_header
      - profile_full_name_field
      - profile_email_field
      - profile_phone_field

  - type: text
    id: profile_section_header
    content: "Personal Information"
    variant: title_medium
    style:
      typography: titleMedium
      color: primary
      font_weight: 600
      padding_bottom: spacing.md
    a11y:
      role: heading
      label: "Personal Information section"
    test_context:
      purpose: "Section header above the read-only profile fields"
      interaction_type: display
      data_driven: false

  - type: input
    keyboard:
      focusable: false   # disabled read-only field — must not be a tab stop
    id: profile_full_name_field
    label: "Full Name"
    variant: text
    supported_states: [disabled]
    style:
      background: surface
      typography: bodyLarge
      border_color: outline  # A11Y-002 / WCAG 1.4.11: a control's boundary needs 3.0. outlineVariant is 1.62:1; outline is 4.24:1 and is what form.field.outline_default declares.
      padding: spacing.md
      margin_bottom: spacing.md
    prefill: "fullName"
    a11y:
      role: textbox
      label: "Full Name"
      label_source: visible_label
    test_context:
      purpose: "READ-ONLY full name. Shipped renders a disabled OutlinedTextField bound to ProfileContent.fullName — no editing, no save."
      interaction_type: display
      data_driven: true

  - type: input
    keyboard:
      focusable: false   # disabled read-only field — must not be a tab stop
    id: profile_email_field
    label: "Email Address"
    variant: email
    supported_states: [disabled]
    style:
      background: surface
      typography: bodyLarge
      border_color: outline  # A11Y-002 / WCAG 1.4.11: a control's boundary needs 3.0. outlineVariant is 1.62:1; outline is 4.24:1 and is what form.field.outline_default declares.
      padding: spacing.md
      margin_bottom: spacing.md
    prefill: "email"
    a11y:
      role: textbox
      label: "Email Address"
      label_source: visible_label
    test_context:
      purpose: "READ-ONLY email. Disabled OutlinedTextField bound to ProfileContent.email."
      interaction_type: display
      data_driven: true

  - type: input
    keyboard:
      focusable: false   # disabled read-only field — must not be a tab stop
    id: profile_phone_field
    label: "Phone Number"
    variant: text
    supported_states: [disabled]
    style:
      background: surface
      typography: bodyLarge
      border_color: outline  # A11Y-002 / WCAG 1.4.11: a control's boundary needs 3.0. outlineVariant is 1.62:1; outline is 4.24:1 and is what form.field.outline_default declares.
      padding: spacing.md
    prefill: "phone"
    a11y:
      role: textbox
      label: "Phone Number"
      label_source: visible_label
    test_context:
      purpose: "READ-ONLY phone. Disabled OutlinedTextField bound to ProfileContent.phone, which is hardcoded blank \"\" — the screen has no bound source for a phone number. Renders empty."
      interaction_type: display
      data_driven: true

  - type: button
    keyboard:
      focusable: false   # enabled: false until the change-password screen ships — not a tab stop while disabled
    id: profile_change_password_button
    label: "Change Password"
    variant: outlined
    enabled: false
    disabled_until: "change-password screen implemented"
    supported_states: [disabled]
    style:
      border_color: primary
      typography: labelLarge
      color: primary
      font_weight: 600
      border_radius: "8dp"
      padding: spacing.md
      width: "match_parent"
      margin_top: spacing.lg
    a11y:
      role: button
      label: "Change Password (not yet available)"
    test_context:
      purpose: "Shipped renders this OutlinedButton DISABLED (enabled = false) with an empty onClick — change-password is not built. Marked deferred; kept so the spec reflects the visible (disabled) control."
      interaction_type: display
      data_driven: false

  - type: button
    id: profile_logout_button
    label: "Log Out"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      typography: labelLarge
      color: error
      font_weight: 600
      padding: spacing.md
      width: "match_parent"
      margin_top: spacing.md
    on_click:
      action: logout
      action_contract:
        effect: delete
        writes_to: ["session.credentials", "session.consentIds"]
        external_library_refs: ["encrypted-shared-preferences"]
        description: >-
          Clears the stored session and consent identifiers from encrypted-shared-preferences and
          returns to the unauthenticated entry point. Local credential material only — the bank-side
          consent survives and must be revoked separately from consent-manager.
    a11y:
      role: button
      label: "Log out of your account"
    keyboard:
      focusable: true
    test_context:
      purpose: "Calls ProfileViewModel.onLogout() → UserDataRepository.setIsAuthenticated(false). REACTIVE: RootNavViewModel observes userData and routes back to auth. The screen does NOT navigate to login imperatively."
      interaction_type: action
      data_driven: false

  # ── Error state ──────────────────────────────────────────────────────────────

  - type: icon
    id: profile_error_icon
    content: "error_outline"
    variant: default
    style:
      color: error
      size: "40dp"
      alignment: center
    a11y:
      role: image
      label: "Error"
    test_context:
      purpose: "Error icon shown in the full-screen ProfileError state"
      interaction_type: display
      data_driven: false

  - type: text
    id: profile_error_title
    content: "Could not load your profile"
    variant: title_medium
    style:
      typography: titleMedium
      color: onSurface
      alignment: center
    a11y:
      role: heading
      label: "Could not load your profile"
    test_context:
      purpose: "Headline of the Profile error state (ScreenState.Error)"
      interaction_type: display
      data_driven: false

  - type: text
    id: profile_error_body
    content: "Check your connection and try again."
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      alignment: center
    a11y:
      role: text
      label: "Check your connection and try again."
    test_context:
      purpose: "Supporting copy in the Profile error state"
      interaction_type: display
      data_driven: false

  - type: button
    id: profile_error_retry_button
    label: "Retry"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      typography: labelLarge
      color: primary
      alignment: center
    on_click:
      action: retry
      action_contract:
        effect: call_api
        reads_from: ["party"]
        external_library_refs: [ktorfit, "hsbc-obie-ais-v4.0:party"]
        description: >-
          Re-fetches the account-holder profile through ktorfit against hsbc-obie-ais-v4.0:party after
          a failed load.
    a11y:
      role: button
      label: "Retry loading your profile"
    keyboard:
      focusable: true
    test_context:
      purpose: "Calls ProfileViewModel.onRetry() to reload the profile after a network error"
      interaction_type: action
      data_driven: false

  - type: loading_indicator
    id: profile_loading_spinner
    variant: spinner
    style:
      color: primary
      size: "40dp"
      alignment: center
    a11y:
      role: progressbar
      label: "Loading your profile"
    test_context:
      purpose: "Centered CircularProgressIndicator shown while the profile loads (ScreenState.Loading)"
      interaction_type: display
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [profile_loading_spinner]
    note: "ScreenState.Loading — centered CircularProgressIndicator while the profile fetches."
  content:
    layout: { type: column, padding: spacing.lg }
    visible_components: [profile_avatar_section, profile_form_section, profile_change_password_button, profile_logout_button]
    note: "ScreenState.Content — read-only profile: initials avatar, display name, three disabled fields, disabled Change Password, Log Out."
  error:
    layout: { type: column, padding: spacing.lg, align: center, justify: center }
    visible_components: [profile_error_icon, profile_error_title, profile_error_body, profile_error_retry_button]
    note: "ScreenState.Error — full-screen error with Retry (onRetry)."

state_model:
  ProfileViewModel:
    screen_state: "ScreenState<ProfileContent>"
    content_type: ProfileContent
    content_fields:
      - field: displayName
        type: String
        note: "username, or email local-part when username is blank"
      - field: initials
        type: String
        note: "up to two uppercase initials from displayName (initialsOf)"
      - field: fullName
        type: String
        note: "same as displayName in shipped — bound to the read-only Full Name field"
      - field: email
        type: String
      - field: phone
        type: String
        note: "hardcoded blank \"\" — the screen has no bound source for a phone number"
    state_wrapper:
      type: "ScreenState<ProfileContent>"
      variants: [Loading, "Content(ProfileContent, DataFreshness)", "Error(throwable, isNetworkError)"]
    actions:
      - "onRetry() — reloads the profile (load())"
      - "onLogout() — UserDataRepository.setIsAuthenticated(false); routing is reactive via RootNavViewModel"
    di: [ProfileRepository, UserDataRepository]
    base: "androidx.lifecycle.ViewModel (exposes StateFlow<ScreenState<ProfileContent>>)"
    note: "READ-ONLY screen. No editing, no save, no avatar upload. Logout is reactive — RootNavViewModel observes UserDataRepository.userData and routes to the auth graph; the screen never navigates to login imperatively. There is no write path at all: the OBP-era ProfileApi.updateCurrentUser was struck on 2026-08-06 and OBIE party data is read-only, so no write endpoint exists to consume."

navigation:
  - id: profile_logout_reactive
    trigger: on_logout_clicked
    note: "No imperative navigation. onLogout() flips UserDataRepository.setIsAuthenticated(false); RootNavViewModel observes the session and routes back to the auth graph. change-password is NOT reachable — its button is rendered disabled."

# ═══════════════════════════════════════════════════════════════════════════
# ⚠ NO API — FLAGGED 2026-08-06 by /idea-sync (OBP eviction)
#
# This block declared obp_get_user_profile (GET /obp/v4.0.0/users/current) and
# obp_update_user_profile (PUT). Both returned an Open Bank Project USER: a DirectLogin
# username, a user_id, and editable profile fields.
#
# THERE IS NO USER UNDER OBIE. This app has no account, no username, no password and no
# profile of its own. The PSU is identified solely by the consent they granted at their bank.
# The `username` field in particular has no possible source — the app never learns one.
#
# The nearest OBIE concept is the ACCOUNT HOLDER, read from
# GET /aisp/accounts/{AccountId}/party under the ReadParty permission — and that is already a
# separate, shipped screen (`account-holder`). It is read-only; OBIE has no party write, so
# obp_update_user_profile has no counterpart either.
#
# DECISION OWED: this screen is OBP-era, has no OBIE data source, and its function is already
# covered by account-holder. It is a deletion candidate in the same class as fx-rates and the
# four features removed this pass. Not deleted here because it was not in that decision's
# scope. Until then it renders no data, because there is none to render.
# ═══════════════════════════════════════════════════════════════════════════
api: []
status: orphaned-pending-decision

obie_equivalent:
  screen: account-holder
  endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/party"
  permission: [ReadParty]
  writable: false
  fields_available: [Name, EmailAddress, Mobile, Address]
  availability_note: >-
    400 on Global Money, and one of the five resources gated by SCA recency — returns 403 with
    an empty body on a stale-SCA token.

removed_operations_2026_08_06:
  - { id: obp_get_user_profile, was: "GET /obp/v4.0.0/users/current", reason: "No user concept under OBIE." }
  - { id: obp_update_user_profile, was: "PUT /obp/v4.0.0/users/current", reason: "No user concept, and party data is read-only." }
  - { dto: UserProfile, reason: "Deleted — carried a DirectLogin username and an obp_consumer_key provider field." }

dependencies:
  tier: feature
  features: [shared-core]
  removed_2026_08_06:
    - { feature: obp-auth, reason: "The Open Bank Project auth module. Authentication is FAPI OAuth against HSBC." }
