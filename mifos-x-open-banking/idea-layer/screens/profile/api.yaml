sibling: api
schema_version: "4.0"
feature_id: profile

# ═══════════════════════════════════════════════════════════════════════════
# ⚠ FLAGGED 2026-08-06 by /idea-sync (OBP eviction) — NOT REWRITTEN, because there is
#   nothing to rewrite it TO.
#
# Was `obp_get_user_profile` / `obp_update_user_profile` on
# `GET`/`PUT /obp/v4.0.0/users/current`. That endpoint returned an Open Bank Project USER —
# a DirectLogin username, an `obp_consumer_key` provider identifier, and editable profile
# fields.
#
# THERE IS NO USER UNDER OBIE. This app has no account, no username, no password and no
# profile of its own. The PSU is identified only by the consent they granted at their bank.
#
# The nearest OBIE concept is the ACCOUNT HOLDER, read from `/aisp/accounts/{AccountId}/party`
# and gated by the ReadParty permission — and that is already a separate, shipped screen
# (`account-holder`). It is read-only: OBIE provides no write side for party data.
#
# DECISION OWED: `profile` is OBP-era with no OBIE data source and a shipped OBIE equivalent
# already in place. It is a deletion candidate in the same class as the four features removed
# this pass (sca-challenge, change-password, forgot-password, transaction-tags), but it was not
# in that decision's scope and is left standing pending a call.
# ═══════════════════════════════════════════════════════════════════════════

status: orphaned-pending-decision
api: []

obie_equivalent:
  screen: account-holder
  endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/party"
  permission: [ReadParty]
  writable: false
  availability_note: "400 on Global Money. Also one of the five resources gated by SCA recency — returns 403 with an empty body on a stale-SCA token."

removed_2026_08_06:
  - { operation: obp_get_user_profile, was: "GET /obp/v4.0.0/users/current", reason: "No user concept under OBIE." }
  - { operation: obp_update_user_profile, was: "PUT /obp/v4.0.0/users/current", reason: "No user concept, and party data is read-only." }
  - { dto: UserProfile, reason: "Deleted — carried a DirectLogin username and an obp_consumer_key provider field." }
