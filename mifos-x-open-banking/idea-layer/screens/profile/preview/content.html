<!doctype html>
<!-- render-hash: cfb3442584e9 -->
<html lang="en" data-screen="profile" data-state="content" data-feature="profile" data-flavor="shared">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile — Mifos X Open Banking</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    :root {
      --primary: #266489; --on-primary: #FFFFFF; --primary-container: #C9E6FF; --on-primary-container: #004B6F;
      --secondary: #50606E; --on-secondary: #FFFFFF; --secondary-container: #D3E5F5; --on-secondary-container: #384956;
      --tertiary: #64597B; --on-tertiary: #FFFFFF; --tertiary-container: #EADDFF; --on-tertiary-container: #4C4162;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #93000A;
      --background: #F7F9FF; --on-background: #181C20;
      --surface: #F7F9FF; --on-surface: #181C20;
      --surface-variant: #DDE3EA; --on-surface-variant: #41474D;
      --surface-container-lowest: #FFFFFF; --surface-container-low: #F1F4F9; --surface-container: #EBEEF3;
      --surface-container-high: #E5E8ED; --surface-container-highest: #E0E3E8;
      --outline: #72787E; --outline-variant: #C1C7CE; --scrim: #000000;
      --font-body: 'Roboto', system-ui, sans-serif; --font-mono: 'Roboto Mono', ui-monospace, monospace;
      --fs-headline-medium: 28px; --fs-title-large: 22px; --fs-title-medium: 16px;
      --fs-body-large: 16px; --fs-body-medium: 14px; --fs-body-small: 12px; --fs-label-large: 14px;
      --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px;
      --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-full: 9999px;
      --el-0: none;
      --el-1: 0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
      --el-2: 0 1px 2px rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);
      --el-3: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.30);
      --icon-sm: 20px; --icon-md: 24px; --icon-lg: 32px;
      --touch-min: 48px; --opacity-disabled: .38;
    }
    :root[data-theme="light"] {
      --primary: #266489; --on-primary: #FFFFFF; --primary-container: #C9E6FF; --on-primary-container: #004B6F;
      --secondary: #50606E; --on-secondary: #FFFFFF; --secondary-container: #D3E5F5; --on-secondary-container: #384956;
      --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #93000A;
      --background: #F7F9FF; --on-background: #181C20; --surface: #F7F9FF; --on-surface: #181C20;
      --surface-variant: #DDE3EA; --on-surface-variant: #41474D;
      --surface-container-low: #F1F4F9; --surface-container: #EBEEF3; --surface-container-high: #E5E8ED;
      --outline: #72787E; --outline-variant: #C1C7CE;
    }
    :root[data-theme="dark"] {
      --primary: #95CDF7; --on-primary: #00344E; --primary-container: #004B6F; --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9; --on-secondary: #22323F; --secondary-container: #384956; --on-secondary-container: #D3E5F5;
      --tertiary: #CFC0E8; --on-tertiary: #352B4B; --tertiary-container: #4C4162; --on-tertiary-container: #EADDFF;
      --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
      --background: #101417; --on-background: #E0E3E8; --surface: #101417; --on-surface: #E0E3E8;
      --surface-variant: #41474D; --on-surface-variant: #C1C7CE;
      --surface-container-lowest: #0B0F12; --surface-container-low: #181C20; --surface-container: #1C2024;
      --surface-container-high: #262A2E; --surface-container-highest: #313539;
      --outline: #8B9198; --outline-variant: #41474D;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #95CDF7; --on-primary: #00344E; --primary-container: #004B6F; --on-primary-container: #C9E6FF;
        --secondary: #B7C9D9; --on-secondary: #22323F; --secondary-container: #384956; --on-secondary-container: #D3E5F5;
        --tertiary: #CFC0E8; --on-tertiary: #352B4B; --tertiary-container: #4C4162; --on-tertiary-container: #EADDFF;
        --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
        --background: #101417; --on-background: #E0E3E8; --surface: #101417; --on-surface: #E0E3E8;
        --surface-variant: #41474D; --on-surface-variant: #C1C7CE;
        --surface-container-lowest: #0B0F12; --surface-container-low: #181C20; --surface-container: #1C2024;
        --surface-container-high: #262A2E; --surface-container-highest: #313539;
        --outline: #8B9198; --outline-variant: #41474D;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: var(--font-body); background: var(--background); color: var(--on-surface);
      display: flex; flex-direction: column; min-height: 100vh; -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    .topbar {
      display: flex; align-items: center; gap: var(--sp-sm);
      padding: var(--sp-sm) var(--sp-sm) var(--sp-sm) var(--sp-xs);
      padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
      background: var(--surface); color: var(--on-surface);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar .nav-icon {
      width: var(--touch-min); height: var(--touch-min); border: 0; background: none; cursor: pointer;
      color: var(--on-surface); display: flex; align-items: center; justify-content: center;
      border-radius: var(--r-full); font-family: var(--font-body);
    }
    .topbar .nav-icon .material-symbols-outlined { font-size: var(--icon-md); }
    .topbar h1 { font-size: var(--fs-title-large); font-weight: 400; color: var(--on-surface); }

    main { flex: 1; display: flex; flex-direction: column; padding: var(--sp-lg) var(--sp-lg) calc(var(--sp-xl) * 2); }

    .avatar-section { display: flex; flex-direction: column; align-items: center; padding-bottom: var(--sp-xl); }
    .avatar-wrap { position: relative; width: 96px; height: 96px; }
    .avatar-initials {
      width: 96px; height: 96px; border-radius: var(--r-full);
      background: var(--primary-container); color: var(--primary); border: 2px solid var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-headline-medium); font-weight: 700; letter-spacing: .5px;
      box-shadow: var(--el-1);
    }
    .avatar-edit {
      position: absolute; right: -2px; bottom: -2px; width: var(--sp-xl); height: var(--sp-xl);
      border-radius: var(--r-full); background: var(--primary); color: var(--on-primary);
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--el-2); border: 2px solid var(--background);
    }
    .avatar-edit .material-symbols-outlined { font-size: var(--icon-sm); }
    .display-name {
      font-size: var(--fs-title-large); font-weight: 600; color: var(--primary);
      padding-top: var(--sp-sm); text-align: center;
    }

    .form-card {
      background: var(--surface-container-low); border-radius: var(--r-md);
      padding: var(--sp-lg); margin-bottom: var(--sp-md); box-shadow: var(--el-1);
    }
    .section-header {
      font-size: var(--fs-title-medium); font-weight: 600; color: var(--primary);
      padding-bottom: var(--sp-md);
    }
    .field { margin-bottom: var(--sp-md); }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block; font-size: var(--fs-body-small); font-weight: 500;
      color: var(--on-surface-variant); margin-bottom: var(--sp-xs);
    }
    .field .control {
      display: flex; align-items: center; min-height: 56px;
      background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-sm);
      padding: var(--sp-md); font-size: var(--fs-body-large); color: var(--on-surface);
      opacity: var(--opacity-disabled); cursor: not-allowed;
    }
    .field .control.is-empty { color: var(--on-surface-variant); font-style: italic; }
    .field .control .value { font-family: var(--font-mono); font-size: var(--fs-body-medium); }

    .btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: var(--touch-min); font-family: var(--font-body);
      font-size: var(--fs-label-large); font-weight: 600; border-radius: var(--r-sm);
      padding: var(--sp-md); cursor: pointer;
    }
    .btn-outlined {
      background: transparent; color: var(--primary);
      border: 1px solid var(--primary); margin-top: var(--sp-lg);
    }
    .btn-outlined[disabled] { opacity: var(--opacity-disabled); cursor: not-allowed; }
    .btn-text { background: transparent; color: var(--error); border: 0; margin-top: var(--sp-md); }
    .btn-text:hover { background: var(--error-container); color: var(--on-error-container); }

    .bottom-nav {
      position: sticky; bottom: 0; margin-top: auto; display: flex;
      background: var(--surface-container); box-shadow: var(--el-2);
      padding: var(--sp-xs) 0 calc(var(--sp-xs) + env(safe-area-inset-bottom, 8px));
    }
    .bottom-nav a {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-height: var(--touch-min); padding: var(--sp-xs) 0; text-decoration: none;
      color: var(--on-surface-variant); font-size: var(--fs-body-small); font-weight: 500; cursor: pointer;
    }
    .bottom-nav a[data-nav-selected="true"] { color: var(--primary); }
    .bottom-nav a[data-nav-selected="true"] .material-symbols-outlined {
      background: var(--secondary-container); color: var(--on-secondary-container);
      border-radius: var(--r-full); padding: 2px var(--sp-md);
    }
    .bottom-nav .material-symbols-outlined { font-size: var(--icon-md); }
  </style>
</head>
<body>
<div data-shell="root" data-screen-id="profile" data-state="content" data-component-type="LayoutBox" data-component-id="shell_root">

  <header class="topbar" data-shell="top-app-bar" data-variant="small" data-component-type="app_bar" data-component-id="shell_top_app_bar">
    <button class="nav-icon" aria-label="Back" role="button" data-component-type="icon_button" data-component-id="shell_nav_back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1>User Profile</h1>
  </header>

  <main data-shell="content" data-state="content" data-component-type="stack" data-component-variant="column" data-component-id="profile_root">

    <section class="avatar-section" data-component-type="stack" data-component-variant="column" data-component-id="profile_avatar_section">
      <div class="avatar-wrap">
        <div class="avatar-initials" role="img" aria-label="Your profile initials"
             data-component-type="box" data-component-id="profile_avatar_initials">AW</div>
        <div class="avatar-edit" role="img" aria-label="Edit"
             data-component-type="icon" data-component-variant="filled" data-component-id="profile_avatar_edit_icon">
          <span class="material-symbols-outlined" aria-hidden="true">edit</span>
        </div>
      </div>
      <h2 class="display-name" role="heading" aria-level="2"
          data-component-type="text" data-component-variant="title_large" data-component-id="profile_display_name">amina.wanjiru</h2>
    </section>

    <section class="form-card" data-component-type="stack" data-component-variant="column" data-component-id="profile_form_section">
      <h3 class="section-header" role="heading" aria-level="3"
          data-component-type="text" data-component-variant="title_medium" data-component-id="profile_section_header">Personal Information</h3>

      <div class="field" data-component-type="input" data-component-variant="text" data-component-id="profile_full_name_field">
        <label for="fld-fullname">Full Name</label>
        <div class="control" id="fld-fullname" role="textbox" aria-label="Full Name" aria-readonly="true" aria-disabled="true">Amina Wanjiru</div>
      </div>

      <div class="field" data-component-type="input" data-component-variant="email" data-component-id="profile_email_field">
        <label for="fld-email">Email Address</label>
        <div class="control" id="fld-email" role="textbox" aria-label="Email Address" aria-readonly="true" aria-disabled="true">
          <span class="value">amina.wanjiru@gmail.com</span>
        </div>
      </div>

      <div class="field" data-component-type="input" data-component-variant="text" data-component-id="profile_phone_field">
        <label for="fld-phone">Phone Number</label>
        <div class="control is-empty" id="fld-phone" role="textbox" aria-label="Phone Number" aria-readonly="true" aria-disabled="true">Not provided</div>
      </div>
    </section>

    <button class="btn btn-outlined" disabled aria-label="Change Password (not yet available)" role="button"
            data-component-type="button" data-component-variant="outlined" data-component-id="profile_change_password_button">Change Password</button>

    <button class="btn btn-text" role="button" aria-label="Log out of your account"
            data-component-type="button" data-component-variant="text" data-component-id="profile_logout_button"
            data-action="logout">Log Out</button>

  </main>

  <nav class="bottom-nav" data-shell="bottom-nav" data-shell-source="app-shell.yaml"
       data-component-type="bottom_nav" data-component-id="shell_bottom_nav" aria-label="Primary">
    <a data-nav-item="home" data-nav-to="home" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>Home</a>
    <a data-nav-item="accounts" data-nav-to="accounts" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0">
      <span class="material-symbols-outlined" aria-hidden="true">account_balance</span>Accounts</a>
    <a data-nav-item="pay" data-nav-to="send-money" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0">
      <span class="material-symbols-outlined" aria-hidden="true">payments</span>Pay</a>
    <a data-nav-item="more" data-nav-to="settings" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0">
      <span class="material-symbols-outlined" aria-hidden="true">more_horiz</span>More</a>
  </nav>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
