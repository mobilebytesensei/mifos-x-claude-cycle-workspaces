sibling: demo-data
schema_version: "2.1.0"
feature_id: profile

screen_id: profile
_content_policy: >-
  RULE-PROTO-CONTENT-001 — zero placeholders. These fixtures are UNBOUND: they populate the
  ProfileContent shape the screen renders, not the response of any endpoint. There is no
  endpoint — see api.yaml `api: []` and the DECISION OWED recorded there.
_migrated_from: "schema 4.0 content:{endpoint:{item}} shape, 2026-08-02 via /idea-data"
_unbound_2026_08_07: >-
  Previously declared as "real OBP UserProfile data" returned by
  GET /obp/v4.0.0/users/current. That operation was struck from api.yaml on 2026-08-06 and
  there is NO OBIE user resource to re-source it from. The values are kept because the screen
  still declares the ProfileContent fields and the preview needs something coherent to render,
  but nothing here is fetched and nothing here is a contract. `user_id` and `username` in
  particular are OBP-era carriers with no OBIE origin at all — the app never learns a username.
  The nearest real source is the ACCOUNT HOLDER party record
  (GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/party), which is already fixtured and
  rendered by the shipped `account-holder` screen. It is deliberately NOT re-sourced here:
  doing so would make `profile` a duplicate of `account-holder` and pre-empt the DECISION OWED.

# The ProfileScreen shape is READ-ONLY: initials avatar, display name, three display-only
# fields, no save. One subject, not a collection.

user_profile:
  - user_id: "usr-amina-wanjiru-ke-001"
    username: "amina.wanjiru"
    email: "amina.wanjiru@gmail.com"
    full_name: "Amina Wanjiru"
    display_name: "amina.wanjiru"
    initials: "AW"
    phone: ""

_display_name_rule: >-
  display_name is username, falling back to the email local-part when username is blank —
  this mirrors shipped ProfileContent.displayName exactly. initials come from initialsOf(),
  which is why AW and not A.

_phone_is_deliberately_blank: >-
  The screen has no bound source for a phone number. ProfileContent.phone is hardcoded ""
  and the field renders empty rather than fabricating a value. (The party record DOES carry
  a Mobile field, but this screen is not bound to party — see _unbound_2026_08_07.)

_write_fixture_removed_2026_08_07: >-
  A `update_profile_request` fixture stood here, carrying the payload the DEFERRED
  PUT /obp/v4.0.0/users/current would have sent (user_id, email, phone_number "+254722334455").
  Removed: OBIE party data is read-only, so there is no write endpoint to defer and no shape
  for a fixture to return to. Keeping it would have implied a write path that cannot exist.

states:
  - scope: content
    user: "usr-amina-wanjiru-ke-001"
  - scope: error
    error_type: ProfileLoadFailed
    message: "Could not load your profile"
    recovery: "Check your connection and try again."

