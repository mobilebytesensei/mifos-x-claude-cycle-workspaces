sibling: data-flow
schema_version: "4.0"
feature_id: profile

# ═══════════════════════════════════════════════════════════════════════════
# ⚠ UNRESOLVED 2026-08-07 by /idea-sync (OBP eviction follow-up) — NOT REBOUND.
#
# These entries were the LAST live bindings to `obp_get_user_profile` /
# `obp_update_user_profile` (`GET`/`PUT /obp/v4.0.0/users/current`) anywhere in the
# screens tree. Both operations were struck from api.yaml on 2026-08-06 — see
# `api.yaml#removed_2026_08_06` — so these bindings pointed at operations that no
# longer exist.
#
# THERE IS NO USER RESOURCE UNDER OBIE, so there is nothing to rebind them TO. This
# app has no account, no username, no password and no profile of its own; the PSU is
# identified only by the consent they granted at their bank.
#
# The nearest OBIE concept is the ACCOUNT HOLDER, read from
# `GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/party` under the ReadParty
# permission — and that is already a separate, shipped screen (`account-holder`). It
# is read-only: OBIE provides no party write, so the update side has no counterpart
# at all.
#
# DECISION OWED (unchanged, and stated identically in `api.yaml` and `ui.yaml`):
# `profile` is OBP-era with no OBIE data source and a shipped OBIE equivalent already
# in place. It is a deletion candidate in the same class as the four features removed
# on 2026-08-06 (sca-challenge, change-password, forgot-password, transaction-tags),
# but it was not in that decision's scope and is left standing pending a call.
#
# The bindings below are therefore marked UNRESOLVED rather than repointed at `party`.
# Repointing them would silently resolve that decision — it would make `profile` a
# second renderer of the same resource `account-holder` already renders, which is
# precisely the question the DECISION OWED is about.
# ═══════════════════════════════════════════════════════════════════════════

entries:
  - screen_id: profile
    trigger: on_mount
    endpoints: []
    direction: read
    source: unresolved
    dtos: []
    produces_state: content
    error_paths: []
    note: >-
      No endpoint. The 401 and 500 paths went with the binding — they were inherited from
      an operation that no longer exists, and a retry handler here would offer to recover
      from a failure that cannot occur. Until the DECISION OWED above is made, this screen
      renders no data because there is none to render.

  - screen_id: profile
    trigger: on_interact
    event: CustomerSaved
    endpoints: []
    direction: write
    source: unresolved
    dtos: []
    produces_state: content
    error_paths: []
    note: >-
      No endpoint, and no possible endpoint. OBIE party data is read-only, so the write
      side has no counterpart of any kind. The shipped ProfileScreen never invoked the PUT
      in any case — it was declared for contract completeness only.

unresolved_2026_08_07:
  - was_bound_to: obp_get_user_profile
    was: "GET /obp/v4.0.0/users/current"
    dto: UserProfile
    obie_equivalent:
      screen: account-holder
      endpoint: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/party"
      permission: [ReadParty]
      writable: false
      availability_note: >-
        400 on Global Money, and one of the five resources gated by SCA recency — returns
        403 with an empty body on a stale-SCA token.
      not_bound_because: >-
        Already shipped as its own screen (`account-holder`). Binding it here would make
        `profile` a duplicate renderer of the same resource, pre-empting the DECISION OWED.
  - was_bound_to: obp_update_user_profile
    was: "PUT /obp/v4.0.0/users/current"
    dto: UserProfile
    obie_equivalent: none
    not_bound_because: >-
      OBIE has no party write. There is no endpoint to bind, now or later, short of the
      screen being deleted or re-scoped.
