sibling: docs
schema_version: "4.0"
feature_id: pay-domestic-standing-order

feature: pay-domestic-standing-order
contract_version: "2.1.0"
status: designed
score: 88
# quality_score is the key core/registries/COMMAND_MATRIX_REGISTRY.yaml reads
# (yaml_number_avg over screens/{feature}/**/*.yaml). `score` is retained for
# existing references. Added 2026-08-07 (/idea-sync).
quality_score: 88
cluster: payment-initiation
acceptance_refs: [FR-012, FR-015, FR-016, FR-017, FR-018, FR-019, FR-020, FR-021]
scaffolded_by: /idea-sync
archetype: form
flow_ref: pay-domestic-standing-order
description: >-
  Domestic standing order — a recurring sterling mandate to a UK sort code and account number.
  Four steps: payee, schedule, amount, review. There is no funding-account step: DebtorAccount
  is not part of this schema, so the source account is chosen by the PSU at the bank. Cannot be
  amended or cancelled through a PISP once created.
has_ui: true
has_server: false
capabilities: [has_ui, has_api, has_flow, has_form_input, has_system_integration]
system_capabilities:
  - { kind: deep_link, detail: "Hands off to payment-consent for the app-to-app authorise leg." }

inherits_from: pay-domestic-single

rail_position:
  time_dimension: "recurrence — MandateRelatedInformation"
  amount_field: FirstPaymentAmount
  creditor_scheme: UK.OBIE.SortCodeAccountNumber
  funds_confirmation: none
  remittance_information: >-
    ACCEPTED at Initiation level — corrected 2026-08-07. Previously recorded as "not in the
    schema", which was wrong: R17-D01 (Unstructured) and R17-D03 (Structured) both stage 201
    and echo verbatim. What IS refused is MandateRelatedInformation.Reference, on both rails.
  debtor_account: "not in the schema"
  risk_block: "{} empty"
  charge_at_staging: >-
    0.05 GBP, Type UK.OBIE.CHAPSOut — a CHAPS label on a recurring domestic mandate. Render the
    amount only; Type is the bank's internal labelling and would misinform the PSU.
  consent_ladder: "AWAU -> AUTH -> COND"
  resource_ladder: "PDNG -> INCO"

structural_note: >-
  This is a MANDATE, not an instruction, and the payload shrinks as the object grows more
  abstract — 9 body leaves against the reference rail's 34. LocalInstrument disappears because
  a mandate does not pick a rail; the bank picks one per instalment. Risk empties because there
  is no single e-commerce context to attach to a recurring instruction.

divergence_traps:
  - trap: "Adding a funding-account step by analogy with the other rails"
    why_wrong: "DebtorAccount is not in the standing-order schema. The picked value has nowhere to go."
    correct: "No account step. no_debtor_note explains that the bank asks instead."
  - trap: "Sending InstructedAmount"
    why_wrong: "U005 Field is not expected. This rail uses FirstPaymentAmount; the international mandate rail is the exact inverse."
    correct: "FirstPaymentAmount, with optional Recurring and Final siblings."
  # ── REVERSED 2026-08-07. This entry used to say the opposite, and was wrong. ──
  - trap: "Putting the reference in MandateRelatedInformation.Reference"
    why_wrong: >-
      That is the natural-looking home for a mandate reference and it is refused — on the
      domestic rail AND the international one. Probing only that field is exactly how this
      feature came to record "RemittanceInformation is not in the standing-order schema", which
      was a generalisation from one refused field to a whole absent capability.
    correct: >-
      The reference goes in Data.Initiation.RemittanceInformation, one level up. R17-D01
      (Unstructured) and R17-D03 (Structured) both stage 201 and echo verbatim. A reference
      field IS offered on the Amount step; no_reference_note has been removed because it told
      the PSU something untrue.

  - trap: "Rendering Charges[].Type"
    why_wrong: >-
      It reads UK.OBIE.CHAPSOut on a standing order — a CHAPS label on a recurring domestic
      mandate that will not travel by CHAPS. It is the bank's internal labelling, the same
      value returned on the FPS single-payment rail.
    correct: "Render the charge amount and currency only."

  - trap: "Making FirstPaymentDateTime optional in the UI because it is optional in the schema"
    why_wrong: >-
      R17-B01 omits it and stages 201 — but the RESPONSE omits it too. The bank substitutes
      nothing and reveals no derived first date, so a mandate staged without it leaves the
      review and success screens with no truthful value for "first payment on …".
    correct: "Always send it. Optional to the API is not optional to a screen that must confirm a recurring commitment."
  - trap: "Offering nine frequency values from the OBIE enum"
    why_wrong: "HSBC Personal accepts five. ADHO, INDA, MIAN and DAIL all return U002."
    correct: "Exactly five options."
  - trap: "Showing the new mandate in the standing-orders list afterwards"
    why_wrong: >-
      A PIS-created standing order does not surface in AIS. StandingOrderId is absent from every
      AIS element, so correlation is impossible by construction. Tested directly with 19936.
    correct: "Do not attempt it. The absence is not a reporting failure."

amendment_prohibition:
  permitted: false
  basis: "OBL Customer Experience Guidelines — mandatory obligation to redirect the PSU"
  ui_requirement: "amend_notice on the Review step AND the Success state, severity warning"
  alternative: "VRP for a recurring payment the PSU can actually change."

spec_ahead_of_source:
  scope: feature
  cluster: payment-initiation
  declared_at: "2026-08-06"
  declared_by: "/idea-sync (PISP-tests research rewrite)"
  owed_by: /kmp-implement
  reason: "Type brought in scope by the 2026-08-06 seven-type rewrite."
  source_state_measured:
    present: ["core/network/.../pisp/domesticStandingOrder request + response"]
    absent: ["no Ktorfit service", "no store", "no repository", "no feature module"]
  consequence_for_verification: "drift and source-test checks UNASSERTABLE, not failing. Score N/A."

regulatory:
  note: "PISP is a distinct FCA permission from AISP. Sandbox unaffected; production needs authorisation this project does not hold."
  affects_production: true
  affects_sandbox: false
  adr_required: true

vm_actions:
  - name: SelectFrequency
    signature: 'fun selectFrequency(type: FrequencyType)'
    state_mutations: ["content.frequency = type"]
    notes: "FrequencyType is a five-value enum mirroring exactly what HSBC Personal accepts."
  - name: EnterReference
    signature: 'fun enterReference(text: String)'
    state_mutations: ["content.reference = text.take(35)"]
    notes: >-
      ADDED 2026-08-07. Maps to Data.Initiation.RemittanceInformation.Unstructured[0], omitted
      when blank. This rail was previously specified as having no reference channel at all; see
      api.yaml#reference_channel for the correction.
  - name: SelectFinalPaymentDate
    signature: 'fun selectFinalPaymentDate(date: LocalDate)'
    state_mutations:
      - "content.finalPaymentDate = date"
      - "content.scheduleProblem = validateFinalDate(date, firstPaymentDate)   # after first, within 12 months, not today/tomorrow"
    notes: "The three constraints came from a single U003 message; two of them appear nowhere in the Guide."
  - name: ConfirmAndStageConsent
    signature: 'suspend fun confirmAndStageConsent()'
    state_mutations:
      - uiState = Submitting(StagingConsent)
      - uiState = Submitting(AwaitingAuthorisation, consentId = response.Data.ConsentId)
    side_effects:
      - "POST /domestic-standing-order-consents with Data.Permission 'Create' and Risk {}"
      - "Body carries FirstPaymentAmount and MandateRelatedInformation; no DebtorAccount, no LocalInstrument"
      - "Body carries Data.Initiation.RemittanceInformation.Unstructured[0] when a reference was entered, omitted when blank"
    error_handling:
      on_400_U005: uiState = Error(FieldNotExpected)
      on_400_U003: uiState = Error(InvalidMandateDates)
      on_400_U002: uiState = Error(InvalidFrequency)
      on_400_U019: uiState = Error(SignatureMissing)
  - name: SubmitStandingOrder
    signature: 'suspend fun submitStandingOrder(consentId: String)'
    state_mutations:
      - uiState = Submitting(SubmittingPayment)
      - "uiState = Success(mandateId = response.Data.DomesticStandingOrderId, status = PDNG)"
    side_effects: ["POST /domestic-standing-orders echoing the AUTHORISED consent's Initiation"]

error_cases:
  - { id: FieldNotExpected, trigger: "400 U005", user_message: '{strings.error.payment.field_not_expected}', recovery: "Implementation fault — the wrong amount field or PointInTime was sent." }
  - { id: InvalidMandateDates, trigger: "400 U003", user_message: '{strings.error.payment.invalid_mandate_dates}', recovery: "Return to the schedule step." }
  - { id: InvalidFrequency, trigger: "400 U002 on Frequency.Type", user_message: '{strings.error.payment.invalid_frequency}', recovery: "Should be unreachable — the picker offers five values." }
  - { id: SignatureMissing, trigger: "400 U019", user_message: '{strings.error.payment.signature_missing}', recovery: "Not user-recoverable." }
  - { id: ConsentNotAuthorised, trigger: "400 U009", user_message: '{strings.error.payment.consent_not_authorised}', recovery: "Re-authorise." }
  - { id: NetworkError, trigger: "IOException / timeout", user_message: '{strings.error.payment.network_error}', recovery: "Retry — idempotency key reused." }

