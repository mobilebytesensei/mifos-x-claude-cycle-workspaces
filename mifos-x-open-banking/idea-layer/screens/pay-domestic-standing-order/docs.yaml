error_contract_ref:
  dto: dtos/ObPaymentError.yaml
  note: >-
    Shared by all seven PIS rails. This rail contributes two of the DTO's own proofs: R15-E01
    (an unexpected InstructedAmount is reported while the missing mandatory FirstPaymentAmount
    in the same body is NOT) and R17-B03 (omitting MandateRelatedInformation returns only the
    parent U004, never the nested Frequency error).
  binding_consequences_for_this_screen:
    - "The error surface iterates the whole Errors[] array (TC-PSO-015)."
    - "The U003 final-date blob is never parsed — all three of its rules are enforced by the picker's bounds."
    - "Copy is keyed off ErrorCode + Path with a case-insensitive Path match, never Message."

# ─────────────────────────────────────────────────────────────────────────
# UNRESOLVED — recorded, not settled
# ─────────────────────────────────────────────────────────────────────────
open_gaps:
  - id: GAP-PSO-AMOUNT-EQUALITY
    declared_at: "2026-08-07"
    question: "Does the Guide §20.2.1 equal-amounts rule fire at authorisation or execution?"
    known: >-
      Staging does not enforce it in either direction — 1.00/2.00/3.00 stages 201, and R15-E04
      with all three amounts EQUAL also stages 201. So equality is neither required nor
      rejected at staging, and the two results together rule out an intermittent check.
    unknown: "No unequal-amount mandate was ever AUTHORISED, so a later gate cannot be excluded."
    ui_stance: >-
      The form defaults to a single amount, following the documented rule, and exposes the
      observed latitude behind an advanced switch. Permitting what the bank might later reject
      is worse than a mild restriction.

  - id: GAP-PSO-WORKING-DAY
    declared_at: "2026-08-06"
    question: "Does HSBC require a working-day commencement for weekly and monthly mandates?"
    known: "An aggregated ASPSP table claims so. Weekend FIRST-payment dates staged 201 in round 17."
    unknown: "Every first-payment date in the corpus fell on a Thursday, so the claim was never tested against a weekly or monthly mandate specifically."
    ui_stance: "The picker allows weekends. If the bank refuses one, the error surfaces at staging rather than being pre-empted by a rule that cannot be confirmed."

status_history:
  - from: null
    to: draft
    at: "2026-08-06"
    by: "/idea-sync — seven-type payments rewrite"
    note: "Brought in scope. 46 scenarios in captures/by-type/standing-orders-domestic.md; resources 19916 and 19936 authorised."
  - from: draft
    to: enriched
    at: "2026-08-07"
    by: "/idea-sync"
    note: >-
      Folded in the full by-type capture corpus (78 standing-order scenarios) and bound the
      screen to the new shared dtos/ObPaymentError.yaml. THREE CORRECTIONS, each reversing a
      claim this feature had asserted consistently across five files. (1) RemittanceInformation
      is NOT absent from the standing-order schema — R17-D01 (Unstructured) and R17-D03
      (Structured) both stage 201 and echo verbatim. Only MandateRelatedInformation.Reference is
      refused, on both rails, and generalising that one refusal into "no reference channel" cost
      the feature a real capability. no_reference_note is REMOVED and replaced by reference_field;
      TC-PSO-006 is reversed. (2) FirstPaymentDateTime is NOT required — R17-B01 stages 201
      without it, and the response omits it too, so the bank reveals no derived first date. The
      app now sends it deliberately rather than dutifully, because omitting it would leave the
      confirmation screen with nothing truthful in its first-payment row. (3) The submit echo is
      field-for-field, not byte-for-byte — "byte-identical" was true of the mandate DATE VALUES
      (which really do round-trip character-for-character, +00:00 offset and seconds intact) but
      false of the Initiation OBJECT, whose key order the server normalises. The same phrase was
      doing both jobs in one file. Also added: the U003 final-date error is ONE undiscriminated
      string carrying three rules, so all three must be enforced client-side and the message must
      never be parsed; Charges[].Type reads UK.OBIE.CHAPSOut on a standing order and must not be
      rendered; the three non-uniform wire types (quoted 2dp Amount, unquoted CountPerPeriod,
      quoted zero-padded PointInTime); R15-E04 as the equal-amounts control.
      quality_score 88: the lowest of the three rails, deliberately. The spec is dense and well
      evidenced, but it carried three confidently-stated claims that the fuller corpus overturned
      — one of which had removed a working feature — and two open questions (the equal-amounts
      gate and the working-day commencement rule) remain unresolved. The score reflects a spec
      that is now accurate rather than one that was.
  - from: enriched
    to: designed
    at: "2026-08-07"
    by: "/idea-feature-export"
    exports_produced: [spec_md, api_md, mockup_md, prompts_figma_md, prompts_per_state]
    note: >-
