sibling: flow
schema_version: "4.0"
feature_id: pay-domestic-standing-order

feature: pay-domestic-standing-order
flow_ref: pay-domestic-standing-order

entry_points:
  - source: payments
    label: "Tap the Domestic standing order tile on the payments hub"
    params: []

transitions:
  - from: pay-domestic-standing-order
    to: payment-consent
    trigger: "Confirm on the Review step, after the consent stages 201"
    params: [consentId, paymentFamily]
    notes: "paymentFamily is 'domestic-standing-order' so the shared return leg polls the right endpoint."

  - from: payment-consent
    to: pay-domestic-standing-order
    trigger: "Consent reaches AUTH"
    params: [consentId]
    notes: >-
      Resumes directly at submit. No funds-confirmation on this family, and none would be
      meaningful — a mandate has no single execution date whose balance could be checked.

  - from: pay-domestic-standing-order
    to: payment-status
    trigger: "Submit returns 201 with a DomesticStandingOrderId"
    params: [paymentId, paymentFamily]

  - from: pay-domestic-standing-order
    to: payments
    trigger: "Back from the Payee step, or Cancel"
    params: []

internal_step_transitions:
  steps: [Payee, Schedule, Amount, Review]
  note: >-
    FOUR steps, not five. There is no funding-account step because DebtorAccount is not in this
    schema — the source account is chosen by the PSU at the bank during authorisation.

# ─────────────────────────────────────────────────────────────────────────
# WHAT DOES *NOT* HAPPEN AFTER SUCCESS
# ─────────────────────────────────────────────────────────────────────────
post_creation_constraints:
  no_ais_appearance:
    rule: "Do NOT navigate to, or refresh, the standing-orders list expecting the new mandate to appear."
    evidence: >-
      Standing order 19936 was pinned to account 80200110203349 — the one account whose AIS
      standing-orders read returns 200 — and five minutes later that resource still returned only
      the two pre-seeded 2019 fixtures. The mandate was healthy (INCO, consent COND).
    structural_cause: >-
      StandingOrderId is absent from every element of the AIS standing-orders read. There is no
      field that could ever hold a PIS DomesticStandingOrderId, so write-to-read correlation is
      impossible by construction, not merely delayed.
    scoped: >-
      Untested once a mandate becomes ACTIVE. Both pre-seeded fixtures carry
      StandingOrderStatusCode ACTV and 19936's first payment was dated 2026-08-13, so re-running
      the check after that date is a cheap open experiment.
  no_amendment_route:
    rule: "The success state offers no Edit and no Cancel."
    basis: "OBL Customer Experience Guidelines — a PISP cannot amend or cancel, and must redirect the PSU."
    ui: "amend_notice is shown instead, at severity warning."

dependencies:
  tier: feature
  features:
    - { name: payments, relation: parent, params: [] }
    - { name: beneficiaries, relation: data_source, params: [] }
    - { name: payment-consent, relation: child, params: [consentId, paymentFamily] }
    - { name: payment-status, relation: child, params: [paymentId, paymentFamily] }
  note: >-
    accounts is deliberately absent as a data_source. Every other PIS rail depends on it for the
    debtor picker; this one has no debtor field.
  libraries:
    - name: ktorfit
      coords: "de.jensklingenberg.ktorfit:ktorfit-lib:2.x"
      purpose: "REST client for the four domestic-standing-order endpoints"
