sibling: flow
schema_version: "4.0"
feature_id: products
flow_ids:
  - consumer-banking

# ─────────────────────────────────────────────────────────────────────────
# UPDATED 2026-08-07 by /idea-sync.
#
# Products is a pushed leaf: it owns a back arrow only, and its single outbound
# affordance leaves the app entirely — CoreProduct.ProductURL handed to the platform
# browser. It has NO in-app forward nav. There is no apply journey, because the Open Data
# Product Finder publishes information and has no application resource.
#
# navigates_to stays intentionally empty. What CHANGED is why the two previously named
# candidates are absent:
#   - application-detail — dropped 2026-08-02, a field-officer screen with no apply journey
#   - accounts           — the 2026-06 OBP model reached the PSU's accounts to discover
#                          which banks to fan out over. This screen reads a PUBLIC
#                          catalogue and touches nothing belonging to the PSU, so it has
#                          no reason to reach `accounts` at all.
# ─────────────────────────────────────────────────────────────────────────
navigates_to: []
flow_logic: []

reachable_before_login: true
reachable_before_login_note: >-
  ADDED 2026-08-07. The Open Data Product Finder takes no token, no consent and no session,
  so this screen is renderable with no signed-in user. That makes it the only fully
  pre-auth surface in the consumer-banking flow, and a legitimate entry point for someone
  who does not yet bank with HSBC. Nothing here depends on the auth graph.

sibling_feature_not_to_be_confused_with:
  feature: product
  path: screens/product/
  question_it_answers: "What are the terms of the account I already hold?"
  contrast: >-
    `products` (plural) is the PUBLIC CATALOGUE — api.hsbc.com, no auth, reachable before
    login. `product` (singular) is the PSU's own account terms — the consented AIS surface,
    ReadProducts permission, per account. Different question, different host, opposite auth
    model. They are not two views of one feature and must not be merged.

journey_ids:
  - consumer-insights-utilities
