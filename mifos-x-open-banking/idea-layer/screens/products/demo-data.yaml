# ═══════════════════════════════════════════════════════════════════════════
# REPLACED WHOLESALE 2026-08-07 by /idea-sync.
#
# This file is CAPTURED, NOT AUTHORED. Every record below was read off a live
# HTTP 200 from api.hsbc.com — field names, casing, punctuation and whitespace
# defects preserved verbatim. Where a record is shortened, it is shortened by
# TRUNCATION at a named boundary and says so; nothing is paraphrased, tidied,
# re-cased or invented.
#
# Provenance — REPRODUCE, don't hunt for a file. Every GET below is public, unauthenticated
# and free, and carries `Accept: application/prs.openbanking.opendata.v2.2+json`:
#   PCA   10 records ~83 KB
#     curl -H "Accept: application/prs.openbanking.opendata.v2.2+json" \
#       "https://api.hsbc.com/open-banking/v2.2/personal-current-accounts"
#   BCA   14 records ~966 KB
#     curl -H "Accept: application/prs.openbanking.opendata.v2.2+json" \
#       "https://api.hsbc.com/open-banking/v2.2/business-current-accounts"
#   CCC    1 record  ~8 KB
#     curl -H "Accept: application/prs.openbanking.opendata.v2.2+json" \
#       "https://api.hsbc.com/open-banking/v2.2/commercial-credit-cards"
#   SMEL   1 record  ~5 KB
#     curl -H "Accept: application/prs.openbanking.opendata.v2.2+json" \
#       "https://api.hsbc.com/open-banking/v2.2/unsecured-sme-loans"
#   segment probes re-run live 2026-08-07 (see empty_case + segment_probes)
#
# Local captures of those four responses exist OUTSIDE this repository at
# /home/kalpesh/OpenBankingProject/HSBC_Sandbox/open-data-specs/{pca-probe,
# pf-business-current-accounts, pf-commercial-credit-cards, pf-unsecured-sme-loans}.json,
# captured 2026-08-07. They are NOT checked in — one is 966 KB and all four go stale as
# meta.LastUpdated moves. Re-run the curl commands above rather than seeking those files.
#
# WHAT WAS HERE BEFORE — deleted, not migrated:
#   Five authored products from a Nairobi field-officer persona — Equity Jijenge
#   Savings, Equity Current, Equity Biashara Loan, Equity Visa Debit, Equity Home
#   Loan — priced in KES, licensed "CBK-DTL-2019-001" (Central Bank of Kenya), in
#   OBP snake_case (code / more_info_url / super_family), with a MORTGAGES
#   category. None of it survives: this is a UK HSBC app reading a UK OBIE Open
#   Data feed. There is no Kenyan bank, no KES, no CBK licence, no mortgage
#   product, and no snake_case anywhere on this wire.
#   The `_persona` line that called the Kenyan set "Intentional" is deleted with
#   it — the intent it pointed at belonged to a persona this app no longer has.
# ═══════════════════════════════════════════════════════════════════════════

_content_policy: >-
  RULE-PROTO-CONTENT-001 — zero placeholders. Stronger than that here: zero
  AUTHORED content. Every value is a captured live value. A renderer that looks
  right against this fixture looks right against the wire, including against its
  defects.

_capture_provenance:
  captured_at: "2026-08-07"
  host: api.hsbc.com
  auth: none
  media_type: "application/prs.openbanking.opendata.v2.2+json"
  spec: "OBIE Open Data v2.2 (swagger info.version 2.2.1)"
  contract: "screens/products/api.yaml"
  fidelity: >-
    Verbatim. Trailing spaces, tab characters inside URLs, en-dashes, curly
    apostrophes, embedded newlines and scheme-less URLs are REPRODUCED, not
    corrected. They are the fixture's whole point — see wire_defects below.

# ─────────────────────────────────────────────────────────────────────────
# ENVELOPE — three levels, and the innermost key changes per family
# ─────────────────────────────────────────────────────────────────────────
envelope:
  shape: "{ meta, data }"
  data_is_an_array: true
  nesting: "data[] → [i].Brand[] → [j].{BrandName, OnSaleIndicator?, <FAMILY>[]}"
  family_key:
    personal-current-accounts: PCA
    business-current-accounts: BCA
    commercial-credit-cards: CCC
    unsecured-sme-loans: SMELoan
  parser_note: >-
    The innermost key must be passed in per family. It follows neither the
    endpoint segment nor the swagger definition name. A parser that derives it
    returns an empty list and reports an empty catalogue.

meta_verbatim:
  personal_current_accounts:
    LastUpdated: "2026-07-24T10:00:39.464Z"
    TotalResults: 10
    Agreement: "Use of the APIs and any related data will be subject to the terms of the Open Licence and subject to terms and conditions"
    License: "https://www.openbanking.org.uk/open-licence"
    TermsOfUse: "https://www.openbanking.org.uk/terms"
  business_current_accounts:
    LastUpdated: "2026-07-24T11:07:10.291Z"
    TotalResults: 14
  commercial_credit_cards:
    LastUpdated: "2026-03-18T09:04:41.783Z"
    TotalResults: 1
  unsecured_sme_loans:
    LastUpdated: "2026-01-16T09:53:01.098Z"
    TotalResults: 1
  reading: >-
    TotalResults is a PRODUCT count, not a brand-block count. PCA settles it —
    two brand blocks, TotalResults 10, ten product records. It counts records on
    the wire, so it counts the DUPLICATES too: 10, not the 7 distinct products a
    grouped list renders. Do not print it as "10 accounts available".

# ─────────────────────────────────────────────────────────────────────────
