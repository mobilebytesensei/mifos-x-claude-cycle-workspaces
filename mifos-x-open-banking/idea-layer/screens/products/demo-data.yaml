            OtherEligibility:
              - Name: "Business Customers Only "
                Description: "Loan is available to Business Customers Only "
                Type: "BusinessOnly"
                Textual: "Loan is available to Business Customers Only "
                _defect: "trailing space on all three text fields"
          _amounts_are_strings: >-
            TierValueMinimum / TierValueMaximum arrive as STRINGS ("1000.00"),
            and RepAPR as a string ("11.3"). Parse before comparing; do not sort
            numerically on the raw value.
          _truncated: "CoreProduct, FeaturesAndBenefits, Repayment omitted"

# ─────────────────────────────────────────────────────────────────────────
# THE EMPTY CASE — reachable, and it is a 200
# ─────────────────────────────────────────────────────────────────────────
empty_case:
  _probed_live: "2026-08-07"
  requests:
    - { url: "GET /x-open-banking/v2.2/personal-current-accounts/segment/Zzz", note: "nonsense segment" }
    - { url: "GET /x-open-banking/v2.2/personal-current-accounts/segment/Packaged", note: "a segment the SPEC declares but HSBC does not publish" }
    - { url: "GET /x-open-banking/v2.2/unsecured-sme-loans/segment/General", note: "a real segment, wrong family" }
  response_verbatim:
    http_status: 200
    bytes: 322
    meta:
      LastUpdated: "1970-01-01T00:00:00.000Z"
      TotalResults: 0
      Agreement: "Use of the APIs and any related data will be subject to the terms of the Open Licence and subject to terms and conditions"
      License: "https://www.openbanking.org.uk/open-licence"
      TermsOfUse: "https://www.openbanking.org.uk/terms"
    data: []
  two_sentinels_in_one_body:
    - "LastUpdated 1970-01-01T00:00:00.000Z — epoch zero, meaning 'never', not a real timestamp"
    - "data: [] with HTTP 200 — success carrying nothing"
  it_is_not_a_400: >-
    An unrecognised segment does NOT return 400. It returns 200 with an empty
    data array. Code that distinguishes "bad input" from "no results" on the
    status code cannot tell them apart here — both are 200.
  do_not_render_the_1970_date: >-
    Second sentinel date on this feed, alongside 2099-12-31. Rendering it gives
    the user "Last updated 1 January 1970".

segment_probes:
  _probed_live: "2026-08-07"
  pca:
    observed_on_the_unfiltered_feed: [Basic, General, Graduate, Premium, Student, Youth]
    declared_by_the_spec: [Basic, General, Graduate, Packaged, Premium, Reward, Student, YoungAdult, Youth]
    never_published: [Packaged, Reward, YoungAdult]
    student_probe: { TotalResults: 1, returns: ["StuAcc"], bytes: 9687 }
  bca:
    observed: [Standard, Startup, Switcher, Religious, NonCommercial]
    probes:
      - { segment: Standard,  TotalResults: 7, bytes: 271206, returns: [BCAEBT, BCASBT, BCACommunityAccount, BCASchoolCollegeAccount, BCAHSBCKinetic, BCASBBA, BCABBA] }
      - { segment: Startup,   TotalResults: 6, bytes: 500203, returns: [BCAStartup, BCAHSBCKinetic, BCAStartUpBB, BCASBBA, BCABBA, BCAStartupSBB] }
      - { segment: Switcher,  TotalResults: 6, bytes: 504338, returns: [BCASwitcher, BCAHSBCKinetic, BCASwitcherSBB, BCASBBA, BCABBA, BCASwitcherBB] }
  ccc: { observed: [General], probe: { segment: General, TotalResults: 1, bytes: 8248 } }
  smel: { observed: [Business], probe: { segment: Business, TotalResults: 1, bytes: 5363 } }
  segments_are_per_family: >-
    PCA's six and BCA's five share not one value. CCC publishes General; SMEL
    publishes Business. There is no app-wide segment enum, and the nine values
    the PCA spec declares do not describe the other three families at all.
  segment_narrowing_is_weak_on_bca:
    unfiltered: 966364
    best_case_segment: 271206
    worst_case_segment: 504338
    reading: >-
      Segment filtering roughly halves BCA at best and still costs a quarter of a
      megabyte. It reduces the problem; it does not solve it.
  products_appear_in_several_segments:
    example: "BCAHSBCKinetic, BCASBBA and BCABBA appear in Standard AND Startup AND Switcher"
    consequence: "Fetching one segment per tab and concatenating produces duplicates across tabs."

# ─────────────────────────────────────────────────────────────────────────
# WIRE DEFECTS — reproduced verbatim above; listed here so a renderer can be
# tested against them deliberately
# ─────────────────────────────────────────────────────────────────────────
wire_defects:
  - id: WD-1
    kind: trailing_whitespace_in_display_field
    examples:
      - 'SMEL Name: "Small Business Loan "'
      - 'BCA Name: "HSBC Small Business Banking Account "'
      - 'BCA Name: "HSBC Start up account for Small Business Banking "'
    impact: "Ragged titles; exact-text assertions fail against the visually identical string."
    handling: "trim() every display string at the mapper boundary."
  - id: WD-2
    kind: scheme_less_url
    examples: ['BCAEBT CoreProduct.ProductURL: "www.business.hsbc.uk"', 'BCASBT: "www.business.hsbc.uk"']
    impact: "openUri on a scheme-less string does nothing or throws. The 'More info' affordance dies silently."
    handling: "Prefix https:// when no scheme is present, before handing to the URI handler."
  - id: WD-3
    kind: control_characters_inside_a_url
    example: '"https://www.business.hsbc.uk/en-gb/everyday-banking/business-accounts/start-up-business-bank-account\t\t\t"'
    impact: "Three trailing tabs inside the URL string. Unhandled, the request 404s or is rejected before it leaves."
    handling: "trim() the URL too, not only the labels."
  - id: WD-4
    kind: mixed_scheme
    example: 'CCC ProductURL is http://, while every PCA ProductURL is https://'
  - id: WD-5
    kind: unicode_punctuation
    examples:
      - 'PredecessorID "Regular – No Offer" uses EN DASH U+2013 where a sibling record uses ASCII hyphen "Regular - No Offer"'
      - '"you''re eligible" and "don''t qualify" use the curly apostrophe U+2019'
    impact: "Equality comparisons and hardcoded string matches split on visually identical text."
  - id: WD-6
    kind: embedded_markup_in_plain_text
    example: 'Fee Notes contain "\n* Online\n* Phone\n* Post" — pseudo-markdown bullets inside a plain string'
    impact: "Rendered in a single-line Text these collapse into an unreadable run-on."
  - id: WD-7
    kind: trailing_space_inside_a_sentence
    example: '"...Overdrafts are subject to status. " and "...on the converted amount \nof the debit card payment."'
    impact: "Mid-sentence newline and trailing space inside body copy; wraps at the wrong point."
  - id: WD-8
    kind: numbers_as_strings
    examples: ['TierValueMinimum "1000.00"', 'RepAPR "11.3"', 'MonthlyMaximumCharge "0.00"']
    impact: "Lexicographic sort puts £10001 before £1000."

# ─────────────────────────────────────────────────────────────────────────
# STATES
# ─────────────────────────────────────────────────────────────────────────
states:
  - scope: content
    families: [PCA, BCA, CCC, SMEL]
    tabs_rendered: 4
    default_tab: PCA
    rows_on_default_tab: 7
    note: "All four families return products. Four tabs. Seven grouped PCA rows, three carrying an offer badge."

  - scope: loading
    note: "PCA only is fetched on open. BCA/CCC/SMEL are fetched when their tab is first selected."

  - scope: empty
    fixture: empty_case
    note: >-
      Reached by a segment filter that matches nothing — HTTP 200, data: [],
      TotalResults 0, LastUpdated 1970-01-01. Under empty_family_rule the family's
      TAB IS HIDDEN rather than rendered with a message. Nothing in the live
      unfiltered catalogue reaches this today; all four families have products.

  - scope: error
    error_type: ProductsLoadFailed
    message: "Could not load products"
    recovery: "Try again"
    note: "Covers 408 / 500 / 503. There is no authentication failure mode."

  - scope: no_network
    error_type: Offline
    message: "You're offline. Product information may be out of date."

  - scope: rate_limited
    http: 429
    error_type: RateLimited
    message: "Too many requests. Try again in a moment."
    note: >-
      ADDED 2026-08-07. Real risk: an unauthenticated public API rate-limits by
      origin, so one device's retry loop is throttled against every other user of
      the same egress. It is the only failure this screen can provoke on itself.

_removed_state_unauthenticated:
  was: "{ scope: unauthenticated, error_type: SessionExpired, message: 'Sign in again to browse products.' }"
  removed_at: "2026-08-07"
  reason: >-
    UNREACHABLE. This feed takes no credential of any kind — no token, no consent,
    no session, no API key. There is no 401 and no 403 on any path in the spec.
    A session-expired state on this screen could never be entered, and shipping it
    means shipping a branch that cannot be tested and a promise that signing in
    would help, when signing in changes nothing about what this screen can see.

_removed_fixture_set:
  was: "5 Kenyan products (Equity Jijenge Savings, Equity Current, Equity Biashara Loan, Equity Visa Debit, Equity Home Loan)"
  fields_used: [code, name, category, family, super_family, more_info_url, details, meta.license]
  removed_at: "2026-08-07"
  reason: >-
    Wrong country, wrong currency, wrong regulator, wrong wire format, wrong
    product set. KES amounts and a Central Bank of Kenya deposit-taking licence in
    a UK HSBC app reading OBIE Open Data. The field names were OBP snake_case;
    this feed is PascalCase throughout. The MORTGAGES category has no counterpart —
    the Product Finder publishes four families and none of them is mortgages.
  also_removed: >-
    `_scope_filter_note`, which reasoned about a Personal/Business ProductScope
    tab pair being kept non-empty by spreading the five fixtures across audiences.
    The audience split is no longer client-side — it is which endpoint you call —
    so there is no scope filter left for a fixture to keep populated.

