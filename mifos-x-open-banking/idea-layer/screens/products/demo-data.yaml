# state, plus the marketing-state header. The deep block is truncated at
# PCAMarketingState[0].{CoreProduct,Eligibility,FeaturesAndBenefits,Overdraft,
# OtherFeesCharges,Ucodes} — see deep_sample for one unabridged instance.
# ─────────────────────────────────────────────────────────────────────────
pca_records_verbatim:

  - _brand: "first direct"
    _brand_on_sale: true
    _record_index: 0
    Identification: "fdFirAcc"
    Name: "1st Account"
    OnSaleIndicator: true
    Segment: ["General"]
    PCAMarketingState:
      - Identification: "Regular - No Offer"
        MarketingState: "Regular"
        FirstMarketedDate: "2017-01-01"
        LastMarketedDate: "2099-12-31"
        PredecessorID: "N/A"
        _truncated: "CoreProduct, Eligibility, FeaturesAndBenefits, Overdraft, OtherFeesCharges, Ucodes omitted"

  - _brand: "first direct"
    _brand_on_sale: true
    _record_index: 1
    Identification: "fdFirAcc"
    Name: "1st Account"
    OnSaleIndicator: true
    Segment: ["General"]
    PCAMarketingState:
      - Identification: "£175 Switch Incentive"
        MarketingState: "Promotional"
        FirstMarketedDate: "2026-07-16"
        # LastMarketedDate: ABSENT — the key is not present on this record.
        # Absent means the offer is currently live. Not null, not empty: absent.
        PredecessorID: "Regular – No Offer"
        _note: "PredecessorID here uses an EN DASH (U+2013), not a hyphen."
