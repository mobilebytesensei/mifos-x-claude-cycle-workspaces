# ─────────────────────────────────────────────────────────────────────────
# ONE UNABRIDGED MARKETING STATE — StuAcc, verbatim, for the compare view
# ─────────────────────────────────────────────────────────────────────────
deep_sample:
  _for: "PCA StuAcc / PCAMarketingState[0] — the block a COMPARE view reads and a LIST view must not"
  _weight: "This block, times ten records, is where nearly all of the 83 KB sits"
  CoreProduct:
    ProductURL: "https://www.hsbc.co.uk/current-accounts/products/student/"
    MonthlyMaximumCharge: "0.00"
    TcsAndCsURL: "https://www.hsbc.co.uk/content/dam/hsbc/gb/pdf/personal-banking-terms-conditions.pdf"
    SalesAccessChannels: ["Branch", "Online", "CallCentre"]
    ServicingAccessChannels: ["ATM", "Branch", "CallCentre", "MobileBankingApp", "Online", "PostOffice"]
    Notes: null
  Eligibility:
    AgeEligibility:
      MinimumAge: 18.0
    ResidencyEligibility:
      ResidencyIncluded: ["ELEN", "ELNI", "ELSC", "ELUK", "ELWA"]
    CreditCheck:
      ScoringType: "Hard"
  FeaturesAndBenefits:
    FeatureBenefitItem:
      - Identification: "1"
        Type: "Rewards"
        Name: "Home&Away Offers"
        Indicator: true
        Textual: "Home&Away gives all HSBC cardholders offers on shopping, dining, travel, experiences and much more."
        Notes:
          - "Some Home&Away deals are only available to holders of specific cards, so please check the terms and conditions of each offer to see if you're eligible."
  Overdraft:
    _keys_present: [Notes, OverdraftTierBandSet, TcsAndCsURL]
    _truncated: "tier bands omitted — shape only"
  Ucodes:
    - { CurrentUcode: "UABAB" }
    - { CurrentUcode: "UABAC" }
    - { CurrentUcode: "UABAD" }
    - { CurrentUcode: "UABAH" }
    - { CurrentUcode: "UABAK" }
    - { CurrentUcode: "UABAL" }
    - { CurrentUcode: "UABAM" }
    - { CurrentUcode: "UABAN" }
    - { CurrentUcode: "UABAO" }
    - { CurrentUcode: "UABBE" }
  PredecessorID: "N/A"
  _outbound_url_lives_here: >-
    CoreProduct.ProductURL is the real, live outbound link for the product, and
    TcsAndCsURL is the terms PDF. Both are inside the marketing state — a list
    view that truncates the marketing state to save weight has thereby also
    dropped its only outbound affordance. Lift ProductURL out during parse.

# ─────────────────────────────────────────────────────────────────────────
# BCA — 14 records, one brand, and the OnSaleIndicator trap
# ─────────────────────────────────────────────────────────────────────────
bca_records_verbatim:
  _brand: "HSBC UK"
  _brand_on_sale_indicator: false
  _brand_on_sale_warning: >-
    FALSE AT BRAND LEVEL. The whole BCA brand block is flagged not-on-sale. A
    shared `filter { onSale }` applied at brand level drops all fourteen business
    accounts and renders an empty Business tab against a 966 KB successful
    response.
  _payload_bytes: 966364
  _paging: "none — no limit, offset or cursor exists anywhere in the spec"
  records:
    - { Identification: "BCAEBT", Name: "HSBC Electronic Banking Tariff", OnSaleIndicator: false, Segment: ["Standard"], marketing_states: 1 }
    - { Identification: "BCAStartup", Name: "HSBC Start Up Account", OnSaleIndicator: false, Segment: ["Startup"], marketing_states: 3 }
    - { Identification: "BCASwitcher", Name: "HSBC Switcher Account", OnSaleIndicator: false, Segment: ["Switcher"], marketing_states: 3 }
    - { Identification: "BCASBT", Name: "HSBC Small Business Tariff", OnSaleIndicator: false, Segment: ["Standard"], marketing_states: 1 }
    - { Identification: "BCACommunityAccount", Name: "Community Account", OnSaleIndicator: false, Segment: ["Standard", "Religious"], marketing_states: 1 }
    - { Identification: "BCASchoolCollegeAccount", Name: "Schools and Colleges Account", OnSaleIndicator: false, Segment: ["Standard"], marketing_states: 1 }
    - { Identification: "BCAHSBCKinetic", Name: "HSBC Kinetic Current Account", OnSaleIndicator: false, Segment: ["Standard", "Startup", "Switcher"], marketing_states: 1, _extra_key: Notes }
    - { Identification: "BCAStartUpBB", Name: "HSBC Start up account for Business Banking", OnSaleIndicator: true, Segment: ["Startup"], marketing_states: 4 }
    - { Identification: "BCACharitableBankAccount", Name: "Charitable Bank Account", OnSaleIndicator: true, Segment: ["NonCommercial"], marketing_states: 2, _extra_key: Notes }
    - { Identification: "BCASwitcherSBB", Name: "HSBC Switcher account for Small Business Banking", OnSaleIndicator: false, Segment: ["Switcher"], marketing_states: 2, _extra_keys: [FeeFreeLength, FeeFreeLengthPeriod] }
    - { Identification: "BCASBBA", Name: "HSBC Small Business Banking Account ", OnSaleIndicator: true, Segment: ["Standard", "Startup", "Switcher"], marketing_states: 2, _defect: "trailing space in Name" }
    - { Identification: "BCABBA", Name: "HSBC Business Banking Account", OnSaleIndicator: true, Segment: ["Standard", "Startup", "Switcher"], marketing_states: 2 }
    - { Identification: "BCASwitcherBB", Name: "HSBC Switcher account for Business Banking", OnSaleIndicator: true, Segment: ["Switcher"], marketing_states: 4 }
    - { Identification: "BCAStartupSBB", Name: "HSBC Start up account for Small Business Banking ", OnSaleIndicator: false, Segment: ["Startup"], marketing_states: 2, _defect: "trailing space in Name", _extra_keys: [FeeFreeLength, FeeFreeLengthPeriod] }
  on_sale_tally: { on_sale_true: 5, on_sale_false: 9 }
  identification_uniqueness: "14 distinct Identifications for 14 records — UNIQUE, the opposite of PCA"
  where_the_multiplicity_went: >-
    Into BCAMarketingState, which holds up to FOUR states per product
    (BCAStartUpBB, BCASwitcherBB). So the PCA dedup strategy and the BCA dedup
    strategy are not the same operation: on PCA you collapse sibling RECORDS, on
    BCA you choose among nested STATES. A single shared "dedup products" helper
    written against PCA does nothing useful on BCA.
  marketing_state_ids_repeat_across_products:
    example: "BCAStartupFree appears under BCAStartup, BCAStartUpBB and BCAStartupSBB"
    consequence: "Marketing-state Identification is not a global key either. Nothing on this feed is."
  marketing_state_dates_often_absent:
    observed: "FirstMarketedDate and LastMarketedDate are null on the majority of BCA states"
    consequence: >-
      Any "is this offer live" or "sort by newest" rule built on the PCA date
      fields degrades to null on BCA. It cannot be the shared implementation.
  _truncated: "All 14 CoreProduct/CreditInterest/Eligibility/Overdraft/OtherFeesCharges blocks omitted — they are the 966 KB"

# ─────────────────────────────────────────────────────────────────────────
# CCC — one product, and the family with NO OnSaleIndicator at all
# ─────────────────────────────────────────────────────────────────────────
ccc_records_verbatim:
  _brand: "HSBC UK"
  _brand_keys_observed: [BrandName, CCC]
  _no_on_sale_indicator: >-
    The CCC brand block carries NO OnSaleIndicator key, and neither does the
    product. Not false — ABSENT. A shared `filter { it.onSale == true }` over a
    nullable boolean silently drops the entire family and the tab disappears via
    the empty_family_rule, which is the wrong reason for it to disappear.
  records:
    - Identification: "Business CC Commercial Card"
      Name: "HSBC UK Business Credit Card"
      Segment: ["General"]
      _keys_observed: [CCCMarketingState, Identification, Name, Segment]
      CCCMarketingState:
        - Identification: "Business CC Commercial Card"
          MarketingState: "Regular"
          FirstMarketedDate: "2017-01-01"
          LastMarketedDate: "2099-12-31"
          _keys: [CoreProduct, Eligibility, FeaturesAndBenefits, FirstMarketedDate, Identification, LastMarketedDate, MarketingState, OtherFeesCharges, Repayment]
          _truncated: "deep block omitted"
        - Identification: "Business CC Commercial Card"
          MarketingState: "Regular"
          FirstMarketedDate: "2017-01-01"
          LastMarketedDate: "2099-12-31"
          _duplicate: >-
            The SECOND state is a duplicate of the first — same Identification,
            same MarketingState, same dates. A compare view that lists marketing
            states verbatim shows the same "Regular" row twice for a product with
            meta.TotalResults 1.
          _truncated: "deep block omitted"
      _product_url: "http://www.business.hsbc.uk/en-gb/finance-and-borrowing/business-card/business-credit-card?DCSext.nav=foot-mat"
      _product_url_defect: "http://, not https://"
  _no_overdraft_no_ucodes: >-
    The CCC marketing state carries Repayment where PCA carries Overdraft, and
    carries no Ucodes and no PredecessorID. The marketing-state schema is
    per-family; there is no shared marketing-state model.

