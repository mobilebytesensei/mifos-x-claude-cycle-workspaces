pca_duplicate_ledger:
  records_on_the_wire: 10
  distinct_products: 7
  repeated:
    - { Identification: "fdFirAcc", times: 2, brand: "first direct", states: ["Regular - No Offer", "£175 Switch Incentive"] }
    - { Identification: "BankAcc",  times: 2, brand: "HSBC UK",      states: ["Regular - No Offer", "HSBC Bank £220 Switch and Spend"] }
    - { Identification: "PremAcc",  times: 2, brand: "HSBC UK",      states: ["Regular - No Offer", "HSBC Premier £500 Welcome Reward"] }
  singletons: [BasAcc, MyAcc, GradAcc, StuAcc]
  grouping_key: "(BrandName, Identification)"
  why_the_brand_is_part_of_the_key: >-
    Identification is only claimed unique within a brand. Grouping on
    Identification alone would silently merge a first direct product into an
    HSBC one the day the two estates collide on a code.

