sibling: api
schema_version: "4.0"
feature_id: products

# ═══════════════════════════════════════════════════════════════════════════
# PRODUCTS — REWRITTEN AGAIN 2026-08-07 by /idea-sync (Open Data research)
#
# ⚠ THIS FILE REVERSES A CONCLUSION FROM 2026-08-06.
#
# That pass wrote, in capitals: "OBIE HAS NO PRODUCT CATALOGUE. There is no 'list a bank's
# published products' resource." It then redefined the screen from "browse what the bank offers"
# to "the terms of my account", and deleted the bank-selection and audience-split logic as
# purposeless.
#
# THAT WAS WRONG, and wrong in a specific way worth naming: it reasoned about OBIE Read/Write
# (the consented AIS surface) and concluded about OBIE entire. The **OBIE Open Data** standard
# has a product catalogue, HSBC publishes it, and it needs no consent, no token and no session.
#   https://develop.hsbc.com/ob-api-overview/api-overview-6  ("UK Product Finder")
#
# The catalogue meaning of this screen is RESTORED. Both readings are now available and they are
# different features — see two_distinct_capabilities below.
#
# Evidence — Tier 1, live responses captured 2026-08-07 (all HTTP 200). Each is REPRODUCIBLE:
# the endpoints are public, unauthenticated and free, so the reproduction command below is the
# primary provenance — stronger than a checked-in snapshot, which goes stale as meta.LastUpdated
# moves. Every GET carries `Accept: application/prs.openbanking.opendata.v2.2+json`.
#
#   10 PCA across 2 brands
#     curl -H "Accept: application/prs.openbanking.opendata.v2.2+json" \
#       "https://api.hsbc.com/open-banking/v2.2/personal-current-accounts"
#   14 BCA
#     curl -H "Accept: application/prs.openbanking.opendata.v2.2+json" \
#       "https://api.hsbc.com/open-banking/v2.2/business-current-accounts"
#    1 CCC
#     curl -H "Accept: application/prs.openbanking.opendata.v2.2+json" \
#       "https://api.hsbc.com/open-banking/v2.2/commercial-credit-cards"
#    1 SMEL (corrected — see below; this line read "0 SMEL" until 2026-08-07 and was
#     contradicted by its own correction block)
#     curl -H "Accept: application/prs.openbanking.opendata.v2.2+json" \
#       "https://api.hsbc.com/open-banking/v2.2/unsecured-sme-loans"
#
#   Tier 2 — Product Finder swagger 2.0, v2.2.1, downloadable from
#     https://develop.hsbc.com/ob-api-documentation/product-finder-uk/endpoints
#
# LOCAL CAPTURES — OUTSIDE THIS REPOSITORY, captured 2026-08-07, NOT checked in:
#   /home/kalpesh/OpenBankingProject/HSBC_Sandbox/open-data-specs/
#     pca-probe.json · pf-business-current-accounts.json (966 KB) ·
#     pf-commercial-credit-cards.json · pf-unsecured-sme-loans.json ·
#     open-product-finder-swagger.json
#   They are one developer's machine, not shared evidence. Use the curl commands above to
#   re-verify any claim in this file; do not rely on the local paths.
# ═══════════════════════════════════════════════════════════════════════════

base_path: "https://api.hsbc.com"
host: api.hsbc.com
host_status: resolved
api_source_ref: API-OD-PRODUCT
spec: "OBIE Open Data v2.2 (swagger info.version 2.2.1)"
auth: none

inherits_from: atm-locator
inherits: [divergence_from_the_rest_of_the_app, path_namespace_rule]
inherits_note: >-
  Same host, same no-credential contract, same live-only position, same vendor media type
  application/prs.openbanking.opendata.v2.2+json, same /open-banking vs /x-open-banking split.

# ─────────────────────────────────────────────────────────────────────────
# TWO DIFFERENT THINGS THAT BOTH GET CALLED "PRODUCTS"
# ─────────────────────────────────────────────────────────────────────────
two_distinct_capabilities:
  catalogue:
    question: "What does HSBC sell?"
    source: "Open Data Product Finder — api.hsbc.com, unauthenticated, THIS FILE"
    consent: none
    reachable_before_login: true
  my_account_terms:
    question: "What are the terms of the account I hold?"
    source: "GET /accounts/{AccountId}/product on the AIS surface, permission ReadProducts"
    consent: "required — ReadProducts"
    availability: "200 on both current accounts, savings and the card; 400 on Global Money"
    retained_at: "screens/product/api.yaml — the per-account detail screen"
  rule: >-
    Do not merge them. They answer different questions, live on different hosts, and have
    opposite auth models. `products` is the catalogue; `product` is the PSU's own terms.

# ─────────────────────────────────────────────────────────────────────────
# SCOPE — all four families, per repository owner 2026-08-07
# ─────────────────────────────────────────────────────────────────────────
scope_decision:
  decided_by: "repository owner, 2026-08-07"
  choice: "All four product families, not PCA-only."
  note: >-
    This widens the app past the consumer-only framing recorded in idea-plan.yaml. It is coherent
    on its own terms: Open Data is a PUBLIC CATALOGUE, not PSU data, so listing business products
    is a browse-and-compare surface rather than a business-banking capability. Nothing here reads
    or writes anything belonging to the PSU.

operations:

  - id: get_personal_current_accounts
    endpoint: "GET /open-banking/v2.2/personal-current-accounts"
    auth: none
    response: { dto: PcaProduct, collection: true, envelope: "data[].Brand[].PCA[]" }
    observed: "10 products — first direct 2, HSBC UK 8. Payload ~83 KB."
    primary: true

  - id: get_business_current_accounts
    endpoint: "GET /open-banking/v2.2/business-current-accounts"
    auth: none
    response: { dto: BcaProduct, collection: true, envelope: "data[].Brand[].BCA[]" }
    observed: "14 products, HSBC UK only. Payload ~966 KB."
    payload_warning: >-
      966 KB in one unpaged response — by far the largest call the app makes, roughly 11× the PCA
      feed. There is no limit, offset or cursor parameter anywhere in the spec. Do not fetch this
      on a screen open; fetch on demand, cache hard, and never on a metered connection without
      cause.

  - id: get_commercial_credit_cards
    endpoint: "GET /open-banking/v2.2/commercial-credit-cards"
    auth: none
    response: { dto: CccProduct, collection: true, envelope: "data[].Brand[].CCC[]" }
    observed: "1 product, HSBC UK only. Payload ~8 KB."

  - id: get_unsecured_sme_loans
    endpoint: "GET /open-banking/v2.2/unsecured-sme-loans"
    auth: none
    response: { dto: SmeLendingProduct, collection: true, envelope: "data[].Brand[].SMELoan[]" }
    observed: "ONE product — 'Small Business Loan', £1,000–£25,000, with full tier bands."
    # ══ CORRECTED 2026-08-07 — the earlier reading of this endpoint was WRONG ══
    corrected_2026_08_07:
      previous_claim: "ZERO products. HSBC publishes no unsecured SME loans. The family is empty."
      the_claim_was_false: "The family has a product and always did."
      root_cause: >-
        The wire key was read off the SWAGGER DEFINITION NAME instead of the response. The
        definition is `SMELendingDefinition`, so `SMELending` was assumed to be the array key.
        The actual property is `SMELoan`. A jq query using `.SMELending[]?` returned nothing —
        and the trailing `?` silently swallowed the missing-key error, so an empty result looked
        like an empty family rather than a wrong query.
      lesson: >-
        The array key does NOT follow the definition name on this API, and it does not follow the
        endpoint name either (`unsecured-sme-loans` → `SMELoan`). Read the key off a live
        response, never infer it. This is the same class of error as the 2026-08-06 invented ATM
        host: a plausible value substituted for an observed one.
      also_corrected: "meta.TotalResults — see total_results_counts_products below."
    key_naming_trap:
      endpoint: "unsecured-sme-loans"
      definition: "SMELendingDefinition"
      actual_array_key: "SMELoan"
      warning: >-
        Three different names for one family. A generic parser that derives the key from either
        the endpoint or the definition gets nothing back and reports an empty catalogue.

  # ── Segment extensions ────────────────────────────────────────────────
  - id: get_pca_by_segment
    endpoint: "GET /x-open-banking/v2.2/personal-current-accounts/segment/{segment}"
    auth: none
    parameters:
      - name: segment
        in: path
        required: true
        declared: [Basic, General, Graduate, Packaged, Premium, Reward, Student, YoungAdult, Youth]
        observed_live: [Basic, General, Graduate, Premium, Student, Youth]
    segment_note: >-
      Nine declared, SIX observed. Packaged, Reward and YoungAdult appear on no live PCA. Build
      the segment filter from the six that occur — a chip for a segment HSBC does not publish
      returns an empty list and reads to the user as "no accounts for students like me".
    # ── CORRECTED 2026-08-07 ──
    the_declared_nine_are_PCA_ONLY:
      finding: >-
        The nine declared values and the six observed ones both describe PERSONAL current
        accounts. They do NOT generalise: each family has its own segment vocabulary, and the
        other three families publish values that appear nowhere in the declared nine.
      observed_per_family:
        PCA:  [Basic, General, Graduate, Premium, Student, Youth]
        BCA:  [Standard, Startup, Switcher, Religious, NonCommercial]
        CCC:  [General]
        SMEL: [Business]
      consequence: >-
        A single shared segment picker is wrong. Offering "Graduate" on business current accounts
        returns nothing, and "Startup" is unreachable if the chip set is built from the PCA list.
        The picker must be per-family and derived from that family's own response.
    response: { dto: PcaProduct, collection: true, envelope: "data[].Brand[].PCA[]" }
  - id: get_bca_by_segment
    endpoint: "GET /x-open-banking/v2.2/business-current-accounts/segment/{segment}"
    auth: none
    observed_sizes: "271 KB / 500 KB / 504 KB across three segments, against 966 KB unfiltered."
    note: >-
      Reduces the BCA payload but does NOT solve it — at best it roughly halves it, and 500 KB is
      still a large mobile fetch. Previously read "the only practical way to avoid the 966 KB
      payload", which overstated it; corrected 2026-08-07 after measuring. Lazy-load the family
      and cache it; do not rely on the segment path as the mitigation.
  - id: get_ccc_by_segment
    endpoint: "GET /x-open-banking/v2.2/commercial-credit-cards/segment/{segment}"
    auth: none
  - id: get_smel_by_segment
    endpoint: "GET /x-open-banking/v2.2/unsecured-sme-loans/segment/{segment}"
    auth: none
    observed: "segment/Business -> HTTP 200, 5363 bytes, TotalResults 1 — returns the product."
    corrected_2026_08_07: >-
      Previously read "Cannot return anything — the unfiltered family is empty." Wrong twice: the
      family is not empty (see corrected_2026_08_07 on get_unsecured_sme_loans), and this path
      demonstrably returns the product. The note was written before the SMELoan key error was
      found and was never revisited.

# ─────────────────────────────────────────────────────────────────────────
# EMPTY FAMILIES — decided 2026-08-07
# ─────────────────────────────────────────────────────────────────────────
empty_family_rule:
  decided_by: "repository owner, 2026-08-07"
  rule: "HIDE a family's tab when its product array is empty."
  status: "STANDS — but the premise it was decided on was false. See premise_correction."
  scope: >-
    GENERAL, and now necessarily so. The tab set is derived from the response at runtime — any
    family whose array comes back empty is not rendered.
  rationale: >-
    A permanently blank tab reads to a user as a broken screen, not as an empty catalogue.
  premise_correction:
    what_the_decision_was_based_on: >-
      A report that HSBC publishes ZERO unsecured SME loans, so one of the four tabs would always
      be blank. That report was WRONG — it came from parsing the SMEL response with the wrong
      array key (`SMELending` instead of `SMELoan`). All FOUR families return products.
    does_the_decision_still_hold: >-
      Yes, and it is now purely defensive rather than load-bearing. Nothing in the live catalogue
      currently triggers it. It remains correct because a family CAN empty — a segment-filtered
      query already returns `data: []` today — and because a blank tab is the wrong failure mode
      whenever that happens.
    what_changed_materially: >-
      The rule went from "fixes a known live problem" to "guards a possible one". Anyone planning
      work off it should know it is no longer closing an observed gap.
  consequence_for_tests:
    corrected: >-
      There is NO live empty-family fixture. The earlier expectation — "a four-family fetch must
      render three tabs" — is FALSE and must not be written as a test. A four-family fetch renders
      FOUR tabs.
    how_to_test_the_rule_instead: >-
      An unrecognised segment returns HTTP 200 with `data: []` — that is the real, reachable empty
      case and the right fixture for this rule. It is not a 400.
  do_not: >-
    Do not show an empty-state message inside a rendered tab. The decision is to HIDE the tab,
    not to explain the emptiness.

# ─────────────────────────────────────────────────────────────────────────
# THE TRAP ON THIS SCREEN — Identification is NOT unique
# ─────────────────────────────────────────────────────────────────────────
identification_is_not_a_key:
  finding: >-
    Product `Identification` REPEATS within a brand. In the live PCA feed, `fdFirAcc`, `BankAcc`
    and `PremAcc` each appear TWICE — 10 records for 7 distinct products.
  what_differs: >-
    Not the product. The MARKETING STATE. The two `BankAcc` records are the same Bank Account in
    two states:
      record 0 — PCAMarketingState.Identification "Regular - No Offer",
                 FirstMarketedDate 2017-01-01, LastMarketedDate 2099-12-31
      record 1 — PCAMarketingState.Identification "HSBC Bank £220 Switch and Spend",
                 FirstMarketedDate 2026-06-15, LastMarketedDate absent
  consequence: >-
    A list keyed on Identification renders "Bank Account" twice, "HSBC Premier Account" twice and
    "1st Account" twice, with no visible difference between the rows. This is the single most
    likely bug on this screen and it is present in the very first response.
  correct_model: >-
    Group by Identification. One product, one row. The promotional state is an OFFER on that
    product — "£220 when you switch" is a badge, not a second account. That is also the more
    useful UI: the offer is the reason a person is on this screen.
  marketing_state_values_observed: [Regular, Promotional]
  sentinel_date: >-
    LastMarketedDate 2099-12-31 means "indefinite", not a real end date. Do not render it. An
    absent LastMarketedDate on a Promotional state means the offer is currently live.

# ─────────────────────────────────────────────────────────────────────────
# BRANDS — first direct IS here, unlike the ATM feed
# ─────────────────────────────────────────────────────────────────────────
brands:
  observed: ["HSBC UK", "first direct"]
  significance: >-
    The ATM and Branch feeds returned "HSBC UK" only across 135 ATMs and 25 branches. This feed
    returns BOTH — first direct publishes 2 PCAs including the 1st Account. So the brand split is
    REAL in the estate, and the earlier caution against hardcoding a single brand on the strength
    of the locator samples is now vindicated rather than merely prudent.
  ui_consequence: >-
    Products must be grouped or labelled by brand. first direct is a distinct bank to a customer,
    not an HSBC sub-label, and showing its 1st Account in an undifferentiated HSBC list is wrong.
  # ══ CORRECTED 2026-08-07 — the previous reading of this field was WRONG and DANGEROUS ══
  on_sale_indicator:
    location: "Brand-level AND product-level — and NOT present on every family."
    withdrawn_claim:
      was: '"true on every brand and every product in the sample" / "A false value … never observed, so untested"'
      why_it_was_wrong: >-
        It was measured on the PCA feed alone and generalised to all four families. PCA is the
        one family where it happens to be true.
    observed_per_family:
      PCA:  "brand-level [true, true]; products true. The sample the wrong claim came from."
      BCA:  "brand-level FALSE. 9 of 14 products FALSE."
      CCC:  "key ABSENT at brand and product level."
      SMEL: "key ABSENT at brand and product level."
    the_dangerous_interaction:
      severity: high
      mechanism: >-
        A shared `filter { it.onSaleIndicator }` — the obvious implementation, and what the old
        note invited — evaluates false-or-missing on THREE of the four families. Those three
        collapse to zero products against four HTTP 200 responses.
      why_it_compounds: >-
        `empty_family_rule` then HIDES a family whose array is empty. So the two rules combine to
        render ONE tab where four families returned data, with NO error and NO empty state —
        the app looks like it only supports personal current accounts. Neither rule is wrong on
        its own; together, on this data, they silently delete three quarters of the catalogue.
      required_handling: >-
        Treat ABSENT as on-sale, not as false. Filter ONLY where the key is present AND false.
        The empty-family rule must key on "the array came back empty", never on "everything got
        filtered out" — those are different conditions and only the first is HSBC telling you
        something.
    what_false_actually_means: >-
      Still not established. BCA carries it false at brand level while returning 14 products, so
      it plainly does not mean "this brand sells nothing". Do not build copy on a reading of it.

response_envelope:
  shape: "{ meta, data } — data is an ARRAY"
  data_nesting: "data[] → [i].Brand[] → [j].{BrandName, OnSaleIndicator, <FAMILY>[]}"
  family_key_varies:
    PCA: "data[].Brand[].PCA[]"
    BCA: "data[].Brand[].BCA[]"
    CCC: "data[].Brand[].CCC[]"
    SMEL: "data[].Brand[].SMELoan[]"
    warning: >-
      The product array key CHANGES PER FAMILY and follows NEITHER the endpoint name NOR the
      swagger definition name. `unsecured-sme-loans` + `SMELendingDefinition` → `SMELoan`.
      A generic parser must be TOLD the key; deriving it produces a silent empty result.
  total_results_counts_products:
    # CORRECTED 2026-08-07. The previous entry claimed TotalResults counts BRAND blocks and
    # called it "misleading". That was wrong, and it was wrong because it was reasoning from
    # the same broken query that produced the false empty-SMEL finding.
    observed:
      - "PCA — meta.TotalResults 10, across 2 brand blocks, 10 products. Counts products."
      - "SMEL — meta.TotalResults 1, 1 brand block, 1 product."
      - "CCC — meta.TotalResults 1, 1 brand block, 1 product."
    disambiguating_case: "PCA is the one that settles it: 2 brands but TotalResults 10, so it cannot be counting brands."
    reading: "TotalResults is a reliable PRODUCT count. Safe to use."
    previous_claim_withdrawn: >-
      "TotalResults appears to count BRAND blocks — never use it as a product count." False.
      It was inferred from the SMEL response while that response was being parsed with the wrong
      array key, so a real 1-product feed looked like 1-brand-zero-products.

product_record:
  observed_keys: [Identification, Name, OnSaleIndicator, PCAMarketingState, Segment]
  marketing_state_keys: [CoreProduct, Eligibility, FeaturesAndBenefits, FirstMarketedDate, Identification, LastMarketedDate, MarketingState, OtherFeesCharges, Overdraft, PredecessorID, Ucodes]
  where_the_substance_lives: >-
    The product record itself is thin — a name, an id, a segment. Everything a customer would
    compare (eligibility, features, overdraft terms, fees) is inside PCAMarketingState, and it is
    where nearly all of the 83 KB sits. A comparison UI reads that block; a list UI does not need
    it and should not parse it.
  predecessor_id:
    corrected_2026_08_07: >-
      Previously read "Links a product to the one it replaced — the audit trail behind a renamed
      account." That was inferred from the field NAME, not read from the data.
    observed_values: ['"N/A" x7', '"Regular - No Offer" x2', '"Regular – No Offer" x1 (EN-DASH, not a hyphen)']
    reading: >-
      It never holds a product Identification. Where it holds anything, it repeats a MARKETING
      STATE name — and one of those repeats it with an en-dash where the sibling uses a hyphen,
      so even string-matching the two together fails.
    consequence: "Do NOT build a product-lineage or 'replaced by' feature on this field. It does not carry that."

error_cases:
  codes:
    - http: 400
      meaning: "Bad request."
      NOT_triggered_by_an_unrecognised_segment:
        corrected_2026_08_07: >-
          This row previously read "e.g. an unrecognised segment", which contradicted this file's
          own empty_family_rule.consequence_for_tests ("It is not a 400"). Re-probed live:
          segment/Zzz, segment/Packaged and unsecured-sme-loans/segment/General ALL return an
          identical 322-byte HTTP 200 with `data: []`.
        consequence: >-
          An unknown segment is indistinguishable from a real segment with no products. The app
          cannot detect a typo'd or withdrawn segment from the response — which is another reason
          to build the picker from OBSERVED values only.
    - { http: 408, meaning: "Request timeout" }
    - { http: 429, meaning: "Too many requests", recovery: "Back off. Real risk on an unauthenticated public API." }
    - { http: 500, meaning: "Internal server error" }
    - { http: 503, meaning: "Service unavailable" }
  no_auth_errors: "No 401 and no 403 on any path."

removed_2026_08_06_still_stands:
  - operation: obp_products
    was: "GET /obp/v3.0.0/banks/{bankId}/products"
    reason: "OBP sandbox endpoint. Superseded by the Open Data Product Finder, not by nothing."
  - behaviour: "per-bank parallel fetch"
    reason: "There is one bank group. The multi-bank model was OBP's — though note the BRAND split (HSBC UK / first direct) is real and does need handling."
  - behaviour: "client-side Personal/Business audience split (scopeOf / BUSINESS_MARKERS)"
    reason: >-
      Existed because OBP returned null category and family. Open Data separates the audiences by
      ENDPOINT — personal-current-accounts vs business-current-accounts — so the split is now a
      routing decision, not a client-side heuristic.

open_item: >-
  CLOSED 2026-08-07 for the YAML siblings. ui.yaml, data-flow.yaml, demo-data.yaml, tests.yaml and
  flow.yaml were rewritten against this contract in the same pass, and demo-data.yaml was replaced
  wholesale with records captured verbatim from live api.hsbc.com responses — the Nairobi / KCB
  fixture set flagged on 2026-08-06 is gone. See docs.yaml#status_history for that pass.
  STILL OWED: no preview re-render, no mockup regeneration, and no source reconciliation — the
  shipped feature/products Kotlin still implements the 2026-06 per-bank catalogue model and is now
  itself the drift. The api contract was corrected first because everything else derives from it.
