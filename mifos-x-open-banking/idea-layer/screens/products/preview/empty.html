<html lang="en" data-screen="products" data-state="empty" data-feature="products" data-flavor="consumer">

<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--on-primary-container:#004B6F;--secondary:#50606E;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E;--outline-variant:#C1C7CE;--nav-active:#D3E5F5}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px 100px;text-align:center}
.empty-icon{width:96px;height:96px;border-radius:48px;background:var(--surface-variant);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.empty-icon .material-icons{font-size:var(--icon-2xl);color:var(--outline)}
.empty-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.empty-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;max-width:300px;margin-bottom:24px}
.actions{display:flex;gap:10px}.btn{padding:12px 22px;border-radius:999px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.btn-primary{background:var(--primary);color:var(--on-primary);border:none}.btn-secondary{background:transparent;color:var(--primary);border:1px solid var(--outline)}.btn .material-icons{font-size:var(--icon-sm)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;height:80px;background:var(--background);border-top:1px solid var(--outline-variant);padding:8px 0 20px}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;position:relative}.nav-item .material-icons{font-size:var(--icon-sm);color:var(--on-surface-variant)}.nav-item .nav-label{font-size:11px;color:var(--on-surface-variant);font-weight:500}.nav-item.active .material-icons{color:#004B6F}.nav-item.active .nav-label{color:#004B6F;font-weight:600}.nav-item.active::before{content:'';position:absolute;top:6px;width:48px;height:28px;background:var(--nav-active);border-radius:14px;z-index:-1}
[data-theme="light"]{--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--on-primary-container:#004B6F;--secondary:#50606E;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E;--outline-variant:#C1C7CE;--nav-active:#D3E5F5}[data-theme="dark"]{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--secondary:#B7C9D9;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198;--outline-variant:#41474D;--nav-active:#004B6F}@media (prefers-color-scheme:dark){:root{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--secondary:#B7C9D9;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198;--outline-variant:#41474D;--nav-active:#004B6F}.nav-item.active .material-icons,.nav-item.active .nav-label{color:#C9E6FF}}</style>
</head>
