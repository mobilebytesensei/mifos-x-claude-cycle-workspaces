<!doctype html>
<!-- render-hash: prod-loading-01 -->
<html lang="en" data-screen="products" data-state="loading" data-feature="products" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Products — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#266489;--primary-container:#C9E6FF;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline-variant:#C1C7CE;--nav-active:#D3E5F5}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1;padding-bottom:96px}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;flex:1;letter-spacing:-0.2px}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.intro-skel{height:14px;width:80%;margin:0 20px 16px}
.tabs-skel{display:flex;gap:8px;padding:0 20px 16px}.tabs-skel .c{height:32px;width:80px;border-radius:999px}
.card-skel{background:var(--surface);border:1px solid var(--outline-variant);border-radius:18px;margin:0 20px 14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card-skel .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card-skel .meta{flex:1;display:flex;flex-direction:column;gap:6px}.card-skel .cat{height:10px;width:120px}.card-skel .name{height:18px;width:70%}.card-skel .rate{height:28px;width:80px}
.card-skel .desc{height:11px;width:90%}.card-skel .desc2{height:11px;width:60%}
.card-skel .chips{display:flex;gap:6px}.card-skel .chip{height:22px;width:90px;border-radius:8px}
.card-skel .actions{display:flex;gap:10px}.card-skel .btn{height:36px;width:90px;border-radius:999px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;height:80px;background:var(--background);border-top:1px solid var(--outline-variant);padding:8px 0 20px}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}.nav-item .material-icons{font-size:var(--icon-sm);color:var(--on-surface-variant)}.nav-item .nav-label{font-size:11px;color:var(--on-surface-variant);font-weight:500}.nav-item.active .material-icons,.nav-item.active .nav-label{color:#004B6F}.nav-item.active::before{content:'';position:absolute;top:6px;width:48px;height:28px;background:var(--nav-active);border-radius:14px;z-index:-1}
[data-theme="light"]{--primary:#266489;--primary-container:#C9E6FF;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline-variant:#C1C7CE;--nav-active:#D3E5F5}[data-theme="dark"]{--primary:#95CDF7;--primary-container:#004B6F;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline-variant:#41474D;--nav-active:#004B6F}@media (prefers-color-scheme:dark){:root{--primary:#95CDF7;--primary-container:#004B6F;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline-variant:#41474D;--nav-active:#004B6F}.nav-item.active .material-icons,.nav-item.active .nav-label{color:#C9E6FF}}</style>
</head>
