# ─────────────────────────────────────────────────────────────────────────
# DESIGN CONSTRAINTS THIS LAYOUT EXISTS TO SATISFY
# ─────────────────────────────────────────────────────────────────────────
design_constraints:
  - id: DC-GROUP
    constraint: "One product, one row."
    from: "api.yaml#identification_is_not_a_key"
    why: >-
      The PCA feed returns 10 records for 7 products. fdFirAcc, BankAcc and PremAcc
      each appear twice, differing only in their marketing state. A list built row-per-record
      shows "Bank Account" twice, identically. Group on (BrandName, Identification);
      render the promotional state as a badge on the single row.
  - id: DC-BRAND
    constraint: "Brand is a heading, not a field."
    from: "api.yaml#brands"
    why: >-
      first direct is a different bank to a customer. Its 1st Account sitting
      unlabelled between HSBC accounts is a factual error on screen, not a styling
      preference.
  - id: DC-FAMILY
    constraint: "The tab row selects an ENDPOINT, not a filter."
    from: "api.yaml#scope_decision"
    why: >-
      Personal and Business products come from different URLs. Selecting a tab
      issues a request; it does not narrow a list already in memory. This is the
      opposite of the removed ProductScope tabs, which never fetched.
  - id: DC-BCA-WEIGHT
    constraint: "Never fetch business-current-accounts on screen open."
    from: "api.yaml#get_business_current_accounts.payload_warning"
    why: >-
      966 KB unpaged, 11x the PCA feed, with no limit/offset/cursor in the spec.
      Fetch when the Business tab is first selected, cache for the session.
  - id: DC-NO-AUTH
    constraint: "No signed-out state, no sign-in prompt, no session handling."
    from: "api.yaml#error_cases.no_auth_errors"
    why: >-
      The API takes no credential. 401 and 403 do not occur on any path. A
      session-expired state here is dead code that promises the user something
      untrue.
  - id: DC-ONSALE
    constraint: "Never apply one shared on-sale filter across families."
    from: "demo-data.yaml#ccc_records_verbatim, #bca_records_verbatim"
    why: >-
      CCC and SMEL carry NO OnSaleIndicator key at all; BCA carries `false` at
      BRAND level and on 9 of its 14 products. A shared `filter { onSale }` empties
      three families out of four against four successful responses.
  - id: DC-SENTINEL
    constraint: "Never render 2099-12-31 or 1970-01-01 as a date."
    from: "api.yaml#identification_is_not_a_key.sentinel_date, demo-data.yaml#empty_case"
    why: "Both are sentinels — 'indefinite' and 'never'. Printed, they read as bugs."
  - id: DC-DIRTY
    constraint: "Trim every string and normalise every URL at the mapper boundary."
    from: "demo-data.yaml#wire_defects"
    why: >-
      Live display names carry trailing spaces, a live ProductURL is scheme-less
      ('www.business.hsbc.uk'), another has three trailing tabs inside it, and one
      PredecessorID uses an en-dash where its sibling uses a hyphen.

components:

  # ── Page title — rendered in the TopAppBar. ──────────────────────────
  - type: text
    id: products_title
    label: "Products"
    content: "Products"
    style:
      typography: titleLarge
      color: onSurface
      font_weight: semibold
    a11y:
      label: "Products"
      role: heading
    test_context:
      tag: products_title
      assert_text: "Products"

  # ── Public-data caption. Sets the expectation that this is a catalogue,
  #    not the user's own accounts, and that no sign-in is involved. ────
  - type: text
    id: products_public_caption
    label: "Public catalogue caption"
    content: "Published product information from HSBC UK and first direct. No sign-in needed."
    style:
      typography: bodySmall
      color: onSurfaceVariant
      padding_horizontal: 16
      padding_bottom: 8
    a11y:
      label: "These are publicly published products, not your accounts. No sign-in is needed."
      role: text
    test_context:
      tag: products_public_caption
      purpose: "Distinguishes the public catalogue from the PSU's own account terms, which live on the separate product screen"
      interaction_type: display

  # ── Family tab row. FOUR tabs, derived at runtime from which families
  #    returned a non-empty product array (empty_family_rule). Selecting a
  #    tab ISSUES A REQUEST — these are endpoints, not filters. ─────────
  - type: tab_bar
    id: products_family_tabs
    label: "Product family tabs"
    style:
      orientation: horizontal
      background: surface
      scrollable: true
    on_click:
      action: onFamilySelected
      target: ""
      action_contract:
        effect: fetch_data
        writes_to: "ProductsContent.selectedFamily, ProductsContent.groups, ProductsContent.segments"
        external_library_refs: [kotlinx-coroutines, ktor-client]
        description: >-
          Selects a product family and loads it. Each family is a DIFFERENT endpoint —
          personal-current-accounts, business-current-accounts, commercial-credit-cards,
          unsecured-sme-loans — so a tab change fetches rather than filters. A family
          already fetched this session is served from cache. Also resets the segment
          chip selection, because segment vocabularies do not overlap between families.
    a11y:
      label: "Choose a product family"
      role: tablist
    keyboard:
      focusable: true
    test_context:
      tag: products_family_tabs
      purpose: "Family selector — Personal / Business / Commercial cards / Business loans; one endpoint per tab"
      interaction_type: action
      data_driven: true
      required_fields: [families, selectedFamily]

  - type: text
    id: products_tab_personal
    label: "Personal"
    content: "Personal"
    style:
      typography: labelLarge
      color: primary
    on_click:
      action: onFamilySelected
      target: PCA
      action_contract:
        effect: fetch_data
        writes_to: "ProductsContent.selectedFamily, ProductsContent.groups"
        external_library_refs: [kotlinx-coroutines, ktor-client]
        description: >-
          Loads GET /open-banking/v2.2/personal-current-accounts — 10 records across
          two brands, roughly 83 KB. This family is fetched eagerly on screen open,
          so selecting the tab is normally a cache read.
    a11y:
      label: "Personal current accounts"
      role: tab
      selected: true
    keyboard:
      focusable: true
    test_context:
      tag: products_tab_personal
      assert_text: "Personal"

  - type: text
    id: products_tab_business
    label: "Business"
    content: "Business"
    style:
      typography: labelLarge
      color: onSurfaceVariant
    on_click:
      action: onFamilySelected
      target: BCA
      action_contract:
        effect: fetch_data
        writes_to: "ProductsContent.selectedFamily, ProductsContent.groups, ProductsContent.familyLoading"
        external_library_refs: [kotlinx-coroutines, ktor-client]
        description: >-
          Loads GET /open-banking/v2.2/business-current-accounts on FIRST selection only,
          then caches for the session. The response is ~966 KB unpaged with no cursor
          anywhere in the spec, so it must never be prefetched on screen open. Shows the
          loading state while it downloads, because on a slow connection this is a
          multi-second wait and an unexplained blank tab reads as a broken screen.
    a11y:
      label: "Business current accounts"
      role: tab
      selected: false
    keyboard:
      focusable: true
    test_context:
      tag: products_tab_business
      assert_text: "Business"

  - type: text
    id: products_tab_cards
    label: "Commercial cards"
    content: "Commercial cards"
    style:
      typography: labelLarge
      color: onSurfaceVariant
    on_click:
      action: onFamilySelected
      target: CCC
      action_contract:
        effect: fetch_data
        writes_to: "ProductsContent.selectedFamily, ProductsContent.groups"
        external_library_refs: [kotlinx-coroutines, ktor-client]
        description: >-
          Loads GET /open-banking/v2.2/commercial-credit-cards — one product, ~8 KB.
          This family carries NO OnSaleIndicator at brand or product level, so the
          mapper must treat a missing indicator as "on sale" rather than filtering
          the family away.
    a11y:
      label: "Commercial credit cards"
      role: tab
      selected: false
    keyboard:
      focusable: true
    test_context:
      tag: products_tab_cards
      assert_text: "Commercial cards"

  - type: text
    id: products_tab_loans
    label: "Business loans"
    content: "Business loans"
    style:
      typography: labelLarge
      color: onSurfaceVariant
    on_click:
      action: onFamilySelected
      target: SMEL
      action_contract:
        effect: fetch_data
        writes_to: "ProductsContent.selectedFamily, ProductsContent.groups"
        external_library_refs: [kotlinx-coroutines, ktor-client]
        description: >-
          Loads GET /open-banking/v2.2/unsecured-sme-loans — one product, the Small
          Business Loan, £1,000 to £25,000. The wire array key is SMELoan, which
          matches neither the endpoint segment nor the swagger definition name; the
          mapper must be given the key explicitly or it reads an empty family.
    a11y:
      label: "Unsecured business loans"
      role: tab
      selected: false
    keyboard:
      focusable: true
    test_context:
      tag: products_tab_loans
      assert_text: "Business loans"

  # ── Segment filter chips. Built from the segments OBSERVED in the loaded
  #    family's response, never from the spec's declared list. ───────────
  - type: chip_group
    id: products_segment_chips
    label: "Segment filter"
    style:
      orientation: horizontal
      scrollable: true
      padding_horizontal: 16
      padding_bottom: 8
      spacing: 8
    on_click:
      action: onSegmentSelected
      target: ""
      action_contract:
        effect: transform_state
        writes_to: "ProductsContent.selectedSegment, ProductsContent.groups"
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Narrows the loaded family to one segment. Filters the in-memory list rather
          than calling the /x-open-banking segment path, because a product can carry
          several segments and fetching per segment returns the same product in more
          than one response — BCAHSBCKinetic, BCASBBA and BCABBA each appear under
          Standard, Startup and Switcher. The segment endpoint stays available as a
          narrowing device for the Business family only, where the unfiltered payload
          is 966 KB.
    a11y:
      label: "Filter by customer segment"
      role: group
    keyboard:
      focusable: true
    test_context:
      tag: products_segment_chips
      purpose: "Segment chips built from segments observed in the loaded response — never from the spec's declared list"
      interaction_type: action
      data_driven: true
      required_fields: [segments, selectedSegment]

  - type: chip
    id: products_segment_chip
    label: "Segment"
    content: "Segment"
    supported_states: [idle, hover, focus_visible, pressed, selected]
    style:
      background: surfaceContainer
      selected_background: secondaryContainer
      border_radius: 8
      border_color: outlineVariant
      border_width: 1
      padding_horizontal: 12
      padding_vertical: 6
      typography: labelMedium
    on_click:
      action: onSegmentSelected
      target: segment
      action_contract:
        effect: transform_state
        writes_to: "ProductsContent.selectedSegment"
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Selects this segment, or clears the filter when the already-selected chip is
          tapped again. The chip set comes from the response: six on Personal (Basic,
          General, Graduate, Premium, Student, Youth), five on Business (Standard,
          Startup, Switcher, Religious, NonCommercial), one each on the other two. The
          spec declares three more Personal segments — Packaged, Reward, YoungAdult —
          that HSBC publishes on no product; a chip for one of those returns nothing
          and reads to a user as "no accounts for people like me".
    a11y:
      label: "Segment filter chip"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: products_segment_chip
      purpose: "One segment chip; the set is per-family and derived from observed data"
      interaction_type: action
      data_driven: true
      required_fields: [segments]

  # ── Brand heading. Groups the family's products by BrandName. ────────
  - type: text
    id: products_brand_heading
    label: "Brand"
    content: "Brand"
    style:
      typography: titleSmall
      color: onSurface
      font_weight: semibold
      padding_horizontal: 16
      padding_top: 16
      padding_bottom: 8
    a11y:
      label: "Products published by this brand"
      role: heading
    test_context:
      tag: products_brand_heading
      purpose: "Brand section heading — 'HSBC UK' or 'first direct'; first direct is a distinct bank, not an HSBC sub-label"
      interaction_type: display
      data_driven: true
      required_fields: [brandName]

  # ── Product card. ONE PER DISTINCT PRODUCT after grouping on
  #    (BrandName, Identification) — never one per wire record. ─────────
  - type: card
    id: product_card
    label: "Product"
    content: "Product"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      background: surfaceContainer
      border_radius: 16
      border_color: outlineVariant
      border_width: 1
      elevation: 0
      padding: 16
      margin_horizontal: 16
      margin_bottom: 12
    on_click:
      action: open_url
      target: product_url
      action_contract:
        effect: share_external
        external_library_refs: ["compose.ui.platform.LocalUriHandler"]
        description: >-
          Opens the product's public page in the platform browser. The URL is
          CoreProduct.ProductURL, which lives inside the marketing state — a list
          mapper that discards the marketing state for weight must lift ProductURL out
          before it does so, or the card loses its only affordance. The value needs
          normalising: some Business products publish a scheme-less host
          ('www.business.hsbc.uk') and one carries three trailing tab characters inside
          the URL string. Prefix https:// when absent and trim before handing over.
          The card is non-clickable when no URL is published.
    a11y:
      label: "Product. Opens the published product page in your browser."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: product_card
      purpose: "One DISTINCT product after grouping — not one per wire record; 10 PCA records render 7 cards"
      interaction_type: action
      data_driven: true
      required_fields: [identification, name, brandName, segments, offer, productUrl]

  - type: text
    id: product_name
    label: "Product name"
    content: "Product name"
    style:
      typography: titleMedium
      color: onSurface
      font_weight: medium
    a11y:
      label: "Product name"
      role: text
    test_context:
      tag: product_name
      purpose: "Display name from the Name field, trimmed — live values include 'Small Business Loan ' and 'HSBC Small Business Banking Account ' with trailing spaces"
      interaction_type: display
      data_driven: true
      required_fields: [name]

  # ── Offer badge. Present when the product has a Promotional marketing
  #    state. This is the reason most people are on this screen. ────────
  - type: badge
    id: product_offer_badge
    label: "Offer"
    content: "Offer"
    style:
      background: tertiaryContainer
      border_radius: 10
      padding_horizontal: 8
      padding_vertical: 3
      text_color: onTertiaryContainer
      typography: labelSmall
      leading_icon: local_offer
    a11y:
      label: "Current offer on this product"
      role: text
    test_context:
      tag: product_offer_badge
      purpose: "The promotional marketing state rendered as a badge on the single product row — 'HSBC Bank £220 Switch and Spend', '£175 Switch Incentive', 'HSBC Premier £500 Welcome Reward'"
      interaction_type: display
      data_driven: true
      required_fields: [offer]
    content_note: >-
      Shown only when the product carries a marketing state whose MarketingState is
      Promotional. Three of the seven Personal products do today. The badge text is
      the state's own Identification. An offer counts as live when LastMarketedDate is
      absent OR is the 2099-12-31 sentinel — both occur, so absence alone is not a
      sufficient test.

  - type: badge
    id: product_segment_badge
    label: "Segment"
    content: "Segment"
    style:
      background: surfaceContainerHigh
      border_radius: 10
      padding_horizontal: 8
      padding_vertical: 3
      text_color: onSurfaceVariant
      typography: labelSmall
    a11y:
      label: "Who this product is for"
      role: text
    test_context:
      tag: product_segment_badge
      purpose: "Segment(s) straight off the record — Segment is an ARRAY and several products carry more than one"
      interaction_type: display
      data_driven: true
      required_fields: [segments]

  - type: text
    id: product_more_info
    label: "More info"
    content: "More info"
    style:
      typography: labelMedium
      color: primary
      font_weight: semibold
      trailing_icon: open_in_new
    on_click:
      action: open_url
      target: product_url
      action_contract:
        effect: share_external
        external_library_refs: ["compose.ui.platform.LocalUriHandler"]
        description: >-
          Hands the normalised CoreProduct.ProductURL to the platform browser. Full
          terms are a separate PDF at CoreProduct.TcsAndCsURL and are not inlined here.
          There is no in-app apply journey — the Open Data feed publishes information,
          not an application resource.
    a11y:
      label: "Open the published product page in your browser"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: product_more_info
      assert_text: "More info"

  # ── Family-level failure row. Replaces the removed per-BANK failure row:
  #    a family can fail while its siblings render, because each is a
  #    separate request. ────────────────────────────────────────────────
  - type: text
    id: products_family_load_failed
    label: "Couldn't load these products"
    content: "Couldn't load these products"
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      text_align: center
      padding: 24
    a11y:
      label: "This product family could not be loaded"
      role: text
    test_context:
      tag: products_family_load_failed
      assert_text: "Couldn't load these products"
      purpose: "Inline per-FAMILY failure — the other tabs stay usable because each family is its own request"

  - type: button
    id: products_family_retry
    label: "Try again"
    content: "Try again"
    style:
      variant: text
      typography: labelLarge
      color: primary
    on_click:
      action: onRetry
      target: ""
      action_contract:
        effect: fetch_data
        writes_to: "ProductsContent.groups, ProductsContent.familyLoading"
        external_library_refs: [kotlinx-coroutines, ktor-client]
        description: >-
          Re-issues the request for the CURRENT family only. Does not re-fetch the
          families that succeeded, and in particular does not re-download the 966 KB
          Business feed to recover an 8 KB card feed.
    a11y:
      label: "Try loading these products again"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: products_family_retry
      assert_text: "Try again"

  # ── Segment-filtered empty row. Distinct from the hidden-tab rule: the
  #    FAMILY has products, this SEGMENT does not. ──────────────────────
  - type: text
    id: products_segment_empty
    label: "No products in this segment"
    content: "No products in this segment"
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      text_align: center
      padding: 24
    a11y:
      label: "No products match the selected segment"
      role: text
    test_context:
      tag: products_segment_empty
      assert_text: "No products in this segment"
      purpose: "Segment filter matched nothing. NOT the same as an empty family — the tab stays, the chips stay, and clearing the chip restores the list"

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading

  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout:
      visible_components:
        - products_title
      show_loading_icon: true
    note: >-
      Entered on screen open while the Personal family loads (~83 KB), and again on
      the first selection of the Business tab (~966 KB). In the second case the tab
      row stays visible so the user can see which tab they are waiting on.

  content:
    layout:
      visible_components:
        - products_title
        - products_public_caption
        - products_family_tabs
        - products_tab_personal
        - products_tab_business
        - products_tab_cards
        - products_tab_loans
        - products_segment_chips
        - products_segment_chip
        - products_brand_heading
        - product_card
        - product_name
        - product_offer_badge
        - product_segment_badge
        - product_more_info
        - products_family_load_failed
        - products_family_retry
        - products_segment_empty

  empty:
    layout:
      visible_components:
        - products_title
      show_empty_state: true
      empty_state_icon: inventory_2
      empty_state_title: "No products published"
      empty_state_message: "HSBC hasn't published any product information right now"
    note: >-
      WHOLE-SCREEN empty — every family came back with an empty product array, so
      there is not one tab left to render. Not reachable against the live catalogue:
      all four families return products today. A SINGLE empty family hides its own tab
      (empty_family_rule) and never reaches this state.

  error:
    layout:
      visible_components:
        - products_title
      show_error_state: true
      error_icon: cloud_off
      error_title: "Couldn't load products"
      error_message: "Something went wrong at our end. Try again."
      show_retry_button: true
    note: "Covers 408, 500 and 503. No 401 or 403 — this API takes no credential."

  no_network:
    layout:
      visible_components:
        - products_title
      show_error_state: true
      error_icon: wifi_off
      error_title: "You're offline"
      error_message: "Connect to the internet to see published products."
      show_retry_button: true
    note: >-
      Distinguished from `error` on purpose. This feed is live-only with no local
      copy, so offline is a total blank rather than stale data, and "check your
      connection" is the honest instruction rather than a guess.

  rate_limited:
    layout:
      visible_components:
        - products_title
      show_error_state: true
      error_icon: hourglass_empty
      error_title: "Too many requests"
      error_message: "Give it a moment and try again."
      show_retry_button: true
    note: >-
      ADDED 2026-08-07. HTTP 429 is a REAL risk here in a way it is not on the
      consented surfaces: an unauthenticated public API rate-limits by origin, so a
      retry loop is throttled against every user behind the same egress. Back off
      before re-issuing; do not auto-retry on a timer.

# ── REMOVED STATE ────────────────────────────────────────────────────────
removed_state_2026_08_07:
  - state: unauthenticated
    was: >-
      cloud_off shell, "Unable to load products / Check your connection and try again",
      with a retry — inherited from the OBP DirectLogin era and kept through the
      2026-08-06 AIS rewrite.
    reason: >-
      UNREACHABLE. The Open Data Product Finder takes no token, no consent, no session
      and no API key. api.yaml records no 401 and no 403 on any path. The state could
      never be entered, and its presence would put a sign-in promise on a screen where
      signing in changes nothing about what can be seen.
    also_removed_from: "screens[].states_handled, state_model.states_handled"

state_model:
  view_model: ProductsViewModel
  screen_state: "ScreenState<ProductsContent>"
  content_type: ProductsContent
  content_fields:
    - name: families
      type: List<ProductFamily>
      default: "emptyList()"
      note: "DERIVED AT RUNTIME. A family whose product array came back empty is absent from this list and its tab is not rendered (empty_family_rule). Never a hardcoded list of four."
    - name: selectedFamily
      type: ProductFamily
      default: ProductFamily.PCA
    - name: segments
      type: List<String>
      default: "emptyList()"
      note: "Segments OBSERVED in the loaded family's response. Per-family: Personal and Business share none of their values."
    - name: selectedSegment
      type: String?
      default: "null"
      note: "null means no segment filter."
    - name: groups
      type: List<BrandGroup>
      default: "emptyList()"
    - name: familyLoading
      type: Boolean
      default: "false"
      note: "True while a tab's first fetch is in flight — chiefly the Business family's 966 KB."
    - name: familyLoadFailed
      type: Boolean
      default: "false"
      note: "Scoped to the SELECTED family. A failure on one family leaves the others rendered and selectable."
  enums:
    - name: ProductFamily
      values: [PCA, BCA, CCC, SMEL]
      note: >-
        One endpoint each. The WIRE ARRAY KEY per family is PCA / BCA / CCC / SMELoan —
        note SMELoan, which matches neither the endpoint (`unsecured-sme-loans`) nor the
        swagger definition (`SMELendingDefinition`). The parser must be given the key.
  row_types:
    - name: BrandGroup
      fields:
        - { name: brandName, type: String, note: "'HSBC UK' or 'first direct'" }
        - { name: products, type: List<ProductRow> }
    - name: ProductRow
      grouping_key: "(brandName, identification)"
      fields:
        - { name: identification, type: String, note: "NOT unique across records. Only unique after grouping, and only within a brand." }
        - { name: name, type: String, note: "trim() at the mapper — live values carry trailing spaces" }
        - { name: brandName, type: String }
        - { name: segments, type: List<String>, note: "Segment is an ARRAY on the wire; several products carry two or three" }
        - { name: offer, type: ProductOffer?, note: "null when the product has no Promotional marketing state" }
        - { name: productUrl, type: String?, note: "CoreProduct.ProductURL, lifted out of the marketing state, trimmed and https-normalised. Null when not published." }
        - { name: termsUrl, type: String?, note: "CoreProduct.TcsAndCsURL — the terms PDF" }
    - name: ProductOffer
      fields:
        - { name: label, type: String, note: "The promotional marketing state's own Identification" }
        - { name: live, type: Boolean, note: "LastMarketedDate absent OR equal to the 2099-12-31 sentinel" }
  errors:
    - { field: global, code: LOAD_FAILED, message: "Couldn't load products. Try again." }
    - { field: global, code: RATE_LIMITED, message: "Too many requests. Give it a moment and try again." }
  events:
    - onFamilySelected
    - onSegmentSelected
    - onRetry
  actions:
    - onFamilySelected
    - onSegmentSelected
    - onRetry
    - open_url
    - navigate_back
  states_handled: [loading, content, empty, error, no_network, rate_limited]
  di:
    - ProductCatalogueRepository

removed_state_model_fields_2026_08_07:
  - { field: banks, type: List<ProductBank>, reason: "There is one bank group. The bank list was OBP's multi-ASPSP model." }
  - { field: selectedBankId, type: String, reason: "Nothing to select between." }
  - { field: bankLoadFailed, type: Boolean, reason: "Replaced by familyLoadFailed — the unit of failure is the family, because each family is its own request." }
  - { field: scope, type: ProductScope, reason: "Audience is now which endpoint you call, not a client-side filter over one list." }
  - enum: ProductScope
    values: [PERSONAL, BUSINESS]
    reason: "Derived from BUSINESS_MARKERS keyword matching on code and name, which existed only because OBP returned null category. Open Data separates the audiences by URL."
  - enum: ProductCategory
    values: [EVERYDAY, SAVINGS, CARDS, LOANS]
    reason: >-
      Derived client-side via categoryOf for the same reason. The Open Data record has
      no category field at all, and the four families are not these four buckets. The
      per-card category badge is replaced by the SEGMENT badge, which is real data.
  - { di: AccountsRepository, reason: "This screen reads nothing belonging to the PSU. It does not need to know what accounts they hold — that is screens/product/." }
  - { di: BanksRepository, reason: "No bank directory to resolve. One bank group, two brands, both named in the response." }

api:
  contract: "screens/products/api.yaml — that file is the source of truth; do not restate operations here"
  summary: >-
    HSBC UK Open Data Product Finder, OBIE Open Data v2.2, host api.hsbc.com, NO auth.
    Four families over four endpoints, plus a per-family /x-open-banking segment path.
    Envelope is three levels — data[] → Brand[] → <FAMILY>[] — and the innermost key
    changes per family.
  operations_consumed:
    - { id: get_personal_current_accounts, when: "screen open", weight: "~83 KB" }
    - { id: get_business_current_accounts, when: "first selection of the Business tab, never on open", weight: "~966 KB" }
    - { id: get_commercial_credit_cards, when: "first selection of the Commercial cards tab", weight: "~8 KB" }
    - { id: get_unsecured_sme_loans, when: "first selection of the Business loans tab", weight: "~5 KB" }
    - { id: get_bca_by_segment, when: "optional narrowing for the Business family only", weight: "271-504 KB — halves the problem, does not solve it" }

# ── HISTORY. Retained deliberately; do not delete. ───────────────────────
removed_operations_note: >-
  The 2026-08-06 pass replaced the OBP catalogue with per-account AIS reads on the
  premise that "OBIE has no product catalogue". The premise was false — it reasoned
  about OBIE Read/Write and concluded about OBIE entire. The OBP removals still stand,
  but for a corrected reason, and the AIS replacement they justified has moved to
  screens/product/ (singular) where it is the right feature.

removed_operations_2026_08_06_superseded_2026_08_07:
  - { id: obp_products, was: "GET /obp/v3.0.0/banks/{bankId}/products", reason_2026_08_06: "OBIE has no product catalogue.", reason_now: "OBP sandbox endpoint, superseded by the Open Data Product Finder — not by nothing." }
  - { id: obp_get_my_accounts, was: "GET /obp/v3.0.0/my/accounts", reason: "Was used to discover which banks to fan out over. There is no fan-out." }
  - { id: search_products, reason: "Deferred, never wired. The Open Data spec has no search resource either." }
  - { id: get_account_product, was: "GET /obie/open-banking/v4.0/aisp/accounts/{AccountId}/product", reason: "Real, but it answers 'what are the terms of MY account'. Moved to screens/product/ — a different question, a different host, and the opposite auth model." }
  - { id: get_accounts, was: "GET /obie/open-banking/v4.0/aisp/accounts", reason: "Only existed to drive the per-account loop. This screen reads nothing belonging to the PSU." }
  - fields: [category, family, super_family, more_info_url]
    was: "OBP record fields"
    reason: >-
      No Open Data counterpart under those names. The outbound URL DOES exist —
      CoreProduct.ProductURL inside the marketing state — which reverses the
      2026-08-06 note that "more_info_url has no equivalent at all" and restores the
      card's affordance.

dependencies:
  tier: feature
  features: []
  note: >-
    NO feature dependencies. The 2026-06 spec depended on `accounts` because the OBP
    model discovered banks from the PSU's accounts. This screen reads a public
    catalogue and is reachable before login.

navigation:
  - action: open_url
    target: product_url
    description: "Open the product's published page (CoreProduct.ProductURL, trimmed and https-normalised) in the platform browser. The only outbound affordance; there is no in-app apply journey."
  - action: onFamilySelected
    target: ""
    description: "Select a product family. Issues a request — each family is a different endpoint."
  - action: onSegmentSelected
    target: ""
    description: "Filter the loaded family to one observed segment, or clear the filter."
  - action: onRetry
    target: ""
    description: "Re-fetch the current family only."
  - action: navigate_back
    target: ""
    description: "Return to the previous screen via the top-bar back arrow."

removed_navigation_2026_08_07:
  - { action: onBankSelected, reason: "One bank group. The picker bottom sheet had one entry and nothing to switch between." }
  - { action: onScopeSelected, reason: "Replaced by onFamilySelected. The distinction is that scope filtered a loaded list; family selects an endpoint." }
