# ═══════════════════════════════════════════════════════════════════════════
# REWRITTEN 2026-08-07 by /idea-sync, against screens/products/api.yaml.
#
# The screen is the HSBC UK **Open Data Product Finder** — a public catalogue of
# what HSBC sells, read from api.hsbc.com with NO credential of any kind.
#
# Three models have now been described here in three days. This is the third and
# it is the one the wire supports:
#   2026-05..06  OBP catalogue, per-bank fan-out over bankId, Personal/Business
#                split derived client-side from name keywords.        WRONG — OBP is gone.
#   2026-08-06   "OBIE has no product catalogue" → the terms of MY account.
#                                                                     WRONG — that reasoned
#                about OBIE Read/Write and concluded about OBIE entire. The per-account
#                reading is real but it is a DIFFERENT feature and lives at screens/product/.
#   2026-08-07   Open Data Product Finder, four families, two brands.  ← this file
#
# What that means concretely for the layout below:
#   - There is ONE bank group, so there is NO bank selector. The old selector pill is gone.
#   - There are TWO BRANDS — HSBC UK and first direct — and the brand is load-bearing.
#   - Personal vs Business is now an ENDPOINT, not a keyword heuristic. The tab row selects
#     a FAMILY (which endpoint to call), it does not filter an already-loaded list.
#   - There is no sign-in. Every state that assumed one is deleted.
# ═══════════════════════════════════════════════════════════════════════════

