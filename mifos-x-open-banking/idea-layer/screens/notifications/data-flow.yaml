sibling: data-flow
schema_version: "4.0"
feature_id: notifications

# ─────────────────────────────────────────────────────────────────────────
# REWRITTEN 2026-08-06 by /idea-sync (OBP eviction)
#
# Was an on_mount read against obp_signal_channels (GET /obp/v6.0.0/signal/channels), with the
# SignalChannel DTO — both now deleted.
#
# OBIE HAS NO NOTIFICATION RESOURCE. There is no channel list to fetch, and no per-transaction
# or per-payment alert the bank pushes to this app. What actually delivers notifications is
# Firebase Cloud Messaging, client-side, driven by the app's own polling of AIS resources.
#
# The screen therefore has NO network read of its own. Its content comes from locally-stored
# notification records.
# ─────────────────────────────────────────────────────────────────────────

cache_strategy: persistent
cache_rationale: >-
  Notification records are the app's OWN, not the bank's — there is no server-side list to
  re-fetch, so losing them on process death loses them permanently. Persisted for that reason,
  and cleared on logout like every other local record.
store_shape: "createStore(sourceOfTruth = NotificationDao) — no fetcher; there is nothing to fetch"

entries:
  - screen_id: notifications
    trigger: on_mount
    endpoints: []
    direction: read
    source: local
    dtos: []
    produces_state: populated
    error_paths: []
    note: >-
      No network call, therefore no 401 or 403 path. The previous spec had both, inherited from
      an endpoint that no longer exists — a retry-on-401 handler here would offer to recover
      from a failure that cannot occur.

  - screen_id: notifications
    trigger: on_interact
    event: MarkAllReadClicked
    endpoints: []
    direction: write
    source: local
    dtos: []
    produces_state: populated
    error_paths: []

  - screen_id: notifications
    trigger: on_interact
    event: NotificationOpened
    endpoints: []
    direction: read
    source: local
    dtos: []
    produces_state: populated
    error_paths: []

# ─────────────────────────────────────────────────────────────────────────
# WHAT THIS SCREEN CANNOT SHOW
# ─────────────────────────────────────────────────────────────────────────
coverage_limits:
  no_per_execution_alerts: >-
    There is no event, and no status, for a standing-order or scheduled-payment INSTALMENT
    executing. OBIE exposes no per-execution status anywhere, so "your standing order paid
    today" is not a notification this app can ever produce honestly.
  obie_events_are_not_this: >-
    OBIE's event notification (POST /v4.0/events) carries CONSENT-lifecycle events only —
    UK.OBIE.Consent-Authorization-Revoked. It is consumed by pay-vrp-mandate and
    consent-manager, not here, and it is TPP-to-ASPSP polling rather than a user-facing feed.
  what_is_producible: >-
    Payment status transitions this app polled itself (ACSP -> ACCC), a consent approaching its
    90-day reconfirmation, and a VRP mandate detected as revoked or failing. All derived from
    the app's own reads.

removed_2026_08_06:
  - { endpoint: obp_signal_channels, was: "GET /obp/v6.0.0/signal/channels", reason: "No OBIE equivalent." }
  - { dto: SignalChannel, reason: "Deleted with the endpoint." }
  - { error_paths: ["401", "403"], reason: "No network call remains that could return them." }
