<!doctype html>
<!-- render-hash: notif-error-01 -->
<html lang="en" data-screen="notifications" data-state="error" data-feature="notifications" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications — Error</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--secondary:#50606E;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.error-icon{width:96px;height:96px;border-radius:48px;background:var(--error-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.error-icon .material-icons{font-size:var(--icon-2xl);color:var(--error)}
.error-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.error-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;margin-bottom:28px;max-width:300px}
.retry-btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:var(--on-primary);border:none;border-radius:999px;padding:12px 28px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;cursor:pointer}.retry-btn .material-icons{font-size:var(--icon-sm)}
[data-theme="light"]{--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--secondary:#50606E;--error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E}[data-theme="dark"]{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--secondary:#B7C9D9;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198}@media (prefers-color-scheme:dark){:root{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--secondary:#B7C9D9;--error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198}}</style>
</head>
<body><div class="top-bar"><span class="material-icons" data-nav-to="home" role="button" tabindex="0" aria-label="Go back">arrow_back</span><h1>Notifications</h1></div><main><div class="error-icon"><span class="material-icons">notifications_off</span></div><h2 class="error-title">Couldn't fetch notifications</h2><p class="error-msg">We're having trouble reaching the notifications server. Your account is unaffected.</p><button class="retry-btn" data-action="retry_load_notifications" tabindex="0" aria-label="Try again"><span class="material-icons">refresh</span>Try again</button></main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
