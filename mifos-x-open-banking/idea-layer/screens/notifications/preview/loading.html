<!doctype html>
<!-- render-hash: notif-loading-01 -->
<html lang="en" data-screen="notifications" data-state="loading" data-feature="notifications" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications — Loading</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#266489;--primary-container:#C9E6FF;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline-variant:#C1C7CE}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}main{flex:1}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant)}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px;flex:1}
.skel{background:var(--surface-variant);animation:pulse 1.5s ease-in-out infinite;border-radius:8px}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.title-skel{height:11px;width:80px;margin:16px 20px 8px}
.notif-skel{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--outline-variant)}.notif-skel .icon{width:40px;height:40px;border-radius:12px}.notif-skel .body{flex:1;display:flex;flex-direction:column;gap:6px}.notif-skel .l1{height:14px;width:50%}.notif-skel .l2{height:11px;width:85%}.notif-skel .l3{height:10px;width:30%}
[data-theme="light"]{--primary:#266489;--primary-container:#C9E6FF;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline-variant:#C1C7CE}[data-theme="dark"]{--primary:#95CDF7;--primary-container:#004B6F;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline-variant:#41474D}@media (prefers-color-scheme:dark){:root{--primary:#95CDF7;--primary-container:#004B6F;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline-variant:#41474D}}</style>
</head>
<body><main>
<div class="top-bar"><span class="material-icons">arrow_back</span><h1>Notifications</h1></div>
<div class="skel title-skel"></div>
<div class="notif-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div></div></div>
<div class="notif-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div></div></div>
<div class="notif-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div></div></div>
<div class="skel title-skel"></div>
<div class="notif-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div></div></div>
<div class="notif-skel"><div class="skel icon"></div><div class="body"><div class="skel l1"></div><div class="skel l2"></div><div class="skel l3"></div></div></div>
</main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
