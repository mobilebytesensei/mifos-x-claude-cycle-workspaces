<!doctype html>
<!-- render-hash: notif-empty-01 -->
<html lang="en" data-screen="notifications" data-state="empty" data-feature="notifications" data-flavor="consumer">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Notifications — Empty</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>:root{--icon-xs:16px;--icon-sm:20px;--icon-md:24px;--icon-lg:32px;--icon-xl:40px;--icon-2xl:48px;--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--on-primary-container:#004B6F;--secondary:#50606E;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E;--outline-variant:#C1C7CE}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--background);color:var(--on-background);display:flex;flex-direction:column;min-height:100vh}
.top-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;width:100%}.top-bar .material-icons{font-size:var(--icon-md);color:var(--on-surface-variant);cursor:pointer}.top-bar h1{font-size:22px;font-weight:600;letter-spacing:-0.2px;flex:1}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.empty-icon{width:96px;height:96px;border-radius:48px;background:var(--primary-container);display:flex;align-items:center;justify-content:center;margin-bottom:24px}.empty-icon .material-icons{font-size:var(--icon-2xl);color:var(--on-primary-container)}
.empty-title{font-size:20px;font-weight:700;margin-bottom:8px;letter-spacing:-0.1px}.empty-msg{font-size:14px;color:var(--on-surface-variant);line-height:1.5;max-width:300px;margin-bottom:24px}
.tip{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:14px;padding:12px 16px;max-width:320px;text-align:left}.tip .material-icons{font-size:var(--icon-sm);color:var(--secondary)}.tip-text{font-size:12px;color:var(--on-surface-variant);line-height:1.4}
.alt-link{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-size:13px;font-weight:600;text-decoration:none;margin-top:20px;cursor:pointer}
[data-theme="light"]{--primary:#266489;--on-primary:#FFFFFF;--primary-container:#C9E6FF;--on-primary-container:#004B6F;--secondary:#50606E;--background:#F7F9FF;--on-background:#181C20;--surface:#F7F9FF;--surface-variant:#DDE3EA;--on-surface-variant:#41474D;--outline:#72787E;--outline-variant:#C1C7CE}[data-theme="dark"]{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--on-primary-container:#C9E6FF;--secondary:#B7C9D9;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198;--outline-variant:#41474D}@media (prefers-color-scheme:dark){:root{--primary:#95CDF7;--on-primary:#00344E;--primary-container:#004B6F;--on-primary-container:#C9E6FF;--secondary:#B7C9D9;--background:#101417;--on-background:#E0E3E8;--surface:#101417;--surface-variant:#41474D;--on-surface-variant:#C1C7CE;--outline:#8B9198;--outline-variant:#41474D}}</style>
</head>
<body><div class="top-bar"><span class="material-icons" data-nav-to="home" role="button" tabindex="0" aria-label="Go back">arrow_back</span><h1>Notifications</h1></div><main><div class="empty-icon"><span class="material-icons">notifications_none</span></div><h2 class="empty-title">You're all caught up</h2><p class="empty-msg">No new notifications. We'll let you know when something important happens with your accounts.</p><div class="tip"><span class="material-icons">tune</span><div class="tip-text">Manage what you get notified about in <strong>Settings → Notifications</strong>.</div></div><a class="alt-link" data-nav-to="settings" tabindex="0">Open notification settings <span class="material-icons" style="font-size:var(--icon-xs)">chevron_right</span></a></main><script src="../../../preview/_shared/preview-runtime.js"></script></body></html>
