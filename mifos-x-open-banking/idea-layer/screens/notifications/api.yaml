sibling: api
schema_version: "4.0"
feature_id: notifications

# REWRITTEN 2026-08-06 by /idea-sync (OBP eviction).
# Was `obp_signal_channels` on `GET /obp/v6.0.0/signal/channels`. OBIE has no notification
# channel resource, and the SignalChannel DTO was deleted with it.

api: []

no_api_rationale:
  reason: >-
    There is no OBIE notification endpoint. UK Open Banking's only push-adjacent mechanism is
    event notification, which is TPP-to-ASPSP polling for consent lifecycle events — not
    user-facing alerts, and not per-transaction.
  what_actually_delivers_notifications: >-
    Firebase Cloud Messaging, client-side, driven by the app's own polling of AIS resources.
    The bank sends this app nothing.

obie_event_notification:
  is_not_this: true
  what_it_is: "POST /v4.0/events — aggregated polling for UK.OBIE.Consent-Authorization-Revoked."
  who_consumes_it: [pay-vrp-mandate, consent-manager]
  why_not_here: >-
    It carries consent-lifecycle events, not transaction alerts. There is no event type for a
    payment executing, a balance changing, or a standing-order instalment running — and per the
    per-execution-status finding, no such event exists anywhere in the standard.

removed_2026_08_06:
  - { operation: obp_signal_channels, was: "GET /obp/v6.0.0/signal/channels", reason: "No OBIE equivalent." }
  - { dto: SignalChannel, reason: "Deleted with the operation." }
