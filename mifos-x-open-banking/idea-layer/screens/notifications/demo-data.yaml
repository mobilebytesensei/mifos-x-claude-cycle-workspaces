screen_id: notifications
_content_policy: >-
  RULE-PROTO-CONTENT-001 — zero placeholders. These are LOCAL push-channel records only: there
  is no backend API behind them, and no request that could ever return them. OBIE has no
  notification resource — see api.yaml `api: []` and `no_api_rationale`. Delivery is Firebase
  Cloud Messaging, client-side, driven by the app's own polling of AIS resources.
_migrated_from: "schema 4.0 content:{obp_signal_channels:{items}} shape, 2026-08-02 via /idea-data"
_source_rebased_2026_08_06: >-
  The obp_signal_channels operation was removed — OBIE has no notification resource. These
  fixtures now represent LOCAL notification records the app derives from its own AIS polling,
  not a server response. Nothing here is fetched.
_persona: "Field-officer / emerging-market half (Equity, KES, +03:00). Intentional — see idea-plan#design_read."

# The local push-channel catalogue the user subscribes to. Nothing here is fetched: the
# catalogue is defined by the app, the subscription state is stored on the device, and the
# screen renders one toggle row per channel. The `signal_channels` key name is OBP-era and is
# kept only because prompts/populated.md still binds `demo-data.signal_channels[...]`; renaming
# it is a separate change that has to move both.
signal_channels:
  - channel_id: "ch-txn-alerts-ke"
    name: "Transaction Alerts"
    description: "Real-time push notifications for all account debits and credits above KES 100"
    created_at: "2026-01-15T08:00:00+03:00"
    subscribed: true

  - channel_id: "ch-security-ke"
    name: "Security Alerts"
    description: "Notifications for login attempts, PIN changes, and suspicious activity"
    created_at: "2026-01-15T08:00:00+03:00"
    subscribed: true
    locked: true
    locked_reason: "Security alerts cannot be turned off."

  - channel_id: "ch-balance-ke"
    name: "Low Balance Warnings"
    description: "Alert when account balance falls below your configured threshold"
    created_at: "2026-02-01T09:30:00+03:00"
    subscribed: true

  - channel_id: "ch-promotions-ke"
    name: "Offers & Promotions"
    description: "Equity Bank product offers, interest rate updates, and limited-time promotions"
    created_at: "2026-02-10T11:00:00+03:00"
    subscribed: false

  - channel_id: "ch-standing-ke"
    name: "Standing Order Reminders"
    description: "Advance notice 24 hours before a scheduled standing order executes"
    created_at: "2026-03-05T10:00:00+03:00"
    subscribed: true

_subscribed_added: >-
  The 4.0 fixture carried the channel CATALOGUE but no subscription state, so every toggle on
  the screen had nothing to bind to and would have rendered in one uniform position. Added
  `subscribed` per channel, with promotions off — a settings screen where every switch is on
  reads as decoration. `locked: true` on security alerts models the one channel a bank will
  not let a customer disable, which is why that row needs a distinct disabled treatment.

states:
  - { scope: content,   channels: all }
  - { scope: loading,   channels: all }
  - { scope: populated, channels: all, note: "cohort-A naming — canonical vocabulary is `content` (D-3)" }
  - { scope: empty,     channels: [], note: "bank exposes no signal channels for this customer" }
  - { scope: error,     error_type: ChannelsLoadFailed, message: "Could not load your notification settings", recovery: "Check your connection and try again." }

