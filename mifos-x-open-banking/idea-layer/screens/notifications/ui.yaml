    content: "10 min ago"
    style:
      typography: labelSmall
      color: onSurfaceVariant
    a11y:
      label: "Received 10 minutes ago"
      role: text
    test_context:
      tag: payment_james_time
      assert_text: "10 min ago"

  - type: box
    keyboard:
      focusable: true
    id: unread_dot_payment_james
    label: "Unread indicator"
    content: ""
    style:
      background: primary
      corner_radius: 5
      width: 10
      height: 10
      align_self: flex_start
      margin_top: 4
    a11y:
      label: "Unread notification"
      role: status
    test_context:
      tag: unread_dot_payment_james

  # ── Notification 2: KYC verification approved (UNREAD, security) ─────────
  - type: box
    id: notification_kyc_approved
    label: "KYC verification approved"
    content: "KYC verification approved"
    category: security
    read_state: unread
