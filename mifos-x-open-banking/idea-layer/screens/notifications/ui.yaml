shell:
  top_app_bar:
    show: true
    title: "Notifications"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions:
      - icon: done_all
        action: mark_all_read
        label: "Mark all as read"
      - icon: tune
        action: open_notification_settings
        label: "Notification settings"
  bottom_nav: false

screens:
  - id: notifications
    name: Notifications
    archetype: index_list
    route: /notifications
    scroll: vertical

archetype: index_list

components:
  # ── Header row ──────────────────────────────────────────────────────────────
  - type: stack
    keyboard:
      focusable: true
    id: title_action_row
    label: "Notifications header row"
    style:
      orientation: horizontal
      justify: space_between
      align: center
      padding_horizontal: 20
      padding_top: 16
      padding_bottom: 8
    a11y:
      label: "Notifications header"
      role: row
    test_context:
      tag: title_action_row

  - type: text
    id: notifications_title
    label: "Notifications"
    content: "Notifications"
    style:
      typography: headlineLarge
      color: primary
      font_weight: bold
    a11y:
      label: "Notifications screen title"
      role: heading
    test_context:
      tag: notifications_title
      assert_text: "Notifications"

  - type: button
    id: mark_all_read_button
    label: "Mark All Read"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      variant: text
      text_color: secondary
      typography: labelMedium
      padding_horizontal: 0
    on_click:
      action: mark_all_read
      target: ""
      action_contract:
        effect: persist_db
        writes_to: ["notifications.readState", "notifications.unreadCount"]
        external_library_refs: ["androidx.datastore"]
        description: >-
          Writes the read flag for every listed notification to androidx.datastore and clears the
          unread count. Local-only: this app has no server-side notification read state.
    a11y:
      label: "Mark all notifications as read"
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: mark_all_read_button
      assert_text: "Mark All Read"

  # ── Section divider: Today ───────────────────────────────────────────────────
  - type: text
    id: section_today_label
    label: "Today"
    content: "Today"
    style:
      typography: labelMedium
      color: onSurfaceVariant
      font_weight: semibold
      padding_horizontal: spacing.md
      padding_top: spacing.sm
      padding_bottom: spacing.xs
    a11y:
      label: "Today's notifications"
      role: heading
    test_context:
      tag: section_today_label
      assert_text: "Today"

  # ── Notification 1: Payment received from James Wilson (UNREAD, payment) ────
  - type: box
    id: notification_payment_james
    label: "Payment received from James Wilson"
    content: "Payment received from James Wilson"
    category: payment
    read_state: unread
    style:
      background: primaryContainer
      corner_radius: 16
      padding_horizontal: 16
      padding_vertical: 14
      margin_horizontal: 20
      margin_bottom: 8
      border_color: primaryContainer
      border_width: 1
    on_click:
      action: open_notification
      target: transaction-detail
      action_contract:
        effect: navigate
        description: >-
          Opens the transaction behind this payment-category notification on transaction-detail,
          passing the transaction id the notification carries, and marks the notification read
          as it opens so the unread indicator clears on return.
    a11y:
      label: "Unread payment notification: Payment of £50.00 received from James Wilson. 10 minutes ago."
      role: button
    keyboard:
      focusable: true
    test_context:
      tag: notification_payment_james
      assert_read_state: unread
      assert_category: payment

  - type: stack
    id: payment_james_row
    label: "Payment from James Wilson row"
    style:
      orientation: horizontal
      spacing: 12
      align: flex_start
    a11y:
      label: ""
      role: row
    test_context:
      tag: payment_james_row

  - type: box
    id: payment_james_icon_bg
    label: "Payment received icon background"
    content: ""
    style:
      background: primary
      corner_radius: 22
      width: 44
      height: 44
      align_items: center
      justify_content: center
    a11y:
      label: ""
      role: none
    test_context:
      tag: payment_james_icon_bg

  - type: icon
    decorative: true   # the notification headline states the payment and payee
    id: payment_james_icon
    label: "Incoming payment"
    supported_states: [idle, hover, focus_visible, pressed, disabled]
    style:
      icon_name: arrow_downward
      size: 22
      color: onPrimary
