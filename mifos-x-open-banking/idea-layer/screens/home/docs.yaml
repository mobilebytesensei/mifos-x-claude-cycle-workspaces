    unset: 11

capability_completeness:
  storage_location:
    answer: "selectedAccountId persisted in DataStore (survives app restarts). allAccounts + balances cached in memory (5-min TTL). PFM spending snapshot derived from Room DB transaction cache."
    status: addressed
  destructive_action_safety:
    answer: "No destructive actions on home screen. Account-switcher selection is reversible. Revoke consent is on consent-detail, not here."
    status: n/a
  nav_callback_wiring:
    answer: "Both navigation targets — transactions and transaction-detail — are wired as homeGraph callbacks (onNavigateToTransactions, onNavigateToTransactionDetail) and resolved by the nav host. No dead navigate callbacks. The account-selector sheet is in-screen state (OpenAccountSelector / DismissAccountSelector / SelectAccount), not navigation."
    status: addressed
  user_data_export:
    answer: "Home screen is read-only AIS aggregation — no user-generated data to export. Statement PDFs available via statements screen."
    status: n/a
  permission_visibility:
    answer: "Requires ReadAccountsDetail, ReadBalances, ReadTransactionsDetail consent permissions. 403 without these routes PSU to consent-list for reconfirmation."
    status: addressed
  storage_budget_awareness:
    answer: "Room DB holds full transaction history for PFM derivation. No explicit size cap; HSBC OBIE limits to 90-day history per consent. Memory cache is bounded (5-min TTL eviction)."
    status: addressed
  network_data_policy:
    answer: "Data fetched over FAPI 1.0 Advanced mTLS from HSBC OBIE v4.0. No third-party analytics from home. Balance/transaction data never written to unencrypted local storage."
    status: addressed
  cache_lifecycle:
    answer: "allAccounts: 5-min memory cache, invalidated on account-switcher tap and app resume. selectedAccountId: DataStore, permanent until PSU sign-out. PFM Room data: long-lived, refreshed by transactions screen on each visit."
    status: addressed
  error_recovery:
    answer: "6 error cases documented (EC-HOME-001 through EC-HOME-006). 401/429/network_error are recoverable with Retry CTA. 403/no-consent are non-recoverable — route to login/consent-list. Empty state (no accounts) routes to login CTA."
    status: addressed
