# ── Description corrected 2026-07-30 (/idea-feature-export stale-artifact fix) ──
# The prior text claimed a quick-action row, a spending snapshot and a route to consent-list.
# Source ships none of the three: HomeContent.kt renders HeroBalanceCard ->
# RecentTransactionsSection -> AccountSelectorSheet, and homeGraph takes only
# onNavigateToTransactions + onNavigateToTransactionDetail. The 2026-07-28 reverse sync pruned
# HomeData.spending and statementsAvailable but left this prose and a 119-line
# quick_actions_card in ui.yaml behind; both are now removed.
description: >-
  Landing screen (Home tab, bottom-nav order 0) displaying the currently selected account.
  Deliberately thin: hero balance card, then a recent-transactions preview. Aggregates AIS data —
  selected account metadata (GET /accounts/{AccountId}), its InterimAvailable balance
  (GET /accounts/{AccountId}/balances) and the 5 most-recent transactions
  (GET /accounts/{AccountId}/transactions). Switching account is the hero card's job: tapping it
  opens AccountSelectorSheet, the only ModalBottomSheet in this codebase. Navigates only to
  transactions and transaction-detail.
has_ui: true
has_server: false
capabilities: [has_ui, has_api, has_flow]
metadata:
  category: aggregation
  implementation_ready: true
  impl_ready_at: '2026-07-14T00:00:00Z'
  impl_ready_schema: v2
contracts: []
libraries:
  - capability: http-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
  - capability: async-computation
    library: kotlin-coroutines
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
impl_notes:
  viewmodel: 'HomeViewModel : BaseViewModel<HomeState, HomeEvent, HomeAction>'
  # Corrected 2026-07-30 — verbatim from HomeViewModel.kt:81-88. The prior block declared
  # allAccounts / selectedAccountId / selectedAccount / selectedAccountBalance /
  # availableBalance / recentTransactions as flat fields plus spendThisMonth, topCategoryName
  # and activeConsentId. Source folds the loaded data into HomeData behind ScreenState and
  # dropped the three PFM/consent fields with the spending card.
  state_model: |
    data class HomeState(
      val uiState: ScreenState<HomeData> = ScreenState.Loading,
      // Sheet visibility is presentation state, not loaded data, so it sits beside uiState
      // rather than inside HomeData.
      val isAccountSelectorVisible: Boolean = false,
    )
    // ScreenState ∈ { Loading, Empty, NoNetwork, Unauthenticated, Error, Content<HomeData> }
  dto_refs:
    - OBReadAccount6
    - OBAccount6
    - OBCashAccount3
    - OBReadBalance1
    - OBCashBalance3
    - OBActiveOrHistoricCurrencyAndAmount
    - OBReadTransaction6
    - OBTransaction6
  api_calls:
    - 'GET /accounts → OBReadAccount6 (permission: ReadAccountsDetail) — for switcher'
    - 'GET /accounts/{AccountId}/balances → OBReadBalance1 (permission: ReadBalances)'
    - 'GET /accounts/{AccountId}/transactions?limit=5 → OBReadTransaction6 (permission: ReadTransactionsDetail)'
  parallelism: |
    coroutineScope {
      val balanceDef = async { apiService.getBalances(selectedAccountId) }
      val txDef = async { apiService.getTransactions(selectedAccountId, limit = 5) }
      val balance = balanceDef.await()
      val txList = txDef.await()
    }
  selected_account_persistence: Store/restore selectedAccountId via UserDataRepository; default to first account returned.
  # Reverse-synced 2026-07-28 — homeGraph(onNavigateToTransactions, onNavigateToTransactionDetail).
  navigation:
    - 'home → transactions (param: accountId)'
    - 'home → transaction-detail (params: transactionId, accountId)'
  navigation_removed_in_sync:
    - 'home → account-detail — no callback on homeGraph'
    - 'home → statements — no callback on homeGraph'
    - 'home → spending-by-category — screen never built; no spending card in source'
    - 'home → consent-list — no callback; consents are reached from settings'
    - 'home → login — HomeViewModel maps Unauthenticated to an error state, it does not navigate'
  i18n_keys_prefix: home.*
  i18n_keys_file: idea-layer/_strings/strings.yaml
vm_actions:
  - name: SelectAccount
    signature: 'fun selectAccount(accountId: String)'
    state_mutations:
      - selectedAccountId
      - uiState → Loading → Content|Empty|Error
    side_effects:
      - Persists accountId to DataStore
      - Triggers parallel balance + transactions fetch for new accountId
  # LoadHome RELOCATED 2026-08-01 (/idea-sync) to initial_load below — see that block.
  # ui.yaml#implementation.removed_in_sync: "loadHome action — the initial load is stream
  # collection in init{}, not a dispatched action". HomeAction's four members are
  # SelectAccount, OpenAccountSelector, DismissAccountSelector and RetryLoad.
  - name: RetryLoad
    signature: fun retryLoad()
    state_mutations:
      - uiState → Loading
    side_effects:
      - Re-invokes loadHome()
  # ── Navigate* actions REMOVED 2026-07-30 (/idea-feature-export stale-artifact fix) ──
  # Five declared: ToAccountDetail, ToTransactions, ToStatements, ToSpendingByCategory,
  # ToConsentList. HomeAction (HomeViewModel.kt:90-102) has exactly four members and none is a
  # navigate: navigation is host-owned via homeGraph's two lambdas. ToSpendingByCategory and
  # ToConsentList targeted surfaces that do not exist or are not reachable from home at all.
  - name: OpenAccountSelector
    signature: fun openAccountSelector()
    state_mutations:
      - isAccountSelectorVisible = true
    side_effects: []
    notes: "Dispatched by the hero balance card's onClick — the card IS the switcher trigger."
  - name: DismissAccountSelector
    signature: fun dismissAccountSelector()
    state_mutations:
      - isAccountSelectorVisible = false
    side_effects: []

initial_load:
  mechanism: init-stream-collection
  what:
    - GET /accounts to populate the switcher list
    - "Parallel: GET /accounts/{id}/balances + GET /accounts/{id}/transactions?limit=5"
  populates: [allAccounts, selectedAccount, selectedAccountBalance, availableBalance, recentTransactions, uiState]
  note: >-
    NOT a dispatched action. ui.yaml#implementation.removed_in_sync: "loadHome action — the
    initial load is stream collection in init{}, not a dispatched action". RetryLoad re-drives
    this same sequence, which is why it remains a real Action member.

nav_callbacks:
  # Host-owned; homeGraph takes exactly these two lambdas. The five Navigate* actions once
  # declared here were removed on 2026-07-30 — see the comment above.
  - signature: "onNavigateToTransactions(accountId) -> TransactionsRoute(accountId)"
  - signature: "onNavigateToTransactionDetail(transactionId, accountId) -> TransactionDetailRoute(...)"

error_cases:
  - id: EC-HOME-001
    trigger: 401 from /balances or /transactions — token expired
    handling: Error state; userMessage 'Your session has expired. Please sign in again.'; navigate_to_login recovery.
  - id: EC-HOME-002
    trigger: 403 — ReadAccountsDetail / ReadBalances not in consent
    handling: Error state; non-recoverable; userMessage directs to consent-list.
  - id: EC-HOME-003
    trigger: 429 rate-limit
    handling: Error state; recoverable; exponential back-off + Retry CTA.
  - id: EC-HOME-004
    trigger: No authorised accounts (empty Data.Account[])
    handling: Empty state with reason=no_accounts; CTA navigates to login/consent.
  - id: EC-HOME-005
    trigger: Active consent absent or all consents revoked
    handling: Empty state with reason=no_consent; CTA navigates to login.
  - id: EC-HOME-006
    trigger: Network error (no connectivity)
    handling: Error state; recoverable; Retry CTA.
