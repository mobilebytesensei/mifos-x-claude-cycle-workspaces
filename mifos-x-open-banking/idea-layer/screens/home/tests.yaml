sibling: tests
schema_version: "4.0"
feature_id: home

# ── TC-HOME-016 REMOVED 2026-07-30 (/idea-feature-export stale-artifact fix) ──
# "Statements quick action navigates to statements screen" — the quick-actions row was
# removed from source and its 119-line ui.yaml card was deleted in this same pass.
# homeGraph exposes only onNavigateToTransactions + onNavigateToTransactionDetail, so no
# statements callback exists for the test to exercise.
screen_id: home
scenarios:
- id: TC-HOME-001
  description: Home screen loads content state for Priya's default selected account
  state: content
  given: "Valid PSU access token; HSBC sandbox returns 3 accounts; selectedAccountId = '40051512345678'\
    \ (Everyday Current); /accounts/{id}/balances returns InterimAvailable \xA32,847.63; /accounts/{id}/transactions\
    \ returns 5 booked entries.\n"
  when: Screen mounts
  then:
  - 'Account switcher strip renders 3 chips: ''Everyday Current'' (selected), ''ISA Saver'', ''Platinum
    Mastercard'''
  - "Hero balance card shows Nickname 'Everyday Current', balance '\xA32,847.63', identifier '40-05-15\
    \ 12345678'"
  # Quick-actions assertion REMOVED 2026-08-03 (/idea-sync "fix the issues"). It read
  # "Quick actions row shows Pay (disabled), Transactions, Statements, Manage consents" — a
  # surface that does not exist. It contradicted this file's own TC-HOME-016 deletion note at
  # the head, which records the row's removal from source. Re-verified against source before
  # deleting rather than trusting either record: `rg -i 'quickaction|quick_action'` over
  # feature/home/src returns 0 matches across 18 files, and HomeDestination.kt:30-31 exposes
  # only onNavigateToTransactions + onNavigateToTransactionDetail. ui.yaml carries only a
  # tombstone comment where quick_actions_card was, docs.yaml:34 records the removal, and
  # _strings/strings.yaml:503 records the 9 orphaned keys it swept. Every artifact agreed
  # except this assertion and TC-HOME-002's "actions row" shimmer, corrected below.
  - 'Recent transactions section shows 5 rows, most recent first: AMAZON UK, PRET A MANGER, TESCO, TFL,
    SALARY'
  - "Spending snapshot card shows '\xA3167.41' and top category 'Groceries'"
- id: TC-HOME-002
  description: Loading state shows shimmer skeletons during initial fetch
  state: loading
  given: Slow network; API calls in flight
  when: Screen mounts
  then:
  # "actions row" dropped from the shimmer list 2026-08-03 (/idea-sync) — same stale
  # quick-actions surface removed from TC-HOME-001 above. A skeleton cannot mirror a component
  # that no longer composes.
  - Hero card and 3 transaction-row shimmers visible with pulsing animation
  - No balance amount, account chip, or transaction rows rendered
  - Accessibility label 'Loading your account' present
- id: TC-HOME-003
  description: Account switcher re-loads content for a different account
  state: content
  given: Content state with Everyday Current selected
  when: User taps 'ISA Saver' chip
  then:
  - Loading state briefly shown
  - "Hero balance card updates to ISA Saver nickname and ISA Saver balance (\xA312,450.00)"
  - Recent transactions update to ISA Saver transactions
  - '''ISA Saver'' chip is now selected; ''Everyday Current'' is unselected'
- id: TC-HOME-006
  description: '''View all'' link navigates to transactions screen'
  state: content
  given: "Home rendered in content state for account 40051512345678 with the recent transactions section populated"
  when: User taps 'View all' text button in the recent transactions header
  then:
    - "onNavigateToTransactions(accountId) fires -> TransactionsRoute(accountId=40051512345678)"
- id: TC-HOME-007
  description: Account selector sheet opens, selects and dismisses without navigating
  state: content
  given: "Home rendered in content state; the PSU holds more than one authorised account so the switcher offers a choice"
  when: User taps the hero card account switcher, picks a different account chip, then dismisses
  then:
  - OpenAccountSelector sets isAccountSelectorVisible = true and home_account_selector_sheet is displayed
  - Tapping an account chip dispatches SelectAccount and persists selectedAccountId via UserDataRepository
  - DismissAccountSelector sets isAccountSelectorVisible = false
  - No navigation occurs at any point
- id: TC-HOME-010
  description: Error state renders with retry CTA on 401 token expired
  state: error
  given: Access token expired; /accounts returns 401
  when: Screen mounts
  then:
  - Error state renders with error_outline icon
  - Title renders from {strings.home.error.title}
  - Body shows 'Your session has expired. Please sign in again.'
  - Retry button visible (error.recoverable=true)
  - Tapping Retry re-triggers home_load
- id: TC-HOME-011
  description: "Error state \u2014 non-recoverable 403 hides Retry button"
  state: error
  given: ReadAccountsDetail permission absent; /accounts returns 403
  when: Screen mounts
  then:
  - Error state renders with 'Account access permission denied' body
  - Retry button NOT visible (error.recoverable=false)
- id: TC-HOME-012
  description: Empty state renders with CTA when no accounts returned
  state: empty
  given: HSBC returns OBReadAccount6 with empty Data.Account[]
  when: Screen mounts
  then:
  - Empty state renders with account_balance_wallet icon
  - Title and body from {strings.home.empty.*} visible
  - CTA button 'Connect your bank' navigates to login
- id: TC-HOME-013
  description: Tap recent transaction row navigates to transaction-detail
  state: content
  given: "Home rendered in content state; the recent transactions list includes 'AMAZON UK MARKETPLACE' (TX-20260627-0002)"
  when: User taps 'AMAZON UK MARKETPLACE' row (TX-20260627-0002)
  then:
    - "Navigates to transaction-detail with transactionId=TX-20260627-0002 and accountId=40051512345678"
- id: TC-HOME-014
  description: CreditCard account shows balance owed styling in hero card
  state: content
  given: User selects 'Platinum Mastercard' (CreditDebitIndicator=Debit) via account switcher
  when: Hero card renders for Platinum Mastercard
  then:
  - Balance text renders in error colour
  - Account subtype shown as 'CreditCard'
  - Identification shows 'xxxx xxxx xxxx 7654'
- id: TC-HOME-015
  description: Recent transactions debit amounts show in error colour, credits in primary
  state: content
  given: "Home rendered in content state; the recent transactions list contains at least one debit and one credit"
  when: Recent transactions list renders
  then:
  - "AMAZON UK, PRET A MANGER, TESCO, TFL rows show amount in error colour prefixed with '- \xA3'"
  - "SALARY ACME LTD row shows amount in primary colour prefixed with '+ \xA3'"
- id: TC-HOME-017
  description: 503 from HSBC sandbox surfaces recoverable error state with retry
  state: error
  given: HSBC sandbox returns 503 Service Unavailable on GET /accounts
  when: Screen mounts
  then:
  - Error state renders with error_outline icon
  - Body shows 'Unable to load your account. Please retry.'
  - Retry button visible (error.recoverable=true)
  - Tapping Retry re-triggers home_load from beginning
  priority: medium
- id: TC-HOME-018
  description: selectedAccountId persists across app restarts via DataStore
  state: content
  given: User previously selected 'ISA Saver' (AccountId=40051589012345); app is restarted
  when: Home screen mounts after cold restart
  then:
  - Loading state shown briefly
  - Hero balance card renders ISA Saver (not default first account)
  - '''ISA Saver'' chip is selected in account switcher strip'
  - No prompt or account-selection step required
  priority: medium
