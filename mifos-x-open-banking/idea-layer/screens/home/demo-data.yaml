# ─── Empty state variant ─────────────────────────────────────────────────────
# Simulates a user who has no authorised accounts:
empty_state_demo:
  reason: no_accounts
  allAccounts: []

# ─── Error state variant ──────────────────────────────────────────────────────
error_state_demo:
  code: 401
  userMessage: "Your session has expired. Please sign in again."
  recoverable: true

# ── State index (added 2026-08-02 via /idea-data) ────────────────────────────
# Coverage was already complete via empty_state_demo / error_state_demo. This block adds the
# uniform `states:` index the rest of the corpus now carries.
states:
  - scope: content
    accounts: allAccounts
    selected: selectedAccountId
    transactions: recentTransactions
    spend: spendThisMonth
  - scope: loading
    accounts: allAccounts
    _skeleton_note: "Mirrors the 3-component content layout — F-013 confirmed this closed 2026-08-02."
  - { scope: empty, fixture: empty_state_demo }
  - { scope: error, fixture: error_state_demo, _note: "401 — session expired. Non-retriable; the recovery is re-authentication, not a retry." }
