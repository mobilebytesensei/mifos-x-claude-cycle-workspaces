sibling: flow
schema_version: "4.0"
feature_id: home

feature: home
flow_ref: consumer-banking

entry_points:
  - source: app_shell_bottom_nav
    label: "Home tab (bottom-nav order 0)"
    source_binding: "AuthenticatedNavBarTabItem.HomeTab -> HomeDestination graph"
  - source: nav_host_start
    label: "HomeDestination is the authenticated NavHost startDestination"

# Reverse-synced 2026-07-28: homeGraph declares exactly two outward callbacks.
transitions:
  - from: home
    to: transactions
    trigger: "Tap 'View all' in the recent transactions section"
    params: [accountId]
    source_binding: "onNavigateToTransactions(accountId) -> TransactionsRoute(accountId)"

  - from: home
    to: transaction-detail
    trigger: "Tap a recent transaction row"
    params: [transactionId, accountId]
    source_binding: "onNavigateToTransactionDetail(transactionId, accountId)"

in_screen_transitions:
  # Sheet visibility is presentation state on HomeState, not navigation.
  - trigger: OpenAccountSelector
    label: "Tap the hero card account switcher — shows AccountSelectorSheet"
  - trigger: DismissAccountSelector
    label: "Dismiss the account selector sheet"
  - trigger: SelectAccount
    label: "Pick an account chip — persists selectedAccountId via UserDataRepository"

removed_in_sync:
  - { to: account-detail, reason: "no onNavigateToAccountDetail callback on homeGraph" }
  - { to: statements, reason: "no statements callback; statements is reached from account-detail" }
  - { to: consent-list, reason: "no consents callback; consents are reached from settings" }
  - { to: spending-by-category, reason: "screen removed — no spending snapshot card exists in source" }
  - { to: login, reason: "HomeViewModel maps Unauthenticated to an error state; it does not navigate" }

# Moved verbatim from ui.yaml 2026-07-31 (CROSS_LEAK repair).
dependencies:
  tier: 0
  features:
    - accounts
    - transactions
    - balances
