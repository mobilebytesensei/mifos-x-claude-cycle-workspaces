cancel_responses:
  - id: cancel-success
    success: true
    message: "Direct debit mandate cancelled successfully. No further payments will be collected."

  - id: cancel-in-flight
    success: false
    message: "Unable to cancel mandate. A payment is currently being processed. Try again after settlement."

states:
  - { scope: content,        mandate: "so-ke-001-netflix" }
  - { scope: loading,        mandate: "so-ke-001-netflix" }
  - { scope: cancel_confirm, mandate: "so-ke-001-netflix", note: "destructive and irreversible for the PSU — there is no un-cancel" }
  - { scope: empty,          mandate: null, note: "mandate id no longer resolves" }
  - { scope: error,          response: cancel-in-flight, error_type: CancelBlocked, message: "Unable to cancel mandate. A payment is currently being processed. Try again after settlement.", recoverable: true }
  - { scope: no_network,     error_type: Offline, message: "You are offline. This mandate was last updated 1 May 2026." }
  - { scope: unauthenticated, error_type: SessionExpired, message: "Sign in again to view this direct debit." }

