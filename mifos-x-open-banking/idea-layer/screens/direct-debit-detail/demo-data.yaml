_source_rebased_2026_08_06: >-
  RE-BASE OWED. Both source operations were removed — OBIE has no single-mandate resource and
  NO direct-debit cancellation at all. The source is now
  GET /aisp/accounts/{AccountId}/direct-debits, filtered by DirectDebitId.

  DELETE the cancel fixtures: `_success_response` and `_error_cancel_failed` model responses to
  an endpoint that does not exist. Keeping them would let a test assert a cancellation path
  that can never run, and would keep a dead Cancel control looking backed.
_availability_note: >-
  Add the 400 case. The direct-debits resource returns 400 on savings, Global Money and the
  credit card — the expected state for those account types, and currently unmodelled.
_persona: "Field-officer / East Africa half (Equity Kenya, KES, Safaricom). Intentional — see idea-plan#design_read."

