sibling: api
schema_version: "4.0"
feature_id: direct-debit-detail
notes: >
  Reconciled to shipped source 2026-06-11. OBP has NO direct-debit detail or cancel endpoint
  at any version (the original GET v5.0.0 detail and DELETE cancel — and the stray Standing-Order
  v7.0.0 entries the file previously carried — were all live-verified 404 and dropped). The detail
  screen re-derives its mandate from TXN_TYPE=DD history and records cancellation locally; no
  network call is unique to this screen.
api: []

derived_reads:
  - id: direct_debit_detail_by_id
    source: "DirectDebitsRepository.listMandates(bankId, accountId).firstOrNull { it.id == mandateId }"
    note: >
      Re-derives the account's mandates (same TXN_TYPE=DD derivation the list uses) and locates
      this one by id. A mandateId that no longer resolves (already cancelled/expired before open)
      renders the empty state.
    output_dto: DirectDebitMandate
  - id: linked_account_name
    source: "AccountsRepository.accountDetail(bankId, accountId)"
    note: >
      Best-effort lookup of the funding account's display name (label, else type, else 'Account').
      Resolution is non-blocking — a failure still renders the mandate with the fallback name.
    output_dto: Account

local_mutations:
  - id: cancel_direct_debit_local
    source: "DirectDebitsRepository.cancel(accountId, mandateId)"
    note: >
      OBP has no cancel endpoint, so the confirm dialog records the cancellation LOCALLY (Room
      JSON cache) and re-fetches the mandate — it flips to CANCELLED and the next-payment date
      clears. Persists across restarts; never reaches the server.

deferred:
  note: >
    GET /direct-debit/{id} and DELETE /direct-debit/{id} were specified in the original design
    but DO NOT EXIST on OBP. There is also no edit affordance — direct debits are merchant-initiated,
    so the consumer surface is view + (local) cancel only. Re-add a server cancel only if OBP ships
    a DELETE endpoint.
