sibling: ui
schema_version: "4.0"
feature_id: direct-debit-detail

id: direct-debit-detail
name: "Direct Debit Detail"
feature: direct-debit-detail
flavor: consumer
# status: REMOVED 2026-08-04 (CROSS_LEAK repair — sibling-layout.json assigns `status` to
# the docs sibling). This copy held `approved`; docs.yaml is the single owner.
# RECONCILED 2026-08-07 (/idea-sync): was 95, disagreed with docs.yaml `quality_score: 91`.
# The matrix averages every top-level quality_score under screens/direct-debit-detail/**.
# docs.yaml is the owner sibling.
quality_score: 91
contract_version: "1.1.0"
approve_hash: "sha256:c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4"
approved_at: "2026-06-11T14:45:00Z"
approved_by: "/idea approve"
approve_predicate_version: "1.0.0"
approve_contract_version: "1.1.0"
capabilities:
  - has_ui
status_history:
  - from: draft
    to: approved
    at: "2026-05-28T14:30:00Z"
    by: "/idea approve (via /idea sync)"
    contract_version: "1.1.0"
    bypass_flags: []
  - from: approved
    to: enriched
    at: "2026-06-11"
    by: "/idea verify --source-drift (write-back)"
    contract_version: "1.1.0"
    note: >
      SOURCE→SPEC reconciliation to shipped Kotlin (code = truth). The mandate is re-derived
      from TXN_TYPE=DD history (DirectDebitsRepository.listMandates, then firstOrNull by
      mandateId) — OBP exposes no GET/DELETE for direct debits (live-verified 404). state_model
      is a single uiState ScreenState<DirectDebitDetailContent> built from the derived mandate.
      REMOVED: more_vert top-bar options action, the merchant logo image (hero is text-only),
      the Edit Mandate button (direct debits are merchant-initiated — view + cancel only), the
      "View all" link target hardcoding (kept as the View-all action onto the account history),
      and per-payment status labels (every observed collection is booked). CHANGED: cancel is
      LOCAL-ONLY (Room cache) via a confirm dialog shown only on active mandates; linkedAccountName
      falls back to "Account" best-effort and never blocks the screen; nextPayment/reference/start
      show an em dash when underivable. ADDED: cancelDialogVisible flag, empty-state Back CTA.
  - from: enriched
    to: approved
    at: "2026-06-11T14:45:00Z"
    by: "/idea approve"
    contract_version: "1.1.0"
    bypass_flags: []
    note: "Approved after source→spec reconciliation (spec matches shipped Kotlin) + /idea verify PASS. Write-back shape (no approve_hash), consistent with project pattern. Previews for reconciled screens may lag the YAML pending a separate re-render."

screens:
  - id: direct-debit-detail
    name: "Direct Debit Detail"
    viewmodel: "DirectDebitDetailViewModel"
    route: /direct-debits/{mandateId}

archetype: detail_screen

shell:
  top_app_bar:
    show: true
    title: "Direct Debit"
    navigation_icon: arrow_back
    navigation_action: navigate_back
    actions: []
  bottom_nav: false

components:
  - type: stack
    id: ddd_root
    variant: vertical
    style:
      background: background
      padding_horizontal: spacing.lg
    children:
      - ddd_merchant_hero
      - ddd_mandate_details_card
      - ddd_payment_history_card
      - ddd_cancel_button

  # ── Merchant hero (text-only: name + status + amount + frequency) ─────────────
  - type: stack
    id: ddd_merchant_hero
    variant: vertical
    style:
      alignment: center
      padding_top: spacing.sm
    a11y:
      role: region
      label: "Mandate merchant summary"
    children:
      - ddd_merchant_name
      - ddd_mandate_status_badge
      - ddd_mandate_amount_value
      - ddd_mandate_frequency_text

  - type: text
    id: ddd_merchant_name
    content: "Netflix"
    variant: headline_small
    style:
      typography: headlineSmall
      color: onSurface
      alignment: center
      font_weight: semibold
    a11y:
      role: heading
      label: "Merchant name"
    test_context:
      tag: ddd_merchant_name
      purpose: "Merchant name from the derived mandate (transaction description, never the login-username holder). Primary identifier in the hero."
      interaction_type: display
      data_driven: true

  - type: status_chip
    id: ddd_mandate_status_badge
    # badge -> status_chip 2026-08-04 (/idea-sync, N-1-SYSTEMIC). The hardcoded style block is
    # removed with it: the `active` variant resolves container and icon from design-tokens.yaml,
    # so this row can no longer drift from the palette the way the literal primaryContainer did.
    label: "{mandate.statusLabel}"
    variant: "{mandate.isActive ? 'active' : 'inactive'}"
    a11y:
      role: status
      label: "Mandate status"
    test_context:
      tag: ddd_mandate_status_badge
      # Corrected 2026-08-03 (/idea-sync): said "Active (green)". This palette ships no green;
      # DESIGN.md maps the healthy/success semantic onto `primary`.
      purpose: "Status pill: Active (primary + check_circle) / Cancelled (surfaceContainerHigh + cancel icon). Derived from mandate.isActive."
      interaction_type: display
      data_driven: true

  - type: text
    id: ddd_mandate_amount_value
    content: "£15.99"
    variant: display_small
    style:
      typography: displaySmall
      color: onSurface
      alignment: center
      font_weight: "700"
    a11y:
      role: text
      label: "Mandate amount"
    test_context:
      tag: ddd_amount
      purpose: "Formatted mandate amount ({symbol}{value}) — the primary financial value in the hero."
      interaction_type: display
      data_driven: true

  - type: text
    id: ddd_mandate_frequency_text
    content: "Monthly"
    variant: body_medium
    style:
      typography: bodyMedium
      color: onSurfaceVariant
      alignment: center
    a11y:
      role: text
      label: "Payment frequency"
    test_context:
      tag: ddd_frequency
      purpose: "Title-case cadence beneath the amount (Daily / Weekly / Every 2 weeks / Monthly / Yearly)."
      interaction_type: display
      data_driven: true

  # ── Mandate Details card ──────────────────────────────────────────────────────
  - type: card
    id: ddd_mandate_details_card
    variant: outlined
    supported_states: [idle]
    style:
      background: surface
      border_radius: "16dp"
      border_color: surfaceVariant
      border_width: 1
      padding: spacing.md
      margin_top: spacing.lg
      margin_bottom: spacing.md
    children:
      - ddd_details_header
      - ddd_next_payment_row
      - ddd_divider_1
      - ddd_account_row
      - ddd_divider_2
      - ddd_mandate_ref_row
      - ddd_divider_3
      - ddd_start_date_row

  - type: text
    id: ddd_details_header
    content: "Mandate Details"
    variant: title_medium
    style:
      typography: titleMedium
      color: onSurface
      font_weight: semibold
      padding_bottom: spacing.xs
    a11y:
      role: heading
      label: "Mandate details section"
    test_context:
      tag: ddd_details_card
      purpose: "Section header for the mandate metadata card"
      interaction_type: display
      data_driven: false

  - type: stack
    id: ddd_next_payment_row
    variant: horizontal
    style: { alignment: center_space_between, padding_vertical: spacing.sm }
    children: [ddd_next_payment_label, ddd_next_payment_value]

  - type: text
    id: ddd_next_payment_label
    content: "Next Payment"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurfaceVariant }
    a11y: { role: text, label: "Next payment label" }
    test_context: { purpose: "Row label for the upcoming collection date", interaction_type: display, data_driven: false }

  - type: text
    id: ddd_next_payment_value
    content: "15 Jun 2026"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurface, font_weight: "600" }
    a11y: { role: text, label: "Next payment date" }
    test_context:
      purpose: "Derived next-collection date for active mandates; em dash (—) when cancelled or underivable."
      interaction_type: display
      data_driven: true

  - type: divider
    id: ddd_divider_1
    style: { color: surfaceVariant, margin_top: spacing.xs, margin_bottom: spacing.xs }
    a11y: { role: separator, label: "Divider" }
    test_context: { purpose: "Separator between next payment and account rows", interaction_type: display, data_driven: false }

  - type: stack
    id: ddd_account_row
    variant: horizontal
    style: { alignment: center_space_between, padding_vertical: spacing.sm }
    children: [ddd_account_label, ddd_account_value_group]

  - type: text
    id: ddd_account_label
    content: "Account"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurfaceVariant }
    a11y: { role: text, label: "Linked account label" }
    test_context: { purpose: "Row label for the account this mandate collects from", interaction_type: display, data_driven: false }

  - type: stack
    id: ddd_account_value_group
    variant: vertical
    style: { alignment: end }
    children: [ddd_account_name, ddd_account_number]

  - type: text
    id: ddd_account_name
    content: "Current Account"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurface, font_weight: "600" }
    a11y: { role: text, label: "Linked account name" }
    test_context:
      purpose: "Best-effort account display name (label, else type, else 'Account'); resolution never blocks the screen."
      interaction_type: display
      data_driven: true

  - type: text
    id: ddd_account_number
    content: "••••4521"
    variant: body_small
    style: { typography: bodySmall, color: onSurfaceVariant }
    a11y: { role: text, label: "Masked account number" }
    test_context:
      purpose: "Last 4 alphanumerics of the route accountId, prefixed ••••."
      interaction_type: display
      data_driven: true

  - type: divider
    id: ddd_divider_2
    style: { color: surfaceVariant, margin_top: spacing.xs, margin_bottom: spacing.xs }
    a11y: { role: separator, label: "Divider" }
    test_context: { purpose: "Separator between account and reference rows", interaction_type: display, data_driven: false }

  - type: stack
    id: ddd_mandate_ref_row
    variant: horizontal
    style: { alignment: center_space_between, padding_vertical: spacing.sm }
    children: [ddd_mandate_ref_label, ddd_mandate_ref_value]

  - type: text
    id: ddd_mandate_ref_label
    content: "Mandate Ref"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurfaceVariant }
    a11y: { role: text, label: "Mandate reference label" }
    test_context: { purpose: "Row label for the mandate reference", interaction_type: display, data_driven: false }

  - type: text
    id: ddd_mandate_ref_value
    content: "DD-NF-20240301"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurface, font_family: monospace, font_weight: "600" }
    a11y: { role: text, label: "Mandate reference" }
    test_context:
      purpose: "Stable derived reference (DD-{initials}-{first collection yyyyMMdd}); monospace. Em dash when blank."
      interaction_type: display
      data_driven: true

  - type: divider
    id: ddd_divider_3
    style: { color: surfaceVariant, margin_top: spacing.xs, margin_bottom: spacing.xs }
    a11y: { role: separator, label: "Divider" }
    test_context: { purpose: "Separator between reference and start date rows", interaction_type: display, data_driven: false }

  - type: stack
    id: ddd_start_date_row
    variant: horizontal
    style: { alignment: center_space_between, padding_vertical: spacing.sm }
    children: [ddd_start_date_label, ddd_start_date_value]

  - type: text
    id: ddd_start_date_label
    content: "Start Date"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurfaceVariant }
    a11y: { role: text, label: "Start date label" }
    test_context: { purpose: "Row label for the mandate's effective start", interaction_type: display, data_driven: false }

  - type: text
    id: ddd_start_date_value
    content: "1 Mar 2024"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurface, font_weight: "600" }
    a11y: { role: text, label: "Start date" }
    test_context:
      purpose: "First observed collection date (the mandate's effective start); em dash when underivable."
      interaction_type: display
      data_driven: true

  # ── Recent Payments card (derived collections; View-all → account history) ────
  - type: card
    id: ddd_payment_history_card
    variant: outlined
    supported_states: [idle]
    style:
      background: surface
      border_radius: "16dp"
      border_color: surfaceVariant
      border_width: 1
      padding: spacing.md
      margin_bottom: spacing.md
    children:
      - ddd_history_header_row
      - ddd_history_list

  - type: stack
    id: ddd_history_header_row
    variant: horizontal
    style: { alignment: center_space_between, padding_bottom: spacing.xs }
    children: [ddd_history_header, ddd_history_view_all_link]

  - type: text
    id: ddd_history_header
    content: "Recent Payments"
    variant: title_medium
    style: { typography: titleMedium, color: onSurface, font_weight: semibold }
    a11y: { role: heading, label: "Recent payments section" }
    test_context: { purpose: "Section header for the derived collection history", interaction_type: display, data_driven: false }

  - type: link
    id: ddd_history_view_all_link
    label: "View all"
    variant: inline
    style: { typography: labelMedium, color: primary }
    on_click:
      action: navigate
      target: transactions
      action_contract:
        effect: navigate
        description: >-
          Opens the transactions list filtered to collections from this direct-debit originator.
    a11y: { role: link, label: "View all payments for this account" }
    keyboard: { focusable: true }
    test_context:
      tag: ddd_view_all
      purpose: "Opens the account's full transaction history (onViewAllPayments)."
      interaction_type: action
      data_driven: false

  - type: list
    id: ddd_history_list
    variant: vertical
    style: { padding: 0 }
    a11y: { role: list, label: "Recent collected payments" }
    test_context:
      purpose: "Derived collection rows (mandate.recentCollections), newest first. Empty → 'No payments collected yet.'"
      interaction_type: display
      data_driven: true

  - type: list_item
    id: ddd_history_row
    variant: one_line
    style: { padding_vertical: spacing.sm }
    children: [ddd_history_row_date, ddd_history_row_amount]
    a11y: { role: listitem, label: "Collected payment" }
    test_context:
      purpose: "One observed collection: date label + signed amount. Every row is a booked collection (no per-payment status)."
      interaction_type: display
      data_driven: true

  - type: text
    id: ddd_history_row_date
    content: "15 May 2026"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurface }
    a11y: { role: text, label: "Payment date" }
    test_context: { purpose: "Collection date label", interaction_type: display, data_driven: true }

  - type: text
    id: ddd_history_row_amount
    content: "-£15.99"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurface, font_weight: "600" }
    a11y: { role: text, label: "Amount collected" }
    test_context: { purpose: "Signed collection amount (-{symbol}{value})", interaction_type: display, data_driven: true }

  # ── Cancel Mandate (active only) + confirm dialog (local cancel) ──────────────
  - type: button
    id: ddd_cancel_button
    label: "Cancel Mandate"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      border_color: error
      color: error
      typography: labelLarge
      border_radius: "12dp"
      full_width: true
      margin_top: spacing.lg
    on_click:
      action: cancel_requested
      target: ddd_cancel_dialog
      action_contract:
        effect: transform_state
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Opens the cancel-mandate confirmation dialog; the mandate is untouched until the confirm CTA
          is pressed.
    a11y:
      role: button
      label: "Cancel this direct debit mandate"
    keyboard: { focusable: true }
    test_context:
      tag: ddd_cancel_cta
      assert_text: "Cancel Mandate"
      purpose: "Shown only when the mandate is active. Opens the confirm dialog (DirectDebitDetailViewModel.onCancelRequested)."
      interaction_type: action
      data_driven: true

  - type: dialog
    id: ddd_cancel_dialog
    label: "Cancel Direct Debit?"
    variant: alert
    title: "Cancel Direct Debit?"
    message: "{merchant} ({reference}) will stop collecting payments. This cannot be undone."
    supported_states: [idle, visible, dismissed]
    style:
      background: surface
      border_radius: 16
      padding: spacing.lg
    a11y:
      role: dialog
      label: "Cancel direct debit confirmation"
    keyboard:
      focusable: true
      shortcuts: [Escape]
    test_context:
      tag: ddd_cancel_dialog
      purpose: "Destructive-action guard. Confirm records the cancellation LOCALLY (Room cache) and re-derives the mandate (flips to Cancelled); dismiss aborts. No server DELETE."
      interaction_type: action
      data_driven: true

  - type: button
    id: ddd_cancel_confirm_cta
    label: "Yes, Cancel Mandate"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: error
      text_color: onError
      border_radius: 12
    on_click:
      action: cancel_confirmed
      target: direct-debit-detail
      action_contract:
        effect: delete
        writes_to: ["direct_debit_cancellations"]
        external_library_refs: [ktorfit, "hsbc-obie-ais-v4.0:direct-debits"]
        description: >-
          Dispatches the mandate cancellation through ktorfit. Note the AISP consent this screen reads
          under is read-only, so this path depends on a servicer that exposes mandate cancellation —
          where it does not, the failure must surface rather than appear to succeed.
    a11y: { role: button, label: "Confirm cancellation" }
    keyboard: { focusable: true }
    test_context:
      tag: ddd_cancel_confirm
      assert_text: "Yes, Cancel Mandate"
      purpose: "Records the cancellation locally then re-fetches the mandate (DirectDebitDetailViewModel.onCancelConfirmed)."
      interaction_type: action
      data_driven: false

  - type: button
    id: ddd_cancel_dismiss_cta
    label: "Keep Mandate"
    variant: outlined
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      border_color: primary
      text_color: primary
      border_radius: 12
    on_click:
      action: cancel_dismissed
      target: ""
      action_contract:
        effect: transform_state
        external_library_refs: [kotlinx-coroutines]
        description: >-
          Closes the cancel dialog and leaves the mandate active.
    a11y: { role: button, label: "Keep the mandate active" }
    keyboard: { focusable: true }
    test_context:
      tag: ddd_cancel_dismiss
      assert_text: "Keep Mandate"
      purpose: "Aborts the cancel flow with no side effects (onCancelDismissed)."
      interaction_type: action
      data_driven: false

  # ── Loading / Error / Empty ───────────────────────────────────────────────────
  - type: skeleton
    id: ddd_loading_skeleton
    variant: detail
    style: { background: background, padding: spacing.lg }
    a11y: { role: progressbar, label: "Loading mandate details" }
    test_context: { purpose: "Centered progress while listMandates() resolves the mandate", interaction_type: display, data_driven: false }

  - type: stack
    id: ddd_error_state
    variant: vertical
    style: { alignment: center, padding: spacing.xl }
    children: [ddd_error_icon, ddd_error_title, ddd_error_message, ddd_retry_button]

  - type: icon
    id: ddd_error_icon
    content: "cloud_off"
    style: { color: onSurfaceVariant, size: "48dp", alignment: center }
    a11y: { role: image, label: "Error loading mandate" }
    test_context: { purpose: "Error icon", interaction_type: display, data_driven: false }

  - type: text
    id: ddd_error_title
    content: "Unable to load mandate"
    variant: title_large
    style: { typography: titleLarge, color: onSurface, alignment: center }
    a11y: { role: text, label: "Unable to load mandate" }
    test_context: { purpose: "Error/no-network/unauthenticated heading", interaction_type: display, data_driven: false }

  - type: text
    id: ddd_error_message
    content: "Check your connection and try again"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurfaceVariant, alignment: center }
    a11y: { role: text, label: "Error description" }
    test_context: { purpose: "Error copy", interaction_type: display, data_driven: false }

  - type: button
    id: ddd_retry_button
    label: "Retry"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style: { color: primary, typography: labelLarge, alignment: center }
    on_click:
      action: retry
      target: direct-debit-detail
      action_contract:
        effect: call_api
        reads_from: [direct-debits-list, transactions]
        external_library_refs: [ktorfit, "hsbc-obie-ais-v4.0:direct-debits"]
        description: >-
          Re-fetches this mandate through ktorfit against hsbc-obie-ais-v4.0:direct-debits after a
          failed load.
    a11y: { role: button, label: "Retry loading mandate" }
    keyboard: { focusable: true }
    test_context:
      tag: ddd_retry
      purpose: "Re-runs DirectDebitDetailViewModel.onRetry()"
      interaction_type: action
      data_driven: false

  - type: stack
    id: ddd_empty_state
    variant: vertical
    style: { alignment: center, padding: spacing.xl }
    children: [ddd_empty_icon, ddd_empty_title, ddd_empty_message, ddd_empty_back_button]

  - type: icon
    id: ddd_empty_icon
    content: "event_busy"
    style: { color: outlineVariant, size: "48dp", alignment: center }
    a11y: { role: image, label: "Mandate not available" }
    test_context: { purpose: "Empty-state icon", interaction_type: display, data_driven: false }

  - type: text
    id: ddd_empty_title
    content: "Mandate not available"
    variant: title_large
    style: { typography: titleLarge, color: onSurface, alignment: center }
    a11y: { role: text, label: "Mandate not available" }
    test_context: { purpose: "Empty-state heading (mandateId no longer resolves)", interaction_type: display, data_driven: false }

  - type: text
    id: ddd_empty_message
    content: "This direct debit could not be found. It may have already been cancelled or expired."
    variant: body_medium
    style: { typography: bodyMedium, color: onSurfaceVariant, alignment: center }
    a11y: { role: text, label: "Empty-state message" }
    test_context: { purpose: "Empty-state copy", interaction_type: display, data_driven: false }

  - type: button
    id: ddd_empty_back_button
    label: "Back to Direct Debits"
    variant: filled
    supported_states: [idle, hover, focus_visible, pressed]
    style:
      background: primary
      text_color: onPrimary
      border_radius: "12dp"
    on_click:
      action: navigate_back
      target: direct-debits
      intent: target
      action_contract:
        effect: navigate
        description: >-
          Returns to the direct-debits list when the requested mandate resolves to nothing.
    a11y: { role: button, label: "Back to direct debits list" }
    keyboard: { focusable: true }
    test_context:
      tag: ddd_empty_back
      purpose: "Back navigation on the empty state (mandate missing)."
      interaction_type: action
      data_driven: false

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout: { type: column, padding: spacing.lg }
    visible_components: [ddd_loading_skeleton]
    note: "Centered CircularProgressIndicator while DirectDebitsRepository.listMandates() resolves the mandate."
  content:
    layout: { type: column, scroll: vertical, padding: spacing.lg }
    visible_components:
      - ddd_merchant_hero
      - ddd_merchant_name
      - ddd_mandate_status_badge
      - ddd_mandate_amount_value
      - ddd_mandate_frequency_text
      - ddd_mandate_details_card
      - ddd_payment_history_card
      - ddd_cancel_button
    note: "Cancel button rendered only when the mandate is active."
  cancel_confirm:
    layout: { type: column, scroll: vertical, padding: spacing.lg }
    visible_components:
      - ddd_merchant_hero
      - ddd_mandate_details_card
      - ddd_payment_history_card
      - ddd_cancel_button
      - ddd_cancel_dialog
      - ddd_cancel_confirm_cta
      - ddd_cancel_dismiss_cta
    overlay: true
    overlay_alpha: 0.5
    note: "cancelDialogVisible && isActive — dialog overlays the content."
  error:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [ddd_error_state]
    note: "ScreenState.Error / NoNetwork / Unauthenticated all render this message + Retry."
  no_network:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [ddd_error_state]
  unauthenticated:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [ddd_error_state]
  empty:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [ddd_empty_state]
    note: "ScreenState.Empty — the mandateId no longer resolves in the derived set (already cancelled/expired)."

state_model:
  view_model: DirectDebitDetailViewModel
  constructor:
    - { name: bankId, type: String, default: "\"\"" }
    - { name: accountId, type: String, default: "\"\"" }
    - { name: mandateId, type: String, default: "\"\"" }
  flows:
    - name: uiState
      type: "StateFlow<ScreenState<DirectDebitDetailContent>>"
      default: "ScreenState.Loading"
  content_type:
    name: DirectDebitDetailContent
    note: "Display-ready label strings + the cancel-dialog flag. No typed enums."
    fields:
      - { name: merchantName, type: String }
      - { name: statusLabel, type: String }
      - { name: isActive, type: Boolean }
      - { name: amountLabel, type: String }
      - { name: frequencyLabel, type: String }
      - { name: nextPaymentLabel, type: String, note: "em dash when cancelled/underivable" }
      - { name: linkedAccountName, type: String, note: "best-effort; 'Account' fallback" }
      - { name: linkedAccountMasked, type: String }
      - { name: mandateReference, type: String, note: "em dash when blank" }
      - { name: startDateLabel, type: String, note: "em dash when underivable" }
      - { name: recentPayments, type: "List<DirectDebitPaymentRow>" }
      - { name: cancelDialogVisible, type: Boolean }
  supporting_types:
    - name: DirectDebitPaymentRow
      fields:
        - { name: dateLabel, type: String }
        - { name: amountLabel, type: String }
  model_type:
    name: DirectDebitMandate
    note: "Derived from TXN_TYPE=DD history; located by mandateId via listMandates().firstOrNull. Cancelled = locally recorded."
  methods:
    - onRetry
    - onCancelRequested
    - onCancelDismissed
    - onCancelConfirmed
  di:
    - DirectDebitsRepository
    - AccountsRepository

api:
  note: >
    NONE of the originally specified direct-debit detail endpoints exist on OBP (GET detail /
    DELETE cancel — all live-verified 404). They are dropped. The mandate is RE-DERIVED via
    DirectDebitsRepository.listMandates(bankId, accountId).firstOrNull { it.id == mandateId };
    the linked account name is resolved best-effort via AccountsRepository.accountDetail();
    cancel is LOCAL-ONLY. See api.yaml.

navigation:
  - id: nav_back
    target: direct-debits
    on_click: { action: navigate_back }
  - id: nav_view_all
    target: transactions
    on_click:
      action: navigate
      note: "View all → the account's full transaction history (onViewAllPayments)."

dependencies:
  tier: feature
  features: [direct-debits, accounts, transactions]
