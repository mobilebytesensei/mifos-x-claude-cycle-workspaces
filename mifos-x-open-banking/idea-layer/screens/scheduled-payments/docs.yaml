    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
# vm_actions RELOCATED 2026-08-01 (/idea-sync): LoadScheduledPayments -> initial_load;
# NavigateBack -> nav_callbacks. Nothing deleted. ui.yaml#implementation.removed_in_sync names
# both. RetryLoad is the only declared ScheduledPaymentsAction member and is retained below.
initial_load:
  mechanism: init-stream-collection
  what: "GET /accounts/{accountId}/scheduled-payments via Ktorfit AisApiService"
  states: "Loading -> Content(scheduledPayments = response.Data.ScheduledPayment.map { it.toUiModel() }) | Empty when the list is empty"
  error_handling:
    on_401: uiState = Error(TokenExpired)
    on_403: uiState = Error(ConsentRevoked)
    on_429: uiState = Error(RateLimited)
    on_network: uiState = Error(NetworkError)
  notes: >-
    toUiModel() maps: ScheduledPaymentDateTime ISO-8601 → scheduledDateFormatted (EEE d MMM yyyy); ScheduledType
    Execution → scheduledTypeLabel='Execution date', scheduledTypeIcon='calendar_today', scheduledTypeA11y='Money
    leaves your account on {date}'; ScheduledType Arrival → scheduledTypeLabel='Arrival date',
    scheduledTypeIcon='arrow_downward', scheduledTypeA11y='Funds arrive at {payee} on {date}'.
  unsupported_note: >-
    The `unsupported` state (added 2026-07-30) is reached from this same load path on an OBIE
    U000 product refusal. The refusal CONDITION is still not modelled in api.yaml — see
    CAPABILITY_GAPS RULE-IDEA-GAP-DISCOVERY-001 steps 2 and 3, both still OPEN.

nav_callbacks:
  - signature: "onBack -> popBackStack() returning to account-detail"

vm_actions:
  - name: RetryLoad
    signature: fun retryLoad()
    state_mutations:
      - re-invokes LoadScheduledPayments with same accountId
    side_effects: []
    error_handling: {}
error_cases:
  - id: TokenExpired
    trigger: HTTP 401 from HSBC AIS
    user_message: Session expired. Please log in again.
    recovery: Route to login screen
  - id: ConsentRevoked
    trigger: HTTP 403 from HSBC AIS
    user_message: Account access consent has been revoked.
    recovery: Route to consent-list screen
  - id: RateLimited
    trigger: HTTP 429 from HSBC AIS
    user_message: Too many requests. Please wait a moment and try again.
    recovery: Retry button shown; exponential back-off in ViewModel
  - id: NetworkError
    trigger: IOException / timeout
    user_message: No network connection. Check your connection and retry.
    recovery: Retry button re-triggers LoadScheduledPayments
  - id: EmptyResult
    trigger: Data.ScheduledPayment[] is empty
    user_message: No future-dated payments are pending for this account.
    recovery: Empty state shown; no action needed
