description: >-
  Read-only list of future-dated one-off scheduled payments for an account, sourced from OBReadScheduledPayment3. Shows
  payee name, instructed amount (GBP formatted), formatted scheduled date (EEE d MMM yyyy), ScheduledType chip
  (Execution date / Arrival date), destination CreditorAccount.Identification (sort code + account number), and payment
  reference. Reached from account-detail Scheduled chip. ViewModel maps OBIE ScheduledType enum to human-readable chip
  label + icon.
has_ui: true
has_server: false
capabilities: [has_ui, has_api, has_flow]

# Declared 2026-08-02 by /idea-sync (source-truth reverse pass). This feature is aligned to
# source in every dimension EXCEPT the `unsupported` state, which the idea-layer keeps ahead of
# source on purpose — source already records the U000 refusal (BankingStores.kt:377) but never
# renders it, so pruning the state to match source would delete the specification of a live
# defect rather than resolve it. Full evidence + the exact fix source owes: ui.yaml#spec_ahead_of_source.
