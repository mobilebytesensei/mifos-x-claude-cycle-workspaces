capability_completeness:
  storage_location: "no-local-storage — screen fetches on mount from HSBC AIS; no Room/SQLDelight writes; data discarded on navigation"
  destructive_action_safety: "not-applicable — AISP read-only screen; zero write, delete, or mutation operations permitted under ReadScheduledPaymentsDetail"
  nav_callback_wiring: "yes — NavigateBack() emits NavigationEvent.Back to NavController; screen entered from account-detail via accountId nav param"
  user_data_export: "not-applicable — AISP read-only; ReadScheduledPaymentsDetail is a read-only OBIE permission; no export surface warranted"
  permission_visibility: "yes — requires ReadScheduledPaymentsDetail AISP permission declared at consent-creation time; 403 surfaced as ConsentRevoked error state"
  storage_budget_awareness: "not-applicable — no local cache; fetch on demand only; no file or DB writes"
  network_data_policy: "HSBC OBIE AIS v4.0 GET /accounts/{AccountId}/scheduled-payments; 429 handled with retry button and exponential back-off in ViewModel"
  cache_lifecycle: "not-applicable — screen is stateless; data lives only in ViewModel memory; re-fetched on every mount or explicit retry"
  error_recovery: "yes — 401/TokenExpired routes to login screen; 403/ConsentRevoked routes to consent-list screen; 429/NetworkError shows Retry button that re-triggers LoadScheduledPayments; empty Data.ScheduledPayment[] shows empty state without retry"

