# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, empty, unsupported, error]. This file held only
# the populated collection, so four of the five states bound to nothing.
states:
  - scope: content
    scheduled_payments: all

  - scope: loading
    scheduled_payments: all

  - scope: empty
    scheduled_payments: []
    message: "No scheduled payments."
    detail: "Payments you schedule will appear here until they are sent."

  - scope: unsupported
    scheduled_payments: []
    message: "Your bank does not support scheduled payments here."
    detail: "You can still see them in your bank's own app."
    _why_distinct_from_empty: >-
      Same distinction standing-orders draws: empty means "you have none", unsupported means
      "we cannot read them". OBIE makes scheduled-payments an optional endpoint, so a bank
      returning 404 for the resource is a real and common case — telling that customer they
      have no scheduled payments would be a false statement about money already committed.

  - scope: error
    error_type: ScheduledPaymentsLoadFailed
    message: "Could not load your scheduled payments"
    recovery: "Check your connection and try again."
    recoverable: true
