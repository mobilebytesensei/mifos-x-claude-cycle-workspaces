sibling: api
schema_version: "4.0"
feature_id: scheduled-payments

screen_id: scheduled-payments

endpoints:
  - id: scheduled-payments-list
    method: GET
    path: "/accounts/{AccountId}/scheduled-payments"
    response_dto: ScheduledPaymentItem
    permission: ReadScheduledPaymentsDetail
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns future-dated scheduled payments for the given AccountId. ScheduledType Execution = payment leaves account on date; Arrival = funds arrive at beneficiary on date."
    # Folded in from ui.yaml#api 2026-07-31 (CROSS_LEAK repair). That block declared this
    # same operation in the wrong sibling; only the fields missing here were carried over.
    response:
      data_path: Data.ScheduledPayment
      fields:
        - ScheduledPaymentDateTime
        - ScheduledType
        - Reference
        - InstructedAmount.Amount
        - InstructedAmount.Currency
        - CreditorAccount.Name
        - CreditorAccount.Identification
    # Reverse-synced 2026-07-28: every kind renders on the shared error surface with
    # a Retry CTA. Source has no route_to_login / route_to_consent_list recovery —
    # this screen's only nav callback is onBack.
    errors:
      - code: 401
        type: TokenExpired
        recovery: show_retry
      - code: 403
        type: ConsentRevoked
        recovery: show_retry
      - code: 429
        type: RateLimited
        recovery: show_retry
      - code: IOException
        type: NetworkError
        recovery: show_retry
