sibling: api
schema_version: "4.0"
feature_id: scheduled-payments
_source: source_analysis

api:
  - id: get_scheduled_payments
    function: "Aisp.getScheduledPayments(accountId)"
    method: GET
    path: "/v4.0/aisp/accounts/{AccountId}/scheduled-payments"
    description: "OBIE v4.0 read scheduled payments (OBReadScheduledPayment3) — future-dated payments for one account, returned unpaginated."
    auth: "PSU bearer token (Ktor Auth plugin) + mTLS transport cert"
    params:
      AccountId: { type: String, required: true, source: nav_params.accountId }
    response:
      dto: ScheduledPaymentsResponse
      items: "Data.ScheduledPayment[]"
      domain_mapper: "ScheduledPaymentMapper.toScheduledPaymentItems(accountId) → List<ScheduledPaymentItem>"
    pagination:
      type: none
    cache:
      strategy: memory-only
      ttl: null
      offline: none
      note: "Store5 memory store, no Room SourceOfTruth — consent can be withdrawn at any moment"
    errors:
      400_U000: "Unsupported for product → recorded in AccountCapabilityRegistry, surfaced as NetworkError (retry)"
      401: "Unauthorized → TokenExpired (retry)"
      403: "Forbidden → ConsentRevoked (retry shown)"
      429: "RateLimited (retry)"
      5xx: "→ NetworkError (retry)"
      network: "NetworkError (retry)"
