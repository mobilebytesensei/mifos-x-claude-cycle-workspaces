sibling: data-flow
schema_version: "2.1.0"
feature_id: scheduled-payments

screen_id: scheduled-payments

on_mount:
  - trigger: scheduled_payments_load
    description: "Load future-dated scheduled payments for the given AccountId."
    steps:
      - call: scheduled-payments-list
        path_params:
          AccountId: "{params.accountId}"
        store_as: scheduledPayments
    on_loading: loading
    on_success: content
    on_empty: empty
    on_error: error

on_user_action:
  - trigger: retry_load
    re_runs: [scheduled_payments_load]
