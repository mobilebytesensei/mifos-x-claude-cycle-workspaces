sibling: flow
schema_version: "4.0"
feature_id: scheduled-payments

feature: scheduled-payments
flow_ref: consumer-banking

entry_points:
  - source: account-detail
    label: "Tap Scheduled chip"
    params: [accountId]

transitions:
  - from: scheduled-payments
    to: account-detail
    trigger: "Back button"
    params: [accountId]

# Moved verbatim from ui.yaml 2026-07-31 (CROSS_LEAK repair).
dependencies:
  tier: 1
  features:
    - account-detail
  libraries:
    - name: ktorfit
      role: "HSBC AIS HTTP client for GET /accounts/{AccountId}/scheduled-payments"
    - name: hsbc-obie-ais-v4.0
      role: "OBReadScheduledPayment3 response schema; ScheduledType Execution/Arrival enum"
