sibling: tests
schema_version: "4.0"
feature_id: scheduled-payments

screen_id: scheduled-payments

scenarios:
  - id: TC-SP-001
    description: "Scheduled payments list loads and renders all pending payments"
    state: content
    priority: p0
    given: "Valid PSU access token; HSBC sandbox returns 4 scheduled payments for account 40051512345678"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Four scheduled payment cards render (HMRC Self Assessment, Westminster Council Tax, Direct Line Insurance, Amazon Payments UK)"
      - "Each card shows payee name, amount in GBP, formatted scheduled date, ScheduledType chip, CreditorAccount.Identification, and reference"
      - "HMRC payment shows GBP 842.00, due Fri 31 Jul 2026, Execution date chip, sort code 08-32-00 12001039"
      - "Westminster payment shows GBP 198.00, due Sun 5 Jul 2026, Execution date chip, reference CTAX-JUL"

  - id: TC-SP-002
    description: "Loading state shown during scheduled payments fetch"
    state: loading
    priority: p0
    given: "Slow network; API call in flight"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible"
      - "Scheduled payments list not rendered"
      - "Empty and error states not visible"

  - id: TC-SP-003
    description: "Empty state when no scheduled payments pending"
    state: empty
    priority: p1
    given: "HSBC returns empty Data.ScheduledPayment[] for the account"
    when: "Screen mounts"
    then:
      - "Empty state renders with schedule icon"
      - "Title text uses strings.sp_empty_title"
      - "Body text uses strings.sp_empty_body"
      - "Retry button not shown in empty state"

  - id: TC-SP-004
    description: "Error state with Retry button on 401 token expired"
    state: error
    priority: p0
    given: "Access token is expired; scheduled-payments endpoint returns 401"
    when: "Screen mounts"
    then:
      - "Error state renders with error_outline icon"
      - "Title reads strings.sp_error_title"
      - "Retry button visible with strings.action_retry label"
      - "Tapping Retry re-triggers scheduled_payments_load ViewModel action"

  - id: TC-SP-005
    description: "Back button navigates to account-detail"
    state: content
    priority: p1
    given: "Scheduled payments list rendered for account 40051512345678, reached from the account-detail Scheduled chip"
    when: "User taps back button"
    then:
      - "Navigates to account-detail screen"
      - "accountId parameter preserved in navigation"

  - id: TC-SP-006
    description: "Error state shows consent-revoked message on 403"
    state: error
    priority: p1
    given: "Account access consent has been revoked; scheduled-payments endpoint returns 403"
    when: "Screen mounts"
    then:
      - "Error state renders"
      - "Error message reads 'Account access consent has been revoked.'"
      - "Retry button visible"

  - id: TC-SP-007
    description: "ScheduledType=Arrival renders 'Arrival date' chip with arrow_downward icon"
    state: content
    priority: p1
    given: "HSBC returns a payment with ScheduledType=Arrival (SP-003: Direct Line Insurance)"
    when: "Screen mounts"
    then:
      - "Direct Line Insurance card shows chip labelled 'Arrival date'"
      - "Chip icon is arrow_downward"
      - "Chip accessibility label references 'funds arrive at' semantics"
      - "Execution-type cards show 'Execution date' chip with calendar_today icon"

  - id: TC-SP-008
    description: "CreditorAccount.Identification (sort code + account number) is displayed in each card"
    state: content
    priority: p2
    given: "HSBC returns scheduled payments with CreditorAccount.Identification populated"
    when: "Screen renders payment cards"
    then:
      - "HMRC card shows '08-32-00 12001039' prefixed with strings.sp_account_prefix"
      - "Westminster card shows '60-23-05 20490017'"
      - "Field uses labelSmall style with onSurfaceVariant colour"

  # Spec-ahead-of-source: source BankingStores.kt:377 already records the OBIE U000 refusal via
  # recordIfUnsupported(AccountEndpoint.ScheduledPayments), but ScheduledPaymentsViewModel has not
  # yet added the isUnsupportedForProduct() pre-check or the Unsupported UI branch. This scenario
  # describes the intended behaviour that /implement owes — mirror: DirectDebitsViewModel.kt:64.
  # See ui.yaml#spec_ahead_of_source for the full source gap and fix recipe.
  - id: TC-SP-009
    description: >-
      Unsupported state renders when the account product does not expose the scheduled-payments
      resource (OBIE U000 product-level refusal). Spec-ahead-of-source: this branch is not yet
      built in ScheduledPaymentsViewModel — scenario describes intended behaviour that /implement
      owes (mirror: DirectDebitsUiState.Unsupported + DirectDebitsViewModel.kt:64).
    state: unsupported
    priority: p1
    given: "OBIE endpoint returns a U000 product-level refusal for this account (e.g. credit card); BankingStores.kt:377 has already called recordIfUnsupported(AccountEndpoint.ScheduledPayments)"
    when: "Screen mounts with an accountId whose product does not support the scheduled-payments resource"
    then:
      - "Component unsupported_scheduled_payments renders; test_tag scheduledPayments:unsupportedState is present"
      - "Title reads strings.sp_unsupported_title"
      - "Body shows the data-driven uiState.message (OBIE U000 message from error.obieMessage()); no i18n key wraps this value"
      - "No Retry button is shown — the refusal is a permanent product-capability decision, not a transient network failure"
      - "Accessibility label is strings.sp_unsupported_a11y"
