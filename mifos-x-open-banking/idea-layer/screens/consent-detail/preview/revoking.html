<!doctype html>
<!-- render-hash: 5f0a4c27e913db86 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSBC Connection — revoking</title>
<style>
  :root {
    --primary: #266489; --on-primary: #FFFFFF;
    --primary-container: #C9E6FF; --on-primary-container: #004B6F;
    --secondary: #50606E; --secondary-container: #D3E5F5;
    --tertiary: #64597B;
    --background: #F7F9FF; --surface: #F7F9FF;
    --surface-container-low: #F1F4F9; --surface-container: #EBEEF3; --surface-container-high: #E5E8ED;
    --on-surface: #181C20; --on-surface-variant: #41474D;
    --outline: #72787E; --outline-variant: #C1C7CE;
    --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #93000A;

    --font-brand: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --fs-title-large: 1.375rem; --fs-title-medium: 1rem;
    --fs-body-medium: 0.875rem; --fs-label-medium: 0.75rem;

    --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px; --sp-2xl: 32px;
    --r-small: 8px; --r-medium: 12px; --r-large: 16px; --r-full: 9999px;

    --el-0: none;
    --el-1: 0 1px 2px rgba(24, 28, 32, .08), 0 1px 3px rgba(24, 28, 32, .06);
    --el-2: 0 1px 2px rgba(24, 28, 32, .10), 0 2px 6px rgba(24, 28, 32, .08);

    --appbar-h: 64px; --navbar-h: 80px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #95CDF7; --on-primary: #00344E;
      --primary-container: #004B6F; --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9; --secondary-container: #384956;
      --tertiary: #CFC0E8;
      --background: #101417; --surface: #101417;
      --surface-container-low: #181C20; --surface-container: #1C2024; --surface-container-high: #262A2E;
      --on-surface: #E0E3E8; --on-surface-variant: #C1C7CE;
      --outline: #8B9198; --outline-variant: #41474D;
      --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
      --el-1: 0 1px 2px rgba(0, 0, 0, .40), 0 1px 3px rgba(0, 0, 0, .30);
      --el-2: 0 1px 2px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--background); color: var(--on-surface);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .screen { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  .top-app-bar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-xs);
    height: var(--appbar-h); padding: 0 var(--sp-xs); background: var(--surface); color: var(--on-surface);
  }
  .top-app-bar__title { font-family: var(--font-brand); font-size: var(--fs-title-large); font-weight: 500; line-height: 1.3; margin: 0; padding-left: var(--sp-lg); }

  .state-column {
    flex: 1 1 auto; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: var(--sp-xl);
    padding: var(--sp-xl); padding-bottom: calc(var(--navbar-h) + var(--sp-xl)); text-align: center;
  }

  .revoke-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 88px; height: 88px; aspect-ratio: 1/1; border-radius: var(--r-full);
    background: var(--error-container); color: var(--on-error-container); box-shadow: var(--el-1);
  }
  .revoke-badge svg { width: 40px; height: 40px; display: block; }

  .progress-circular { width: 44px; height: 44px; animation: spin 1.4s linear infinite; }
  .progress-circular circle {
    fill: none; stroke: var(--error); stroke-width: 4; stroke-linecap: round;
    stroke-dasharray: 84 140; animation: dash 1.4s ease-in-out infinite;
  }
  .progress-circular__track { stroke: var(--surface-container-high); animation: none; stroke-dasharray: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes dash {
    0%   { stroke-dasharray: 12 140; stroke-dashoffset: 0; }
    50%  { stroke-dasharray: 84 140; stroke-dashoffset: -26; }
    100% { stroke-dasharray: 84 140; stroke-dashoffset: -112; }
  }
  @media (prefers-reduced-motion: reduce) {
    .progress-circular { animation-duration: 3s; }
    .progress-circular circle { animation: none; stroke-dasharray: 66 140; }
  }

  .revoking-label { font-family: var(--font-brand); font-size: var(--fs-title-medium); font-weight: 500; color: var(--on-surface); margin: 0; }
  .revoking-hint { font-size: var(--fs-body-medium); line-height: 1.5; color: var(--on-surface-variant); margin: 0; max-width: 34ch; }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: flex-start; justify-content: space-around;
    height: calc(var(--navbar-h) + env(safe-area-inset-bottom, 0px));
    padding: var(--sp-md) var(--sp-sm) calc(var(--sp-md) + env(safe-area-inset-bottom, 0px));
    background: var(--surface-container); box-shadow: var(--el-2);
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: var(--sp-xs); flex: 1 1 0; min-width: 0; min-height: 48px; border: 0; padding: 0; background: transparent; color: var(--on-surface-variant); cursor: pointer; font-family: var(--font-body); font-size: var(--fs-label-medium); font-weight: 500; }
  .nav-item__indicator { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 32px; border-radius: var(--r-full); }
  .nav-item svg { width: 24px; height: 24px; display: block; }
  .nav-item[aria-current="page"] { color: var(--primary); }
  .nav-item[aria-current="page"] .nav-item__indicator { background: var(--secondary-container); }
</style>
</head>
<body>
<div class="screen" data-screen="consent-detail" data-state="revoking">

  <header class="top-app-bar" data-component-type="top_app_bar" data-component-id="consent_detail_top_app_bar">
    <h1 class="top-app-bar__title">HSBC Connection</h1>
  </header>

  <main class="state-column" role="status" aria-live="polite" aria-label="Revoking HSBC access, please wait">
    <span class="revoke-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 14.5 7 17a3.5 3.5 0 0 1-5-5l2.5-2.5"/><path d="m14.5 9.5 2.5-2.5a3.5 3.5 0 0 1 5 5L19.5 14.5"/><path d="m3 3 18 18" stroke-width="2.3"/>
      </svg>
    </span>

    <svg class="progress-circular" viewBox="0 0 48 48" role="progressbar"
         data-component-type="progress_circular" data-component-id="revoking_indicator"
         data-test-tag="consentDetail:revokingIndicator" aria-label="Revoking HSBC access, please wait">
      <circle class="progress-circular__track" cx="24" cy="24" r="20"/>
      <circle cx="24" cy="24" r="20"/>
    </svg>

    <p class="revoking-label" data-component-type="text" data-component-id="revoking_label">Revoking access…</p>
    <p class="revoking-hint" data-component-type="text" data-component-id="revoking_hint">Removing access to your HSBC account data. Please do not close the app.</p>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" type="button" data-nav-to="home" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Home</button>
    <button class="nav-item" type="button" data-nav-to="accounts" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/></svg></span>Accounts</button>
    <button class="nav-item" type="button" data-nav-to="payments" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></span>Pay</button>
    <button class="nav-item" type="button" aria-current="page" data-nav-to="settings" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</button>
  </nav>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
