sibling: demo-data
schema_version: "2.1.0"
feature_id: consent-detail

screen_id: consent-detail
models: wire
maps_to_dto: [ConsentSummary]
_models_note: "The API-payload blocks are the OBIE wire envelope (Data / Links / Meta / Permissions); the camelCase and snake_case keys elsewhere are UI copy, not DTO items. DD5 compares the payload blocks against the wire contract."
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC-sandbox-style data only."

consent:
  Data:
    ConsentId: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    Status: "Authorised"
    CreationDateTime: "2026-06-28T18:25:00Z"
    StatusUpdateDateTime: "2026-06-28T18:25:43Z"
    Permissions:
      - ReadAccountsDetail
      - ReadBalances
      - ReadTransactionsDetail
      - ReadBeneficiariesDetail
      - ReadStandingOrdersDetail
      - ReadDirectDebits
      - ReadScheduledPaymentsDetail
      - ReadStatementsDetail
      - ReadProducts
      - ReadParty
    ExpirationDateTime: "2026-09-26T00:00:00Z"
    TransactionFromDateTime: "2026-03-30T00:00:00Z"
    TransactionToDateTime: "2026-06-28T23:59:59Z"
  permissions_detail:
    - id: ReadAccountsDetail
      label: "Account details"
      description: "Account identifiers, sort code, account number, nickname"
    - id: ReadBalances
      label: "Balances"
      description: "Current and available balances for each account"
    - id: ReadTransactionsDetail
      label: "Transaction history"
      description: "Debits and credits with merchant, amount, and date"
    - id: ReadBeneficiariesDetail
      label: "Beneficiaries"
      description: "Saved payees on your account"
    - id: ReadStandingOrdersDetail
      label: "Standing orders"
      description: "Scheduled recurring payment instructions"
    - id: ReadDirectDebits
      label: "Direct debits"
      description: "Active direct debit mandates and their status"
    - id: ReadScheduledPaymentsDetail
      label: "Scheduled payments"
      description: "One-off future-dated payment instructions"
    - id: ReadStatementsDetail
      label: "Statements"
      description: "Monthly statement metadata and PDF references"
    - id: ReadProducts
      label: "Product information"
      description: "Interest rates and product features attached to your accounts"
    - id: ReadParty
      label: "Account holder name"
      description: "Full legal name registered on the account"
  Links:
    Self: "https://api.hsbc.com/open-banking/v4.0/account-access-consents/aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
  Meta:
    TotalPages: 1

# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, revoke_confirm, revoking, error, empty].
# This file held one Authorised consent, so five of the six states bound to nothing —
# including revoke_confirm and revoking, which are the screen's whole reason to exist.
states:
  - scope: content
    consent: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    status: "Authorised"

  - scope: loading
    consent: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"

  - scope: revoke_confirm
    consent: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    prompt: "Stop sharing your account data with this app?"
    detail: "This app will lose access immediately. You can reconnect at any time."
    confirm_label: "Stop sharing"
    cancel_label: "Keep sharing"
    _reversible_by_design: >-
      Destructive but REVERSIBLE — re-authorisation is a working path, unlike a payment.
      design-tokens.yaml#irreversible_action lists consent_revoke alongside send_money_confirm
      but the copy here deliberately says "You can reconnect at any time", because overstating
      finality is its own kind of dishonesty.

  - scope: revoking
    consent: "aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    _cta_locked: true

  - scope: empty
    consent: null
    message: "This connection is no longer available."
    detail: "It may have been revoked or it has expired."
    _when_this_happens: "Deep link to a consent id the bank no longer returns — after revocation from another client, or after expiry."

  - scope: error
    error_type: ConsentLoadFailed
    message: "Could not load this connection"
    recovery: "Check your connection and try again."
    recoverable: true
