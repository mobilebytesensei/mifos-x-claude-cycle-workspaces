sibling: data-flow
schema_version: "2.1.0"
feature_id: consent-detail

screen_id: consent-detail

on_mount:
  - trigger: load_consent_detail
    description: "Fetch current consent-status for the ConsentId passed as route param."
    steps:
      - call: consent-status
        path_params:
          ConsentId: "{route_params.consentId}"
        store_as: consent
    on_loading: loading
    on_success: content
    on_empty: empty
    on_error: error

on_user_action:
  - trigger: confirm_revoke
    description: "User taps 'Revoke access' — transition to revoke_confirm state to show confirmation dialog."
    set_state: revoke_confirm

  - trigger: dismiss_revoke_confirm
    description: "User taps 'Keep access' in the dialog — return to content state."
    set_state: content

  - trigger: execute_revoke
    description: "User confirms revoke — transitions to revoking state, calls consent-revoke DELETE, clears local token and ConsentId, navigates to consent-list. 404 is treated idempotently as already-revoked (same cleanup path, no error)."
    steps:
      - call: consent-revoke
        path_params:
          ConsentId: "{consent.Data.ConsentId}"
        on_404: treat_as_revoked
        note: "OBIE: a 404 on DELETE means the consent no longer exists on HSBC side — treat as successfully revoked, clear local state, navigate."
      - action: clear_local_consent
        params:
          consentId: "{consent.Data.ConsentId}"
    on_loading: revoking
    on_success: navigate
    on_error: error
    post_success_navigate:
      target: consent-list

  - trigger: retry_load
    re_runs: [load_consent_detail]

  - trigger: navigate_reconfirm
    navigate_to: login
