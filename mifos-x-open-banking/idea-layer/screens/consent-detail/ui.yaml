known_gaps:
  - id: revoke-is-full-logout
    severity: info
    description: "Revoke is not a scoped consent delete: a confirmed revoke calls AppLogout.logOut(), which also wipes payment auth, history and every VRP consent. (The 'failed revoke still logs out' half — DEF-003 — is closed in this spec by the revoke_failed state; source still pending /implement.)"
  - id: def-003-source-pending
    severity: warn
    description: "Spec healed 2026-10-21 (revoke_failed + confirm-before-logout); source still runs the DELETE inside AppLogoutImpl with runCatching. /kmp-implement must move the DELETE into ConsentDetailViewModel and make AppLogout.logOut() DELETE-free for this path."
  - id: retry-on-terminal-errors
    severity: warn
    description: "Retry is offered for ConsentNotFound (404), ConsentRevoked (403) and TokenExpired (401), which a refresh cannot fix; TokenExpired has no Sign-in-again path unlike consent-list's ErrorAuth."
  - id: revoke-server-error-misnamed
    severity: info
    description: "ConsentDetailErrorKind.RevokeServerError is only produced by a load-time 5xx; the revoke path never surfaces an error."
  - id: blank-consent-id
    severity: info
    description: "consentId falls back to '' when the nav arg is missing; the store is then queried with an empty id rather than failing fast to Empty."
  - id: reconfirm-not-gated
    severity: info
    description: "The Reconfirm button is always shown, not only inside the 7-day warning window."
