flow_ref: consent-management
description: >-
  Full consent detail screen showing the HSBC OBIE status badge (color-coded: primary=Authorised, warning=Expired,
  error=Revoked/Rejected), all 11 granted permissions with human-readable labels,
  creation/expiry/transaction-from/transaction-to dates, an expiry warning banner when within 7 days, a 90-day reconfirm
  prompt, and a two-step destructive 'Revoke access' action (revoke_confirm dialog gate → revoking progress state →
  DELETE consent-revoke → clear local PSU token → navigate to consent-list). 404 on DELETE is treated idempotently as
  already-revoked.
has_ui: true
has_server: false
capabilities: [has_ui, has_api, has_flow]
metadata:
  category: composite
  implementation_ready: true
  impl_ready_at: '2026-06-29T12:00:00Z'
  impl_ready_schema: v2
contracts: []
libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
# vm_actions RELOCATED 2026-08-01 (/idea-sync): loadConsentDetail -> initial_load;
# navigateReconfirm -> nav_callbacks. Nothing deleted. ui.yaml#state_model declares members
# [RetryLoad, ConfirmRevoke, DismissRevokeConfirm, ExecuteRevoke] — all four retained below.
initial_load:
  mechanism: init-stream-collection
  what:
    - ConsentService.getConsentStatus(consentId)
    - PermissionsMapper.toReadableLabels(permissions)
    - "Compute expiryWarningDays from Data.ExpirationDateTime (null if > 7 days)"
  states: "Loading -> Content(consent, permissionsDetail, expiryWarningDays)"
  error_handling:
    HttpException(401): Transition to Error(ConsentDetailErrorCode.TokenExpired)
    HttpException(404): Transition to Error(ConsentDetailErrorCode.ConsentNotFound)
    NetworkError: Transition to Error(ConsentDetailErrorCode.NetworkError)
  note: >-
    NOT a dispatched action. ui.yaml#implementation.removed_in_sync: "loadConsentDetail action —
    the initial load is stream collection in init{}".

nav_callbacks:
  # ui.yaml#implementation.removed_in_sync: "navigateReconfirm action — reconfirm is the
  # onReconfirm nav-host callback".
  - signature: "onReconfirm -> navigate(Route.Login(reconfirmMode = true))"
    surface: "reconfirm_button — shown while the consent is inside its expiry window"

vm_actions:
  - name: ConfirmRevoke
    signature: 'fun confirmRevoke(): Unit'
    state_mutations:
      - uiState = RevokeConfirm(consent)
    side_effects: []
    error_handling: {}
  - name: DismissRevokeConfirm
    signature: 'fun dismissRevokeConfirm(): Unit'
    state_mutations:
      - uiState = Content(consent, permissionsDetail, expiryWarningDays)
    side_effects: []
    error_handling: {}
  - name: ExecuteRevoke
    signature: 'suspend fun executeRevoke(consentId: String): Unit'
    state_mutations:
      - uiState = Revoking(consent)
    side_effects:
      - ConsentService.revokeConsent(consentId)
      - LocalStorage.clearConsentId(consentId)
      - LocalStorage.clearPsuToken()
      - Navigator.navigate(Route.ConsentList)
    error_handling:
      HttpException(401): Surface Error(ConsentDetailErrorCode.TokenExpired)
      HttpException(404): Treat as already revoked — clear local state, navigate to consent-list (idempotent)
      NetworkError: Surface Error(ConsentDetailErrorCode.NetworkError) with retry
      HttpException(5xx): Surface Error(ConsentDetailErrorCode.RevokeServerError)
  - name: RetryLoad
    signature: 'suspend fun retryLoad(): Unit'
    state_mutations:
      - uiState = Loading
    side_effects:
      - ConsentService.getConsentStatus(consentId)
    error_handling:
      NetworkError: Transition to Error(ConsentDetailErrorCode.NetworkError)
error_cases:
  - ConsentNotFound
  - ConsentRevoked
  - ConsentExpired
  - TokenExpired
  - NetworkError
  - RevokeServerError
