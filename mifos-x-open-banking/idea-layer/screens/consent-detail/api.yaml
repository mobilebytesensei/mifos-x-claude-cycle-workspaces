sibling: api
schema_version: "4.0"
feature_id: consent-detail

screen_id: consent-detail

endpoints:
  - id: consent-status
    method: GET
    path: "/account-access-consents/{ConsentId}"
    response_dto: ConsentSummary
    permission: null
    requires_auth: true
    path_params:
      ConsentId: string
    notes: "Fetches the full consent resource including Status, Permissions[], and date fields. Authenticated with client_credentials token."

  - id: consent-revoke
    method: DELETE
    path: "/account-access-consents/{ConsentId}"
    response_dto: null
    permission: null
    requires_auth: true
    path_params:
      ConsentId: string
    notes: "Revokes the consent resource. HSBC returns 204 No Content on success. The app must clear the locally stored PSU access token and ConsentId. A 404 response indicates the consent no longer exists server-side and must be treated idempotently as already-revoked — perform the same local cleanup and navigate to consent-list without surfacing an error."
