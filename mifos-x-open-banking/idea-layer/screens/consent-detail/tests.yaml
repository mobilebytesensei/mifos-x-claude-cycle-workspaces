sibling: tests
schema_version: "4.0"
feature_id: consent-detail

screen_id: consent-detail

scenarios:
  - id: TC-CDETAIL-001
    priority: high
    description: "Content state renders status header, 10 permissions, all four dates, and CTAs"
    state: content
    given: "consent-status GET returns OBReadConsentResponse1 with Status=Authorised, 10 Permissions[], all date fields present"
    when: "Screen mounts with consentId=aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
    then:
      - "Status chip shows 'Authorised' in primary colour"
      - "ConsentId label shows aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01"
      - "10 permission rows render with label and description"
      - "'Connected on 2026-06-28T18:25:00Z' list item visible"
      - "'Expires on 2026-09-26T00:00:00Z' list item visible"
      - "'Transaction data from 2026-03-30T00:00:00Z' list item visible"
      - "'Transaction data to 2026-06-28T23:59:59Z' list item visible"
      - "'Reconfirm before expiry' button visible"
      - "'Revoke access' button visible in error colour"
      - "Expiry warning banner NOT visible (expiry > 7 days)"

  - id: TC-CDETAIL-002
    priority: high
    description: "Loading state shown while consent-status GET is in flight"
    state: loading
    given: "consent-status GET request is pending"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible with accessibility label"
      - "No content components rendered"

  - id: TC-CDETAIL-003
    priority: high
    description: "Tapping 'Revoke access' transitions to revoke_confirm state with dialog"
    state: revoke_confirm
    given: "Content state is active"
    when: "User taps 'Revoke access'"
    then:
      - "Confirmation dialog renders with title matching strings.consent_detail.revoke_dialog.title"
      - "'Keep access' and 'Yes, revoke' buttons visible in dialog"
      - "No DELETE API call made"

  - id: TC-CDETAIL-004
    priority: medium
    description: "Tapping 'Keep access' in dialog returns to content state without API call"
    state: content
    given: "revoke_confirm state is active"
    when: "User taps 'Keep access'"
    then:
      - "Dialog dismissed; content state restored"
      - "No API call made"

  - id: TC-CDETAIL-005
    priority: high
    description: "Confirming revoke transitions through revoking state, calls DELETE, then navigates to consent-list"
    state: revoking
    given: "HSBC sandbox returns 204 on DELETE /account-access-consents/{ConsentId}"
    when: "User taps 'Yes, revoke' in confirm dialog"
    then:
      - "Screen transitions to revoking state with labelled progress indicator"
      - "DELETE /account-access-consents/aac-fb2c4e8a-7d31-4c9e-9f2a-1b3c5d7e9f01 called once"
      - "Local ConsentId and PSU token cleared from storage"
      - "App navigates to consent-list screen"

  - id: TC-CDETAIL-006
    priority: high
    description: "Error state shown on consent-status GET failure (404)"
    state: error
    given: "consent-status GET returns 404 (consent not found)"
    when: "Screen mounts"
    then:
      - "error_outline icon visible"
      - "'Could not load consent' title visible"
      - "Error message body reflects ConsentNotFound"
      - "Retry button visible"

  - id: TC-CDETAIL-007
    priority: high
    description: "ExecuteRevoke network failure surfaces error state with retry"
    state: error
    given: "Network is unreachable when user taps 'Yes, revoke'"
    when: "ExecuteRevoke action dispatched"
    then:
      - "Screen transitions through revoking state then to error state"
      - "Error body reflects ConsentDetailErrorCode.NetworkError"
      - "Retry button present (re-triggers GET on tap)"
      - "Local PSU token NOT cleared (revoke did not succeed)"

  - id: TC-CDETAIL-008
    priority: medium
    description: "404 on DELETE treated as already-revoked — clean local state and navigate"
    state: content
    given: "HSBC returns 404 on DELETE /account-access-consents/{ConsentId} (consent already gone server-side)"
    when: "User taps 'Yes, revoke'"
    then:
      - "No error state shown"
      - "Local ConsentId and PSU token cleared"
      - "App navigates to consent-list screen"

  # Corrected 2026-08-03 (/idea-sync "fix the issues"). This scenario asserted the Expired chip
  # renders in `warning`. Two faults in one token: (a) `warning` is not a colour role in this
  # design system — design-tokens.yaml 2.1.0 ships the M3 role set and there is no warning role
  # and no amber; (b) DESIGN.md 1.3.0 maps Expired -> `error`, "reserved for Revoked, Rejected
  # and Expired, where access is actually gone". `tertiary` is the EXPIRING tone (act soon, still
  # live), which TC-CDETAIL-010 three rows below already spells correctly as tertiaryContainer.
  # Same correction consent-list took on this date (TC-CLIST-007) and statement-detail took for
  # its green/tertiary money roles; neither reached this file at the time.
  - id: TC-CDETAIL-009
    priority: medium
    description: "Expired consent renders status chip in the error colour"
    state: content
    given: "consent-status GET returns Status=Expired"
    when: "Screen mounts"
    then:
      - "Status chip label shows 'Expired'"
      - "Status chip colour is 'error' (not primary, and not the tertiary expiring tone)"
      - "'Reconfirm before expiry' button still visible"

  - id: TC-CDETAIL-010
    priority: low
    description: "Expiry warning banner visible when ExpirationDateTime is within 7 days"
    state: content
    given: "ExpirationDateTime is 3 days from today"
    when: "Screen enters content state"
    then:
      - "Expiry warning banner rendered above dates section"
      - "Banner colour is tertiaryContainer (the warning semantic — see semantic.status)"
      - "Banner text references expiry warning strings key"

  - id: TC-CDETAIL-011
    priority: medium
    description: "Empty state when the consent resolves but carries no record"
    state: empty
    given: "GET /account-access-consents/{ConsentId} returns 200 with no Data block"
    when: "Screen mounts"
    then:
      - "empty_state rendered with link_off icon"
      - "Title matches {strings.consent_detail.empty.title}"
      - "Body matches {strings.consent_detail.empty.body}"
      - "'Back to connections' button visible and navigates to consent-list"
      - "Revoke access and Reconfirm buttons NOT visible"
