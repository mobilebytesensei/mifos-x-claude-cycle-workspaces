# ─────────────────────────────────────────────────────────────────────────
# ERROR CONTRACT
# ─────────────────────────────────────────────────────────────────────────
error_contract_ref:
  dto: dtos/ObPaymentError.yaml
  note: >-
    The envelope shape, the Errors[]-is-an-array finding, the fail-fast U005-before-U004
    ordering, the unstable Path casing and the four U004 wordings are stated ONCE there and
    shared by all seven PIS rails. The error_cases block below maps only what THIS screen
    surfaces to the PSU; it does not restate the contract.
  binding_consequences_for_this_screen:
    - "error_panel iterates the whole Errors[] array — Errors[0] alone hides the actionable half (R13-10, R9-11)."
    - "Copy is selected from ErrorCode + Path, never Message, and the Path match is case-insensitive (R2-05)."
    - "IneligibleAccount cannot say WHY: U002 @ DebtorAccount.Identification means three different things. Pre-filter instead (FR-018)."
    - "U021 is NOT mapped on this screen — it never occurs in the 139 single-payment scenarios."

