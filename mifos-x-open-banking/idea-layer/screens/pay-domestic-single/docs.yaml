scaffolded_by: /idea-sync
archetype: form
flow_ref: pay-domestic-single
description: >-
  Domestic single payment — pay a person now, in sterling, to a UK sort code and account
  number. Four steps in one route: funding account, payee, amount, review. Stages a
  domestic-payment-consent, hands off to payment-consent for the bank authorisation, runs
  funds-confirmation, then submits and hands the result to payment-status.

  This is the REFERENCE rail. The other five PIS types are documented as deltas from it, so
  every divergence stated in their specs is measured against this contract.
has_ui: true
has_server: false
capabilities: [has_ui, has_api, has_flow, has_form_input, has_system_integration]
system_capabilities:
  - kind: deep_link
    detail: "Hands off to payment-consent for the app-to-app authorise leg, then resumes to submit."

metadata:
  category: form
  implementation_ready: true
  quality_score: 94
  scaffold_origin: "/idea-sync — seven-type payments rewrite, 2026-08-06"

# ─────────────────────────────────────────────────────────────────────────
# WHAT THIS RAIL IS, AGAINST THE OTHER SIX
# ─────────────────────────────────────────────────────────────────────────
rail_position:
  time_dimension: none
  amount_field: InstructedAmount
  creditor_scheme: UK.OBIE.SortCodeAccountNumber
  funds_confirmation: "GET — the only verb form shared with international single"
  remittance_information: accepted
  charge_at_staging: "0.05 GBP UK.OBIE.CHAPSOut"
  consent_ladder: "AWAU -> AUTH -> COND"
  resource_ladder: "ACSP -> ACCC"
  risk_block: "consumer PaymentContextCode, no merchant fields"
  structural_note: >-
    The richest payload of the three domestic shapes — 34 body leaves against 9 for a standing
    order. The payload SHRINKS as the object grows more abstract: a standing order drops
    DebtorAccount, LocalInstrument and the identity fields, and empties Risk. A mandate does not
    pick a rail (the bank picks one per instalment) and has no single e-commerce context to
    attach.
    CORRECTED 2026-08-07: RemittanceInformation was previously listed among the dropped fields.
    It is not dropped — the standing-order rail accepts it at Initiation level (R17-D01,
    R17-D03). Only MandateRelatedInformation.Reference is refused there. See
    pay-domestic-standing-order/api.yaml#reference_channel.

# ─────────────────────────────────────────────────────────────────────────
# SUPERSEDES
