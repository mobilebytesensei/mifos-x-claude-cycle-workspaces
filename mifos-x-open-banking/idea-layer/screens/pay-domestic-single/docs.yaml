regulatory:
  note: >-
    PISP is a distinct FCA permission from AISP. Sandbox operation is unaffected; production
    payment initiation needs authorisation this project does not hold.
  affects_production: true
  affects_sandbox: false
  adr_required: true

vm_actions:
  - name: LoadPaymentSources
    signature: 'suspend fun loadPaymentSources()'
    state_mutations:
      - uiState = Loading
      - "uiState = Content(step = Account, eligibleDebtorAccounts = accounts.filter { it.scheme == SortCodeAccountNumber }, hiddenAccountCount = accounts.size - eligible.size)"
      - "uiState = Content(step = Account) with no eligible accounts -> content_no_eligible_accounts"
    side_effects:
      - "GET /accounts via AccountsRepository"
      - "GET /accounts/{AccountId}/beneficiaries via BeneficiariesRepository"
    error_handling:
      on_401: uiState = Error(TokenExpired)
      on_403: uiState = Error(ConsentRevoked)
      on_network: uiState = Error(NetworkError)

  - name: ConfirmAndStageConsent
    signature: 'suspend fun confirmAndStageConsent()'
    state_mutations:
      - uiState = Submitting(StagingConsent)
      - uiState = Submitting(AwaitingAuthorisation, consentId = response.Data.ConsentId)
    side_effects:
      - "POST /domestic-payment-consents, client-credentials payments-scope token"
      - "Attaches x-jws-signature (detached PS256, b64:false + crit)"
      - "Attaches x-idempotency-key, stable across retries"
      - "Emits NavigateToPaymentConsent"
    error_handling:
      on_400_U019: uiState = Error(SignatureMissing)
      on_400_U002: uiState = Error(IneligibleAccount)
      on_401: uiState = Error(TokenExpired)
      on_network: uiState = Error(NetworkError)

  - name: ConfirmFunds
    signature: 'suspend fun confirmFunds(consentId: String)'
    state_mutations:
      - uiState = Submitting(ConfirmingFunds)
    side_effects:
      - "GET /domestic-payment-consents/{ConsentId}/funds-confirmation on the PSU token"
    error_handling:
      on_funds_unavailable: "uiState = Error(InsufficientFunds); returns to the Amount step"

  - name: SubmitPayment
    signature: 'suspend fun submitPayment(consentId: String)'
    state_mutations:
      - uiState = Submitting(SubmittingPayment)
      - "uiState = Success(paymentId, status) -> emits NavigateToPaymentStatus"
    side_effects:
      - "POST /domestic-payments on the PSU token"
      - "Echoes the Initiation read back from the AUTHORISED consent, not the local staged copy"
      - "Reuses the SAME x-idempotency-key"
    error_handling:
      on_400_U009: uiState = Error(ConsentNotAuthorised)
      on_400_U008: uiState = Error(InitiationMismatch)
      on_400_U019: uiState = Error(SignatureMissing)
      on_403: uiState = Error(ConsentRevoked)
      on_network: uiState = Error(NetworkError)

  - name: RetrySubmit
    signature: 'fun retrySubmit()'
    visibility_condition: "error.type in {NetworkError, TokenExpired}"
    notes: >-
      Idempotency-key-safe: the same key plus the same body returns the original result rather
      than creating a second payment.

error_cases:
  - id: SignatureMissing
    trigger: "400 U019"
    user_message: '{strings.error.payment.signature_missing}'
    recovery: "Not user-recoverable. Support reference (the OB envelope Id), not a Retry."
  - id: ConsentNotAuthorised
    trigger: "400 U009"
    user_message: '{strings.error.payment.consent_not_authorised}'
    recovery: "Re-authorise CTA restarts the app-to-app leg."
  - id: InitiationMismatch
    trigger: "400 U008"
    user_message: '{strings.error.payment.initiation_mismatch}'
    recovery: "Not user-recoverable. Re-read the authorised consent and resubmit from its Initiation."
  - id: IneligibleAccount
    trigger: "400 U002 or U027 on debtor/creditor"
    user_message: '{strings.error.payment.ineligible_account}'
    recovery: "Return to the account step. Should be unreachable — the picker prevents it."
  - id: InsufficientFunds
    trigger: "funds-confirmation returns FundsAvailable false"
    user_message: '{strings.error.payment.insufficient_funds}'
    recovery: "Return to the amount step; the payment is not submitted."
  - id: ConsentRevoked
    trigger: "403"
    user_message: '{strings.error.payment.consent_revoked}'
    recovery: "View Consents CTA navigates to consent-list."
  - id: TokenExpired
    trigger: "401"
    user_message: '{strings.error.payment.token_expired}'
    recovery: "Retry after refreshing the token."
  - id: NetworkError
    trigger: "IOException / timeout"
    user_message: '{strings.error.payment.network_error}'
    recovery: "Retry — safe because the idempotency key is reused."

