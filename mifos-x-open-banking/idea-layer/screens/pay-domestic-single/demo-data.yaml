sibling: demo-data
schema_version: "4.0"
feature_id: pay-domestic-single

# Fixtures are the REAL sandbox accounts and the REAL observed response shapes from the
# pisp-tests corpus, not invented data. Account identifiers below are HSBC sandbox test
# accounts holding synthetic data.

content:
  debtor_accounts:
    - AccountId: "123456791"
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "80200110203349"
      Name: "Current account"
      Currency: GBP
      available_balance: "1250.00"
      eligible: true

    - AccountId: "123456792"
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "80200110203348"
      Name: "Current account 2"
      Currency: GBP
      available_balance: "480.00"
      eligible: true

    - AccountId: "1123456841"
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "80122590953695"
      Name: "BMM ACCOUNT"
      Currency: GBP
      available_balance: "8000.00"
      eligible: true
      note: "Savings. Payable on this rail — the Guide's product-based restriction is not what fires."

    - AccountId: "1123456843"
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "80119770009652"
      Name: "GLOBAL MONEY ACCOUNT"
      Currency: GBP
      eligible: false
      exclusion_reason: "TPP-named Global Money returns U002 Invalid Field @ DebtorAccount.Identification"
      note: >-
        Excluded from the picker but NOT unpayable — the bank successfully nominated this
        account to fund domestic payment 19909. It becomes reachable only by omitting
        DebtorAccount so the PSU picks at the bank, which this form does not do.

    - AccountId: "1123456842"
      SchemeName: "UK.OBIE.PAN"
      Identification: "xxxx-xxxx-xxxx-3456"
      Name: "Credit card"
      eligible: false
      exclusion_reason: "U027 Unsupported scheme @ DebtorAccount.SchemeName on the domestic rail"

  hidden_account_count: 2

  beneficiaries:
    - BeneficiaryId: "BEN-001"
      Name: "Mr Mark"
      CreditorAccount:
        SchemeName: "UK.OBIE.SortCodeAccountNumber"
        Identification: "80200110203349"
    - BeneficiaryId: "BEN-002"
      Name: "Ramu"
      CreditorAccount:
        SchemeName: "UK.OBIE.SortCodeAccountNumber"
        Identification: "40200110203351"

  staged_consent_response:
    Data:
      ConsentId: "45116"
      CreationDateTime: "2026-08-06T09:20:28+00:00"
      Status: "AWAU"
      StatusUpdateDateTime: "2026-08-06T09:20:28+00:00"
      Initiation:
        InstructionIdentification: "23456789876543"
        EndToEndIdentification: "E2E.IDFN.543"
        LocalInstrument: "UK.OBIE.FPS"
        InstructedAmount: { Amount: "15.55", Currency: "GBP" }
        DebtorAccount:
          SchemeName: "UK.OBIE.SortCodeAccountNumber"
          Identification: "80200110203349"
        CreditorAccount:
          SchemeName: "UK.OBIE.SortCodeAccountNumber"
          Identification: "80200110203348"
          Name: "Mr Mark"
        RemittanceInformation: { Unstructured: ["Rent August"] }
      Charges:
        - ChargeBearer: "BorneByDebtor"
          Type: "UK.OBIE.CHAPSOut"
          Amount: { Amount: "0.05", Currency: "GBP" }
    Risk:
      PaymentContextCode: "TransferToThirdParty"

  authorised_consent_response:
    note: >-
      Same consent after the PSU approves. Status moves to AUTH but StatusUpdateDateTime does
      NOT move — this fixture exists specifically so a poll keyed on the timestamp fails its test.
    Data:
      ConsentId: "45116"
      CreationDateTime: "2026-08-06T09:20:28+00:00"
      Status: "AUTH"
      StatusUpdateDateTime: "2026-08-06T09:20:28+00:00"

  funds_confirmation_response:
    Data:
      FundsAvailableResult:
        FundsAvailable: "Available"
        FundsAvailableDateTime: "2026-08-06T09:22:10+00:00"

  submit_response:
    Data:
      DomesticPaymentId: "19908"
      ConsentId: "45116"
      Status: "ACSP"
      CreationDateTime: "2026-08-06T09:22:35+00:00"

  status_readback_response:
    note: "Observed hours later. All seven authorised payments in the corpus read back ACCC."
    Data:
      DomesticPaymentId: "19908"
      Status: "ACCC"
      StatusUpdateDateTime: "2026-08-06T09:22:35+00:00"
      Charges:
        - Type: "UK.OBIE.CHAPSOut"
          Amount: { Amount: "0.05", Currency: "GBP" }

  error_responses:
    signature_missing:
      http: 400
      body: { Errors: [{ ErrorCode: "U019", Message: "Signature is missing", Path: "Header" }] }
    consent_not_authorised:
      http: 400
      body: { Errors: [{ ErrorCode: "U009", Message: "Invalid consent status", Path: "Data.ConsentId" }] }
    ineligible_card_debtor:
      http: 400
      body: { Errors: [{ ErrorCode: "U027", Message: "Unsupported scheme", Path: "Data.Initiation.DebtorAccount.SchemeName" }] }
    ineligible_gm_debtor:
      http: 400
      body: { Errors: [{ ErrorCode: "U002", Message: "Invalid Field", Path: "Data.Initiation.DebtorAccount.Identification" }] }
    iban_creditor_on_domestic:
      http: 400
      body: { Errors: [{ ErrorCode: "U027", Message: "Unsupported scheme", Path: "Data.Initiation.CreditorAccount.SchemeName" }] }
