sibling: flow
schema_version: "4.0"
feature_id: pay-domestic-single

feature: pay-domestic-single
flow_ref: pay-domestic-single

entry_points:
  - source: payments
    label: "Tap the Domestic single tile on the payments hub"
    params: []

transitions:
  - from: pay-domestic-single
    to: payment-consent
    trigger: "Confirm on the Review step, after the consent stages 201"
    params: [consentId, paymentFamily]
    notes: >-
      paymentFamily is passed so the shared payment-consent screen knows which family's
      consent-status GET to poll. Without it the return leg cannot resolve an endpoint.

  - from: payment-consent
    to: pay-domestic-single
    trigger: "Consent reaches AUTH"
    params: [consentId]
    notes: "Resumes at funds-confirmation, then submit. The form is not re-entered."

  - from: pay-domestic-single
    to: payment-status
    trigger: "Submit returns 201 with a DomesticPaymentId"
    params: [paymentId, paymentFamily]

  - from: pay-domestic-single
    to: payments
    trigger: "Back from the Account step, or Cancel"
    params: []

internal_step_transitions:
  note: >-
    Account -> Payee -> Amount -> Review are STEPS inside one route, not separate routes. Back
    from any step after the first is a step transition, not a nav pop. This is why the feature
    declares one screen rather than four, and why send-money-amount and send-money-confirm are
    not reinstated as siblings.
  steps: [Account, Payee, Amount, Review]

dependencies:
  tier: feature
  features:
    - name: payments
      relation: parent
      params: []
    - name: accounts
      relation: data_source
      params: []
    - name: beneficiaries
      relation: data_source
      params: []
    - name: payment-consent
      relation: child
      params: [consentId, paymentFamily]
    - name: payment-status
      relation: child
      params: [paymentId, paymentFamily]
  libraries:
    - name: ktorfit
      coords: "de.jensklingenberg.ktorfit:ktorfit-lib:2.x"
      purpose: "REST client for the five domestic-payment endpoints"
