sibling: api
schema_version: "4.0"
feature_id: standing-order-detail
notes: >
  Reconciled to shipped source 2026-06-11. OBP has NO standing-order detail/pause/resume/delete
  endpoints at any version (live-verified 404). The original GET detail, POST pause, POST resume
  and DELETE entries were dropped. Detail data is sourced entirely from derived/created order
  state — no network call is unique to this screen.
api: []

derived_reads:
  - id: standing_order_detail_by_series
    source: "StandingOrdersRepository.detail(bankId, accountId, standingOrderId)"
    note: >
      Finds the order by series id within the derived/created set (the same TXN_TYPE=SO
      derivation the list uses), then builds StandingOrderDetail. Unknown id → failure → error state.
    output_dto: StandingOrderDetail
  - id: standing_order_executions
    source: "deriveExecutions(transactions, standingOrderId)"
    filter: "TXN_TYPE=SO transactions of the series, newest first, capped at 5"
    output_dto: "List<StandingOrderExecution>"
    note: "Each StandingOrderExecution carries transactionId for drill-down into transaction-detail."

deferred:
  note: >
    GET /standing-orders/{id}, POST .../pause, POST .../resume and DELETE .../{id} were specified
    in the original design but DO NOT EXIST on OBP. Pause/Resume and Cancel are surfaced as
    "coming soon" snackbars; there is no delete dialog. Re-add only if OBP ships these endpoints.
