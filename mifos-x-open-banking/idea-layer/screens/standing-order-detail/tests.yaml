sibling: tests
schema_version: "4.0"
feature_id: standing-order-detail

screen_id: standing-order-detail

scenarios:
  - id: TC-SOD-001
    description: "Loading state shows the detail skeleton"
    state: loading
    given: "StandingOrdersRepository.detail() is resolving (initial_state loading)"
    when: "Screen mounts"
    then:
      - "sod_loading_skeleton visible with role progressbar and label 'Loading standing order details'"
      - "No cards or action buttons rendered"
      - "Reduced-motion preference substitutes static_placeholder"
    priority: medium

  - id: TC-SOD-002
    description: "Content state renders all four cards plus the action row"
    state: content
    given: "The order resolves from the derived/created set with observed executions"
    when: "Screen renders"
    then:
      - "Top app bar shows 'Standing Order' with an arrow_back icon and NO actions; no bottom nav"
      - "sod_recipient_card, sod_schedule_card, sod_amount_card, sod_history_card, sod_amend_notice and sod_vrp_alternative_link visible"
      - "The body scrolls vertically"
      - "No Edit action is present in the top bar"
    priority: high

  - id: TC-SOD-003
    description: "Recipient name never falls back to the login username"
    state: content
    given: "The order has no counterparty name but does have an order name"
    when: "sod_recipient_name_value renders"
    then:
      - "The fallback order is counterparty name, then order name, then the literal 'Recipient'"
      - "The signed-in user's username is never rendered as the recipient"
    priority: high

  - id: TC-SOD-004
    description: "Recipient account row appears only when a masked account is available"
    state: content
    given: "recipientAccount is blank"
    when: "sod_recipient_card renders"
    then:
      - "sod_recipient_account_row is not rendered"
      - "No empty Account label with a blank value is shown"
      - "When present, the value shows the last four alphanumerics in a monospace face"
    priority: medium

  - id: TC-SOD-005
    description: "IBAN and bank rows are absent because they are not observable"
    state: content
    given: "Content state"
    when: "sod_recipient_card is inspected"
    then:
      - "No IBAN row renders"
      - "No beneficiary bank row renders"
      - "Only name and masked account are shown"
    priority: medium

  - id: TC-SOD-006
    description: "Schedule card renders status, frequency and the date rows"
    state: content
    given: "An active monthly order with observed executions"
    when: "sod_schedule_card renders"
    then:
      - "sod_status_value shows the status label and renders in primary when active"
      - "sod_frequency_value shows a human frequency (Daily / Weekly / Every 2 weeks / Monthly / Yearly)"
      - "sod_next_payment_value renders in primary when active"
      - "Status and next-payment colour come from the declared primary token, not a green hue"
    priority: high

  - id: TC-SOD-007
    description: "Date rows are conditional on observed data"
    state: content
    given: "An order with no observed executions and blank lastPayment and nextPayment"
    when: "sod_schedule_card renders"
    then:
      - "sod_first_payment_row is not rendered (no oldest execution to derive from)"
      - "sod_last_payment_row is not rendered"
      - "sod_next_payment_row is not rendered"
      - "sod_final_date_row still renders"
    priority: medium

  - id: TC-SOD-008
    description: "Final date is always Ongoing"
    state: content
    given: "Any resolved order"
    when: "sod_final_date_value renders"
    then:
      - "The value reads 'Ongoing'"
      - "No end date is derived or invented — OBP data exposes none"
    priority: medium

  - id: TC-SOD-009
    description: "Executions list is capped at five, newest first"
    state: content
    given: "More than five booked TXN_TYPE=SO transactions exist for the order"
    when: "sod_history_list renders"
    then:
      - "At most MAX_EXECUTIONS (5) rows render"
      - "Rows are ordered newest first"
      - "Each row shows a date label, the status 'Completed' and an amount"
    priority: high

  - id: TC-SOD-010
    description: "Every observed execution reads Completed"
    state: content
    given: "Executions derived from booked TXN_TYPE=SO history"
    when: "sod_history_row_status renders"
    then:
      - "Every row reads 'Completed'"
      - "No failed or insufficient-funds status is rendered — those are not observable"
    priority: medium

  - id: TC-SOD-011
    description: "Empty execution copy distinguishes a new order from an unobserved one"
    state: content
    given: "An order with no executions"
    when: "sod_history_list renders its empty copy"
    then:
      - "isCreated true renders \"This order hasn't made a payment yet.\""
      - "isCreated false renders 'No payments observed yet.'"
      - "The two cases are not collapsed into one message"
    priority: high

  - id: TC-SOD-012
    description: "An execution row drills into its underlying transaction"
    state: content
    given: "An execution row with a transactionId"
    when: "User taps sod_history_row"
    then:
      - "App navigates to transaction-detail"
      - "bankId, accountId and the row's transactionId are passed through"
    priority: high

  - id: TC-SOD-013
    description: "No amend or cancel control exists, and the mandatory notice is shown instead"
    state: content
    given: "Content state"
    when: "The screen is inspected for amend, edit, pause, resume, delete or cancel controls"
    then:
      - "None of those controls renders — not enabled, not disabled, not present"
      - "sod_amend_notice is displayed, telling the PSU to use the HSBC app or online banking"
      - "No 'coming soon' string appears anywhere on the screen"
    priority: high
    rationale: >-
      REWRITTEN 2026-08-06. The two prior scenarios asserted that Pause/Resume and Cancel emit
      a "coming soon" snackbar. That assertion locked in a false statement: amendment and
      cancellation are not unbuilt, they are PROHIBITED. OBL's Customer Experience Guidelines
      state a PISP cannot amend or cancel a standing order and impose a MANDATORY obligation to
      redirect the PSU to their bank. There is no DELETE on this family at any OBIE version and
      no ASPSP offers an extension.

      A control promising a deferred capability is worse than no control: a PSU who believes
      they cancelled a standing order and did not has a recurring debit they think is stopped.

  - id: TC-SOD-014
    description: "The VRP alternative is offered"
    state: content
    given: "Content state"
    when: "sod_vrp_alternative_link is tapped"
    then:
      - "The app navigates to pay-vrp-mandate"
    priority: medium
    rationale: >-
      VRP is the one recurring rail the PSU can actually change from this app, and the rail the
      regulator points at for mutable recurring payments. Telling a PSU they cannot manage this
      standing order without saying what they CAN do leaves the disclosure a dead end.

  - id: TC-SOD-016
    description: "Recent executions are never described as authoritative"
    state: content
    given: "the executions list is derived by inference from booked transactions"
    when: "The Recent Executions card renders"
    then:
      - "No claim is made that the list is complete"
      - "A missing execution is not rendered as a failed one"
    priority: medium
    rationale: >-
      Added 2026-08-06. OBIE exposes NO per-execution status — the resource describes the
      mandate's setup, never the Nth payment. Inference from AIS transactions is the only route
      available, and it is lossy: the standing-orders read returns 400 on savings, Global Money
      and the card, so for those accounts even inference is closed.

  - id: TC-SOD-015
    description: "Error, no-network and unauthenticated share one recoverable shell"
    state: error
    given: "ScreenState resolves to Error, NoNetwork or Unauthenticated"
    when: "Screen renders"
    then:
      - "sod_error_state renders with cloud_off, 'Standing Order Not Found' and the connection-or-cancelled message"
      - "sod_retry_button visible"
      - "All three states render the same shell"
    priority: high

  - id: TC-SOD-016
    description: "Retry re-derives the order and its executions"
    state: error
    given: "Error state is displayed"
    when: "User taps sod_retry_button (retry)"
    then:
      - "StandingOrderDetailViewModel.onRetry() runs"
      - "The call reads from standing-orders-list and transactions"
      - "State transitions error -> loading -> content on success"
    priority: high

  - id: TC-SOD-017
    description: "Empty state offers a way back to the list"
    state: empty
    given: "ScreenState.Empty — no detail body"
    when: "Screen renders"
    then:
      - "sod_empty_icon, 'No details are available for this standing order.' and sod_back_to_list_button visible"
      - "Tapping Go Back returns to standing-orders for the same account"
    priority: medium

  - id: TC-SOD-018
    description: "No standing-order detail endpoint is called"
    state: content
    given: "GET detail, POST pause, POST resume and DELETE are all live-verified 404 on OBP and dropped"
    when: "The screen loads and every control is exercised"
    then:
      - "Detail comes from StandingOrdersRepository.detail() over the derived/created set"
      - "Executions come from deriveExecutions over TXN_TYPE=SO history"
      - "StandingOrdersRepository is the only injected dependency"
    priority: high
