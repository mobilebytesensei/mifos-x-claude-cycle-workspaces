sibling: demo-data
schema_version: "2.1.0"
feature_id: standing-order-detail

screen_id: standing-order-detail
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real UK standing-order shapes only."
_migrated_from: "schema 4.0 dto_type/dto_fields + demo_entries shape, 2026-08-02 via /idea-data"

_contradiction_fixed: >-
  SO-2026-0001 carried finalDate 2026-12-31 here while screens/standing-order-edit fixtured the
  SAME order with final_date: null ("Ongoing — no end date"). Two screens in one flow disagreed
  about whether the user's rent standing order ever ends. Resolved to null — open-ended — which
  is what the edit screen's prefill label states in words and what a rent standing order
  realistically is.

_paused_is_unreachable: >-
  so_gym_membership was fixtured PAUSED. RE-GROUNDED 2026-08-07: the reasoning previously rested
  on OBP exposing no pause/resume endpoint at any version (live-verified 2026-06-11), against a
  backend this app no longer talks to. The conclusion is UNCHANGED under OBIE, on two independent
  grounds. First, the OBIE Read/Write standing-order surface is READ-ONLY for a TPP — there is a
  GET (api.yaml#standing-orders-list) and no pause, resume, suspend or reactivate verb anywhere
  in it. Second, even the PISP side cannot reach it: amendment and cancellation of an existing
  payment arrangement are prohibited to TPPs by the OBL Customer Experience Guidelines, so the
  capability is closed by rule as well as by absence of an endpoint. A PAUSED order is therefore
  still a state the app can render but can never produce or exit. Kept as a fixture BECAUSE the
  screen declares the state and a designer needs to see it, but marked unreachable so nobody
  builds a resume button against it. Note the status can still ARRIVE from the ASPSP — a customer
  may pause an order in HSBC's own app — which is exactly why the render path is kept.

_dto_shape:
  name: StandingOrderDetail
  fields:
    - { field: standingOrderId,  type: String }
    - { field: beneficiaryName,  type: String }
    - { field: beneficiaryIban,  type: String }
    - { field: beneficiaryBankName, type: String }
    - { field: amount,           type: BigDecimal }
    - { field: currency,         type: String }
    - { field: frequency,        type: StandingOrderFrequency }
    - { field: startDate,        type: LocalDate }
    - { field: nextPaymentDate,  type: LocalDate }
    - { field: finalDate,        type: "LocalDate?" }
    - { field: status,           type: StandingOrderStatus }
    - { field: executionHistory, type: "List<StandingOrderExecution>" }

