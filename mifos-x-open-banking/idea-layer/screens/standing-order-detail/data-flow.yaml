sibling: data-flow
schema_version: "4.0"
feature_id: standing-order-detail

entries:
  # ── Initial load — fetch full standing order record ──────────────────────────
  - screen_id: standing-order-detail
    trigger: on_mount
    endpoints:
      - get_standing_order
    direction: read
    dtos:
      - name: StandingOrderDetail
        role: response
        api_id: get_standing_order
      - name: StandingOrderExecution
        role: response
        api_id: get_standing_order
    produces_state: content
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 404
        behavior: error_state
    notes: "execution_history is a List<StandingOrderExecution> nested inside StandingOrderDetail response"

  # ── Pause action ─────────────────────────────────────────────────────────────
  - screen_id: standing-order-detail
    trigger: on_interact
    event: PauseClicked
    endpoints:
      - pause_standing_order
    direction: write
    dtos:
      - name: StandingOrderStatusResponse
        role: response
        api_id: pause_standing_order
    produces_state: content
    side_effects:
      - invalidate_cache: standing-orders
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: error_state
      - error_code: 409
        behavior: user_action
        detail: "409 STANDING_ORDER_ALREADY_PAUSED treated as idempotent success — refresh state"

  # ── Resume action ─────────────────────────────────────────────────────────────
  - screen_id: standing-order-detail
    trigger: on_interact
    event: ResumeClicked
    endpoints:
      - resume_standing_order
    direction: write
    dtos:
      - name: StandingOrderStatusResponse
        role: response
        api_id: resume_standing_order
    produces_state: content
    side_effects:
      - invalidate_cache: standing-orders
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 404
        behavior: error_state
      - error_code: 409
        behavior: user_action
        detail: "409 STANDING_ORDER_NOT_PAUSED treated as idempotent success — refresh state"

  # ── Cancel / delete action ────────────────────────────────────────────────────
  - screen_id: standing-order-detail
    trigger: on_interact
    event: CancelClicked
    endpoints:
      - delete_standing_order
    direction: write
    dtos:
      - name: StandingOrderStatusResponse
        role: response
        api_id: delete_standing_order
    produces_state: content
    side_effects:
      - invalidate_cache: standing-orders
    error_paths:
      - error_code: 401
        behavior: navigate_login
      - error_code: 403
        behavior: error_state
      - error_code: 404
        behavior: error_state
      - error_code: 409
        behavior: user_action
        detail: "409 STANDING_ORDER_ALREADY_CANCELLED treated as idempotent — record remains readable"
