    test_context:
      purpose: "Every observed execution is 'Completed' (booked TXN_TYPE=SO). Failed/insufficient-funds statuses are NOT observable and were removed."
      interaction_type: display
      data_driven: false

  - type: text
    id: sod_history_row_amount
    content: "£1,200.00"
    variant: body_medium
    style: { typography: bodyMedium, color: onSurface, font_weight: "600" }
    a11y: { role: text, label: "Amount paid" }
    test_context: { purpose: "Execution amount", interaction_type: display, data_driven: true }

  # ═══════════════════════════════════════════════════════════════════════
  # REWRITTEN 2026-08-06 by /idea-sync — MANDATORY DISCLOSURE, not a placeholder
  #
  # This position previously held two outlined buttons, Pause/Resume and Cancel, both of which
  # emitted a "coming soon" snackbar on tap.
  #
  # "Coming soon" IS FALSE. Amending or cancelling a standing order is not an unbuilt feature
  # waiting on an endpoint — OBL's Customer Experience Guidelines state a PISP cannot do either,
  # and impose a MANDATORY obligation on the PISP to tell the PSU to use the bank's own channel.
  # There is no DELETE and no amend on this family at any OBIE version, and no ASPSP offers a
  # proprietary extension. The regulatory direction is to route mutable recurring payments
  # through VRP instead.
  #
  # So the buttons are replaced by the disclosure the guidelines require. Two live controls that
  # promise an action the app is not permitted to perform are worse than dead clickables — they
  # tell the PSU their standing order is manageable here when it is not, and a PSU who believes
  # they cancelled something they did not has a real financial problem.
  # ═══════════════════════════════════════════════════════════════════════
  - type: banner
    id: sod_amend_notice
    severity: info
    icon: info_outline
    title: "{strings.standing_order.amend_notice_title}"
    content: "{strings.standing_order.amend_notice_body}"
    style:
      padding_horizontal: spacing.lg
      padding_bottom: spacing.md
    a11y:
      role: status
      label: "{strings.standing_order.amend_notice_a11y}"
    test_context:
      tag: sod_amend_notice
      purpose: >-
        The OBL Customer Experience Guidelines disclosure. Mandatory, not advisory — this is the
        obligation that replaces the amend and cancel controls.
      interaction_type: display
      data_driven: false

  - type: link
    id: sod_vrp_alternative_link
    label: "{strings.standing_order.vrp_alternative}"
    variant: inline
    style:
      padding_horizontal: spacing.lg
      padding_bottom: spacing.md
      typography: bodyMedium
    on_click:
      action: navigate
      target: pay-vrp-mandate
      action_contract:
        on_click: OpenVrpMandates
        effect: "navigate to pay-vrp-mandate"
        writes_to: navigation
    a11y:
      role: link
      label: "{strings.standing_order.vrp_alternative_a11y}"
    keyboard: { focusable: true }
    test_context:
      tag: sod_vrp_alternative_link
      purpose: >-
        Offers the one recurring rail the PSU CAN change from this app. VRP is where the
        regulator points for mutable recurring payments, and it is the honest answer to "then
        how do I set up something I can cancel?".
      interaction_type: action
      data_driven: false

removed_controls_2026_08_06:
  - id: sod_pause_resume_button
    reason: "OBIE has no pause/resume for standing orders, and a PISP may not amend one."
  - id: sod_cancel_button
    reason: >-
      OBIE has no DELETE on this family, and OBL CEG prohibits PISP cancellation outright.
      Replaced by the mandatory redirect disclosure.
  - id: sod_action_row
    reason: "Held only the two removed buttons."

  - type: spacer
    id: sod_bottom_spacer
    style: { height: "24dp" }

  # ── Loading / Error / Empty ───────────────────────────────────────────────────
  - type: skeleton
    id: sod_loading_skeleton
    variant: detail
    style: { background: background, padding: spacing.lg }
    a11y: { role: progressbar, label: "Loading standing order details" }
    test_context: { purpose: "Centered progress while detail loads", interaction_type: display, data_driven: false }

  - type: stack
    id: sod_error_state
    variant: vertical
    style: { alignment: center, padding: spacing.xl }
    children: [sod_error_icon, sod_error_title, sod_error_message, sod_retry_button]

  - type: icon
    id: sod_error_icon
    content: "cloud_off"
    style: { color: onSurfaceVariant, size: "48dp", alignment: center }
    a11y: { role: image, label: "Error loading standing order" }
    test_context: { purpose: "Error icon", interaction_type: display, data_driven: false }

  - type: text
    id: sod_error_title
    content: "Standing Order Not Found"
    variant: title_medium
    style: { typography: titleMedium, color: onSurface, alignment: center }
    a11y: { role: text, label: "Standing order not found" }
    test_context: { purpose: "Error/no-network/unauthenticated heading", interaction_type: display, data_driven: false }

  - type: text
    id: sod_error_message
    content: "We could not load this standing order. It may have been cancelled or there may be a connection issue."
    variant: body_medium
    style: { typography: bodyMedium, color: onSurfaceVariant, alignment: center }
    a11y: { role: text, label: "Error message" }
    test_context: { purpose: "Error description", interaction_type: display, data_driven: false }

  - type: button
    id: sod_retry_button
    label: "Retry"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style: { color: primary, typography: labelLarge, alignment: center }
    on_click:
      action: retry
      target: standing-order-detail
      action_contract:
        effect: call_api
        reads_from: [standing-orders-list, transactions]
        external_library_refs: [ktorfit, "hsbc-obie-ais-v4.0:standing-orders"]
        description: >-
          Re-fetches this standing order through ktorfit against hsbc-obie-ais-v4.0:standing-orders
          after a failed load.
    a11y: { role: button, label: "Retry loading standing order" }
    keyboard: { focusable: true }
    test_context: { purpose: "Re-runs StandingOrderDetailViewModel.onRetry()", interaction_type: action, data_driven: false }

  - type: stack
    id: sod_empty_state
    variant: vertical
    style: { alignment: center, padding: spacing.xl }
    children: [sod_empty_icon, sod_empty_message, sod_back_to_list_button]

  - type: icon
    id: sod_empty_icon
    content: "cloud_off"
    style: { color: outlineVariant, size: "48dp", alignment: center }
    a11y: { role: image, label: "No detail available" }
    test_context: { purpose: "Empty-state icon", interaction_type: display, data_driven: false }

  - type: text
    id: sod_empty_message
    content: "No details are available for this standing order."
    variant: body_medium
    style: { typography: bodyMedium, color: onSurfaceVariant, alignment: center }
    a11y: { role: text, label: "No details available" }
    test_context: { purpose: "Empty-state message", interaction_type: display, data_driven: false }

  - type: button
    id: sod_back_to_list_button
    label: "Go Back"
    variant: text
    supported_states: [idle, hover, focus_visible, pressed]
    style: { color: primary, typography: labelLarge, alignment: center }
    on_click:
      action: navigate_back
      target: standing-orders
      intent: target
      action_contract:
        effect: navigate
        description: >-
          Returns to the standing-orders list for the same account.
    a11y: { role: button, label: "Go back to standing orders list" }
    keyboard: { focusable: true }
    test_context: { purpose: "Back navigation on empty state", interaction_type: action, data_driven: false }

responsive:
  mobile_only: true
  baseline_width: 390

states:
  initial_state: loading
  content:
    layout: { type: column, scroll: vertical }
    visible_components:
      - sod_recipient_card
      - sod_schedule_card
      - sod_amount_card
      - sod_history_card
      - sod_amend_notice
      - sod_vrp_alternative_link
      - sod_bottom_spacer
  loading:
    motion:
      shimmer_duration: short4
      reduced_motion_fallback: static_placeholder
    layout: { type: column }
    visible_components: [sod_loading_skeleton]
    note: "Centered CircularProgressIndicator while StandingOrdersRepository.detail() resolves."
  error:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [sod_error_state]
    note: "ScreenState.Error / NoNetwork / Unauthenticated all render this message + Retry."
  no_network:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [sod_error_state]
  unauthenticated:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [sod_error_state]
  empty:
    layout: { type: column, padding: spacing.xl, alignment: center }
    visible_components: [sod_empty_state]
    note: "ScreenState.Empty — no detail body."

state_model:
  view_model: StandingOrderDetailViewModel
  constructor:
    - { name: bankId, type: String }
    - { name: accountId, type: String }
    - { name: standingOrderId, type: String }
  flows:
    - name: uiState
      type: "StateFlow<ScreenState<StandingOrderDetailContent>>"
      default: "ScreenState.Loading"
  content_type:
    name: StandingOrderDetailContent
    note: "Display-ready label strings only — no typed enums, no dialog/action-in-progress flags."
    fields:
      - { name: name, type: String }
      - { name: statusLabel, type: String }
      - { name: isActive, type: Boolean }
      - { name: isCreated, type: Boolean }
      - { name: recipientName, type: String }
      - { name: recipientAccount, type: String, note: "masked; '' when unknown" }
      - { name: amount, type: String }
      - { name: currency, type: String }
      - { name: frequencyLabel, type: String }
      - { name: startedOn, type: String }
      - { name: lastPayment, type: String }
      - { name: nextPayment, type: String }
      - { name: finalDate, type: String, note: "always 'Ongoing'" }
      - { name: executions, type: "List<ExecutionRow>" }
  supporting_types:
    - name: ExecutionRow
      fields:
        - { name: transactionId, type: String }
        - { name: dateLabel, type: String }
        - { name: amountLabel, type: String }
  methods:
    - onRetry
  constants:
    - { name: MAX_EXECUTIONS, value: 5 }
  di:
    - StandingOrdersRepository

api:
  note: >
    NONE of the originally specified standing-order detail endpoints exist on OBP
    (GET detail / POST pause / POST resume / DELETE — all live-verified 404). They are
    dropped. Detail is sourced via StandingOrdersRepository.detail() (find order by series
    id in the derived/created set) and executions via deriveExecutions over TXN_TYPE=SO history.
    See api.yaml.

navigation:
  - id: nav_back
    target: standing-orders
    on_click: { action: navigate_back }
  - id: nav_execution
    target: transaction-detail
    on_click:
      action: navigate
      note: "Each Recent Executions row drills into transaction-detail via the underlying transactionId."

dependencies:
  tier: feature
  features: [standing-orders, accounts, transactions]
