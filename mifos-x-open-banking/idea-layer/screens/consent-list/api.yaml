sibling: api
schema_version: "4.0"
feature_id: consent-list

screen_id: consent-list

endpoints:
  - id: consent-status
    method: GET
    path: "/account-access-consents/{ConsentId}"
    response_dto: ConsentSummary
    permission: null
    requires_auth: true
    path_params:
      ConsentId: string
    notes: "Called for each locally-stored ConsentId to refresh status. In the HSBC sandbox a PSU can only have one active consent at a time; the list shows all locally-known ConsentIds including expired/revoked ones fetched for history."
