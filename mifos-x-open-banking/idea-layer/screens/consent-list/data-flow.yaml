sibling: data-flow
schema_version: "2.1.0"
feature_id: consent-list

screen_id: consent-list

on_mount:
  - trigger: load_consents
    description: "Load locally stored ConsentIds then call consent-status for each to refresh current HSBC status. Partition results into active/history lists and compute expiry metadata."
    steps:
      - action: read_local_consent_ids
        store_as: local_consent_ids
      - call: consent-status
        for_each: "{local_consent_ids}"
        path_params:
          ConsentId: "{item}"
        merge_into: "consents[i]"
      - compute: partition_consents
        description: "Split consents[] into active_consents (Status==Authorised) and history_consents (Status in Expired|Revoked). Compute days_until_expiry, expiry_color, formatted_creation_date, formatted_expiry_date, and has_near_expiry_consents per item."
    on_loading: loading
    on_success: content
    on_empty: empty
    on_error:
      default: error
      http_401: error_auth

on_user_action:
  - trigger: retry_load
    re_runs: [load_consents]
    note: "Only wired to 'error' state retry button; not exposed in error_auth state."

  - trigger: navigate_consent_detail
    navigate_to: consent-detail
    params:
      consentId: "{params.consentId}"

  # Retargeted 2026-08-02 with ui.yaml#connect_button and flow.yaml (/design-validate F-007).
  # Both navigate_connect and navigate_reauth resolve to the same source route, LoginRenewRoute.
  - trigger: navigate_connect
    navigate_to: login

  - trigger: navigate_reauth
    navigate_to: login
    description: "Triggered from 'Sign in again' button in error_auth state — navigates PSU to login to renew their OAuth session after a 401."
