known_gaps:
  - id: single-consent-only
    severity: info
    description: "Consent history was removed (TestTags 'uitest-tag-retire'); Content.active always holds exactly the current consent and expiredOnDate is always null. The 'History' string and isHistory card styling are dead code."
  - id: list-reachable-only-from-settings
    severity: warn
    description: "Only Settings navigates here. 'View consents' in send-money, payments-schedule-payment and payments-standing-order is wired onNavigateToConsents = {} (no-op) instead of ConsentListRoute (FR-047)."
  - id: unused-a11y-strings
    severity: info
    description: "feature_consent_list_back_a11y / connect_a11y / retry_a11y / reauth_a11y are declared but never referenced; buttons rely on label text only."
