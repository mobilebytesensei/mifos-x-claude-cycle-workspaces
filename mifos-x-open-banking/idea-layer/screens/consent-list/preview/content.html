<!doctype html>
<!-- render-hash: e21c7b4d3f9a0658 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connected Banks — content</title>
<style>
  :root {
    --primary: #266489;
    --on-primary: #FFFFFF;
    --primary-container: #C9E6FF;
    --on-primary-container: #004B6F;
    --secondary: #50606E;
    --secondary-container: #D3E5F5;
    --tertiary: #64597B;
    --tertiary-container: #EADDFF;
    --on-tertiary-container: #4C4162;
    --background: #F7F9FF;
    --surface: #F7F9FF;
    --surface-container-low: #F1F4F9;
    --surface-container: #EBEEF3;
    --surface-container-high: #E5E8ED;
    --on-surface: #181C20;
    --on-surface-variant: #41474D;
    --outline: #72787E;
    --outline-variant: #C1C7CE;
    --error: #BA1A1A;

    --font-brand: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --fs-title-large: 1.375rem;
    --fs-title-medium: 1rem;
    --fs-title-small: 0.875rem;
    --fs-body-medium: 0.875rem;
    --fs-label-medium: 0.75rem;
    --fs-label-small: 0.6875rem;

    --sp-xs: 4px;
    --sp-sm: 8px;
    --sp-md: 12px;
    --sp-lg: 16px;
    --sp-xl: 24px;
    --sp-2xl: 32px;

    --r-small: 8px;
    --r-medium: 12px;
    --r-large: 16px;
    --r-full: 9999px;

    --el-0: none;
    --el-1: 0 1px 2px rgba(24, 28, 32, .08), 0 1px 3px rgba(24, 28, 32, .06);
    --el-2: 0 1px 2px rgba(24, 28, 32, .10), 0 2px 6px rgba(24, 28, 32, .08);

    --appbar-h: 64px;
    --navbar-h: 80px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #95CDF7;
      --on-primary: #00344E;
      --primary-container: #004B6F;
      --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9;
      --secondary-container: #384956;
      --tertiary: #CFC0E8;
      --tertiary-container: #4C4162;
      --on-tertiary-container: #EADDFF;
      --background: #101417;
      --surface: #101417;
      --surface-container-low: #181C20;
      --surface-container: #1C2024;
      --surface-container-high: #262A2E;
      --on-surface: #E0E3E8;
      --on-surface-variant: #C1C7CE;
      --outline: #8B9198;
      --outline-variant: #41474D;
      --error: #FFB4AB;

      --el-1: 0 1px 2px rgba(0, 0, 0, .40), 0 1px 3px rgba(0, 0, 0, .30);
      --el-2: 0 1px 2px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--background); color: var(--on-surface);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }

  .screen { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  .top-app-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center;
    height: var(--appbar-h); padding: 0 var(--sp-lg);
    background: var(--surface); color: var(--on-surface);
  }
  .top-app-bar__title {
    font-family: var(--font-brand); font-size: var(--fs-title-large);
    font-weight: 500; line-height: 1.3; margin: 0;
  }

  .content {
    flex: 1 1 auto;
    display: flex; flex-direction: column; gap: var(--sp-md);
    padding: var(--sp-lg);
    padding-bottom: calc(var(--navbar-h) + var(--sp-xl));
    max-width: 720px; width: 100%; margin: 0 auto;
  }

  .banner {
    display: flex; align-items: flex-start; gap: var(--sp-md);
    padding: var(--sp-lg);
    background: var(--tertiary-container);
    color: var(--on-tertiary-container);
    border-radius: var(--r-medium);
    box-shadow: var(--el-1);
  }
  .banner svg { width: 22px; height: 22px; flex: 0 0 auto; display: block; margin-top: 1px; }
  .banner__text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .banner__title { font-size: var(--fs-title-small); font-weight: 500; margin: 0; }
  .banner__body { font-size: var(--fs-body-medium); line-height: 1.45; margin: 0; opacity: .92; }

  .section-header {
    font-size: var(--fs-title-small); font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--on-surface-variant);
    margin: var(--sp-md) 0 0 var(--sp-xs);
  }

  .consent-card {
    display: flex; flex-direction: column; gap: var(--sp-md);
    width: 100%; text-align: left;
    padding: var(--sp-lg);
    border: 0;
    background: var(--surface-container-low);
    color: var(--on-surface);
    border-radius: var(--r-large);
    box-shadow: var(--el-1);
    cursor: pointer; font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow .15s ease;
  }
  .consent-card:hover { box-shadow: var(--el-2); }
  .consent-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .consent-card--history {
    background: var(--surface-container);
    box-shadow: var(--el-0);
    border: 1px solid var(--outline-variant);
  }

  .consent-card__head { display: flex; align-items: center; gap: var(--sp-md); }

  .bank-logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; min-width: 44px; aspect-ratio: 1 / 1;
    border-radius: var(--r-small);
    background: var(--primary-container); color: var(--on-primary-container);
    font-family: var(--font-brand); font-size: var(--fs-label-medium);
    font-weight: 700; letter-spacing: .04em;
  }

  .status-chip {
    display: inline-flex; align-items: center; gap: var(--sp-xs);
    height: 28px; padding: 0 var(--sp-md);
    border-radius: var(--r-full);
    font-size: var(--fs-label-small); font-weight: 500; letter-spacing: .02em;
    white-space: nowrap; margin-left: auto;
  }
  .status-chip svg { width: 16px; height: 16px; display: block; }
  .status-chip--primary { background: var(--primary-container); color: var(--on-primary-container); }
  .status-chip--muted   { background: var(--surface-container-high); color: var(--on-surface-variant); }

  .urgency-chip {
    display: inline-flex; align-items: center; gap: var(--sp-xs);
    height: 26px; padding: 0 var(--sp-sm);
    border-radius: var(--r-full);
    background: transparent;
    border: 1px solid var(--tertiary);
    color: var(--tertiary);
    font-size: var(--fs-label-small); font-weight: 500; white-space: nowrap;
  }
  .urgency-chip svg { width: 15px; height: 15px; display: block; }

  .consent-card__meta { display: flex; flex-direction: column; gap: var(--sp-xs); }

  .meta-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: var(--sp-md);
    font-size: var(--fs-body-medium); line-height: 1.4;
    color: var(--on-surface-variant); margin: 0;
  }
  .meta-row__value { font-variant-numeric: tabular-nums; }
  .meta-row__value--tertiary { color: var(--tertiary); font-weight: 500; }

  .divider { height: 1px; background: var(--outline-variant); margin: var(--sp-lg) 0 var(--sp-xs); border: 0; }

  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; align-items: flex-start; justify-content: space-around;
    height: calc(var(--navbar-h) + env(safe-area-inset-bottom, 0px));
    padding: var(--sp-md) var(--sp-sm) calc(var(--sp-md) + env(safe-area-inset-bottom, 0px));
    background: var(--surface-container); box-shadow: var(--el-2);
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-xs);
    flex: 1 1 0; min-width: 0; min-height: 48px;
    border: 0; padding: 0; background: transparent;
    color: var(--on-surface-variant); cursor: pointer;
    font-family: var(--font-body); font-size: var(--fs-label-medium); font-weight: 500;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-small); }
  .nav-item__indicator { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 32px; border-radius: var(--r-full); }
  .nav-item svg { width: 24px; height: 24px; display: block; }
  .nav-item[aria-current="page"] { color: var(--primary); }
  .nav-item[aria-current="page"] .nav-item__indicator { background: var(--secondary-container); }

  @media (prefers-reduced-motion: reduce) { .consent-card { transition: none; } }
  @media (min-width: 600px) { .content { padding: var(--sp-xl); } }
</style>
</head>
