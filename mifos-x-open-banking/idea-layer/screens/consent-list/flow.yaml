sibling: flow
schema_version: "4.0"
feature_id: consent-list

feature: consent-dashboard
flow_ref: consumer-banking

entry_points:
  - source: app_shell_more_menu
    label: "More / Settings → Consents"

transitions:
  - from: consent-list
    to: consent-detail
    trigger: "Tap a consent card (active or history)"
    params: [consentId]
  # Retargeted 2026-08-02 alongside ui.yaml#connect_button (/design-validate F-007). Was
  # `to: user-onboarding`, which contradicted consent-list/ui.yaml#state_model.nav_callbacks
  # ("onConnectBank -> navigate(LoginRenewRoute)") and its own implementation.corrected_in_sync
  # note. Both affordances resolve to the SAME source route, LoginRenewRoute — that is why the
  # two edges below now share a destination rather than one being a duplicate of the other.
  - from: consent-list
    to: login
    trigger: "Tap 'Connect HSBC' on empty state"
  - from: consent-list
    to: login
    trigger: "Tap 'Sign in again' on auth error state (401 PSU session expired)"
