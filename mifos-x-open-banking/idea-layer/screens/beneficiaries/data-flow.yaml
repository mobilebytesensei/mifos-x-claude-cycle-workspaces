sibling: data-flow
schema_version: "2.1.0"
feature_id: beneficiaries

screen_id: beneficiaries

on_mount:
  - trigger: beneficiaries_load
    description: "Load beneficiary list for the given AccountId from HSBC AIS."
    steps:
      - call: beneficiaries-list
        path_params:
          AccountId: "{params.accountId}"
        store_as: beneficiaries
        store_also:
          beneficiaries_filtered: "{beneficiaries}"   # initially unfiltered
    on_loading: loading
    on_success: content
    on_empty: empty
    on_error: error
    error_type_mapping:
      - http_status: 401
        error_type: TokenExpired
        message_key: "error.beneficiaries.token_expired"
      - http_status: 403
        error_type: ConsentRevoked
        message_key: "error.beneficiaries.consent_revoked"
      - http_status: 429
        error_type: RateLimited
        message_key: "error.beneficiaries.rate_limited"
      - http_status: 500
        error_type: ServerError
        message_key: "error.beneficiaries.server_error"
      - default: NetworkError
        message_key: "error.beneficiaries.network_error"

on_user_action:
  - trigger: retry_load
    description: "Re-fetch beneficiaries after transient error (401 TokenExpired, 429 RateLimited, NetworkError)."
    re_runs: [beneficiaries_load]

  - trigger: filter_beneficiaries
    description: "Client-side filter of beneficiaries by CreditorAccount.Name or Reference. No API call."
    param: query
    steps:
      - compute:
          beneficiaries_filtered: >
            beneficiaries.filter(b =>
              b.CreditorAccount.Name.contains(query, ignoreCase=true) ||
              b.Reference.contains(query, ignoreCase=true)
            )
    state_stays: content

  - trigger: navigate_to_consents
    description: "Navigate to consent-list screen when user taps View Consents after 403 ConsentRevoked."
    navigates_to: consent-list

  - trigger: navigate_back
    description: "Navigate back to account-detail screen, passing accountId to restore context."
    navigates_to: account-detail
    params:
      accountId: "{params.accountId}"
