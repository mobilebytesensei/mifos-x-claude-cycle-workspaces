sibling: tests
schema_version: "4.0"
feature_id: beneficiaries

screen_id: beneficiaries

scenarios:
  - id: TC-BEN-001
    description: "Beneficiaries list loads and renders all five saved payees"
    state: content
    priority: p0
    given: "Valid PSU access token; HSBC sandbox returns 5 beneficiaries for account 40051512345678 across SortCodeAccountNumber and IBAN schemes"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Five beneficiary rows render (Jameson Lettings, John Sharma, EDF Energy, Hargreaves Lansdown, Priya Rajan — N26 GmbH)"
      - "Each row shows: avatar initials, creditor name as headline, scheme label + identifier as supporting text, reference as trailing label"
      - "BEN-005 row shows scheme label 'IBAN' and identification 'DE89370400440532013000'"
      - "Data matches demo-data values"

  - id: TC-BEN-002
    description: "Loading state shown during beneficiaries fetch"
    state: loading
    priority: p0
    given: "Slow network; API call in flight"
    when: "Screen mounts"
    then:
      - "Circular progress indicator visible and labelled 'Loading beneficiaries'"
      - "Beneficiary list and search bar not rendered"

  - id: TC-BEN-003
    description: "Empty state when no beneficiaries registered for the account"
    state: empty
    priority: p1
    given: "HSBC sandbox returns empty Data.Beneficiary[] for the account"
    when: "Screen mounts"
    then:
      - "Empty state renders with people_outline icon"
      - "Title shows 'No beneficiaries' and body shows 'No saved payees are registered for this account.'"
      - "Search bar is not visible"

  - id: TC-BEN-004
    description: "Error state with Retry button on 401 token expired"
    state: error
    priority: p0
    given: "Access token is expired; HSBC AIS returns 401 UK.OBIE.Header.Invalid"
    when: "Screen mounts"
    then:
      - "Error state renders with error_outline icon and typed error message"
      - "Retry button is visible; View Consents button is NOT visible"
      - "Tapping Retry re-triggers beneficiaries_load"

  - id: TC-BEN-005
    description: "Back button navigates to account-detail"
    state: content
    priority: p1
    given: "Beneficiaries list rendered for account 40051512345678"
    when: "User taps back button"
    then:
      - "Navigates to account-detail screen with accountId=40051512345678"

  - id: TC-BEN-006
    description: "Search bar filters beneficiaries by creditor name"
    state: content
    priority: p1
    given: "Five beneficiaries loaded; user types 'ener' into search bar"
    when: "on_change fires with query='ener'"
    then:
      - "Only EDF Energy row is visible (BEN-003)"
      - "Remaining four rows are hidden"
      - "No API call is made (client-side filter)"
      - "Clearing the search bar restores all five rows"

  - id: TC-BEN-007
    description: "Search bar yields no-results empty state within content state"
    state: content
    priority: p2
    given: "Five beneficiaries loaded; user types 'zzzmatch' into search bar"
    when: "on_change fires with query='zzzmatch'"
    then:
      - "search_no_results empty state renders with search_off icon"
      - "Beneficiary list is hidden"
      - "Title shows 'No results' and body shows 'No payees match your search.'"

  - id: TC-BEN-008
    description: "Error state with View Consents button on 403 consent revoked"
    state: error
    priority: p1
    given: "Consent has been revoked; HSBC AIS returns 403 UK.OBIE.Resource.ConsentMismatch"
    when: "Screen mounts"
    then:
      - "Error state renders with error_outline icon and typed error message"
      - "View Consents button is visible; Retry button is NOT visible"
      - "Tapping View Consents navigates to consent-list screen"

  - id: TC-BEN-009
    description: "Avatar initials derived from creditor name for visual identity"
    state: content
    priority: p2
    given: "Beneficiaries list loaded"
    when: "User views the list"
    then:
      - "Jameson Lettings row has avatar showing 'JL'"
      - "EDF Energy row has avatar showing 'EE'"
      - "N26 GmbH row has avatar showing 'PR' (from 'Priya Rajan')"
      - "Avatars are marked aria-hidden and do not appear in screen-reader tree"

  - id: TC-BEN-010
    description: "Search bar filters beneficiaries by payment reference"
    state: content
    priority: p1
    given: "Five beneficiaries loaded; user types 'ISA' into the search bar"
    when: "on_change fires with query='ISA'"
    then:
      - "Only Hargreaves Lansdown row is visible (BEN-004, Reference='ISA-TOPUP')"
      - "Remaining four rows are hidden"
      - "No API call is made (client-side filter applies to Reference field)"
      - "Clearing the search bar restores all five rows"
