sibling: api
schema_version: "4.0"
feature_id: beneficiaries

screen_id: beneficiaries

endpoints:
  - id: beneficiaries-list
    method: GET
    path: "/accounts/{AccountId}/beneficiaries"
    response_dto: BeneficiaryItem
    permission: ReadBeneficiariesDetail
    requires_auth: true
    auth_scheme: bearer_access_token
    path_params:
      AccountId: string
    query_params: {}
    request_headers:
      x-fapi-interaction-id: string   # optional; HSBC echoes it back for tracing
    notes: "Returns saved payees authorised under the PSU consent for the given AccountId. Requires ReadBeneficiariesDetail permission in the active account-access-consent."
    error_responses:
      - status_code: 401
        error_code: "UK.OBIE.Header.Invalid"
        description: "Access token expired or invalid. Route to login to re-run the FAPI consent journey."
        ui_action: "Show error state with Retry CTA; ViewModel clears stale token."
      - status_code: 403
        error_code: "UK.OBIE.Resource.ConsentMismatch"
        description: "ReadBeneficiariesDetail permission absent from active consent, or consent has been revoked/expired."
        ui_action: "Show error state with View Consents CTA; navigate to consent-list."
      - status_code: 429
        error_code: "UK.OBIE.Rules.TooManyRequests"
        description: "Rate-limited by HSBC. Retry after the Retry-After header interval."
        ui_action: "Show error state with Retry CTA; ViewModel applies exponential back-off."
      - status_code: 500
        error_code: "UK.OBIE.Unexpected.ServerError"
        description: "Unexpected HSBC server error."
        ui_action: "Show error state with Retry CTA."

response_shape:
  OBReadBeneficiary5:
    Data:
      Beneficiary:
        - AccountId: string           # Echoes request AccountId
          BeneficiaryId: string       # Unique identifier for this payee record
          Reference: string           # Payment reference the PSU assigned (e.g. "RENT-FLAT12")
          CreditorAccount:
            SchemeName: string        # UK.OBIE.SortCodeAccountNumber | UK.OBIE.IBAN | UK.OBIE.Paym | UK.OBIE.PAN
            Identification: string    # Account number in the scheme format (e.g. "40-12-09 65872310")
            Name: string              # Account holder name as registered
    Meta:
      TotalPages: integer
