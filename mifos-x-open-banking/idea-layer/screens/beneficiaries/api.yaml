sibling: api
schema_version: "4.0"
feature_id: beneficiaries
_source: source_analysis

api:
  - id: get_beneficiaries
    function: "Aisp.getBeneficiaries(accountId)"
    method: GET
    path: "/v4.0/aisp/accounts/{AccountId}/beneficiaries"
    description: "OBIE v4.0 read beneficiaries (OBReadBeneficiary5) — saved payees for one account, returned unpaginated; search is client-side."
    auth: "PSU bearer token (Ktor Auth plugin) + mTLS transport cert"
    params:
      AccountId: { type: String, required: true, source: nav_params.accountId }
    response:
      dto: BeneficiariesResponse
      items: "Data.Beneficiary[]"
      nested_dtos: [CreditorAccount, CreditorAgent, PostalAddress, Links]
      domain_mapper: "BeneficiaryMapper.toBeneficiaryItems(accountId) → List<BeneficiaryItem>"
    pagination:
      type: none
    cache:
      strategy: memory-only
      ttl: null
      offline: none
      note: "Store5 memory store, no Room SourceOfTruth — consent can be withdrawn at any moment"
    errors:
      401: "Unauthorized → TokenExpired (retry)"
      403: "Forbidden → ConsentRevoked (no retry)"
      429: "RateLimited (retry)"
      5xx: "ServerError (retry)"
      network: "NetworkError (retry)"
