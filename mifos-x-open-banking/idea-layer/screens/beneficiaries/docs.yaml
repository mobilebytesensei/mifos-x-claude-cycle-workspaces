description: >-
  Read-only list of saved payees for an account, sourced from OBReadBeneficiary5 via GET
  /accounts/{AccountId}/beneficiaries. Reached from account-detail Beneficiaries chip. Displays avatar initials,
  creditor name, scheme-type label (Sort Code / IBAN / Paym), account identifier, and payment reference. Supports
  client-side search filtering by name or reference. Differentiates error recovery: Retry for transient failures, View
  Consents for 403 ConsentRevoked.
has_ui: true
has_server: false
# has_search: dedicated search_bar component over the payee list.
