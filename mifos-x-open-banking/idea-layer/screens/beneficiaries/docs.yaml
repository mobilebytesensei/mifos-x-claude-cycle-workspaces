    - HTTP 500 ServerError coverage added to error_cases, LoadBeneficiaries.error_handling, data-flow error_type_mapping, and strings
    - Fixed misleading beneficiary_row accessibility_label (removed "tap to view payment details" — row has no on_click); now runtime template giving CreditorAccount.Name + scheme + Identification to screen readers
    - Distinct search_bar accessibility_label key (search_a11y) separate from placeholder text
    - Added navigate_back trigger to data-flow.yaml on_user_action for completeness
    - Added capability_tags (rest-client, list-display, search-filter, error-recovery) for library awareness
    - TC-BEN-010: reference-based search test (filter by payment reference, not just creditor name)
contracts: []
libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets:
      - android
      - ios
      - desktop
      - web
# vm_actions RELOCATED 2026-08-01 (/idea-sync): loadBeneficiaries -> initial_load;
# navigateToConsents + navigateBack -> nav_callbacks. Nothing deleted — each moved to the block
# that states how it actually works. ui.yaml#state_model declares members [RetryLoad, Search].
# FilterBeneficiaries is retained: it is the same behaviour ui.yaml names `Search`.
initial_load:
  mechanism: init-stream-collection
  what: "GET /accounts/{accountId}/beneficiaries via Ktorfit AisApiService"
  states: "Loading -> Content(beneficiaries, beneficiariesFiltered) | Empty when the list is empty"
  error_handling:
    on_401: uiState = Error(type=TokenExpired, message=strings.error.beneficiaries.token_expired)
    on_403: uiState = Error(type=ConsentRevoked, message=strings.error.beneficiaries.consent_revoked)
    on_429: uiState = Error(type=RateLimited, message=strings.error.beneficiaries.rate_limited)
    on_500: uiState = Error(type=ServerError, message=strings.error.beneficiaries.server_error)
    on_network: uiState = Error(type=NetworkError, message=strings.error.beneficiaries.network_error)
  note: >-
    NOT a dispatched action. ui.yaml#implementation.removed_in_sync: "loadBeneficiaries action —
    the initial load is stream collection in init{}".

nav_callbacks:
  # ui.yaml#implementation.removed_in_sync: "navigateToConsents / navigateBack actions — both are
  # nav-host callbacks, not action members".
  - signature: "onNavigateToConsents -> navigate(ConsentListRoute)"
    shown_when: "error.type == ConsentRevoked"
  - signature: "onBack -> popBackStack()"

vm_actions:
  - name: FilterBeneficiaries
    signature: 'fun filterBeneficiaries(query: String)'
    state_mutations:
      - >-
        uiState = uiState.copy(beneficiariesFiltered = beneficiaries.filter { it.CreditorAccount.Name.contains(query,
        ignoreCase=true) || it.Reference.contains(query, ignoreCase=true) })
    side_effects: []
    error_handling: {}
    notes: Pure in-memory filter; does not re-invoke the AIS endpoint.
  - name: RetryLoad
    signature: fun retryLoad()
    state_mutations:
      - re-invokes LoadBeneficiaries with same accountId
    side_effects: []
    error_handling: {}
    visibility_condition: error.type in {TokenExpired, RateLimited, NetworkError}
scheme_label_mapping:
  description: 'ViewModel-layer helper: maps OBIE SchemeName to human-readable display label.'
  entries:
    - scheme: UK.OBIE.SortCodeAccountNumber
      label: Sort Code
    - scheme: UK.OBIE.IBAN
      label: IBAN
    - scheme: UK.OBIE.Paym
      label: Paym
    - scheme: UK.OBIE.PAN
      label: Card
    - default: null
      label: Account
error_cases:
  - id: TokenExpired
    trigger: HTTP 401 from HSBC AIS
    user_message: '{strings.error.beneficiaries.token_expired}'
    recovery: Retry CTA re-triggers LoadBeneficiaries; ViewModel clears stale token first
  - id: ConsentRevoked
    trigger: HTTP 403 from HSBC AIS
    user_message: '{strings.error.beneficiaries.consent_revoked}'
    recovery: View Consents CTA navigates to consent-list
  - id: RateLimited
    trigger: HTTP 429 from HSBC AIS
    user_message: '{strings.error.beneficiaries.rate_limited}'
    recovery: Retry CTA with exponential back-off
  - id: NetworkError
    trigger: IOException / timeout
    user_message: '{strings.error.beneficiaries.network_error}'
    recovery: Retry CTA re-triggers LoadBeneficiaries
  - id: ServerError
    trigger: HTTP 500 from HSBC AIS
    user_message: '{strings.error.beneficiaries.server_error}'
    recovery: Retry CTA re-triggers LoadBeneficiaries
  - id: EmptyResult
    trigger: Data.Beneficiary[] is empty in OBIE response
    user_message: '{strings.beneficiaries.empty_body}'
    recovery: Empty state; no action needed
