sibling: flow
schema_version: "4.0"
feature_id: beneficiaries

feature: beneficiaries
flow_ref: consumer-banking

entry_points:
  - source: account-detail
    label: "Tap Beneficiaries chip"
    params: [accountId]

transitions:
  - from: beneficiaries
    to: account-detail
    trigger: "Back button (top-app-bar leading)"
    params: [accountId]

  - from: beneficiaries
    to: consent-list
    trigger: "View Consents button (shown on 403 ConsentRevoked error state)"
    params: []
    condition: "error.type == ConsentRevoked"

# Moved verbatim from ui.yaml 2026-07-31 (CROSS_LEAK repair — sibling-layout.json
# assigns `dependencies` to the flow sibling).
dependencies:
  tier: feature
  features:
    - name: account-detail
      relation: parent
      params: [accountId]
    - name: consent-list
      relation: error-recovery
      condition: "error.type == ConsentRevoked"
  libraries:
    - name: ktorfit
      coords: "de.jensklingenberg.ktorfit:ktorfit-lib:2.x"
      purpose: "REST client for HSBC AIS GET /accounts/{AccountId}/beneficiaries"
