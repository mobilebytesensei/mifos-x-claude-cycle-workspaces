sibling: demo-data
schema_version: "2.1.0"
feature_id: beneficiaries

screen_id: beneficiaries
models: wire
maps_to_dto: [BeneficiaryItem]
_models_note: "Fixtures are the OBIE wire envelope, not the domain projection. api.yaml#response_dto names the domain DTO the repository yields; the mapper sits between. RULE-DEMO-DATA-001 DD5 compares against the wire contract for this file."
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC-sandbox-style OBIE data only."

# Five beneficiaries across three OBIE scheme types (SortCodeAccountNumber, IBAN, Paym).
# BEN-001..003: typical UK Sort Code / Account Number payees (domestic).
# BEN-004: ISA provider — realistic PFM-adjacent payee.
# BEN-005: International IBAN payee — demonstrates OBReadBeneficiary5 multi-scheme support.

beneficiaries:
  - AccountId: "40051512345678"
    BeneficiaryId: "BEN-001"
    Reference: "RENT-FLAT12"
    CreditorAccount:
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "40-12-09 65872310"
      Name: "Jameson Lettings"

  - AccountId: "40051512345678"
    BeneficiaryId: "BEN-002"
    Reference: "FAMILY"
    CreditorAccount:
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "23-05-80 11223344"
      Name: "John Sharma"

  - AccountId: "40051512345678"
    BeneficiaryId: "BEN-003"
    Reference: "ELEC-8841"
    CreditorAccount:
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "60-00-01 99887766"
      Name: "EDF Energy"

  - AccountId: "40051512345678"
    BeneficiaryId: "BEN-004"
    Reference: "ISA-TOPUP"
    CreditorAccount:
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "11-22-33 44556677"
      Name: "Hargreaves Lansdown"

  - AccountId: "40051512345678"
    BeneficiaryId: "BEN-005"
    Reference: "TRAVEL-EUR"
    CreditorAccount:
      SchemeName: "UK.OBIE.IBAN"
      Identification: "DE89370400440532013000"
      Name: "Priya Rajan — N26 GmbH"

# Search-filter fixture: query "ener" should match BEN-003 (EDF Energy).
# Scheme filter fixture: SchemeName=UK.OBIE.IBAN should return only BEN-005.
# Empty fixture: AccountId with no beneficiaries should yield empty state.
_test_fixtures:
  search_query_match:
    input_query: "ener"
    expected_ids: ["BEN-003"]
  search_query_no_match:
    input_query: "zzzmatch"
    expected_ids: []
  scheme_iban_only:
    input_filter: "UK.OBIE.IBAN"
    expected_ids: ["BEN-005"]
  empty_account:
    AccountId: "40051500000000"
    expected_count: 0

# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, empty, error]. `empty` was covered indirectly by
# _test_fixtures.empty_account, but `error` had nothing at all.
states:
  - scope: content
    beneficiaries: all

  - scope: loading
    beneficiaries: all

  - scope: empty
    beneficiaries: []
    account_id: "40051500000000"
    message: "No saved payees."
    detail: "Payees you save when sending money will appear here."
    _cross_ref: "Mirrors _test_fixtures.empty_account, which asserts expected_count: 0 for this AccountId."

  - scope: error
    error_type: BeneficiariesLoadFailed
    message: "Could not load your payees"
    recovery: "Check your connection and try again."
    recoverable: true
    _scope_note: >-
      Beneficiaries are read per ACCOUNT, not per user (see screens/send-money-amount
      /data-flow.yaml, which reloads them on every account switch). So this error is scoped to
      the selected account — switching account is a legitimate second recovery path alongside
      retry.
