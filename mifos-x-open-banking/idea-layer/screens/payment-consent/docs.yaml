description: >-
  Return leg of the PISP app-to-app authorisation, shared by ALL SEVEN payment families. The
  direct analogue of the shipped consent-callback feature, but on scope=payments against a
  payment consent rather than an account-access-consent.

  The originating type screen owns the outbound launch; this feature owns everything after HSBC
  redirects back — validating state and nonce against the pending authorisation, exchanging the
  authorisation code for a PSU access token, polling the ORIGINATING FAMILY's consent-status GET
  until it reaches AUTH, and handing control back to that screen. Headless: it renders progress
  and terminal error only, never a form.

