# ── VRP DIFFERS IN LIFETIME, NOT IN SHAPE ────────────────────────────────
# This screen runs ONCE per VRP mandate, not once per payment. Every subsequent payment under
# that mandate rides the existing authorisation with no re-authentication — the defining VRP
# property. The token it obtains is correspondingly longer-lived (OBIE: "unlike AIS consents,
# VRP access tokens should not be set to expire at 90 days"), but it is STILL never written
# into ConsentSession.
vrp_note:
  invocations_per_mandate: 1
  invocations_per_payment: 0
  token_lifetime: "as long as the consent"
  consent_session_write: never
has_ui: true
has_server: false
