# ─────────────────────────────────────────────────────────────────────────
# WHY THIS IS A SEPARATE FEATURE FROM consent-callback
# ─────────────────────────────────────────────────────────────────────────
# The shipped consent-callback handles the AIS account-access-consent on scope=accounts and,
# on success, persists PSU tokens which flips ConsentSession.isActive() and re-routes the
# whole app to Home. A payment authorisation must NOT do that: it authorises one payment,
# not a data-sharing session, and the app is already signed in when it happens.
#
# Concretely divergent:
#   - scope is `payments`, not `openid accounts`
#   - the consent resource is /pisp/domestic-payment-consents/{id}, not /aisp/account-access-consents/{id}
#   - the resulting PSU token is single-payment scoped and MUST NOT overwrite the AIS session token
#   - success returns to the ORIGINATING TYPE SCREEN to submit, it does not re-route to Home
#     (was "send-money" until 2026-08-07; that screen was deleted by the seven-type rewrite)
#   - the consent-status poll is load-bearing here (submit fails U009 unless Authorised),
#     whereas in consent-callback the poll is best-effort and only supplies the expiry
separation_rationale:
  reuses_from_consent_callback:
    - "PendingAuthStore state/nonce validation contract (single-use consume)"
    - "The ConsentRedirectBus publish/collect wiring already built per platform"
    - "The OAuth token-exchange call shape"
  must_not_reuse:
    - "ConsentSession token persistence — a payment token must not replace the AIS session token"
    - "The post-success route to Home"

# ═════════════════════════════════════════════════════════════════════════
# CAPTURE-CORPUS ENRICHMENT — 2026-08-07 (/idea-sync)
# Folded in from the by-type capture corpus. Error contract lives in
# dtos/ObPaymentError.yaml; status ladders and both traps in dtos/ObPaymentStatus.yaml.
# Neither is restated here.
# ═════════════════════════════════════════════════════════════════════════

# ── THE AUTHORISATION LEG IS ON A DIFFERENT HOST ─────────────────────────
authorisation_leg_hosts:
  authorise_host: "sandbox.ob.hsbc.co.uk"
  resource_host: "secure.sandbox.ob.hsbc.co.uk"
  finding: >-
    oauth2/authorize is served from sandbox.ob.hsbc.co.uk — NOT the mTLS resource host
    secure.sandbox.ob.hsbc.co.uk that every consent-staging and consent-status call uses. The
    two hosts are one subdomain apart and the wrong one does not serve the authorisation page.
  consequence: >-
    Sending the PSU to the resource host lands the browser somewhere that cannot authorise. The
    failure is silent from the app's side — the app sees only a consent that never leaves AWAU
    and eventually times out, which is indistinguishable from a PSU who walked away.
  redirect_uri: "https://thekalpeshpawar.github.io/obp-callback/callback/"
  ui_requirement: >-
    The authorise host is a distinct constant from the resource base URL. It must never be
    derived from the base URL by string manipulation.

# ── THE RESPONSE CARRIES NO LINK TO THE AUTHORISATION PAGE ───────────────
authorise_url_is_constructed_not_returned:
  finding: >-
    The consent-staging response carries NO authorisation link and NO redirect member. Links
    holds only Self, and Meta holds only TotalPages. There is nothing to follow.
  observed_on: "VRP consent staging; treated as the general shape across all seven families."
  consequence: >-
    The app CONSTRUCTS the authorise URL itself from the ConsentId — it cannot discover it. A
    client written against the OBIE Links contract expecting an authorisation href finds none
    and has no fallback.
  ui_requirement: "URL construction is app-owned code, not a response field read. Covered by no test the API can fail."

# ── AN AUTHORISED CONSENT CANNOT BE RE-AUTHORISED ────────────────────────
# THIS REFUTES THE RECOVERY PATH THIS SCREEN WAS APPROVED WITH.
no_reauthorisation_finding:
  evidence_grade: provisional
  evidence_note: >-
    Browser-side observation, no capture artefact. Recorded as provisional and NOT resolved
    against the contradicting spec below — but it is operationally load-bearing and the
    contradiction must be settled before this screen is implemented.
  finding: >-
    When an authorisation code expired, a FRESH authorisation URL was generated for the SAME
    consent. The URL builds correctly and the sandbox REJECTS the attempt. A consent that has
    already reached AUTH cannot be sent back through the authorise leg.
  consequence: "THERE IS NO RECOVERY PATH FOR A LOST CODE. A new consent must be staged from scratch."
  contradicts:
    - what: "error_cases.CodeExpired.recovery — 'Restart authorisation CTA re-stages and relaunches'"
      status: "ambiguous, now disambiguated — 're-stage' MUST mean staging a NEW consent, never relaunching the existing one"
    - what: "api.yaml#error_cases.TokenExchangeFailed.recovery — 'Restart the authorise leg. The code is spent and cannot be reused.'"
      status: >-
        REFUTED as written. Restarting the authorise leg against the same ConsentId is what the
        sandbox rejects. api.yaml has been amended; this row records that the original wording
        was wrong rather than silently overwriting it.
  ui_requirement: >-
    RetryAuthorisation must re-enter the ORIGINATING type screen and stage a new consent. It
    must never reuse the consentId it was handed.

# ── CODES EXPIRE IN MINUTES, AND THE EXCHANGE MUST BE THE FIRST ACTION ───
code_exchange_working_method:
  documented_ttl: "30-60s — the figure this feature was specified and approved with."
  observed_ttl: "MINUTES. The corpus working-method does not quote a number, only that it is minutes, not seconds."
  divergence_note: >-
    Recorded, not resolved. The two figures are an order of magnitude apart. The safe reading is
    the shorter one, so the implementation is unaffected — but the documented 30-60s should not
    be cited as measured.
  working_method: >-
    Exchange the returned code as the VERY FIRST action. Do nothing else until it is exchanged.
    Codes were lost TWICE in the corpus by doing other work first.
  ui_requirement: >-
    No analytics call, no persistence write, no navigation animation between receiving the
    redirect and issuing the token exchange. The state check is the only permitted work in
    front of it, and it is permitted because it is local and synchronous.

# ── STAGING DOES NOT SUPERSEDE ───────────────────────────────────────────
consents_coexist:
  finding: >-
    Consent 45123 sat at AWAU while a LATER consent 45124 on the same endpoint was staged,
    authorised and consumed to COND. Staging a new consent does not invalidate an older one.
  consequence: >-
    Multiple live consents coexist per endpoint. This screen must key everything off the
    consentId it was handed as a nav param and must never resolve "the current consent" for a
    family — there is no such thing.
  ui_requirement: "An abandoned consent is left to expire on its own. That is already the AbandonPayment contract."

# ── CONSENT IDS ARE SHORT SEQUENTIAL INTEGERS, NOT UUIDS ─────────────────
consent_id_shape:
  finding: 'ConsentIds are short sequential integers-as-strings — "45123", "45253" — shared across ALL seven families.'
  consequence: "Enumerable. Adjacent ids belong to other PSUs and can be guessed by increment."
  ui_requirement:
    - "Never render a ConsentId in a URL, a log line, a crash report or a share sheet."
    - "Do not size local storage or a validator for a 36-char UUID."
    - "The id is a correlation key, never a secret and never a display value."

# ── THE TWO LEGS NEED DIFFERENT CREDENTIALS AND DIFFERENT ACTORS ─────────
credential_split:
  staging: "client-credentials token only. No browser, no person — a background call."
  authorise: "a browser AND a present PSU. Cannot be automated, cannot be retried headlessly."
  status_poll: "client-credentials token only, same as staging."
  consequence: >-
    Only the middle leg is interactive. That is why a poll deadline is non-terminal (see
    timeout_is_not_failure_invariant) — the app can keep reading while the human is still typing
    at the bank.

# ── THE PICKER IS NOT EVIDENCE OF ENDPOINT SUPPORT ───────────────────────
authorisation_picker_trap:
  evidence_grade: "picker contents provisional (browser-side); CONSEQUENCES captured."
  finding: >-
    The HSBC authorisation picker offered ALL FIVE accounts — two current, savings, credit card
    and Global Money — on single payments, standing orders, scheduled payments AND VRP alike. It
    never narrows by rail or by product.
  sharpest_consequence: >-
    Selecting the credit card for a VRP produces a consent that reaches AUTH, PASSES
    funds-confirmation, and then refuses EVERY payment with U021. The picker leads a PSU into a
    mandate that can never pay, and NOTHING in the consent status says so.
  why_this_screen_cares: >-
    This screen's success condition is Data.Status == AUTH. On the credit-card VRP path that
    condition is met by a consent that is already dead. AUTH is therefore NOT a guarantee that
    the mandate can pay — it is only a guarantee that the PSU approved it.
  ui_requirement: >-
    Hand-back on AUTH remains correct — there is no alternative signal. The defence is upstream:
    the type screens pre-filter the debtor picker (FR-018) so the unpayable combination is never
    staged. This screen must not be given a compensating check it has no data for.
  related: "dtos/ObPaymentError.yaml#overloaded_debtor_error.u021_correction — U021 is a VRP-only code in this corpus."

# ── THE BANK REWRITES THE DEBTOR THIS SCREEN HANDS BACK ──────────────────
debtor_account_overwrite:
  finding: >-
    Where the TPP OMITTED Initiation.DebtorAccount, the bank OVERWRITES it with the account the
    PSU chose at the picker, and ENRICHES it with a Name. Where the TPP SUPPLIED a debtor, the
    bank never touches it.
  consequence: >-
    The staged Initiation and the authorised Initiation are not the same document. Anything the
    app shows or submits must come from the AUTHORISED consent read, not from what it staged.
  ui_requirement: >-
    The consent-status poll's final successful response is the source of truth for Initiation.
    Hand it back alongside the consentId — do not let the originating screen reuse its own
    staged copy.
  enforced_by: "TC-PCON-009 (owed)"

regulatory:
  note: >-
    PISP is a distinct FCA permission from AISP. Sandbox operation is unaffected; production
    payment initiation requires payment-initiation authorisation. Captured as an ADR.
  affects_production: true
  affects_sandbox: false
  adr_required: true

contracts: []

libraries:
  - capability: rest-client
    library: ktorfit
    version: latest
    targets: [android, ios, desktop, web]
  - capability: browser-redirect
    library: "cmp-navigation:ConsentRedirectBus"
    version: in-repo
    targets: [android, ios, desktop]
    notes: "Already shipped for the AIS callback; the payment redirect reuses the same per-platform bus."

vm_actions:
  - name: ValidateRedirect
    signature: 'suspend fun validateRedirect(state: String, code: String)'
    state_mutations:
      - uiState = Validating
      - uiState = Error(type=StateMismatch) when the returned state does not match the pending authorisation
    side_effects:
      - "PendingAuthStore.consume() — single-use read of the pending state/nonce/consentId"
    error_handling:
      on_state_mismatch: uiState = Error(type=StateMismatch, message=strings.error.payment_consent.state_mismatch)
      on_missing_pending: uiState = Error(type=NoPendingAuthorisation, message=strings.error.payment_consent.no_pending)

  - name: ExchangeCode
    signature: 'suspend fun exchangeCode(code: String)'
    state_mutations:
      - uiState = Exchanging
      - "psuPaymentToken = response.access_token (held for this payment only, never written to ConsentSession)"
    side_effects:
      - "POST /oauth2/token with grant_type=authorization_code and a private_key_jwt client assertion"
    error_handling:
      on_invalid_grant: uiState = Error(type=CodeExpired, message=strings.error.payment_consent.code_expired)
      on_network: uiState = Error(type=NetworkError, message=strings.error.payment_consent.network_error)

  - name: PollConsentStatus
    signature: 'suspend fun pollConsentStatus(consentId: String)'
    state_mutations:
      - uiState = Checking
      - uiState = Authorised(consentId) when Data.Status == AUTH
      - uiState = Error(type=NotAuthorised) when the status is Rejected or still AwaitingAuthorisation past the deadline
    side_effects:
      - "GET /domestic-payment-consents/{ConsentId} using the client-credentials payments token"
    error_handling:
      on_rejected: uiState = Error(type=ConsentRejected, message=strings.error.payment_consent.rejected)
      on_timeout: uiState = Error(type=AuthorisationTimedOut, message=strings.error.payment_consent.timed_out)
    notes: >-
      Load-bearing, unlike the AIS callback's best-effort poll: submitting against a consent
      that is not Authorised returns 400 U009, so this must confirm AUTH before returning.

  - name: ReturnToPayment
    signature: fun returnToPayment()
    state_mutations: []
    side_effects:
      - "Emits PaymentConsentEvent.Authorised(consentId, token, authorisedInitiation) so the originating type screen can submit"
    notes: >-
      Carries the Initiation READ BACK from the authorised consent, not the one that was staged
      — see debtor_account_overwrite. The originating screen must submit what the bank holds.
    error_handling: {}

  - name: RetryAuthorisation
    signature: fun retryAuthorisation()
    state_mutations: []
    side_effects:
      - "Emits PaymentConsentEvent.RestartAuthorisation so the originating type screen can stage a NEW consent and relaunch"
    error_handling: {}
    visibility_condition: "error.type in {CodeExpired, AuthorisationTimedOut, NetworkError}"
    notes: >-
      "Re-stage" means staging a NEW consent. It does NOT mean relaunching the authorise leg
      against the consentId this screen was handed — an already-AUTH consent cannot be
      re-authorised (see no_reauthorisation_finding). The event carries no consentId for
      exactly that reason.

  - name: AbandonPayment
    signature: fun abandonPayment()
    state_mutations: []
    side_effects:
      - "Emits PaymentConsentEvent.Abandoned; the staged consent is left unauthorised and expires on its own"
    error_handling: {}

error_cases:
  - id: StateMismatch
    trigger: "The state parameter returned by HSBC does not match the pending authorisation"
    user_message: '{strings.error.payment_consent.state_mismatch}'
    recovery: >-
      No retry — a state mismatch is a possible CSRF or a crossed authorisation. The payment is
      abandoned and the PSU is returned to the form to start again deliberately.
  - id: NoPendingAuthorisation
    trigger: "PendingAuthStore has no record — the app was restarted mid-authorisation"
    user_message: '{strings.error.payment_consent.no_pending}'
    recovery: >-
      Return to the originating type screen; the staged consent expires unauthorised. It is NOT
      superseded by anything staged later — see consents_coexist.
  - id: CodeExpired
    trigger: >-
      400 invalid_grant — the authorisation code expired or was already used. TTL documented as
      30-60s, observed as minutes; the divergence is unresolved (see code_exchange_working_method).
    user_message: '{strings.error.payment_consent.code_expired}'
    recovery: >-
      Restart authorisation CTA stages a NEW consent and relaunches. The lost code is
      unrecoverable and the existing consent cannot be re-authorised — see
      no_reauthorisation_finding. Copy must not promise "try again" against the same payment.
  - id: ConsentRejected
    trigger: "The consent status is Rejected — the PSU declined at the bank"
    user_message: '{strings.error.payment_consent.rejected}'
    recovery: "Return to the originating type screen; no payment is made"
  - id: AuthorisationTimedOut
    trigger: "The consent is still AwaitingAuthorisation after the poll deadline"
    user_message: '{strings.error.payment_consent.timed_out}'
    recovery: "Restart authorisation CTA"
  - id: NetworkError
    trigger: IOException / timeout during token exchange or status poll
    user_message: '{strings.error.payment_consent.network_error}'
    recovery: "Retry CTA — safe, no payment has been submitted at this point"

