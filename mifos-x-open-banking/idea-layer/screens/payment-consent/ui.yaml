known_gaps:
  - id: PCN-GAP-1
    severity: should
    description: "'Authorise again' (RetryAuthorisation) discards the session and emits RestartAuthorisation, but RootNavScreen maps it to navigateToAuthenticatedGraph (Home) — identical to Abandoned. The customer is not returned to the originating payment form despite the button label and the code comment ('returns to the form')."
    status: designed   # DEF-010 — spec now routes to the originating form with the draft kept; source fix pending /kmp-implement
    resolution: "RestartAuthorisation carries consentType; RootNavScreen opens SendMoneyRoute / SchedulePaymentRoute / StandingOrderDestination. Cross-feature dependency: each originating form must re-hydrate from its *InitiationRepository.stagedDraft() at Review on entry (send-money, payments-schedule-payment, payments-standing-order — owned by those features' enrich)."
  - id: PCN-GAP-2
    severity: could
    description: "AlreadySubmitted 'Done' dispatches AbandonPayment and lands on Home; there is no shortcut to the payment-status receipt or history for the already-submitted payment."
  - id: PCN-GAP-3
    severity: could
    description: "Screen has no back/navigation icon and no BackHandler; the system back gesture is not intercepted, so back during Exchanging/Submitting leaves the root route while the submission is in flight and its outcome is never shown."
