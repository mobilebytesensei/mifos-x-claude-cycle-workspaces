  fab_visible: false

states: [validating, exchanging, checking, authorised, error]

# TEST TAGS — deferred, not missing. Recorded 2026-08-02 by /idea-sync (source-truth pass).
test_tags:
  status: deferred-until-implemented
  reason: >-
    No source module yet (see docs.yaml#spec_ahead_of_source), so there is no
    PaymentConsentTestTags.kt to copy from.
  owed_by: /kmp-implement
