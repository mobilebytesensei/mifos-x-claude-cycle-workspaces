error_fixtures:
  code_expired:
    # RFC 6749 shape — the token endpoint returns this form, not the OB envelope.
    http_status: 400
    body:
      error: "invalid_grant"
      error_description: "The provided access grant is invalid, expired, or revoked."

  invalid_client:
    http_status: 401
    body:
      error: "invalid_client"
      error_description: "The request JWT signature is invalid"

  consent_not_found:
    http_status: 400
    body:
      Code: "400"
      Id: "7d3b1e64-2a09-4c7f-8b55-e1f0c2a94d13"
      Message: "Bad Request"
      Errors:
        - ErrorCode: "U011"
          Message: "Resource cannot be found"

_test_fixtures:
  single_use_pending:
    description: "PendingAuthStore.consume() returns the record then clears it; a second read is null."
    expected_second_read: null
  poll_reaches_authorised:
    sequence: [consent_status_awaiting, consent_status_awaiting, consent_status_authorised]
    expected_terminal_state: authorised
  poll_times_out:
    sequence: "consent_status_awaiting repeated past the 45000ms deadline"
    expected_error: AuthorisationTimedOut
  token_never_persisted:
    description: "The payments-scope token must not be written to ConsentSession."
    expected_consent_session_writes: 0

# ── State index (added 2026-08-02 via /idea-data) ────────────────────────────
# ui.yaml declares states: [validating, exchanging, checking, authorised, error] — a state
# MACHINE for an OAuth round-trip, not the usual loading/content/empty/error set. That is why
# it carries no `empty` and no `content`, and the dismissal is already recorded in
# DESIGN_VALIDATION. Each state below is one leg of the redirect.
states:
  - { scope: validating,  fixture: redirect_success,
      _step: "1 — verify the returned state parameter against the one we sent" }
  - { scope: exchanging,  fixture: token_exchange_response,
      _step: "2 — swap the authorisation code for a payments-scope token",
      _security: "That token is never written to ConsentSession — see _test_fixtures.token_never_persisted." }
  - { scope: checking,    fixture: consent_status_awaiting,
      _step: "3 — poll the consent resource until the bank moves it off AwaitingAuthorisation" }
  - { scope: authorised,  fixture: consent_status_authorised,
      _step: "4 — terminal success; release navigation to the payment submit" }
  - { scope: error,       fixture: error_fixtures,
      _includes: "redirect_state_mismatch (a possible tampering signal, non-retriable) and consent_status_rejected (the PSU declined at their bank)." }
