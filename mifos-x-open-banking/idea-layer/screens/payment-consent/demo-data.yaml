sibling: demo-data
schema_version: "2.1.0"
feature_id: payment-consent

screen_id: payment-consent
models: wire
maps_to_dto: [PsuTokenResponse, DomesticPaymentConsentResponse, DomesticPaymentData]
_models_note: "Fixtures are the OBIE wire envelope, not the domain projection. api.yaml#response_dto names the domain DTO the repository yields; the mapper sits between. RULE-DEMO-DATA-001 DD5 compares against the wire contract for this file."
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC-sandbox-shaped OBIE data only."

# Consent 812774903 is the same staged consent used by the send-money fixtures, so the two
# features exercise one coherent payment end to end.

