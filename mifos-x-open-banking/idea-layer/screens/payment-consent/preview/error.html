<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Authorising payment — error</title>
<style>
  :root {
    --primary: #266489; --on-primary: #FFFFFF; --primary-container: #C9E6FF; --on-primary-container: #004B6F;
    --secondary: #50606E; --secondary-container: #D3E5F5; --tertiary: #64597B;
    --background: #F7F9FF; --surface: #F7F9FF;
    --surface-container-low: #F1F4F9; --surface-container: #EBEEF3; --surface-container-high: #E5E8ED;
    --on-surface: #181C20; --on-surface-variant: #41474D;
    --outline: #72787E; --outline-variant: #C1C7CE;
    --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #93000A;
    --font-brand: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs-headline-small: 1.5rem; --fs-title-large: 1.375rem; --fs-body-medium: 0.875rem;
    --fs-label-large: 0.875rem; --fs-label-medium: 0.75rem;
    --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px; --sp-2xl: 32px;
    --r-small: 8px; --r-medium: 12px; --r-large: 16px; --r-full: 9999px;
    --el-0: none;
    --el-1: 0 1px 2px rgba(24,28,32,.08), 0 1px 3px rgba(24,28,32,.06);
    --el-2: 0 1px 2px rgba(24,28,32,.10), 0 2px 6px rgba(24,28,32,.08);
    --appbar-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #95CDF7; --on-primary: #00344E; --primary-container: #004B6F; --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9; --secondary-container: #384956; --tertiary: #CFC0E8;
      --background: #101417; --surface: #101417;
      --surface-container-low: #181C20; --surface-container: #1C2024; --surface-container-high: #262A2E;
      --on-surface: #E0E3E8; --on-surface-variant: #C1C7CE;
      --outline: #8B9198; --outline-variant: #41474D;
      --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
      --el-1: 0 1px 2px rgba(0,0,0,.40), 0 1px 3px rgba(0,0,0,.30);
      --el-2: 0 1px 2px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--background); color: var(--on-surface); font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .screen { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  .top-app-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; height: var(--appbar-h); padding: 0 var(--sp-lg); background: var(--surface); color: var(--on-surface); }
  .top-app-bar__title { font-family: var(--font-brand); font-size: var(--fs-title-large); font-weight: 500; line-height: 1.3; margin: 0; }
  .state-column { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-lg); padding: var(--sp-2xl) var(--sp-xl); text-align: center; max-width: 480px; width: 100%; margin: 0 auto; }
  .error-mark { display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 96px; aspect-ratio: 1/1; border-radius: var(--r-full); background: var(--error-container); color: var(--on-error-container); box-shadow: var(--el-1); margin-bottom: var(--sp-sm); }
  .error-mark svg { width: 44px; height: 44px; display: block; }
  .title { font-family: var(--font-brand); font-size: var(--fs-headline-small); font-weight: 400; line-height: 1.25; color: var(--on-surface); margin: 0; text-wrap: balance; }
  .body { font-size: var(--fs-body-medium); line-height: 1.55; color: var(--on-surface-variant); margin: 0; max-width: 38ch; }
  .actions { display: flex; flex-direction: column; gap: var(--sp-sm); width: 100%; max-width: 320px; margin-top: var(--sp-md); }
  .button-filled, .button-text { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 var(--sp-xl); border-radius: var(--r-full); font-family: var(--font-body); font-size: var(--fs-label-large); font-weight: 500; cursor: pointer; }
  .button-filled { border: 0; background: var(--primary); color: var(--on-primary); box-shadow: var(--el-1); transition: box-shadow .15s ease, filter .15s ease; }
  .button-filled:hover { box-shadow: var(--el-2); filter: brightness(1.05); }
  .button-filled:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
  .button-text { border: 0; background: transparent; color: var(--on-surface-variant); }
  .button-text:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .button-text:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .button-filled { transition: none; } }
</style>
</head>
<body>
<div class="screen" data-screen="payment-consent" data-state="error">

  <header class="top-app-bar" data-component-type="top_app_bar" data-component-id="payment_consent_top_app_bar">
    <h1 class="top-app-bar__title">Authorising payment</h1>
  </header>

  <main class="state-column"
        data-component-type="error_state" data-component-id="error_state"
        data-test-tag="paymentConsent:errorState"
        data-error-kind="AuthorisationTimedOut" data-restart-offered="true"
        role="alert" aria-label="Authorisation could not be completed">
    <span class="error-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 1.9"/>
      </svg>
    </span>

    <h1 class="title" data-component-type="text" data-component-id="error_title">Authorisation could not be completed</h1>
    <p class="body" data-component-type="text" data-component-id="error_body">Your bank hasn't confirmed this payment yet. You can check again or start over.</p>

    <div class="actions">
      <button class="button-filled" type="button"
              data-component-type="button" data-component-id="restart_button"
              data-test-tag="paymentConsent:restartButton" data-action-id="RestartAuthorisation"
              data-nav-to="payments" data-nav-type="replace"
              aria-label="Start the payment authorisation again">Start again</button>
      <button class="button-text" type="button"
              data-component-type="text_button" data-component-id="abandon_button"
              data-test-tag="paymentConsent:abandonButton" data-action-id="AbandonPayment"
              data-nav-to="payments" data-nav-type="pop"
              aria-label="Discard this payment. No money will be sent.">Discard payment</button>
    </div>
  </main>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
