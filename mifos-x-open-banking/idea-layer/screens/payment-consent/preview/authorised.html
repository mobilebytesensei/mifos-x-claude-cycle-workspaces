<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Authorising payment — authorised</title>
<style>
  :root {
    --primary: #266489; --on-primary: #FFFFFF; --primary-container: #C9E6FF; --on-primary-container: #004B6F;
    --secondary: #50606E; --secondary-container: #D3E5F5; --on-secondary-container: #384956; --tertiary: #64597B;
    --background: #F7F9FF; --surface: #F7F9FF;
    --surface-container-low: #F1F4F9; --surface-container: #EBEEF3; --surface-container-high: #E5E8ED;
    --on-surface: #181C20; --on-surface-variant: #41474D;
    --outline: #72787E; --outline-variant: #C1C7CE; --error: #BA1A1A;
    --font-brand: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs-headline-small: 1.5rem; --fs-title-large: 1.375rem; --fs-body-medium: 0.875rem; --fs-label-medium: 0.75rem;
    --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px; --sp-2xl: 32px;
    --r-small: 8px; --r-medium: 12px; --r-large: 16px; --r-full: 9999px;
    --el-0: none;
    --el-1: 0 1px 2px rgba(24,28,32,.08), 0 1px 3px rgba(24,28,32,.06);
    --el-2: 0 1px 2px rgba(24,28,32,.10), 0 2px 6px rgba(24,28,32,.08);
    --appbar-h: 64px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #95CDF7; --on-primary: #00344E; --primary-container: #004B6F; --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9; --secondary-container: #384956; --on-secondary-container: #D3E5F5; --tertiary: #CFC0E8;
      --background: #101417; --surface: #101417;
      --surface-container-low: #181C20; --surface-container: #1C2024; --surface-container-high: #262A2E;
      --on-surface: #E0E3E8; --on-surface-variant: #C1C7CE;
      --outline: #8B9198; --outline-variant: #41474D; --error: #FFB4AB;
      --el-1: 0 1px 2px rgba(0,0,0,.40), 0 1px 3px rgba(0,0,0,.30);
      --el-2: 0 1px 2px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--background); color: var(--on-surface); font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .screen { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  .top-app-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; height: var(--appbar-h); padding: 0 var(--sp-lg); background: var(--surface); color: var(--on-surface); }
  .top-app-bar__title { font-family: var(--font-brand); font-size: var(--fs-title-large); font-weight: 500; line-height: 1.3; margin: 0; }
  .state-column { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-lg); padding: var(--sp-2xl) var(--sp-xl); text-align: center; max-width: 480px; width: 100%; margin: 0 auto; }
  .success-mark { display: inline-flex; align-items: center; justify-content: center; width: 104px; height: 104px; aspect-ratio: 1/1; border-radius: var(--r-full); background: var(--primary-container); color: var(--primary); box-shadow: var(--el-2); margin-bottom: var(--sp-sm); }
  .success-mark svg { width: 52px; height: 52px; display: block; }
  .title { font-family: var(--font-brand); font-size: var(--fs-headline-small); font-weight: 400; line-height: 1.25; color: var(--on-surface); margin: 0; text-wrap: balance; }
  .body { font-size: var(--fs-body-medium); line-height: 1.55; color: var(--on-surface-variant); margin: 0; max-width: 34ch; }
  .progress-linear { width: 100%; max-width: 220px; height: 4px; border-radius: var(--r-full); background: var(--surface-container-high); overflow: hidden; margin-top: var(--sp-sm); }
  .progress-linear__bar { display: block; width: 40%; height: 100%; border-radius: var(--r-full); background: var(--primary); animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .progress-linear__bar { animation: none; width: 100%; } }
</style>
</head>
<body>
<div class="screen" data-screen="payment-consent" data-state="authorised">

  <header class="top-app-bar" data-component-type="top_app_bar" data-component-id="payment_consent_top_app_bar">
    <h1 class="top-app-bar__title">Authorising payment</h1>
  </header>

  <main class="state-column" role="status" aria-live="polite">
    <span class="success-mark" data-component-type="icon" data-component-id="authorised_icon"
          data-test-tag="paymentConsent:authorisedIcon" aria-label="Payment authorised">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="m8.2 12.2 2.6 2.6 5-5.6"/>
      </svg>
    </span>

    <h1 class="title" data-component-type="text" data-component-id="authorised_title">Payment authorised</h1>
    <p class="body" data-component-type="text" data-component-id="authorised_body">Your bank has approved this payment. Sending it now.</p>

    <span class="progress-linear" role="progressbar" aria-label="Returning to send money"
          data-component-type="progress_linear" data-component-id="handoff_progress"
          data-nav-to="payments" data-nav-type="replace">
      <span class="progress-linear__bar"></span>
    </span>
  </main>

</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
