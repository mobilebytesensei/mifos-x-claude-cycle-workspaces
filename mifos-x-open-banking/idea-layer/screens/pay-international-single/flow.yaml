sibling: flow
schema_version: "4.0"
feature_id: pay-international-single

feature: pay-international-single
flow_ref: pay-international-single

entry_points:
  - source: payments
    label: "Tap the International single tile on the payments hub"
    params: []

transitions:
  - from: pay-international-single
    to: payment-consent
    trigger: "Confirm on the Review step, after the consent stages 201"
    params: [consentId, paymentFamily]
    notes: "paymentFamily is 'international-payment'."

  - from: payment-consent
    to: pay-international-single
    trigger: "Consent reaches AUTH"
    params: [consentId]
    notes: "Resumes at funds-confirmation, then submit."

  - from: payment-consent
    to: pay-international-single
    trigger: "Consent reaches RJCT — the PSU denied it at the bank"
    params: [consentId]
    condition: "consentStatus == RJCT"
    notes: >-
      A real observed terminal state on this rail (consent 45121). Returns to the form with a
      rejected message and a fresh-payment CTA. Never a resubmit — a rejected consent cannot be
      reused.

  - from: pay-international-single
    to: payment-status
    trigger: "Submit returns 201 with an InternationalPaymentId"
    params: [paymentId, paymentFamily]

  - from: pay-international-single
    to: payments
    trigger: "Back from the Account step, or Cancel"
    params: []

internal_step_transitions:
  steps: [Account, Recipient, Amount, Charges, Review]
  note: >-
    Five steps. Charges is unique to the international rails and cannot be skipped —
    ChargeBearer is mandatory and has no bank default.

fx_timing_note: >-
  No countdown or timed step exists in this flow. Guide §21.10.1 describes a 40-second FX window
  with 5 seconds for the TPP to POST, but both authorised FX flows called funds-confirmation and
  submitted minutes later without rejection. Implementing a timer would abort journeys the bank
  accepts.

dependencies:
  tier: feature
  features:
    - { name: payments, relation: parent, params: [] }
    - { name: accounts, relation: data_source, params: [] }
    - { name: payment-consent, relation: child, params: [consentId, paymentFamily] }
    - { name: payment-status, relation: child, params: [paymentId, paymentFamily] }
  note: >-
    beneficiaries is deliberately absent. Saved payees are sort-code addressed and this rail
    refuses sort-code creditors with U027.
  libraries:
    - name: ktorfit
      coords: "de.jensklingenberg.ktorfit:ktorfit-lib:2.x"
      purpose: "REST client for the five international-payment endpoints"
