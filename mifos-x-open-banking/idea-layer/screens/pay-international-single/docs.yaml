error_contract_ref:
  dto: dtos/ObPaymentError.yaml
  note: >-
    The envelope, the Path case and array-notation quirks, the four U004 wordings, the overloaded
    U002 @ DebtorAccount.Identification and the rail-dependent code mapping are specified ONCE in
    that DTO and are not restated here. What this feature adds locally is only the rendering
    consequence: every Errors entry is displayed, in wire order, keyed by ErrorCode + Path.

open_questions:
  - question: "Does the international rail accept PaymentContextCode?"
    status: UNTESTED
    evidence: >-
      International Risk carried CategoryPurposeCode 'EPAY' in 25 of 25 scenarios. ZERO sent
      PaymentContextCode — so there is neither an acceptance nor a refusal to cite.
    why_it_matters: >-
      FR-015 requires a consumer PaymentContextCode on EVERY payment. No international scenario
      satisfies it as written, and the domestic rail's acceptance cannot be read across — this
      rail refuses RemittanceInformation, which the domestic rail takes, so field-level agreement
      between the two is demonstrably unsafe.
    consequence: >-
      If the field is refused with U005 — the fate of every other domestic-only field tried here
      — then FR-015 is unsatisfiable on the international rails and the REQUIREMENT needs
      amending, not the implementation. Do NOT ship a PaymentContextCode on this rail on the
      strength of FR-015 alone.
    resolves_with: "One staging call sending PaymentContextCode 'TransferToThirdParty'."

  - question: "Does an amount ceiling exist above 300000.00?"
    status: "UNTESTED above staging"
    evidence: "INT-13 staged '300000.00' USD at 201; the scenario was titled as a 250k-limit probe and no limit fired."
    consequence: "The form advertises no limit. If one exists it applies after staging, where the app cannot pre-empt it."

closed_questions:
  - question: "Would this endpoint accept ExchangeRateInformation?"
    was: "Recorded as the highest-value open FX experiment available, on the standing-order rail."
    now: >-
      CLOSED — REFUSED. All three RateType values are refused on all three international rails
      (R16-P1/P2/P3 single, R16-S1/S2/S3 scheduled, R16-O1/O2/O3 standing order), including the
      Agreed form carrying a real ExchangeRate 1.15 and ContractIdentification 'FX-CONTRACT-001'.
      Controls R16-C1/C2/C3 with the block removed all staged 201.
    consequence: >-
      There is NO WAY to show the customer a rate before authorisation — not even one the TPP
      holds by contract. The FX banner is the final answer, not a placeholder awaiting a better
      data source.
    divergence_retained: >-
      ExchangeRateInformation is absent from the v4.0 request dictionary but PRESENT in the
      published usage examples. The examples describe a field this endpoint refuses. Recorded,
      not resolved.

regulatory:
  note: "PISP is a distinct FCA permission from AISP. Sandbox unaffected; production needs authorisation this project does not hold."
  affects_production: true
  affects_sandbox: false
  adr_required: true

vm_actions:
  - name: EnterBic
    signature: 'fun enterBic(bic: String)'
    state_mutations:
      - "content.bic = bic"
      - "content.bicProblem = if (bic.isNotBlank() && bic.length != 11) WrongLength else null"
    notes: "Optional field. Blank is valid — omitting CreditorAgent entirely stages 201."
  - name: SelectTransferCurrency
    signature: 'fun selectTransferCurrency(code: String)'
    state_mutations: ["content.currencyOfTransfer = code"]
    notes: "Mandatory on the wire. Separate from the instructed currency; the two need not match."
  - name: SelectChargeBearer
    signature: 'fun selectChargeBearer(value: ChargeBearer)'
    state_mutations: ["content.chargeBearer = value"]
    notes: "Mandatory — U004 if omitted. All three values stage 201, so there is no bank default to fall back on."
  - name: ConfirmAndStageConsent
    signature: 'suspend fun confirmAndStageConsent()'
    state_mutations:
      - uiState = Submitting(StagingConsent)
      - uiState = Submitting(AwaitingAuthorisation, consentId = response.Data.ConsentId)
    side_effects:
      - "POST /international-payment-consents with CurrencyOfTransfer and ChargeBearer"
      - "Body carries NO RemittanceInformation"
    error_handling:
      on_400_U004: uiState = Error(MissingRequiredField)
      on_400_U005: uiState = Error(FieldNotExpected)
      on_400_U027: uiState = Error(UnsupportedScheme)
      on_400_U002: uiState = Error(InvalidFieldValue)
      on_400_U019: uiState = Error(SignatureMissing)

error_cases:
  - { id: MissingRequiredField, trigger: "400 U004", user_message: '{strings.error.payment.missing_field}', recovery: "Implementation fault — ChargeBearer and CurrencyOfTransfer are always sent." }
  - { id: FieldNotExpected, trigger: "400 U005", user_message: '{strings.error.payment.field_not_expected}', recovery: "Implementation fault — RemittanceInformation must not be sent on this rail." }
  - { id: UnsupportedScheme, trigger: "400 U027", user_message: '{strings.error.payment.unsupported_scheme}', recovery: "Should be unreachable — the form takes an IBAN." }
  - { id: InvalidFieldValue, trigger: "400 U002", user_message: '{strings.error.payment.invalid_bank_code}', recovery: "Return to the recipient step — most often an 8-character BIC." }
  - { id: SignatureMissing, trigger: "400 U019", user_message: '{strings.error.payment.signature_missing}', recovery: "Not user-recoverable." }
  - { id: ConsentNotAuthorised, trigger: "400 U009", user_message: '{strings.error.payment.consent_not_authorised}', recovery: "Re-authorise." }
  - { id: ConsentRejected, trigger: "consent status RJCT", user_message: '{strings.error.payment.consent_rejected}', recovery: "The PSU denied it at the bank. Offer a fresh payment, not a resubmit." }
  - { id: InsufficientFunds, trigger: "funds-confirmation FundsAvailable false", user_message: '{strings.error.payment.insufficient_funds}', recovery: "Return to the amount step." }
  - { id: NetworkError, trigger: "IOException / timeout", user_message: '{strings.error.payment.network_error}', recovery: "Retry — idempotency key reused." }

