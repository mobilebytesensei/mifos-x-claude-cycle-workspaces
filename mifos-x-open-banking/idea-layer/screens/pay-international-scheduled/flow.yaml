sibling: flow
schema_version: "4.0"
feature_id: pay-international-scheduled

feature: pay-international-scheduled
flow_ref: pay-international-scheduled

entry_points:
  - source: payments
    label: "Tap the International scheduled tile on the payments hub"
    params: []

transitions:
  - from: pay-international-scheduled
    to: payment-consent
    trigger: "Confirm on the Review step, after the consent stages 201"
    params: [consentId, paymentFamily]
    notes: "paymentFamily is 'international-scheduled-payment'."

  - from: payment-consent
    to: pay-international-scheduled
    trigger: "Consent reaches AUTH"
    params: [consentId]
    notes: "Resumes directly at submit — no funds-confirmation on this family."

  - from: payment-consent
    to: pay-international-scheduled
    trigger: "Consent reaches RJCT"
    params: [consentId]
    condition: "consentStatus == RJCT"
    notes: "Fresh-payment CTA, never a resubmit against the rejected consent."

  - from: pay-international-scheduled
    to: payment-status
    trigger: "Submit returns 201 with an InternationalScheduledPaymentId"
    params: [paymentId, paymentFamily]

  - from: pay-international-scheduled
    to: payments
    trigger: "Back from the Account step, or Cancel"
    params: []

internal_step_transitions:
  steps: [Account, Recipient, Amount, Date, Charges, Review]
  note: >-
    Six steps — the longest form in the app. The international rails need a recipient step that
    cannot reuse saved payees, a two-currency amount step and a mandatory charge-bearer choice;
    the scheduled rails need a date. None is droppable.

dependencies:
  tier: feature
  features:
    - { name: payments, relation: parent, params: [] }
    - { name: accounts, relation: data_source, params: [] }
    - { name: payment-consent, relation: child, params: [consentId, paymentFamily] }
    - { name: payment-status, relation: child, params: [paymentId, paymentFamily] }
  note: "beneficiaries is absent — sort-code payees are refused with U027 on the international rails."
  libraries:
    - name: ktorfit
      coords: "de.jensklingenberg.ktorfit:ktorfit-lib:2.x"
      purpose: "REST client for the four international-scheduled-payment endpoints"
