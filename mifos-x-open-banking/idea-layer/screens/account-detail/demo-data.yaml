sibling: demo-data
schema_version: "2.1.0"
feature_id: account-detail

screen_id: account-detail
models: wire
maps_to_dto: [AccountDetail, AccountBalanceLine]
_models_note: "Fixtures are the OBIE wire envelope, not the domain projection. api.yaml#response_dto names the domain DTO the repository yields; the mapper sits between. RULE-DEMO-DATA-001 DD5 compares against the wire contract for this file."
_content_policy: "RULE-PROTO-CONTENT-001 — zero placeholders; real HSBC-sandbox-style data only."

# ─────────────────────────────────────────────────────────────────────
# CONTENT STATE — HSBC sandbox CurrentAccount with 3 balance types
# Account 40051512345678, sort code 40-05-15, branch HSBC UK plc
# ─────────────────────────────────────────────────────────────────────
account:
  AccountId: "40051512345678"
  Currency: "GBP"
  AccountType: "Personal"
  AccountSubType: "CurrentAccount"
  Nickname: "Everyday Current"
  Description: "HSBC Advance Bank Account"
  StatusUpdateDateTime: "2026-06-28T18:30:00Z"
  Account:
    SchemeName: "UK.OBIE.SortCodeAccountNumber"
    Identification: "40-05-15 12345678"
    Name: "Priya Sharma"
    SecondaryIdentification: "PRIY-SHA-001"
  Servicer:
    SchemeName: "UK.OBIE.BICFI"
    Identification: "MIDLGB2105V"        # HSBC UK plc BIC for sort code 40-05-15

balances:
  - AccountId: "40051512345678"
    CreditDebitIndicator: "Credit"
    Type: "InterimAvailable"
    DateTime: "2026-06-28T18:30:00Z"
    Amount:
      Amount: "2847.63"
      Currency: "GBP"
    CreditLine:
      - Included: true
        Type: "Pre-Agreed"
        Amount:
          Amount: "2000.00"
          Currency: "GBP"

  - AccountId: "40051512345678"
    CreditDebitIndicator: "Credit"
    Type: "InterimBooked"
    DateTime: "2026-06-28T18:30:00Z"
    Amount:
      Amount: "2810.04"
      Currency: "GBP"
    CreditLine:
      - Included: true
        Type: "Pre-Agreed"
        Amount:
          Amount: "2000.00"
          Currency: "GBP"

  - AccountId: "40051512345678"
    CreditDebitIndicator: "Credit"
    Type: "OpeningBooked"
    DateTime: "2026-06-01T00:00:00Z"
    Amount:
      Amount: "3150.00"
      Currency: "GBP"
    CreditLine:
      - Included: true
        Type: "Pre-Agreed"
        Amount:
          Amount: "2000.00"
          Currency: "GBP"

# ─────────────────────────────────────────────────────────────────────
# EMPTY STATE scenario — Global Wallet sub-account with no balance
# types on file (rare but valid per OBIE spec when balance permissions
# not granted for a sub-account)
# ─────────────────────────────────────────────────────────────────────
empty_scenario:
  account:
    AccountId: "40051599999999"
    Currency: "EUR"
    AccountType: "Personal"
    AccountSubType: "GlobalWallet"
    Nickname: "Euro Wallet"
    StatusUpdateDateTime: "2026-06-28T12:00:00Z"
    Account:
      SchemeName: "UK.OBIE.SortCodeAccountNumber"
      Identification: "40-05-15 99999999"
      Name: "Priya Sharma"
    Servicer:
      SchemeName: "UK.OBIE.BICFI"
      Identification: "MIDLGB2105V"
  balances: []

# ─────────────────────────────────────────────────────────────────────
# ERROR scenarios (used in tests.yaml fixtures)
# ─────────────────────────────────────────────────────────────────────
error_scenarios:
  - id: token_expired
    http_status: 401
    error_id: TokenExpiredError
    error_message: "Session expired. Please log in again."
    recoverable: true

  - id: consent_withdrawn
    http_status: 403
    error_id: ConsentWithdrawnError
    error_message: "Access to this account has been withdrawn."
    recoverable: false

  - id: account_not_found
    http_status: 404
    error_id: AccountNotFoundError
    error_message: "Account not found in your authorised account set."
    recoverable: false

  - id: network_failure
    http_status: null
    error_id: NetworkError
    error_message: "No network connection. Please check your connection and retry."
    recoverable: true

# ── State index (added 2026-08-02 via /idea-data) ────────────────────────────
# Coverage was already complete via empty_scenario / error_scenarios. This block adds the
# uniform `states:` index the other 58 demo-data files now carry, so a consumer can find the
# per-state fixtures without knowing this screen's private key names.
states:
  - { scope: content, account: account, balances: balances }
  - { scope: loading, account: account }
  - { scope: empty,   fixture: empty_scenario }
  - { scope: error,   fixture: error_scenarios }
