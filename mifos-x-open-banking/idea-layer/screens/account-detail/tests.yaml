sibling: tests
schema_version: "4.0"
feature_id: account-detail

screen_id: account-detail
_schema: "idea-layer-tests-v1"

scenarios:

  # ── LOADING STATE ─────────────────────────────────────────────────
  - id: TC-ACCTDTL-001
    name: "Loading state — spinner visible, content hidden"
    priority: critical
    state: loading
    given: "Valid PSU access token; both API calls in flight (slow network simulation)"
    when: "Screen mounts with accountId=40051512345678 before either response arrives"
    then:
      - "Circular progress indicator visible (id: loading_spinner)"
      - "Account header card NOT rendered"
      - "Balances list NOT rendered"
      - "Action chips NOT rendered"
      - "Open Banking badge NOT rendered"
    fixture_ref: demo-data.yaml#account

  # ── CONTENT STATE ─────────────────────────────────────────────────
  - id: TC-ACCTDTL-002
    name: "Content state — account metadata renders correctly"
    priority: critical
    state: content
    given: "HSBC sandbox returns OBReadAccount6 for account 40051512345678 (CurrentAccount, Everyday Current, GBP, sort-code 40-05-15 12345678)"
    when: "Screen mounts with accountId=40051512345678 and both API calls succeed"
    then:
      - "Account header card visible"
      - "AccountSubType label shows 'CurrentAccount'"
      - "Nickname shows 'Everyday Current' (headlineMedium)"
      - "Identification shows '40-05-15 12345678'"
      - "Currency shows 'GBP'"
      - "Servicer shows 'MIDLGB2105V'"
      - "StatusUpdateDateTime shown in last-updated row"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-003
    name: "Content state — three balance types all rendered"
    priority: critical
    state: content
    given: "GET /accounts/40051512345678/balances returns InterimAvailable, InterimBooked, OpeningBooked"
    when: "Both API calls succeed"
    then:
      - "Balances section header visible"
      - "Balances list has exactly 3 items"
      - "InterimAvailable row: Type='InterimAvailable', Amount='2847.63 GBP'"
      - "InterimBooked row: Type='InterimBooked', Amount='2810.04 GBP'"
      - "OpeningBooked row: Type='OpeningBooked', Amount='3150.00 GBP'"
      - "Each balance row shows accessibility_label combining Type and Amount"
    fixture_ref: demo-data.yaml#balances

  - id: TC-ACCTDTL-004
    name: "Content state — Open Banking trust badge visible"
    priority: high
    state: content
    given: "Content state fully loaded"
    when: "Screen renders after successful API responses"
    then:
      - "Open Banking badge card (id: open_banking_badge) visible"
      - "Badge text renders strings.account_detail_open_banking_badge"
      - "Badge is non-interactive (no on_click)"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-005
    name: "Content state — all 9 action chips present and labelled"
    priority: high
    state: content
    given: "Content state fully loaded for account 40051512345678"
    when: "Explore section renders"
    then:
      - "Chip row horizontally scrollable"
      - "chip_transactions renders with icon receipt_long and label from strings.nav_chip_transactions"
      - "chip_statements renders with icon description"
      - "chip_standing_orders renders with icon autorenew"
      - "chip_direct_debits renders with icon subscriptions"
      - "chip_scheduled_payments renders with icon schedule"
      - "chip_beneficiaries renders with icon people"
      - "chip_atm_locator renders with icon atm and label from strings.account_detail.nav_chip_atm_label"
      - "chip_product renders with icon description and label from strings.nav_chip_product"
      - "chip_party renders with icon person and label from strings.nav_chip_party"
    fixture_ref: demo-data.yaml#account

  # ── NAVIGATION ────────────────────────────────────────────────────
  - id: TC-ACCTDTL-006
    name: "Chip navigation — Transactions"
    priority: high
    state: content
    given: "Content state loaded for account 40051512345678"
    when: "User taps Transactions chip"
    then:
      - "Navigates to 'transactions' route with param accountId='40051512345678'"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-007
    name: "Chip navigation — Statements"
    priority: high
    state: content
    given: "Content state loaded for account 40051512345678"
    when: "User taps Statements chip"
    then:
      - "Navigates to 'statements' route with param accountId='40051512345678'"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-008
    name: "Chip navigation — Standing Orders"
    priority: medium
    state: content
    given: "Content state loaded for account 40051512345678"
    when: "User taps Standing Orders chip"
    then:
      - "Navigates to 'standing-orders' route with param accountId='40051512345678'"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-009
    name: "Chip navigation — Direct Debits"
    priority: medium
    state: content
    given: "Content state loaded for account 40051512345678"
    when: "User taps Direct Debits chip"
    then:
      - "Navigates to 'direct-debits' route with param accountId='40051512345678'"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-010
    name: "Back button navigates to accounts screen"
    priority: high
    state: content
    given: "Account detail loaded"
    when: "User taps back button (icon_button id: back_button)"
    then:
      - "Nav stack popped; accounts screen active"
    fixture_ref: demo-data.yaml#account

  # ── EMPTY STATE ───────────────────────────────────────────────────
  - id: TC-ACCTDTL-011
    name: "Empty state — zero balances returned for Global Wallet sub-account"
    priority: medium
    state: empty
    given: "GET /accounts/40051599999999 succeeds (Euro Wallet); GET /accounts/40051599999999/balances returns empty array"
    when: "Screen mounts with accountId=40051599999999"
    then:
      - "Account header card visible with Nickname 'Euro Wallet' and Currency 'EUR'"
      - "Open Banking badge visible"
      - "balances_empty_state component visible (icon: account_balance_wallet)"
      - "Balances section header NOT rendered"
      - "Balances list NOT rendered"
    fixture_ref: demo-data.yaml#empty_scenario

  # ── ERROR STATES ──────────────────────────────────────────────────
  - id: TC-ACCTDTL-012
    name: "Error state — 401 token expired (recoverable)"
    priority: critical
    state: error
    given: "PSU access token is expired"
    when: "GET /accounts/{AccountId} returns HTTP 401"
    then:
      - "Error state renders (id: error_state)"
      - "Error icon visible (error_outline)"
      - "Error title shows strings.account_detail_error_title"
      - "Error body shows 'Session expired. Please log in again.'"
      - "Retry button visible and tappable (error.recoverable == true)"
      - "Tapping Retry re-triggers account_detail_load (loading state re-entered)"
    fixture_ref: demo-data.yaml#error_scenarios[0]

  - id: TC-ACCTDTL-013
    name: "Error state — 403 consent withdrawn (non-recoverable)"
    priority: critical
    state: error
    given: "PSU has revoked consent from the HSBC app since the access token was issued"
    when: "GET /accounts/{AccountId} returns HTTP 403"
    then:
      - "Error state renders"
      - "Error body shows 'Access to this account has been withdrawn.'"
      - "Retry button hidden by ViewModel (error.recoverable == false)"
      - "Back navigation still accessible"
    fixture_ref: demo-data.yaml#error_scenarios[1]

  - id: TC-ACCTDTL-014
    name: "Error state — 404 account not in authorised set (non-recoverable)"
    priority: high
    state: error
    given: "AccountId is not in the PSU-authorised account set returned by the consent"
    when: "GET /accounts/{AccountId} returns HTTP 404"
    then:
      - "Error state renders"
      - "Error body shows 'Account not found in your authorised account set.'"
      - "Retry button hidden (error.recoverable == false)"
    fixture_ref: demo-data.yaml#error_scenarios[2]

  - id: TC-ACCTDTL-015
    name: "Error state — network failure with retry loop"
    priority: high
    state: error
    given: "Device has no network connection"
    when: "Both API calls fail with ConnectException / SocketTimeoutException"
    then:
      - "Error state renders"
      - "Error body shows 'No network connection. Please check your connection and retry.'"
      - "Retry button visible (error.recoverable == true)"
      - "Tapping Retry re-enters loading state and retries both API calls"
    fixture_ref: demo-data.yaml#error_scenarios[3]

  - id: TC-ACCTDTL-016
    name: "Chip navigation — Scheduled Payments"
    priority: medium
    state: content
    given: "Content state loaded for account 40051512345678"
    when: "User taps Scheduled Payments chip (chip_scheduled_payments)"
    then:
      - "Navigates to 'scheduled-payments' route with param accountId='40051512345678'"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-017
    name: "Chip navigation — Beneficiaries"
    priority: medium
    state: content
    given: "Content state loaded for account 40051512345678"
    when: "User taps Beneficiaries chip (chip_beneficiaries)"
    then:
      - "Navigates to 'beneficiaries' route with param accountId='40051512345678'"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-018
    name: "Chip navigation — ATM Locator (placeholder destination)"
    priority: low
    state: content
    given: "Content state loaded for account 40051512345678, AtmLocator in availableChips"
    when: "User taps the ATM Locator chip"
    then:
      - "onNavigateToChip(AccountDetailChip.AtmLocator, accountId) fires -> navigate(AtmLocatorRoute), which renders PlaceholderScreen(\"ATM locator\"). No feature module exists; the arg-less route drops accountId."
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-019
    name: "Chip navigation — Product"
    priority: medium
    state: content
    given: "Content state loaded for account 40051512345678"
    when: "User taps Product chip (chip_product)"
    then:
      - "Navigates to 'product' route with param accountId='40051512345678'"
    fixture_ref: demo-data.yaml#account

  - id: TC-ACCTDTL-020
    name: "Chip navigation — Party"
    priority: medium
    state: content
    given: "Content state loaded for account 40051512345678"
    when: "User taps Party chip (chip_party)"
    then:
      - "Navigates to 'party' route with param accountId='40051512345678'"
    fixture_ref: demo-data.yaml#account
