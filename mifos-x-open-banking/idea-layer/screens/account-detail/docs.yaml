# vm_actions RELOCATED 2026-08-01 (/idea-sync). 11 of the 12 entries here were not dispatched
# Actions. Nothing is deleted — each moved to the block that states how it actually works:
#   loadAccountDetail  -> initial_load  (init{} stream collection)
#   navigateBack + the 9 discrete navigate* -> nav_callbacks (host-owned)
# ui.yaml#state_model.actions.members declares exactly one member: RetryLoad.
vm_actions:
  - name: RetryLoad
    signature: fun retryLoad()
    state_mutations:
      - delegates to LoadAccountDetail with current accountId
    side_effects: []
    error_handling: {}
    guard: Only exposed to UI when current error state has recoverable=true

initial_load:
  mechanism: init-stream-collection
  what: "Parallel GET /accounts/{accountId} and GET /accounts/{accountId}/balances via ktorfit"
  states: "Loading -> Content(account, balances) | Empty(account) when balances.isEmpty() | Error(code, message, recoverable)"
  error_typing: "by HTTP status from HttpResponseException.response.status — see error_cases below"
  note: >-
    NOT a dispatched action. ui.yaml#implementation.removed_in_sync: "loadAccountDetail action —
    the initial load is stream collection in init{}". Recorded here rather than deleted because
    the load genuinely happens; it simply is not an AccountDetailAction member.

nav_callbacks:
  # Host-owned, resolved by navigateFromChip() in AuthenticatedNavbarNavigationScreen.
  # ui.yaml#implementation.removed_in_sync: "The nine discrete navigate* actions — source
  # collapses them into the AccountDetailChip enum plus one onNavigateToChip callback".
  # They were listed here as nine separate ViewModel methods; source has ONE callback and an
  # enum, so the nine are folded back into that single signature with their targets kept.
  - signature: "onNavigateToChip(chip: AccountDetailChip, accountId: String)"
    chips:
      Transactions:      "TransactionsRoute(accountId)"
      Statements:        "StatementsRoute(accountId)"
      StandingOrders:    "StandingOrdersRoute(accountId)"
      DirectDebits:      "DirectDebitsRoute(accountId)"
      ScheduledPayments: "ScheduledPaymentsRoute(accountId)"
      Beneficiaries:     "BeneficiariesRoute(accountId)"
      AtmLocator:        "AtmLocatorRoute — arg-less PLACEHOLDER route rendering PlaceholderScreen; accountId is dropped, no feature module exists"
      Product:           "ProductRoute(accountId) — triggers GET /accounts/{accountId}/product on mount"
      Party:             "AccountHolderRoute(accountId) — triggers GET /accounts/{accountId}/party on mount"
    party_rename_note: >-
      The Party chip's entry previously read "Push party route". The party SCREEN was renamed to
      account-holder in the 2026-07-28 reverse sync (screens/party/ no longer exists); only the
      enum MEMBER is still named Party in source. Route corrected here to AccountHolderRoute.
  - signature: "onBack -> popBackStack() returning to accounts"
    note: >-
      ui.yaml#implementation.removed_in_sync: "navigateBack action — back is a nav-host onBack
      callback".

error_cases:
  - id: TokenExpiredError
    http_status: 401
    user_message: Session expired. Please log in again.
    recoverable: true
    recovery_action: retry_load
  - id: ConsentWithdrawnError
    http_status: 403
    user_message: Access to this account has been withdrawn.
    recoverable: false
    recovery_action: navigate_back
  - id: AccountNotFoundError
    http_status: 404
    user_message: Account not found in your authorised account set.
    recoverable: false
    recovery_action: navigate_back
  - id: NetworkError
    http_status: null
    user_message: No network connection. Please check your connection and retry.
    recoverable: true
    recovery_action: retry_load
  - id: UnexpectedError
    http_status: null
    user_message: Something went wrong. Please try again.
    recoverable: true
    recovery_action: retry_load
