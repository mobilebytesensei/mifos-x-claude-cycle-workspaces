description: >-
  Single account detail — account metadata (Nickname, Identification, Currency, AccountSubType, Servicer), all balance
  types from OBCashBalance3, an Open Banking trust badge, and entry-point action chips to transactions, statements,
  standing orders, direct debits, scheduled payments, beneficiaries, ATM locator, product, and party. Empty state
  handles zero-balance accounts (e.g. Global Wallet). Error state is typed by HTTP code (401/403/404/network) with
  per-error recoverability.
