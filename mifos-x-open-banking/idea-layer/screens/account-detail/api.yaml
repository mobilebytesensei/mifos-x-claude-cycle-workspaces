sibling: api
schema_version: "4.0"
feature_id: account-detail

screen_id: account-detail

endpoints:
  - id: account-detail
    method: GET
    path: "/accounts/{AccountId}"
    response_dto: AccountDetail
    permission: ReadAccountsDetail
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns single account metadata — subtype, identification, currency, servicer."

  - id: balances
    method: GET
    path: "/accounts/{AccountId}/balances"
    response_dto: AccountBalanceLine
    permission: ReadBalances
    requires_auth: true
    path_params:
      AccountId: string
    notes: "Returns all balance types for the account (InterimAvailable, InterimBooked, OpeningBooked, etc.)."
