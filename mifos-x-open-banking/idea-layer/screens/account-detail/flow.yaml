sibling: flow
schema_version: "4.0"
feature_id: account-detail

feature: account-detail
flow_ref: consumer-banking

entry_points:
  - source: accounts
    label: "Tap account card"
    params: [accountId]
    source_binding: "accountsGraph(onNavigateToAccountDetail) -> AccountDetailRoute(accountId)"

# Reverse-synced 2026-07-28. Every chip transition below is resolved by the SAME
# host callback — onNavigateToChip(chip, accountId) — dispatched through
# navigateFromChip() in AuthenticatedNavbarNavigationScreen. They are not nine
# discrete ViewModel actions. Chip visibility is gated per account by
# AccountCapabilityRegistry via state.availableChips.
transitions:
  - from: account-detail
    to: accounts
    trigger: "Back button"
    source_binding: "onBack -> popBackStack()"
  - from: account-detail
    to: transactions
    trigger: "AccountDetailChip.Transactions"
    params: [accountId]
  - from: account-detail
    to: statements
    trigger: "AccountDetailChip.Statements"
    params: [accountId]
  - from: account-detail
    to: standing-orders
    trigger: "AccountDetailChip.StandingOrders"
    params: [accountId]
  - from: account-detail
    to: direct-debits
    trigger: "AccountDetailChip.DirectDebits"
    params: [accountId]
  - from: account-detail
    to: scheduled-payments
    trigger: "AccountDetailChip.ScheduledPayments"
    params: [accountId]
  - from: account-detail
    to: beneficiaries
    trigger: "AccountDetailChip.Beneficiaries"
    params: [accountId]
  - from: account-detail
    to: product
    trigger: "AccountDetailChip.Product"
    params: [accountId]
  - from: account-detail
    to: account-holder
    trigger: "AccountDetailChip.Party -> AccountHolderRoute"
    params: [accountId]

placeholder_transitions:
  # Ships and navigates, but lands on PlaceholderScreen("ATM locator").
  - from: account-detail
    to: atm-locator
    trigger: "AccountDetailChip.AtmLocator"
    params: []
    status: placeholder
    note: >-
      Arg-less route in cmp-navigation/placeholder. Corrected 2026-08-03: this said the
      atm-locator idea-layer screen had been removed in the 2026-07-28 reverse sync. It was
      not — screens/atm-locator/ is present, and as of 2026-08-02 it is back in_scope as
      planned work. Target changed from the raw route name "AtmLocatorRoute" to the
      atm-locator screen slug so the edge resolves like every other transition here.

internal_states:
  - id: loading
    description: "Account + balances stream has not yet emitted."
  - id: content
    description: "AccountDetailWithBalances loaded."
  - id: empty
    description: "Account loaded; balances empty (e.g. Global Wallet sub-account)."
  - id: error
    description: "Stream failed."
