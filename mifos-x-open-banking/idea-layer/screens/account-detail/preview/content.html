<style>
  :root {
    --primary: #266489; --on-primary: #FFFFFF; --primary-container: #C9E6FF; --on-primary-container: #004B6F;
    --secondary: #50606E; --secondary-container: #D3E5F5; --on-secondary-container: #384956; --tertiary: #64597B;

    --appbar-h: 64px; --navbar-h: 80px;

  .header-card__id { font-family: var(--font-mono); font-size: var(--fs-body-medium); font-variant-numeric: tabular-nums; letter-spacing: -.01em; margin: var(--sp-xs) 0 0; }

  .row + .row { border-top: 1px solid var(--outline-variant); }
  .row__label { font-size: var(--fs-body-medium); color: var(--on-surface-variant); margin: 0; }
  .row__value { font-family: var(--font-mono); font-size: var(--fs-body-medium); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--on-surface); margin: 0; white-space: nowrap; }

  .chip-row { display: flex; gap: var(--sp-sm); overflow-x: auto; padding-bottom: var(--sp-xs); scrollbar-width: none; }

  .nav-chip { display: inline-flex; align-items: center; gap: var(--sp-sm); height: 40px; padding: 0 var(--sp-lg); border: 1px solid var(--outline-variant); border-radius: var(--r-small); background: var(--surface-container-low); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body-medium); font-weight: 500; white-space: nowrap; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .nav-item__indicator { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 32px; border-radius: var(--r-full); }

<div class="screen" data-screen="account-detail" data-state="content">

  <header class="top-app-bar" data-component-type="top_app_bar" data-component-id="account_detail_top_app_bar">

      <p class="header-card__nick">Everyday Current</p>
      <p class="header-card__id">40-05-15 12345678</p>
      <p class="header-card__meta"><span>GBP</span><span>MIDLGB2105V</span><span>Last updated 28 Jun 2026, 18:30</span></p>
    </section>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-3.5-2-3.5 2-3.5-2L5 21V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h4"/></svg>Transactions</button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-1.6 5.3"/><path d="M20 5v6h-6"/></svg>Standing Orders</button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>Direct Debits</button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 11h5"/></svg>Beneficiaries</button>

      <button class="nav-chip" type="button" data-component-id="chip_party" data-nav-to="party" data-nav-type="push" data-nav-arg-accountid="40051512345678" aria-label="View account holder party details for this account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>Account Holder</button>

    <button class="nav-item" type="button" aria-current="page" data-nav-to="accounts" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/></svg></span>Accounts</button>
