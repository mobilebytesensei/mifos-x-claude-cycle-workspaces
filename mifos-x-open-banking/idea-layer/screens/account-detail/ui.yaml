known_gaps:
  - id: AD-G1
    severity: medium
    description: "'Nearby ATMs' chip routes to AtmLocatorRoute, a PlaceholderScreen('ATM locator') in cmp-navigation BankingDestinations — dead-end placeholder, always visible, accountId dropped (RULE-IMPL-DEAD-CLICKABLE-001 class)."
  - id: AD-G2
    severity: medium
    description: "TokenExpired is marked recoverable and its copy says 'Please log in again', but Retry only refreshes the two stores — there is no re-auth navigation (LoginRenewRoute) from this screen."
    spec_status: specified   # idea-layer now declares TokenExpired → onNavigateToLoginRenew, retry:false (FR-049); source still pending /implement
  - id: AD-G3
    severity: low
    description: "A combined ScreenState.Empty (e.g. detail store returns nothing) maps to AccountDetailUiState.Loading, so the user sees an indefinite spinner instead of an empty/error state."
    spec_status: specified   # idea-layer now maps combined Empty → Error(AccountNotFound) (FR-049 / DEF-008); source still pending /implement
  - id: AD-G8
    severity: medium
    description: "403 ConsentWithdrawn shows a message with no next step — no route to the consent list. Spec now declares onNavigateToConsents → ConsentListRoute (FR-049 / DEF-008)."
    spec_status: specified
  - id: AD-G4
    severity: low
    description: "Product and Party chips are never capability-gated (only 5 endpoints are in the gated map), so they show even when the bank has refused /product or /party for this account."
  - id: AD-G5
    severity: low
    description: "Product chip reuses the Statements icon (Icons.Outlined.Description) — two adjacent rows share the same glyph."
  - id: AD-G6
    severity: low
