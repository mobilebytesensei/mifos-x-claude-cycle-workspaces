  - feature_account_detail_header_accessibility
  - feature_account_detail_description_label
  - feature_account_detail_section_balances
  - feature_account_detail_balances_list_accessibility
  - feature_account_detail_balances_empty_title
  - feature_account_detail_balances_empty_body
  - feature_account_detail_balances_empty_accessibility
  - feature_account_detail_section_explore
  - feature_account_detail_chip_row_accessibility
  - feature_account_detail_error_token_expired
  - feature_account_detail_error_consent_withdrawn
  - feature_account_detail_error_not_found
  - feature_account_detail_error_network
  - feature_account_detail_error_unexpected
  - feature_account_detail_chip_transactions
  - feature_account_detail_chip_statements
  - feature_account_detail_chip_standing_orders
  - feature_account_detail_chip_direct_debits
  - feature_account_detail_chip_scheduled
  - feature_account_detail_chip_beneficiaries
  - feature_account_detail_chip_atm
  - feature_account_detail_chip_product
  - feature_account_detail_chip_party
  - feature_account_detail_action_sign_in_again
  - feature_account_detail_action_view_consents

