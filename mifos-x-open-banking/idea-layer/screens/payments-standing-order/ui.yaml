known_gaps:
  - id: SO-GAP-1
    severity: should
    requirement_ref: FR-047
    description: "onNavigateToConsents is wired as {} in AuthenticatedNavHostScreen.standingOrderGraph — the 'View consents' recovery on ConsentRevoked does nothing."
  - id: SO-GAP-2
    severity: should
    description: "StandingOrderAction.RetryLoad is handled (accountsOverviewRepository.refresh) but never dispatched. The error page's Retry dispatches RetryStaging, so after an accounts-load failure (NoNetwork / Error) with an unfilled form, buildDraft() returns null and Retry does nothing."
  - id: SO-GAP-3
    severity: should
    description: "Accounts ScreenState.Empty renders Loading (renderForm maps Empty and Loading together) — a PSU with no payment-capable accounts sees a spinner indefinitely instead of an empty state."
  - id: SO-GAP-4
    severity: could
    description: "Optional 'different ongoing amount' and 'different last payment' inputs are not validated; an unparseable value is silently dropped (null) from the draft."
  - id: SO-GAP-5
    severity: could
    description: "No way to amend or cancel a standing order in-app (stated by the irreversible notice); there is also no consent revoke for the staged mandate consent (bank answers 405)."
  - id: SO-GAP-6
    severity: could
    description: "StandingOrderTestTags declares SUCCESS_STATE / SUCCESS_AMOUNT / SUCCESS_STATUS_CHIP / SUCCESS_PAYMENT_ID / VIEW_PAYMENT_STATUS_BUTTON / CANCEL_BUTTON with no composable using them — the success outcome lives in payment-consent → payment-status, so these tags are dead."
