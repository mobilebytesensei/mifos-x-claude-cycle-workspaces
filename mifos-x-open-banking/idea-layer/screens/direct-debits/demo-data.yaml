# Error fixture scenarios (used by TC-DD-004, TC-DD-006, TC-DD-007, TC-DD-008)
error_fixtures:
  - scenario_id: token_expired_401
    error_id: TokenExpired
    http_status: 401
    userMessage: "Session expired. Please log in again."
    isRetriable: true

  - scenario_id: consent_revoked_403
    error_id: ConsentRevoked
    http_status: 403
    userMessage: "Account access consent has been revoked. Re-authorise in Consents."
    isRetriable: false

  - scenario_id: rate_limited_429
    error_id: RateLimited
    http_status: 429
    userMessage: "Too many requests. Please wait a moment and try again."
    isRetriable: true

  - scenario_id: network_error
    error_id: NetworkError
    http_status: null
    userMessage: "No network connection. Check your connection and retry."
    isRetriable: true

# ── Per-state fixtures (added 2026-08-02 via /idea-sync) ─────────────────────
# ui.yaml declares states: [loading, content, empty, unsupported, error]. error_fixtures above
# covered `error` well; `empty` and `unsupported` had nothing.
states:
  - scope: content
    direct_debits: all
    activeCount: 3
    inactiveCount: 1

  - scope: loading
    direct_debits: all

  - scope: empty
    direct_debits: []
    activeCount: 0
    inactiveCount: 0
    message: "No direct debits."
    detail: "Direct debits set up with companies you pay will appear here."
    _counts_must_zero: "The Active/Inactive summary is derived from the list — it has to zero with it or the header contradicts the body."

  - scope: unsupported
    direct_debits: []
    message: "Your bank does not support viewing direct debits here."
    detail: "You can still see them in your bank's own app."
    _why_distinct_from_empty: >-
      OBIE makes the direct-debits resource optional, so a 404 means "not readable", not "none
      exist". Telling a customer with four live mandates that they have none would be a false
      statement about money leaving their account. Same reasoning as standing-orders and
      scheduled-payments, which share this state.

  - scope: error
    error_fixtures: all
    _cross_ref: "Full per-scenario error shapes are in error_fixtures above — this entry just binds the state to them."
