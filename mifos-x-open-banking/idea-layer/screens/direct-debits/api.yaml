sibling: api
schema_version: "4.0"
feature_id: direct-debits

screen_id: direct-debits

endpoints:
  - id: direct-debits-list
    method: GET
    path: "/accounts/{AccountId}/direct-debits"
    response_dto: DirectDebitsSummary
    permission: ReadDirectDebits
    requires_auth: true
    auth_scheme: oauth2-fapi-1.0-advanced
    path_params:
      AccountId:
        type: string
        description: "OBIE AccountId obtained from GET /accounts; matches the active consent scope."
    response_codes:
      200:
        description: "Success — OBIE Data.DirectDebit array (may be empty), mapped to DirectDebitsSummary"
        dto: DirectDebitsSummary
      400:
        description: "Bad request — malformed AccountId"
      401:
        description: "Unauthorised — access token expired or missing; triggers TokenExpired error flow"
      403:
        description: "Forbidden — ReadDirectDebits permission not in active consent; triggers ConsentRevoked error flow"
      429:
        description: "Too many requests — HSBC rate-limit exceeded; triggers RateLimited error flow with retry"
      500:
        description: "HSBC server error — transient; treat as NetworkError for retry purposes"
    notes: "ReadDirectDebits must be declared in the AIS consent permissions list (POST /account-access-consents). Inactive mandates are included in the response. No pagination in OBIE AIS v4.0 direct-debits endpoint; full list returned in one response."

# Client-side transforms applied to the direct-debits-list response in
# data-flow.yaml#post_transform. Declared here so data-flow `op:` refs resolve
# (idea-graph-audit OP-1 matches op values against operations[].operation).
operations:
  - operation: sort
    kind: client_transform
    description: "Order the DirectDebit array by DirectDebitStatusCode (Active first, Inactive last)."
  - operation: count_where
    kind: client_transform
    description: "Count DirectDebit elements matching a predicate — used for activeCount / inactiveCount chips."
