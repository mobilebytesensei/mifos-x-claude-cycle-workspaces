sibling: tests
schema_version: "4.0"
feature_id: direct-debits

screen_id: direct-debits

scenarios:
  - id: TC-DD-001
    description: "Direct debits list loads and renders all mandates including inactive, with correct status variants"
    priority: P0
    state: content
    given: "Valid PSU access token; HSBC sandbox returns 4 direct debits for account 40051512345678 (3 Active, 1 Inactive)"
    when: "Screen mounts with accountId=40051512345678"
    then:
      - "Four direct debit cards render (British Gas, Vodafone, Aviva Insurance, TV Licensing) sorted Active-first"
      - "Active mandates show primary badge; TV Licensing shows outline badge (not secondary)"
      - "Summary chips show 'Active (3)' and 'Inactive (1)'"
      - "Each card shows previous payment amount, date, and mandate identifier"
      - "Amount text is neutral color (not red/error)"
      - "Data matches demo-data values"

  - id: TC-DD-002
    description: "Skeleton loading shown during direct debits fetch"
    priority: P0
    state: loading
    given: "Slow network; API call in flight"
    when: "Screen mounts"
    then:
      - "Skeleton list_card placeholder (4 items) visible, not progress spinner"
      - "Direct debits list and chip group not rendered"

  - id: TC-DD-003
    description: "Empty state when no direct debits registered for account"
    priority: P1
    state: empty
    given: "HSBC returns empty Data.DirectDebit[] for the account"
    when: "Screen mounts"
    then:
      - "Empty state renders with subscriptions icon"
      - "Title and body from i18n keys (direct_debits.empty_title / direct_debits.empty_body)"
      - "No list or chip group rendered"

  - id: TC-DD-004
    description: "401 token-expired error shows message and Retry button"
    priority: P0
    state: error
    given: "Access token is expired; direct-debits endpoint returns 401"
    when: "Screen mounts"
    then:
      - "Error state renders with error_outline icon"
      - "error.userMessage = 'Session expired. Please log in again.'"
      - "Retry button visible (error.isRetriable = true)"
      - "Tapping Retry re-triggers direct_debits_load"

  - id: TC-DD-005
    description: "Back button navigates to account-detail"
    priority: P1
    state: content
    given: "Direct debits screen rendered for account 40051512345678, reached from the account-detail DirectDebits chip"
    when: "User taps back button in any state"
    then:
      - "Navigates to account-detail screen with accountId=40051512345678"

  - id: TC-DD-006
    description: "403 consent-revoked error shows message without Retry button"
    priority: P1
    state: error
    given: "ReadDirectDebits permission not in active consent; endpoint returns 403"
    when: "Screen mounts"
    then:
      - "Error state renders with error.userMessage = 'Account access consent has been revoked. Re-authorise in Consents.'"
      - "Retry button NOT visible (error.isRetriable = false; retry cannot help — consent must be re-authorised)"

  - id: TC-DD-007
    description: "429 rate-limited error shows message with Retry button"
    priority: P1
    state: error
    given: "HSBC AIS rate limit exceeded; endpoint returns 429"
    when: "Screen mounts"
    then:
      - "Error state renders with error.userMessage = 'Too many requests. Please wait a moment and try again.'"
      - "Retry button visible (error.isRetriable = true)"
      - "Tapping Retry re-triggers direct_debits_load"

  - id: TC-DD-008
    description: "Network error shows message with Retry button"
    priority: P1
    state: error
    given: "Device is offline or DNS fails; IOException thrown by ktorfit"
    when: "Screen mounts"
    then:
      - "Error state renders with error.userMessage = 'No network connection. Check your connection and retry.'"
      - "Retry button visible (error.isRetriable = true)"

  - id: TC-DD-009
    description: "i18n coverage — all static labels come from strings keys"
    priority: P2
    state: content
    given: "Default locale (en-GB)"
    when: "Screen renders in content state"
    then:
      - "Top app bar title resolves from strings.direct_debits.title = 'Direct Debits'"
      - "Back button accessible name resolves from strings.direct_debits.back_a11y"
      - "Last-collected prefix resolves from strings.direct_debits.last_collected_prefix"
      - "Mandate prefix resolves from strings.direct_debits.mandate_prefix"
      - "Chip labels resolve from strings.direct_debits.active_count_label / inactive_count_label"

  - id: TC-DD-010
    description: "Unsupported state when servicer does not expose direct debits for this account type"
    priority: P1
    state: unsupported
    given: "Account type does not support the direct-debits resource; capability registry refuses the call before any network request is made, emitting DirectDebitsUiState.Unsupported(message)"
    when: "Screen mounts with accountId for an account whose type excludes direct-debits capability"
    then:
      - "unsupported_direct_debits component renders (test tag directDebits:unsupportedState)"
      - "Title resolves from strings.direct_debits.unsupported_title ('Direct debits unavailable')"
      - "Body shows the dynamic uiState.message string supplied by the capability registry — not a static i18n key"
      - "No retry button rendered — the capability is absent, not a retriable network failure"
      - "No mandate list or summary chips rendered"
      - "Component accessibility label resolves from strings.direct_debits.unsupported_a11y"
