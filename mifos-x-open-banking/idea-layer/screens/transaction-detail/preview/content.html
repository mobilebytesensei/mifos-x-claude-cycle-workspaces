<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transaction — content</title>
<style>
  :root {
    --primary: #266489; --on-primary: #FFFFFF; --primary-container: #C9E6FF; --on-primary-container: #004B6F;
    --secondary: #50606E; --secondary-container: #D3E5F5; --on-secondary-container: #384956; --tertiary: #64597B;
    --background: #F7F9FF; --surface: #F7F9FF;
    --surface-container-low: #F1F4F9; --surface-container: #EBEEF3; --surface-container-high: #E5E8ED;
    --on-surface: #181C20; --on-surface-variant: #41474D;
    --outline: #72787E; --outline-variant: #C1C7CE; --error: #BA1A1A;
    --font-brand: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-body: Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs-display-small: 2.25rem; --fs-title-large: 1.375rem; --fs-title-medium: 1rem; --fs-title-small: 0.875rem;
    --fs-body-medium: 0.875rem; --fs-label-medium: 0.75rem; --fs-label-small: 0.6875rem;
    --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 16px; --sp-xl: 24px; --sp-2xl: 32px;
    --r-small: 8px; --r-medium: 12px; --r-large: 16px; --r-full: 9999px;
    --el-0: none;
    --el-1: 0 1px 2px rgba(24,28,32,.08), 0 1px 3px rgba(24,28,32,.06);
    --el-2: 0 1px 2px rgba(24,28,32,.10), 0 2px 6px rgba(24,28,32,.08);
    --appbar-h: 64px; --navbar-h: 80px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #95CDF7; --on-primary: #00344E; --primary-container: #004B6F; --on-primary-container: #C9E6FF;
      --secondary: #B7C9D9; --secondary-container: #384956; --on-secondary-container: #D3E5F5; --tertiary: #CFC0E8;
      --background: #101417; --surface: #101417;
      --surface-container-low: #181C20; --surface-container: #1C2024; --surface-container-high: #262A2E;
      --on-surface: #E0E3E8; --on-surface-variant: #C1C7CE;
      --outline: #8B9198; --outline-variant: #41474D; --error: #FFB4AB;
      --el-1: 0 1px 2px rgba(0,0,0,.40), 0 1px 3px rgba(0,0,0,.30);
      --el-2: 0 1px 2px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--background); color: var(--on-surface); font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .screen { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  .top-app-bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-xs); height: var(--appbar-h); padding: 0 var(--sp-xs); background: var(--surface); color: var(--on-surface); }
  .top-app-bar__title { font-family: var(--font-brand); font-size: var(--fs-title-large); font-weight: 500; line-height: 1.3; margin: 0; padding-left: var(--sp-xs); }
  .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; min-width: 48px; min-height: 48px; border: 0; padding: 0; border-radius: var(--r-full); background: transparent; color: var(--on-surface); cursor: pointer; }
  .icon-button:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  .icon-button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .icon-button svg { width: 24px; height: 24px; display: block; }

  .content { flex: 1 1 auto; display: flex; flex-direction: column; gap: var(--sp-lg); padding: var(--sp-lg); padding-bottom: calc(var(--navbar-h) + var(--sp-xl)); max-width: 720px; width: 100%; margin: 0 auto; }

  .hero { display: flex; flex-direction: column; align-items: center; gap: var(--sp-sm); padding: var(--sp-2xl) var(--sp-lg); text-align: center; }
  .hero__amount { font-family: var(--font-mono); font-size: var(--fs-display-small); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--error); margin: 0; }
  .hero__currency { font-size: var(--fs-label-medium); letter-spacing: .06em; color: var(--on-surface-variant); margin: 0; }
  .hero__merchant { font-family: var(--font-brand); font-size: var(--fs-title-medium); font-weight: 500; color: var(--on-surface); margin: var(--sp-xs) 0 0; }
  .status-chip { display: inline-flex; align-items: center; gap: var(--sp-xs); height: 28px; padding: 0 var(--sp-md); border-radius: var(--r-full); background: var(--primary-container); color: var(--on-primary-container); font-size: var(--fs-label-small); font-weight: 500; letter-spacing: .02em; margin-top: var(--sp-sm); }
  .status-chip svg { width: 15px; height: 15px; display: block; }
  .divider { height: 1px; background: var(--outline-variant); border: 0; margin: 0; }

  .section-header { font-size: var(--fs-title-small); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--on-surface-variant); margin: 0 0 calc(-1 * var(--sp-sm)) var(--sp-xs); }
  .surface-list { display: flex; flex-direction: column; background: var(--surface-container-low); border-radius: var(--r-medium); box-shadow: var(--el-1); overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-lg); padding: var(--sp-md) var(--sp-lg); min-height: 56px; }
  .row + .row { border-top: 1px solid var(--outline-variant); }
  .row__label { font-size: var(--fs-body-medium); color: var(--on-surface-variant); margin: 0; }
  .row__value { font-size: var(--fs-body-medium); color: var(--on-surface); margin: 0; text-align: right; overflow-wrap: anywhere; }
  .row__value--mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .row__right { display: flex; align-items: center; gap: var(--sp-sm); min-width: 0; }

  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: space-around; height: calc(var(--navbar-h) + env(safe-area-inset-bottom, 0px)); padding: var(--sp-md) var(--sp-sm) calc(var(--sp-md) + env(safe-area-inset-bottom, 0px)); background: var(--surface-container); box-shadow: var(--el-2); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: var(--sp-xs); flex: 1 1 0; min-width: 0; min-height: 48px; border: 0; padding: 0; background: transparent; color: var(--on-surface-variant); cursor: pointer; font-family: var(--font-body); font-size: var(--fs-label-medium); font-weight: 500; }
  .nav-item__indicator { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 32px; border-radius: var(--r-full); }
  .nav-item svg { width: 24px; height: 24px; display: block; }
  .nav-item[aria-current="page"] { color: var(--primary); }
  .nav-item[aria-current="page"] .nav-item__indicator { background: var(--secondary-container); }
  @media (min-width: 600px) { .content { padding: var(--sp-xl); } }
</style>
</head>
<body>
<div class="screen" data-screen="transaction-detail" data-state="content">

  <header class="top-app-bar" data-component-type="top_app_bar" data-component-id="txn_detail_top_app_bar">
    <button class="icon-button" type="button" data-component-id="back_button" data-nav-to="transactions" data-nav-type="back" aria-label="Navigate back to Transactions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
    <h1 class="top-app-bar__title">Transaction</h1>
  </header>

  <main class="content">

    <section class="hero" data-component-type="stack" data-component-id="amount_hero_section">
      <p class="hero__amount" data-component-id="amount_hero_value" aria-label="Amount minus 42.17 pounds">−£42.17</p>
      <p class="hero__currency">GBP</p>
      <p class="hero__merchant" aria-label="Merchant Tesco Stores">Tesco Stores</p>
      <span class="status-chip" data-component-type="badge" data-component-id="status_badge" aria-label="Transaction status Booked">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        Booked
      </span>
    </section>

    <hr class="divider" data-component-type="divider" data-component-id="header_divider">

    <h2 class="section-header" data-component-id="details_card_title">Details</h2>
    <section class="surface-list" data-component-type="card" data-component-id="details_card">
      <div class="row" data-component-id="detail_booking_date_row"><p class="row__label">Booking date</p><p class="row__value row__value--mono">2026-06-26T11:22:00Z</p></div>
      <div class="row" data-component-id="detail_value_date_row"><p class="row__label">Value date</p><p class="row__value row__value--mono">2026-06-26T11:22:00Z</p></div>
      <div class="row" data-component-id="detail_category_row"><p class="row__label">Category</p><p class="row__value">Groceries</p></div>
      <div class="row" data-component-id="detail_mcc_row"><p class="row__label">Merchant category code</p><p class="row__value row__value--mono">5411</p></div>
      <div class="row" data-component-id="detail_balance_after_row"><p class="row__label">Balance after</p><p class="row__value row__value--mono">£447.63</p></div>
      <div class="row" data-component-id="detail_reference_row">
        <p class="row__label">Reference</p>
        <span class="row__right">
          <p class="row__value">TESCO STORES 3476 LONDON</p>
          <button class="icon-button" type="button" data-component-type="icon_button" data-component-id="copy_reference_icon"
                  data-action-id="copy_to_clipboard" aria-label="Tap to copy reference" style="width:40px;height:40px;min-width:40px;min-height:40px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button>
        </span>
      </div>
      <div class="row" data-component-id="detail_bank_code_row"><p class="row__label">Bank code</p><p class="row__value">DR · issued by HSBC</p></div>
    </section>

  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" type="button" data-nav-to="home" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Home</button>
    <button class="nav-item" type="button" aria-current="page" data-nav-to="accounts" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 11h20"/></svg></span>Accounts</button>
    <button class="nav-item" type="button" data-nav-to="payments" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></span>Pay</button>
    <button class="nav-item" type="button" data-nav-to="settings" data-nav-type="tab"><span class="nav-item__indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</button>
  </nav>

</div>
