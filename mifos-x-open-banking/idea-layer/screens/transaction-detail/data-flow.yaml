sibling: data-flow
schema_version: "2.1.0"
feature_id: transaction-detail

screen_id: transaction-detail

cache_strategy: cache-first
cache_notes: >
  The transactions list fetched on the transactions screen is reused here. If the
  list is already in-memory (ViewModel scope or SavedStateHandle), no network call
  is issued — the VM filters by transactionId client-side. A fresh fetch is only
  triggered when the cache is absent (cold start of this screen, process death) or
  when RetryLoad is explicitly invoked on error.

params:
  - name: transactionId
    type: string
    required: true
    source: route
  - name: accountId
    type: string
    required: true
    source: route

on_mount:
  - trigger: transaction_detail_load
    description: >
      Resolve transaction from cache (transactions screen result set) or fetch
      GET /accounts/{AccountId}/transactions and filter by transactionId client-side.
      Result mapped to TransactionDetailUiModel including client-derived Category
      from MCC lookup table.
    steps:
      - call: transactions
        path_params:
          AccountId: "{params.accountId}"
        cache_key: "transactions_{params.accountId}"
        cache_ttl_seconds: 300
        store_as: transactions
        client_filter:
          field: TransactionId
          value: "{params.transactionId}"
          store_single_as: transaction
          on_empty: empty
    on_loading: loading
    on_success: content
    on_empty: empty
    on_error: error

on_user_action:
  - trigger: retry_load
    re_runs: [transaction_detail_load]
    guard: "{error.recoverable == true}"
    notes: "Only re-triggered when error.recoverable; non-recoverable errors show navigate_back button instead"

  - trigger: copy_to_clipboard
    description: >
      Copy transaction.TransactionInformation to system clipboard via platform
      ClipboardManager. Emits a one-shot snackbar confirmation after write.
    side_effect: clipboard_write
    snackbar: "{strings.transaction_detail_copy_success}"
