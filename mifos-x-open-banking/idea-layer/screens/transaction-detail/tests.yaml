sibling: tests
schema_version: "4.0"
feature_id: transaction-detail

screen_id: transaction-detail

scenarios:
  - id: TC-TXNDTL-001
    description: "Transaction detail renders full Tesco Stores debit transaction (Booked)"
    state: content
    fixture: transaction_debit
    given: "Valid PSU access token; transactionId=TX-20260626-0001 in cached list for account 40051512345678"
    when: "Screen mounts with transactionId=TX-20260626-0001 and accountId=40051512345678"
    then:
      - "Amount header shows '-£42.17' in error colour (CreditDebitIndicator=Debit)"
      - "Currency meta label shows 'GBP' in onSurfaceVariant style"
      - "Merchant name shows 'Tesco Stores'"
      - "Status badge shows 'Booked' with primaryContainer colour"
      - "Header divider is visible"
      - "Detail card header shows 'Details' in titleSmall"
      - "Booking date row shows '2026-06-26T11:22:00Z'"
      - "Value date row shows '2026-06-26T11:22:00Z'"
      - "Category row shows 'Groceries'"
      - "MCC row shows '5411' (visible — MerchantCategoryCode present)"
      - "Balance after shows '£447.63'"
      - "Reference row shows 'TESCO STORES 3476 LONDON' with copy icon"
      - "Bank code row shows 'DR · HSBC'"

  - id: TC-TXNDTL-002
    description: "Credit transaction renders amount in primary colour; MCC row hidden when null"
    state: content
    fixture: transaction_credit
    given: "transactionId=TX-20260625-0001 (ACME LTD salary credit, MerchantCategoryCode null) for account 40051512345678"
    when: "Screen mounts with that transactionId"
    then:
      - "Amount header shows '+£2400.00' in primary colour (CreditDebitIndicator=Credit)"
      - "Currency meta label shows 'GBP'"
      - "Merchant name shows 'ACME LTD'"
      - "Status badge shows 'Booked'"
      - "Category row shows 'Salary'"
      - "MCC row is NOT visible (MerchantCategoryCode is null)"
      - "Balance after shows '£2847.63'"
      - "Reference row shows 'SALARY JUN ACME LTD' with copy icon"
      - "Bank code row shows 'CR · HSBC'"

  - id: TC-TXNDTL-003
    description: "Loading state shown while transaction resolves"
    state: loading
    given: "Slow network; API call in flight"
    when: "Screen mounts with any valid transactionId"
    then:
      - "Circular progress indicator visible"
      - "Amount header not rendered"
      - "Currency meta not rendered"
      - "Detail card not rendered"
      - "Error state not rendered"

  - id: TC-TXNDTL-004
    description: "Error state shown when transaction not found in list (non-recoverable)"
    state: error
    fixture: error_not_found
    given: "transactionId not present in returned OBReadTransaction6 list"
    when: "Screen mounts with unknown transactionId"
    then:
      - "Error empty_state renders with error_outline icon"
      - "Error title shows 'Could not load transaction'"
      - "Error body shows 'Transaction not found. It may have been removed or the reference is invalid.'"
      - "Retry button NOT visible (error.recoverable=false)"
      - "Go back button IS visible"
      - "Tapping Go back navigates to transactions screen"

  - id: TC-TXNDTL-005
    description: "Back button navigates to transactions screen"
    state: content
    fixture: transaction_debit
    given: "Transaction detail fully loaded"
    when: "User taps back button"
    then:
      - "Navigates back to transactions screen retaining accountId in back-stack"

  - id: TC-TXNDTL-006
    description: "401 TokenExpired shows error with Retry button (recoverable)"
    state: error
    fixture: error_token_expired
    given: "PSU access token has expired; API returns 401"
    when: "Screen mounts or retry is attempted"
    then:
      - "Error empty_state renders with error_outline icon"
      - "Error body shows 'Session expired. Please log in again.'"
      - "Retry button IS visible (error.recoverable=true)"
      - "Go back button NOT visible"
      - "Tapping Retry re-triggers transaction_detail_load"

  - id: TC-TXNDTL-007
    description: "403 ConsentWithdrawn shows error with Go Back button only (non-recoverable)"
    state: error
    fixture: error_consent_withdrawn
    given: "PSU has revoked consent; API returns 403"
    when: "Screen mounts"
    then:
      - "Error body shows 'Access to transactions has been withdrawn.'"
      - "Retry button NOT visible (error.recoverable=false)"
      - "Go back button IS visible"
      - "Tapping Go back navigates to transactions screen"

  - id: TC-TXNDTL-008
    description: "Copy reference writes TransactionInformation to clipboard"
    state: content
    fixture: transaction_debit
    given: "Transaction detail fully loaded; reference row visible with copy icon"
    when: "User taps copy icon on reference row"
    then:
      - "copy_to_clipboard action fires with value 'TESCO STORES 3476 LONDON'"
      - "System ClipboardManager receives the string"
      - "Snackbar confirmation appears"

  - id: TC-TXNDTL-009
    description: "Pending transaction shows secondaryContainer status badge and future ValueDateTime"
    state: content
    fixture: transaction_pending
    given: "transactionId=TX-20260629-0001 (Pret A Manger, Pending pre-auth)"
    when: "Screen mounts with that transactionId"
    then:
      - "Status badge shows 'Pending' with secondaryContainer colour"
      - "Amount header shows '-£6.45' in error colour"
      - "ValueDateTime differs from BookingDateTime (2026-06-30 vs 2026-06-29)"
      - "MCC row shows '5812'"

  - id: TC-TXNDTL-010
    description: "Empty state shown when transactionId absent in a successful OBReadTransaction6 response"
    state: empty
    priority: critical
    fixture: transaction_debit
    given: "OBReadTransaction6 fetch succeeds (HTTP 200) but returned list contains no transaction matching the route-param transactionId"
    when: "Screen mounts with a transactionId not present in the result set"
    then:
      - "transaction_empty_state component renders (state_binding: [empty])"
      - "receipt_long icon visible"
      - "Title shows 'Transaction not found'"
      - "Body shows 'This transaction is no longer available. It may have been removed or your consent has expired.'"
      - "transaction_empty_back_button (outlined) is visible"
      - "No Retry button rendered (this is not an error state)"
      - "Error state empty_state component is NOT rendered"
      - "Tapping Go back navigates to transactions screen (target: transactions)"

  - id: TC-TXNDTL-011
    description: "Network error shows recoverable error state with Retry button"
    state: error
    priority: high
    fixture: error_network
    given: "Device offline or upstream network unreachable when screen mounts"
    when: "Screen mounts with any valid transactionId and no cached list available"
    then:
      - "error_state empty_state renders with error_outline icon"
      - "Error body shows 'No network connection. Please check your connection and retry.'"
      - "Retry button IS visible (error.recoverable=true)"
      - "Go back button NOT visible"
      - "Tapping Retry re-triggers transaction_detail_load"
      - "Empty state component is NOT rendered"
