sibling: api
schema_version: "4.0"
feature_id: transaction-detail

screen_id: transaction-detail

endpoints:
  - id: transactions
    method: GET
    path: "/accounts/{AccountId}/transactions"
    response_dto: TransactionDetail
    permission: ReadTransactionsDetail
    requires_auth: true
    path_params:
      AccountId: string
    notes: >
      OBIE v4.0 AIS provides no single-transaction endpoint. The client resolves
      the transaction by filtering the cached or freshly-fetched list by
      transactionId passed as a route param. If the list is already cached from
      the transactions screen, no network call is made.

# Moved verbatim from docs.yaml 2026-07-31 (CROSS_LEAK repair — sibling-layout.json
# assigns `cache_strategy` to the api sibling, capability_gate has_offline_cache).
cache_strategy: cache-first
