sibling: api
schema_version: "4.0"
feature_id: transaction-detail
_source: source_analysis

api:
  - id: get_account_transactions
    function: "Aisp.getTransactions(accountId)"
    method: GET
    path: "/v4.0/aisp/accounts/{AccountId}/transactions"
    description: >-
      OBIE v4.0 read transactions (OBReadTransaction6). The detail screen fetches the account's transaction list and
      resolves the requested TransactionId client-side; there is no per-transaction endpoint in OBIE AIS.
    auth: "PSU bearer token (Ktor Auth plugin) + mTLS transport cert; x-fapi-financial-id header via client defaults"
    params:
      AccountId: { type: String, required: true, source: nav_params.accountId }
    response:
      dto: TransactionsResponse
      items: "Data.Transaction[] → Transaction"
      nested_dtos: [Amount, Balance, BankTransactionCode, ProprietaryBankTransactionCode, MerchantDetails, CreditorAccount, DebtorAccount, Links, Meta]
      domain_mapper: "TransactionDetailMapper.toTransactionDetails(accountId) → List<TransactionDetail>"
    pagination:
      type: cursor
      cursor_field: Links.Next
      consumed: true    # DEF-004: follow Links.Next page by page until the transactionId is found or no next page remains (source still page-1 only — ui.yaml TD-GAP-1)
      strategy: walk_until_match
      stop_on: [match_found, next_absent, page_error]
    cache:
      strategy: memory-only
      ttl: null
      offline: none
      note: "Store5 memory store, no Room SourceOfTruth — consent can be withdrawn at any moment"
    errors:
      401: "Unauthorized → TokenExpired (no retry; route LoginRenewRoute — FR-049)"
      403: "Forbidden → ConsentWithdrawn (no retry; route ConsentListRoute — FR-049)"
      429: "RateLimited → RateLimited (retry — FR-040)"
      5xx: "Server → Unexpected (retry)"
      network: "NetworkError.Network → Network (retry)"
