vm_actions:
  - name: SelectExecutionDate
    signature: 'fun selectExecutionDate(date: LocalDate)'
    state_mutations:
      - "content.requestedExecutionDate = date"
      - "content.dateProblem = validateDate(date)   # tomorrow <= date <= today+365"
    side_effects: []
    notes: >-
      Validation is local and total — the picker's bounds already prevent an invalid date, and
      this is the belt-and-braces guard for a programmatic path.

  - name: ConfirmAndStageConsent
    signature: 'suspend fun confirmAndStageConsent()'
    state_mutations:
      - uiState = Submitting(StagingConsent)
      - uiState = Submitting(AwaitingAuthorisation, consentId = response.Data.ConsentId)
    side_effects:
      - "POST /domestic-scheduled-payment-consents with Data.Permission 'Create'"
      - "Attaches x-jws-signature and x-idempotency-key"
    error_handling:
      on_400_U004: uiState = Error(MissingRequiredField)
      on_400_U003: uiState = Error(DateInPast)
      on_400_U002: uiState = Error(DateOutOfRange)
      on_400_U019: uiState = Error(SignatureMissing)

  - name: SubmitPayment
    signature: 'suspend fun submitPayment(consentId: String)'
    state_mutations:
      - uiState = Submitting(SubmittingPayment)
      - "uiState = Success(paymentId = response.Data.DomesticScheduledPaymentId, status = PDNG)"
    side_effects:
      - "POST /domestic-scheduled-payments echoing the AUTHORISED consent's Initiation"
    notes: "No funds-confirmation call precedes this — the family has no such endpoint."

error_cases:
  - { id: MissingRequiredField, trigger: "400 U004", user_message: '{strings.error.payment.missing_field}', recovery: "Implementation fault — Permission and date are always sent." }
  - { id: DateInPast, trigger: "400 U003", user_message: '{strings.error.payment.date_in_past}', recovery: "Return to the date step." }
  - { id: DateOutOfRange, trigger: "400 U002 on the date", user_message: '{strings.error.payment.date_out_of_range}', recovery: "Return to the date step." }
  - { id: SignatureMissing, trigger: "400 U019", user_message: '{strings.error.payment.signature_missing}', recovery: "Not user-recoverable." }
  - { id: ConsentNotAuthorised, trigger: "400 U009", user_message: '{strings.error.payment.consent_not_authorised}', recovery: "Re-authorise." }
  - { id: InitiationMismatch, trigger: "400 U008", user_message: '{strings.error.payment.initiation_mismatch}', recovery: "Re-read the authorised consent." }
  - { id: NetworkError, trigger: "IOException / timeout", user_message: '{strings.error.payment.network_error}', recovery: "Retry — idempotency key reused." }

