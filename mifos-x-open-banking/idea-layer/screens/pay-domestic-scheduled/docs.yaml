archetype: form
flow_ref: pay-domestic-scheduled
description: >-
  Domestic scheduled payment — one payment to a UK sort code and account number, on a single
  future date. Five steps: funding account, payee, amount, date, review. Stages a
  domestic-scheduled-payment-consent, authorises, and submits. No funds-confirmation step
  exists on this family. Cannot be amended or cancelled through a PISP once created.
has_ui: true
has_server: false
capabilities: [has_ui, has_api, has_flow, has_form_input, has_system_integration]
system_capabilities:
  - kind: deep_link
    detail: "Hands off to payment-consent for the app-to-app authorise leg."

inherits_from: pay-domestic-single

rail_position:
  time_dimension: "one date — RequestedExecutionDateTime"
  amount_field: InstructedAmount
  creditor_scheme: UK.OBIE.SortCodeAccountNumber
  funds_confirmation: none
  remittance_information: accepted
  charge_at_staging: "0.05 GBP UK.OBIE.CHAPSOut"
  consent_ladder: "AWAU -> AUTH -> COND"
  resource_ladder: "PDNG -> INCO"
  permission_field: "Data.Permission 'Create' MANDATORY"

# ─────────────────────────────────────────────────────────────────────────
# THE THREE THINGS THIS RAIL GETS WRONG IF BUILT FROM THE REFERENCE RAIL
# ─────────────────────────────────────────────────────────────────────────
divergence_traps:
  - trap: "Reusing the single-payment funds-confirmation step"
    why_wrong: >-
      The endpoint does not exist on this family. Worse, substituting a check against TODAY's
      balance and presenting it as a funds check asserts something the data cannot support —
      the payment executes on a future date whose balance is unknown.
    correct: "No funds check. The review step says so explicitly (no_funds_check_note)."

  - trap: "Reusing the ACSP -> ACCC status mapping"
    why_wrong: >-
      This rail returns PDNG at creation and INCO on read-back. Mapping INCO through a
      single-payment table yields either 'unknown' or, worse, a false 'completed'.
    correct: >-
      PDNG and INCO both mean the INSTRUCTION is established. Neither means money moved. There
      is no per-execution status in OBIE at all, so the UI reports setup and nothing more.

  - trap: "Filtering the date picker to working days"
    why_wrong: >-
      HSBC's Guide §22.2.1 states the execution date must be a working day. Observation
      contradicts it — a Saturday staged 201. Implementing the documented rule would refuse
      dates the bank accepts.
    correct: "Weekends selectable. Bound the picker at tomorrow and T+365 only."

  # ── ADDED 2026-08-07 from the full by-type capture read ──
  - trap: "Rendering CutOffDateTime as a submit-by deadline"
    why_wrong: >-
      It is not a deadline. On every domestic 201, CutOffDateTime, CreationDateTime,
      StatusUpdateDateTime, ExpectedExecutionDateTime and ExpectedSettlementDateTime all carry
      the SAME value. CutOffDateTime is the most inviting of the five to display and the most
      damaging: being a copy of the creation timestamp it is already in the past when read, so
      the app would show an expired deadline for a payment that is perfectly fine.
    correct: "Display the REQUESTED execution date. It is the only date on the response that means what it appears to mean."

  - trap: "Treating an accepted SCASupportData exemption as authorisation granted"
    why_wrong: >-
      The block is echoed back verbatim — RequestedSCAExemptionType "BillPayment" included —
      and the consent still lands AWAU. Acceptance is not honouring; the echo proves only that
      the field parsed. A skip-auth branch would strand the PSU on an unauthorised consent and
      the submit would fail U009.
    correct: "Always route through payment-consent. Read Data.Status; never infer authorisation from a 201."

  - trap: "Reading Data.DebtorAccount out of a ReadRefundAccount response"
    why_wrong: >-
      The refund account comes back under a top-level key named `Data.Debtor`, carrying only
      SchemeName and Identification and NO Name. A deserialiser looking for DebtorAccount finds
      nothing and silently reports "no refund account".
    correct: >-
      It mirrors the request's DebtorAccount and carries nothing the app did not already send,
      so ReadRefundAccount "No" costs the PSU nothing. If it is ever read, there is no name in
      it to render.

amendment_prohibition:
  permitted: false
  basis: "OBL Customer Experience Guidelines — mandatory obligation to redirect the PSU"
  ui_requirement: "amend_notice on the Review step AND the Success state"
  alternative: "For a recurring payment the PSU can change, VRP is the rail the regulator points at."

