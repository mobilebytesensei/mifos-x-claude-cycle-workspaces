error_contract_ref:
  dto: dtos/ObPaymentError.yaml
  note: >-
    The envelope shape, the Errors[]-is-an-array finding, the fail-fast U005-before-U004
    ordering, the four U004 wordings and the unstable Path casing are stated ONCE there and
    shared by all seven PIS rails. The error_cases block above maps only what THIS screen
    surfaces to the PSU.
  binding_consequences_for_this_screen:
    - "The error surface iterates the whole Errors[] array (TC-PSCH-013)."
    - "Copy is keyed off ErrorCode + Path with a case-insensitive Path match, never Message."
    - "The date picker's bounds are the real guard — U003 and U002 on the date should be unreachable, because fail-fast validation cannot give the form a full fault list."

# ─────────────────────────────────────────────────────────────────────────
# OPEN MEASUREMENT GAP — declared, not resolved
# ─────────────────────────────────────────────────────────────────────────
open_gaps:
  - id: GAP-PSCH-DATE-FLOOR
    declared_at: "2026-08-07"
    question: "What is the true lower bound on RequestedExecutionDateTime?"
    known: "T+0 refused with U003. T+7 accepted. Nothing between them was ever sent."
    assumed: "Tomorrow — from HSBC's Guide §22.2.1 ('Today +1'), i.e. documentation, not observation."
    risk: >-
      If the real floor is later than tomorrow, the picker presents dates the bank refuses and
      the PSU meets a 400 on a date the UI told them was valid. The T+365 ceiling IS measured;
      this floor is not, and the two are recorded with different standing on purpose.
    closes_with: "Send T+1, then bisect. Six requests settle it permanently."

  - id: GAP-PSCH-INTL-RISK
    declared_at: "2026-08-07"
    question: "Does the international rail accept Risk.PaymentContextCode?"
    known: >-
      Domestic scheduled always carries PaymentContextCode; international scheduled always
      carries CategoryPurposeCode "EPAY" (25/25). PaymentContextCode was NEVER sent
      internationally.
    risk: >-
      The 25/25 observation is easy to over-read as "international requires CategoryPurposeCode
      and refuses PaymentContextCode". The corpus supports only the first half. The two rails
      may simply have been exercised with different reference bodies.
    affects: "pay-international-scheduled, which inherits this file's Risk shape."

