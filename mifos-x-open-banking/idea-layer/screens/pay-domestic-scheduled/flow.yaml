sibling: flow
schema_version: "4.0"
feature_id: pay-domestic-scheduled

feature: pay-domestic-scheduled
flow_ref: pay-domestic-scheduled

entry_points:
  - source: payments
    label: "Tap the Domestic scheduled tile on the payments hub"
    params: []

transitions:
  - from: pay-domestic-scheduled
    to: payment-consent
    trigger: "Confirm on the Review step, after the consent stages 201"
    params: [consentId, paymentFamily]
    notes: "paymentFamily is 'domestic-scheduled-payment' so the shared return leg polls the right endpoint."

  - from: payment-consent
    to: pay-domestic-scheduled
    trigger: "Consent reaches AUTH"
    params: [consentId]
    notes: >-
      Resumes directly at submit. Unlike the single-payment rail there is NO funds-confirmation
      call between authorisation and submission — this family has no such endpoint.

  - from: pay-domestic-scheduled
    to: payment-status
    trigger: "Submit returns 201 with a DomesticScheduledPaymentId"
    params: [paymentId, paymentFamily]

  - from: pay-domestic-scheduled
    to: payments
    trigger: "Back from the Account step, or Cancel"
    params: []

internal_step_transitions:
  steps: [Account, Payee, Amount, Date, Review]
  note: "Five steps in one route. The Date step is this rail's only structural addition."

dependencies:
  tier: feature
  features:
    - { name: payments, relation: parent, params: [] }
    - { name: accounts, relation: data_source, params: [] }
    - { name: beneficiaries, relation: data_source, params: [] }
    - { name: payment-consent, relation: child, params: [consentId, paymentFamily] }
    - { name: payment-status, relation: child, params: [paymentId, paymentFamily] }
  libraries:
    - name: ktorfit
      coords: "de.jensklingenberg.ktorfit:ktorfit-lib:2.x"
      purpose: "REST client for the four domestic-scheduled-payment endpoints"
