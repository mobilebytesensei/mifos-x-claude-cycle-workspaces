sibling: demo-data
schema_version: "4.0"
feature_id: pay-domestic-scheduled

# Debtor accounts and beneficiaries are identical to pay-domestic-single — same eligibility
# rule, same sandbox accounts. Only the payment-shaped fixtures differ and are given here.
inherits_fixtures_from: pay-domestic-single
inherits: [debtor_accounts, hidden_account_count, beneficiaries]

content:
  date_boundaries:
    note: "Measured in round 15 against the live sandbox. Both edges are exact."
    refused_today: { value: "T+0", error: "U003 You cannot trigger a Payment request for a date in the past" }
    refused_yesterday: { value: "T-1", error: "U003 date in the past" }
    accepted_min_documented: { value: "T+1", source: "Guide §22.2.1 'Today +1' — DOCUMENTED, not observed" }
    accepted_observed: ["T+7", "T+30", "T+90", "T+180", "T+364", "T+365"]
    refused_above: { value: "T+366", error: "U002 Initiation.RequestedExecutionDateTime is invalid" }
    weekend_accepted: { value: "2026-09-05 (Saturday)", result: "201 AWAU", note: "Contradicts Guide §22.2.1's working-day rule" }
    untested_gap: "T+1 through T+6 were never sent. The tomorrow floor follows documentation, not observation."

  staged_consent_response:
    Data:
      ConsentId: "45175"
      CreationDateTime: "2026-08-06T10:40:48+00:00"
      Status: "AWAU"
      StatusUpdateDateTime: "2026-08-06T10:40:48+00:00"
      Permission: "Create"
      Initiation:
        InstructionIdentification: "WmZAtMt7rFgu1hXDjPND"
        EndToEndIdentification: "Gu4seLC66TLVN9BUo9m9"
        LocalInstrument: "UK.OBIE.FPS"
        RequestedExecutionDateTime: "2026-08-13T00:00:00+00:00"
        InstructedAmount: { Amount: "1.01", Currency: "GBP" }
        CreditorAccount:
          SchemeName: "UK.OBIE.SortCodeAccountNumber"
          Identification: "40200110203351"
          Name: "Ramu"
        RemittanceInformation: { Unstructured: ["Rent"] }
      Charges:
        - { ChargeBearer: "BorneByDebtor", Type: "UK.OBIE.CHAPSOut", Amount: { Amount: "0.05", Currency: "GBP" } }
    Risk: { PaymentContextCode: "TransferToThirdParty" }
    normalisation_note: >-
      RequestedExecutionDateTime was SENT as 2026-08-13T10:28:58+00:00 and echoed as
      2026-08-13T00:00:00+00:00. The time component is discarded, the date and UTC offset kept.
      This fixture holds the echoed form so the Review step is tested against what the bank
      actually returns.

  authorised_consent_response:
    note: "Status moved to AUTH; StatusUpdateDateTime did NOT move. The poll must key on Status."
    Data:
      ConsentId: "45175"
      CreationDateTime: "2026-08-06T10:40:48+00:00"
      Status: "AUTH"
      StatusUpdateDateTime: "2026-08-06T10:40:48+00:00"

  submit_response:
    Data:
      DomesticScheduledPaymentId: "19919"
      ConsentId: "45175"
      Status: "PDNG"
      CreationDateTime: "2026-08-06T10:42:08+00:00"
      ExpectedExecutionDateTime: "2026-08-06T10:42:08+00:00"
      ExpectedSettlementDateTime: "2026-08-06T10:42:08+00:00"
    stub_field_note: >-
      ExpectedExecutionDateTime and ExpectedSettlementDateTime come back as the CREATION
      timestamp, not the requested execution date. They are stubs on this family. Do NOT render
      either as 'your payment will arrive on…' — it would show today for a payment dated a week
      out.

  status_readback_response:
    note: "Read back later. PDNG converges to INCO. Neither means the payment executed."
    Data:
      DomesticScheduledPaymentId: "19919"
      Status: "INCO"

  error_responses:
    permission_omitted:
      http: 400
      body: { Errors: [{ ErrorCode: "U004", Message: "Field is missing", Path: "Data.Permission" }] }
    date_omitted:
      http: 400
      body: { Errors: [{ ErrorCode: "U004", Message: "Field is missing", Path: "Data.Initiation.RequestedExecutionDateTime" }] }
    date_in_past:
      http: 400
      body: { Errors: [{ ErrorCode: "U003", Message: "You cannot trigger a Payment request for a date in the past", Path: "Data.Initiation.RequestedExecutionDateTime" }] }
    date_too_far:
      http: 400
      body: { Errors: [{ ErrorCode: "U002", Message: "Initiation.RequestedExecutionDateTime is invalid", Path: "Data.Initiation.RequestedExecutionDateTime" }] }
