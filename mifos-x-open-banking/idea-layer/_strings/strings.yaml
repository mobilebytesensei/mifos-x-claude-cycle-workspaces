# ── RESTORED 2026-08-02 (/idea-sync). The 2026-07-28 prune removed the per-kind error
# copy on the stated grounds that "TransactionsUiState.Error carries no typed kind".
# That reading was wrong and source contradicts it outright:
#   ui/TransactionsViewModel.kt:69   data class Error(val kind: TransactionsErrorKind)
#   ui/TransactionsViewModel.kt:33   enum class TransactionsErrorKind(val recoverable: Boolean)
#                                    SESSION_EXPIRED(true) CONSENT_WITHDRAWN(false)
#                                    RATE_LIMITED(true) NETWORK(true)
# Each kind resolves TWO strings, not one — TransactionsError.kt:139 statusRes() for the
# chip and :146 bodyRes() for the paragraph — so the restored shape is a status/body pair
# per kind rather than the single flat key the prune deleted. Values copied VERBATIM from
# feature/transactions/src/commonMain/composeResources/values/strings.xml.
# Note `network`, not the pre-prune `no_network`: source names the enum member NETWORK.
transactions.error.status.session_expired: "401 — Session expired"
