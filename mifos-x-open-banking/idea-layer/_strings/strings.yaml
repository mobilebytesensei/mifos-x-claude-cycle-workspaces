# ── payment.* AUTHORED 2026-08-07 — the keys the seven screens reference that the renamed
# send-money vocabulary never had. Grouped by the step that renders them.
#
# The load-bearing constraints, so a later edit does not quietly undo them:
#   - No string here says a submitted payment was sent, paid or completed. ACSP is accepted,
#     not settled; PDNG/INCO mean the INSTRUCTION exists, not that money moved.
#   - No string here quotes, implies or estimates an exchange rate, a converted amount or a
#     "you'll receive" figure. No endpoint discloses one at any stage, and the REQUEST cannot
#     carry one either (ExchangeRateInformation is refused for all three RateType values).
#   - No string here quotes an international deferred fee. The 0.50 charge appears only at
#     resource creation — i.e. after the PSU authorises — so fee_unknown and
#     deferred_charge_note say it is not quoted yet, and name no currency: the charge is in
#     the INSTRUCTED currency, which is a per-payment choice, not a constant.
#   - amend_notice_* is a MANDATORY OBL Customer Experience Guidelines disclosure, not a
#     courtesy. Each names the channel concretely rather than only stating the limitation.

# Stepper captions. Eight distinct steps across the seven rails; each screen picks its own set.
payment.step.account: "Account"
payment.step.payee: "Payee"
payment.step.recipient: "Recipient"
payment.step.amount: "Amount"
payment.step.date: "Date"
payment.step.schedule: "Schedule"
payment.step.charges: "Charges"
payment.step.review: "Review"

# Step 1 — funding account. The list is filtered to UK.OBIE.SortCodeAccountNumber, so a PSU
# who holds a credit card will not find it. The note says why rather than omitting it silently.
payment.debtor_list_a11y: "Accounts you can pay from. Select one to continue."
payment.ineligible_accounts_note: "Some of your accounts are not shown. This payment can only be made from an account with a sort code and account number."
