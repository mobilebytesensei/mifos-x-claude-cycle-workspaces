standing_order.vrp_alternative_a11y: "Set up a variable payment instead — a recurring payment you can change or cancel from this app."

# ═══════════════════════════════════════════════════════════════════════════
# VRP — variable payments, AUTHORED 2026-08-07 (/idea-sync)
# ═══════════════════════════════════════════════════════════════════════════
# pay-vrp-mandate is three surfaces in one feature — a list, a four-step create form, and a
# detail screen — because a mandate has a LIFECYCLE the other six rails do not: created once,
# drawn on many times, destroyed. Its 36 keys never existed, so all three surfaces rendered
# with empty top bars, empty chips and empty banners.
#
# "Variable payment", never "VRP" and never "mandate", in anything a PSU reads. The acronym is
# industry vocabulary with no consumer recognition — the payments hub already made that choice
# for the tile, and these keys keep it. "Mandate" survives only in key names and these comments.
#
# THE FOUR HEALTH STATES ARE NOT THE CONSENT STATUS. Three of the four coexist with
# Data.Status == AUTH, so none of this copy may describe an authorised mandate as working:
#   active    — consent AUTH, no recent ExemptionNotApplied
#   failing   — AUTH, but payments rejected at fulfilment (payee no longer a trusted
#               beneficiary at HSBC). The consent says nothing about it.
#   unpayable — AUTH, funds-confirmation returned "Available", and EVERY payment still returns
#               400 U021 on the bank-written debtor. Past SCA, live, and incapable of paying.
#   revoked   — reached via 400 U011 after a DELETE. A NORMAL TERMINAL STATE, not an error;
#               nothing here styles it or words it as a fault.

vrp.title: "Variable payments"
vrp.create_action: "Set up a variable payment"
vrp.create_title: "New variable payment"
vrp.detail_title: "Variable payment"
vrp.list_label: "Your variable payments"

vrp.health.active: "Active"
vrp.health.failing: "Payments failing"
# Never "Active with problems" or anything that reads as working — this mandate pays nothing.
vrp.health.unpayable: "Cannot make payments"
vrp.health.revoked: "Cancelled"

vrp.empty_title: "No variable payments"
# Says three things the PSU cannot infer: what a variable payment is, that this list only ever
# shows ones created in THIS app (there is no AIS read for mandates), and where to go if what
# they actually want is a dated or repeating instruction.
vrp.empty_body: "A variable payment lets you set spending limits once, then pay any amount within them without approving each payment. You have not set one up yet. Only the ones you set up in this app appear here, so one set up on another device will not show. If you want a payment on a set date, or one that repeats on a schedule, use Pay on a date or Standing order instead."

vrp.step.limits: "Limits"
vrp.max_individual_label: "Most you can pay at once"
vrp.max_individual_helper: "The largest single payment allowed under this variable payment. Payments can only be made in pounds."
vrp.period_type_label: "Limit period"
vrp.period_limit_label: "Most you can pay in that period"
# Says the first period MAY allow less and that the app cannot see the arithmetic. It must NOT
# print a remaining figure: the API exposes no period start or end, no consumed amount and no
# PeriodicLimitsUsed member anywhere — the consent echoes PeriodicLimits and nothing more. A
# number here would be invented, and being wrong in the generous direction is no better.
vrp.pro_rating_notice: "Your first period may allow less than this, because it starts partway through. HSBC works that out and does not share the figure, so this app cannot show how much is left in it."
vrp.add_second_limit_label: "Add a second limit"

vrp.review.to: "To"
vrp.review.max_per_payment: "Most per payment"
vrp.review.period_limits: "Period limits"
# Shown at the one moment the PSU is about to grant it. A PSU who does not understand that this
# is the only approval the mandate will ever ask for has consented to something broader than
# they think. The second half is the honest flip side: there is no expiry to display, because
# the consent does not expire and an ASPSP must not revoke it for dormancy.
vrp.single_authorisation_notice: "You approve this once. After that, every payment within these limits goes through without HSBC asking you again. It does not expire — it runs until you cancel it here, or in the HSBC app."

vrp.detail.status: "Status"
# Deliberately not "What's left". Every figure in this list is counted from this app's own
# payment history; the API confirms none of it, and a reinstall restarts the tally at zero
# while the bank's does not.
vrp.detail.headroom: "Limits and spending"

vrp.failing_banner: "Payments under this variable payment are being turned down. This usually means the payee has been removed in the HSBC app. Add them back there, then try again."
# The worst state on the screen and the one the PSU cannot reason about unaided. It names the
# cause (the account chosen AT THE BANK), states plainly that this cannot be repaired, offers no
# retry (three attempts already proved the failure is deterministic), and admits the funds check
# was misleading rather than leaving it standing as reassurance.
vrp.unpayable_banner: "This variable payment cannot make any payments. The account you chose at HSBC cannot be used for them, and that cannot be changed now. The funds check said the money was there, but every payment has been turned down. Cancel this one and set up a new one against an account with a sort code and account number."
vrp.revoked_banner: "This variable payment has been cancelled. It cannot be restarted — set up a new one if you still need it."

# Tapping this goes straight to the bank's payment endpoint: no redirect, no re-authentication.
# That is the whole point of the rail.
vrp.pay_now: "Pay now"
vrp.payment_amount_label: "Amount"
vrp.payment_reference_label: "Reference (optional)"
# The settling window is a REAL 30 seconds on this family alone — the only rail where the
# expected-settlement field carries usable information. Still in progress, so still "sending".
vrp.settling: "Sending your payment"
# Surfaces the rejection and names the window, but must not invite a retry back INTO it — on a
# rail built for unattended repeat payments an automatic retry loop is exactly the wrong reflex.
vrp.evening_window_notice: "HSBC turned this payment down for extra fraud checks. Payments made between 6pm and 11:45pm are more likely to be checked this way. Nothing has been sent — try again outside those hours."

vrp.revoke: "Cancel this variable payment"
vrp.revoke_confirm_title: "Cancel this variable payment?"
# Permanent in a stronger sense than usual: after the DELETE the consent is unreadable forever,
# so there is nothing left to restore even in principle.
vrp.revoke_confirm_body: "The limits you set will be removed and no more payments can be made under this variable payment. This cannot be undone — you would need to set up a new one and approve it with HSBC again."
vrp.revoke_confirm_cta: "Yes, cancel it"

