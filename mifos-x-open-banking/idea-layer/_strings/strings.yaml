payment.iban_label: "Recipient's IBAN"
payment.iban_helper: "The international account number for the account you are paying. Your recipient will find it on their statement."
payment.bic_label: "Recipient's BIC (optional)"
# The 8-character form is the one most bank directories publish and the one HSBC refuses, so
# the helper names the 11-character requirement before the PSU pastes the shorter one.
payment.bic_helper: "Use the 11-character form. The shorter 8-character form is not accepted. Leave this blank if you are not sure."
payment.bic_length_error: "A BIC must be exactly 11 characters"

# Step 3 — amount.
payment.amount_not_a_number: "Enter an amount using numbers only"
payment.reference_helper: "Shown on the recipient's statement. Up to 35 characters."
payment.instructed_currency_label: "Currency you are charged in"
payment.instructed_currency_helper: "The currency taken from your account."
payment.transfer_currency_label: "Currency the recipient gets"
payment.transfer_currency_helper: "This does not have to match the currency you are charged in."
# States that the rate is set by the bank and shows NO figure. There is no rate to show and no
# way to obtain one — this is the final answer, not a placeholder for a data source.
payment.fx_disclosure: "Your bank sets the exchange rate when it makes this payment. This app cannot show you the rate, or the amount the recipient will get."
payment.intl_no_reference_note: "You cannot send a payment reference abroad. This payment type has no way to add a message for the recipient."

# Step — charges. International rails only. ChargeBearer is mandatory and all three values are
# accepted, so the PSU genuinely chooses; the labels say who pays rather than echoing the codes.
payment.charge_bearer_label: "Who pays the fees"
payment.charge_bearer.debtor: "You pay all the fees"
payment.charge_bearer.shared: "You each pay your own bank's fees"
payment.charge_bearer.creditor: "The recipient pays all the fees"
payment.intl_no_charge_note: "HSBC does not charge a fee for this type of payment. The recipient's bank may still take one, depending on your choice above."

# Step — date. Scheduled rails only.
payment.execution_date_label: "Payment date"
payment.execution_date_helper: "Choose any date from tomorrow up to a year ahead."
payment.date_normalisation_note: "Your bank makes the payment on the date you choose. There is no set time of day."
payment.no_funds_check_note: "This app cannot check whether the money will be in your account on that date. Make sure there is enough to cover the payment."

# Step — schedule. Standing-order rails only.
payment.so_no_debtor_note: "You choose the account this comes from when you approve the standing order with HSBC, not here."
payment.frequency_label: "How often"
# Exactly five. All nine OBIE OBFrequency6Code values were tried; HSBC Personal accepts these
# five and returns U002 for ADHO, INDA, MIAN and DAIL. Do NOT add a Daily or Ad-hoc option.
payment.frequency.week: "Weekly"
payment.frequency.frtn: "Every 2 weeks"
payment.frequency.mnth: "Monthly"
payment.frequency.qurt: "Every 3 months"
payment.frequency.year: "Yearly"
payment.first_payment_date_label: "First payment date"
payment.has_end_date_label: "Set an end date"
payment.final_payment_date_label: "Final payment date"
payment.so_amount_label: "Amount of each payment"
payment.varying_amounts_label: "Use different amounts for later payments"
payment.recurring_amount_label: "Amount of each later payment"
payment.final_amount_label: "Amount of the final payment"

# Step — review. Row labels.
payment.review.date: "Payment date"
payment.review.bank: "Recipient's bank"
payment.review.arrives_in: "Arrives in"
payment.review.charges: "Who pays the fees"
payment.review.fee: "HSBC's charge"
payment.review.frequency: "How often"
payment.review.first_payment: "First payment"
payment.review.final_payment: "Final payment"
# Never an estimate, never a currency symbol, and never rendered as "0.00" or blank. Charges is
# ABSENT from the international consent response rather than an empty array, and on the deferred
# international rails the charge is unknowable until AFTER authorisation.
payment.fee_unknown: "Your bank has not quoted a fee yet"
payment.deferred_charge_note: "A fee applies to this payment, but your bank does not quote it until the payment has been set up. You will see the amount then, and not before."

# MANDATORY OBL Customer Experience Guidelines disclosure — a PISP cannot amend or cancel
# either instruction, and must say where the PSU can.
payment.amend_notice_scheduled: "Once this payment is set up, this app cannot change it or cancel it. To do either, use the HSBC app or online banking."
payment.amend_notice_standing_order: "Once this standing order is set up, this app cannot change it or cancel it. To change the amount or the schedule, or to stop it altogether, use the HSBC app or online banking."

# Confirm CTAs. DESIGN.md §Do's: name the action AND the amount where money moves now; on a
# deferred rail, name what is being CREATED instead — nothing is sent when these are tapped.
payment.confirm_scheduled: "Schedule this payment"
payment.confirm_standing_order: "Set up this standing order"

# Progress captions, in the order the stages run. Not every rail runs every stage: the deferred
# families have no funds-confirmation endpoint, and the standing-order rails end on
