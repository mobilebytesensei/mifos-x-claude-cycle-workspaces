# ═══════════════════════════════════════════════════════════════════════════
# STANDING ORDER — mandatory amendment disclosure, added 2026-08-06 (/idea-sync)
# ═══════════════════════════════════════════════════════════════════════════
# Replaces the "Pausing standing orders is coming soon" / "Cancelling standing orders is
# coming soon" snackbar strings. Those said the capability was deferred; it is prohibited.
# OBL's Customer Experience Guidelines make this disclosure MANDATORY for a PISP that cannot
# amend or cancel — it is a compliance obligation, not a courtesy.
#
# Copy note: it says WHERE to go, not just that we cannot help. A disclosure that only states
# the limitation leaves the PSU stuck.

standing_order.amend_notice_title: "Need to change this?"
standing_order.amend_notice_body: "To change the amount, the schedule, or to cancel this standing order, use the HSBC app or online banking. Open Banking does not let this app change standing orders."
standing_order.amend_notice_a11y: "Need to change this standing order? To change the amount, the schedule, or to cancel it, use the HSBC app or online banking. Open Banking does not let this app change standing orders."

