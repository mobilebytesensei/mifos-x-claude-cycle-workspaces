schema_version: "4.0"
api_group: atm
name: "ATM & Branches API"
base_url: "https://api.hsbc.com"
host: api.hsbc.com
host_status: resolved
spec: "OBIE Open Data v2.2 (swagger info.version 2.2.1)"
auth_scheme: "none — Open Data is unauthenticated and sits outside the OBIE consent surface"
# ⚠ CORRECTED 2026-08-06. An earlier version named https://www.hsbc.co.uk/open-banking as the
# base; that was invented, not sourced, and is withdrawn.
#
# The UK Personal Postman collection contains NO ATM or branch endpoints — its ten folders are
# AIS, CoF, the seven payment families and Events. Neither the environment file
# (secure.sandbox.ob.hsbc.co.uk / sandbox.ob.hsbc.co.uk) nor the capture corpus carries an Open
# Data host.
#
# The UNAUTHENTICATED nature of Open Data is a structural fact and stands. The HOST does not.
# Resolve from develop.hsbc.com before building, or drop the feature.
# Rewritten 2026-08-06 (/idea-sync, OBP eviction). Was the Open Bank Project sandbox with
# DirectLogin. ATM and branch location is OPEN DATA under the UK Open Banking standard: no
# consent, no token, no mTLS. It is the one surface in this app that needs no credential at all.
#
# ── HOST RESOLVED 2026-08-07 — supersedes the `host_status: unresolved` marker above ──────
# The block above is kept as the record of why the host was withdrawn, and of the invented base
# that preceded it. It is no longer the live position. api.hsbc.com is sourced from the
# HSBC-published open-atm-locator-swagger.json#host (schemes [https]) and the matching
# open-branch-locator / open-product-finder swaggers, all reached from develop.hsbc.com — the
# exact resolution route the block above prescribed. See screens/atm-locator/api.yaml and
# screens/branch-locator/api.yaml, which carry the per-endpoint evidence.
#
# ENDPOINT BODIES MIGRATED 2026-08-07. The 2026-08-06 pass rewrote the header and left both
# endpoints on the OBP model beneath it: /v3.0.0/banks/{bank_id}/atms and /branches, snake_case
# bodies, OBP_SERVER_ERROR codes — and `auth_required: true` on each, flatly contradicting the
# unauthenticated header three lines above them.
# What was actually wrong:
#   host      the resource host -> api.hsbc.com. NOT secure.sandbox.ob.hsbc.co.uk. A client that
#             reuses the mTLS-configured AIS client here presents a certificate this host never
#             asked for — the predictable mistake, called out in screens/atm-locator/api.yaml.
#   paths     /v3.0.0/banks/{bank_id}/{atms,branches} -> the OBIE Open Data v2.2 pairs below.
#             One bank; no bankId. Open Data is per-ASPSP by virtue of the host, not the path.
#   auth      auth_required: true -> false. No consent, no token, no mTLS.
#   fields    snake_case OBP bodies -> the OBIE Open Data PascalCase shape. See dtos/AtmLocation.yaml.
#   errors    401 / 403 / OBP_SERVER_ERROR -> an unauthenticated surface cannot 401 or 403.
#
# STATUS: specified, not built. AccountDetailChip.AtmLocator ships and navigates, but resolves
# to PlaceholderScreen("ATM locator") — declared under idea-plan.yaml#deferred_routes.
generated_at: "2026-05-30"

# ─────────────────────────────────────────────────────────────────────────
# THREE DIVERGENCES FROM EVERY OTHER SURFACE IN THIS APP
# ─────────────────────────────────────────────────────────────────────────
open_data_contract:
  no_credential: "No consent, no access token, no mTLS client certificate. Nothing to present."
  live_only: >-
    There is no sandbox for Open Data. Every call here is real traffic to a real host returning
    real branch and ATM records. No PSU data is involved and there is no billing exposure, but it
    is production traffic and should be treated as such.
  vendor_media_type:
    produces: "application/prs.openbanking.opendata.v2.2+json"
    note: "Not application/json. A client that hardcodes the latter may not match on Accept."
  path_split:
    standard: "/open-banking/v2.2/…   — the OBIE Open Data mandated endpoint"
    extension: "/x-open-banking/v2.2/… — HSBC's own additions, `x-` prefixed"
    portability: >-
      The standard pair works against any ASPSP's Open Data host. Every `x-` filtered variant is
      HSBC-specific and does not port.

endpoints:

  # ── ATMs ────────────────────────────────────────────────────────────────
  - id: get_all_atms
    method: GET
    path: "/open-banking/v2.2/atms"
    auth_required: false
    description: "Every HSBC ATM. The OBIE-mandated endpoint — unfiltered, whole-estate."
    response_dto: AtmLocation
    consumed_by: []

  - id: get_atms_by_geolocation
    method: GET
    path: "/x-open-banking/v2.2/atms/geo-location/lat/{latitude}/long/{longitude}"
    auth_required: false
    description: >-
      ATMs near a point. Coordinates are PATH segments, not query parameters — the OBP
      latitude/longitude/limit query triple this file used to declare does not exist here.
      A `radius` query parameter is documented on the branch sibling; see screens/atm-locator/api.yaml
      for whether it applies to this one.
    response_dto: AtmLocation
    consumed_by: []

  - id: get_atms_by_postcode
    method: GET
    path: "/x-open-banking/v2.2/atms/postcode/{postcode}"
    auth_required: false
    description: "ATMs in a postcode."
    response_dto: AtmLocation
    consumed_by: []

  - id: get_atms_by_town
    method: GET
    path: "/x-open-banking/v2.2/atms/country/{country}/town/{town}"
    auth_required: false
    description: "ATMs in a town. Country is required alongside the town."
    response_dto: AtmLocation
    consumed_by: []

  - id: get_atms_by_country
    method: GET
    path: "/x-open-banking/v2.2/atms/country/{country}"
    auth_required: false
    description: "ATMs in a country."
    response_dto: AtmLocation
    consumed_by: []

  # ── Branches ────────────────────────────────────────────────────────────
  - id: get_all_branches
    method: GET
    path: "/open-banking/v2.2/branches"
    auth_required: false
    description: "Every HSBC branch. The OBIE-mandated endpoint — unfiltered, whole-estate."
    response_dto: Branch
    consumed_by: [branch-locator]

  - id: get_branches_by_geolocation
    method: GET
    path: "/x-open-banking/v2.2/branches/geo-location/lat/{latitude}/long/{longitude}"
    auth_required: false
    description: >-
      Branches near a point. `radius` is a REQUIRED query parameter — MILES, integer, range 1-10,
      documented default 1. Not kilometres: the swagger reads "Number of miles (1 to 10) as an
      integer". A metric UI must convert, and 10 miles is a hard ceiling.
    response_dto: Branch
    consumed_by: [branch-locator]

  - id: get_branches_by_sortcode
    method: GET
    path: "/x-open-banking/v2.2/branches/sortcode/{sortcode}"
    auth_required: false
    description: "The branch behind a sort code. No ATM analogue exists."
    response_dto: Branch
    consumed_by: [branch-locator]

  - id: get_branches_by_postcode
    method: GET
    path: "/x-open-banking/v2.2/branches/postcode/{postcode}"
    auth_required: false
    description: "Branches in a postcode."
    response_dto: Branch
    consumed_by: [branch-locator]

  - id: get_branches_by_town
    method: GET
    path: "/x-open-banking/v2.2/branches/country/{country}/town/{town}"
    auth_required: false
    description: "Branches in a town."
    response_dto: Branch
    consumed_by: [branch-locator]

  - id: get_branches_by_country
    method: GET
    path: "/x-open-banking/v2.2/branches/country/{country}"
    auth_required: false
    description: "Branches in a country."
    response_dto: Branch
    consumed_by: [branch-locator]

# ─────────────────────────────────────────────────────────────────────────
# OPEN ITEM
# ─────────────────────────────────────────────────────────────────────────
branch_dto_unresolved:
  status: unresolved
  finding: >-
    dtos/AtmLocation.yaml was migrated to the Open Data v2.2 PascalCase shape and backs every ATM
    endpoint above. Its branch counterparts — Branch, BranchRouting, LobbyHours, DriveUpHours —
    were NOT migrated in the same pass and still describe the OBP branches response (snake_case,
    a bank_id field, an UNRESOLVED api_path). No branch endpoint above can name a response DTO
    until they are retargeted.
  to_establish: >-
    Retarget the four branch DTOs against the HSBC-published open-branch-locator swagger, then
    replace `response_dto: unresolved` on the six branch endpoints. Do not infer the shape from
    the ATM sibling — the branch record carries Availability and ServiceAndFacility members the
    ATM record has none of.

# ─────────────────────────────────────────────────────────────────────────
# ERRORS — an unauthenticated surface has a much shorter list
# ─────────────────────────────────────────────────────────────────────────
error_codes:
  - code: 404
    cause: "No record matched the postcode / town / country / sortcode filter."
    recovery: "Present an empty result, not an error. A postcode with no branch is the normal case."
    retry: false
  - code: 429
    cause: "Rate limit. Unpublished for Open Data — assume one exists."
    recovery: "Exponential back-off."
    retry: true
  - code: 503
    cause: "Open Data host unavailable."
    recovery: "Surface a retry affordance after a brief delay."
    retry: true
  - note: >-
      There is no 401 and no 403 on this surface. Nothing is authenticated, so there is no
      credential to reject and no permission to be absent. An OBP-era client that branches on
      those codes here is handling a case that cannot occur.

# ─────────────────────────────────────────────────────────────────────────
# REMOVED 2026-08-07 — the OBP bank-scoped locator model
# ─────────────────────────────────────────────────────────────────────────
removed_2026_08_07:
  - endpoint: "GET /v3.0.0/banks/{bank_id}/atms"
    reason: >-
      OBP bank-scoped ATM list on the authenticated sandbox host, with latitude / longitude /
      limit QUERY parameters. Superseded by the standard + five `x-` ATM endpoints above, where
      the filters are path segments.
  - endpoint: "GET /v3.0.0/banks/{bank_id}/branches"
    reason: "OBP bank-scoped branch list. Superseded by the six branch endpoints above."
  - field: bank_id
    reason: >-
      OBP bank identifier, present on both the path and the response. There is ONE bank, and on
      Open Data the ASPSP is identified by the HOST, never by a path parameter.
  - property: "auth_required: true"
    reason: >-
      Declared on both OBP endpoints while the file header three lines above said the surface is
      unauthenticated. Open Data takes no credential of any kind.
  - property: "limit query parameter (default 10, max 100)"
    reason: "OBP paging control. The Open Data endpoints take no limit parameter."
