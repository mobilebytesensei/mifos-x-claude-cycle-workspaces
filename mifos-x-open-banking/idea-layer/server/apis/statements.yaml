# server/apis/statements.yaml — statement reads
#
# Authored 2026-08-06 by /idea-sync. Previously folded into the OBP accounts group.

schema_version: "2.0"
api: "HSBC UK Open Banking — Account & Transaction API v4.0"
base_url: "https://secure.sandbox.ob.hsbc.co.uk/obie/open-banking/v4.0/aisp"
api_source_ref: API-001
auth: "PSU authorization_code token on scope=accounts"

endpoints:
  - id: get_statements
    method: GET
    path: "/accounts/{AccountId}/statements"
    permission: [ReadStatementsBasic, ReadStatementsDetail]
    description: "Statement list for the account — period, type and available dates."
    consumed_by: [statements]

  - id: get_statement_detail
    method: GET
    path: "/accounts/{AccountId}/statements/{StatementId}"
    permission: [ReadStatementsDetail]
    description: "One statement — period, opening and closing balances."
    consumed_by: [statement-detail]

  - id: get_statement_transactions
    method: GET
    path: "/accounts/{AccountId}/statements/{StatementId}/transactions"
    permission: [ReadStatementsDetail, ReadTransactionsDetail]
    description: "Transactions within a single statement."
    consumed_by: [statement-detail]

  - id: get_statement_file
    method: GET
    path: "/accounts/{AccountId}/statements/{StatementId}/file"
    permission: [ReadStatementsDetail]
    description: "Statement file download. Shipped on the network client but unconsumed by any feature."
    consumed_by: []

# ─────────────────────────────────────────────────────────────────────────
# AVAILABILITY — inverted relative to every other AIS resource
# ─────────────────────────────────────────────────────────────────────────
availability:
  note: >-
    Statements are the ONE resource where the credit card is the only account that works. Every
    other AIS resource returns 400 on the card and 200 on the current accounts; this one is the
    reverse. The `offers` resource behaves the same way.
  matrix:
    current_123456791: 400
    current_123456792: 400
    savings_1123456841: 400
    global_money_1123456843: 400
    credit_card_1123456842: 200
  ui_consequence: >-
    A PSU browsing a current account will find statements empty or refused. The screen must
    present that as "no statements available for this account" rather than as an error, because
    it is the expected state for four of the five sandbox accounts.

sca_recency_gate:
  applies: false
  note: >-
    Statements were NOT in the set of five resources observed returning 403 on a stale-SCA token
    (beneficiaries, standing-orders, scheduled-payments, direct-debits, party). Untested
    directly, so this is inference from the probe's resource list rather than an observation.
