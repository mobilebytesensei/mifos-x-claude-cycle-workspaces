# flows/consumer-banking.yaml — Full navigation flow for the consumer-only app
# Generated 2026-05-25 by /idea sync STEP 4f
# Covers 29 screens (25 consumer + 4 shared)
# Updated 2026-05-28 by /idea setup-flows — added direct-debit-detail, change-password, about
# Updated 2026-05-30 by /idea sync — removed consumer-home (orphan duplicate of home, zero inbound nav); grouped standing-order-edit
# Updated 2026-06-11 by /idea sync — registered pfm-settings + business-insights into the consumer roster (PFM v2 epic)
# Updated 2026-06-11 by /idea sync — registered send-money-amount, sca-challenge, payment-result, standing-order-create (source-drift write-back); wired send-money + standing-orders flow edges
# Updated 2026-08-02 by /idea-sync — removed pfm-dashboard, pfm-settings and business-insights (PFM dropped; never built). atm-locator retained as planned work.
# Updated 2026-08-06 by /idea-sync — SEVEN-TYPE PAYMENTS REWRITE + OBP EVICTION.
#   Removed from the roster and every edge: transaction-tags, sca-challenge, change-password
#   (impossible under OBIE FAPI); standing-order-edit (PISP amendment prohibited by OBL CEG);
#   standing-order-create, send-money, send-money-amount, send-money-confirm, payment-result
#   (superseded by the per-type payment screens).
#   Added: the payments hub and its seven type screens, plus payment-consent and payment-status.
#   The Pay tab now lands on `payments`, not on a linear send-money form.
# Updated 2026-08-07 by the repository owner — cards and card-detail REMOVED from the roster and
#   from every edge. OBIE has no card resource: a card is an Account whose SchemeName is
#   UK.OBIE.PAN, which is why the Card and CardAccountRef DTOs were deleted on 2026-08-06. The
#   screens were spared then and are now removed with the rest of the OBP planning they came
#   from. Four edges went with them: home -> cards ("View Cards"), cards -> card-detail,
#   cards -> transaction-detail and card-detail -> transactions. No surviving screen loses a
#   route: transaction-detail is still reached from transactions, and transactions from home
#   and account-detail.

schema_version: "1.0"
id: consumer-banking
name: "Consumer Banking Flow"
description: "Personal banking for end users — accounts, payments, consents, notifications"
created_at: "2026-05-25"
status: active

entry_screen: home
screens:
  - home
  - accounts
  - account-detail
  - transactions
  - transaction-detail
  # ── Payments: hub + seven types + two shared surfaces ──────────────────
  - payments
  - pay-domestic-single
  - pay-domestic-scheduled
  - pay-domestic-standing-order
  - pay-international-single
  - pay-international-scheduled
  - pay-international-standing-order
  - pay-vrp-mandate
  - payment-consent
  - payment-status
  - beneficiaries
  # cards + card-detail removed 2026-08-07 — see the header note.
  - standing-orders
  - standing-order-detail
  - atm-locator
  - notifications
  - direct-debits
  # Added 2026-08-03 (/idea-sync): these seven were in no flow at all — a gap left by the
  # 2026-07-28 reverse sync, which added them from source without wiring them. Each is
  # placed by its own declared entry_points: account-holder, product, scheduled-payments
  # and statements are all reached from account-detail chips; statement-detail from
  # statements; consent-list from the More menu; consent-detail from consent-list.
  - account-holder
  - product
  - scheduled-payments
  - statements
  - statement-detail
  - consent-list
  - consent-detail
  - products
  - consent-manager
  - direct-debit-detail
  - about
  - profile
  - settings

connections:
  - { from: home, to: accounts, type: push, label: "View Accounts" }
  - { from: home, to: payments, type: push, label: "Pay" }
  - { from: home, to: transactions, type: push, label: "View Transactions" }
  - { from: home, to: beneficiaries, type: push, label: "Manage Beneficiaries" }
  # home -> cards ("View Cards") removed 2026-08-07 with the cards screen.
  - { from: home, to: standing-orders, type: push, label: "Standing Orders" }
  - { from: home, to: atm-locator, type: push, label: "ATM Finder" }
  # home → fx-rates removed 2026-08-06 with the fx-rates screen.
  - { from: home, to: notifications, type: push, label: "Notifications" }
  - { from: home, to: profile, type: tab, label: "Profile (bottom nav More)" }
  - { from: home, to: settings, type: tab, label: "Settings (bottom nav More)" }
  - { from: accounts, to: account-detail, type: push, label: "Account selected" }
  - { from: account-detail, to: transactions, type: push, label: "View transactions" }
  - { from: account-detail, to: payments, type: push, label: "Pay from account" }
  - { from: transactions, to: transaction-detail, type: push, label: "Transaction selected" }

  # ── Payments hub → the seven types ─────────────────────────────────────
  - { from: payments, to: pay-domestic-single, type: push, label: "Domestic single" }
  - { from: payments, to: pay-domestic-scheduled, type: push, label: "Domestic scheduled" }
  - { from: payments, to: pay-domestic-standing-order, type: push, label: "Domestic standing order" }
  - { from: payments, to: pay-international-single, type: push, label: "International single" }
  - { from: payments, to: pay-international-scheduled, type: push, label: "International scheduled" }
  - { from: payments, to: pay-international-standing-order, type: push, label: "International standing order" }
  - { from: payments, to: pay-vrp-mandate, type: push, label: "VRP mandates" }

  # ── Each type → the shared authorise leg, then the shared tracker ──────
  - { from: pay-domestic-single, to: payment-consent, type: push, label: "Confirm — stage consent" }
  - { from: pay-domestic-scheduled, to: payment-consent, type: push, label: "Confirm — stage consent" }
  - { from: pay-domestic-standing-order, to: payment-consent, type: push, label: "Confirm — stage consent" }
  - { from: pay-international-single, to: payment-consent, type: push, label: "Confirm — stage consent" }
  - { from: pay-international-scheduled, to: payment-consent, type: push, label: "Confirm — stage consent" }
  - { from: pay-international-standing-order, to: payment-consent, type: push, label: "Confirm — stage consent" }
  - { from: pay-vrp-mandate, to: payment-consent, type: push, label: "Create mandate — ONCE per mandate" }
  - { from: payment-consent, to: payment-status, type: replace, label: "Authorised — submitted" }
  # VRP pays WITHOUT a trip through payment-consent. One authorisation funds many payments —
  # routing each payment through the authorise leg would defeat the entire point of the rail.
  - { from: pay-vrp-mandate, to: payment-status, type: push, label: "Pay under mandate — no re-authentication" }
  - { from: payment-status, to: payments, type: pop, label: "Done" }
  - { from: payment-status, to: transaction-detail, type: push, label: "View transaction" }

  - { from: beneficiaries, to: payments, type: push, label: "Pay beneficiary" }
  # cards -> card-detail, cards -> transaction-detail and card-detail -> transactions all
  # removed 2026-08-07 with the two screens.
  # Creating a standing order is a PISP action and lives on the payments hub, not on the
  # read-only AIS list. There is NO edit edge: a PISP may not amend or cancel a standing order
  # (OBL Customer Experience Guidelines), so standing-order-detail carries the
  # use-your-bank-channel notice where the Edit button used to be.
  - { from: standing-orders, to: pay-domestic-standing-order, type: push, label: "New standing order" }
  - { from: standing-orders, to: standing-order-detail, type: push, label: "Standing order selected" }
  - { from: standing-order-detail, to: standing-orders, type: pop, label: "Back to list" }
  - { from: direct-debits, to: direct-debit-detail, type: push, label: "Direct debit selected" }
  - { from: direct-debits, to: accounts, type: push, label: "Linked account" }
  - { from: direct-debit-detail, to: direct-debits, type: pop, label: "Back to list" }
  - { from: direct-debit-detail, to: accounts, type: push, label: "Linked account" }
  - { from: products, to: accounts, type: push, label: "Open product" }
  - { from: consent-manager, to: settings, type: pop, label: "Back to Settings" }
  - { from: settings, to: consent-manager, type: push, label: "Data & Consent" }
  - { from: settings, to: about, type: push, label: "About" }
  - { from: profile, to: login, type: replace, label: "Logout" }

