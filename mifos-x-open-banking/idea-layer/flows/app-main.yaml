# flows/app-main.yaml — Entry point
# Updated 2026-05-25 by /idea sync STEP 4f
# Updated 2026-08-02 by /idea-sync — field-officer persona removed; consumer-only app
# Updated 2026-08-07 by /idea-sync — Cards tab struck from bottom_nav; the rail is FOUR tabs
# Routes to consumer-banking.yaml after login

schema_version: "1.0"
id: app-main
name: "App Entry"
description: "Bootstrap flow — Splash → Login → Consumer Home"
created_at: "2026-05-22"
updated_at: "2026-08-07"
status: active

entry_screen: splash
screens:
  - splash
  # Added 2026-08-03 (/idea-sync): both were in no flow at all. user-onboarding is the
  # first-run / post-revoke entry (entry_points: app_launch_no_consent), and
  # consent-callback is the deep-link return leg from the HSBC authorisation portal —
  # both are bootstrap/auth surfaces, so they belong to app-main.
  - user-onboarding
  - login
  - consent-callback
  # forgot-password removed 2026-08-06 (/idea-sync, OBP eviction) — there is no in-app password
  # under FAPI, so there is nothing to recover. The PSU authenticates at HSBC.
  - profile
  - settings
  # Shared legal screens
  - terms-of-service
  - privacy-policy
  # `licences` (British) is the slug that matches the shipped LicencesRoute in
  # feature/settings. The duplicate `licenses` screen was merged into it 2026-08-03.
  - licences

connections:
  - from: splash
    to: login
    type: replace
    label: "unauthenticated"
  - from: splash
    to: home
    type: replace
    label: "session restored"
  - from: login
    to: consent-callback
    type: deep_link
    label: "PSU authorises at HSBC — app-to-app redirect returns here"
  - from: consent-callback
    to: home
    type: replace
    label: "consent authorised, token exchanged"
  # There is no Forgot-password edge. The login screen carries no credential fields at all —
  # it starts the FAPI consent journey and hands off to HSBC's own site.
  - from: profile
    to: login
    type: replace
    label: "logout"
  # Legal screens (accessible from About)
  - from: about
    to: terms-of-service
    type: push
    label: "Terms of Service"
  - from: about
    to: privacy-policy
    type: push
    label: "Privacy Policy"
  - from: about
    to: licences
    type: push
    label: "Open Source Licences"
  - from: terms-of-service
    to: about
    type: pop
    label: "Back to About"
  - from: privacy-policy
    to: about
    type: pop
    label: "Back to About"
  - from: licences
    to: about
    type: pop
    label: "Back to About"

sub_flows:
  - id: consumer-banking
    file: "flows/consumer-banking.yaml"
    persona: consumer
    entry: home

bottom_nav:
  consumer:
    - { label: Home, target: home, icon: home }
    - { label: Accounts, target: accounts, icon: account_balance }
    # Retargeted 2026-08-06 (/idea-sync). The Pay tab now lands on the payments HUB — a grid of
    # seven payment-type tiles — instead of a linear send-money form that could only ever
    # express one of the seven. In source this is the SendMoneyRoute -> PlaceholderScreen("Pay")
    # binding, which /kmp-implement owes as PaymentsRoute.
    - { label: Pay, target: payments, icon: payments }
    # Cards TAB REMOVED 2026-08-07 (/idea-sync), confirmed by the repository owner.
    # The rail is FOUR tabs — Home, Accounts, Pay, More — and always has been in
    # design-system/app-shell.yaml, which is reverse-synced from the shipped
    # AuthenticatedNavBarTabItem.kt. The fifth tab entered this file from a single wrong
    # line in PROJECT_CONFIG.yaml (since corrected) and was never in the shipped rail, so
    # this file was the only place in the idea-layer asserting a five-tab shell.
    # The `cards` and `card-detail` SCREENS were deleted the same day — OBIE has no card
    # resource (a card is an Account whose Account[].SchemeName == UK.OBIE.PAN), so the tab
    # pointed at a screen that no longer exists as well as at a slot that never existed.
    - { label: More, target: more, icon: more_horiz }
