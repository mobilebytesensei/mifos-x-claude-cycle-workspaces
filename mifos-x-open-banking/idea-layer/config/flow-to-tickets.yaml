# flow-to-tickets.yaml — Ticket Management Configuration
# Project: mifos-x/mifos-x-open-banking
# Generated: 2026-05-28
# Managed by: /flow-to-tickets-config

ticket_management:
  # Default platform (set on first use or via /flow-to-tickets-config)
  default_platform: "jira"    # jira | github

  # Jira Configuration
  jira:
    site: "mifosforge.jira.com"
    board_url: "https://mifosforge.jira.com/jira/software/c/projects/MXOBA/boards/430"
    roadmap_project: "MXOBA"        # GSoC: MifosXOpenBanking (roadmap items as Epics)
    board_project: "MXOBA"          # GSoC: MifosXOpenBanking (stories/tasks)
    auth_method: "basic"            # basic | oauth | api_token
    auth_env_file: "idea-layer/config/.jira.env"   # gitignored — JIRA_EMAIL + JIRA_API_TOKEN
    email_env_var: "JIRA_EMAIL"
    token_env_var: "JIRA_API_TOKEN"

  # GitHub Configuration
  github:
    repo: "openMF/mifos-x-open-banking"
    labels:
      - "flow-generated"
      - "design"
    default_milestone: ""           # Optional default milestone

  # Mapping Configuration
  mapping:
    screen_to_story: true           # Each screen = 1 Story/Issue
    decision_to_task: true          # Each decision = 1 Task
    api_endpoint_to_task: true      # Each API = 1 Task
