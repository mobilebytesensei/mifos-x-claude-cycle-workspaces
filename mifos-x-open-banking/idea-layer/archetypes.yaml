---
schema_version: "1.0"
archetypes_version: "v1.0.0"
last_modified: "2026-05-09"
plan_origin: PLAN-prototype-llm-iframe-render
references:
  - PLAN-prototype-llm-iframe-render/ARCHETYPE.md
note: |
  Framework-base archetypes. Projects extend via idea-layer/archetypes.yaml
  (overrides on collision) or per-screen via ui.yaml#/archetype_overrides.
  Render command merges all three tiers.

# Single YAML document. This block previously ended with a `---` separator, which made the
# file a two-document stream; the dashboard's vocab-adapter reads it with a single-document
# parser, so it threw and reported zero archetypes. Metadata and archetypes now share one doc.

archetypes:

  - id: splash
    description: |
      App boot moment. Brand mark, single CTA or auto-dismiss.
      Used by every app's first screen.
    structure:
      - block: splash_brand
        shared_partial: _shared/splash-brand.html
        spacing:
          padding_x: --sp-6
          padding_y: --sp-12
      - block: brand_logo
        typography: { logo_text: --fs-display }
        surface: { background: --bg }
      - block: tagline
        typography: { tagline: --fs-h3 }
        spacing: { margin_top: --sp-3 }
      - block: cta_or_auto_dismiss
        spacing: { margin_top: --sp-8 }
    forbidden:
      - more than 1 CTA
      - hero carousel
      - bottom_nav
    allowed_variations:
      - omit tagline (logo-only splash)
      - omit cta (auto-dismiss after timeout)

  - id: onboarding_step
    description: |
      One-screen brand pitch + next-button. Repeats N times in a flow.
      Used for app intros, feature walkthroughs.
    structure:
      - block: progress_indicator
        spacing: { padding_x: --sp-4, padding_y: --sp-3 }
      - block: hero_illustration
        surface: { background: --bg, corner_radius: --r-lg }
        spacing: { padding_y: --sp-6 }
        height: 200-280dp
      - block: title_block
        typography: { title: --fs-h1, body: --fs-body }
        spacing: { padding_x: --sp-6, gap: --sp-3, margin_top: --sp-6 }
      - block: navigation_buttons
        slots: [skip_link, next_button]
        typography: { skip: --fs-meta, next: --fs-body }
        spacing: { padding: --sp-4, margin_top: auto }
    forbidden:
      - bottom_nav (onboarding owns the screen)
      - more than 1 hero per step
      - text below the navigation buttons
    allowed_variations:
      - omit skip_link on final step
      - omit progress_indicator on single-step onboarding

  - id: signin_form
    description: |
      Email + password + auth actions. Login, signup, forgot-password.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-default.html
        slots: [back_action, title]
      - block: brand_header
        typography: { title: --fs-h1 }
        spacing: { padding: --sp-6, margin_bottom: --sp-6 }
      - block: form_fields
        repeats: 2-3
        slots: [label, input, helper_or_error]
        typography: { label: --fs-meta, input: --fs-body }
        spacing: { field_gap: --sp-4, padding_x: --sp-4 }
      - block: primary_cta
        typography: { button_text: --fs-body }
        surface: { background: --primary, corner_radius: --r-md, elevation: --el-1 }
        spacing: { padding: --sp-4, margin_top: --sp-6 }
      - block: secondary_actions
        slots: [forgot_password_link, alt_signin_methods, signup_link]
        typography: { link: --fs-meta }
        spacing: { gap: --sp-3, margin_top: --sp-4 }
    forbidden:
      - bottom_nav
      - more than 1 primary CTA
      - inline form errors above the field (errors render below)
    allowed_variations:
      - add 1-3 social signin buttons in secondary_actions
      - omit signup_link on dedicated login screen

  - id: home_feed
    description: |
      Discovery home pattern: featured hero on top, multiple horizontal rails below.
      Used by media/commerce/social apps for content discovery.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-default.html
        slots: [title, search_action, notification_action]
      - block: hero_carousel
        typography: { title: --fs-display, subtitle: --fs-body }
        spacing: { padding_x: --sp-4, padding_y: --sp-3, item_gap: --sp-3 }
        surface: { background: --surface, corner_radius: --r-lg, elevation: --el-1 }
        height: 220-260dp
        auto_scroll: true
        page_dots: true
        gradient_overlay: true
      - block: section_rail
        repeats: 4-8
        slots: [section_header, see_all_link, horizontal_card_list]
        typography: { header: --fs-h2, see_all: --fs-meta }
        spacing: { section_gap: --sp-6, card_gap: --sp-3, padding_x: --sp-4 }
        card_variant: portrait_poster
        card_dimensions: { width: 140dp, height: 210dp, aspect: "2:3" }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - vertical card lists (use list_screen instead)
      - more than 1 hero per screen
      - mixing portrait + landscape cards in same rail
      - section gap other than --sp-6
    allowed_variations:
      - omit hero_carousel if no featured content
      - omit see_all_link on rails with <5 items
      - swap portrait_poster for landscape_thumb at archetype level (must apply to ALL rails)

  - id: detail_screen
    description: |
      Hero image + title + body + actions + related content rail.
      Used for movie/product/article/profile detail views.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-detail.html
        slots: [back_action, title, action_overflow]
      - block: hero_image
        surface: { background: --surface, corner_radius: --r-none }
        height: 240-320dp
        gradient_overlay: true
      - block: title_meta_row
        slots: [title, meta_chips, rating_badge]
        typography: { title: --fs-h1, meta: --fs-meta }
        spacing: { padding: --sp-4, gap: --sp-2 }
      - block: action_row
        slots: [primary_cta, secondary_action_1, secondary_action_2]
        typography: { button_text: --fs-body }
        spacing: { padding_x: --sp-4, gap: --sp-3, margin_top: --sp-3 }
      - block: body_text
        typography: { body: --fs-body, lh: --lh-loose }
        spacing: { padding: --sp-4, margin_top: --sp-4 }
      - block: section_rail
        repeats: 1-3
        slots: [section_header, horizontal_card_list]
        typography: { header: --fs-h2 }
        spacing: { section_gap: --sp-6, padding_x: --sp-4 }
    forbidden:
      - bottom_nav (detail owns the back stack)
      - more than 1 hero
      - title above the hero
    allowed_variations:
      - omit hero_image (text-only detail like article body)
      - omit related rails
      - swap action_row for FAB on action-light screens

  - id: list_screen
    description: |
      App-bar + filter row + lazy column or grid of items.
      Used for search results, watchlists, browse screens, inboxes.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-default.html
        slots: [back_or_menu, title, search_action, filter_action]
      - block: filter_chip_row
        spacing: { padding: --sp-4, gap: --sp-2 }
        typography: { chip_label: --fs-meta }
        surface: { background: --surface, corner_radius: --r-full }
        scrollable_horizontal: true
      - block: results_count_or_sort
        typography: { count: --fs-meta, sort_label: --fs-meta }
        spacing: { padding_x: --sp-4, padding_y: --sp-2 }
      - block: list_or_grid
        slots: [list_item OR grid_card]
        layout_variant: list  # OR grid
        typography: { primary: --fs-body, secondary: --fs-meta }
        spacing: { item_gap: --sp-3, padding_x: --sp-4 }
        surface: { item_corner_radius: --r-md }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - hero_carousel (use home_feed instead)
      - mixing list + grid in same screen
      - section gap other than --sp-3
    allowed_variations:
      - omit filter_chip_row (no filters defined)
      - omit results_count_or_sort
      - swap list ↔ grid via layout_variant (must apply to whole screen)

  - id: index_chips
    description: |
      Header + scrollable color-coded chip grid.
      Used for genre indexes, mood pickers, category indexes.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-default.html
        slots: [back_or_menu, title]
      - block: section_header
        typography: { header: --fs-h1 }
        spacing: { padding: --sp-4, margin_bottom: --sp-2 }
      - block: chip_grid
        layout: grid_2_or_3_columns
        typography: { chip_label: --fs-h3 }
        spacing: { padding_x: --sp-4, gap: --sp-3 }
        surface: { chip_corner_radius: --r-md, elevation: --el-1 }
        chip_height: 80-120dp
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - more than 3 columns
      - chips without color/iconography differentiation
      - long descriptive text inside chips (max 2 lines)
    allowed_variations:
      - omit bottom_nav (modal context)
      - swap 2 ↔ 3 columns at archetype level

  - id: settings
    description: |
      Grouped list rows with optional trailing element (toggle, chevron, value).
      Used for app settings, account preferences, configuration screens.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-default.html
        slots: [back_action, title]
      - block: settings_section
        repeats: 2-6
        slots: [section_label, settings_row+]
        typography: { section_label: --fs-meta, row_primary: --fs-body, row_meta: --fs-meta }
        spacing: { section_gap: --sp-6, row_padding: --sp-4 }
        surface: { row_background: --surface, divider: --border }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - settings rows without a section
      - inline editing within rows (use a detail screen)
      - more than 6 rows per section
    allowed_variations:
      - omit bottom_nav (modal/sheet context)
      - omit section_label on first section
      - mix toggle/chevron/value trailing elements within a section

  - id: about_marketing
    description: |
      Hero + 3-column features + CTA. Used for about/marketing screens
      inside-app (premium upsell, feature explainer).
    structure:
      - block: hero_block
        slots: [hero_image_or_brand, headline, subheadline]
        typography: { headline: --fs-display, subhead: --fs-h3 }
        spacing: { padding: --sp-6, gap: --sp-3 }
      - block: feature_columns
        layout: grid_3_columns_mobile_stack
        repeats: 3
        slots: [icon, feature_title, feature_body]
        typography: { feature_title: --fs-h2, feature_body: --fs-body }
        spacing: { column_gap: --sp-4, padding: --sp-4 }
      - block: testimonial_or_stat_strip
        spacing: { padding: --sp-6 }
      - block: bottom_cta
        typography: { cta_text: --fs-body }
        surface: { background: --primary, corner_radius: --r-md }
        spacing: { padding: --sp-6 }
    forbidden:
      - more than 3 feature columns
      - bottom_nav
      - more than 1 CTA per section
    allowed_variations:
      - omit testimonial_or_stat_strip
      - swap testimonial ↔ stat-strip

  - id: paywall
    description: |
      Plan-comparison cards + checkout CTA.
      Used for premium subscription screens, in-app purchase walls.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-detail.html
        slots: [close_action]
      - block: pitch_block
        typography: { headline: --fs-h1, body: --fs-body }
        spacing: { padding: --sp-6 }
      - block: feature_list
        slots: [feature_row+]
        typography: { feature: --fs-body }
        spacing: { padding_x: --sp-6, gap: --sp-3 }
      - block: plan_cards
        repeats: 2-3
        slots: [plan_name, price, period, included_features, plan_cta]
        typography: { plan_name: --fs-h2, price: --fs-display, period: --fs-meta }
        spacing: { padding: --sp-4, card_gap: --sp-3 }
        surface: { background: --surface, corner_radius: --r-lg, elevation: --el-1 }
      - block: legal_footer
        typography: { fine_print: --fs-micro }
        spacing: { padding: --sp-4, margin_top: --sp-4 }
    forbidden:
      - bottom_nav (paywall is a modal context)
      - more than 3 plans
      - hidden price (must always be visible)
    allowed_variations:
      - omit feature_list (price-led paywall)
      - swap plan card layout: side-by-side ↔ stacked

  - id: empty_state
    description: |
      Centered illustration + title + body + CTA. Used when a list/screen
      has no data. Most often a STATE VARIANT of another archetype, not a
      standalone screen.
    structure:
      - block: empty_illustration
        surface: { background: --surface, corner_radius: --r-lg }
        spacing: { margin_top: --sp-12 }
        height: 120-180dp
      - block: empty_title
        typography: { title: --fs-h1 }
        spacing: { margin_top: --sp-6, padding_x: --sp-6 }
      - block: empty_body
        typography: { body: --fs-body }
        spacing: { margin_top: --sp-3, padding_x: --sp-6 }
      - block: empty_cta
        typography: { button: --fs-body }
        surface: { background: --primary, corner_radius: --r-md }
        spacing: { margin_top: --sp-6, padding: --sp-4 }
    forbidden:
      - more than 1 CTA in empty
      - text below the CTA
    allowed_variations:
      - omit empty_body (illustration + title + CTA only)
      - omit empty_cta (no actionable next step)

  - id: error_state
    description: |
      Centered icon + explanation + retry. State variant.
    structure:
      - block: error_icon
        spacing: { margin_top: --sp-12 }
        height: 60-80dp
      - block: error_title
        typography: { title: --fs-h2 }
        spacing: { margin_top: --sp-4, padding_x: --sp-6 }
      - block: error_body
        typography: { body: --fs-body }
        spacing: { margin_top: --sp-2, padding_x: --sp-6 }
      - block: error_actions
        slots: [retry_cta, secondary_action]
        typography: { button: --fs-body }
        surface: { primary_background: --primary, secondary_background: --surface }
        spacing: { margin_top: --sp-6, gap: --sp-3, padding: --sp-4 }
    forbidden:
      - stack traces or technical jargon in error_body
      - more than 2 actions
    allowed_variations:
      - omit secondary_action (retry-only)

  - id: loading_state
    description: |
      Shimmer pattern matching the content state's block structure.
      Always rendered AFTER content state (its structure is the reference).
    structure:
      - block: shimmer_skeleton
        slots: [mirrors_content_state_blocks_block_for_block]
        surface: { background: --surface-variant }
        spacing: { matches_content_state_spacing: true }
        animation: pulse  # references @keyframes pulse defined in components.yaml#/motion
    forbidden:
      - text content in shimmer (rectangles only)
      - real images in shimmer (placeholder shimmer rectangles only)
      - shimmer block structure that does not match content state
    allowed_variations:
      - none — loading state is the most rule-bound variant

# ───────────────────────────────────────────────────────────────────
# Project extension contract:
#
# Projects can extend or override these archetypes via:
#   {project}/idea-layer/archetypes.yaml
#
# Patterns:
#   - extends: list_screen      # inherit and override
#     id: list_with_progress
#     structure_overrides:
#       - block: list_or_grid
#         slots: [progress_bar, ...inherited]   # add to inherited
#
# Per-screen rare overrides:
#   {project}/idea-layer/screens/{id}/ui.yaml#/archetype_overrides
#
# Resolution order (later wins on collision):
#   1. This file (framework base)
#   2. {project}/idea-layer/archetypes.yaml
#   3. screens/{id}/ui.yaml#/archetype_overrides
# ───────────────────────────────────────────────────────────────────
