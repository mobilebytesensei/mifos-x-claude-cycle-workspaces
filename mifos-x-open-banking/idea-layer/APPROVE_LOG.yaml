# ─── Bulk-run summaries ──────────────────────────────────────────────────────
# Restructured 2026-08-03 (/idea-sync). These five records were previously written as
# top-level `bulk_summary` .. `bulk_summary_5` keys placed INLINE between batches of log
# entries. Because each header was a mapping and the entries that followed it were sequence
# items at the same indent, the file was not valid YAML and would not parse at all — so the
# dashboard's approval-status-adapter, which reads `entries[]`, saw nothing. Moving the
# summaries here lets `entries:` run unbroken, which also restores 49 approve records that
# had been stranded under `bulk_summary` and were never part of `entries[]`.
