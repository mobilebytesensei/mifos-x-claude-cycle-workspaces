    context: "Re-approval after /idea-export-stitch (2026-05-30); 14 designed + 8 design_partial mechanically downgraded from approved by stitch-generate.ts. 0 blocked — all artifacts present, contract 1.1.0 current."

  - run_at: "2026-08-05T05:15:00Z"
    command: "/idea-approve --all-ready"
    total_approved: 40
    total_blocked: 6
    predicate_version: "1.0.0"
    contract_version: "2.0.0"
    context: "Re-approval after /idea-feature-export --all --force (2026-08-04) regenerated 40 SPEC.md + 40 API.md across 8 batches. 19 features were unapproved first (stale approve_hash predating the export run); 18 of those re-approved here, user-onboarding stayed enriched on C2. The other 22 approvals are the first for those features to carry a verifiable approve_hash — they had been approved under contract 1.1.0 with hash_before/hash_after both null."
    blocked:
      - { feature: about,            condition: C2, detail: "exports/about/SPEC.md older than its sibling YAML" }
      - { feature: licences,         condition: C2, detail: "exports/licences/SPEC.md does not exist; feature status is implemented" }
      - { feature: payment-result,   condition: C2, detail: "exports/payment-result/SPEC.md older than its sibling YAML" }
      - { feature: privacy-policy,   condition: C2, detail: "exports/privacy-policy/SPEC.md older than its sibling YAML" }
      - { feature: terms-of-service, condition: C2, detail: "exports/terms-of-service/SPEC.md older than its sibling YAML" }
      - { feature: user-onboarding,  condition: C2, detail: "exports/user-onboarding/SPEC.md does not exist" }
    notes:
      - "C7 (last_verify cache) is unset project-wide — non-fatal, does not gate approval. 46/46 features carry no last_verify."
      - "The 6 blocked features are exactly the 6 the export run skipped on E1, so the blocker set is self-consistent with the export ledger."
      - "docs.yaml is excluded from the C2 staleness basis; the lifecycle fields it carries (status, approve_hash, approved_at, status_history) churn independently of anything an export renders."
      - >-
        CROSS_LEAK repair applied in the same run, AFTER the first hash stamp: `status` was
        removed from all 46 ui.yaml (sibling-layout.json assigns it to docs). It disagreed with
        docs.yaml in 26 of 46 — 20 read `implemented`, 3 `enriched`, 3 a stale `approved`. Each
        removal records the value it held in a comment, so nothing is lost. Touching ui.yaml
        invalidated the first stamp, so all 40 approve_hash values were RE-computed and re-stamped
        against the post-repair source; the hash_after values above are the re-stamped ones. The
        intermediate hashes were never consumed by any command.
      - >-
        Four SPEC.md Status rows were stale against their docs.yaml owner and were corrected:
        login (implemented → approved), about / privacy-policy / terms-of-service (approved →
        enriched). `Status` is the ONLY SPEC-rendered field derived from the removed ui.yaml key,
        so with it reconciled the exports are current with respect to the repair.
      - >-
        20 features carry `implemented` in the removed ui.yaml copy while docs.yaml now reads
        `approved`. That is a genuine open question, NOT resolved by this run: those features are
        shipped in source, but their specs were regenerated on 2026-08-04, so the shipped code has
        not been re-verified against the current spec. Treat `approved` as "spec approved, device
        re-verification pending", and re-run /kmp-implement + device-verify before claiming done.
