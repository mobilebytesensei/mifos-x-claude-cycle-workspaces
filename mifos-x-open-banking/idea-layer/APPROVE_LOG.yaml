schema_version: "1.0.0"
project: mifos-x/mifos-x-open-banking
created_at: "2026-05-25T12:00:00Z"

# ─────────────────────────────────────────────────────────────────────────────
# VOIDED APPROVALS — the feature was deleted after it was approved
# ─────────────────────────────────────────────────────────────────────────────
# This log is append-only: no entry below is ever edited or removed. When a feature is deleted
# outright, its approval records stay exactly as written and are declared VOID here instead. An
# approval attests that a spec was fit to implement; deleting the spec does not make that
# attestation false, it makes it moot. Reading an approval for a feature that no longer exists as
# still-live is the failure mode this block prevents.
voided_approvals:
  - features: [cards, card-detail]
    voided_at: "2026-08-07"
    voided_by: "repository owner"
    status: superseded-by-deletion
    affected_entries: >-
      Every `feature: cards` and `feature: card-detail` entry in `entries` below, across all
      seven approval passes: the 2026-06-02 bulk approve, the 2026-05-31 cards approve, the
      2026-06-11 source-drift reconciliation batch, and the 2026-08-05 `--all-ready` bulk
      approval (the first pass carrying verifiable approve_hash values). None is removed.
    reason: >-
      cards and card-detail were DELETED — screens, exports, mockups and flow edges — not
      deferred and not demoted. OBIE has no card resource: a card is an Account whose
      Account[].SchemeName is UK.OBIE.PAN, which is why the Card and CardAccountRef DTOs were
      already deleted on 2026-08-06. The screens were spared in that pass on the argument that
      filtering the accounts list to PAN entries is a legitimate surface; the repository owner
      has overruled it — the feature originated in the OLD OBP PLANNING and goes with it.
    what_the_approvals_attested_to: >-
      A contract that could not be honoured. card-detail's ui.yaml shipped a freeze/unfreeze
      toggle (~line 228) and Spending Limits sections (~lines 263-282) while carrying its own
      comment, at ~line 235, that OBIE HAS NO CARD WRITE OF ANY KIND. CAPABILITY_GAPS recorded
      the same contradiction as the open CARD-WRITE-UNBACKED finding, and the 2026-08-06 pass
      had already flagged both features under `revalidation_owed` because their api.yaml changed
      after approval. The revalidation is now moot: they were deleted rather than re-approved.
    note: >-
      Do NOT confuse these with the commercial-credit-cards product family in the Open Data
      Product Finder (dtos/CccProduct.yaml) — a different resource on a different host, part of
      the live products catalogue, and unaffected.

