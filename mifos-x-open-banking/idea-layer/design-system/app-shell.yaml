schema_version: "1.0"
project: "mifos-x-open-banking"

# ─── Bottom navigation (primary-flow chrome) ────────────────────────────
# Reverse-synced from source 2026-07-28 against
# cmp-navigation/authenticatednavbar/AuthenticatedNavBarTabItem.kt.
# Shipped rail: Home | Accounts | Pay | More
bottom_navigation:
  enabled: true
  # Rail updated 2026-06-30: Home added as primary landing (shows the currently selected
  # account); Consents removed from the rail and surfaced via Settings → Manage consents
  # (consent-list stays fully reachable). Corrected 2026-07-28: tab 2 is Pay, not
  # Transactions, and the Home "Manage consents" quick-action does not exist in source —
  # homeGraph exposes only transactions and transaction-detail callbacks.
  items:
    - id: home
      label: "Home"
      icon: "home"
      target_screen: home
      order: 0
    - id: accounts
      label: "Accounts"
      icon: "account_balance"
      target_screen: accounts
      order: 1
    # Reverse-synced 2026-07-28: source ships a "Pay" tab here, not "Transactions".
    # Updated 2026-07-30 (/idea-evolve): PISP scope reversal materialized send-money.
    # ── CORRECTED 2026-08-07 (/idea-sync) ──
    # target_screen read `send-money`, a screen DELETED by the 2026-08-06 seven-type rewrite.
    # This was a LIVE nav edge from the bottom navigation to a non-existent screen — the same
    # defect class fixed the same day in payment-consent/flow.yaml and payment-status/flow.yaml,
    # and it was missed by the first sweep because that scan covered screens/ and not
    # design-system/. The app shell is exactly where a dangling tab target hurts most.
    - id: pay
      label: "Pay"
      icon: "payments"
      target_screen: payments
      order: 2
      implementation_status: specified
      source_binding: "AuthenticatedNavBarTabItem.PayTab -> SendMoneyRoute"
      retarget_2026_08_07:
        was: send-money
        now: payments
        why: >-
          FR-012a makes the payments grid hub the Pay tab's landing destination, replacing the
          SendMoneyRoute placeholder. The hub is the only screen that presents all seven rails
          as distinct choices, which is the whole reason the single send-money form was retired:
          the rails differ in ways one generic form cannot express.
        verified: "screens/payments/ exists; its 7 tiles all resolve (checked 2026-08-07)."
      target_binding_pending: >-
        SendMoneyRoute must be repointed off bankingPlaceholderDestinations() to the
        feature/payments module (the hub), exactly as settings replaced the MoreRoute
        placeholder: repoint graphRoute and startDestinationRoute, then delete the placeholder
        route and its bankingPlaceholderDestinations() line in the SAME commit. PayTab is flat
        (graphRoute == startDestinationRoute), so the navigateToTab graph-route trap that
        affects the Home tab does not apply here.
        NOTE the source symbol is still named SendMoneyRoute; renaming it to PaymentsRoute is
        part of the same change, not a follow-up.
      drift_note: >-
        The tab still renders PlaceholderScreen("Pay") in source until P3 is implemented — the
        idea-layer is ahead of source here, which is the intended direction. What changed on
        2026-08-07 is only WHICH screen it is ahead toward: the hub, not the deleted form.
    - id: more
      label: "More"
      icon: "more_horiz"
      target_screen: settings
      order: 3
  selected_color: "primary"
  unselected_color: "onSurfaceVariant"

# ─── Top app bar ────────────────────────────────────────────────────────
top_app_bar:
  enabled: true
  variant: "small"
  title_source: "screen"
  static_title: null
  leading: "auto"
  trailing_actions: []

# ─── Navigation drawer (off — bottom nav is primary) ────────────────────
drawer:
  enabled: false
  items: []

# ─── FAB host ───────────────────────────────────────────────────────────
fab_host:
  enabled: true
  default_position: "bottom-end"
  per_screen_overrideable: true

# ─── Snackbar host ──────────────────────────────────────────────────────
snackbar_host:
  enabled: true
  default_position: "bottom"
  z_index: 100

# ─── Safe-area handling ─────────────────────────────────────────────────
safe_area:
  top: "respect"
  bottom: "respect"
  notch_handling: "extend-and-pad"

# ─── Per-screen defaults (screen.ui.yaml.shell overrides these) ─────────
defaults:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  drawer_accessible: false
  fab_visible: false
  snackbar_visible: true
