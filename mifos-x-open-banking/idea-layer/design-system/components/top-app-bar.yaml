# template_meta
# template_version: "2.81.0"
# template_path: "templates/specialized/idea-layer/design-system/templates/components/_universal/top-app-bar.yaml"
# last_modified: "2026-03-19"

name: TopAppBar
type: universal
m3Component: TopAppBar

spec:
  height: 64dp
  type: centerAligned
  backgroundColor: $surface
  titleColor: $onSurface
  titleTypography: titleLarge
  iconSize: 24dp
  iconColor: $onSurface
  iconTapTarget: 48dp
  elevation: 0
  paddingHorizontal: 16dp

states:
  scrolled:
    backgroundColor: $surfaceContainer
    elevation: 2dp

lightVariant:
  backgroundColor: $light.surface
  titleColor: $light.onSurface
  iconColor: $light.onSurface

actions:
  leading: $icon.back
  trailing:
    - $icon.search
    - $icon.more

rules:
  - "Maximum 2 trailing action icons"
  - "Title truncates with ellipsis, never wraps"
  - "All icons use 48dp tap targets"
  - "Use consistent icon style (regular weight, 24dp)"
