name: OutlinedButton
type: universal
m3Component: OutlinedButton

spec:
  height: 48dp
  cornerRadius: 8dp
  backgroundColor: transparent
  borderWidth: 1dp
  borderColor: $outline
  textColor: $primary
  typography: labelLarge
  paddingHorizontal: 24dp

states:
  disabled:
    borderColor: $onSurface
    borderOpacity: 0.12
    textColor: $onSurface
    textOpacity: 0.38

lightVariant:
  borderColor: $light.outline
  textColor: $light.primary

rules:
  - "Use for secondary actions alongside PrimaryButton"
  - "Same height as PrimaryButton for alignment"
