id: amount_field
category: input
m3: OutlinedTextField
added: "1.1.0"
tokens_ref: "../design-tokens.yaml#form.amount_field"

purpose: >-
  Money entry. Distinct from `amount`, which displays a value the bank supplied: this one is
  editable, validated, and the single field in the app where a wrong character costs the
  customer money.

anatomy:
  radius: "{radius.small}"        # 8dp — inputs sit tighter than cards (12dp).
                                  # repathed 2026-08-02 — radius promoted out of spacing (tokens 2.2.0)
  min_height_dp: 56
  typography: headlineSmall
  font: "{typography.font_family.mono}"
  alignment: left
  prefix:
    content: "currency symbol for the selected debtor account"
    role: onSurfaceVariant
    editable: false
  label_position: above
  helper_or_error_position: below

states:
  default:  { outline: { light: "#72787E", dark: "#8B9198" }, width_dp: 1 }
  focused:  { outline: { light: "#266489", dark: "#95CDF7" }, width_dp: 2 }
  error:    { outline: { light: "#BA1A1A", dark: "#FFB4AB" }, width_dp: 2, message: required }
  disabled: { opacity: 0.38 }

value_contract:
  held_as: minor_units
  displayed_as: formatted_major_units
  formatter: "core/common FormatMoney"
  why: >-
    Float arithmetic on money is a defect class of its own. The value is a minor-unit string
    end to end; only the display is formatted, and formatting happens in the ViewModel so the
    composable receives a finished label.

validation:
  timing: on_change_after_first_blur
  why: >-
    Validating from empty on every keystroke flags a half-typed amount as wrong, which reads
    as hostile. Waiting until the field has been left once, then live thereafter, keeps
    correction fast without punishing typing.
  rules:
    - { id: AF-1, check: "parses as a positive integer count of minor units", error_key: "InvalidAmount" }
    - { id: AF-2, check: "> 0", error_key: "AmountNotPositive" }
    - { id: AF-3, check: "<= selected account available balance", error_key: "ExceedsAvailableBalance" }
  blocks_advance: true

rules:
  - id: AF-4
    rule: "Mono font is not decorative — it is required."
    why: "Proportional digits reflow the field width while typing, which makes an amount feel unstable."
  - id: AF-5
    rule: "The currency prefix is never part of the editable value."
    why: "A customer selecting-all and typing must not be able to delete the currency."
  - id: AF-6
    rule: "Server-side limit rejection (OBIE U014) returns the customer to this field, not to an error screen."
    why: "The amount is the only thing they can change, so put them where the change is made."

a11y:
  contrast:
    error_text: { light: 6.14, dark: 10.90, target: 4.5, verdict: pass }
    outline_default: { light: 4.24, dark: 5.82, target: 3.0, verdict: pass }
    outline_focus: { light: 6.11, dark: 10.89, target: 3.0, verdict: pass }
  announce: "Label, current value, and error text when present. Error is announced, not only shown."
  keyboard: decimal

consumers:
  # RETARGETED 2026-08-07 — `send-money` was deleted by the 2026-08-06 seven-type rewrite.
  - pay-domestic-single
  - pay-domestic-scheduled
  - pay-domestic-standing-order
  - pay-international-single
  - pay-international-scheduled
  - pay-international-standing-order
  - pay-vrp-mandate

per_rail_note: >-
  The FIELD is one component; the FIELD NAME it submits is not. A domestic standing order sends
  FirstPaymentAmount and is refused (U005) if given InstructedAmount; an international standing
  order is the exact inverse. See design-tokens.yaml#rail_form_shape.amount_field_is_mutually_exclusive.
  AF-3 (<= available balance) applies only where the rail HAS funds confirmation — the four
  deferred rails have no such endpoint, so the check cannot run and must not be implied.
