name: SearchBar
type: universal
m3Component: SearchBar

spec:
  height: 56dp
  cornerRadius: 9999dp
  backgroundColor: $surfaceVariant
  textColor: $onSurface
  hintColor: $onSurfaceVariant
  iconColor: $onSurfaceVariant
  iconSize: 24dp
  leadingIcon: $icon.search
  clearIcon: $icon.close
  iconTapTarget: 48dp
  paddingHorizontal: 16dp

states:
  focused:
    borderWidth: 2dp
    borderColor: $primary

lightVariant:
  backgroundColor: $light.surfaceVariant
  textColor: $light.onSurface
  hintColor: $light.onSurfaceVariant

rules:
  - "Clear button appears only when text is entered"
  - "Leading search icon is decorative (not tappable)"
  - "48dp tap target on clear button"
