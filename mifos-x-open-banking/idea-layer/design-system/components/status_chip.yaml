id: status_chip
category: status
m3: AssistChip
added: "1.1.0"
tokens_ref: "../design-tokens.yaml#semantic.payment_disposition"

purpose: >-
  Renders the disposition of a submitted payment. Exists because OBIE payment status is not a
  success/failure pair: a successful submit returns AcceptedSettlementInProcess, which means
  accepted but not settled. A two-state chip would force that into "success" and tell a
  customer their money had moved when it had not.

variants:
  in_progress:
    container:    { light: "#D3E5F5", dark: "#384956" }
    on_container: { light: "#384956", dark: "#D3E5F5" }
    icon: schedule
    contrast_ratio: 7.22
    obie_statuses: [AcceptedSettlementInProcess, AcceptedWithoutPosting, Pending]
    label_guidance: "State that it is still moving — 'In progress', 'Being processed'. Never 'Sent'."
  terminal_success:
    container:    { light: "#C9E6FF", dark: "#004B6F" }
    on_container: { light: "#004B6F", dark: "#C9E6FF" }
    icon: check_circle
    contrast_ratio: 7.27
    obie_statuses: [AcceptedSettlementCompleted, AcceptedCreditSettlementCompleted]
    label_guidance: "Only here may the copy say the money has left / arrived."
  terminal_failure:
    container:    { light: "#FFDAD6", dark: "#93000A" }
    on_container: { light: "#93000A", dark: "#FFDAD6" }
    icon: error
    contrast_ratio: 7.24
    obie_statuses: [Rejected]
    label_guidance: >-
      States that the BANK did not make the payment. Never worded as user error — no "invalid",
      no "you", no correction affordance implying the customer mis-typed.
  instruction_established:
    # NEW 1.4.0 — the four DEFERRED rails, which have NO per-execution status.
    container:    { light: "#DDE3EA", dark: "#41474D" }   # surfaceVariant
    on_container: { light: "#41474D", dark: "#C1C7CE" }   # onSurfaceVariant
    icon: event_repeat
    contrast_ratio: 7.28        # measured as W-30; dark 5.52
    obie_statuses: [InitiationCompleted, INCO]
    applies_to_rails: [domestic-scheduled, domestic-standing-order, international-scheduled, international-standing-order]
    label_guidance: >-
      Names the INSTRUCTION, never the money — "Standing order set up", "Scheduled for 14 March".
      FORBIDDEN substrings: paid, sent, complete, completed, successful, past-tense amounts.
    why_neutral: >-
      Deliberately hue-less. A neutral chip makes no claim about money, which is exactly the
      claim available here: INCO means the instruction EXISTS at the bank, not that it executed.

anatomy:
  shape_radius: "{radius.full}"   # repathed 2026-08-02 — radius promoted out of spacing (tokens 2.2.0)
  min_height_dp: 32
  padding: { horizontal_dp: 12, vertical_dp: 6 }
  icon_size_dp: 18
  label_typography: labelLarge
  leading_icon: required
  text_label: required

rules:
  - id: SC-1
    rule: "Icon AND text label are both required on every variant."
    why: >-
      WCAG 1.4.1 (use of colour) — colour alone must not convey state. It is also what makes
      the truthfulness rule auditable: a reviewer reads the label, not the hue.
  - id: SC-2
    rule: "in_progress MUST NOT use the primary role."
    why: >-
      Primary is the credit/positive colour in this system, so a primary chip reads as
      'money arrived'. Neutral slate reads as 'working'.
  - id: SC-3
    rule: "An OBIE status outside the mapped vocabulary renders as in_progress."
    why: "Failing open toward still-working is the only safe guess; guessing success is the worst outcome."
    corrected_1_4_0: >-
      This rule used to swallow INCO, the TERMINAL status of four of the seven rails — so every
      scheduled payment and standing order rendered as perpetually in_progress. INCO now maps
      explicitly to instruction_established. SC-3 still governs GENUINELY unknown codes.
    corrected_2026_08_07: >-
      The line above used to end "BLCK (Blocked) remains unmapped and is the next known gap".
      It is not a gap: dtos/ObPaymentStatus.yaml — the source of truth for status mapping —
      lists BLCK under dispositions.terminal_failure.members alongside RJCT, explicitly. BLCK
      renders with the terminal_failure variant and never reaches SC-3.
  - id: SC-4
    rule: "No green. No celebratory treatment on terminal_success."
    why: "System-wide calm-finance constraint; a settled payment is routine, not an achievement."
  - id: SC-5
    rule: "instruction_established MUST NOT use a tick glyph or any tonal container."
    why: >-
      A tick and a coloured container both claim an outcome. The deferred rails have no outcome
      to claim — only an instruction that exists.
  - id: SC-6
    rule: "This component NEVER renders VRP mandate health. Use mandate_health_chip."
    why: >-
      Health is derived from payment outcomes, not from the status ladder, and three of its four
      states coexist with Data.Status == AUTH. Separate components stop a generator wiring
      health to consent status because the two chips look alike.

a11y:
  contrast_target: "WCAG AA 4.5:1"
  measured: "all six pairs 7.22-7.27:1"
  announce: "Role status; announce the label text, not the colour."

consumers:
  - payment-status
