# template_meta
# template_version: "2.81.0"
# template_path: "templates/specialized/idea-layer/design-system/templates/components/_categories/banking/balance-card.yaml"
# last_modified: "2026-03-19"

name: BalanceCard
type: category
m3Component: Custom
category: banking

spec:
  cornerRadius: 20dp
  backgroundColor: $primaryContainer
  contentPadding: 24dp
  elevation: 2dp

balance:
  labelTypography: bodyMedium
  labelColor: $onPrimaryContainer
  amountTypography: displaySmall
  amountColor: $onPrimaryContainer
  currencyTypography: titleLarge
  currencyColor: $onPrimaryContainer

accountInfo:
  typeTypography: labelLarge
  typeColor: $onPrimaryContainer
  numberTypography: bodyMedium
  numberColor: $onPrimaryContainer
  numberMasked: true

quickActions:
  iconSize: 24dp
  iconColor: $onPrimaryContainer
  labelTypography: labelSmall
  labelColor: $onPrimaryContainer
  tapTarget: 48dp
  spacing: 32dp
  actions:
    - icon: $icon.send
    - icon: $icon.add
    - icon: $icon.more

lightVariant:
  backgroundColor: $light.primaryContainer
  amountColor: $light.onPrimaryContainer
  iconColor: $light.onPrimaryContainer

rules:
  - "Balance prominently displayed (displaySmall)"
  - "Account number partially masked for security"
  - "Quick actions row at bottom"
  - "48dp tap targets on quick actions"
