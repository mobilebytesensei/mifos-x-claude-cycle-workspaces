# template_path: "templates/specialized/idea-layer/design-system/templates/components/_universal/bottom-navigation.yaml"
# last_modified: "2026-03-19"

name: BottomNavigation
type: universal
m3Component: NavigationBar

spec:
  height: 80dp
  maxItems: 5
  minItems: 3
  backgroundColor: $surfaceContainer
  selectedColor: $primary
  unselectedColor: $onSurfaceVariant
  indicatorColor: $secondaryContainer
  indicatorShape: pill
  iconSize: 24dp
  labelTypography: labelMedium
  touchTarget: 48dp
  elevation: 3dp

lightVariant:
  backgroundColor: $light.surfaceContainer
  selectedColor: $light.primary
  unselectedColor: $light.onSurfaceVariant
  indicatorColor: $light.secondaryContainer

rules:
  - "3-5 items only, never 2 or 6+"
  - "Always show labels with icons"
  - "Selected item uses pill-shaped indicator"
  - "All items have 48dp tap targets"
