# template_meta
# template_version: "2.81.0"
# template_path: "templates/specialized/idea-layer/design-system/templates/components/_universal/primary-button.yaml"
# last_modified: "2026-03-19"

name: PrimaryButton
type: universal
m3Component: FilledButton

spec:
  height: 48dp
  cornerRadius: 8dp
  backgroundColor: $primary
  textColor: $onPrimary
  typography: labelLarge
  paddingHorizontal: 24dp
  minWidth: 64dp

states:
  disabled:
    backgroundColor: $onSurface
    opacity: 0.12
    textColor: $onSurface
    textOpacity: 0.38

lightVariant:
  backgroundColor: $light.primary
  textColor: $light.onPrimary

rules:
  - "Minimum 48dp height for touch target"
  - "Full-width on mobile forms, auto-width elsewhere"
  - "Never stack more than 2 buttons horizontally"
