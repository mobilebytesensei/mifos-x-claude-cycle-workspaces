# template_meta
# template_version: "2.81.0"
# template_path: "templates/specialized/idea-layer/design-system/templates/components/_universal/text-field.yaml"
# last_modified: "2026-03-19"

name: TextField
type: universal
m3Component: FilledTextField

spec:
  height: 56dp
  cornerRadiusTop: 4dp
  cornerRadiusBottom: 0dp
  backgroundColor: $surfaceVariant
  textColor: $onSurface
  labelColor: $onSurfaceVariant
  indicatorColor: $onSurfaceVariant
  indicatorHeight: 1dp
  typography: bodyLarge
  paddingHorizontal: 16dp

states:
  focused:
    labelColor: $primary
    indicatorColor: $primary
    indicatorHeight: 2dp
  error:
    labelColor: $error
    indicatorColor: $error
    supportingTextColor: $error

lightVariant:
  backgroundColor: $light.surfaceVariant
  textColor: $light.onSurface

rules:
  - "Always include a label (not just placeholder)"
  - "Supporting text below for errors/hints"
  - "48dp minimum touch target"
