# last_modified: "2026-03-19"

name: LoadingStates
type: universal
m3Component: ProgressIndicator

shimmer:
  backgroundColor: $surfaceVariant
  highlightColor: $surface
  duration: 1.5s
  easing: ease-in-out
  cornerRadius: 8dp

circularProgress:
  size: 48dp
  strokeWidth: 4dp
  color: $primary
  trackColor: $surfaceVariant

linearProgress:
  height: 4dp
  color: $primary
  trackColor: $surfaceVariant
  cornerRadius: 9999dp

lightVariant:
  shimmer:
    backgroundColor: $light.surfaceVariant
    highlightColor: $light.surface
  circularProgress:
    color: $light.primary
  linearProgress:
    color: $light.primary

rules:
  - "Use shimmer for content placeholders (cards, lists)"
  - "Use circular for indeterminate waits"
  - "Use linear for determinate progress (uploads, downloads)"
