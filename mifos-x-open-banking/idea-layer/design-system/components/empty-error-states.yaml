# template_meta
# template_version: "2.81.0"
# template_path: "templates/specialized/idea-layer/design-system/templates/components/_universal/empty-error-states.yaml"
# last_modified: "2026-03-19"

name: EmptyErrorStates
type: universal
m3Component: Custom

emptyState:
  iconSize: 48dp
  iconColor: $onSurfaceVariant
  titleTypography: headlineSmall
  titleColor: $onSurface
  subtitleTypography: bodyMedium
  subtitleColor: $onSurfaceVariant
  ctaTypography: labelLarge
  ctaColor: $primary
  spacing: 16dp

errorState:
  iconSize: 48dp
  iconColor: $error
  icon: $icon.error
  titleTypography: headlineSmall
  titleColor: $onSurface
  subtitleTypography: bodyMedium
  subtitleColor: $onSurfaceVariant
  retryButtonColor: $primary
  spacing: 16dp

lightVariant:
  emptyState:
    iconColor: $light.onSurfaceVariant
    titleColor: $light.onSurface
  errorState:
    iconColor: $light.error
    titleColor: $light.onSurface

rules:
  - "Every screen must handle empty and error states"
  - "Error state always includes a retry action"
  - "Icon + title + subtitle + CTA button layout"
  - "Centered vertically in available space"
