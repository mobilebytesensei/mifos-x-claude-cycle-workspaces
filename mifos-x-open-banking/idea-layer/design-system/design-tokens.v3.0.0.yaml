# ─── Typography (Material 3 type scale — Outfit) ─────────────────────────────
typography:
  font_families:
    display: "Outfit"
    body: "Outfit"
    label: "Outfit"

  # Convenience aliases for DESIGN.md front matter coherence checks
  display:
    family: "Outfit"
  heading:
    family: "Outfit"

  scale:
    display_lg:   { size: 57, line: 64, weight: 400, tracking: -0.25 }
    display_md:   { size: 45, line: 52, weight: 400, tracking: 0 }
    display_sm:   { size: 32, line: 40, weight: 600, tracking: 0 }

    headline_lg:  { size: 32, line: 40, weight: 400, tracking: 0 }
    headline_md:  { size: 28, line: 36, weight: 400, tracking: 0 }
    headline_sm:  { size: 24, line: 32, weight: 600, tracking: 0 }

    title_lg:     { size: 22, line: 28, weight: 400, tracking: 0 }
    title_md:     { size: 16, line: 24, weight: 500, tracking: 0.15 }
    title_sm:     { size: 14, line: 20, weight: 500, tracking: 0.1 }

    body_lg:      { size: 16, line: 24, weight: 400, tracking: 0.5 }
    body_md:      { size: 14, line: 20, weight: 400, tracking: 0.25 }
    body_sm:      { size: 12, line: 16, weight: 400, tracking: 0.4 }

    label_lg:     { size: 14, line: 20, weight: 500, tracking: 0.1 }
    label_md:     { size: 12, line: 16, weight: 500, tracking: 0.5 }
    label_sm:     { size: 11, line: 16, weight: 500, tracking: 0.5 }

# ─── Spacing (8dp grid) ──────────────────────────────────────────────────────
spacing:
  none:   0
  xs:     4
  sm:     8
  md:     16
  lg:     24
  xl:     32
  xxl:    48
  xxxl:   64

# ─── Radius ──────────────────────────────────────────────────────────────────
radius:
  none:   0
  xs:     4
  sm:     8
  md:     12
  lg:     16
  xl:     24
  pill:   999

# ─── Touch Targets ───────────────────────────────────────────────────────────
touchTargets:
  min_touch_target: 48       # M3 standard 48dp minimum
  min_text_size: 14          # sp — body minimum for readability
  spacing_between_targets: 8 # dp — prevent mis-taps on adjacent controls

# ─── Elevation (Material 3 levels) ───────────────────────────────────────────
elevation:
  level0: 0
  level1: 1
  level2: 3
  level3: 6
  level4: 8
  level5: 12

# ─── Motion ──────────────────────────────────────────────────────────────────
motion:
  duration:
    short1:   50
    short2:   100
    short3:   150
    short4:   200
    medium1:  250
    medium2:  300
    medium3:  350
    medium4:  400
    long1:    450
    long2:    500
  easing:
    standard:         "cubic-bezier(0.2, 0, 0, 1)"
    standard_accel:   "cubic-bezier(0.3, 0, 1, 1)"
    standard_decel:   "cubic-bezier(0, 0, 0, 1)"
    emphasized:       "cubic-bezier(0.2, 0, 0, 1)"
    emphasized_accel: "cubic-bezier(0.3, 0, 1, 1)"
    emphasized_decel: "cubic-bezier(0.05, 0.7, 0.1, 1)"

# ─── Iconography ─────────────────────────────────────────────────────────────
iconography:
  set: "Material Symbols Outlined"
  default_size: 24
  sizes: [16, 20, 24, 32, 40, 48]

# ─── Mood Gradients (brand hero surfaces) ────────────────────────────────────
mood_gradients:
  growth_dawn:
    description: "Morning optimism — light primary container to warm off-white"
    stops:
      - { offset: "0%",   color: "#CDEDA3" }
      - { offset: "100%", color: "#F9FAEF" }
    direction: "135deg"
    usage: "Balance card hero, onboarding splash"

  financial_stability:
    description: "Grounded trust — primary to deep primary container"
    stops:
      - { offset: "0%",   color: "#4C662B" }
      - { offset: "60%",  color: "#354E16" }
      - { offset: "100%", color: "#102000" }
    direction: "160deg"
    usage: "Account summary hero, statement header"

  field_dusk:
    description: "Professional warmth — teal secondary gradient for field-officer surfaces"
    stops:
      - { offset: "0%",   color: "#386663" }
      - { offset: "100%", color: "#1F4E4B" }
    direction: "120deg"
    usage: "Field-officer mode header, KYC progress bar"

  trust_horizon:
    description: "Neutral calm — subtle surface gradient for empty/loading states"
    stops:
      - { offset: "0%",   color: "#F0F1E6" }
      - { offset: "100%", color: "#E1E4D5" }
    direction: "180deg"
    usage: "Skeleton shimmer base, empty state background"

# ─── Component Tokens ────────────────────────────────────────────────────────
component_tokens:
  button:
    height_default: 40
    height_compact: 32
    padding_horizontal: 24
    radius: pill
  card:
    radius: md
    padding: md
    border_color: outline_variant
    elevation: level0
  text_field:
    height: 56
    radius: xs
    border_color: outline
  app_bar:
    height: 56
    background: background
  bottom_nav:
    height: 80
    background: background
    border_top: outline_variant
    active_indicator: nav_active_indicator
    tabs: [Home, Accounts, Payments, Profile]
  badge:
    height: 24
    radius: sm
    padding_horizontal: 10
    variants:
      success: { background: primary, text: on_primary }
      pending: { background: pending, text: on_primary }
      failed:  { background: error, text: on_error }
  fab:
    size: 56
    radius: lg
    background: primary
    icon_color: on_primary
