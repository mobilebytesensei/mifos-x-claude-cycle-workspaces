schema_version: "2.4.0"
previous_version: "2.3.0"
# 2.4.0 (2026-08-07, /design-system) — accounts for two capability areas that landed after
# 2.3.0: payment initiation across SEVEN rails, and three unauthenticated Open Data surfaces.
# Added: semantic.payment_disposition.instruction_established (a FOURTH disposition for the four
# DEFERRED rails, which have no per-execution status), semantic.mandate_health (four states,
# never derived from consent status), semantic.open_data_states, and rail_form_shape.
# irreversible_action.applies_to widened from one screen to all seven rails.
# PURELY ADDITIVE on values: no colour role, seed, font, type scale, radius, spacing, elevation
# or motion value changed, and NO new hue was minted — every new semantic maps onto a role the
# palette already ships. NO new contrast pair was measured; each new entry cites a pair measured
# in an earlier release (W-30, W-02/W-05, W-16/W-17, W-03/W-06).
# One BUG FIX, not additive: form.field.radius pointed at `{spacing.radius.small}`, a path
# DELETED by the 2.2.0 promotion — the exact residual reader OI-6 predicted. Repathed to
# `{radius.sm}` (same 8dp value).
#
# 2.3.0 (2026-08-02, /design-system) — closes /design-validate C-2. Added semantic.status,
# mapping the `warning` and `success` families the app references onto existing M3 roles
# (tertiary and primary respectively) rather than minting new hues. Four contrast pairs measured
# and added to DESIGN_SYSTEM_STATE (W-16..W-19). Purely additive: no existing role, scale, radius
# or spacing value changed. The consuming screens still reference the old undeclared names —
# see the _expired_is_error_not_warning and _known_inconsistency notes inside the block.
#
# 2.2.0 (2026-08-02, /design-system) — closes /design-validate F-004. Every consumer of this
# file (23 screens, components.yaml, and the framework component registry's own default_style
# blocks) referenced token families this file did not declare: the named spacing steps
# (spacing.md, spacing.sm…), a TOP-LEVEL radius block, and icon / border / opacity entirely.
# 49 references in screen YAML alone resolved against nothing, while this file's own header
# claims to be the rendering source of truth for Compose codegen. Added the named steps and
# the four missing families, verbatim from layers/idea/templates/DESIGN_TOKENS_SCHEMA.md so
# the project and the framework registry finally share ONE namespace.
# No colour role, type scale, elevation level or motion duration changed. Two structural
# changes are NOT purely additive and are called out in full below: radius was promoted from
# spacing.radius to top level, and the value 2 was added to spacing.scale.
#
# 2.1.0 (2026-07-30, /design-system) — extended for money MOVEMENT. Every prior version
# described a strictly read-only AISP app; the PISP scope reversal added the app's first
# forms and its first irreversible action, neither of which the system covered. Added:
# semantic.payment_disposition, semantic.money (formalised), and the form/validation block.
# No existing role, scale or radius changed — this release is purely additive.
