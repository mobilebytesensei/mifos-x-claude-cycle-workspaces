brand:
  name: Mifos Products
  short: Products
  tagline: DPGs for Last-Mile Financial Inclusion
  # Text logo by default; drop a file at public/logo.svg and set logo: /logo.svg
  logo: ""
  url: https://products.mifos.org

nav:
  links:
    - { label: "Products", href: "/#products" }
    - { label: "Mobile Apps", href: "/mobile" }
    - { label: "Mifos Gazelle", href: "https://mifos.gazelle.mifos.org", external: true }
    - { label: "GitHub", href: "https://github.com/openMF", external: true }
    - { label: "Slack Community", href: "https://mifos.slack.com", external: true }
  cta: { label: "Get Involved", href: "https://mifos.org/get-involved", external: true }

hero:
  eyebrow: Open Source · Digital Public Goods
  head: DPGs for Last-Mile Financial Inclusion
  subhead: >-
    Open source building blocks for core banking and payment orchestration —
    enabling end-to-end digital financial services for banks, fintechs,
    cooperatives, microfinance institutions, and governments.
  primary_cta: { label: "Explore Products", href: "#products" }
  secondary_cta: { label: "Learn More", href: "https://mifos.org", external: true }
  # Optional trust-strip stats shown under the hero.
  stats:
    - { value: "3M+", label: "End clients reached" }
    - { value: "60+", label: "Countries deployed" }
    - { value: "100%", label: "Open source" }

products_section:
  eyebrow: The Suite
  head: Open source building blocks
  subhead: >-
    A composable stack of Digital Public Goods you can deploy independently or
    together — from the core system of record to payment rails and packaged DPI.

# The catalog — mirrored from products.mifos.org, ordered as the source site.
products:
  - name: Mifos X
    category: Core Banking Platform
    icon: "🏦"
    accent: brand
    description: >-
      Core banking & account-management platform providing a flexible, scalable
      system of record to manage a full range of financial services including
      wallets, savings, and credit products.
    link: { label: "Learn More", href: "https://mifos.org/mifos-x", external: true }
    tags: [Core Banking, System of Record, Savings & Credit]

  - name: Payment Hub EE
    category: Payment Orchestration Engine
    icon: "🔀"
    accent: teal
    description: >-
      Highly extensible integration and orchestration layer to connect and
      initiate bi-directional digital payment flows via instant payments and
      mobile money.
    link: { label: "Learn More", href: "https://payments.mifos.org", external: true }
    tags: [Payments, Orchestration, Mobile Money]

  - name: Mifos Gazelle
    category: DPI as a Packaged Solution
    icon: "📦"
    accent: amber
    description: >-
      Deployment scripting tool that accelerates the installation and evaluation
      of multiple DPGs across cloud and on-premise environments.
    link: { label: "Learn More", href: "https://mifos.gazelle.mifos.org", external: true }
    tags: [Deployment, DPI, Cloud & On-Prem]

  - name: Mobile Banking & Wallet Apps
    category: Customer-facing Apps · Kotlin Multiplatform
    icon: "📱"
    accent: violet
    description: >-
      A suite of customer-facing apps built with Kotlin Multiplatform + Compose
      Multiplatform — one codebase across Android, iOS, Desktop, and Web. Group
      banking, mobile wallets, self-service banking, field operations, and Open
      Banking / PISP.
    link: { label: "Explore Mobile Apps", href: "/mobile" }
    tags: [Android · iOS · Desktop · Web, Compose Multiplatform, Open Banking]
    # Featured sub-products surfaced as chips on the card.
    subproducts:
      - { name: "MifosSave", href: "https://mifossave.pages.dev" }
      - { name: "Mifos Pay", href: "/mobile#mifos-pay" }
      - { name: "Mifos Mobile", href: "/mobile#mifos-mobile" }

community:
  eyebrow: Join us
  head: Build financial inclusion, in the open
  subhead: >-
    Everything is open source and community-driven. Explore the code, join the
    conversation, and help bring digital financial services to the last mile.
  links:
    - { label: "GitHub Repos", href: "https://github.com/openMF", icon: "code", external: true }
    - { label: "Slack Community", href: "https://mifos.slack.com", icon: "chat", external: true }
    - { label: "mifos.org", href: "https://mifos.org", icon: "globe", external: true }

footer:
  blurb: >-
    Mifos is a global open source community building the technology to advance
    financial inclusion. Software is a Digital Public Good.
  columns:
    - heading: Products
      links:
        - { label: "Mifos X", href: "https://mifos.org/mifos-x", external: true }
        - { label: "Payment Hub EE", href: "https://payments.mifos.org", external: true }
        - { label: "Mifos Gazelle", href: "https://mifos.gazelle.mifos.org", external: true }
        - { label: "Mobile Apps", href: "https://mobile.mifos.org", external: true }
    - heading: Community
      links:
        - { label: "GitHub", href: "https://github.com/openMF", external: true }
        - { label: "Slack", href: "https://mifos.slack.com", external: true }
        - { label: "mifos.org", href: "https://mifos.org", external: true }
    - heading: Get Involved
      links:
        - { label: "Contribute", href: "https://mifos.org/get-involved", external: true }
        - { label: "Donate", href: "https://mifos.org/donate", external: true }
