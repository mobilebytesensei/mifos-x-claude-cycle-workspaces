# ─────────────────────────────────────────────────────────────────────────────
# site.yaml — Mifos Products catalog content (the ONLY editable content seam)
# Mirrored starting-point from products.mifos.org. Swap values here; src/** stays generic.
# ─────────────────────────────────────────────────────────────────────────────

brand:
  name: Mifos Products
  short: Products
  tagline: DPGs for Last-Mile Financial Inclusion
  # Text logo by default; drop a file at public/logo.svg and set logo: /logo.svg
  logo: ""
  url: https://products.mifos.org

nav:
  links:
    - { label: "Products", href: "/#products" }
    - { label: "Mobile Apps", href: "/mobile" }
    - { label: "Mifos Gazelle", href: "https://mifos.gazelle.mifos.org", external: true }
    - { label: "GitHub", href: "https://github.com/openMF", external: true }
    - { label: "Slack Community", href: "https://mifos.slack.com", external: true }
  cta: { label: "Get Involved", href: "https://mifos.org/get-involved", external: true }

hero:
  eyebrow: Open Source · Digital Public Goods
  head: DPGs for Last-Mile Financial Inclusion
  subhead: >-
    Open source building blocks for core banking and payment orchestration —
    enabling end-to-end digital financial services for banks, fintechs,
    cooperatives, microfinance institutions, and governments.
  primary_cta: { label: "Explore Products", href: "#products" }
  secondary_cta: { label: "Learn More", href: "https://mifos.org", external: true }
  # Optional trust-strip stats shown under the hero.
  stats:
    - { value: "3M+", label: "End clients reached" }
    - { value: "60+", label: "Countries deployed" }
    - { value: "100%", label: "Open source" }

products_section:
  eyebrow: The Suite
  head: Open source building blocks
  subhead: >-
    A composable stack of Digital Public Goods you can deploy independently or
    together — from the core system of record to payment rails and packaged DPI.

# The catalog — mirrored from products.mifos.org, ordered as the source site.
products:
  - name: Mifos X
    category: Core Banking Platform
    icon: "🏦"
    accent: brand
    description: >-
      Core banking & account-management platform providing a flexible, scalable
      system of record to manage a full range of financial services including
      wallets, savings, and credit products.
    link: { label: "Learn More", href: "https://mifos.org/mifos-x", external: true }
    tags: [Core Banking, System of Record, Savings & Credit]

  - name: Payment Hub EE
    category: Payment Orchestration Engine
    icon: "🔀"
    accent: teal
    description: >-
      Highly extensible integration and orchestration layer to connect and
      initiate bi-directional digital payment flows via instant payments and
      mobile money.
    link: { label: "Learn More", href: "https://payments.mifos.org", external: true }
    tags: [Payments, Orchestration, Mobile Money]

  - name: Mifos Gazelle
    category: DPI as a Packaged Solution
    icon: "📦"
    accent: amber
    description: >-
      Deployment scripting tool that accelerates the installation and evaluation
      of multiple DPGs across cloud and on-premise environments.
    link: { label: "Learn More", href: "https://mifos.gazelle.mifos.org", external: true }
    tags: [Deployment, DPI, Cloud & On-Prem]

  - name: Mobile Banking & Wallet Apps
    category: Customer-facing Apps · Kotlin Multiplatform
    icon: "📱"
    accent: violet
    description: >-
      A suite of customer-facing apps built with Kotlin Multiplatform + Compose
      Multiplatform — one codebase across Android, iOS, Desktop, and Web. Group
      banking, mobile wallets, self-service banking, field operations, and Open
      Banking / PISP.
    link: { label: "Explore Mobile Apps", href: "/mobile" }
    tags: [Android · iOS · Desktop · Web, Compose Multiplatform, Open Banking]
    # Featured sub-products surfaced as chips on the card.
    subproducts:
      - { name: "MifosSave", href: "https://mifossave.pages.dev" }
      - { name: "Mifos Pay", href: "/mobile#mifos-pay" }
      - { name: "Mifos Mobile", href: "/mobile#mifos-mobile" }

community:
  eyebrow: Join us
  head: Build financial inclusion, in the open
  subhead: >-
    Everything is open source and community-driven. Explore the code, join the
    conversation, and help bring digital financial services to the last mile.
  links:
    - { label: "GitHub Repos", href: "https://github.com/openMF", icon: "code", external: true }
    - { label: "Slack Community", href: "https://mifos.slack.com", icon: "chat", external: true }
    - { label: "mifos.org", href: "https://mifos.org", icon: "globe", external: true }

footer:
  blurb: >-
    Mifos is a global open source community building the technology to advance
    financial inclusion. Software is a Digital Public Good.
  columns:
    - heading: Products
      links:
        - { label: "Mifos X", href: "https://mifos.org/mifos-x", external: true }
        - { label: "Payment Hub EE", href: "https://payments.mifos.org", external: true }
        - { label: "Mifos Gazelle", href: "https://mifos.gazelle.mifos.org", external: true }
        - { label: "Mobile Apps", href: "https://mobile.mifos.org", external: true }
    - heading: Community
      links:
        - { label: "GitHub", href: "https://github.com/openMF", external: true }
        - { label: "Slack", href: "https://mifos.slack.com", external: true }
        - { label: "mifos.org", href: "https://mifos.org", external: true }
    - heading: Get Involved
      links:
        - { label: "Contribute", href: "https://mifos.org/get-involved", external: true }
        - { label: "Donate", href: "https://mifos.org/donate", external: true }
  copyright: "© 2026 The Mifos Initiative. Open source, licensed under MPL-2.0 / Apache-2.0."

# ─────────────────────────────────────────────────────────────────────────────
# /mobile — KMP mobile apps showcase (mirrors products.mifos.org/mobile).
# Every product links to its OWN dedicated site (like Group Banking → mifossave).
# ─────────────────────────────────────────────────────────────────────────────
mobile:
  hero:
    eyebrow: Mobile · Kotlin Multiplatform
    head: One codebase. Every platform.
    subhead: >-
      Customer-facing financial apps built with Kotlin Multiplatform and Compose
      Multiplatform — share 100% of UI and business logic across Android, iOS,
      Desktop, and Web, all wired to the Mifos X core.
    primary_cta: { label: "Browse the apps", href: "#apps" }
    secondary_cta: { label: "KMP Project Template", href: "https://github.com/openMF/kmp-project-template", external: true }
    platforms: [Android, iOS, Desktop, Web]

  # KMP value strip — why these apps share one Kotlin codebase.
  kmp:
    eyebrow: Built on Kotlin Multiplatform
    head: Write once, ship native everywhere
    points:
      - title: Compose Multiplatform
        icon: "🎨"
        body: One declarative UI in Kotlin, rendered natively on Android, iOS, Desktop, and Web.
      - title: Kotlin Multiplatform
        icon: "🧩"
        body: Shared domain, data, and networking — expect/actual only where a platform API is needed.
      - title: Mifos X Client & SDK
        icon: "🏦"
        body: Every app talks to the Fineract / Mifos X core through the shared client SDK.
      - title: GitHub Actions CI/CD
        icon: "🚀"
        body: One pipeline builds and ships Android, iOS, Desktop, and Web from the same repo.

  apps_section:
    eyebrow: The apps
    head: Mifos mobile & wallet apps
    subhead: >-
      Each app is open source, KMP-native, and ships its own dedicated site —
      Group Banking (MifosSave) is the first, with the rest following the same pattern.

  # White-Label Template — every app below is forked from this. Featured band + detail page.
  template:
    id: kmp-project-template
    name: KMP Project Template
    brand: App Toolkit
    label: White Label Template
    tagline: Brand-neutral Kotlin Multiplatform white-label template
    icon: "🧰"
    accent: brand
    description: >-
      Published as "App Toolkit" — an open-source, brand-neutral KMP template.
      Every brand-touching value ships as a placeholder; fill in `app-profile/`,
      run `./gradlew syncForkConfig`, and it flows to every platform. Ships with
      a real financial-utilities demo (loan tracker, bill reminders, interest
      rates) so a fork starts from working software, not a blank shell.
    github: https://github.com/openMF/kmp-project-template
    platforms: [Android, iOS, Desktop, Web]
    downloads:
      channels: [github, template]
      github: "https://github.com/openMF/kmp-project-template"
      template: "https://github.com/new?template_name=kmp-project-template&template_owner=openMF"
    problem:
      head: A blank repo isn't a starting point
      body: >-
        Starting a new KMP app from an empty shell means re-solving the same
        module layout, CI/CD, and platform wiring every time. App Toolkit ships
        a working, brand-neutral app — rebrand it, don't rebuild it.
    tech:
      - "Kotlin Multiplatform"
      - "Compose Multiplatform"
      - "Multi-module architecture"
      - "GitHub Actions CI/CD"
      - "Fastlane (iOS)"
    features:
      - { icon: "🏷️", title: "One config, every platform", body: "Fill app-profile/, run syncForkConfig, and branding flows to Android, iOS, Desktop, and Web." }
      - { icon: "🧮", title: "Real demo features included", body: "Loan tracker, EMI calculator, bill reminders, interest-rate & currency watchers — working software, not a placeholder screen." }
      - { icon: "🧱", title: "Multi-module architecture", body: "Clean, scalable project structure with an advanced source-set hierarchy for platform code sharing." }
      - { icon: "🚀", title: "CI/CD pre-configured", body: "GitHub Actions builds every platform; Fastlane handles iOS Firebase/TestFlight/App Store delivery." }
    highlights:
      - "Brand-neutral by default — every brand value is a placeholder"
      - "`app-profile/` + `./gradlew syncForkConfig` rebrands every platform at once"
      - "Ships with working demo features (loans, bills, rates, macro, FX)"
      - "GitHub Actions CI/CD + Fastlane iOS delivery pre-wired"
    long_description: >-
      Rather than start each product from scratch, Mifos mobile apps fork this
      template (published as "App Toolkit"). The shell is brand-neutral by
      design — every brand-touching value is a placeholder until you configure
      `app-profile/` and run the sync script. It ships with real financial
      utilities (loan tracking, bill reminders, interest-rate and macro
      watchers) so a fresh fork is working software from commit one, not an
      empty scaffold.

  # Each app → its own site (site:), plus source + platform reach. Each has a /mobile/<id> detail page.
  apps:
    - id: group-banking
      name: Group Banking
      brand: MifosSave
      tagline: Community banking, digitized end-to-end
      category: Group / Community Banking
      icon: "👥"
      accent: brand
      status: live
      description: >-
        Meeting-centric, offline-first group banking for cooperatives and savings
        groups — members, meetings, savings, and loans in one KMP app. White-label
        deployed as MifosSave.
      long_description: >-
        Group Banking digitizes the full community-banking cycle — forming groups,
        running meetings, recording attendance, and managing shared savings and
        loans — designed offline-first for low-connectivity field use. It is the
        reference example of the white-label pattern: the same KMP codebase ships
        publicly as MifosSave.
      platforms: [Android, iOS, Web]
      site: { label: "Visit MifosSave", href: "https://mifossave.pages.dev", external: true }
      source: https://github.com/openMF/mifos-x-group-banking
      highlights:
        - "Meeting-centric flows — attendance, contributions, and resolutions"
        - "Offline-first — capture in the field, sync when back online"
        - "Group savings & loan accounts backed by Mifos X"
        - "Shipped publicly as MifosSave (white-label deploy)"

    - id: mifos-pay
      name: Mifos Pay
      brand: ""
      tagline: A Kotlin Multiplatform wallet built on Apache Fineract
      category: Consumer & Merchant Wallet
      icon: "💳"
      accent: teal
      status: live
      description: >-
        Mifos Pay is a Kotlin Multiplatform project built on top of the Apache
        Fineract API — a mobile wallet for consumers and merchants, sharing one
        codebase across Android, iOS, Desktop, and Web.
      long_description: >-
        Mifos Pay is a Kotlin Multiplatform (KMP) project built on top of the
        Apache Fineract API. Following recommended architecture and design
        patterns, it's built with Jetpack Compose, Ktor, Ktorfit, and Koin —
        designed to be cross-platform from day one: Android, iOS, Desktop, and Web.
      problem:
        head: One wallet, every Fineract deployment
        body: >-
          Financial institutions running Fineract need a customer-facing wallet,
          but building one natively per platform means four codebases to
          maintain. Mifos Pay gives them one KMP app that talks directly to
          Fineract and runs everywhere.
      platforms: [Android, iOS, Desktop, Web]
      site: { label: "Site coming soon", href: "https://github.com/openMF/mifos-pay/releases", external: true, pending: true }
      source: https://github.com/openMF/mifos-pay
      downloads:
        channels: [firebase, testflight, playstore, appstore, macappstore]
        playstore: "https://play.google.com/store/apps/details?id=org.mifospay"
      run_configs:
        - { label: "Android", config: "cmp-android" }
        - { label: "Desktop", config: "cmp-desktop" }
        - { label: "Web (JS)", config: "cmp-web-js" }
        - { label: "iOS", config: "cmp-ios", note: "requires macOS + Xcode" }
      tech:
        - "Kotlin Multiplatform"
        - "Compose Multiplatform"
        - "Ktor"
        - "Ktorfit"
        - "Koin"
        - "Apache Fineract API"
      features:
        - { icon: "🏦", title: "Built on Apache Fineract", body: "Talks directly to the Fineract core banking API for accounts and transactions." }
        - { icon: "💸", title: "Consumer + merchant wallets", body: "One codebase serves both transactional-account use cases." }
        - { icon: "🧩", title: "Modern KMP stack", body: "Compose Multiplatform UI, Ktor/Ktorfit networking, Koin DI." }
        - { icon: "🖥️", title: "Four run configurations", body: "cmp-android, cmp-desktop, cmp-web-js, cmp-ios — pick a target and run." }
      highlights:
        - "Kotlin Multiplatform on top of Apache Fineract"
        - "Compose Multiplatform · Ktor · Ktorfit · Koin"
        - "Android, iOS, Desktop, and Web from one codebase"

    - id: mifos-mobile
      name: Mifos Mobile
      brand: ""
      tagline: Self-service banking for MifosX customers
      category: Mobile Banking
      icon: "📲"
      accent: violet
      status: live
      description: >-
        The self-service app for MifosX end-user customers — view and transact
        on the accounts and loans you hold. Migrating from native Android to a
        Kotlin Multiplatform, Compose Multiplatform app across Android, iOS,
        Desktop, and Web.
      long_description: >-
        Mifos Mobile is built on top of the MifosX self-service platform for
        end-user customers — the data and actions available are a subset of
        what institution staff can see, scoped to the customer's own accounts
        and loans. It's now moving onto Kotlin Multiplatform + Compose
        Multiplatform, extending it beyond Android to iOS, Desktop, and Web.
      problem:
        head: Customers need self-service, not a staff tool
        body: >-
          Mifos X's staff-facing back office isn't built for customers. Mifos
          Mobile gives account holders a scoped, customer-safe view of their
          own accounts and loans — without exposing staff-level data or actions.
      platforms: [Android, iOS, Desktop, Web]
      site: { label: "Site coming soon", href: "https://github.com/openMF/mifos-mobile/releases", external: true, pending: true }
      source: https://github.com/openMF/mifos-mobile
      downloads:
        channels: [firebase, testflight, playstore, appstore]
        playstore: "https://play.google.com/store/apps/details?id=org.mifos.mobile"
      tech:
        - "Kotlin Multiplatform"
        - "Compose Multiplatform"
        - "MVVM architecture"
        - "MifosX self-service API"
      features:
        - { icon: "👛", title: "View accounts & loans", body: "Customers see balances and status for the accounts and loans they hold." }
        - { icon: "💳", title: "Transact on your own accounts", body: "Savings and loan transactions scoped to the signed-in customer." }
        - { icon: "🔒", title: "Customer-scoped data", body: "A subset of what staff can see — never staff-level access." }
        - { icon: "🖥️", title: "Migrating to KMP", body: "Moving from native Android to Compose Multiplatform across Android, iOS, Desktop, and Web." }
      highlights:
        - "Self-service — customers see only their own accounts and loans"
        - "Originally native Android, migrating to Kotlin Multiplatform"
        - "Compose Multiplatform across Android, iOS, Desktop, and Web"

    - id: field-officer
      name: Field Officer App
      brand: ""
      tagline: MifosX in the field — built for offline
      category: Field Operations
      icon: "🧭"
      accent: amber
      status: live
      description: >-
        A Kotlin Multiplatform app built on the MifosX core banking platform for
        field officers — process transactions, manage clients, centers, groups,
        and loan/savings/recurring accounts, with offline capability for
        underserved areas.
      long_description: >-
        The Mifos X Field Officer App is built on the MifosX platform for field
        officers to efficiently process transactions, manage client data, track
        center records, group details, and handle loans, savings, and recurring
        accounts. Its standout feature is offline capability — officers can
        connect with clients and provide financial support even where
        connectivity is limited.
      problem:
        head: Financial inclusion doesn't wait for signal
        body: >-
          Field officers serve clients in areas where connectivity is thin or
          absent. A staff app that requires a live connection fails exactly
          where it's needed most — so this app is built offline-first.
      platforms: [Android]
      site: { label: "Site coming soon", href: "https://github.com/openMF/mifos-x-field-officer-app/releases", external: true, pending: true }
      source: https://github.com/openMF/mifos-x-field-officer-app
      downloads:
        channels: [firebase, testflight, playstore, appstore]
        playstore: "https://play.google.com/store/apps/details?id=com.mifos.mifosxdroid"
      tech:
        - "Kotlin Multiplatform"
        - "MifosX core banking platform"
        - "Offline-first sync"
      features:
        - { icon: "🧾", title: "Process transactions", body: "Handle client transactions on loan, savings, and recurring accounts." }
        - { icon: "🏘️", title: "Centers & groups", body: "Track center records and group details for community banking structures." }
        - { icon: "📴", title: "Offline capability", body: "Connect with clients and record work in areas with limited connectivity." }
        - { icon: "🔄", title: "Syncs back to MifosX", body: "Field-captured data reconciles with the core platform when back online." }
      highlights:
        - "Built on the MifosX core banking platform"
        - "Manages clients, centers, groups, loans, savings, recurring accounts"
        - "Offline-first for underserved, low-connectivity areas"

    - id: open-banking
      name: Open Banking App
      brand: ""
      tagline: Third-party payment initiation for fintechs
      category: Open Banking · PISP / 3PPI
      icon: "🔗"
      accent: brand
      status: reference
      description: >-
        A reference app for third-party payment initiation use cases — PISP,
        Open Banking, and 3PPI — for fintechs building on top of the Mifos
        ecosystem.
      long_description: >-
        The Open Banking App is openMF's reference implementation for
        third-party payment initiation use cases (PISP — Payment Initiation
        Service Provider, Open Banking, and 3PPI — Third Party Provider
        Initiation). Fintechs building compliant, standards-based payment
        experiences on Mifos start here.
      problem:
        head: Open Banking needs a reference, not a spec
        body: >-
          PISP and 3PPI standards define how third-party payment initiation
          should work, but fintechs still need a working example to build from.
          This app is that reference — a real, forkable implementation.
      platforms: [Android, iOS]
      site: { label: "Site coming soon", href: "https://github.com/openMF/mifos-x-open-banking-pisp-app", external: true, pending: true }
      source: https://github.com/openMF/mifos-x-open-banking-pisp-app
      downloads:
        channels: [firebase, testflight, playstore, appstore]
        playstore: "https://play.google.com/store/apps/developer?id=Mifos+Initiative"
      tech:
        - "PISP (Payment Initiation Service Provider)"
        - "Open Banking"
        - "3PPI (Third Party Provider Initiation)"
      features:
        - { icon: "🔗", title: "Third-party payment initiation", body: "Reference flows for PISP-style payment initiation on top of Mifos." }
        - { icon: "📐", title: "Standards-based", body: "Built around Open Banking and 3PPI conventions fintechs already expect." }
        - { icon: "🍴", title: "Fork-and-build", body: "A working starting point rather than a spec document." }
      highlights:
        - "Reference app for PISP / Open Banking / 3PPI payment initiation"
        - "A working starting point for fintechs, not just a spec"

  community:
    head: Building a mobile app on Mifos?
    subhead: Start from the KMP Project Template and join the mobile developer community.
    links:
      - { label: "KMP Project Template", href: "https://github.com/openMF/kmp-project-template", external: true }
      - { label: "Mobile Dev Slack", href: "https://mifos.slack.com", external: true }

# ─────────────────────────────────────────────────────────────────────────────
# MifosSave — full product page at /mobile/group-banking (bespoke, not the generic
# detail template). Sourced from the mifos-x-group-banking idea-layer.
# ─────────────────────────────────────────────────────────────────────────────
mifossave:
  brand: MifosSave
  package: org.mifos.groupbanking
  status: live
  platforms: [Android, iOS, Web]
  site: https://mifossave.pages.dev
  source: https://github.com/openMF/mifos-x-group-banking
  hero:
    eyebrow: Group Banking · Kotlin Multiplatform
    head: Community banking, digitized end-to-end
    subhead: >-
      MifosSave digitizes the full lifecycle of self-funded savings groups —
      meetings, savings, lending, and share-out — offline-first, powered by Mifos
      Fineract. Built for VSLAs, ROSCAs, and every community banking model.
    stats:
      - { value: "Offline-first", label: "Works with no signal" }
      - { value: "9", label: "Group models supported" }
      - { value: "Fineract", label: "Enterprise core banking" }

  problem:
    head: Paper ledgers don't scale
    body: >-
      Millions organize into savings groups — VSLA, ROSCA, ASCA, SHG — to pool
      savings, issue loans, and share out profits. Run on paper, they face
      record-keeping errors, fraud, and no transparency. Existing digital tools
      are online-only or don't cover the full group lifecycle.

  values:
    head: Why MifosSave
    items:
      - { icon: "📴", title: "Offline-first", body: "Full functionality with no internet — every record syncs to Fineract the moment you reconnect." }
      - { icon: "🤝", title: "Meeting-centric", body: "Mirrors how real groups work: attendance → savings → loans → decisions → share-out." }
      - { icon: "🏦", title: "Fineract-backed", body: "Enterprise-grade financial record-keeping via the proven open-source Mifos X core." }
      - { icon: "👐", title: "Low-literacy UX", body: "Icon-heavy, minimal text, large touch targets — usable by every member." }
      - { icon: "🔍", title: "Transparent", body: "Every member sees group balances, loan status, and share-out projections in real time." }

  features_section:
    head: Everything a group does, on one phone
    subhead: From onboarding to share-out — the whole cycle, digitized.
    items:
      - { icon: "📊", title: "The whole group, on one screen", body: "Savings, loans, fines and the next meeting — every member's balance, live and offline." }
      - { icon: "💰", title: "Every share, counted correctly", body: "Group and individual savings side by side — no more torn ledgers or lost passbooks." }
      - { icon: "🧮", title: "Fair payouts, calculated for you", body: "Split the cycle's savings and profit by shares — transparent, auditable, done in seconds." }
      - { icon: "🎟️", title: "Join your group with one code", body: "Enter the invite code, preview the group, and you're in — no paperwork, no waiting." }
      - { icon: "🗓️", title: "Every meeting, start to finish", body: "Take attendance, collect savings, approve loans and record fines — right on the phone." }
      - { icon: "🏛️", title: "Loans the group decides on", body: "Apply, review terms and track repayments — lending powered by the members' own fund." }
      - { icon: "🔄", title: "Meet anywhere. Sync later.", body: "Record everything with no signal — data syncs safely to Mifos when you reconnect." }
      - { icon: "✉️", title: "Invite members in a tap", body: "Generate a secure code and add savers instantly — everyone on the same book." }

  lifecycle:
    head: The meeting lifecycle
    subhead: MifosSave follows the real rhythm of a group meeting.
    steps:
      - { n: "1", title: "Attendance", body: "Check in members, record fines for absence or lateness." }
      - { n: "2", title: "Savings", body: "Collect each member's contribution into group and personal accounts." }
      - { n: "3", title: "Loans", body: "Review requests, vote, disburse, and track repayments from the fund." }
      - { n: "4", title: "Decisions", body: "Log resolutions, action items, and the secretary's minutes." }
      - { n: "5", title: "Share-out", body: "At cycle end, split savings + profit by shares — auditable in seconds." }

  archetypes:
    head: Built for every community banking model
    items: [VSLA, ROSCA, ASCA, SILC, SHG, SACCO, Village Bank, Burial / Welfare, JLG]

  roles:
    head: One login, roles per group
    subhead: >-
      Anyone can self-sign-up. After login, capabilities are auto-resolved per
      group — the same person can organize one group and be a member of another.
    items:
      - { role: "Organizer", body: "Creates & owns a group, acts as its loan officer — approves loans, runs meetings, executes share-out." }
      - { role: "Treasurer", body: "Records savings, repayments, fines, and attendance." }
      - { role: "Chairperson", body: "Approves loans, chairs meetings, initiates share-out." }
      - { role: "Secretary", body: "Keeps meeting minutes and action items." }
      - { role: "Member", body: "Views own savings & loans, requests loans, participates in votes." }

  tech:
    head: Built on Kotlin Multiplatform
    items:
      - { title: "Compose Multiplatform", body: "One UI across Android, iOS, and Web." }
      - { title: "Offline-first sync", body: "Local-first data with conflict-safe sync to Fineract." }
      - { title: "Mifos Fineract core", body: "Groups, savings, loans backed by proven core banking." }
      - { title: "Forked from the KMP Template", body: "Shipped as MifosSave via the white-label customizer." }

  # Distribution channels. A channel with an empty value renders as "Coming soon".
  downloads:
    channels: [firebase, testflight, playstore, appstore, web]
    web: https://mifossave.pages.dev
    firebase: "https://appdistribution.firebase.dev/i/9684718389eb08ef"   # Firebase App Distribution (Android/iOS beta)
    testflight: ""     # TestFlight public beta link (iOS) — pending
    playstore: "https://play.google.com/store/apps/developer?id=Mifos+Initiative"   # not yet a standalone listing → Mifos Initiative developer page
    appstore: ""       # Apple App Store listing — pending

  demo:
    head: Try it now
    subhead: Explore MifosSave with seeded demo data — no signup required.
    cta: { label: "Open the Demo", href: "https://mifossave.pages.dev", external: true }
    note: "Tap “Demo Explore” in the app, or sign in with the demo treasurer account below."
    credentials:
      - { role: "Demo Explore (guest)", username: "— tap “Demo Explore” —", password: "no account created" }
      - { role: "Organizer / Treasurer", username: "demo", password: "DemoExplore@2026" }

  cta:
    head: Bring your savings group online
    subhead: MifosSave is open source and free. Explore the app, read the code, or fork the template to build your own.
    links:
      - { label: "Visit MifosSave", href: "https://mifossave.pages.dev", external: true }
      - { label: "Source on GitHub", href: "https://github.com/openMF/mifos-x-group-banking", external: true }
      - { label: "White Label Template", href: "/mobile/kmp-project-template" }
