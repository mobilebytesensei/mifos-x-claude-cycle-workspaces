# SITE_DEPLOY.yaml — Cloudflare Pages deploy config for mifos-products
# Consumed by /idea-site (core/scripts/idea-site-deploy.sh) + the deploy record here.
# This is a STANDALONE Astro site (source/mifos-products), not the web-template shell:
# the deployable is the project's own `npm run build` output (source/mifos-products/dist).

provider: cloudflare-pages

cloudflare:
  project: mifos-products              # → https://mifos-products.pages.dev
  pages_subdomain: mifos-products.pages.dev
  token_alias: mifos-x-cloudflare-api-token       # vault alias (never inline the value)
  account_alias: mifos-x-cloudflare-account-id
  production_branch: main

# Where the built static site lives (this project builds its own dist).
build:
  dir: source/mifos-products
  command: "npm run build"
  output: source/mifos-products/dist
  site_url: https://mifos-products.pages.dev       # SITE_URL for canonical/OG/sitemap

# Custom-domain cutover (pending human): products.mifos.org → this Pages project.
custom_domain: products.mifos.org
