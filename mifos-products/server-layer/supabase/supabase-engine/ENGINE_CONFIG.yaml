# ENGINE_CONFIG.yaml - ETL Pipeline Configuration
# ================================================
#
# This file configures the supabase-engine ETL pipeline.
# Enable/disable phases and configure their behavior.
#
# Usage:
#   /server engine-start              # Run all enabled phases
#   /server engine-start --phase X    # Run specific phase
#   /server engine-start --config     # View this configuration
#

# ============================================================================
# PIPELINE PHASES
# ============================================================================
# Each phase can be enabled/disabled independently.
# Phases run in order: extract → transform → validate → enrich → load

phases:
  # --------------------------------------------------------------------------
  # EXTRACT: Pull data from external sources
  # --------------------------------------------------------------------------
  extract:
    enabled: true
    sources:
      # Add your data sources here
      # Example:
      # - name: api
      #   enabled: true
      #   type: rest_api
      #   url: https://api.example.com/data
      #   priority: 1
      # - name: csv
      #   enabled: true
      #   type: file
      #   path: data/sources/import.csv
      #   priority: 2

  # --------------------------------------------------------------------------
  # TRANSFORM: Clean, normalize, and prepare data
  # --------------------------------------------------------------------------
  transform:
    enabled: true
    strategies:
      - clean           # Remove invalid characters, trim whitespace
      - normalize       # Standardize formats (dates, names, etc.)
      - dedupe          # Remove duplicates
    # Add custom strategies as needed

  # --------------------------------------------------------------------------
  # VALIDATE: Ensure data quality
  # --------------------------------------------------------------------------
  validate:
    enabled: true
    rules:
      - required_fields       # Check required fields are present
      - type_validation       # Ensure correct data types
      - referential_integrity # Check foreign key relationships
    # Fail threshold: stop if error rate exceeds this %
    fail_threshold: 5.0

  # --------------------------------------------------------------------------
  # ENRICH: Add metadata and computed fields
  # --------------------------------------------------------------------------
  enrich:
    enabled: true
    enrichers:
      # Local enrichers (free, no API required)
      # - name: category_mapper
      #   enabled: true
      # - name: quality_scorer
      #   enabled: true

    # API enrichers (require API keys, may have costs)
    api_enrichers:
      # - name: external_api
      #   enabled: false
      #   rate_limit: 10       # requests per second
      #   cost_per_item: 0.001 # estimated cost

  # --------------------------------------------------------------------------
  # LOAD: Write data to destination
  # --------------------------------------------------------------------------
  load:
    enabled: true
    destination: supabase     # Target: supabase, postgres, sqlite
    mode: incremental         # Mode: incremental or full
    batch_size: 500           # Records per batch
    # Sync tracking column (for incremental mode)
    sync_column: synced_at

# ============================================================================
# EXECUTION SETTINGS
# ============================================================================

execution:
  # Continue running other phases if one fails
  continue_on_error: true

  # Maximum retries for transient failures
  max_retries: 3

  # Save checkpoint every N records (for resume capability)
  checkpoint_interval: 1000

  # Number of parallel workers (where supported)
  parallel_workers: 4

  # Timeout for each phase in seconds (0 = no limit)
  phase_timeout: 0

# ============================================================================
# LOGGING
# ============================================================================

logging:
  level: INFO                 # DEBUG, INFO, WARNING, ERROR
  format: json                # json or text
  output: stdout              # stdout or file
  file: logs/pipeline.log    # Log file path (if output=file)

# ============================================================================
# NOTIFICATIONS (Optional)
# ============================================================================

notifications:
  # Enable notifications on completion/failure
  enabled: false

  # Channels (configure as needed)
  # slack:
  #   webhook_url: https://hooks.slack.com/...
  # email:
  #   recipients: [team@example.com]
