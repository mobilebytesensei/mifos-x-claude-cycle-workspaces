# Docker Compose Template for Supabase Engine
#
# Template Variables:
#   {PROJECT_NAME}     - Project name (e.g., mood_movies)
#   {CONTAINER_NAME}   - Docker container name
#   {POSTGRES_USER}    - PostgreSQL username
#   {POSTGRES_PASSWORD}- PostgreSQL password
#   {HOST_PORT}        - Host port mapping (default: 5432)
#
# Usage:
#   1. Copy this file to your project's server-layer/supabase-engine/
#   2. Replace template variables with actual values
#   3. Run: docker-compose up -d
#
# Rule: RULE-ENGINE-AUTO-001

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: {CONTAINER_NAME}_engine
    environment:
      POSTGRES_DB: {PROJECT_NAME}
      POSTGRES_USER: {POSTGRES_USER}
      POSTGRES_PASSWORD: {POSTGRES_PASSWORD}
    ports:
      - "{HOST_PORT}:5432"
    volumes:
      # Persist data across container restarts
      - postgres_data:/var/lib/postgresql/data
      # Initialize schema on first run
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {POSTGRES_USER} -d {PROJECT_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: pgAdmin for database management
  # Uncomment if you need a GUI for PostgreSQL
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: {CONTAINER_NAME}_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@local.dev
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped

volumes:
  postgres_data:
    name: {PROJECT_NAME}_postgres_data

