# ═════════════════════════════════════════════════════════════════════════════
# PROJECT_CONFIG.yaml — mifos-products (schema v2)
#
# Contract: RULE-PROJECT-CONFIG-001
# The Mifos Products showcase site — a standalone Astro static site that mirrors
# products.mifos.org: a catalog of the Mifos open-source DPGs (Mifos X, Payment
# Hub EE, Mifos Gazelle, Mobile Banking & Wallet apps incl. MifosSave).
# Migration target of products.mifos.org → Cloudflare Pages.
# ═════════════════════════════════════════════════════════════════════════════

schema_version: 2

project:
  name: mifos-products
  display_name: Mifos Products
  tech_stack: "web"
  type: web-app
  subtype: static-site
  status: active
  workspace: mifos-x
  created: 2026-08-15

repository:
  # Pending human: create the GitHub repo + link. Standalone project (own repo,
  # not a submodule of another product). Follows the therajanmaurya→openMF PR
  # direction convention once the upstream repo exists.
  origin: ""
  upstream: ""
  default_branch: dev
  fork_workflow: false
  source_path: source/mifos-products/   # canonical /project-add layout

tech:
  language: typescript
  ui_framework: astro
  rendering: static-ssg            # output: 'static'
  styling: css-tokens             # theme-aware light/dark from content/tokens.css
  ci_cd: cloudflare-pages
  package_manager: npm

platforms: [web]

# ── Layer configuration (RULE-PROJECT-CONFIG-001) ────────────────────────────
# Canonical /project-add layout — all web-applicable capability layers enabled.
# platform-layer is KMP-only (expect/actual) → not applicable to a static web site.
layers:
  idea:
    enabled: true
  plan:
    enabled: true
  server:
    enabled: true          # thin — static site, no backend yet (docs/placeholder)
  client:
    enabled: true          # thin — no network services yet
  feature:
    enabled: true          # site sections modeled as features
  infrastructure:
    enabled: true          # build/deploy (Astro + Cloudflare Pages)
  testing:
    enabled: true
  docs:
    enabled: true
  platform:
    enabled: false         # kmp-only (expect/actual); N/A for web static site

content:
  # White-label seam: everything the shell renders comes from content/.
  manifest: content/site.yaml       # brand, hero, product catalog, nav, footer
  tokens: content/tokens.css        # Mifos brand palette (theme-aware)
  source: products.mifos.org        # starting-point mirror (WordPress → Astro migration)

deploy:
  provider: cloudflare-pages
  cf_project: mifos-products        # → mifos-products.pages.dev
  live_url: https://mifos-products.pages.dev   # LIVE (deployed 2026-08-15 via wrangler pages deploy)
  status: deployed
  domain: products.mifos.org        # final canonical domain (migration target)
  build_command: "npm run build"
  output_dir: dist
  # Deployed via /idea-site (wrangler pages deploy) using vault creds
  # mifos-x-cloudflare-{api-token,account-id}. Config: idea-layer/site/SITE_DEPLOY.yaml.
  # Pending human: custom-domain (products.mifos.org) cutover; connect GitHub repo for auto-deploys.

seo:
  sitemap: true
