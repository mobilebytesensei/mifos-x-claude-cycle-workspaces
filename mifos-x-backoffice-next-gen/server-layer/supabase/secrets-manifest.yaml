# Blueprint for new projects: copied by /project-import into workspaces/{ws}/{project}/server-layer/supabase/.
# Consumer (/project-import) auto-runs `/secrets adopt` after copy to materialize via vault, NOT via cp .env.example .env.
#
# Schema: core/schemas/secrets-manifest.schema.json (v2.0+)
# Authority: PLAN-secrets-email-mapping Tier G.1 T-G1 (absorbed from secrets-vault-management 03-scaffold-conversion)
# Supersedes: legacy core/blueprints/workspace-project/server-layer/supabase/.env.example (deleted 2026-05-29)

schema_version: "2.0"
scope: "project"

# default_vault is set by /project-import based on the parent workspace (mbs, mifos-x, etc.)
# default_account_email is optional — set when every Supabase secret in this project belongs to one team email.

# Thinned 2026-05-30 by PLAN-secrets-unified-alias-namespace Phase D.
# Blueprint template: alias names use `blueprint-` prefix as placeholder; /project-import
# auto-rewrites prefix when copying into a real workspace project (e.g.,
# `blueprint-supabase-anon-key` → `mbs-newproject-supabase-anon-key`). The
# corresponding registry rows live in SECRETS_ALIAS_REGISTRY.yaml under group `blueprint`.
needs:
  - alias: blueprint-supabase-anon-key
    materialize:
      at: .env.local
      via: secrets-pull
    description: "Public anon key for client-side Supabase SDK"

  - alias: blueprint-supabase-service-role-key
    materialize:
      at: .env.local
      via: secrets-pull
    description: "Server-side service-role key — admin access; NEVER expose to client"

  - alias: blueprint-supabase-db-url
    materialize:
      at: .env.local
      via: secrets-pull
    description: "Direct PostgreSQL connection string for migrations + supabase CLI"
