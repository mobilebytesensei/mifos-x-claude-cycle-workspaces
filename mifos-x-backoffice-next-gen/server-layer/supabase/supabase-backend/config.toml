# Supabase Configuration
# Reference: https://supabase.com/docs/guides/local-development/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "ipv6"
max_header_length = 4096

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MB"

# Example storage bucket configuration
# Uncomment and customize as needed
#
# [storage.buckets.avatars]
# public = true
# file_size_limit = "5MB"
# allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]
#
# [storage.buckets.documents]
# public = false
# file_size_limit = "50MB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false
# Uncomment to enable SMS auth
# [auth.sms.twilio]
# enabled = true
# account_sid = "env(TWILIO_ACCOUNT_SID)"
# auth_token = "env(TWILIO_AUTH_TOKEN)"
# message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"

# OAuth Providers - Uncomment and configure as needed
#
# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"
# secret = "env(GOOGLE_CLIENT_SECRET)"
# redirect_uri = ""
# url = ""
# skip_nonce_check = false
#
# [auth.external.apple]
# enabled = true
# client_id = "env(APPLE_CLIENT_ID)"
# secret = "env(APPLE_CLIENT_SECRET)"
#
# [auth.external.github]
# enabled = true
# client_id = "env(GITHUB_CLIENT_ID)"
# secret = "env(GITHUB_CLIENT_SECRET)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sessions]
timebox = "24h"
inactivity_timeout = "8h"

[auth.hook.custom_access_token]
enabled = false
# uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

# Functions can be individually configured
# [functions.my-function]
# verify_jwt = true
# import_map = "./functions/my-function/import_map.json"
