# Design Tokens — mifos-x-backoffice-next-gen
# Generated by /design-system (2026-07-30) from design-system/DESIGN.md + idea-plan.yaml#design_read.
# Brand: calm, dense, clinical Material-3 financial-admin console.
#   primary  #0091EA (Light Blue)   ·  secondary/teal #00796B  ·  accent teal #00BFA5
#   Roboto (Roboto Mono for numerics)  ·  light-theme default  ·  density 7  ·  soft radius
# NOTE (accessibility-first / regulated-industry per quiet_constraints):
#   --primary #0091EA is the brand identity color (idea-plan#branding.primary_color). White
#   `on_primary` text on a #0091EA fill is ~2.6:1 (below WCAG-AA 4.5:1 for body text). Use
#   `primary` fills for large/bold button labels + icons only; for AA-critical text-on-primary
#   surfaces prefer `primary_container`/`on_primary_container` (7:1+). See report finding.
# Canonical nested colors.{light,dark} shape (D3). Consumed by /idea-feature-render (LLM HD path),
# /idea-feature-stitch, /implement Compose codegen, /design-validate.

