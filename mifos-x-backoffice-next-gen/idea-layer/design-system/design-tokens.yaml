# ─── Typography (Roboto family; Roboto Mono for tabular numerics) ─────────────
typography:
  font_family:         "Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif"
  font_family_display: "Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif"
  font_family_mono:    "'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace"

  # M3 type scale — 15 levels. Dense (density 7): body/label lean compact.
  display_large:   { size: "57px", line_height: "64px", weight: 700, letter_spacing: "-0.25px" }
  display_medium:  { size: "45px", line_height: "52px", weight: 700, letter_spacing: "0" }
  display_small:   { size: "36px", line_height: "44px", weight: 600, letter_spacing: "0" }
  headline_large:  { size: "32px", line_height: "40px", weight: 700, letter_spacing: "0" }
  headline_medium: { size: "28px", line_height: "36px", weight: 600, letter_spacing: "0" }
  headline_small:  { size: "24px", line_height: "32px", weight: 600, letter_spacing: "0" }
  title_large:     { size: "22px", line_height: "28px", weight: 600, letter_spacing: "0" }
  title_medium:    { size: "16px", line_height: "24px", weight: 500, letter_spacing: "0.15px" }
  title_small:     { size: "14px", line_height: "20px", weight: 500, letter_spacing: "0.1px" }
  body_large:      { size: "16px", line_height: "24px", weight: 400, letter_spacing: "0.5px" }
  body_medium:     { size: "14px", line_height: "20px", weight: 400, letter_spacing: "0.25px" }
  body_small:      { size: "12px", line_height: "16px", weight: 400, letter_spacing: "0.4px" }
  label_large:     { size: "14px", line_height: "20px", weight: 500, letter_spacing: "0.1px" }
  label_medium:    { size: "12px", line_height: "16px", weight: 500, letter_spacing: "0.5px" }
  label_small:     { size: "11px", line_height: "16px", weight: 500, letter_spacing: "0.5px" }

# ─── Spacing (8pt grid; 4dp base unit) ────────────────────────────────────────
spacing:
  none:  "0"
  xxs:   "2px"
  xs:    "4px"
  sm:    "8px"
  md:    "16px"
  lg:    "24px"
  xl:    "32px"
  xxl:   "48px"
  xxxl:  "64px"
  base_unit: 4
  # Dense-console tuning (density 7)
  row_padding:  "12px"
  section_gap:  "24px"

# ─── Corner radius (soft radius system) ───────────────────────────────────────
radius:
  none: "0"
  xs:   "4px"
  sm:   "8px"
  md:   "12px"
  lg:   "16px"
  xl:   "28px"
  full: "9999px"

# ─── Elevation (M3 level0-level5 → CSS box-shadow; borders-over-shadows, subtle) ─
# Render engine maps level0→--el-0, level1→--el-1, level2→--el-2, level3→--el-3 (CRAFT §7a).
# Kept intentionally subtle — DESIGN.md favors 1px outline borders over heavy shadows.
elevation:
  level0: "none"
  level1: "0 1px 2px rgba(0,0,0,0.05)"
  level2: "0 2px 6px rgba(0,0,0,0.08)"
  level3: "0 8px 24px rgba(0,0,0,0.12)"
  level4: "0 12px 32px rgba(0,0,0,0.14)"
  level5: "0 16px 48px rgba(0,0,0,0.18)"

# ─── Border ───────────────────────────────────────────────────────────────────
border:
  none:   "0"
  thin:   "1px"
  medium: "2px"
  thick:  "4px"
  focus:  "2px"

# ─── Opacity ──────────────────────────────────────────────────────────────────
opacity:
  disabled: 0.38
  loading:  0.60
  hover:    0.08
  focus:    0.12
  pressed:  0.12
  dragged:  0.16

# ─── Motion (M3 duration + easing scale; restrained per design_read motion:3) ──
motion:
  durations:
    short1: 50
    short2: 100
    short3: 150
    short4: 200
    medium1: 250
    medium2: 300
    medium3: 350
    medium4: 400
    long1: 450
    long2: 500
    long3: 550
    long4: 600
    extra_long1: 700
    extra_long2: 800
    extra_long3: 900
    extra_long4: 1000
  easings:
    standard:              "cubic-bezier(0.2, 0, 0, 1)"
    emphasized:            "cubic-bezier(0.2, 0, 0, 1)"
    emphasized_decelerate: "cubic-bezier(0.05, 0.7, 0.1, 1)"
    emphasized_accelerate: "cubic-bezier(0.3, 0, 0.8, 0.15)"
    standard_decelerate:   "cubic-bezier(0, 0, 0, 1)"
    standard_accelerate:   "cubic-bezier(0.3, 0, 1, 1)"
    legacy:                "cubic-bezier(0.4, 0, 0.2, 1)"
    linear:                "linear"

