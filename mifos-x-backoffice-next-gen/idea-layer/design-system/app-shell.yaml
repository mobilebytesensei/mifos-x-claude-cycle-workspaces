# Generated by /idea init on 2026-07-17 (Phase 11 — app-shell coherence). Edit freely; preserved across re-runs.
# mifos-x-backoffice-next-gen — permission-gated back-office app chrome (v1.0)
#
# NOTE: this is a permission/capability-registry-driven nav app (technical_decisions.nav_model)
# — the bottom-nav below is a Material3 Adaptive default set; the REAL runtime nav roots are the
# 17 modules filtered at build time by the signed-in user's PermissionSet. Desktop/tablet uses a
# NavigationRail/permanent drawer (adaptive_scaffold). These 4 items are illustrative placeholders
# for the most common field-officer surface — update per your default persona.

schema_version: "1.0"
project: "mifos-x-backoffice-next-gen"

# ─── Bottom navigation (adaptive; phone form-factor) ────────────────────
bottom_navigation:
  enabled: true
  items:
    - id: home
      label: "Home"
      icon: "dashboard"
      target_screen: m01-dashboard
      order: 0
    - id: clients
      label: "Clients"
      icon: "group"
      target_screen: m02-clients
      order: 1
    - id: collections
      label: "Collections"
      icon: "receipt_long"
      target_screen: m06-collections
      order: 2
    - id: sync
      label: "Sync"
      icon: "sync"
      target_screen: m17-sync-settings
      order: 3
  selected_color: "primary"
  unselected_color: "on-surface-variant"

# ─── Top app bar ────────────────────────────────────────────────────────
top_app_bar:
  enabled: true
  variant: "small"
  title_source: "screen"
  static_title: null
  leading: "auto"
  trailing_actions: []

# ─── Navigation drawer (permission-filtered module roots; used on desktop/tablet) ──
drawer:
  enabled: true
  # nav-shell-assembler (F22): items are DATA-BOUND at runtime from permission-capability-engine's
  # resolved module roster — rendered per the signed-in user's PermissionSet (§4.7 Tier-1: a root
  # appears iff the user holds ≥1 code in its module family; else HIDDEN, fail-closed). NOT a static list.
  source: permission-resolved-roster
  roster_of: [m01-dashboard, m02-clients, m03-groups-centers, m04-loan-portfolio, m05-savings-deposits-shares, m06-collections, m07-accounting, m08-products-charges, m09-organization, m10-users-roles-permissions, m11-tellers-cash, m12-datatables-config, m13-scheduler-jobs, m14-reports-search-audit, m15-approvals-makerchecker, m16-communications, m17-sync-settings]
  items: []   # resolved at runtime from roster_of ∩ PermissionSet (data-bound by nav-shell-assembler; was an unbuilt empty promise)

# ─── FAB host ───────────────────────────────────────────────────────────
fab_host:
  enabled: true
  default_position: "bottom-end"
  per_screen_overrideable: true

# ─── Snackbar host (transient notifications) ────────────────────────────
snackbar_host:
  enabled: true
  default_position: "bottom"
  z_index: 100

# ─── Safe-area handling ─────────────────────────────────────────────────
safe_area:
  top: "respect"
  bottom: "respect"
  notch_handling: "extend-and-pad"

# ─── Per-screen defaults (screen.ui.yaml.shell overrides these) ────────
defaults:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  drawer_accessible: true
  fab_visible: false
  snackbar_visible: true
