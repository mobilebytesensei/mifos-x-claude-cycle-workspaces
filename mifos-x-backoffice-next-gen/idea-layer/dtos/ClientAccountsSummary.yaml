name: ClientAccountsSummary
version: "1.0.0"
description: >
  Client 360 Accounts tab (m02) — loan / savings / share account summaries for
  a client. Cached CACHE_FIRST_SWR so the Accounts tab renders offline.
source:
  origin: rest
  endpoint: "GET /v1/clients/{clientId}/accounts"
fields:
  - name: loanAccounts
    type: { list_of: { dto_ref: LoanAccountDto } }
    required: false
    description: Summary loan accounts for the client.
  - name: savingsAccounts
    type: { list_of: { dto_ref: SavingsAccountDto } }
    required: false
    description: Summary savings accounts for the client.
  - name: shareAccounts
    type: { list_of: { dto_ref: ShareAccountDto } }
    required: false
    description: Summary share accounts for the client.
used_by:
  - feature: m02-clients
    kind: response
    api_id: get_client_accounts
    role: single
    notes: Accounts tab of the client 360.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [client, fineract, accounts, admin]
