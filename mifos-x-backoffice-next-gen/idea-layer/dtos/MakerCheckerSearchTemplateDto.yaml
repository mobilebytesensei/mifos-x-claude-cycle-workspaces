name: MakerCheckerSearchTemplateDto
version: "1.0.0"
description: >
  Maker-checker search template (m15) — allowed action/entity/maker filter option
  lists that dynamic-template-forms renders the approvals filter FROM.
source:
  origin: rest
  endpoint: "GET /v1/makercheckers/searchtemplate"
fields:
  - name: actionNames
    type: { list_of: String }
    required: false
  - name: entityNames
    type: { list_of: String }
    required: false
  - name: appUsers
    type: { list_of: Json }
    required: false
    description: Makers available to filter by.
used_by:
  - feature: m15-approvals-makerchecker
    kind: response
    api_id: get_makerchecker_search_template
    role: single
    notes: Drives the approvals-queue filter form.
capabilities_used: [has_api, has_offline_cache, has_form_input]
tier: minimal
tags: [maker-checker, template, form, fineract, admin]
