name: LoanProductTemplateDto
version: "1.0.0"
description: >
  Option lists driving the product-editor form (GET /v1/loanproducts/template) —
  currency, fund, repayment/interest frequency, amortization, interest type, charge
  and accounting-rule option sets. Cached for offline product creation/edit.
source:
  origin: rest
  endpoint: "GET /v1/loanproducts/template"
fields:
  - name: currencyOptions
    type: { list_of: Json }
    required: false
  - name: fundOptions
    type: { list_of: Json }
    required: false
  - name: repaymentFrequencyTypeOptions
    type: { list_of: Json }
    required: false
  - name: interestRateFrequencyTypeOptions
    type: { list_of: Json }
    required: false
  - name: amortizationTypeOptions
    type: { list_of: Json }
    required: false
  - name: interestTypeOptions
    type: { list_of: Json }
    required: false
  - name: interestCalculationPeriodTypeOptions
    type: { list_of: Json }
    required: false
  - name: chargeOptions
    type: { list_of: Json }
    required: false
  - name: accountingRuleOptions
    type: { list_of: Json }
    required: false
  - name: paymentTypeOptions
    type: { list_of: Json }
    required: false
  - name: accountingMappingOptions
    type: { optional: Json }
    required: false
    description: GL account option lists (assetAccountOptions, incomeAccountOptions, ...).
used_by:
  - feature: product-editor
    kind: response
    api_id: get_product_template
    role: single
    notes: Drives the dynamic option pickers in the product edit form.
capabilities_used: [has_api, has_offline_cache, requires_auth]
tier: high
tags: [product, loan, template, fineract, admin]
