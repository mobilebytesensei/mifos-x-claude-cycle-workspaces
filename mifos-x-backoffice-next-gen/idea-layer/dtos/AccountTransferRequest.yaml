name: AccountTransferRequest
version: "1.0.0"
description: >
  Inter-account transfer body (m05) for POST /v1/accounttransfers — moves funds
  between savings/loan accounts. Queued to the outbox with durable idempotency for
  exactly-once posting.
source:
  origin: rest
  endpoint: "POST /v1/accounttransfers"
fields:
  - name: fromOfficeId
    type: Long
  - name: fromClientId
    type: Long
  - name: fromAccountId
    type: Long
  - name: fromAccountType
    type: Int
    description: 1 = loan, 2 = savings.
  - name: toOfficeId
    type: Long
  - name: toClientId
    type: Long
  - name: toAccountId
    type: Long
  - name: toAccountType
    type: Int
  - name: transferAmount
    type: Double
  - name: transferDate
    type: Date
  - name: transferDescription
    type: { optional: String }
    required: false
  - name: dateFormat
    type: String
  - name: locale
    type: String
used_by:
  - feature: m05-savings-deposits-shares
    kind: request
    api_id: account_transfer
    role: body
capabilities_used: [has_api, has_form_input]
tier: maximum
tags: [savings, fineract, transfer, money, request, admin]
