name: BatchResponseDto
version: "1.0.0"
description: >
  Per-request result inside a Fineract POST /v1/batches response (m15 / needs-attention).
  The Dto-suffixed variant of BatchResponse used by the approvals + inbox retry paths.
  Each entry carries the requestId, HTTP statusCode and body for outbox reconciliation.
source:
  origin: rest
  endpoint: "POST /v1/batches"
fields:
  - name: requestId
    type: Int
    description: Correlates to the BatchRequest entry's requestId.
  - name: statusCode
    type: Int
    description: Per-request HTTP status (200/403/409…).
  - name: headers
    type: { optional: { list_of: Json } }
    required: false
  - name: body
    type: { optional: String }
    required: false
    description: Raw JSON body (a CommandProcessingResultDto or an ErrorEnvelope on failure).
used_by:
  - feature: m15-approvals-makerchecker
    kind: response
    api_id: batch_approve
    role: array_item
    notes: Result of a batched approve/reject submission.
  - feature: needs-attention-inbox
    kind: response
    api_id: batch_retry
    role: array_item
    notes: Result of a batched outbox retry.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [batch, outbox, fineract, admin]
