name: TellerTransactionDto
version: "1.0.0"
description: >
  Cashier cash transaction (m11) — an allocate / settle / cash-in / cash-out entry
  in the cashier's journal with amount, currency and type. Backs the cashier journal.
source:
  origin: rest
  endpoint: "GET /v1/cashiersjournal"
  table: m_cashier_transactions
fields:
  - name: id
    type: Long
  - name: cashierId
    type: Long
  - name: txnType
    type: String
    values: [allocate, settle, cashIn, cashOut]
  - name: txnAmount
    type: Double
  - name: currencyCode
    type: String
  - name: txnDate
    type: Date
  - name: txnNote
    type: { optional: String }
    required: false
  - name: entityType
    type: { optional: String }
    required: false
  - name: entityId
    type: { optional: Long }
    required: false
used_by:
  - feature: m11-tellers-cash
    kind: response
    api_id: get_cashier_transactions
    role: array_item
    notes: Cashier journal / cash summary.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [teller, cashier, transaction, fineract, cash, admin]
