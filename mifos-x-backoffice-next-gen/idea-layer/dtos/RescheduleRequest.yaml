name: RescheduleRequest
version: "1.0.0"
description: >
  Loan reschedule body (m04) for POST /v1/rescheduleloans — reschedule reason,
  from-installment date, and the new term parameters. Queued to the outbox;
  maker-checker aware.
source:
  origin: rest
  endpoint: "POST /v1/rescheduleloans"
fields:
  - name: loanId
    type: Long
  - name: rescheduleFromDate
    type: Date
  - name: rescheduleReasonId
    type: Long
  - name: submittedOnDate
    type: Date
  - name: adjustedDueDate
    type: { optional: Date }
    required: false
  - name: graceOnPrincipal
    type: { optional: Int }
    required: false
  - name: graceOnInterest
    type: { optional: Int }
    required: false
  - name: extraTerms
    type: { optional: Int }
    required: false
  - name: newInterestRate
    type: { optional: Double }
    required: false
  - name: rescheduleReasonComment
    type: { optional: String }
    required: false
  - name: dateFormat
    type: String
  - name: locale
    type: String
used_by:
  - feature: m04-loan-portfolio
    kind: request
    api_id: create_reschedule
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [loan, fineract, reschedule, request, admin]
