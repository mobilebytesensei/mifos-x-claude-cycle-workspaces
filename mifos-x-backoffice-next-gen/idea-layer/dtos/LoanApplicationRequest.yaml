name: LoanApplicationRequest
version: "1.0.0"
description: >
  New loan application body (m04), assembled by dynamic-template-forms from
  LoanTemplateDto. Queued to the outbox; maker-checker aware. Date fields carry
  dateFormat + locale per the Fineract mutation contract.
source:
  origin: rest
  endpoint: "POST /v1/loans"
fields:
  - name: clientId
    type: { optional: Long }
    required: false
  - name: groupId
    type: { optional: Long }
    required: false
  - name: productId
    type: Long
  - name: principal
    type: Double
  - name: loanTermFrequency
    type: Int
  - name: loanTermFrequencyType
    type: Int
  - name: numberOfRepayments
    type: Int
  - name: repaymentEvery
    type: Int
  - name: repaymentFrequencyType
    type: Int
  - name: interestRatePerPeriod
    type: Double
  - name: amortizationType
    type: Int
  - name: interestType
    type: Int
  - name: interestCalculationPeriodType
    type: Int
  - name: expectedDisbursementDate
    type: Date
  - name: submittedOnDate
    type: Date
  - name: loanType
    type: String
    values: [individual, group, jlg]
  - name: dateFormat
    type: String
  - name: locale
    type: String
used_by:
  - feature: m04-loan-portfolio
    kind: request
    api_id: create_loan
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [loan, fineract, application, request, admin]
