name: LoanTransactionRequest
version: "1.0.0"
description: >
  Loan transaction body (m04) for POST /v1/loans/{id}/transactions?command=... —
  repayment / waiveinterest / writeoff / prepayLoan / foreclosure. Carries a
  durable idempotency key so a money-posting is replayed exactly-once from the outbox.
source:
  origin: rest
  endpoint: "POST /v1/loans/{loanId}/transactions?command={command}"
fields:
  - name: command
    type: String
    values: [repayment, waiveinterest, writeoff, recoverypayment, prepayLoan, foreclosure, refundByCash, goodwillCredit]
  - name: transactionDate
    type: Date
  - name: transactionAmount
    type: Double
  - name: paymentTypeId
    type: { optional: Long }
    required: false
  - name: accountNumber
    type: { optional: String }
    required: false
  - name: note
    type: { optional: String }
    required: false
  - name: dateFormat
    type: String
  - name: locale
    type: String
used_by:
  - feature: m04-loan-portfolio
    kind: request
    api_id: loan_transaction
    role: body
capabilities_used: [has_api, has_form_input]
tier: maximum
tags: [loan, fineract, transaction, money, request, admin]
