name: ReportParameterOptionDto
version: "1.0.0"
description: >
  A resolved parameter option for a report's dynamic parameter (GET
  /v1/runreports/FullParameterList and the per-parameter runreports lookups).
  Fills the report-runner parameter selectors (office, loan officer, product, ...).
source:
  origin: rest
  endpoint: "GET /v1/runreports/FullParameterList"
  list_endpoint: "GET /v1/runreports/{parameterReportName}?R_reportListing=..."
  table: stretchy_report_parameter
fields:
  - name: id
    type: Long
    description: Option value id (bound into the report SQL parameter).
  - name: name
    type: String
    pii: false
    description: Human-readable option label shown in the selector.
  - name: parameterName
    type: { optional: String }
    required: false
    description: The report parameter this option belongs to (e.g. officeId, loanOfficerId).
  - name: parentId
    type: { optional: Long }
    required: false
    description: Cascading parent (e.g. office → loan officer) for dependent parameters.
used_by:
  - feature: report-runner
    kind: response
    api_id: resolve_report_parameter
    role: array_item
    notes: Options for each dynamic report parameter selector.
capabilities_used: [has_api, requires_auth]
tier: low
tags: [report, parameter, fineract, admin]
