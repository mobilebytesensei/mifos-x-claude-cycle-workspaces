name: ClientTemplate
version: "1.0.0"
description: >
  Field defaults + allowed-value option lists (offices, staff, genderId,
  clientTypeId, clientClassificationId, legalForm, savingsProductId…) that
  dynamic-template-forms renders the create/edit client form FROM (m02).
  No field is hardcoded; cached so onboarding opens offline.
source:
  origin: rest
  endpoint: "GET /v1/clients/template"
fields:
  - name: officeOptions
    type: { list_of: Json }
    required: false
    description: Allowed offices (id + name) for the officeId select.
  - name: staffOptions
    type: { list_of: Json }
    required: false
  - name: genderOptions
    type: { list_of: Json }
    required: false
  - name: clientTypeOptions
    type: { list_of: Json }
    required: false
  - name: clientClassificationOptions
    type: { list_of: Json }
    required: false
  - name: clientLegalFormOptions
    type: { list_of: Json }
    required: false
  - name: savingsProductOptions
    type: { list_of: Json }
    required: false
  - name: datatables
    type: { list_of: Json }
    required: false
    description: Entity datatables the create form must also render.
used_by:
  - feature: m02-clients
    kind: response
    api_id: get_client_template
    role: single
    notes: Drives dynamic-template-forms for client create/edit.
capabilities_used: [has_api, has_offline_cache, has_form_input]
tier: minimal
tags: [client, fineract, template, form, admin]
