name: BatchRequest
version: "1.0.0"
description: >
  A single request entry in a Fineract POST /v1/batches body (offline-sync). The
  outbox drains queued mutations as an ordered batch of these, each carrying its own
  relativeUrl/method/body and a durable idempotency reference for exactly-once replay.
source:
  origin: rest
  endpoint: "POST /v1/batches"
fields:
  - name: requestId
    type: Int
    description: Client-assigned id correlating to the matching BatchResponse entry.
  - name: relativeUrl
    type: String
    description: The per-request path (e.g. clients, loans/1?command=approve).
  - name: method
    type: String
    values: [GET, POST, PUT, DELETE]
  - name: reference
    type: { optional: Int }
    required: false
    description: requestId of a prior entry this one depends on (dependent batching).
  - name: headers
    type: { optional: { list_of: Json } }
    required: false
  - name: body
    type: { optional: String }
    required: false
    description: Raw JSON body of the queued mutation.
  - name: idempotencyKey
    type: { optional: String }
    required: false
    description: Durable per-outbox-entry key ensuring exactly-once server application.
used_by:
  - feature: offline-sync-engine
    kind: request
    api_id: submit_batch
    role: array_item
    notes: Outbox drains queued mutations as an ordered batch.
capabilities_used: [has_api, has_offline_cache]
tier: maximum
tags: [batch, outbox, offline-sync, fineract, request, admin]
