name: ClientDetail
version: "1.0.0"
description: >
  Full client 360 base profile (m02) — display name, external id, office,
  status, staff, key dates, legal form. Cached per-client so the 360 opens offline.
source:
  origin: rest
  endpoint: "GET /v1/clients/{clientId}"
  table: m_client
fields:
  - name: id
    type: Long
    description: Fineract client ID.
  - name: accountNo
    type: String
  - name: externalId
    type: { optional: String }
    required: false
  - name: displayName
    type: String
    pii: true
  - name: firstname
    type: { optional: String }
    required: false
    pii: true
  - name: lastname
    type: { optional: String }
    required: false
    pii: true
  - name: mobileNo
    type: { optional: String }
    required: false
    pii: true
  - name: dateOfBirth
    type: { optional: Date }
    required: false
    pii: true
  - name: status
    type: String
    values: [pending, active, closed, rejected, withdrawn, transferInProgress]
  - name: activationDate
    type: { optional: Date }
    required: false
  - name: officeId
    type: Long
  - name: officeName
    type: { optional: String }
    required: false
  - name: staffId
    type: { optional: Long }
    required: false
  - name: legalForm
    type: { optional: String }
    required: false
  - name: genderId
    type: { optional: Long }
    required: false
  - name: clientTypeId
    type: { optional: Long }
    required: false
  - name: clientClassificationId
    type: { optional: Long }
    required: false
used_by:
  - feature: m02-clients
    kind: response
    api_id: get_client_detail
    role: single
    notes: Client 360 header + profile tab.
capabilities_used: [has_api, has_offline_cache, has_flow]
tier: medium
tags: [client, fineract, detail, admin, pii]
