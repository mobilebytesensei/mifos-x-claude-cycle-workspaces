name: SmsCampaignDto
version: "1.0.0"
description: >
  Fineract SMS campaign (m16) — a message template + trigger (direct / scheduled /
  triggered) with its recipient scope and lifecycle status. Backs the campaigns list + detail.
source:
  origin: rest
  endpoint: "GET /v1/smscampaigns/{campaignId}"
  list_endpoint: "GET /v1/smscampaigns"
  table: sms_campaign
fields:
  - name: id
    type: Long
  - name: campaignName
    type: String
  - name: campaignType
    type: { optional: String }
    required: false
  - name: triggerType
    type: String
    values: [direct, scheduled, triggered]
  - name: providerId
    type: { optional: Long }
    required: false
  - name: status
    type: String
    values: [pending, active, closed]
  - name: message
    type: { optional: String }
    required: false
  - name: recurrence
    type: { optional: String }
    required: false
  - name: nextTriggerDate
    type: { optional: DateTime }
    required: false
used_by:
  - feature: m16-communications
    kind: response
    api_id: get_sms_campaign
    role: single
    notes: SMS campaigns list + detail.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [communications, sms, campaign, fineract, admin]
