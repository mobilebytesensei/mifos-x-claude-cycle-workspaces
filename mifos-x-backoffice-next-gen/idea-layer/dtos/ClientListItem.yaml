name: ClientListItem
version: "1.0.0"
description: >
  Single row in the office-scoped client list (m02). Denormalized for list
  performance and cached CACHE_FIRST_SWR so the list renders offline.
source:
  origin: rest
  endpoint: "GET /v1/clients"
  list_endpoint: "GET /v1/clients?officeId={officeId}"
  table: m_client
fields:
  - name: id
    type: Long
    description: Fineract client ID.
  - name: accountNo
    type: String
    description: Human-readable client account number.
  - name: externalId
    type: { optional: String }
    required: false
    description: Client-assigned external id (offline-first onboarding mirror key).
  - name: displayName
    type: String
    pii: true
    description: Client full/display name.
  - name: status
    type: String
    description: Lifecycle status.
    values: [pending, active, closed, rejected, withdrawn, transferInProgress]
  - name: officeId
    type: Long
    description: Owning office (data scope).
  - name: officeName
    type: { optional: String }
    required: false
  - name: staffId
    type: { optional: Long }
    required: false
    description: Assigned loan officer / staff.
  - name: legalForm
    type: { optional: String }
    required: false
    description: PERSON | ENTITY.
used_by:
  - feature: m02-clients
    kind: response
    api_id: list_clients
    role: array_item
    notes: Client list rows; also returned by advanced search.
  - feature: m02-clients
    kind: response
    api_id: search_clients_advanced
    role: array_item
capabilities_used: [has_api, has_offline_cache, has_flow]
tier: medium
tags: [client, fineract, list, admin]
