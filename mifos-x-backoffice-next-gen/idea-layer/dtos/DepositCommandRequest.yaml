name: DepositCommandRequest
version: "1.0.0"
description: >
  Savings deposit/withdrawal transaction body (m05) for
  POST /v1/savingsaccounts/{id}/transactions?command=deposit|withdrawal. Carries a
  durable idempotency key so the money-posting replays exactly-once from the outbox.
source:
  origin: rest
  endpoint: "POST /v1/savingsaccounts/{accountId}/transactions?command={command}"
fields:
  - name: command
    type: String
    values: [deposit, withdrawal]
  - name: transactionDate
    type: Date
  - name: transactionAmount
    type: Double
  - name: paymentTypeId
    type: { optional: Long }
    required: false
  - name: accountNumber
    type: { optional: String }
    required: false
  - name: note
    type: { optional: String }
    required: false
  - name: dateFormat
    type: String
  - name: locale
    type: String
used_by:
  - feature: m05-savings-deposits-shares
    kind: request
    api_id: savings_transaction
    role: body
capabilities_used: [has_api, has_form_input]
tier: maximum
tags: [savings, fineract, transaction, money, request, admin]
