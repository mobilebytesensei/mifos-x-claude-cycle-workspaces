name: NotificationDto
version: "1.0.0"
description: >
  In-app notification (needs-attention / m01) — a server-pushed alert with its
  read/unread state, actor, content and deep-link target. Backs the notifications
  KPI and the needs-attention inbox alert rows.
source:
  origin: rest
  endpoint: "GET /v1/notifications"
  table: notification_mapper
fields:
  - name: id
    type: Long
  - name: objectType
    type: { optional: String }
    required: false
    description: The entity the notification is about (client, loan, savings…).
  - name: objectId
    type: { optional: Long }
    required: false
  - name: action
    type: { optional: String }
    required: false
  - name: actorId
    type: { optional: Long }
    required: false
  - name: content
    type: String
  - name: isRead
    type: Boolean
  - name: isSystemGenerated
    type: Boolean
    required: false
  - name: createdAt
    type: DateTime
used_by:
  - feature: needs-attention-inbox
    kind: response
    api_id: list_notifications
    role: array_item
    notes: Alert rows in the needs-attention inbox.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [notification, fineract, inbox, admin]
