name: LoanScheduleDto
version: "1.0.0"
description: >
  Loan repayment schedule (m04) — per-period installment breakdown of principal,
  interest, fees, penalties and running balance. Returned by the detail Schedule
  tab and by the calculate-schedule preview. Cached for offline.
source:
  origin: rest
  endpoint: "GET /v1/loans/{loanId}?associations=repaymentSchedule"
fields:
  - name: currency
    type: { optional: Json }
    required: false
  - name: loanTermInDays
    type: { optional: Int }
    required: false
  - name: totalPrincipalExpected
    type: { optional: Double }
    required: false
  - name: totalInterestCharged
    type: { optional: Double }
    required: false
  - name: totalRepaymentExpected
    type: { optional: Double }
    required: false
  - name: periods
    type: { list_of: Json }
    description: Installment rows — dueDate, principalDue, interestDue, feeChargesDue, penaltyChargesDue, totalDueForPeriod, principalLoanBalanceOutstanding.
used_by:
  - feature: m04-loan-portfolio
    kind: response
    api_id: get_loan_schedule
    role: single
    notes: Schedule tab + calculate-schedule preview result.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [loan, fineract, schedule, admin]
