name: ClientAccountsDto
version: "1.0.0"
description: >
  Aggregated account holdings for a client (GET /v1/clients/{clientId}/accounts) —
  loan, savings and share accounts with status + balance for the client-detail-360
  Accounts tab. Cached CACHE_FIRST_SWR for offline drill-in.
source:
  origin: rest
  endpoint: "GET /v1/clients/{clientId}/accounts"
  table: "m_loan / m_savings_account / m_share_account"
fields:
  - name: loanAccounts
    type: { list_of: Json }
    required: false
    description: "Loan account rows { id, accountNo, productName, loanStatus{id,value}, loanBalance, amountPaid }."
  - name: savingsAccounts
    type: { list_of: Json }
    required: false
    description: "Savings account rows { id, accountNo, productName, status{id,value}, accountBalance, currency }."
  - name: shareAccounts
    type: { list_of: Json }
    required: false
    description: "Share account rows { id, accountNo, productName, status{id,value}, totalApprovedShares }."
used_by:
  - feature: client-detail-360
    kind: response
    api_id: get_client_accounts
    role: single
    notes: Accounts tab — loans, savings and shares with status and balance.
capabilities_used: [has_api, has_offline_cache, requires_auth]
tier: medium
tags: [client, accounts, fineract, detail, admin]
