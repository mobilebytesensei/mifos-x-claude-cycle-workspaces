name: FixedDepositAccountDto
version: "1.0.0"
description: >
  Fineract fixed-deposit account (m05) — deposit amount, term, maturity, interest
  and lifecycle status. Backs the FD detail. Cached CACHE_FIRST_SWR for offline.
source:
  origin: rest
  endpoint: "GET /v1/fixeddepositaccounts/{accountId}"
  table: m_savings_account
fields:
  - name: id
    type: Long
  - name: accountNo
    type: String
  - name: clientId
    type: { optional: Long }
    required: false
  - name: clientName
    type: { optional: String }
    required: false
    pii: true
  - name: productId
    type: Long
  - name: status
    type: String
    values: [submitted, approved, active, matured, closed, prematureClosed, rejected, withdrawn]
  - name: currencyCode
    type: String
  - name: depositAmount
    type: { optional: Double }
    required: false
  - name: maturityAmount
    type: { optional: Double }
    required: false
  - name: maturityDate
    type: { optional: Date }
    required: false
  - name: depositPeriod
    type: { optional: Int }
    required: false
  - name: depositPeriodFrequency
    type: { optional: String }
    required: false
  - name: nominalAnnualInterestRate
    type: { optional: Double }
    required: false
used_by:
  - feature: m05-savings-deposits-shares
    kind: response
    api_id: get_fixed_deposit_account
    role: single
    notes: Fixed-deposit account detail.
capabilities_used: [has_api, has_offline_cache, has_flow]
tier: medium
tags: [savings, fineract, fixed-deposit, admin]
