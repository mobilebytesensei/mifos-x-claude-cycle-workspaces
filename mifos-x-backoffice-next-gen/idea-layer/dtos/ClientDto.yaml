name: ClientDto
version: "1.0.0"
description: >
  Full client profile for the client-detail-360 header (GET /v1/clients/{clientId}).
  Superset of ClientListItem with identity, office/staff assignment, KYC identity
  fields and lifecycle timeline. Cached CACHE_FIRST_SWR for offline detail view.
source:
  origin: rest
  endpoint: "GET /v1/clients/{clientId}"
  table: m_client
fields:
  - name: id
    type: Long
    description: Fineract client ID.
  - name: accountNo
    type: String
    description: Human-readable client account number.
  - name: externalId
    type: { optional: String }
    required: false
    description: Client-assigned external id (offline onboarding mirror key).
  - name: displayName
    type: String
    pii: true
    description: Client full/display name.
  - name: firstname
    type: { optional: String }
    required: false
    pii: true
  - name: lastname
    type: { optional: String }
    required: false
    pii: true
  - name: mobileNo
    type: { optional: String }
    required: false
    pii: true
    description: Contact number.
  - name: dateOfBirth
    type: { optional: String }
    required: false
    pii: true
    description: ISO date of birth.
  - name: active
    type: Boolean
    description: True when the client is in Active lifecycle status.
  - name: status
    type: Json
    description: "Fineract status object { id, code, value } — pending/active/closed/rejected/withdrawn."
  - name: activationDate
    type: { optional: String }
    required: false
    description: Activation date (yyyy-MM-dd from the dateFormat/locale contract).
  - name: officeId
    type: Long
    description: Owning office (data scope).
  - name: officeName
    type: { optional: String }
    required: false
  - name: staffId
    type: { optional: Long }
    required: false
    description: Assigned loan officer / staff.
  - name: staffName
    type: { optional: String }
    required: false
    pii: true
  - name: legalForm
    type: Json
    description: "Legal form object { id, code, value } — PERSON | ENTITY."
  - name: timeline
    type: { optional: Json }
    required: false
    description: submittedOnDate / activatedOnDate / closedOnDate audit timeline.
used_by:
  - feature: client-detail-360
    kind: response
    api_id: get_client
    role: single
    notes: Detail header (name, account no, status, office, staff, KYC identity).
capabilities_used: [has_api, has_offline_cache, requires_auth]
tier: medium
tags: [client, fineract, detail, pii, admin]
