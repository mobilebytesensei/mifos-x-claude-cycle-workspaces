name: LoanAccountDto
version: "1.0.0"
description: >
  Fineract loan account (m04) through its full lifecycle — submitted, approved,
  active, closed, overpaid, rejected, withdrawn. Backs the loan list rows and the
  loan detail header + summary. Cached CACHE_FIRST_SWR so the portfolio renders offline.
source:
  origin: rest
  endpoint: "GET /v1/loans/{loanId}"
  list_endpoint: "GET /v1/loans?clientId={clientId}"
  table: m_loan
fields:
  - name: id
    type: Long
    description: Fineract loan id.
  - name: accountNo
    type: String
  - name: externalId
    type: { optional: String }
    required: false
  - name: clientId
    type: { optional: Long }
    required: false
  - name: clientName
    type: { optional: String }
    required: false
    pii: true
  - name: groupId
    type: { optional: Long }
    required: false
  - name: loanProductId
    type: Long
  - name: loanProductName
    type: { optional: String }
    required: false
  - name: status
    type: String
    values: [submitted, approved, active, closed, overpaid, rejected, withdrawn, writtenOff]
  - name: principal
    type: Double
  - name: interestRatePerPeriod
    type: { optional: Double }
    required: false
  - name: annualInterestRate
    type: { optional: Double }
    required: false
  - name: currencyCode
    type: String
  - name: totalOutstanding
    type: { optional: Double }
    required: false
  - name: totalOverdue
    type: { optional: Double }
    required: false
  - name: disbursementDate
    type: { optional: Date }
    required: false
  - name: expectedMaturityDate
    type: { optional: Date }
    required: false
  - name: inArrears
    type: Boolean
    required: false
used_by:
  - feature: m04-loan-portfolio
    kind: response
    api_id: get_loan
    role: single
    notes: Loan detail header + list rows.
  - feature: m02-clients
    kind: response
    api_id: get_client_accounts
    role: nested
    notes: Loan account summaries in the client 360 Accounts tab.
capabilities_used: [has_api, has_offline_cache, has_flow]
tier: maximum
tags: [loan, fineract, portfolio, admin]
