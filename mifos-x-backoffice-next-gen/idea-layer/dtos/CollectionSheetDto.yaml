name: CollectionSheetDto
version: "1.0.0"
description: >
  Collection sheet (needs-attention / m06) — the per-group/center due list of loan
  repayments and savings deposits for a meeting date, with clients, due amounts and
  the productive/attendance rows. Cached CACHE_FIRST_SWR so field collection works offline.
source:
  origin: rest
  endpoint: "GET /v1/collectionsheet"
fields:
  - name: dueDate
    type: Date
  - name: currency
    type: { optional: Json }
    required: false
  - name: loanProducts
    type: { list_of: Json }
    required: false
  - name: groups
    type: { list_of: Json }
    required: false
    description: Per-group client rows with loan/savings due amounts.
  - name: attendanceTypeOptions
    type: { list_of: Json }
    required: false
  - name: paymentTypeOptions
    type: { list_of: Json }
    required: false
used_by:
  - feature: needs-attention-inbox
    kind: response
    api_id: get_collection_sheet
    role: single
    notes: Collection-sheet due rows surfaced in the inbox.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [collections, fineract, admin]
