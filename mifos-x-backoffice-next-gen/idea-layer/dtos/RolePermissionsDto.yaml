name: RolePermissionsDto
version: "1.0.0"
description: >
  A single role's grouped permission grid from the Fineract read endpoint
  (GET /v1/roles/{roleId}/permissions). Carries the role id/name plus the full
  permission catalog annotated with a per-code `selected` flag, so the permission-set
  editor can render held-vs-total counts and the 403-drift permission_refresh protocol
  can rebuild the runtime PermissionSet + sha256 fingerprint from the role's held codes.
  Read/refresh only — never mutates permissions.
source:
  origin: rest
  endpoint: "GET /v1/roles/{roleId}/permissions"
  list_endpoint: "GET /v1/roles/{roleId}/permissions"
  table: m_role_permission
fields:
  - name: id
    type: { optional: Long }
    required: false
    description: Role id whose permission grid this represents.
  - name: name
    type: { optional: String }
    required: false
    description: Human-readable role name (e.g. Super user, Loan officer).
  - name: permissionUsageData
    type: { array: PermissionUsageDataDto }
    description: >
      The full permission catalog for the role, each entry annotated with `selected`
      to indicate whether the role currently holds that permission.
used_by:
  - feature: permission-set-detail
    kind: response
    api_id: refresh_role_permissions
    role: root_object
    notes: >
      Password-less role-permission refresh (GET /v1/roles/{roleId}/permissions) — re-pulls the
      role's held codes so core/permissions rebuilds the PermissionSet + sha256 fingerprint.
capabilities_used: [has_api, has_offline_cache, requires_auth]
tier: medium
tags: [permission, role, fineract, authorisation, reference-data]
