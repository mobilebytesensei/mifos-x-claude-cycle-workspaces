name: ClientCommandRequest
version: "1.0.0"
description: >
  Client lifecycle-command body (m02) for POST /v1/clients/{id}?command=... —
  activate/close/reject/withdraw/reactivate/transfer/assignStaff. Date-bearing
  commands send dateFormat + locale. Queued to the outbox; maker-checker aware.
source:
  origin: rest
  endpoint: "POST /v1/clients/{clientId}?command={command}"
fields:
  - name: command
    type: String
    description: The lifecycle transition selected via query param, echoed in the body context.
    values: [activate, close, reject, withdraw, reactivate, undoRejection, undoWithdrawal, proposeTransfer, acceptTransfer, assignStaff, unassignStaff]
  - name: activationDate
    type: { optional: Date }
    required: false
  - name: closureDate
    type: { optional: Date }
    required: false
  - name: closureReasonId
    type: { optional: Long }
    required: false
  - name: reactivationDate
    type: { optional: Date }
    required: false
  - name: staffId
    type: { optional: Long }
    required: false
  - name: destinationOfficeId
    type: { optional: Long }
    required: false
    description: For proposeTransfer.
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m02-clients
    kind: request
    api_id: client_lifecycle_command
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [client, fineract, lifecycle, command, request, admin]
