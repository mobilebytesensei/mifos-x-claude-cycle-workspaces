name: CashierDto
version: "1.0.0"
description: >
  Fineract cashier (m11) — a staff member assigned to a teller for a period, with
  cash allocation/settlement totals. Backs the cashier list under a teller.
source:
  origin: rest
  endpoint: "GET /v1/tellers/{tellerId}/cashiers/{cashierId}"
  list_endpoint: "GET /v1/tellers/{tellerId}/cashiers"
  table: m_cashiers
fields:
  - name: id
    type: Long
  - name: tellerId
    type: Long
  - name: staffId
    type: Long
  - name: staffName
    type: { optional: String }
    required: false
    pii: true
  - name: description
    type: { optional: String }
    required: false
  - name: startDate
    type: { optional: Date }
    required: false
  - name: endDate
    type: { optional: Date }
    required: false
  - name: isFullDay
    type: Boolean
    required: false
used_by:
  - feature: m11-tellers-cash
    kind: response
    api_id: get_cashier
    role: single
    notes: Cashier list under a teller.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [teller, cashier, fineract, cash, admin]
