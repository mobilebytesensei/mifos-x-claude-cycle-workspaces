name: ShareCommandRequest
version: "1.0.0"
description: >
  Share account command body (m05) for POST /v1/accounts/share/{id}?command=... —
  approve / activate / applyadditionalshares / redeemshares / close. Queued to the outbox.
source:
  origin: rest
  endpoint: "POST /v1/accounts/share/{accountId}?command={command}"
fields:
  - name: command
    type: String
    values: [approve, reject, activate, applyadditionalshares, approveadditionalshares, redeemshares, close]
  - name: requestedDate
    type: { optional: Date }
    required: false
  - name: requestedShares
    type: { optional: Int }
    required: false
    description: For applyadditionalshares / redeemshares.
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m05-savings-deposits-shares
    kind: request
    api_id: share_command
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [shares, fineract, command, request, admin]
