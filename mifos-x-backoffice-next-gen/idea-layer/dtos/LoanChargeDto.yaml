name: LoanChargeDto
version: "1.0.0"
description: >
  A charge attached to a loan (m04) — fee or penalty with its calculation type,
  amount, and paid/waived/outstanding state. Backs the loan Charges tab.
source:
  origin: rest
  endpoint: "GET /v1/loans/{loanId}/charges"
  table: m_loan_charge
fields:
  - name: id
    type: Long
  - name: chargeId
    type: Long
  - name: name
    type: String
  - name: chargeTimeType
    type: { optional: String }
    required: false
    description: When the charge applies (disbursement, specifiedDueDate, installmentFee, overdue…).
  - name: chargeCalculationType
    type: { optional: String }
    required: false
    values: [flat, percentOfAmount, percentOfAmountAndInterest, percentOfInterest]
  - name: amount
    type: Double
  - name: amountPaid
    type: { optional: Double }
    required: false
  - name: amountWaived
    type: { optional: Double }
    required: false
  - name: amountOutstanding
    type: { optional: Double }
    required: false
  - name: penalty
    type: Boolean
    required: false
  - name: paid
    type: Boolean
    required: false
used_by:
  - feature: m04-loan-portfolio
    kind: response
    api_id: get_loan_charges
    role: array_item
    notes: Loan Charges tab.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [loan, fineract, charge, admin]
