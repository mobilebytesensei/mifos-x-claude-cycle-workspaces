name: CommandProcessingResult
version: "1.0.0"
description: >
  Canonical Fineract write-command result envelope. Returned by every mutating
  POST/PUT (create/update/lifecycle). A queued maker-checker command returns
  commandId with empty changes (Submitted-for-approval). This is the non-suffixed
  variant referenced by m02/m05; CommandProcessingResultDto is the identical
  shape referenced by the m04/m09/m12/m15 endpoints.
source:
  origin: rest
  endpoint: "POST /v1/{entity} (generic command result)"
fields:
  - name: officeId
    type: { optional: Long }
    required: false
  - name: clientId
    type: { optional: Long }
    required: false
  - name: resourceId
    type: { optional: Long }
    required: false
    description: Id of the created/affected resource.
  - name: resourceExternalId
    type: { optional: String }
    required: false
  - name: commandId
    type: { optional: Long }
    required: false
    description: Maker-checker command id; present when the command was queued for approval.
  - name: changes
    type: { optional: { map_of: { key: String, value: Json } } }
    required: false
    description: Field-level changes applied; empty when queued for approval.
used_by:
  - feature: m02-clients
    kind: response
    api_id: create_client
    role: single
    notes: Result of create/update/lifecycle/subresource/document commands.
  - feature: m05-savings-deposits-shares
    kind: response
    api_id: savings_command
    role: single
    notes: Result of savings/FD/RD/share/transfer commands.
capabilities_used: [has_api, has_offline_cache]
tier: maximum
tags: [command, fineract, write, maker-checker, admin]
