name: CalculateScheduleRequest
version: "1.0.0"
description: >
  Loan schedule preview body (m04) for POST /v1/loans?command=calculateLoanSchedule
  — same shape as a loan application but returns a LoanScheduleDto preview without
  persisting. Runs online (or serves a cached preview for identical params).
source:
  origin: rest
  endpoint: "POST /v1/loans?command=calculateLoanSchedule"
fields:
  - name: productId
    type: Long
  - name: principal
    type: Double
  - name: loanTermFrequency
    type: Int
  - name: loanTermFrequencyType
    type: Int
  - name: numberOfRepayments
    type: Int
  - name: repaymentEvery
    type: Int
  - name: repaymentFrequencyType
    type: Int
  - name: interestRatePerPeriod
    type: Double
  - name: amortizationType
    type: Int
  - name: interestType
    type: Int
  - name: interestCalculationPeriodType
    type: Int
  - name: expectedDisbursementDate
    type: Date
  - name: dateFormat
    type: String
  - name: locale
    type: String
used_by:
  - feature: m04-loan-portfolio
    kind: request
    api_id: calculate_schedule
    role: body
capabilities_used: [has_api, has_form_input]
tier: minimal
tags: [loan, fineract, schedule, preview, request, admin]
