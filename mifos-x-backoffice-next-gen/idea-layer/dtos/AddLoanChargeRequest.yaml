name: AddLoanChargeRequest
version: "1.0.0"
description: >
  Attach-a-charge-to-a-loan body (m04) for POST /v1/loans/{id}/charges — selects a
  charge definition and its amount/date. Queued to the outbox.
source:
  origin: rest
  endpoint: "POST /v1/loans/{loanId}/charges"
fields:
  - name: chargeId
    type: Long
  - name: amount
    type: Double
  - name: dueDate
    type: { optional: Date }
    required: false
  - name: chargeTimeType
    type: { optional: Int }
    required: false
  - name: chargeCalculationType
    type: { optional: Int }
    required: false
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m04-loan-portfolio
    kind: request
    api_id: add_loan_charge
    role: body
capabilities_used: [has_api, has_form_input]
tier: minimal
tags: [loan, fineract, charge, request, admin]
