name: CreateClientRequest
version: "1.0.0"
description: >
  Onboard-a-client body (m02), assembled by dynamic-template-forms from the
  client template. Carries a client-generated externalId so the row can be queued
  offline and reconciled by external-id path mirrors; replayed exactly-once via batches.
source:
  origin: rest
  endpoint: "POST /v1/clients"
fields:
  - name: officeId
    type: Long
    description: Owning office.
  - name: legalFormId
    type: Int
    description: 1 = PERSON, 2 = ENTITY.
  - name: firstname
    type: { optional: String }
    required: false
    pii: true
  - name: lastname
    type: { optional: String }
    required: false
    pii: true
  - name: fullname
    type: { optional: String }
    required: false
    pii: true
    description: Used for ENTITY legal form instead of first/last.
  - name: externalId
    type: { optional: String }
    required: false
    description: Client-generated id for offline-first reconciliation.
  - name: mobileNo
    type: { optional: String }
    required: false
    pii: true
  - name: dateOfBirth
    type: { optional: Date }
    required: false
    pii: true
  - name: staffId
    type: { optional: Long }
    required: false
  - name: active
    type: Boolean
    required: false
    description: When true, activate on create (requires activationDate).
  - name: activationDate
    type: { optional: Date }
    required: false
  - name: dateFormat
    type: String
    description: Required alongside any date field per Fineract mutation contract.
  - name: locale
    type: String
used_by:
  - feature: m02-clients
    kind: request
    api_id: create_client
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [client, fineract, create, request, admin, pii]
