name: LoanProductDto
version: "1.0.0"
description: >
  Loan product being edited in product-editor (GET /v1/loanproducts/{productId}).
  Terms, interest/amortization, charges, accounting rule and GL mappings. Cached
  for offline edit; savings products use the parallel /v1/savingsproducts/{id}.
source:
  origin: rest
  endpoint: "GET /v1/loanproducts/{productId}"
  table: m_product_loan
fields:
  - name: id
    type: Long
    description: Loan product ID.
  - name: name
    type: String
    description: Product name.
  - name: shortName
    type: String
    description: Short code (unique).
  - name: description
    type: { optional: String }
    required: false
  - name: fundId
    type: { optional: Long }
    required: false
  - name: currency
    type: Json
    description: "Currency object { code, decimalPlaces, inMultiplesOf }."
  - name: principal
    type: Double
    description: Default principal amount.
  - name: minPrincipal
    type: { optional: Double }
    required: false
  - name: maxPrincipal
    type: { optional: Double }
    required: false
  - name: numberOfRepayments
    type: Int
    description: Default number of repayments.
  - name: repaymentEvery
    type: Int
  - name: repaymentFrequencyType
    type: Json
    description: "Frequency enum { id, code, value } — days/weeks/months."
  - name: interestRatePerPeriod
    type: Double
  - name: interestRateFrequencyType
    type: Json
  - name: amortizationType
    type: Json
    description: "equal_installments | equal_principal."
  - name: interestType
    type: Json
    description: "declining_balance | flat."
  - name: interestCalculationPeriodType
    type: Json
  - name: charges
    type: { list_of: Json }
    required: false
    description: "Attached charges [{ id, name, chargeTimeType, amount }]."
  - name: accountingRule
    type: Json
    description: "none | cash | accrual_periodic | accrual_upfront."
  - name: accountingMappings
    type: { optional: Json }
    required: false
    description: GL account mappings when accountingRule != none.
used_by:
  - feature: product-editor
    kind: response
    api_id: get_product
    role: single
    notes: Loads the loan product for the edit form.
capabilities_used: [has_api, has_offline_cache, requires_auth]
tier: high
tags: [product, loan, fineract, accounting, admin]
