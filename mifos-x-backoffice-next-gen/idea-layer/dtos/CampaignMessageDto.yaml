name: CampaignMessageDto
version: "1.0.0"
description: >
  A single SMS/email message emitted by a campaign (m16) — recipient, rendered
  content and delivery status. Backs the campaign message log.
source:
  origin: rest
  endpoint: "GET /v1/smscampaigns/{campaignId}/messages"
  table: sms_messages_outbound
fields:
  - name: id
    type: Long
  - name: campaignId
    type: { optional: Long }
    required: false
  - name: mobileNo
    type: { optional: String }
    required: false
    pii: true
  - name: message
    type: String
  - name: status
    type: String
    values: [pending, sent, delivered, failed, waitingForDeliveryReport]
  - name: deliveredOnDate
    type: { optional: DateTime }
    required: false
  - name: clientId
    type: { optional: Long }
    required: false
used_by:
  - feature: m16-communications
    kind: response
    api_id: get_campaign_messages
    role: array_item
    notes: Campaign message delivery log.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [communications, sms, message, fineract, admin, pii]
