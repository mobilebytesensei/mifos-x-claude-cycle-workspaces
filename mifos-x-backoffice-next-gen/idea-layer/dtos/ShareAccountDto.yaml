name: ShareAccountDto
version: "1.0.0"
description: >
  Fineract share account (m05) — approved/pending shares, nominal price, dividends
  and lifecycle status. Backs the share account detail. Cached for offline.
source:
  origin: rest
  endpoint: "GET /v1/accounts/share/{accountId}"
  table: m_share_account
fields:
  - name: id
    type: Long
  - name: accountNo
    type: String
  - name: clientId
    type: { optional: Long }
    required: false
  - name: clientName
    type: { optional: String }
    required: false
    pii: true
  - name: productId
    type: Long
  - name: productName
    type: { optional: String }
    required: false
  - name: status
    type: String
    values: [submitted, approved, active, rejected, closed]
  - name: currencyCode
    type: String
  - name: totalApprovedShares
    type: { optional: Int }
    required: false
  - name: totalPendingShares
    type: { optional: Int }
    required: false
  - name: unitPrice
    type: { optional: Double }
    required: false
  - name: sharesQuantity
    type: { optional: Int }
    required: false
used_by:
  - feature: m05-savings-deposits-shares
    kind: response
    api_id: get_share_account
    role: single
    notes: Share account detail.
  - feature: m02-clients
    kind: response
    api_id: get_client_accounts
    role: nested
    notes: Share account summaries in the client 360 Accounts tab.
capabilities_used: [has_api, has_offline_cache, has_flow]
tier: medium
tags: [shares, fineract, admin]
