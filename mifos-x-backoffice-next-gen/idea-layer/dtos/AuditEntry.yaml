name: AuditEntry
version: "1.0.0"
description: >
  Fineract audit trail row (offline-sync / m14) — a processed command with its
  maker/checker, action/entity, resource, timestamps and command payload. Also the
  local shape the offline-sync engine reconciles processed outbox commands against.
source:
  origin: rest
  endpoint: "GET /v1/audits/{auditId}"
  list_endpoint: "GET /v1/audits"
  table: m_portfolio_command_source
fields:
  - name: id
    type: Long
  - name: actionName
    type: String
  - name: entityName
    type: String
  - name: resourceId
    type: { optional: Long }
    required: false
  - name: maker
    type: String
    pii: true
  - name: madeOnDate
    type: DateTime
  - name: checker
    type: { optional: String }
    required: false
    pii: true
  - name: checkedOnDate
    type: { optional: DateTime }
    required: false
  - name: processingResult
    type: String
    values: [awaitingApproval, approved, rejected, processed]
  - name: officeName
    type: { optional: String }
    required: false
  - name: commandAsJson
    type: { optional: Json }
    required: false
used_by:
  - feature: offline-sync-engine
    kind: response
    api_id: reconcile_audit
    role: array_item
    notes: Server audit rows reconciled against processed outbox commands.
  - feature: m17-sync-settings
    kind: cache
    api_id: sync_audit
    role: nested
    notes: Sync-settings surfaces the reconciled audit state.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [audit, offline-sync, fineract, admin, pii]
