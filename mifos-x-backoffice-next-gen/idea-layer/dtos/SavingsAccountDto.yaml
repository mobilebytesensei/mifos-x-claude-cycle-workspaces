name: SavingsAccountDto
version: "1.0.0"
description: >
  Fineract savings account (m05) with balance, status, product and transaction
  summary. Backs the savings list rows and the detail header + ledger. Cached
  CACHE_FIRST_SWR so the account opens offline.
source:
  origin: rest
  endpoint: "GET /v1/savingsaccounts/{accountId}"
  list_endpoint: "GET /v1/savingsaccounts?clientId={clientId}"
  table: m_savings_account
fields:
  - name: id
    type: Long
  - name: accountNo
    type: String
  - name: clientId
    type: { optional: Long }
    required: false
  - name: clientName
    type: { optional: String }
    required: false
    pii: true
  - name: groupId
    type: { optional: Long }
    required: false
  - name: savingsProductId
    type: Long
  - name: savingsProductName
    type: { optional: String }
    required: false
  - name: status
    type: String
    values: [submitted, approved, active, closed, rejected, withdrawn, dormant]
  - name: currencyCode
    type: String
  - name: accountBalance
    type: { optional: Double }
    required: false
  - name: availableBalance
    type: { optional: Double }
    required: false
  - name: onHoldFunds
    type: { optional: Double }
    required: false
  - name: nominalAnnualInterestRate
    type: { optional: Double }
    required: false
  - name: fieldOfficerId
    type: { optional: Long }
    required: false
used_by:
  - feature: m05-savings-deposits-shares
    kind: response
    api_id: get_savings_account
    role: single
    notes: Savings detail header + list rows.
  - feature: m02-clients
    kind: response
    api_id: get_client_accounts
    role: nested
    notes: Savings account summaries in the client 360 Accounts tab.
capabilities_used: [has_api, has_offline_cache, has_flow]
tier: maximum
tags: [savings, fineract, deposit, admin]
