name: DocumentUpload
version: "1.0.0"
description: >
  Multipart KYC document attachment (m02). The picked file is staged to encrypted
  local media and registered in the outbox; the multipart upload runs on the next
  sync (queued while offline).
source:
  origin: rest
  endpoint: "POST /v1/clients/{clientId}/documents"
fields:
  - name: name
    type: String
    description: Document display name.
  - name: fileName
    type: String
  - name: description
    type: { optional: String }
    required: false
  - name: file
    type: Bytes
    description: The document binary (staged to encrypted local media until synced).
  - name: mimeType
    type: { optional: String }
    required: false
  - name: localMediaUri
    type: { optional: String }
    required: false
    description: Offline staging path for the queued upload.
used_by:
  - feature: m02-clients
    kind: request
    api_id: upload_client_document
    role: body
capabilities_used: [has_api, has_file_operation, has_offline_cache]
tier: minimal
tags: [client, fineract, document, multipart, request, admin]
