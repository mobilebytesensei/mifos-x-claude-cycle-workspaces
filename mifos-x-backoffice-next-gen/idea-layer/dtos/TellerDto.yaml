name: TellerDto
version: "1.0.0"
description: >
  Fineract teller (m11) — a cash-management till scoped to an office with its
  validity window and status. Backs the teller list + detail.
source:
  origin: rest
  endpoint: "GET /v1/tellers/{tellerId}"
  list_endpoint: "GET /v1/tellers"
  table: m_tellers
fields:
  - name: id
    type: Long
  - name: name
    type: String
  - name: officeId
    type: Long
  - name: officeName
    type: { optional: String }
    required: false
  - name: description
    type: { optional: String }
    required: false
  - name: startDate
    type: { optional: Date }
    required: false
  - name: endDate
    type: { optional: Date }
    required: false
  - name: status
    type: String
    values: [active, inactive]
used_by:
  - feature: m11-tellers-cash
    kind: response
    api_id: get_teller
    role: single
    notes: Teller list + detail.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [teller, fineract, cash, admin]
