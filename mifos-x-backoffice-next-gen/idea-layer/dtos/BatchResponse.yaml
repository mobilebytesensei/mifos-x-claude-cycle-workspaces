name: BatchResponse
version: "1.0.0"
description: >
  Per-request result inside a Fineract POST /v1/batches response (offline-sync / m06 /
  m17). The non-suffixed variant referenced by the sync engine; identical shape to
  BatchResponseDto. Drives exactly-once outbox reconciliation.
source:
  origin: rest
  endpoint: "POST /v1/batches"
fields:
  - name: requestId
    type: Int
    description: Correlates to the BatchRequest entry's requestId.
  - name: statusCode
    type: Int
    description: Per-request HTTP status (200/403/409…).
  - name: headers
    type: { optional: { list_of: Json } }
    required: false
  - name: body
    type: { optional: String }
    required: false
    description: Raw JSON body (a CommandProcessingResult or an ErrorEnvelope on failure).
used_by:
  - feature: offline-sync-engine
    kind: response
    api_id: submit_batch
    role: array_item
    notes: Per-command result of an outbox batch drain.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [batch, outbox, offline-sync, fineract, admin]
