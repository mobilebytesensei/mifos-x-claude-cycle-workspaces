name: MakerCheckerEntryDto
version: "1.0.0"
description: >
  A pending maker-checker command (m15 / needs-attention) — the queued write awaiting
  approval, carrying its action/entity, maker, resource and command payload. Backs
  the approvals queue and the needs-attention inbox pending rows.
source:
  origin: rest
  endpoint: "GET /v1/makercheckers"
  table: m_portfolio_command_source
fields:
  - name: id
    type: Long
    description: Command id.
  - name: actionName
    type: String
    description: e.g. CREATE, APPROVE, DISBURSE.
  - name: entityName
    type: String
    description: e.g. CLIENT, LOAN, SAVINGSACCOUNT.
  - name: resourceId
    type: { optional: Long }
    required: false
  - name: madeOnDate
    type: DateTime
  - name: maker
    type: String
    pii: true
    description: Username of the operator who made the command.
  - name: checkedOnDate
    type: { optional: DateTime }
    required: false
  - name: checker
    type: { optional: String }
    required: false
    pii: true
  - name: processingResult
    type: String
    values: [awaitingApproval, approved, rejected]
  - name: officeName
    type: { optional: String }
    required: false
  - name: commandAsJson
    type: { optional: Json }
    required: false
    description: The original command payload for review.
used_by:
  - feature: m15-approvals-makerchecker
    kind: response
    api_id: list_makercheckers
    role: array_item
    notes: Approvals queue rows.
  - feature: needs-attention-inbox
    kind: response
    api_id: list_pending_approvals
    role: array_item
    notes: Pending-approval rows in the needs-attention inbox.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [maker-checker, approval, fineract, admin, pii]
