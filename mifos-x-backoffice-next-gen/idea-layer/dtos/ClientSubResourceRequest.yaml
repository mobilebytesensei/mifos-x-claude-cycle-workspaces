name: ClientSubResourceRequest
version: "1.0.0"
description: >
  Add-a-KYC-sub-resource body (m02) — identifier / note / address / family member
  / charge — assembled from the sub-resource template. Gated on the matching
  CREATE_{SUBRESOURCE} permission; queued to the outbox.
source:
  origin: rest
  endpoint: "POST /v1/clients/{clientId}/{subResource}"
fields:
  - name: subResource
    type: String
    values: [identifiers, notes, addresses, familymembers, charges]
  - name: documentTypeId
    type: { optional: Long }
    required: false
    description: For identifiers — the id document type.
  - name: documentKey
    type: { optional: String }
    required: false
    pii: true
    description: For identifiers — the id number.
  - name: note
    type: { optional: String }
    required: false
    description: For notes.
  - name: addressTypeId
    type: { optional: Long }
    required: false
  - name: addressLine1
    type: { optional: String }
    required: false
    pii: true
  - name: chargeId
    type: { optional: Long }
    required: false
  - name: amount
    type: { optional: Double }
    required: false
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m02-clients
    kind: request
    api_id: create_client_subresource
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [client, fineract, kyc, request, admin, pii]
