name: ClientSubResourceItem
version: "1.0.0"
description: >
  A single client 360 sub-resource row (m02) — identifier / document / address /
  family member / charge / note. Loaded lazily when its tab opens, gated on the
  matching READ permission, served cache-first.
source:
  origin: rest
  endpoint: "GET /v1/clients/{clientId}/{subResource}"
fields:
  - name: id
    type: Long
    description: Sub-resource row id.
  - name: subResourceType
    type: String
    description: The 360 collection this row belongs to.
    values: [identifiers, documents, addresses, familymembers, charges, notes]
  - name: label
    type: String
    description: Primary display label for the row (e.g. document name, id number, note text).
  - name: value
    type: { optional: String }
    required: false
    pii: true
    description: Secondary/detail value (masked for PII collections in the UI).
  - name: status
    type: { optional: String }
    required: false
  - name: createdDate
    type: { optional: DateTime }
    required: false
used_by:
  - feature: m02-clients
    kind: response
    api_id: get_client_subresource
    role: array_item
    notes: Identifiers/documents/addresses/familymembers/charges/notes tabs.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [client, fineract, kyc, admin, pii]
