name: LoanTemplateDto
version: "1.0.0"
description: >
  Loan application/edit template (m04) — product options, allowed terms, charge
  options, repayment strategies, interest types — driving dynamic-template-forms
  for the loan create/edit form. GET /v1/loans/template. Cached for offline.
source:
  origin: rest
  endpoint: "GET /v1/loans/template"
fields:
  - name: productOptions
    type: { list_of: Json }
    required: false
  - name: loanTermFrequencyTypeOptions
    type: { list_of: Json }
    required: false
  - name: repaymentFrequencyTypeOptions
    type: { list_of: Json }
    required: false
  - name: interestRateFrequencyTypeOptions
    type: { list_of: Json }
    required: false
  - name: amortizationTypeOptions
    type: { list_of: Json }
    required: false
  - name: interestTypeOptions
    type: { list_of: Json }
    required: false
  - name: chargeOptions
    type: { list_of: Json }
    required: false
  - name: loanOfficerOptions
    type: { list_of: Json }
    required: false
used_by:
  - feature: m04-loan-portfolio
    kind: response
    api_id: get_loan_template
    role: single
    notes: Drives dynamic-template-forms for loan application/edit.
capabilities_used: [has_api, has_offline_cache, has_form_input]
tier: minimal
tags: [loan, fineract, template, form, admin]
