name: LoanTransactionTemplateDto
version: "1.0.0"
description: >
  Transaction template (m04) for a loan operation — repayment / waiveinterest /
  writeoff / foreclosure — pre-filled amounts, allowed payment types and dates
  that dynamic-template-forms renders the transaction form FROM.
source:
  origin: rest
  endpoint: "GET /v1/loans/{loanId}/transactions/template?command={command}"
fields:
  - name: transactionType
    type: { optional: Json }
    required: false
  - name: date
    type: { optional: Date }
    required: false
  - name: amount
    type: { optional: Double }
    required: false
    description: Suggested/expected amount for the operation.
  - name: principalPortion
    type: { optional: Double }
    required: false
  - name: interestPortion
    type: { optional: Double }
    required: false
  - name: paymentTypeOptions
    type: { list_of: Json }
    required: false
used_by:
  - feature: m04-loan-portfolio
    kind: response
    api_id: get_loan_transaction_template
    role: single
    notes: Drives the repayment/waive/writeoff transaction form.
capabilities_used: [has_api, has_offline_cache, has_form_input]
tier: minimal
tags: [loan, fineract, transaction, template, form, admin]
