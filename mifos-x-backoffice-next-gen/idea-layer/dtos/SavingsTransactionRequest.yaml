name: SavingsTransactionRequest
version: "1.0.0"
description: >
  Savings transaction body (m05) for holdAmount / releaseAmount / postInterest and
  transaction adjustments on a savings account. Queued to the outbox with durable
  idempotency for exactly-once posting.
source:
  origin: rest
  endpoint: "POST /v1/savingsaccounts/{accountId}/transactions?command={command}"
fields:
  - name: command
    type: String
    values: [holdAmount, releaseAmount, postInterestAsOn, undo, modify]
  - name: transactionDate
    type: { optional: Date }
    required: false
  - name: amount
    type: { optional: Double }
    required: false
  - name: reasonForBlock
    type: { optional: String }
    required: false
    description: For holdAmount.
  - name: transactionId
    type: { optional: Long }
    required: false
    description: For undo/modify of an existing transaction.
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m05-savings-deposits-shares
    kind: request
    api_id: savings_hold_release
    role: body
capabilities_used: [has_api, has_form_input]
tier: maximum
tags: [savings, fineract, transaction, money, request, admin]
