name: LoanChargeCommandRequest
version: "1.0.0"
description: >
  Loan-charge command body (m04) for POST /v1/loans/{id}/charges/{chargeId}?command=...
  — pay / waive / adjust an existing loan charge. Queued to the outbox.
source:
  origin: rest
  endpoint: "POST /v1/loans/{loanId}/charges/{chargeId}?command={command}"
fields:
  - name: command
    type: String
    values: [pay, waive, adjustment]
  - name: transactionDate
    type: { optional: Date }
    required: false
  - name: amount
    type: { optional: Double }
    required: false
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m04-loan-portfolio
    kind: request
    api_id: loan_charge_command
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [loan, fineract, charge, command, request, admin]
