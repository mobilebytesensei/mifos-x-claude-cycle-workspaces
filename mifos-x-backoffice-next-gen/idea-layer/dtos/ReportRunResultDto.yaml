name: ReportRunResultDto
version: "1.0.0"
description: >
  Tabular result of running a report (GET /v1/runreports/{reportName}?parameterType=true).
  Fineract returns a columnHeaders[] + data[] envelope the report-runner renders as a
  scrollable grid and can export. Cached per (report, parameter-set) hash.
source:
  origin: rest
  endpoint: "GET /v1/runreports/{reportName}"
  table: "(dynamic report SQL)"
fields:
  - name: columnHeaders
    type: { list_of: Json }
    required: true
    description: "Column metadata [{ columnName, columnType, columnDisplayType, isColumnNullable }]."
  - name: data
    type: { list_of: Json }
    required: true
    description: "Row objects [{ row: [cellValue, ...] }] aligned to columnHeaders order."
  - name: reportName
    type: { optional: String }
    required: false
    description: Echoed report name for cache keying and export filename.
  - name: generatedAt
    type: { optional: String }
    required: false
    description: Client-stamped run timestamp for the offline cache freshness badge.
used_by:
  - feature: report-runner
    kind: response
    api_id: run_report
    role: single
    notes: The rendered report result grid + export source.
capabilities_used: [has_api, has_offline_cache, requires_auth]
tier: medium
tags: [report, result, fineract, admin]
