name: UpdateClientRequest
version: "1.0.0"
description: >
  Edit-a-client base profile body (m02), assembled by dynamic-template-forms from
  the pre-filled template. Queued to the outbox. Only changed fields are sent.
source:
  origin: rest
  endpoint: "PUT /v1/clients/{clientId}"
fields:
  - name: firstname
    type: { optional: String }
    required: false
    pii: true
  - name: lastname
    type: { optional: String }
    required: false
    pii: true
  - name: fullname
    type: { optional: String }
    required: false
    pii: true
  - name: mobileNo
    type: { optional: String }
    required: false
    pii: true
  - name: externalId
    type: { optional: String }
    required: false
  - name: staffId
    type: { optional: Long }
    required: false
  - name: genderId
    type: { optional: Long }
    required: false
  - name: clientTypeId
    type: { optional: Long }
    required: false
  - name: clientClassificationId
    type: { optional: Long }
    required: false
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m02-clients
    kind: request
    api_id: update_client
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [client, fineract, update, request, admin, pii]
