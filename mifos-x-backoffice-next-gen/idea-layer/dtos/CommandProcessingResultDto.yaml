name: CommandProcessingResultDto
version: "1.0.0"
description: >
  Canonical Fineract write-command result envelope (Dto-suffixed variant used by
  m04/m09/m12/m15/needs-attention). Identical shape to CommandProcessingResult —
  both are the generic { officeId, resourceId, commandId, changes } result; a
  queued maker-checker command returns commandId with empty changes.
source:
  origin: rest
  endpoint: "POST /v1/{entity} (generic command result)"
fields:
  - name: officeId
    type: { optional: Long }
    required: false
  - name: resourceId
    type: { optional: Long }
    required: false
    description: Id of the created/affected resource.
  - name: resourceExternalId
    type: { optional: String }
    required: false
  - name: loanId
    type: { optional: Long }
    required: false
  - name: savingsId
    type: { optional: Long }
    required: false
  - name: commandId
    type: { optional: Long }
    required: false
    description: Maker-checker command id; present when queued for approval.
  - name: changes
    type: { optional: { map_of: { key: String, value: Json } } }
    required: false
    description: Field-level changes applied; empty when queued for approval.
used_by:
  - feature: m04-loan-portfolio
    kind: response
    api_id: loan_command
    role: single
    notes: Result of approve/disburse/repayment/reschedule/charge commands.
  - feature: m15-approvals-makerchecker
    kind: response
    api_id: approve_makerchecker
    role: single
    notes: Result of maker-checker approve/reject/delete commands.
  - feature: needs-attention-inbox
    kind: response
    api_id: retry_command
    role: single
    notes: Result of retrying a failed outbox command.
capabilities_used: [has_api, has_offline_cache]
tier: maximum
tags: [command, fineract, write, maker-checker, admin]
