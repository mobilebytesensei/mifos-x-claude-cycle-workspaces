name: HookDto
version: "1.0.0"
description: >
  Fineract webhook/hook (m16) — an outbound integration (Web / SMS bridge) bound to
  a template and a set of events, with its config and active state.
source:
  origin: rest
  endpoint: "GET /v1/hooks/{hookId}"
  list_endpoint: "GET /v1/hooks"
  table: m_hook
fields:
  - name: id
    type: Long
  - name: name
    type: String
  - name: displayName
    type: { optional: String }
    required: false
  - name: isActive
    type: Boolean
  - name: templateId
    type: { optional: Long }
    required: false
  - name: templateName
    type: { optional: String }
    required: false
  - name: events
    type: { optional: { list_of: Json } }
    required: false
    description: Entity/action event grants that fire the hook.
  - name: config
    type: { optional: { list_of: Json } }
    required: false
used_by:
  - feature: m16-communications
    kind: response
    api_id: get_hook
    role: single
    notes: Webhook/integration config editor.
capabilities_used: [has_api, has_offline_cache]
tier: minimal
tags: [communications, hook, webhook, fineract, admin]
