name: StandingInstructionRequest
version: "1.0.0"
description: >
  Standing-instruction body (m05) for POST /v1/standinginstructions — a scheduled
  recurring transfer between accounts. Queued to the outbox.
source:
  origin: rest
  endpoint: "POST /v1/standinginstructions"
fields:
  - name: fromClientId
    type: Long
  - name: fromAccountId
    type: Long
  - name: fromAccountType
    type: Int
  - name: toAccountId
    type: Long
  - name: toAccountType
    type: Int
  - name: transferType
    type: Int
    description: 1 = account transfer, 2 = loan repayment.
  - name: amount
    type: { optional: Double }
    required: false
  - name: instructionType
    type: Int
    description: 1 = fixed, 2 = dues.
  - name: priority
    type: Int
  - name: status
    type: Int
  - name: recurrenceType
    type: Int
  - name: recurrenceInterval
    type: { optional: Int }
    required: false
  - name: validFrom
    type: Date
  - name: validTill
    type: { optional: Date }
    required: false
  - name: dateFormat
    type: String
  - name: locale
    type: String
used_by:
  - feature: m05-savings-deposits-shares
    kind: request
    api_id: standing_instruction
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [savings, fineract, standing-instruction, request, admin]
