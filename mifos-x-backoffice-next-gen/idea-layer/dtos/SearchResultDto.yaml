name: SearchResultDto
version: "1.0.0"
description: >
  Global search hit from Fineract adhoc search (GET /v1/search?query=&resource=clients).
  Used by client-list to escalate beyond the local paged set. Bare-array response.
source:
  origin: rest
  endpoint: "GET /v1/search"
  list_endpoint: "GET /v1/search?query={q}&resource=clients"
  table: "(search view)"
fields:
  - name: entityId
    type: Long
    description: Matched entity primary key (clientId when resource=clients).
  - name: entityAccountNo
    type: { optional: String }
    required: false
    description: Account number of the matched entity.
  - name: entityName
    type: String
    pii: true
    description: Display name of the matched entity.
  - name: entityType
    type: String
    description: Entity type token (CLIENT, GROUP, LOAN, SAVINGS, ...).
  - name: entityExternalId
    type: { optional: String }
    required: false
  - name: parentId
    type: { optional: Long }
    required: false
    description: Owning office/parent id for scope filtering.
  - name: parentName
    type: { optional: String }
    required: false
used_by:
  - feature: client-list
    kind: response
    api_id: search_clients
    role: array_item
    notes: Global search escalation when the local paged client set is exhausted.
capabilities_used: [has_api, requires_auth]
tier: low
tags: [search, fineract, client, admin]
