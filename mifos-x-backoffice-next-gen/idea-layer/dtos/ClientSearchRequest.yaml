name: ClientSearchRequest
version: "1.0.0"
description: >
  Advanced client search body (m02) — the single /v2 op, used when
  office/staff/status/legalForm/underHierarchy filters combine beyond the GET
  list filters. Returns the same paged envelope of ClientListItem.
source:
  origin: rest
  endpoint: "POST /v2/clients/search"
fields:
  - name: text
    type: { optional: String }
    required: false
    description: Free-text name / externalId / accountNo query.
  - name: officeId
    type: { optional: Long }
    required: false
  - name: staffId
    type: { optional: Long }
    required: false
  - name: status
    type: { optional: String }
    required: false
    values: [pending, active, closed, rejected, withdrawn, transferInProgress]
  - name: legalForm
    type: { optional: String }
    required: false
  - name: underHierarchy
    type: { optional: String }
    required: false
    description: Office hierarchy path to scope the search subtree.
  - name: offset
    type: Int
    required: false
  - name: limit
    type: Int
    required: false
used_by:
  - feature: m02-clients
    kind: request
    api_id: search_clients_advanced
    role: body
capabilities_used: [has_api, has_form_input]
tier: minimal
tags: [client, fineract, search, request, admin]
