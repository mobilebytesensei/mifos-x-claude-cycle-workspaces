name: TemplateDto
version: "1.0.0"
description: >
  Fineract message/document template (m16) — a named, mustache-style template body
  with its entity/type mapping used to render SMS, email and document content.
source:
  origin: rest
  endpoint: "GET /v1/templates/{templateId}"
  list_endpoint: "GET /v1/templates"
  table: m_template
fields:
  - name: id
    type: Long
  - name: name
    type: String
  - name: entity
    type: { optional: String }
    required: false
    description: The mapped entity (client, loan…).
  - name: type
    type: { optional: String }
    required: false
    values: [document, sms, email]
  - name: text
    type: String
    description: The template body with mustache-style substitution tokens.
  - name: mappers
    type: { optional: { list_of: Json } }
    required: false
used_by:
  - feature: m16-communications
    kind: response
    api_id: get_template
    role: single
    notes: Message/document template editor.
capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [communications, template, fineract, admin]
