name: LoanCommandRequest
version: "1.0.0"
description: >
  Loan lifecycle-command body (m04) for POST /v1/loans/{id}?command=... —
  approve / disburse / undoApproval / reject / withdraw / writeoff / close /
  recoverGuarantees. Queued to the outbox; maker-checker aware.
source:
  origin: rest
  endpoint: "POST /v1/loans/{loanId}?command={command}"
fields:
  - name: command
    type: String
    values: [approve, undoApproval, reject, withdrawnByApplicant, disburse, disburseToSavings, close, writeoff, recoverGuarantees, assignLoanOfficer]
  - name: approvedOnDate
    type: { optional: Date }
    required: false
  - name: approvedLoanAmount
    type: { optional: Double }
    required: false
  - name: actualDisbursementDate
    type: { optional: Date }
    required: false
  - name: transactionAmount
    type: { optional: Double }
    required: false
  - name: writeoffReasonId
    type: { optional: Long }
    required: false
  - name: toLoanOfficerId
    type: { optional: Long }
    required: false
  - name: note
    type: { optional: String }
    required: false
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m04-loan-portfolio
    kind: request
    api_id: loan_command
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [loan, fineract, lifecycle, command, request, admin]
