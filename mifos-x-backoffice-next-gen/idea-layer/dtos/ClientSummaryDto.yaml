name: ClientSummaryDto
version: "1.0.0"
description: >
  Denormalized client row for the client-list screen (GET /v1/clients pageItems).
  List-optimized subset cached CACHE_FIRST_SWR so the office-scoped list renders
  offline. Distinct from the full ClientDto detail profile.
source:
  origin: rest
  endpoint: "GET /v1/clients"
  list_endpoint: "GET /v1/clients?officeId={officeId}&offset={offset}&limit={limit}"
  table: m_client
fields:
  - name: id
    type: Long
    description: Fineract client ID.
  - name: accountNo
    type: String
    description: Human-readable client account number.
  - name: displayName
    type: String
    pii: true
    description: Client full/display name.
  - name: status
    type: Json
    description: "Status object { id, code, value } — pending/active/closed/rejected/withdrawn."
  - name: officeId
    type: Long
  - name: officeName
    type: { optional: String }
    required: false
  - name: staffName
    type: { optional: String }
    required: false
    pii: true
    description: Assigned loan officer.
  - name: activationDate
    type: { optional: String }
    required: false
  - name: externalId
    type: { optional: String }
    required: false
used_by:
  - feature: client-list
    kind: response
    api_id: list_clients
    role: array_item
    notes: Office-scoped paged client list rows.
capabilities_used: [has_api, has_offline_cache, has_flow, requires_auth]
tier: medium
tags: [client, fineract, list, admin]
