name: ReportDefinitionDto
version: "1.0.0"
description: >
  Available report definition for the report-runner picker (GET /v1/reports).
  Category + type (Table/Pentaho/Chart) drive how the report is run and rendered.
  Cached CACHE_FIRST_SWR for the offline report catalog.
source:
  origin: rest
  endpoint: "GET /v1/reports"
  list_endpoint: "GET /v1/reports"
  table: stretchy_report
fields:
  - name: id
    type: Long
    description: Report definition ID.
  - name: reportName
    type: String
    description: Unique report name used as the run path segment.
  - name: reportType
    type: String
    description: "Table | Pentaho | Chart | SMS."
  - name: reportCategory
    type: { optional: String }
    required: false
    description: "Client | Loan | Savings | Fund | Accounting | ... category for grouping the picker."
  - name: reportSubType
    type: { optional: String }
    required: false
  - name: description
    type: { optional: String }
    required: false
  - name: coreReport
    type: Boolean
    description: True for built-in core reports (non-deletable).
  - name: useReport
    type: Boolean
    description: Whether the report is exposed for interactive running.
used_by:
  - feature: report-runner
    kind: response
    api_id: list_reports
    role: array_item
    notes: The report picker list, grouped by reportCategory.
capabilities_used: [has_api, has_offline_cache, requires_auth]
tier: medium
tags: [report, fineract, reference-data, admin]
