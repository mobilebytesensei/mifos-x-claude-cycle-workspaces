name: SavingsCommandRequest
version: "1.0.0"
description: >
  Savings lifecycle-command body (m05) for POST /v1/savingsaccounts/{id}?command=...
  — approve / activate / close / reject / withdraw / undoApproval. Queued to the
  outbox; maker-checker aware.
source:
  origin: rest
  endpoint: "POST /v1/savingsaccounts/{accountId}?command={command}"
fields:
  - name: command
    type: String
    values: [approve, undoApproval, reject, withdrawnByApplicant, activate, close, assignSavingsOfficer]
  - name: approvedOnDate
    type: { optional: Date }
    required: false
  - name: activatedOnDate
    type: { optional: Date }
    required: false
  - name: closedOnDate
    type: { optional: Date }
    required: false
  - name: withdrawBalance
    type: { optional: Boolean }
    required: false
  - name: note
    type: { optional: String }
    required: false
  - name: dateFormat
    type: { optional: String }
    required: false
  - name: locale
    type: { optional: String }
    required: false
used_by:
  - feature: m05-savings-deposits-shares
    kind: request
    api_id: savings_command
    role: body
capabilities_used: [has_api, has_form_input]
tier: medium
tags: [savings, fineract, lifecycle, command, request, admin]
