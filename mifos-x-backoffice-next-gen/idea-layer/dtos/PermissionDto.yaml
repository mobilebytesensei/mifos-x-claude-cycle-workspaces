name: PermissionDto
version: "1.0.0"
description: >
  A single permission code from the Fineract permission catalog (GET /v1/permissions).
  Supplies the human-readable grouping + entity/action metadata used to label the
  capability-map requirement tree and the permission-set editor rows.
source:
  origin: rest
  endpoint: "GET /v1/permissions"
  list_endpoint: "GET /v1/permissions"
  table: m_permission
fields:
  - name: grouping
    type: String
    description: Functional grouping (e.g. transaction_loan, portfolio, organisation, authorisation).
  - name: code
    type: String
    description: Canonical permission code (e.g. READ_LOAN, APPROVE_LOAN, CREATE_CLIENT).
  - name: entityName
    type: { optional: String }
    required: false
    description: Entity the permission acts on (LOAN, CLIENT, SAVINGSACCOUNT, ...).
  - name: actionName
    type: { optional: String }
    required: false
    description: Action verb (READ, CREATE, UPDATE, DELETE, APPROVE, ...).
  - name: selected
    type: { optional: Boolean }
    required: false
    description: Whether this permission is granted in the role/maker-checker context being viewed.
used_by:
  - feature: capability-map-detail
    kind: response
    api_id: get_permissions_catalog
    role: array_item
    notes: Labels each CapabilityMap module-requirement node with its permission group.
  - feature: permission-set-detail
    kind: response
    api_id: get_permissions_catalog
    role: array_item
    notes: Rows of the permission-set detail editor grouped by grouping.
capabilities_used: [has_api, has_offline_cache, requires_auth]
tier: medium
tags: [permission, fineract, authorisation, reference-data]
