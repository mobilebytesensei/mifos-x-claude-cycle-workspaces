name: RescheduleTemplateDto
version: "1.0.0"
description: >
  Loan reschedule template (m04) — reschedule reason options and allowed
  parameters that dynamic-template-forms renders the reschedule form FROM.
source:
  origin: rest
  endpoint: "GET /v1/rescheduleloans/template"
fields:
  - name: rescheduleReasons
    type: { list_of: Json }
    required: false
    description: Allowed reschedule reason code values.
  - name: rescheduleFromInstallmentOptions
    type: { list_of: Json }
    required: false
  - name: interestRateFrequencyTypeOptions
    type: { list_of: Json }
    required: false
used_by:
  - feature: m04-loan-portfolio
    kind: response
    api_id: get_reschedule_template
    role: single
    notes: Drives the reschedule form.
capabilities_used: [has_api, has_offline_cache, has_form_input]
tier: minimal
tags: [loan, fineract, reschedule, template, form, admin]
