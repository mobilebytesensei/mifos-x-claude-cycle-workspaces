name: SavingsAccountTemplateDto
version: "1.0.0"
description: >
  Savings account open/edit template (m05) — product options, interest
  compounding/posting periods, charge options — driving dynamic-template-forms
  for the savings create/edit form. Cached for offline.
source:
  origin: rest
  endpoint: "GET /v1/savingsaccounts/template"
fields:
  - name: productOptions
    type: { list_of: Json }
    required: false
  - name: interestCompoundingPeriodTypeOptions
    type: { list_of: Json }
    required: false
  - name: interestPostingPeriodTypeOptions
    type: { list_of: Json }
    required: false
  - name: interestCalculationTypeOptions
    type: { list_of: Json }
    required: false
  - name: lockinPeriodFrequencyTypeOptions
    type: { list_of: Json }
    required: false
  - name: chargeOptions
    type: { list_of: Json }
    required: false
  - name: fieldOfficerOptions
    type: { list_of: Json }
    required: false
used_by:
  - feature: m05-savings-deposits-shares
    kind: response
    api_id: get_savings_template
    role: single
    notes: Drives dynamic-template-forms for savings create/edit.
capabilities_used: [has_api, has_offline_cache, has_form_input]
tier: minimal
tags: [savings, fineract, template, form, admin]
