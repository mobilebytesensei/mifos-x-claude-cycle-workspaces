<!-- _shared/app-bar-detail.html
     Material 3 small top app bar partial — detail variant (back + title + overflow).
     Referenced by base archetype detail_screen. Title screen-sourced (data-shell-title).
     Token-native (var(--*) from injected :root — theme-aware). Byte-identical (RV-017). -->
<style>
  .bo-appbar-det {
    display: flex; align-items: center; gap: var(--sp-2, 8px);
    height: 56px; padding: 0 var(--sp-2, 8px);
    padding-top: env(safe-area-inset-top, 0px);
    background-color: var(--surface, #FCFCFF);
    color: var(--on-surface, #1A1C1E);
    border-bottom: var(--border-thin, 1px) solid var(--outline-variant, #C2C7CF);
    position: sticky; top: 0; z-index: 90; box-sizing: border-box; width: 100%;
  }
  .bo-appbar-det-btn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; min-width: 44px; border: none; background: transparent;
    color: var(--on-surface-variant, #42474E); cursor: pointer;
    border-radius: var(--r-full, 9999px); -webkit-tap-highlight-color: transparent;
  }
  .bo-appbar-det-btn:hover { background-color: color-mix(in srgb, var(--on-surface, #1A1C1E) 8%, transparent); }
  .bo-appbar-det-btn:focus-visible { outline: var(--border-focus, 2px) solid var(--primary, #0091EA); outline-offset: 2px; }
  .bo-appbar-det-btn svg { width: 24px; height: 24px; fill: currentColor; }
  .bo-appbar-det-title {
    flex: 1; min-width: 0; font-family: var(--font-display, 'Roboto', sans-serif);
    font-size: var(--fs-title-large, 22px); font-weight: var(--fw-medium, 500);
    line-height: 28px; color: var(--on-surface, #1A1C1E);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>

<header class="bo-appbar-det" data-shell="app-bar" role="banner">
  <button class="bo-appbar-det-btn" data-action="OnBackTapped" aria-label="Back">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <h1 class="bo-appbar-det-title" data-shell-title>Detail</h1>
  <button class="bo-appbar-det-btn" data-action="OnOverflowTapped" aria-label="More options">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
  </button>
</header>
