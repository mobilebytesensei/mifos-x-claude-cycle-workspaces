<!-- _shared/app-bar-default.html
     Material 3 small top app bar partial — list/signin variant (menu + title + search + filter).
     Referenced by base archetypes list_screen + signin_form. Title screen-sourced (data-shell-title).
     Token-native (var(--*) from injected :root — theme-aware). Byte-identical (RV-017). -->
<style>
  .bo-appbar-d {
    display: flex; align-items: center; gap: var(--sp-2, 8px);
    height: 56px; padding: 0 var(--sp-2, 8px);
    padding-top: env(safe-area-inset-top, 0px);
    background-color: var(--surface, #FCFCFF);
    color: var(--on-surface, #1A1C1E);
    border-bottom: var(--border-thin, 1px) solid var(--outline-variant, #C2C7CF);
    position: sticky; top: 0; z-index: 90; box-sizing: border-box; width: 100%;
  }
  .bo-appbar-d-btn {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; min-width: 44px; border: none; background: transparent;
    color: var(--on-surface-variant, #42474E); cursor: pointer;
    border-radius: var(--r-full, 9999px); -webkit-tap-highlight-color: transparent;
  }
  .bo-appbar-d-btn:hover { background-color: color-mix(in srgb, var(--on-surface, #1A1C1E) 8%, transparent); }
  .bo-appbar-d-btn:focus-visible { outline: var(--border-focus, 2px) solid var(--primary, #0091EA); outline-offset: 2px; }
  .bo-appbar-d-btn svg { width: 24px; height: 24px; fill: currentColor; }
  .bo-appbar-d-title {
    flex: 1; min-width: 0; font-family: var(--font-display, 'Roboto', sans-serif);
    font-size: var(--fs-title-large, 22px); font-weight: var(--fw-medium, 500);
    line-height: 28px; color: var(--on-surface, #1A1C1E);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>

<header class="bo-appbar-d" data-shell="app-bar" role="banner">
  <button class="bo-appbar-d-btn" data-action="OnMenuTapped" aria-label="Open navigation menu">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
  </button>
  <h1 class="bo-appbar-d-title" data-shell-title>Mifos Back Office</h1>
  <button class="bo-appbar-d-btn" data-action="OnSearchTapped" aria-label="Search">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </button>
  <button class="bo-appbar-d-btn" data-action="OnFilterTapped" aria-label="Filter">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
  </button>
</header>
