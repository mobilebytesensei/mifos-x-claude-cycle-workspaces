<!-- _shared/bottom-nav.html
     Material 3 adaptive bottom navigation partial — mifos-x-backoffice-next-gen.
     Items (per design-system/app-shell.yaml): Home | Clients | Collections | Sync
     Token-native (var(--*) from the screen's injected :root — theme-aware light/dark).
     selected: --primary  ·  unselected: --on-surface-variant  ·  indicator: --primary-container
     RULE-PROTO-RENDER-LLM-001: byte-identical across all consumers (RV-017).
     Active tab: add class "bo-nav-active" + aria-current="page" on the desired item;
     the preview runtime bridge manages state. Navigation via data-nav-to. -->
<style>
  .bo-bottom-nav {
    display: flex; align-items: center; justify-content: space-around;
    height: 72px; padding: 0 var(--sp-1, 4px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background-color: var(--surface, #FCFCFF);
    border-top: var(--border-thin, 1px) solid var(--outline-variant, #C2C7CF);
    position: sticky; bottom: 0; z-index: 100;
    box-sizing: border-box; width: 100%;
    box-shadow: var(--el-1, 0 1px 2px rgba(0,0,0,.05));
  }
  .bo-nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-decoration: none; color: inherit; flex: 1; gap: var(--sp-1, 4px);
    padding: var(--sp-2, 8px) var(--sp-1, 4px); min-height: 48px; cursor: pointer;
    position: relative; -webkit-tap-highlight-color: transparent; outline: none;
    border-radius: var(--r-sm, 8px);
  }
  .bo-nav-item:focus-visible { outline: var(--border-focus, 2px) solid var(--primary, #0091EA); outline-offset: 2px; }
  .bo-nav-indicator {
    position: absolute; top: 6px; width: 56px; height: 30px;
    background-color: var(--primary-container, #CBE6FF); border-radius: var(--r-full, 9999px); pointer-events: none;
  }
  .bo-nav-icon { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; }
  .bo-nav-label {
    font-family: var(--font-body, 'Roboto', sans-serif);
    font-size: var(--fs-label-medium, 12px); font-weight: var(--fw-medium, 500);
    line-height: 16px; letter-spacing: 0.5px; position: relative; z-index: 1; white-space: nowrap;
  }
  .bo-nav-item.bo-nav-active .bo-nav-icon svg { fill: var(--on-primary-container, #001E30); }
  .bo-nav-item.bo-nav-active .bo-nav-label { color: var(--primary, #0091EA); font-weight: var(--fw-bold, 700); }
  .bo-nav-item:not(.bo-nav-active) .bo-nav-indicator { display: none; }
  .bo-nav-item:not(.bo-nav-active) .bo-nav-icon svg { fill: var(--on-surface-variant, #42474E); }
  .bo-nav-item:not(.bo-nav-active) .bo-nav-label { color: var(--on-surface-variant, #42474E); }
</style>

<nav class="bo-bottom-nav" data-shell="bottom-nav" role="navigation" aria-label="Main navigation">

  <!-- Home -->
  <a class="bo-nav-item bo-nav-active" data-nav-item data-tab="home" data-nav-to="m01-dashboard"
     aria-label="Home, tab 1 of 4, selected" aria-current="page">
    <span class="bo-nav-indicator" aria-hidden="true"></span>
    <span class="bo-nav-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </span>
    <span class="bo-nav-label">Home</span>
  </a>

  <!-- Clients -->
  <a class="bo-nav-item" data-nav-item data-tab="clients" data-nav-to="m02-clients"
     aria-label="Clients, tab 2 of 4">
    <span class="bo-nav-indicator" aria-hidden="true"></span>
    <span class="bo-nav-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    </span>
    <span class="bo-nav-label">Clients</span>
  </a>

  <!-- Collections -->
  <a class="bo-nav-item" data-nav-item data-tab="collections" data-nav-to="m06-collections"
     aria-label="Collections, tab 3 of 4">
    <span class="bo-nav-indicator" aria-hidden="true"></span>
    <span class="bo-nav-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.5 3.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5zM19 19.09H5V4.91h14v14.18zM6 15h12v2H6zm0-4h12v2H6zm0-4h12v2H6z"/></svg>
    </span>
    <span class="bo-nav-label">Collections</span>
  </a>

  <!-- Sync -->
  <a class="bo-nav-item" data-nav-item data-tab="sync" data-nav-to="m17-sync-settings"
     aria-label="Sync, tab 4 of 4">
    <span class="bo-nav-indicator" aria-hidden="true"></span>
    <span class="bo-nav-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
    </span>
    <span class="bo-nav-label">Sync</span>
  </a>

</nav>
