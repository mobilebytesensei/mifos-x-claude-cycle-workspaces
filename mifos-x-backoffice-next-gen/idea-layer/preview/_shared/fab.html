<!-- _shared/fab.html
     Material 3 Floating Action Button partial — mifos-x-backoffice-next-gen.
     Teal secondary (create) action, bottom-end, above the bottom-nav. Token-native.
     Referenced by admin archetype master_detail (and any screen with a primary create action).
     Byte-identical across consumers (RV-017). Action label filled by compositor (data-shell-fab-label). -->
<style>
  .bo-fab {
    position: fixed; right: var(--sp-4, 16px); bottom: calc(72px + var(--sp-4, 16px) + env(safe-area-inset-bottom, 0px));
    display: inline-flex; align-items: center; gap: var(--sp-2, 8px);
    height: 56px; min-width: 56px; padding: 0 var(--sp-4, 16px);
    background-color: var(--secondary, #00796B); color: var(--on-secondary, #FFFFFF);
    border: none; border-radius: var(--r-lg, 16px);
    box-shadow: var(--el-2, 0 2px 6px rgba(0,0,0,.08));
    font-family: var(--font-body, 'Roboto', sans-serif); font-size: var(--fs-label-large, 14px);
    font-weight: var(--fw-medium, 500); letter-spacing: 0.1px; cursor: pointer; z-index: 95;
    -webkit-tap-highlight-color: transparent;
  }
  .bo-fab:hover { box-shadow: var(--el-3, 0 8px 24px rgba(0,0,0,.12)); filter: brightness(1.04); }
  .bo-fab:focus-visible { outline: var(--border-focus, 2px) solid var(--on-secondary, #FFFFFF); outline-offset: 2px; }
  .bo-fab svg { width: 24px; height: 24px; fill: currentColor; }
</style>

<button class="bo-fab" data-shell="fab" data-action="OnCreateTapped" aria-label="Create">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  <span data-shell-fab-label>New</span>
</button>
