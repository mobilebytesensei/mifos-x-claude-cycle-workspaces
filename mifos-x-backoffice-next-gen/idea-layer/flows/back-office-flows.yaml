# Back-office flow registry — declares the named cross-feature flows that per-screen
# flow.yaml#participates_in_flows[] entries reference, and that idea-layer/journeys/*.yaml
# link back to via flows[].flow_id. One flow name == one end-to-end officer workflow.
name: back-office-flows
description: "Named cross-feature workflows for the Mifos/Fineract back-office (offline-first, permission-gated)."

flows:
  - name: officer-login
    description: "Cold launch / session-restore through Fineract authentication into a bootstrapped, permission-scoped dashboard."
    journey: officer-authentication
    feature_refs: [fineract-auth-session, permission-capability-engine, m01-dashboard]

  - name: client-management
    description: "Browse the office-scoped client roster and drill into a client's 360 view (identity, accounts, lifecycle actions)."
    journey: client-management-360
    feature_refs: [m02-clients, client-list, client-detail-360]

  - name: loan-lifecycle
    description: "Originate a loan through the application wizard and service it from loan-detail (approve, disburse, repay)."
    journey: loan-lifecycle
    feature_refs: [client-detail-360, loan-application-wizard, m04-loan-portfolio, loan-detail]

  - name: field-collections
    description: "Run the staff-scoped daily collection sheet — capture amounts + attendance and save the batch, offline-first."
    journey: daily-collections
    feature_refs: [m06-collections, collection-sheet]

  - name: maker-checker
    description: "Review the self-scoped four-eyes approval queue and enqueue approve/reject/delete decisions."
    journey: maker-checker-approvals
    feature_refs: [m15-approvals-makerchecker, checker-inbox]

  - name: permissions-admin
    description: "Audit effective access — inspect the resolved PermissionSet and the active CapabilityMap metadata."
    journey: permissions-administration
    feature_refs: [m10-users-roles-permissions, permission-capability-engine, permission-set-detail, capability-map-detail]

  - name: product-config
    description: "Author or edit a financial product (terms, interest, accounting, charges) from the product template."
    journey: product-configuration
    feature_refs: [m08-products-charges, product-editor]

  - name: report-generation
    description: "Select a report, set parameters, run it and review/export the tabular result."
    journey: report-generation
    feature_refs: [m14-reports-search-audit, report-runner]
