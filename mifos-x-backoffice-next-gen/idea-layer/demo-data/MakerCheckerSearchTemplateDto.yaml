dto: MakerCheckerSearchTemplateDto
# Consumed by: m15-approvals-makerchecker (makerchecker_search_template)
# GET /v1/makercheckers/searchtemplate — filter option lists for the checker queue.
items:
  - actionNames:
      - "CREATE"
      - "UPDATE"
      - "DELETE"
      - "APPROVE"
      - "DISBURSE"
      - "REPAYMENT"
      - "ACTIVATE"
      - "CLOSE"
      - "REJECT"
      - "WITHDRAW"
    entityNames:
      - "CLIENT"
      - "LOAN"
      - "SAVINGSACCOUNT"
      - "FIXEDDEPOSITACCOUNT"
      - "RECURRINGDEPOSITACCOUNT"
      - "SHAREACCOUNT"
      - "GROUP"
      - "CENTER"
      - "JOURNALENTRY"
      - "OFFICE"
      - "STAFF"
      - "ROLE"
    makerCheckerable: true
    dateFormat: "dd MMMM yyyy"
    locale: "en"
