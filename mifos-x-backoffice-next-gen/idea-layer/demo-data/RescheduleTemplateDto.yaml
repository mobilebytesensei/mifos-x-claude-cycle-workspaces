dto: RescheduleTemplateDto
# Consumed by: m04-loan-portfolio (get_reschedule_template)
# GET /v1/rescheduleloans/template — reschedule reasons + allowed adjustments.
items:
  - rescheduleReasonOptions:
      - id: 1
        name: "Client request"
      - id: 2
        name: "Business cash flow problem"
      - id: 3
        name: "Natural disaster"
      - id: 4
        name: "Medical emergency"
      - id: 5
        name: "Court order"
    dateFormat: "dd MMMM yyyy"
    locale: "en"
    adjustments:
      extendRepaymentPeriod: true
      newInterestRate: true
      adjustGracePeriods: true
      rescheduleFromInstallmentDate: true
