dto: HookDto
# Consumed by: m16-communications (list_hooks)
# GET /v1/hooks — registered outbound webhooks.
items:
  - id: 3
    name: "Web"
    displayName: "Core-banking event relay"
    isActive: true
    templateName: "Web"
    events:
      - id: 1
        grouping: "loan"
        entityName: "LOAN"
        actionName: "DISBURSE"
      - id: 2
        grouping: "savings"
        entityName: "SAVINGSACCOUNT"
        actionName: "DEPOSIT"
      - id: 3
        grouping: "loan"
        entityName: "LOAN"
        actionName: "REPAYMENT"
    config:
      - fieldName: "Payload URL"
        fieldValue: "https://ops.example.org/fineract/webhook"
      - fieldName: "Content Type"
        fieldValue: "json"

  - id: 5
    name: "SMS bridge"
    displayName: "Nexmo SMS delivery hook"
    isActive: true
    templateName: "SMS"
    events:
      - id: 4
        grouping: "client"
        entityName: "CLIENT"
        actionName: "ACTIVATE"
      - id: 5
        grouping: "loan"
        entityName: "LOAN"
        actionName: "REPAYMENT"
    config:
      - fieldName: "Payload URL"
        fieldValue: "https://sms.example.org/notify"
      - fieldName: "Content Type"
        fieldValue: "json"
