dto: LoanProductTemplateDto
# Consumed by: product-editor (get_product_template)
# GET /v1/loanproducts/template — allowed-value lists for the product create/edit form.
items:
  - currencyOptions:
      - code: "KES"
        name: "Kenyan Shilling"
        displaySymbol: "KSh"
      - code: "USD"
        name: "US Dollar"
        displaySymbol: "$"
      - code: "EUR"
        name: "Euro"
        displaySymbol: "€"
    repaymentFrequencyTypeOptions:
      - id: 1
        value: "Weeks"
      - id: 2
        value: "Months"
      - id: 3
        value: "Years"
    interestTypeOptions:
      - id: 0
        value: "Declining Balance"
      - id: 1
        value: "Flat"
    amortizationTypeOptions:
      - id: 0
        value: "Equal principal payments"
      - id: 1
        value: "Equal installments"
    interestCalculationPeriodTypeOptions:
      - id: 0
        value: "Daily"
      - id: 1
        value: "Same as repayment period"
    accountingRuleOptions:
      - id: 1
        value: "None"
      - id: 2
        value: "Cash"
      - id: 3
        value: "Accrual (periodic)"
      - id: 4
        value: "Accrual (upfront)"
    chargeOptions:
      - id: 12
        name: "Processing Fee"
        currency: { code: "KES" }
      - id: 15
        name: "Late Payment Penalty"
        currency: { code: "KES" }
      - id: 20
        name: "Annual Maintenance Fee"
        currency: { code: "KES" }
    fundOptions:
      - id: 1
        name: "KIVA Fund"
      - id: 2
        name: "Organization Fund"
    paymentTypeOptions:
      - id: 1
        name: "Cash"
      - id: 2
        name: "Bank Transfer"
      - id: 3
        name: "Mobile Money"
    delinquencyBucketOptions:
      - id: 1
        name: "Standard aging 30/60/90"
      - id: 2
        name: "PAR 7/30/60/90/180"
    floatingRateOptions:
      - id: 1
        name: "CBK Base Rate"
        isBaseLendingRate: true
