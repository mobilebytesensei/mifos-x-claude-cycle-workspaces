feature: passcode-lock
entry_points:
  - type: auth_gate
    source: fineract-auth-session
    description: "Cold start with a valid persisted session + passcode_enabled = true → show lock screen before the app shell."
  - type: background_timeout
    description: "App returns to foreground after >15s in background with passcode_enabled = true → show lock screen."
  - type: settings_setup
    source: m17-sync-settings
    component_id: biometric_lock_toggle
    description: "User enables passcode from M17 settings — opens in setup mode (set new PIN)."

transitions:
  # ── setup flow ──
  - from: setup
    to: confirm
    trigger: "6 digits entered (first entry complete)"
  - from: confirm
    to: locked
    trigger: "6 digits entered + PINs match → passcode_hash persisted; passcode_enabled = true; route to app shell"
  - from: confirm
    to: error
    trigger: "6 digits entered + PINs don't match → shake animation + error label"
  - from: error
    to: setup
    trigger: "auto-reset after 1.5s → restart setup from entry (dots cleared)"

  # ── lock screen flow ──
  - from: locked
    to: locked
    trigger: "digit tapped → dot indicator updates"
  - from: locked
    to: locked_biometric
    trigger: "biometric_button tapped → BiometricPrompt shown"
  - from: locked_biometric
    to: locked
    trigger: "biometric prompt dismissed or failed → return to PIN entry"
  - from: locked_biometric
    to: locked
    trigger: "biometric success → emit UnlockSuccess → app shell (assembled state)"
  - from: locked
    to: error
    trigger: "6 digits entered + hash mismatch → shake + error; increment failed_attempts"
  - from: error
    to: locked
    trigger: "auto-reset after 1.5s → dots cleared; if failed_attempts >= 5 → locked_out"
  - from: locked
    to: locked_out
    trigger: "failed_attempts >= 5 → PIN pad disabled; lockout timer started"
  - from: locked_out
    to: locked
    trigger: "lockout countdown reaches zero → PIN entry re-enabled; failed_attempts reset"

  # ── background / foreground lifecycle ──
  - from: locked
    to: locked
    trigger: "app returns to foreground within 15s → lock screen dismissed automatically (timer not expired)"
