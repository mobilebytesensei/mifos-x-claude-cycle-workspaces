feature: passcode-lock

# All 6 ui.yaml states covered: setup, confirm, locked, locked_biometric, locked_out, error.
# No server data — all values from the device encrypted_prefs store.

items:
  # ── locked — Active session (normal unlock flow) ──────────────────────────────
  - id: "active_session"
    state: locked
    user_name: "Ana García"
    office_name: "Oficina Central"
    passcode_enabled: true
    passcode_hash: "$2a$12$XkP8FQzKrT1vN9mLqYbO4u7Hwj3RsD6pVcE5aM8kNzIoFgJ2wB0Cy"
    biometric_lock_enabled: false
    background_lock_timeout_secs: 15
    failed_attempts: 0
    locked_until: null
    dots_filled: 0
    note: "Default locked state on foreground resume after >15s in background. PIN pad active."

  # ── setup — First-time PIN setup from M17 settings ───────────────────────────
  - id: "setup_state"
    state: setup
    user_name: "Carlos López"
    office_name: "Branch Norte"
    passcode_enabled: false
    passcode_hash: null
    biometric_lock_enabled: false
    failed_attempts: 0
    locked_until: null
    header_text: "Set your passcode"
    dots_filled: 0
    note: "Freshly enabled from M17 settings — first-time setup mode. User entering initial PIN."

  # ── setup with digits entered ─────────────────────────────────────────────────
  - id: "setup_entering"
    state: setup
    user_name: "Carlos López"
    office_name: "Branch Norte"
    passcode_enabled: false
    dots_filled: 4
    current_digits_count: 4
    header_text: "Set your passcode"
    note: "4 of 6 digits entered — 4 dots filled, 2 empty. Auto-submits at 6."

  # ── confirm — Re-enter PIN step (setup flow) ──────────────────────────────────
  - id: "confirm_state"
    state: confirm
    user_name: "Carlos López"
    office_name: "Branch Norte"
    passcode_enabled: false
    dots_filled: 0
    header_text: "Confirm your passcode"
    note: "First PIN entry accepted. User must re-enter the same 6 digits to confirm."

  # ── locked_biometric — Biometric enrolled, fingerprint prompt active ───────────
  - id: "biometric_enrolled"
    state: locked_biometric
    user_name: "Ana García"
    office_name: "Oficina Central"
    passcode_enabled: true
    biometric_lock_enabled: true
    biometric_type: "fingerprint"
    failed_attempts: 0
    locked_until: null
    note: "Lock screen shows fingerprint icon. Tapping it shows the platform BiometricPrompt OS dialog. PIN entry remains available as fallback."

  # ── locked_out — 5 consecutive wrong PINs ────────────────────────────────────
  - id: "lockout_state"
    state: locked_out
    user_name: "Ana García"
    office_name: "Oficina Central"
    passcode_enabled: true
    failed_attempts: 5
    locked_until: "2026-08-01T10:35:00Z"
    lockout_remaining_display: "Try again in 1 min 42 sec"
    note: "First lockout tier — 30s backoff. PIN pad disabled; countdown chip shown. After expiry, returns to locked state."

  # ── error — Wrong PIN (shake animation, dots reset) ──────────────────────────
  - id: "error_wrong_pin"
    state: error
    user_name: "Ana García"
    office_name: "Oficina Central"
    passcode_enabled: true
    failed_attempts: 2
    locked_until: null
    error_label: "Incorrect PIN · 3 attempts remaining"
    dots_filled: 0
    note: "Wrong PIN entered — dot row shake animation, error label shown, dots reset. Next wrong attempt: failed_attempts=3."

  # ── error — PIN mismatch in setup/confirm flow ────────────────────────────────
  - id: "error_pin_mismatch"
    state: error
    user_name: "Carlos López"
    office_name: "Branch Norte"
    passcode_enabled: false
    failed_attempts: 0
    locked_until: null
    error_label: "PINs don't match — please try again"
    dots_filled: 0
    note: "CONFIRM mode: entered PIN didn't match the first entry. Dots shake; both entries cleared. Returns to setup state for re-entry."
