feature: passcode-lock
status: designed
scaffolded_at: '2026-08-01T00:00:00Z'
scaffolded_by: /idea-plan-add
schema_version: v2
cluster: foundation
module: foundation
priority: must_have
is_primary_flow: false
has_ui: true
has_api: false
has_server: false
capabilities:
  - has_ui
  - has_flow
  - has_local_preferences
  - has_system_integration
  - requires_auth
requires_features:
  - fineract-auth-session
provides_to:
  - biometric-setup
  - fineract-auth-session
permissions_gate: >-
  Post-login only — the passcode lock is a device-local security layer; it has no server permission gate. Every
  authenticated user can set a passcode. The lock is enforced after 15s of backgrounding the app (field-officer app
  pattern — ADOPT).
contracts:
  apis: []
  tables:
    - name: secure_prefs
      backend: multiplatform_settings_encrypted
      keys:
        - passcode_hash
        - passcode_enabled
        - lock_on_background
        - background_lock_timeout_secs
        - failed_attempts
        - locked_until
      note: >-
        All passcode state in the encrypted multiplatform-settings key store. Passcode is stored as bcrypt hash (never
        plaintext).
  dtos:
    - name: PasscodeState
      role: model
      note: enabled, failedAttempts, lockedUntil, timeout — used to render the lock screen state.
libraries:
  core_modules:
    - core/datastore
  external:
    - com.russhwolf.settings.Settings (encrypted variant)
    - kotlinx.coroutines (background-timeout timer)
vm_actions:
  - action: OnDigitTap
    maps_to_on_click: enter_digit
    handler: Append digit to the in-progress PIN entry (max 6 digits). After 6 digits auto-submit.
  - action: OnDeleteTap
    maps_to_on_click: delete_last_digit
    handler: Remove the last entered digit from the in-progress PIN.
  - action: OnPINConfirm
    maps_to_on_click: confirm_pin
    handler: >-
      During setup: validate PIN confirmation matches; hash and persist to encrypted store. During unlock: hash the
      entered PIN and compare with passcode_hash.
  - action: OnBiometricPrompt
    maps_to_on_click: trigger_biometric
    handler: Show platform biometric prompt (if biometric_lock_enabled = true). On success, unlock and route to the app.
  - action: Internal.OnBackgroundTimeout
    handler: After 15s of app backgrounding, flip lock state to locked; the next foreground shows the lock screen.
  - action: Internal.OnFailedAttempt
    handler: >-
      Increment failed_attempts; after 5 failed attempts, lock the passcode entry for an exponentially increasing
      duration (30s → 2min → 10min); show countdown chip.
error_cases:
  - code: pin_mismatch
    ux: 'During setup: ''PINs don''t match — please re-enter the PIN.'' Clears both entries.'
  - code: wrong_pin
    ux: 'During unlock: ''Incorrect PIN'' chip + remaining attempts count.'
  - code: locked_out
    ux: >-
      Entry disabled for the lockout duration. Countdown chip: 'Try again in {duration}'. After lockout: re-enable PIN
      entry. After max lockouts: session cleared, route to login.
test_fixtures:
  - open setup → enter 6-digit PIN → confirm same PIN → passcode_hash stored; passcode_enabled = true
  - app backgrounds for >15s → foreground shows lock screen; enter correct PIN → unlocked
  - enter wrong PIN 5 times → lockout dialog; try again after lockout expires → PIN entry re-enabled
  - biometric lock enabled + biometric enrolled → lock screen shows biometric prompt; successful biometric → unlocked
acceptance_refs:
  - plan: idea-plan.yaml#features (to be added)
  - evolve: evolve-plans/20260801-role-based-app-assembly.md §4.5 completeness gate capability 18
summary: >-
  Local numeric passcode app-lock: a 6-digit (configurable) PIN set on first use and re-enforced after 15s in the
  background (field-officer app pattern). Lock screen shows the PIN pad + optional biometric prompt (if biometric-setup
  has enrolled). Failed attempts trigger exponential lockout; max lockouts clear the session and route to login.
  Passcode state stored encrypted; no server call.
plan_ref: idea-plan.yaml#features[passcode-lock]
