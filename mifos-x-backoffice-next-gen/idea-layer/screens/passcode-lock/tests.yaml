schema_version: v1.0.0
feature: passcode-lock
scenarios:
  - id: setup_pin_success
    preconditions: ["passcode_enabled = false", "user enables passcode from M17 settings"]
    actions: ["enter 6-digit PIN", "confirm same PIN"]
    assertions: ["passcode_hash stored in encrypted prefs", "passcode_enabled = true", "setup complete — routes to app shell"]
    priority: high

  - id: setup_pin_mismatch
    preconditions: ["passcode_enabled = false"]
    actions: ["enter 6-digit PIN", "confirm a DIFFERENT PIN"]
    assertions: ["shake animation on dots", "'PINs don't match' error shown", "dots reset to empty", "setup restarts from entry"]
    priority: high

  - id: background_lock_after_15s
    preconditions: ["passcode_enabled = true", "app authenticated and in foreground"]
    actions: ["background the app for 20s", "return to foreground"]
    assertions: ["lock screen shown before any module content", "PIN pad ready for entry"]
    priority: high

  - id: correct_pin_unlocks
    preconditions: ["passcode_enabled = true", "app locked"]
    actions: ["enter the correct 6-digit PIN"]
    assertions: ["app shell rendered (assembled state)", "failed_attempts reset to 0"]
    priority: high

  - id: wrong_pin_increments_counter
    preconditions: ["passcode_enabled = true", "app locked", "failed_attempts = 0"]
    actions: ["enter wrong PIN 3 times"]
    assertions: ["shake + 'Incorrect PIN · 2 attempts remaining' after each failure", "failed_attempts = 3"]
    priority: high

  - id: lockout_after_5_failures
    preconditions: ["failed_attempts = 4"]
    actions: ["enter wrong PIN one more time"]
    assertions: ["locked_out state", "PIN pad disabled", "countdown chip shows lockout duration", "failed_attempts = 5"]
    priority: high

  - id: biometric_unlocks_app
    preconditions: ["biometric_lock_enabled = true", "biometric enrolled", "app locked"]
    actions: ["tap biometric icon", "authenticate with fingerprint/face"]
    assertions: ["platform BiometricPrompt shown", "on success: app shell rendered", "failed_attempts not affected"]
    priority: medium

  - id: passcode_survives_cold_start
    preconditions: ["passcode enabled and set"]
    actions: ["kill the app process", "relaunch"]
    assertions: ["lock screen shown (not the app shell)", "correct PIN unlocks as expected"]
    priority: high
