feature: passcode-lock
# Passcode lock is entirely device-local — no server API calls.
# All state (PIN hash, enabled flag, failed attempts, lockout) is stored in
# the encrypted multiplatform-settings key store (never in plaintext).
endpoints: []
notes:
  - "PIN is hashed (bcrypt) before storage; the plaintext PIN never touches the network or disk."
  - "Biometric authentication uses the platform-native BiometricPrompt API (Android BiometricManager / iOS LocalAuthentication) — no Fineract API call."
