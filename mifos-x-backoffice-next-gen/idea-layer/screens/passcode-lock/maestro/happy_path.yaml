appId: org.mifos.backoffice
---
# Passcode Lock — setup happy path: open from the M17 "App passcode" security setting, set a
# 6-digit PIN (enter, then confirm the same PIN), and verify setup completes + returns to settings.
# The lock-on-cold-start + unlock/lockout paths are covered by the 13/13 commonTest suite.
- launchApp
- assertVisible:
    id: "nav-shell-assembler_host"
# Open the nav drawer, scroll to M17 settings, open the App-passcode setup.
- tapOn:
    id: "MenuTab"
- scrollUntilVisible:
    element:
      id: "nav-shell-assembler_root_m17-sync-settings"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "nav-shell-assembler_root_m17-sync-settings"
- assertVisible:
    id: "m17-sync-settings_passcode"
- tapOn:
    id: "m17-sync-settings_passcode"
# Passcode setup screen (SETUP stage — no passcode set yet).
- assertVisible:
    id: "passcode-lock_header"
- assertVisible:
    id: "passcode-lock_keypad"
# Enter the 6-digit PIN 1-2-3-4-5-6 — auto-advances to the confirm stage at 6 digits.
- tapOn: { id: "passcode-lock_key_1" }
- tapOn: { id: "passcode-lock_key_2" }
- tapOn: { id: "passcode-lock_key_3" }
- tapOn: { id: "passcode-lock_key_4" }
- tapOn: { id: "passcode-lock_key_5" }
- tapOn: { id: "passcode-lock_key_6" }
# Wait for the auto-advance to the confirm stage (syncs before entering the confirm digits — a
# rapid re-entry can otherwise race the setup->confirm transition and desync the digit boundary).
- assertVisible:
    text: "Confirm your passcode"
# Confirm the same PIN.
- tapOn: { id: "passcode-lock_key_1" }
- tapOn: { id: "passcode-lock_key_2" }
- tapOn: { id: "passcode-lock_key_3" }
- tapOn: { id: "passcode-lock_key_4" }
- tapOn: { id: "passcode-lock_key_5" }
- tapOn: { id: "passcode-lock_key_6" }
# Setup complete → returns to M17 settings.
- assertVisible:
    id: "m17-sync-settings_passcode"
