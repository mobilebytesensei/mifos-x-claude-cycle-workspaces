appId: org.mifos.backoffice
---
# Passcode Lock — happy path: app locked (passcode_enabled = true),
# enter the correct PIN, verify the app shell is unlocked.
- launchApp
- assertVisible:
    id: "passcode-lock_header"
- assertVisible:
    id: "passcode-lock_dots"
- assertVisible:
    id: "passcode-lock_keypad"
# Enter correct 6-digit PIN: 1-2-3-4-5-6 (test PIN)
- tapOn:
    text: "1"
- tapOn:
    text: "2"
- tapOn:
    text: "3"
- tapOn:
    text: "4"
- tapOn:
    text: "5"
- tapOn:
    text: "6"
# After correct PIN, app shell should be visible
- assertVisible:
    id: "nav-shell-assembler_host"
- assertNotVisible:
    id: "passcode-lock_header"
