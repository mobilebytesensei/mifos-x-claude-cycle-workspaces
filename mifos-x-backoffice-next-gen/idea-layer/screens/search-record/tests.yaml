schema_version: v1.0.0
feature: search-record
scenarios:
  - id: history_list_loads_offline
    preconditions: ["field officer has 6 recent searches in Room", "device offline"]
    actions: ["open search-record"]
    assertions: ["content state rendered", "6 rows shown sorted by searched_at DESC", "no network call made"]
    priority: high

  - id: tap_client_row_navigates_to_360
    preconditions: ["content state with client rows"]
    actions: ["tap a Client row"]
    assertions: ["navigates to client-detail-360 for that clientId", "search record remains in backstack"]
    priority: high

  - id: tap_loan_row_navigates_to_detail
    preconditions: ["content state with loan row"]
    actions: ["tap a Loan row"]
    assertions: ["navigates to loan-detail for that loanId"]
    priority: high

  - id: delete_single_row
    preconditions: ["content state with ≥2 rows"]
    actions: ["tap delete icon on the first row"]
    assertions: ["row removed from list immediately (Room Flow re-emits)", "undo snackbar shown for 3s", "remaining rows intact"]
    priority: medium

  - id: clear_all_history
    preconditions: ["content state with rows"]
    actions: ["tap 'Clear all recent searches'", "confirm in dialog"]
    assertions: ["confirm dialog shown", "on confirm: all rows deleted from Room", "empty state rendered"]
    priority: medium

  - id: empty_state_on_first_use
    preconditions: ["fresh session with no search history in Room"]
    actions: ["open search-record"]
    assertions: ["empty state shown", "'No recent searches yet' message and illustration"]
    priority: high

  - id: re_run_search_prefills_m14
    preconditions: ["content state with a row query_text = 'maria perez'"]
    actions: ["tap the query text chip on the 'María Pérez González' row"]
    assertions: ["navigates to m14-reports-search-audit", "search field pre-filled with 'maria perez'", "live search triggered"]
    priority: medium

  # ── State coverage — loading and error ───────────────────────────────
  - id: loading_state_shows_shimmer
    description: "While the Room search_history Flow emits its first value, the loading state renders a shimmer placeholder — not a blank list."
    preconditions: ["fresh app launch; Room read in progress (first emission not yet received)"]
    actions: ["open search-record"]
    assertions:
      - "loading state shown: shimmer placeholder rows visible"
      - "search-record_content is NOT yet rendered"
      - "transitions to content or empty once Room emits"
    priority: low

  - id: error_state_retry_room_failure
    description: "When Room read fails (corrupted DB, disk-full), the error state is shown with a Retry that re-reads the Flow."
    preconditions: ["Room search_history read fails (simulated I/O error)"]
    actions: ["open search-record", "tap Retry"]
    assertions:
      - "error state shown: error banner with a Retry CTA"
      - "search-record_content NOT rendered"
      - "Retry transitions back to loading state and re-reads Room search_history"
    priority: medium

  - id: navigate_to_group_and_center_from_history
    description: "Tapping a Group or Center history row navigates to m03-groups-centers — confirming all four entity_type chips route correctly."
    preconditions: ["content state with a Group row (entity_type=group) and a Center row (entity_type=center)"]
    actions: ["tap the Group row", "return", "tap the Center row"]
    assertions:
      - "Group row tap navigates to m03-groups-centers for that groupId"
      - "Center row tap navigates to m03-groups-centers for that centerId"
      - "entity type chips render correctly: orange for Group, green for Center"
      - "search-record remains in the backstack on return"
    priority: medium

  # ── §4.7 permission gating ────────────────────────────────────────────
  - id: open_result_grayed_out_without_read_client
    description: "A user lacking READ_CLIENT sees history rows rendered but the open_search_result and re_run_search actions grayed-out; tapping shows an info dialog — rows are not absent."
    preconditions: ["user lacks READ_CLIENT", "content state with ≥1 Client row"]
    actions: ["observe a Client history row", "tap the row", "tap the re-run chip on the same row"]
    assertions:
      - "history rows are visible (they are a local Room read, not permission-gated for display)"
      - "tapping the row (open_search_result) shows an info dialog: 'You need READ_CLIENT to view this record — contact your manager'"
      - "tapping the re-run chip shows the same info dialog (denied_behavior: gray-out-info-dialog)"
      - "no navigation to client-detail-360 occurs"
    priority: high

  - id: all_functions_enables_open_result
    description: "A user with ALL_FUNCTIONS has READ_CLIENT and can tap any history row to navigate to the entity detail without restriction."
    preconditions: ["Super user signed in (ALL_FUNCTIONS)", "content state with a Client row and a Loan row"]
    actions: ["tap the Client row", "return", "tap the Loan row"]
    assertions:
      - "Client row tap navigates to client-detail-360 without an info dialog"
      - "Loan row tap navigates to loan-detail without an info dialog"
      - "delete and clear_all actions are also fully enabled"
    priority: medium
