schema_version: v1.0.0
feature: search-record
scenarios:
  - id: history_list_loads_offline
    preconditions: ["field officer has 6 recent searches in Room", "device offline"]
    actions: ["open search-record"]
    assertions: ["content state rendered", "6 rows shown sorted by searched_at DESC", "no network call made"]
    priority: high

  - id: tap_client_row_navigates_to_360
    preconditions: ["content state with client rows"]
    actions: ["tap a Client row"]
    assertions: ["navigates to client-detail-360 for that clientId", "search record remains in backstack"]
    priority: high

  - id: tap_loan_row_navigates_to_detail
    preconditions: ["content state with loan row"]
    actions: ["tap a Loan row"]
    assertions: ["navigates to loan-detail for that loanId"]
    priority: high

  - id: delete_single_row
    preconditions: ["content state with ≥2 rows"]
    actions: ["tap delete icon on the first row"]
    assertions: ["row removed from list immediately (Room Flow re-emits)", "undo snackbar shown for 3s", "remaining rows intact"]
    priority: medium

  - id: clear_all_history
    preconditions: ["content state with rows"]
    actions: ["tap 'Clear all recent searches'", "confirm in dialog"]
    assertions: ["confirm dialog shown", "on confirm: all rows deleted from Room", "empty state rendered"]
    priority: medium

  - id: empty_state_on_first_use
    preconditions: ["fresh session with no search history in Room"]
    actions: ["open search-record"]
    assertions: ["empty state shown", "'No recent searches yet' message and illustration"]
    priority: high

  - id: re_run_search_prefills_m14
    preconditions: ["content state with a row query_text = 'maria perez'"]
    actions: ["tap the query text chip on the 'María Pérez González' row"]
    assertions: ["navigates to m14-reports-search-audit", "search field pre-filled with 'maria perez'", "live search triggered"]
    priority: medium
