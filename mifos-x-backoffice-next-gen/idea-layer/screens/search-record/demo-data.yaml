# ── Undo-delete window (pendingDeleteId active) ────────────────────────────────
  - id: "sr-undo-window"
    state: content
    pending_delete_id: "sr-001"
    undo_snackbar: "Search removed. Undo"
    undo_window_remaining_ms: 2100
    note: "sr-001 ('Aisha Bello') was deleted — the snackbar countdown is at 2.1s. Tapping Undo re-inserts the row with its original searched_at."

# ── loading — Shimmer placeholder on mount ─────────────────────────────────────
state_reference:
  loading:
    description: "Room query in flight — shimmer placeholder shows 5 gray rows of varying widths while search_history Flow emits."
    shimmer_row_count: 5
    duration_ms_typical: 40

  # ── empty — No search history yet ───────────────────────────────────────────
  empty:
    description: "search_history table is empty — either first use, or user just cleared all."
    headline: "No recent searches yet"
    body: "Clients, loans, groups, and centers you search for will appear here for quick offline access."
    history_enabled: true

  empty_history_off:
    description: "search_history_enabled=false — user disabled history in settings."
    headline: "Search history is off"
    body: "Turn on search history in Settings to see your recent client, loan, group, and center searches here."
    history_enabled: false

  # ── error — Room read failed ────────────────────────────────────────────────
  error:
    description: "Flow<List<SearchHistoryRow>> emission failed — Room database corruption or storage unavailable."
    error_code: "history_read_failed"
    error_message: "Could not load your recent searches. Tap Retry."
    retry_available: true
    note: "Retry re-collects the Flow from Room. Data is not lost on a transient read failure."
