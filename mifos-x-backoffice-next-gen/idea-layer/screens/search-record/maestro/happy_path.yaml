appId: org.mifos.backoffice
---
# Search Record — happy path: open history, verify rows, tap a client row,
# navigate to client-detail-360, return, delete a row.
- launchApp
- assertVisible:
    id: "nav-shell-assembler_host"
# Open the nav drawer, scroll to M14 root, then navigate (search-record is a tab within M14).
- tapOn:
    id: "MenuTab"
- scrollUntilVisible:
    element:
      id: "nav-shell-assembler_root_m14-reports-search-audit"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "nav-shell-assembler_root_m14-reports-search-audit"
- assertVisible:
    id: "m14-reports-search-audit_header"
# Open the Search Record history screen from M14
- tapOn:
    id: "m14-reports-search-audit_search_record_tab"
- assertVisible:
    id: "search-record_header"
- assertVisible:
    id: "search-record_content"
# At least one row visible
- assertVisible:
    id: "search-record_item"
# Tap first item (client)
- tapOn:
    id: "search-record_item"
# Client detail should open
- assertVisible:
    id: "client-detail-360_header"
- back
# Back in search-record
- assertVisible:
    id: "search-record_content"
# Delete a row
- assertVisible:
    id: "search-record_delete_item"
- tapOn:
    id: "search-record_delete_item"
# Row removed; undo snackbar shown (optional check)
- assertVisible:
    id: "search-record_content"
