appId: org.mifos.backoffice
---
# Search Record — reachable + render device-verify. Opens the offline recent-search history from
# its nav-drawer entry ("Recent searches"). On a fresh device the ring buffer is empty (rows are
# inserted by the live search screens — client-list / M14 / loan-detail — on result-select), so this
# flow verifies the drawer entry + screen render + the empty state. The populated list / row-delete
# path needs seeded history (perform a search + select a result first) and is covered by the
# 10/10 commonTest instead.
- launchApp
- assertVisible:
    id: "nav-shell-assembler_host"
# Open the nav drawer, scroll the "Recent searches" root into view, then open Search Record.
- tapOn:
    id: "MenuTab"
- scrollUntilVisible:
    element:
      id: "DrawerItem_SearchRecord"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "DrawerItem_SearchRecord"
- assertVisible:
    id: "search-record_header"
# Fresh install → offline history empty → the empty state renders.
- assertVisible:
    id: "search-record_empty_illustration"
