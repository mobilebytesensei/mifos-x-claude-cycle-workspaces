feature: search-record
entry_points:
  - type: nav_item
    source: m14-reports-search-audit
    description: "Tab or link within M14 to view the offline search history."
  - type: nav_item
    source: nav-shell-assembler
    description: "Could appear as a sub-item of M14 in the drawer for field-officer personas."

transitions:
  - from: loading
    to: content
    trigger: "Room search_history Flow emits ≥1 row → list rendered"
  - from: loading
    to: empty
    trigger: "Room search_history Flow emits empty list"
  - from: loading
    to: error
    trigger: "Room read failed"
  - from: content
    to: empty
    trigger: "clear_all_history confirmed → all rows deleted → Flow emits empty"
  - from: content
    to: content
    trigger: "delete_history_row → row removed from Room → list updates live (Flow re-emits)"
  - from: content
    to: content
    trigger: "open_search_result → navigate to entity detail (history list stays in backstack)"
  - from: content
    to: content
    trigger: "re_run_search → navigate to m14 with pre-filled query"
  - from: error
    to: loading
    trigger: "Retry → re-read Room search_history"
