feature: search-record
status: designed
scaffolded_at: '2026-08-01T00:00:00Z'
scaffolded_by: /idea-plan-add
schema_version: v2
cluster: field-operations
module: m14-reports-search-audit
priority: should_have
is_primary_flow: false
has_ui: true
has_api: false
has_server: false
capabilities:
  - has_ui
  - has_flow
  - has_offline_cache
  - requires_auth
requires_features:
  - permission-capability-engine
  - fineract-auth-session
  - m14-reports-search-audit
provides_to:
  - m02-clients
  - m04-loan-portfolio
  - m14-reports-search-audit
permissions_gate: >-
  Gated to field-officer personas (loan-officer-maker / collections-field-officer). Shows recently searched clients,
  loans, groups, and centers from offline-cached search history. The gate is a UI-layer persona check: requires
  READ_CLIENT or READ_LOAN (any search-related permission code). required_permission: READ_CLIENT denied_behavior:
  gray-out-info-dialog
contracts:
  apis: []
  tables:
    - name: search_history
      backend: room
      note: >-
        Recently-searched items: query_text, entity_type (client/loan/group/center), entity_id, entity_display_name,
        searched_at. Max 50 rows (ring buffer; oldest pruned). Persists across sessions.
    - name: search_history_prefs
      backend: multiplatform_settings
      keys:
        - search_history_enabled
      note: User preference to enable/disable search history recording. Defaults to true.
libraries:
  core_modules:
    - core/datastore
  external:
    - androidx.room
vm_actions:
  - action: OnHistoryRowClick
    maps_to_on_click: open_search_result
    handler: >-
      Navigate to the entity detail screen for the selected search-history row (client → client-detail-360, loan →
      loan-detail, group/center → m03-groups-centers).
  - action: OnDeleteHistoryRowClick
    maps_to_on_click: delete_history_row
    handler: Delete the specific search-history row from Room.
  - action: OnClearAllClick
    maps_to_on_click: clear_all_history
    handler: Confirm dialog → delete all rows from search_history in Room.
  - action: OnSearchFromHistoryClick
    maps_to_on_click: re_run_search
    handler: >-
      Populate the live search bar with the tapped history item's query_text and re-run a live search (navigates to
      m14-reports-search-audit with the pre-filled query).
  - action: Internal.ReceiveHistoryUpdates
    handler: >-
      Collect Room Flow<List<SearchHistoryRow>> — list updates live when new searches are performed in other screens
      (client-list, m14, loan-detail).
error_cases:
  - code: history_empty
    ux: 'empty state: ''No recent searches. Your recently viewed clients, loans, groups, and centers will appear here.'''
  - code: history_read_failed
    ux: 'error state: ''Could not load search history.'' with a Retry.'
test_fixtures:
  - >-
    loan officer has 5 recent searches (3 clients, 1 loan, 1 center) → history list shown; tapping a client row
    navigates to client-detail-360
  - delete one row → row removed from the list
  - clear all → confirm dialog → empty state shown
  - search history disabled in preferences → all rows hidden; 'Search history is off — enable in settings' shown
acceptance_refs:
  - plan: idea-plan.yaml#features (to be added)
  - evolve: evolve-plans/20260801-role-based-app-assembly.md §4.5 FO-5
summary: >-
  Offline / recently-searched history list — distinct from the live search in m14-reports-search-audit. Shows the
  signed-in field officer's last 50 searched entities (clients, loans, groups, centers) with the query text, entity
  type, and display name, ordered by most recent. Rows drill into the entity's detail screen. Supports individual row
  deletion and clear-all. History is recorded in a Room ring buffer; all reads are offline from local cache (no Fineract
  API call). Gated to field-officer personas.
plan_ref: idea-plan.yaml#features[search-record]
status_history:
  - from: enriched
    to: designed
    at: '2026-08-03T17:19:58.244Z'
    by: /idea-feature-stitch
