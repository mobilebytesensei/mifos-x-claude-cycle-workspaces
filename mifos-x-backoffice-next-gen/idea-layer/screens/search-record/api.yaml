feature: search-record
# Search record makes no Fineract API calls — entirely offline from Room.
endpoints: []
notes:
  - "All search history data is local — stored in Room search_history table (ring buffer, max 50 rows)."
  - "History rows are WRITTEN by other screens (client-list, m14, loan-detail) when the user selects a search result. search-record only READS and DELETES rows."
  - "No network call is ever needed — the feature works 100% offline."
