<!doctype html>
<!-- render-hash: searchrecord-loading-hd01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search Record — loading</title>
<style>
:root {
  --primary:#0091EA;--on-primary:#FFF;--primary-container:#CBE6FF;--on-primary-container:#001E30;
  --secondary:#00796B;--on-secondary:#FFF;--secondary-container:#B8F2E6;--on-secondary-container:#00201A;
  --surface:#FCFCFF;--on-surface:#1A1C1E;
  --surface-variant:#DEE3EB;--on-surface-variant:#42474E;
  --surface-container-low:#F3F4F9;--surface-container:#EDEFF4;
  --background:#FCFCFF;--outline:#72777F;--outline-variant:#C2C7CF;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  --fs-h3:1.375rem;--fs-body:1rem;--fs-label:0.875rem;
  --fs-caption:0.75rem;--fs-caption-sm:0.6875rem;
  --fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --lh-tight:1.3;--ls-label:0.1px;--ls-caption:0.4px;--ls-wide:0.5px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:9999px;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;
  --el-1:0 1px 2px rgba(0,0,0,.05);--el-2:0 2px 6px rgba(0,0,0,.08);
  --border-w:1px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{
  max-width:360px;margin:0 auto;min-height:100vh;
  background:var(--background);color:var(--on-surface);
  font-family:var(--font-body);font-size:var(--fs-body);line-height:1.5;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}

.top-bar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:var(--sp-sm);
  padding:var(--sp-sm) var(--sp-md);
  padding-top:calc(var(--sp-sm) + env(safe-area-inset-top,24px));
  background:var(--surface);
  border-bottom:var(--border-w) solid var(--outline-variant);
  box-shadow:var(--el-2);
}
.top-bar .leading{
  width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-full);color:var(--on-surface-variant);font-size:1.25rem;flex-shrink:0;
}
.top-bar .title{font-size:var(--fs-h3);font-weight:var(--fw-semibold);line-height:var(--lh-tight);color:var(--on-surface);flex:1;}

/* ── Content ── */
main{flex:1;overflow-y:auto;}

/* ── Section header band ── */
.section-band{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-sm) var(--sp-md);
  border-bottom:var(--border-w) solid var(--outline-variant);
}
.section-band h2{
  font-size:var(--fs-caption-sm);font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--on-surface-variant);
}

/* ── Shimmer skeleton ── */
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.shimmer-block{
  background:linear-gradient(90deg,var(--surface-variant) 25%,var(--surface-container-low) 50%,var(--surface-variant) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  border-radius:var(--r-sm);
}

.shimmer-row{
  display:flex;align-items:center;gap:var(--sp-sm);
  padding:var(--sp-md) var(--sp-md);
  border-bottom:var(--border-w) solid var(--outline-variant);
  min-height:64px;
}
.shimmer-row .sr-chip{width:52px;height:20px;flex-shrink:0;}
.shimmer-row .sr-body{flex:1;display:flex;flex-direction:column;gap:var(--sp-xs);}
.shimmer-row .sr-name{height:14px;}
.shimmer-row .sr-meta{height:11px;width:55%;}
.shimmer-row .sr-del{width:24px;height:24px;border-radius:50%;flex-shrink:0;}

/* Section header shimmer -->
.sh-label{width:100px;height:11px;}
.sh-action{width:56px;height:11px;}

/* ── Bottom navigation ── */
.bottom-nav{
  flex-shrink:0;
  display:flex;align-items:stretch;
  background:var(--surface);
  border-top:var(--border-w) solid var(--outline-variant);
  padding-bottom:env(safe-area-inset-bottom,0);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:var(--sp-xs) 0 var(--sp-sm);
  cursor:pointer;color:var(--on-surface-variant);text-decoration:none;
}
.nav-item .nav-pill{
  width:64px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r-full);margin-bottom:2px;
}
.nav-item.active .nav-pill{background:var(--primary-container);}
.nav-item.active .nav-icon{color:var(--on-primary-container);}
.nav-item.active .nav-label{color:var(--on-surface);font-weight:var(--fw-semibold);}
.nav-icon{font-size:1.25rem;line-height:1;}
.nav-label{font-size:var(--fs-caption-sm);letter-spacing:var(--ls-caption);}
</style>
</head>
<body>

<header class="top-bar">
  <span class="leading">&#8592;</span>
  <span class="title">Recent Searches</span>
</header>

<main>
  <!-- Section header — shimmered -->
  <div class="section-band">
    <div class="shimmer-block sh-label"></div>
    <div class="shimmer-block sh-action"></div>
  </div>

  <!-- 5 shimmer placeholder rows (must match content.html composition block-for-block) -->
  <div class="shimmer-row">
    <div class="shimmer-block sr-chip"></div>
    <div class="sr-body">
      <div class="shimmer-block sr-name" style="width:62%;"></div>
      <div class="shimmer-block sr-meta" style="width:42%;"></div>
    </div>
    <div class="shimmer-block sr-del"></div>
  </div>

  <div class="shimmer-row">
    <div class="shimmer-block sr-chip"></div>
    <div class="sr-body">
      <div class="shimmer-block sr-name" style="width:80%;"></div>
      <div class="shimmer-block sr-meta" style="width:50%;"></div>
    </div>
    <div class="shimmer-block sr-del"></div>
  </div>

  <div class="shimmer-row">
    <div class="shimmer-block sr-chip"></div>
    <div class="sr-body">
      <div class="shimmer-block sr-name" style="width:74%;"></div>
      <div class="shimmer-block sr-meta" style="width:38%;"></div>
    </div>
    <div class="shimmer-block sr-del"></div>
  </div>

  <div class="shimmer-row">
    <div class="shimmer-block sr-chip"></div>
    <div class="sr-body">
      <div class="shimmer-block sr-name" style="width:55%;"></div>
      <div class="shimmer-block sr-meta" style="width:46%;"></div>
    </div>
    <div class="shimmer-block sr-del"></div>
  </div>

  <div class="shimmer-row">
    <div class="shimmer-block sr-chip"></div>
    <div class="sr-body">
      <div class="shimmer-block sr-name" style="width:68%;"></div>
      <div class="shimmer-block sr-meta" style="width:34%;"></div>
    </div>
    <div class="shimmer-block sr-del"></div>
  </div>
</main>

<!-- Bottom navigation — Clients (m02) is the active context for search history -->
<nav class="bottom-nav">
  <a class="nav-item" href="#">
    <div class="nav-pill"><span class="nav-icon">&#8962;</span></div>
    <span class="nav-label">Home</span>
  </a>
  <a class="nav-item active" href="#">
    <div class="nav-pill"><span class="nav-icon">&#128101;</span></div>
    <span class="nav-label">Clients</span>
  </a>
  <a class="nav-item" href="#">
    <div class="nav-pill"><span class="nav-icon">&#128203;</span></div>
    <span class="nav-label">Collections</span>
  </a>
  <a class="nav-item" href="#">
    <div class="nav-pill"><span class="nav-icon">&#8635;</span></div>
    <span class="nav-label">Sync</span>
  </a>
</nav>

</body>
</html>
