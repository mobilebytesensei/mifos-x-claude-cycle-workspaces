feature: search-record
entries:
  - trigger: on_mount
    source: local.search_history
    target_state: content
    loading_state: loading
    error_state: error
    on_error:
      nav_target: null
      error_code: history_read_failed
    persistence_contract:
      store: room
      keys: [query_text, entity_type, entity_id, entity_display_name, searched_at]
      note: "Flow<List<SearchHistoryRow>> from Room — max 50 rows (ring buffer). Updates live when other screens insert new rows. Read-only here; inserts happen in client-list/m14/loan-detail on result selection."

  - trigger: on_click
    action: delete_history_row
    source: local.search_history
    target_state: content
    loading_state: content
    error_state: content
    on_error:
      nav_target: null
      error_code: storage_write_failed
    persistence_contract:
      store: room
      keys: [entity_id, entity_type]
      note: "DELETE WHERE entity_id = {id} AND entity_type = {type}. Flow re-emits; list updates live. Undo snackbar offered for 3s (re-INSERT if cancelled)."

  - trigger: on_click
    action: clear_all_history
    source: local.search_history
    target_state: empty
    loading_state: content
    error_state: content
    on_error:
      nav_target: null
      error_code: storage_write_failed
    persistence_contract:
      store: room
      keys: []
      note: "DELETE FROM search_history (all rows). After confirm dialog. Flow re-emits with empty list."
