id: m02-clients
name: M02 · Clients & KYC
feature: m02-clients
flow: clients
status: approved
approve_hash: "sha256:7bf428373a218595583e6078765a1ca863b92fbd7bddd319d6f03bd39d406a81"
approved_at: "2026-07-18T01:52:48Z"
