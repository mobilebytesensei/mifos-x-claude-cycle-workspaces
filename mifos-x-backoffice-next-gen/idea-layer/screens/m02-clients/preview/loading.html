html, body {

/* ── Top app bar ──────────────────────────────────────────────── */
header[data-shell="top-app-bar"] {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);

  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
}

}

  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  color: var(--on-surface);
  margin: 0;
}

/* ── Content ──────────────────────────────────────────────────── */
main[data-shell="content"] {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  padding: var(--sp-md);
  overflow-y: auto;
}

/* Shimmer skeleton */
@keyframes shimmer {
  0% { background-position: -400px 0; }
  100% { background-position: 400px 0; }
}
.sk {
  border-radius: var(--r-md);
  background: var(--surface-variant);
  background-image: linear-gradient(
    90deg,
    var(--surface-variant) 0px,
    var(--surface-container-low) 200px,
    var(--surface-variant) 400px
  );
  background-size: 800px 100%;
}
@media (prefers-reduced-motion: no-preference) {
  .sk { animation: shimmer 1.4s ease-in-out infinite; }
}

/* Search field skeleton (matches content search-field) */
.sk-search {
  height: 48px;
  border-radius: var(--r-sm);
}

.sk-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sk-section .sk { border-radius: var(--r-sm); }

/* Client list skeleton (matches content client-list) */
.sk-list {
  border: var(--border-w) solid var(--outline);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
}
.sk-row {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  min-height: 44px;
  padding: var(--sp-md);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
.sk-row:last-child { border-bottom: none; }
.sk-avatar {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: var(--r-xl);
}
.sk-lines { flex: 1; display: flex; flex-direction: column; gap: var(--sp-xs); }
.sk-line-lg { height: 14px; width: 62%; border-radius: var(--r-sm); }
.sk-line-md { height: 11px; width: 44%; border-radius: var(--r-sm); }
.sk-chip { flex: 0 0 auto; width: 64px; height: 22px; border-radius: var(--r-sm); }

/* FAB skeleton */
.sk-fab {
  align-self: flex-end;
  width: 148px;
  height: 48px;
  border-radius: var(--r-lg);
}

/* ── Bottom nav ───────────────────────────────────────────────── */
nav[data-shell="bottom-nav"] {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  display: flex;
  background: var(--surface);

nav[data-shell="bottom-nav"] a {

  text-decoration: none;
  font-size: var(--fs-caption);
  letter-spacing: var(--ls-caption);

}
nav[data-shell="bottom-nav"] a .nav-pill {

}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] {
  color: var(--on-primary-container);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill {

}
