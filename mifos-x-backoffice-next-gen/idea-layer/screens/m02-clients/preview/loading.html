<!doctype html>
<!-- render-hash: hd-m02clients-loading -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clients — loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #0091EA;
  --on-primary: #FFFFFF;
  --primary-container: #CBE6FF;
  --on-primary-container: #001E30;
  --primary-pressed: #0072B8;
  --secondary: #00796B;
  --on-secondary: #FFFFFF;
  --secondary-container: #B8F2E6;
  --on-secondary-container: #00201A;
  --tertiary: #5B5891;
  --on-tertiary: #FFFFFF;
  --tertiary-container: #E3DFFF;
  --on-tertiary-container: #17124B;
  --accent: #00BFA5;
  --on-accent: #00201A;
  --surface: #FCFCFF;
  --on-surface: #1A1C1E;
  --surface-variant: #DEE3EB;
  --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9;
  --surface-container: #EDEFF4;
  --background: #FCFCFF;
  --on-background: #1A1C1E;
  --outline: #72777F;
  --outline-variant: #C2C7CF;
  --success: #2E7D32;
  --warning: #F57C00;
  --warning-strong: #B45309;
  --error: #BA1A1A;
  --on-error: #FFFFFF;
  --error-container: #FFDAD6;
  --on-error-container: #410002;

  --font-body: 'Roboto', system-ui, sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, monospace;
  --fs-h1: 2rem;
  --fs-h2: 1.75rem;
  --fs-h3: 1.375rem;
  --fs-body: 1rem;
  --fs-label: 0.875rem;
  --fs-caption: 0.75rem;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --lh-body: 1.5;
  --lh-tight: 1.3;
  --ls-label: 0.1px;
  --ls-caption: 0.4px;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-xl: 28px;

  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-xxl: 48px;

  --border-w: 1px;

  /* Elevation (M3 level0-3 → CSS box-shadow; subtle, borders-over-shadows) */
  --el-0: none;
  --el-1: 0 1px 2px rgba(0,0,0,0.05);
  --el-2: 0 2px 6px rgba(0,0,0,0.08);
  --el-3: 0 8px 24px rgba(0,0,0,0.12);
}
:root[data-theme="dark"] {
  --primary: #6FD3FF;
  --on-primary: #00344F;
  --primary-container: #004B70;
  --on-primary-container: #CBE6FF;
  --primary-pressed: #9EE2FF;
  --secondary: #4FD8C4;
  --on-secondary: #003731;
  --secondary-container: #005048;
  --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0FF;
  --on-tertiary: #2C2A5E;
  --tertiary-container: #434076;
  --on-tertiary-container: #E3DFFF;
  --accent: #4FD8C4;
  --on-accent: #00201A;
  --surface: #1A1C1E;
  --on-surface: #E2E2E6;
  --surface-variant: #42474E;
  --on-surface-variant: #C2C7CF;
  --surface-container-low: #1E2022;
  --surface-container: #1E2022;
  --background: #1A1C1E;
  --on-background: #E2E2E6;
  --outline: #8C9198;
  --outline-variant: #42474E;
  --success: #7FCF82;
  --warning: #FFB868;
  --warning-strong: #E0912F;
  --error: #FFB4AB;
  --on-error: #690005;
  --error-container: #93000A;
  --on-error-container: #FFDAD6;

  /* Dark elevation: designed variant — deeper shadow + lighter surface tint (§7d) */
  --el-0: none;
  --el-1: 0 1px 2px rgba(0,0,0,0.35);
  --el-2: 0 2px 8px rgba(0,0,0,0.45);
  --el-3: 0 10px 28px rgba(0,0,0,0.55);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--background);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  -webkit-font-feature-settings: 'liga';
}

/* ── Top app bar ──────────────────────────────────────────────── */
header[data-shell="top-app-bar"] {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
  box-shadow: var(--el-2);
}
header[data-shell="top-app-bar"] .leading {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-xl);
  color: var(--on-surface-variant);
  background: transparent;
  border: none;
  cursor: default;
}
header[data-shell="top-app-bar"] .app-title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  color: var(--on-surface);
  margin: 0;
}
header[data-shell="top-app-bar"] .bar-spacer { flex: 1; }
header[data-shell="top-app-bar"] .bar-scope {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}
header[data-shell="top-app-bar"] .bar-scope .material-symbols-outlined { font-size: 16px; }

/* ── Content ──────────────────────────────────────────────────── */
main[data-shell="content"] {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  padding: var(--sp-md);
  /* §7g: bottom padding clears the sticky FAB so the last card is never occluded */
  padding-bottom: calc(var(--sp-md) + 64px);
  overflow-y: auto;
  position: relative;
}

/* Search field */
.search-field {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  background: var(--surface-variant);
  color: var(--on-surface);
  border-radius: var(--r-sm);
  padding: var(--sp-sm) var(--sp-md);
  cursor: text;
}
.search-field .material-symbols-outlined { color: var(--on-surface-variant); }
.search-field .search-text {
  flex: 1;
  font-size: var(--fs-body);
  color: var(--on-surface-variant);
}

/* Section label */
.section-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-sm);
  margin: var(--sp-xs) 0 calc(-1 * var(--sp-sm) + var(--sp-xs));
}
.section-label h2 {
  font-size: var(--fs-label);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
  color: var(--on-surface-variant);
  margin: 0;
}
.section-label .count {
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}

/* Client list */
.client-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border: var(--border-w) solid var(--outline-variant);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--el-1);
}
.client-row {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  width: 100%;
  min-height: 44px;
  padding: var(--sp-md);
  border-bottom: var(--border-w) solid var(--surface-variant);
  background: var(--surface);
  color: var(--on-surface);
  text-align: left;
  font-family: inherit;
  text-decoration: none;
  cursor: pointer;
}
.client-row:last-child { border-bottom: none; }
.client-avatar {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: var(--r-xl);
  background: var(--primary-container);
  color: var(--on-primary-container);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: var(--fw-semibold);
  font-size: var(--fs-label);
}
.client-meta { flex: 1; min-width: 0; }
.client-name {
  font-size: var(--fs-body);
  font-weight: var(--fw-medium);
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.client-sub {
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.client-extid {
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}
.client-accounts {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  margin-top: 2px;
}
.client-tail {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-xs);
}

/* Status chip */
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
  padding: 2px var(--sp-sm);
  border-radius: var(--r-sm);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-caption);
  background: var(--secondary-container);
  color: var(--on-secondary-container);
  white-space: nowrap;
}
.status-chip .material-symbols-outlined { font-size: 14px; }
.status-active { background: var(--secondary-container); color: var(--on-secondary-container); }
.status-pending { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.status-closed { background: var(--surface-variant); color: var(--on-surface-variant); }
.status-queued { background: var(--error-container); color: var(--on-error-container); }

/* Selected client 360 actions card */
.client360-card {
  background: var(--surface);
  border: var(--border-w) solid var(--outline-variant);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--el-2);
}
.client360-head {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  padding: var(--sp-md);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
.client360-head .persona-avatar {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  border-radius: var(--r-xl);
  background: var(--secondary-container);
  color: var(--on-secondary-container);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: var(--fw-semibold);
}
.client360-head .c360-meta { flex: 1; min-width: 0; }
.client360-head .c360-name {
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  color: var(--on-surface);
  line-height: var(--lh-tight);
}
.client360-head .c360-sub {
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  margin-top: 2px;
}
.client360-head .c360-extid {
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}

/* 360 tabs */
.c360-tabs {
  display: flex;
  gap: var(--sp-xs);
  overflow-x: auto;
  padding: var(--sp-sm) var(--sp-md);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
.c360-tab {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
  padding: var(--sp-xs) var(--sp-md);
  min-height: 32px;
  border-radius: var(--r-xl);
  border: var(--border-w) solid var(--surface-variant);
  background: var(--surface);
  color: var(--on-surface-variant);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  cursor: pointer;
  white-space: nowrap;
}
.c360-tab .material-symbols-outlined { font-size: 16px; }
.c360-tab[data-tab-selected="true"] {
  background: var(--primary-container);
  color: var(--on-primary-container);
  border-color: var(--primary-container);
}

/* Accounts summary (active tab body) */
.c360-body { padding: var(--sp-md); display: flex; flex-direction: column; gap: var(--sp-sm); }
.acct-row {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  padding: var(--sp-sm) var(--sp-md);
  border: var(--border-w) solid var(--surface-variant);
  border-radius: var(--r-md);
  background: var(--surface-container-low);
}
.acct-icon { flex: 0 0 auto; color: var(--on-surface-variant); }
.acct-meta { flex: 1; min-width: 0; }
.acct-name { font-size: var(--fs-body); font-weight: var(--fw-medium); color: var(--on-surface); }
.acct-no { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }
.acct-amount {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  color: var(--on-surface);
  text-align: right;
}

/* Command bar */
.command-bar {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-sm);
  padding: var(--sp-md);
  border-top: var(--border-w) solid var(--surface-variant);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-xs);
  min-height: 44px;
  padding: var(--sp-sm) var(--sp-md);
  border-radius: var(--r-xl);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  cursor: pointer;
  border: var(--border-w) solid transparent;
}
.btn .material-symbols-outlined { font-size: 18px; }
.btn-primary { background: var(--primary); color: var(--on-primary); border: none; }
.btn-secondary { background: var(--surface); color: var(--primary); border-color: var(--outline); }
.btn-destructive { background: var(--surface); color: var(--error); border-color: var(--error); }
.btn-text { background: transparent; color: var(--primary); border: none; padding: var(--sp-sm); }
.btn.is-disabled {
  background: var(--surface-variant);
  color: var(--on-surface-variant);
  border-color: transparent;
  cursor: not-allowed;
}
.btn.is-disabled.btn-text { background: transparent; }
.btn .req-reason {
  font-size: 10px;
  font-weight: var(--fw-regular);
  letter-spacing: 0;
  opacity: 0.85;
}

.subresource-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-xs);
  padding: 0 var(--sp-md) var(--sp-md);
}

/* FAB */
.fab {
  position: sticky;
  bottom: var(--sp-md);
  align-self: flex-end;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-sm);
  min-height: 48px;
  padding: 0 var(--sp-lg);
  border-radius: var(--r-lg);
  border: none;
  background: var(--secondary);
  color: var(--on-secondary);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  cursor: pointer;
  box-shadow: var(--el-3);
  z-index: 5;
}
.fab .material-symbols-outlined { font-size: 20px; }

/* ── Bottom nav ───────────────────────────────────────────────── */
nav[data-shell="bottom-nav"] {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  display: flex;
  background: var(--surface);
  border-top: var(--border-w) solid var(--surface-variant);
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: var(--el-2);
}
nav[data-shell="bottom-nav"] a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--sp-sm) var(--sp-xs);
  min-height: 44px;
  color: var(--on-surface-variant);
  text-decoration: none;
  font-size: var(--fs-caption);
  letter-spacing: var(--ls-caption);
  cursor: pointer;
}
nav[data-shell="bottom-nav"] a .nav-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  height: 28px;
  border-radius: var(--r-lg);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] {
  color: var(--on-primary-container);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill {
  background: var(--primary-container);
}

@media (prefers-reduced-motion: no-preference) {
  .client-row, .btn, .fab, .c360-tab, .search-field { transition: filter 120ms ease; }
  .client-row:active, .btn:active, .fab:active, .c360-tab:active { filter: brightness(0.97); }
}

/* ── Loading skeleton (mirrors content.html block-for-block) ───── */
@keyframes sk-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}
.sk {
  background: var(--surface-variant);
  border-radius: var(--r-sm);
  animation: sk-pulse 1.4s ease-in-out infinite;
  display: block;
}
.sk-circle { border-radius: var(--r-xl); }
.sk-avatar { width: 40px; height: 40px; flex: 0 0 auto; }
.sk-avatar-lg { width: 44px; height: 44px; flex: 0 0 auto; }
.sk-line { height: 12px; width: 100%; }
.sk-line.w-70 { width: 70%; }
.sk-line.w-55 { width: 55%; }
.sk-line.w-45 { width: 45%; }
.sk-line.w-35 { width: 35%; }
.sk-line.w-25 { width: 25%; }
.sk-search { height: 24px; flex: 1; }
.sk-chip { width: 76px; height: 22px; border-radius: var(--r-sm); }
.sk-tab { width: 104px; height: 32px; border-radius: var(--r-xl); flex: 0 0 auto; }
.sk-btn { width: 116px; height: 44px; border-radius: var(--r-xl); }
.sk-btn.text { width: 132px; }
.sk-amount { width: 84px; height: 14px; flex: 0 0 auto; }
.sk-fab {
  position: sticky;
  bottom: var(--sp-md);
  align-self: flex-end;
  width: 148px;
  height: 48px;
  border-radius: var(--r-lg);
  box-shadow: var(--el-3);
}
@media (prefers-reduced-motion: reduce) {
  .sk { animation: none; }
}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="m02-clients" data-state="loading">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="clients_header" data-from-ui-yaml-path="components[0]">
    <span class="leading material-symbols-outlined" aria-hidden="true">menu</span>
    <h1 class="app-title">Clients</h1>
    <span class="bar-spacer"></span>
    <span class="bar-scope">
      <span class="material-symbols-outlined" aria-hidden="true">apartment</span>
      Nairobi CBD
    </span>
  </header>

  <main data-shell="content" data-state="loading" aria-busy="true" aria-label="Loading clients">

    <!-- Search field skeleton (mirrors #clients_search_field) -->
    <div class="search-field" data-component-type="LayoutBox" data-component-id="skeleton_search" aria-hidden="true">
      <span class="sk sk-circle" style="width:24px;height:24px;"></span>
      <span class="sk sk-search"></span>
    </div>

    <!-- Section label skeleton (mirrors "Clients" + count) -->
    <div class="section-label" data-component-type="LayoutBox" data-component-id="skeleton_list_label" aria-hidden="true">
      <span class="sk sk-line w-25" style="height:14px;"></span>
      <span class="sk sk-line w-35" style="height:11px;max-width:96px;"></span>
    </div>

    <!-- Client list skeleton — 5 rows in the bordered list card -->
    <ul class="client-list" data-component-type="LayoutBox" data-component-id="skeleton_client_list" aria-hidden="true">
      <li class="client-row" style="cursor:default;">
        <span class="sk sk-circle sk-avatar"></span>
        <span class="client-meta">
          <span class="sk sk-line w-70"></span>
          <span class="sk sk-line w-45" style="margin-top:6px;"></span>
          <span class="sk sk-line w-55" style="margin-top:6px;"></span>
        </span>
        <span class="client-tail"><span class="sk sk-chip"></span></span>
      </li>
      <li class="client-row" style="cursor:default;">
        <span class="sk sk-circle sk-avatar"></span>
        <span class="client-meta">
          <span class="sk sk-line w-55"></span>
          <span class="sk sk-line w-45" style="margin-top:6px;"></span>
          <span class="sk sk-line w-70" style="margin-top:6px;"></span>
        </span>
        <span class="client-tail"><span class="sk sk-chip"></span></span>
      </li>
      <li class="client-row" style="cursor:default;">
        <span class="sk sk-circle sk-avatar"></span>
        <span class="client-meta">
          <span class="sk sk-line w-45"></span>
