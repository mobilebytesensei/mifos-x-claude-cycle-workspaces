appId: org.mifos.backoffice
# M02 · Clients & KYC — happy path: land on the office-scoped list, drill into a Client 360,
# confirm the sub-resource tabs render. Every id maps to a ui.yaml component testTag.
---
- launchApp
# ── Client list renders ──────────────────────────────────────────────
- assertVisible:
    id: "m02-clients_header"
- assertVisible:
    id: "m02-clients_content"
# ── Search narrows the list ──────────────────────────────────────────
- tapOn:
    id: "m02-clients_search"
- inputText: "Grace"
- assertVisible:
    id: "m02-clients_item"
# ── Drill into the Client 360 ────────────────────────────────────────
- tapOn:
    id: "m02-clients_item"
- assertVisible:
    id: "m02-clients_tabs"
# ── New-client entry point present for a CREATE_CLIENT persona ────────
- assertVisible:
    id: "m02-clients_new_client"
