appId: org.mifos.backoffice
# M13 · Scheduler & Jobs (COB) — happy path: land on the scheduler console, confirm the job
# roster + scheduler switch + business date render, open a job's run history, and confirm the
# run-job control is present (EXECUTEJOB_SCHEDULER persona). Every id maps to a ui.yaml testTag.
---
- launchApp
# ── Scheduler console renders (job roster + scheduler switch + business date) ──
- assertVisible:
    id: "m13-scheduler-jobs_header"
- assertVisible:
    id: "m13-scheduler-jobs_content"
- assertVisible:
    id: "m13-scheduler-jobs_scheduler_switch"
- assertVisible:
    id: "m13-scheduler-jobs_business_date"
# ── A job row with its last-run status chip is listed ───────────────────
- assertVisible:
    id: "m13-scheduler-jobs_job_item"
- assertVisible:
    id: "m13-scheduler-jobs_status_chip"
# ── Open the selected job's detail + run history ────────────────────────
- tapOn:
    id: "m13-scheduler-jobs_job_item"
- assertVisible:
    id: "m13-scheduler-jobs_view_run_history"
- tapOn:
    id: "m13-scheduler-jobs_view_run_history"
# ── The run-job control is present (EXECUTEJOB_SCHEDULER persona; online-only) ──
- assertVisible:
    id: "m13-scheduler-jobs_run_job"
