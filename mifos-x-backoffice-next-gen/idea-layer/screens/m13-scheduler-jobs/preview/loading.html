<style>
:root {
  /* Primary — brand Light Blue */
  --primary: #0091EA; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001E30;
  --primary-hover: #0081D0; --primary-pressed: #0072B8;
  /* Secondary — Teal */
  --secondary: #00796B; --on-secondary: #FFFFFF; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  /* Tertiary — muted indigo */
  --tertiary: #5B5891; --on-tertiary: #FFFFFF; --tertiary-container: #E3DFFF; --on-tertiary-container: #17124B;
  /* Error / success / warning / info */
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #2E7D32; --on-success: #FFFFFF; --success-container: #C8E6C9; --on-success-container: #002106;
  --warning: #F57C00; --on-warning: #FFFFFF; --warning-container: #FFDDB8; --on-warning-container: #2A1700; --warning-strong: #B45309;
  --info: #0277BD; --on-info: #FFFFFF;
  /* Surfaces */
  --background: #FCFCFF; --on-background: #1A1C1E;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F3F4F9; --surface-container: #EDEFF4;
  --surface-container-high: #E7E9EF; --surface-container-highest: #E1E3E9; --surface-dim: #DBDCE0; --surface-bright: #FCFCFF;
  /* Outlines / inverse / accent */
  --outline: #72777F; --outline-variant: #C2C7CF;
  --inverse-surface: #2F3033; --inverse-on-surface: #F1F0F4; --inverse-primary: #6FD3FF;
  --accent: #00BFA5; --on-accent: #00201A; --scrim: #000000;
  /* Typography */
  --font-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-h1: 2rem; --fs-h2: 1.75rem; --fs-h3: 1.5rem; --fs-title: 1.375rem; --fs-title-md: 1rem;
  --fs-body: 1rem; --fs-body-sm: 0.875rem; --fs-label: 0.875rem; --fs-label-sm: 0.75rem;
  --fs-caption: 0.75rem; --fs-caption-sm: 0.6875rem;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-label: 0.1px; --ls-caption: 0.4px; --ls-wide: 0.5px;
  /* Radius (design-tokens: xs4 sm8 md12 lg16 xl28) */
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 9999px;
  /* Spacing (8pt grid) */
  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
  /* Elevation — M3 level0-5 → box-shadow (§7a). Subtle per clinical DESIGN.md. */
  --el-0: none;
  --el-1: 0 1px 2px rgba(0,0,0,0.05);
  --el-2: 0 2px 6px rgba(0,0,0,0.08);
  --el-3: 0 8px 24px rgba(0,0,0,0.12);
  --el-4: 0 12px 32px rgba(0,0,0,0.14);
  --el-5: 0 16px 48px rgba(0,0,0,0.18);
  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #6FD3FF; --on-primary: #00344F; --primary-container: #004B70; --on-primary-container: #CBE6FF;
  --primary-hover: #86DBFF; --primary-pressed: #9EE2FF;
  --secondary: #4FD8C4; --on-secondary: #003731; --secondary-container: #005048; --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0FF; --on-tertiary: #2C2A5E; --tertiary-container: #434076; --on-tertiary-container: #E3DFFF;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #7FCF82; --on-success: #003910; --success-container: #1B5E20; --on-success-container: #C8E6C9;
  --warning: #FFB868; --on-warning: #4A2800; --warning-container: #6B3C00; --on-warning-container: #FFDDB8; --warning-strong: #E0912F;
  --info: #7FCFFF; --on-info: #003548;
  --background: #1A1C1E; --on-background: #E2E2E6;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF;
  --surface-container-lowest: #0F1113; --surface-container-low: #1A1C1E; --surface-container: #1E2022;
  --surface-container-high: #282A2D; --surface-container-highest: #333537; --surface-dim: #111315; --surface-bright: #37393C;
  --outline: #8C9198; --outline-variant: #42474E;
  --inverse-surface: #E2E2E6; --inverse-on-surface: #2F3033; --inverse-primary: #0091EA;
  --accent: #4FD8C4; --on-accent: #00201A;
  /* §7d — on dark, elevation reads via deeper shadow + lighter surface tint */
  --el-1: 0 1px 2px rgba(0,0,0,0.40);
  --el-2: 0 2px 6px rgba(0,0,0,0.50);
  --el-3: 0 8px 24px rgba(0,0,0,0.60);
  --el-4: 0 12px 32px rgba(0,0,0,0.66);
  --el-5: 0 16px 48px rgba(0,0,0,0.72);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100vh;
  background: var(--background); color: var(--on-surface);
  font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle;
  -webkit-font-feature-settings: 'liga';
}

/* Raised-surface background helper — cards read as elevated in both themes (§7d) */
.raised { background: var(--surface-container-lowest); }
:root[data-theme="dark"] .raised { background: var(--surface-container-high); }

/* ── Top app bar ──────────────────────────────────────────────── */
header[data-shell="top-app-bar"] {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
  background: var(--surface); color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--outline-variant);
  box-shadow: var(--el-2);
}
header[data-shell="top-app-bar"] .leading {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--r-full);
  color: var(--on-surface-variant); background: transparent; border: none; cursor: default;
}
header[data-shell="top-app-bar"] .app-title {
  font-size: var(--fs-title); font-weight: var(--fw-semibold);
  line-height: var(--lh-tight); color: var(--on-surface); margin: 0;
}
header[data-shell="top-app-bar"] .bar-trailing {
  margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant);
}
header[data-shell="top-app-bar"] .bar-trailing .avatar {
  width: 30px; height: 30px; border-radius: var(--r-full);
  background: var(--primary-container); color: var(--on-primary-container);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: var(--fs-caption); font-weight: var(--fw-semibold);
}

/* ── Content ──────────────────────────────────────────────────── */
main[data-shell="content"] {
  flex: 1; display: flex; flex-direction: column; gap: var(--sp-md);
  padding: var(--sp-md);
  padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px) + var(--sp-lg));
  overflow-y: auto; overflow-x: hidden;
}

/* Scheduler control strip (summary / hero → --el-2) */
.sched-strip {
  display: flex; align-items: center; gap: var(--sp-md);
  padding: var(--sp-md);
  border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-lg);
  box-shadow: var(--el-2);
}
.sched-strip .sched-icon {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--r-md);
  background: var(--primary-container); color: var(--on-primary-container);
}
.sched-strip .sched-icon .material-symbols-outlined { font-size: 22px; }
.sched-strip .sched-meta { flex: 1; min-width: 0; }
.sched-strip .sched-label { font-size: var(--fs-caption); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--on-surface-variant); font-weight: var(--fw-semibold); }
.sched-strip .sched-state { font-size: var(--fs-body-sm); color: var(--on-surface); font-weight: var(--fw-medium); display: flex; align-items: center; gap: var(--sp-xs); }
.sched-strip .sched-state .material-symbols-outlined { font-size: 16px; color: var(--success); }
/* M3 switch */
.m3-switch {
  position: relative; flex: 0 0 auto; width: 52px; height: 32px; border-radius: var(--r-full);
  border: 2px solid transparent; background: var(--primary); cursor: pointer; padding: 0;
}
.m3-switch .thumb { position: absolute; top: 4px; left: 24px; width: 24px; height: 24px; border-radius: 50%; background: var(--on-primary); transition: left 120ms ease; }
.m3-switch[aria-checked="false"] { background: var(--surface-variant); border-color: var(--outline); }
.m3-switch[aria-checked="false"] .thumb { left: 4px; width: 16px; height: 16px; top: 6px; background: var(--outline); }

/* Status summary strip */
.status-summary {
  display: flex; flex-wrap: wrap; gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-lg);
  box-shadow: var(--el-2);
}
.summary-stat { display: flex; align-items: baseline; gap: var(--sp-xs); flex: 1 1 auto; min-width: 0; }
.summary-stat .num { font-family: var(--font-mono); font-size: var(--fs-title-md); font-weight: var(--fw-bold); line-height: 1; }
.summary-stat .lbl { font-size: var(--fs-caption); color: var(--on-surface-variant); letter-spacing: var(--ls-caption); }
.summary-stat.total .num { color: var(--on-surface); }
.summary-stat.running .num { color: var(--primary); }
.summary-stat.failed .num { color: var(--error); }
.summary-stat.inactive .num { color: var(--on-surface-variant); }

/* Business-date chip row */
.bizdate-row { display: flex; align-items: center; gap: var(--sp-sm); flex-wrap: wrap; }
.bizdate-chip {
  display: inline-flex; align-items: center; gap: var(--sp-xs);
  padding: var(--sp-xs) var(--sp-md); border-radius: var(--r-full);
  border: var(--border-w) solid var(--outline-variant);
  color: var(--on-surface); font-size: var(--fs-label); font-weight: var(--fw-medium);
  box-shadow: var(--el-1);
}
.bizdate-chip .material-symbols-outlined { font-size: 16px; color: var(--on-surface-variant); }
.bizdate-chip .bd-value { font-family: var(--font-mono); }
.btn-inline {
  display: inline-flex; align-items: center; gap: var(--sp-xs);
  padding: var(--sp-xs) var(--sp-md); min-height: 32px; border-radius: var(--r-full);
  background: var(--surface); color: var(--primary); border: var(--border-w) solid var(--outline);
  font-family: inherit; font-size: var(--fs-label); font-weight: var(--fw-medium); cursor: pointer;
  box-shadow: var(--el-1);
}
.btn-inline .material-symbols-outlined { font-size: 16px; }

/* Section label */
.section-label { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-sm); margin: var(--sp-xs) 0 calc(-1 * var(--sp-xs)); }
.section-label h2 { font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--on-surface-variant); margin: 0; }
.section-label .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

/* Job list — each row is an elevated card (§7a --el-1) */
.job-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.job-list > li {
  border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-lg);
  box-shadow: var(--el-1); overflow: hidden;
}
.job-list > li.is-selected { box-shadow: var(--el-2); border-color: var(--primary); }
.job-row {
  display: flex; align-items: center; gap: var(--sp-md); width: 100%; min-height: 44px;
  padding: var(--sp-md); border: none;
  background: transparent; color: var(--on-surface); text-align: left; font-family: inherit; cursor: pointer;
}
.job-row.selected { background: color-mix(in oklch, var(--primary-container) 55%, transparent); }
.job-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-md); background: var(--surface-variant); color: var(--on-surface-variant); }
.job-icon .material-symbols-outlined { font-size: 20px; }
.job-meta { flex: 1; min-width: 0; }
.job-name { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--on-surface); line-height: var(--lh-tight); }
.job-sub { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-xs); margin-top: var(--sp-xxs); }
.job-cron { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); background: var(--surface-container); padding: 1px var(--sp-xs); border-radius: var(--r-xs); }
.job-times { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.job-times .mono { font-family: var(--font-mono); }
.job-trailing { display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-xs); flex: 0 0 auto; }
.job-row .job-chevron { color: var(--on-surface-variant); flex: 0 0 auto; }

/* Status chips */
.status-chip {
  display: inline-flex; align-items: center; gap: var(--sp-xxs); padding: var(--sp-xxs) var(--sp-sm);
  border-radius: var(--r-sm); font-size: var(--fs-caption); font-weight: var(--fw-semibold); letter-spacing: var(--ls-caption); white-space: nowrap;
}
.status-chip .material-symbols-outlined { font-size: 12px; }
.status-chip.success { background: var(--success-container); color: var(--on-success-container); }
.status-chip.failed { background: var(--error-container); color: var(--on-error-container); }
.status-chip.never { background: var(--surface-variant); color: var(--on-surface-variant); }
.status-chip.running { background: var(--primary-container); color: var(--on-primary-container); }
@keyframes spin { to { transform: rotate(360deg); } }
.mini-ring { width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); border-top-color: currentColor; display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .mini-ring { animation: spin 900ms linear infinite; } }
.inactive-tag { font-size: var(--fs-caption); color: var(--on-surface-variant); font-weight: var(--fw-medium); }

/* Job detail (expanded) — panel → --el-2 */
.job-detail { border-top: var(--border-w) solid var(--outline-variant); }
.detail-head { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); background: var(--surface-container-low); border-bottom: var(--border-w) solid var(--outline-variant); }
.detail-head .dh-title { font-size: var(--fs-label); font-weight: var(--fw-semibold); color: var(--on-surface); flex: 1; min-width: 0; }
.detail-body { display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); }
.kv-grid { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-xs) var(--sp-md); font-size: var(--fs-label); }
.kv-grid dt { color: var(--on-surface-variant); }
.kv-grid dd { margin: 0; color: var(--on-surface); font-family: var(--font-mono); word-break: break-word; }

/* Run history table (§7f scroller) */
.rh-wrap { overflow-x: auto; border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-md); box-shadow: var(--el-1); }
table.rh { border-collapse: collapse; width: 100%; font-size: var(--fs-caption); }
table.rh thead th { background: var(--surface-variant); color: var(--on-surface-variant); text-align: left; font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; padding: var(--sp-xs) var(--sp-sm); white-space: nowrap; }
table.rh td { padding: var(--sp-xs) var(--sp-sm); border-top: var(--border-w) solid var(--surface-variant); font-family: var(--font-mono); color: var(--on-surface); white-space: nowrap; }
table.rh td.status-cell { font-family: var(--font-body); }
.rh-error {
  margin: 0; padding: var(--sp-sm) var(--sp-md); background: var(--error-container); color: var(--on-error-container);
  border-radius: var(--r-md); border: var(--border-w) solid var(--error);
}
.rh-error .em { font-weight: var(--fw-semibold); font-size: var(--fs-label); display: block; margin-bottom: var(--sp-xs); }
.rh-error pre { margin: 0; font-family: var(--font-mono); font-size: var(--fs-caption); white-space: pre-wrap; word-break: break-word; }

/* Command bar */
.cmd-bar { display: flex; flex-direction: column; gap: var(--sp-sm); }
.cmd-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: var(--sp-sm); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm);
  min-height: 44px; padding: var(--sp-sm) var(--sp-md); border-radius: var(--r-xl);
  font-family: inherit; font-size: var(--fs-label); font-weight: var(--fw-medium); letter-spacing: var(--ls-label);
  cursor: pointer; border: var(--border-w) solid transparent; width: 100%;
}
.btn .material-symbols-outlined { font-size: 18px; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--el-1); }
.btn-secondary { background: var(--surface); color: var(--primary); border-color: var(--outline); }
.btn-text { background: transparent; color: var(--primary); border-color: transparent; }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--surface-variant); color: var(--on-surface-variant); border-color: transparent; cursor: not-allowed; box-shadow: var(--el-0); }

@media (prefers-reduced-motion: no-preference) {
  .job-row, .btn, .btn-inline, .m3-switch { transition: filter 120ms ease; }
  .job-row:active, .btn:active, .btn-inline:active { filter: brightness(0.97); }
}

/* ── Bottom nav ───────────────────────────────────────────────── */
nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; z-index: 10; display: flex; background: var(--surface); border-top: var(--border-w) solid var(--outline-variant); padding-bottom: env(safe-area-inset-bottom, 0); box-shadow: var(--el-2); }
nav[data-shell="bottom-nav"] a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-sm) var(--sp-xs); min-height: 44px; color: var(--on-surface-variant); text-decoration: none; font-size: var(--fs-caption); letter-spacing: var(--ls-caption); cursor: pointer; }
nav[data-shell="bottom-nav"] a .nav-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 28px; border-radius: var(--r-lg); }
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] { color: var(--on-primary-container); }
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill { background: var(--primary-container); }
</style>
</head>
<body>
<style>
/* state-scoped: shimmer skeleton (token-native, relative units) */
.sk { position: relative; overflow: hidden; background: var(--surface-container-high); border-radius: var(--r-sm); display: inline-block; }
:root[data-theme="dark"] .sk { background: var(--surface-container-highest); }
.sk::after {
  content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--surface-bright) 65%, transparent), transparent);
}
@media (prefers-reduced-motion: no-preference) { .sk::after { animation: sk-shimmer 1200ms ease-in-out infinite; } }
@keyframes sk-shimmer { to { transform: translateX(100%); } }
.sk-meta { display: flex; flex-direction: column; gap: var(--sp-xs); flex: 1; min-width: 0; }
.sk-line { height: var(--fs-body-sm); }
.sk-cap { height: var(--fs-caption); }
</style>
<div data-shell="root" data-screen-id="m13-scheduler-jobs" data-state="loading">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="scheduler_header" data-from-ui-yaml-path="components[0]">
    <span class="leading material-symbols-outlined" aria-hidden="true">arrow_back</span>
    <h1 class="app-title">Scheduler &amp; Jobs</h1>
    <span class="bar-trailing" aria-hidden="true"><span class="avatar">MW</span></span>
  </header>

  <main data-shell="content" data-state="loading" role="status" aria-busy="true" aria-live="polite" aria-label="Loading scheduled jobs">

    <!-- scheduler_master_switch skeleton -->
    <div class="sched-strip raised" aria-hidden="true">
      <span class="sk" style="width:2.5rem;height:2.5rem;border-radius:var(--r-md);flex:0 0 auto;"></span>
      <span class="sk-meta">
        <span class="sk sk-cap" style="width:5rem;"></span>
        <span class="sk sk-line" style="width:72%;"></span>
      </span>
      <span class="sk" style="width:3.25rem;height:2rem;border-radius:var(--r-full);flex:0 0 auto;"></span>
    </div>
