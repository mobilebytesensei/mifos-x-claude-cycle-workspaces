approve_contract_version: 2.0.0
cluster: foundation
module: foundation
priority: must_have
new_infra: true
is_primary_flow: false
has_ui: true
has_api: true
has_server: false
capabilities:
  - has_ui
  - has_api
  - has_offline_cache
  - has_form_input
  - has_data_migration
  - requires_auth
requires_permission:
  - READ_DATATABLE
acceptance_refs:
  - >-
    Create/edit forms rendered from GET /{entity}/template + /datatables; a back-office config change appears next sync,
    no release
plan_ref: idea-plan.yaml#features[dynamic-template-forms]
summary: >-
  Dynamic form renderer — a typed field-schema model + renderer built from the Fineract GET /{entity}/template pattern
  joined with the entity's registered /v1/datatables schemas. Fields, defaults, and allowed-value option lists come
  entirely from the server payload (never hardcoded), so a back-office config change appears on the next sync with no
  app release. Templates + datatable schemas are cached in Room (CACHE_FIRST_SWR) so forms work fully offline; submits
  assemble a command JsonObject and flow through the durable outbox for exactly-once batch replay.
contracts:
  reads:
    - >-
      GET /v1/{entity}/template — field defaults + *Options[] allowed-value lists (contextual
      ?clientId=&productId=&templateType=)
    - GET /v1/datatables?apptable={entity} — registered custom-field schemas (columnHeaderData)
  writes:
    - POST /v1/{entity}[/{id}?command={action}] — assembled command JsonObject (enqueued via outbox when offline)
  consumes_tables:
    - cached_templates
    - cached_datatable_schemas
    - framework_submit_drafts
libraries:
  external:
    - name: kotlinx.serialization
      role: >-
        Deserialize the template/datatable JSON into the typed field model and serialize the values map into the command
        JsonObject body.
  cmp: []
  required_modules:
    - core/network
    - core/database
    - core/data
vm_actions:
  - action: EditTextField
    on_click: edit_text_field
    effect: transform_state
    note: Update values[fieldCode] from input, run declared validators, recompute canSubmit.
  - action: SelectOption
    on_click: select_option
    effect: transform_state
    note: Set values[fieldCode] to the chosen option id; re-derive cascading option lists.
  - action: PickDate
    on_click: pick_date
    effect: transform_state
    note: Store date + dateFormat + locale; validate against template min/max.
  - action: SubmitForm
    on_click: submit_form
    effect: call_api
    note: >-
      Serialize command JsonObject; enqueue to outbox (durable idempotency key); online → submitting, offline →
      queued-offline.
  - action: RetryTemplateFetch
    on_click: retry_template_fetch
    effect: call_api
    note: Re-fetch template + datatables, refresh cache, return to content.
error_cases:
  - code: template_fetch_failed
    when: GET /{entity}/template fails AND no cached schema exists
    ux: error state with Retry; no partial form rendered
  - code: datatable_schema_fetch_failed
    when: GET /v1/datatables fails and no cache
    ux: base template renders; datatable groups degrade to hidden with a re-sync hint
  - code: field_validation_failed
    when: mandatory-missing / format / range on submit
    ux: validation-error state — offending fields highlighted, submit blocked
  - code: command_rejected
    when: server 400 validation / 409 optimistic-lock on submit
    ux: error state — server errors[] mapped back onto the offending field by parameterName
test_fixtures:
  - >-
    template_clients_create — /clients/template with officeOptions, staffOptions, genderIdOptions + client_kyc_details
    datatable
  - template_loans_create — /loans/template?productId=3 with product-driven option lists
  - outbox_draft — a queued client_create command JsonObject with durable idempotency_key
