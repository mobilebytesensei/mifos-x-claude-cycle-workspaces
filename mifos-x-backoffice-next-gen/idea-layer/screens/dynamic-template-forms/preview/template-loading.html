/* Skeleton primitives */
.sk {
  background: var(--surface-variant);
  border-radius: var(--r-sm);
  position: relative;
  overflow: hidden;
}
@media (prefers-reduced-motion: no-preference) {
  .sk::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg,

      color-mix(in srgb, var(--surface) 55%, transparent),
      color-mix(in srgb, var(--surface) 0%, transparent));
    animation: pulse 1.4s ease-in-out infinite;
  }
}
@keyframes pulse {
  100% { transform: translateX(100%); }
}
.sk-line { height: 12px; }
.sk-line.lg { height: 18px; }
.sk-label { height: 12px; width: 34%; }
.sk-field { height: 48px; border-radius: var(--r-sm); }

}
.spinner {

}
@media (prefers-reduced-motion: no-preference) {

}
@keyframes spin { 100% { transform: rotate(360deg); } }

}
.cache-hint .material-symbols-outlined { font-size: 18px; flex: 0 0 auto; }

/* Skeleton form card */
.sk-form {

  border: var(--border-w) solid var(--outline);
