feature: dynamic-template-forms
# Regenerated 2026-07-21 against the enriched ui.yaml (per-field validation model:
# mandatory / length / numeric_range / regex / allowed_value / date_range / date_format).
# Real Fineract payload shapes the renderer consumes. `entity_templates` are faithful
# GET /{entity}/template responses (defaults + *Options[] allowed-value lists); `datatable_schemas`
# are GET /v1/datatables columnHeaderData; `outbox_draft` is a queued command JsonObject as it sits
# in the DraftEntity outbox before batch replay. `field` + `resolved_fields` show what the renderer
# binds each per-field placeholder ({field.label}, {field.type}, {field.options}) to after resolving
# a TemplateField, carrying the enriched validation metadata the text/select/date inputs enforce.

# A single resolved TemplateField the {field.label}/{field.type} per-field placeholders bind to.
field:
  code: "firstname"
  label: "First name"
  type: "String"
  mandatory: true
  length: 50

# The resolved schema (base template fields + flattened datatable groups) as the renderer
# materializes it — one representative field per input kind with its validation metadata.
resolved_fields:
  - code: "firstname"
    label: "First name"
    type: "text"
    mandatory: true
    length: { min: 1, max: 50 }
  - code: "genderId"
    label: "Gender"
    type: "select"
    mandatory: true
    allowed_values:
      - { id: 24, label: "Female" }
      - { id: 25, label: "Male" }
  - code: "principal"
    label: "Principal amount"
    type: "select"
    mandatory: false
    numeric_range: { min: 1000, max: 5000000 }
  - code: "activationDate"
    label: "Activation date"
    type: "date"
    mandatory: true
    date_format: "dd MMMM yyyy"
    locale: "en"
    date_range: { min: "2020-01-01", max: "2026-07-21" }

entity_templates:
  # ── GET /clients/template (individual, legalForm=PERSON) ──────────────────
  - id: template_clients_create
    entity: clients
    endpoint: "GET /v1/clients/template"
    payload:
      officeId: 1
      officeOptions:
        - { id: 1, name: "Head Office" }
        - { id: 2, name: "Kampala Branch" }
      staffOptions:
        - { id: 3, displayName: "Ochieng, Grace", officeId: 2 }
        - { id: 4, displayName: "Mensah, Kwame", officeId: 2 }
      savingProductOptions:
        - { id: 5, name: "Passbook Savings" }
        - { id: 7, name: "Compulsory Savings" }
      genderIdOptions:
        - { id: 24, name: "Female" }
        - { id: 25, name: "Male" }
      clientTypeOptions:
        - { id: 30, name: "Individual" }
        - { id: 31, name: "Corporate" }
      clientClassificationOptions:
        - { id: 40, name: "Farmer" }
        - { id: 41, name: "Trader" }
      clientLegalFormOptions:
        - { id: 1, value: "PERSON", code: "clientLegalFormType.person" }
        - { id: 2, value: "ENTITY", code: "clientLegalFormType.entity" }
      dateFormat: "dd MMMM yyyy"
      locale: "en"
      # rendered mandatory fields: firstname, lastname, officeId, legalFormId, activationDate
    field_count: 14
    datatable_groups: [client_kyc_details]

  # ── GET /loans/template?templateType=individual&productId=3 ───────────────
  - id: template_loans_create
    entity: loans
    endpoint: "GET /v1/loans/template?templateType=individual&clientId=101&productId=3"
    payload:
      clientId: 101
      loanProductId: 3
      loanProductName: "Group Working Capital"
      productOptions:
        - { id: 3, name: "Group Working Capital" }
        - { id: 6, name: "Individual Business Loan" }
      loanOfficerOptions:
        - { id: 3, displayName: "Ochieng, Grace" }
      loanPurposeOptions:
        - { id: 50, name: "Agriculture" }
        - { id: 51, name: "Retail" }
      termFrequencyTypeOptions:
        - { id: 2, value: "Months", code: "termFrequency.periodFrequencyType.months" }
      repaymentFrequencyTypeOptions:
        - { id: 2, value: "Months", code: "repaymentFrequency.periodFrequencyType.months" }
      amortizationTypeOptions:
        - { id: 1, value: "Equal principal payments" }
        - { id: 0, value: "Equal installments" }
      interestTypeOptions:
        - { id: 0, value: "Declining Balance" }
        - { id: 1, value: "Flat" }
      principal: 500000
      numberOfRepayments: 12
      interestRatePerPeriod: 2.5
      dateFormat: "dd MMMM yyyy"
      locale: "en"
      # calculateLoanSchedule preview available via POST /loans?command=calculateLoanSchedule
    field_count: 22
    datatable_groups: [loan_additional_info]

  # ── GET /savingsaccounts/template?clientId=101&productId=5 ────────────────
  - id: template_savingsaccounts_create
    entity: savingsaccounts
    endpoint: "GET /v1/savingsaccounts/template?clientId=101&productId=5"
    payload:
      clientId: 101
      productId: 5
      productOptions:
        - { id: 5, name: "Passbook Savings" }
      fieldOfficerOptions:
        - { id: 3, displayName: "Ochieng, Grace" }
      nominalAnnualInterestRate: 5.0
      interestCompoundingPeriodTypeOptions:
        - { id: 1, value: "Daily" }
        - { id: 4, value: "Monthly" }
      dateFormat: "dd MMMM yyyy"
      locale: "en"
    field_count: 11
    datatable_groups: []

datatable_schemas:
  # ── GET /v1/datatables?apptable=m_client → columnHeaderData ────────────────
  - id: datatable_client_kyc_details
    entity: clients
    apptable: m_client
    registeredTableName: client_kyc_details
    columnHeaderData:
      - { columnName: national_id, columnType: String, columnLength: 20, isColumnNullable: false }
      - { columnName: id_expiry, columnType: Date, isColumnNullable: true }
      - columnName: kyc_tier
        columnType: Integer
        isColumnNullable: false
        columnCode: KycTier
        columnValues:
          - { id: 1, value: "Tier 1 — basic" }
          - { id: 2, value: "Tier 2 — full" }
  - id: datatable_loan_additional_info
    entity: loans
    apptable: m_loan
    registeredTableName: loan_additional_info
    columnHeaderData:
      - { columnName: business_sector, columnType: String, columnLength: 60, isColumnNullable: true }
      - { columnName: collateral_value, columnType: Decimal, isColumnNullable: true }

outbox_draft:
  # a submit_form result as it sits in framework_submit_drafts before batch replay
  formKey: "client_create"
  uniqueKey: "ext-9f3a2c-onboard-101"
  entity: "clients"
  action: "create"
  idempotency_key: "9f3a2c14-7b1e-4d5a-8c2f-1e6d3b9a0c47"
  status: "PENDING"
  created_at: 1752710400000
  payload:
    officeId: 2
    legalFormId: 1
    firstname: "Amina"
    lastname: "Nakato"
    genderId: 24
    clientTypeId: 30
    externalId: "ext-9f3a2c-onboard-101"
    active: true
    activationDate: "17 July 2026"
    dateFormat: "dd MMMM yyyy"
    locale: "en"
    datatables:
      - registeredTableName: "client_kyc_details"
        data: { national_id: "CF900123456", kyc_tier: 2 }
