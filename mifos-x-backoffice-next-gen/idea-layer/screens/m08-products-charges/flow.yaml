feature: m08-products-charges
entry_points:
  - type: nav_root
    description: "Products & Charges module root — a nav root gated on the product/charge permission group (visible only if the user holds ≥1 of READ_LOANPRODUCT / READ_SAVINGSPRODUCT / READ_CHARGE / READ_FUND / READ_TAXGROUP). Product-admin persona; teller/collections/CSR/auditor see it read-only or not at all."

transitions:
  - from: template-loading
    to: content
    trigger: "product/charge catalog resolved from GET /v1/loanproducts + /v1/charges (+ any open form's GET /{entity}/template) — fresh fetch or offline CACHE_FIRST_SWR cache hit"
  - from: template-loading
    to: empty
    trigger: "catalog + template resolved but the active tab has no items (e.g. no charges defined yet)"
  - from: template-loading
    to: error
    trigger: "catalog/template fetch failed AND no cached copy exists"

  - from: content
    to: content
    trigger: "switch_catalog_tab | search_catalog — active tab / filter changed, catalog re-filtered in place over the cache"
  - from: content
    to: submitting
    trigger: "create_loan_product | create_savings_product | create_charge | create_fund | create_tax_group | edit_product | edit_charge | delete_product | toggle_charge_active — a config write submitted ONLINE with connectivity available"
  - from: content
    to: config-online-only
    trigger: "a config create/edit/delete attempted while offline — product/charge config is online-only + maker-checker, so the write is BLOCKED (never offline-queued), catalog stays readable from cache"

  - from: empty
    to: submitting
    trigger: "empty_create_cta — create the first item of the active tab, submitted ONLINE"
  - from: empty
    to: config-online-only
    trigger: "empty_create_cta attempted while offline — blocked (config online-only)"

  - from: config-online-only
    to: content
    trigger: "dismiss_config_offline_banner OR connectivity returns — return to the read-only catalog; no write was enqueued"

  - from: submitting
    to: content
    trigger: "server returned CommandProcessingResult 2xx — the created/edited product/charge appears in the catalog (or a 'Submitted for approval' checker badge on empty changes under maker-checker)"
  - from: submitting
    to: error
    trigger: "server rejected with 400 validation / 409 conflict (e.g. delete of a product still referenced by accounts) — error body surfaced verbatim against the offending field; a rejected maker-checker submission routes to needs-attention-inbox"

  - from: error
    to: template-loading
    trigger: "retry_load — re-fetch the catalog (and any pending template) via Store5 refreshFresh(); a 403 drift routes to the permission-refresh protocol instead"

terminal_states: [content, empty]
