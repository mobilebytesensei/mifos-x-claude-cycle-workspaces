feature: m08-products-charges

# Read path: the product/charge/fund/tax catalog + each entity's GET /{entity}/template
# are pulled on mount (CACHE_FIRST_SWR) and cached in Room so the console reads offline
# AND the cached option lists feed every loan/savings origination form (M04/M05). Write
# path: a config create/edit is persisted to the durable DraftSubmitHandler outbox for
# exactly-once maker-checker submission — but product/charge config is ONLINE-ONLY, so
# the draft only SUBMITS with connectivity (it is never drained silently later like a
# field transaction). A rejected submission surfaces in needs-attention-inbox.

entries:
  - trigger: on_mount
    source: api.list_loan_products
    target_state: content
    loading_state: template-loading
    error_state: error
    on_error:
      nav_target: null
      error_code: product_catalog_failed
    persistence_contract:
      store: room
      table: products_charges
      mutation: upsert
      keys: [entity_type, entity_id, name, short_name, status, payload_json, fetched_at]
      note: "The unified catalog cache — loan/savings/FD/share products, charges, funds, tax groups, floating rates, delinquency buckets keyed by (entity_type, entity_id). CACHE_FIRST_SWR: the cached catalog renders instantly and also supplies the product/charge/fund/tax option lists that loan & savings forms bind to offline; a background revalidate refreshes it so a back-office config change appears on the next sync with no app release."

  - trigger: on_mount
    source: api.get_charge_template
    target_state: content
    loading_state: template-loading
    error_state: error
    on_error:
      nav_target: null
      error_code: product_template_failed
    persistence_contract:
      store: room
      table: cached_templates
      mutation: upsert
      keys: [entity, command, template_json, fetched_at]
      note: "Each entity's GET /{entity}/template payload (loanproducts / savingsproducts / charges / taxes-group — the largest template envelopes in the API) cached per (entity, command) so the create/edit form renders from the cached schema offline via dynamic-template-forms. CACHE_FIRST_SWR."

  - trigger: on_action
    action: create_charge
    source: api.create_charge
    target_state: submitting
    fallback_state: config-online-only
    error_state: error
    on_error:
      nav_target: null
      error_code: config_command_rejected
    persistence_contract:
      store: room
      table: framework_submit_drafts
      mutation: write
      keys: [formKey, uniqueKey, payload, action, entity, idempotency_key, status, created_at]
      note: "The assembled config-command JsonObject is written to the durable outbox with a UUIDv4 idempotency_key reused on a maker-checker resubmit (exactly-once, zero double-create). BUT product/charge config is ONLINE-ONLY: the draft SUBMITS only with connectivity — it is NOT drained silently on later reconnect like a field transaction. Offline attempt → fallback_state config-online-only (blocked with a connect banner). status PENDING → SUBMITTED | PENDING_APPROVAL | FAILED; a FAILED/rejected row surfaces in needs-attention-inbox."

cache:
  strategy: cache_first_swr
  note: "Product/charge/fund/tax catalog + templates are read-mostly reference data that also power downstream origination forms — serve stale from Room immediately, revalidate in the background. Freshness tracked via the shared FetchedAtEntity TTL. Writes are online-only (not cached-write-behind)."

demo_source: demo-data.yaml
