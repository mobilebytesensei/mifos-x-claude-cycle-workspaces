feature: m08-products-charges
# Real Fineract product/charge/fund/tax payload shapes the console consumes. `loan_products`,
# `savings_products`, `charges`, `funds`, `tax_groups` are faithful GET /{entity} catalog rows;
# `loan_product_template` is a GET /v1/loanproducts/template envelope (the largest template in
# the API, driving the create form option lists); `outbox_draft` is a queued create-charge
# command JsonObject as it sits in the DraftSubmitHandler outbox awaiting an ONLINE maker-checker
# submit. Every field is a real, plausible production value (no filler).

loan_products:
  # ── GET /v1/loanproducts/{id} — a real group business loan, declining-balance ──
  - id: 3
    name: "Group Business Loan"
    shortName: "GBL"
    description: "Working-capital loan for solidarity groups, declining-balance interest."
    fundId: 2
    fundName: "MFI Revolving Fund"
    currency: { code: "USD", decimalPlaces: 2, inMultiplesOf: 1 }
    principal: 500000
    minPrincipal: 50000
    maxPrincipal: 2000000
    numberOfRepayments: 12
    minNumberOfRepayments: 6
    maxNumberOfRepayments: 24
    repaymentEvery: 1
    repaymentFrequencyType: { id: 2, value: "Months" }
    interestRatePerPeriod: 2.0
    annualInterestRate: 24.0
    interestRateFrequencyType: { id: 2, value: "Per month" }
    amortizationType: { id: 1, value: "Equal installments" }
    interestType: { id: 0, value: "Declining Balance" }
    interestCalculationPeriodType: { id: 1, value: "Daily" }
    transactionProcessingStrategyCode: "mifos-standard-strategy"
    accountingRule: { id: 3, value: "Accrual (periodic)" }
    delinquencyBucket: { id: 1, name: "Standard PAR buckets" }
    charges:
      - { id: 5, name: "Loan Processing Fee", amount: 2.0, chargeCalculationType: { id: 2, value: "% Approved Amount" } }
    status: "Active"

  # ── a second, individual, flat-rate product to prove variety ──
  - id: 6
    name: "Individual Micro Loan"
    shortName: "IML"
    currency: { code: "USD", decimalPlaces: 2, inMultiplesOf: 1 }
    principal: 100000
    numberOfRepayments: 10
    repaymentEvery: 2
    repaymentFrequencyType: { id: 2, value: "Months" }
    interestRatePerPeriod: 1.5
    annualInterestRate: 18.0
    amortizationType: { id: 1, value: "Equal installments" }
    interestType: { id: 1, value: "Flat" }
    accountingRule: { id: 1, value: "None" }
    status: "Active"

savings_products:
  - id: 5
    name: "Group Savings"
    shortName: "GSAV"
    currency: { code: "USD", decimalPlaces: 2, inMultiplesOf: 1 }
    nominalAnnualInterestRate: 5.0
    interestCompoundingPeriodType: { id: 1, value: "Daily" }
    interestPostingPeriodType: { id: 4, value: "Monthly" }
    interestCalculationType: { id: 1, value: "Daily Balance" }
    minRequiredOpeningBalance: 500
    lockinPeriodFrequency: 0
    accountingRule: { id: 2, value: "Cash" }
    status: "Active"

charges:
  # ── GET /v1/charges/{id} — a real loan-disbursement processing fee ──
  - id: 5
    name: "Loan Processing Fee"
    active: true
    chargeAppliesTo: { id: 1, value: "Loan" }
    chargeTimeType: { id: 1, value: "Disbursement" }
    chargeCalculationType: { id: 2, value: "% Approved Amount" }
    amount: 2.0
    chargePaymentMode: { id: 0, value: "Regular" }
    currency: { code: "USD", decimalPlaces: 2 }
    incomeAccount: { id: 41, name: "Fees & Commission Income", glCode: "410001" }
    taxGroup: { id: 1, name: "VAT 18%" }
  - id: 8
    name: "Savings Monthly Maintenance"
    active: true
    chargeAppliesTo: { id: 2, value: "Savings" }
    chargeTimeType: { id: 6, value: "Monthly Fee" }
    chargeCalculationType: { id: 1, value: "Flat" }
    amount: 100
    chargePaymentMode: { id: 0, value: "Regular" }
    currency: { code: "USD", decimalPlaces: 2 }

funds:
  - { id: 2, name: "MFI Revolving Fund", externalId: "FUND-REV-01" }
  - { id: 3, name: "Donor Grant Line", externalId: "FUND-DONOR-2026" }

tax_groups:
  - id: 1
    name: "VAT 18%"
    taxComponents:
      - { id: 1, name: "VAT", percentage: 18.0, startDate: "01 January 2024", glAccount: { id: 61, name: "VAT Payable", glCode: "610001" } }

loan_product_template:
  # ── GET /v1/loanproducts/template — envelope of defaults + *Options[] the create form binds ──
  endpoint: "GET /v1/loanproducts/template"
  payload:
    currencyOptions:
      - { code: "USD", name: "US Dollar", decimalPlaces: 2 }
      - { code: "KES", name: "Kenyan Shilling", decimalPlaces: 2 }
    interestTypeOptions:
      - { id: 0, value: "Declining Balance" }
      - { id: 1, value: "Flat" }
    amortizationTypeOptions:
      - { id: 0, value: "Equal principal payments" }
      - { id: 1, value: "Equal installments" }
    interestCalculationPeriodTypeOptions:
      - { id: 0, value: "Same as repayment period" }
      - { id: 1, value: "Daily" }
    repaymentFrequencyTypeOptions:
      - { id: 0, value: "Days" }
      - { id: 1, value: "Weeks" }
      - { id: 2, value: "Months" }
    accountingRuleOptions:
      - { id: 1, value: "None" }
      - { id: 2, value: "Cash" }
      - { id: 3, value: "Accrual (periodic)" }
      - { id: 4, value: "Accrual (upfront)" }
    fundOptions:
      - { id: 2, name: "MFI Revolving Fund" }
      - { id: 3, name: "Donor Grant Line" }
    chargeOptions:
      - { id: 5, name: "Loan Processing Fee", chargeCalculationType: { id: 2, value: "% Approved Amount" } }
    delinquencyBucketOptions:
      - { id: 1, name: "Standard PAR buckets" }
    transactionProcessingStrategyOptions:
      - { code: "mifos-standard-strategy", name: "Penalties, Fees, Interest, Principal order" }
    accountingMappingOptions:
      assetAccountOptions:
        - { id: 11, name: "Loan Portfolio", glCode: "110001" }
      incomeAccountOptions:
        - { id: 41, name: "Fees & Commission Income", glCode: "410001" }
        - { id: 42, name: "Interest Income", glCode: "410002" }
    dateFormat: "dd MMMM yyyy"
    locale: "en"
  field_count: 34
  note: "The loan-product template is the largest create-form envelope in the API — 30+ base fields plus GL-mapping sub-forms per accounting rule; dynamic-template-forms renders all of it from this payload."

outbox_draft:
  # a create_charge submission as it sits in framework_submit_drafts awaiting an ONLINE maker-checker submit
  formKey: "charge_create"
  uniqueKey: "cfg-charge-late-penalty-01"
  entity: "charges"
  action: "create"
  idempotency_key: "b71c9d40-2e6a-4f18-9a3b-5c2d81e07f44"
  status: "PENDING"
  submit_policy: "online_only"
  created_at: 1752710400000
  payload:
    name: "Loan Late Repayment Penalty"
    chargeAppliesTo: 1
    chargeTimeType: 9
    chargeCalculationType: 1
    amount: 250
    chargePaymentMode: 0
    currencyCode: "USD"
    active: true
    penalty: true
    incomeAccountId: 41
    taxGroupId: 1
    locale: "en"
