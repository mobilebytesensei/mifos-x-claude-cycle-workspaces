appId: org.mifos.backoffice
---
# M08 Products & Charges happy path — open the product/charge console, switch the catalog
# tab, drill into a catalog item's detail, then open the create-charge form (rendered from
# the entity template; config write is online-only + maker-checker).
# TestTags match screens/m08-products-charges/ui.yaml components verbatim.
- launchApp
- assertVisible:
    id: "m08-products-charges_header"
- assertVisible:
    id: "m08-products-charges_content"
# Switch the catalog tab (Loan / Savings / Charges / ...) over the cached catalog
- tapOn:
    id: "m08-products-charges_tabs"
- assertVisible:
    id: "m08-products-charges_content"
# Drill into the first catalog item → product/charge detail
- tapOn:
    id: "m08-products-charges_item"
- assertVisible:
    id: "m08-products-charges_header"
# Open the create-charge form (dynamic-template-forms; config write is online-only + maker-checker)
- tapOn:
    id: "m08-products-charges_create_charge"
- assertVisible:
    id: "m08-products-charges_header"
