schema_version: v1.0.0
feature: nav-shell-assembler
scenarios:
  - id: field_officer_nav_roots_visible
    preconditions: ["OFICIAL DE CAMPO signs in (149 codes, no APPROVE_LOAN/DISBURSE_LOAN)"]
    actions: ["complete sign-in and capability bootstrap"]
    assertions:
      - "Clients, Groups/Centers, Loans, Savings, Collections, Sync roots visible"
      - "Accounting, Products, Organization, Users, Tellers, Reports, Approvals, Scheduler, Communications, Datatables roots HIDDEN"
      - "Bottom bar shows exactly the field-officer priority roots (max 5)"
    priority: high

  - id: super_user_sees_all_17_roots
    preconditions: ["Super user signs in (ALL_FUNCTIONS umbrella)"]
    actions: ["complete sign-in"]
    assertions:
      - "All 17 module roots visible in the drawer"
      - "No root is hidden"
      - "Users / Roles / Accounting / Products all reachable"
    priority: high

  - id: teller_sees_money_movement_roots
    preconditions: ["CAJERO signs in (75 codes)"]
    actions: ["complete sign-in"]
    assertions:
      - "Savings, Loans (repayment), Tellers/Cash, Clients (read-only) visible"
      - "Collections, Accounting, Users/Roles, Organization hidden"
      - "Approve/Disburse actions in Loan detail grayed-out with info dialog"
    priority: high

  - id: empty_permission_shows_empty_state
    preconditions: ["user with zero permission codes signs in"]
    actions: ["complete sign-in"]
    assertions:
      - "No nav roots shown"
      - "Empty state card shown: 'No modules available for your access level'"
      - "Logout option available"
    priority: medium

  - id: permission_refresh_rebuilds_nav_in_place
    preconditions: ["field officer signed in", "a 403 response received from a module API call"]
    actions: ["permission-capability-engine refreshes the PermissionSet (403-drift)", "assembler receives the new permission set"]
    assertions:
      - "Nav roster rebuilt in-place without a full app restart"
      - "If a previously visible root is now forbidden, it disappears from the nav"
      - "Snackbar: 'Your access was updated' shown once"
    priority: high

  - id: server_switch_triggers_reassembly
    preconditions: ["user authenticated on sandbox (2 roles)", "user switches to primary instance (15 roles)"]
    actions: ["network-config save → re-auth on primary → new PermissionSet emitted"]
    assertions:
      - "NavRoster rebuilt for the new tenant's permission set"
      - "Additional roots appear (if new tenant grants more permissions)"
      - "Previously-visible roots hidden if the new tenant revokes them"
    priority: medium

  - id: nav_root_tap_navigates_to_module
    preconditions: ["field officer signed in", "assembled state"]
    actions: ["tap Clients root in bottom bar"]
    assertions:
      - "Content pane navigates to m02-clients"
      - "Clients root is highlighted as selected"
      - "Shell chrome (header + nav) stays stable"
    priority: high

  - id: user_profile_chip_opens_permission_detail
    preconditions: ["user signed in", "on tablet/desktop with permanent drawer visible"]
    actions: ["tap user profile chip in drawer header"]
    assertions:
      - "permission-set-detail screen opens"
      - "All held permission codes listed grouped by Fineract entity"
      - "Fingerprint / module-access summary shown"
    priority: low

  - id: network_config_accessible_from_drawer
    preconditions: ["user signed in", "assembled state"]
    actions: ["tap Network configuration in drawer footer"]
    assertions:
      - "network-config screen opens"
      - "Current server URL + tenant displayed"
    priority: medium

  - id: assembler_resolves_without_network
    preconditions: ["user with a valid persisted encrypted session", "device fully offline on cold start"]
    actions: ["launch app offline"]
    assertions:
      - "NavRoster assembled from the encrypted cached PermissionSet (no network call)"
      - "All expected nav roots visible"
      - "Offline banner shown in each module; sync CTAs disabled"
    priority: high
