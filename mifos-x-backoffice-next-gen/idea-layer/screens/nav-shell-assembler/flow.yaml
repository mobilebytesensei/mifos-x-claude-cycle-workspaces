feature: nav-shell-assembler
entry_points:
  - type: post_login
    description: "Automatically entered after fineract-auth-session establishes an authenticated session and permission-capability-engine bootstraps the PermissionSet. The assembler is the first surface the user sees after login."
  - type: session_restore
    description: "On cold start with a valid persisted session — the assembler reads the encrypted PermissionSet and renders the role-appropriate shell immediately, before any API call."

transitions:
  # ── bootstrap ──
  - from: resolving
    to: assembled
    trigger: "PermissionStateHolder emits the resolved PermissionSet → NavRoster built (≥1 root visible)"
  - from: resolving
    to: empty
    trigger: "PermissionSet resolved but ALL 17 module families return zero codes (edge case: empty role)"
  - from: resolving
    to: error
    trigger: "PermissionStateHolder unavailable or CapabilityMap unreadable"

  # ── error recovery ──
  - from: error
    to: resolving
    trigger: "retry_assembly → re-read PermissionStateHolder"

  # ── runtime permission refresh (403-drift, server switch, re-auth) ──
  - from: assembled
    to: resolving
    trigger: "permission-capability-engine emits a new PermissionSet (403-drift refresh or server-switch re-auth)"
  - from: resolving
    to: assembled
    trigger: "re-assembly completes → updated NavRoster applied in-place (no app restart, no flicker)"

  # ── nav root navigation ──
  - from: assembled
    to: assembled
    trigger: "navigate_to_module → content pane changes to the selected module (shell chrome stays; current root highlighted)"

  # ── network config ──
  - from: assembled
    to: assembled
    trigger: "open_network_config → network-config screen opens (modal or separate backstack entry)"

  # ── session profile ──
  - from: assembled
    to: assembled
    trigger: "open_session_profile → permission-set-detail opens over the current content"
