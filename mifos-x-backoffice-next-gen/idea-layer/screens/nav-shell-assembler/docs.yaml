permissions_gate: >-
  Post-login only — the assembler reads the resolved PermissionSet (already bootstrapped by permission-capability-engine
  on sign-in). It has no own server permission gate; every authenticated user sees some assembler surface. Individual
  nav roots are HIDDEN when the user holds zero codes in that module's family (fail-closed, §4.7 Tier 1).
contracts:
  apis: []
  tables:
    - name: permission_state
      backend: in_memory
      note: >-
        PermissionStateHolder — holds the resolved PermissionSet + CapabilityMap built at login. Read-only here; written
        by permission-capability-engine.
    - name: capability_map
      backend: in_memory
      note: Remote-updatable CapabilityMap (module → permission family mapping). Read-only here.
    - name: app_settings
      backend: multiplatform_settings
      keys:
        - active_tenant
        - locale
        - theme_mode
      note: Device/session preferences (tenant display, locale, theme) shown in the header/drawer footer.
  dtos:
    - name: PermissionSet
      role: read
      note: Resolved set of {ACTION}_{ENTITY} codes; short-circuits on ALL_FUNCTIONS umbrella.
    - name: CapabilityMap
      role: read
      note: Module → {moduleId, permissionFamily[]} mapping used to resolve each root's gating.
    - name: NavRoot
      role: model
      note: 'A single permitted module entry-point: {moduleId, label, icon, target, order, visible}.'
    - name: NavRoster
      role: model
      note: Ordered list of permitted NavRoot items — the resolved assembly fed to the adaptive shell.
libraries:
  core_modules:
    - core/permissions
    - core/datastore
  training_surfaces:
    - training-layer/instructions/stream-first/latest/CORE_STORE.md
vm_actions:
  - action: Internal.AssembleNavRoster
    handler: >-
      Read PermissionSet from PermissionStateHolder and CapabilityMap; for each of the 17 module roots, evaluate
      PermissionEvaluator.hasAnyFamily(moduleId) → include root only if result is true (ALL_FUNCTIONS short-circuits to
      all 17 visible); sort by role-priority order; split into bottomBarRoots (≤5, phone-priority items) and drawerRoots
      (all permitted).
  - action: OnNavRootTap
    maps_to_on_click: navigate_to_module
    handler: >-
      sendEvent(NavigateToModule(moduleId)); the target module screen handles its own permission gating for features and
      actions within it (§4.7 Tier 2 + Tier 3).
  - action: Internal.OnPermissionRefreshed
    handler: >-
      Re-run Internal.AssembleNavRoster whenever PermissionStateHolder emits a new set (e.g. after a 403-drift refresh
      or server switch → re-auth). Nav roster is rebuilt and re-rendered without restarting the app.
  - action: OnNetworkConfigTap
    maps_to_on_click: open_network_config
    handler: sendEvent(NavigateToNetworkConfig).
  - action: OnProfileTap
    maps_to_on_click: open_session_profile
    handler: Emit NavigateToPermissionSetDetail for the user's resolved permission detail.
error_cases:
  - code: permission_state.unavailable
    ux: >-
      error state — 'Could not assemble your workspace. Tap to retry.' with a Retry that re-reads the
      PermissionStateHolder; the last-known encrypted PermissionSet is used if available.
  - code: all_roots_hidden
    ux: >-
      empty state — 'No modules are available for your access level. Please contact your administrator.' shown when the
      resolved roster is empty (zero family codes across all 17 modules).
  - code: navigation.module_403
    ux: >-
      permission-capability-engine refreshes the PermissionSet; nav roster is re-pruned; a snackbar 'Your access was
      updated — some areas may have changed.' notifies once.
test_fixtures:
  - >-
    OFICIAL DE CAMPO (149 codes) signs in → nav shows Clients / Centers / Groups / Collections / Sync (5 roots);
    Users/Roles/Accounting roots hidden
  - >-
    Super user (ALL_FUNCTIONS) signs in → all 17 module roots visible in drawer; phone bottom bar shows
    Home/Clients/Approvals/Settings/Reports (top-5 by priority)
  - >-
    CAJERO (75 codes) signs in → Clients (read), Savings, Tellers/Cash, Sync visible; Loans visible (READ_LOAN present);
    admin roots hidden
  - 403 drift received → PermissionSet refreshed → nav roster rebuilt in-place without app restart
  - Empty permission set → empty state shown ('No modules available for your access level')
acceptance_refs:
  - plan: idea-plan.yaml#features[nav-shell-assembler]
  - evolve: evolve-plans/20260801-role-based-app-assembly.md §CP-B B2, §CP-C C1
summary: >-
  The authenticated app-shell host that renders the role-appropriate navigation surface from the resolved PermissionSet.
  After sign-in, reads PermissionStateHolder + CapabilityMap and builds a NavRoster of the module entry-points the user
  is permitted to see (fail-closed: HIDDEN when zero family codes). Adaptive: bottom bar (phone, ≤5 priority roots) ·
  navigation rail (tablet) · permanent drawer (desktop, all permitted roots). The assembler re-runs whenever the
  PermissionSet is refreshed (403-drift, server switch, re-auth) without restarting the app. This is the keystone that
  converts 13 orphan module screens into reachable surfaces and realizes the "same binary, every role" assembly contract
  (§CP-C G1).
