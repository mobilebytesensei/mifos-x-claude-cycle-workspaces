<!doctype html>
<!-- state: resolving | feature: nav-shell-assembler | render-hash: navshell1res0 -->
<!-- scenario: warm-start shimmer (<100ms) — last-known 5-root roster shown as shimmer placeholders -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nav Shell Assembler — resolving</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary:#0091EA;--on-primary:#FFFFFF;--primary-container:#CBE6FF;--on-primary-container:#001E30;
  --secondary:#00796B;--on-secondary:#FFFFFF;--secondary-container:#B8F2E6;--on-secondary-container:#00201A;
  --surface:#FCFCFF;--on-surface:#1A1C1E;--surface-variant:#DEE3EB;--on-surface-variant:#42474E;
  --surface-container-low:#F3F4F9;--surface-container:#EDEFF4;--background:#FCFCFF;
  --outline:#72777F;--outline-variant:#C2C7CF;
  --font-body:system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,'Courier New',monospace;
  --fs-title:1.125rem;--fs-label:0.875rem;--fs-caption:0.75rem;--fs-caption-sm:0.6875rem;
  --fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:9999px;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  --el-1:0 1px 2px rgba(0,0,0,.05);--el-2:0 2px 6px rgba(0,0,0,.08);
  --border-w:1px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100dvh;background:#E8EAF0;font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start}
.phone{width:360px;min-height:100dvh;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.14)}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;background:var(--surface);font-size:12px;font-weight:var(--fw-semibold);color:var(--on-surface);flex-shrink:0}
.status-icons{display:flex;gap:5px;align-items:center}
.status-icons .material-symbols-outlined{font-size:16px!important}
/* shimmer animation */
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sh{background:linear-gradient(90deg,var(--surface-variant) 25%,var(--outline-variant) 50%,var(--surface-variant) 75%);background-size:200% 100%;animation:shimmer 1.5s ease infinite;border-radius:var(--r-sm)}
/* top app bar shimmer */
.top-bar{display:flex;align-items:center;gap:8px;padding:4px 12px 8px;background:var(--surface);border-bottom:var(--border-w) solid var(--outline-variant);box-shadow:var(--el-1);flex-shrink:0}
.bar-icon-sh{width:36px;height:36px;border-radius:var(--r-full)}
.bar-title-sh{height:18px;border-radius:4px}
.bar-chip-sh{height:28px;border-radius:var(--r-full);margin-left:auto}
/* main content shimmer */
.main{flex:1;display:flex;flex-direction:column;gap:12px;padding:var(--sp-md);overflow:hidden}
/* KPI card row shimmer */
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi-card-sh{height:88px;border-radius:var(--r-lg);background:var(--surface-variant)}
/* list section shimmer */
.section-head-sh{height:14px;width:120px;border-radius:4px;margin-bottom:4px}
.list-card{background:var(--surface);border:var(--border-w) solid var(--outline-variant);border-radius:var(--r-lg);overflow:hidden}
.list-row-sh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:var(--border-w) solid var(--surface-variant)}
.list-row-sh:last-child{border-bottom:none}
.li-avatar-sh{width:40px;height:40px;border-radius:var(--r-md);flex-shrink:0}
.li-body-sh{flex:1;display:flex;flex-direction:column;gap:6px}
.li-name-sh{height:14px;border-radius:4px}
.li-sub-sh{height:11px;border-radius:4px;width:65%}
.li-trail-sh{width:48px;height:12px;border-radius:4px;margin-left:auto;flex-shrink:0}
/* chip strip shimmer */
.chip-strip{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden}
.chip-sh{height:26px;border-radius:var(--r-full);flex-shrink:0}
/* bottom nav shimmer */
.bottom-nav{display:flex;background:var(--surface);border-top:var(--border-w) solid var(--outline-variant);padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0));flex-shrink:0}
.nav-item-sh{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px}
.nav-icon-sh{width:56px;height:28px;border-radius:var(--r-full)}
.nav-label-sh{height:10px;width:36px;border-radius:4px}
/* resolving state label */
.resolving-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20}
.main-wrap{flex:1;position:relative;overflow:hidden}
.spinner{width:28px;height:28px;border:3px solid var(--primary-container);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.resolving-label{font-size:var(--fs-caption);color:var(--on-surface-variant);font-weight:var(--fw-medium)}
</style>
</head>
<body>
<div class="phone">

  <!-- status bar -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </div>
  </div>

  <!-- top app bar — shimmer -->
  <div class="top-bar">
    <div class="sh bar-icon-sh" style="width:40px;height:40px" aria-hidden="true"></div>
    <div class="sh bar-title-sh" style="width:140px" aria-hidden="true"></div>
    <div class="sh bar-chip-sh" style="width:100px" aria-hidden="true"></div>
  </div>

  <!-- main content — shimmer over last-known layout -->
  <div class="main-wrap" aria-busy="true" aria-label="Assembling navigation workspace" role="status">

    <main class="main" aria-hidden="true">

      <!-- chip strip (role/module filters shimmer) -->
      <div class="chip-strip">
        <div class="sh chip-sh" style="width:80px"></div>
        <div class="sh chip-sh" style="width:64px"></div>
        <div class="sh chip-sh" style="width:96px"></div>
        <div class="sh chip-sh" style="width:72px"></div>
      </div>

      <!-- KPI cards shimmer (2-col) -->
      <div class="kpi-row">
        <div class="sh kpi-card-sh"></div>
        <div class="sh kpi-card-sh"></div>
        <div class="sh kpi-card-sh"></div>
        <div class="sh kpi-card-sh"></div>
      </div>

      <!-- section label + list -->
      <div>
        <div class="sh section-head-sh"></div>
        <div class="list-card" style="margin-top:8px">
          <div class="list-row-sh">
            <div class="sh li-avatar-sh"></div>
            <div class="li-body-sh">
              <div class="sh li-name-sh" style="width:55%"></div>
              <div class="sh li-sub-sh"></div>
            </div>
            <div class="sh li-trail-sh"></div>
          </div>
          <div class="list-row-sh">
            <div class="sh li-avatar-sh"></div>
            <div class="li-body-sh">
              <div class="sh li-name-sh" style="width:70%"></div>
              <div class="sh li-sub-sh" style="width:50%"></div>
            </div>
            <div class="sh li-trail-sh"></div>
          </div>
          <div class="list-row-sh">
            <div class="sh li-avatar-sh"></div>
            <div class="li-body-sh">
              <div class="sh li-name-sh" style="width:60%"></div>
              <div class="sh li-sub-sh" style="width:45%"></div>
            </div>
            <div class="sh li-trail-sh"></div>
          </div>
        </div>
      </div>

    </main>

    <!-- centered resolving indicator -->
    <div class="resolving-badge" role="status" aria-label="Assembling navigation workspace — reading permission set">
      <div class="spinner" aria-hidden="true"></div>
      <span class="resolving-label">Assembling workspace…</span>
    </div>

  </div>

  <!-- bottom nav — shimmer (5 last-known roots) -->
  <div class="bottom-nav" aria-hidden="true">
    <div class="nav-item-sh">
      <div class="sh nav-icon-sh"></div>
      <div class="sh nav-label-sh"></div>
    </div>
    <div class="nav-item-sh">
      <div class="sh nav-icon-sh"></div>
      <div class="sh nav-label-sh"></div>
    </div>
    <div class="nav-item-sh">
      <div class="sh nav-icon-sh"></div>
      <div class="sh nav-label-sh"></div>
    </div>
    <div class="nav-item-sh">
      <div class="sh nav-icon-sh"></div>
      <div class="sh nav-label-sh"></div>
    </div>
    <div class="nav-item-sh">
      <div class="sh nav-icon-sh"></div>
      <div class="sh nav-label-sh"></div>
    </div>
  </div>

</div>
</body>
</html>
