    note: "Any *_CHECKER code qualifies; the family list is a representative sample."

  - id: m16-communications
    label: "{strings.nav_communications}"
    icon: "campaign"
    target: m16-communications
    order: 16
    permission_family: ["READ_SMSCAMPAIGN", "CREATE_SMSCAMPAIGN", "READ_REPORTMAILINGJOB"]
    required_permission: "READ_SMSCAMPAIGN"
    denied_behavior: hide-root

  - id: m17-sync-settings
    label: "{strings.nav_settings}"
    icon: "settings"
    target: m17-sync-settings
    order: 17
    permission_family: []
    required_permission: null
    note: "Always visible — sync console + settings are available to every authenticated persona."
    denied_behavior: never_hidden

# ── Interactive components ──────────────────────────────────────────────
components:
  - id: nav_shell_host
    type: adaptive_nav_host
    testTag: "nav-shell-assembler_host"
    description: "Material3 NavigationSuiteScaffold — renders bottom bar (phone), rail (tablet), permanent drawer (desktop) from the resolved NavRoster."
    state_bindings:
      resolving: "shimmer placeholder with last-known roots"
      assembled: "resolved NavRoster rendered adaptive"
      empty: "empty state card"
      error: "error card + Retry"

  - id: nav_root_item
    type: nav_item
    testTag: "nav-shell-assembler_root_{moduleId}"
    description: "One permitted module root. Hidden entirely when the user has zero codes in the module's permission_family (fail-closed). Never grayed-out (Tier 1 = hide, not disable)."
    accessibility_label: "Navigate to {moduleLabel} module"
    on_click:
      action: navigate_to_module
      action_contract:
        effect: navigate
        required_permission: ""
        denied_behavior: hide-root
        description: "Navigate to the module root screen. The item is already hidden when the user lacks the module family — this click fires only when the root is visible. The module's own screens enforce Tier 2 (feature reachability) and Tier 3 (action gating) from their own permission checks."

  - id: user_profile_chip
    type: chip
    label: "{currentUserName} · {officeName}"
    testTag: "nav-shell-assembler_profile_chip"
    description: "Shown in the drawer header (desktop/tablet) — displays the signed-in user's name and office. Tapping opens the resolved PermissionSet detail."
    accessibility_label: "View your permission set and session profile"
    on_click:
      action: open_session_profile
      target: permission-set-detail
      action_contract:
        effect: navigate
        required_permission: ""
        denied_behavior: gray-out-info-dialog
        description: "Navigate to the read-only resolved PermissionSet detail screen, which lists every held permission code grouped by Fineract entity, plus the capability map fingerprint. Available to all authenticated users."

  - id: network_config_drawer_item
    type: nav_item
    label: "{strings.nav_network_config}"
    icon: "wifi"
    testTag: "nav-shell-assembler_network_config"
    description: "Quick-access Network configuration entry in the drawer footer — opens network-config without requiring a nav root slot."
    accessibility_label: "Open network configuration settings"
    on_click:
      action: open_network_config
      target: network-config
      action_contract:
        effect: navigate
        required_permission: ""
        denied_behavior: gray-out-info-dialog
        description: "Open the network-config screen (server URL + tenant + credential editor). Available to all authenticated users — not permission-gated."

  - id: retry_button
    type: button
    label: "{strings.nav_shell_retry}"
    testTag: "nav-shell-assembler_retry"
    variant: primary
    visible_states: [error]
    accessibility_label: "Retry assembling your workspace navigation"
    on_click:
      action: retry_assembly
      action_contract:
        effect: call_api
        required_permission: ""
        denied_behavior: gray-out-info-dialog
        reads_from:
          - table: permission_state
        description: "Re-read the PermissionStateHolder and re-run the NavRoster assembly. Does not trigger a new login — uses the in-memory PermissionSet (or the last encrypted backup if memory was cleared). Available to all authenticated users."
