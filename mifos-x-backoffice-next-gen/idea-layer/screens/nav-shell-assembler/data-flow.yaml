feature: nav-shell-assembler
entries:
  # ── primary: read resolved PermissionSet on mount + on refresh events ──
  - trigger: on_mount
    source: local.permission_state_holder
    target_state: assembled
    loading_state: resolving
    error_state: error
    on_error:
      nav_target: null
      error_code: permission_state.unavailable
    persistence_contract:
      store: in_memory
      keys: [permission_set, capability_map]
      note: >-
        PermissionStateHolder is an in-memory StateFlow populated by permission-capability-engine
        at login and refreshed on 403-drift. The assembler collects it as a Kotlin Flow — no Room
        read, no network call. If the in-memory state was cleared (process killed) the encrypted
        backup in multiplatform-settings is read as a fallback by permission-capability-engine
        before this assembler runs.

  # ── re-assembly on permission refresh events ──
  - trigger: on_event
    action: permission_refreshed
    source: local.permission_state_holder
    target_state: assembled
    loading_state: resolving
    error_state: error
    on_error:
      nav_target: null
      error_code: permission_state.unavailable
    persistence_contract:
      store: in_memory
      keys: [permission_set, capability_map]
      note: >-
        Observed via PermissionStateHolder.permissionSetFlow.collect{}. Every emission (403-drift
        refresh, server-switch re-auth) triggers a full NavRoster re-build. The existing nav host
        updates in-place without restarting the composition.

  # ── device/session preferences for header/drawer footer display ──
  - trigger: on_mount
    source: local.app_settings
    target_state: assembled
    loading_state: resolving
    error_state: error
    on_error:
      nav_target: null
      error_code: settings_read_failed
    persistence_contract:
      store: multiplatform_settings
      keys: [active_tenant, locale, theme_mode]
      note: "Plain multiplatform-settings — read-only here; written by m17-sync-settings preferences."
