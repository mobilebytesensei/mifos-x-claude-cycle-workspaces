appId: org.mifos.backoffice
---
# Nav Shell Assembler — happy path: sign in as OFICIAL DE CAMPO (field officer),
# verify only the field-ops nav roots are assembled (admin roots hidden),
# navigate to a permitted module, then verify the shell chrome stays stable.
- launchApp
# After sign-in the assembler should have resolved the NavRoster
- assertVisible:
    id: "nav-shell-assembler_host"
# Field-officer permitted roots should be visible
- assertVisible:
    id: "nav-shell-assembler_root_m01-dashboard"
- assertVisible:
    id: "nav-shell-assembler_root_m02-clients"
- assertVisible:
    id: "nav-shell-assembler_root_m06-collections"
- assertVisible:
    id: "nav-shell-assembler_root_m17-sync-settings"
# Admin / config roots must be absent (fail-closed Tier 1 hiding)
- assertNotVisible:
    id: "nav-shell-assembler_root_m10-users-roles-permissions"
- assertNotVisible:
    id: "nav-shell-assembler_root_m07-accounting"
- assertNotVisible:
    id: "nav-shell-assembler_root_m08-products-charges"
# Navigate to Clients and verify shell chrome remains stable
- tapOn:
    id: "nav-shell-assembler_root_m02-clients"
- assertVisible:
    id: "m02-clients_header"
- assertVisible:
    id: "nav-shell-assembler_root_m02-clients"
# Network config accessible from the drawer
- assertVisible:
    id: "nav-shell-assembler_network_config"
