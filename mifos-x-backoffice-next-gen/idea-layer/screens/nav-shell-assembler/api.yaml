feature: nav-shell-assembler
# The nav-shell assembler makes NO direct API calls — it reads from the in-memory
# PermissionStateHolder that was populated by permission-capability-engine at login
# (POST /authentication → permissions[]). The CapabilityMap is loaded from a cached
# remote source by permission-capability-engine; this feature consumes it read-only.
# No server layer is built (has_api: false / has_server: false).
endpoints: []
notes:
  - "All permission data is available in-memory from PermissionStateHolder (loaded at login by fineract-auth-session + permission-capability-engine). Nav assembly is a pure local computation — no network call, fully offline."
  - "A 403 received by any module's screen triggers a PermissionSet refresh in permission-capability-engine; the resulting new set is emitted via PermissionStateHolder and causes this assembler to re-run Internal.AssembleNavRoster automatically."
