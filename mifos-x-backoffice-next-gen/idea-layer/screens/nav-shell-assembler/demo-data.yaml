feature: nav-shell-assembler

# Real Fineract permission scenarios from mifos-bank-2.mifos.community (role id / real grant).
# Each scenario shows the assembled NavRoster that results from the permission set.
# state_reference covers the transient resolving and error states.

scenarios:
  # ── Scenario 1: OFICIAL DE CAMPO (role 12, 149 codes — maker, no approve/disburse) ──
  - id: field_officer_roster
    role: "OFICIAL DE CAMPO"
    role_id: 12
    permission_sample: ["READ_CLIENT", "CREATE_CLIENT", "READ_LOAN", "CREATE_LOAN", "READ_GROUP", "CREATE_GROUP", "READ_CENTER", "CREATE_CENTER", "READ_COLLECTIONSHEET", "SAVECOLLECTIONSHEET_CENTER", "READ_SAVINGSACCOUNT", "CREATE_SAVINGSACCOUNT", "REPAYMENT_LOAN", "DEPOSIT_SAVINGSACCOUNT"]
    has_all_functions: false
    assembled_roots:
      - { id: m01-dashboard, visible: true, reason: "always visible" }
      - { id: m02-clients,   visible: true, reason: "READ_CLIENT ✓" }
      - { id: m03-groups-centers, visible: true, reason: "READ_GROUP + READ_CENTER ✓" }
      - { id: m04-loan-portfolio, visible: true, reason: "READ_LOAN + CREATE_LOAN ✓ (APPROVE_LOAN absent → approve action grayed-out inside)" }
      - { id: m05-savings-deposits-shares, visible: true, reason: "READ_SAVINGSACCOUNT ✓" }
      - { id: m06-collections, visible: true, reason: "READ_COLLECTIONSHEET ✓" }
      - { id: m07-accounting, visible: false, reason: "zero accounting codes" }
      - { id: m08-products-charges, visible: false, reason: "zero product codes" }
      - { id: m09-organization, visible: false, reason: "zero org codes" }
      - { id: m10-users-roles-permissions, visible: false, reason: "zero user-admin codes" }
      - { id: m11-tellers-cash, visible: false, reason: "zero teller codes" }
      - { id: m12-datatables-config, visible: false, reason: "zero datatable codes" }
      - { id: m13-scheduler-jobs, visible: false, reason: "zero scheduler codes" }
      - { id: m14-reports-search-audit, visible: false, reason: "zero report codes" }
      - { id: m15-approvals-makerchecker, visible: false, reason: "zero checker codes" }
      - { id: m16-communications, visible: false, reason: "zero SMS campaign codes" }
      - { id: m17-sync-settings, visible: true, reason: "always visible" }
    bottom_bar_roots: [m01-dashboard, m02-clients, m06-collections, m03-groups-centers, m17-sync-settings]
    drawer_roots_count: 7

  # ── Scenario 2: Super user (role 1, ALL_FUNCTIONS umbrella) ──
  - id: super_user_roster
    role: "Super user"
    role_id: 1
    permission_sample: ["ALL_FUNCTIONS", "CHECKER_SUPER_USER"]
    has_all_functions: true
    assembled_roots:
      - { id: m01-dashboard, visible: true }
      - { id: m02-clients, visible: true }
      - { id: m03-groups-centers, visible: true }
      - { id: m04-loan-portfolio, visible: true }
      - { id: m05-savings-deposits-shares, visible: true }
      - { id: m06-collections, visible: true }
      - { id: m07-accounting, visible: true }
      - { id: m08-products-charges, visible: true }
      - { id: m09-organization, visible: true }
      - { id: m10-users-roles-permissions, visible: true }
      - { id: m11-tellers-cash, visible: true }
      - { id: m12-datatables-config, visible: true }
      - { id: m13-scheduler-jobs, visible: true }
      - { id: m14-reports-search-audit, visible: true }
      - { id: m15-approvals-makerchecker, visible: true }
      - { id: m16-communications, visible: true }
      - { id: m17-sync-settings, visible: true }
    bottom_bar_roots: [m01-dashboard, m02-clients, m15-approvals-makerchecker, m14-reports-search-audit, m17-sync-settings]
    drawer_roots_count: 17

  # ── Scenario 3: CAJERO (role 9, 75 codes — teller/cashier) ──
  - id: teller_roster
    role: "CAJERO"
    role_id: 9
    permission_sample: ["READ_SAVINGSACCOUNT", "DEPOSIT_SAVINGSACCOUNT", "WITHDRAWAL_SAVINGSACCOUNT", "REPAYMENT_LOAN", "READ_LOAN", "READ_CLIENT", "ALLOCATECASHTOCASHIER_TELLER", "SETTLECASHFROMCASHIER_TELLER", "READ_TELLER"]
    has_all_functions: false
    assembled_roots:
      - { id: m01-dashboard, visible: true }
      - { id: m02-clients, visible: true, reason: "READ_CLIENT ✓ (read-only; Create hidden)" }
      - { id: m03-groups-centers, visible: false }
      - { id: m04-loan-portfolio, visible: true, reason: "READ_LOAN + REPAYMENT_LOAN ✓" }
      - { id: m05-savings-deposits-shares, visible: true, reason: "DEPOSIT/WITHDRAWAL ✓" }
      - { id: m06-collections, visible: false }
      - { id: m07-accounting, visible: false }
      - { id: m08-products-charges, visible: false }
      - { id: m09-organization, visible: false }
      - { id: m10-users-roles-permissions, visible: false }
      - { id: m11-tellers-cash, visible: true, reason: "READ_TELLER + allocate/settle ✓" }
      - { id: m12-datatables-config, visible: false }
      - { id: m13-scheduler-jobs, visible: false }
      - { id: m14-reports-search-audit, visible: false }
      - { id: m15-approvals-makerchecker, visible: false }
      - { id: m16-communications, visible: false }
      - { id: m17-sync-settings, visible: true }
    bottom_bar_roots: [m01-dashboard, m05-savings-deposits-shares, m04-loan-portfolio, m11-tellers-cash, m17-sync-settings]
    drawer_roots_count: 6

  # ── Scenario 4: Empty permission set (edge case — freshly provisioned account) ──
  - id: empty_permission_roster
    role: "ANALISTA DE PRESTAMOS (empty)"
    role_id: 15
    permission_sample: []
    has_all_functions: false
    assembled_roots: []
    bottom_bar_roots: []
    drawer_roots_count: 0
    ux: "empty state: 'No modules are available for your access level. Please contact your administrator.'"

# ── State reference data (transient states without a persistent scenario) ────────
state_reference:
  resolving:
    description: "Shimmer placeholder shown for <100ms on warm start while the PermissionSet StateFlow emits. The last-known roster (max 5 roots from the previous session) is rendered as gray shimmer items."
    shimmer_root_count: 5
    sample_roots_shimmer: [m01-dashboard, m02-clients, m06-collections, m03-groups-centers, m17-sync-settings]
    duration_ms_typical: 80

  error:
    description: "PermissionStateHolder could not be read — process was killed AND the encrypted multiplatform-settings backup was empty or corrupted."
    error_code: permission_state.unavailable
    display_message: "Could not assemble your workspace. Please try again."
    retry_available: true
    logout_available: true
    note: "The last-known roster is NOT shown in this state — a clean error card is rendered. Retry re-reads the PermissionStateHolder without triggering a new login."
