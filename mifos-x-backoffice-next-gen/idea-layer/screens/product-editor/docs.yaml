feature: product-editor
status: draft
cluster: admin
module: m08-products-charges
priority: should_have
new_infra: false
is_primary_flow: false
has_ui: true
has_api: true
has_server: false
archetype: form
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
  - fineract-auth-session
  - dynamic-template-forms
acceptance_refs:
  - >-
    Opening a loan/savings product shows its terms (principal/interest/repayment bounds, charges, accounting
    rule) rendered from GET /{product}/template; edits are permission-gated (CREATE/UPDATE product) and post
    through the offline outbox; a new product can be created from the same template-driven form.
plan_ref: idea-plan.yaml#features[product-editor]
summary: >-
  The loan/savings product create-and-edit surface drilled into from the M08 products & charges list
  (open_product_detail). Loads GET /v1/loanproducts/{productId} (or /v1/savingsproducts/{id}) merged with
  GET /v1/loanproducts/template into a sectioned form — Details (name, short name, currency) · Terms (principal
  min/default/max, interest rate & method, repayment frequency & count) · Settings (amortisation,
  interest-calculation period, arrears tolerance) · Charges · Accounting (rule + GL mappings). Every field,
  bound and option comes from the Fineract template so the form always matches the server's product schema.
  Save posts PUT /v1/loanproducts/{id} (edit) or POST /v1/loanproducts (create) through the offline outbox with
  a durable idempotency key. Admin-only: gated on CREATE_LOANPRODUCT / UPDATE_LOANPRODUCT.
vm_actions:
  - OnLoadTemplate
  - OnFieldChange
  - OnSectionExpand
  - OnAddCharge
  - OnSaveProduct
  - OnRetry
error_cases:
  - template_load_failed
  - product_load_failed
  - validation_failed
  - save_failed
scaffolded_by: /idea-plan-add
