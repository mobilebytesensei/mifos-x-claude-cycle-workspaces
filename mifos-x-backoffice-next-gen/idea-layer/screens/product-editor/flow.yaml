feature: product-editor

participates_in_flows:
  - product-config

entry_points:
  - type: direct
    description: "Opened from the M08 products & charges list row (open_product_detail) for a selected productId."
  - type: direct
    description: "Opened from the M08 'new product' affordance in create mode (no product loaded)."

transitions:
  - from: loading
    to: content
    trigger: "the product + template resolve (cache-first)"
  - from: loading
    to: empty
    trigger: "create mode — only the template loaded, no product"
  - from: loading
    to: error
    trigger: "the product or template failed to load and no cache is available"

  - from: content
    to: content
    trigger: "a section expands/collapses, a field changes, or a charge is added"
  - from: content
    to: error
    trigger: "save failed hard with no fallback"

  - from: empty
    to: content
    trigger: "the create form is populated from the template defaults"

  - from: error
    to: loading
    trigger: "'Retry' tapped — reloads the product + template / re-attempts save"
