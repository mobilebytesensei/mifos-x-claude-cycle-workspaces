feature: product-editor

participates_in_flows:
  - product-config

entry_points:
  - type: direct
    description: "Opened from the M08 products & charges list row (open_product_detail) for a selected productId."
  - type: direct
    description: "Opened from the M08 'new product' affordance in create mode (no product loaded)."

transitions:
  - from: loading
    to: content
    trigger: "the product + template resolve (cache-first)"
  - from: loading
    to: empty
    trigger: "create mode — only the template loaded, no product"
  - from: loading
    to: error
    trigger: "the product or template failed to load and no cache is available"

  - from: content
    to: content
    trigger: "a section expands/collapses or a charge is added/removed (expand_section / add_charge / remove_charge — pure in-VM, produces content)"
  - from: content
    to: validating
    trigger: "a field changes, a currency/amortisation/interest-type/accounting-rule is selected, a GL account is mapped, or 'Validate' is tapped (field_change / select_currency / select_amortisation / select_interest_type / select_accounting_rule / edit_gl_mapping / validate_form)"
  - from: content
    to: saving
    trigger: "'Save' tapped on a valid form (save_product — enqueues the create/update command to the offline outbox)"
  - from: content
    to: error
    trigger: "save failed hard with no fallback"

  - from: validating
    to: content
    trigger: "the client-side template-bounds validation completes (validationErrors settled; Save re-gated on the result)"
  - from: validating
    to: error
    trigger: "re-validation cannot resolve the template bounds it needs (template reference lost) with no usable cache"

  - from: saving
    to: content
    trigger: "the create/update command enqueues successfully to the durable offline outbox (draft_outbox)"
  - from: saving
    to: error
    trigger: "the save enqueue failed hard (draft_outbox write failure with no fallback)"

  - from: empty
    to: content
    trigger: "the create form is populated from the template defaults"

  - from: error
    to: loading
    trigger: "'Retry' tapped — reloads the product + template / re-attempts save"

# regenerated-provenance: /idea-verify heal 2026-07-31 — added the validating + saving transitions to model the
# 6 enriched ui.yaml states (was missing validating/saving): content→validating (field/select/gl/validate),
# content→saving (Save), validating→{content|error}, saving→{content|error}. Mirrors the report-runner flow shape.
