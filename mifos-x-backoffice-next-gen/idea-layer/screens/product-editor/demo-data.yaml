feature: product-editor

# Loan product being edited (GET /v1/loanproducts/{id} → LoanProductDto) plus the option
# lists from GET /v1/loanproducts/template (LoanProductTemplateDto). Real Fineract shapes.

product:
  id: 4
  name: "Group Business Loan"
  shortName: "GBL"
  description: "Working-capital loan for group-guaranteed members, 12-month term."
  currency: { code: "KES", decimalPlaces: 2, inMultiplesOf: 1 }
  principal: 60000.00
  minPrincipal: 5000.00
  maxPrincipal: 100000.00
  numberOfRepayments: 12
  repaymentEvery: 1
  repaymentFrequencyType: { id: 2, value: "Months" }
  interestRatePerPeriod: 2.0
  interestRateFrequencyType: { id: 2, value: "Per month" }
  amortizationType: { id: 1, value: "Equal installments" }
  interestType: { id: 0, value: "Declining Balance" }
  interestCalculationPeriodType: { id: 1, value: "Same as repayment period" }
  charges:
    - { id: 12, name: "Processing Fee", chargeTimeType: "Disbursement", amount: 500.00 }
  accountingRule: { id: 3, value: "Accrual (periodic)" }

template:
  currencyOptions:
    - { code: "KES", name: "Kenyan Shilling" }
    - { code: "USD", name: "US Dollar" }
  interestTypeOptions:
    - { id: 0, value: "Declining Balance" }
    - { id: 1, value: "Flat" }
  amortizationTypeOptions:
    - { id: 0, value: "Equal principal payments" }
    - { id: 1, value: "Equal installments" }
  accountingRuleOptions:
    - { id: 1, value: "None" }
    - { id: 2, value: "Cash" }
    - { id: 3, value: "Accrual (periodic)" }
  chargeOptions:
    - { id: 12, name: "Processing Fee" }
    - { id: 15, name: "Late Payment Penalty" }

sections: ["Details", "Terms", "Settings", "Charges", "Accounting"]

validation_error_state:
  message: "Min principal must be less than max principal — correct the Terms section"

