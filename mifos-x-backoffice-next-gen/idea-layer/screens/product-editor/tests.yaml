schema_version: v1.0.0
feature: product-editor
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/empty/error)
# + per api operation (get_product, get_product_template, save_product).
scenarios:
  - id: loading_shows_sectioned_shimmer
    preconditions: ["a productId is opened", "the product + template have not resolved yet"]
    actions: ["open a product from the M08 list"]
    assertions: ["the loading state shows a sectioned-form shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_sections_from_template
    preconditions: ["the product + template resolve", "the user holds the edit permission"]
    actions: ["open the product"]
    assertions:
      - "sections Details / Terms / Settings / Charges / Accounting are shown"
      - "every field, bound and option comes from the Fineract template"
      - "Save is enabled only when the whole form validates"
    priority: high
  - id: empty_create_mode_defaults_from_template
    preconditions: ["create mode — only the template loaded, no product"]
    actions: ["open the new-product form"]
    assertions: ["all sections default from the template", "no product values are pre-filled"]
    priority: low
  - id: error_when_load_or_save_fails
    preconditions: ["the product or template failed to load, or save failed hard"]
    actions: ["open the product / attempt save"]
    assertions: ["the error state is shown", "Retry reloads or re-attempts save"]
    priority: medium
  - id: read_only_without_edit_permission
    preconditions: ["the user lacks CREATE/UPDATE_LOANPRODUCT"]
    actions: ["open the product"]
    assertions: ["all fields render disabled", "no Save action is shown"]
    priority: high
  - id: save_enqueues_through_outbox
    preconditions: ["a product is edited", "the user holds UPDATE_LOANPRODUCT"]
    actions: ["edit a field", "tap Save product"]
    assertions:
      - "the save is enqueued to the offline outbox with a durable idempotency key"
      - "the next sync replays PUT /v1/loanproducts/{id} (or POST for create)"
      - "the product list reflects the change after sync"
    priority: high
  - id: template_validation_blocks_invalid_save
    preconditions: ["principal default is set above the template max"]
    actions: ["edit the principal field"]
    assertions: ["the field shows a validation error from the template", "Save stays disabled until the form is valid"]
    priority: medium
