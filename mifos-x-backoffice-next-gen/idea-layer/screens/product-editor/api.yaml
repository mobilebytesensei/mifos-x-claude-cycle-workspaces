feature: product-editor

# Loan/savings product edit. Product + template are reads; the save routes through the
# offline outbox (POST /v1/batches) so it replays exactly-once.

endpoints:
  - id: get_product
    method: GET
    path: "/v1/loanproducts/{productId}"
    description: "Load the loan product being edited — terms, charges, accounting rule and GL mappings. (Savings products use /v1/savingsproducts/{id}.)"
    response:
      shape: object
      dto: LoanProductDto
    requires_auth: true
    requires_permission: ["READ_LOANPRODUCT"]
    cache: cache_first_swr

  - id: get_product_template
    method: GET
    path: "/v1/loanproducts/template"
    description: >-
      Fetch the product template (currencies, amortisation/interest options, accounting rules, charge options,
      principal/term/interest bounds) that drives every field, option and validation rule in the editor.
    response:
      shape: object
      dto: LoanProductTemplateDto
    requires_auth: true
    requires_permission: ["READ_LOANPRODUCT"]
    cache: cache_first_swr

  - id: save_product
    method: PUT
    path: "/v1/loanproducts/{productId}"
    description: >-
      Persist an edited product (PUT edit) or a new product (POST /v1/loanproducts create). Enqueued to the
      offline outbox with a durable idempotency key and replayed via the transactional batch endpoint.
    response:
      shape: object
      dto: CommandProcessingResultDto
    requires_auth: true
    requires_permission: ["UPDATE_LOANPRODUCT"]   # create gates on CREATE_LOANPRODUCT
    idempotency: durable
