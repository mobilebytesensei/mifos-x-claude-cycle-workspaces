schema_version: "1.0"
screen_id: capability-map-detail
feature: capability-map-detail
name: "Capability Map Detail (version · checksum · requirement tree)"
archetype: detail
status: draft
module: permission-capability-engine
initial_state: loading

# Drill-in from the permission-capability-engine (view_capability_map_meta). Read-only detail
# of the active CapabilityMap — version/checksum/minAppVersion/source + the per-module
# requirement tree annotated satisfied/denied against the current PermissionSet.

requires_permission: []   # any authenticated user may inspect why their surface resolved the way it did

consumes_capabilities:
  - has_offline_cache
  - has_ui
  - requires_auth

business_logic:
  kind: aggregator
  processing_kind: on_demand
  library_refs: []
  external_library_refs:
    - "core/permissions.CapabilityMap"
    - "core/permissions.PermissionEvaluator"
    - "core/store.PermissionCatalogStore"
  required_modules:
    - core/permissions
    - core/store
    - core/database
    - core/network
  description: >-
    Reads the active CapabilityMap artifact (version, sha256 checksum, minAppVersion, source, per-module
    requirement tree) from core/permissions, evaluates each module node's required permission group against the
    resolved PermissionSet for a satisfied/denied badge, and labels groups from the catalog (GET /v1/permissions).
  description_author: claude-via-idea-plan-add
  description_authored_at: "2026-07-25T00:00:00Z"

state_model:
  fields:
    - name: meta
      type: "CapabilityMapMeta"
      description: "version, sha256 checksum, minAppVersion, source (bundled | remote), fetchedAt."
    - name: modules
      type: "List<ModuleRequirement>"
      description: "Per-module requirement nodes (module id, label, required permission group, satisfied/denied)."
    - name: expandedModule
      type: "String?"
      description: "Currently expanded module node revealing its required codes."
    - name: uiState
      type: "CapabilityMapDetailScreenState"
      description: "Loading | Content | Empty | Error."

states:
  loading:
    description: "Reading the active CapabilityMap + resolving each module requirement against the PermissionSet; shows a tree shimmer."
  content:
    description: >-
      A header card with the CapabilityMap version, sha256 checksum (copyable), minAppVersion and source, over a
      per-module requirement tree — each module node showing its required permission group and a satisfied/denied
      badge computed from the current PermissionSet. Renders fully offline from the bundled/cached map.
  empty:
    description: "No CapabilityMap has been resolved yet (pre-bootstrap); shows a guidance panel."
  error:
    description: "The grouping catalog failed to load with no cache (labels unavailable); shows an error + Retry."

components:
  - id: cm_module
    type: expandable_section
    label: "{strings.capmap_module}"
    accessibility_label: "Expand this module requirement node to see its required permission codes and satisfied or denied status"
    testTag: "capability-map-detail_module"
    on_click:
      action: expand_module
      target: capability-map-detail
      state: content
      action_contract:
        effect: transform_state
        library_refs: []
        external_library_refs: ["androidx.compose.runtime"]
        description: "Expand/collapse a module node to reveal the exact permission codes it requires and which the current PermissionSet holds; a pure in-VM UI toggle over the loaded requirement tree, no refetch."
        produces_state: content
        action_contract_hash: "sha256:cm-expand-module"
        action_contract_author: "claude-via-idea-plan-add"
        action_contract_authored_at: "2026-07-25T00:00:00Z"

  - id: cm_copy_checksum
    type: button
    label: "{strings.capmap_copy_checksum}"
    accessibility_label: "Copy the capability map sha256 checksum to the clipboard"
    testTag: "capability-map-detail_copy_checksum"
    variant: text
    description: "Copies the CapabilityMap sha256 checksum for support / drift diagnosis."
    on_click:
      action: copy_checksum
      target: capability-map-detail
      action_contract:
        effect: copy_clipboard
        library_refs: []
        description: "Copy the active CapabilityMap's sha256 checksum to the clipboard so an operator can quote the exact map version to support when a module unexpectedly shows or hides."
        action_contract_hash: "sha256:cm-copy-checksum"
        action_contract_author: "claude-via-idea-plan-add"
        action_contract_authored_at: "2026-07-25T00:00:00Z"

  - id: cm_error_retry
    type: button
    label: "{strings.capmap_retry}"
    accessibility_label: "Retry loading the permission grouping catalog"
    testTag: "capability-map-detail_error_retry"
    variant: primary
    description: "Error-state retry — reloads the grouping catalog for labels."
    on_click:
      action: retry
      target: capability-map-detail
      state: loading
      action_contract:
        effect: call_api
        library_refs: []
        external_library_refs: ["ktorfit"]
        description: "Reload the permission grouping catalog (GET /v1/permissions) after a hard load failure so the requirement tree can label its groups; resets to loading and re-resolves the tree."
        produces_state: loading
        action_contract_hash: "sha256:cm-retry"
        action_contract_author: "claude-via-idea-plan-add"
        action_contract_authored_at: "2026-07-25T00:00:00Z"
