feature: capability-map-detail

# Read-only. The CapabilityMap artifact (version/checksum/requirement tree) is a client-side
# core/permissions asset (bundled or remotely fetched) — not a Fineract endpoint. This call
# supplies the permission-group LABELS for the requirement tree. CACHE_FIRST_SWR.

endpoints:
  - id: get_permissions_catalog
    method: GET
    path: "/v1/permissions"
    description: >-
      Fetch the permission code catalog with grouping metadata so each CapabilityMap module-requirement node can
      be labelled with its human-readable permission group. Reference data; the requirement tree itself is the
      local CapabilityMap artifact, not this call.
    query_params: []
    response:
      shape: list
      dto: PermissionDto
      demo_source: PermissionDto.items
    pagination:
      style: none
      params: []
      envelope: bare_array
    requires_auth: true
    requires_permission: []