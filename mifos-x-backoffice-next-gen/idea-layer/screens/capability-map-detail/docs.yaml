feature: capability-map-detail
status: draft
cluster: foundation
module: permission-capability-engine
priority: should_have
new_infra: false
is_primary_flow: false
has_ui: true
has_api: true
has_server: false
archetype: detail
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - fineract-auth-session
acceptance_refs:
  - >-
    The CapabilityMap metadata detail shows version, checksum, minAppVersion and source (bundled vs remote),
    plus the per-module requirement tree the surface resolved against — each module node annotated with the
    required permission group and whether the current PermissionSet satisfies it; read-only, diagnostic.
plan_ref: idea-plan.yaml#features[capability-map-detail]
summary: >-
  The read-only CapabilityMap metadata detail, drilled into from the permission-capability-engine
  (view_capability_map_meta). It shows the active CapabilityMap's version, sha256 checksum, minAppVersion and
  source (bundled asset vs remotely-fetched), then renders the per-module requirement tree the surface resolved
  against — one node per back-office module (M01…M17 plus the foundation features), each annotated with the
  permission group it requires (e.g. portfolio → READ_CLIENT, accounting → READ_JOURNALENTRY) and a
  satisfied/denied badge computed against the signed-in user's resolved PermissionSet. This is the diagnostic
  that explains WHY a given module tab is visible or hidden. The requirement tree is the CapabilityMap artifact
  (bundled/remote); the permission group catalog (GET /v1/permissions) supplies the grouping labels for display.
vm_actions:
  - OnLoad
  - OnExpandModule
  - OnCopyChecksum
  - OnRetry
error_cases:
  - capability_map_unavailable
  - grouping_catalog_load_failed
scaffolded_by: /idea-plan-add
