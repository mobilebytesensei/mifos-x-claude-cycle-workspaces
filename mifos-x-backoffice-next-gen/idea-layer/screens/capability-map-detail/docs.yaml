plan_ref: idea-plan.yaml#features[capability-map-detail]
summary: >-
  The read-only CapabilityMap metadata detail, drilled into from the permission-capability-engine
  (view_capability_map_meta). It shows the active CapabilityMap's version, sha256 checksum, minAppVersion and source
  (bundled asset vs remotely-fetched), then renders the per-module requirement tree the surface resolved against — one
  node per back-office module (M01…M17 plus the foundation features), each annotated with the permission group it
  requires (e.g. portfolio → READ_CLIENT, accounting → READ_JOURNALENTRY) and a satisfied/denied badge computed against
  the signed-in user's resolved PermissionSet. This is the diagnostic that explains WHY a given module tab is visible or
  hidden. The requirement tree is the CapabilityMap artifact (bundled/remote); the permission group catalog (GET
  /v1/permissions) supplies the grouping labels for display.
metadata:
  category: crud
  implementation_ready: true
  impl_ready_at: "2026-07-31T00:00:00Z"
  impl_ready_schema: v2
# Pure read/inspect over a bundled+remote client-side config asset — no native platform capability
# (no biometric / camera / deep-link / share-sheet / notification). Nothing to declare.
contracts: []
# No third-party platform capability library owned by THIS screen — the CapabilityMap read is a
# core/permissions in-process asset and the grouping catalog is a plain ktorfit GET already owned by
# the shared permission catalog cache. Empty LIST (never a map).
libraries: []
vm_actions:
  - name: LoadCapabilityMap
    signature: "private fun loadCapabilityMap()"
    state_mutations:
      - uiState=Loading
      - meta=<active CapabilityMapMeta: version, checksum, minAppVersion, source, fetchedAt>
      - modules=<per-module requirement nodes, each badged satisfied/denied via PermissionEvaluator>
      - uiState=Content | Empty
    side_effects:
      - CapabilityMap read from core/permissions (bundled/remote artifact, no HTTP GET)
      - PermissionEvaluator.resolve(moduleId) per node against the resolved PermissionSet
      - PermissionCatalogStore.stream() — GET /v1/permissions cache-first SWR for grouping labels
    error_handling:
      CapabilityMapUnavailable: "uiState=Empty; render the pre-bootstrap guidance panel (no map resolved yet)"
      GroupingCatalogLoadFailedNoCache: "uiState=Error; offer Retry — group labels unavailable"
      GroupingCatalogStaleWhileRevalidate: "render nodes from cached catalog; background-refresh, no state flip"
  - name: ToggleEntryExpanded
    handles: expand_module
    signature: "fun onToggleModule(moduleId: String)"
    state_mutations:
      - expandedModule=moduleId (or null when collapsing the currently-expanded node)
    side_effects:
      - none — a pure in-VM UI toggle over the already-loaded requirement tree, no refetch
    error_handling:
      UnknownModuleId: "no-op; retain the current expandedModule so an invalid id never blanks the tree"
  - name: CopyChecksum
    signature: "fun onCopyChecksum()"
    state_mutations: []
    side_effects:
      - Clipboard.setText(meta.checksum)
      - emit transient confirmation snackbar ("checksum copied")
    error_handling:
      ClipboardUnavailable: "emit a transient error snackbar; screen state unchanged"
      MetaNotLoaded: "no-op — the copy control is only shown in the content state where meta is present"
  - name: RetryLoad
    handles: retry
    signature: "fun onRetry()"
    state_mutations:
      - uiState=Loading
      - modules=<re-labelled requirement nodes on success>
      - uiState=Content | Error
    side_effects:
      - PermissionCatalogStore.fresh() — re-fetch GET /v1/permissions after a hard catalog load failure
      - re-resolve the requirement tree against the current PermissionSet
    error_handling:
      GroupingCatalogLoadFailed: "uiState=Error; keep the last-known bundled/cached map"
      NetworkError: "uiState=Error; retain the local CapabilityMap so the tree still renders (labels pending)"
error_cases:
  - capability_map_unavailable
  - grouping_catalog_load_failed
