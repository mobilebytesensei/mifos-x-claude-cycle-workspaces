feature: capability-map-detail

entry_points:
  - type: direct
    description: "Opened from the permission-capability-engine surface (view_capability_map_meta) to inspect the active CapabilityMap metadata + requirement tree."

transitions:
  - from: loading
    to: content
    trigger: "the CapabilityMap resolves + the grouping catalog loads (cache-first)"
  - from: loading
    to: empty
    trigger: "no CapabilityMap has been resolved yet (pre-bootstrap)"
  - from: loading
    to: error
    trigger: "the grouping catalog failed to load and no cache is available"

  - from: content
    to: content
    trigger: "a module node expands, or the checksum is copied"

  - from: error
    to: loading
    trigger: "'Retry' tapped — reloads the grouping catalog"
