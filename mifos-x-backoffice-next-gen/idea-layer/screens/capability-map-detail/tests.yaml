schema_version: v1.0.0
feature: capability-map-detail
# Re-verified 2026-07-31 (/idea-test-generate --regenerate) against the current ui.yaml + api.yaml —
# coverage: one scenario per ui.yaml state (loading/content/empty/error) + per on_click
# (expand_module, copy_checksum, retry) + the get_permissions_catalog operation. Grounded in
# demo-data (CapabilityMap 2026.07.2, sha256, portfolio/accounting/maker-checker module nodes).
# Content unchanged from the 2026-07-25 generation — the 2026-07-30 ui/api touch was an mtime re-stamp.
# Re-verified 2026-07-31 (post-21:09 ui.yaml enrich): scenarios still cover all 4 states + 3 on_click contracts; no delta — mtime re-stamp to clear content-hash staleness.
scenarios:
  - id: loading_shows_tree_shimmer
    preconditions: ["the detail is opened", "the map + catalog have not resolved yet"]
    actions: ["open Capability map detail from the permission engine"]
    assertions: ["the loading state shows a requirement-tree shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_meta_and_requirement_tree
    preconditions: ["the active CapabilityMap resolves + the grouping catalog loads"]
    actions: ["open the detail"]
    assertions:
      - "the header card shows version, sha256 checksum, minAppVersion and source (bundled vs remote)"
      - "the per-module requirement tree lists one node per module with its required permission group"
      - "each module node shows a satisfied/denied badge computed against the current PermissionSet"
    priority: high
  - id: empty_when_map_unresolved
    preconditions: ["no CapabilityMap has been resolved yet (pre-bootstrap)"]
    actions: ["open the detail"]
    assertions: ["a guidance panel is shown"]
    priority: low
  - id: error_when_catalog_fails_no_cache
    preconditions: ["the grouping catalog failed to load and no cache is available"]
    actions: ["open the detail"]
    assertions: ["the error state is shown", "Retry reloads the grouping catalog"]
    priority: medium
  - id: renders_offline_from_bundled_map
    preconditions: ["the device is offline", "the catalog was cached"]
    actions: ["open the detail offline"]
    assertions: ["the map metadata + tree render from the bundled/cached artifact", "labels come from the cached catalog"]
    priority: high
  - id: denied_node_explains_hidden_module
    preconditions: ["the user lacks the permission group a module requires"]
    actions: ["expand that module node"]
    assertions: ["the node shows a Denied badge", "the required codes are listed with which the PermissionSet holds — explaining why the module is hidden"]
    priority: high
  - id: copy_checksum_to_clipboard
    preconditions: ["the header card is shown"]
    actions: ["tap Copy checksum"]
    assertions: ["the map sha256 checksum is copied to the clipboard for support / drift diagnosis"]
    priority: low
