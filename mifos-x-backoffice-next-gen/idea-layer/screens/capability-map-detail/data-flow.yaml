feature: capability-map-detail

# Read-only diagnostic. The CapabilityMap artifact is a LOCAL core/permissions asset
# (bundled/remote), read with no HTTP GET; the grouping catalog reads cache-first for labels.
# No writes.

entries:
  - trigger: on_mount
    source: local.capability_map
    target_state: content
    loading_state: loading
    error_state: empty
    on_error:
      nav_target: null
      error_code: capability_map_unavailable
    persistence_contract:
      store: settings
      table: capability_map
      keys: [version, checksum, min_app_version, source, requirement_tree_json, fetched_at]
      note: "The active CapabilityMap (version, sha256 checksum, minAppVersion, source, per-module requirement tree) is read from the bundled/remote artifact in core/permissions — no HTTP GET. Empty pre-bootstrap."

  - trigger: on_mount
    source: remote.get_permissions_catalog
    target_state: content
    loading_state: loading
    error_state: error
    on_error:
      nav_target: null
      error_code: grouping_catalog_load_failed
    persistence_contract:
      store: room
      table: permission_catalog_cache
      keys: [code, grouping, entity_name, action_name]
      note: "CACHE_FIRST_SWR mirror of GET /v1/permissions; supplies the human-readable grouping labels for the requirement-tree nodes. Shared cache with permission-set-detail."

cache:
  strategy: cache_first_swr
  note: "Read-only screen. The catalog revalidates infrequently (reference data); the CapabilityMap is authoritative-local. No outbox writes."

