feature: m17-sync-settings
entries:
  # ── hydrate device/session settings + derive sync status on mount ──
  - trigger: on_mount
    source: local.app_settings_and_sync_status
    target_state: idle
    loading_state: idle
    error_state: error
    on_error:
      nav_target: null
      error_code: settings_read_failed
    persistence_contract:
      store: multiplatform_settings
      keys: [active_tenant, active_server_env, locale, theme_mode]
      note: "Plain multiplatform-settings preferences; sync status (last_sync_at, outbox_pending_count, failed_count) is DERIVED read-only from the offline-sync-engine outbox, not stored here."

  # ── biometric flag lives in the encrypted variant ──
  - trigger: on_mount
    source: local.secure_prefs
    target_state: idle
    loading_state: idle
    error_state: error
    on_error:
      nav_target: null
      error_code: settings_read_failed
    persistence_contract:
      store: encrypted_prefs
      keys: [biometric_lock_enabled]
      note: "Encrypted multiplatform-settings key store — biometric app-lock flag only; never in plain prefs."

  # ── Sync now / Pull latest read the outbox + fetched-at watermark (owned by offline-sync-engine) ──
  - trigger: on_click
    action: trigger_sync
    source: local.draft_outbox
    target_state: syncing
    loading_state: syncing
    error_state: needs-attention
    on_error:
      nav_target: needs-attention-inbox
      error_code: batch_rejected
    persistence_contract:
      store: room
      keys: [formKey, uniqueKey]
      note: "Read-only for the counts; the drain is delegated to offline-sync-engine (owner of draft_outbox writes)."

  # ── reference-data caches cleared/refreshed from here ──
  - trigger: on_click
    action: refresh_reference_data
    source: remote.reference_stores
    target_state: syncing
    loading_state: syncing
    error_state: error
    on_error:
      nav_target: null
      error_code: reference_refresh_failed
    persistence_contract:
      store: room
      keys: [cache_key]
      note: "reference_cache tables (codes/offices/products/charges) are owned by their feature stores; this screen only triggers clear/refresh + reads the freshness watermark."
