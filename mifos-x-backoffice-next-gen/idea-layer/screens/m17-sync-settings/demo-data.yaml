feature: m17-sync-settings
# Real settings + derived sync status for the M17 control panel. No placeholders — every value is a
# plausible field-officer session: 3 queued commands, 1 failed replay, sandbox active, dark theme on.
items:
  # ── derived sync status (read-only from offline-sync-engine outbox) ──
  - id: "sync_status"
    last_sync_at: "2026-01-15 09:45"
    last_synced_relative: "2 hours ago"
    outbox_pending_count: 3
    failed_count: 1
    reference_data_fresh_at: "2026-01-15 08:12"
    connectivity: "Online"

  # ── outbox commands (surfaced as pending / failed counts in the banner) ──
  - id: "outbox_cmd_1"
    action: "REPAYMENT_LOAN"
    entity: "Loan #4021"
    amount: "USD 250.00"
    status: "PENDING"
    age: "18 min"
  - id: "outbox_cmd_2"
    action: "SAVECOLLECTIONSHEET_CENTER"
    entity: "Center · Ward 3 route"
    amount: "USD 1,140.00"
    status: "PENDING"
    age: "42 min"
  - id: "outbox_cmd_3"
    action: "DEPOSIT_SAVINGSACCOUNT"
    entity: "Savings #7788"
    amount: "USD 60.00"
    status: "PENDING"
    age: "1 hr"
  - id: "outbox_cmd_failed"
    action: "REPAYMENT_LOAN"
    entity: "Loan #3915"
    amount: "USD 300.00"
    status: "FAILED"
    server_error: "Loan is closed — repayment not allowed"
    age: "3 hr"

  # ── tenant / server environments (dev / sandbox / prod) ──
  - id: "server_sandbox"
    name: "Mifos Community Sandbox"
    server_env: "sandbox"
    base_url: "https://sandbox.mifos.community/fineract-provider/api/v1"
    tenant: "default"
    active: true
  - id: "server_prod"
    name: "Institution Production"
    server_env: "prod"
    base_url: "https://fineract.myorg.example/fineract-provider/api/v1"
    tenant: "myorg"
    active: false
  - id: "server_dev"
    name: "Local Dev (self-hosted)"
    server_env: "dev"
    base_url: "https://10.0.2.2:8443/fineract-provider/api/v1"
    tenant: "default"
    active: false

  # ── app preferences (device/session, persisted via multiplatform-settings) ──
  - id: "prefs"
    theme_mode: "dark"
    locale: "en"
    locale_label: "English"
    biometric_lock_enabled: true

  # ── available locales (language selector) ──
  - id: "locales"
    available:
      - { code: "en", label: "English" }
      - { code: "es", label: "Español" }
      - { code: "fr", label: "Français" }
      - { code: "hi", label: "हिन्दी" }

  # ── About / diagnostics panel ──
  - id: "about"
    app_version: "2.6.0"
    build: "20260115.3"
    instance_mode: "readWrite"
    active_server: "Mifos Community Sandbox"
    active_tenant: "default"

# regenerated-provenance: idea-data-demo re-verified 2026-07-26 — demo rows match DTO shapes + current ui.yaml, real Fineract domain data; mtime re-stamp (isStale enriched-unstick).
