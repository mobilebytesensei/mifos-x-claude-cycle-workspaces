schema_version: v1.0.0
feature: m17-sync-settings
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (idle/content/syncing/empty/error)
# + per api operation (get_instance_mode, sync_batches, delta_changelist, refresh_reference_codes, refresh_reference_offices).
scenarios:
  - id: settings_hydrate_on_mount
    preconditions: ["user authenticated", "preferences previously saved (dark theme, en locale, biometric on)"]
    actions: ["open Sync & Settings"]
    assertions: ["idle state renders", "saved preferences shown (theme/language/biometric reflect stored values)", "sync banner shows last-synced watermark"]
    priority: high

  - id: sync_console_drains_outbox
    preconditions: ["outbox has 3 queued commands", "network restored"]
    actions: ["tap Sync now"]
    assertions: ["state transitions idle/content → syncing", "offline-sync-engine drains the outbox via POST /v1/batches", "banner returns to 'Up to date' with pendingCount 0"]
    priority: high

  - id: pull_latest_delta
    preconditions: ["user authenticated", "no pending outbox commands"]
    actions: ["tap Pull latest"]
    assertions: ["syncing state shown", "changeListSync delta-pull runs over GET /v1/audits", "reference caches' freshness watermark advances", "outbox untouched"]
    priority: medium

  - id: needs_attention_entry_visible
    preconditions: ["a replay was rejected by the server"]
    actions: ["open Sync & Settings"]
    assertions: ["Needs-Attention entry badge count > 0", "state is needs-attention", "tapping it navigates to needs-attention-inbox"]
    priority: high

  - id: tenant_server_switch_reauths
    preconditions: ["user authenticated on sandbox"]
    actions: ["tap Tenant & server", "select the production tenant"]
    assertions: ["DynamicBaseUrlPlugin base URL + Fineract-Platform-TenantId header change", "re-auth is forced (login shown)", "permission-capability-engine re-resolves permissions for the new tenant"]
    priority: high

  - id: clear_reference_cache_confirm
    preconditions: ["reference caches populated"]
    actions: ["tap Clear cached reference data", "confirm in the dialog"]
    assertions: ["confirm dialog appears before any deletion", "on confirm, reference_cache Room tables are emptied", "freshness watermark reset so next screen re-fetches"]
    priority: medium

  - id: refresh_reference_data
    preconditions: ["reference caches are stale"]
    actions: ["tap Refresh reference data"]
    assertions: ["syncing state shown", "CACHE_FIRST_SWR reference stores re-fetch codes/offices/products", "freshness watermark advances"]
    priority: low

  - id: theme_toggle_persists
    preconditions: ["theme currently light"]
    actions: ["toggle Dark theme on"]
    assertions: ["theme_mode persisted to multiplatform-settings", "app recomposes to dark immediately", "choice survives relaunch"]
    priority: medium

  - id: language_change_persists
    preconditions: ["locale currently en"]
    actions: ["tap Language", "select a different locale"]
    assertions: ["locale persisted to multiplatform-settings", "Compose Resources re-applies the locale", "screens re-render in the chosen language"]
    priority: low

  - id: biometric_lock_persists
    preconditions: ["device supports biometrics", "biometric lock currently off"]
    actions: ["toggle Biometric app lock on"]
    assertions: ["flag written to the encrypted multiplatform-settings key store", "lock enforced on next cold launch before any screen renders"]
    priority: medium

  - id: logout_clears_session
    preconditions: ["user authenticated", "outbox may contain queued drafts"]
    actions: ["tap Log out", "confirm in the dialog"]
    assertions: ["confirm dialog appears", "encrypted session + cached permission set cleared", "queued drafts preserved for next login", "navigates to login-tenant"]
    priority: medium

  - id: settings_read_error_shows_retry
    preconditions: ["settings store read fails"]
    actions: ["open Sync & Settings"]
    assertions: ["error state renders (never a blank screen)", "'Couldn't read sync status — pull to retry' banner shown", "Retry re-reads settings"]
    priority: medium
