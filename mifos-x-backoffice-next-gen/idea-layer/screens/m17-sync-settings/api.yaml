feature: m17-sync-settings
# Sync & Settings is mostly app-local (device/session prefs via multiplatform-settings).
# The only server calls are (a) the sync console delegating to offline-sync-engine and
# (b) reading server instance mode + refreshing reference-data caches. No server layer is
# built (has_server:false) — these endpoints are consumed from the live Fineract API as-is.
endpoints:
  - id: get_instance_mode
    method: GET
    path: "/v1/instance-mode"
    description: "Server instance mode (read/write/batch) — shown in About/diagnostics and gates whether the sync console can drain writes."
    response_type: "InstanceMode"
    requires_auth: true
    requires_permission: []
    cacheable: true

  - id: sync_batches
    method: POST
    path: "/v1/batches"
    description: "Outbox drain via the sync console — delegates to offline-sync-engine (AllOrNothing == enclosingTransaction, durable Idempotency-Key per entry)."
    response_type: "BatchResponse[]"
    requires_auth: true
    requires_permission: []
    idempotency: durable

  - id: delta_changelist
    method: GET
    path: "/v1/audits"
    description: "changeListSync delta feed for 'Pull latest' — scoped by officeId + makerDateTimeFrom watermark; delegated to offline-sync-engine."
    response_type: "AuditEntry[]"
    requires_auth: true
    requires_permission: []
    cacheable: false

  - id: refresh_reference_codes
    method: GET
    path: "/v1/codes"
    description: "Reference-data refresh (codes) — re-runs the CACHE_FIRST_SWR reference store when the user taps 'Refresh reference data'."
    response_type: "CodeValue[]"
    requires_auth: true
    requires_permission: []
    cacheable: true

  - id: refresh_reference_offices
    method: GET
    path: "/v1/offices"
    description: "Reference-data refresh (offices) — re-hydrates the office hierarchy cache used by scope pickers across the app."
    response_type: "Office[]"
    requires_auth: true
    requires_permission: []
    cacheable: true
