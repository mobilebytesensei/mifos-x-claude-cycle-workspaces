appId: org.mifos.backoffice
---
# M17 · Sync & Settings — happy path: open settings, verify the sync console + preference rows,
# trigger a manual sync, and confirm the Needs-Attention entry routes to the inbox.
- launchApp
- assertVisible:
    id: "m17-sync-settings_header"
- assertVisible:
    id: "m17-sync-settings_content"
- assertVisible:
    id: "m17-sync-settings_status_banner"
# manual sync console
- tapOn:
    id: "m17-sync-settings_sync_now"
- assertVisible:
    id: "m17-sync-settings_status_banner"
# failed replays are triageable via the Needs-Attention entry
- assertVisible:
    id: "m17-sync-settings_needs_attention"
- tapOn:
    id: "m17-sync-settings_needs_attention"
- assertVisible:
    id: "needs-attention-inbox_content"
- back
# app preferences + tenant/server switch are present
- assertVisible:
    id: "m17-sync-settings_theme"
- assertVisible:
    id: "m17-sync-settings_biometric"
- assertVisible:
    id: "m17-sync-settings_switch_server"
