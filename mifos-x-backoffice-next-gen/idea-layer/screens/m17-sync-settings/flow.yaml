feature: m17-sync-settings
entry_points:
  - type: nav_root
    description: "Sync & Settings module root — always available once authenticated (no server permission gate; every persona sees settings)."
transitions:
  # ── read / hydrate ──
  - from: idle
    to: idle
    trigger: "on_mount → read encrypted settings + derive sync status (0 pending)"
  - from: idle
    to: content
    trigger: "outbox has N pending commands"
  - from: idle
    to: empty
    trigger: "fresh install / just logged in — no outbox, no delta ever pulled"
  - from: idle
    to: error
    trigger: "settings read or sync-status derive failed"
  - from: error
    to: idle
    trigger: "Retry → settings re-read succeeds"

  # ── sync console (delegates to offline-sync-engine) ──
  - from: content
    to: syncing
    trigger: "trigger_sync (Sync now)"
  - from: idle
    to: syncing
    trigger: "trigger_delta_pull (Pull latest)"
  - from: syncing
    to: idle
    trigger: "sync complete (zero rejects)"
  - from: syncing
    to: needs-attention
    trigger: "sync produced rejected/failed commands"
  - from: syncing
    to: error
    trigger: "batch or delta-pull request failed (network/server)"

  # ── needs-attention triage (routes out) ──
  - from: needs-attention
    to: needs-attention
    trigger: "open_needs_attention → needs-attention-inbox (Retry / Edit / Discard)"

  # ── server switch → re-auth ──
  - from: idle
    to: idle
    trigger: "switch_tenant_server → DynamicBaseUrlPlugin swap → force re-auth → permissions re-resolved"

  # ── reference cache management ──
  - from: idle
    to: idle
    trigger: "clear_reference_cache (confirm) → local Room caches emptied"
  - from: idle
    to: syncing
    trigger: "refresh_reference_data → re-fetch reference caches"

  # ── local preferences (persist, no state change beyond re-render) ──
  - from: idle
    to: idle
    trigger: "toggle_theme / change_language / toggle_biometric_lock → persisted to multiplatform-settings"

  # ── session exit ──
  - from: idle
    to: idle
    trigger: "logout (confirm) → clear session + outbox drafts → navigate to login-tenant"
