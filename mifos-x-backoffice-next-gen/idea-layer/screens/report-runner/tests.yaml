schema_version: v1.0.0
feature: report-runner
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/empty/error)
# + per api operation (list_reports, resolve_report_parameter, run_report).
scenarios:
  - id: loading_shows_param_form_shimmer
    preconditions: ["a report is opened", "its parameter metadata has not resolved yet"]
    actions: ["open Portfolio at Risk from the M01 PAR tile"]
    assertions: ["the loading state shows a parameter-form shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_params_run_and_table
    preconditions: ["the report parameter metadata + lookup options resolve", "the user holds the report's run permission"]
    actions: ["open the report", "fill parameters", "tap Run"]
    assertions:
      - "the parameter form shows office, from/to date, currency and loan officer resolved from lookup reports"
      - "GET /v1/runreports/{reportName} runs with the captured R_ parameters"
      - "the result renders as a sortable, horizontally-scrollable table with an export action"
    priority: high
  - id: empty_when_zero_rows
    preconditions: ["the report ran successfully but returned zero rows for the parameters"]
    actions: ["run with parameters matching no data"]
    assertions: ["a no-data panel is shown with adjust-parameters guidance"]
    priority: low
  - id: error_when_params_or_run_fail
    preconditions: ["the parameter metadata failed to resolve, or the run failed hard with no cache"]
    actions: ["open / run the report"]
    assertions: ["the error state is shown", "Retry re-resolves parameters or re-runs"]
    priority: medium
  - id: recent_report_opens_offline
    preconditions: ["the device is offline", "the same report+parameters were recently run"]
    actions: ["run the report offline with the same parameters"]
    assertions: ["the cached result renders (CACHE_FIRST_SWR keyed by parameter hash)"]
    priority: high
  - id: dependent_param_cascades
    preconditions: ["the parameter form is shown"]
    actions: ["change the office parameter"]
    assertions: ["the loan-officer options re-resolve scoped to the chosen office"]
    priority: medium
  - id: sort_and_export_are_local
    preconditions: ["a result table is shown"]
    actions: ["tap a column header", "tap Export"]
    assertions: ["the table sorts in-VM with no refetch", "Export renders the current result to CSV/PDF and hands off to the platform share sheet"]
    priority: low
