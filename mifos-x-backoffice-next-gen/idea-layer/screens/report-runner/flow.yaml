feature: report-runner

participates_in_flows:
  - report-generation

entry_points:
  - type: direct
    description: "Opened from the M01 dashboard 'portfolio at risk' tile (open_portfolio_at_risk), pre-scoped to the PAR report."
  - type: direct
    description: "Opened from the M14 reports & audit list for a chosen report."

transitions:
  - from: loading
    to: content
    trigger: "the report's parameter metadata + lookup options resolve"
  - from: loading
    to: error
    trigger: "the parameter metadata failed to resolve and no cache is available"

  - from: content
    to: content
    trigger: "a parameter changes, the report runs, a column is sorted, or export is triggered"
  - from: content
    to: empty
    trigger: "the run returned zero rows for the chosen parameters"
  - from: content
    to: error
    trigger: "the run failed hard with no cache"

  - from: empty
    to: content
    trigger: "parameters adjusted and re-run returns rows"

  - from: error
    to: loading
    trigger: "'Retry' tapped — re-resolves parameters / re-runs"
