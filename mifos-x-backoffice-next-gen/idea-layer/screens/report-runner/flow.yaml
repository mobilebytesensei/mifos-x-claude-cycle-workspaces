feature: report-runner

participates_in_flows:
  - report-generation

entry_points:
  - type: direct
    description: "Opened from the M01 dashboard 'portfolio at risk' tile (open_portfolio_at_risk), pre-scoped to the PAR report."
  - type: direct
    description: "Opened from the M14 reports & audit list for a chosen report."

transitions:
  - from: loading
    to: content
    trigger: "the report catalog + the report's parameter metadata + lookup options resolve"
  - from: loading
    to: error
    trigger: "the parameter metadata failed to resolve and no cache is available"

  - from: content
    to: content
    trigger: "a parameter changes, the date range is picked, or a different report is selected from the switcher"
  - from: content
    to: running
    trigger: "'Run' tapped with the required parameters set"

  - from: running
    to: results
    trigger: "the run returned one or more rows"
  - from: running
    to: empty
    trigger: "the run returned zero rows for the chosen parameters"
  - from: running
    to: error
    trigger: "the run failed hard with no cache"

  - from: results
    to: results
    trigger: "a column is sorted or export is triggered (pure client-side, no refetch)"
  - from: results
    to: content
    trigger: "a parameter changes or a different report is selected (result cleared, form re-scoped)"
  - from: results
    to: running
    trigger: "'Run' re-tapped after a parameter change"

  - from: empty
    to: running
    trigger: "parameters adjusted and Run re-tapped"

  - from: error
    to: loading
    trigger: "'Retry' tapped — re-resolves parameters / re-runs"

# regenerated-provenance: /idea-feature-enrich 2026-07-31 — expanded transitions for the 6 enriched
# ui.yaml states (added running + results): content→running on Run, running→{results|empty|error},
# results→{results (sort/export) | content (param/report change) | running (re-run)}, empty→running.
