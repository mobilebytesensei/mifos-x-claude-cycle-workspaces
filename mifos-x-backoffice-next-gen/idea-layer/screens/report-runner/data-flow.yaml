feature: report-runner

# Read-only. Parameter metadata + report results read cache-first through Store5 so a
# recently-run report opens offline. No outbox writes — the export is a local render + share.

entries:
  - trigger: on_mount
    source: remote.resolve_report_parameter
    target_state: content
    loading_state: loading
    error_state: error
    on_error:
      nav_target: null
      error_code: parameters_load_failed
    persistence_contract:
      store: room
      table: report_parameter_cache
      keys: [report_name, parameter_id, option_id, option_label]
      note: "CACHE_FIRST_SWR mirror of the parameter lookup reports; the parameter-form dropdowns hydrate from here so the form opens offline."

  - trigger: on_action
    source: remote.run_report
    target_state: content
    loading_state: content
    error_state: error
    on_error:
      nav_target: null
      error_code: report_run_failed
    persistence_contract:
      store: room
      table: report_result_cache
      keys: [report_name, param_hash, column_headers_json, rows_json, run_at]
      note: "CACHE_FIRST_SWR mirror of GET /v1/runreports/{reportName} keyed by (reportName, paramHash); a re-run with the same parameters serves the cached result then revalidates."

cache:
  strategy: cache_first_swr
  note: "Reports are read-only; results revalidate in the background per FreshnessBands keyed by the parameter set. Export renders the in-memory result to CSV/PDF — no persistence, no network."

