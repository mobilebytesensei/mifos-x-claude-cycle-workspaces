feature: report-runner

# Read-only report runner. The parameter metadata + the run are reads (CACHE_FIRST_SWR);
# no mutations. Parameter lookups are themselves reports run with a parameter type.

endpoints:
  - id: list_reports
    method: GET
    path: "/v1/reports"
    description: "List available reports the user can run (with category + type: Table/Pentaho/Chart) for the M14 picker."
    response:
      shape: list
      dto: ReportDefinitionDto
    pagination:
      style: none
      params: []
      envelope: bare_array
    requires_auth: true
    requires_permission: ["READ_REPORT"]
    cache: cache_first_swr

  - id: resolve_report_parameter
    method: GET
    path: "/v1/runreports/FullParameterList"
    description: >-
      Resolve a report parameter's lookup options (e.g. OfficeIdSelectOne, loanOfficerIdSelectAll,
      currencyIdSelectAll) by running the parameter's backing report; drives the parameter form's dropdowns.
    query_params:
      - { name: parameterId, type: integer, required: false }
      - { name: parameterType, type: boolean, required: false }
    response:
      shape: list
      dto: ReportParameterOptionDto
    requires_auth: true
    requires_permission: ["READ_REPORT"]
    cache: cache_first_swr

  - id: run_report
    method: GET
    path: "/v1/runreports/{reportName}"
    description: >-
      Run the named report with the captured R_ parameters (e.g. R_officeId, R_startDate, R_endDate,
      R_loanOfficerId, R_currencyId); returns columnHeaders + data rows for the result table.
    query_params:
      - { name: R_officeId, type: string, required: false }
      - { name: R_startDate, type: string, required: false }
      - { name: R_endDate, type: string, required: false }
      - { name: R_loanOfficerId, type: string, required: false }
      - { name: R_currencyId, type: string, required: false }
    response:
      shape: object
      dto: ReportRunResultDto
    requires_auth: true
    requires_permission: ["READ_REPORT"]
    cache: cache_first_swr
