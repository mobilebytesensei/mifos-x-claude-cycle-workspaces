appId: org.mifos.backoffice
# M16 · Communications happy path — the marketing/admin operator opens the module, waits for the
# campaign list to hydrate (CACHE_FIRST_SWR), opens a campaign, reads its recipient delivery report,
# and returns. Every tap uses the testTag emitted in ui.yaml so the flow drives the same nodes the
# Compose UI test asserts. Permission-gated controls (New campaign / Activate / Close) only appear
# when the signed-in user holds the matching {ACTION}_{ENTITY} code, so the flow asserts the read
# surface that every authenticated user with READ_SMSCAMPAIGN sees.
---
- launchApp
- assertVisible:
    id: "m16-communications_header"
# campaign list hydrates from cache or network
- assertVisible:
    id: "m16-communications_content"
# open the first campaign row -> campaign detail (template preview + recipient criteria + report)
- tapOn:
    id: "m16-communications_campaign_item"
    optional: true
# read the per-recipient delivery report (grouped Pending/Sent/Delivered/Failed)
- tapOn:
    id: "m16-communications_view_report"
    optional: true
- assertVisible:
    id: "m16-communications_content"
# the module header remains anchored across the master -> detail navigation
- assertVisible:
    id: "m16-communications_header"
