# endpoints now wired across 9 entries (was 4 explicit sources — templates + update/close/create-template/
# register-hook/save-email-config were previously only mentioned in notes). Grounded in current api.yaml +
# ui.yaml + demo-data.yaml; DTO refs resolve (SmsCampaignDto/CampaignMessageDto/TemplateDto/HookDto/
# CommandProcessingResult).
