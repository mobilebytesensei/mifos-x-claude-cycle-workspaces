acceptance_refs:
  - Create SMS/email campaigns, report-mailing jobs, UGD document templates (agreements/receipts)
  - >-
    Every campaign lifecycle command (create/activate/close) queued with a DURABLE idempotency key through the outbox;
    replays exactly-once (zero double-activate) even across an app kill
  - >-
    Every control gated on its exact {ACTION}_{ENTITY} code (READ_/CREATE_/ACTIVATE_/CLOSE_SMSCAMPAIGN, CREATE_TEMPLATE,
    CREATE_HOOK, UPDATE_EXTERNALSERVICES); same binary renders marketing-admin vs read-only viewer
plan_ref: idea-plan.yaml#features[m16-communications]
permissions_gate: '*_SMSCAMPAIGN, email campaign codes, *_REPORTMAILINGJOB, template (UGD)'
summary: >-
  M16 · Communications — the marketing/admin persona's surface. A list of SMS/email campaigns (each with its
  business-rule message template, run type, trigger and status), a per-campaign detail with the recipient delivery
  report, the message-template library (business-rule + UGD document templates), the outbound email/SMS gateway config,
  and the registered webhooks (hooks). Author a template, create an SMS campaign from a template + recipient criteria,
  activate it, close it, read its recipient report, register a webhook, and edit the email config — every campaign
  lifecycle command flows through the durable outbox (offline-sync-engine) with an exactly-once idempotency key so a
  campaign never double-activates, every form is rendered from the Fineract GET template (dynamic-template-forms), and
  every control is gated on its exact {ACTION}_{ENTITY} permission (permission-capability-engine). Reads ride
  CACHE_FIRST_SWR Store5 so the campaign list renders offline.
metadata:
  category: permission-gated-feature
  implementation_ready: true
  impl_ready_at: '2026-07-17T12:00:00Z'
  impl_ready_schema: v2
contracts:
  - capability: list_sms_campaigns
    platform_spec: >-
      GET /v1/smscampaigns → StoreFactory.createStore + Room SourceOfTruth(communications) +
      asScreenStream(CACHE_FIRST_SWR); SmsCampaignDto -> SmsCampaign (name, campaignType, triggerType, runType,
      templateName, status); scoped by the permission group
    permission: READ_SMSCAMPAIGN
    error_cases:
      - campaigns_read_failed
      - offline_no_cache
  - capability: get_campaign_recipient_report
    platform_spec: >-
      GET /v1/smscampaigns/{id}/messageByStatus → cached per campaign_id; CampaignMessageDto -> CampaignMessage
      (recipient, deliveryStatus, sentOn) grouped by status with totals; CACHE_FIRST_SWR read-only
    permission: READ_SMSCAMPAIGN
    error_cases:
      - recipient_report_read_failed
  - capability: create_sms_campaign
    platform_spec: >-
      GET /v1/smscampaigns/template (campaign-type / trigger / run-type / provider / template option lists) →
      dynamic-template-forms → POST /v1/smscampaigns command JsonObject (campaignName, campaignType, triggerType,
      businessRuleId, templateMessage, recipientCriteria + dateFormat + locale) enqueued via RoomSubmitOutbox with
      durable IdempotencyKey
    permission: CREATE_SMSCAMPAIGN
    error_cases:
      - campaign_command_rejected
      - template_fetch_failed
  - capability: activate_sms_campaign
    platform_spec: >-
      POST /v1/smscampaigns/{id}?command=activate command JsonObject (activationDate + dateFormat + locale) →
      RoomSubmitOutbox with DURABLE idempotency_key; BatchSubmitHandler.AllOrNothing replay; optimistic status Pending
      -> Active, pending-sync until replayed (never double-activates)
    permission: ACTIVATE_SMSCAMPAIGN
    error_cases:
      - campaign_command_rejected
  - capability: close_sms_campaign
    platform_spec: >-
      POST /v1/smscampaigns/{id}?command=close command JsonObject (closureDate + dateFormat + locale) → durable outbox
      exactly-once; optimistic status Active -> Closed pending-sync; server final authority (rejection ->
      needs-attention)
    permission: CLOSE_SMSCAMPAIGN
    error_cases:
      - campaign_command_rejected
  - capability: create_template
    platform_spec: >-
      GET /v1/templates/template (entity / template-type / mapper option lists) → dynamic-template-forms → POST
      /v1/templates command JsonObject (name, entity, type, mappers, mustache body) enqueued via durable outbox;
      exactly-once replay
    permission: CREATE_TEMPLATE
    error_cases:
      - template_command_rejected
  - capability: create_hook
    platform_spec: >-
      GET /v1/hooks/template (template-name / grouped-events / config-field option lists) → POST /v1/hooks command
      JsonObject (name, isActive, events[], config{payloadURL,contentType}) enqueued via durable outbox
    permission: CREATE_HOOK
    error_cases:
      - hook_command_rejected
  - capability: save_email_config
    platform_spec: >-
      GET /v1/externalservice/SMTP (host, port, username, useTLS, fromAddress; password never returned) →
      dynamic-template-forms → PUT /v1/externalservice/SMTP command JsonObject; password stored via secure storage,
      never logged; enqueued via durable outbox
    permission: UPDATE_EXTERNALSERVICES
    error_cases:
      - email_config_command_rejected
