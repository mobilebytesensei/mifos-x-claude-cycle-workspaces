vm_actions:
  - name: LoadCampaigns
    signature: private fun loadCampaigns()
    state_mutations:
      - uiState=Loading
      - uiState=Content(campaigns) | Empty | NoNetwork(cachedCampaigns)
      - uiState=Error
    side_effects:
      - CommunicationsRepository.campaignsStream(CACHE_FIRST_SWR).collect { … }
    error_handling:
      CampaignsReadFailed: uiState=Error; keep last-known cache; offer Retry
      Offline: uiState=NoNetwork; emit cached campaigns; show offline banner
  - name: SwitchCommsTab
    signature: 'private fun onSwitchCommsTab(tab: CommsTab)'
    state_mutations:
      - selectedTab=tab
      - uiState=Content(reprojected)
    side_effects: []
    error_handling: {}
  - name: OpenCampaignDetail
    signature: 'private fun onOpenCampaignDetail(campaignId: String)'
    state_mutations:
      - selectedCampaignId=campaignId
      - uiState=Content(detail)
    side_effects:
      - CommunicationsRepository.recipientReportStream(campaignId).collect { … }
    error_handling:
      RecipientReportReadFailed: uiState=Error; offer Retry
  - name: ActivateCampaign
    signature: 'private fun activateCampaign(campaignId: String, activationDate: LocalDate)'
    state_mutations:
      - uiState=Submitting | QueuedOffline
      - campaignStatus=Active (optimistic, pending-sync)
    side_effects:
      - RoomSubmitOutbox.enqueue(ActivateCampaignPayload, IdempotencyKey.generate())
      - OfflineSubmitSyncer drain on reconnect (POST .../activate)
    error_handling:
      CampaignCommandRejected: uiState=Error; route to needs-attention-inbox with server_error
  - name: CloseCampaign
    signature: 'private fun closeCampaign(campaignId: String, closureDate: LocalDate)'
    state_mutations:
      - uiState=Submitting | QueuedOffline
      - campaignStatus=Closed (optimistic, pending-sync)
    side_effects:
      - RoomSubmitOutbox.enqueue(CloseCampaignPayload, IdempotencyKey.generate())
    error_handling:
      CampaignCommandRejected: uiState=Error; route to needs-attention-inbox
  - name: ViewRecipientReport
    signature: 'private fun viewRecipientReport(campaignId: String)'
    state_mutations:
      - uiState=Content(report)
    side_effects:
      - CommunicationsRepository.recipientReportStream(campaignId, CACHE_FIRST_SWR).collect { … }
    error_handling:
      RecipientReportReadFailed: uiState=Error; offer Retry
  - name: CreateCampaign
    signature: 'private fun createCampaign(payload: CreateCampaignPayload)'
    state_mutations:
      - uiState=Submitting | QueuedOffline
    side_effects:
      - RoomSubmitOutbox.enqueue(CreateCampaignPayload, IdempotencyKey.generate())
    error_handling:
      CampaignCommandRejected: uiState=Error; route to needs-attention-inbox
  - name: CreateTemplate
    signature: 'private fun createTemplate(payload: CreateTemplatePayload)'
    state_mutations:
      - uiState=Submitting | QueuedOffline
    side_effects:
      - RoomSubmitOutbox.enqueue(CreateTemplatePayload, IdempotencyKey.generate())
    error_handling:
      TemplateCommandRejected: uiState=Error; route to needs-attention-inbox
  - name: RegisterHook
    signature: 'private fun registerHook(payload: RegisterHookPayload)'
    state_mutations:
      - uiState=Submitting | QueuedOffline
    side_effects:
      - RoomSubmitOutbox.enqueue(RegisterHookPayload, IdempotencyKey.generate())
    error_handling:
      HookCommandRejected: uiState=Error; route to needs-attention-inbox
  - name: SaveEmailConfig
    signature: 'private fun saveEmailConfig(payload: EmailConfigPayload)'
    state_mutations:
      - uiState=Submitting | QueuedOffline
    side_effects:
      - RoomSubmitOutbox.enqueue(EmailConfigPayload, IdempotencyKey.generate())
    error_handling:
      EmailConfigCommandRejected: uiState=Error; route to needs-attention-inbox
  - name: RetryLoad
    signature: private fun retryLoad()
    state_mutations:
      - uiState=Loading
      - uiState=Content | Error
    side_effects:
      - CommunicationsRepository.campaignsStream.refreshFresh()
    error_handling: {}
  - name: OpenNeedsAttention
    signature: private fun onOpenNeedsAttention()
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToNeedsAttention)
    error_handling: {}
