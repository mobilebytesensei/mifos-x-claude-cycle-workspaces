templates:
  - id: "4"
    entity_type: "template"
    name: "SMS · Repayment reminder"
    template_type: "SMS Message"
    entity: "loan"
    mustache_body: "Dear {{client.displayName}}, a repayment of {{loan.dueAmount}} on loan {{loan.accountNo}} is due {{loan.dueDate}}."
    mappers: "client, loan, office"
  - id: "21"
    entity_type: "template"
    name: "Loan Agreement (UGD)"
    template_type: "Document Template"
    entity: "loan"
    format: "PDF"
    mustache_body: "LOAN AGREEMENT\nBorrower: {{client.displayName}} (ID {{client.id}})\nPrincipal: {{loan.principal}}  Term: {{loan.numberOfRepayments}}\nInterest: {{loan.annualInterestRate}}% p.a.  First due: {{loan.expectedFirstRepaymentOnDate}}"
    mappers: "client, loan, office, staff"

hooks:
  - id: "3"
    entity_type: "hook"
    name: "Web"
    display_name: "Core-banking event relay"
    is_active: true
    template_name: "Web"
    events:
      - grouping: "loan"
        entity_name: "LOAN"
        action_name: "DISBURSE"
      - grouping: "savings"
        entity_name: "SAVINGSACCOUNT"
        action_name: "DEPOSIT"
    config:
      payload_url: "https://ops.example.org/fineract/webhook"
      content_type: "json"

email_config:
  entity_type: "email_config"
  service: "SMTP"
  host: "smtp.example.org"
  port: 587
  username: "notifications@example.org"
  use_tls: true
  from_address: "no-reply@example.org"
  password_masked: "••••••••"

