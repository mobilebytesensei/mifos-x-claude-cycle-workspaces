feature: m16-communications
# Real Fineract communications working set — a live SMS campaign with its business-rule message
# template, its per-recipient delivery report, a UGD document template, a registered webhook (hook),
# and the outbound email (SMTP) gateway config. Zero placeholders; every field is a value the
# Fineract /smscampaigns, /templates, /hooks and /externalservice endpoints actually return.
campaigns:
  - id: "6"
    entity_type: "campaign"
    campaign_name: "Repayment Reminder — Due Tomorrow"
    campaign_type: "SMS"
    trigger_type: "Triggered"
    run_type: "Repeated"
    provider_id: "1"
    provider_name: "Nexmo SMS Gateway"
    business_rule_id: "12"
    business_rule_name: "Active loans with instalment due in 1 day"
    message_template_id: "4"
    message_template_name: "SMS · Repayment reminder"
    template_message: "Dear {{client.displayName}}, a repayment of {{loan.dueAmount}} on loan {{loan.accountNo}} is due {{loan.dueDate}}. Pay at your branch to stay on track. — {{office.name}}"
    recipient_criteria: "Loans due in 1 day, active status, office hierarchy"
    status: "Active"
    activated_on: "2026-07-14"
    submitted_by: "marketing_admin"

  - id: "7"
    entity_type: "campaign"
    campaign_name: "Monthly Savings Statement Notice"
    campaign_type: "Email"
    trigger_type: "Schedule"
    run_type: "Repeated"
    provider_id: "2"
    provider_name: "Org SMTP relay"
    business_rule_id: "18"
    business_rule_name: "All active savings accounts"
    message_template_id: "9"
    message_template_name: "Email · Monthly statement notice"
    template_message: "Hello {{client.displayName}}, your {{savings.productName}} statement for {{period.month}} is ready. Balance: {{savings.accountBalance}}. Log in to your branch portal to download it."
    recipient_criteria: "All active savers"
    status: "Pending"
    activated_on: null
    submitted_by: "marketing_admin"

