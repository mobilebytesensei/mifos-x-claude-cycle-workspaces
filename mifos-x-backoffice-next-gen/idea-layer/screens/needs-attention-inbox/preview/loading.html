/* ── Top app bar ──────────────────────────────────────────────── */
header[data-shell="top-app-bar"] {

  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
header[data-shell="top-app-bar"] .leading {

  justify-content: center;

  line-height: var(--lh-tight);

}

/* ── Content ──────────────────────────────────────────────────── */
main[data-shell="content"] {

  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  padding: var(--sp-md);
  overflow-y: auto;
}

/* Shimmer primitives */
.sk {
  position: relative;
  overflow: hidden;
  background: var(--surface-variant);
  border-radius: var(--r-md);
}
.sk::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, var(--surface-container-low), transparent);
}
@media (prefers-reduced-motion: no-preference) {
  .sk::after { animation: nai-shimmer 1.3s ease-in-out infinite; }
  @keyframes nai-shimmer { 100% { transform: translateX(100%); } }
}
.sk-chip { height: 32px; border-radius: var(--r-xl); flex: 0 0 auto; }
.sk-label { height: 12px; border-radius: var(--r-sm); }
.sk-title { height: 15px; border-radius: var(--r-sm); }
.sk-sub { height: 11px; border-radius: var(--r-sm); }
.sk-badge { height: 16px; width: 64px; border-radius: var(--r-sm); }
.sk-icon { width: 40px; height: 40px; border-radius: var(--r-md); flex: 0 0 auto; }

/* Filter chip row (shimmer) */
.filter-row { display: flex; gap: var(--sp-sm); overflow: hidden; }

/* Group header (shimmer) */
.group-head {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  margin: var(--sp-xs) 0 calc(-1 * var(--sp-sm) + var(--sp-xs));
}
.group-head .sk-glabel { height: 12px; width: 120px; border-radius: var(--r-sm); }
.group-head .sk-gcount { margin-left: auto; height: 11px; width: 44px; border-radius: var(--r-sm); }

/* Card group (shimmer rows match content composition) */
.group-card {
  list-style: none;
  margin: 0;
  padding: 0;
  border: var(--border-w) solid var(--outline);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
}
.nai-row {
  display: block;
  padding: var(--sp-md);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
.nai-row:last-child { border-bottom: none; }
.row-top { display: flex; align-items: flex-start; gap: var(--sp-md); }
.row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.row-meta { display: flex; gap: var(--sp-sm); }

/* ── Bottom nav ───────────────────────────────────────────────── */
nav[data-shell="bottom-nav"] {
