<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #0091EA;
  --on-primary: #FFFFFF;
  --primary-container: #CBE6FF;
  --on-primary-container: #001E30;
  --secondary: #00796B;
  --on-secondary: #FFFFFF;
  --secondary-container: #B8F2E6;
  --on-secondary-container: #00201A;
  --tertiary: #5B5891;
  --on-tertiary: #FFFFFF;
  --tertiary-container: #E3DFFF;
  --on-tertiary-container: #17124B;
  --surface: #FCFCFF;
  --on-surface: #1A1C1E;
  --surface-variant: #DEE3EB;
  --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9;
  --background: #FCFCFF;
  --on-background: #1A1C1E;
  --outline: #72777F;
  --outline-variant: #C2C7CF;
  --success: #2E7D32;
  --warning: #F57C00;
  --warning-strong: #B45309;
  --warning-container: #FFDDB8;
  --on-warning-container: #2A1700;
  --error: #BA1A1A;
  --on-error: #FFFFFF;
  --error-container: #FFDAD6;
  --on-error-container: #410002;

  --font-body: 'Roboto', system-ui, sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, monospace;
  --fs-h1: 2rem;
  --fs-h2: 1.75rem;
  --fs-h3: 1.375rem;
  --fs-body: 1rem;
  --fs-label: 0.875rem;
  --fs-caption: 0.75rem;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --lh-body: 1.5;
  --lh-tight: 1.3;
  --ls-label: 0.1px;
  --ls-caption: 0.4px;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-xl: 28px;

  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-xxl: 48px;

  --border-w: 1px;

  --el-0: none;
  --el-1: 0 1px 2px rgba(0,0,0,0.05);
  --el-2: 0 2px 6px rgba(0,0,0,0.08);
  --el-3: 0 8px 24px rgba(0,0,0,0.12);
}
:root[data-theme="dark"] {
  --primary: #6FD3FF;
  --on-primary: #00344F;
  --primary-container: #004B70;
  --on-primary-container: #CBE6FF;
  --secondary: #4FD8C4;
  --on-secondary: #003731;
  --secondary-container: #005048;
  --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0FF;
  --on-tertiary: #2C2A5E;
  --tertiary-container: #434076;
  --on-tertiary-container: #E3DFFF;
  --surface: #1A1C1E;
  --on-surface: #E2E2E6;
  --surface-variant: #42474E;
  --on-surface-variant: #C2C7CF;
  --surface-container-low: #1E2022;
  --background: #1A1C1E;
  --on-background: #E2E2E6;
  --outline: #8C9198;
  --outline-variant: #42474E;
  --success: #7FCF82;
  --warning: #FFB868;
  --warning-strong: #E0912F;
  --warning-container: #6B3C00;
  --on-warning-container: #FFDDB8;
  --error: #FFB4AB;
  --on-error: #690005;
  --error-container: #93000A;
  --on-error-container: #FFDAD6;

  --el-0: none;
  --el-1: 0 1px 2px rgba(0,0,0,0.35);
  --el-2: 0 2px 8px rgba(0,0,0,0.45);
  --el-3: 0 10px 28px rgba(0,0,0,0.55);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--background);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  -webkit-font-feature-settings: 'liga';
}

/* ── Top app bar ──────────────────────────────────────────────── */
header[data-shell="top-app-bar"] {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
  box-shadow: var(--el-2);
}
header[data-shell="top-app-bar"] .leading {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-xl);
  color: var(--on-surface-variant);
  background: transparent;
  border: none;
  cursor: default;
}
header[data-shell="top-app-bar"] .app-title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  color: var(--on-surface);
  margin: 0;
}
header[data-shell="top-app-bar"] .bar-count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
}
header[data-shell="top-app-bar"] .bar-count .material-symbols-outlined { font-size: 16px; }

/* ── Content ──────────────────────────────────────────────────── */
main[data-shell="content"] {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  padding: var(--sp-md);
  overflow-y: auto;
}

/* Category filter chips */
.filter-row {
  display: flex;
  gap: var(--sp-sm);
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
  min-height: 32px;
  padding: var(--sp-xs) var(--sp-md);
  border-radius: var(--r-xl);
  border: var(--border-w) solid var(--outline);
  background: var(--surface);
  color: var(--on-surface-variant);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  cursor: pointer;
  white-space: nowrap;
}
.filter-chip .chip-count {
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
}
.filter-chip[aria-pressed="true"] {
  background: var(--primary-container);
  color: var(--on-primary-container);
  border-color: var(--primary-container);
}
.filter-chip .material-symbols-outlined { font-size: 16px; }

/* Group header */
.group-head {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  margin: var(--sp-xs) 0 calc(-1 * var(--sp-sm) + var(--sp-xs));
}
.group-head .g-icon {
  color: var(--on-surface-variant);
  font-size: 20px;
}
.group-head h2 {
  font-size: var(--fs-label);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
  color: var(--on-surface-variant);
  margin: 0;
}
.group-head .g-count {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}

/* Card group */
.group-card {
  list-style: none;
  margin: 0;
  padding: 0;
  border: var(--border-w) solid var(--outline-variant);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--el-1);
}

/* Row */
.nai-row {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface);
  color: var(--on-surface);
  border: none;
  border-bottom: var(--border-w) solid var(--surface-variant);
  padding: var(--sp-md);
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
}
.nai-row:last-child { border-bottom: none; }
.row-top {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-md);
}
.row-icon {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: var(--r-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.row-icon.ic-approval { background: var(--primary-container); color: var(--on-primary-container); }
.row-icon.ic-failed { background: var(--error-container); color: var(--on-error-container); }
.row-icon.ic-overdue { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.row-icon.ic-alert { background: var(--secondary-container); color: var(--on-secondary-container); }
.row-body { flex: 1; min-width: 0; }
.row-title {
  font-size: var(--fs-body);
  font-weight: var(--fw-medium);
  color: var(--on-surface);
  line-height: var(--lh-tight);
}
.row-sub {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  margin-top: 2px;
}
.row-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--sp-sm);
  margin-top: var(--sp-sm);
}
.row-code {
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}
.amt { font-family: var(--font-mono); font-weight: var(--fw-medium); }
.row-chevron { flex: 0 0 auto; color: var(--on-surface-variant); margin-top: 2px; }

/* Priority badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
  padding: 2px var(--sp-sm);
  border-radius: var(--r-sm);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-caption);
  text-transform: uppercase;
}
.badge .material-symbols-outlined { font-size: 14px; }
.pri-critical { background: var(--error-container); color: var(--on-error-container); }
.pri-high { background: var(--warning-container); color: var(--on-warning-container); }
.pri-normal { background: var(--surface-variant); color: var(--on-surface-variant); }

/* Inline resolution actions */
.row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-sm);
  margin-top: var(--sp-md);
  padding-left: calc(40px + var(--sp-md));
}
.act-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-xs);
  min-height: 36px;
  padding: var(--sp-xs) var(--sp-md);
  border-radius: var(--r-xl);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  cursor: pointer;
  border: var(--border-w) solid transparent;
}
.act-btn .material-symbols-outlined { font-size: 18px; }
.act-primary { background: var(--primary); color: var(--on-primary); }
.act-tonal { background: var(--surface-variant); color: var(--on-surface); border-color: var(--outline); }
.act-destructive { background: transparent; color: var(--error); border-color: var(--error); }
.act-text { background: transparent; color: var(--primary); }

/* Per-group error strip (degraded source) — none active in this demo, shown as pattern for alerts=OK */
.group-error {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  background: var(--error-container);
  color: var(--on-error-container);
  border-radius: var(--r-md);
  padding: var(--sp-sm) var(--sp-md);
  margin-bottom: var(--sp-sm);
  font-size: var(--fs-caption);
}
.group-error .material-symbols-outlined { font-size: 18px; flex: 0 0 auto; }
.group-error .g-retry {
  margin-left: auto;
  background: transparent;
  border: none;
  color: var(--on-error-container);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  text-decoration: underline;
  cursor: pointer;
  flex: 0 0 auto;
}

/* ── Bottom nav ───────────────────────────────────────────────── */
nav[data-shell="bottom-nav"] {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  display: flex;
  background: var(--surface);
  border-top: var(--border-w) solid var(--surface-variant);
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: var(--el-2);
}
nav[data-shell="bottom-nav"] a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--sp-sm) var(--sp-xs);
  min-height: 44px;
  color: var(--on-surface-variant);
  text-decoration: none;
  font-size: var(--fs-caption);
  letter-spacing: var(--ls-caption);
  cursor: pointer;
}
nav[data-shell="bottom-nav"] a .nav-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  height: 28px;
  border-radius: var(--r-lg);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] {
  color: var(--on-primary-container);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill {
  background: var(--primary-container);
}

@media (prefers-reduced-motion: no-preference) {
  .nai-row, .act-btn, .filter-chip { transition: filter 120ms ease; }
  .nai-row:active, .act-btn:active, .filter-chip:active { filter: brightness(0.97); }
}
</style>
<style>
/* ── Loading skeleton — mirrors content.html block-for-block ─────── */
.sk {
  background: var(--surface-variant);
  background-image: linear-gradient(90deg, var(--surface-variant) 25%, var(--surface-container-low) 50%, var(--surface-variant) 75%);
  background-size: 200% 100%;
  border-radius: var(--r-sm);
  animation: sk-shimmer 1.4s ease-in-out infinite;
}
@keyframes sk-shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.sk-count   { width: 52px; height: 12px; margin-left: auto; }
.sk-ghead-i { width: 20px; height: 20px; border-radius: var(--r-sm); }
.sk-ghead-t { width: 108px; height: 13px; }
.sk-chip    { flex: 0 0 auto; height: 32px; border-radius: var(--r-xl); }
.sk-icon    { width: 40px; height: 40px; border-radius: var(--r-md); }
.sk-title   { width: 66%; height: 15px; }
.sk-sub     { width: 88%; height: 12px; margin-top: var(--sp-sm); }
.sk-badge   { width: 64px; height: 18px; border-radius: var(--r-sm); }
.sk-code    { width: 148px; height: 12px; }
.sk-btn     { height: 36px; border-radius: var(--r-xl); }
.sk-chev    { width: 20px; height: 20px; border-radius: var(--r-sm); margin-top: 2px; }
.sk-block   { animation-delay: -0.7s; }
</style>
</head>
