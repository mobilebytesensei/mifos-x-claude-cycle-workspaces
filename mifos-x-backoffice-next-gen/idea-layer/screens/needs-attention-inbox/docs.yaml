summary: >-
  The unified, permission-filtered "what needs me" inbox and role-aware home surface. Fans four sources into one ranked,
  grouped feed — pending maker-checker approvals the user canCheck (GET /v1/makercheckers), failed/rejected offline
  replays from the local outbox (DraftDao.observeAllFailed), overdue collections/field tasks scoped by staffId, and
  unread actionable alerts (GET /v1/notifications). Rows group by category (Approvals · Failed syncs · Overdue tasks ·
  Alerts), rank by priority, and drill through into the owning module (M15/M06/M04/M17 or the rejected-command detail).
  Failed replays are resolved via Retry (re-enqueue with a fresh durable idempotency key → POST /v1/batches), Discard
  (explicit ConflictStrategy), or Edit; approvals via inline Approve/Reject; alerts via Snooze. A source that fails to
  load degrades to a per-group error strip — the inbox is never blanked and nothing is ever silently dropped.
vm_actions:
  - OnItemClick
  - OnFilterCategory
  - OnRetryFailedCommand
  - OnDiscardFailedCommand
  - OnApproveInline
  - OnSnoozeItem
  - OnRetryCategorySource
  - OnRetryAggregation
  - OnGoToSyncConsole
error_cases:
