feature: needs-attention-inbox

entry_points:
  - type: home
    description: >-
      The role-aware landing surface — reachable as a primary destination (Home/what-needs-me) for
      every authenticated user; it is the first place a user looks to see what requires them.
  - type: direct
    description: "Opened from the M01 dashboard 'Needs attention' tile or the M17 Sync console."
  - type: from_sync
    description: "offline-sync-engine routes here after a sync when ≥1 replay was rejected."
  - type: from_notification
    description: "A push/actionable notification deep-links into the inbox (or straight to the item)."

transitions:
  # ── load / aggregate ──
  - from: loading
    to: content
    trigger: "fan-in returns ≥1 item across ≥1 permitted category"
  - from: loading
    to: empty
    trigger: "all permitted sources return zero items"
  - from: loading
    to: error
    trigger: "hard initialization failure before any source contributes (e.g. local Room read throws)"

  # ── in-content filtering + per-source recovery ──
  - from: content
    to: content
    trigger: "category filter chip tapped (in-VM filter, no refetch)"
  - from: content
    to: loading
    trigger: "per-category 'Retry loading' tapped on an errored group source"

  # ── drill-through into owning modules ──
  - from: content
    to: m15-approvals-makerchecker
    trigger: "an approval row tapped (opens the checker detail / M15)"
  - from: content
    to: m06-collections
    trigger: "an overdue-collections task row tapped"
  - from: content
    to: m04-loan-portfolio
    trigger: "an overdue loan-repayment task or loan alert row tapped"
  - from: content
    to: m17-sync-settings
    trigger: "'Sync now' tapped from the empty state, or a sync-diagnostics alert tapped"

  # ── inline resolutions ──
  - from: content
    to: resolving
    trigger: "Retry / Discard / Approve / Snooze chosen on a row"
  - from: resolving
    to: content
    trigger: "resolution applied (re-enqueued / discarded / approved / snoozed) — row leaves or updates"
  - from: resolving
    to: error
    trigger: "resolution call failed hard (network + no local fallback)"

  # ── error recovery ──
  - from: error
    to: loading
    trigger: "'Retry' tapped — re-runs the full fan-in"
