feature: needs-attention-inbox

# Fan-in of four sources into one ranked feed. The local outbox (draft_outbox) is the
# system-of-record for failed replays and reads via a Room Flow (no network). The three
# remote sources are CACHE_FIRST_SWR through Store5 so the inbox works fully offline.

entries:
  # ── SOURCE 2 · failed/rejected outbox commands (LOCAL Room, offline SoT) ──
  - trigger: on_mount
    source: local.draft_dao_observe_all_failed
    target_state: content
    loading_state: loading
    error_state: error
    on_error:
      nav_target: null
      error_code: local_read_failed
    persistence_contract:
      store: room
      table: draft_outbox
      keys: [idempotency_key, action, entity, payload_json, status, server_error, conflict_strategy, rejected_at, snooze_until]
      note: >-
        Reads status IN (failed, rejected) rows via DraftDao.observeAllFailed(); Retry updates status
        + mints a fresh idempotency_key, Discard deletes with conflict_strategy=discard, Snooze sets
        snooze_until — all in place. This table is the ONLY irreplaceable local store.

  # ── SOURCE 1 · maker-checker approvals (remote, cached, permission-filtered) ──
  - trigger: on_mount
    source: remote.makercheckers_list
    target_state: content
    loading_state: loading
    error_state: content   # a source error degrades to a per-group strip, NOT the whole-screen error
    on_error:
      nav_target: null
      error_code: approvals_source_failed
    persistence_contract:
      store: room
      table: maker_checker_cache
      keys: [audit_id, action_name, entity_name, maker, made_on_date, processing_result]
      note: "CACHE_FIRST_SWR mirror of GET /v1/makercheckers; contributes rows only where canCheck(action,entity)."

  # ── SOURCE 3 · overdue collections / field tasks (remote, cached, staffId-scoped) ──
  - trigger: on_mount
    source: remote.collections_overdue
    target_state: content
    loading_state: loading
    error_state: content
    on_error:
      nav_target: null
      error_code: tasks_source_failed
    persistence_contract:
      store: room
      table: collection_task_cache
      keys: [entity_ref, entity_type, due_date, staff_id, amount_due, status]
      note: "Derived from the staffId-scoped collection sheet; overdue/undue-today rows become 'overdue_tasks'."

  # ── SOURCE 4 · unread actionable alerts (remote, cached) ──
  - trigger: on_mount
    source: remote.notifications_unread
    target_state: content
    loading_state: loading
    error_state: content
    on_error:
      nav_target: null
      error_code: alerts_source_failed
    persistence_contract:
      store: room
      table: notification_cache
      keys: [notification_id, object_type, object_id, action, content, is_read, created_at, snooze_until]
      note: "CACHE_FIRST_SWR mirror of GET /v1/notifications; snooze_until suppresses a row without marking it read."

cache:
  strategy: cache_first_swr
  note: >-
    All remote sources read cache-first and revalidate in the background per FreshnessBands; the
    local outbox is authoritative and never revalidated. The aggregated feed re-emits whenever any
    contributing Flow updates (Room change, SWR refresh, or a permission-fingerprint swap).

