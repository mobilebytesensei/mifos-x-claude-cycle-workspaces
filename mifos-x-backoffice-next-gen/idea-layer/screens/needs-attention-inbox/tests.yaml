schema_version: v1.0.0
feature: needs-attention-inbox
scenarios:
  # ── state coverage ──
  - id: loading_shows_grouped_shimmer
    preconditions: ["the inbox is opened", "sources have not resolved yet"]
    actions: ["open needs-attention inbox"]
    assertions: ["the loading state shows a grouped shimmer list", "no source error is shown"]
    priority: medium

  - id: content_aggregates_four_sources_grouped_and_ranked
    preconditions: ["the user has approvals to check, failed replays, overdue tasks, and unread alerts"]
    actions: ["open needs-attention inbox"]
    assertions:
      - "rows appear grouped under Approvals / Failed syncs / Overdue tasks / Alerts headers"
      - "each group shows its item count"
      - "rows within the feed are ordered by priority (Critical > High > Normal)"
    priority: high

  - id: empty_state_when_all_sources_clear
    preconditions: ["no approvals, no failed replays, no overdue tasks, no unread alerts"]
    actions: ["open needs-attention inbox"]
    assertions: ["the 'all caught up' empty state is shown", "a 'Sync now' affordance is present"]
    priority: medium

  - id: error_state_only_on_hard_init_failure
    preconditions: ["the local Room outbox read throws before any source contributes"]
    actions: ["open needs-attention inbox"]
    assertions: ["the whole-screen error state is shown", "a Retry re-runs the full fan-in"]
    priority: medium

  - id: resolving_state_on_inline_action
    preconditions: ["a failed-sync row is visible"]
    actions: ["tap Retry on the row"]
    assertions: ["the row shows a resolving/progress indicator", "the rest of the list stays interactive"]
    priority: medium

  # ── permission filtering ──
  - id: only_permitted_categories_contribute
    preconditions: ["the user holds no *_CHECKER permission"]
    actions: ["open needs-attention inbox"]
    assertions: ["no Approvals group is present", "failed-sync / task / alert groups still render if they have items"]
    priority: high

  - id: approve_control_only_for_authorized_entries
    preconditions: ["an approval row exists for an entry the user is NOT authorized to check"]
    actions: ["open needs-attention inbox"]
    assertions: ["that row shows no Approve control"]
    priority: high

  # ── drill-through ──
  - id: item_drills_into_owning_module
    preconditions: ["an overdue collections task row is visible"]
    actions: ["tap the overdue collections row"]
    assertions: ["navigation goes to the Collections module (M06) for that group"]
    priority: high

  # ── per-source degradation (never blank) ──
  - id: one_source_failing_degrades_to_group_strip
    preconditions: ["the maker-checker source times out but the outbox + alerts load"]
    actions: ["open needs-attention inbox"]
    assertions:
      - "the Approvals group shows an inline retry strip"
      - "the Failed syncs and Alerts groups still render their rows"
      - "the whole-screen error state is NOT shown"
    priority: high

  - id: retry_group_reloads_only_that_source
    preconditions: ["the Approvals group shows a load-error strip"]
    actions: ["tap 'Retry loading' on the Approvals strip"]
    assertions: ["only the approvals source refetches", "already-loaded groups are not discarded"]
    priority: medium

  # ── resolutions ──
  - id: retry_reenqueues_with_fresh_idempotency
    preconditions: ["a rejected outbox command is retryable"]
    actions: ["tap Retry on the command"]
    assertions:
      - "the command is re-enqueued to the outbox with a FRESH durable idempotency key"
      - "the next sync replays it via POST /v1/batches"
    priority: high

  - id: discard_removes_command_explicitly
    preconditions: ["a rejected command can never succeed (e.g. loan already closed)"]
    actions: ["tap Discard", "confirm"]
    assertions: ["the command is removed with an explicit ConflictStrategy=discard", "it is never silently dropped"]
    priority: high

  - id: approve_inline_posts_to_makercheckers
    preconditions: ["an approval row the user can check is visible"]
    actions: ["tap Approve on the row"]
    assertions: ["POST /v1/makercheckers/{id}?command=approve is issued", "the row leaves the inbox on success"]
    priority: high

  - id: snooze_suppresses_alert_without_resolving
    preconditions: ["an alert row is visible"]
    actions: ["tap Snooze", "pick a window"]
    assertions: ["the row is suppressed from the feed until the window elapses", "the alert is not marked resolved or lost"]
    priority: medium

  - id: replay_blocked_when_permission_revoked
    preconditions: ["a queued command's permission was revoked since it was queued"]
    actions: ["tap Retry on the command"]
    assertions: ["the row is surfaced as BLOCKED_PERMISSION_REVOKED", "it is never silently dropped"]
    priority: high
