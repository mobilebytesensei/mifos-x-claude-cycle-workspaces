vm_actions:
  - name: LoadReferenceData
    signature: private fun loadReferenceData()
    state_mutations:
      - uiState=Loading
      - uiState=Success(collections) | Empty | Error
    side_effects:
      - >-
        OrgReferenceRepository.streamAll(CACHE_FIRST_SWR) —
        offices/staff/currencies/holidays/workingdays/funds/paymenttypes/codes
    error_handling:
      NetworkError: uiState=Error; keep last cached reference data (dropdowns stay populated); offer Retry
      Unauthorized403: route to permission-capability-engine (drift protocol)
  - name: SelectEntityTab
    signature: 'private fun onSelectEntityTab(tab: OrgEntityTab)'
    state_mutations:
      - selectedTab=<tab>
      - uiState=Success | Empty
    side_effects: []
    error_handling: {}
  - name: OpenOfficeDetail
    signature: 'private fun onOpenOfficeDetail(officeId: String)'
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToOfficeDetail(officeId))
    error_handling: {}
  - name: OpenCodeDetail
    signature: 'private fun onOpenCodeDetail(codeId: String)'
    state_mutations: []
    side_effects:
      - OrgReferenceRepository.streamCodeValues(codeId, CACHE_FIRST_SWR)
    error_handling: {}
  - name: CreateOffice
    signature: 'private fun createOffice(payload: OrgCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(CREATE_OFFICE, payload, idempotencyKey) — online-only drain
    error_handling:
      Offline: block; disabled with 'connect to edit configuration' reason (reference edits online-only)
      CommandRejected: route entry to needs-attention-inbox; uiState=Error
      Queued: uiState=Submitting → 'Submitted for approval' (maker-checker)
  - name: CreateStaff
    signature: 'private fun createStaff(payload: OrgCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(CREATE_STAFF, payload, idempotencyKey)
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: ConfigureCurrencies
    signature: 'private fun configureCurrencies(selected: List<String>)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(UPDATE_CURRENCY, payload, idempotencyKey)
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: CreateHoliday
    signature: 'private fun createHoliday(payload: OrgCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(CREATE_HOLIDAY, payload, idempotencyKey)
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: ActivateHoliday
    signature: 'private fun activateHoliday(holidayId: String)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(ACTIVATE_HOLIDAY, holidayId, idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
  - name: EditWorkingDays
    signature: 'private fun editWorkingDays(payload: OrgCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(UPDATE_WORKINGDAYS, payload, idempotencyKey)
    error_handling:
      Offline: block; online-only
  - name: CreateFund
    signature: 'private fun createFund(payload: OrgCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(CREATE_FUND, payload, idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
  - name: CreatePaymentType
    signature: 'private fun createPaymentType(payload: OrgCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(CREATE_PAYMENTTYPE, payload, idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
  - name: AddCodeValue
    signature: 'private fun addCodeValue(codeId: String, payload: OrgCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(CREATE_CODEVALUE, codeId, payload, idempotencyKey)
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: BulkReassignLoans
    signature: 'private fun bulkReassignLoans(payload: LoanReassignmentPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - OrgOutboxRepository.enqueue(BULKREASSIGN_LOAN, payload, idempotencyKey) — durable key prevents double-reassign
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: RetryLoad
    signature: private fun onRetryLoad()
    state_mutations:
      - uiState=Loading
    side_effects:
      - OrgReferenceRepository.streamAll.refreshFresh()
    error_handling:
      Unauthorized403: route to permission-capability-engine
error_cases:
