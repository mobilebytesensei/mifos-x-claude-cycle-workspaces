  - needs-attention-inbox
permissions_gate: >-
  *_OFFICE, *_STAFF, *_CURRENCY, *_HOLIDAY (+ACTIVATE_), *_WORKINGDAYS, *_FUND, *_PAYMENTTYPE, *_CODE/_CODEVALUE,
  BULKREASSIGN_LOAN
acceptance_refs:
  - Org structure + reference-data admin; also feeds offline dropdown vocabularies for all forms
plan_ref: idea-plan.yaml#features[m09-organization]
summary: >-
  M09 · Organization — the reference-data control plane: offices (hierarchy), staff/employees, currencies, holidays,
  working days, funds, payment types, codes + code-values, and bulk loan-officer reassignment. Two roles in one module:
  (1) ADMIN — each create/edit entry-point gated by its exact {ACTION}_{ENTITY} permission, ONLINE-ONLY + maker-checker
  aware (config drift must never deferred-sync); (2) VOCABULARY — the READ side is cached CACHE_FIRST_SWR and is the
  offline dropdown backbone every dynamic-template-form consumes (offices, loan officers, currencies, payment types,
  funds, codes). All forms render from the Fineract entity template (dynamic-template-forms); writes funnel through the
  offline-sync-engine outbox (online-only drain); rejected commands route to needs-attention-inbox.
metadata:
  category: back-office-domain
  implementation_ready: true
  impl_ready_at: '2026-07-17T00:00:00Z'
  impl_ready_schema: v2
contracts:
  - capability: org_reference_read
    platform_spec: >-
      Per-entity CACHE_FIRST_SWR Store<Unit,List<T>> over Room (OrgReferenceEntity keyed by (entity_type, entity_id));
      GET /v1/{offices,staff,currencies,holidays,workingdays,funds,paymenttypes,codes}; renders all ScreenState variants
      via ScreenContent; the offline dropdown vocabulary source for dynamic-template-forms
    permission: READ_OFFICE
    error_cases:
      - org_read_failed
      - org_offline_no_cache
  - capability: office_hierarchy_read
    platform_spec: GET /v1/offices → indented hierarchy tree built from parent_id / hierarchy path; offline via cache
    permission: READ_OFFICE
    error_cases:
      - org_read_failed
  - capability: code_values_read
    platform_spec: >-
      GET /v1/codes + GET /v1/codes/{codeId}/codevalues → the dropdown option vocabulary (LoanPurpose, Gender,
      ClientType, …) consumed by every dynamic form; CACHE_FIRST_SWR
    permission: READ_CODE
    error_cases:
      - org_read_failed
  - capability: reference_create_command
    platform_spec: >-
      POST /v1/{offices,staff,holidays,funds,paymenttypes} + POST /v1/codes/{id}/codevalues + POST
      /v1/holidays/{id}?command=activate — form from GET /{entity}/template via dynamic-template-forms; queued through
      RoomSubmitOutbox with a durable idempotency key; ONLINE-ONLY drain (config must not deferred-sync); maker-checker
      aware (queued commandId+empty changes → PENDING_APPROVAL)
    permission: CREATE_OFFICE
    error_cases:
      - command_rejected
      - command_pending_approval
      - permission_drift_403
      - edit_offline_blocked
  - capability: reference_update_command
    platform_spec: >-
      PUT /v1/offices/{id} + PUT /v1/currencies (selected ISO codes) + PUT /v1/workingdays (RRULE + reschedule
      behaviour) — queued, durable-idempotent, ONLINE-ONLY, maker-checker aware
    permission: UPDATE_CURRENCY
    error_cases:
      - command_rejected
      - edit_offline_blocked
  - capability: bulk_loan_reassignment
    platform_spec: >-
      POST /v1/loans/loanreassignment — form from GET /v1/loans/loanreassignment/template; moves every active loan from
      a from-officer to a to-officer for an office in one transaction; queued, durable-idempotent, ONLINE-ONLY,
      maker-checker aware
    permission: BULKREASSIGN_LOAN
    error_cases:
      - reassignment_rejected
      - edit_offline_blocked
