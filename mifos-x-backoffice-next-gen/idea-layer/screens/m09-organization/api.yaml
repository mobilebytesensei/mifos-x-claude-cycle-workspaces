feature: m09-organization

# Fineract organization / reference-data surface. READ ops are CACHE_FIRST_SWR (the offline dropdown
# backbone for every dynamic form); template ops (GET /{entity}/template) drive dynamic-template-forms;
# WRITE ops are ONLINE-ONLY + maker-checker aware and funnel through the offline-sync-engine outbox.
# Every op carries Fineract-Platform-TenantId; every mutation gated by its exact {ACTION}_{ENTITY} code.

endpoints:
  # ── Offices ──────────────────────────────────────────────────────────
  - id: list_offices
    method: GET
    path: "/v1/offices"
    description: "Office hierarchy (parent → sub-office); the org-structure tree + the office dropdown source for staff/holiday/reassignment forms"
    response_type: "OfficeDto[]"
    response:
      shape: list
      pagination:
        strategy: none
        description: "Fineract office hierarchy — returned as a bounded unpaged array (offline dropdown backbone), rendered in-place with no page controls."
    requires_auth: true
    requires_permission: [READ_OFFICE]
    cacheable: true

  - id: get_office_detail
    method: GET
    path: "/v1/offices/{officeId}"
    description: "Single office detail (name, parent, opening date, external id, hierarchy path)"
    response_type: "OfficeDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_OFFICE]
    cacheable: true

  - id: get_office_template
    method: GET
    path: "/v1/offices/template"
    description: "Office create/edit form template (allowed parent offices, field defaults) → dynamic-template-forms"
    response_type: "OfficeTemplateDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_OFFICE]
    cacheable: true

  - id: create_office
    method: POST
    path: "/v1/offices"
    description: "Create an office; ONLINE-ONLY, maker-checker aware"
    request_type: "OfficeRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [CREATE_OFFICE]
    maker_checker: true

  - id: update_office
    method: PUT
    path: "/v1/offices/{officeId}"
    description: "Edit an office; ONLINE-ONLY, maker-checker aware"
    request_type: "OfficeRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [UPDATE_OFFICE]
    maker_checker: true

  # ── Staff / employees ────────────────────────────────────────────────
  - id: list_staff
    method: GET
    path: "/v1/staff"
    description: "Staff/employee list (scoped by office hierarchy); source of the loan-officer dropdown for origination + reassignment"
    response_type: "StaffDto[]"
    response:
      shape: list
      pagination:
        strategy: none
        description: "Fineract staff list (office-scoped) — returned as a bounded unpaged array (loan-officer dropdown source), rendered in-place with no page controls."
    requires_auth: true
    requires_permission: [READ_STAFF]
    cacheable: true

  - id: get_staff_template
    method: GET
    path: "/v1/staff/template"
    description: "Staff create/edit form template (offices, defaults) → dynamic-template-forms"
    response_type: "StaffTemplateDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_STAFF]
    cacheable: true

  - id: create_staff
    method: POST
    path: "/v1/staff"
    description: "Create a staff member; ONLINE-ONLY, maker-checker aware"
    request_type: "StaffRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [CREATE_STAFF]
    maker_checker: true

  - id: update_staff
    method: PUT
    path: "/v1/staff/{staffId}"
    description: "Edit a staff member; ONLINE-ONLY, maker-checker aware"
    request_type: "StaffRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [UPDATE_STAFF]
    maker_checker: true

  # ── Currencies ───────────────────────────────────────────────────────
  - id: list_currencies
    method: GET
    path: "/v1/currencies"
    description: "The tenant's selected currencies + the full allowed-currency catalogue; the currency dropdown source for products/accounts"
    response_type: "CurrencyConfigDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_CURRENCY]
    cacheable: true

  - id: update_currencies
    method: PUT
    path: "/v1/currencies"
    description: "Set which currencies the tenant may use (body: currencies[] of ISO codes); ONLINE-ONLY"
    request_type: "CurrencyUpdateRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [UPDATE_CURRENCY]
    maker_checker: true

  # ── Holidays ─────────────────────────────────────────────────────────
  - id: list_holidays
    method: GET
    path: "/v1/holidays"
    description: "Holidays per office (name, date, reschedule-to date, status)"
    response_type: "HolidayDto[]"
    response:
      shape: list
      pagination:
        strategy: none
        description: "Fineract holidays per office — returned as a bounded unpaged array, rendered in-place with no page controls."
    requires_auth: true
    requires_permission: [READ_HOLIDAY]
    cacheable: true

  - id: get_holiday_template
    method: GET
    path: "/v1/holidays/template"
    description: "Holiday create form template (offices, repayment-reschedule options) → dynamic-template-forms"
    response_type: "HolidayTemplateDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_HOLIDAY]
    cacheable: true

  - id: create_holiday
    method: POST
    path: "/v1/holidays"
    description: "Create a holiday (shifts repayment due-dates for selected offices); ONLINE-ONLY, maker-checker aware"
    request_type: "HolidayRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [CREATE_HOLIDAY]
    maker_checker: true

  - id: activate_holiday
    method: POST
    path: "/v1/holidays/{holidayId}?command=activate"
    description: "Activate a draft holiday so it applies to repayment schedules; ONLINE-ONLY"
    request_type: "HolidayCommandRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [ACTIVATE_HOLIDAY]
    maker_checker: true

  # ── Working days ─────────────────────────────────────────────────────
  - id: get_working_days
    method: GET
    path: "/v1/workingdays"
    description: "The recurring working-days pattern (RRULE) + non-working-day repayment-rescheduling behaviour"
    response_type: "WorkingDaysDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_WORKINGDAYS]
    cacheable: true

  - id: update_working_days
    method: PUT
    path: "/v1/workingdays"
    description: "Update the working-days RRULE + reschedule/extend-term behaviour; ONLINE-ONLY"
    request_type: "WorkingDaysRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [UPDATE_WORKINGDAYS]
    maker_checker: true

  # ── Funds ────────────────────────────────────────────────────────────
  - id: list_funds
    method: GET
    path: "/v1/funds"
    description: "Funds (source-of-money tags attachable to loans); the fund dropdown source for products/loans"
    response_type: "FundDto[]"
    response:
      shape: list
      pagination:
        strategy: none
        description: "Fineract funds catalog — returned as a bounded unpaged array (fund dropdown source), rendered in-place with no page controls."
    requires_auth: true
    requires_permission: [READ_FUND]
    cacheable: true

  - id: create_fund
    method: POST
    path: "/v1/funds"
    description: "Create a fund; ONLINE-ONLY"
    request_type: "FundRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [CREATE_FUND]
    maker_checker: true

  # ── Payment types ────────────────────────────────────────────────────
  - id: list_payment_types
    method: GET
    path: "/v1/paymenttypes"
    description: "Payment types (Cash / Bank transfer / Mobile money …); the 'payment method' dropdown source for every repayment/deposit form"
    response_type: "PaymentTypeDto[]"
    response:
      shape: list
      pagination:
        strategy: none
        description: "Fineract payment types — returned as a bounded unpaged array (payment-method dropdown source), rendered in-place with no page controls."
    requires_auth: true
    requires_permission: [READ_PAYMENTTYPE]
    cacheable: true

  - id: create_payment_type
    method: POST
    path: "/v1/paymenttypes"
    description: "Create a payment type; ONLINE-ONLY"
    request_type: "PaymentTypeRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [CREATE_PAYMENTTYPE]
    maker_checker: true

  # ── Codes + code-values (dropdown backbone) ──────────────────────────
  - id: list_codes
    method: GET
    path: "/v1/codes"
    description: "Codes + their code-values — the offline dropdown vocabulary source that every dynamic-template-form consumes (LoanPurpose, Gender, ClientType, …)"
    response_type: "CodeDto[]"
    response:
      shape: list
      pagination:
        strategy: none
        description: "Fineract codes vocabulary — returned as a bounded unpaged array (dropdown-vocabulary source for dynamic forms), rendered in-place with no page controls."
    requires_auth: true
    requires_permission: [READ_CODE]
    cacheable: true

  - id: list_code_values
    method: GET
    path: "/v1/codes/{codeId}/codevalues"
    description: "The values of one code (e.g. LoanPurpose → its options)"
    response_type: "CodeValueDto[]"
    response:
      shape: list
      pagination:
        strategy: none
        description: "Fineract code-values for one code — returned as a bounded unpaged array (dropdown option set), rendered in-place with no page controls."
    requires_auth: true
    requires_permission: [READ_CODE]
    cacheable: true

  - id: add_code_value
    method: POST
    path: "/v1/codes/{codeId}/codevalues"
    description: "Add a code-value (a new dropdown option); ONLINE-ONLY"
    request_type: "CodeValueRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [CREATE_CODEVALUE]
    maker_checker: true

  # ── Bulk loan-officer reassignment ───────────────────────────────────
  - id: get_reassignment_template
    method: GET
    path: "/v1/loans/loanreassignment/template"
    description: "Bulk reassignment form template (offices, loan officers) → dynamic-template-forms"
    response_type: "LoanReassignmentTemplateDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [BULKREASSIGN_LOAN]
    cacheable: true

  - id: bulk_reassign_loans
    method: POST
    path: "/v1/loans/loanreassignment"
    description: "Move every active loan from a from-officer to a to-officer in one transaction; ONLINE-ONLY, maker-checker aware"
    request_type: "LoanReassignmentRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [BULKREASSIGN_LOAN]
    maker_checker: true
