feature: m09-organization

entry_points:
  - type: nav_root
    description: "Organization module root — a nav entry gated on the Fineract 'organisation' permission group; visible only if the user holds ≥1 READ_{ENTITY} of {OFFICE,STAFF,CURRENCY,HOLIDAY,WORKINGDAYS,FUND,PAYMENTTYPE,CODE}"
  - type: cross_feature
    description: "Reached from admin-setup journeys and from dynamic-template-forms indirectly (the reference-data this module edits is the vocabulary those forms read)"

transitions:
  # ── Load ──
  - from: loading
    to: content
    trigger: "reference-data collections loaded (offices/staff/currencies/holidays/workingdays/funds/paymenttypes/codes) — CACHE_FIRST_SWR"
  - from: loading
    to: empty
    trigger: "the initially-selected reference tab has zero rows in the user's office scope"
  - from: loading
    to: error
    trigger: "reference-data fetch failed AND no cache present"

  # ── Detail drill-through (stay within the module's master/detail) ──
  - from: content
    to: content
    trigger: "open office / staff / code detail (navigate within m09-organization)"

  # ── Create / edit (ONLINE-ONLY reference-data mutations) ──
  - from: content
    to: submitting
    trigger: "create/edit an office, staff, currency set, holiday, working-days, fund, payment type, or code value (queued through the outbox)"
  - from: empty
    to: submitting
    trigger: "create the first row of an empty reference tab via its 'New …' CTA"
  - from: content
    to: content
    trigger: "reference-data create/edit SUBMITTED — the new/updated row appears after the follow-on refresh"
  - from: submitting
    to: content
    trigger: "command accepted (or PENDING_APPROVAL under maker-checker) — return to the tab with a 'Saved' / 'Submitted for approval' chip"

  # ── Bulk reassignment ──
  - from: content
    to: submitting
    trigger: "bulk loan-officer reassignment enqueued (from-officer → to-officer)"

  # ── Errors + recovery ──
  - from: submitting
    to: error
    trigger: "create/edit/reassignment rejected by Fineract (validation / duplicate / 403 drift) — routed to needs-attention-inbox"
  - from: content
    to: error
    trigger: "background refresh failed"
  - from: error
    to: loading
    trigger: "Retry — Store5 stream.refreshFresh()"
  - from: error
    to: content
    trigger: "403 drift — permission refresh completes, UI re-resolves and prunes now-hidden controls"
