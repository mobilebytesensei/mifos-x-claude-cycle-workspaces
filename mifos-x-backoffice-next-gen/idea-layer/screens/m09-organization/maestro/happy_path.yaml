appId: org.mifos.backoffice
---
# M09 · Organization happy path — open the module, confirm the reference-data
# surface renders, drill into an office. Gated at the module root on the
# organisation permission group; reads are CACHE_FIRST_SWR (work offline).
- launchApp
- assertVisible:
    id: "m09-organization_header"
- assertVisible:
    id: "m09-organization_tabs"
- assertVisible:
    id: "m09-organization_content"
- tapOn:
    id: "m09-organization_office_row"
- assertVisible:
    id: "m09-organization_header"
