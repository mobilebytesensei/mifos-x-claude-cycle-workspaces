appId: org.mifos.backoffice
---
# M05 happy path — open the deposits module, open an active savings account,
# record a deposit through the durable outbox, confirm the ledger updates.
- launchApp
- assertVisible:
    id: "m05-savings-deposits-shares_header"
# Account list content renders (savings/FD/RD/share, grouped by type)
- assertVisible:
    id: "m05-savings-deposits-shares_content"
# Open the first account's detail
- tapOn:
    id: "m05-savings-deposits-shares_item"
# The permission-gated command bar is present on the detail
- assertVisible:
    id: "m05-savings-deposits-shares_deposit"
# Record a deposit (routes through the template form → outbox)
- tapOn:
    id: "m05-savings-deposits-shares_deposit"
- assertVisible:
    id: "dynamic-template-forms_submit"
