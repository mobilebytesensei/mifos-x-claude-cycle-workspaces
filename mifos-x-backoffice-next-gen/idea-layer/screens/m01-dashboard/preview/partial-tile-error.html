<style>
:root {
  --primary: #006CB5;
  --on-primary: #FFFFFF;
  --primary-container: #CBE6FF;
  --on-primary-container: #001D33;
  --secondary: #00796B;
  --on-secondary: #FFFFFF;
  --secondary-container: #B8F2E6;
  --on-secondary-container: #00201A;
  --tertiary: #5B5891;
  --on-tertiary: #FFFFFF;
  --tertiary-container: #E3DFFF;
  --on-tertiary-container: #17124B;
  --surface: #FCFCFF;
  --on-surface: #1A1C1E;
  --surface-variant: #DEE3EB;
  --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9;
  --background: #FCFCFF;
  --on-background: #1A1C1E;
  --outline: #72777F;
  --success: #2E7D32;
  --warning: #F57C00;
  --warning-strong: #B45309;
  --error: #BA1A1A;
  --on-error: #FFFFFF;
  --error-container: #FFDAD6;
  --on-error-container: #410002;

  --font-body: 'Roboto', system-ui, sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, monospace;
  --fs-h1: 2rem;
  --fs-h2: 1.75rem;
  --fs-h3: 1.375rem;
  --fs-body: 1rem;
  --fs-label: 0.875rem;
  --fs-caption: 0.75rem;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --lh-body: 1.5;
  --lh-tight: 1.3;
  --ls-label: 0.1px;
  --ls-caption: 0.4px;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-xl: 28px;

  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-xxl: 48px;

  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF;
  --on-primary: #003354;
  --primary-container: #004B78;
  --on-primary-container: #CBE6FF;
  --secondary: #9CD6C9;
  --on-secondary: #003730;
  --secondary-container: #005046;
  --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0F5;
  --on-tertiary: #2C2960;
  --tertiary-container: #434078;
  --on-tertiary-container: #E3DFFF;
  --surface: #1A1C1E;
  --on-surface: #E2E2E6;
  --surface-variant: #42474E;
  --on-surface-variant: #C2C7CF;
  --surface-container-low: #1E2022;
  --background: #1A1C1E;
  --on-background: #E2E2E6;
  --outline: #8C9199;
  --success: #7FD589;
  --warning: #FFB77C;
  --warning-strong: #F0A868;
  --error: #FFB4AB;
  --on-error: #690005;
  --error-container: #93000A;
  --on-error-container: #FFDAD6;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--background);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  -webkit-font-feature-settings: 'liga';
}

/* ── Top app bar ──────────────────────────────────────────────── */
header[data-shell="top-app-bar"] {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
header[data-shell="top-app-bar"] .leading {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-xl);
  color: var(--on-surface-variant);
  background: transparent;
  border: none;
  cursor: default;
}
header[data-shell="top-app-bar"] .app-title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  color: var(--on-surface);
  margin: 0;
}

/* ── Content ──────────────────────────────────────────────────── */
main[data-shell="content"] {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  padding: var(--sp-md);
  overflow-y: auto;
}

.section-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-sm);
  margin: var(--sp-xs) 0 calc(-1 * var(--sp-sm) + var(--sp-xs));
}
.section-label h2 {
  font-size: var(--fs-label);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
  color: var(--on-surface-variant);
  margin: 0;
}
.section-label .count {
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--sp-md);
}
.kpi-card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-xs);
  text-align: left;
  width: 100%;
  background: var(--surface-container-low);
  color: var(--on-surface);
  border: var(--border-w) solid var(--surface-variant);
  border-radius: var(--r-lg);
  padding: var(--sp-md);
  cursor: pointer;
  font-family: inherit;
  text-decoration: none;
}
.kpi-card .kpi-head {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  color: var(--on-surface-variant);
}
.kpi-card .kpi-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--r-md);
  flex: 0 0 auto;
}
.kpi-card .kpi-icon .material-symbols-outlined { font-size: 18px; }
.kpi-icon.tone-primary { background: var(--primary-container); color: var(--on-primary-container); }
.kpi-icon.tone-tertiary { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.kpi-card .kpi-title {
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  color: var(--on-surface-variant);
  line-height: var(--lh-tight);
}
.kpi-card .kpi-value {
  font-family: var(--font-mono);
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  color: var(--on-surface);
  line-height: var(--lh-tight);
}
.kpi-card .kpi-sub {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}
.kpi-card .kpi-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  align-self: flex-start;
  padding: 1px var(--sp-sm);
  border-radius: var(--r-sm);
  font-size: var(--fs-caption);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-caption);
}
.kpi-badge.pos { background: var(--secondary-container); color: var(--on-secondary-container); }

/* Failed tile — inline error card (isolated, never blanks the rest) */
.kpi-card.is-error {
  background: var(--error-container);
  border-color: var(--error);
  cursor: default;
}
.kpi-card.is-error .kpi-icon {
  background: var(--surface);
  color: var(--error);
}
.kpi-card.is-error .kpi-title { color: var(--on-error-container); }
.kpi-card.is-error .err-text {
  font-size: var(--fs-caption);
  color: var(--on-error-container);
}
.retry-tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-xs);
  align-self: flex-start;
  min-height: 32px;
  margin-top: var(--sp-xs);
  padding: var(--sp-xs) var(--sp-md);
  border-radius: var(--r-xl);
  border: var(--border-w) solid var(--error);
  background: var(--surface);
  color: var(--error);
  font-family: inherit;
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  cursor: pointer;
}
.retry-tile .material-symbols-outlined { font-size: 16px; }

@media (prefers-reduced-motion: no-preference) {
  .kpi-card, .retry-tile { transition: filter 120ms ease; }
  .kpi-card:active, .retry-tile:active { filter: brightness(0.97); }
}

/* ── Bottom nav ───────────────────────────────────────────────── */
nav[data-shell="bottom-nav"] {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  display: flex;
  background: var(--surface);
  border-top: var(--border-w) solid var(--surface-variant);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
nav[data-shell="bottom-nav"] a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--sp-sm) var(--sp-xs);
  min-height: 44px;
  color: var(--on-surface-variant);
  text-decoration: none;
  font-size: var(--fs-caption);
  letter-spacing: var(--ls-caption);
  cursor: pointer;
}
nav[data-shell="bottom-nav"] a .nav-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  height: 28px;
  border-radius: var(--r-lg);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] {
  color: var(--on-primary-container);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill {
  background: var(--primary-container);
}
</style>

  <main data-shell="content" data-state="partial-tile-error">

    <div class="section-label" data-component-type="LayoutBox" data-component-id="tile_grid" data-from-ui-yaml-path="components[2]">
      <h2>Your dashboard</h2>
      <span class="count">1 tile failed</span>

    <div class="kpi-grid" role="list" aria-label="Dashboard tiles; one failed to load">

      <!-- Portfolio-at-Risk KPI (#kpi_portfolio_at_risk_card) — FAILED, inline error -->
      <div class="kpi-card is-error"

        <button data-component-type="Button"
                data-component-variant="text"

          Retry

         data-component-id="kpi_active_clients_card"
         data-nav-to="client-list"
         data-nav-type="push"
         data-action-id="open_active_clients"
         class="kpi-card"
         role="listitem button" tabindex="0"
         aria-label="Active Clients 2,317, Nairobi branch. Open the active clients list.">

          <span class="kpi-icon tone-primary"><span class="material-symbols-outlined" aria-hidden="true">group</span></span>

    <div class="section-label" data-component-type="LayoutBox" data-component-id="recent_activity_label">

    <!-- Recent-activity feed (#recent_activity_list) — each row → nav needs-attention-inbox -->
    <ul class="activity-list"

          <span class="act-icon" aria-hidden="true" style="flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r-xl);background:var(--secondary-container);color:var(--on-secondary-container);"><span class="material-symbols-outlined" style="font-size:18px;">task_alt</span></span>

            <span style="font-size:var(--fs-caption);color:var(--on-surface-variant);">2 h ago</span>
