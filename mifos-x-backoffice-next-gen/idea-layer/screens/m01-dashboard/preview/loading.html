/* ── Top app bar ──────────────────────────────────────────────── */
header[data-shell="top-app-bar"] {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);

  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
header[data-shell="top-app-bar"] .leading {

  color: var(--on-surface-variant);
  background: transparent;
  border: none;
  cursor: default;
}
header[data-shell="top-app-bar"] .app-title {

  line-height: var(--lh-tight);

}

/* ── Content ──────────────────────────────────────────────────── */
main[data-shell="content"] {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  padding: var(--sp-md);
  overflow-y: auto;
}

/* Skeleton primitives */
.sk {
  background: var(--surface-variant);
  border-radius: var(--r-sm);
  position: relative;
  overflow: hidden;
}
@media (prefers-reduced-motion: no-preference) {
  .sk::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--surface) 0%, transparent),
      color-mix(in srgb, var(--surface) 55%, transparent),
      color-mix(in srgb, var(--surface) 0%, transparent));
    animation: pulse 1.4s ease-in-out infinite;
  }
}
@keyframes pulse {
  100% { transform: translateX(100%); }
}
.sk-line { height: 12px; }

.sk-loading-status {

}
.spinner {

  height: 16px;
  border-radius: var(--r-xl);
  border: 2px solid var(--surface-variant);
  border-top-color: var(--primary);
}
@media (prefers-reduced-motion: no-preference) {
  .spinner { animation: spin 900ms linear infinite; }
}
@keyframes spin { 100% { transform: rotate(360deg); } }

.sk-section-label { margin: var(--sp-xs) 0; }

.sk-kpi-grid {

}
.sk-kpi-card {

  border: var(--border-w) solid var(--surface-variant);
