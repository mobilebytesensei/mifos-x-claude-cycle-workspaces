appId: org.mifos.backoffice
# Happy path: dashboard loads permitted tiles, the header + tile grid render,
# a permitted KPI card is visible, and tapping it navigates to its module.
# Tags reference the ui.yaml testTags; only tiles the signed-in user is
# permitted to see are asserted (demo login resolves a full-access roster).
---
- launchApp
- assertVisible:
    id: "m01-dashboard_header"
- assertVisible:
    id: "m01-dashboard_content"
- assertVisible:
    id: "m01-dashboard_kpi_par"
- tapOn:
    id: "m01-dashboard_kpi_par"
- assertVisible:
    id: "report-runner_header"
