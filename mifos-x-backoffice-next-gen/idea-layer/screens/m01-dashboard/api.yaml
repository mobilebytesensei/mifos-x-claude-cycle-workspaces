feature: m01-dashboard
# Each dashboard tile owns exactly one Fineract read. A tile is only fetched
# when the PermissionEvaluator says the user may see it, so requires_permission
# here mirrors the server's own gate. All four are cacheable → CACHE_FIRST_SWR,
# so a tile renders its last cached value offline. Global Fineract-Platform-TenantId
# header is sent on every call.
endpoints:
  - id: run_dashboard_reports
    method: GET
    path: "/v1/runreports/{reportName}"
    description: >-
      Parameterized report runner backing the KPI cards (Portfolio-at-Risk / active-clients /
      collections-due). Called per report with R_* params + output-type; scoped to the user's
      office. Report reads gate on READ_{reportName} OR REPORTING_SUPER_USER OR ALL_FUNCTIONS(_READ).
    query_params:
      - name: reportName
        type: string
        required: true
        description: "The Fineract report to run (e.g. 'Portfolio at Risk', 'Active Loans - Summary') — the code READ_{reportName} is the exact-match report permission."
      - name: R_officeId
        type: integer
        required: false
        description: "Office scope for the KPI; defaults to the signed-in user's officeId."
    response_type: "ReportResult"
    response:
      shape: object
    requires_auth: true
    requires_permission: [REPORTING_SUPER_USER]
    tenant_header: true
    cacheable: true

  - id: get_makerchecker_count
    method: GET
    path: "/v1/makercheckers"
    description: >-
      Pending maker-checker approvals backing the pending-approvals KPI card. ?makerCheckerable
      pre-flight identifies the entries requiring approval; the card shows the count self-scoped
      to what this user can approve. Reachable iff CHECKER_SUPER_USER OR any held code ends in _CHECKER.
    query_params:
      - name: makerCheckerable
        type: boolean
        required: false
        description: "When true, returns only entries whose commands require approval (drives the pending-approval count)."
    response_type: "MakerCheckerEntry[]"
    response:
      shape: list
      pagination:
        strategy: none
        description: "Fineract maker-checker audit search — returned as a bounded unpaged array (self-scoped to approvable entries); the KPI count is derived client-side."
    requires_auth: true
    requires_permission: [CHECKER_SUPER_USER]
    tenant_header: true
    cacheable: true

  - id: get_collectionsheet_today
    method: GET
    path: "/v1/collectionsheet"
    description: >-
      Today's individual collection sheet backing the collections-due KPI card for a field officer,
      staffId-scoped to their route. Provides the due amount + due count shown on the tile.
    query_params:
      - name: transactionDate
        type: string
        required: false
        description: "The collection date (defaults to today); sent with dateFormat + locale."
      - name: staffId
        type: integer
        required: false
        description: "Restricts the sheet to the officer's own route; defaults to the signed-in staffId."
    response_type: "CollectionSheet"
    response:
      shape: object
    requires_auth: true
    requires_permission: [READ_COLLECTIONSHEET]
    tenant_header: true
    cacheable: true

  - id: get_notifications
    method: GET
    path: "/v1/notifications"
    description: >-
      Notification feed backing the recent-activity list — approvals actioned, transactions posted,
      sync outcomes. Poll + mark-read; requires no special permission (available to any authenticated
      user). Each row deep-links to the referenced entity.
    query_params:
      - name: isRead
        type: boolean
        required: false
        description: "Filter to unread notifications when true; omit for the full recent feed."
    response_type: "Notification[]"
    response:
      shape: list
      pagination:
        strategy: offset
        param_offset: offset
        param_limit: limit
    requires_auth: true
    requires_permission: []
    tenant_header: true
    cacheable: true
