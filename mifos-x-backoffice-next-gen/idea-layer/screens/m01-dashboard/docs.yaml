vm_actions:
  - name: LoadDashboard
    signature: private fun loadDashboard()
    state_mutations:
      - uiState=Loading
      - uiState=Success(tiles) | Empty | PartialTileError(tiles, failedTileIds) | NoNetwork(cachedTiles)
      - uiState=Error
    side_effects:
      - PermissionEvaluator.resolveTileRoster()
      - 'per permitted tile: StoreFactory.stream(tileId).collect { … }'
    error_handling:
      TileRosterResolveFailed: uiState=Error; retain encrypted set; offer Retry
      SingleTileFailure: uiState=PartialTileError; isolate to that card; keep the rest
      Offline: uiState=NoNetwork; emit cached tile values; show offline banner
  - name: RetryFailedTile
    signature: 'private fun retryFailedTile(tileId: String)'
    state_mutations:
      - tile[tileId]=Loading
      - tile[tileId]=Success | still-error
    side_effects:
      - DashboardTileRepository.refetch(tileId)
    error_handling:
      TileStillFailing: keep inline error placeholder on that card only
  - name: RetryDashboard
    signature: private fun retryDashboard()
    state_mutations:
      - uiState=Loading
      - uiState=Success | Error
    side_effects:
      - PermissionEvaluator.resolveTileRoster()
    error_handling:
      RetainedSetAbsent: route to re-authenticate
  - name: OpenTileTarget
    signature: 'private fun onOpenTileTarget(tileId: String)'
    handles:
      - open_portfolio_at_risk
      - open_active_clients
      - open_todays_route
      - open_checker_inbox
      - quick_new_client
      - quick_take_repayment
      - open_activity_item
    state_mutations: []
    side_effects:
      - sendEvent(NavigateTo(tile.target))
    error_handling:
      PermissionRevoked: >-
        The destination re-resolves its own permission gate on entry; if the tile's gating permission was revoked since
        the roster resolved, cancel the navigation, surface a "You no longer have access to that area" snackbar, and
        drop the stale tile from the roster so the dashboard reflects the current permission set.
      TargetUnavailable: >-
        If the resolved target route is not registered (the module is disabled in this deployment), show a non-blocking
        "That area is unavailable" snackbar and keep the user on the dashboard rather than routing to a dead
        destination.
  - name: ViewAccess
    signature: private fun onViewAccess()
    handles:
      - view_access
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToAccessPermissions)
    error_handling:
      RetainedSetAbsent: >-
        If the retained encrypted PermissionSet is absent when opening Access & Permissions, route the user to
        re-authenticate rather than presenting an empty access surface.
      NavigationTargetUnavailable: >-
        If the permission-capability-engine surface fails to resolve, surface a retryable error snackbar and keep the
        user on the dashboard empty state instead of a blank screen.
error_cases:
  - tile_roster_resolve_failed
  - retained_permission_set_absent
  - tile_load_failed
  - report_unavailable
