feature: m01-dashboard
# The dashboard is the canonical "same binary renders per permission" surface.
# Each item below is ONE persona's resolved home — the exact tile roster the
# PermissionEvaluator produces for that permission bundle. Values are realistic
# Fineract figures (KES, PAR30, sandbox-shaped). The 'tiles' array is the ordered
# set of cards actually rendered for that persona; a card absent from the array
# is HIDDEN because the persona lacks its gating permission (fail-closed).
items:
  # ── system admin: ALL_FUNCTIONS umbrella → every tile present ──
  - id: "dash_system_admin"
    persona: "system-admin"
    office: "Head Office"
    permissions_sample: ["ALL_FUNCTIONS"]
    tile_count: 6
    tiles:
      - { tile_id: "kpi_par", kind: kpi, title: "Portfolio at Risk", value: "4.2%", subtitle: "PAR30 · all offices", source: "runreports:Portfolio at Risk", gate: "REPORTING_SUPER_USER∨READ_{report}" }
      - { tile_id: "kpi_active_clients", kind: kpi, title: "Active Clients", value: "18,204", subtitle: "across 12 branches", source: "runreports:Client Summary", gate: "READ_CLIENT" }
      - { tile_id: "kpi_collections_due", kind: kpi, title: "Collections Due Today", value: "KES 1,940,500", subtitle: "612 dues", source: "collectionsheet", gate: "READ_COLLECTIONSHEET" }
      - { tile_id: "kpi_pending_approvals", kind: kpi, title: "Approvals Waiting", value: "37", subtitle: "maker-checker queue", source: "makercheckers", gate: "CHECKER_SUPER_USER" }
      - { tile_id: "qa_new_client", kind: quick_action, title: "New Client", source: "nav:client-list", gate: "CREATE_CLIENT" }
      - { tile_id: "qa_take_repayment", kind: quick_action, title: "Take Repayment", source: "nav:loan-detail", gate: "REPAYMENT_LOAN" }
    recent_activity:
      - { icon: approval, text: "Loan #4471 approved by J. Otieno", when: "12 min ago" }
      - { icon: sync, text: "Sync complete · 0 pending", when: "1 h ago" }
    note: "Umbrella short-circuit — no enumeration; every dashboard tile is VISIBLE."

  # ── branch manager: portfolio oversight, no field capture ──
  - id: "dash_branch_manager"
    persona: "branch-manager"
    office: "Nairobi Branch"
    permissions_sample: ["READ_CLIENT", "APPROVE_LOAN", "DISBURSE_LOAN", "READ_REPORT", "READ_AUDIT", "ASSIGNSTAFF_CLIENT", "READ_Active Loans - Summary", "READ_Portfolio at Risk"]
    tile_count: 3
    tiles:
      - { tile_id: "kpi_par", kind: kpi, title: "Portfolio at Risk", value: "5.1%", subtitle: "PAR30 · Nairobi branch", source: "runreports:Portfolio at Risk", gate: "READ_Portfolio at Risk" }
      - { tile_id: "kpi_active_clients", kind: kpi, title: "Active Clients", value: "2,317", subtitle: "Nairobi branch", source: "runreports:Client Summary", gate: "READ_CLIENT" }
      - { tile_id: "kpi_pending_approvals", kind: kpi, title: "Approvals Waiting", value: "8", subtitle: "loans awaiting your approval", source: "makercheckers", gate: "APPROVE_LOAN_CHECKER-scoped" }
    recent_activity:
      - { icon: approval, text: "3 loans disbursed today", when: "2 h ago" }
    note: "PAR + active-clients + approvals; no collections-due tile (no READ_COLLECTIONSHEET) and no mutating quick-actions (no CREATE_CLIENT/REPAYMENT_LOAN)."

  # ── collections field officer: today's route, capture-first ──
  - id: "dash_collections_officer"
    persona: "collections-field-officer"
    office: "Kibera Field Office"
    staff_scoped: true
    permissions_sample: ["READ_COLLECTIONSHEET", "SAVECOLLECTIONSHEET_CENTER", "REPAYMENT_LOAN", "DEPOSIT_SAVINGSACCOUNT", "SAVEORUPDATEATTENDANCE_MEETING", "READ_CENTER", "READ_GROUP", "READ_CLIENT", "READ_LOAN"]
    tile_count: 2
    tiles:
      - { tile_id: "kpi_collections_due", kind: kpi, title: "Collections Due Today", value: "KES 84,200", subtitle: "3 centers · 42 dues · Kibera cluster", source: "collectionsheet", gate: "READ_COLLECTIONSHEET" }
      - { tile_id: "qa_take_repayment", kind: quick_action, title: "Take Repayment", source: "nav:loan-detail", gate: "REPAYMENT_LOAN" }
    recent_activity:
      - { icon: transaction, text: "Repayment KES 3,000 queued (offline)", when: "just now" }
      - { icon: attendance, text: "Attendance saved · Kibera Center A", when: "20 min ago" }
    note: "staffId-scoped collections-due + repayment quick-action; no PAR/approvals tiles (no report/checker perms); new-client hidden (no CREATE_CLIENT)."

  # ── accountant: no portfolio KPIs, no field capture ──
  - id: "dash_accountant"
    persona: "accountant"
    office: "Head Office"
    permissions_sample: ["READ_JOURNALENTRY", "CREATE_JOURNALENTRY", "REVERSE_JOURNALENTRY", "READ_GLACCOUNT", "CREATE_GLCLOSURE", "READ_PROVISIONINGENTRIES", "READ_CLIENT"]
    tile_count: 1
    tiles:
      - { tile_id: "kpi_active_clients", kind: kpi, title: "Active Clients", value: "18,204", subtitle: "org-wide (read)", source: "runreports:Client Summary", gate: "READ_CLIENT" }
    recent_activity:
      - { icon: accounting, text: "GL closure Nov-2026 pending review", when: "3 h ago" }
    note: "Accountant holds no report/collections/checker dashboard-tile permissions; only the read-clients KPI + the always-on recent-activity feed render. (Accounting work lives in M07, not on the dashboard.)"

  # ── auditor: read-only glass case — KPIs present, zero quick-actions ──
  - id: "dash_auditor"
    persona: "auditor"
    office: "Head Office"
    permissions_sample: ["ALL_FUNCTIONS_READ", "READ_AUDIT"]
    tile_count: 3
    tiles:
      - { tile_id: "kpi_par", kind: kpi, title: "Portfolio at Risk", value: "4.2%", subtitle: "PAR30 · all offices (read)", source: "runreports:Portfolio at Risk", gate: "ALL_FUNCTIONS_READ" }
      - { tile_id: "kpi_active_clients", kind: kpi, title: "Active Clients", value: "18,204", subtitle: "org-wide (read)", source: "runreports:Client Summary", gate: "ALL_FUNCTIONS_READ" }
      - { tile_id: "kpi_collections_due", kind: kpi, title: "Collections Due Today", value: "KES 1,940,500", subtitle: "612 dues (read)", source: "collectionsheet", gate: "ALL_FUNCTIONS_READ" }
    recent_activity:
      - { icon: audit, text: "142 audit entries today", when: "1 h ago" }
    note: "ALL_FUNCTIONS_READ grants every read/report tile but NEVER a mutating quick-action — no New-Client or Take-Repayment tile is present (canDo uses ALL_FUNCTIONS only)."

  # ── empty-access edge: freshly-provisioned user, no tile permissions ──
  - id: "dash_no_access"
    persona: "new-provisioned-user"
    office: "Nairobi Branch"
    permissions_sample: []
    tile_count: 0
    tiles: []
    recent_activity: []
    note: "Renders the empty state — 'no dashboard tiles available for your access' with a link to Access & Permissions; the screen is never blank."

# regenerated-provenance: idea-data-demo re-run 2026-07-31 (--auto enrichment drain) — 6 persona home rosters (system-admin · branch-manager · collections-officer · accountant · auditor · no-access) re-verified as the exact PermissionEvaluator tile intersection; real KES Fineract figures; DD1–DD6 pass, zero placeholders.
