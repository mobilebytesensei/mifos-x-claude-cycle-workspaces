feature: m01-dashboard
entry_points:
  - type: post_login
    description: "Landing screen after login-permission-bootstrap — the first screen reachable once the PermissionSet is resolved and the capability surface is built."
  - type: nav_root
    description: "The Home nav root; re-entered whenever the user returns to the dashboard tab from any other module."

transitions:
  # ── roster resolution + per-tile hydration ──
  - from: loading
    to: content
    trigger: "permitted tile roster resolved (PermissionEvaluator) AND every permitted tile's data loaded (live or cache)"
  - from: loading
    to: empty
    trigger: "roster resolved but the user holds no permission for any dashboard tile"
  - from: loading
    to: partial-tile-error
    trigger: "roster resolved but ≥1 permitted tile's fetch failed (the rest still render)"
  - from: loading
    to: no-network
    trigger: "offline — permitted tiles show last cached values with an offline banner"
  - from: loading
    to: error
    trigger: "the tile roster itself could not be resolved (capability map unavailable / malformed permission payload)"

  # ── retries ──
  - from: partial-tile-error
    to: content
    trigger: "retry_failed_tile succeeded — every tile now has a value"
  - from: partial-tile-error
    to: partial-tile-error
    trigger: "retry_failed_tile re-attempted but a tile still failed"
  - from: error
    to: loading
    trigger: "retry_dashboard — re-resolve the roster from the retained encrypted PermissionSet"
  - from: no-network
    to: content
    trigger: "connectivity restored + SWR revalidation refreshed the tiles"

  # ── tile / quick-action navigation (each gated; target present only if permitted) ──
  - from: content
    to: report-runner
    trigger: "open_portfolio_at_risk — Portfolio-at-Risk KPI card tapped (canRunReport)"
  - from: content
    to: client-list
    trigger: "open_active_clients — Active-clients KPI card tapped (READ_CLIENT), or quick_new_client (CREATE_CLIENT)"
  - from: content
    to: collection-sheet
    trigger: "open_todays_route — Collections-due KPI card tapped (READ_COLLECTIONSHEET)"
  - from: content
    to: checker-inbox
    trigger: "open_checker_inbox — Pending-approvals KPI card tapped (hasAnyChecker)"
  - from: content
    to: loan-detail
    trigger: "quick_take_repayment — Take-repayment quick-action tapped (REPAYMENT_LOAN)"
  - from: content
    to: needs-attention-inbox
    trigger: "open_activity_item — a recent-activity notification row tapped (deep-link / failed-sync routing)"
  - from: empty
    to: permission-capability-engine
    trigger: "view_access — no-tiles user taps 'View my access' to see what permissions they hold"
