schema_version: v1.0.0
feature: m01-dashboard
# Regenerated 2026-07-31 (/idea-test-generate) against the enriched ui.yaml/api.yaml —
# coverage: one scenario per ui.yaml state (loading/content/empty/partial-tile-error/no-network/error)
# + per api operation (run_dashboard_reports, get_makerchecker_count, get_collectionsheet_today, get_notifications)
# + per on_click action (open_portfolio_at_risk, open_active_clients, open_todays_route,
#   open_checker_inbox, quick_new_client, quick_take_repayment, open_activity_item,
#   retry_failed_tile, retry_dashboard, view_access)
# + permission/persona logic (system-admin/branch-manager/collections-officer/accountant/auditor/no-access)
# Demo values grounded in demo-data.yaml (KES, PAR30, count figures — not invented).
scenarios:
  # ── state coverage ──

  - id: loading_shimmer_per_permitted_tile
    description: "On mount, permitted tiles resolve from the retained PermissionSet and show shimmer skeletons while their sources load"
    preconditions:
      - "user is authenticated with a valid retained PermissionSet"
      - "at least one tile source is slow to respond (simulated latency)"
    actions:
      - "navigate to the dashboard before all tile fetches complete"
    assertions:
      - "state is loading"
      - "header 'm01-dashboard_header' is visible"
      - "a shimmer skeleton is rendered for each tile the user is permitted to see"
      - "no KPI value or quick-action label is visible during the loading state"
    priority: medium

  - id: content_system_admin_all_six_tiles
    description: "System admin with ALL_FUNCTIONS sees all 6 tiles (4 KPIs + 2 quick-actions) populated with live KES values"
    preconditions:
      - "login returned permissions: [ALL_FUNCTIONS]"
      - "all four Fineract tile sources are reachable"
    actions:
      - "complete login as system-admin"
      - "wait for dashboard to reach content state"
    assertions:
      - "state transitions loading -> content"
      - "tile_grid 'm01-dashboard_content' is visible"
      - "kpi_par card ('m01-dashboard_kpi_par') shows 4.2% · PAR30 · all offices"
      - "kpi_active_clients card ('m01-dashboard_kpi_active_clients') shows 18,204 across 12 branches"
      - "kpi_collections_due card ('m01-dashboard_kpi_collections_due') shows KES 1,940,500 · 612 dues"
      - "kpi_pending_approvals card ('m01-dashboard_kpi_pending_approvals') shows 37 entries in the maker-checker queue"
      - "qa_new_client quick-action tile ('m01-dashboard_qa_new_client') is present (CREATE_CLIENT via ALL_FUNCTIONS)"
      - "qa_take_repayment quick-action tile ('m01-dashboard_qa_take_repayment') is present (REPAYMENT_LOAN via ALL_FUNCTIONS)"
      - "recent-activity list ('m01-dashboard_recent_activity') shows rows (e.g. 'Loan #4471 approved by J. Otieno · 12 min ago')"
      - "tile count is 6"
    priority: high

  - id: empty_no_tile_permissions
    description: "A freshly-provisioned user with an empty permissions[] sees the empty state, not a blank screen"
    preconditions:
      - "login returned permissions: []"
      - "no tiles are permitted for this user"
    actions:
      - "open dashboard"
    assertions:
      - "state is empty"
      - "header 'm01-dashboard_header' is visible"
      - "tile_grid is absent"
      - "a 'no dashboard tiles available for your access' empty-state message is displayed"
      - "view_access link ('m01-dashboard_view_access') is visible"
    priority: medium

  - id: partial_tile_error_isolates_to_card
    description: "One failing tile source shows an inline error on that card only; all other permitted tiles render normally"
    preconditions:
      - "user is permitted for ≥2 tiles"
      - "one tile's Fineract report endpoint returns HTTP 500 (e.g. GET /v1/runreports/Portfolio at Risk)"
    actions:
      - "open dashboard"
      - "wait for tile resolution"
    assertions:
      - "state is partial-tile-error"
      - "the failing card shows an inline error placeholder with a per-tile Retry button ('m01-dashboard_retry_tile')"
      - "all other permitted tiles (e.g. active-clients, pending-approvals) render their values normally"
      - "the offline banner is absent"
      - "state is NOT global error — the tile roster itself resolved successfully"
    priority: high

  - id: no_network_tiles_show_cached_values
    description: "Offline, every permitted tile shows its last cached value from dashboard_tile_cache with an offline banner"
    preconditions:
      - "tiles previously cached in dashboard_tile_cache (Room)"
      - "network is unavailable"
    actions:
      - "open dashboard while offline"
    assertions:
      - "state is no-network"
      - "offline banner ('m01-dashboard_offline_banner') is visible"
      - "each permitted tile renders its last cached value (e.g. collections-due shows KES 84,200 for a Kibera field officer)"
      - "tapping a tile still navigates to its target module (navigation reads from cache)"
      - "tiles whose data was never cached show a 'not synced yet' hint instead of a blank"
    priority: medium

  - id: error_roster_resolve_fails_full_screen_retry
    description: "If the tile roster cannot be resolved (capability map unavailable or malformed permission payload), a full-screen retry is shown and the retained set is preserved"
    preconditions:
      - "capability map is unavailable or the permission payload is malformed at mount time"
    actions:
      - "open dashboard"
    assertions:
      - "state is error"
      - "retry button ('m01-dashboard_retry_dashboard') is visible"
      - "the last-known encrypted PermissionSet is retained in secure settings (app stays usable)"
      - "no crash occurs"
      - "tile_grid is absent"
    priority: medium

  # ── interaction / on_click coverage ──

  - id: kpi_par_tile_navigates_to_report_runner
    description: "Tapping the Portfolio-at-Risk KPI card navigates to the report-runner (M14) pre-scoped to the PAR report"
    preconditions:
      - "permissions include REPORTING_SUPER_USER or READ_Portfolio at Risk"
      - "dashboard in content state"
      - "kpi_par card shows a PAR value (e.g. 4.2% all-offices or 5.1% Nairobi branch)"
    actions:
      - "tap 'm01-dashboard_kpi_par' card"
    assertions:
      - "action open_portfolio_at_risk fires"
      - "navigation targets report-runner (M14) with Portfolio-at-Risk report pre-scoped"
      - "no crash or empty navigation target"
    priority: high

  - id: kpi_active_clients_tile_navigates_to_client_list
    description: "Tapping the Active Clients KPI card navigates to the Clients list (M02) filtered to active clients"
    preconditions:
      - "permissions include READ_CLIENT"
      - "dashboard in content state"
      - "kpi_active_clients card shows 18,204 (system-admin / auditor) or 2,317 (branch-manager)"
    actions:
      - "tap 'm01-dashboard_kpi_active_clients' card"
    assertions:
      - "action open_active_clients fires"
      - "navigation targets client-list (M02) filtered to active clients"
    priority: high

  - id: kpi_collections_due_tile_navigates_to_collection_sheet
    description: "Tapping the Collections Due KPI card navigates to today's Collection Sheet (M06) staffId-scoped for the officer"
    preconditions:
      - "permissions include READ_COLLECTIONSHEET"
      - "dashboard in content state"
      - "kpi_collections_due card shows KES 84,200 · 42 dues · Kibera cluster (field officer) or KES 1,940,500 · 612 dues (system-admin)"
    actions:
      - "tap 'm01-dashboard_kpi_collections_due' card"
    assertions:
      - "action open_todays_route fires"
      - "navigation targets collection-sheet (M06) staffId-scoped for the signed-in officer"
    priority: high

  - id: kpi_pending_approvals_tile_navigates_to_checker_inbox
    description: "Tapping the Pending Approvals KPI card navigates to the Maker-Checker inbox (M15) self-scoped for this user"
    preconditions:
      - "permissions include CHECKER_SUPER_USER or a *_CHECKER code"
      - "dashboard in content state"
      - "kpi_pending_approvals card shows 37 (system-admin) or 8 (branch-manager)"
    actions:
      - "tap 'm01-dashboard_kpi_pending_approvals' card"
    assertions:
      - "action open_checker_inbox fires"
      - "navigation targets checker-inbox (M15) scoped to entries this user can approve or reject"
    priority: high

  - id: qa_new_client_tile_opens_onboarding_wizard
    description: "Tapping the New Client quick-action tile opens the new-client onboarding wizard in the Clients module"
    preconditions:
      - "permissions include CREATE_CLIENT (e.g. system-admin via ALL_FUNCTIONS)"
      - "dashboard in content state"
    actions:
      - "tap 'm01-dashboard_qa_new_client' tile"
    assertions:
      - "action quick_new_client fires"
      - "navigation targets client-list (M02) and opens the new-client onboarding wizard for KYC capture"
      - "tile is HIDDEN for users without CREATE_CLIENT (e.g. auditor with ALL_FUNCTIONS_READ)"
    priority: high

  - id: qa_take_repayment_tile_opens_loan_repayment_capture
    description: "Tapping the Take Repayment quick-action tile opens the Loan Portfolio repayment capture; queued offline when no network"
    preconditions:
      - "permissions include REPAYMENT_LOAN (e.g. collections-field-officer)"
      - "dashboard in content state"
    actions:
      - "tap 'm01-dashboard_qa_take_repayment' tile"
    assertions:
      - "action quick_take_repayment fires"
      - "navigation targets loan-detail repayment capture"
      - "when offline, the repayment is queued to the offline outbox with a durable idempotency key"
    priority: high

  - id: activity_item_tap_deep_links_to_referenced_entity
    description: "Tapping a recent-activity notification row deep-links to the referenced entity (client, loan, or failed sync)"
    preconditions:
      - "recent-activity list is populated (e.g. 'Loan #4471 approved by J. Otieno · 12 min ago')"
      - "dashboard in content state"
    actions:
      - "tap the first row in 'm01-dashboard_recent_activity'"
    assertions:
      - "action open_activity_item fires"
      - "navigation targets the entity referenced by the notification (e.g. Loan #4471)"
      - "destination screen re-resolves its own permission gate on entry"
    priority: medium

  - id: retry_failed_tile_refetches_only_failing_card
    description: "Tapping the per-tile Retry in partial-tile-error re-fetches only that tile; loaded tiles are untouched"
    preconditions:
      - "state is partial-tile-error"
      - "one tile (e.g. kpi_par report) returned HTTP 500"
    actions:
      - "tap 'm01-dashboard_retry_tile' on the failing kpi_par card"
    assertions:
      - "action retry_failed_tile fires for that tileId only"
      - "DashboardTileRepository.refetch(tileId) is called for the failing tile and no other"
      - "all other successfully-loaded tiles do not re-fetch or flicker"
      - "on success, the inline error card is replaced with the live PAR value (e.g. 4.2%)"
      - "on continued failure, the inline error placeholder remains on that card only"
    priority: medium

  - id: view_access_link_navigates_to_permissions_surface
    description: "The View-my-access link in the empty state navigates to Access and Permissions (permission-capability-engine)"
    preconditions:
      - "state is empty"
      - "user holds no tile permissions"
    actions:
      - "tap 'm01-dashboard_view_access' link"
    assertions:
      - "action view_access fires"
      - "navigation targets permission-capability-engine"
    priority: medium

  - id: retry_dashboard_resolves_roster_from_retained_set
    description: "Tapping the full-screen Retry in the error state re-resolves the tile roster from the retained encrypted PermissionSet without re-login"
    preconditions:
      - "state is error"
      - "retained encrypted PermissionSet is present in secure settings"
    actions:
      - "tap 'm01-dashboard_retry_dashboard'"
    assertions:
      - "action retry_dashboard fires"
      - "PermissionEvaluator.resolveTileRoster() is called using the retained encrypted PermissionSet"
      - "state transitions loading -> content (or error if resolution still fails)"
      - "no re-login is required when the retained set is present"
    priority: medium

  # ── permission / persona logic coverage ──

  - id: tiles_are_permission_intersection_no_role_branching
    description: "Same binary renders a different tile set per persona purely from permissions — no role name is branched on"
    preconditions:
      - "demo PermissionSet A: branch-manager (READ_Portfolio at Risk, READ_CLIENT, APPROVE_LOAN; no READ_COLLECTIONSHEET)"
      - "demo PermissionSet B: collections-field-officer (READ_COLLECTIONSHEET, REPAYMENT_LOAN; no report permissions)"
    actions:
      - "resolve dashboard for branch-manager"
      - "resolve dashboard for collections-field-officer"
    assertions:
      - "branch-manager sees PAR (5.1% · Nairobi branch) + active-clients (2,317) + approvals (8) KPI cards; collections-due card is ABSENT"
      - "field officer sees collections-due (KES 84,200 · 3 centers · 42 dues · Kibera cluster) + take-repayment tile; PAR and approvals cards are ABSENT"
      - "no role name is branched on — the tile roster is 100% data-driven from PermissionEvaluator"
    priority: high

  - id: auditor_read_only_zero_mutating_tiles
    description: "An ALL_FUNCTIONS_READ auditor sees every read KPI tile but zero mutating quick-action tiles"
    preconditions:
      - "login returned permissions: [ALL_FUNCTIONS_READ, READ_AUDIT]"
    actions:
      - "open dashboard as auditor"
    assertions:
      - "PAR (4.2% · PAR30 · all offices, read) KPI card is present"
      - "active-clients (18,204 · org-wide, read) KPI card is present"
      - "collections-due (KES 1,940,500 · 612 dues, read) KPI card is present"
      - "New-Client quick-action tile ('m01-dashboard_qa_new_client') is HIDDEN (canDo requires ALL_FUNCTIONS, not ALL_FUNCTIONS_READ)"
      - "Take-Repayment quick-action tile ('m01-dashboard_qa_take_repayment') is HIDDEN"
      - "tile count is 3"
    priority: high

  - id: accountant_sees_only_active_clients_tile
    description: "An accountant without report, collections, or checker permissions sees only the active-clients KPI and the always-on activity feed"
    preconditions:
      - "login returned permissions: [READ_JOURNALENTRY, CREATE_JOURNALENTRY, REVERSE_JOURNALENTRY, READ_GLACCOUNT, CREATE_GLCLOSURE, READ_PROVISIONINGENTRIES, READ_CLIENT]"
    actions:
      - "open dashboard as accountant"
    assertions:
      - "active-clients KPI card shows 18,204 (org-wide read)"
      - "PAR, collections-due, and pending-approvals KPI cards are ABSENT"
      - "New-Client and Take-Repayment quick-action tiles are HIDDEN"
      - "recent-activity feed is present (e.g. 'GL closure Nov-2026 pending review · 3 h ago')"
      - "tile count is 1"
    priority: medium

  - id: collections_officer_sees_staffid_scoped_route
    description: "A Kibera field officer sees the staffId-scoped collections-due KPI and take-repayment quick-action only"
    preconditions:
      - "login returned permissions: [READ_COLLECTIONSHEET, REPAYMENT_LOAN, SAVECOLLECTIONSHEET_CENTER, READ_CENTER, READ_GROUP, READ_CLIENT, READ_LOAN]"
      - "staffId is bound to Kibera Field Office cluster"
    actions:
      - "open dashboard as collections-field-officer"
    assertions:
      - "collections-due KPI shows KES 84,200 · 3 centers · 42 dues · Kibera cluster"
      - "take-repayment quick-action tile ('m01-dashboard_qa_take_repayment') is present"
      - "PAR, active-clients, and pending-approvals KPI cards are ABSENT (no report/checker perms)"
      - "New-Client quick-action tile is HIDDEN (no CREATE_CLIENT)"
      - "recent-activity feed shows relevant rows (e.g. 'Repayment KES 3,000 queued (offline) · just now')"
      - "tile count is 2"
    priority: high

  # ── endpoint / API coverage ──

  - id: run_dashboard_reports_par_and_active_clients_kpis
    description: "GET /v1/runreports/{reportName} backs both the PAR and active-clients KPI cards with per-report results"
    preconditions:
      - "permissions include REPORTING_SUPER_USER or READ_{reportName}"
      - "system-admin context (ALL_FUNCTIONS)"
    actions:
      - "open dashboard"
      - "wait for KPI tiles to resolve"
    assertions:
      - "GET /v1/runreports/Portfolio at Risk is called and returns PAR → rendered as 4.2% on kpi_par card"
      - "GET /v1/runreports/Active Loans - Summary (or equivalent client-summary report) is called and returns 18,204 on kpi_active_clients card"
      - "each result is cached in dashboard_tile_cache keyed by tile_id (CACHE_FIRST_SWR)"
      - "a 500 on one report triggers partial-tile-error for that card only"
    priority: high

  - id: run_dashboard_reports_office_scoped_via_r_officeid
    description: "R_officeId param in runreports scopes the KPI result to the user's own office (branch-manager sees Nairobi-only PAR)"
    preconditions:
      - "login as branch-manager with officeId = Nairobi Branch"
      - "permissions include READ_Portfolio at Risk"
    actions:
      - "open dashboard"
      - "wait for PAR tile to resolve"
    assertions:
      - "GET /v1/runreports/Portfolio at Risk is called with R_officeId = <Nairobi Branch officeId>"
      - "kpi_par card shows 5.1% · PAR30 · Nairobi branch (not the org-wide 4.2%)"
    priority: medium

  - id: get_makerchecker_count_backs_pending_approvals_kpi
    description: "GET /v1/makercheckers?makerCheckerable backs the pending-approvals KPI count; tile is absent without checker permissions"
    preconditions:
      - "permissions include CHECKER_SUPER_USER (system-admin) or a *_CHECKER code (branch-manager)"
    actions:
      - "open dashboard as system-admin"
      - "wait for pending-approvals tile to resolve"
    assertions:
      - "GET /v1/makercheckers?makerCheckerable=true is called"
      - "kpi_pending_approvals card shows 37 (maker-checker queue) for system-admin"
      - "kpi_pending_approvals card shows 8 (loans awaiting approval) for branch-manager with APPROVE_LOAN_CHECKER scope"
      - "tile is ABSENT for the collections-field-officer and accountant (no checker permission)"
    priority: high

  - id: get_collectionsheet_today_staffid_scoped
    description: "GET /v1/collectionsheet?staffId&transactionDate backs the collections-due KPI scoped to the officer's route"
    preconditions:
      - "permissions include READ_COLLECTIONSHEET"
      - "staffId is the Kibera field officer"
    actions:
      - "open dashboard as collections-field-officer"
    assertions:
      - "GET /v1/collectionsheet is called with staffId = <officer staffId> and transactionDate = today"
      - "kpi_collections_due card shows KES 84,200 · 3 centers · 42 dues · Kibera cluster"
      - "result is cached in dashboard_tile_cache (CACHE_FIRST_SWR) so the officer sees dues offline"
    priority: high

  - id: get_notifications_feeds_activity_list_no_special_permission
    description: "GET /v1/notifications backs the recent-activity list; available to any authenticated user with no special permission required"
    preconditions:
      - "any authenticated user (e.g. accountant with only READ_CLIENT)"
      - "at least one notification exists in the feed"
    actions:
      - "open dashboard"
      - "observe recent-activity list"
    assertions:
      - "GET /v1/notifications is called (requires_permission: [] — no special permission gate)"
      - "recent-activity list ('m01-dashboard_recent_activity') renders notification rows"
      - "each row deep-links to its referenced entity (loan, client, or sync event)"
      - "feed is present even for the accountant who holds no KPI tile permissions"
    priority: medium

  # ── error and recovery edge-cases ──

  - id: retained_permission_set_absent_routes_to_reauth
    description: "If retry_dashboard is tapped and no retained PermissionSet exists in secure settings, the user is routed to re-authenticate"
    preconditions:
      - "state is error"
      - "secure settings contain no retained PermissionSet (e.g. fresh install after a device wipe)"
    actions:
      - "tap 'm01-dashboard_retry_dashboard'"
    assertions:
      - "RetainedSetAbsent error case fires (retained_permission_set_absent)"
      - "user is routed to the re-authentication flow"
      - "no crash; no blank screen"
    priority: medium

  - id: report_unavailable_shows_card_inline_error_not_global_error
    description: "A report_unavailable response (e.g. 404 — report not found) shows only the card inline error, not a full-screen error state"
    preconditions:
      - "user is permitted for PAR report"
      - "GET /v1/runreports/Portfolio at Risk returns HTTP 404"
    actions:
      - "open dashboard"
    assertions:
      - "state is partial-tile-error (NOT global error)"
      - "kpi_par card shows an inline error placeholder with a Retry button"
      - "other permitted tiles (e.g. active-clients showing 18,204) render normally"
      - "tile_roster_resolve_failed is NOT raised — the tile roster itself resolved successfully"
    priority: medium

  - id: cache_first_swr_cached_tile_renders_before_network
    description: "CACHE_FIRST_SWR emits the cached tile value instantly from Room on mount; background revalidation replaces it when stale"
    preconditions:
      - "dashboard_tile_cache has a non-stale row for the kpi_par tile (PAR 4.2%)"
      - "network is available"
    actions:
      - "open dashboard (tiles previously cached)"
    assertions:
      - "kpi_par card renders with the cached PAR value (4.2%) before any network call returns"
      - "no shimmer is shown for tiles with a valid fresh cache hit"
      - "background revalidation fires and updates the tile value if a fresher figure is available from the network"
    priority: low
