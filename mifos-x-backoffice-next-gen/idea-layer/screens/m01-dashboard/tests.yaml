schema_version: v1.0.0
feature: m01-dashboard
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/empty/error)
# + per api operation (run_dashboard_reports, get_makerchecker_count, get_collectionsheet_today, get_notifications).
scenarios:
  - id: content_permitted_tiles_rendered
    description: "Dashboard resolves the permitted tile roster and renders each permitted tile with its value"
    preconditions: ["login returned permissions[]", "capability map available", "tile sources reachable"]
    actions: ["complete login", "wait for dashboard load"]
    assertions:
      - "state transitions loading -> content"
      - "each permitted KPI/quick-action/activity tile renders with a value"
      - "no tile the user lacks permission for is present"
    priority: high

  - id: tiles_are_permission_intersection
    description: "Same binary renders a different tile set per persona purely from permissions (no role branching)"
    preconditions: ["two demo PermissionSets: branch-manager (READ_report, no READ_COLLECTIONSHEET) and collections-field-officer (READ_COLLECTIONSHEET, no report perms)"]
    actions: ["resolve dashboard for the branch-manager", "resolve dashboard for the collections-field-officer"]
    assertions:
      - "manager sees the PAR + active-clients + approvals KPI cards; the collections-due card is ABSENT"
      - "field officer sees the collections-due KPI + take-repayment quick-action; the PAR + approvals cards are ABSENT"
      - "no role name is branched on anywhere — the roster is 100% data"
    priority: high

  - id: read_only_persona_has_no_mutating_quick_actions
    description: "An ALL_FUNCTIONS_READ auditor sees every read KPI tile but zero mutating quick-action tiles"
    preconditions: ["login returned permissions: [ALL_FUNCTIONS_READ, READ_AUDIT]"]
    actions: ["resolve dashboard as auditor"]
    assertions:
      - "PAR, active-clients, and collections-due KPI cards are present"
      - "the New-Client and Take-Repayment quick-action tiles are HIDDEN (canDo uses ALL_FUNCTIONS only)"
    priority: high

  - id: one_failing_tile_does_not_blank_rest
    description: "A single tile source failing shows an inline error on that card while the rest render"
    preconditions: ["user permitted for ≥2 tiles", "one tile's report endpoint returns 500"]
    actions: ["open dashboard", "wait for tiles"]
    assertions:
      - "state is partial-tile-error"
      - "the failing card shows an inline error placeholder with a Retry"
      - "every other permitted tile renders its value normally"
      - "retry_failed_tile re-fetches only the failed tile"
    priority: high

  - id: offline_tiles_show_cached
    description: "Offline, every permitted tile shows its last cached value with an offline banner"
    preconditions: ["tiles previously cached in dashboard_tile_cache", "network unavailable"]
    actions: ["open dashboard offline"]
    assertions:
      - "state is no-network"
      - "the offline banner is visible"
      - "each permitted tile shows its cached value; tapping still navigates"
    priority: medium

  - id: empty_no_tile_permissions
    description: "A freshly-provisioned user with no tile permissions sees the empty state, not a blank screen"
    preconditions: ["login returned an empty permissions[]"]
    actions: ["open dashboard"]
    assertions:
      - "state is empty"
      - "the 'no dashboard tiles available for your access' placeholder is shown"
      - "the View-my-access link navigates to permission-capability-engine"
    priority: medium

  - id: error_roster_resolve_fails_offers_retry
    description: "If the tile roster cannot be resolved (capability map unavailable), a full-screen retry rebuilds from the retained set"
    preconditions: ["capability map unavailable or malformed permission payload"]
    actions: ["open dashboard", "tap Retry"]
    assertions:
      - "state is error"
      - "retry_dashboard re-resolves the roster from the retained encrypted PermissionSet"
      - "the app does not crash; the last-known set is retained"
    priority: medium
