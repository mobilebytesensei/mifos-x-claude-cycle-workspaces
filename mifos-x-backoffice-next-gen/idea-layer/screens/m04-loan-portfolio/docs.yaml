vm_actions:
  - name: LoadLoans
    signature: private fun loadLoans()
    state_mutations:
      - uiState=Loading
      - uiState=Success(pagedLoans) | Empty | Error
    side_effects:
      - LoanAccountsRepository.loansStream(CACHE_FIRST_SWR)
    error_handling:
      NetworkError: uiState=Error; keep last cached page; offer Retry
      Unauthorized403: route to permission-capability-engine (drift protocol)
  - name: OpenLoanDetail
    signature: 'private fun onOpenLoanDetail(loanId: String)'
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToLoanDetail(loanId))
    error_handling: {}
  - name: SearchLoans
    signature: 'private fun onSearchLoans(query: String)'
    state_mutations:
      - loans=<filtered in-memory>
    side_effects: []
    error_handling: {}
  - name: RecalculateSchedule
    signature: 'private fun recalculateSchedule(input: LoanScheduleInput)'
    state_mutations:
      - uiState=SchedulePreview(schedule)
    side_effects:
      - LoanScheduleRepository.calculatePreview(input) (debounced)
    error_handling:
      NetworkError: keep last cached preview; surface inline
  - name: ApproveLoan
    signature: 'private fun approveLoan(loanId: String, payload: LoanCommandPayload)'
    state_mutations:
      - uiState=Submitting
      - loanStatus=<pending_approval | approved on SUBMITTED>
    side_effects:
      - LoanOutboxRepository.enqueue(APPROVE_LOAN, loanId, payload, idempotencyKey)
    error_handling:
      CommandRejected: route entry to needs-attention-inbox; uiState=Error
      Queued: uiState=Submitting → row 'Submitted for approval' (maker-checker)
  - name: DisburseLoan
    signature: 'private fun disburseLoan(loanId: String, payload: DisbursePayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - LoanOutboxRepository.enqueue(DISBURSE_LOAN, loanId, payload, idempotencyKey)
    error_handling:
      BackdateForbidden: block; require DISBURSEINPAST_LOAN
      CommandRejected: route to needs-attention-inbox
  - name: RecordRepayment
    signature: 'private fun recordRepayment(loanId: String, payload: RepaymentPayload)'
    state_mutations:
      - uiState=Submitting
      - loanBalance=<optimistic pending>
    side_effects:
      - BaseDraftMutationViewModel(formKey=loan_repayment, uniqueKey=loanId, autoSaveDraft=true)
      - RoomSubmitOutbox.enqueue with DURABLE idempotencyKey (exactly-once)
    error_handling:
      BackdateForbidden: block; require REPAYMENTINPAST_LOAN
      TransactionRejected: route to needs-attention-inbox; keep draft
      Offline: stays PENDING; auto-drains on connectivity regain
  - name: WaiveInterest
    signature: 'private fun waiveInterest(loanId: String, payload: WaivePayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - LoanOutboxRepository.enqueue(WAIVEINTERESTPORTION_LOAN, loanId, payload, idempotencyKey)
    error_handling:
      TransactionRejected: route to needs-attention-inbox
  - name: WriteOffLoan
    signature: 'private fun writeOffLoan(loanId: String, payload: WriteOffPayload)'
    state_mutations:
      - uiState=Submitting
      - loanStatus=<written_off on SUBMITTED>
    side_effects:
      - LoanOutboxRepository.enqueue(WRITEOFF_LOAN, loanId, payload, idempotencyKey)
    error_handling:
      TransactionRejected: route to needs-attention-inbox
  - name: ForecloseLoan
    signature: 'private fun forecloseLoan(loanId: String, payload: ForeclosurePayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - LoanRepository.foreclosureQuote(loanId) then LoanOutboxRepository.enqueue(FORECLOSURE_LOAN, …, idempotencyKey)
    error_handling:
      TransactionRejected: route to needs-attention-inbox
  - name: RescheduleLoan
    signature: 'private fun rescheduleLoan(loanId: String, payload: ReschedulePayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - LoanOutboxRepository.enqueue(CREATE_RESCHEDULELOAN, loanId, payload, idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
  - name: RetryLoad
    signature: private fun onRetryLoad()
    state_mutations:
      - uiState=Loading
    side_effects:
      - LoanAccountsRepository.loansStream.refreshFresh()
    error_handling:
      Unauthorized403: route to permission-capability-engine
  - name: RejectLoan
    signature: 'private fun rejectLoan(loanId: String, payload: LoanCommandPayload)'
    state_mutations:
      - uiState=Submitting
      - loanStatus=<rejected on SUBMITTED>
    side_effects:
      - LoanOutboxRepository.enqueue(REJECT_LOAN, loanId, payload, idempotencyKey)
    error_handling:
      CommandRejected: route entry to needs-attention-inbox; uiState=Error
      Queued: uiState=Submitting → row 'Submitted for approval' (maker-checker)
  - name: WithdrawLoan
    signature: 'private fun withdrawLoan(loanId: String, payload: LoanCommandPayload)'
    state_mutations:
      - uiState=Submitting
      - loanStatus=<withdrawn on SUBMITTED>
    side_effects:
      - LoanOutboxRepository.enqueue(WITHDRAW_LOAN, loanId, payload, idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox; uiState=Error
      Queued: uiState=Submitting (maker-checker; applicant-initiated on a Pending Approval loan)
  - name: UndoApproval
    signature: 'private fun undoApproval(loanId: String)'
    state_mutations:
      - uiState=Submitting
      - loanStatus=<pending_approval on SUBMITTED>
    side_effects:
      - LoanOutboxRepository.enqueue(UNDOAPPROVAL_LOAN, loanId, payload, idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
      Queued: uiState=Submitting (maker-checker)
  - name: UndoDisbursal
    signature: 'private fun undoDisbursal(loanId: String)'
    state_mutations:
      - uiState=Submitting
      - loanStatus=<approved on SUBMITTED>
      - loanBalance=<reset to pre-disbursal>
    side_effects:
      - LoanOutboxRepository.enqueue(UNDODISBURSAL_LOAN, loanId, payload, idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox; only valid while no repayments posted
      DurableKeyGuard: durable idempotency key prevents a double-reverse on retry
  - name: MakePrepayment
    signature: 'private fun makePrepayment(loanId: String, payload: RepaymentPayload)'
    state_mutations:
      - uiState=Submitting
      - loanBalance=<optimistic pending payoff>
      - loanStatus=<closed_obligations_met when payoff clears>
    side_effects:
      - LoanRepository.prepaymentQuote(loanId) (GET .../transactions/template?command=prepayLoan)
      - RoomSubmitOutbox.enqueue(REPAYMENT_LOAN, loanId, payload, DURABLE idempotencyKey) (exactly-once)
    error_handling:
      BackdateForbidden: block; require REPAYMENTINPAST_LOAN
      TransactionRejected: route to needs-attention-inbox; keep draft
      Offline: stays PENDING; auto-drains on connectivity regain
  - name: AddLoanCharge
    signature: 'private fun addLoanCharge(loanId: String, payload: LoanChargePayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - BaseDraftMutationViewModel(formKey=loan_add_charge, uniqueKey=loanId) from GET /v1/loans/{id}/charges/template
      - LoanOutboxRepository.enqueue(CREATE_LOANCHARGE, loanId, payload, idempotencyKey)
    error_handling:
      ChargeCommandRejected: route to needs-attention-inbox
      Offline: stays PENDING; auto-drains on connectivity regain
  - name: PayLoanCharge
    signature: 'private fun payLoanCharge(loanId: String, chargeId: String, payload: ChargePaymentPayload)'
    state_mutations:
      - uiState=Submitting
      - loanBalance=<optimistic pending>
    side_effects:
      - LoanOutboxRepository.enqueue(PAY_LOANCHARGE, key=loanId+chargeId, payload, DURABLE idempotencyKey)
    error_handling:
      ChargeCommandRejected: route to needs-attention-inbox
      Offline: stays PENDING; exactly-once on retry (no double-pay)
  - name: WaiveLoanCharge
    signature: 'private fun waiveLoanCharge(loanId: String, chargeId: String)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - LoanOutboxRepository.enqueue(WAIVE_LOANCHARGE, key=loanId+chargeId, payload, idempotencyKey)
    error_handling:
      ChargeCommandRejected: route to needs-attention-inbox
      Queued: uiState=Submitting (maker-checker)
  - name: StartLoanApplication
    signature: private fun onStartLoanApplication()
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToLoanApplicationWizard)
    error_handling: {}
  - name: ViewLoanDetailTab
    signature: 'private fun onViewLoanDetailTab(tab: LoanDetailTab)'
    state_mutations:
      - selectedTab=<schedule | transactions | charges | guarantors | collateral | documents>
    side_effects: []
    error_handling: {}
error_cases:
  - loan_list_failed
  - loan_list_offline_no_cache
  - loan_detail_failed
  - schedule_calc_failed
  - command_rejected
  - command_pending_approval
  - permission_drift_403
  - backdate_forbidden
  - transaction_rejected
  - transaction_backdate_forbidden
  - transaction_offline_queued
  - charge_command_rejected
  - reschedule_rejected
  - application_rejected
  - application_offline_queued
