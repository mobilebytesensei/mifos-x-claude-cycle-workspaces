plan_ref: idea-plan.yaml#features[m04-loan-portfolio]
summary: >-
  M04 · Loan Portfolio — the highest-value back-office module. Loan list → 360° detail (summary, repayment schedule,
  transactions, charges, guarantors, collateral, documents) → application via GET /v1/loans/template with a LIVE
  calculateLoanSchedule preview → lifecycle commands (approve/reject/withdraw/disburse/undo) → servicing
  (repayment/prepay/waive/writeoff/foreclosure, charge pay+waive) → reschedule. Reads CACHE_FIRST_SWR (offline); every
  monetary write funnels through the offline-sync-engine outbox with a DURABLE idempotency key (exactly-once, zero
  double-post); every command gated by its exact {ACTION}_LOAN permission (fail-closed HIDE for roots,
  DISABLE-with-reason for maker-without-action); backdated posting is a distinct *INPAST_LOAN capability; maker-checker
  aware (queued → PENDING_APPROVAL).
metadata:
  category: back-office-domain
  implementation_ready: true
  impl_ready_at: '2026-07-17T00:00:00Z'
  impl_ready_schema: v2
contracts:
  - capability: loan_list_read
    platform_spec: >-
      Store<PageKey,List<Loan>> over Room (LoanAccountEntity) + asPagingScreenStream(CACHE_FIRST_SWR); offset/limit ≙
      Fineract paging; GET /v1/loans scoped by office/staffId; renders all 6 ScreenState variants free via
      PagingScreenContent
    permission: READ_LOAN
    error_cases:
      - loan_list_failed
      - loan_list_offline_no_cache
  - capability: loan_detail_read
    platform_spec: >-
      GET /v1/loans/{id}?associations=all + GET /v1/loans/{id}/charges → 360° detail
      (schedule/transactions/charges/guarantors/collateral/documents) stored in payload_json; offline via
      CACHE_FIRST_SWR SourceOfTruth
    permission: READ_LOAN
    error_cases:
      - loan_detail_failed
  - capability: schedule_preview
    platform_spec: >-
      POST /v1/loans?command=calculateLoanSchedule — live repayment schedule preview from entered
      principal/term/rate/disbursementDate + template defaults; no loan created; debounced; SWR-cached template for
      offline
    permission: READ_LOAN
    error_cases:
      - schedule_calc_failed
  - capability: loan_lifecycle_command
    platform_spec: >-
      POST /v1/loans/{id}?command=approve|reject|withdrawnByApplicant|disburse|undoapproval|undodisbursal — queued
      through RoomSubmitOutbox with a durable idempotency key; maker-checker aware (queued commandId+empty changes →
      PENDING_APPROVAL); exactly-once replay over POST /v1/batches
    permission: APPROVE_LOAN
    error_cases:
      - command_rejected
      - command_pending_approval
      - permission_drift_403
      - backdate_forbidden
  - capability: loan_servicing_transaction
    platform_spec: >-
      POST /v1/loans/{id}/transactions?command=repayment|waiveinterest|writeoff|foreclosure — DraftSubmitHandler +
      RoomSubmitOutbox, DURABLE idempotency_key generated at draft-save + reused on retry → EXACTLY ONCE across
      flap/crash/reinstall (zero double-post); backdated needs *INPAST_LOAN
    permission: REPAYMENT_LOAN
    error_cases:
      - transaction_rejected
      - transaction_backdate_forbidden
      - transaction_offline_queued
  - capability: loan_charge_command
    platform_spec: >-
      POST /v1/loans/{id}/charges (add) + POST /v1/loans/{id}/charges/{chargeId}?command=pay|waive — queued,
      durable-idempotent; form from GET /v1/loans/{id}/charges/template via dynamic-template-forms
    permission: PAY_LOANCHARGE
    error_cases:
      - charge_command_rejected
  - capability: loan_reschedule
    platform_spec: >-
      POST /v1/rescheduleloans — reschedule REQUEST from GET /v1/rescheduleloans/template; approved separately
      (APPROVE_RESCHEDULELOAN via checker inbox); queued, durable-idempotent, maker-checker aware
    permission: CREATE_RESCHEDULELOAN
    error_cases:
      - reschedule_rejected
  - capability: loan_application_submit
    platform_spec: >-
      POST /v1/loans — dynamic-template-forms JsonObject payload + client-generated externalId (address before server
      id); queued through outbox; maker-checker aware
    permission: CREATE_LOAN
    error_cases:
      - application_rejected
      - application_offline_queued
