appId: org.mifos.backoffice
---
# M04 Loan Portfolio happy path — open the loan list, drill into a loan's 360° detail,
# open the repayment tab, then record a repayment (queued exactly-once via the outbox).
# TestTags match screens/m04-loan-portfolio/ui.yaml components verbatim.
- launchApp
- assertVisible:
    id: "m04-loan-portfolio_header"
- assertVisible:
    id: "m04-loan-portfolio_content"
# Drill into the first loan row → 360° detail
- tapOn:
    id: "m04-loan-portfolio_item"
- assertVisible:
    id: "m04-loan-portfolio_schedule_tab"
# View the repayment schedule
- tapOn:
    id: "m04-loan-portfolio_schedule_tab"
- assertVisible:
    id: "m04-loan-portfolio_transactions_tab"
# Record a repayment (money-movement — queued through the durable-idempotency outbox)
- tapOn:
    id: "m04-loan-portfolio_repayment"
- assertVisible:
    id: "m04-loan-portfolio_header"
