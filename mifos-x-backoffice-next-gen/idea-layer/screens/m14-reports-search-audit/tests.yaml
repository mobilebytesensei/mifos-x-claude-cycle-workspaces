schema_version: v1.0.0
feature: m14-reports-search-audit

scenarios:
  - id: loading_state_renders
    description: "Loading state while the report catalog and first audit page fetch."
    preconditions: ["module opened with an empty cache"]
    actions: ["open Reports, Search & Audit"]
    assertions: ["loading indicator shown", "no catalog rows or audit rows yet"]
    expected_outcome: "loading state visible until the catalog resolves"
    priority: high

  - id: content_panes_render
    description: "Reports catalog, Search box and Audit trail render from resolved data."
    preconditions: ["user holds a report code + READ_AUDIT"]
    actions: ["open Reports, Search & Audit", "switch across the Reports / Search / Audit tabs"]
    assertions: ["runnable report rows visible in Reports", "search box visible in Search", "audit rows visible in Audit"]
    expected_outcome: "content state with the three read-only panes"
    priority: high

  - id: report_gated_per_report_code
    description: "The catalog lists only reports the operator may run."
    preconditions: ["user holds READ_'Active Loans - Summary' but not READ_'Portfolio at Risk'"]
    actions: ["open Reports"]
    assertions: ["Active Loans - Summary is listed and runnable", "Portfolio at Risk is absent from the catalog (gated)"]
    expected_outcome: "per-report gating hides reports the operator cannot read"
    priority: high

  - id: run_report_online_to_result
    description: "Running a report executes online and renders the result."
    preconditions: ["user holds READ_'Active Loans - Summary'", "network available", "params entered via dynamic-template-forms"]
    actions: ["tap a report", "enter parameters", "tap Run report"]
    assertions: ["navigates to dynamic-template-forms for the report params", "GET /v1/runreports/{reportName} issued with the R_ params", "running state shown then result table rendered"]
    expected_outcome: "running -> result with the executed report's table/chart"
    priority: high

  - id: export_shares_result
    description: "Exporting the result renders CSV/PDF and hands it to the share sheet."
    preconditions: ["a report result is displayed"]
    actions: ["tap Export"]
    assertions: ["report result rendered to CSV/PDF", "the file is handed to the platform share sheet", "the report data itself is unchanged (no server write)"]
    expected_outcome: "the result is exported and shareable"
    priority: high

  - id: report_serves_cache_offline
    description: "Re-running the same report offline serves the last cached result."
    preconditions: ["a report was run online before with these params", "network unavailable"]
    actions: ["re-run the same report offline with identical params"]
    assertions: ["last cached result served (CACHE_FIRST_SWR)", "offline banner shown", "no network call made"]
    expected_outcome: "cached report result served offline for the same params"
    priority: medium

  - id: audit_trail_gated
    description: "The Audit pane is hidden entirely without READ_AUDIT."
    preconditions: ["user lacks READ_AUDIT"]
    actions: ["open Reports, Search & Audit"]
    assertions: ["the Audit tab is not present (onDenied HIDE)", "Reports and Search panes still available"]
    expected_outcome: "audit surface hidden for an operator without READ_AUDIT"
    priority: medium

  - id: audit_filter_applies
    description: "Applying an audit filter re-fetches the trail with the chosen params."
    preconditions: ["user holds READ_AUDIT"]
    actions: ["set action=DISBURSE + a date range", "apply the filter"]
    assertions: ["filter values come from GET /v1/audits/searchtemplate", "GET /v1/audits issued with actionName + date query params", "filtered trail rendered"]
    expected_outcome: "the audit trail reloads scoped to the chosen filter"
    priority: medium

  - id: search_hit_deep_links
    description: "A global-search hit deep-links into its owning module."
    preconditions: ["user is authenticated"]
    actions: ["type a query in Search", "submit", "tap a client hit"]
    assertions: ["POST /v1/search/advance issued (office-scoped)", "hits rendered across resources", "tapping a client hit navigates to the client module with that client id"]
    expected_outcome: "a search hit routes into the screen that owns the record"
    priority: high

  - id: empty_state_broaden_hint
    description: "A pane that resolves to zero rows shows an empty state, not a create CTA."
    preconditions: ["a search matched nothing (or an audit filter has no entries)"]
    actions: ["run a search that matches nothing"]
    assertions: ["empty illustration shown", "a broaden-your-search hint is shown", "no create CTA (this surface is read-only)"]
    expected_outcome: "empty state with a read-only broaden hint"
    priority: medium

  - id: error_and_permission_drift
    description: "A fetch error retries; a 403 drift re-fetches permissions and prunes panes/reports."
    preconditions: ["a catalog/run/search/audit fetch fails, or the server returns 403"]
    actions: ["tap Retry"]
    assertions: ["error state with server message + Retry", "403 drift re-fetches the PermissionSet and prunes now-denied panes/reports live", "the failed screen stays alive"]
    expected_outcome: "recovers to content/result, or prunes access without crashing"
    priority: high
