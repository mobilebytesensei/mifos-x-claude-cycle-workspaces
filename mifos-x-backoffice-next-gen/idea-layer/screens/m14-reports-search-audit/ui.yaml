schema_version: v1.0.0
screen_id: m14-reports-search-audit
feature: m14-reports-search-audit
name: "M14 · Reports, Search & Audit"
archetype: tab_screen
cluster: back-office-module
module: m14-reports-search-audit
status: designed
initial_state: loading

# ─────────────────────────────────────────────────────────────────────────
# The read-only insight surface — three panes behind one module root:
#   1. Reports — run a parameterized report (Table | Pentaho | Chart). The report
#      catalog (GET /v1/reports) is gated per-report: a report is listed only when
#      the operator holds READ_{reportName} or REPORTING_SUPER_USER / ALL_FUNCTIONS[_READ].
#      Tapping a report opens its parameter form (rendered by dynamic-template-forms),
#      then GET /v1/runreports/{reportName} executes it; the result table/chart can be
#      exported to CSV/PDF and handed to the platform share sheet.
#   2. Search — global adhoc search (POST /v1/search/advance) across clients / loans /
#      groups / savings; a result row deep-links into the owning module screen.
#   3. Audit — the full audit trail (GET /v1/audits, filtered via /searchtemplate by
#      user / action / entity / date); gated on READ_AUDIT.
# EVERYTHING here is READ-ONLY and ONLINE-ONLY for a fresh run: there are no mutating
# controls, no outbox, no offline writes. Reads are CACHE_FIRST_SWR so a previously-run
# report / audit page / search serves its last cached result offline for the same params.
# Export is a local CSV/PDF render handed to the OS share sheet — no server write.
# Every pane + report is gated by permission-capability-engine; report parameters are
# rendered by dynamic-template-forms. All three panes are scoped to the operator's office
# (server filters rows by office hierarchy).
# ─────────────────────────────────────────────────────────────────────────

business_logic:
  kind: composite
  processing_kind: on_demand
  library_refs: []
  external_library_refs: ["ktorfit", "kotlinx-serialization", "androidx-room", "kotlinx-coroutines", "filekit"]
  required_modules:
    - "core/network"
    - "core/database"
    - "core/data"
    - "core/store"
    - "core/permissions"
  description: "Read-only insight surface with three panes: run parameterized reports (Table|Pentaho|Chart) from the per-report-gated catalog then export to the share sheet; adhoc search that deep-links into the owning module; and the filterable audit trail. Reads are CACHE_FIRST_SWR; report execution is online. Parameters render via dynamic-template-forms; every pane is gated by permission-capability-engine."
  description_hash: "claude-authored"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T12:00:00Z"

states:
  loading:
    description: "Fetching the per-report-gated report catalog (GET /v1/reports) and, for the active pane, the first audit page (GET /v1/audits) via CACHE_FIRST_SWR — a cached catalog/page renders instantly while a fresh copy revalidates in the background. Search starts idle (no query yet)."
  content:
    description: "The active pane is rendered: Reports shows the office-scoped catalog filtered to reports the operator may run (READ_{reportName} or REPORTING_SUPER_USER); Search shows the query box with hits deep-linking into their module; Audit shows the filterable trail (hidden entirely unless READ_AUDIT is held). No mutating controls appear — the whole surface is read-only."
  running:
    description: "A report's parameters were entered and GET /v1/runreports/{reportName} is executing online for a fresh run (or resolving the CACHE_FIRST_SWR cached result for the same params when offline) — a progress indicator is shown while the result table/chart is assembled."
  result:
    description: "The executed report's output is displayed as a Table / Pentaho render / Chart, or the audit-detail / search-result set for the tapped row is shown; an Export control is offered to render the result to CSV/PDF and hand it to the platform share sheet."
  empty:
    description: "The active pane resolved to zero rows in this office scope — no reports the operator may run in Reports, a search that matched nothing, or an audit filter with no entries — an illustration plus a hint to broaden the filter or search terms (there is no create CTA; this surface is read-only)."
  error:
    description: "A catalog / report-run / search / audit fetch failed with no cached copy, or the server returned a 400 validation / 403 authorization body — Retry re-issues the failed call; on a 403 the PermissionSet is re-fetched (drift protocol) and any pane/report the operator can no longer read is pruned live."

state_model:
  fields:
    - name: selectedTab
      type: ReportsTab
      notes: "Which pane is active — Reports | Search | Audit (Audit present only when READ_AUDIT is held)."
    - name: reportCatalog
      type: List<ReportRow>
      notes: "The office-scoped report catalog filtered client-side to reports the operator may run (READ_{reportName}/REPORTING_SUPER_USER) — id, name, type (Table|Pentaho|Chart), category, permission_code, last_run."
    - name: reportResult
      type: ReportResult?
      notes: "The most recently executed report's output — columns + rows for a Table, series for a Chart, or a rendered Pentaho payload; null until a report runs."
    - name: searchQuery
      type: String
      notes: "The current global-search query text; empty until the operator types."
    - name: searchResults
      type: List<SearchHit>
      notes: "Adhoc-search hits across resources — entityType (client|loan|group|savings), entityId, display label, sub-label — each deep-links into its module screen."
    - name: auditEntries
      type: List<AuditEntry>
      notes: "The audit trail page — action, maker, checker, resource, made-on date, processing result — filtered by the active audit filter."
    - name: auditFilter
      type: AuditFilter
      notes: "The active audit-trail filter (actionName, entityName, makerId, from/to date) whose allowed values come from GET /v1/audits/searchtemplate."
    - name: fromCache
      type: Boolean
      notes: "True when the rendered catalog / result / audit page came from the Room cache rather than a fresh fetch (drives the offline banner)."

components:
  - id: header
    type: header
    label: "{strings.m14_title}"
    testTag: "m14-reports-search-audit_header"
    visible_states: [loading, content, running, result, empty, error]

  - id: tab_strip
    type: chip
    label: "{strings.m14_tabs}"
    testTag: "m14-reports-search-audit_tabs"
    visible_states: [content, result, empty]
    on_click:
      action: select_tab
      action_contract:
        effect: transform_state
        library_refs: []
        external_library_refs: ["kotlinx-serialization"]
        description: "Switch the active pane between Reports, Search and Audit, set selectedTab in the serialized screen state, and lazily hydrate that pane from its cache-first Store if it has not loaded yet; the Audit tab is present only when the operator holds READ_AUDIT."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"

  - id: content_area
    type: content_area
    label: "{strings.m14_content}"
    testTag: "m14-reports-search-audit_content"
    visible_states: [content, result]

  - id: report_row
    type: list_item
    label: "{strings.m14_report_row}"
    testTag: "m14-reports-search-audit_report_row"
    visible_states: [content]
    gated_permission: READ_REPORT
    on_click:
      action: open_report_params
      target: dynamic-template-forms
      action_contract:
        effect: navigate
        description: "Open the tapped report's parameter form, rendered by dynamic-template-forms from the report's R_ parameter descriptors, so date range, office, currency and other report inputs can be entered before the report is run; the row is listed only for reports the operator may read (READ_{reportName} or REPORTING_SUPER_USER)."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"

  - id: run_report_button
    type: button
    label: "{strings.m14_run_report}"
    testTag: "m14-reports-search-audit_run_report"
    visible_states: [content]
    gated_permission: READ_REPORT
    on_click:
      action: run_report
      action_contract:
        effect: call_api
        library_refs: []
        external_library_refs: ["ktorfit"]
        reads_from: ["report_results_cache"]
        description: "Execute the selected report with the entered parameters via GET /v1/runreports/{reportName} (online for a fresh run; CACHE_FIRST_SWR serves the last cached result for the same params when offline) and transition to running then result; gated by READ_{reportName} or REPORTING_SUPER_USER and scoped to the operator's office."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"

  - id: export_button
    type: button
    label: "{strings.m14_export}"
    testTag: "m14-reports-search-audit_export"
    visible_states: [result]
    on_click:
      action: export_report
      action_contract:
        effect: share_external
        library_refs: []
        external_library_refs: ["filekit"]
        writes_to: ["exported_report_file"]
        description: "Render the displayed report result to a CSV or PDF file and hand it to the platform share sheet so the operator can save or send it; a local file write plus an OS share intent, not a server mutation — the report data itself is never modified."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"

  - id: search_input
    type: text_field
    label: "{strings.m14_search_hint}"
    testTag: "m14-reports-search-audit_search_input"
    visible_states: [content]
    on_click:
      action: run_global_search
      action_contract:
        effect: call_api
        library_refs: []
        external_library_refs: ["ktorfit"]
        reads_from: ["search_results_cache"]
        description: "Run a global adhoc search for the entered text via POST /v1/search/advance across clients, loans, groups and savings within the operator's office scope, then render the ranked hits; results read CACHE_FIRST_SWR so a repeated query serves its cached hits offline."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"

  - id: search_result_row
    type: list_item
    label: "{strings.m14_search_result_row}"
    testTag: "m14-reports-search-audit_search_result_row"
    visible_states: [content]
    on_click:
      action: open_search_hit
      target: m02-clients
      action_contract:
        effect: navigate
        description: "Deep-link the tapped search hit into the screen that owns it — a client hit opens the client module, a loan hit the loan portfolio, a group hit groups & centers, a savings hit savings & deposits — carrying the resolved entityId so the owning screen loads that record directly."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"

  - id: audit_filter_button
    type: button
    label: "{strings.m14_audit_filter}"
    testTag: "m14-reports-search-audit_audit_filter"
    visible_states: [content]
    gated_permission: READ_AUDIT
    on_click:
      action: apply_audit_filter
      action_contract:
        effect: call_api
        library_refs: []
        external_library_refs: ["ktorfit"]
        reads_from: ["audit_trail_cache"]
        description: "Apply the chosen audit-trail filter (user, action, entity, date range — allowed values from GET /v1/audits/searchtemplate) and re-fetch the trail via GET /v1/audits with those query params; the audit pane and this control appear only when the operator holds READ_AUDIT."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"

  - id: audit_row
    type: list_item
    label: "{strings.m14_audit_row}"
    testTag: "m14-reports-search-audit_audit_row"
    visible_states: [content]
    gated_permission: READ_AUDIT
    on_click:
      action: open_audit_detail
      action_contract:
        effect: transform_state
        library_refs: []
        external_library_refs: ["kotlinx-serialization"]
        description: "Expand the tapped audit entry into its full detail — the maker, checker, command JSON, resource reference and processing result — by selecting it into the serialized screen state and transitioning to the result view; a pure read-only in-memory expansion, no network call and no mutation."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"

  - id: retry_button
    type: button
    label: "{strings.m14_retry}"
    testTag: "m14-reports-search-audit_retry"
    visible_states: [error]
    on_click:
      action: retry_load
      action_contract:
        effect: call_api
        library_refs: []
        external_library_refs: ["ktorfit"]
        reads_from: ["report_results_cache", "audit_trail_cache", "search_results_cache"]
        description: "Re-issue the failed report catalog, report-run, search or audit call and transition back to content or result when it resolves; on a 403 authorization drift, re-fetch the PermissionSet and prune any pane or report the operator can no longer read before retrying."
        action_contract_hash: "claude-authored"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T12:00:00Z"
