schema_version: v1.0.0
feature: m14-reports-search-audit
base_url_note: "{host}/fineract-provider/api/v1 — global Fineract-Platform-TenantId header + basicAuth on every op. Reports/search/audit are read-only; all three panes are server-scoped to the operator's office hierarchy."

operations:
  - id: list_reports
    method: GET
    path: "/v1/reports"
    description: "Report catalog (id, reportName, reportType Table|Pentaho|Chart, reportCategory). Client filters to reports the operator may run (READ_{reportName}/REPORTING_SUPER_USER)."
    response:
      shape: list
      type: "Report[]"
    pagination:
      style: none
      envelope: bare_array
    requires_auth: true
    requires_permission: [READ_REPORT]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: run_report
    method: GET
    path: "/v1/runreports/{reportName}"
    description: "Execute a parameterized report; R_ params supplied as query string (+ optional exportCSV / output-type). Gated by READ_{reportName} or REPORTING_SUPER_USER. Online for a fresh run; cached result served offline for identical params."
    query_params: [R_startDate, R_endDate, R_officeId, R_currencyId, exportCSV, output-type]
    response:
      shape: object
      type: "ReportResult"
    requires_auth: true
    requires_permission: [READ_REPORT]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: global_search
    method: POST
    path: "/v1/search/advance"
    description: "Global adhoc search across resources (clients, loans, groups, savings) for a query string; office-scoped server-side."
    request_type: "AdhocSearchRequest"
    response:
      shape: list
      type: "SearchHit[]"
    pagination:
      style: none
      envelope: bare_array
    requires_auth: true
    requires_permission: []
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: get_audits
    method: GET
    path: "/v1/audits"
    description: "The full audit trail — action, maker, checker, resource, made-on date, processing result. Filterable by user/action/entity/date via query params."
    query_params: [actionName, entityName, makerId, makerDateTimeFrom, makerDateTimeTo, offset, limit, orderBy, sortOrder]
    response:
      shape: list
      type: "AuditEntry[]"
    pagination:
      style: offset_limit
      params: [offset, limit, orderBy, sortOrder]
      envelope: paged
    requires_auth: true
    requires_permission: [READ_AUDIT]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: get_audit_search_template
    method: GET
    path: "/v1/audits/searchtemplate"
    description: "Allowed-value lists for the audit filter (actionNames, entityNames, appUsers) — drives the audit filter controls so they are never hardcoded."
    response:
      shape: object
      type: "AuditSearchTemplate"
    requires_auth: true
    requires_permission: [READ_AUDIT]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR
