schema_version: v1.0.0
feature: m14-reports-search-audit

entries:
  - trigger: on_mount
    source: api.list_reports
    target_state: content
    loading_state: loading
    empty_state: empty
    error_state: error
    on_error:
      nav_target: null
      error_code: reports_read_failed
    persistence_contract:
      store: room
      table: report_catalog_cache
      keys: [report_id, report_name, report_type, report_category, permission_code]
      mutation: read
      note: "Report catalog cached CACHE_FIRST_SWR — serves instantly offline, revalidates online. Client filters to reports the operator may run."

  - trigger: on_run_report
    source: api.run_report
    target_state: result
    loading_state: running
    error_state: error
    on_error:
      nav_target: null
      error_code: report_run_failed
    persistence_contract:
      store: room
      table: report_results_cache
      keys: [report_name, params_hash, result_json, run_at]
      mutation: read
      note: "Report result read CACHE_FIRST_SWR keyed by (report_name, params_hash) — a re-run of the same report with the same params serves the last cached result offline; a fresh run requires connectivity."

  - trigger: on_global_search
    source: api.global_search
    target_state: content
    loading_state: loading
    empty_state: empty
    error_state: error
    on_error:
      nav_target: null
      error_code: search_failed
    persistence_contract:
      store: room
      table: search_results_cache
      keys: [query_hash, entity_type, entity_id, label, sub_label]
      mutation: read
      note: "Adhoc-search hits cached CACHE_FIRST_SWR keyed by query hash for repeat-query offline serving."

  - trigger: on_audit_filter
    source: api.get_audits
    target_state: content
    loading_state: loading
    empty_state: empty
    error_state: error
    on_error:
      nav_target: null
      error_code: audit_read_failed
    persistence_contract:
      store: room
      table: audit_trail_cache
      keys: [audit_id, action, entity, maker, checker, resource, made_on, filter_hash]
      mutation: read
      note: "Audit trail page cached CACHE_FIRST_SWR keyed by (audit_id, filter_hash); gated on READ_AUDIT. Read-only — the audit trail is never written by the client."

tables:
  - name: report_catalog_cache
    backend: room
    keys: [report_id, report_name, report_type, report_category, permission_code]
    mutation: read
    persistence_contract:
      store: room
      keys: [report_id]
    note: "Report catalog read cache (CACHE_FIRST_SWR). Read-only."
  - name: report_results_cache
    backend: room
    keys: [report_name, params_hash, result_json, run_at]
    mutation: read
    persistence_contract:
      store: room
      keys: [report_name, params_hash]
    note: "Per-(report,params) result read cache (CACHE_FIRST_SWR). A fresh run is online; the same params served from cache offline. Read-only."
  - name: search_results_cache
    backend: room
    keys: [query_hash, entity_type, entity_id, label, sub_label]
    mutation: read
    persistence_contract:
      store: room
      keys: [query_hash, entity_type, entity_id]
    note: "Adhoc-search hit read cache (CACHE_FIRST_SWR). Read-only."
  - name: audit_trail_cache
    backend: room
    keys: [audit_id, action, entity, maker, checker, resource, made_on, filter_hash]
    mutation: read
    persistence_contract:
      store: room
      keys: [audit_id, filter_hash]
    note: "Audit trail read cache (CACHE_FIRST_SWR), gated on READ_AUDIT. Read-only."

cache:
  strategy: cache_first
  note: "Every pane reads cache-first (SWR): catalog, report results, search hits and audit pages serve their last cached copy offline and revalidate online. Nothing on this surface writes to a server — export is a local file render handed to the OS share sheet."

offline_policy: online-only
online_only_note: "Reads are cache-first-SWR (a prior report/search/audit run serves offline for the same params). Fresh report execution / search / audit fetch requires connectivity. There are no writes — no outbox, no mutating controls; export renders a local CSV/PDF to the share sheet with no server call."
