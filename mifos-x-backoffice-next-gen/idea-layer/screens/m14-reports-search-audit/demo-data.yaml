schema_version: v1.0.0
feature: m14-reports-search-audit

# Real Fineract-shaped reporting data — a per-report-gated catalog, one executed report
# result, adhoc-search hits across resources, and audit-trail rows. Values mirror the
# sandbox tenant shape (Nairobi offices, KES currency, real Fineract report + permission
# codes). Zero placeholders.

# ── Reports pane: the catalog (GET /v1/reports), filtered client-side to reports the
#    operator may run. `permission_code` is the exact READ_{reportName} gate. ──
report_catalog:
  - id: "report_active_loans"
    report_name: "Active Loans - Summary"
    report_type: "Table"
    report_category: "Loan"
    permission_code: "READ_Active Loans - Summary"
    last_run: "2026-07-16T08:20:00Z"
  - id: "report_par"
    report_name: "Portfolio at Risk"
    report_type: "Chart"
    report_category: "Loan"
    permission_code: "READ_Portfolio at Risk"
    last_run: "2026-07-16T08:22:00Z"
  - id: "report_client_listing"
    report_name: "Client Listing"
    report_type: "Table"
    report_category: "Client"
    permission_code: "READ_Client Listing"
    last_run: "2026-07-15T17:05:00Z"
  - id: "report_gl_trial_balance"
    report_name: "Trial Balance"
    report_type: "Pentaho"
    report_category: "Accounting"
    permission_code: "READ_Trial Balance"
    last_run: "2026-07-16T06:00:00Z"
  - id: "report_collection_sheet"
    report_name: "Client Loan Repayment Report"
    report_type: "Table"
    report_category: "Loan"
    permission_code: "READ_Client Loan Repayment Report"
    last_run: "2026-07-16T09:41:00Z"

# ── The parameters entered for the run below (rendered by dynamic-template-forms
#    from the report's R_ descriptors). ──
report_run_params:
  report_name: "Active Loans - Summary"
  R_officeId: 12
  R_officeName: "Nairobi CBD Branch"
  R_currencyId: "KES"
  R_startDate: "2026-07-01"
  R_endDate: "2026-07-16"

# ── One executed report result (GET /v1/runreports/Active Loans - Summary) as a Table. ──
report_result:
  report_name: "Active Loans - Summary"
  report_type: "Table"
  run_at: "2026-07-16T08:20:00Z"
  columns:
    - { key: "office", label: "Office", type: "string" }
    - { key: "loan_officer", label: "Loan Officer", type: "string" }
    - { key: "active_loans", label: "Active Loans", type: "int" }
    - { key: "principal_outstanding", label: "Principal Outstanding", type: "currency" }
    - { key: "par_30", label: "PAR > 30", type: "percent" }
  rows:
    - { office: "Nairobi CBD Branch", loan_officer: "Peter Omondi", active_loans: 142, principal_outstanding: "KES 4,820,500", par_30: "3.2%" }
    - { office: "Nairobi CBD Branch", loan_officer: "Faith Njeri", active_loans: 98, principal_outstanding: "KES 3,110,750", par_30: "1.8%" }
    - { office: "Head Office", loan_officer: "Grace Wanjiru", active_loans: 61, principal_outstanding: "KES 6,940,000", par_30: "5.7%" }
  totals:
    active_loans: 301
    principal_outstanding: "KES 14,871,250"
    par_30: "3.6%"

# ── Search pane: adhoc-search hits (POST /v1/search/advance) for query "Njeri". Each
#    deep-links into its owning module. ──
search_query: "Njeri"
search_results:
  - { entity_type: "client",  entity_id: 482910, label: "Faith Njeri",        sub_label: "Client · Nairobi CBD Branch · Active" }
  - { entity_type: "loan",    entity_id: 55021,  label: "Loan #55021",         sub_label: "Faith Njeri · KES 120,000 · Active" }
  - { entity_type: "group",   entity_id: 3401,   label: "Njeri Women's Group", sub_label: "Group · Nairobi CBD Branch · 12 members" }
  - { entity_type: "savings", entity_id: 77140,  label: "Savings #77140",      sub_label: "Faith Njeri · KES 34,500 · Active" }

