appId: org.mifos.backoffice
# M14 · Reports, Search & Audit — read-only happy path:
# open the module, switch panes, open a report's params, run it, then export the result.
---
- launchApp
- assertVisible:
    id: "m14-reports-search-audit_header"
- tapOn:
    id: "m14-reports-search-audit_tabs"
- assertVisible:
    id: "m14-reports-search-audit_content"
- tapOn:
    id: "m14-reports-search-audit_report_row"
- tapOn:
    id: "m14-reports-search-audit_run_report"
- assertVisible:
    id: "m14-reports-search-audit_export"
