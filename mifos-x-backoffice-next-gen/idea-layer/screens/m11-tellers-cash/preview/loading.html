<style>
:root {
  /* Primary — brand Light Blue */
  --primary: #0091EA; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001E30;
  --primary-hover: #0081D0; --primary-pressed: #0072B8;
  /* Secondary — Teal */
  --secondary: #00796B; --on-secondary: #FFFFFF; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  /* Tertiary — muted indigo */
  --tertiary: #5B5891; --on-tertiary: #FFFFFF; --tertiary-container: #E3DFFF; --on-tertiary-container: #17124B;
  /* Error / success / warning / info */
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #2E7D32; --on-success: #FFFFFF; --success-container: #C8E6C9; --on-success-container: #002106;
  --warning: #F57C00; --on-warning: #FFFFFF; --warning-container: #FFDDB8; --on-warning-container: #2A1700; --warning-strong: #B45309;
  --info: #0277BD; --on-info: #FFFFFF;
  /* Surfaces */
  --background: #FCFCFF; --on-background: #1A1C1E;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F3F4F9; --surface-container: #EDEFF4;
  --surface-container-high: #E7E9EF; --surface-container-highest: #E1E3E9; --surface-dim: #DBDCE0; --surface-bright: #FCFCFF;
  /* Outlines / inverse / accent */
  --outline: #72777F; --outline-variant: #C2C7CF;
  --inverse-surface: #2F3033; --inverse-on-surface: #F1F0F4; --inverse-primary: #6FD3FF;
  --accent: #00BFA5; --on-accent: #00201A; --scrim: #000000;
  /* Typography */
  --font-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-h1: 2rem; --fs-h2: 1.75rem; --fs-h3: 1.5rem; --fs-title: 1.375rem; --fs-title-md: 1rem;
  --fs-body: 1rem; --fs-body-sm: 0.875rem; --fs-label: 0.875rem; --fs-label-sm: 0.75rem;
  --fs-caption: 0.75rem; --fs-caption-sm: 0.6875rem;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-label: 0.1px; --ls-caption: 0.4px; --ls-wide: 0.5px;
  /* Radius (design-tokens: xs4 sm8 md12 lg16 xl28) */
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 9999px;
  /* Spacing (8pt grid) */
  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
  /* Elevation — M3 level0-5 → box-shadow (§7a). Subtle per clinical DESIGN.md. */
  --el-0: none;
  --el-1: 0 1px 2px rgba(0,0,0,0.05);
  --el-2: 0 2px 6px rgba(0,0,0,0.08);
  --el-3: 0 8px 24px rgba(0,0,0,0.12);
  --el-4: 0 12px 32px rgba(0,0,0,0.14);
  --el-5: 0 16px 48px rgba(0,0,0,0.18);
  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #6FD3FF; --on-primary: #00344F; --primary-container: #004B70; --on-primary-container: #CBE6FF;
  --primary-hover: #86DBFF; --primary-pressed: #9EE2FF;
  --secondary: #4FD8C4; --on-secondary: #003731; --secondary-container: #005048; --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0FF; --on-tertiary: #2C2A5E; --tertiary-container: #434076; --on-tertiary-container: #E3DFFF;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #7FCF82; --on-success: #003910; --success-container: #1B5E20; --on-success-container: #C8E6C9;
  --warning: #FFB868; --on-warning: #4A2800; --warning-container: #6B3C00; --on-warning-container: #FFDDB8; --warning-strong: #E0912F;
  --info: #7FCFFF; --on-info: #003548;
  --background: #1A1C1E; --on-background: #E2E2E6;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF;
  --surface-container-lowest: #0F1113; --surface-container-low: #1A1C1E; --surface-container: #1E2022;
  --surface-container-high: #282A2D; --surface-container-highest: #333537; --surface-dim: #111315; --surface-bright: #37393C;
  --outline: #8C9198; --outline-variant: #42474E;
  --inverse-surface: #E2E2E6; --inverse-on-surface: #2F3033; --inverse-primary: #0091EA;
  --accent: #4FD8C4; --on-accent: #00201A;
  /* §7d — on dark, elevation reads via deeper shadow + lighter surface tint */
  --el-1: 0 1px 2px rgba(0,0,0,0.40);
  --el-2: 0 2px 6px rgba(0,0,0,0.50);
  --el-3: 0 8px 24px rgba(0,0,0,0.60);
  --el-4: 0 12px 32px rgba(0,0,0,0.66);

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--background);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  -webkit-font-feature-settings: 'liga';
}

/* ── Top app bar (§7a raised sticky bar → --el-2) ──────────────── */
header[data-shell="top-app-bar"] {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--outline-variant);
  box-shadow: var(--el-2);
}
:root[data-theme="dark"] header[data-shell="top-app-bar"] { background: var(--surface-container); }
header[data-shell="top-app-bar"] .leading {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--r-xl);
  color: var(--on-surface-variant); background: transparent; border: none; cursor: default;
}
header[data-shell="top-app-bar"] .app-title {
  font-size: var(--fs-title); font-weight: var(--fw-semibold);
  line-height: var(--lh-tight); color: var(--on-surface); margin: 0;
}
header[data-shell="top-app-bar"] .bar-trailing {
  margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--r-xl); color: var(--on-surface-variant); background: transparent;
}
header[data-shell="top-app-bar"] .bar-trailing .avatar {
  width: 30px; height: 30px; border-radius: var(--r-xl);
  background: var(--primary-container); color: var(--on-primary-container);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: var(--fs-caption); font-weight: var(--fw-semibold);
}

/* ── Content (own scroll region → action bar + nav never occlude, §7g) ── */
main[data-shell="content"] {
  flex: 1; display: flex; flex-direction: column;
  gap: var(--sp-md); padding: var(--sp-md);
  padding-bottom: var(--sp-lg);
  overflow-y: auto; min-height: 0;
}

/* Scope strip */
.scope-strip {
  display: flex; align-items: center; gap: var(--sp-sm);
  margin: calc(-1 * var(--sp-xs)) 0 calc(-1 * var(--sp-sm));
  color: var(--on-surface-variant); font-size: var(--fs-caption); letter-spacing: var(--ls-caption);
}
.scope-strip .material-symbols-outlined { font-size: 16px; }
.scope-strip .scope-role { font-weight: var(--fw-medium); color: var(--on-surface); }

/* Section label */
.section-label {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-sm);
  margin: var(--sp-xs) 0 calc(-1 * var(--sp-sm) + var(--sp-xs));
}
.section-label h2 {
  font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label);
  text-transform: uppercase; color: var(--on-surface-variant); margin: 0;
}
.section-label .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

/* Date-range filter chip row */
.filter-row { display: flex; align-items: center; gap: var(--sp-sm); flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: var(--sp-xs);
  padding: 6px var(--sp-md); min-height: 32px;
  background: var(--surface); color: var(--on-surface);
  border: var(--border-w) solid var(--outline); border-radius: var(--r-xl);
  font-size: var(--fs-label); font-weight: var(--fw-medium); font-family: inherit; cursor: pointer;
  box-shadow: var(--el-1);
}
.chip .material-symbols-outlined { font-size: 18px; color: var(--on-surface-variant); }
.chip.selected { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }

/* Teller master list (§7a rows → --el-1) */
.teller-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.teller-row {
  display: flex; align-items: center; gap: var(--sp-md); width: 100%;
  min-height: 44px; padding: var(--sp-md);
  background: var(--surface); color: var(--on-surface);
  border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-lg);
  cursor: pointer; text-align: left; font-family: inherit;
  box-shadow: var(--el-1);
}
:root[data-theme="dark"] .teller-row { background: var(--surface-container); }
.teller-row.selected { border-color: var(--primary); background: var(--primary-container); color: var(--on-primary-container); }
.teller-row .t-icon {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--r-xl);
  background: var(--surface-variant); color: var(--on-surface-variant);
}
.teller-row.selected .t-icon { background: var(--surface); color: var(--primary); }
.teller-row .t-icon .material-symbols-outlined { font-size: 20px; }
.teller-row .t-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.teller-row .t-name { font-size: var(--fs-body); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.teller-row .t-sub { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.teller-row.selected .t-sub { color: var(--on-primary-container); }
.teller-row .t-right { display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-xs); flex: 0 0 auto; }
.teller-row .t-cash { font-family: var(--font-mono); font-size: var(--fs-body); font-weight: var(--fw-semibold); }
.status-chip {
  display: inline-flex; align-items: center; gap: 2px; padding: 1px var(--sp-sm);
  border-radius: var(--r-sm); font-size: var(--fs-caption); font-weight: var(--fw-semibold); letter-spacing: var(--ls-caption);
  background: var(--secondary-container); color: var(--on-secondary-container);
}

/* Detail panel (§7a detail card → --el-2) */
.detail-card {
  display: flex; flex-direction: column; gap: var(--sp-md);
  border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-lg);
  padding: var(--sp-md); background: var(--surface);
  box-shadow: var(--el-2);
}
:root[data-theme="dark"] .detail-card { background: var(--surface-container-high); }
.vault-header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md); }
.vault-header .vh-label { font-size: var(--fs-label); font-weight: var(--fw-medium); color: var(--on-surface-variant); }
.vault-header .vh-name { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); }
.vault-header .vh-cash { font-family: var(--font-mono); font-size: var(--fs-h3); font-weight: var(--fw-semibold); color: var(--primary); text-align: right; }
.vault-header .vh-cash small { display: block; font-family: var(--font-body); font-size: var(--fs-caption); color: var(--on-surface-variant); font-weight: var(--fw-regular); }

.subhead { font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--on-surface-variant); margin: 0; }

/* Cashier rows inside detail (§7a → --el-1) */
.cashier-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.cashier-row {
  display: flex; align-items: center; gap: var(--sp-md);
  padding: var(--sp-sm) var(--sp-md);
  background: var(--surface-container-low); border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-md);
  box-shadow: var(--el-1);
}
:root[data-theme="dark"] .cashier-row { background: var(--surface-container-high); }
.cashier-row .c-meta { flex: 1; min-width: 0; }
.cashier-row .c-name { font-size: var(--fs-body); font-weight: var(--fw-medium); }
.cashier-row .c-sub { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.cashier-row .c-cash { font-family: var(--font-mono); font-size: var(--fs-label); font-weight: var(--fw-semibold); }
.cash-actions { display: flex; gap: var(--sp-xs); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 2px;
  height: 32px; padding: 0 var(--sp-sm); border-radius: var(--r-xl);
  border: var(--border-w) solid var(--outline); background: var(--surface); color: var(--primary);
  font-size: var(--fs-caption); font-weight: var(--fw-semibold); font-family: inherit; cursor: pointer;
  box-shadow: var(--el-1);
}
.icon-btn .material-symbols-outlined { font-size: 16px; }
.icon-btn.secondary { color: var(--secondary); }

/* Ledger table — wrapped in an overflow-x:auto scroller so it never clips at ~393px (§7f) */
.ledger {
  border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-md); overflow: hidden;
  background: var(--surface); box-shadow: var(--el-1);
}
:root[data-theme="dark"] .ledger { background: var(--surface-container); }
.ledger-scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.ledger table { width: 100%; min-width: 460px; border-collapse: collapse; font-size: var(--fs-caption); }
.ledger th {
  text-align: left; padding: var(--sp-sm) var(--sp-md); background: var(--surface-variant);
  color: var(--on-surface-variant); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase;
  white-space: nowrap;
}
.ledger td { padding: var(--sp-sm) var(--sp-md); border-top: var(--border-w) solid var(--outline-variant); color: var(--on-surface); white-space: nowrap; }
.ledger td.num { font-family: var(--font-mono); text-align: right; }
.ledger td .badge-in { color: var(--secondary); font-weight: var(--fw-semibold); }
.ledger td .badge-out { color: var(--warning-strong); font-weight: var(--fw-semibold); }

/* Command bar */
.command-bar { display: flex; flex-wrap: wrap; gap: var(--sp-sm); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-xs);
  min-height: 40px; padding: 0 var(--sp-md); border-radius: var(--r-xl);
  font-size: var(--fs-label); font-weight: var(--fw-semibold); font-family: inherit; cursor: pointer; border: none;
}
.btn .material-symbols-outlined { font-size: 18px; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--el-1); }
.btn-secondary { background: var(--surface); color: var(--primary); border: var(--border-w) solid var(--outline); box-shadow: var(--el-1); }
.btn-text { background: transparent; color: var(--primary); padding: 0 var(--sp-sm); }

/* Sticky in-flow action bar (§7g preferred) — sits above bottom-nav, outside the
   scrolling <main>, so the "New teller" action NEVER occludes the command bar or the
   last ledger row. Carries the FAB contract (data-component-type="FAB"). */
.action-bar {
  display: flex; gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  background: var(--surface);
  border-top: var(--border-w) solid var(--outline-variant);
  box-shadow: var(--el-2);
}
:root[data-theme="dark"] .action-bar { background: var(--surface-container); }
.action-bar .fab-btn {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm);
  min-height: 48px; padding: 0 var(--sp-md); border-radius: var(--r-lg);
  background: var(--primary); color: var(--on-primary); border: none;
  font-size: var(--fs-label); font-weight: var(--fw-semibold); font-family: inherit; cursor: pointer;
  box-shadow: var(--el-1);
}
.action-bar .fab-btn .material-symbols-outlined { font-size: 20px; }

@media (prefers-reduced-motion: no-preference) {
  .teller-row, .btn, .icon-btn, .chip, .fab-btn { transition: filter 120ms ease; }
  .teller-row:active, .btn:active, .icon-btn:active, .chip:active, .fab-btn:active { filter: brightness(0.97); }
}

/* ── Bottom nav (§7a sticky bar → --el-2) ─────────────────────── */
nav[data-shell="bottom-nav"] {
  position: sticky; bottom: 0; margin-top: auto; display: flex;
  background: var(--surface); border-top: var(--border-w) solid var(--outline-variant);
  padding-bottom: env(safe-area-inset-bottom, 0);
  box-shadow: var(--el-2);
}
:root[data-theme="dark"] nav[data-shell="bottom-nav"] { background: var(--surface-container); }
nav[data-shell="bottom-nav"] a {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: var(--sp-sm) var(--sp-xs); min-height: 44px; color: var(--on-surface-variant);
  text-decoration: none; font-size: var(--fs-caption); letter-spacing: var(--ls-caption); cursor: pointer;
}
nav[data-shell="bottom-nav"] a .nav-pill {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 56px; height: 28px; border-radius: var(--r-lg);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] { color: var(--on-primary-container); }
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill { background: var(--primary-container); }
</style>

<style>
/* Loading skeleton — token-native shimmer (§7a rows keep their elevation) */
.skeleton { display: block; background: color-mix(in srgb, var(--on-surface) 11%, transparent); border-radius: var(--r-sm); animation: sk-pulse 1.4s ease-in-out infinite; }

.sk-line-sm { height: var(--sp-sm); }
@keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }
</style>
