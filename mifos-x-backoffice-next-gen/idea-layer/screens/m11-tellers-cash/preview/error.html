html, body { margin: 0; padding: 0; width: 100%; height: 100%; }

header[data-shell="top-app-bar"] {

  gap: var(--sp-sm);

  padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
header[data-shell="top-app-bar"] .leading {
  display: inline-flex; align-items: center; justify-content: center;

}

  font-size: var(--fs-caption); font-weight: var(--fw-semibold);
}

  gap: var(--sp-md); padding: var(--sp-md); overflow-y: auto;
}

/* Error state */

}
.error-state .es-badge {

}
.error-state .es-badge .material-symbols-outlined { font-size: 36px; }

}
.err-actions { display: flex; gap: var(--sp-sm); flex-wrap: wrap; justify-content: center; }
.btn {

@media (prefers-reduced-motion: no-preference) {
  .btn { transition: filter 120ms ease; }
  .btn:active { filter: brightness(0.97); }
}
