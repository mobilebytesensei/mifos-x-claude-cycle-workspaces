feature: m11-tellers-cash
# Realistic Fineract teller & cash figures (KES, sandbox-shaped). tellers[] is the module-root
# list; each teller carries its vault cash position. cashiers[] are the staff assigned to a teller
# for a date range with their allocated cash. transactions[] is the teller-transaction ledger —
# allocate/settle movements with a running vault balance. queued_commands[] shows the offline
# outbox state (a pending allocation with its durable idempotency key). A control absent for a
# persona is HIDDEN because they lack its {ACTION}_{ENTITY} permission (fail-closed).
tellers:
  - id: "teller_5"
    name: "Nairobi CBD Teller 1"
    office: "Nairobi CBD Branch"
    office_id: 3
    status: "Active"
    vault_cash_balance: 500000.00
    currency: "KES"
    active_cashiers: 2
    start_date: "2026-01-01"
  - id: "teller_6"
    name: "Nairobi CBD Teller 2"
    office: "Nairobi CBD Branch"
    office_id: 3
    status: "Active"
    vault_cash_balance: 275000.00
    currency: "KES"
    active_cashiers: 1
    start_date: "2026-01-01"
  - id: "teller_9"
    name: "Kisumu Branch Teller 1"
    office: "Kisumu Branch"
    office_id: 5
    status: "Active"
    vault_cash_balance: 180000.00
    currency: "KES"
    active_cashiers: 1
    start_date: "2026-02-15"

cashiers:
  # ── assigned to teller_5 (Nairobi CBD Teller 1) ──
  - id: "cashier_12"
    teller_id: "teller_5"
    teller: "Nairobi CBD Teller 1"
    staff_id: 27
    name: "Faith Njeri"
    start_date: "2026-07-01"
    end_date: "2026-07-31"
    is_full_day: true
    allocated_cash: 120000.00
    currency: "KES"
    status: "On duty"
  - id: "cashier_13"
    teller_id: "teller_5"
    teller: "Nairobi CBD Teller 1"
    staff_id: 31
    name: "David Mwangi"
    start_date: "2026-07-01"
    end_date: "2026-07-31"
    is_full_day: true
    allocated_cash: 80000.00
    currency: "KES"
    status: "On duty"
  # ── assigned to teller_6 (Nairobi CBD Teller 2) ──
  - id: "cashier_18"
    teller_id: "teller_6"
    teller: "Nairobi CBD Teller 2"
    staff_id: 44
    name: "Grace Achieng"
    start_date: "2026-07-14"
    end_date: "2026-07-20"
    is_full_day: false
    allocated_cash: 60000.00
    currency: "KES"
    status: "On duty"
  # ── assigned to teller_9 (Kisumu Branch Teller 1) ──
  - id: "cashier_25"
    teller_id: "teller_9"
    teller: "Kisumu Branch Teller 1"
    staff_id: 52
    name: "Brian Otieno"
    start_date: "2026-07-01"
    end_date: "2026-07-31"
    is_full_day: true
    allocated_cash: 45000.00
    currency: "KES"
    status: "On duty"

transactions:
  # teller_5 vault ledger — running_balance after each movement
  - id: "tellertxn_401"
    teller_id: "teller_5"
    cashier_id: "cashier_12"
    cashier: "Faith Njeri"
    type: "Cash Allocation"
    amount: 120000.00
    currency: "KES"
    txn_date: "2026-07-15"
    running_vault_balance: 500000.00
    note: "Morning float allocated to Faith Njeri"
  - id: "tellertxn_402"
    teller_id: "teller_5"
    cashier_id: "cashier_13"
    cashier: "David Mwangi"
    type: "Cash Allocation"
    amount: 80000.00
    currency: "KES"
    txn_date: "2026-07-15"
    running_vault_balance: 500000.00
    note: "Morning float allocated to David Mwangi"
  - id: "tellertxn_408"
    teller_id: "teller_5"
    cashier_id: "cashier_13"
    cashier: "David Mwangi"
    type: "Cash Settlement"
    amount: 35000.00
    currency: "KES"
    txn_date: "2026-07-16"
    running_vault_balance: 535000.00
    note: "End-of-day settlement from David Mwangi back to vault"

queued_commands:
  # offline outbox — a pending allocation waiting to replay exactly-once
  - id: "outbox_9931"
    action: "ALLOCATECASHTOCASHIER"
    entity: "TELLER"
    teller_id: "teller_5"
    cashier_id: "cashier_12"
    amount: 50000.00
    currency: "KES"
    txn_date: "2026-07-17"
    status: "PENDING"
    idempotency_key: "b2c7e1a4-9f30-4d21-8a6e-3c5f0d7a1e42"
    note: "Top-up float queued offline for Faith Njeri; will replay once on reconnect."

personas:
  - persona: "teller-cash-officer"
    office: "Nairobi CBD Branch"
    permissions_sample: ["READ_TELLER", "CREATE_TELLER", "UPDATE_TELLER", "ALLOCATECASHIER_TELLER", "ALLOCATECASHTOCASHIER_TELLER", "SETTLECASHFROMCASHIER_TELLER"]
    visible_controls: ["New teller", "Edit teller", "Assign cashier", "Allocate cash", "Settle cash", "View ledger"]
    note: "Full teller/cash surface — creates tellers, assigns cashiers, moves cash both ways."
  - persona: "branch-supervisor-read"
    office: "Nairobi CBD Branch"
    permissions_sample: ["READ_TELLER", "READ_AUDIT"]
    visible_controls: ["View ledger"]
    note: "Sees the teller list, cash position and ledger read-only; New-teller/Assign/Allocate/Settle controls HIDDEN (no CREATE_/ALLOCATE*/SETTLE* permission)."
  - persona: "auditor"
    office: "Head Office"
    permissions_sample: ["ALL_FUNCTIONS_READ", "READ_AUDIT"]
    visible_controls: ["View ledger"]
    note: "ALL_FUNCTIONS_READ grants every read — teller list, cash position, ledger — but NEVER a mutating cash control (canDo uses ALL_FUNCTIONS only)."
