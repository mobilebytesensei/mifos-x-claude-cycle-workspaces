appId: org.mifos.backoffice
---
# M11 happy path — open the Tellers & Cash module, open a teller detail,
# allocate cash to a cashier through the durable outbox (template form),
# and confirm the permission-gated command bar renders. Tags reference the
# ui.yaml testTags; the demo login resolves a full teller/cash roster.
- launchApp
- assertVisible:
    id: "m11-tellers-cash_header"
# Teller list content renders (office · vault cash balance · status)
- assertVisible:
    id: "m11-tellers-cash_content"
# Open the first teller's detail (cash header + cashiers + ledger)
- tapOn:
    id: "m11-tellers-cash_teller_item"
# The permission-gated cash command bar is present on the detail
- assertVisible:
    id: "m11-tellers-cash_allocate"
# Allocate cash to a cashier (routes through the template form → durable outbox)
- tapOn:
    id: "m11-tellers-cash_allocate"
- assertVisible:
    id: "dynamic-template-forms_submit"
