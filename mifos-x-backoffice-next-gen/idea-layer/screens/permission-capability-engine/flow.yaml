feature: permission-capability-engine
entry_points:
  - type: post_login
    description: "Runs immediately after POST /v1/authentication returns permissions[] — the login-permission-bootstrap flow's first gate before the dashboard is reachable"
  - type: settings_entry
    description: "Reachable from M17 Sync & Settings as the 'Access & Permissions' surface for on-demand review + manual refresh"

transitions:
  - from: loading
    to: content
    trigger: "PermissionSet normalized + CapabilityMap resolved from permissions[]"
  - from: loading
    to: unauthenticated
    trigger: "no valid PermissionSet / shouldRenewPassword true / isTwoFactorAuthenticationRequired true"
  - from: loading
    to: error
    trigger: "capability map build failure (malformed payload / checksum-invalid map / refresh fetch failure)"
  - from: content
    to: loading
    trigger: "refresh_permissions tapped (or 403 drift) — fingerprint changed → re-resolve"
  - from: content
    to: permission-set-detail
    trigger: "view_permission_set — persona card or view-my-permissions link tapped"
  - from: content
    to: capability-map-detail
    trigger: "view_capability_map_meta — capability-map version chip tapped"
  - from: error
    to: loading
    trigger: "retry_capability_bootstrap — rebuild from retained encrypted set"
  - from: unauthenticated
    to: login-tenant
    trigger: "go_to_login — no valid PermissionSet; route to tenant login"
