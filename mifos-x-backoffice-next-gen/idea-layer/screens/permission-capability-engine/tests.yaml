schema_version: v1.0.0
feature: permission-capability-engine
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/unauthenticated/error)
# + per api operation (authenticate, get_role_permissions, get_permissions_catalog).
scenarios:
  - id: content_capability_map_resolved
    description: "Capability surface resolves after login and gates nav to only viewable module roots"
    preconditions: ["login returned permissions[]", "CapabilityMap available and checksum-valid"]
    actions: ["complete login", "wait for capability bootstrap"]
    assertions:
      - "state transitions loading -> content"
      - "nav shows only the module roots the user can view"
      - "denied actions are hidden or disabled with a reason"
    priority: high

  - id: umbrella_all_functions_short_circuit
    description: "System-admin ALL_FUNCTIONS umbrella grants every module root without enumeration"
    preconditions: ["login returned permissions: [ALL_FUNCTIONS]"]
    actions: ["complete login as system-admin", "wait for capability bootstrap"]
    assertions:
      - "all 17 module roots visible"
      - "persona card shows the ALL_FUNCTIONS short-circuit badge"
      - "CapabilityMatrixTest golden file green"
    priority: high

  - id: all_functions_read_never_grants_writes
    description: "Auditor ALL_FUNCTIONS_READ shows every read surface but zero mutating controls"
    preconditions: ["login returned permissions: [ALL_FUNCTIONS_READ, READ_AUDIT]"]
    actions: ["complete login as auditor", "attempt a mutating control"]
    assertions:
      - "every read surface visible"
      - "zero mutating controls enabled (canDo uses ALL_FUNCTIONS only)"
      - "checker inbox row is OFF"
    priority: high

  - id: persona_render_matrix_field_officer_vs_maker
    description: "Same binary renders a narrower field-officer surface than a loan-officer maker purely from permissions"
    preconditions: ["capability-map.json bundled", "two demo PermissionSets: collections-field-officer and loan-officer-maker"]
    actions: ["resolve capability surface for each persona"]
    assertions:
      - "field-officer roster resolves ~4 roots (collections/read-only), no Create FABs"
      - "loan-officer maker shows onboarding + new-loan entry points; Approve/Disburse VISIBLE-but-DISABLED (Requires APPROVE_LOAN)"
      - "no role name is branched on anywhere — resolution is 100% data"
    priority: high

  - id: error_403_drift_prunes_ui
    description: "A 403 on a previously-allowed command triggers the drift protocol and prunes now-denied UI without crashing"
    preconditions: ["user is authenticated", "server returns 403 (NoAuthorization) on a previously-allowed command"]
    actions: ["trigger the denied command", "wait for 403 drift protocol"]
    assertions:
      - "permissions refreshed via role fallback"
      - "fingerprint change -> atomic swap -> now-denied UI pruned"
      - "app does not crash"
      - "user notified once"
    priority: high

  - id: unmapped_capability_hidden_fail_closed
    description: "A capability id with no CapabilityMap entry fails closed to HIDDEN"
    preconditions: ["a capability id has no CapabilityMap entry"]
    actions: ["resolve capability surface"]
    assertions:
      - "unmapped id renders HIDDEN (fail closed)"
      - "MapCoverageTest flags the gap as a build failure in CI"
    priority: medium

  - id: unauthenticated_routes_to_login
    description: "No valid PermissionSet (or shouldRenewPassword / 2FA required) routes to tenant login with no surface built"
    preconditions: ["login not completed OR shouldRenewPassword=true OR isTwoFactorAuthenticationRequired=true"]
    actions: ["enter capability bootstrap", "tap Go to login"]
    assertions:
      - "state is unauthenticated"
      - "go_to_login navigates to login-tenant"
      - "no capability surface is built"
    priority: medium
