feature: permission-capability-engine
endpoints:
  - id: authenticate
    method: POST
    path: "/v1/authentication"
    description: "Login — returns permissions: Collection<String> (the sole runtime authorization input), roles[], officeId, staffId, shouldRenewPassword, isTwoFactorAuthenticationRequired, base64EncodedAuthenticationKey. Header Fineract-Platform-TenantId required."
    response_type: "AuthenticatedUserData"
    response:
      shape: object
    requires_auth: false
    requires_permission: []
    tenant_header: true

  - id: get_role_permissions
    method: GET
    path: "/v1/roles/{roleId}/permissions"
    description: "Password-less permission refresh fallback for the 403 drift protocol — returns the selected permission codes for a role; the union across the user's enabled roles rebuilds the PermissionSet without re-prompting for the password."
    response_type: "RolePermissionsResponse"
    response:
      shape: object
    requires_auth: true
    requires_permission: [READ_PERMISSION]
    tenant_header: true

  - id: get_permissions_catalog
    method: GET
    path: "/v1/permissions"
    description: "Permission catalog (PermissionData: grouping/code/entityName/actionName/selected). ?makerCheckerable=true returns the subset that requires approval, driving the 'requires approval' badges pre-flighted before submit."
    query_params:
      - name: makerCheckerable
        type: boolean
        required: false
        description: "When true, returns only codes whose commands require maker-checker approval (drives the pending-approval badge)."
    response_type: "PermissionData[]"
    response:
      shape: list
    requires_auth: true
    requires_permission: [READ_PERMISSION]
    tenant_header: true
