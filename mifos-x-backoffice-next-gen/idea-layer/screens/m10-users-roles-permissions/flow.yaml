schema_version: v1.0.0
feature: m10-users-roles-permissions

entry_points:
  - type: nav_root
    description: "Users, Roles & Permissions module root — gated on the authorisation permission group (USER_ADMINISTRATION_SUPER_USER tier); hidden entirely when the operator holds none of READ_USER / READ_ROLE."

transitions:
  # ── initial load ──
  - from: loading
    to: content
    trigger: "users + roles (+ selected role grid) loaded"
  - from: loading
    to: empty
    trigger: "active tab resolved to zero rows"
  - from: loading
    to: error
    trigger: "roster/grid fetch failed and no cache present"

  # ── tab + grid navigation ──
  - from: content
    to: content
    trigger: "select_tab (Users <-> Roles)"
  - from: content
    to: content
    trigger: "open_role_permission_grid (load selected role's grid)"
  - from: empty
    to: content
    trigger: "tab switched to a populated pane"

  # ── create / edit routed through dynamic-template-forms ──
  - from: content
    to: dynamic-template-forms
    trigger: "create_user | edit_user | create_role"
    nav: dynamic-template-forms
  - from: empty
    to: dynamic-template-forms
    trigger: "create_role (create first user/role from empty)"
    nav: dynamic-template-forms
  - from: content
    to: dynamic-template-forms
    trigger: "open_user_detail"
    nav: dynamic-template-forms

  # ── user / role write (queued via offline outbox) ──
  - from: content
    to: submitting
    trigger: "reset_user_password | toggle_role_enabled | user/role command enqueued"
  - from: submitting
    to: content
    trigger: "command queued (offline) or accepted (online)"
  - from: submitting
    to: content
    trigger: "maker-checker: command returned commandId with empty changes (Submitted for approval)"
  - from: submitting
    to: error
    trigger: "command rejected 400/403/409"

  # ── role->permission grid + maker-checker (ONLINE-ONLY) ──
  - from: content
    to: saving
    trigger: "save_permission_matrix | toggle_maker_checker"
  - from: saving
    to: content
    trigger: "PUT /v1/roles/{id}/permissions (or PUT /v1/permissions) persisted; runtime capability cache invalidated"
  - from: saving
    to: error
    trigger: "online-only save failed (offline, or server rejected)"

  # ── recovery ──
  - from: error
    to: loading
    trigger: "retry_load"
  - from: error
    to: content
    trigger: "403 drift: permissions re-fetched, denied controls pruned, retry succeeded"

cross_links:
  - to: permission-capability-engine
    relationship: read-only
    note: "Saving the role->permission grid invalidates the runtime PermissionSet cache resolved by permission-capability-engine; affected users re-resolve their capability surface on next login."
  - to: dynamic-template-forms
    relationship: renders_forms
    note: "User + role create/edit forms are rendered from GET /v1/users/template (and roles) by dynamic-template-forms."
  - to: offline-sync-engine
    relationship: queues_writes
    note: "User + role writes queue through the durable outbox; the role->permission grid + maker-checker config are ONLINE-ONLY and bypass the queue."
  - to: needs-attention-inbox
    relationship: rejected_commands
    note: "A queued user/role command rejected by the server is triaged in Needs Attention."

# ── Permission gates (RULE-PERMISSION-CODEGEN-001 · PermissionEvaluator grant/deny terminals) ──
# Every permission-gated operation resolves through permission-capability-engine's PermissionEvaluator.
# VISIBLE  → the GRANTED path proceeds to the operation (control rendered, request sent).
# HIDDEN   → the DENIED path is fail-closed: the control is pruned to a permission-denied state,
#            never a silent no-op. A 403 drift re-resolves the surface (see error->content transition).
# m10 is self-referential: it administers the very permissions[] the engine consumes, so a denied
# author cannot escalate their own grid.
permission_denied_state:
  name: permission_denied
  description: "Fail-closed terminal — the gated control is hidden/disabled and a 'You don't have permission' surface replaces it; no request is issued."
permission_gates:
  - permission: READ_USER
    operations: [list_users, get_user_template]
    grant_path:
      to: content
      trigger: "READ_USER granted — Users tab visible; roster + create/edit template load"
    deny_path:
      to: permission_denied
      trigger: "READ_USER denied — Users tab hidden and roster control pruned (fail-closed)"
  - permission: CREATE_USER
    operations: [create_user]
    grant_path:
      to: dynamic-template-forms
      trigger: "CREATE_USER granted — new-user action enabled; create form opens"
    deny_path:
      to: permission_denied
      trigger: "CREATE_USER denied — new-user action pruned"
  - permission: UPDATE_USER
    operations: [update_user]
    grant_path:
      to: dynamic-template-forms
      trigger: "UPDATE_USER granted — edit/reset-password action enabled (own-user edit exempt)"
    deny_path:
      to: permission_denied
      trigger: "UPDATE_USER denied — edit/reset-password action pruned"
  - permission: READ_ROLE
    operations: [list_roles]
    grant_path:
      to: content
      trigger: "READ_ROLE granted — Roles tab visible; role roster loads"
    deny_path:
      to: permission_denied
      trigger: "READ_ROLE denied — Roles tab hidden (fail-closed)"
  - permission: CREATE_ROLE
    operations: [create_role]
    grant_path:
      to: dynamic-template-forms
      trigger: "CREATE_ROLE granted — new-role action enabled; create form opens"
    deny_path:
      to: permission_denied
      trigger: "CREATE_ROLE denied — new-role action pruned"
  - permission: ENABLE_ROLE
    operations: [toggle_role_status]
    grant_path:
      to: submitting
      trigger: "ENABLE_ROLE granted — enable-role command enqueued"
    deny_path:
      to: permission_denied
      trigger: "ENABLE_ROLE denied — enable toggle pruned"
  - permission: DISABLE_ROLE
    operations: [toggle_role_status]
    grant_path:
      to: submitting
      trigger: "DISABLE_ROLE granted — disable-role command enqueued"
    deny_path:
      to: permission_denied
      trigger: "DISABLE_ROLE denied — disable toggle pruned"
  - permission: READ_PERMISSION
    operations: [get_role_permissions, list_permissions]
    grant_path:
      to: content
      trigger: "READ_PERMISSION granted — role->permission grid + permission catalog load"
    deny_path:
      to: permission_denied
      trigger: "READ_PERMISSION denied — permission grid hidden (fail-closed)"
  - permission: PERMISSIONS_ROLE
    operations: [update_role_permissions]
    grant_path:
      to: saving
      trigger: "PERMISSIONS_ROLE granted — save-grid enabled (ONLINE-ONLY); grid persists"
    deny_path:
      to: permission_denied
      trigger: "PERMISSIONS_ROLE denied — grid is read-only; save-grid pruned"
  - permission: UPDATE_PERMISSION
    operations: [update_permission_maker_checker]
    grant_path:
      to: saving
      trigger: "UPDATE_PERMISSION granted — maker-checker toggle enabled (ONLINE-ONLY)"
    deny_path:
      to: permission_denied
      trigger: "UPDATE_PERMISSION denied — maker-checker toggle pruned"
