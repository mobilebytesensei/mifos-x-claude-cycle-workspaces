appId: org.mifos.backoffice
# M10 · Users, Roles & Permissions — happy path: land on the admin control plane, confirm the
# user roster renders, switch to Roles, open a role's permission grid, toggle a permission cell,
# and save. Every id maps to a ui.yaml component testTag. Runs for a PERMISSIONS_ROLE persona.
---
- launchApp
# ── Control plane renders (Users tab) ────────────────────────────────
- assertVisible:
    id: "m10-users-roles-permissions_header"
- assertVisible:
    id: "m10-users-roles-permissions_content"
- assertVisible:
    id: "m10-users-roles-permissions_user_row"
# ── New-user entry point present for a CREATE_USER persona ────────────
- assertVisible:
    id: "m10-users-roles-permissions_new_user"
# ── Switch to Roles and open a role's permission grid ────────────────
- tapOn:
    id: "m10-users-roles-permissions_tabs"
- tapOn:
    id: "m10-users-roles-permissions_role_row"
# ── Edit the role -> permission grid and save (online-only) ──────────
- tapOn:
    id: "m10-users-roles-permissions_matrix_cell"
- assertVisible:
    id: "m10-users-roles-permissions_save"
- tapOn:
    id: "m10-users-roles-permissions_save"
