schema_version: v1.0.0
feature: m10-users-roles-permissions

entries:
  - trigger: on_mount
    source: api.list_users
    target_state: content
    loading_state: loading
    empty_state: empty
    error_state: error
    on_error:
      nav_target: null
      error_code: users_read_failed
    persistence_contract:
      store: room
      table: users_roles
      keys: [entity_type, entity_id, name, payload_json]
      mutation: read
      note: "Users + roles rosters cached CACHE_FIRST_SWR (entity_type = user|role); serves instantly offline, revalidates online."

  - trigger: on_tab_select
    source: api.list_roles
    target_state: content
    loading_state: loading
    empty_state: empty
    error_state: error
    on_error:
      nav_target: null
      error_code: roles_read_failed
    persistence_contract:
      store: room
      table: users_roles
      keys: [entity_type, entity_id, name, payload_json]
      mutation: read
      note: "Role roster cached CACHE_FIRST_SWR."

  - trigger: on_role_open
    source: api.get_role_permissions
    target_state: content
    loading_state: loading
    error_state: error
    on_error:
      nav_target: null
      error_code: role_permissions_read_failed
    persistence_contract:
      store: room
      table: role_permissions
      keys: [role_id, grouping, code, selected, maker_checkerable]
      mutation: read
      note: "The selected role's permission grid cached CACHE_FIRST_SWR for read-only viewing; edits are held in-memory (pendingGridChanges) and committed ONLINE-ONLY."

tables:
  - name: users_roles
    backend: room
    keys: [entity_type, entity_id, name, payload_json]
    mutation: read
    persistence_contract:
      store: room
      keys: [entity_type, entity_id]
    note: "Shared user + role read cache. User/role WRITES (create/edit/enable/disable/password) are queued in the shared offline-sync-engine draft_outbox, NOT written here directly."
  - name: role_permissions
    backend: room
    keys: [role_id, grouping, code, selected, maker_checkerable]
    mutation: read
    persistence_contract:
      store: room
      keys: [role_id, code]
    note: "Per-role permission grid read cache. Grid SAVES (PUT /v1/roles/{id}/permissions) and maker-checker toggles (PUT /v1/permissions) are ONLINE-ONLY — never persisted through the offline outbox; on save the runtime PermissionSet cache is invalidated."

cache:
  strategy: cache_first
  note: "Rosters + grid read cache-first (SWR). Authorization mutations bypass the cache/outbox and require connectivity (online-only)."

offline_policy: online-only-writes
online_only_note: "Reads are cache-first-SWR. Role->permission grid saves + maker-checker toggles are ONLINE-ONLY (the control plane must never defer-sync an authorization change). User/role CRUD queues through the offline outbox like every other write."
