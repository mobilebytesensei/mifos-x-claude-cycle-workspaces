schema_version: v1.0.0
feature: m10-users-roles-permissions
base_url_note: "{host}/fineract-provider/api/v1 — global Fineract-Platform-TenantId header + basicAuth on every op."

operations:
  - id: list_users
    method: GET
    path: "/v1/users"
    description: "Application-user roster (username, office, staff, roles, status)."
    response:
      shape: list
      type: "AppUser[]"
    pagination:
      style: offset_limit
      params: [offset, limit, orderBy, sortOrder]
      envelope: bare_array
    requires_auth: true
    requires_permission: [READ_USER]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: get_user_template
    method: GET
    path: "/v1/users/template"
    description: "Field defaults + allowed-value lists (offices, staff, roles, send-password) for the create/edit user form."
    response:
      shape: object
      type: "AppUserTemplate"
    requires_auth: true
    requires_permission: [READ_USER]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: create_user
    method: POST
    path: "/v1/users"
    description: "Create an application user + assign office, staff and roles; queued via the offline outbox."
    request_type: "CreateUserRequest"
    response:
      shape: object
      type: "CommandProcessingResult"
    idempotency: durable
    requires_auth: true
    requires_permission: [CREATE_USER]
    maker_checker: true

  - id: update_user
    method: PUT
    path: "/v1/users/{userId}"
    description: "Edit a user (roles/office/staff) or reset their password (password + repeatPassword or server-generated); own-user edit exempt from READ_USER."
    request_type: "UpdateUserRequest"
    response:
      shape: object
      type: "CommandProcessingResult"
    idempotency: durable
    requires_auth: true
    requires_permission: [UPDATE_USER]
    maker_checker: true

  - id: list_roles
    method: GET
    path: "/v1/roles"
    description: "Role roster (name, description, disabled flag)."
    response:
      shape: list
      type: "Role[]"
    pagination:
      style: none
      envelope: bare_array
    requires_auth: true
    requires_permission: [READ_ROLE]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: create_role
    method: POST
    path: "/v1/roles"
    description: "Create a role (name + description); its permission grid starts empty. Queued via the offline outbox."
    request_type: "CreateRoleRequest"
    response:
      shape: object
      type: "CommandProcessingResult"
    idempotency: durable
    requires_auth: true
    requires_permission: [CREATE_ROLE]

  - id: toggle_role_status
    method: POST
    path: "/v1/roles/{roleId}?command={cmd}"
    description: "Enable or disable a role (cmd=enable|disable); a disabled role stops contributing its permissions to member users."
    request_type: "RoleCommandRequest"
    response:
      shape: object
      type: "CommandProcessingResult"
    idempotency: durable
    requires_auth: true
    requires_permission: [ENABLE_ROLE, DISABLE_ROLE]
    maker_checker: true

  - id: get_role_permissions
    method: GET
    path: "/v1/roles/{roleId}/permissions"
    description: "Role->permission grid for the selected role, grouped by Fineract grouping; also the password-less permission refresh fallback."
    response:
      shape: object
      type: "RolePermissions"
    requires_auth: true
    requires_permission: [READ_PERMISSION]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: update_role_permissions
    method: PUT
    path: "/v1/roles/{roleId}/permissions"
    description: "Persist the edited role->permission grid (bulk selected diff); ONLINE-ONLY — authorization config is never deferred. Invalidates the runtime PermissionSet cache."
    request_type: "RolePermissionsRequest"
    response:
      shape: object
      type: "CommandProcessingResult"
    online_only: true
    requires_auth: true
    requires_permission: [PERMISSIONS_ROLE]

  - id: list_permissions
    method: GET
    path: "/v1/permissions"
    description: "Full permission catalog (grouping, code, entityName, actionName); ?makerCheckerable=true badges which require approval."
    response:
      shape: list
      type: "Permission[]"
    query_params: [makerCheckerable]
    pagination:
      style: none
      envelope: bare_array
    requires_auth: true
    requires_permission: [READ_PERMISSION]
    cacheable: true
    cache_strategy: CACHE_FIRST_SWR

  - id: update_permission_maker_checker
    method: PUT
    path: "/v1/permissions"
    description: "Toggle whether permission codes are maker-checkerable (4-eye); ONLINE-ONLY so the maker-checker contract can never drift offline."
    request_type: "PermissionMakerCheckerRequest"
    response:
      shape: object
      type: "CommandProcessingResult"
    online_only: true
    requires_auth: true
    requires_permission: [UPDATE_PERMISSION]
