# The role->permission grid loaded into the editor for role_1 (Teller),
# grouped by Fineract grouping. `selected` = currently granted; `maker_checkerable`
# = requires-approval (4-eye) badge.
permission_grid:
  role_id: "role_1"
  role_name: "Teller"
  groups:
    - grouping: "authorisation"
      permissions:
        - { code: "READ_USER", entity: "USER", action: "READ", selected: false, maker_checkerable: false }
        - { code: "READ_ROLE", entity: "ROLE", action: "READ", selected: false, maker_checkerable: false }
    - grouping: "portfolio"
      permissions:
        - { code: "READ_CLIENT", entity: "CLIENT", action: "READ", selected: true, maker_checkerable: false }
        - { code: "READ_LOAN", entity: "LOAN", action: "READ", selected: true, maker_checkerable: false }
        - { code: "READ_SAVINGSACCOUNT", entity: "SAVINGSACCOUNT", action: "READ", selected: true, maker_checkerable: false }
    - grouping: "transaction_savings"
      permissions:
