appId: org.mifos.backoffice
---
- launchApp
- assertVisible:
    id: "m03-groups-centers_header"
- assertVisible:
    id: "m03-groups-centers_content"
# open a center/group from the list
- tapOn:
    id: "m03-groups-centers_item"
# mark a member present in the meeting attendance draft
- tapOn:
    id: "m03-groups-centers_attendance_toggle"
# queue the attendance command through the offline outbox
- tapOn:
    id: "m03-groups-centers_save_attendance"
