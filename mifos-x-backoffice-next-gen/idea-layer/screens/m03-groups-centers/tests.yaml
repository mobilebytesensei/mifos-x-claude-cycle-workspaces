schema_version: v1.0.0
feature: m03-groups-centers
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/empty/error) + per api operation family
# (list centers/groups, get group/center detail, list_meetings, template, create_group, activate,
# assign_staff, manage_members, associate_groups_to_center, save_attendance, save_collection_sheet).
scenarios:
  # ── content ──────────────────────────────────────────────────────────
  - id: centers_groups_list_offline
    description: "Cached centers+groups render offline via CACHE_FIRST_SWR"
    preconditions: ["user holds READ_CENTER + READ_GROUP", "centers/groups previously cached", "network unavailable"]
    actions: ["open the Groups & Centers list offline"]
    assertions: ["cached centers with nested groups render from Room", "the offline · cached banner is shown"]
    priority: high

  - id: switch_scope_tab_centers_groups
    description: "Scope tab toggles the Centers ⇄ Groups view without a fetch"
    preconditions: ["list content loaded"]
    actions: ["tap the Groups tab", "tap the Centers tab"]
    assertions: ["the list re-derives from the cached collection", "no network call is issued on toggle"]
    priority: medium

  - id: open_group_detail_shows_members_and_calendar
    description: "Opening a group shows members, GLIM loans, and the meeting calendar"
    preconditions: ["group list content loaded", "group detail cached"]
    actions: ["tap a group row"]
    assertions: ["member roster renders", "the meeting calendar + attendance sheet render for the selected meeting"]
    priority: high

  # ── attendance (offline-first, gated) ─────────────────────────────────
  - id: attendance_queues_offline
    description: "Marked attendance queues to the outbox with a durable idempotency key"
    preconditions: ["user holds SAVEORUPDATEATTENDANCE_MEETING", "group meeting open", "network unavailable"]
    actions: ["toggle 8 of 12 members present", "tap Save attendance"]
    assertions: ["a saveOrUpdateAttendance command is queued in the outbox with a durable idempotency_key", "it replays exactly-once when online (no double post)"]
    priority: high

  - id: attendance_toggle_hidden_without_permission
    description: "Attendance controls are gated by SAVEORUPDATEATTENDANCE_MEETING"
    preconditions: ["user holds READ_GROUP + READ_MEETING but NOT SAVEORUPDATEATTENDANCE_MEETING"]
    actions: ["open a group meeting"]
    assertions: ["per-member attendance toggles + Save-attendance button are hidden or disabled with a reason"]
    priority: high

  - id: open_group_loan_cross_links_to_m04
    description: "Tapping a GLIM group-loan row opens the loan account in m04-loan-portfolio"
    preconditions: ["group detail loaded with >=1 GLIM group loan cached"]
    actions: ["tap a group-loan row"]
    assertions: ["navigation targets m04-loan-portfolio with the group loan account id", "no group record is mutated"]
    priority: medium

  - id: select_meeting_rederives_attendance_sheet
    description: "Selecting a meeting re-derives the attendance draft for that meeting date without a fetch"
    preconditions: ["group detail loaded with >=2 meeting calendars cached"]
    actions: ["select a different meeting in the meeting selector"]
    assertions: ["the clientsAttendance draft rows re-derive for the chosen meeting date", "no network call is issued on select"]
    priority: medium

  - id: collection_sheet_queues_offline
    description: "Collection sheet capture enqueues saveCollectionSheet to the outbox offline"
    preconditions: ["user holds SAVECOLLECTIONSHEET_CENTER", "a center meeting is open", "network unavailable"]
    actions: ["open the collection sheet", "enter amounts collected", "tap Save"]
    assertions: ["a saveCollectionSheet command is queued in the outbox with a durable idempotency_key", "it replays exactly-once via POST /v1/batches when online"]
    priority: high

  - id: collection_sheet_hidden_without_permission
    description: "The collection sheet action is gated by SAVECOLLECTIONSHEET_CENTER/_GROUP"
    preconditions: ["user holds READ_CENTER but NOT SAVECOLLECTIONSHEET_CENTER/_GROUP"]
    actions: ["open a center detail"]
    assertions: ["the Collection sheet button is hidden or disabled with a reason"]
    priority: medium

  # ── lifecycle + membership (gated) ────────────────────────────────────
  - id: activate_gated_and_queued
    description: "Activate is gated by ACTIVATE_GROUP and enqueued offline"
    preconditions: ["user holds ACTIVATE_GROUP", "a pending group is open", "network unavailable"]
    actions: ["tap Activate"]
    assertions: ["an activate command is queued with a durable idempotency_key", "the status chip shows activating · queued"]
    priority: high

  - id: manage_members_associates_clients
    description: "Membership edit enqueues associateClients from the m02-clients roster"
    preconditions: ["user holds ASSOCIATECLIENTS_GROUP", "a group is open"]
    actions: ["open Manage members", "select 2 clients", "confirm"]
    assertions: ["an associateClients command (clientMembers[]) is queued", "no client record is mutated directly"]
    priority: medium

  - id: create_fab_hidden_without_permission
    description: "The create FAB is gated by CREATE_GROUP"
    preconditions: ["user lacks CREATE_GROUP and CREATE_CENTER"]
    actions: ["open the Groups & Centers list"]
    assertions: ["the New group/center FAB is absent"]
    priority: medium

  # ── recovery ──────────────────────────────────────────────────────────
  - id: error_group_list_failure_retry
    description: "A failed list fetch with no cache shows the error state + Retry"
    preconditions: ["/v1/groups returns 500", "no cache"]
    actions: ["open the Groups & Centers list", "tap Retry"]
    assertions: ["the error state renders with a Retry CTA", "Retry re-issues the fetch"]
    priority: medium

  - id: rejected_command_routes_to_needs_attention
    description: "A server-rejected replay lands in needs-attention-inbox"
    preconditions: ["a queued assignStaff command", "the server rejects the replay"]
    actions: ["sync drains the outbox"]
    assertions: ["the failed command surfaces in needs-attention-inbox with the Fineract server_error", "it is never silently dropped"]
    priority: medium
