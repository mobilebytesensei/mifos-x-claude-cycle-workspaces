feature: m03-groups-centers
entry_points:
  - type: nav_root
    description: "Groups & Centers module root — a drawer/rail nav root gated on the group/center permission group (rendered iff the user holds >=1 of READ_GROUP / READ_CENTER)"
  - type: from_dashboard
    description: "Opened from a dashboard group/center or collections tile (collections field-officer route)"

transitions:
  # ── list load ──────────────────────────────────────────────────────────
  - from: loading
    to: content
    trigger: "centers/groups loaded (CACHE_FIRST_SWR)"
  - from: loading
    to: empty
    trigger: "no groups or centers in office scope"
  - from: loading
    to: no-network
    trigger: "offline — cached centers/groups served"
  - from: loading
    to: error
    trigger: "list fetch failed and no cache (or 4xx/5xx)"

  # ── in-list interactions ────────────────────────────────────────────────
  - from: content
    to: content
    trigger: "switch_scope_tab → toggle Centers ⇄ Groups view"
  - from: content
    to: content
    trigger: "open_group_center_detail → group/center detail (members, GLIM, calendar, attendance)"

  # ── attendance capture (offline-first) ──────────────────────────────────
  - from: content
    to: content
    trigger: "toggle_member_attendance → mark present/absent in the attendance draft (SAVEORUPDATEATTENDANCE_MEETING)"
  - from: content
    to: content
    trigger: "save_attendance → saveOrUpdateAttendance command queued to outbox"
  - from: no-network
    to: no-network
    trigger: "toggle_member_attendance / save_attendance while offline → command stays queued for batch replay"

  # ── lifecycle + membership commands ─────────────────────────────────────
  - from: content
    to: content
    trigger: "activate_group_center → activate command queued (ACTIVATE_GROUP / ACTIVATE_CENTER)"
  - from: content
    to: content
    trigger: "manage_members → associateClients/disassociateClients command queued (ASSOCIATECLIENTS_GROUP)"

  # ── cross-feature navigation ────────────────────────────────────────────
  - from: content
    to: m02-clients
    trigger: "open_member_client → member's Client 360 (read-only cross-link)"
  - from: content
    to: dynamic-template-forms
    trigger: "start_group_center_creation → template-driven create form (CREATE_GROUP / CREATE_CENTER)"
  - from: content
    to: dynamic-template-forms
    trigger: "assign_staff → template-driven staff picker (ASSIGNSTAFF_GROUP)"

  # ── recovery ─────────────────────────────────────────────────────────────
  - from: error
    to: loading
    trigger: "retry_load → re-fetch list/detail"
  - from: no-network
    to: loading
    trigger: "retry_load → re-fetch when connectivity returns"
  - from: error
    to: content
    trigger: "403 drift → permission-capability-engine refresh + re-resolve, surface stays alive"
