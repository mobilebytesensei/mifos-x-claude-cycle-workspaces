appId: org.mifos.backoffice
---
# Network Config — happy path: open from sign-in Configure button,
# use the Mifos community demo one-tap path, verify re-auth and route to home.
- launchApp
- assertVisible:
    id: "fineract-auth-session_header"
# Tap the Configure button on sign-in to open network-config
- tapOn:
    id: "fineract-auth-session_configure_button"
- assertVisible:
    id: "network-config_header"
- assertVisible:
    id: "network-config_mode_tabs"
# Select the demo tab and tap Use demo
- tapOn:
    id: "network-config_tab_demo"
- assertVisible:
    id: "network-config_demo_banner"
- assertVisible:
    id: "network-config_demo_server"
- tapOn:
    id: "network-config_use_demo"
# saving state — re-auth in progress
- assertVisible:
    id: "network-config_header"
# After re-auth succeeds, should be at the dashboard
- assertVisible:
    id: "m01-dashboard_header"
- assertVisible:
    id: "nav-shell-assembler_host"
