schema_version: v1.0.0
feature: network-config
scenarios:
  - id: demo_one_tap_connect
    preconditions: ["fresh install or user opens from sign-in Configure button"]
    actions: ["select 'Use Mifos community demo' tab", "tap 'Use Mifos community demo' button"]
    assertions:
      - "base_url filled with mifos-bank-2.mifos.community API path"
      - "tenant filled with 'mifos-bank-2'"
      - "username/password pre-filled with mifos/password"
      - "saving state shown"
      - "re-auth to PRIMARY server succeeds"
      - "routes to dashboard (Super user on mifos-bank-2)"
    priority: high

  - id: org_config_manual_entry
    preconditions: ["user opens from sign-in Configure button or M17 Network config row"]
    actions: ["select 'Your organization' tab", "enter custom base_url", "enter tenant", "enter username", "enter password", "tap Validate", "tap Save"]
    assertions:
      - "Validate runs GET /v1/serverinfo probe with entered tenant header"
      - "Connection verified chip shown after successful probe"
      - "Save persists to encrypted store"
      - "DynamicBaseUrlPlugin base_url + tenant header swapped"
      - "POST /v1/authentication re-auth against the new server succeeds"
      - "Routes to capability bootstrap"
    priority: high

  - id: qr_scan_auto_fills_fields
    preconditions: ["camera permission granted", "valid Mifos config QR available"]
    actions: ["tap Scan QR", "point camera at QR code"]
    assertions:
      - "scanning state shown"
      - "On QR decode: base_url, tenant, username auto-filled from QR payload"
      - "transitions to editing state"
      - "password field remains empty (user enters manually)"
    priority: medium

  - id: invalid_url_blocks_save
    preconditions: []
    actions: ["enter an invalid URL (no https scheme, e.g. 'localhost:8080')", "tap Save"]
    assertions:
      - "inline field error 'Please enter a valid https:// URL' shown"
      - "Save button remains disabled"
    priority: high

  - id: wrong_tenant_shows_error
    preconditions: ["enter valid base_url for mifos-bank-2 server"]
    actions: ["enter tenant 'default'", "tap Validate"]
    assertions:
      - "validating state shown"
      - "error state: 'Tenant not found on this server — verify the Fineract-Platform-TenantId'"
      - "hint shown: server uses 'mifos-bank-2'"
    priority: high

  - id: reset_to_demo_from_org_config
    preconditions: ["org config active (custom server)"]
    actions: ["tap 'Reset to Mifos community demo defaults'", "confirm in dialog"]
    assertions:
      - "confirm dialog appears before overwriting"
      - "on confirm: demo defaults applied and persisted"
      - "re-auth against PRIMARY demo server triggered"
    priority: medium

  - id: ingress_from_m04_loan_area
    preconditions: ["user signed in", "loan portfolio visible"]
    actions: ["tap 'Network settings' tile in M04"]
    assertions:
      - "network-config opens in idle state"
      - "current active config shown"
    priority: medium

  - id: ingress_from_m17_settings
    preconditions: ["user signed in", "M17 Sync & Settings open"]
    actions: ["tap 'Network configuration' row in M17"]
    assertions:
      - "network-config opens in idle state"
      - "current active config shown"
    priority: medium

  - id: save_reauth_failure_retains_config
    preconditions: ["valid org config saved"]
    actions: ["save_config", "re-auth fails (network error)"]
    assertions:
      - "error state shown: 'Config saved but sign-in failed — try signing in manually'"
      - "config is persisted to the encrypted store"
      - "user can retry sign-in from fineract-auth-session"
    priority: medium
