feature: network-config
entries:
  # ── load current config on mount ──
  - trigger: on_mount
    source: local.network_config
    target_state: idle
    loading_state: idle
    error_state: error
    on_error:
      nav_target: null
      error_code: config_read_failed
    persistence_contract:
      store: encrypted_prefs
      keys: [base_url, tenant, username, password_hash]
      note: "Active NetworkConfig persisted to the encrypted multiplatform-settings key store. Loaded read-only on mount to pre-fill the form with the current values."

  # ── QR decode → auto-fill fields ──
  - trigger: on_event
    action: qr_decoded
    source: local.qr_payload
    target_state: editing
    loading_state: scanning
    error_state: idle
    on_error:
      nav_target: null
      error_code: qr_decode_failed
    persistence_contract:
      store: in_memory
      keys: [base_url, tenant, username]
      note: "QR payload decoded in-memory; not persisted until Save is confirmed."

  # ── validate connection ──
  - trigger: on_click
    action: validate_connection
    source: remote.server_info
    target_state: editing
    loading_state: validating
    error_state: error
    on_error:
      nav_target: null
      error_code: validation_failed_unreachable
    persistence_contract:
      store: in_memory
      keys: [validation_result]
      note: "Probe result (reachable / unreachable / wrong_tenant) held in-memory only; not persisted."

  # ── save config + re-auth ──
  - trigger: on_click
    action: save_config
    source: remote.authentication
    target_state: idle
    loading_state: saving
    error_state: error
    on_error:
      nav_target: null
      error_code: save_reauth_failed
    persistence_contract:
      store: encrypted_prefs
      keys: [base_url, tenant, username, password_hash]
      note: >-
        On successful save, writes the validated NetworkConfig to the encrypted store and updates the
        DynamicBaseUrlPlugin base_url + Fineract-Platform-TenantId header in-flight. The re-auth
        result (AuthenticatedUserData → permissions[]) seeds the new PermissionSet in PermissionStateHolder.
        If re-auth fails, the config is still persisted — the user can retry sign-in from fineract-auth-session.

  # ── apply demo config (one-tap path) ──
  - trigger: on_click
    action: apply_demo_config
    source: remote.authentication
    target_state: idle
    loading_state: saving
    error_state: error
    on_error:
      nav_target: null
      error_code: save_reauth_failed
    persistence_contract:
      store: encrypted_prefs
      keys: [base_url, tenant, username, password_hash]
      note: "Demo defaults: base_url=mifos-bank-2.mifos.community/fineract-provider/api/v1, tenant=mifos-bank-2, mifos/password. Written and re-auth triggered identically to the save_config flow."
