feature: network-config
endpoints:
  - id: validate_server_info
    method: GET
    path: "/v1/serverinfo"
    description: "Connectivity probe — used by the Validate button to confirm the entered base-URL + tenant is reachable before saving. Sends the Fineract-Platform-TenantId header with the entered tenant value and no auth (some Fineract deployments allow /serverinfo without auth; if 401 is returned, the tenant is at least reachable and validation passes)."
    response_type: "ServerInfo"
    requires_auth: false
    requires_permission: []
    cacheable: false
    notes:
      - "If /serverinfo requires auth on the target server, the validator falls back to testing /v1/authentication with the entered credentials as the probe."

  - id: reauthenticate
    method: POST
    path: "/v1/authentication"
    description: "Re-authentication after saving a new network config. Posts the entered username + password against the newly configured server + tenant. On success, the returned permissions[] seed the new PermissionSet for the capability bootstrap."
    request_body: "{ username, password }"
    headers:
      - "Fineract-Platform-TenantId: {entered_tenant}"
      - "Authorization: Basic base64(username:password)"
    response_type: "AuthenticatedUserData"
    requires_auth: false
    requires_permission: []
    idempotency: none
    notes:
      - "Demo credentials: username=mifos, password=password. PRIMARY server mifos-bank-2.mifos.community with tenant mifos-bank-2 returns 15 roles + full permissions for the Super user account."
      - "If this call fails (401/unreachable), the network config is still persisted — the user is shown an error and can retry sign-in manually."
