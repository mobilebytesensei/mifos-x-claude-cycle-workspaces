feature: network-config
entry_points:
  - type: button
    source: fineract-auth-session
    component_id: scan_config_button
    description: "Sign-in screen 'Scan config' button — opens directly to the scanning state."
  - type: button
    source: fineract-auth-session
    component_id: configure_button
    description: "Sign-in screen 'Configure' button — opens to the idle state showing the org tab with empty/current fields."
  - type: nav_item
    source: m04-loan-portfolio
    component_id: network_settings_tile
    description: "M04 Loan Portfolio 'Network settings' quick tile — opens to the idle state with current config loaded."
  - type: list_item
    source: m17-sync-settings
    component_id: network_configuration_row
    description: "M17 Sync & Settings 'Network configuration' list row — opens to the idle state."

transitions:
  # ── initial load ──
  - from: idle
    to: idle
    trigger: "on_mount → load current NetworkConfigState from encrypted store; display active base_url, tenant, username"

  # ── mode selection ──
  - from: idle
    to: idle
    trigger: "select_connect_mode (demo tab) → auto-fill fields with PRIMARY mifos-bank-2 defaults; Save button enabled"
  - from: idle
    to: editing
    trigger: "select_connect_mode (org tab) + user begins editing a field"
  - from: editing
    to: editing
    trigger: "update_base_url / update_tenant / update_username / update_password → inline validation re-runs"

  # ── QR scan ──
  - from: idle
    to: scanning
    trigger: "start_qr_scan"
  - from: editing
    to: scanning
    trigger: "start_qr_scan"
  - from: scanning
    to: editing
    trigger: "QR decoded — fields auto-filled with parsed ServerConfig"
  - from: scanning
    to: idle
    trigger: "QR decode failed (snackbar shown) or user cancels scan"

  # ── validate ──
  - from: idle
    to: validating
    trigger: "validate_connection"
  - from: editing
    to: validating
    trigger: "validate_connection"
  - from: validating
    to: editing
    trigger: "validation succeeded → 'Connection verified' chip shown; Save enabled"
  - from: validating
    to: error
    trigger: "validation failed (unreachable, wrong tenant, network error)"

  # ── save ──
  - from: idle
    to: saving
    trigger: "apply_demo_config (Use Mifos community demo)"
  - from: editing
    to: saving
    trigger: "save_config (org config validated)"
  - from: saving
    to: idle
    trigger: "save + re-auth succeeded → navigate to capability bootstrap (fineract-auth-session authenticated state)"
  - from: saving
    to: error
    trigger: "re-auth failed after save (config persisted but sign-in failed)"

  # ── error recovery ──
  - from: error
    to: editing
    trigger: "user corrects the fields; Retry re-runs validation"
  - from: error
    to: validating
    trigger: "Retry tapped"

  # ── reset to demo ──
  - from: idle
    to: saving
    trigger: "reset_to_demo (confirm dialog → apply PRIMARY demo config)"
  - from: editing
    to: saving
    trigger: "reset_to_demo (confirm dialog → apply PRIMARY demo config)"
