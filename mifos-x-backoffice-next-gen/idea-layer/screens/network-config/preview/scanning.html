<!doctype html>
<!-- state: scanning | feature: network-config | render-hash: netcfg2scan0 -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Configuration — scanning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary:#0091EA;--on-primary:#FFFFFF;--primary-container:#CBE6FF;--on-primary-container:#001E30;
  --secondary:#00796B;--on-secondary:#FFFFFF;--secondary-container:#B8F2E6;--on-secondary-container:#00201A;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --surface:#FCFCFF;--on-surface:#1A1C1E;--surface-variant:#DEE3EB;--on-surface-variant:#42474E;
  --surface-container-low:#F3F4F9;--background:#FCFCFF;
  --outline:#72777F;--outline-variant:#C2C7CF;
  --font-body:system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,'Courier New',monospace;
  --fs-title:1.125rem;--fs-label:0.875rem;--fs-caption:0.75rem;--fs-caption-sm:0.6875rem;
  --fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:9999px;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;
  --el-1:0 1px 2px rgba(0,0,0,.05);
  --border-w:1px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100dvh;background:#E8EAF0;font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start}
.phone{width:360px;min-height:100dvh;background:#000;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.14);overflow:hidden}
/* status bar */
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;background:rgba(0,0,0,.6);font-size:12px;font-weight:var(--fw-semibold);color:#FFFFFF;flex-shrink:0;position:relative;z-index:10}
.status-icons{display:flex;gap:5px;align-items:center}
.status-icons .material-symbols-outlined{font-size:16px!important;color:#FFFFFF}
/* top app bar */
.top-bar{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;background:rgba(0,0,0,.6);border-bottom:var(--border-w) solid rgba(255,255,255,.1);flex-shrink:0;position:relative;z-index:10;backdrop-filter:blur(8px)}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-full);border:none;background:none;cursor:pointer;color:rgba(255,255,255,.9);flex-shrink:0}
.icon-btn .material-symbols-outlined{font-size:24px!important}
.bar-titles{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-title{font-size:var(--fs-title);font-weight:var(--fw-semibold);color:#FFFFFF;line-height:1.3}
.bar-sub{font-size:var(--fs-caption-sm);color:rgba(255,255,255,.65);font-weight:var(--fw-medium)}
/* camera viewport */
.camera-area{flex:1;position:relative;background:#0D0D0D;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* simulated camera noise/grain */
.camera-area::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 35% 40%,rgba(40,40,40,.9) 0%,rgba(15,15,15,.95) 60%,rgba(5,5,5,1) 100%);z-index:1}
/* corner guide overlay */
.scan-overlay{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.qr-frame{width:220px;height:220px;position:relative}
/* corner brackets */
.corner{position:absolute;width:32px;height:32px;border-color:#FFFFFF;border-style:solid;border-width:0}
.corner.tl{top:0;left:0;border-top-width:3px;border-left-width:3px;border-radius:6px 0 0 0}
.corner.tr{top:0;right:0;border-top-width:3px;border-right-width:3px;border-radius:0 6px 0 0}
.corner.bl{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 6px}
.corner.br{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 6px 0}
/* QR pattern (decorative, simulates QR code) */
.qr-pattern{position:absolute;inset:24px;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:2px;opacity:.25}
.qr-cell{background:#fff;border-radius:1px}
.qr-cell.dark{background:rgba(0,145,234,.6)}
/* scan line */
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent);animation:scan-anim 2s ease-in-out infinite;box-shadow:0 0 8px rgba(0,145,234,.8)}
@keyframes scan-anim{0%{top:8%}50%{top:88%}100%{top:8%}}
/* hint text */
.scan-hint{color:rgba(255,255,255,.85);font-size:var(--fs-label);text-align:center;line-height:1.4;max-width:280px;padding:0 16px}
.scan-sub{color:rgba(255,255,255,.5);font-size:var(--fs-caption);text-align:center;margin-top:4px}
/* bottom panel */
.bottom-panel{background:rgba(0,0,0,.75);padding:var(--sp-md);padding-bottom:calc(var(--sp-md) + env(safe-area-inset-bottom,0));display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(8px);border-top:var(--border-w) solid rgba(255,255,255,.1);flex-shrink:0;z-index:10;position:relative}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:var(--r-xl);font-size:var(--fs-label);font-weight:var(--fw-semibold);letter-spacing:.5px;border:none;cursor:pointer;width:100%;text-transform:uppercase;font-family:var(--font-body)}
.btn .material-symbols-outlined{font-size:18px!important}
.btn-ghost{background:rgba(255,255,255,.12);color:#FFFFFF;border:var(--border-w) solid rgba(255,255,255,.25)}
.scan-info-row{display:flex;align-items:center;gap:8px;padding:8px 4px}
.scan-info-row .material-symbols-outlined{font-size:18px!important;color:rgba(255,255,255,.6)}
.scan-info-text{font-size:var(--fs-caption);color:rgba(255,255,255,.6);line-height:1.3}
.scan-info-text strong{color:rgba(255,255,255,.85);font-weight:var(--fw-medium)}
</style>
</head>
<body>
<div class="phone">

  <!-- status bar -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </div>
  </div>

  <!-- top app bar -->
  <div class="top-bar">
    <button class="icon-btn" aria-label="Cancel QR scan and go back">
      <span class="material-symbols-outlined">close</span>
    </button>
    <div class="bar-titles">
      <span class="bar-title">Scan QR Code</span>
      <span class="bar-sub">Network Configuration</span>
    </div>
  </div>

  <!-- camera viewfinder -->
  <div class="camera-area">
    <div class="scan-overlay">
      <div class="scan-hint">Point the camera at a Mifos configuration QR code</div>
      <div class="scan-sub">Your organization distributes these for zero-typing setup</div>

      <div class="qr-frame" aria-label="QR scan target area">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <!-- decorative QR pattern hint -->
        <div class="qr-pattern" aria-hidden="true">
          <div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div>
          <div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div>
          <div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div>
          <div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell"></div><div class="qr-cell"></div>
          <div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div>
          <div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div>
          <div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div>
          <div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div>
          <div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div><div class="qr-cell dark"></div>
        </div>
        <div class="scan-line" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <!-- bottom panel -->
  <div class="bottom-panel">
    <div class="scan-info-row">
      <span class="material-symbols-outlined">info</span>
      <div class="scan-info-text">
        The QR code encodes <strong>Base URL</strong>, <strong>Tenant ID</strong>, and <strong>Username</strong>.
        You will enter your password manually after scanning.
      </div>
    </div>
    <button class="btn btn-ghost" aria-label="Cancel QR scan and return to configuration">
      <span class="material-symbols-outlined">close</span>
      Cancel Scan
    </button>
  </div>

</div>
</body>
</html>
