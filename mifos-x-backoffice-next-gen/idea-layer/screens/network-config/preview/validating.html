<!doctype html>
<!-- state: validating | feature: network-config | render-hash: netcfg4vald0 -->
<!-- demo-data: validating_in_progress → validation_success (GET /v1/serverinfo mifos-bank-2) -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network Configuration — validating</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary:#0091EA;--on-primary:#FFFFFF;--primary-container:#CBE6FF;--on-primary-container:#001E30;
  --secondary:#00796B;--on-secondary:#FFFFFF;--secondary-container:#B8F2E6;--on-secondary-container:#00201A;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --success:#2E7D32;--success-container:#C8E6C9;--on-success-container:#002106;
  --surface:#FCFCFF;--on-surface:#1A1C1E;--surface-variant:#DEE3EB;--on-surface-variant:#42474E;
  --surface-container-low:#F3F4F9;--background:#FCFCFF;
  --outline:#72777F;--outline-variant:#C2C7CF;
  --font-body:system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,'Courier New',monospace;
  --fs-title:1.125rem;--fs-body:1rem;--fs-body-sm:0.9375rem;
  --fs-label:0.875rem;--fs-label-sm:0.75rem;--fs-caption:0.75rem;--fs-caption-sm:0.6875rem;
  --fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:9999px;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;
  --el-1:0 1px 2px rgba(0,0,0,.05);--el-2:0 2px 6px rgba(0,0,0,.08);
  --border-w:1px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100dvh;background:#E8EAF0;font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start}
.phone{width:360px;min-height:100dvh;background:var(--surface);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.14)}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px;background:var(--surface);font-size:12px;font-weight:var(--fw-semibold);color:var(--on-surface);flex-shrink:0}
.status-icons{display:flex;gap:5px;align-items:center}
.status-icons .material-symbols-outlined{font-size:16px!important}
.top-bar{display:flex;align-items:center;gap:4px;padding:4px 8px 8px;background:var(--surface);border-bottom:var(--border-w) solid var(--outline-variant);box-shadow:var(--el-1);flex-shrink:0}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-full);border:none;background:none;cursor:not-allowed;color:var(--on-surface-variant);opacity:.5;flex-shrink:0}
.icon-btn .material-symbols-outlined{font-size:24px!important}
.bar-titles{flex:1;min-width:0}
.bar-title{font-size:var(--fs-title);font-weight:var(--fw-semibold);color:var(--on-surface);line-height:1.3}
.bar-sub{font-size:var(--fs-caption-sm);color:var(--secondary);font-weight:var(--fw-medium)}
/* tabs */
.tab-row{display:flex;border-bottom:var(--border-w) solid var(--outline-variant);background:var(--surface);flex-shrink:0;opacity:.5;pointer-events:none}
.tab-item{flex:1;padding:13px 8px;text-align:center;font-size:var(--fs-label);font-weight:var(--fw-medium);color:var(--on-surface-variant);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-item.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:var(--fw-semibold)}
.tab-item .material-symbols-outlined{font-size:18px!important}
/* main */
.main{flex:1;display:flex;flex-direction:column;gap:14px;padding:var(--sp-md);padding-bottom:var(--sp-xl);overflow-y:auto}
/* progress card */
.progress-card{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 20px;background:var(--primary-container);border:var(--border-w) solid rgba(0,145,234,.22);border-radius:var(--r-lg);box-shadow:var(--el-2)}
.spinner{width:44px;height:44px;border:4px solid rgba(0,30,48,.15);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog-title{font-size:1rem;font-weight:var(--fw-semibold);color:var(--on-primary-container);text-align:center;line-height:1.3}
.prog-endpoint{font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--on-primary-container);opacity:.75;text-align:center;word-break:break-all;line-height:1.4}
.prog-step{font-size:var(--fs-caption-sm);color:var(--on-primary-container);opacity:.65;text-align:center;font-weight:var(--fw-medium)}
/* disabled form (grayed during validation) */
.form-disabled{display:flex;flex-direction:column;gap:10px;opacity:.45;pointer-events:none}
.field-wrap{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:var(--fs-caption);font-weight:var(--fw-medium);color:var(--on-surface-variant);padding-left:14px}
.field-input{background:var(--surface-variant);border:none;border-bottom:1.5px solid var(--outline-variant);border-radius:var(--r-sm) var(--r-sm) 0 0;padding:11px 14px;font-size:var(--fs-body-sm);font-family:var(--font-body);color:var(--on-surface);width:100%}
.field-input.mono{font-family:var(--font-mono);font-size:0.8125rem}
/* disabled action row */
.action-row{display:flex;gap:8px;opacity:.4;pointer-events:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:var(--r-xl);font-size:var(--fs-label);font-weight:var(--fw-semibold);letter-spacing:.4px;border:none;cursor:not-allowed;text-transform:uppercase;font-family:var(--font-body)}
.btn .material-symbols-outlined{font-size:18px!important}
.btn-disabled-primary{background:var(--surface-variant);color:var(--on-surface-variant);width:100%}
.btn-disabled-outlined{background:transparent;color:var(--on-surface-variant);border:var(--border-w) solid var(--outline-variant);flex:1}
/* connection details row */
.conn-detail{display:flex;align-items:center;gap:6px;font-size:var(--fs-caption);color:var(--on-primary-container);opacity:.75}
.conn-detail .material-symbols-outlined{font-size:14px!important}
</style>
</head>
<body>
<div class="phone">

  <!-- status bar -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_full</span>
    </div>
  </div>

  <!-- top app bar (back disabled during validation) -->
  <div class="top-bar">
    <button class="icon-btn" disabled aria-label="Navigation disabled during validation" aria-disabled="true">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <div class="bar-titles">
      <span class="bar-title">Network Configuration</span>
      <span class="bar-sub">Powered by Mifos Initiative</span>
    </div>
  </div>

  <!-- tabs (disabled during validation) -->
  <div class="tab-row" role="tablist" aria-disabled="true">
    <div class="tab-item" role="tab" aria-selected="false">
      <span class="material-symbols-outlined">travel_explore</span>
      Mifos Demo
    </div>
    <div class="tab-item active" role="tab" aria-selected="true">
      <span class="material-symbols-outlined">business</span>
      Your Organization
    </div>
  </div>

  <!-- main content -->
  <main class="main" aria-live="polite" aria-busy="true">

    <!-- validation in-flight progress card -->
    <div class="progress-card" role="status" aria-label="Validating server connection">
      <div class="spinner" aria-hidden="true"></div>
      <div class="prog-title">Testing Connection</div>
      <div class="conn-detail">
        <span class="material-symbols-outlined">network_check</span>
        GET /v1/serverinfo
      </div>
      <div class="prog-endpoint">mifos-bank-2.mifos.community</div>
      <div class="prog-step">Tenant: mifos-bank-2 · Probing Fineract server…</div>
    </div>

    <!-- form fields — disabled during validation -->
    <div class="form-disabled" aria-disabled="true">
      <div class="field-wrap">
        <label class="field-label">Base URL</label>
        <input class="field-input mono" type="url"
          value="https://mifos-bank-2.mifos.community/fineract-provider/api/v1"
          disabled readonly>
      </div>
      <div class="field-wrap">
        <label class="field-label">Tenant ID</label>
        <input class="field-input mono" type="text" value="mifos-bank-2" disabled readonly>
      </div>
      <div class="field-wrap">
        <label class="field-label">Username</label>
        <input class="field-input" type="text" value="mifos" disabled readonly>
      </div>
      <div class="field-wrap">
        <label class="field-label">Password</label>
        <input class="field-input" type="password" value="password" disabled readonly>
      </div>
    </div>

    <!-- action buttons — all disabled -->
    <div class="action-row" aria-disabled="true">
      <button class="btn btn-disabled-outlined" disabled aria-disabled="true">
        <span class="material-symbols-outlined">qr_code_scanner</span>
        Scan QR
      </button>
      <button class="btn btn-disabled-outlined" disabled aria-disabled="true">
        <span class="material-symbols-outlined">network_check</span>
        Validate
      </button>
    </div>

    <button class="btn btn-disabled-primary" disabled aria-disabled="true">
      <span class="material-symbols-outlined">save</span>
      Save Configuration
    </button>

  </main>
</div>
</body>
</html>
