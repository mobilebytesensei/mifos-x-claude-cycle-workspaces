feature: network-config

# Real connection data from research/FINERACT_INSTANCES.md. No placeholders.
# Covers all 6 ui.yaml states: idle, scanning, editing, validating, saving, error.

items:
  # ── idle — PRIMARY demo instance (active config on fresh install) ─────────────
  - id: "demo_primary"
    state: idle
    label: "Mifos Community Demo (PRIMARY)"
    base_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1"
    tenant: "mifos-bank-2"
    username: "mifos"
    password: "password"
    roles_count: 15
    env_tag: "demo"
    active: true
    note: "15 real roles incl. OFICIAL DE CAMPO / CAJERO / SUPERVISOR — realistic multi-role MFI config"

  # ── idle — Fallback demo instance ─────────────────────────────────────────────
  - id: "demo_fallback"
    state: idle
    label: "Mifos Community Sandbox (FALLBACK)"
    base_url: "https://sandbox.mifos.community/fineract-provider/api/v1"
    tenant: "default"
    username: "mifos"
    password: "password"
    roles_count: 2
    env_tag: "sandbox"
    active: false
    note: "Use only if mifos-bank-2 is unreachable. Only 2 roles (Super user, Self Service User)."

  # ── idle — Org-specific instance example ──────────────────────────────────────
  - id: "org_example"
    state: idle
    label: "Community Bank of Nairobi (Production)"
    base_url: "https://fineract.communitybank.co.ke/fineract-provider/api/v1"
    tenant: "communitybank"
    username: "admin_ops"
    password: "••••••••"
    roles_count: null
    env_tag: "prod"
    active: false
    note: "Example of a real MFI pointing to their own self-hosted Fineract instance."

  # ── scanning — QR payload decoded by camera ───────────────────────────────────
  - id: "qr_payload_example"
    state: scanning
    encoded_fields:
      base_url: "https://fineract.communitybank.co.ke/fineract-provider/api/v1"
      tenant: "communitybank"
      username: "field_officer"
    note: "Password intentionally excluded from QR — user enters manually after scanning for security. On decode, fields auto-fill and state transitions to editing."

  # ── editing — Valid fields being entered (org mode) ────────────────────────────
  - id: "editing_valid"
    state: editing
    base_url: "https://fineract.communitybank.co.ke/fineract-provider/api/v1"
    tenant: "communitybank"
    username: "peter.kariuki"
    password: "••••••••"
    base_url_error: null
    tenant_error: null
    validation_result: null
    save_enabled: false
    note: "All fields non-empty, URL valid — Validate button enabled; Save disabled until connection verified."

  # ── editing — Inline validation error (bad URL) ───────────────────────────────
  - id: "editing_url_error"
    state: editing
    base_url: "fineract.communitybank.co.ke"
    tenant: "communitybank"
    username: "peter.kariuki"
    password: "••••••••"
    base_url_error: "Please enter a valid https:// URL"
    tenant_error: null
    validation_result: null
    save_enabled: false
    note: "Missing scheme — inline error shown under base_url field; Validate + Save disabled."

  # ── validating — Connection probe in flight ───────────────────────────────────
  - id: "validating_in_progress"
    state: validating
    probe_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1/serverinfo"
    tenant: "mifos-bank-2"
    is_submitting: true
    note: "GET /v1/serverinfo in flight. Form disabled; progress spinner shown. Typical probe latency 200-800ms."

  # ── validating — Success result ───────────────────────────────────────────────
  - id: "validation_success"
    state: validating
    probe_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1/serverinfo"
    tenant: "mifos-bank-2"
    http_status: 200
    response_summary: "Fineract 1.16.0-SNAPSHOT — readWrite mode"
    validation_result: "verified"
    note: "Success chip 'Connection verified' shown; Save button enabled."

  # ── validating — Wrong tenant result ──────────────────────────────────────────
  - id: "validation_wrong_tenant"
    state: validating
    probe_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1/serverinfo"
    tenant: "default"
    http_status: 401
    error_message: "Invalid tenant identifier supplied. Supplied value: default"
    validation_result: "tenant_not_found"
    ux_message: "Tenant 'default' not found on this server — verify the Fineract-Platform-TenantId with your org admin. Hint: this server uses 'mifos-bank-2'."

  # ── saving — Config persisted, re-auth in flight ──────────────────────────────
  - id: "saving_in_progress"
    state: saving
    base_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1"
    tenant: "mifos-bank-2"
    username: "mifos"
    is_submitting: true
    config_persisted: true
    reauth_in_flight: true
    note: "POST /v1/authentication in flight. Config already written to encrypted_prefs; DynamicBaseUrlPlugin swapped. Progress spinner shown; form disabled."

  # ── error — Re-auth failed after save ─────────────────────────────────────────
  - id: "error_reauth_failed"
    state: error
    base_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1"
    tenant: "mifos-bank-2"
    username: "mifos"
    save_error: "Sign-in failed: wrong username or password. The server URL was saved — tap Retry to sign in again."
    http_status: 401
    config_persisted: true
    note: "Config is persisted; re-auth is the only thing that failed. Retry re-runs POST /v1/authentication with the persisted credentials."
