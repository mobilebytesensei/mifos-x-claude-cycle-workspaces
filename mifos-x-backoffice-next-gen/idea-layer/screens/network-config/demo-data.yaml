feature: network-config
# Real connection data from research/FINERACT_INSTANCES.md. No placeholders.
items:
  # ── Primary demo instance (default fresh-install config) ──
  - id: "demo_primary"
    label: "Mifos Community Demo (PRIMARY)"
    base_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1"
    tenant: "mifos-bank-2"
    username: "mifos"
    password: "password"
    roles_count: 15
    env_tag: "demo"
    active: true
    note: "15 real roles incl. OFICIAL DE CAMPO / CAJERO / SUPERVISOR — realistic multi-role MFI config"

  # ── Fallback demo instance ──
  - id: "demo_fallback"
    label: "Mifos Community Sandbox (FALLBACK)"
    base_url: "https://sandbox.mifos.community/fineract-provider/api/v1"
    tenant: "default"
    username: "mifos"
    password: "password"
    roles_count: 2
    env_tag: "sandbox"
    active: false
    note: "Use only if mifos-bank-2 is unreachable. Only 2 roles (Super user, Self Service User)."

  # ── Org-specific instance example (institution's own server) ──
  - id: "org_example"
    label: "Community Bank of Nairobi (Production)"
    base_url: "https://fineract.communitybank.co.ke/fineract-provider/api/v1"
    tenant: "communitybank"
    username: "admin_ops"
    password: "••••••••"
    roles_count: null
    env_tag: "prod"
    active: false
    note: "Example of a real MFI pointing to their own self-hosted Fineract instance."

  # ── QR payload example (organizations distribute this as a PNG QR code) ──
  - id: "qr_payload_example"
    encoded_fields:
      base_url: "https://fineract.communitybank.co.ke/fineract-provider/api/v1"
      tenant: "communitybank"
      username: "field_officer"
    note: "Password intentionally excluded from QR — user enters it manually after scanning for security."

  # ── Validation probe result (success) ──
  - id: "validation_success"
    probe_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1/serverinfo"
    tenant: "mifos-bank-2"
    http_status: 200
    response_summary: "Fineract 1.16.0-SNAPSHOT — readWrite mode"
    validation_result: "verified"

  # ── Validation probe result (wrong tenant) ──
  - id: "validation_wrong_tenant"
    probe_url: "https://mifos-bank-2.mifos.community/fineract-provider/api/v1/serverinfo"
    tenant: "default"
    http_status: 401
    error_message: "Invalid tenant identifier supplied. Supplied value: default"
    validation_result: "tenant_not_found"
    ux_message: "Tenant 'default' not found on this server — verify the Fineract-Platform-TenantId with your org admin. Hint: this server uses 'mifos-bank-2'."
