<!doctype html>
<!-- render-hash: loadingcolsheet1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collection Sheet — loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #006CB5; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001D33;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9; --background: #FCFCFF; --outline: #72777F;
  --font-body: 'Roboto', system-ui, sans-serif;
  --fs-h3: 1.375rem; --fs-body: 1rem; --fs-caption: 0.75rem; --fw-semibold: 600;
  --lh-body: 1.5; --lh-tight: 1.3;
  --r-sm: 4px; --r-md: 8px; --r-lg: 16px; --r-xl: 28px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF; --on-primary: #003354; --primary-container: #004B78; --on-primary-container: #CBE6FF;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF;
  --surface-container-low: #1E2022; --background: #1A1C1E; --outline: #8C9199;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); border-bottom: var(--border-w) solid var(--surface-variant); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-xl); color: var(--on-surface-variant); }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); margin: 0; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); overflow-y: auto; }
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.sk { border-radius: var(--r-md); background: var(--surface-variant); background-image: linear-gradient(90deg, var(--surface-variant) 0px, var(--surface-container-low) 200px, var(--surface-variant) 400px); background-size: 800px 100%; }
@media (prefers-reduced-motion: no-preference) { .sk { animation: shimmer 1.4s ease-in-out infinite; } }
.sk-head { height: 20px; width: 55%; border-radius: var(--r-sm); }
.sk-grp { border: var(--border-w) solid var(--outline); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
.sk-row { display: flex; align-items: center; gap: var(--sp-md); min-height: 44px; padding: var(--sp-md); border-bottom: var(--border-w) solid var(--surface-variant); }
.sk-row:last-child { border-bottom: none; }
.sk-lines { flex: 1; display: flex; flex-direction: column; gap: var(--sp-xs); }
.sk-line-lg { height: 14px; width: 60%; border-radius: var(--r-sm); }
.sk-line-md { height: 11px; width: 40%; border-radius: var(--r-sm); }
.sk-field { flex: 0 0 auto; width: 88px; height: 36px; border-radius: var(--r-sm); }
.sk-save { height: 48px; border-radius: var(--r-lg); }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="collection-sheet" data-state="loading">

  <header data-shell="top-app-bar" data-variant="small" data-component-id="cs_header">
    <span class="leading material-symbols-outlined" aria-hidden="true">arrow_back</span>
    <h1 class="app-title">Collection Sheet</h1>
  </header>

  <main data-shell="content" data-state="loading" aria-busy="true" aria-label="Generating collection sheet">
    <div class="sk sk-head" aria-hidden="true"></div>
    <div class="sk-grp" aria-hidden="true">
      <div class="sk-row"><div class="sk-lines"><div class="sk sk-line-lg"></div><div class="sk sk-line-md"></div></div><div class="sk sk-field"></div></div>
      <div class="sk-row"><div class="sk-lines"><div class="sk sk-line-lg"></div><div class="sk sk-line-md"></div></div><div class="sk sk-field"></div></div>
      <div class="sk-row"><div class="sk-lines"><div class="sk sk-line-lg"></div><div class="sk sk-line-md"></div></div><div class="sk sk-field"></div></div>
    </div>
    <div class="sk sk-save" aria-hidden="true"></div>
  </main>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
