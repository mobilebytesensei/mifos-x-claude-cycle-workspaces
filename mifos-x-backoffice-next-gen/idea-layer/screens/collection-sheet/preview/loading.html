  --sp-0:0; --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-12:48px; --sp-16:64px;
  --sp-xxs:2px; --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-xxl:48px; --sp-xxxl:64px;

:root[data-theme="dark"] {

  --background:#1A1C1E; --on-background:#E2E2E6;

*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; min-height: 100vh; margin: 0; }
body {
  display: flex; flex-direction: column; min-height: 100vh;
  background-color: var(--background); color: var(--on-background);
  font-family: var(--font-body); font-size: var(--fs-body-medium);
  line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
main { flex: 1; }

/* ── App-bar partial style (inlined) ── */
.bo-appbar-d {
  display: flex; align-items: center; gap: var(--sp-2, 8px);
  height: 56px; padding: 0 var(--sp-2, 8px);
  padding-top: env(safe-area-inset-top, 0px);
  background-color: var(--surface, #FCFCFF);
  color: var(--on-surface, #1A1C1E);
  border-bottom: var(--border-thin, 1px) solid var(--outline-variant, #C2C7CF);
  position: sticky; top: 0; z-index: 90; box-sizing: border-box; width: 100%;
  box-shadow: var(--el-1);
}
.bo-appbar-d-btn {
  display: flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; min-width: 44px; border: none; background: transparent;
  color: var(--on-surface-variant, #42474E); cursor: pointer;
  border-radius: var(--r-full, 9999px); -webkit-tap-highlight-color: transparent;
}
.bo-appbar-d-btn:hover { background-color: color-mix(in srgb, var(--on-surface, #1A1C1E) 8%, transparent); }
.bo-appbar-d-btn:focus-visible { outline: var(--border-focus, 2px) solid var(--primary, #0091EA); outline-offset: 2px; }
.bo-appbar-d-btn svg { width: 24px; height: 24px; fill: currentColor; }
.bo-appbar-d-title {
  flex: 1; min-width: 0; font-family: var(--font-display, 'Roboto', sans-serif);
  font-size: var(--fs-title-large, 22px); font-weight: var(--fw-medium, 500);
  line-height: 28px; color: var(--on-surface, #1A1C1E);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ── Screen body ── */
.cs-content {
  display: flex; flex-direction: column; gap: var(--sp-4);
  padding: var(--sp-4);
  padding-bottom: calc(var(--sp-16) + var(--sp-16) + var(--sp-8));
  max-width: 100%;
}

/* Meeting hero (summary gradient) */
.cs-hero {
  position: relative; overflow: hidden;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--primary), var(--primary-pressed));
  color: var(--on-primary);
  padding: var(--sp-5);
  box-shadow: var(--el-2);
  display: flex; flex-direction: column; gap: var(--sp-4);
}
.cs-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); }
.cs-overline {
  font-size: var(--fs-label-small); font-weight: var(--fw-bold);
  letter-spacing: 1.5px; text-transform: uppercase;
  color: color-mix(in srgb, var(--on-primary) 82%, transparent);
}
.cs-hero-center { font-size: var(--fs-headline-small); font-weight: var(--fw-bold); line-height: 1.15; margin-top: var(--sp-1); }
.cs-hero-group { font-size: var(--fs-body-medium); font-weight: var(--fw-medium); color: color-mix(in srgb, var(--on-primary) 88%, transparent); margin-top: var(--sp-1); }
.cs-regen {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  border: var(--border-thin) solid color-mix(in srgb, var(--on-primary) 55%, transparent);
  background: color-mix(in srgb, var(--on-primary) 12%, transparent);
  color: var(--on-primary);
  font-family: var(--font-body); font-size: var(--fs-label-medium); font-weight: var(--fw-medium);
  padding: var(--sp-1) var(--sp-3); border-radius: var(--r-full); cursor: pointer;
  -webkit-tap-highlight-color: transparent; white-space: nowrap; flex-shrink: 0;
}
.cs-regen:hover { background: color-mix(in srgb, var(--on-primary) 20%, transparent); }
.cs-regen:focus-visible { outline: var(--border-focus) solid var(--on-primary); outline-offset: 2px; }
.cs-regen svg { width: var(--icon-xs); height: var(--icon-xs); fill: currentColor; }

.cs-hero-meta { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.cs-meta-chip {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  background: color-mix(in srgb, var(--on-primary) 14%, transparent);
  border-radius: var(--r-full); padding: var(--sp-1) var(--sp-3);
  font-size: var(--fs-label-medium); font-weight: var(--fw-medium);
}
.cs-meta-chip svg { width: var(--icon-xs); height: var(--icon-xs); fill: currentColor; opacity: .9; }
.cs-meta-chip .cs-mono { font-family: var(--font-mono); font-weight: var(--fw-medium); }

.cs-progress-wrap { display: flex; flex-direction: column; gap: var(--sp-2); }
.cs-progress-figs { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-2); flex-wrap: wrap; }
.cs-collected-big { font-family: var(--font-mono); font-size: var(--fs-headline-medium); font-weight: var(--fw-bold); letter-spacing: -.5px; }
.cs-collected-of { font-size: var(--fs-body-small); font-weight: var(--fw-medium); color: color-mix(in srgb, var(--on-primary) 82%, transparent); }
.cs-collected-of .cs-mono { font-family: var(--font-mono); }
.cs-bar {
  position: relative; height: var(--sp-2); border-radius: var(--r-full);
  background: color-mix(in srgb, var(--on-primary) 24%, transparent); overflow: hidden;
}
.cs-bar-fill { position: absolute; inset: 0 auto 0 0; width: 68.86%; border-radius: var(--r-full); background: var(--on-primary); }

.cs-hero-stats { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.cs-stat {
  flex: 1 1 30%; min-width: 92px;
  background: color-mix(in srgb, var(--on-primary) 12%, transparent);
  border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3);
  display: flex; flex-direction: column; gap: var(--sp-1);
}
.cs-stat-label { font-size: var(--fs-label-small); font-weight: var(--fw-medium); text-transform: uppercase; letter-spacing: .5px; color: color-mix(in srgb, var(--on-primary) 80%, transparent); }
.cs-stat-val { font-family: var(--font-mono); font-size: var(--fs-body-medium); font-weight: var(--fw-bold); }

/* Group section header */
.cs-group-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: 0 var(--sp-1); margin-top: var(--sp-1); }
.cs-group-title { display: flex; flex-direction: column; gap: var(--sp-1); }
.cs-group-name { font-size: var(--fs-title-medium); font-weight: var(--fw-bold); color: var(--on-surface); }
.cs-group-sub { font-size: var(--fs-label-medium); color: var(--on-surface-variant); }
.cs-group-expected { text-align: right; }
.cs-group-expected .cs-el { font-size: var(--fs-label-small); text-transform: uppercase; letter-spacing: .5px; color: var(--on-surface-variant); font-weight: var(--fw-medium); }
.cs-group-expected .cs-ev { font-family: var(--font-mono); font-size: var(--fs-body-medium); font-weight: var(--fw-bold); color: var(--on-surface); }

/* Client card */
.cs-client {
  background: var(--surface-container-lowest);
  border: var(--border-thin) solid var(--outline-variant);
  border-radius: var(--r-lg);
  box-shadow: var(--el-1);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.cs-client-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4); }
.cs-avatar {
  width: var(--icon-xl); height: var(--icon-xl); aspect-ratio: 1 / 1; flex-shrink: 0;
  border-radius: var(--r-full); display: flex; align-items: center; justify-content: center;
  font-weight: var(--fw-bold); font-size: var(--fs-title-medium); letter-spacing: .5px;
}
.cs-av-a { background: var(--primary-container); color: var(--on-primary-container); }
.cs-av-b { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.cs-av-c { background: var(--secondary-container); color: var(--on-secondary-container); }
.cs-client-id-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.cs-client-name { font-size: var(--fs-body-large); font-weight: var(--fw-semibold); color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-client-id { font-family: var(--font-mono); font-size: var(--fs-label-small); color: var(--on-surface-variant); }

/* Attendance segmented toggle */
.cs-attend {
  display: inline-flex; align-self: flex-start; flex-shrink: 0;
  border-radius: var(--r-full); overflow: hidden;
  border: var(--border-thin) solid var(--outline-variant);
  background: var(--surface-container-low); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.cs-attend:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.cs-attend-seg {
  display: inline-flex; align-items: center; justify-content: center;
  padding: var(--sp-1) var(--sp-2); font-size: var(--fs-label-small); font-weight: var(--fw-medium);
  color: var(--on-surface-variant); min-width: 30px;
}
.cs-attend-seg.on-present { background: var(--success-container); color: var(--on-success-container); font-weight: var(--fw-bold); }
.cs-attend-seg.on-absent { background: var(--error-container); color: var(--on-error-container); font-weight: var(--fw-bold); }
.cs-attend-seg.on-late { background: var(--warning-container); color: var(--on-warning-container); font-weight: var(--fw-bold); }

/* Account row */
.cs-accounts { border-top: var(--border-thin) solid var(--outline-variant); }
.cs-acct {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-top: var(--border-thin) solid color-mix(in srgb, var(--outline-variant) 55%, transparent);
}
.cs-acct:first-child { border-top: none; }
.cs-acct-icon {
  width: var(--icon-lg); height: var(--icon-lg); flex-shrink: 0;
  border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center;
}
.cs-acct-icon.type-loan { background: var(--primary-container); color: var(--on-primary-container); }
.cs-acct-icon.type-savings { background: var(--secondary-container); color: var(--on-secondary-container); }
.cs-acct-icon svg { width: var(--icon-sm); height: var(--icon-sm); fill: currentColor; }
.cs-acct-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.cs-acct-prod { font-size: var(--fs-body-medium); font-weight: var(--fw-medium); color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs-acct-meta { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.cs-acct-no { font-family: var(--font-mono); font-size: var(--fs-label-small); color: var(--on-surface-variant); }
.cs-due-pill {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  font-size: var(--fs-label-small); color: var(--on-surface-variant);
}
.cs-due-pill .cs-mono { font-family: var(--font-mono); font-weight: var(--fw-medium); color: var(--on-surface); }
.cs-charge {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  font-family: var(--font-mono); font-size: var(--fs-label-small); font-weight: var(--fw-medium);
  color: var(--on-warning-container); background: var(--warning-container);
  padding: 0 var(--sp-2); border-radius: var(--r-full);
}

/* currency_field (amount collected) */
.cs-amount {
  flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-1);
}
.cs-amount-lbl { font-size: var(--fs-label-small); text-transform: uppercase; letter-spacing: .3px; color: var(--on-surface-variant); font-weight: var(--fw-medium); }
.cs-field {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  border: var(--border-medium) solid var(--outline-variant);
  border-radius: var(--r-sm); background: var(--surface-container-low);
  padding: var(--sp-1) var(--sp-2); width: 128px; justify-content: flex-end;
}
.cs-field:focus-within { border-color: var(--primary); background: var(--surface-container-lowest); }
.cs-field.is-full { border-color: color-mix(in srgb, var(--success) 60%, var(--outline-variant)); }
.cs-field.is-zero { border-color: color-mix(in srgb, var(--error) 45%, var(--outline-variant)); }
.cs-field-cur { font-family: var(--font-mono); font-size: var(--fs-label-small); font-weight: var(--fw-medium); color: var(--on-surface-variant); }
.cs-field-input {
  border: none; background: transparent; outline: none; text-align: right;
  font-family: var(--font-mono); font-size: var(--fs-body-medium); font-weight: var(--fw-bold);
  color: var(--on-surface); width: 74px; padding: 0; -webkit-tap-highlight-color: transparent;
}

/* Client subtotal footer */
.cs-client-foot {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface-container-low);
  border-top: var(--border-thin) solid var(--outline-variant);
}
.cs-subtotal { display: flex; gap: var(--sp-4); }
.cs-subtotal .cs-k { font-size: var(--fs-label-small); text-transform: uppercase; letter-spacing: .3px; color: var(--on-surface-variant); font-weight: var(--fw-medium); }
.cs-subtotal .cs-v { font-family: var(--font-mono); font-size: var(--fs-body-medium); font-weight: var(--fw-bold); color: var(--on-surface); }
.cs-status-chip {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  font-size: var(--fs-label-small); font-weight: var(--fw-bold);
  padding: var(--sp-1) var(--sp-3); border-radius: var(--r-full);
}
.cs-status-chip svg { width: var(--icon-xs); height: var(--icon-xs); fill: currentColor; }
.cs-status-chip.ok { background: var(--success-container); color: var(--on-success-container); }
.cs-status-chip.miss { background: var(--error-container); color: var(--on-error-container); }

/* Footer group: sticky action bar + bottom nav */
.cs-footer-group { position: sticky; bottom: 0; z-index: 100; margin-top: auto; width: 100%; }
.cs-actionbar {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  background: var(--surface-container-high);
  border-top: var(--border-thin) solid var(--outline-variant);
  box-shadow: var(--el-3);
}
.cs-actionbar-figs { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.cs-actionbar-lbl { font-size: var(--fs-label-small); text-transform: uppercase; letter-spacing: .5px; color: var(--on-surface-variant); font-weight: var(--fw-medium); }
.cs-actionbar-total { font-family: var(--font-mono); font-size: var(--fs-title-large); font-weight: var(--fw-bold); color: var(--on-surface); letter-spacing: -.5px; }
.cs-actionbar-sub { font-size: var(--fs-label-small); color: var(--on-surface-variant); }
.cs-actionbar-sub .cs-mono { font-family: var(--font-mono); }
.cs-save {
  display: inline-flex; align-items: center; gap: var(--sp-2); flex-shrink: 0;
  background: var(--primary); color: var(--on-primary);
  font-family: var(--font-body); font-size: var(--fs-label-large); font-weight: var(--fw-bold);
  border: none; border-radius: var(--r-full); padding: var(--sp-3) var(--sp-6);
  cursor: pointer; box-shadow: var(--el-1); -webkit-tap-highlight-color: transparent;
}
.cs-save:hover { background: var(--primary-hover); }
.cs-save:active { background: var(--primary-pressed); }
.cs-save:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.cs-save svg { width: var(--icon-sm); height: var(--icon-sm); fill: currentColor; }

/* ── Bottom-nav partial style (inlined VERBATIM) ── */
.bo-bottom-nav {
  display: flex; align-items: center; justify-content: space-around;
  height: 72px; padding: 0 var(--sp-1, 4px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background-color: var(--surface, #FCFCFF);
  border-top: var(--border-thin, 1px) solid var(--outline-variant, #C2C7CF);
  position: sticky; bottom: 0; z-index: 100;
  box-sizing: border-box; width: 100%;
  box-shadow: var(--el-1, 0 1px 2px rgba(0,0,0,.05));
}
.bo-nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-decoration: none; color: inherit; flex: 1; gap: var(--sp-1, 4px);
  padding: var(--sp-2, 8px) var(--sp-1, 4px); min-height: 48px; cursor: pointer;
  position: relative; -webkit-tap-highlight-color: transparent; outline: none;
  border-radius: var(--r-sm, 8px);
}
.bo-nav-item:focus-visible { outline: var(--border-focus, 2px) solid var(--primary, #0091EA); outline-offset: 2px; }
.bo-nav-indicator {
  position: absolute; top: 6px; width: 56px; height: 30px;
  background-color: var(--primary-container, #CBE6FF); border-radius: var(--r-full, 9999px); pointer-events: none;
}
.bo-nav-icon { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; }
.bo-nav-label {
  font-family: var(--font-body, 'Roboto', sans-serif);
  font-size: var(--fs-label-medium, 12px); font-weight: var(--fw-medium, 500);
  line-height: 16px; letter-spacing: 0.5px; position: relative; z-index: 1; white-space: nowrap;
}
.bo-nav-item.bo-nav-active .bo-nav-icon svg { fill: var(--on-primary-container, #001E30); }
.bo-nav-item.bo-nav-active .bo-nav-label { color: var(--primary, #0091EA); font-weight: var(--fw-bold, 700); }
.bo-nav-item:not(.bo-nav-active) .bo-nav-indicator { display: none; }
.bo-nav-item:not(.bo-nav-active) .bo-nav-icon svg { fill: var(--on-surface-variant, #42474E); }
.bo-nav-item:not(.bo-nav-active) .bo-nav-label { color: var(--on-surface-variant, #42474E); }

/* ── Loading skeleton (token-native shimmer — additive; reuses layout classes) ── */
@keyframes cs-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .42; } }
.cs-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.cs-sk {
  display: block;
  background: color-mix(in srgb, var(--on-surface-variant) 22%, transparent);
  border-radius: var(--r-sm);
  animation: cs-pulse 1.5s ease-in-out infinite;
}
.cs-hero-sk { background: var(--surface-container-high); }
.cs-hero-sk .cs-sk { background: color-mix(in srgb, var(--on-surface-variant) 26%, transparent); }
.cs-sk-line { height: var(--sp-3); }
.cs-sk-line-sm { height: var(--sp-2); }
.cs-sk-line-lg { height: var(--sp-5); }
.cs-sk-circle { border-radius: var(--r-full); }
.cs-sk-block { border-radius: var(--r-md); }
.cs-sk-regen { width: 108px; height: var(--sp-8); border-radius: var(--r-full); flex-shrink: 0; }
.cs-sk-chip { height: var(--sp-6); border-radius: var(--r-full); }
.cs-sk-bar { height: var(--sp-2); border-radius: var(--r-full); width: 100%; }
.cs-sk-stat { flex: 1 1 30%; min-width: 92px; height: var(--sp-16); border-radius: var(--r-md); }
.cs-sk-attend { width: 118px; height: var(--sp-6); border-radius: var(--r-full); flex-shrink: 0; }
.cs-sk-field { width: 128px; height: var(--sp-8); border-radius: var(--r-sm); flex-shrink: 0; }
.cs-sk-save { width: 132px; height: var(--sp-12); border-radius: var(--r-full); flex-shrink: 0; }
.cs-sk-stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-2); }
.cs-w-30 { width: 30%; } .cs-w-40 { width: 40%; } .cs-w-50 { width: 50%; }
.cs-w-60 { width: 60%; } .cs-w-70 { width: 70%; } .cs-w-80 { width: 80%; }
.cs-mw-sm { max-width: 96px; } .cs-mw-md { max-width: 140px; } .cs-mw-lg { max-width: 180px; }
</style>

<div data-shell="root" data-screen-id="collection-sheet" data-state="loading">

        </div>
        <div class="cs-hero-meta">

      </div>

      <!-- Client card skeleton 1 (two accounts) -->
      <article class="cs-client" data-component-type="LayoutBox" data-component-id="cs_client_skeleton_1" aria-hidden="true">
        <div class="cs-client-head">
          <span class="cs-avatar cs-sk cs-sk-circle"></span>
          <div class="cs-sk-stack">
            <span class="cs-sk cs-sk-line cs-w-70"></span>
            <span class="cs-sk cs-sk-line-sm cs-w-40"></span>
          </div>
          <span class="cs-sk cs-sk-attend"></span>
        </div>
        <div class="cs-accounts">
          <div class="cs-acct">
            <span class="cs-acct-icon cs-sk cs-sk-block"></span>
            <div class="cs-sk-stack">
              <span class="cs-sk cs-sk-line cs-w-60"></span>
              <span class="cs-sk cs-sk-line-sm cs-w-50"></span>
            </div>
            <span class="cs-sk cs-sk-field"></span>
          </div>
          <div class="cs-acct">
            <span class="cs-acct-icon cs-sk cs-sk-block"></span>
            <div class="cs-sk-stack">
              <span class="cs-sk cs-sk-line cs-w-50"></span>

            <span class="cs-sk cs-sk-field"></span>

        </div>
        <div class="cs-client-foot">
          <span class="cs-sk cs-sk-line cs-w-50 cs-mw-lg"></span>
          <span class="cs-sk cs-sk-chip cs-w-40 cs-mw-md"></span>

      <!-- Client card skeleton 2 (two accounts) -->
      <article class="cs-client" data-component-type="LayoutBox" data-component-id="cs_client_skeleton_2" aria-hidden="true">
        <div class="cs-client-head">
          <span class="cs-avatar cs-sk cs-sk-circle"></span>

            <span class="cs-sk cs-sk-line-sm cs-w-40"></span>
          </div>
          <span class="cs-sk cs-sk-attend"></span>
        </div>
        <div class="cs-accounts">
          <div class="cs-acct">
            <span class="cs-acct-icon cs-sk cs-sk-block"></span>
            <div class="cs-sk-stack">
              <span class="cs-sk cs-sk-line cs-w-60"></span>

            <span class="cs-sk cs-sk-field"></span>

          <div class="cs-acct">
            <span class="cs-acct-icon cs-sk cs-sk-block"></span>
            <div class="cs-sk-stack">

      <!-- Client card skeleton 3 (one account) -->
      <article class="cs-client" data-component-type="LayoutBox" data-component-id="cs_client_skeleton_3" aria-hidden="true">

          <span class="cs-avatar cs-sk cs-sk-circle"></span>
          <div class="cs-sk-stack">
            <span class="cs-sk cs-sk-line cs-w-70"></span>
            <span class="cs-sk cs-sk-line-sm cs-w-40"></span>
          </div>
          <span class="cs-sk cs-sk-attend"></span>
        </div>
        <div class="cs-accounts">
          <div class="cs-acct">
            <span class="cs-acct-icon cs-sk cs-sk-block"></span>
            <div class="cs-sk-stack">
              <span class="cs-sk cs-sk-line cs-w-60"></span>
              <span class="cs-sk cs-sk-line-sm cs-w-50"></span>

        <div class="cs-client-foot">
          <span class="cs-sk cs-sk-line cs-w-50 cs-mw-lg"></span>
          <span class="cs-sk cs-sk-chip cs-w-40 cs-mw-md"></span>

    </div>
  </main>

  <!-- FOOTER GROUP: sticky action bar skeleton + bottom-nav (bottom-nav markup VERBATIM) -->

          <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.5 3.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5zM19 19.09H5V4.91h14v14.18zM6 15h12v2H6zm0-4h12v2H6zm0-4h12v2H6z"/></svg>
