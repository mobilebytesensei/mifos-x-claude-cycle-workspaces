<!doctype html>
<!-- render-hash: emptycolsheet3 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collection Sheet — empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #006CB5; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001D33;
  --secondary: #00796B; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --background: #FCFCFF; --outline: #72777F;
  --font-body: 'Roboto', system-ui, sans-serif; --fs-h3: 1.375rem; --fs-h2: 1.4rem; --fs-body: 1rem; --fs-label: 0.875rem; --fs-caption: 0.75rem; --fw-medium: 500; --fw-semibold: 600;
  --lh-body: 1.5; --lh-tight: 1.3;
  --r-sm: 4px; --r-lg: 16px; --r-xl: 28px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF; --on-primary: #003354; --primary-container: #004B78; --on-primary-container: #CBE6FF;
  --secondary: #9CD6C9; --secondary-container: #005046; --on-secondary-container: #B8F2E6;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF; --background: #1A1C1E; --outline: #8C9199;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); border-bottom: var(--border-w) solid var(--surface-variant); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-xl); color: var(--on-surface-variant); cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); margin: 0; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-md); padding: var(--sp-lg); text-align: center; }
.empty-icon { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--secondary-container); color: var(--on-secondary-container); }
.empty-icon .material-symbols-outlined { font-size: 48px; }
.empty-title { font-size: var(--fs-h2); font-weight: var(--fw-semibold); margin: 0; }
.empty-body { max-width: 320px; color: var(--on-surface-variant); margin: 0; }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="collection-sheet" data-state="empty">

  <header data-shell="top-app-bar" data-variant="small" data-component-id="cs_header">
    <span class="leading material-symbols-outlined" data-nav-to="m06-collections" role="button" tabindex="0" aria-label="Back">arrow_back</span>
    <h1 class="app-title">Collection Sheet</h1>
  </header>

  <main data-shell="content" data-state="empty" aria-label="Nothing due today">
    <div class="empty-icon" aria-hidden="true"><span class="material-symbols-outlined">event_available</span></div>
    <h2 class="empty-title">Nothing due today</h2>
    <p class="empty-body">No collection sheet is due for this center today — there are no meetings on this date, or every installment and deposit has already been collected.</p>
  </main>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
