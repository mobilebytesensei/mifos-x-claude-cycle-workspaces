schema_version: v1.0.0
feature: collection-sheet
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/empty/error)
# + per api operation (generate_collection_sheet, save_collection_sheet).
scenarios:
  - id: loading_shows_route_shimmer
    preconditions: ["the sheet is opened", "the staffId-scoped route has not generated yet"]
    actions: ["open today's route from the M01 tile"]
    assertions: ["the loading state shows a grouped route shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_grouped_dues_and_capture
    preconditions: ["the staffId-scoped sheet generates", "the user holds READ_COLLECTIONSHEET"]
    actions: ["open the sheet"]
    assertions:
      - "rows group center → group → client with per-loan installment dues and per-savings deposit dues"
      - "each row has an editable actual-amount field defaulting to the due"
      - "running per-group and sheet totals update as amounts are captured"
    priority: high
  - id: empty_when_nothing_due
    preconditions: ["no dues for the chosen date (no meetings / all paid)"]
    actions: ["open the sheet"]
    assertions: ["a 'nothing due today' panel is shown"]
    priority: low
  - id: error_when_generate_or_save_fails
    preconditions: ["the sheet failed to generate with no cache, or Save failed hard"]
    actions: ["open / save the sheet"]
    assertions: ["the error state is shown", "Retry re-generates or re-attempts save with captured amounts preserved"]
    priority: medium
  - id: capturable_offline
    preconditions: ["the device is offline", "the sheet was generated and cached"]
    actions: ["open the sheet offline", "capture amounts on multiple rows"]
    assertions: ["the route renders from cache", "captured amounts persist in local state with no signal"]
    priority: high
  - id: save_commits_whole_route_as_one_batch
    preconditions: ["amounts are captured across the route", "the user holds SAVECOLLECTIONSHEET"]
    actions: ["tap Save collection sheet"]
    assertions:
      - "the whole route is enqueued to the offline outbox as ONE command with a durable idempotency key"
      - "the next sync replays POST /v1/collectionsheet?command=saveCollectionSheet via POST /v1/batches (all-or-nothing)"
      - "a partial application can never double-post"
    priority: high
  - id: save_gated_by_permission
    preconditions: ["the user lacks SAVECOLLECTIONSHEET"]
    actions: ["inspect the sheet"]
    assertions: ["no Save action is shown (capture-only)"]
    priority: medium
