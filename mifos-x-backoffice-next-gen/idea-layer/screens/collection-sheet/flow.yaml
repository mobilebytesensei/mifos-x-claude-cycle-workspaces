feature: collection-sheet

entry_points:
  - type: direct
    description: "Opened from the M01 dashboard 'today's route' tile (open_todays_route), pre-scoped to the officer's staffId + today."
  - type: from_module
    description: "Reached as the M06 collections module's daily sheet surface."
  - type: from_notification
    description: "An 'overdue collections task' row in the needs-attention inbox drills into the relevant group's sheet."

transitions:
  - from: loading
    to: content
    trigger: "the staffId-scoped sheet generates (or reads cache-first)"
  - from: loading
    to: empty
    trigger: "no dues for the chosen date (no meetings / all paid)"
  - from: loading
    to: error
    trigger: "the sheet failed to generate and no cache is available"

  - from: content
    to: content
    trigger: "an amount is captured, attendance toggled, or the sheet is saved (batch enqueued)"
  - from: content
    to: error
    trigger: "Save failed hard with no fallback"

  - from: error
    to: loading
    trigger: "'Retry' tapped — re-generates the sheet / re-attempts save"
