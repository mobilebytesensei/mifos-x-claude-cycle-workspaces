feature: collection-sheet

# Generate = read (staffId-scoped dues); Save = a single transactional batch routed through
# the offline outbox (POST /v1/batches) so a whole route replays exactly-once.

endpoints:
  - id: generate_collection_sheet
    method: POST
    path: "/v1/collectionsheet"
    description: >-
      Generate the staffId-scoped collection sheet (?command=generateCollectionSheet) for an office + date —
      centers→groups→clients with per-loan installment dues and per-savings deposit dues. A read despite the
      POST verb (Fineract command style); cached for offline capture.
    query_params:
      - { name: command, type: string, required: true }   # generateCollectionSheet
    response:
      shape: object
      dto: CollectionSheetDto
    requires_auth: true
    requires_permission: ["READ_COLLECTIONSHEET"]
    cache: cache_first_swr

  - id: save_collection_sheet
    method: POST
    path: "/v1/collectionsheet"
    description: >-
      Save the whole captured route (?command=saveCollectionSheet) — per-row actual amounts + attendance — as
      ONE transactional batch. Enqueued to the offline outbox with a durable idempotency key and replayed via
      POST /v1/batches (enclosingTransaction) so partial application can never double-post.
    query_params:
      - { name: command, type: string, required: true }   # saveCollectionSheet
    response:
      shape: object
      dto: CommandProcessingResultDto
    requires_auth: true
    requires_permission: ["SAVECOLLECTIONSHEET"]
    idempotency: durable
