feature: collection-sheet
status: designed
cluster: collections
module: m06-collections
priority: must_have
new_infra: false
is_primary_flow: true
has_ui: true
has_api: true
has_server: false
archetype: list
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
  - fineract-auth-session
acceptance_refs:
  - >-
    Generate today's staffId-scoped collection sheet (centers/groups/clients with loan dues and savings deposits),
    capture actual amounts per row offline, and save the whole sheet in one batch through the outbox with a durable
    idempotency key; dues read cache-first so the field officer works with no signal.
plan_ref: idea-plan.yaml#features[collection-sheet]
summary: >-
  The field-officer's daily collection sheet drilled into from the M01 dashboard "today's route" tile. Generates the
  staffId-scoped sheet via POST /v1/collectionsheet?command=generateCollectionSheet (office, staffId,
  meeting/transaction date) into a grouped list — centers → groups → clients — each row showing loan installment dues
  and savings deposit dues. The officer captures the ACTUAL amount collected per loan/savings row inline (defaulting to
  the due), then saves the whole sheet via ?command=saveCollectionSheet in a single transactional batch enqueued to the
  offline outbox with a durable idempotency key, so an entire route captured with no signal replays exactly-once. Dues
  read cache-first through Store5 so the sheet is fully usable offline.
vm_actions:
  - OnGenerate
  - OnAmountChange
  - OnToggleAttendance
  - OnSaveSheet
  - OnRetry
error_cases:
  - generate_failed
  - validation_failed
  - save_failed
  - permission_denied
scaffolded_by: /idea-plan-add
