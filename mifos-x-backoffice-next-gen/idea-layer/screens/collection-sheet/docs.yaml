feature: collection-sheet
status: approved
cluster: collections
module: m06-collections
priority: must_have
new_infra: false
is_primary_flow: true
has_ui: true
has_api: true
has_server: false
archetype: list
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
  - fineract-auth-session
acceptance_refs:
  - >-
    Generate today's staffId-scoped collection sheet (centers/groups/clients with loan dues and savings deposits),
    capture actual amounts per row offline, and save the whole sheet in one batch through the outbox with a durable
    idempotency key; dues read cache-first so the field officer works with no signal.
plan_ref: idea-plan.yaml#features[collection-sheet]
summary: >-
  The field-officer's daily collection sheet drilled into from the M01 dashboard "today's route" tile. Generates the
  staffId-scoped sheet via POST /v1/collectionsheet?command=generateCollectionSheet (office, staffId,
  meeting/transaction date) into a grouped list — centers → groups → clients — each row showing loan installment dues
  and savings deposit dues. The officer captures the ACTUAL amount collected per loan/savings row inline (defaulting to
  the due), then saves the whole sheet via ?command=saveCollectionSheet in a single transactional batch enqueued to the
  offline outbox with a durable idempotency key, so an entire route captured with no signal replays exactly-once. Dues
  read cache-first through Store5 so the sheet is fully usable offline.
metadata:
  category: back-office-domain
  implementation_ready: true
  impl_ready_at: '2026-07-31T00:00:00Z'
  impl_ready_schema: v2
contracts:
  - capability: collection_sheet_read
    platform_spec: >-
      POST /v1/collectionsheet?command=generateCollectionSheet (a read despite the POST verb, Fineract command style)
      scoped by office + staffId + meeting/transaction date, streamed cache-first through a Store5 SourceOfTruth over
      Room (collection_sheet_cache, keyed office_id/staff_id/meeting_date/center_id/group_id/client_id/loan_id) so the
      grouped route — centers → groups → clients with per-loan installment dues and per-savings deposit dues — hydrates
      from Room and is fully capturable with no signal under CACHE_FIRST_SWR; a stale entry renders immediately while
      SWR revalidates in the background per FreshnessBands.
    permission: READ_COLLECTIONSHEET
    error_cases:
      - generate_failed
      - permission_denied
  - capability: collection_sheet_bulk_save
    platform_spec: >-
      POST /v1/collectionsheet?command=saveCollectionSheet — the whole captured route (per-row actual amounts +
      attendance) is assembled as ONE command and written to the draft_outbox Room table with a fresh DURABLE
      idempotency key generated at capture and reused on retry (action=SAVECOLLECTIONSHEET, entity=COLLECTIONSHEET);
      the offline-sync-engine replays it via POST /v1/batches?enclosingTransaction=true as one all-or-nothing atomic
      batch so a whole route captured with no signal posts EXACTLY ONCE across connectivity flap / crash / reinstall
      (zero double-post). A rejected replay routes to needs-attention-inbox, never silently dropped.
    permission: SAVECOLLECTIONSHEET
    error_cases:
      - validation_failed
      - save_failed
      - command_rejected
      - sheet_queued_offline
libraries:
  - capability: collection_sheet_read
    library: org.mobilenativefoundation.store.store5
    version: 5.x
    targets:
      - android
      - ios
      - desktop
  - capability: collection_sheet_read
    library: androidx.room
    version: 3.x
    targets:
      - android
      - ios
      - desktop
  - capability: collection_sheet_read
    library: cmp-network-monitor
    version: latest
    targets:
      - android
      - ios
      - desktop
  - capability: collection_sheet_bulk_save
    library: openMF Fineract Client KMP SDK
    version: latest
    targets:
      - android
      - ios
      - desktop
  - capability: collection_sheet_bulk_save
    library: kotlinx-serialization
    version: 1.7.x
    targets:
      - android
      - ios
      - desktop
vm_actions:
  - name: OnGenerate
    signature: private fun onGenerate(office: OfficeStaffDate)
    state_mutations:
      - uiState=Loading
      - sheet=<generated route> | uiState=Content | uiState=Empty | uiState=Error
    side_effects:
      - CollectionSheetStore.stream(office, CACHE_FIRST_SWR)
      - PermissionEvaluator.evaluate(READ_COLLECTIONSHEET)
    error_handling:
      NetworkError: uiState=Content from collection_sheet_cache if present else uiState=Error; offer Retry
      GenerateFailed: uiState=Error (generate_failed) with Retry when no cache is available
      Empty: uiState=Empty; show the 'nothing due today' panel when no dues for the chosen date
  - name: OnAmountChange
    signature: 'private fun onAmountChange(rowKey: String, amount: Money)'
    state_mutations:
      - captured[rowKey]=amount
      - uiState=Content (running per-group and sheet totals recomputed)
    side_effects: []
    error_handling: {}
  - name: OnToggleAttendance
    signature: 'private fun onToggleAttendance(clientId: Long, type: AttendanceType)'
    state_mutations:
      - attendance[clientId]=type
      - uiState=Content
    side_effects: []
    error_handling: {}
  - name: OnSaveSheet
    signature: private fun onSaveSheet()
    state_mutations:
      - uiState=Content (batch enqueued; optimistic 'queued' chip)
    side_effects:
      - DraftDao.enqueue(SAVECOLLECTIONSHEET, entity=COLLECTIONSHEET, payload=<captured + attendance>, DURABLE idempotencyKey)
    error_handling:
      ValidationFailed: uiState=Content; surface the invalid rows inline (validation_failed); no enqueue
      CommandRejected: route the rejected rows to needs-attention-inbox; accepted rows stay posted
      Offline: stays queued in draft_outbox; auto-drains on connectivity regain (exactly-once, all-or-nothing)
  - name: OnRetry
    signature: private fun onRetry()
    state_mutations:
      - uiState=Loading
      - sheet=<re-generated route, captured amounts preserved> | uiState=Content | uiState=Error
    side_effects:
      - CollectionSheetStore.stream(office).refreshFresh()
    error_handling:
      NetworkError: uiState=Error; keep captured amounts in local state; offer Retry again
error_cases:
  - generate_failed
  - permission_denied
  - validation_failed
  - save_failed
  - command_rejected
  - sheet_queued_offline
