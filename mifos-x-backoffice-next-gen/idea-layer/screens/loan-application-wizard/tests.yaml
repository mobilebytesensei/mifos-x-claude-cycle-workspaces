schema_version: v1.0.0
feature: loan-application-wizard
# Re-verified 2026-07-31 (/idea-test-generate --regenerate) against the current ui.yaml + api.yaml —
# coverage: one scenario per ui.yaml state (loading/content/empty/error) + per on_click
# (field_change, preview_schedule, next_step, submit, retry) + the get_loan_template +
# calculate_loan_schedule + submit_loan_application operations, incl. template-driven validation +
# offline draft. Grounded in demo-data (client 10243, KES 50,000 Group Business Loan). 2026-07-30 = mtime re-stamp.
scenarios:
  - id: loading_shows_form_shimmer
    preconditions: ["the wizard is opened for a client", "the loan template has not resolved yet"]
    actions: ["tap Start application on the M04 screen"]
    assertions: ["the loading state shows a form shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_stepper_and_template_fields
    preconditions: ["the loan template resolves", "the user holds CREATE_LOAN"]
    actions: ["open the wizard"]
    assertions:
      - "a Product / Charges / Schedule / Review stepper is shown"
      - "fields, allowed products and min/max bounds come entirely from the Fineract template"
      - "Next is enabled only when the current step validates"
    priority: high
  - id: empty_when_client_ineligible
    preconditions: ["the client is ineligible for any product (no template products)"]
    actions: ["open the wizard"]
    assertions: ["a guidance panel is shown explaining no eligible product"]
    priority: low
  - id: error_when_template_or_step_fails
    preconditions: ["the template failed to load, or schedule-calc/submit failed hard"]
    actions: ["open the wizard / attempt the failing step"]
    assertions: ["the error state is shown", "Retry reloads the template or re-attempts the failed call"]
    priority: medium
  - id: preview_schedule_before_submit
    preconditions: ["product and terms are captured"]
    actions: ["tap Preview schedule"]
    assertions: ["POST /v1/loans?command=calculateLoanSchedule is issued", "the amortised installments, interest and fees render for review"]
    priority: high
  - id: submit_enqueues_and_lands_on_loan_detail
    preconditions: ["the Review step is reached", "the user holds CREATE_LOAN"]
    actions: ["tap Submit application"]
    assertions:
      - "the application is enqueued to the offline outbox with a durable idempotency key"
      - "the next sync replays POST /v1/loans"
      - "on success the wizard navigates to the newly created loan's detail (loan-detail)"
    priority: high
  - id: draftable_offline
    preconditions: ["the device is offline", "the template was cached"]
    actions: ["open the wizard offline", "capture fields"]
    assertions: ["the form renders from the cached template", "the application can be drafted and queued for replay"]
    priority: medium
