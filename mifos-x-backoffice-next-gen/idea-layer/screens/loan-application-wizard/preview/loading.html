<style>

  --tertiary: #5B5891; --tertiary-container: #E3DFFF; --on-tertiary-container: #17124B;
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #2E7D32; --on-success: #FFFFFF; --success-container: #C8E6C9; --on-success-container: #002106;
  --warning: #F57C00; --warning-container: #FFDDB8; --on-warning-container: #2A1700; --warning-strong: #B45309;

  --fs-title-small: 14px; --fs-body-large: 16px; --fs-body-medium: 14px; --fs-body-small: 12px;

  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;

  --el-3: 0 8px 24px rgba(0,0,0,.12); --el-4: 0 12px 32px rgba(0,0,0,.14); --el-5: 0 16px 48px rgba(0,0,0,.18);

}

  --success: #7FCF82; --on-success: #003910; --success-container: #1B5E20; --on-success-container: #C8E6C9;
  --warning: #FFB868; --warning-container: #6B3C00; --on-warning-container: #FFDDB8; --warning-strong: #E0912F;
  --info: #7FCFFF;
  --background: #1A1C1E; --on-background: #E2E2E6;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF;
  --surface-container-lowest: #0F1113; --surface-container-low: #1A1C1E; --surface-container: #1E2022;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh;
  background: var(--background); color: var(--on-surface);
  font-family: var(--font-body); font-size: var(--fs-body-medium); line-height: 1.45; -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1; display: inline-block; white-space: nowrap; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }

header[data-shell="top-app-bar"] { display: flex; align-items: center; gap: var(--sp-2); height: 56px;
  padding: 0 var(--sp-2); padding-top: env(safe-area-inset-top, 0px);
  background: var(--surface); border-bottom: var(--border-thin) solid var(--outline-variant);
  position: sticky; top: 0; z-index: 90; width: 100%; box-shadow: var(--el-1); }
.appbar-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; min-width: 44px;
  border: none; background: transparent; color: var(--on-surface-variant); cursor: pointer; border-radius: var(--r-full); }
.appbar-btn:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.appbar-title { flex: 1; min-width: 0; font-family: var(--font-display); font-size: var(--fs-title-large);
  font-weight: var(--fw-semibold); line-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-4) calc(var(--sp-8) * 2.6 + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 100%; }

.card { background: var(--surface-container-lowest); border: var(--border-thin) solid var(--outline-variant);
  border-radius: var(--r-lg); box-shadow: var(--el-1); }

/* Stepper */
.stepper { display: flex; align-items: flex-start; gap: var(--sp-1); padding: var(--sp-4) var(--sp-3); box-shadow: var(--el-2); }
.step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); position: relative; text-align: center; }
.step .knob { width: 28px; height: 28px; border-radius: var(--r-full); display: flex; align-items: center; justify-content: center;
  font-weight: var(--fw-bold); font-size: var(--fs-label-medium); background: var(--surface-container-high); color: var(--on-surface-variant);
  border: var(--border-medium) solid transparent; z-index: 1; }
.step:not(:last-child)::after { content: ""; position: absolute; top: 14px; left: 50%; width: 100%; height: 2px;
  background: var(--outline-variant); z-index: 0; }

.client-chip { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3);
  background: var(--surface-container-low); color: var(--on-surface-variant); border-radius: var(--r-md); box-shadow: var(--el-1); }

.section-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-3) var(--sp-4) var(--sp-2); }
.field { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border-top: var(--border-thin) solid var(--outline-variant); }
.field:first-of-type { border-top: none; }

.sched-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-4) var(--sp-4) var(--sp-2); }
.install { text-align: center; padding: var(--sp-2) var(--sp-4) var(--sp-4); display: flex; flex-direction: column; align-items: center; gap: var(--sp-2); }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-2);
  padding: 0 var(--sp-4) var(--sp-4); }

.draft-line { display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-1); }

.footer { position: sticky; bottom: 72px; z-index: 80; display: flex; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4); background: var(--surface); box-shadow: var(--el-3);
  border-top: var(--border-thin) solid var(--outline-variant); }

nav[data-shell="bottom-nav"] { display: flex; align-items: stretch; justify-content: space-around; height: 72px;
  padding: 0 var(--sp-1) env(safe-area-inset-bottom, 0px); background: var(--surface);
  border-top: var(--border-thin) solid var(--outline-variant); position: sticky; bottom: 0; z-index: 100; width: 100%; box-shadow: var(--el-2); }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1); flex: 1;
  text-decoration: none; color: var(--on-surface-variant); cursor: pointer; position: relative; border-radius: var(--r-sm); min-height: 48px; }
.nav-item .material-symbols-outlined { font-size: 24px; }
.nav-item .lbl { font-size: var(--fs-label-medium); font-weight: var(--fw-medium); }
.nav-item:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: -2px; }

/* --- Loading skeleton (mirrors content block-for-block) --- */
@keyframes sk-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.sk { background: linear-gradient(90deg, var(--surface-container) 25%, var(--surface-container-high) 37%, var(--surface-container) 63%);
  background-size: 200% 100%; animation: sk-shimmer 1.4s ease-in-out infinite; border-radius: var(--r-sm); display: block; }
:root[data-theme="dark"] .sk { background: linear-gradient(90deg, var(--surface-container-high) 25%, var(--surface-container-highest) 37%, var(--surface-container-high) 63%);
  background-size: 200% 100%; }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
.sk-circle { width: 28px; height: 28px; border-radius: var(--r-full); }
.sk-line { height: 12px; border-radius: var(--r-full); }
.sk-line.tall { height: 16px; }
.sk-line.sm { height: 10px; }
.w20 { width: 20%; } .w25 { width: 25%; } .w30 { width: 30%; } .w35 { width: 35%; } .w40 { width: 40%; }
.w45 { width: 45%; } .w50 { width: 50%; } .w55 { width: 55%; } .w60 { width: 60%; } .w70 { width: 70%; }
.sk-icon { width: 24px; height: 24px; border-radius: var(--r-sm); flex: 0 0 auto; }
.sk-pill { height: 30px; width: 88px; border-radius: var(--r-full); flex: 0 0 auto; }
.sk-edit { height: 24px; width: 56px; border-radius: var(--r-sm); flex: 0 0 auto; }
.sk-big { height: 40px; width: 60%; border-radius: var(--r-sm); }
.sk-tile { height: 62px; border-radius: var(--r-md); }
.sk-btn { height: 48px; flex: 1; border-radius: var(--r-full); }
.sk-col { display: flex; flex-direction: column; gap: var(--sp-1); flex: 1; min-width: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
</style>
</head>

  <nav data-shell="bottom-nav" role="navigation" aria-label="Main navigation">
