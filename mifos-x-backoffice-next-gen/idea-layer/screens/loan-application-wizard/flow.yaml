feature: loan-application-wizard

participates_in_flows:
  - loan-lifecycle

entry_points:
  - type: direct
    description: "Opened from the M04 loan-portfolio 'start application' action (start_loan_application) for a selected client."
  - type: direct
    description: "Opened from the M04 loan-portfolio 'disburse' action (disburse_loan) to complete/disburse a pending application."
  - type: direct
    description: "Opened from client-detail-360's Accounts tab 'apply for loan' affordance."

transitions:
  - from: loading
    to: content
    trigger: "the loan product template resolves (cache-first)"
  - from: loading
    to: empty
    trigger: "the client is ineligible for any product (no template products)"
  - from: loading
    to: error
    trigger: "the template failed to load and no cache is available"

  - from: content
    to: content
    trigger: "a field changes, a step advances/retreats, or the schedule preview is computed"
  - from: content
    to: error
    trigger: "schedule-calc or submit failed hard with no fallback"
  - from: content
    to: loan-detail
    trigger: "Submit succeeds — navigates to the newly created loan's detail"

  - from: error
    to: loading
    trigger: "'Retry' tapped — reloads the template / re-attempts the failed call"
