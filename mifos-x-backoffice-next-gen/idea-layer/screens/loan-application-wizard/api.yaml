feature: loan-application-wizard

# Template-driven loan application. The template + schedule-preview are reads; the final
# submit routes through the offline outbox (POST /v1/batches) so it replays exactly-once.

endpoints:
  - id: get_loan_template
    method: GET
    path: "/v1/loans/template"
    description: >-
      Fetch the loan application template for a client (allowed products, min/max principal, term bounds,
      interest defaults, charge and collateral options). Drives the entire wizard field set — no hardcoding.
    query_params:
      - { name: clientId, type: integer, required: false }
      - { name: groupId, type: integer, required: false }
      - { name: productId, type: integer, required: false }
      - { name: templateType, type: string, required: false }   # individual | jlg
    response:
      shape: object
      dto: LoanTemplateDto
      demo_source: LoanTemplateDto.items.byId
    requires_auth: true
    requires_permission: ["CREATE_LOAN"]
  - id: calculate_loan_schedule
    method: POST
    path: "/v1/loans"
    description: "Preview the amortised repayment schedule for the captured terms (?command=calculateLoanSchedule) before committing the application."
    query_params:
      - { name: command, type: string, required: true }   # calculateLoanSchedule
    response:
      shape: object
      dto: LoanScheduleDto
      demo_source: LoanScheduleDto.items.byId
    requires_auth: true
    requires_permission: ["CREATE_LOAN"]
    idempotency: none

  - id: submit_loan_application
    method: POST
    path: "/v1/loans"
    description: >-
      Submit the completed loan application. Enqueued to the offline outbox with a durable idempotency key and
      replayed via the transactional batch endpoint; on success the new loanId is returned for navigation.
    response:
      shape: object
      dto: CommandProcessingResultDto
      demo_source: CommandProcessingResultDto.scenarios.pending_approval
    requires_auth: true
    requires_permission: ["CREATE_LOAN"]
    idempotency: durable
