vm_actions:
  - name: OnLoadTemplate
    signature: 'private fun onLoadTemplate(clientId: String, productId: String?)'
    state_mutations:
      - uiState=Loading
      - template=<resolved LoanTemplate>
      - uiState=Content(template, form) | Empty | Error
    side_effects:
      - LoanTemplateStore.stream(clientId, productId, CACHE_FIRST_SWR)
      - PermissionEvaluator.evaluate(CREATE_LOAN)
    error_handling:
      NoEligibleProduct: uiState=Empty; show ineligible-guidance panel
      NetworkError: uiState=Content from cache if present else Error; offer Retry
  - name: OnFieldChange
    signature: 'private fun onFieldChange(fieldCode: String, value: FieldValue)'
    state_mutations:
      - form=<updated captured value>
      - canProceed=<template validation result (min/max principal, allowed term, required charges)>
    side_effects: []
    error_handling:
      ValidationFailed: mark the offending field; keep Next disabled until the step validates
  - name: OnNextStep
    signature: private fun onNextStep()
    state_mutations:
      - step=<Product → Charges → SchedulePreview → Review>
    side_effects: []
    error_handling:
      ValidationFailed: block advance; surface per-field template validation errors
  - name: OnPrevStep
    signature: private fun onPrevStep()
    state_mutations:
      - step=<retreat one wizard step>
    side_effects: []
    error_handling:
      AtFirstStep: >-
        no-op guard — the Back affordance is disabled on step 1 (Product) so there is nothing to retreat to;
        captured field state is preserved when stepping back, so retreating and re-advancing never loses input
  - name: OnPreviewSchedule
    signature: 'private fun onPreviewSchedule(input: LoanScheduleInput)'
    state_mutations:
      - schedulePreview=<amortised List<RepaymentPeriod> + totals>
      - uiState=Content
    side_effects:
      - LoanScheduleRepository.calculatePreview(input) POST /v1/loans?command=calculateLoanSchedule (debounced, no loan created)
    error_handling:
      ScheduleCalcFailed: keep last preview; degrade the preview step to a retry strip; draft terms stay editable
      NetworkError: preview unavailable offline; retry on reconnect (transient — nothing enqueued)
  - name: OnSubmit
    handles: submit_application
    signature: 'private fun onSubmit(payload: LoanApplicationPayload)'
    state_mutations:
      - uiState=Content (application submitting)
      - form=<drained to draft_outbox>
    side_effects:
      - DraftDao.enqueue(CREATE_LOAN, entity=LOAN, externalId=<client-generated>, payload, DURABLE idempotencyKey)
      - sendEvent(NavigateToLoanDetail(loanId)) on successful replay
    error_handling:
      SubmitFailed: route entry to needs-attention-inbox; keep the draft
      Offline: stays queued; replays exactly-once via POST /v1/batches on connectivity regain
      MakerChecker: queued application lands as PENDING_APPROVAL rather than posting immediately
  - name: OnRetry
    signature: private fun onRetry()
    state_mutations:
      - uiState=Loading
      - uiState=Content | Error
    side_effects:
      - LoanTemplateStore.stream(clientId, productId).refreshFresh() (or re-attempt the failed schedule-calc / submit)
    error_handling:
      NetworkError: uiState=Error; keep last inputs; offer Retry again
error_cases:
  - template_load_failed
  - client_ineligible
  - validation_failed
  - schedule_calc_failed
  - submit_failed
  - application_offline_queued
  - application_rejected
