plan_ref: idea-plan.yaml#features[loan-application-wizard]
summary: >-
  The multi-step new-loan / disbursement wizard drilled into from the M04 loan-portfolio "start application" and
  "disburse" actions. Step 1 loads the loan product template (GET /v1/loans/template?clientId&productId) and captures
  product, principal, term, interest and disbursement date; step 2 attaches charges/collateral; step 3 previews the
  amortised repayment schedule (POST /v1/loans?command=calculateLoanSchedule) so the officer sees installments before
  committing; step 4 reviews and submits (POST /v1/loans) through the offline outbox with a durable idempotency key.
  Field metadata (allowed products, min/max principal, charge options) comes entirely from the Fineract template so a
  back-office product change appears next sync with no release. On success the wizard lands on the newly created loan's
  detail (loan-detail).
metadata:
  category: back-office-domain
  implementation_ready: true
  impl_ready_at: '2026-07-31T00:00:00Z'
  impl_ready_schema: v2
contracts:
  - capability: loan_template_read
    platform_spec: >-
      GET /v1/loans/template?clientId&productId&templateType (individual|jlg) read cache-first through a Store5
      SourceOfTruth over Room (loan_template_cache) — the ENTIRE wizard field set, allowed-product list,
      min/max principal + term bounds, interest defaults, and charge/collateral option lists hydrate from the
      Fineract LoanTemplateDto and persist to loan_template_cache so an application can be drafted fully offline
      under CACHE_FIRST_SWR; the form is built by dynamic-template-forms (no hardcoded fields — a back-office
      product change appears next sync with no release). Zero products returned renders the ineligible-guidance
      empty state.
    permission: CREATE_LOAN
    error_cases:
      - template_load_failed
      - client_ineligible
  - capability: schedule_preview
    platform_spec: >-
      POST /v1/loans?command=calculateLoanSchedule — a LIVE, DEBOUNCED preview of the amortised repayment schedule
      computed from the captured principal/term/rate/disbursementDate + template defaults; returns LoanScheduleDto
      (per-installment principal/interest/fees + totals). NO loan is created and NOTHING is persisted or enqueued
      (idempotency:none) — a transient compute so the officer reviews installments before committing; requires
      connectivity, so a failed/offline calc degrades the preview step to a retry strip while the captured draft
      terms remain editable.
    permission: CREATE_LOAN
    error_cases:
      - schedule_calc_failed
      - validation_failed
  - capability: loan_application_submit
    platform_spec: >-
      POST /v1/loans — the completed application (dynamic-template-forms JsonObject payload + a client-generated
      externalId assigned before the server id) is written to the draft_outbox Room table with a DURABLE
      idempotency key (action=CREATE_LOAN, entity=LOAN) generated at submit and reused on retry so it replays
      EXACTLY ONCE across connectivity flap / crash / reinstall (zero double-post); the offline-sync-engine
      replays it via POST /v1/batches. Maker-checker aware (a queued application lands as PENDING_APPROVAL rather
      than posting immediately); a rejected replay routes to needs-attention-inbox, never silently dropped. On
      success the new loanId is returned and the wizard navigates to loan-detail.
    permission: CREATE_LOAN
    error_cases:
      - submit_failed
      - application_offline_queued
      - application_rejected
