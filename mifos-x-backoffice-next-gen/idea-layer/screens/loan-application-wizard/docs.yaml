feature: loan-application-wizard
status: designed
cluster: portfolio
module: m04-loan-portfolio
priority: must_have
new_infra: false
is_primary_flow: true
has_ui: true
has_api: true
has_server: false
archetype: form
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
