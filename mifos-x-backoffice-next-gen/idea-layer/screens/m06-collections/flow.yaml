feature: m06-collections
entry_points:
  - type: nav_root
    description: "Collections module root — gated on the collection-sheet permission group (renders in the drawer/rail when the user holds READ_COLLECTIONSHEET)"
  - type: from_dashboard
    description: "Opened from the m01-dashboard today's-route / collections-due tile (the daily-collections flow)"

transitions:
  - from: loading
    to: content
    trigger: "collection sheet generated with per-client dues (from cache or POST command=generate)"
  - from: loading
    to: empty
    trigger: "no dues outstanding for the selected center/group meeting"
  - from: loading
    to: no-network
    trigger: "offline with a cached sheet available — served from Room"
  - from: loading
    to: error
    trigger: "sheet generation failed and no cache exists"
  - from: content
    to: content
    trigger: "capture_member_collection — per-client amount recorded into the sheet draft (in-VM)"
  - from: content
    to: submitting
    trigger: "submit_collection_sheet — captured sheet assembled and dispatched as an atomic batch"
  - from: no-network
    to: submitting
    trigger: "submit_collection_sheet while offline — writing the sheet to the durable outbox"
  - from: submitting
    to: queued-offline
    trigger: "sheet enqueued to the outbox with a durable idempotency key (offline, or accepted-for-later)"
  - from: submitting
    to: content
    trigger: "online batch succeeded and the read cache was refreshed"
  - from: submitting
    to: error
    trigger: "the atomic batch was rejected outright (enclosingTransaction rollback)"
  - from: queued-offline
    to: needs-attention-inbox
    trigger: "open_needs_attention — a rejected row is triaged after replay"
  - from: queued-offline
    to: queued-offline
    trigger: "generate_receipts — PDF receipts rendered per captured client"
  - from: error
    to: loading
    trigger: "retry_generate — re-issue the sheet generation"
  - from: error
    to: permission-capability-engine
    trigger: "403 NoAuthorization — permission drift refresh instead of a crash"

cross_links:
  - to: m03-groups-centers
    kind: read_only
    reason: "Center/group context for the sheet (which groups + members belong to the meeting) — never mutates a group record"
  - to: m04-loan-portfolio
    kind: read_only
    reason: "Deep-link into a client's loan detail for repayment context (schedule, arrears) — never mutates a loan record"
  - to: needs-attention-inbox
    kind: navigate
    reason: "Failed-replay triage for rejected sheet rows"
  - to: dynamic-template-forms
    kind: navigate
    reason: "Meeting-context picker (center/group + staff + date option lists) for sheet generation"
