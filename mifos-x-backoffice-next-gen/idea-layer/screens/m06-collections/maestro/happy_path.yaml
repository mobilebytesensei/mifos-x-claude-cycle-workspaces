appId: org.mifos.backoffice
---
- launchApp
- assertVisible:
    id: "m06-collections_header"
- assertVisible:
    id: "m06-collections_content"
# capture the amount collected for a client row on the sheet
- tapOn:
    id: "m06-collections_capture_field"
- inputText: "1700"
# submit the whole captured sheet as one atomic batch through the offline outbox
- tapOn:
    id: "m06-collections_submit"
# the queued-offline confirmation surfaces the receipts + review-failed controls
- assertVisible:
    id: "m06-collections_receipts"
