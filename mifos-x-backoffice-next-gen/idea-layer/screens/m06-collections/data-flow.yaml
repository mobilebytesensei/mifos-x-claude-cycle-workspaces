sibling: data-flow
schema_version: v2.2.0
feature_id: m06-collections

# Reads: the collection sheet (center → groups → clients → per-client loan
# repayment + savings deposit dues) is generated through a Store5 SourceOfTruth
# over Room (CACHE_FIRST_SWR) so a 30-member sheet renders offline under 1s.
# Writes: the captured sheet is enqueued to the durable offline outbox
# (framework_submit_drafts) as ONE atomic batch and replayed exactly-once via
# POST /v1/batches (enclosingTransaction) — never posted straight to a domain
# table. The generate-context template is cached so the dynamic-template-forms
# meeting picker renders offline. PDF receipts are written to durable local
# storage after submit.

entries:
  # ── 1. Generate the collection sheet with per-client dues (on mount) ────
  - screen_id: m06-collections
    trigger: on_mount
    produces_state: content
    auth_required: true
    endpoints:
      - api_id: generate_collection_sheet
        transport: rest
      - api_id: generate_center_collection_sheet
        transport: rest
    tables:
      - name: collection_sheets
        mutation: upsert
        persistence_contract:
          is_durable: false
          storage_backend: local_db
        persistence_note: >-
          CACHE_FIRST_SWR read cache of the generated sheet (sheet_id,
          context_type center|group, center_id/group_id, staff_id,
          meeting_date, total_expected, and a rows_json blob holding each
          client's loan_due + savings_due + captured amounts). Regenerated by
          POST command=generate; not the local system-of-record (Fineract is
          SoT). A 30-member sheet renders under 1s from this cache.
    cache:
      strategy: cache_first
      ttl_seconds: 3600
      key_template: "fineract:collectionsheet:{contextType}:{contextId}:{meetingDate}"
      shape: object
    privacy_constraint:
      scope: user_synced
      notes: "Scoped to the signed-in officer's staffId/office; encrypted at rest (SQLCipher)."
    error_paths:
      - error_code: sheet_generate_failed
        behavior: retry
        message_key: m06_error_generate_failed
      - error_code: network.offline
        behavior: fallback_cache
        message_key: m06_showing_cached

  # ── 2. Generate-context template (rendered by dynamic-template-forms) ───
  - screen_id: m06-collections
    trigger: on_navigate
    produces_state: content
    auth_required: true
    endpoints:
      - api_id: collection_sheet_template
        transport: rest
    tables:
      - name: cached_templates
        mutation: upsert
        persistence_contract:
          is_durable: false
          storage_backend: local_db
        persistence_note: "GET /v1/collectionsheet/template payload cached (office, staff, meeting-date option lists) so the dynamic-template-forms meeting-context picker renders offline (CACHE_FIRST_SWR reference data)."
    error_paths:
      - error_code: template_fetch_failed
        behavior: retry
        message_key: m06_error_generate_failed

  # ── 3. Capture amounts — in-ViewModel sheet draft (no persistence) ──────
  - screen_id: m06-collections
    trigger: on_interact
    produces_state: content
    auth_required: true
    endpoints: []
    tables:
      - name: collection_sheets
        mutation: upsert
        persistence_contract:
          is_durable: false
          storage_backend: local_db
        persistence_note: "Per-client amounts collected are held in the in-ViewModel sheet draft and folded back into the cached sheet's rows_json (captured flags + amounts) until Submit; nothing is posted at capture time."

  # ── 4. Submit — captured sheet → durable offline outbox (atomic batch) ──
  - screen_id: m06-collections
    trigger: on_interact
    produces_state: submitting
    auth_required: true
    endpoints:
      - api_id: save_collection_sheet
        transport: rest
      - api_id: save_center_collection_sheet
        transport: rest
      - api_id: batch_submit
        transport: rest
    tables:
      - name: framework_submit_drafts
        mutation: write
        persistence_contract:
          is_durable: true
          storage_backend: local_db
        persistence_note: >-
          The whole captured sheet is enqueued as a DraftEntity row with a
          DURABLE idempotency_key + (action=saveCollectionSheet, entity) and a
          BatchSubmitMode.AllOrNothing payload (bulkRepaymentTransactions[] +
          bulkDisbursementTransactions[]); status PENDING → RETRYING →
          SUBMITTED | FAILED; drained exactly-once via POST /v1/batches
          enclosingTransaction by offline-sync-engine, so a crash-then-retry
          never double-posts the day's collections. A FAILED row surfaces in
          needs-attention-inbox with the server error (accepted rows stay
          posted under Independent partial-success handling for per-row
          rejects).
    privacy_constraint:
      scope: user_synced
      notes: "Sheet payloads scoped to the signed-in officer; encrypted at rest (SQLCipher)."
    side_effects:
      - kind: invalidate_cache
        target: "collection_sheets read cache for the submitted meeting — regenerated by the follow-on delta-pull"
      - kind: enqueue_job
        target: "OfflineSubmitSyncer drain on connectivity regain (BatchSubmitHandler.AllOrNothing == POST /batches enclosingTransaction)"
    error_paths:
      - error_code: command_rejected
        behavior: navigate
        nav_target: needs-attention-inbox
        message_key: m06_command_rejected
      - error_code: network.offline
        behavior: fallback_cache
        message_key: m06_will_sync_when_online
      - error_code: permission_drift_403
        behavior: navigate
        nav_target: permission-capability-engine
        message_key: m06_access_changed

  # ── 5. PDF receipts — written to durable local storage after submit ─────
  - screen_id: m06-collections
    trigger: on_interact
    produces_state: queued-offline
    auth_required: true
    endpoints: []
    tables:
      - name: generated_receipts
        mutation: write
        persistence_contract:
          is_durable: true
          storage_backend: file_system
        persistence_note: "One PDF transaction receipt per captured client (amount, meeting date, reference) rendered deterministically from the submitted sheet and written to durable local storage so receipts can be handed to members offline."

cache:
  strategy: cache_first_swr
  note: "The generated sheet is read-mostly working-set data — serve the last-generated sheet from Room instantly for offline capture, revalidate via the shared delta-pull FetchedAtEntity TTL."

demo_source: demo-data.yaml
