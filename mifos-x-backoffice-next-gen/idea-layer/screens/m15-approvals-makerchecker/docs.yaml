plan_ref: idea-plan.yaml#features[m15-approvals-makerchecker]
summary: >-
  M15 · Approvals (Maker-Checker) — the dedicated four-eye checker queue and the WRITE/action counterpart to
  needs-attention-inbox. A self-scoped inbox of queued Fineract commands awaiting a checker (GET /v1/makercheckers,
  optionally ?actionName=&entityName= from /searchtemplate), grouped by entity / action / maker, each entry showing the
  maker and the full command payload the checker inspects. The checker approves (POST
  /v1/makercheckers/{id}?command=approve), rejects (?command=reject), or deletes a stale pending command (DELETE
  /v1/makercheckers/{id}); a bulk-approve applies approve across a canCheck-gated multi-selection as an Independent
  /v1/batches. Every approve/reject/delete/bulk is enqueued through offline-sync-engine with a durable idempotency key
  and replayed EXACTLY-ONCE — a command can never be double-approved — and every control renders VISIBLE / DISABLED /
  HIDDEN purely from the permission-capability-engine resolution of canCheck(action,entity). No role branching; an admin
  sees every entry, a supervisor holding only CREATE_CLIENT_CHECKER sees only CREATE_CLIENT entries.
vm_actions:
  - OnSwitchGroupBy
  - OnApplySearchTemplateFilter
  - OnOpenCommandPayload
  - OnToggleEntrySelection
  - OnApproveEntry
  - OnRejectEntry
  - OnDeleteEntry
  - OnBulkApproveSelected
  - OnOpenNeedsAttention
  - OnRetryLoad
error_cases:
