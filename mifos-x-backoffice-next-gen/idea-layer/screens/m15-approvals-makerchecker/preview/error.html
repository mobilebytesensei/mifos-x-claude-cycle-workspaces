<style>
:root {
  --primary: #006CB5;
  --on-primary: #FFFFFF;
  --primary-container: #CBE6FF;
  --on-primary-container: #001D33;
  --surface: #FCFCFF;
  --on-surface: #1A1C1E;
  --surface-variant: #DEE3EB;
  --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9;
  --background: #FCFCFF;
  --outline: #72777F;
  --error: #BA1A1A;
  --on-error: #FFFFFF;
  --error-container: #FFDAD6;
  --on-error-container: #410002;

  --font-body: 'Roboto', system-ui, sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, monospace;
  --fs-h3: 1.375rem;
  --fs-body: 1rem;
  --fs-label: 0.875rem;
  --fs-caption: 0.75rem;
  --fw-medium: 500;
  --fw-semibold: 600;
  --lh-tight: 1.3;
  --ls-label: 0.1px;
  --ls-caption: 0.4px;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-xl: 28px;

  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-xxl: 48px;

  --border-w: 1px;

:root[data-theme="dark"] {
  --primary: #93CCFF;
  --on-primary: #003354;
  --primary-container: #004B78;
  --on-primary-container: #CBE6FF;
  --surface: #1A1C1E;
  --on-surface: #E2E2E6;
  --surface-variant: #42474E;
  --on-surface-variant: #C2C7CF;
  --surface-container-low: #1E2022;
  --background: #1A1C1E;
  --outline: #8C9199;
  --error: #FFB4AB;
  --on-error: #690005;
  --error-container: #93000A;
  --on-error-container: #FFDAD6;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100vh;
  background: var(--background); color: var(--on-surface);
  font-family: var(--font-body); font-size: var(--fs-body);
  -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; -webkit-font-feature-settings: 'liga';
}

/* Top app bar */
header[data-shell="top-app-bar"] {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
  background: var(--surface); color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
header[data-shell="top-app-bar"] .leading {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--r-xl);
  color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer;
}
header[data-shell="top-app-bar"] .app-title {
  font-size: var(--fs-h3); font-weight: var(--fw-semibold);
  line-height: var(--lh-tight); color: var(--on-surface); margin: 0;
}

main[data-shell="content"] {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: var(--sp-md); padding: var(--sp-xl) var(--sp-lg); overflow-y: auto;
}
.err-illus {
  width: 96px; height: 96px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--error-container); color: var(--on-error-container);
}
.err-illus .material-symbols-outlined { font-size: 48px; }
.err-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); color: var(--on-surface); margin: 0; line-height: var(--lh-tight); }
.err-msg { font-size: var(--fs-body); color: var(--on-surface-variant); margin: 0; max-width: 32ch; }
.err-code { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

.retry-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-xs);
  margin-top: var(--sp-sm); min-height: 40px; padding: var(--sp-xs) var(--sp-lg);
  border-radius: var(--r-xl); border: none; background: var(--primary); color: var(--on-primary);
  font-family: inherit; font-size: var(--fs-label); font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label); cursor: pointer;
}
.retry-btn .material-symbols-outlined { font-size: 18px; }

@media (prefers-reduced-motion: no-preference) {
  .retry-btn { transition: filter 120ms ease; }
  .retry-btn:active { filter: brightness(0.95); }
}
</style>

<div data-shell="root" data-screen-id="m15-approvals-makerchecker" data-state="error">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="Header" data-component-id="m15-approvals-makerchecker_header" data-from-ui-yaml-path="components[0]">
    <button class="leading" data-nav-type="back" aria-label="Back"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></button>
    <h1 class="app-title">Approvals</h1>
  </header>

  <main data-shell="content" data-state="error" role="alert">

    <span class="err-illus" aria-hidden="true"><span class="material-symbols-outlined">cloud_off</span></span>
    <h2 class="err-title">Couldn't load approvals</h2>
    <p class="err-msg">We couldn't reach the maker-checker queue and no cached copy is available on this device. Check your connection and try again.</p>
    <span class="err-code">GET /v1/makercheckers · 503 Service Unavailable</span>

    <!-- Retry (#retry_button) → retry_load; flow error→loading (a 403 routes into permission-drift refresh) -->
    <button class="retry-btn" data-component-type="Button" data-component-variant="text"
            data-component-id="m15-approvals-makerchecker_retry" data-from-ui-yaml-path="components[14]"
            data-state-to="loading" data-action="retry_load"
            aria-label="Retry loading approvals">
      <span class="material-symbols-outlined" aria-hidden="true">refresh</span>Retry
    </button>

  </main>

</div>
