schema_version: v1.0.0
feature: m15-approvals-makerchecker
# Regenerated 2026-07-31 (/idea-test-generate) against the enriched ui.yaml/api.yaml/data-flow/docs/demo-data —
# coverage: one scenario per ui.yaml state (loading/content/empty/submitting/error)
# + per api operation (list_makercheckers, makerchecker_search_template, approve_entry,
# reject_entry, delete_entry, bulk_approve_entries)
# + per on_click (switch_group_by, apply_search_template_filter, open_command_payload,
# toggle_entry_selection, approve_entry, reject_entry, delete_entry, bulk_approve_selected,
# open_needs_attention, retry_load)
# Demo data grounded in: audit_id 88201 (CREATE CLIENT faith.njeri), 88202 (APPROVE LOAN
# john.kamau), 88203 (DISBURSE LOAN john.kamau). 26 scenarios total.
scenarios:

  # ── state coverage ──

  - id: loading_shows_grouped_shimmer
    preconditions:
      - "the checker opens the approvals queue"
      - "GET /v1/makercheckers is in-flight and no cached result has resolved yet"
    actions:
      - "navigate to the maker-checker queue"
    assertions:
      - "the loading state is the initial_state (is_default: true)"
      - "a shimmer grouped-placeholder list is rendered (testTag: m15-approvals-makerchecker_content)"
      - "no error state or approve/reject controls are visible"
      - "the top app bar (testTag: m15-approvals-makerchecker_header) is visible"
    priority: medium

  - id: content_lists_queued_commands_grouped
    preconditions:
      - "GET /v1/makercheckers returns three entries: audit_id 88201 (CREATE CLIENT faith.njeri), 88202 (APPROVE LOAN john.kamau), 88203 (DISBURSE LOAN john.kamau)"
      - "the checker holds CHECKER_SUPER_USER so all three entries are canCheck-visible"
      - "the active grouping is entity"
    actions:
      - "open the maker-checker queue and wait for content state"
    assertions:
      - "two group headers appear: 'Clients' (1 entry — CREATE CLIENT) and 'Loans' (2 entries — APPROVE LOAN, DISBURSE LOAN)"
      - "each group header shows its count (testTag: m15-approvals-makerchecker_group_header)"
      - "the CREATE CLIENT row shows maker 'faith.njeri', made_on '2026-01-15 09:05', and a pending-approval badge"
      - "the APPROVE LOAN row shows maker 'john.kamau' and approvedLoanAmount 75000 in the payload"
      - "the DISBURSE LOAN row shows maker 'john.kamau', resource_ref 'loan/482920 (client Grace Muthoni)'"
      - "the group_by_selector segmented control is visible (testTag: m15-approvals-makerchecker_group_by)"
      - "the filter_bar chip row is visible (testTag: m15-approvals-makerchecker_filter)"
    priority: high

  - id: empty_state_when_no_pending
    preconditions:
      - "GET /v1/makercheckers returns an empty array (no queued commands in the checker's scope)"
    actions:
      - "open the maker-checker queue"
    assertions:
      - "the empty state is rendered with an 'all caught up' illustration and last-synced timestamp"
      - "no approve, reject, delete, or bulk-approve controls are present"
      - "the 'Open Needs Attention' cross-link (testTag: m15-approvals-makerchecker_open_needs_attention) is still visible"
      - "no FAB or create affordance is shown (fab_visible: false)"
    priority: medium

  - id: submitting_state_locks_row_on_action
    preconditions:
      - "audit_id 88202 (APPROVE LOAN john.kamau) is visible in the content list"
      - "the checker canCheck APPROVE_LOAN_CHECKER for that entry"
    actions:
      - "tap Approve on audit_id 88202 row"
    assertions:
      - "the screen transitions to submitting state"
      - "the 88202 row shows an inline progress/queued indicator (testTag: m15-approvals-makerchecker_item)"
      - "the 88202 row is locked: its approve_button and checkbox are non-interactive"
      - "the remaining entries (88201, 88203) remain interactive"
      - "the pending_badge (testTag: m15-approvals-makerchecker_pending_badge) updates for 88202"
    priority: high

  - id: error_state_on_fetch_failure_no_cache
    preconditions:
      - "GET /v1/makercheckers returns a 5xx error"
      - "no cached maker_checker_inbox rows exist in Room"
    actions:
      - "open the maker-checker queue"
    assertions:
      - "the whole-screen error state is shown with an error message"
      - "the Retry CTA is visible (testTag: m15-approvals-makerchecker_retry)"
      - "no approve/reject/delete controls are rendered"
      - "a snackbar may surface the error (snackbar_visible: true)"
    priority: medium

  # ── interaction ──

  - id: switch_group_by_rebuckets_without_refetch
    preconditions:
      - "the queue is in content state with entries 88201 (CREATE CLIENT), 88202 (APPROVE LOAN), 88203 (DISBURSE LOAN)"
      - "current groupBy is entity"
    actions:
      - "tap the group_by_selector segmented control (testTag: m15-approvals-makerchecker_group_by) and pick 'maker'"
    assertions:
      - "the entries re-bucket under maker headers: 'faith.njeri' (1 entry — 88201) and 'john.kamau' (2 entries — 88202, 88203)"
      - "no GET /v1/makercheckers network fetch is issued (pure in-ViewModel groupBy transform)"
      - "the groupBy state field changes to maker; the entries list is unchanged"
      - "tapping 'action' groups entries under 'CREATE' (1) and 'APPROVE'/'DISBURSE' (2) headers"
    priority: medium

  - id: filter_bar_narrows_queue_by_action_entity
    preconditions:
      - "the queue is in content state with three entries"
      - "GET /v1/makercheckers/searchtemplate has resolved with actionName options [CREATE, APPROVE, DISBURSE] and entityName options [CLIENT, LOAN]"
    actions:
      - "open the filter_bar (testTag: m15-approvals-makerchecker_filter)"
      - "pick actionName=DISBURSE and entityName=LOAN"
    assertions:
      - "the screen transitions to loading then back to content"
      - "GET /v1/makercheckers?actionName=DISBURSE&entityName=LOAN is issued"
      - "only audit_id 88203 (DISBURSE LOAN john.kamau) remains in the list"
      - "the Room maker_checker_inbox cache is refreshed and FetchedAt watermark updated"
    priority: medium

  - id: filter_bar_clear_chips_refetches_full_queue
    preconditions:
      - "an actionName=DISBURSE&entityName=LOAN filter is active showing only audit_id 88203"
    actions:
      - "clear all filter chips in the filter_bar"
    assertions:
      - "GET /v1/makercheckers (no query params) is re-issued"
      - "all three entries (88201, 88202, 88203) are restored in the list"
      - "the Room cache is refreshed to the full self-scoped queue"
    priority: medium

  - id: open_command_payload_shows_full_details
    preconditions:
      - "audit_id 88201 (CREATE CLIENT faith.njeri, external id KE-CLT-2024-10243) is visible in the content list"
    actions:
      - "tap the audit_id 88201 command row (testTag: m15-approvals-makerchecker_item)"
    assertions:
      - "the payload inspect panel opens (action: open_command_payload navigates within master-detail)"
      - "the panel shows maker 'faith.njeri', action 'CREATE', entity 'CLIENT', made_on '2026-01-15 09:05'"
      - "the command JSON body is rendered: firstname=Amara, lastname=Wanjiru, officeId=12, externalId=KE-CLT-2024-10243, dateOfBirth=1994-03-22"
      - "the Approve and Reject buttons are visible inside the panel (checker holds CREATE_CLIENT_CHECKER)"
      - "the Delete button is shown for this stale-or-obsolete-check path"
    priority: high

  - id: toggle_entry_selection_adds_to_bulk_set
    preconditions:
      - "the queue is in content state with at least audit_id 88202 and 88203 visible"
      - "the checker holds APPROVE_LOAN_CHECKER and DISBURSE_LOAN_CHECKER so both entries are canCheck-gated"
    actions:
      - "tap the checkbox (testTag: m15-approvals-makerchecker_select) on audit_id 88202"
      - "tap the checkbox on audit_id 88203"
    assertions:
      - "both audit_ids 88202 and 88203 are added to the selectedIds set"
      - "the bulk-approve bar becomes visible with Bulk approve button (testTag: m15-approvals-makerchecker_bulk_approve)"
      - "the state remains content (no fetch)"
      - "a third tap on 88202 removes it from selectedIds and hides the bar if selectedIds becomes empty"
      - "the checkbox for audit_id 88201 is absent if the checker does NOT hold CREATE_CLIENT_CHECKER"
    priority: high

  - id: approve_entry_enqueues_exactly_once
    preconditions:
      - "audit_id 88202 (APPROVE LOAN john.kamau, approvedLoanAmount 75000) is visible and the checker canCheck APPROVE_LOAN_CHECKER"
    actions:
      - "tap Approve (testTag: m15-approvals-makerchecker_approve) on audit_id 88202"
    assertions:
      - "an approve command is enqueued to draft_outbox with a durable idempotency_key for audit_id 88202"
      - "the offline outbox replays POST /v1/makercheckers/88202?command=approve exactly-once via POST /v1/batches"
      - "audit_id 88202 is locked (removed from selectedIds, approve_button disabled) while status IN (pending, retrying)"
      - "on successful replay the entry leaves the queue and loan/482915 approval executes"
      - "the Approve button on 88202 cannot be tapped a second time while the command is in flight"
    priority: high

  - id: reject_entry_discards_command_notifies_maker
    preconditions:
      - "audit_id 88201 (CREATE CLIENT faith.njeri) is open in the payload panel"
      - "the checker canCheck CREATE_CLIENT_CHECKER"
    actions:
      - "tap Reject (testTag: m15-approvals-makerchecker_reject) in the payload panel"
    assertions:
      - "a reject command is enqueued to draft_outbox with a durable idempotency_key for audit_id 88201"
      - "POST /v1/makercheckers/88201?command=reject replays exactly-once via POST /v1/batches"
      - "faith.njeri (the maker) is notified that the CREATE CLIENT command was rejected"
      - "the underlying CREATE CLIENT command is discarded and never executed"
      - "audit_id 88201 leaves the queue on successful replay"
    priority: high

  - id: delete_entry_requires_confirm_then_purges
    preconditions:
      - "audit_id 88203 (DISBURSE LOAN john.kamau, transactionAmount 120000) is open in the payload panel"
      - "the checker decides this disbursement is stale or obsolete"
    actions:
      - "tap Delete (testTag: m15-approvals-makerchecker_delete)"
      - "confirm the explicit confirm dialog"
    assertions:
      - "a DELETE /v1/makercheckers/88203 command is enqueued to draft_outbox ONLY after the confirm (not before)"
      - "the command replays exactly-once via POST /v1/batches"
      - "audit_id 88203 is purged — neither approved nor executed; it is never silently dropped"
      - "if the confirm dialog is dismissed without confirmation, no outbox entry is created"
    priority: high

  - id: bulk_approve_selected_independent_batch
    preconditions:
      - "audit_id 88202 (APPROVE LOAN) and 88203 (DISBURSE LOAN) are checked in selectedIds"
      - "the checker holds APPROVE_LOAN_CHECKER and DISBURSE_LOAN_CHECKER"
    actions:
      - "tap Bulk approve (testTag: m15-approvals-makerchecker_bulk_approve)"
    assertions:
      - "one approve command is enqueued per selected entry: approve for 88202 and approve for 88203, each with a distinct durable idempotency_key"
      - "POST /v1/batches is called with enclosingTransaction=false (Independent — one BatchRequest per entry)"
      - "if 88202 replay fails, 88203 is still approved independently (no abort)"
      - "both 88202 and 88203 are locked while in flight so neither can be double-approved"
      - "selectedIds is cleared after dispatch"
    priority: high

  - id: open_needs_attention_navigates_without_mutation
    preconditions:
      - "the queue is in content, empty, or submitting state"
    actions:
      - "tap 'Open Needs Attention' (testTag: m15-approvals-makerchecker_open_needs_attention)"
    assertions:
      - "navigation goes to needs-attention-inbox (target: needs-attention-inbox)"
      - "no state in needs-attention-inbox is mutated by the navigation"
      - "M15 does not write any data to the inbox on this action (pure read-only cross-link)"
    priority: low

  - id: retry_load_transitions_back_to_loading
    preconditions:
      - "the queue is in error state (GET /v1/makercheckers failed, no cache)"
    actions:
      - "tap Retry (testTag: m15-approvals-makerchecker_retry)"
    assertions:
      - "the screen transitions to loading state"
      - "GET /v1/makercheckers is re-issued through the Store5 SourceOfTruth"
      - "on success the queue transitions to content with the fresh entries"
      - "the FetchedAt watermark and Room maker_checker_inbox cache are updated on success"
      - "a 403 on the retry routes to the permission-drift refresh rather than looping back to error"
    priority: medium

  # ── endpoint / behavior ──

  - id: list_makercheckers_self_scoped_permission_filtered
    preconditions:
      - "the checker holds only CREATE_CLIENT_CHECKER (not APPROVE_LOAN_CHECKER or DISBURSE_LOAN_CHECKER)"
      - "GET /v1/makercheckers returns all three entries server-side"
    actions:
      - "open the maker-checker queue"
    assertions:
      - "only audit_id 88201 (CREATE CLIENT faith.njeri) is shown — the only entry the checker canCheck"
      - "audit_id 88202 (APPROVE LOAN) and 88203 (DISBURSE LOAN) are absent from the list"
      - "the Room maker_checker_inbox cache stores only the canCheck-filtered rows for this checker"
      - "the list is served CACHE_FIRST_SWR: a cached 88201 row renders instantly; background revalidation refreshes"
    priority: high

  - id: makerchecker_search_template_populates_filter_chips
    preconditions:
      - "the queue is in content state"
    actions:
      - "open the filter_bar to view the filter options"
    assertions:
      - "GET /v1/makercheckers/searchtemplate is called (or served from Room maker_checker_search_template_cache if fresh)"
      - "the actionName filter chip options include CREATE, APPROVE, DISBURSE"
      - "the entityName filter chip options include CLIENT, LOAN"
      - "the filter chips are rendered from the searchtemplate response, not hardcoded"
    priority: medium

  - id: search_template_miss_degrades_gracefully
    preconditions:
      - "GET /v1/makercheckers/searchtemplate returns a 5xx error"
      - "no maker_checker_search_template_cache rows exist in Room"
    actions:
      - "open the filter_bar"
    assertions:
      - "the screen does NOT show the whole-screen error state (error_state in data-flow is 'content', not 'error')"
      - "the queue remains in content state showing all three entries unfiltered"
      - "the filter_bar may show no filter chips or a degraded state"
      - "a snackbar or inline notice may surface 'Filter options unavailable' (no hard block)"
    priority: medium

  - id: list_makercheckers_preflight_badges_via_makercheckerable
    preconditions:
      - "the shell nav renders a pre-flight badge count above M15 in the drawer/rail"
    actions:
      - "the system issues GET /v1/makercheckers?makerCheckerable=true"
    assertions:
      - "the response drives the badge count shown on the M15 nav entry"
      - "the badge count reflects the number of checker-scoped entries awaiting review"
      - "when the queue empties the badge is removed"
    priority: medium

  - id: approve_entry_prevents_double_approve_via_idempotency_lock
    preconditions:
      - "audit_id 88202 approve command is already in draft_outbox with status=pending"
    actions:
      - "attempt to tap Approve on audit_id 88202 again while it is in flight"
    assertions:
      - "the approve_button for audit_id 88202 is disabled while outbox status IN (pending, retrying)"
      - "no second approve command is enqueued for audit_id 88202"
      - "the entry's durable idempotency_key guarantees the server processes the command exactly-once even if the outbox replays the same request multiple times"
    priority: high

  - id: bulk_approve_per_entry_failure_surfaces_individually
    preconditions:
      - "audit_id 88202 and 88203 bulk-approve are in flight via POST /v1/batches"
      - "the server returns a successful BatchResponse for 88203 and a failure for 88202"
    actions:
      - "the offline-sync-engine processes the batch response"
    assertions:
      - "audit_id 88203 (DISBURSE LOAN) is approved and leaves the queue"
      - "audit_id 88202 (APPROVE LOAN) failure surfaces in needs-attention-inbox individually"
      - "the failure for 88202 does NOT block or roll back 88203 (enclosingTransaction=false)"
      - "M15 does not silently swallow the per-entry failure"
    priority: high

  - id: replay_blocked_on_permission_revoked
    preconditions:
      - "audit_id 88201 approve command is queued in draft_outbox with status=pending"
      - "the checker's CREATE_CLIENT_CHECKER permission is revoked between enqueue and replay"
    actions:
      - "the offline-sync-engine replays the approve for audit_id 88201"
    assertions:
      - "the domain layer re-checks canCheck(CREATE, CLIENT) on replay and finds it revoked"
      - "the command surfaces as BLOCKED_PERMISSION_REVOKED in needs-attention-inbox"
      - "the approve is never silently dropped or auto-approved with the revoked permission"
      - "the checker is not auto-crashed; the entry routes to needs-attention-inbox for human resolution"
    priority: high

  - id: rejected_replay_surfaces_in_needs_attention_inbox
    preconditions:
      - "an approve command for audit_id 88202 was enqueued and the POST /v1/batches replay returns a server-level rejection"
    actions:
      - "the offline-sync-engine processes the failed replay"
    assertions:
      - "the failed approve command surfaces in needs-attention-inbox (not silently swallowed by M15)"
      - "the needs-attention-inbox entry carries enough context (audit_id 88202, APPROVE LOAN, john.kamau) to act on"
      - "M15 does not auto-retry blind; the failure is surfaced for the checker to decide next steps"
    priority: medium

  # ── docs acceptance refs ──

  - id: checker_sees_only_cancheck_entries_grouped_inspect_approve
    preconditions:
      - "docs acceptance ref 1: Self-scoped checker queue, grouped by entity/action/maker; inspect payload; approve/reject/delete + bulk-approve"
      - "the checker holds APPROVE_LOAN_CHECKER + DISBURSE_LOAN_CHECKER only"
    actions:
      - "open the maker-checker queue"
      - "group by action"
      - "tap audit_id 88202 to inspect payload"
      - "approve audit_id 88202; bulk-approve audit_id 88203 via checkbox + bulk-approve button"
    assertions:
      - "only LOAN entries (88202, 88203) are visible; CREATE CLIENT entry (88201) is absent"
      - "entries are grouped under 'APPROVE' and 'DISBURSE' action headers"
      - "the payload panel for 88202 shows loanId=482915, approvedLoanAmount=75000"
      - "approve and bulk-approve both enqueue via draft_outbox and replay exactly-once"
    priority: high

  - id: all_mutations_offline_exactly_once_never_double_approved
    preconditions:
      - "docs acceptance ref 2: Every approve/reject/delete routes through offline-sync-engine (durable idempotency, exactly-once — never double-approved) and is gated by canCheck"
      - "the device goes offline after the approve for 88202 is enqueued"
    actions:
      - "tap Approve for 88202 while online"
      - "device goes offline"
      - "device comes back online"
    assertions:
      - "the approve command is durably stored in draft_outbox with idempotency_key"
      - "on reconnect the offline-sync-engine replays POST /v1/makercheckers/88202?command=approve exactly-once"
      - "the server rejects duplicate replays via the idempotency_key (no double-approve)"
      - "the canCheck gate is re-verified on replay before the command is dispatched"
    priority: high

  - id: preflight_badges_and_searchtemplate_filters_from_docs
    preconditions:
      - "docs acceptance ref 3: Pre-flight approval badges via ?makerCheckerable=true; action/entity filters from GET /v1/makercheckers/searchtemplate"
    actions:
      - "the shell nav loads with the checker's session"
      - "the filter_bar is opened from the content queue"
    assertions:
      - "GET /v1/makercheckers?makerCheckerable=true drives the pre-flight badge on the M15 nav entry"
      - "GET /v1/makercheckers/searchtemplate populates the actionName and entityName filter chip options"
      - "selecting actionName=CREATE from the chips re-issues GET /v1/makercheckers?actionName=CREATE showing only 88201"
      - "clearing chips re-fetches the full self-scoped queue (all three entries)"
    priority: medium
