feature: m15-approvals-makerchecker

entry_points:
  - type: nav_root
    description: >-
      Approvals module root — surfaced in the drawer/rail only when the checker holds >=1 *_CHECKER
      or CHECKER_SUPER_USER (hasAnyChecker); a checker with no checker codes never sees the entry.
  - type: from_dashboard
    description: "Opened from the M01 dashboard 'Approvals Waiting' tile."
  - type: from_needs_attention
    description: "An approval row tapped in needs-attention-inbox drills into this deep approval queue."

transitions:
  # ── load / fetch ──
  - from: loading
    to: content
    trigger: "GET /v1/makercheckers returns >=1 queued command the checker canCheck"
  - from: loading
    to: empty
    trigger: "no pending approvals in the checker's scope"
  - from: loading
    to: error
    trigger: "queue fetch failed and no cache exists (4xx/5xx or hard init failure)"

  # ── in-content grouping + filtering ──
  - from: content
    to: content
    trigger: "group-by switched (entity/action/maker) — pure in-VM re-bucketing, no refetch"
  - from: content
    to: loading
    trigger: "action/entity filter applied — re-issues GET /v1/makercheckers?actionName=&entityName="

  # ── inspect a payload ──
  - from: content
    to: content
    trigger: "a command row tapped — opens the payload inspect panel in the same surface"

  # ── read-only cross-link ──
  - from: content
    to: needs-attention-inbox
    trigger: "'Open Needs Attention' tapped (read-only cross-link into the unified inbox)"

  # ── command mutations (approve / reject / delete / bulk-approve) ──
  - from: content
    to: submitting
    trigger: "Approve / Reject / Delete (after confirm) / Bulk-approve chosen on selected entries"
  - from: submitting
    to: content
    trigger: "command enqueued to the outbox — the entry is locked, then leaves the queue on replay success"
  - from: submitting
    to: error
    trigger: "the command could not be enqueued at all (hard local failure, not a server rejection)"

  # ── error recovery ──
  - from: error
    to: loading
    trigger: "'Retry' tapped — re-issues the self-scoped GET /v1/makercheckers (or routes to permission-drift refresh on 403)"
