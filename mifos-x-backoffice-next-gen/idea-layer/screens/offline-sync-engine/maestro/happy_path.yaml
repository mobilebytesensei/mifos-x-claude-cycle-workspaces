appId: org.mifos.backoffice
---
# Sync console happy path — open, observe pending outbox, drain via Sync now, land back idle.
- launchApp
- assertVisible:
    id: "offline-sync-engine_header"
- assertVisible:
    id: "offline-sync-engine_status_banner"
- assertVisible:
    id: "offline-sync-engine_content"
- tapOn:
    id: "offline-sync-engine_sync_now"
- assertVisible:
    id: "offline-sync-engine_status_banner"
