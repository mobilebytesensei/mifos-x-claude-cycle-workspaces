<style>
:root {
  --primary: #006CB5;
  --on-primary: #FFFFFF;
  --primary-container: #CBE6FF;
  --on-primary-container: #001D33;
  --secondary: #00796B;
  --on-secondary: #FFFFFF;
  --secondary-container: #B8F2E6;
  --on-secondary-container: #00201A;
  --tertiary: #5B5891;
  --on-tertiary: #FFFFFF;
  --tertiary-container: #E3DFFF;
  --on-tertiary-container: #17124B;
  --surface: #FCFCFF;
  --on-surface: #1A1C1E;
  --surface-variant: #DEE3EB;
  --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9;
  --background: #FCFCFF;
  --on-background: #1A1C1E;
  --outline: #72777F;
  --success: #2E7D32;
  --warning: #F57C00;
  --warning-strong: #B45309;
  --error: #BA1A1A;
  --on-error: #FFFFFF;
  --error-container: #FFDAD6;
  --on-error-container: #410002;

  --font-body: 'Roboto', system-ui, sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, monospace;
  --fs-h1: 2rem;
  --fs-h2: 1.75rem;
  --fs-h3: 1.375rem;
  --fs-body: 1rem;
  --fs-label: 0.875rem;
  --fs-caption: 0.75rem;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --lh-body: 1.5;
  --lh-tight: 1.3;
  --ls-label: 0.1px;
  --ls-caption: 0.4px;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-xl: 28px;

  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-xxl: 48px;

  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF;
  --on-primary: #003354;
  --primary-container: #004B78;
  --on-primary-container: #CBE6FF;
  --secondary: #9CD6C9;
  --on-secondary: #003730;
  --secondary-container: #005046;
  --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0F5;
  --on-tertiary: #2C2960;
  --tertiary-container: #434078;
  --on-tertiary-container: #E3DFFF;
  --surface: #1A1C1E;
  --on-surface: #E2E2E6;
  --surface-variant: #42474E;
  --on-surface-variant: #C2C7CF;
  --surface-container-low: #1E2022;
  --background: #1A1C1E;
  --on-background: #E2E2E6;
  --outline: #8C9199;
  --success: #7FD589;
  --warning: #FFB77C;
  --warning-strong: #F0A868;
  --error: #FFB4AB;
  --on-error: #690005;
  --error-container: #93000A;
  --on-error-container: #FFDAD6;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--background);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  font-size: 24px;
  line-height: 1;
  display: inline-block;
  vertical-align: middle;
  -webkit-font-feature-settings: 'liga';
}

/* ── Top app bar ──────────────────────────────────────────────── */
header[data-shell="top-app-bar"] {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-md);
  padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px));
  background: var(--surface);
  color: var(--on-surface);
  border-bottom: var(--border-w) solid var(--surface-variant);
}
header[data-shell="top-app-bar"] .leading {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-xl);
  color: var(--on-surface-variant);
  background: transparent;
  border: none;
  cursor: default;
}
header[data-shell="top-app-bar"] .app-title {
  font-size: var(--fs-h3);
  font-weight: var(--fw-semibold);
  line-height: var(--lh-tight);
  color: var(--on-surface);
  margin: 0;
}

/* ── Content ──────────────────────────────────────────────────── */
main[data-shell="content"] {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: var(--sp-md);
  padding: var(--sp-md);
  overflow-y: auto;
}

/* Status banner (freshness chip) */
.status-banner {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  background: var(--surface-container-low);
  border: var(--border-w) solid var(--surface-variant);
  border-radius: var(--r-lg);
  padding: var(--sp-md);
}
.status-icon {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  border-radius: var(--r-xl);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.status-meta { flex: 1; min-width: 0; }
.status-title {
  font-size: var(--fs-body);
  font-weight: var(--fw-medium);
  color: var(--on-surface);
}
.status-sub {
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  margin-top: 2px;
}
.status-sub .material-symbols-outlined { font-size: 14px; }
.freshness-chip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
  padding: 2px var(--sp-sm);
  border-radius: var(--r-sm);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-caption);
  text-transform: uppercase;
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.freshness-chip .material-symbols-outlined { font-size: 14px; }

/* Section label */
.section-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-sm);
  margin: var(--sp-xs) 0 calc(-1 * var(--sp-sm) + var(--sp-xs));
}
.section-label h2 {
  font-size: var(--fs-label);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-label);
  text-transform: uppercase;
  color: var(--on-surface-variant);
  margin: 0;
}
.section-label .count {
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
}

/* Outbox list */
.outbox-list {
  list-style: none;
  margin: 0;
  padding: 0;
  border: var(--border-w) solid var(--outline);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
}
.outbox-row {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-md);
  width: 100%;
  text-align: left;
  min-height: 44px;
  padding: var(--sp-md);
  border-bottom: var(--border-w) solid var(--surface-variant);
  color: var(--on-surface);
  background: var(--surface);
  border-left: none;
  border-right: none;
  border-top: none;
  font-family: inherit;
  cursor: pointer;
}
.outbox-row:last-child { border-bottom: none; }
.outbox-row.is-failed { background: var(--error-container); }
.row-icon {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  border-radius: var(--r-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-variant);
  color: var(--on-surface-variant);
}
.outbox-row.is-failed .row-icon {
  background: var(--surface);
  color: var(--error);
}
.row-meta { flex: 1; min-width: 0; }
.row-head {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
}
.row-action {
  font-size: var(--fs-label);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--ls-label);
  color: var(--on-surface);
}
.row-entity {
  font-size: var(--fs-body);
  font-weight: var(--fw-medium);
  color: var(--on-surface);
  margin-top: 2px;
}
.row-amount {
  font-family: var(--font-mono);
  font-size: var(--fs-label);
  color: var(--on-surface);
}
.row-summary {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  margin-top: 2px;
}
.row-idem {
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
  font-family: var(--font-mono);
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  margin-top: var(--sp-xs);
}
.row-idem .material-symbols-outlined { font-size: 14px; }
.row-idem code {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-error {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-xs);
  font-size: var(--fs-caption);
  color: var(--on-error-container);
  margin-top: var(--sp-xs);
  padding-top: var(--sp-xs);
  border-top: var(--border-w) solid var(--outline);
}
.row-error .material-symbols-outlined { font-size: 14px; flex: 0 0 auto; margin-top: 1px; }
.row-side {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--sp-xs);
}
.row-age {
  font-size: var(--fs-caption);
  color: var(--on-surface-variant);
  white-space: nowrap;
}
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
  padding: 2px var(--sp-sm);
  border-radius: var(--r-sm);
  font-size: var(--fs-caption);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-caption);
  text-transform: uppercase;
  white-space: nowrap;
}
.status-chip .material-symbols-outlined { font-size: 14px; }
.chip-pending {
  background: var(--surface-variant);
  color: var(--on-surface-variant);
}
.chip-retrying {
  background: var(--secondary-container);
  color: var(--on-secondary-container);
}
.chip-submitted {
  background: var(--secondary-container);
  color: var(--on-secondary-container);
}
.chip-failed {
  background: var(--surface);
  color: var(--error);
  border: var(--border-w) solid var(--error);
}

/* Actions */
.actions {
  display: flex;
  flex-direction: column;
  gap: var(--sp-sm);
  margin-top: var(--sp-xs);
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-sm);
  min-height: 44px;
  padding: var(--sp-md);
  border-radius: var(--r-xl);
  border: none;
  background: var(--primary);
  color: var(--on-primary);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  cursor: pointer;
}
.btn-primary .material-symbols-outlined { font-size: 18px; }
.btn-primary[disabled] {
  background: var(--surface-variant);
  color: var(--on-surface-variant);
  cursor: not-allowed;
}
.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-sm);
  min-height: 44px;
  padding: var(--sp-md);
  border-radius: var(--r-xl);
  border: var(--border-w) solid var(--outline);
  background: var(--surface);
  color: var(--primary);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  cursor: pointer;
}
.btn-secondary .material-symbols-outlined { font-size: 18px; }
.link-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-xs);
  min-height: 44px;
  padding: var(--sp-sm);
  border-radius: var(--r-xl);
  background: transparent;
  border: none;
  color: var(--primary);
  font-family: inherit;
  font-size: var(--fs-label);
  font-weight: var(--fw-medium);
  letter-spacing: var(--ls-label);
  text-decoration: none;
  cursor: pointer;
}
.link-action .material-symbols-outlined { font-size: 18px; }

/* ── Bottom nav ───────────────────────────────────────────────── */
nav[data-shell="bottom-nav"] {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  display: flex;
  background: var(--surface);
  border-top: var(--border-w) solid var(--surface-variant);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
nav[data-shell="bottom-nav"] a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--sp-sm) var(--sp-xs);
  min-height: 44px;
  color: var(--on-surface-variant);
  text-decoration: none;
  font-size: var(--fs-caption);
  letter-spacing: var(--ls-caption);
  cursor: pointer;
}
nav[data-shell="bottom-nav"] a .nav-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 56px;
  height: 28px;
  border-radius: var(--r-lg);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] {
  color: var(--on-primary-container);
}
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill {
  background: var(--primary-container);
}

@media (prefers-reduced-motion: no-preference) {
  .outbox-row, .btn-primary, .btn-secondary { transition: filter 120ms ease; }
  .outbox-row:active, .btn-primary:active, .btn-secondary:active { filter: brightness(0.97); }
}
</style>
