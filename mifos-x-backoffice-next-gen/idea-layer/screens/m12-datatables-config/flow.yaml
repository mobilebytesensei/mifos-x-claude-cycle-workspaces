feature: m12-datatables-config

entry_points:
  - type: nav_root
    description: "Data Tables & Configuration module root — a nav entry gated on the Fineract 'datatable' + 'configuration' permission groups; visible only if the user holds ≥1 READ_{ENTITY} of {DATATABLE, CONFIGURATION, ENTITY_DATATABLE_CHECK, EXTERNALSERVICES, FIELDCONFIGURATION}"
  - type: cross_feature
    description: "Reached from admin-setup journeys and coupled to dynamic-template-forms — the datatable schemas this module registers are the custom-field definitions that engine renders; a maker-checker global-config change here re-resolves the permission-capability-engine capability map"

transitions:
  # ── Load ──
  - from: loading
    to: content
    trigger: "configuration families loaded (datatables/global-config/entity-checks/external-services/field-config) — CACHE_FIRST_SWR"
  - from: loading
    to: empty
    trigger: "the initially-selected configuration tab has zero rows (e.g. no custom datatables registered yet)"
  - from: loading
    to: error
    trigger: "configuration fetch failed AND no cache present"

  # ── Detail drill-through (stay within the module's master/detail) ──
  - from: content
    to: content
    trigger: "open datatable / global-config / external-service detail (navigate within m12-datatables-config)"

  # ── Register / edit / toggle (ONLINE-ONLY configuration mutations) ──
  - from: content
    to: submitting
    trigger: "register/deregister a datatable, add/drop a column, toggle a global config, add/remove an entity-datatable check, or edit an external-service connector (queued through the outbox)"
  - from: empty
    to: submitting
    trigger: "register the first datatable / create the first entity-check via its 'Register …' / 'New …' CTA"
  - from: content
    to: content
    trigger: "configuration change SUBMITTED — the new/updated row appears after the follow-on refresh; a datatable register makes its custom fields appear in dynamic-template-forms next sync"
  - from: submitting
    to: content
    trigger: "command accepted (or PENDING_APPROVAL under maker-checker) — return to the tab with a 'Saved' / 'Submitted for approval' chip"

  # ── Permission-driven disable (capability meaningful to see) ──
  - from: content
    to: action-disabled
    trigger: "user lacks a specific mutation permission (REGISTER_DATATABLE / UPDATE_CONFIGURATION / …) — the control is disabled with a reason chip, not hidden"
  - from: action-disabled
    to: content
    trigger: "user switches to a tab / row whose mutation they DO hold, or a permission refresh grants it"

  # ── Errors + recovery ──
  - from: submitting
    to: error
    trigger: "register/edit/toggle rejected by Fineract (validation / duplicate table name / column-in-use / 403 drift) — routed to needs-attention-inbox"
  - from: content
    to: error
    trigger: "background refresh failed"
  - from: error
    to: loading
    trigger: "Retry — Store5 stream.refreshFresh()"
  - from: error
    to: content
    trigger: "403 drift — permission refresh completes, UI re-resolves and prunes now-hidden controls"
