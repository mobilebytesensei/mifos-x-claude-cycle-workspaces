appId: org.mifos.backoffice
---
# M12 · Data Tables & Configuration happy path — open the module, confirm the
# configuration surface renders, drill into a custom datatable schema. Gated at
# the module root on the datatable + configuration permission groups; reads are
# CACHE_FIRST_SWR (the datatable schemas work offline for dynamic-template-forms).
- launchApp
- assertVisible:
    id: "m12-datatables-config_header"
- assertVisible:
    id: "m12-datatables-config_tabs"
- assertVisible:
    id: "m12-datatables-config_content"
- tapOn:
    id: "m12-datatables-config_datatable_row"
- assertVisible:
    id: "m12-datatables-config_header"
