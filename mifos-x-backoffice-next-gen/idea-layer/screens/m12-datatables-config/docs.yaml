summary: >-
  M12 · Data Tables & Configuration — the configuration control plane that AUTHORS the schemas the
  dynamic-template-forms engine renders and the switches the whole platform obeys. Five families in one master/detail:
  (1) DATA TABLES — user-defined custom-field schemas registered against a Fineract entity (define columns,
  register/deregister, add/drop columns), gated by *_DATATABLE (+REGISTER_/DEREGISTER_); (2) GLOBAL CONFIG — the
  platform switches (maker-checker, holiday transactions, penalty-wait, …) toggled one at a time, gated by
  *_CONFIGURATION; (3) ENTITY CHECKS — rules making a datatable mandatory at a lifecycle status; (4) EXTERNAL SERVICES —
  S3/SMTP/SMS connector credentials (secrets write-only); (5) FIELD CONFIG — per-entity built-in field rules
  (read-only). Everything is ONLINE-ONLY + maker-checker aware (config drift is dangerous); reads are cached
  CACHE_FIRST_SWR because the datatable schemas are the offline vocabulary dynamic-template-forms needs; writes funnel
  through the offline-sync-engine outbox (online-only drain, durable idempotency key); rejected commands route to
  needs-attention-inbox.
metadata:
  category: back-office-domain
  implementation_ready: true
  impl_ready_at: '2026-07-17T00:00:00Z'
  impl_ready_schema: v2
contracts:
  - capability: config_reference_read
    platform_spec: >-
      Per-family CACHE_FIRST_SWR Store<Unit,List<T>> over Room (ConfigReferenceEntity keyed by (config_type,
      config_id)); GET
      /v1/{datatables,configurations,entityDatatableChecks,externalservice/{name},fieldconfiguration/{entity}}; renders
      all ScreenState variants via ScreenContent; the datatable schemas are the offline vocabulary source for
      dynamic-template-forms
    permission: READ_DATATABLE
    error_cases:
      - config_read_failed
      - config_offline_no_cache
  - capability: datatable_schema_read
    platform_spec: >-
      GET /v1/datatables + GET /v1/datatables/{name} → each custom datatable's attached entity + column list
      (name/type/length/code-source/mandatory); CACHE_FIRST_SWR; the schema dynamic-template-forms renders custom fields
      from
    permission: READ_DATATABLE
    error_cases:
      - config_read_failed
  - capability: datatable_register_command
    platform_spec: >-
      POST /v1/datatables then POST /v1/datatables/register/{datatable}/{entity} — define + attach a custom-field schema
      to a Fineract entity; form from datatable-column metadata + GET /v1/fieldconfiguration/{entity} via
      dynamic-template-forms; queued through RoomSubmitOutbox with a durable idempotency key; ONLINE-ONLY (a
      half-registered schema is dangerous); maker-checker aware; once registered the columns drive that entity's form
      next sync
    permission: REGISTER_DATATABLE
    error_cases:
      - command_rejected
      - command_pending_approval
      - permission_drift_403
      - edit_offline_blocked
  - capability: datatable_column_command
    platform_spec: >-
      PUT /v1/datatables/{datatable} (addColumns / dropColumns / changeColumns) + POST
      /v1/datatables/deregister/{datatable} — evolve or detach a schema; a dropdown column binds to an M09 code so its
      options resolve offline; queued, durable-idempotent, ONLINE-ONLY, maker-checker aware
    permission: CREATE_DATATABLE
    error_cases:
      - command_rejected
      - column_in_use
      - edit_offline_blocked
  - capability: global_config_command
    platform_spec: >-
      GET /v1/configurations + PUT /v1/configurations/{id} (enabled + optional value/dateValue) — toggle/set a platform
      switch one at a time; some flags gate whether OTHER modules run maker-checker so the change re-resolves the
      capability map; queued, durable-idempotent, ONLINE-ONLY, maker-checker aware
    permission: UPDATE_CONFIGURATION
    error_cases:
      - command_rejected
      - edit_offline_blocked
  - capability: entity_datatable_check_command
    platform_spec: >-
      GET /v1/entityDatatableChecks + POST /v1/entityDatatableChecks + DELETE /v1/entityDatatableChecks/{id} — make a
      datatable mandatory at a lifecycle status (entity, status, datatable, product scope); form from GET
      /v1/entityDatatableChecks/template via dynamic-template-forms; queued, durable-idempotent, ONLINE-ONLY,
      maker-checker aware
    permission: CREATE_ENTITY_DATATABLE_CHECK
    error_cases:
      - command_rejected
      - edit_offline_blocked
  - capability: external_service_command
    platform_spec: >-
      GET /v1/externalservice/{name} + PUT /v1/externalservice/{name} — read/edit S3/SMTP/SMS connector config; secret
      values are WRITE-ONLY (never read back, shown masked, never cached, scrubbed from logs); powers document storage +
      M16 campaign delivery; queued, durable-idempotent, ONLINE-ONLY, maker-checker aware
    permission: UPDATE_EXTERNALSERVICES
    error_cases:
      - command_rejected
      - edit_offline_blocked
