vm_actions:
  - name: LoadConfiguration
    signature: private fun loadConfiguration()
    state_mutations:
      - uiState=Loading
      - uiState=Success(families) | Empty | Error
    side_effects:
      - >-
        ConfigReferenceRepository.streamAll(CACHE_FIRST_SWR) —
        datatables/global-config/entity-checks/external-services/field-config
    error_handling:
      NetworkError: uiState=Error; keep last cached datatable schemas (dynamic-template-forms stays functional); offer Retry
      Unauthorized403: route to permission-capability-engine (drift protocol)
  - name: SelectConfigTab
    signature: 'private fun onSelectConfigTab(tab: ConfigFamilyTab)'
    state_mutations:
      - selectedTab=<tab>
      - uiState=Success | Empty
    side_effects: []
    error_handling:
      PermissionDenied: >-
        a family the operator cannot read is hidden from the tab strip; if the active tab is pruned, fall back to the
        first readable family
  - name: OpenDatatableDetail
    signature: 'private fun onOpenDatatableDetail(datatable: String)'
    state_mutations: []
    side_effects:
      - ConfigReferenceRepository.streamDatatableDetail(datatable, CACHE_FIRST_SWR)
    error_handling:
      ConfigReadFailed: uiState=Error on the detail pane; serve last cached schema when present; offer Retry
      Offline: NoNetwork; render cached datatable schema so dynamic-template-forms stays functional; offline banner
  - name: OpenConfigDetail
    signature: 'private fun onOpenConfigDetail(configId: String)'
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToConfigDetail(configId))
    error_handling:
      NavigationUnavailable: config-detail route not registered; no-op guard, log to CrashReporter; stay on the list
  - name: OpenExternalServiceDetail
    signature: 'private fun onOpenExternalServiceDetail(serviceName: String)'
    state_mutations: []
    side_effects:
      - ConfigReferenceRepository.streamExternalService(serviceName, CACHE_FIRST_SWR) — secrets masked
    error_handling:
      ConfigReadFailed: uiState=Error on the detail pane; offer Retry; secret fields never read back (shown masked)
      Offline: NoNetwork; render non-secret cached config; secret fields stay masked; offline banner
  - name: RegisterDatatable
    signature: 'private fun registerDatatable(payload: ConfigCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - ConfigOutboxRepository.enqueue(REGISTER_DATATABLE, payload, idempotencyKey) — online-only drain
    error_handling:
      Offline: block; disabled with 'connect to change configuration' reason (config edits online-only)
      CommandRejected: route entry to needs-attention-inbox; uiState=Error
      Queued: uiState=Submitting → 'Submitted for approval' (maker-checker)
  - name: AddDatatableColumn
    signature: 'private fun addDatatableColumn(datatable: String, payload: ConfigCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - ConfigOutboxRepository.enqueue(CREATE_DATATABLE, datatable, payload, idempotencyKey)
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: DeregisterDatatable
    signature: 'private fun deregisterDatatable(datatable: String)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - ConfigOutboxRepository.enqueue(DEREGISTER_DATATABLE, datatable, idempotencyKey) — after confirm dialog
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: ToggleGlobalConfig
    signature: 'private fun toggleGlobalConfig(configId: String, enabled: Boolean, value: String?)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - >-
        ConfigOutboxRepository.enqueue(UPDATE_CONFIGURATION, configId, payload, idempotencyKey) — a maker-checker flag
        change re-resolves the capability map next sync
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: CreateEntityDatatableCheck
    signature: 'private fun createEntityDatatableCheck(payload: ConfigCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - ConfigOutboxRepository.enqueue(CREATE_ENTITY_DATATABLE_CHECK, payload, idempotencyKey)
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: DeleteEntityDatatableCheck
    signature: 'private fun deleteEntityDatatableCheck(checkId: String)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - ConfigOutboxRepository.enqueue(DELETE_ENTITY_DATATABLE_CHECK, checkId, idempotencyKey) — after confirm dialog
    error_handling:
      CommandRejected: route to needs-attention-inbox
  - name: EditExternalService
    signature: 'private fun editExternalService(serviceName: String, payload: ConfigCommandPayload)'
    state_mutations:
      - uiState=Submitting
    side_effects:
      - >-
        ConfigOutboxRepository.enqueue(UPDATE_EXTERNALSERVICES, serviceName, payload, idempotencyKey) — secret fields
        write-only, scrubbed from logs
    error_handling:
      Offline: block; online-only
      CommandRejected: route to needs-attention-inbox
  - name: RetryLoad
    signature: private fun onRetryLoad()
    state_mutations:
      - uiState=Loading
    side_effects:
      - ConfigReferenceRepository.streamAll.refreshFresh()
    error_handling:
      Unauthorized403: route to permission-capability-engine
error_cases:
  - config_read_failed
  - config_offline_no_cache
  - command_rejected
  - command_pending_approval
  - permission_drift_403
  - edit_offline_blocked
  - column_in_use
