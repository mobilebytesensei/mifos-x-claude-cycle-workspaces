feature: m12-datatables-config

# Fineract configuration surface. READ ops (datatable schemas, global config, entity checks, external
# services, field config) are CACHE_FIRST_SWR — the datatable SCHEMAS are the offline vocabulary
# dynamic-template-forms needs to render custom fields offline. Every WRITE op is ONLINE-ONLY +
# maker-checker aware and funnels through the offline-sync-engine outbox with a durable idempotency key.
# Every op carries Fineract-Platform-TenantId; every mutation gated by its exact permission code.

endpoints:
  # ── Data tables (custom-field schema CRUD + register/deregister) ─────────
  - id: list_datatables
    method: GET
    path: "/v1/datatables"
    description: "All registered custom datatable schemas (name + attached entity + one-to-one/one-to-many); the schema source dynamic-template-forms renders custom fields from"
    response_type: "DatatableDto[]"
    response:
      shape: list
    requires_auth: true
    requires_permission: [READ_DATATABLE]
    cacheable: true

  - id: get_datatable_detail
    method: GET
    path: "/v1/datatables/{datatable}"
    description: "One datatable's full schema — attached entity + every column (name, type, length, code-source, mandatory)"
    response_type: "DatatableDetailDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_DATATABLE]
    cacheable: true

  - id: create_datatable
    method: POST
    path: "/v1/datatables"
    description: "Define a new custom datatable schema (name, entity, columns); ONLINE-ONLY, maker-checker aware"
    request_type: "DatatableCreateRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [REGISTER_DATATABLE]
    maker_checker: true

  - id: register_datatable
    method: POST
    path: "/v1/datatables/register/{datatable}/{entity}"
    description: "Register an existing datatable against a Fineract entity (m_client/m_loan/m_savings_account/m_group) so its columns appear on that entity's form; ONLINE-ONLY"
    request_type: "DatatableRegisterRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [REGISTER_DATATABLE]
    maker_checker: true

  - id: update_datatable
    method: PUT
    path: "/v1/datatables/{datatable}"
    description: "Change a datatable's schema — add columns / drop columns / change an existing column; ONLINE-ONLY, maker-checker aware"
    request_type: "DatatableUpdateRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [CREATE_DATATABLE]
    maker_checker: true

  - id: deregister_datatable
    method: POST
    path: "/v1/datatables/deregister/{datatable}"
    description: "Detach a datatable from its entity so its custom fields stop appearing on that entity's form (stored rows retained); ONLINE-ONLY"
    request_type: "DatatableCommandRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [DEREGISTER_DATATABLE]
    maker_checker: true

  # ── Global configuration flags ──────────────────────────────────────────
  - id: get_configurations
    method: GET
    path: "/v1/configurations"
    description: "The platform-wide global configuration flags (maker-checker, grace-on-arrears-ageing, penalty-wait-period, allow-transactions-on-holiday, …) with each flag's current value"
    response_type: "GlobalConfigurationDto[]"
    response:
      shape: list
    requires_auth: true
    requires_permission: [READ_CONFIGURATION]
    cacheable: true

  - id: get_configuration_detail
    method: GET
    path: "/v1/configurations/{configId}"
    description: "One global configuration flag detail (name, description, value, whether boolean/numeric/date, affected modules)"
    response_type: "GlobalConfigurationDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_CONFIGURATION]
    cacheable: true

  - id: update_configuration
    method: PUT
    path: "/v1/configurations/{configId}"
    description: "Toggle or set the value of a global configuration flag (body: enabled + optional value/dateValue); ONLINE-ONLY, maker-checker aware"
    request_type: "GlobalConfigurationUpdateRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [UPDATE_CONFIGURATION]
    maker_checker: true

  # ── Entity-datatable checks (make a datatable mandatory at a lifecycle status) ──
  - id: list_entity_datatable_checks
    method: GET
    path: "/v1/entityDatatableChecks"
    description: "Rules that make a datatable mandatory for an entity at a lifecycle status (e.g. loan_additional_info required before APPROVE)"
    response_type: "EntityDatatableCheckDto[]"
    response:
      shape: list
    requires_auth: true
    requires_permission: [READ_ENTITY_DATATABLE_CHECK]
    cacheable: true

  - id: get_entity_check_template
    method: GET
    path: "/v1/entityDatatableChecks/template"
    description: "Entity-datatable-check create form template (entities, statuses, registered datatables) → dynamic-template-forms"
    response_type: "EntityDatatableCheckTemplateDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_ENTITY_DATATABLE_CHECK]
    cacheable: true

  - id: create_entity_datatable_check
    method: POST
    path: "/v1/entityDatatableChecks"
    description: "Create a mandatory-datatable rule (entity, status, datatable, optional product scope); ONLINE-ONLY, maker-checker aware"
    request_type: "EntityDatatableCheckRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [CREATE_ENTITY_DATATABLE_CHECK]
    maker_checker: true

  - id: delete_entity_datatable_check
    method: DELETE
    path: "/v1/entityDatatableChecks/{checkId}"
    description: "Remove a mandatory-datatable rule so the datatable is no longer required at that lifecycle step; ONLINE-ONLY"
    request_type: "EntityDatatableCheckCommandRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [DELETE_ENTITY_DATATABLE_CHECK]
    maker_checker: true

  # ── External services (S3 / SMTP / SMS connectors; secrets write-only) ───
  - id: get_external_service
    method: GET
    path: "/v1/externalservice/{serviceName}"
    description: "An external-service connector's config (S3 bucket/region, SMTP host/port/from-address, SMS gateway url) — secret values (keys/passwords/tokens) are write-only and returned masked"
    response_type: "ExternalServiceDto"
    response:
      shape: flat
    requires_auth: true
    requires_permission: [READ_EXTERNALSERVICES]
    cacheable: true

  - id: update_external_service
    method: PUT
    path: "/v1/externalservice/{serviceName}"
    description: "Update an external-service connector's config + secrets (write-only); ONLINE-ONLY, maker-checker aware"
    request_type: "ExternalServiceUpdateRequest"
    response_type: "CommandProcessingResultDto"
    requires_auth: true
    requires_permission: [UPDATE_EXTERNALSERVICES]
    maker_checker: true

  # ── Field configuration (per-entity built-in field rules; read-only vocabulary) ──
  - id: get_field_configuration
    method: GET
    path: "/v1/fieldconfiguration/{entity}"
    description: "Per-entity built-in field enable/mandatory rules for an entity (which native fields are shown/required) — read-only vocabulary that also informs the register-datatable form"
    response_type: "FieldConfigurationDto[]"
    response:
      shape: list
    requires_auth: true
    requires_permission: [READ_FIELDCONFIGURATION]
    cacheable: true
