feature: m12-datatables-config

# ── Tenant configuration summary (drives header badges) ─────────────────
summary:
  tenant: "default"
  datatable_count: 3
  registered_datatable_count: 3
  global_config_count: 6
  entity_check_count: 2
  external_service_count: 3
  configured_external_service_count: 2

# ── Custom datatables (the schemas dynamic-template-forms renders) ───────
datatables:
  - id: "dt_client_kyc"
    name: "client_kyc_details"
    display_name: "Client KYC Details"
    entity: "m_client"
    entity_display: "Client"
    multi_row: false
    status: "Registered"
    system_defined: false
    columns:
      - { name: "national_id_number", type: "string", length: 20, mandatory: true, code: null }
      - { name: "id_type", type: "dropdown", length: null, mandatory: true, code: "Customer Identifier" }
      - { name: "date_of_birth", type: "date", length: null, mandatory: true, code: null }
      - { name: "monthly_income", type: "decimal", length: null, mandatory: false, code: null }
      - { name: "occupation", type: "string", length: 100, mandatory: false, code: null }
      - { name: "is_pep", type: "boolean", length: null, mandatory: false, code: null }
  - id: "dt_loan_addl"
    name: "loan_additional_info"
    display_name: "Loan Additional Info"
    entity: "m_loan"
    entity_display: "Loan"
    multi_row: false
    status: "Registered"
    system_defined: false
    columns:
      - { name: "loan_purpose_detail", type: "dropdown", length: null, mandatory: true, code: "LoanPurpose" }
      - { name: "collateral_value", type: "decimal", length: null, mandatory: false, code: null }
      - { name: "field_visit_date", type: "date", length: null, mandatory: false, code: null }
      - { name: "recommendation_notes", type: "string", length: 500, mandatory: false, code: null }
  - id: "dt_savings_beneficiary"
    name: "savings_beneficiary"
    display_name: "Savings Beneficiary"
    entity: "m_savings_account"
    entity_display: "Savings Account"
    multi_row: true
    status: "Registered"
    system_defined: false
    columns:
      - { name: "beneficiary_name", type: "string", length: 150, mandatory: true, code: null }
      - { name: "relationship", type: "dropdown", length: null, mandatory: true, code: "ClientType" }
      - { name: "share_percentage", type: "number", length: null, mandatory: true, code: null }

# ── Global configuration flags (the platform switches) ──────────────────
global_config:
  - id: "config_1"
    name: "maker-checker"
    description: "Whether maker-checker (4-eyes) approval is enforced platform-wide; individual commands are further toggled per-permission"
    enabled: true
    value_type: "boolean"
    affects_modules: ["m15-approvals-makerchecker", "all mutating modules"]
  - id: "config_2"
    name: "reschedule-future-due-days"
    description: "Whether repayments due on a holiday roll forward to the next working day"
    enabled: true
    value_type: "boolean"
    affects_modules: ["m04-loan-portfolio", "m09-organization"]
  - id: "config_3"
    name: "penalty-wait-period"
    description: "Grace days after a missed instalment before a late-payment penalty is applied"
    enabled: true
    value: 3
    value_type: "number"
    affects_modules: ["m04-loan-portfolio"]
  - id: "config_4"
    name: "grace-on-arrears-ageing"
    description: "Days of grace before a loan is counted as in-arrears for delinquency ageing"
    enabled: true
    value: 5
    value_type: "number"
    affects_modules: ["m04-loan-portfolio", "m14-reports-search-audit"]
  - id: "config_5"
    name: "allow-transactions-on-holiday"
    description: "Whether savings/loan transactions may be posted on a defined holiday date"
    enabled: false
    value_type: "boolean"
    affects_modules: ["m05-savings-deposits-shares", "m06-collections"]
  - id: "config_6"
    name: "enable-address"
    description: "Whether the structured address sub-resource is enabled on clients"
    enabled: true
    value_type: "boolean"
    affects_modules: ["m02-clients"]

# ── Entity-datatable checks (make a datatable mandatory at a lifecycle status) ──
entity_datatable_checks:
  - id: "edc_1"
    entity: "m_client"
    entity_display: "Client"
    status: "ACTIVATE"
    datatable: "client_kyc_details"
    product_scope: null
  - id: "edc_2"
    entity: "m_loan"
    entity_display: "Loan"
    status: "APPROVE"
    datatable: "loan_additional_info"
    product_scope: "Group Loan Product"

# ── External services (S3 / SMTP / SMS connectors; secrets masked) ───────
external_services:
  - id: "es_s3"
    name: "S3"
    display_name: "Amazon S3 (document storage)"
    configured: true
    fields:
      - { key: "s3_bucket_name", value: "mifos-default-documents", secret: false }
      - { key: "s3_region", value: "ap-south-1", secret: false }
      - { key: "s3_access_key", value: "••••••••", secret: true }
      - { key: "s3_secret_key", value: "••••••••", secret: true }
  - id: "es_smtp"
    name: "SMTP"
    display_name: "SMTP (email delivery)"
    configured: true
    fields:
      - { key: "smtp_host", value: "smtp.sendgrid.net", secret: false }
      - { key: "smtp_port", value: "587", secret: false }
      - { key: "smtp_from_address", value: "no-reply@microfinance.example", secret: false }
      - { key: "smtp_username", value: "apikey", secret: false }
      - { key: "smtp_password", value: "••••••••", secret: true }
  - id: "es_sms"
    name: "SMS"
    display_name: "SMS gateway"
    configured: false
    fields:
      - { key: "sms_gateway_url", value: null, secret: false }
      - { key: "sms_api_token", value: null, secret: true }

# ── Field configuration (per-entity built-in field rules; read-only) ─────
field_configuration:
  entity: "m_client"
  fields:
    - { field: "middlename", enabled: true, mandatory: false }
    - { field: "dateOfBirth", enabled: true, mandatory: true }
    - { field: "gender", enabled: true, mandatory: false }
    - { field: "clientType", enabled: true, mandatory: true }

