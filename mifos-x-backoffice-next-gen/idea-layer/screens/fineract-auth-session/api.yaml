feature: fineract-auth-session
# Base URL is operator-supplied at login (dynamic) — paths below are relative to that host.
# The classic Fineract auth handshake: Basic auth (base64 user:password) + Fineract-Platform-TenantId.
endpoints:
  - id: authenticate
    method: POST
    path: "/fineract-provider/api/v1/authentication"
    description: >-
      Classic Fineract login. Sends {username, password} with the tenant as the tenantIdentifier query param; returns
      AuthenticatedUserData — base64EncodedAuthenticationKey, userId, username, permissions: Collection<String> (the sole
      runtime authorization input consumed by core/permissions), roles[], officeId, staffId, shouldRenewPassword,
      isTwoFactorAuthenticationRequired. On success the client derives Authorization: Basic base64('username:password')
      and carries Fineract-Platform-TenantId on every subsequent request.
    query_params:
      - name: tenantIdentifier
        type: string
        required: true
        description: "The Fineract tenant identifier (default 'default'). Also sent as the Fineract-Platform-TenantId header on authenticated requests."
    request_body:
      shape: object
      fields:
        - name: username
          type: string
          required: true
        - name: password
          type: string
          required: true
    response_type: "AuthenticatedUserData"
    response:
      shape: object
    requires_auth: false
    requires_permission: []
    tenant_header: true

  - id: get_authenticated_userdetails
    method: GET
    path: "/fineract-provider/api/v1/userdetails"
    description: >-
      Validates a restored/cached Basic session against the server and re-hydrates the current user's permissions[]
      without re-prompting for the password — used to confirm a persisted session is still valid on cold start when
      online. A 401 here drops the session and routes to login.
    response_type: "AuthenticatedUserData"
    response:
      shape: object
    requires_auth: true
    requires_permission: []
    tenant_header: true
