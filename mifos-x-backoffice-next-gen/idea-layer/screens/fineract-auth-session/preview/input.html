<!doctype html>
<!-- render-hash: inputauth02 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fineract Sign in — input</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #006CB5; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001D33;
  --secondary: #00796B; --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9; --background: #FCFCFF; --outline: #72777F;
  --font-body: 'Roboto', system-ui, sans-serif; --fs-h2: 1.4rem; --fs-body: 1rem; --fs-label: 0.875rem; --fs-caption: 0.75rem; --fw-medium: 500; --fw-semibold: 600;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-caption: 0.4px;
  --r-sm: 4px; --r-md: 8px; --r-lg: 16px; --r-xl: 28px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF; --on-primary: #003354; --primary-container: #004B78; --on-primary-container: #CBE6FF;
  --secondary: #9CD6C9; --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF; --surface-container-low: #1E2022; --background: #1A1C1E; --outline: #8C9199;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--sp-md); padding: var(--sp-lg); max-width: 480px; width: 100%; margin: 0 auto; }
.brand-row { display: flex; flex-direction: column; align-items: center; gap: var(--sp-sm); margin-bottom: var(--sp-sm); }
.brand { width: 64px; height: 64px; border-radius: var(--r-xl); display: flex; align-items: center; justify-content: center; background: var(--primary-container); color: var(--on-primary-container); }
.brand .material-symbols-outlined { font-size: 34px; }
.title { font-size: var(--fs-h2); font-weight: var(--fw-semibold); margin: 0; text-align: center; }
.server-hint { font-size: var(--fs-caption); color: var(--on-surface-variant); text-align: center; margin: 0; }
.field { display: flex; flex-direction: column; gap: var(--sp-xs); }
.field label { font-size: var(--fs-caption); color: var(--on-surface-variant); letter-spacing: var(--ls-caption); }
.input { display: flex; align-items: center; gap: var(--sp-sm); height: 48px; padding: 0 var(--sp-md); border: var(--border-w) solid var(--outline); border-radius: var(--r-sm); background: var(--surface); }
.input .material-symbols-outlined { color: var(--on-surface-variant); }
.input input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: var(--font-body); font-size: var(--fs-body); color: var(--on-surface); }
.input input::placeholder { color: var(--on-surface-variant); }
.btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm); height: 48px; border: none; border-radius: var(--r-lg); background: var(--primary); color: var(--on-primary); font-weight: var(--fw-medium); font-size: var(--fs-label); cursor: pointer; margin-top: var(--sp-sm); }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="fineract-auth-session" data-state="input">
  <main data-shell="content" data-state="input" aria-label="Sign in to a Fineract server">

    <div class="brand-row">
      <div class="brand" aria-hidden="true"><span class="material-symbols-outlined">account_balance</span></div>
      <h1 class="title" data-component-id="header" data-from-ui-yaml-path="components[0]">Sign in</h1>
      <p class="server-hint" data-component-id="server_hint" data-from-ui-yaml-path="components[1]">Sign in to your Fineract server &amp; tenant — self-hosted or the demo community server.</p>
    </div>

    <div class="field">
      <label for="f-base">Server base URL</label>
      <div class="input" data-component-type="TextField" data-component-id="base_url_field" data-from-ui-yaml-path="components[2]">
        <span class="material-symbols-outlined" aria-hidden="true">dns</span>
        <input id="f-base" type="url" inputmode="url" value="https://demo.mifos.community" data-action="update_base_url" aria-label="Fineract server base URL">
      </div>
    </div>

    <div class="field">
      <label for="f-tenant">Tenant identifier</label>
      <div class="input" data-component-type="TextField" data-component-id="tenant_field" data-from-ui-yaml-path="components[3]">
        <span class="material-symbols-outlined" aria-hidden="true">apartment</span>
        <input id="f-tenant" type="text" value="default" data-action="update_tenant" aria-label="Tenant identifier">
      </div>
    </div>

    <div class="field">
      <label for="f-user">Username</label>
      <div class="input" data-component-type="TextField" data-component-id="username_field" data-from-ui-yaml-path="components[4]">
        <span class="material-symbols-outlined" aria-hidden="true">person</span>
        <input id="f-user" type="text" autocomplete="username" placeholder="mifos" data-action="update_username" aria-label="Username">
      </div>
    </div>

    <div class="field">
      <label for="f-pass">Password</label>
      <div class="input" data-component-type="PasswordField" data-component-id="password_field" data-from-ui-yaml-path="components[5]">
        <span class="material-symbols-outlined" aria-hidden="true">lock</span>
        <input id="f-pass" type="password" autocomplete="current-password" placeholder="••••••••" data-action="update_password" aria-label="Password">
        <span class="material-symbols-outlined" aria-hidden="true">visibility_off</span>
      </div>
    </div>

    <button class="btn-primary" data-component-type="Button" data-component-id="sign_in_button" data-from-ui-yaml-path="components[7]" data-action="sign_in" aria-label="Sign in to the Fineract server">
      <span class="material-symbols-outlined" aria-hidden="true">login</span>Sign in
    </button>

  </main>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
