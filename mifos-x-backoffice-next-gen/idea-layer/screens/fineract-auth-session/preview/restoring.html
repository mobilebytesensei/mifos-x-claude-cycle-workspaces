<style>
:root {
  --primary: #0091EA; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001E30;
  --primary-hover: #0081D0; --primary-pressed: #0072B8;
  --secondary: #00796B; --on-secondary: #FFFFFF; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  --tertiary: #5B5891; --on-tertiary: #FFFFFF; --tertiary-container: #E3DFFF; --on-tertiary-container: #17124B;
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #2E7D32; --on-success: #FFFFFF; --success-container: #C8E6C9; --on-success-container: #002106;
  --warning: #F57C00; --on-warning: #FFFFFF; --warning-container: #FFDDB8; --on-warning-container: #2A1700; --warning-strong: #B45309;
  --info: #0277BD; --on-info: #FFFFFF; --accent: #00BFA5; --on-accent: #00201A;
  --background: #FCFCFF; --on-background: #1A1C1E; --surface: #FCFCFF; --on-surface: #1A1C1E;
  --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F3F4F9; --surface-container: #EDEFF4;
  --surface-container-high: #E7E9EF; --surface-container-highest: #E1E3E9;
  --outline: #72777F; --outline-variant: #C2C7CF; --inverse-primary: #6FD3FF;

  --font-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-display-small: 36px; --fs-headline-small: 24px;
  --fs-title-large: 22px; --fs-title-medium: 16px; --fs-title-small: 14px;
  --fs-body-large: 16px; --fs-body-medium: 14px; --fs-body-small: 12px;
  --fs-label-large: 14px; --fs-label-medium: 12px; --fs-label-small: 11px;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --ls-label: 0.1px; --ls-caption: 0.4px; --ls-mono-label: 0.5px;

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px;
  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
  --r-none: 0; --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 9999px;
  --el-0: none;
  --el-1: 0 1px 2px rgba(0,0,0,0.05);
  --el-2: 0 2px 6px rgba(0,0,0,0.08);
  --el-3: 0 8px 24px rgba(0,0,0,0.12);
  --el-4: 0 12px 32px rgba(0,0,0,0.14);
  --el-5: 0 16px 48px rgba(0,0,0,0.18);
  --border-thin: 1px; --border-medium: 2px; --border-focus: 2px; --border-thick: 4px;
}
:root[data-theme="dark"] {
  --primary: #6FD3FF; --on-primary: #00344F; --primary-container: #004B70; --on-primary-container: #CBE6FF;
  --primary-hover: #86DBFF; --primary-pressed: #9EE2FF;
  --secondary: #4FD8C4; --on-secondary: #003731; --secondary-container: #005048; --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0FF; --on-tertiary: #2C2A5E; --tertiary-container: #434076; --on-tertiary-container: #E3DFFF;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #7FCF82; --on-success: #003910; --success-container: #1B5E20; --on-success-container: #C8E6C9;
  --warning: #FFB868; --on-warning: #4A2800; --warning-container: #6B3C00; --on-warning-container: #FFDDB8; --warning-strong: #E0912F;
  --info: #7FCFFF; --on-info: #003548; --accent: #4FD8C4; --on-accent: #00201A;
  --background: #1A1C1E; --on-background: #E2E2E6; --surface: #1A1C1E; --on-surface: #E2E2E6;
  --surface-variant: #42474E; --on-surface-variant: #C2C7CF;
  --surface-container-lowest: #0F1113; --surface-container-low: #1A1C1E; --surface-container: #1E2022;
  --surface-container-high: #282A2D; --surface-container-highest: #333537;
  --outline: #8C9198; --outline-variant: #42474E; --inverse-primary: #0091EA;
  --el-1: 0 1px 2px rgba(0,0,0,0.30);
  --el-2: 0 2px 6px rgba(0,0,0,0.36);
  --el-3: 0 8px 24px rgba(0,0,0,0.44);
  --el-4: 0 12px 32px rgba(0,0,0,0.48);
  --el-5: 0 16px 48px rgba(0,0,0,0.52);

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body-medium); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; -webkit-font-feature-settings: 'liga'; }

/* Full-bleed restore splash (signin_form archetype — no bottom-nav, no top app bar) */
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-xl); padding: var(--sp-lg) var(--sp-md); padding-top: calc(var(--sp-xxl) + env(safe-area-inset-top, 24px)); padding-bottom: calc(var(--sp-xl) + env(safe-area-inset-bottom, 0px)); overflow-y: auto; max-width: 100%; }

/* Brand */
.brand { display: flex; flex-direction: column; align-items: center; gap: var(--sp-md); }
.brand-mark { position: relative; width: 88px; height: 88px; border-radius: var(--r-xl); display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(140deg, var(--primary), color-mix(in oklch, var(--primary) 55%, var(--secondary))); color: var(--on-primary); box-shadow: var(--el-3); }
.brand-mark .material-symbols-outlined { font-size: 48px; }
.brand-ring { position: absolute; inset: -10px; border-radius: var(--r-xl); border: var(--border-medium) solid color-mix(in oklch, var(--primary) 22%, transparent); border-top-color: var(--primary); animation: spin 900ms cubic-bezier(0.2,0,0,1) infinite; }
.brand-title { font-size: var(--fs-headline-small); font-weight: var(--fw-bold); color: var(--on-surface); letter-spacing: -0.2px; text-align: center; }
.brand-sub { font-size: var(--fs-body-medium); color: var(--on-surface-variant); text-align: center; max-width: 30ch; }

/* Restore status card */
.restore-card { display: flex; flex-direction: column; gap: var(--sp-md); width: 100%; max-width: 360px; background: var(--surface-container-low); border: var(--border-thin) solid var(--outline-variant); border-radius: var(--r-lg); padding: var(--sp-lg) var(--sp-md); box-shadow: var(--el-2); }
.restore-row { display: flex; align-items: center; gap: var(--sp-sm); }
.restore-row .material-symbols-outlined { font-size: 20px; color: var(--secondary); flex: 0 0 auto; }
.restore-row .rk { font-size: var(--fs-label-medium); font-weight: var(--fw-medium); color: var(--on-surface-variant); letter-spacing: var(--ls-label); flex: 0 0 auto; min-width: 64px; }
.restore-row .rv { font-family: var(--font-mono); font-size: var(--fs-body-small); color: var(--on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.restore-div { height: var(--border-thin); background: var(--outline-variant); }
.lin-track { position: relative; height: 4px; border-radius: var(--r-full); background: color-mix(in oklch, var(--primary) 16%, transparent); overflow: hidden; }
.lin-bar { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: var(--r-full); background: var(--primary); animation: indeterminate 1400ms cubic-bezier(0.2,0,0,1) infinite; }
.restore-hint { display: flex; align-items: center; justify-content: center; gap: var(--sp-xs); font-size: var(--fs-label-small); color: var(--on-surface-variant); }
.restore-hint .material-symbols-outlined { font-size: 14px; }
.restore-hint .mono { font-family: var(--font-mono); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes indeterminate { 0% { left: -40%; } 60% { left: 100%; } 100% { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .brand-ring, .lin-bar { animation: none; } .lin-bar { left: 0; width: 60%; } }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="fineract-auth-session" data-state="restoring">

  <main data-shell="content" data-state="restoring">

    <!-- Brand with progress ring (#header) -->
    <div class="brand" data-component-type="LayoutBox" data-component-id="header">
      <span class="brand-mark" aria-hidden="true">
        <span class="brand-ring"></span>
        <span class="material-symbols-outlined">account_balance</span>
      </span>
      <div class="brand-title">Restoring your session</div>
      <p class="brand-sub" data-component-type="LayoutBox" data-component-id="server_hint">Reading your encrypted session from secure storage — no network needed.</p>
    </div>

    <!-- Restore detail card -->
    <section class="restore-card" data-component-type="Card" data-component-variant="elevated" data-component-id="restore_status" aria-label="Restoring persisted session" aria-busy="true">
      <div class="restore-row">
        <span class="material-symbols-outlined" aria-hidden="true">dns</span>
        <span class="rk">Server</span>
        <span class="rv">https://demo.mifos.community</span>
      </div>
      <div class="restore-row">
        <span class="material-symbols-outlined" aria-hidden="true">domain</span>
        <span class="rk">Tenant</span>
        <span class="rv">default</span>
      </div>
      <div class="restore-div"></div>
      <div class="lin-track" role="progressbar" aria-label="Restoring session">
        <span class="lin-bar"></span>
      </div>
      <div class="restore-hint">
        <span class="material-symbols-outlined" aria-hidden="true">lock</span>
        Decrypting <span class="mono">userId&nbsp;1</span> · <span class="mono">ALL_FUNCTIONS</span>
      </div>
    </section>

  </main>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
