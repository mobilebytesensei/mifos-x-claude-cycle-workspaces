<!doctype html>
<!-- render-hash: restoringauth01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fineract Sign in — restoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #006CB5; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001D33;
  --secondary: #00796B; --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --background: #FCFCFF; --outline: #72777F;
  --font-body: 'Roboto', system-ui, sans-serif; --fs-h2: 1.4rem; --fs-body: 1rem; --fs-label: 0.875rem; --fs-caption: 0.75rem; --fw-medium: 500; --fw-semibold: 600;
  --lh-body: 1.5; --lh-tight: 1.3;
  --r-sm: 4px; --r-lg: 16px; --r-xl: 28px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF; --on-primary: #003354; --primary-container: #004B78; --on-primary-container: #CBE6FF;
  --secondary: #9CD6C9; --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF; --background: #1A1C1E; --outline: #8C9199;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-md); padding: var(--sp-lg); text-align: center; }
.brand { width: 88px; height: 88px; border-radius: var(--r-xl); display: flex; align-items: center; justify-content: center; background: var(--primary-container); color: var(--on-primary-container); }
.brand .material-symbols-outlined { font-size: 44px; }
.brand-name { font-size: var(--fs-h2); font-weight: var(--fw-semibold); margin: 0; }
.hint { font-size: var(--fs-label); color: var(--on-surface-variant); margin: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--surface-variant); border-top-color: var(--primary); }
@media (prefers-reduced-motion: no-preference) { .spinner { animation: spin 0.9s linear infinite; } }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="fineract-auth-session" data-state="restoring">
  <main data-shell="content" data-state="restoring" aria-busy="true" aria-label="Restoring your session">
    <div class="brand" aria-hidden="true"><span class="material-symbols-outlined">account_balance</span></div>
    <h1 class="brand-name">Mifos Back Office</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p class="hint">Restoring your session…</p>
  </main>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
