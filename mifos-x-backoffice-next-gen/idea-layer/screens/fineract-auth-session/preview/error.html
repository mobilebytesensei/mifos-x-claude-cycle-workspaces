<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fineract Sign in — error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #006CB5; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001D33;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9; --background: #FCFCFF; --outline: #72777F;
  --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
  --font-body: 'Roboto', system-ui, sans-serif; --fs-h2: 1.4rem; --fs-body: 1rem; --fs-label: 0.875rem; --fs-caption: 0.75rem; --fw-medium: 500; --fw-semibold: 600;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-caption: 0.4px;
  --r-sm: 4px; --r-md: 8px; --r-lg: 16px; --r-xl: 28px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF; --on-primary: #003354; --primary-container: #004B78; --on-primary-container: #CBE6FF;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF; --surface-container-low: #1E2022; --background: #1A1C1E; --outline: #8C9199;
  --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: var(--sp-md); padding: var(--sp-lg); max-width: 480px; width: 100%; margin: 0 auto; }
.brand-row { display: flex; flex-direction: column; align-items: center; gap: var(--sp-sm); margin-bottom: var(--sp-xs); }
.brand { width: 64px; height: 64px; border-radius: var(--r-xl); display: flex; align-items: center; justify-content: center; background: var(--primary-container); color: var(--on-primary-container); }
.brand .material-symbols-outlined { font-size: 34px; }
.title { font-size: var(--fs-h2); font-weight: var(--fw-semibold); margin: 0; text-align: center; }
.error-banner { display: flex; align-items: flex-start; gap: var(--sp-sm); background: var(--error-container); color: var(--on-error-container); border-radius: var(--r-md); padding: var(--sp-md); font-size: var(--fs-label); }
.error-banner .material-symbols-outlined { flex: 0 0 auto; }
.field { display: flex; flex-direction: column; gap: var(--sp-xs); }
.field label { font-size: var(--fs-caption); color: var(--on-surface-variant); letter-spacing: var(--ls-caption); }
.input { display: flex; align-items: center; gap: var(--sp-sm); height: 48px; padding: 0 var(--sp-md); border: var(--border-w) solid var(--outline); border-radius: var(--r-sm); background: var(--surface); }
.input.invalid { border-color: var(--error); }
.input .material-symbols-outlined { color: var(--on-surface-variant); }
.input input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: var(--font-body); font-size: var(--fs-body); color: var(--on-surface); }
.field-error { font-size: var(--fs-caption); color: var(--error); }
.actions { display: flex; gap: var(--sp-sm); margin-top: var(--sp-sm); }
.btn-primary { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-sm); height: 48px; border: none; border-radius: var(--r-lg); background: var(--primary); color: var(--on-primary); font-weight: var(--fw-medium); font-size: var(--fs-label); cursor: pointer; }
.btn-text { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-xs); height: 48px; padding: 0 var(--sp-md); border: var(--border-w) solid var(--outline); border-radius: var(--r-lg); background: transparent; color: var(--primary); font-weight: var(--fw-medium); font-size: var(--fs-label); cursor: pointer; }
</style>

<body>
<div data-shell="root" data-screen-id="fineract-auth-session" data-state="error">
  <main data-shell="content" data-state="error" aria-label="Sign in failed">

    <div class="brand-row">
      <div class="brand" aria-hidden="true"><span class="material-symbols-outlined">account_balance</span></div>
      <h1 class="title" data-component-id="header">Sign in</h1>
    </div>

    <div class="error-banner" data-component-type="StatusBanner" data-component-id="error_banner" data-from-ui-yaml-path="components[6]" role="alert">
      <span class="material-symbols-outlined" aria-hidden="true">error</span>
      <span>Invalid credentials — the username or password wasn't accepted by <strong>demo.mifos.community</strong>. Your entries are kept; correct them and sign in again.</span>
    </div>

    <div class="field">
      <label for="e-base">Server base URL</label>
      <div class="input" data-component-id="base_url_field"><span class="material-symbols-outlined" aria-hidden="true">dns</span><input id="e-base" type="url" value="https://demo.mifos.community" aria-label="Fineract server base URL"></div>
    </div>
    <div class="field">
      <label for="e-tenant">Tenant identifier</label>
      <div class="input" data-component-id="tenant_field"><span class="material-symbols-outlined" aria-hidden="true">apartment</span><input id="e-tenant" type="text" value="default" aria-label="Tenant identifier"></div>
    </div>
    <div class="field">
      <label for="e-user">Username</label>
      <div class="input" data-component-id="username_field"><span class="material-symbols-outlined" aria-hidden="true">person</span><input id="e-user" type="text" value="mifos" aria-label="Username"></div>
    </div>
    <div class="field">
      <label for="e-pass">Password</label>
      <div class="input invalid" data-component-id="password_field"><span class="material-symbols-outlined" aria-hidden="true">lock</span><input id="e-pass" type="password" value="" placeholder="••••••••" aria-label="Password"><span class="material-symbols-outlined" aria-hidden="true">visibility_off</span></div>
      <span class="field-error">Enter the correct password for this user</span>
    </div>

    <div class="actions">
      <button class="btn-primary" data-component-type="Button" data-component-id="sign_in_button" data-action="sign_in" aria-label="Sign in to the Fineract server"><span class="material-symbols-outlined" aria-hidden="true">login</span>Sign in</button>
      <button class="btn-text" data-component-type="Button" data-component-id="retry_button" data-from-ui-yaml-path="components[8]" data-action="retry_sign_in" aria-label="Retry signing in"><span class="material-symbols-outlined" aria-hidden="true">refresh</span>Retry</button>
    </div>

  </main>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
