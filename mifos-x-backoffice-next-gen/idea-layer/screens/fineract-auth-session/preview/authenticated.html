<!doctype html>
<!-- render-hash: authedauth05 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fineract Sign in — authenticated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #006CB5; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001D33;
  --secondary: #00796B; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --background: #FCFCFF; --outline: #72777F; --success: #2E7D32;
  --font-body: 'Roboto', system-ui, sans-serif; --font-mono: 'Roboto Mono', ui-monospace, monospace;
  --fs-h2: 1.4rem; --fs-body: 1rem; --fs-label: 0.875rem; --fs-caption: 0.75rem; --fw-medium: 500; --fw-semibold: 600;
  --lh-body: 1.5; --lh-tight: 1.3;
  --r-sm: 4px; --r-md: 8px; --r-lg: 16px; --r-xl: 28px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF; --on-primary: #003354; --primary-container: #004B78; --on-primary-container: #CBE6FF;
  --secondary: #9CD6C9; --secondary-container: #005046; --on-secondary-container: #B8F2E6;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF; --background: #1A1C1E; --outline: #8C9199; --success: #7FD589;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-md); padding: var(--sp-lg); text-align: center; }
.ok-icon { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--secondary-container); color: var(--on-secondary-container); }
.ok-icon .material-symbols-outlined { font-size: 48px; }
.ok-title { font-size: var(--fs-h2); font-weight: var(--fw-semibold); margin: 0; }
.ok-body { max-width: 340px; color: var(--on-surface-variant); margin: 0; }
.session-card { display: flex; flex-direction: column; gap: var(--sp-xs); border: var(--border-w) solid var(--outline); border-radius: var(--r-lg); background: var(--surface); padding: var(--sp-md); text-align: left; width: 100%; max-width: 360px; }
.session-row { display: flex; justify-content: space-between; gap: var(--sp-sm); font-size: var(--fs-label); }
.session-row .k { color: var(--on-surface-variant); }
.session-row .v { font-family: var(--font-mono); font-weight: var(--fw-medium); }
.perm-pill { display: inline-flex; align-items: center; gap: var(--sp-xs); align-self: flex-start; font-size: var(--fs-caption); font-weight: var(--fw-medium); padding: 2px var(--sp-sm); border-radius: var(--r-sm); background: var(--secondary-container); color: var(--on-secondary-container); }
.route-note { display: inline-flex; align-items: center; gap: var(--sp-xs); font-size: var(--fs-caption); color: var(--on-surface-variant); }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-sm { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--surface-variant); border-top-color: var(--primary); }
@media (prefers-reduced-motion: no-preference) { .spinner-sm { animation: spin 0.8s linear infinite; } }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="fineract-auth-session" data-state="authenticated">
  <main data-shell="content" data-state="authenticated" aria-label="Signed in">
    <div class="ok-icon" aria-hidden="true"><span class="material-symbols-outlined">check_circle</span></div>
    <h1 class="ok-title">Signed in</h1>
    <p class="ok-body">Your session is established and stored encrypted on this device. Building your permitted surface…</p>
    <div class="session-card" data-component-id="af_session">
      <div class="session-row"><span class="k">Server</span><span class="v">demo.mifos.community</span></div>
      <div class="session-row"><span class="k">Tenant</span><span class="v">default</span></div>
      <div class="session-row"><span class="k">User</span><span class="v">mifos · Head Office</span></div>
      <span class="perm-pill"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:14px">verified</span>ALL_FUNCTIONS · Super user</span>
    </div>
    <span class="route-note" data-nav-to="permission-capability-engine"><span class="spinner-sm" aria-hidden="true"></span>Resolving 17 module roots…</span>
  </main>
</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
