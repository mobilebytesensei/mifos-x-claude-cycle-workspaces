feature: fineract-auth-session

participates_in_flows:
  - officer-login

entry_points:
  - type: app_launch
    description: "The application entry gate — runs on every cold start before any authenticated surface is reachable; first attempts a silent session restore."
  - type: unauthorized_redirect
    description: "Any feature that receives a 401 (session expired / revoked) drops the session and routes back here to re-authenticate."
  - type: logout
    description: "Reachable from M17 Sync & Settings — logout clears the persisted session and returns the operator to this login screen."

transitions:
  - from: restoring
    to: authenticated
    trigger: "a valid persisted session is restored from secure settings (cold start, offline-capable)"
  - from: restoring
    to: input
    trigger: "no persisted session, or a secure-store read failure — show the login form"
  - from: input
    to: authenticating
    trigger: "sign_in tapped with a valid base-URL + non-empty tenant/username/password"
  - from: authenticating
    to: authenticated
    trigger: "POST /authentication succeeds — session built, persisted encrypted, PermissionSet bootstrapped"
  - from: authenticating
    to: error
    trigger: "401 invalid credentials / invalid base-URL / network error / password-change or 2FA required"
  - from: error
    to: authenticating
    trigger: "retry_sign_in (or sign_in after correcting fields) re-submits"
  - from: authenticated
    to: permission-capability-engine
    trigger: "session established — route to the capability bootstrap that consumes the PermissionSet"
  - from: authenticated
    to: input
    trigger: "logout or a 401 anywhere in the app clears the session and returns to login"
