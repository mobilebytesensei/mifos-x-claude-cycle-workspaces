# Maestro happy path — fineract-auth-session
# Classic Fineract Basic-auth login → authenticated session → capability bootstrap.
appId: org.mifos.backoffice
---
- launchApp:
    clearState: true
- assertVisible:
    id: "fineract-auth-session_header"
- tapOn:
    id: "fineract-auth-session_base_url"
- inputText: "https://demo.mifos.community"
- tapOn:
    id: "fineract-auth-session_tenant"
- eraseText
- inputText: "default"
- tapOn:
    id: "fineract-auth-session_username"
- inputText: "mifos"
- tapOn:
    id: "fineract-auth-session_password"
- inputText: "password"
- tapOn:
    id: "fineract-auth-session_sign_in"
# authenticating -> authenticated -> capability bootstrap
- assertVisible:
    id: "permission-capability-engine_header"
