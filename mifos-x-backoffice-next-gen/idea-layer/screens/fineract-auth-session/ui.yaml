schema_version: v4.0
screen_id: fineract-auth-session
requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
name: "Fineract Sign in (tenant login → authenticated session)"
status: designed
archetype: signin_form
cluster: foundation
module: foundation
initial_state: restoring

# ─────────────────────────────────────────────────────────────────────────
# The application entry gate. On cold start it first attempts to RESTORE a
# persisted encrypted session (base-url, tenant, basic-token, userId,
# permission codes) — if present the app is already authenticated and routes
# straight to the capability bootstrap. Otherwise it shows the classic
# Fineract Basic-auth login: base-URL (server), tenant identifier (default
# "default"), username, password. On Sign in it POSTs /authentication, builds
# the Basic token, persists the session encrypted, populates the PermissionSet
# that core/permissions consumes, and flips the real AuthProvider to
# isConfigured=true. A 401 anywhere in the app drops the session back here.
# ─────────────────────────────────────────────────────────────────────────

business_logic:
  kind: crud
  processing_kind: on_demand
  description: >-
    Authenticates the operator against a configurable Fineract server using HTTP Basic auth. Validates the base-URL
    (non-empty, http(s) URL format), tenant identifier (non-empty, defaults to "default"), username and password
    (non-empty); on Sign in POSTs /fineract-provider/api/v1/authentication?tenantIdentifier={tenant}, base64-encodes
    "{username}:{password}" into the basic token, and maps AuthenticatedUserData (userId, permissions[], roles, officeId,
    shouldRenewPassword, isTwoFactorAuthenticationRequired) into a Session. The Session is persisted encrypted, the
    PermissionSet is bootstrapped for core/permissions, and the real AuthProvider replaces NoOpAuthProvider
    (isConfigured=true). Cold start restores the Session without a network call; logout and any 401 clear it.
  library_refs: []
  external_library_refs: ["ktorfit", "ktor-client", "kotlinx-serialization", "multiplatform-settings"]
  required_modules:
    - "core/auth"
    - "core/permissions"
    - "core-base/network"
    - "core/datastore"

states:
  restoring:
    description: "Cold start — reading the persisted encrypted session from secure settings. If a valid session is found the app is already authenticated (route to capability bootstrap); if not, or on a store read failure, fall through to the login form."
  input:
    description: "The login form is ready and editable — base-URL, tenant identifier (prefilled 'default'), username, and password fields with the Sign in button. Per-field validation errors render inline; the button is enabled only when all fields are non-empty and the base-URL is a valid http(s) URL."
  authenticating:
    description: "Sign in tapped — POST /authentication is in flight. Fields and the Sign in button are disabled and a progress indicator is shown; no session is persisted until the call succeeds."
  error:
    description: "Authentication failed — invalid credentials (401), an invalid/unreachable base-URL, a network error, or a server-required next step (password change / 2FA). An inline error banner explains the reason, the form is re-enabled with the entered values retained, and Retry re-submits."
  authenticated:
    description: "Session established — base-url, tenant, basic-token, authenticated userId and the user's permission code set are held by the real AuthProvider (isConfigured=true) and persisted encrypted. The screen routes forward to the capability bootstrap (permission-capability-engine) which builds the gated surface."

components:
  - id: header
    type: header
    label: "{strings.auth_title}"
    testTag: "fineract-auth-session_header"
    visible_states: [input, authenticating, error]

  - id: server_hint
    type: text
    label: "{strings.auth_server_hint}"
    testTag: "fineract-auth-session_server_hint"
    visible_states: [input, error]
    description: "One-line helper under the header explaining that the operator signs in against a specific Fineract server + tenant (self-hosted or the demo community server)."

  - id: base_url_field
    type: text_field
    label: "{strings.auth_base_url_label}"
    testTag: "fineract-auth-session_base_url"
    visible_states: [input, authenticating, error]
    validation:
      rules:
        - mandatory       # base URL must be present
        - url_format      # non-empty http/https scheme with a host
      on_violation: "block Sign in and show an inline field error until a valid http(s) URL is entered"
    description: "The Fineract server base URL (e.g. https://demo.mifos.community). Validated as a non-empty http(s) URL; a malformed value blocks Sign in and highlights this field. Persisted with the session so it is prefilled on the next launch."
    on_click:
      action: update_base_url
      action_contract:
        effect: transform_state
        reads_from: ["form_state"]
        description: "Updates the base-URL field in form state and re-runs URL-format validation (non-empty, http/https scheme, host present), toggling the Sign in button enablement and the inline field error."

  - id: tenant_field
    type: text_field
    label: "{strings.auth_tenant_label}"
    testTag: "fineract-auth-session_tenant"
    visible_states: [input, authenticating, error]
    validation:
      rules:
        - mandatory       # tenant identifier must be present (default: "default")
      on_violation: "block Sign in and show an inline field error until a tenant identifier is entered"
    description: "The Fineract tenant identifier, prefilled with 'default'. Sent as the tenantIdentifier query param on the auth call and as the Fineract-Platform-TenantId header on every authenticated request. Non-empty validation."
    on_click:
      action: update_tenant
      action_contract:
        effect: transform_state
        reads_from: ["form_state"]
        description: "Updates the tenant identifier in form state and re-runs non-empty validation, toggling the Sign in button enablement."

  - id: username_field
    type: text_field
    label: "{strings.auth_username_label}"
    testTag: "fineract-auth-session_username"
    visible_states: [input, authenticating, error]
    validation:
      rules:
        - mandatory       # username must be present
      on_violation: "block Sign in and show an inline field error until a username is entered"
    description: "The operator username. Non-empty validation; combined with the password into the Basic auth token on Sign in."
    on_click:
      action: update_username
      action_contract:
        effect: transform_state
        reads_from: ["form_state"]
        description: "Updates the username in form state and re-runs non-empty validation, toggling the Sign in button enablement."

  - id: password_field
    type: password_field
    label: "{strings.auth_password_label}"
    testTag: "fineract-auth-session_password"
    visible_states: [input, authenticating, error]
    validation:
      rules:
        - mandatory       # password must be present (never persisted)
      on_violation: "block Sign in and show an inline field error until a password is entered"
    description: "The operator password, masked. Non-empty validation; never persisted — only the derived base64 Basic token is stored in the encrypted session."
    on_click:
      action: update_password
      action_contract:
        effect: transform_state
        reads_from: ["form_state"]
        description: "Updates the password in form state (masked) and re-runs non-empty validation, toggling the Sign in button enablement. The raw password is never persisted."

  - id: error_banner
    type: status_banner
    label: "{strings.auth_error_generic}"
    testTag: "fineract-auth-session_error_banner"
    visible_states: [error]
    description: "Inline error explaining why Sign in failed — invalid credentials, invalid/unreachable server URL, no network, or a server-required next step (password change / 2FA). Shown above the form with the entered values retained."

  - id: sign_in_button
    type: button
    label: "{strings.auth_sign_in}"
    testTag: "fineract-auth-session_sign_in"
    accessibility_label: "Sign in to the Fineract server"
    visible_states: [input, error]
    description: "Primary action. Enabled only when base-URL is a valid http(s) URL and tenant/username/password are non-empty. Authenticates against the Fineract server and, on success, establishes the persisted session."
    on_click:
      action: sign_in
      action_contract:
        effect: call_api
        external_library_refs: ["ktorfit", "ktor-client", "multiplatform-settings"]
        reads_from: ["form_state"]
        writes_to: ["persisted_session"]
        invalidates: ["auth_provider_state", "permission_set"]
        description: "POST /fineract-provider/api/v1/authentication?tenantIdentifier={tenant} with {username,password} over the base-URL. On success: build basicToken=base64('username:password'), map AuthenticatedUserData into a Session{baseUrl,tenant,basicToken,userId,permissions}, persist it encrypted via secure multiplatform-settings, bootstrap the PermissionSet for core/permissions, flip the real AuthProvider to isConfigured=true, and route to the capability bootstrap. On 401 → invalid_credentials error (nothing persisted); on malformed URL / network → the corresponding error state."

  - id: retry_button
    type: button
    label: "{strings.auth_retry}"
    testTag: "fineract-auth-session_retry"
    accessibility_label: "Retry signing in"
    visible_states: [error]
    description: "Re-submits the login with the retained field values after a network or transient failure. For an invalid-credentials error the operator edits the fields and taps Sign in instead."
    on_click:
      action: retry_sign_in
      action_contract:
        effect: call_api
        external_library_refs: ["ktorfit", "ktor-client"]
        reads_from: ["form_state"]
        writes_to: ["persisted_session"]
        invalidates: ["auth_provider_state", "permission_set"]
        description: "Re-runs the authenticate call with the currently entered base-URL, tenant, username and password after a network or transient error — same success/failure handling as sign_in. No effect for a 401 invalid-credentials error, where the operator must correct the fields first."
