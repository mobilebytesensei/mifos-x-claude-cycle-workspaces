feature: fineract-auth-session
# Real Fineract login scenarios → the AuthenticatedUserData each returns, mapped to the
# permission sets consumed by permission-capability-engine (PERMISSION_SCOPE_MODEL.md §E).
# Passwords are shown as the classic Fineract demo credentials; only the derived Basic token is ever persisted.
items:
  - id: "login_system_admin"
    input:
      base_url: "https://demo.mifos.community"
      tenant_identifier: "default"
      username: "mifos"
      password: "password"
    result: success
    response:
      base64EncodedAuthenticationKey: "bWlmb3M6cGFzc3dvcmQ="
      userId: 1
      username: "mifos"
      officeId: 1
      officeName: "Head Office"
      roles: ["Super user"]
      permissions: ["ALL_FUNCTIONS"]
      shouldRenewPassword: false
      isTwoFactorAuthenticationRequired: false
    basic_token: "Basic bWlmb3M6cGFzc3dvcmQ="
    note: "The demo super user — ALL_FUNCTIONS umbrella; on success the capability bootstrap resolves all 17 module roots."

  - id: "login_self_hosted_teller"
    input:
      base_url: "https://fineract.mybank.co.ke"
      tenant_identifier: "kenya"
      username: "j.otieno"
      password: "Teller#2026"
    result: success
    response:
      base64EncodedAuthenticationKey: "ai5vdGllbm86VGVsbGVyIzIwMjY="
      userId: 214
      username: "j.otieno"
      officeId: 8
      officeName: "Nairobi Branch"
      roles: ["Teller"]
      permissions: ["READ_SAVINGSACCOUNT", "DEPOSIT_SAVINGSACCOUNT", "WITHDRAWAL_SAVINGSACCOUNT", "REPAYMENT_LOAN", "READ_TELLER", "ALLOCATECASHTOCASHIER_TELLER", "SETTLECASHFROMCASHIER_TELLER"]
      shouldRenewPassword: false
      isTwoFactorAuthenticationRequired: false
    basic_token: "Basic ai5vdGllbm86VGVsbGVyIzIwMjY="
    note: "A self-hosted tenant 'kenya' teller — dynamic base-URL + tenant header; the returned permissions gate a narrow teller surface."

  - id: "login_invalid_credentials"
    input:
      base_url: "https://demo.mifos.community"
      tenant_identifier: "default"
      username: "mifos"
      password: "wrong-password"
    result: error
    error_code: invalid_credentials_401
    http_status: 401
    note: "Wrong password — 401; the error banner shows invalid credentials, form values retained, nothing persisted."

  - id: "login_invalid_base_url"
    input:
      base_url: "not-a-url"
      tenant_identifier: "default"
      username: "mifos"
      password: "password"
    result: error
    error_code: invalid_base_url
    note: "Malformed base-URL — blocked client-side before any request; the base-URL field is highlighted and Sign in stays disabled."

  - id: "login_password_change_required"
    input:
      base_url: "https://demo.mifos.community"
      tenant_identifier: "default"
      username: "newuser"
      password: "Temp#0001"
    result: error
    error_code: two_factor_or_password_change_required
    response:
      userId: 305
      username: "newuser"
      roles: ["Data Entry"]
      permissions: ["READ_CLIENT"]
      shouldRenewPassword: true
      isTwoFactorAuthenticationRequired: false
    note: "Server returns shouldRenewPassword=true — no capability surface is built; the operator is told a password change is required first."

  - id: "restored_session_offline"
    input:
      source: secure_settings
    result: success
    response:
      base_url: "https://demo.mifos.community"
      tenant_identifier: "default"
      user_id: 1
      permissions: ["ALL_FUNCTIONS"]
    note: "Cold-start restore — a previously persisted encrypted session rehydrates the AuthProvider with no network call; the app is authenticated offline."

  - id: "restored_session_online_revalidated"
    input:
      source: secure_settings
      endpoint: get_authenticated_userdetails
      base_url: "https://fineract.mybank.co.ke"
      tenant_identifier: "kenya"
    result: success
    response:
      userId: 214
      username: "j.otieno"
      officeId: 8
      officeName: "Nairobi Branch"
      roles: ["Teller"]
      permissions: ["READ_SAVINGSACCOUNT", "DEPOSIT_SAVINGSACCOUNT", "WITHDRAWAL_SAVINGSACCOUNT", "REPAYMENT_LOAN", "READ_TELLER", "ALLOCATECASHTOCASHIER_TELLER", "SETTLECASHFROMCASHIER_TELLER", "READ_COLLECTIONSHEET"]
      shouldRenewPassword: false
      isTwoFactorAuthenticationRequired: false
    note: "Cold start WITH connectivity — the restored Basic session is revalidated via GET /userdetails with no password re-prompt; a 200 refreshes the PermissionSet (here the teller gained READ_COLLECTIONSHEET server-side) so the capability surface re-resolves. A 401 instead would drop the session (unauthorized_401_session_drop)."

# regenerated-provenance: idea-data-demo re-verified 2026-07-31 — rows match current api.yaml (authenticate + get_authenticated_userdetails); ADDED restored_session_online_revalidated scenario mirroring the new data-flow on_mount_online revalidation entry; classic Fineract demo creds + self-hosted Kenya tenant teller (j.otieno), only derived Basic token persisted; DD1-DD6 pass; mtime re-stamp (isStale enriched-unstick).
