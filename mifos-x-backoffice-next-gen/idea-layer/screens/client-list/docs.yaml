      - ios
      - desktop
  - capability: client_list_read
    library: cmp-network-monitor
    version: latest
    targets:
      - android
      - ios
      - desktop
  - capability: client_list_read
    library: openMF Fineract Client KMP SDK
    version: latest
    targets:
      - android
      - ios
      - desktop
  - capability: client_search
    library: kotlinx-serialization
    version: 1.7.x
    targets:
      - android
      - ios
      - desktop
  - capability: client_search
    library: openMF Fineract Client KMP SDK
    version: latest
    targets:
      - android
      - ios
      - desktop
vm_actions:
  - name: OnLoad
    signature: private fun onLoad()
    state_mutations:
      - uiState=Loading
      - uiState=Content(clients) | Empty | Error
      - canCreate=<resolved from PermissionSet holds CREATE_CLIENT>
    side_effects:
      - ClientListStore.asPagingScreenStream(officeId, CACHE_FIRST_SWR)
      - PermissionEvaluator.evaluate(CREATE_CLIENT)
    error_handling:
      NetworkError: uiState=Content from cache if present else Error; offer Retry (clients_load_failed)
      OfflineNoCache: uiState=Error; client_list_offline_no_cache
  - name: OnSearch
    handles: search_clients
    signature: 'private fun onSearch(query: String)'
    state_mutations:
      - query=<entered text>
      - clients=<filtered over loaded pages, then global-search results>
    side_effects:
      - in-VM debounced filter over loaded pages (name / account no / external id)
      - ClientSearchService.search(query, resource=clients) when the local page set is exhausted
    error_handling:
      SearchFailed: inline retry on the search panel; paged roster untouched (search_failed)
  - name: OnFilterStatus
    signature: 'private fun onFilterStatus(status: ClientStatus?)'
    state_mutations:
      - statusFilter=<pending | active | closed | null(All)>
      - clients=<filtered over loaded pages>
    side_effects: []
    error_handling:
      NetworkError: >-
        if the selected status filter needs a server-scoped refetch (filtered page set exhausted) and it fails,
        keep the locally-filtered rows and offer Retry (clients_load_failed)
  - name: OnOpenClient
    signature: 'private fun onOpenClient(clientId: String)'
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToClientDetail360(clientId))
    error_handling:
      NavigationTargetUnavailable: >-
        if client-detail-360 cannot resolve clientId (row deleted or now out of office scope), suppress the
        navigation and surface an inline toast "This client is no longer available"; roster stays browsable
        (client_list_offline_no_cache)
  - name: OnNewClient
    signature: private fun onNewClient()
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToDynamicClientCreateForm)  # gated on CREATE_CLIENT; posts via offline outbox on submit
    error_handling:
      PermissionDenied: >-
        if CREATE_CLIENT was revoked between render and tap, suppress navigation and show
        "You no longer have permission to create clients"; the FAB is then hidden on next re-evaluation
  - name: OnLoadNextPage
    signature: private fun onLoadNextPage()
    state_mutations:
      - clients=<append next offset/limit page>
    side_effects:
      - ClientListStore next page (offset += limit) appended atomically via @Transaction replacePage
    error_handling:
      PageLoadFailed: inline retry footer; already-loaded rows stay (page_load_failed)
  - name: OnRetry
    signature: private fun onRetry()
    state_mutations:
      - uiState=Loading
      - uiState=Content | Error
    side_effects:
      - ClientListStore.asPagingScreenStream(officeId).refreshFresh()  # re-reads the first page
    error_handling:
      NetworkError: uiState=Error; offer Retry again (clients_load_failed)
error_cases:
  - clients_load_failed
  - search_failed
  - page_load_failed
  - client_list_offline_no_cache
