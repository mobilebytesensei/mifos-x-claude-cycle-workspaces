feature: client-list
status: approved
cluster: clients
module: m02-clients
priority: must_have
new_infra: false
is_primary_flow: true
has_ui: true
has_api: true
has_server: false
archetype: list
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
  - fineract-auth-session
  - dynamic-template-forms
acceptance_refs:
  - >-
    A paged, searchable client roster scoped to the user's office; each row shows name, account no, status and office
    and drills into the 360 view; a permission-gated "New client" affordance opens the create form; the list is
    cache-first and fully browsable offline.
plan_ref: idea-plan.yaml#features[client-list]
summary: >-
  The searchable client roster drilled into from the M01 dashboard "active clients" tile and "new client" quick action.
  Loads GET /v1/clients (office-scoped, offset/limit paged) into a list of rows (display name, account no, status chip,
  office) with a search box (GET /v1/search?resource=clients) and status/office filter chips. Each row drills into
  client-detail-360. A permission-gated "New client" FAB opens the dynamic create form (GET /v1/clients/template → POST
  /v1/clients through the offline outbox). The roster reads cache-first through Store5 with paging, so it is fully
  browsable offline; new clients created offline appear immediately.
metadata:
  category: back-office-domain
  implementation_ready: true
  impl_ready_at: '2026-07-31T00:00:00Z'
  impl_ready_schema: v2
contracts:
  - capability: client_list_read
    platform_spec: >-
      Store<PageKey,List<Client>> over Room (client_roster_cache) + asPagingScreenStream(CACHE_FIRST_SWR);
      offset/limit ≙ Fineract paging; GET /v1/clients scoped by officeId (query params officeId/status/offset/limit/
      orderBy) → ClientSummaryDto pageItems mapped to roster rows (display name, account no, status chip, office,
      assigned staff). @Transaction replacePage keeps each offset/limit page atomic so pagination never races;
      on_scroll_end appends the next page. Reads cache-first so the roster is fully browsable offline; a stale page
      renders immediately while SWR revalidates in the background per FreshnessBands. Renders all ScreenState
      variants (loading/content/empty/error) free via PagingScreenContent.
    permission: READ_CLIENT
    error_cases:
      - clients_load_failed
      - page_load_failed
      - client_list_offline_no_cache
  - capability: client_search
    platform_spec: >-
      GET /v1/search?resource=clients&query= (bare_array, SearchResultDto) — a global-search escalation issued ONLY
      when the debounced in-VM filter over the loaded office-scoped pages is exhausted. Cross-office matches (name /
      account no / external id) render in a transient search-results panel and are NOT written to client_roster_cache
      (they may fall outside office scope). A failed search degrades to an inline retry on the search panel; the paged
      roster underneath is untouched.
    permission: READ_CLIENT
    error_cases:
      - search_failed
libraries:
