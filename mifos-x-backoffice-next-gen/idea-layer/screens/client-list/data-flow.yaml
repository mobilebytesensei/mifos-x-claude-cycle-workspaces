feature: client-list

# The roster reads cache-first through a Store5 paging source keyed by (officeId, page) so
# it browses offline. This screen is read-only; client creation happens in the dynamic form,
# which enqueues to the offline outbox — this screen only re-reads the roster.

entries:
  - trigger: on_mount
    source: remote.list_clients
    target_state: content
    loading_state: loading
    error_state: error
    on_error:
      nav_target: null
      error_code: clients_load_failed
    persistence_contract:
      store: room
      table: client_roster_cache
      keys: [client_id, account_no, display_name, status, office_id, staff_id, page_key]
      note: "CACHE_FIRST_SWR paged mirror of GET /v1/clients scoped by officeId; @Transaction replacePage keeps pages atomic so pagination never races."

  - trigger: on_scroll_end
    source: remote.list_clients_next_page
    target_state: content
    loading_state: content
    error_state: content
    on_error:
      nav_target: null
      error_code: page_load_failed
    persistence_contract:
      store: room
      table: client_roster_cache
      keys: [client_id, page_key]
      note: "Appends the next offset/limit page; a failed page-load degrades to an inline retry footer, the loaded rows stay."

cache:
  strategy: cache_first_swr
  note: "Pages revalidate in the background per FreshnessBands; a client created offline via the dynamic form (outbox) is projected into the roster optimistically until the next sync confirms it."

