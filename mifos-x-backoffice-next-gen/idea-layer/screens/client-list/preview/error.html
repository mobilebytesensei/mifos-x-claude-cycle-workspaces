<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #0091EA; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001E30;
  --secondary: #00796B; --on-secondary: #FFFFFF; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  --tertiary: #5B5891; --tertiary-container: #E3DFFF; --on-tertiary-container: #17124B;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9; --background: #FCFCFF; --outline: #72777F; --outline-variant: #C2C7CF;
  --success: #2E7D32; --warning-strong: #B45309; --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
  --font-body: 'Roboto', system-ui, sans-serif; --font-mono: 'Roboto Mono', ui-monospace, monospace;
  --fs-h3: 1.375rem; --fs-body: 1rem; --fs-label: 0.875rem; --fs-caption: 0.75rem; --fw-medium: 500; --fw-semibold: 600;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-caption: 0.4px;
  --r-sm: 4px; --r-md: 8px; --r-lg: 16px; --r-xl: 28px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --border-w: 1px;
  --el-0: none; --el-1: 0 1px 2px rgba(0,0,0,0.05); --el-2: 0 2px 6px rgba(0,0,0,0.08); --el-3: 0 8px 24px rgba(0,0,0,0.12);
}
:root[data-theme="dark"] {
  --primary: #6FD3FF; --on-primary: #00344F; --primary-container: #004B70; --on-primary-container: #CBE6FF;
  --secondary: #4FD8C4; --secondary-container: #005048; --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0FF; --tertiary-container: #434076; --on-tertiary-container: #E3DFFF;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF;
  --surface-container-low: #1E2022; --background: #1A1C1E; --outline: #8C9198; --outline-variant: #42474E;
  --success: #7FCF82; --warning-strong: #E0912F; --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
  --el-0: none; --el-1: 0 1px 2px rgba(0,0,0,0.35); --el-2: 0 2px 8px rgba(0,0,0,0.45); --el-3: 0 10px 28px rgba(0,0,0,0.55);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); border-bottom: var(--border-w) solid var(--surface-variant); box-shadow: var(--el-2); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-xl); color: var(--on-surface-variant); cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); margin: 0; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(var(--sp-md) + 64px); overflow-y: auto; position: relative; }
nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; display: flex; background: var(--surface); border-top: var(--border-w) solid var(--surface-variant); padding-bottom: env(safe-area-inset-bottom, 0); box-shadow: var(--el-2); }
nav[data-shell="bottom-nav"] a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-sm) var(--sp-xs); min-height: 44px; color: var(--on-surface-variant); text-decoration: none; font-size: var(--fs-caption); letter-spacing: var(--ls-caption); cursor: pointer; }
nav[data-shell="bottom-nav"] a .nav-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 28px; border-radius: var(--r-lg); }
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] { color: var(--on-primary-container); }
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill { background: var(--primary-container); }
/* ---- error state ---- */
.state-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--sp-md); padding: var(--sp-xl) var(--sp-lg); }
.state-illus { width: 96px; height: 96px; display: block; color: var(--error); }
.state-scope { display: inline-flex; align-items: center; gap: var(--sp-xs); font-size: var(--fs-caption); letter-spacing: var(--ls-caption); color: var(--on-surface-variant); text-transform: uppercase; }
.state-scope .office { font-family: var(--font-mono); text-transform: none; }
.state-scope .material-symbols-outlined { font-size: 16px; }
.state-headline { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); margin: 0; color: var(--on-surface); }
.state-body { max-width: 40ch; font-size: var(--fs-body); color: var(--on-surface-variant); margin: 0; }
.btn-primary { display: inline-flex; align-items: center; gap: var(--sp-sm); height: 48px; padding: 0 var(--sp-lg); border: none; border-radius: var(--r-lg); background: var(--primary); color: var(--on-primary); font-weight: var(--fw-medium); font-size: var(--fs-label); cursor: pointer; box-shadow: var(--el-2); margin-top: var(--sp-sm); }
.btn-primary .material-symbols-outlined { font-size: 20px; }
@media (prefers-reduced-motion: no-preference) { .btn-primary { transition: filter 120ms ease; } .btn-primary:active { filter: brightness(0.97); } }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="client-list" data-state="error">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="cl_header" data-from-ui-yaml-path="components[0]">
    <span class="leading material-symbols-outlined" data-nav-to="m01-dashboard" role="button" tabindex="0" aria-label="Back">arrow_back</span>
    <h1 class="app-title">Client Roster</h1>
  </header>

  <main data-shell="content" data-state="error">

    <div class="state-panel" data-component-type="LayoutBox" data-component-id="cl_error_panel" role="alert">
      <svg class="state-illus" viewBox="0 0 192 192" role="img" aria-label="A cloud that could not be reached" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M62 132h74c18 0 32-14 32-31 0-16-12-29-28-31-4-20-21-34-42-34-12 0-23 5-31 13" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M62 132c-16 0-28-12-28-28 0-13 9-24 21-27" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
        <line x1="40" y1="40" x2="152" y2="152" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <circle cx="96" cy="150" r="4" fill="currentColor"/>
      </svg>
      <div class="state-scope" data-component-type="Text" data-component-id="cl_error_scope">
        <span class="material-symbols-outlined" aria-hidden="true">apartment</span>Office · <span class="office">All offices</span>
      </div>
      <h2 class="state-headline" data-component-type="Text" data-component-id="cl_error_headline">Couldn't load the client roster</h2>
      <p class="state-body" data-component-type="Text" data-component-id="cl_error_body">We couldn't reach the server to load clients for this office, and there's no saved copy on this device yet. Check your connection and try again.</p>
      <button class="btn-primary" data-component-type="Button" data-component-id="cl_error_retry" data-from-ui-yaml-path="components[4]" data-action="retry" data-nav-to="client-list" data-produces-state="loading" aria-label="Retry loading the client list">
        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>Retry
      </button>
    </div>

  </main>

  <nav data-shell="bottom-nav" data-shell-source="app-shell.yaml" aria-label="Primary">
    <a data-nav-item="home" data-nav-to="m01-dashboard" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0"><span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">dashboard</span></span>Home</a>
    <a data-nav-item="clients" data-nav-to="m02-clients" data-nav-type="tab" data-nav-selected="true" role="button" tabindex="0"><span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">group</span></span>Clients</a>
    <a data-nav-item="collections" data-nav-to="m06-collections" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0"><span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">receipt_long</span></span>Collections</a>
    <a data-nav-item="sync" data-nav-to="m17-sync-settings" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0"><span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">sync</span></span>Sync</a>
  </nav>

</div>
