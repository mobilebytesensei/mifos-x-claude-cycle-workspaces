<style>
:root {

}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); border-bottom: var(--border-w) solid var(--surface-variant); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-xl); color: var(--on-surface-variant); }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); margin: 0; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); overflow-y: auto; }
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.sk { border-radius: var(--r-md); background: var(--surface-variant); background-image: linear-gradient(90deg, var(--surface-variant) 0px, var(--surface-container-low) 200px, var(--surface-variant) 400px); background-size: 800px 100%; }
@media (prefers-reduced-motion: no-preference) { .sk { animation: shimmer 1.4s ease-in-out infinite; } }
.sk-search { height: 48px; border-radius: var(--r-sm); }
.sk-chips { display: flex; gap: var(--sp-sm); }
.sk-chips .sk { width: 72px; height: 32px; border-radius: var(--r-lg); }
.sk-list { border: var(--border-w) solid var(--outline); border-radius: var(--r-lg); overflow: hidden; background: var(--surface); }
.sk-row { display: flex; align-items: center; gap: var(--sp-md); min-height: 44px; padding: var(--sp-md); border-bottom: var(--border-w) solid var(--surface-variant); }
.sk-row:last-child { border-bottom: none; }
.sk-avatar { flex: 0 0 auto; width: 40px; height: 40px; border-radius: var(--r-xl); }
.sk-lines { flex: 1; display: flex; flex-direction: column; gap: var(--sp-xs); }
.sk-line-lg { height: 14px; width: 62%; border-radius: var(--r-sm); }
.sk-line-md { height: 11px; width: 44%; border-radius: var(--r-sm); }
.sk-chip { flex: 0 0 auto; width: 64px; height: 22px; border-radius: var(--r-sm); }
.sk-fab { align-self: flex-end; width: 148px; height: 48px; border-radius: var(--r-lg); }
nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; display: flex; background: var(--surface); border-top: var(--border-w) solid var(--surface-variant); padding-bottom: env(safe-area-inset-bottom, 0); }
nav[data-shell="bottom-nav"] a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-sm) var(--sp-xs); min-height: 44px; color: var(--on-surface-variant); text-decoration: none; font-size: var(--fs-caption); letter-spacing: var(--ls-caption); cursor: pointer; }

nav[data-shell="bottom-nav"] a[data-nav-selected="true"] { color: var(--on-primary-container); }
