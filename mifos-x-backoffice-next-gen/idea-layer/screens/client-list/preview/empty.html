<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Roster — empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #006CB5; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001D33;
  --secondary: #00796B; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --background: #FCFCFF; --outline: #72777F;
  --font-body: 'Roboto', system-ui, sans-serif; --fs-h3: 1.375rem; --fs-h2: 1.4rem; --fs-body: 1rem; --fs-label: 0.875rem; --fs-caption: 0.75rem; --fw-medium: 500; --fw-semibold: 600;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-caption: 0.4px;
  --r-sm: 4px; --r-lg: 16px; --r-xl: 28px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #93CCFF; --on-primary: #003354; --primary-container: #004B78; --on-primary-container: #CBE6FF;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF; --background: #1A1C1E; --outline: #8C9199;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); border-bottom: var(--border-w) solid var(--surface-variant); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-xl); color: var(--on-surface-variant); cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); margin: 0; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-md); padding: var(--sp-lg); text-align: center; }
.empty-icon { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--primary-container); color: var(--on-primary-container); }
.empty-icon .material-symbols-outlined { font-size: 48px; }
.empty-title { font-size: var(--fs-h2); font-weight: var(--fw-semibold); margin: 0; }
.empty-body { max-width: 320px; color: var(--on-surface-variant); margin: 0; }
.btn-primary { display: inline-flex; align-items: center; gap: var(--sp-sm); height: 48px; padding: 0 var(--sp-lg); border: none; border-radius: var(--r-lg); background: var(--primary); color: var(--on-primary); font-weight: var(--fw-medium); font-size: var(--fs-label); cursor: pointer; margin-top: var(--sp-sm); }
nav[data-shell="bottom-nav"] { position: sticky; bottom: 0; margin-top: auto; display: flex; background: var(--surface); border-top: var(--border-w) solid var(--surface-variant); padding-bottom: env(safe-area-inset-bottom, 0); }
nav[data-shell="bottom-nav"] a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-sm) var(--sp-xs); min-height: 44px; color: var(--on-surface-variant); text-decoration: none; font-size: var(--fs-caption); letter-spacing: var(--ls-caption); cursor: pointer; }
nav[data-shell="bottom-nav"] a .nav-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 56px; height: 28px; border-radius: var(--r-lg); }
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] { color: var(--on-primary-container); }
nav[data-shell="bottom-nav"] a[data-nav-selected="true"] .nav-pill { background: var(--primary-container); }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="client-list" data-state="empty">

  <header data-shell="top-app-bar" data-variant="small" data-component-id="cl_header">
    <span class="leading material-symbols-outlined" data-nav-to="m01-dashboard" role="button" tabindex="0" aria-label="Back">arrow_back</span>
    <h1 class="app-title">Client Roster</h1>
  </header>

  <main data-shell="content" data-state="empty" aria-label="No clients found">
    <div class="empty-icon" aria-hidden="true"><span class="material-symbols-outlined">group_off</span></div>
    <h2 class="empty-title">No clients found</h2>
    <p class="empty-body">No clients match the current search or filter in this office. Adjust the filters, or add the first client to the roster.</p>
    <button class="btn-primary" data-component-id="cl_new_client" data-action="new_client" data-nav-to="dynamic-template-forms" aria-label="Start a new client application">
      <span class="material-symbols-outlined" aria-hidden="true">person_add</span>New client
    </button>
  </main>

  <nav data-shell="bottom-nav" data-shell-source="app-shell.yaml" aria-label="Primary">
    <a data-nav-item="home" data-nav-to="m01-dashboard" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0"><span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">dashboard</span></span>Home</a>
    <a data-nav-item="clients" data-nav-to="m02-clients" data-nav-type="tab" data-nav-selected="true" role="button" tabindex="0"><span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">group</span></span>Clients</a>
    <a data-nav-item="collections" data-nav-to="m06-collections" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0"><span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">receipt_long</span></span>Collections</a>
    <a data-nav-item="sync" data-nav-to="m17-sync-settings" data-nav-type="tab" data-nav-selected="false" role="button" tabindex="0"><span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">sync</span></span>Sync</a>
  </nav>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
