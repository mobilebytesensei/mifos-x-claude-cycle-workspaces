schema_version: v1.0.0
feature: client-list
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/empty/error)
# + per api operation (list_clients, search_clients).
scenarios:
  - id: loading_shows_list_shimmer
    preconditions: ["the roster is opened", "the first page has not resolved yet"]
    actions: ["open the client roster from the M01 active-clients tile"]
    assertions: ["the loading state shows a list shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_paged_rows
    preconditions: ["the office-scoped roster resolves", "the user holds READ_CLIENT"]
    actions: ["open the roster"]
    assertions:
      - "client rows show name, account no, status chip and office"
      - "a search box and status/office filter chips are present"
      - "scrolling to the end loads the next page"
    priority: high
  - id: empty_when_no_clients_or_filter_clears_all
    preconditions: ["the roster (or the active search/filter) returns zero clients"]
    actions: ["apply a filter matching nothing"]
    assertions: ["the empty panel is shown", "a New-client affordance is present when CREATE_CLIENT is held"]
    priority: low
  - id: error_when_first_page_fails_no_cache
    preconditions: ["the first page failed to load and no cache is available"]
    actions: ["open the roster"]
    assertions: ["the error state is shown", "Retry re-reads the first page"]
    priority: medium
  - id: roster_browsable_offline
    preconditions: ["the device is offline", "the roster was previously loaded"]
    actions: ["open the roster offline", "scroll"]
    assertions: ["cached pages render from the Store5 paging source", "pagination does not race (pages are atomic)"]
    priority: high
  - id: search_escalates_to_global_when_pages_exhausted
    preconditions: ["a search term matches no loaded row"]
    actions: ["type a search term"]
    assertions: ["the in-VM filter runs first", "GET /v1/search?resource=clients is issued only when the local page set is exhausted"]
    priority: medium
  - id: row_drills_into_360
    preconditions: ["the roster shows rows"]
    actions: ["tap a client row"]
    assertions: ["navigation goes to client-detail-360 for that client"]
    priority: high
  - id: new_client_gated_and_opens_form
    preconditions: ["the user holds CREATE_CLIENT"]
    actions: ["tap the New-client FAB"]
    assertions: ["the New-client FAB is shown only when CREATE_CLIENT is held", "it navigates to the dynamic client-create form"]
    priority: medium
