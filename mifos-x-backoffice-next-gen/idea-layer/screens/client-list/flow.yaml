feature: client-list

entry_points:
  - type: direct
    description: "Opened from the M01 dashboard 'active clients' tile (open_active_clients)."
  - type: direct
    description: "Opened from the M01 dashboard 'new client' quick action (quick_new_client), landing with the New-client form ready."
  - type: from_module
    description: "Reached as the M02 clients module's default list surface."

transitions:
  - from: loading
    to: content
    trigger: "the first page of the office-scoped roster resolves (cache-first)"
  - from: loading
    to: empty
    trigger: "the roster returns zero clients"
  - from: loading
    to: error
    trigger: "the first page failed to load and no cache is available"

  - from: content
    to: content
    trigger: "search text / status chip changes, or the next page loads on scroll"
  - from: content
    to: client-detail-360
    trigger: "a client row is tapped"
  - from: content
    to: dynamic-template-forms
    trigger: "the New-client FAB is tapped (CREATE_CLIENT held)"

  - from: empty
    to: dynamic-template-forms
    trigger: "the New-client affordance is tapped from the empty state"

  - from: error
    to: loading
    trigger: "'Retry' tapped — re-reads the first page"
