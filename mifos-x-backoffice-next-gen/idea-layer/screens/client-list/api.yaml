feature: client-list

# Paged, office-scoped client roster + global search. Reads are CACHE_FIRST_SWR through a
# Store5 paging source so the roster browses offline.

endpoints:
  - id: list_clients
    method: GET
    path: "/v1/clients"
    description: >-
      List clients scoped to the user's office (offset/limit paged). Each row carries display name, account no,
      status, office and assigned staff for the roster.
    query_params:
      - { name: officeId, type: integer, required: false }
      - { name: status, type: string, required: false }
      - { name: offset, type: integer, required: false }
      - { name: limit, type: integer, required: false }
      - { name: orderBy, type: string, required: false }
    response:
      shape: list
      dto: ClientSummaryDto
      demo_source: ClientSummaryDto.items
    pagination:
      style: offset-limit
      params: [offset, limit]
      envelope: paged
    requires_auth: true
    requires_permission: ["READ_CLIENT"]
  - id: search_clients
    method: GET
    path: "/v1/search"
    description: "Global search escalation (?resource=clients&query=) when the local paged set is exhausted; returns matching clients by name / account no / external id."
    query_params:
      - { name: query, type: string, required: true }
      - { name: resource, type: string, required: true }   # clients
    response:
      shape: list
      dto: SearchResultDto
      demo_source: SearchResultDto.items
    pagination:
      style: none
      params: []
      envelope: bare_array
    requires_auth: true
    requires_permission: ["READ_CLIENT"]