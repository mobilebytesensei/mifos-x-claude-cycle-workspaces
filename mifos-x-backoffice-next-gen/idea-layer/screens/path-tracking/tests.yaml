schema_version: v1.0.0
feature: path-tracking
scenarios:
  - id: start_recording_and_stop
    preconditions: ["OFICIAL DE CAMPO signed in", "location permission granted"]
    actions: ["open Path Tracking from drawer", "tap Start route", "move for 5 minutes", "tap Stop"]
    assertions: ["recording state shown with live map polyline", "control bar shows elapsed time + distance", "on stop: session appears in history list with correct duration and distance", "session status=completed in Room"]
    priority: high

  - id: pause_and_resume
    preconditions: ["recording state active"]
    actions: ["tap Pause", "wait 2 minutes", "tap Resume"]
    assertions: ["paused state shown", "polyline frozen on map", "on resume: recording restarts; new waypoints appended to same session"]
    priority: medium

  - id: view_historical_route
    preconditions: ["at least one completed session in history"]
    actions: ["tap a completed session row"]
    assertions: ["viewing state shown", "full route polyline rendered on map", "statistics shown: duration, distance, start/end time"]
    priority: high

  - id: location_permission_required
    preconditions: ["location permission not granted"]
    actions: ["open Path Tracking"]
    assertions: ["permission_required state shown immediately", "'Location access required' message", "'Open app settings' button available"]
    priority: high

  - id: gps_lost_mid_recording
    preconditions: ["recording state", "GPS signal intentionally blocked"]
    actions: ["GPS signal lost"]
    assertions: ["snackbar 'GPS signal lost — route paused' shown", "session remains open in Room", "recording resumes when GPS restored"]
    priority: medium

  - id: hidden_for_admin_persona
    preconditions: ["Super user signed in (ALL_FUNCTIONS — no field-ops nav context)"]
    actions: ["check drawer nav roots"]
    assertions: ["Path Tracking nav root absent from drawer (fail-closed Tier 1 hide)"]
    priority: high

  # ── §4.7 permission gating ────────────────────────────────────────────
  - id: start_tracking_grayed_out_without_read_collectionsheet
    description: "A user with CREATE_CLIENT (can reach path-tracking via Tier-1 pass) but lacking READ_COLLECTIONSHEET sees the Start route button grayed-out; tapping shows an info dialog — not a crash or silent failure."
    preconditions: ["user holds CREATE_CLIENT but NOT READ_COLLECTIONSHEET", "location permission granted", "path-tracking screen open (idle state)"]
    actions: ["observe path-tracking_start button", "tap it"]
    assertions:
      - "path-tracking_start renders in a grayed-out (disabled) appearance (gray-out-info-dialog denied_behavior)"
      - "tapping shows an info dialog: 'You need READ_COLLECTIONSHEET to record routes — contact your manager'"
      - "no session is opened in Room"
      - "pause_tracking, resume_tracking, and stop_tracking are similarly grayed-out (same required_permission)"
      - "view_session on any history row is also grayed-out"
    priority: high

  - id: read_collectionsheet_enables_all_tracking_actions
    description: "A field officer holding READ_COLLECTIONSHEET can start, pause, resume, stop, and view sessions — all actions enabled."
    preconditions: ["user holds READ_COLLECTIONSHEET", "location permission granted", "idle state"]
    actions: ["open path-tracking", "tap Start route", "tap Pause", "tap Resume", "tap Stop", "tap a completed session row"]
    assertions:
      - "path-tracking_start is enabled (not grayed-out)"
      - "on tap: transitions to recording state; session opened in Room"
      - "pause_tracking, resume_tracking, stop_tracking all function without info dialogs"
      - "view_session navigates to the viewing state showing the full route polyline"
    priority: high
