feature: path-tracking
# Path tracking makes no Fineract API calls — entirely device-local GPS + Room.
endpoints: []
notes:
  - "GPS acquisition: core/platform LocationProvider (KMP expect/actual — Android LocationManager / iOS CLLocationManager). No server calls."
  - "Route data stored in Room (path_tracking_sessions + path_tracking_points). Survives process kill."
  - "Map tiles may require network access (map provider CDN), but the route recording and playback are fully offline."
