feature: path-tracking
status: designed
scaffolded_at: '2026-08-01T00:00:00Z'
scaffolded_by: /idea-plan-add
schema_version: v2
cluster: field-operations
module: foundation
priority: should_have
is_primary_flow: false
has_ui: true
has_api: false
has_server: false
capabilities:
  - has_ui
  - has_flow
  - has_offline_cache
  - has_local_preferences
  - has_system_integration
  - requires_auth
requires_features:
  - fineract-auth-session
  - permission-capability-engine
provides_to: []
permissions_gate: >-
  Gated to loan-officer-maker / collections-field-officer personas (HIDDEN for admin/super-user unless they also hold a
  field-officer code). Representative gate: READ_COLLECTIONSHEET or CREATE_CLIENT (any field-ops code). Server
  permission code: none — this is a device-local GPS feature; the gate is a UI-layer capability check, not a Fineract
  code. required_permission: READ_COLLECTIONSHEET denied_behavior: hide-root
contracts:
  apis: []
  tables:
    - name: path_tracking_sessions
      backend: room
      note: >-
        GPS trail sessions: session_id, started_at, ended_at, status (recording/paused/completed). Persisted in Room;
        survives app kill.
    - name: path_tracking_points
      backend: room
      note: >-
        Individual GPS waypoints: session_id, lat, lng, accuracy_m, timestamp. Appended every ~5s while recording. Used
        to render the route polyline on a map.
    - name: app_settings
      backend: multiplatform_settings
      keys:
        - tracking_active_session_id
        - tracking_recording
      note: Quick-access flags for the recording state visible to the nav-shell badge and notification.
libraries:
  core_modules:
    - core/datastore
  external:
    - 'core/platform LocationProvider (KMP expect/actual: Android LocationManager, iOS CLLocationManager)'
    - androidx.room
    - maps-compose / MapKit (map rendering)
vm_actions:
  - action: OnStartTrackingClick
    maps_to_on_click: start_tracking
    handler: >-
      Request location permission if not granted; start the background location service; open a new PathTrackingSession
      in Room; persist tracking_active_session_id; show notification badge.
  - action: OnPauseTrackingClick
    maps_to_on_click: pause_tracking
    handler: Pause the location service; update session status to paused; keep the session open in Room.
  - action: OnResumeTrackingClick
    maps_to_on_click: resume_tracking
    handler: Resume the location service; update session status to recording; append new waypoints to the existing session.
  - action: OnStopTrackingClick
    maps_to_on_click: stop_tracking
    handler: >-
      Stop the location service; close the session (status=completed, ended_at=now); the route is now viewable in
      history.
  - action: OnSessionRowClick
    maps_to_on_click: view_session
    handler: Open the historical route map view for a completed session.
  - action: Internal.ReceiveLocationUpdate
    handler: Append a new PathTrackingPoint to Room with the latest lat/lng/accuracy. Update the live map polyline.
error_cases:
  - code: location_permission_denied
    ux: >-
      error state: 'Location access is required to record your field route. Tap to open app settings.' with a button to
      the OS app settings.
  - code: gps_signal_lost
    ux: 'snackbar: ''GPS signal lost — route paused. Move to an open area and resume.'' Session stays open.'
  - code: storage_full
    ux: >-
      snackbar: 'Device storage full — older route sessions will be deleted to make room.' Oldest completed sessions
      pruned automatically.
test_fixtures:
  - >-
    loan officer opens path-tracking → taps Start → location permission granted → recording indicator shown → moves for
    5 min → taps Stop → route saved
  - view historical route: tap a completed session → map renders the GPS polyline from Room data
  - GPS signal lost mid-recording → snackbar shown; session stays paused
  - open from drawer while admin/super-user → root hidden (fail-closed)
acceptance_refs:
  - plan: idea-plan.yaml#features (to be added)
  - evolve: evolve-plans/20260801-role-based-app-assembly.md §4.5 FO-1
summary: >-
  GPS field-visit route trail — records and visualizes the field officer's location trail during a visit day. Accessible
  as a drawer root for the loan-officer-maker / collections-field-officer personas (hidden for admin/super-user unless
  also holding a field-ops code). Records GPS waypoints every ~5s into a Room session; renders the trail as a polyline
  on a map. Supports start / pause / resume / stop. Completed sessions are viewable in a history list. Fully offline —
  no Fineract API calls.
plan_ref: idea-plan.yaml#features[path-tracking]
status_history:
  - from: enriched
    to: designed
    at: '2026-08-03T16:49:09.271Z'
    by: /idea-feature-stitch
