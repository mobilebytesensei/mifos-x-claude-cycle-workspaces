feature: path-tracking
entries:
  - trigger: on_mount
    source: local.path_tracking_sessions
    target_state: idle
    loading_state: idle
    error_state: error
    on_error:
      nav_target: null
      error_code: storage_read_failed
    persistence_contract:
      store: room
      keys: [session_id, started_at, ended_at, status]
      note: "History of completed PathTrackingSessions from Room. Loaded as a Flow<List<PathTrackingSession>>; updates live when a new session completes."

  - trigger: on_event
    action: start_tracking
    source: local.location_provider
    target_state: recording
    loading_state: recording
    error_state: error
    on_error:
      nav_target: null
      error_code: gps_signal_lost
    persistence_contract:
      store: room
      keys: [session_id, started_at, status, points]
      note: "New PathTrackingSession opened in Room. Each LocationUpdate received from the platform is appended as a PathTrackingPoint row (lat, lng, accuracy_m, timestamp). The session stays open until stop_tracking."

  - trigger: on_event
    action: stop_tracking
    source: local.path_tracking_sessions
    target_state: idle
    loading_state: recording
    error_state: idle
    on_error:
      nav_target: null
      error_code: storage_write_failed
    persistence_contract:
      store: room
      keys: [session_id, ended_at, status]
      note: "Session row updated to status=completed + ended_at. The session then appears in the history list."

  - trigger: on_click
    action: view_session
    source: local.path_tracking_points
    target_state: viewing
    loading_state: viewing
    error_state: error
    on_error:
      nav_target: null
      error_code: storage_read_failed
    persistence_contract:
      store: room
      keys: [session_id, lat, lng, accuracy_m, timestamp]
      note: "All PathTrackingPoints for the selected session loaded from Room and rendered as a map polyline."
