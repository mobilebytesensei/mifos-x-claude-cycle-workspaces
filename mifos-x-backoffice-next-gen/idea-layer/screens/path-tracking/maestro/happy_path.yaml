appId: org.mifos.backoffice
---
# Path Tracking — happy path: open from field-officer drawer, start recording,
# verify map and controls visible, stop and verify session in history.
- launchApp
# Field officer shell — all permitted roots assembled including path-tracking
- assertVisible:
    id: "nav-shell-assembler_host"
# Open the navigation drawer (Menu tab is the full-roster launcher), then navigate to Path
# Tracking via its permission-gated nav root. testTag pattern: nav-shell-assembler_root_{moduleId}
- tapOn:
    id: "MenuTab"
# The drawer is a scrollable roster — scroll the field-officer nav root into view first.
- scrollUntilVisible:
    element:
      id: "nav-shell-assembler_root_path-tracking"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "nav-shell-assembler_root_path-tracking"
- assertVisible:
    id: "path-tracking_header"
# Fresh install has no recorded routes yet → idle shows the empty state + Start (the history
# list appears only after a session is recorded; asserted post-stop below).
- assertVisible:
    id: "path-tracking_start"
# Start recording — first tap triggers the OS runtime location-permission dialog.
- tapOn:
    id: "path-tracking_start"
# Grant location on the OS dialog (Android 15). Optional: skipped if already granted.
- tapOn:
    text: "While using the app|Allow|ALLOW|Only this time"
    optional: true
# Recording state — controls and map visible
- assertVisible:
    id: "path-tracking_map"
- assertVisible:
    id: "path-tracking_pause"
- assertVisible:
    id: "path-tracking_stop"
# Stop recording
- tapOn:
    id: "path-tracking_stop"
# Returns to idle state — session in history list
- assertVisible:
    id: "path-tracking_history_list"
- assertVisible:
    id: "path-tracking_session_item"
