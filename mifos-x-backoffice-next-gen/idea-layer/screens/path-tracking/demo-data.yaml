feature: path-tracking

# All 6 ui.yaml states covered: idle (session history), recording, paused, viewing,
# permission_required, error. Nairobi GPS coords — field officer route visiting
# 3 MFI client centers across Nairobi on a typical field day.
# Route: CBD office → Westlands → Kibera → Mathare → back to CBD.

items:
  # ── idle — Session history list (3 completed routes) ──────────────────────────
  - id: "history_session_1"
    state: idle
    session_id: "pts-2026-07-31-001"
    started_at: "2026-07-31T07:15:00+03:00"
    ended_at: "2026-07-31T13:45:00+03:00"
    status: "completed"
    duration_display: "6h 30m"
    distance_km: 17.4
    waypoints_count: 4697
    centers_visited: ["Westlands Group Center", "Kibera Community Center", "Mathare Group Meeting"]
    clients_visited: 14
    note: "Full Nairobi field day — CBD → Westlands → Kibera → Mathare → CBD."

  - id: "history_session_2"
    state: idle
    session_id: "pts-2026-07-30-001"
    started_at: "2026-07-30T08:00:00+03:00"
    ended_at: "2026-07-30T12:30:00+03:00"
    status: "completed"
    duration_display: "4h 30m"
    distance_km: 9.1
    waypoints_count: 3243
    centers_visited: ["Westlands Group Center", "Pangani Community Point"]
    clients_visited: 9
    note: "Half-day route — CBD → Westlands → Pangani → CBD."

  - id: "history_session_3"
    state: idle
    session_id: "pts-2026-07-29-001"
    started_at: "2026-07-29T07:30:00+03:00"
    ended_at: "2026-07-29T11:00:00+03:00"
    status: "completed"
    duration_display: "3h 30m"
    distance_km: 6.8
    waypoints_count: 2519
    centers_visited: ["Kibera Community Center"]
    clients_visited: 6
    note: "Short route — CBD → Kibera → CBD."

  # ── recording — Active GPS session in progress ─────────────────────────────────
  - id: "active_session"
    state: recording
    session_id: "pts-2026-08-01-001"
    started_at: "2026-08-01T07:30:00+03:00"
    status: "recording"
    elapsed_time: "00:47:23"
    distance_km: 3.2
    current_speed_kmh: 4.1
    waypoints_count: 568
    last_known_location:
      lat: -1.2635
      lng: 36.8003
      accuracy_m: 4.8
      place: "Westlands, Nairobi"
    note: "Officer is at Westlands — 47 min into the route, heading toward the Westlands Group Center meeting."

  # ── paused — Recording paused at a client visit ───────────────────────────────
  - id: "paused_session"
    state: paused
    session_id: "pts-2026-08-01-001"
    started_at: "2026-08-01T07:30:00+03:00"
    paused_at: "2026-08-01T08:17:23+03:00"
    status: "paused"
    elapsed_time: "00:47:23"
    distance_km: 3.2
    waypoints_count: 568
    paused_location:
      lat: -1.2635
      lng: 36.8003
      accuracy_m: 4.8
      place: "Westlands Group Center"
    control_bar:
      elapsed_display: "00:47:23"
      distance_display: "3.2 km"
      speed_display: "0.0 km/h"
    note: "Recording paused while officer is inside the Westlands center for the group loan review meeting."

  # ── viewing — Historical route selected for review ─────────────────────────────
  - id: "viewing_session"
    state: viewing
    session_id: "pts-2026-07-31-001"
    started_at: "2026-07-31T07:15:00+03:00"
    ended_at: "2026-07-31T13:45:00+03:00"
    status: "completed"
    stats:
      duration_display: "6h 30m"
      distance_km: 17.4
      start_time_display: "07:15 AM"
      end_time_display: "01:45 PM"
    map_bounds:
      sw: { lat: -1.3121, lng: 36.7828 }
      ne: { lat: -1.2607, lng: 36.8543 }
      center: { lat: -1.2864, lng: 36.8186 }
    delete_route_available: true

  # ── sample waypoints (first 4 of 4697 for session pts-2026-07-31-001) ─────────
  - id: "sample_waypoints"
    session_id: "pts-2026-07-31-001"
    state: viewing
    points:
      - { lat: -1.2841, lng: 36.8155, accuracy_m: 5.2, speed_kmh: 0.0,  ts: "2026-07-31T07:15:00+03:00", place: "Nairobi CBD (start)" }
      - { lat: -1.2818, lng: 36.8140, accuracy_m: 4.8, speed_kmh: 12.4, ts: "2026-07-31T07:15:05+03:00", place: "Upper Hill Rd" }
      - { lat: -1.2780, lng: 36.8105, accuracy_m: 5.0, speed_kmh: 18.6, ts: "2026-07-31T07:15:10+03:00", place: "Uhuru Highway" }
      - { lat: -1.2700, lng: 36.8060, accuracy_m: 6.1, speed_kmh: 22.1, ts: "2026-07-31T07:15:15+03:00", place: "Waiyaki Way" }
    note: "First 4 of 4697 waypoints — 5s sampling interval. Route continues NW toward Westlands."

  # ── Named stops in the completed route ────────────────────────────────────────
  - id: "route_stops"
    session_id: "pts-2026-07-31-001"
    state: viewing
    stops:
      - { name: "Start — Nairobi CBD Office",          lat: -1.2841, lng: 36.8155, arrival: "07:15",  departure: "07:20",  notes: "Morning briefing" }
      - { name: "Stop 1 — Westlands Group Center",     lat: -1.2635, lng: 36.8003, arrival: "08:02",  departure: "09:45",  notes: "Group loan review — 6 clients" }
      - { name: "Stop 2 — Kibera Community Center",    lat: -1.3121, lng: 36.7828, arrival: "10:35",  departure: "12:10",  notes: "Savings collection — 5 clients" }
      - { name: "Stop 3 — Mathare Group Meeting",      lat: -1.2607, lng: 36.8543, arrival: "12:55",  departure: "13:35",  notes: "Loan disbursement — 3 clients" }
      - { name: "End — Nairobi CBD Office",            lat: -1.2841, lng: 36.8155, arrival: "13:45",  departure: null,     notes: "Return" }

  # ── permission_required — Location permission not granted ─────────────────────
  - id: "permission_required"
    state: permission_required
    location_permission_granted: false
    headline: "Location access required"
    body: "Path Tracking needs location access to record your field visit route. Grant permission in your device settings."
    button_label: "Open app settings"
    note: "No reads or writes until permission is granted. Start button hidden; only 'Open app settings' button visible."

  # ── error — GPS signal lost mid-recording ─────────────────────────────────────
  - id: "error_gps_lost"
    state: error
    session_id: "pts-2026-08-01-001"
    status: "paused"
    error_code: "gps_signal_lost"
    error_message: "GPS signal lost — recording paused. Move to an open area and tap Retry to resume."
    last_known_location:
      lat: -1.3121
      lng: 36.7828
      accuracy_m: 42.0
      place: "Kibera (poor GPS coverage)"
    note: "Session automatically paused on GPS loss. Retry re-checks the LocationProvider and resumes recording if signal is restored."
