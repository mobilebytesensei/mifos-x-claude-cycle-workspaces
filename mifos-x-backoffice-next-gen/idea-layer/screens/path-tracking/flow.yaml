feature: path-tracking
entry_points:
  - type: nav_root
    source: nav-shell-assembler
    description: "Field-officer drawer root — visible only when the user holds a field-ops permission code (READ_COLLECTIONSHEET or CREATE_CLIENT). Hidden for admin/super-user personas."

transitions:
  - from: idle
    to: permission_required
    trigger: "on_mount + location permission not granted → show permission rationale"
  - from: permission_required
    to: idle
    trigger: "user grants location permission (on return from OS settings)"
  - from: idle
    to: recording
    trigger: "start_tracking → location permission granted → LocationProvider started → session opened in Room"
  - from: recording
    to: paused
    trigger: "pause_tracking → LocationProvider paused; session status=paused in Room"
  - from: paused
    to: recording
    trigger: "resume_tracking → LocationProvider resumed; status=recording in Room"
  - from: recording
    to: idle
    trigger: "stop_tracking → LocationProvider stopped; session status=completed; history list refreshed"
  - from: paused
    to: idle
    trigger: "stop_tracking → session closed from paused state"
  - from: recording
    to: error
    trigger: "GPS signal lost or LocationProvider failed"
  - from: error
    to: paused
    trigger: "Retry → LocationProvider re-initialized; session stays open"
  - from: idle
    to: viewing
    trigger: "session_row tapped → show historical route map"
  - from: viewing
    to: idle
    trigger: "back navigation → return to history list"
