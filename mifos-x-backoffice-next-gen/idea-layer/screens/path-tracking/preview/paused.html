<!doctype html>
<!-- render-hash: pathtracking-paused-hd01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Path Tracking — paused</title>
<style>
:root {
  --primary:#0091EA;--on-primary:#FFF;--primary-container:#CBE6FF;--on-primary-container:#001E30;
  --secondary:#00796B;--on-secondary:#FFF;--secondary-container:#B8F2E6;--on-secondary-container:#00201A;
  --error:#BA1A1A;--on-error:#FFF;
  --warning:#F57C00;--warning-container:#FFDDB8;--on-warning-container:#2A1700;
  --surface:#FCFCFF;--on-surface:#1A1C1E;
  --surface-variant:#DEE3EB;--on-surface-variant:#42474E;
  --surface-container-low:#F3F4F9;
  --background:#FCFCFF;--outline:#72777F;--outline-variant:#C2C7CF;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  --fs-h3:1.375rem;--fs-body:1rem;--fs-label:0.875rem;
  --fs-caption:0.75rem;--fs-caption-sm:0.6875rem;
  --fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --lh-tight:1.3;--ls-label:0.1px;--ls-caption:0.4px;--ls-wide:0.5px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:9999px;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;
  --el-1:0 1px 2px rgba(0,0,0,.05);--el-2:0 2px 6px rgba(0,0,0,.08);
  --border-w:1px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{
  max-width:360px;margin:0 auto;height:100vh;
  background:var(--background);color:var(--on-surface);
  font-family:var(--font-body);font-size:var(--fs-body);line-height:1.5;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}

.top-bar{
  position:relative;z-index:10;
  display:flex;align-items:center;gap:var(--sp-sm);
  padding:var(--sp-sm) var(--sp-md);
  padding-top:calc(var(--sp-sm) + env(safe-area-inset-top,24px));
  background:var(--surface);
  border-bottom:var(--border-w) solid var(--outline-variant);
  box-shadow:var(--el-2);
}
.top-bar .leading{
  width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-full);color:var(--on-surface-variant);font-size:1.25rem;flex-shrink:0;
}
.top-bar .bar-titles{display:flex;flex-direction:column;flex:1;}
.top-bar .title{
  font-size:var(--fs-h3);font-weight:var(--fw-semibold);line-height:var(--lh-tight);
  color:var(--on-surface);display:flex;align-items:center;gap:var(--sp-sm);
}
.paused-chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 10px;border-radius:var(--r-full);
  background:var(--warning-container);color:var(--on-warning-container);
  font-size:var(--fs-caption);font-weight:var(--fw-semibold);letter-spacing:var(--ls-wide);
  text-transform:uppercase;
}
.top-bar .sub{
  font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--on-surface-variant);
}

/* Map — frosted/dimmed appearance for paused */
.map-wrap{flex:1;position:relative;overflow:hidden;background:#E8EFF5;}
.map-wrap svg{width:100%;height:100%;}
.map-frozen-overlay{
  position:absolute;inset:0;
  background:rgba(252,252,255,.18);pointer-events:none;
}

.control-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:var(--border-w) solid var(--outline-variant);
  box-shadow:0 -4px 16px rgba(0,0,0,.10);
  padding:var(--sp-md);
  display:flex;flex-direction:column;gap:var(--sp-sm);
}
.kpi-row{display:flex;gap:var(--sp-sm);}
.kpi-chip{
  flex:1;background:var(--surface-container-low);
  border:var(--border-w) solid var(--outline-variant);
  border-radius:var(--r-md);padding:var(--sp-xs) var(--sp-sm);
  display:flex;flex-direction:column;align-items:center;
}
.kpi-chip .k-val{font-family:var(--font-mono);font-size:1rem;font-weight:var(--fw-bold);color:var(--on-surface);}
.kpi-chip .k-val.muted{color:var(--on-surface-variant);}
.kpi-chip .k-lbl{font-size:var(--fs-caption-sm);color:var(--on-surface-variant);letter-spacing:var(--ls-caption);}

.paused-note{
  font-size:var(--fs-caption);color:var(--on-surface-variant);
  text-align:center;letter-spacing:var(--ls-caption);padding:0 var(--sp-sm);
}
.paused-note strong{color:var(--on-warning-container);}

.btn-row{display:flex;gap:var(--sp-sm);}
.btn-primary{
  flex:1;display:flex;align-items:center;justify-content:center;gap:var(--sp-xs);
  padding:12px var(--sp-md);
  background:var(--primary);color:var(--on-primary);
  border:none;border-radius:var(--r-xl);
  font-family:var(--font-body);font-size:var(--fs-label);font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-label);cursor:pointer;
}
.btn-stop{
  flex:1;display:flex;align-items:center;justify-content:center;gap:var(--sp-xs);
  padding:12px var(--sp-md);
  background:var(--error);color:var(--on-error);
  border:none;border-radius:var(--r-xl);
  font-family:var(--font-body);font-size:var(--fs-label);font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-label);cursor:pointer;
}
</style>
</head>
<body>

<header class="top-bar">
  <span class="leading">&#8592;</span>
  <div class="bar-titles">
    <div class="title">
      <span>Path Tracking</span>
      <span class="paused-chip">&#9646;&#9646; Paused</span>
    </div>
    <div class="sub">pts-2026-08-01-001 &nbsp;&bull;&nbsp; Westlands Group Center</div>
  </div>
</header>

<!-- Frozen map at Westlands -->
<div class="map-wrap">
  <svg viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <!-- Map background — slightly desaturated for "frozen" feel -->
    <rect width="360" height="460" fill="#EAF0F5"/>

    <!-- Road grid -->
    <line x1="0" y1="195" x2="360" y2="195" stroke="#CED6DF" stroke-width="8"/>
    <line x1="0" y1="240" x2="360" y2="240" stroke="#CED6DF" stroke-width="5"/>
    <line x1="0" y1="310" x2="360" y2="310" stroke="#CED6DF" stroke-width="5"/>
    <line x1="148" y1="0" x2="148" y2="460" stroke="#CED6DF" stroke-width="8"/>
    <line x1="230" y1="0" x2="230" y2="460" stroke="#CED6DF" stroke-width="5"/>
    <line x1="70" y1="0" x2="70" y2="460" stroke="#CED6DF" stroke-width="5"/>
    <line x1="0" y1="160" x2="360" y2="160" stroke="#DAE2EC" stroke-width="3"/>
    <line x1="0" y1="270" x2="360" y2="270" stroke="#DAE2EC" stroke-width="3"/>
    <line x1="110" y1="0" x2="110" y2="460" stroke="#DAE2EC" stroke-width="3"/>

    <!-- Greenery -->
    <rect x="170" y="170" width="48" height="34" rx="4" fill="#C8E6C9" opacity=".6"/>
    <text x="194" y="191" font-size="8" fill="#2E7D32" text-anchor="middle" font-family="system-ui">Park</text>

    <!-- Route so far: CBD→Westlands -->
    <polyline points="196,225 165,205 148,178 130,152 110,128"
      fill="none" stroke="#0091EA" stroke-width="3.5" opacity=".65"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Start marker — CBD -->
    <circle cx="196" cy="225" r="7" fill="#00796B" stroke="white" stroke-width="2"/>
    <circle cx="196" cy="225" r="3" fill="white"/>

    <!-- Frozen current position at Westlands (static, no pulse) -->
    <circle cx="110" cy="128" r="11" fill="#F57C00" opacity=".25"/>
    <circle cx="110" cy="128" r="7" fill="#F57C00" stroke="white" stroke-width="2"/>
    <circle cx="110" cy="128" r="3" fill="white"/>

    <!-- PAUSED label on map -->
    <rect x="70" y="145" width="80" height="18" rx="9" fill="#FFDDB8" stroke="#F57C00" stroke-width="1" opacity=".95"/>
    <text x="110" y="157" font-size="9" fill="#2A1700" text-anchor="middle" font-family="system-ui" font-weight="600">PAUSED HERE</text>

    <!-- Place labels -->
    <text x="200" y="240" font-size="9" fill="#42474E" font-family="system-ui" font-weight="600">Nairobi CBD</text>
    <text x="115" y="122" font-size="9" fill="#0091EA" font-family="system-ui" font-weight="600">Westlands</text>
  </svg>

  <!-- Subtle frozen overlay -->
  <div class="map-frozen-overlay"></div>

  <!-- Control bar -->
  <div class="control-bar">
    <div class="kpi-row">
      <div class="kpi-chip">
        <div class="k-val">00:47:23</div>
        <div class="k-lbl">Elapsed</div>
      </div>
      <div class="kpi-chip">
        <div class="k-val">3.2 km</div>
        <div class="k-lbl">Distance</div>
      </div>
      <div class="kpi-chip">
        <div class="k-val muted">0.0 km/h</div>
        <div class="k-lbl">Speed</div>
      </div>
    </div>
    <div class="paused-note">
      Paused at <strong>Westlands Group Center</strong> &mdash; 08:17 AM
    </div>
    <div class="btn-row">
      <button class="btn-primary">&#9654; Resume</button>
      <button class="btn-stop">&#9632; Stop</button>
    </div>
  </div>
</div>

</body>
</html>
