<!doctype html>
<!-- render-hash: pathtracking-recording-hd01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Path Tracking — recording</title>
<style>
:root {
  --primary:#0091EA;--on-primary:#FFF;--primary-container:#CBE6FF;--on-primary-container:#001E30;
  --secondary:#00796B;--on-secondary:#FFF;--secondary-container:#B8F2E6;--on-secondary-container:#00201A;
  --error:#BA1A1A;--on-error:#FFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --success:#2E7D32;--success-container:#C8E6C9;--on-success-container:#002106;
  --surface:#FCFCFF;--on-surface:#1A1C1E;
  --surface-variant:#DEE3EB;--on-surface-variant:#42474E;
  --surface-container-low:#F3F4F9;--surface-container:#EDEFF4;
  --background:#FCFCFF;--outline:#72777F;--outline-variant:#C2C7CF;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  --fs-h3:1.375rem;--fs-body:1rem;--fs-label:0.875rem;
  --fs-caption:0.75rem;--fs-caption-sm:0.6875rem;
  --fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --lh-tight:1.3;--ls-label:0.1px;--ls-caption:0.4px;--ls-wide:0.5px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:9999px;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;
  --el-1:0 1px 2px rgba(0,0,0,.05);--el-2:0 2px 6px rgba(0,0,0,.08);--el-3:0 8px 24px rgba(0,0,0,.12);
  --border-w:1px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{
  max-width:360px;margin:0 auto;height:100vh;
  background:var(--background);color:var(--on-surface);
  font-family:var(--font-body);font-size:var(--fs-body);line-height:1.5;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ── Top app bar ── */
.top-bar{
  position:relative;z-index:10;
  display:flex;align-items:center;gap:var(--sp-sm);
  padding:var(--sp-sm) var(--sp-md);
  padding-top:calc(var(--sp-sm) + env(safe-area-inset-top,24px));
  background:var(--surface);
  border-bottom:var(--border-w) solid var(--outline-variant);
  box-shadow:var(--el-2);
}
.top-bar .leading{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:var(--r-full);
  color:var(--on-surface-variant);font-size:1.25rem;flex-shrink:0;
}
.top-bar .bar-titles{display:flex;flex-direction:column;flex:1;min-width:0;}
.top-bar .title{
  font-size:var(--fs-h3);font-weight:var(--fw-semibold);line-height:var(--lh-tight);
  color:var(--on-surface);display:flex;align-items:center;gap:var(--sp-xs);
}
.rec-dot{
  width:9px;height:9px;border-radius:50%;background:#BA1A1A;flex-shrink:0;
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.top-bar .sub{
  font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--on-surface-variant);
}

/* ── Map area (full remaining height) ── */
.map-wrap{flex:1;position:relative;overflow:hidden;background:#E8EFF5;}
.map-wrap svg{width:100%;height:100%;}

/* ── Floating control bar ── */
.control-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:var(--border-w) solid var(--outline-variant);
  box-shadow:0 -4px 16px rgba(0,0,0,.10);
  padding:var(--sp-md);
  display:flex;flex-direction:column;gap:var(--sp-sm);
}
.kpi-row{display:flex;gap:var(--sp-sm);}
.kpi-chip{
  flex:1;background:var(--surface-container-low);
  border:var(--border-w) solid var(--outline-variant);
  border-radius:var(--r-md);padding:var(--sp-xs) var(--sp-sm);
  display:flex;flex-direction:column;align-items:center;
}
.kpi-chip .k-val{
  font-family:var(--font-mono);font-size:1rem;font-weight:var(--fw-bold);
  color:var(--on-surface);
}
.kpi-chip .k-lbl{
  font-size:var(--fs-caption-sm);color:var(--on-surface-variant);
  letter-spacing:var(--ls-caption);
}
.btn-row{display:flex;gap:var(--sp-sm);}
.btn-secondary{
  flex:1;display:flex;align-items:center;justify-content:center;gap:var(--sp-xs);
  padding:12px var(--sp-md);
  background:var(--surface);color:var(--primary);
  border:var(--border-w) solid var(--primary);border-radius:var(--r-xl);
  font-family:var(--font-body);font-size:var(--fs-label);font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-label);cursor:pointer;
}
.btn-stop{
  flex:1;display:flex;align-items:center;justify-content:center;gap:var(--sp-xs);
  padding:12px var(--sp-md);
  background:var(--error);color:var(--on-error);
  border:none;border-radius:var(--r-xl);
  font-family:var(--font-body);font-size:var(--fs-label);font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-label);cursor:pointer;
}
</style>
</head>
<body>

<!-- Top app bar -->
<header class="top-bar">
  <span class="leading">&#8592;</span>
  <div class="bar-titles">
    <div class="title">
      <span class="rec-dot"></span>
      Recording
    </div>
    <div class="sub">pts-2026-08-01-001 &nbsp;&bull;&nbsp; Session open</div>
  </div>
</header>

<!-- Map (full height, live polyline CBD→current position at Westlands) -->
<div class="map-wrap">
  <svg viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <!-- Map background -->
    <rect width="360" height="460" fill="#E8EFF5"/>

    <!-- Major road grid - Nairobi schematic -->
    <line x1="0" y1="195" x2="360" y2="195" stroke="#CED6DF" stroke-width="8"/> <!-- Uhuru Hwy -->
    <line x1="0" y1="240" x2="360" y2="240" stroke="#CED6DF" stroke-width="5"/> <!-- Langata Rd -->
    <line x1="0" y1="310" x2="360" y2="310" stroke="#CED6DF" stroke-width="5"/>
    <line x1="148" y1="0" x2="148" y2="460" stroke="#CED6DF" stroke-width="8"/> <!-- Waiyaki Way -->
    <line x1="230" y1="0" x2="230" y2="460" stroke="#CED6DF" stroke-width="5"/> <!-- Thika Rd -->
    <line x1="70" y1="0" x2="70" y2="460" stroke="#CED6DF" stroke-width="5"/>

    <!-- Minor roads -->
    <line x1="0" y1="160" x2="360" y2="160" stroke="#DAE2EC" stroke-width="3"/>
    <line x1="0" y1="270" x2="360" y2="270" stroke="#DAE2EC" stroke-width="3"/>
    <line x1="110" y1="0" x2="110" y2="460" stroke="#DAE2EC" stroke-width="3"/>
    <line x1="295" y1="0" x2="295" y2="460" stroke="#DAE2EC" stroke-width="3"/>

    <!-- Greenery patches -->
    <rect x="170" y="170" width="48" height="34" rx="4" fill="#C8E6C9" opacity=".7"/>
    <text x="194" y="191" font-size="8" fill="#2E7D32" text-anchor="middle" font-family="system-ui">Park</text>

    <!-- ROUTE: CBD(196,225)→Westlands(110,128) — partial live route -->
    <polyline points="196,225 165,205 148,178 130,152 110,128"
      fill="none" stroke="#0091EA" stroke-width="3.5"
      stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Route start marker — CBD -->
    <circle cx="196" cy="225" r="7" fill="#00796B" stroke="white" stroke-width="2"/>
    <circle cx="196" cy="225" r="3" fill="white"/>

    <!-- Current position marker — Westlands (pulsing ring effect) -->
    <circle cx="110" cy="128" r="18" fill="#0091EA" opacity=".15"/>
    <circle cx="110" cy="128" r="12" fill="#0091EA" opacity=".25"/>
    <circle cx="110" cy="128" r="7" fill="#0091EA" stroke="white" stroke-width="2"/>
    <circle cx="110" cy="128" r="3" fill="white"/>

    <!-- Accuracy ring -->
    <circle cx="110" cy="128" r="22" fill="none" stroke="#0091EA" stroke-width="1" opacity=".4"/>

    <!-- Place labels -->
    <text x="200" y="240" font-size="9" fill="#42474E" font-family="system-ui" font-weight="600">Nairobi CBD</text>
    <text x="115" y="122" font-size="9" fill="#0091EA" font-family="system-ui" font-weight="600">Westlands</text>
    <text x="38" y="318" font-size="9" fill="#42474E" font-family="system-ui">Kibera</text>
    <text x="242" y="115" font-size="9" fill="#42474E" font-family="system-ui">Mathare</text>

    <!-- Accuracy label -->
    <rect x="88" y="152" width="92" height="16" rx="8" fill="white" opacity=".85"/>
    <text x="134" y="163" font-size="8" fill="#42474E" text-anchor="middle" font-family="system-ui">&#177;4.8 m  Westlands</text>
  </svg>

  <!-- Floating control bar overlays the map -->
  <div class="control-bar">
    <div class="kpi-row">
      <div class="kpi-chip">
        <div class="k-val">00:47:23</div>
        <div class="k-lbl">Elapsed</div>
      </div>
      <div class="kpi-chip">
        <div class="k-val">3.2 km</div>
        <div class="k-lbl">Distance</div>
      </div>
      <div class="kpi-chip">
        <div class="k-val">4.1 km/h</div>
        <div class="k-lbl">Speed</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-secondary">&#9646;&#9646; Pause</button>
      <button class="btn-stop">&#9632; Stop</button>
    </div>
  </div>
</div>

</body>
</html>
