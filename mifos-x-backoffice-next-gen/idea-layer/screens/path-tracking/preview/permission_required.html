<!doctype html>
<!-- render-hash: pathtracking-permreq-hd01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Path Tracking — permission_required</title>
<style>
:root {
  --primary:#0091EA;--on-primary:#FFF;--primary-container:#CBE6FF;--on-primary-container:#001E30;
  --secondary:#00796B;--on-secondary:#FFF;--secondary-container:#B8F2E6;--on-secondary-container:#00201A;
  --surface:#FCFCFF;--on-surface:#1A1C1E;
  --surface-variant:#DEE3EB;--on-surface-variant:#42474E;
  --surface-container-low:#F3F4F9;--surface-container:#EDEFF4;
  --background:#FCFCFF;--outline:#72777F;--outline-variant:#C2C7CF;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  --fs-h3:1.375rem;--fs-title:1.125rem;--fs-body:1rem;--fs-label:0.875rem;
  --fs-caption:0.75rem;--fs-caption-sm:0.6875rem;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --lh-body:1.5;--lh-tight:1.3;--ls-label:0.1px;--ls-caption:0.4px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:9999px;
  --sp-xs:4px;--sp-sm:8px;--sp-md:16px;--sp-lg:24px;--sp-xl:32px;--sp-xxl:48px;
  --el-1:0 1px 2px rgba(0,0,0,.05);--el-2:0 2px 6px rgba(0,0,0,.08);
  --border-w:1px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;}
body{
  max-width:360px;margin:0 auto;min-height:100vh;
  background:var(--background);color:var(--on-surface);
  font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
}

.top-bar{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:var(--sp-sm);
  padding:var(--sp-sm) var(--sp-md);
  padding-top:calc(var(--sp-sm) + env(safe-area-inset-top,24px));
  background:var(--surface);
  border-bottom:var(--border-w) solid var(--outline-variant);
  box-shadow:var(--el-2);
}
.top-bar .leading{
  width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-full);color:var(--on-surface-variant);font-size:1.25rem;flex-shrink:0;
}
.top-bar .title{font-size:var(--fs-h3);font-weight:var(--fw-semibold);line-height:var(--lh-tight);color:var(--on-surface);}

/* ── Permission required empty state ── */
main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:var(--sp-xl) var(--sp-lg);gap:var(--sp-lg);
  text-align:center;
}

.perm-illustration{
  width:140px;height:140px;
}

.perm-title{
  font-size:var(--fs-title);font-weight:var(--fw-semibold);
  color:var(--on-surface);line-height:var(--lh-tight);
}
.perm-body{
  font-size:var(--fs-body);color:var(--on-surface-variant);
  line-height:var(--lh-body);max-width:280px;
}

.perm-note{
  display:flex;align-items:flex-start;gap:var(--sp-sm);
  background:var(--surface-container-low);
  border:var(--border-w) solid var(--outline-variant);
  border-radius:var(--r-lg);padding:var(--sp-sm) var(--sp-md);
  text-align:left;max-width:300px;
}
.perm-note .n-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
.perm-note .n-text{font-size:var(--fs-caption);color:var(--on-surface-variant);line-height:1.45;}

/* Grayed-out Start button (denied because READ_COLLECTIONSHEET absent) */
.btn-denied{
  display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);
  width:100%;max-width:280px;padding:14px var(--sp-md);
  background:var(--surface-variant);color:var(--on-surface-variant);
  border:none;border-radius:var(--r-xl);
  font-family:var(--font-body);font-size:var(--fs-label);font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-label);cursor:not-allowed;opacity:.65;
}
.btn-outlined{
  display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);
  width:100%;max-width:280px;padding:13px var(--sp-md);
  background:var(--surface);color:var(--primary);
  border:var(--border-w) solid var(--primary);border-radius:var(--r-xl);
  font-family:var(--font-body);font-size:var(--fs-label);font-weight:var(--fw-semibold);
  letter-spacing:var(--ls-label);cursor:pointer;
}
</style>
</head>
<body>

<header class="top-bar">
  <span class="leading">&#8592;</span>
  <span class="title">Path Tracking</span>
</header>

<main>
  <!-- GPS/location permission illustration -->
  <svg class="perm-illustration" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer ring — soft gray -->
    <circle cx="70" cy="70" r="68" fill="#F3F4F9" stroke="#DEE3EB" stroke-width="1.5"/>
    <!-- Map outline shape -->
    <rect x="28" y="40" width="84" height="66" rx="6" fill="#DEE3EB"/>
    <!-- Map fold (top-right corner) -->
    <path d="M96 40 L112 40 L112 56 Z" fill="#C2C7CF"/>
    <!-- Road lines on map -->
    <line x1="40" y1="73" x2="100" y2="73" stroke="#72777F" stroke-width="2.5" stroke-dasharray="6,3"/>
    <line x1="70" y1="50" x2="70" y2="96" stroke="#72777F" stroke-width="2.5" stroke-dasharray="6,3"/>
    <!-- Location pin (locked / dimmed) -->
    <circle cx="70" cy="62" r="18" fill="white" stroke="#DEE3EB" stroke-width="1.5"/>
    <!-- Lock icon in pin -->
    <rect x="62" y="60" width="16" height="12" rx="3" fill="#42474E"/>
    <path d="M65 60 Q65 53 70 53 Q75 53 75 60" fill="none" stroke="#42474E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="70" cy="66" r="2" fill="white"/>
    <!-- Pin tail -->
    <path d="M64 78 Q70 90 76 78" fill="#42474E" stroke="none"/>
    <!-- Cross/denied badge -->
    <circle cx="94" cy="42" r="12" fill="#FFDAD6" stroke="white" stroke-width="2"/>
    <line x1="89" y1="37" x2="99" y2="47" stroke="#BA1A1A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="99" y1="37" x2="89" y2="47" stroke="#BA1A1A" stroke-width="2.5" stroke-linecap="round"/>
  </svg>

  <div class="perm-title">Location access required</div>

  <div class="perm-body">
    Path Tracking needs location access to record your field visit route. Grant permission in your device settings.
  </div>

  <div class="perm-note">
    <span class="n-icon">&#8505;</span>
    <span class="n-text">
      The app only records location during an active route session — never in the background when tracking is off.
    </span>
  </div>

  <!-- Start Route button is hidden in this state (start_button visible_states: [idle]) -->
  <!-- Open app settings — the sole CTA in this state -->
  <a class="btn-outlined" href="#">&#9881; Open App Settings</a>
</main>

</body>
</html>
