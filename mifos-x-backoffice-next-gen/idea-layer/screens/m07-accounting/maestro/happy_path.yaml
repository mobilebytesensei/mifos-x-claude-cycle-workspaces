appId: org.mifos.backoffice
# M07 · Accounting & GL — happy path: land on the accounting workspace, browse the chart of
# accounts + journal history, compose a manual journal entry, add a debit and a credit line,
# and confirm the balance indicator + Post control are present. Every id maps to a ui.yaml testTag.
---
- launchApp
# ── Accounting workspace renders (chart of accounts + journal history) ──
- assertVisible:
    id: "m07-accounting_header"
- assertVisible:
    id: "m07-accounting_content"
# ── A GL account row and a journal entry row are listed ─────────────────
- assertVisible:
    id: "m07-accounting_gl_item"
- assertVisible:
    id: "m07-accounting_journal_item"
# ── Start a manual journal entry (CREATE_JOURNALENTRY persona) ──────────
- assertVisible:
    id: "m07-accounting_start_journal"
- tapOn:
    id: "m07-accounting_start_journal"
# ── Compose balanced debit + credit lines ──────────────────────────────
- assertVisible:
    id: "m07-accounting_add_debit_line"
- tapOn:
    id: "m07-accounting_add_debit_line"
- tapOn:
    id: "m07-accounting_add_credit_line"
# ── The live balance indicator is shown; posting is gated on balance ────
- assertVisible:
    id: "m07-accounting_balance_indicator"
- assertVisible:
    id: "m07-accounting_post_journal"
