feature: m07-accounting

# Fineract-shaped accounting demo data for M07. Mirrors the /v1/glaccounts row envelope
# (id, name, glCode, type{id,value}, usage{id,value}, disabled, organizationRunningBalance)
# grouped into a chart-of-accounts tree, plus the /v1/journalentries history where each entry
# has balanced debit + credit legs, one Pending-checker-approval entry, and one queued-offline
# posting (client-generated idempotency key, no server transactionId yet).

office_scope:
  officeId: 1
  officeName: "Head Office"

gl_types: ["Asset", "Liability", "Equity", "Income", "Expense"]

# ── Chart of accounts (GET /v1/glaccounts) ───────────────────────────────
chart_of_accounts:
  - id: 1
    name: "Cash on Hand"
    glCode: "100001"
    type: "Asset"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: 245000.00
  - id: 2
    name: "Loan Portfolio - Group Loans"
    glCode: "100201"
    type: "Asset"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: 4820000.00
  - id: 3
    name: "Allowance for Loan Losses"
    glCode: "100299"
    type: "Asset"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: -96000.00
  - id: 4
    name: "Member Savings Deposits"
    glCode: "200101"
    type: "Liability"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: 3110500.00
  - id: 5
    name: "Retained Earnings"
    glCode: "300001"
    type: "Equity"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: 1250000.00
  - id: 6
    name: "Interest Income - Loans"
    glCode: "400001"
    type: "Income"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: 588200.00
  - id: 7
    name: "Fee Income - Loan Processing"
    glCode: "400101"
    type: "Income"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: 74300.00
  - id: 8
    name: "Loan Loss Provision Expense"
    glCode: "500201"
    type: "Expense"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: 96000.00
  - id: 9
    name: "Interest Expense - Savings"
    glCode: "500301"
    type: "Expense"
    usage: "Detail"
    disabled: false
    organizationRunningBalance: 41200.00

# ── Journal-entry history (GET /v1/journalentries) — every entry is balanced ──
journal_entries:
  # A posted, balanced manual accrual: Dr Loan Loss Provision Expense / Cr Allowance for Loan Losses
  - transactionId: "JE-2026-55018"
    officeId: 1
    officeName: "Head Office"
    transactionDate: "2026-06-30"
    description: "Month-end loan loss provisioning accrual"
    manualEntry: true
    status: "Posted"
    createdByUserName: "acct.mary"
    debitTotal: 96000.00
    creditTotal: 96000.00
    glEntries:
      - glAccountId: 8
        glCode: "500201"
        glAccountName: "Loan Loss Provision Expense"
        entryType: "DEBIT"
        amount: 96000.00
      - glAccountId: 3
        glCode: "100299"
        glAccountName: "Allowance for Loan Losses"
        entryType: "CREDIT"
        amount: 96000.00

  # A posted, balanced fee-income capture: Dr Cash on Hand / Cr Fee Income
  - transactionId: "JE-2026-55019"
    officeId: 1
    officeName: "Head Office"
    transactionDate: "2026-07-14"
    description: "Loan processing fees collected — CBD branch"
    manualEntry: true
    status: "Posted"
    createdByUserName: "acct.mary"
    debitTotal: 8500.00
    creditTotal: 8500.00
    glEntries:
      - glAccountId: 1
        glCode: "100001"
        glAccountName: "Cash on Hand"
        entryType: "DEBIT"
        amount: 8500.00
      - glAccountId: 7
        glCode: "400101"
        glAccountName: "Fee Income - Loan Processing"
        entryType: "CREDIT"
        amount: 8500.00

  # Pending checker approval (maker-checker queued): Dr Interest Expense / Cr Member Savings
  - transactionId: "JE-2026-55020"
    officeId: 1
    officeName: "Head Office"
    transactionDate: "2026-07-15"
    description: "Quarterly savings interest posting"
    manualEntry: true
    status: "Pending checker approval"
    createdByUserName: "acct.mary"
    commandId: 88213
    debitTotal: 41200.00
    creditTotal: 41200.00
    glEntries:
      - glAccountId: 9
        glCode: "500301"
        glAccountName: "Interest Expense - Savings"
        entryType: "DEBIT"
        amount: 41200.00
      - glAccountId: 4
        glCode: "200101"
        glAccountName: "Member Savings Deposits"
        entryType: "CREDIT"
        amount: 41200.00

  # Queued offline — composed on-device, balanced, awaiting exactly-once replay (no server id yet)
  - transactionId: null
    officeId: 1
    officeName: "Head Office"
    transactionDate: "2026-07-16"
    description: "Manual correction — reclassify misposted cash receipt"
    manualEntry: true
    status: "Queued offline"
    debitTotal: 3200.00
    creditTotal: 3200.00
    queuedOffline: true
    outboxIdempotencyKey: "a1f7c9d2-4b6e-4a80-9c31-7e5b2d0a8f14"
    glEntries:
      - glAccountId: 1
        glCode: "100001"
        glAccountName: "Cash on Hand"
        entryType: "DEBIT"
        amount: 3200.00
      - glAccountId: 6
        glCode: "400001"
        glAccountName: "Interest Income - Loans"
        entryType: "CREDIT"
        amount: 3200.00

# ── A balanced draft being composed in the balancing state (debits == credits) ──
draft_journal_entry:
  officeId: 1
  transactionDate: "2026-07-17"
  paymentTypeId: 1
  debitLines:
    - glAccountId: 1
      glCode: "100001"
      glAccountName: "Cash on Hand"
      amount: 12000.00
  creditLines:
    - glAccountId: 6
      glCode: "400001"
      glAccountName: "Interest Income - Loans"
      amount: 12000.00
  debitTotal: 12000.00
  creditTotal: 12000.00
  isBalanced: true

# ── GL period closures (GET /v1/glclosures) ──────────────────────────────
gl_closures:
  - id: 41
    officeId: 1
    officeName: "Head Office"
    closingDate: "2026-05-31"
    comments: "May 2026 books closed"
    createdByUsername: "acct.mary"

# ── Financial-activity → GL mappings (GET /v1/financialactivityaccounts) ──
financial_activity_accounts:
  - id: 12
    financialActivityId: 100
    financialActivityName: "Asset transfer"
    glAccountId: 1
    glAccountName: "Cash on Hand"
  - id: 13
    financialActivityId: 200
    financialActivityName: "Fund source"
    glAccountId: 4
    glAccountName: "Member Savings Deposits"

