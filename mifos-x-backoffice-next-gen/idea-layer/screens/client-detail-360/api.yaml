feature: client-detail-360

# Client 360: the association-rich client aggregate + the client's accounts, plus the
# client lifecycle command endpoint. Reads are CACHE_FIRST_SWR; mutations route through
# the offline outbox (POST /v1/batches) so they replay exactly-once.

endpoints:
  - id: get_client
    method: GET
    path: "/v1/clients/{clientId}"
    description: >-
      Load the client aggregate — identity (display name, account no, external id), status, office, assigned
      staff, legal form and KYC/datatable associations — in one association-rich call.
    query_params:
      - { name: associations, type: string, required: false }   # all
    response:
      shape: object
      dto: ClientDto
    requires_auth: true
    requires_permission: ["READ_CLIENT"]
    cache: cache_first_swr

  - id: get_client_accounts
    method: GET
    path: "/v1/clients/{clientId}/accounts"
    description: "List every account the client holds — loans, savings and share accounts — with status and balance for the Accounts tab."
    response:
      shape: object
      dto: ClientAccountsDto
    requires_auth: true
    requires_permission: ["READ_CLIENT"]
    cache: cache_first_swr

  - id: client_lifecycle_command
    method: POST
    path: "/v1/clients/{clientId}"
    description: >-
      Client lifecycle command (?command=activate|assignStaff|unassignStaff|close|reject|withdraw|
      proposeTransfer). Only the members permitted for the current status + PermissionSet are exposed.
    query_params:
      - { name: command, type: string, required: true }
    response:
      shape: object
      dto: CommandProcessingResultDto
    requires_auth: true
    requires_permission: ["ACTIVATE_CLIENT"]   # per-command permission gated in the action bar
    idempotency: durable
