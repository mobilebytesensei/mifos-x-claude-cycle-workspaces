* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; }
body { display: flex; flex-direction: column; min-height: 100vh; background-color: var(--surface-container); color: var(--on-surface);
  font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1;
  letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; font-feature-settings: 'liga'; }
main { flex: 1; display: flex; flex-direction: column; }

/* ── shell: detail app-bar (back) ── */
.bo-appbar { display: flex; align-items: center; gap: var(--sp-2); height: 56px; padding: 0 var(--sp-2); padding-top: env(safe-area-inset-top, 0px);
  background-color: var(--surface); color: var(--on-surface); border-bottom: var(--border-thin) solid var(--outline-variant); position: sticky; top: 0; z-index: 90; width: 100%; }

  background: transparent; color: var(--on-surface-variant); cursor: pointer; border-radius: var(--r-full); }
.bo-appbar-btn:hover { background-color: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.bo-appbar-btn:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.bo-appbar-btn svg { width: 24px; height: 24px; fill: currentColor; }
.bo-appbar-title { flex: 1; min-width: 0; font-family: var(--font-display); font-size: var(--fs-title-large); font-weight: var(--fw-semibold);
  line-height: 28px; color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── content ── */
.cd-scroll { flex: 1; display: flex; flex-direction: column; gap: var(--sp-4); padding: var(--sp-4) var(--sp-4) 96px; overflow-y: auto; }

/* Identity header */
.id-card { display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4); border-radius: var(--r-lg); box-shadow: var(--el-2);
  background: linear-gradient(135deg, var(--primary-container), color-mix(in oklch, var(--secondary-container) 65%, var(--primary-container))); border: var(--border-thin) solid var(--outline-variant); }
.id-top { display: flex; align-items: center; gap: var(--sp-3); }
.id-avatar { width: 60px; height: 60px; border-radius: var(--r-full); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
  font-weight: var(--fw-bold); font-size: var(--fs-headline-small); background-color: var(--primary); color: var(--on-primary); box-shadow: var(--el-1); }
.id-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.id-name { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: var(--fw-bold); color: var(--on-primary-container); line-height: var(--lh-tight); }
.id-acct { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--on-primary-container); opacity: 0.86; }
.status-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px var(--sp-2); border-radius: var(--r-full); font-size: var(--fs-micro); font-weight: var(--fw-semibold); align-self: flex-start; }
.status-chip.active { background-color: var(--success-container); color: var(--on-success-container); }
.id-meta { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2) var(--sp-3); padding-top: var(--sp-3); border-top: var(--border-thin) solid color-mix(in srgb, var(--on-primary-container) 18%, transparent); }
.meta { display: flex; flex-direction: column; gap: 1px; }
.meta-lbl { font-size: var(--fs-micro); color: var(--on-primary-container); opacity: 0.74; }
.meta-val { font-size: var(--fs-label-medium); font-weight: var(--fw-medium); color: var(--on-primary-container); }
.meta-val.mono { font-family: var(--font-mono); }

/* Tabs */
.tab-row { display: flex; gap: var(--sp-1); background-color: var(--surface); border: var(--border-thin) solid var(--outline-variant); border-radius: var(--r-full); padding: 4px; box-shadow: var(--el-1); }
.tab { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border-radius: var(--r-full); border: none;
  background: transparent; color: var(--on-surface-variant); font-family: var(--font-body); font-size: var(--fs-label); font-weight: var(--fw-medium); cursor: pointer; }
.tab.on { background-color: var(--secondary-container); color: var(--on-secondary-container); font-weight: var(--fw-semibold); }
.tab:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.tab .material-symbols-outlined { font-size: 18px; }

.acct-group { display: flex; flex-direction: column; gap: var(--sp-2); }
.group-head { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-1); }
.group-title { font-size: var(--fs-meta); font-weight: var(--fw-semibold); letter-spacing: 0.5px; text-transform: uppercase; color: var(--on-surface-variant); }
.group-total { font-family: var(--font-mono); font-size: var(--fs-meta); font-weight: var(--fw-bold); color: var(--on-surface); }
.acct-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); background-color: var(--surface);
  border: var(--border-thin) solid var(--outline-variant); border-radius: var(--r-md); box-shadow: var(--el-1); text-decoration: none; color: inherit; cursor: pointer;
  transition: box-shadow var(--dur-short) var(--ease-standard); }
.acct-row:hover { box-shadow: var(--el-2); }
.acct-row:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.acct-ic { width: 40px; height: 40px; border-radius: var(--r-md); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; }
.acct-ic.loan { background-color: var(--primary-container); color: var(--on-primary-container); }
.acct-ic.sav { background-color: var(--secondary-container); color: var(--on-secondary-container); }
.acct-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.acct-name { font-size: var(--fs-body); font-weight: var(--fw-semibold); color: var(--on-surface); }
.acct-sub { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--on-surface-variant); }
.acct-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }

.mini-chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: var(--r-full); font-size: var(--fs-micro); font-weight: var(--fw-semibold); }
.mini-chip.active { background-color: var(--success-container); color: var(--on-success-container); }
.mini-chip.closed { background-color: var(--surface-variant); color: var(--on-surface-variant); }
.empty-shares { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-meta); color: var(--on-surface-variant);
  background-color: var(--surface); border: var(--border-thin) dashed var(--outline-variant); border-radius: var(--r-md); }

/* Sticky action bar */
.action-bar { position: sticky; bottom: 0; display: flex; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); background-color: var(--surface);
  border-top: var(--border-thin) solid var(--outline-variant); box-shadow: var(--el-3); z-index: 80; }
.btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 var(--sp-4); border-radius: var(--r-xl);
  font-family: var(--font-body); font-size: var(--fs-label); font-weight: var(--fw-semibold); cursor: pointer; border: var(--border-thin) solid transparent; }
.btn .material-symbols-outlined { font-size: 20px; }
.btn.primary { background-color: var(--primary); color: var(--on-primary); box-shadow: var(--el-1); }
.btn.secondary { background-color: var(--secondary-container); color: var(--on-secondary-container); }
.btn:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.btn[aria-disabled="true"] { opacity: 0.38; cursor: not-allowed; background-color: var(--surface-variant); color: var(--on-surface-variant); box-shadow: none; }

/* ── shell: bottom-nav ── */
.bo-bottom-nav { display: flex; align-items: center; justify-content: space-around; height: 72px; padding: 0 var(--sp-1); padding-bottom: env(safe-area-inset-bottom, 0px);
  background-color: var(--surface); border-top: var(--border-thin) solid var(--outline-variant); position: sticky; bottom: 0; z-index: 100; margin-top: auto; width: 100%; box-shadow: var(--el-1); }
.bo-nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: inherit; flex: 1; gap: var(--sp-1);

.bo-nav-icon { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; }
.bo-nav-label { font-family: var(--font-body); font-size: var(--fs-label-medium); font-weight: var(--fw-medium); line-height: 16px; letter-spacing: 0.5px; position: relative; z-index: 1; white-space: nowrap; }

.bo-nav-item:not(.bo-nav-active) .bo-nav-indicator { display: none; }
