schema_version: v1.0.0
feature: client-detail-360
# Re-verified 2026-07-31 (/idea-test-generate --regenerate) against the current ui.yaml + api.yaml —
# coverage: one scenario per ui.yaml state (loading/content/empty/error) + per on_click
# (select_tab, open_loan, activate_client, assign_staff, retry) + the get_client +
# get_client_accounts + client_lifecycle_command operations, incl. accounts-degrade + outbox replay.
# Grounded in demo-data (Grace Wanjiru Mwangi, loans 55231/55890 + savings 78012/78455, KES balances).
# 2026-07-30 ui/api touch was an mtime re-stamp.
scenarios:
  - id: loading_shows_identity_accounts_shimmer
    preconditions: ["a clientId is opened", "the client aggregate has not resolved yet"]
    actions: ["open a client from the M02 list"]
    assertions: ["the loading state shows an identity + accounts shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_identity_tabs_accounts
    preconditions: ["the client aggregate + accounts resolve", "the user holds READ_CLIENT"]
    actions: ["open the client"]
    assertions:
      - "the header shows display name, account no, status chip, office and assigned staff"
      - "the Accounts tab lists loans, savings and shares with balances"
      - "only lifecycle actions permitted for the status AND held are shown"
    priority: high
  - id: empty_when_client_not_found
    preconditions: ["the clientId resolves to no client"]
    actions: ["open the client"]
    assertions: ["a not-found panel is shown with a back affordance"]
    priority: low
  - id: error_when_client_load_fails_no_cache
    preconditions: ["the client failed to load and no cache is available"]
    actions: ["open the client"]
    assertions: ["the error state is shown", "Retry re-reads the aggregate + accounts"]
    priority: medium
  - id: accounts_failure_degrades_to_strip
    preconditions: ["the client aggregate loads but the accounts fetch times out"]
    actions: ["open the client", "switch to the Accounts tab"]
    assertions: ["the Accounts tab shows an inline retry strip", "the identity header still renders", "the whole-screen error is NOT shown"]
    priority: high
  - id: account_row_drills_into_detail
    preconditions: ["the Accounts tab shows a loan row"]
    actions: ["tap the loan account row"]
    assertions: ["navigation goes to loan-detail for that account (savings/shares open their own detail)"]
    priority: high
  - id: activate_enqueues_through_outbox
    preconditions: ["a pending client is open", "the user holds ACTIVATE_CLIENT"]
    actions: ["tap Activate", "confirm"]
    assertions:
      - "the activate command is enqueued to the offline outbox with a durable idempotency key"
      - "the next sync replays POST /v1/clients/{clientId}?command=activate"
      - "the status chip flips to Active on success"
    priority: high
  - id: assign_staff_gated_by_permission
    preconditions: ["a client is open"]
    actions: ["inspect the action bar"]
    assertions: ["Assign staff is shown only when ASSIGNSTAFF_CLIENT is held"]
    priority: medium
  - id: tab_switch_over_loaded_associations
    preconditions: ["the client aggregate + accounts have resolved"]
    actions: ["switch between the General, Accounts and Notes tabs"]
    assertions:
      - "each tab renders from the already-loaded associations with no refetch"
      - "General shows address/family/identifiers; Accounts lists loans/savings/shares; Notes shows notes"
    priority: medium
