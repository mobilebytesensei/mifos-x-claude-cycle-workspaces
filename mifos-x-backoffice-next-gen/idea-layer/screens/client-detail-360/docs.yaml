feature: client-detail-360
status: draft
cluster: clients
module: m02-clients
priority: must_have
new_infra: false
is_primary_flow: true
has_ui: true
has_api: true
has_server: false
archetype: detail
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
  - fineract-auth-session
acceptance_refs:
  - >-
    The client 360 shows identity/KYC, status and office, and every account the client holds (loans,
    savings, shares) with balances; lifecycle actions (activate, assign staff, close, transfer) are
    permission-gated and enqueue through the offline outbox; each account drills into its own detail.
plan_ref: idea-plan.yaml#features[client-detail-360]
summary: >-
  The 360° client profile drilled into from the M02 clients list (open_client_360). Loads
  GET /v1/clients/{clientId}?associations=all plus GET /v1/clients/{clientId}/accounts into an identity
  header (display name, account no, external id, status chip, office, assigned staff, KYC/legal form) over a
  tabbed body — General (address, family, identifiers/datatables) · Accounts (loans, savings, shares with
  balances) · Notes/Documents. A permission-gated action bar exposes the client lifecycle commands
  (?command=activate|assignStaff|close|reject|withdraw|proposeTransfer). Each account row drills into
  loan-detail (or the savings/shares detail). Reads are cache-first so the client opens offline; lifecycle
  mutations route through the offline outbox with a durable idempotency key.
vm_actions:
  - OnLoad
  - OnTabSelected
  - OnOpenLoan
  - OnActivateClient
  - OnAssignStaff
  - OnCloseClient
  - OnAddNote
  - OnRetry
error_cases:
  - client_not_found
  - client_load_failed
  - accounts_load_failed
  - action_not_permitted
scaffolded_by: /idea-plan-add
