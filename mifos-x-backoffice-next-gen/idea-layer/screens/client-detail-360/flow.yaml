feature: client-detail-360

entry_points:
  - type: direct
    description: "Opened from the M02 clients list row (open_client_360) for a selected clientId."
  - type: from_notification
    description: "A client-transfer-proposed / KYC alert in the needs-attention inbox drills into this client."

transitions:
  - from: loading
    to: content
    trigger: "the client aggregate + accounts resolve (cache-first)"
  - from: loading
    to: empty
    trigger: "the clientId resolves to no client (deleted / wrong id)"
  - from: loading
    to: error
    trigger: "the client failed to load and no cache is available"

  - from: content
    to: content
    trigger: "a body tab is selected, or a lifecycle action is enqueued and identity/accounts update in place"
  - from: content
    to: loan-detail
    trigger: "a loan account row is tapped (savings/shares rows open their own detail)"

  - from: error
    to: loading
    trigger: "'Retry' tapped — re-reads the client aggregate + accounts"
