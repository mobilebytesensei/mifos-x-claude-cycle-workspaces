<style>
:root {

  --surface-container-lowest: #0F1113; --surface-container-low: #1A1C1E; --surface-container: #1E2022;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; }
body {
  display: flex; flex-direction: column; min-height: 100vh;
  background: var(--background); color: var(--on-surface);
  font-family: var(--font-body); font-size: var(--fs-body-medium); line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1; letter-spacing: normal; display: inline-block; white-space: nowrap; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.2px; }

header[data-shell="top-app-bar"] {
  display: flex; align-items: center; gap: var(--sp-2);
  height: 56px; padding: 0 var(--sp-2); padding-top: env(safe-area-inset-top, 0px);
  background: var(--surface); color: var(--on-surface);
  border-bottom: var(--border-thin) solid var(--outline-variant);
  position: sticky; top: 0; z-index: 90; width: 100%; box-shadow: var(--el-1);
}
.appbar-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
  min-width: 44px; border: none; background: transparent; color: var(--on-surface-variant);
  cursor: pointer; border-radius: var(--r-full); }
.appbar-btn:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.appbar-btn:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }
.appbar-title { flex: 1; min-width: 0; font-family: var(--font-display); font-size: var(--fs-title-large);
  font-weight: var(--fw-semibold); line-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main[data-shell="content"] {
  flex: 1; display: flex; flex-direction: column; gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-4) calc(var(--sp-8) * 2.6 + env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 100%;
}

.card { background: var(--surface-container-low); border: var(--border-thin) solid var(--outline-variant);
  border-radius: var(--r-lg); box-shadow: var(--el-1); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 48px; padding: 0 var(--sp-5); border: none; border-radius: var(--r-full);
  font: inherit; font-size: var(--fs-label-large); font-weight: var(--fw-semibold); cursor: pointer;
  letter-spacing: .2px; }
.btn .material-symbols-outlined { font-size: 20px; }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--el-1); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:focus-visible { outline: var(--border-focus) solid var(--on-primary); outline-offset: -4px; }
.btn-ghost { background: var(--surface-container); color: var(--on-surface-variant);
  border: var(--border-thin) solid var(--outline-variant); }
.btn-ghost:hover { background: var(--surface-container-high); }
.btn-ghost:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: 2px; }

nav[data-shell="bottom-nav"] { display: flex; align-items: stretch; justify-content: space-around;
  height: 72px; padding: 0 var(--sp-1) env(safe-area-inset-bottom, 0px);
  background: var(--surface); border-top: var(--border-thin) solid var(--outline-variant);
  position: sticky; bottom: 0; z-index: 100; width: 100%; box-shadow: var(--el-2); }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1);
  flex: 1; text-decoration: none; color: var(--on-surface-variant); cursor: pointer; position: relative;
  border-radius: var(--r-sm); min-height: 48px; }
.nav-item .ind { position: absolute; top: 10px; width: 56px; height: 30px; border-radius: var(--r-full);
  background: var(--primary-container); opacity: 0; }
.nav-item .material-symbols-outlined { font-size: 24px; position: relative; z-index: 1; }
.nav-item .lbl { font-size: var(--fs-label-medium); font-weight: var(--fw-medium); position: relative; z-index: 1; }
.nav-item[aria-current="page"] { color: var(--primary); }
.nav-item[aria-current="page"] .ind { opacity: 1; }
.nav-item[aria-current="page"] .material-symbols-outlined { color: var(--on-primary-container); }
.nav-item[aria-current="page"] .lbl { font-weight: var(--fw-bold); }
.nav-item:focus-visible { outline: var(--border-focus) solid var(--primary); outline-offset: -2px; }

/* ---- error state panel ---- */
.state-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: var(--sp-8) var(--sp-5); gap: var(--sp-4); }
.state-card { display: flex; flex-direction: column; align-items: center; gap: var(--sp-4);
  padding: var(--sp-6) var(--sp-5); border-radius: var(--r-xl); background: var(--surface-container-lowest);
  border: var(--border-thin) solid var(--outline-variant); box-shadow: var(--el-2); max-width: 360px; width: 100%; }
.state-icon { width: 96px; height: 96px; min-width: 96px; border-radius: var(--r-full); display: flex;
  align-items: center; justify-content: center; box-shadow: var(--el-1);
  background: var(--error-container); color: var(--on-error-container); }
.state-icon .material-symbols-outlined { font-size: 48px; }
.state-title { font-family: var(--font-display); font-size: var(--fs-headline-small); font-weight: var(--fw-bold);
  color: var(--on-surface); line-height: 1.2; }
.state-msg { font-size: var(--fs-body-medium); color: var(--on-surface-variant); line-height: 1.5; max-width: 300px; }
.state-code { display: inline-flex; align-items: center; gap: var(--sp-1); margin-top: var(--sp-1);
  padding: var(--sp-1) var(--sp-3); border-radius: var(--r-full); background: var(--error-container);
  color: var(--on-error-container); font-size: var(--fs-label-small); font-weight: var(--fw-semibold); }
.state-actions { display: flex; flex-direction: column; gap: var(--sp-2); width: 100%; margin-top: var(--sp-2); }
.state-actions .btn { width: 100%; }
.retry-hint { display: flex; align-items: center; justify-content: center; gap: var(--sp-1);

.retry-hint .material-symbols-outlined { font-size: 16px; }
</style>

<body>
<div data-shell="root" data-screen-id="loan-detail" data-state="error">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="ld_header">
    <button class="appbar-btn" data-action="OnBackTapped" data-nav-to="m04-loan-portfolio" aria-label="Back"><span class="material-symbols-outlined">arrow_back</span></button>
    <h1 class="appbar-title">Loan summary</h1>
  </header>

  <main data-shell="content" data-state="error">
    <div class="state-wrap">
      <section class="state-card" data-component-type="Card" data-component-variant="elevated" data-component-id="ld_error_panel" aria-label="Failed to load loan">
        <div class="state-icon" aria-hidden="true"><span class="material-symbols-outlined">cloud_off</span></div>
        <div class="state-title">Couldn't load this loan</div>
        <p class="state-msg">We couldn't reach the loan aggregate and there's no cached copy on this device. Check your connection, then try again.</p>
        <span class="state-code">Error <span class="num">LD-AGG-503</span></span>
        <div class="state-actions">
          <button class="btn btn-primary" data-component-type="Button" data-component-variant="primary" data-component-id="ld_error_retry"
                  data-action="retry" data-action-id="OnRetry" aria-label="Retry — re-reads the loan aggregate">
            <span class="material-symbols-outlined" aria-hidden="true">refresh</span>Retry
          </button>
          <div class="retry-hint"><span class="material-symbols-outlined" aria-hidden="true">sync</span>Re-reads the loan aggregate, cache-first</div>
        </div>
      </section>
    </div>
  </main>

  <nav data-shell="bottom-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-item" data-nav-item data-nav-to="m01-dashboard" aria-current="page" aria-label="Home, selected">

    <a class="nav-item" data-nav-item data-nav-to="m02-clients" aria-label="Clients">
      <span class="ind" aria-hidden="true"></span><span class="material-symbols-outlined">group</span><span class="lbl">Clients</span></a>
    <a class="nav-item" data-nav-item data-nav-to="m06-collections" aria-label="Collections">
      <span class="ind" aria-hidden="true"></span><span class="material-symbols-outlined">receipt_long</span><span class="lbl">Collections</span></a>
    <a class="nav-item" data-nav-item data-nav-to="m17-sync-settings" aria-label="Sync">
      <span class="ind" aria-hidden="true"></span><span class="material-symbols-outlined">sync</span><span class="lbl">Sync</span></a>
  </nav>

</div>
