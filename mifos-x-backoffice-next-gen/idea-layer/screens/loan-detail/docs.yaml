feature: loan-detail
status: designed
cluster: portfolio
module: m04-loan-portfolio
priority: must_have
new_infra: false
is_primary_flow: true
has_ui: true
has_api: true
has_server: false
archetype: detail
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
  - fineract-auth-session
acceptance_refs:
  - >-
    Opening a loan shows summary (status, outstanding, next due), the repayment schedule, the transaction ledger, and
    permission-gated lifecycle actions (approve, disburse, make repayment, undo, foreclose); each action posts through
    the offline outbox with a durable idempotency key.
plan_ref: idea-plan.yaml#features[loan-detail]
summary: >-
  The single-loan account detail surface drilled into from the M01 dashboard "quick take repayment" tile and the M04
  loan-portfolio list. Loads GET /v1/loans/{loanId}?associations=all into a summary header (client, product, principal,
  status, outstanding, arrears, next installment), a tabbed body — Repayment schedule (GET .../repaymentschedule) ·
  Transactions ledger (GET .../transactions) · Loan details — and a permission-gated action bar whose members map to the
  Fineract loan command endpoints (?command=approve|disburse|repayment|undoapproval|foreclosure|writeoff). Every
  mutating action is enqueued to the offline outbox (durable idempotency key → POST /v1/batches on next sync), so a
  repayment captured in the field replays exactly-once. Amounts, arrears and the schedule read cache-first so the loan
  opens offline.
vm_actions:
  - OnLoad
  - OnTabSelected
  - OnMakeRepayment
  - OnApproveLoan
  - OnDisburseLoan
  - OnUndoApproval
  - OnForeclose
  - OnOpenClient
  - OnRetry
error_cases:
  - loan_not_found
  - loan_load_failed
  - action_not_permitted
  - repayment_post_failed
scaffolded_by: /idea-plan-add
status_history:
  - from: draft
    to: designed
    at: '2026-07-26T05:48:28.922Z'
    by: /idea-feature-stitch
