feature: loan-detail
status: approved
cluster: portfolio
module: m04-loan-portfolio
priority: must_have
new_infra: false
is_primary_flow: true
has_ui: true
has_api: true
has_server: false
archetype: detail
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
  - fineract-auth-session
acceptance_refs:
  - >-
    Opening a loan shows summary (status, outstanding, next due), the repayment schedule, the transaction ledger, and
    permission-gated lifecycle actions (approve, disburse, make repayment, undo, foreclose); each action posts through
    the offline outbox with a durable idempotency key.
plan_ref: idea-plan.yaml#features[loan-detail]
summary: >-
  The single-loan account detail surface drilled into from the M01 dashboard "quick take repayment" tile and the M04
  loan-portfolio list. Loads GET /v1/loans/{loanId}?associations=all into a summary header (client, product, principal,
  status, outstanding, arrears, next installment), a tabbed body — Repayment schedule (GET .../repaymentschedule) ·
  Transactions ledger (GET .../transactions) · Loan details — and a permission-gated action bar whose members map to the
  Fineract loan command endpoints (?command=approve|disburse|repayment|undoapproval|foreclosure|writeoff). Every
  mutating action is enqueued to the offline outbox (durable idempotency key → POST /v1/batches on next sync), so a
  repayment captured in the field replays exactly-once. Amounts, arrears and the schedule read cache-first so the loan
  opens offline.
metadata:
  category: back-office-domain
  implementation_ready: true
  impl_ready_at: '2026-07-31T00:00:00Z'
  impl_ready_schema: v2
contracts:
  - capability: loan_aggregate_read
    platform_spec: >-
      GET /v1/loans/{loanId}?associations=all read cache-first through a Store5 SourceOfTruth over Room
      (loan_cache) — the summary (client, product, status, principal, outstanding, arrears, next installment),
      the amortised repayment schedule and the transactions ledger hydrate in one association-rich call and
      persist to loan_cache so the loan opens offline under CACHE_FIRST_SWR; a stale entry renders immediately
      with a background-refreshing badge while SWR revalidates.
    permission: READ_LOAN
    error_cases:
      - loan_not_found
      - loan_load_failed
  - capability: loan_lifecycle_command
    platform_spec: >-
      POST /v1/loans/{loanId}?command=approve|disburse|undoapproval|foreclosure — the action bar exposes only the
      commands permitted for the current loan status AND held in the PermissionSet; each command is written to the
      draft_outbox Room table with a fresh durable idempotency key (action=APPROVE_LOAN|DISBURSE_LOAN|UNDO_LOAN|
      FORECLOSE_LOAN, entity=LOAN) and replayed exactly-once via POST /v1/batches by the offline-sync-engine;
      maker-checker aware (a queued command lands as PENDING_APPROVAL rather than posting immediately).
    permission: APPROVE_LOAN
    error_cases:
      - action_not_permitted
      - command_rejected
      - command_pending_approval
  - capability: loan_servicing_transaction
    platform_spec: >-
      POST /v1/loans/{loanId}/transactions?command=repayment captures a field repayment against the loan; the draft
      is written to draft_outbox with a DURABLE idempotency key generated at capture and reused on retry so it
      replays EXACTLY ONCE across connectivity flap / crash / reinstall (zero double-post); the repayment schedule
      and outstanding balance update on successful sync. A rejected replay routes to needs-attention-inbox, never
      silently dropped.
    permission: REPAYMENT_LOAN
    error_cases:
      - repayment_post_failed
      - transaction_offline_queued
libraries:
  - capability: loan_aggregate_read
    library: org.mobilenativefoundation.store.store5
    version: 5.x
    targets:
      - android
      - ios
      - desktop
  - capability: loan_aggregate_read
    library: androidx.room
    version: 3.x
    targets:
      - android
      - ios
      - desktop
  - capability: loan_aggregate_read
    library: cmp-network-monitor
    version: latest
    targets:
      - android
      - ios
      - desktop
  - capability: loan_lifecycle_command
    library: openMF Fineract Client KMP SDK
    version: latest
    targets:
      - android
      - ios
      - desktop
  - capability: loan_servicing_transaction
    library: kotlinx-serialization
    version: 1.7.x
    targets:
      - android
      - ios
      - desktop
vm_actions:
  - name: OnLoad
    signature: "private fun onLoad(loanId: String)"
    state_mutations:
      - uiState=Loading
      - uiState=Content(loan, schedule, transactions) | Empty | Error
      - permittedActions=<resolved from PermissionSet ∩ loan status>
    side_effects:
      - LoanDetailStore.stream(loanId, CACHE_FIRST_SWR)
      - PermissionEvaluator.evaluate(loanActions, loan.status)
    error_handling:
      LoanNotFound: uiState=Empty; show not-found panel with back affordance
      NetworkError: uiState=Content from cache if present else Error; offer Retry
  - name: OnTabSelected
    signature: 'private fun onTabSelected(tab: LoanDetailTab)'
    state_mutations:
      - selectedTab=<Schedule | Transactions | Details>
    side_effects: []
    error_handling: {}
  - name: OnMakeRepayment
    signature: 'private fun onMakeRepayment(loanId: String, payload: RepaymentPayload)'
    state_mutations:
      - uiState=Content (optimistic pending repayment)
    side_effects:
      - DraftDao.enqueue(REPAYMENT_LOAN, entity=LOAN, loanId, payload, DURABLE idempotencyKey)
    error_handling:
      RepaymentPostFailed: route entry to needs-attention-inbox; keep draft
      Offline: stays queued; auto-drains on connectivity regain (exactly-once)
  - name: OnApproveLoan
    signature: 'private fun onApproveLoan(loanId: String)'
    state_mutations:
      - uiState=Content (command submitting)
      - permittedActions=<recomputed on status change>
    side_effects:
      - DraftDao.enqueue(APPROVE_LOAN, entity=LOAN, loanId, payload, DURABLE idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
      Queued: row 'Submitted for approval' (maker-checker → PENDING_APPROVAL)
  - name: OnDisburseLoan
    signature: 'private fun onDisburseLoan(loanId: String)'
    state_mutations:
      - uiState=Content (command submitting)
      - permittedActions=<recomputed on status change>
    side_effects:
      - DraftDao.enqueue(DISBURSE_LOAN, entity=LOAN, loanId, payload, DURABLE idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
      ActionNotPermitted: hide/disable when status != approved or DISBURSE_LOAN absent
  - name: OnUndoApproval
    signature: 'private fun onUndoApproval(loanId: String)'
    state_mutations:
      - uiState=Content (command submitting)
      - permittedActions=<recomputed on status revert>
    side_effects:
      - DraftDao.enqueue(UNDO_LOAN, entity=LOAN, loanId, payload, DURABLE idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
      DurableKeyGuard: durable idempotency key prevents a double-reverse on retry
  - name: OnForeclose
    signature: 'private fun onForeclose(loanId: String, payload: ForeclosurePayload)'
    state_mutations:
      - uiState=Content (command submitting)
    side_effects:
      - DraftDao.enqueue(FORECLOSE_LOAN, entity=LOAN, loanId, payload, DURABLE idempotencyKey)
    error_handling:
      CommandRejected: route to needs-attention-inbox
  - name: OnOpenClient
    signature: 'private fun onOpenClient(clientId: String)'
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToClientDetail360(clientId))
    error_handling: {}
  - name: OnRetry
    signature: "private fun onRetry(loanId: String)"
    state_mutations:
      - uiState=Loading
      - uiState=Content | Error
    side_effects:
      - LoanDetailStore.stream(loanId).refreshFresh()
    error_handling:
      NetworkError: uiState=Error; keep last inputs; offer Retry again
error_cases:
  - loan_not_found
  - loan_load_failed
  - action_not_permitted
  - command_rejected
  - command_pending_approval
  - repayment_post_failed
  - transaction_offline_queued
