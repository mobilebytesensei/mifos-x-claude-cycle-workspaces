feature: loan-detail

participates_in_flows:
  - loan-lifecycle

entry_points:
  - type: direct
    description: "Opened from the M04 loan-portfolio list row (open_loan_detail) for a selected loanId."
  - type: direct
    description: "Opened from the M01 dashboard 'quick take repayment' tile, deep-linked to the loan pre-selected on the Schedule tab."
  - type: from_notification
    description: "A loan-approved / repayment-due alert in the needs-attention inbox drills straight into this loan."

transitions:
  - from: loading
    to: content
    trigger: "the loan aggregate resolves (cache-first) with associations"
  - from: loading
    to: empty
    trigger: "the loanId resolves to no account (deleted / wrong id)"
  - from: loading
    to: error
    trigger: "the loan failed to load and no cache is available"

  - from: content
    to: content
    trigger: "a body tab is selected, or a lifecycle action is enqueued and the summary/schedule update in place"
  - from: content
    to: client-detail-360
    trigger: "the client link in the summary header is tapped"

  - from: error
    to: loading
    trigger: "'Retry' tapped — re-reads the loan aggregate"
