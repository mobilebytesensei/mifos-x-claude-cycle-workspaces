schema_version: v1.0.0
feature: loan-detail
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/empty/error)
# + per api operation (get_loan, post_repayment, loan_lifecycle_command).
scenarios:
  # ── state coverage ──
  - id: loading_shows_summary_schedule_shimmer
    preconditions: ["a loanId is opened", "the loan aggregate has not resolved yet"]
    actions: ["open a loan from the M04 list"]
    assertions: ["the loading state shows a summary + schedule shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_summary_tabs_and_actions
    preconditions: ["the loan aggregate resolves with associations", "the user holds READ_LOAN"]
    actions: ["open the loan"]
    assertions:
      - "the summary header shows client, product, status chip, outstanding, arrears and next due"
      - "the body offers Schedule / Transactions / Details tabs"
      - "only lifecycle actions permitted for the status AND held by the PermissionSet are shown"
    priority: high
  - id: empty_when_loan_not_found
    preconditions: ["the loanId resolves to no account (deleted / wrong id)"]
    actions: ["open the loan"]
    assertions: ["a not-found panel is shown with a back affordance"]
    priority: low
  - id: error_when_load_fails_no_cache
    preconditions: ["the loan failed to load and no cache is available"]
    actions: ["open the loan"]
    assertions: ["the error state is shown", "Retry re-reads the aggregate"]
    priority: medium
  # ── endpoint / behavior coverage ──
  - id: get_loan_reads_cache_first
    preconditions: ["the device is offline", "the loan was previously viewed"]
    actions: ["open the loan offline"]
    assertions: ["the loan renders from cache (CACHE_FIRST_SWR)", "a background-refreshing badge is shown when stale"]
    priority: high
  - id: repayment_enqueues_durable_idempotency
    preconditions: ["an active loan is open", "the user holds REPAYMENT_LOAN"]
    actions: ["tap Make repayment", "enter an amount", "confirm"]
    assertions:
      - "the repayment is enqueued to the offline outbox with a FRESH durable idempotency key"
      - "the next sync replays it via POST /v1/loans/{loanId}/transactions?command=repayment through POST /v1/batches"
      - "the schedule and outstanding update on success"
    priority: high
  - id: approve_disburse_gated_by_status_and_permission
    preconditions: ["a pending-approval loan is open"]
    actions: ["inspect the action bar"]
    assertions: ["Approve is shown only when APPROVE_LOAN is held", "Disburse appears only after the loan is approved and DISBURSE_LOAN is held"]
    priority: high
  - id: client_link_drills_to_360
    preconditions: ["a loan is open"]
    actions: ["tap the client link in the summary header"]
    assertions: ["navigation goes to client-detail-360 for the owning client"]
    priority: medium
