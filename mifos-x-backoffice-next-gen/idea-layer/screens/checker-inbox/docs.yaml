feature: checker-inbox
status: designed
cluster: approvals
module: m15-approvals-makerchecker
priority: must_have
new_infra: false
is_primary_flow: true
has_ui: true
has_api: true
has_server: false
archetype: list
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - offline-sync-engine
  - fineract-auth-session
acceptance_refs:
  - >-
    The self-scoped maker-checker inbox lists queued commands the signed-in user can approve/reject; each row shows
    action, entity, maker and made-on; approve/reject/delete post through the offline outbox; rows the user is NOT
    authorized to check show no action controls; nothing is silently dropped.
plan_ref: idea-plan.yaml#features[checker-inbox]
summary: >-
  The dedicated maker-checker approvals inbox (M15) drilled into from the M01 dashboard "checker inbox" tile. Loads GET
  /v1/makercheckers (self-scoped to entries this user canCheck({action},{entity}) or CHECKER_SUPER_USER) into a
  filterable list — filter chips by entity (Loan · Client · Savings · GL · …) and by action (create/approve/disburse).
  Each row shows the queued command's action, entity, maker, made-on date and the command JSON summary, and taps open
  the command detail. Inline Approve / Reject post POST /v1/makercheckers/{auditId}?command=approve|reject, and Delete
  removes a withdrawn command — all enqueued through the offline outbox with a durable idempotency key so a checker
  working offline commits exactly-once on the next sync. Rows the user cannot check render read-only. Distinct from
  needs-attention-inbox (which aggregates four sources); this is the pure approvals queue.
metadata:
  category: crud
  implementation_ready: true
  impl_ready_at: '2026-07-31T00:00:00Z'
  impl_ready_schema: v2
contracts: []
libraries: []
vm_actions:
  - name: LoadInbox
    signature: private fun loadInbox()
    state_mutations:
      - uiState=Loading
      - entries=<self-scoped queue from Store5>
      - uiState=Content | Empty
    side_effects:
      - MakerCheckerStore.stream(cacheFirst)
      - PermissionEvaluator.canCheck(action,entity) per row
    error_handling:
      InboxLoadFailed: uiState=Error when no usable cache; offer Retry
      CacheStale: serve cached rows, revalidate in background per FreshnessBands
  - name: FilterByEntity
    handles: filter_entity
    signature: 'private fun onFilterEntity(entity: String?)'
    state_mutations:
      - entityFilter=<entity | null>
      - uiState=Content(filtered)
    side_effects: []
    error_handling:
      NoMatchingRows: keep Content with an in-list empty hint; never transition to Empty on a pure filter
  - name: FilterByAction
    handles: filter_action
    signature: 'private fun onFilterAction(action: String?)'
    state_mutations:
      - actionFilter=<action | null>
      - uiState=Content(filtered)
    side_effects: []
    error_handling:
      NoMatchingRows: keep Content with an in-list empty hint; composes with entityFilter
  - name: ApproveEntry
    signature: 'private fun onApprove(auditId: Long)'
    state_mutations:
      - resolvingId=auditId
      - uiState=Resolving
      - entries=<row removed on enqueue-success>
      - uiState=Content | Empty
    side_effects:
      - DraftDao.enqueue(CHECKER_APPROVE, MAKERCHECKER, auditId, idempotencyKey)
    error_handling:
      ApproveFailed: clear resolvingId; keep row; surface a retriable inline error, never silently drop
      PermissionRevoked: block enqueue; surface BLOCKED_PERMISSION_REVOKED; route to needs-attention-inbox
      Offline: queue in outbox; show "queued — will sync" affordance
  - name: RejectEntry
    signature: 'private fun onReject(auditId: Long)'
    state_mutations:
      - resolvingId=auditId
      - uiState=Resolving
      - entries=<row removed on enqueue-success>
      - uiState=Content | Empty
    side_effects:
      - confirmDialog()
      - DraftDao.enqueue(CHECKER_REJECT, MAKERCHECKER, auditId, idempotencyKey)
    error_handling:
      RejectFailed: clear resolvingId; keep row; surface a retriable inline error with an audit note
      ConfirmDismissed: no-op; stay in Content
      PermissionRevoked: block enqueue; surface BLOCKED_PERMISSION_REVOKED
  - name: DeleteEntry
    signature: 'private fun onDelete(auditId: Long)'
    state_mutations:
      - resolvingId=auditId
      - uiState=Resolving
      - entries=<row removed on enqueue-success>
      - uiState=Content | Empty
    side_effects:
      - confirmDialog()
      - DraftDao.enqueue(CHECKER_DELETE, MAKERCHECKER, auditId, idempotencyKey)
    error_handling:
      DeleteFailed: clear resolvingId; keep row; surface a retriable inline error, never silently drop
      ConfirmDismissed: no-op; stay in Content
      PermissionRevoked: block enqueue; surface BLOCKED_PERMISSION_REVOKED
  - name: OpenEntry
    signature: 'private fun onOpenEntry(auditId: Long)'
    state_mutations: []
    side_effects:
      - sendEvent(NavigateToCheckerDetail(auditId))
    error_handling:
      EntryNotFound: refuse navigation; refresh the queue in place
  - name: RetryLoad
    handles: retry
    signature: private fun onRetry()
    state_mutations:
      - uiState=Loading
      - entries=<re-read queue>
      - uiState=Content | Empty | Error
    side_effects:
      - MakerCheckerStore.stream(fresh)
    error_handling:
      InboxLoadFailed: uiState=Error; keep last-known cache if any; offer Retry again
error_cases:
  - inbox_load_failed
  - approve_failed
  - reject_failed
  - delete_failed
  - permission_revoked
  - offline_decision_queued
