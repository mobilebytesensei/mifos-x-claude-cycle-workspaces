acceptance_refs:
  - >-
    The self-scoped maker-checker inbox lists queued commands the signed-in user can approve/reject; each row shows
    action, entity, maker and made-on; approve/reject/delete post through the offline outbox; rows the user is NOT
    authorized to check show no action controls; nothing is silently dropped.
plan_ref: idea-plan.yaml#features[checker-inbox]
summary: >-
  The dedicated maker-checker approvals inbox (M15) drilled into from the M01 dashboard "checker inbox" tile. Loads GET
  /v1/makercheckers (self-scoped to entries this user canCheck({action},{entity}) or CHECKER_SUPER_USER) into a
  filterable list — filter chips by entity (Loan · Client · Savings · GL · …) and by action (create/approve/disburse).
  Each row shows the queued command's action, entity, maker, made-on date and the command JSON summary. Inline Approve /
  Reject post POST /v1/makercheckers/{auditId}?command=approve|reject, and Delete removes a withdrawn command — all
  enqueued through the offline outbox with a durable idempotency key so a checker working offline commits exactly-once
  on the next sync. Rows the user cannot check render read-only. Distinct from needs-attention-inbox (which aggregates
  four sources); this is the pure approvals queue.
vm_actions:
  - OnLoad
  - OnFilterEntity
  - OnFilterAction
  - OnApprove
  - OnReject
  - OnDelete
  - OnRetry
error_cases:
  - inbox_load_failed
  - approve_failed
  - reject_failed
  - permission_revoked
