schema_version: v1.0.0
feature: checker-inbox
# Re-verified 2026-07-31 (/idea-test-generate --regenerate) against the current ui.yaml + api.yaml —
# coverage: one scenario per ui.yaml state (loading/content/empty/error) + per on_click
# (filter_entity/action, approve, reject, delete, retry) + the list + decide(approve|reject|delete)
# operations, with per-row canCheck gating and offline outbox replay. Grounded in demo-data
# (maker-checker rows 700231-700234, KES amounts). 2026-07-30 ui/api touch was an mtime re-stamp.
scenarios:
  - id: loading_shows_list_shimmer
    preconditions: ["the inbox is opened", "the self-scoped queue has not resolved yet"]
    actions: ["open the checker inbox from the M01 tile"]
    assertions: ["the loading state shows a list shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_scoped_queue_with_filters
    preconditions: ["the queue resolves with entries the user can check", "hasAnyChecker resolves"]
    actions: ["open the inbox"]
    assertions:
      - "rows show action, entity, maker, made-on and a command summary"
      - "entity and action filter chips narrow the queue in-VM"
      - "Approve/Reject/Delete are shown only on rows the user canCheck(action,entity)"
    priority: high
  - id: empty_when_no_queued_commands
    preconditions: ["no queued commands await this checker"]
    actions: ["open the inbox"]
    assertions: ["an 'all clear' panel is shown with a last-checked timestamp"]
    priority: low
  - id: error_when_queue_load_fails_no_cache
    preconditions: ["the queue failed to load and no cache is available"]
    actions: ["open the inbox"]
    assertions: ["the error state is shown", "Retry re-reads the queue"]
    priority: medium
  - id: unauthorized_rows_render_read_only
    preconditions: ["a queued entry exists for an action/entity the user is NOT authorized to check"]
    actions: ["open the inbox"]
    assertions: ["that row shows no Approve/Reject/Delete controls"]
    priority: high
  - id: approve_enqueues_through_outbox
    preconditions: ["an approvable entry is visible", "the user can check it"]
    actions: ["tap Approve on the row"]
    assertions:
      - "the decision is enqueued to the offline outbox with a durable idempotency key"
      - "the next sync replays POST /v1/makercheckers/{auditId}?command=approve"
      - "on commit the underlying maker command executes and the row leaves the queue"
    priority: high
  - id: reject_requires_confirm_and_is_audited
    preconditions: ["a rejectable entry is visible"]
    actions: ["tap Reject", "confirm"]
    assertions: ["a confirm is required", "?command=reject is enqueued", "the row leaves with an audit note, never silently dropped"]
    priority: high
  - id: decisions_queue_offline
    preconditions: ["the device is offline", "the queue was cached"]
    actions: ["open the inbox offline", "approve a row"]
    assertions: ["the queue browses from cache", "the decision queues in the outbox for exactly-once replay on regain"]
    priority: medium
  - id: delete_removes_stale_command_via_outbox
    preconditions: ["a deletable queued entry is visible", "the user can check it"]
    actions: ["tap Delete on the row", "confirm"]
    assertions:
      - "a confirm is required"
      - "POST /v1/makercheckers/{auditId}?command=delete is enqueued to the offline outbox with a durable idempotency key"
      - "on commit the queued maker command is discarded and the row leaves the queue with an audit note"
    priority: medium
