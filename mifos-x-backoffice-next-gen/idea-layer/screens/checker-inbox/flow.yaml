feature: checker-inbox

entry_points:
  - type: direct
    description: "Opened from the M01 dashboard 'checker inbox' tile (open_checker_inbox), self-scoped to entries this user can approve/reject."
  - type: from_module
    description: "Reached as the M15 approvals & maker-checker module's default surface."
  - type: direct
    description: "An approval row in the needs-attention inbox drills into the M15 checker detail / this queue filtered to that entity."

transitions:
  - from: loading
    to: content
    trigger: "the self-scoped maker-checker queue resolves (cache-first)"
  - from: loading
    to: empty
    trigger: "no queued commands await this checker"
  - from: loading
    to: error
    trigger: "the queue failed to load and no cache is available"

  - from: content
    to: content
    trigger: "an entity/action filter changes, or a decision (approve/reject/delete) is enqueued and the row leaves"
  - from: content
    to: error
    trigger: "a decision failed hard with no fallback"

  - from: error
    to: loading
    trigger: "'Retry' tapped — re-reads the approvals queue"
