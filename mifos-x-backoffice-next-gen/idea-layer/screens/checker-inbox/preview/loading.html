<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checker Inbox — loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #0091EA; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001E30;
  --secondary: #00796B; --on-secondary: #FFFFFF; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  --tertiary: #5B5891; --tertiary-container: #E3DFFF; --on-tertiary-container: #17124B;
  --surface: #FCFCFF; --on-surface: #1A1C1E; --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9; --background: #FCFCFF; --outline: #72777F; --outline-variant: #C2C7CF;
  --success: #2E7D32; --warning-strong: #B45309; --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
  --font-body: 'Roboto', system-ui, sans-serif; --font-mono: 'Roboto Mono', ui-monospace, monospace;
  --fs-h3: 1.375rem; --fs-body: 1rem; --fs-label: 0.875rem; --fs-caption: 0.75rem; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-caption: 0.4px;
  --r-sm: 4px; --r-md: 8px; --r-lg: 16px; --r-xl: 28px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --border-w: 1px;
  --el-0: none; --el-1: 0 1px 2px rgba(0,0,0,0.05); --el-2: 0 2px 6px rgba(0,0,0,0.08); --el-3: 0 8px 24px rgba(0,0,0,0.12);
}
:root[data-theme="dark"] {
  --primary: #6FD3FF; --on-primary: #00344F; --primary-container: #004B70; --on-primary-container: #CBE6FF;
  --secondary: #4FD8C4; --secondary-container: #005048; --on-secondary-container: #B8F2E6;
  --tertiary: #C4C0FF; --tertiary-container: #434076; --on-tertiary-container: #E3DFFF;
  --surface: #1A1C1E; --on-surface: #E2E2E6; --surface-variant: #42474E; --on-surface-variant: #C2C7CF;
  --surface-container-low: #1E2022; --background: #1A1C1E; --outline: #8C9198; --outline-variant: #42474E;
  --success: #7FCF82; --warning-strong: #E0912F; --error: #FFB4AB; --error-container: #93000A; --on-error-container: #FFDAD6;
  --el-0: none; --el-1: 0 1px 2px rgba(0,0,0,0.35); --el-2: 0 2px 8px rgba(0,0,0,0.45); --el-3: 0 10px 28px rgba(0,0,0,0.55);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); border-bottom: var(--border-w) solid var(--surface-variant); box-shadow: var(--el-2); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-xl); color: var(--on-surface-variant); cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); margin: 0; }
header[data-shell="top-app-bar"] .bar-count { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); overflow-y: auto; }
.chip-row { display: flex; gap: var(--sp-sm); overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip-row::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: var(--sp-xs); height: 32px; padding: 0 var(--sp-md); border: var(--border-w) solid var(--outline); border-radius: var(--r-lg); font-size: var(--fs-label); color: var(--on-surface-variant); cursor: pointer; background: transparent; white-space: nowrap; }
.chip[data-selected="true"] { background: var(--secondary-container); color: var(--on-secondary-container); border-color: var(--secondary-container); }
.section-label { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-caption); letter-spacing: var(--ls-caption); color: var(--on-surface-variant); text-transform: uppercase; }
.section-label .count { font-family: var(--font-mono); }
.list { display: flex; flex-direction: column; gap: var(--sp-md); }
.card { border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-lg); background: var(--surface); padding: var(--sp-md); display: flex; flex-direction: column; gap: var(--sp-sm); box-shadow: var(--el-1); }
.card-top { display: flex; align-items: center; gap: var(--sp-sm); }
.action-pill { font-size: var(--fs-caption); font-weight: var(--fw-medium); padding: 2px var(--sp-sm); border-radius: var(--r-sm); background: var(--primary-container); color: var(--on-primary-container); }
.entity-pill { font-size: var(--fs-caption); font-weight: var(--fw-medium); padding: 2px var(--sp-sm); border-radius: var(--r-sm); background: var(--surface-variant); color: var(--on-surface-variant); }
.card-title { font-weight: var(--fw-medium); line-height: var(--lh-tight); }
.card-title .amt { font-family: var(--font-mono); font-weight: var(--fw-semibold); }
.card-title .obj { font-family: var(--font-mono); }
.card-meta { font-size: var(--fs-caption); color: var(--on-surface-variant); font-family: var(--font-mono); }
.card-actions { display: flex; gap: var(--sp-sm); margin-top: var(--sp-xs); }
.btn { display: inline-flex; align-items: center; gap: var(--sp-xs); height: 36px; padding: 0 var(--sp-md); border-radius: var(--r-lg); font-size: var(--fs-label); font-weight: var(--fw-medium); cursor: pointer; border: var(--border-w) solid transparent; font-family: inherit; }
.btn .material-symbols-outlined { font-size: 18px; }
.btn-approve { background: var(--primary); color: var(--on-primary); }
.btn-reject { background: transparent; color: var(--error); border-color: var(--error); }
.readonly-note { display: inline-flex; align-items: center; gap: var(--sp-xs); font-size: var(--fs-caption); color: var(--on-surface-variant); background: var(--surface-container-low); border-radius: var(--r-sm); padding: var(--sp-xs) var(--sp-sm); }
.readonly-note .material-symbols-outlined { font-size: 16px; }
@media (prefers-reduced-motion: no-preference) { .card, .btn, .chip { transition: filter 120ms ease; } .btn:active, .chip:active { filter: brightness(0.97); } }
</style>
<style>
/* state-specific (loading skeleton) — token-native, mirrors content.html block-for-block */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.sk { background: var(--surface-variant); border-radius: var(--r-sm); display: block; }
@media (prefers-reduced-motion: no-preference) { .sk { animation: ci-pulse 1.4s ease-in-out infinite; } }
@keyframes ci-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
.sk-barcount { width: 56px; height: 14px; }
.sk-chip { flex: 0 0 auto; width: 76px; height: 32px; border-radius: var(--r-lg); }
.sk-chip.wide { width: 96px; }
.sk-label { width: 152px; height: 12px; }
.sk-count { width: 52px; height: 12px; }
.sk-pill { width: 64px; height: 18px; }
.sk-pill.narrow { width: 46px; }
.sk-line { height: 16px; }
.sk-line.title { width: 84%; }
.sk-line.meta { width: 62%; height: 12px; }
.sk-btn { width: 108px; height: 36px; border-radius: var(--r-lg); }
.sk-note { width: 74%; height: 28px; }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="checker-inbox" data-state="loading">

  <header data-shell="top-app-bar" data-variant="small" data-component-id="ci_header">
    <span class="leading material-symbols-outlined" data-nav-to="m01-dashboard" role="button" tabindex="0" aria-label="Back">arrow_back</span>
    <h1 class="app-title">Checker Inbox</h1>
    <span class="bar-count"><span class="sk sk-barcount" aria-hidden="true"></span></span>
  </header>

  <main data-shell="content" data-state="loading" aria-busy="true">
    <span class="sr-only" role="status">Loading the approvals queue…</span>

    <!-- mirrors content chip-row (components[0]) -->
    <div class="chip-row" data-component-type="FilterChipRow" data-component-id="ci_entity_filter" data-from-ui-yaml-path="components[0]" aria-hidden="true">
      <span class="sk sk-chip wide"></span>
      <span class="sk sk-chip"></span>
      <span class="sk sk-chip"></span>
      <span class="sk sk-chip"></span>
      <span class="sk sk-chip narrow"></span>
    </div>

    <!-- mirrors content section-label -->
    <div class="section-label" aria-hidden="true"><span class="sk sk-label"></span><span class="sk sk-count"></span></div>

    <!-- mirrors content list (ci_content) block-for-block: 3 checkable rows + 1 read-only row -->
    <div class="list" data-component-type="LazyColumn" data-component-id="ci_content" aria-hidden="true">

      <div class="card" data-component-id="ci_row">
        <div class="card-top"><span class="sk sk-pill"></span><span class="sk sk-pill narrow"></span></div>
        <span class="sk sk-line title"></span>
        <span class="sk sk-line meta"></span>
        <div class="card-actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div>
      </div>

      <div class="card" data-component-id="ci_row">
        <div class="card-top"><span class="sk sk-pill"></span><span class="sk sk-pill narrow"></span></div>
        <span class="sk sk-line title"></span>
        <span class="sk sk-line meta"></span>
        <div class="card-actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div>
      </div>

      <div class="card" data-component-id="ci_row">
        <div class="card-top"><span class="sk sk-pill"></span><span class="sk sk-pill narrow"></span></div>
        <span class="sk sk-line title"></span>
        <span class="sk sk-line meta"></span>
        <div class="card-actions"><span class="sk sk-btn"></span><span class="sk sk-btn"></span></div>
      </div>

      <div class="card" data-component-id="ci_row">
        <div class="card-top"><span class="sk sk-pill"></span><span class="sk sk-pill narrow"></span></div>
        <span class="sk sk-line title"></span>
        <span class="sk sk-line meta"></span>
        <div class="card-actions"><span class="sk sk-note"></span></div>
      </div>

    </div>

  </main>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
