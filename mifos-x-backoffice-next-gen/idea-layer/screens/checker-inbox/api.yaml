feature: checker-inbox

# The self-scoped queue is a read (CACHE_FIRST_SWR); each approve/reject/delete decision
# routes through the offline outbox (POST /v1/batches) so it commits exactly-once.

endpoints:
  - id: list_maker_checker_entries
    method: GET
    path: "/v1/makercheckers"
    description: >-
      Self-scoped list of queued maker-checker commands the signed-in user is a valid checker for. Each entry
      carries action, entity, maker, made-on and the command JSON for the row summary. Server scopes to the
      checker; the client further gates the action controls per-entry.
    query_params:
      - { name: entityName, type: string, required: false }
      - { name: actionName, type: string, required: false }
      - { name: makerDateTimeFrom, type: string, required: false }
      - { name: offset, type: integer, required: false }
      - { name: limit, type: integer, required: false }
    response:
      shape: list
      dto: MakerCheckerEntryDto
      demo_source: MakerCheckerEntryDto.items
    pagination:
      style: offset-limit
      params: [offset, limit]
      envelope: bare_array
    requires_auth: true
    requires_permission: ["CHECKER_SUPER_USER"]
  - id: decide_maker_checker_entry
    method: POST
    path: "/v1/makercheckers/{auditId}"
    description: >-
      Approve, reject or delete a queued command (?command=approve|reject|delete). Only exposed on rows the user
      canCheck(action,entity). Enqueued to the offline outbox with a durable idempotency key and replayed via
      POST /v1/batches so an offline decision commits exactly-once.
    query_params:
      - { name: command, type: string, required: true }   # approve | reject | delete
    response:
      shape: object
      dto: CommandProcessingResultDto
      demo_source: CommandProcessingResultDto.scenarios.approved
    requires_auth: true
    requires_permission: ["CHECKER_SUPER_USER"]
    idempotency: durable
