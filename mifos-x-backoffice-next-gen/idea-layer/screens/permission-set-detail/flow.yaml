feature: permission-set-detail

participates_in_flows:
  - permissions-admin

entry_points:
  - type: direct
    description: "Opened from the permission-capability-engine surface (view_permission_set) to inspect the resolved PermissionSet."

transitions:
  - from: loading
    to: content
    trigger: "the local PermissionSet resolves + the code catalog loads (cache-first)"
  - from: loading
    to: empty
    trigger: "the resolved PermissionSet is empty / not yet bootstrapped"
  - from: loading
    to: error
    trigger: "the code catalog failed to load and no cache is available"

  - from: content
    to: content
    trigger: "a search filter changes, a grouping expands, an umbrella chip toggles, or the fingerprint is copied"

  - from: content
    to: refreshing
    trigger: "'Refresh from role' tapped — re-pulls GET /v1/roles/{roleId}/permissions"
  - from: refreshing
    to: content
    trigger: "the role refresh completes (set rebuilt on fingerprint change) or fails (last-known set kept)"

  - from: error
    to: loading
    trigger: "'Retry' tapped — reloads the code catalog"
