feature: permission-set-detail
status: draft
cluster: foundation
module: permission-capability-engine
priority: should_have
new_infra: false
is_primary_flow: false
has_ui: true
has_api: true
has_server: false
archetype: detail
capabilities:
  - has_ui
  - has_offline_cache
  - has_flow
  - requires_auth
requires_features:
  - permission-capability-engine
  - fineract-auth-session
acceptance_refs:
  - >-
    The resolved PermissionSet detail lists every raw permission code the signed-in user holds, grouped by
    Fineract grouping (portfolio, transaction_loan, accounting, …), flags umbrella/short-circuit grants, and
    shows the sha256 fingerprint used for CapabilityMap drift detection; read-only, self-scoped.
plan_ref: idea-plan.yaml#features[permission-set-detail]
summary: >-
  The read-only detail of the signed-in user's resolved PermissionSet, drilled into from the
  permission-capability-engine (view_permission_set). It renders every raw permission code the user holds
  grouped by Fineract grouping (portfolio · transaction_loan · transaction_savings · accounting · organisation
  · authorisation · …), marks umbrella / short-circuit grants (e.g. ALL_FUNCTIONS, CHECKER_SUPER_USER) that
  widen access, and shows the PermissionSet's sha256 fingerprint — the value the CapabilityMap resolver keys on
  for drift detection. A search box filters codes, and each grouping shows its held-vs-total count. The set is
  the union of the user's enabled roles' permissions (GET /v1/permissions supplies the code catalog + grouping
  metadata; the held set comes from the login-normalised PermissionSet in core/permissions). Purely diagnostic.
vm_actions:
  - OnLoad
  - OnSearchCode
  - OnExpandGrouping
  - OnCopyFingerprint
  - OnRetry
error_cases:
  - permissions_catalog_load_failed
  - permission_set_unavailable
scaffolded_by: /idea-plan-add
