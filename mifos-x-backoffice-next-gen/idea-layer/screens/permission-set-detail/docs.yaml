acceptance_refs:
  - >-
    The resolved PermissionSet detail lists every raw permission code the signed-in user holds, grouped by Fineract
    grouping (portfolio, transaction_loan, accounting, …), flags umbrella/short-circuit grants, and shows the sha256
    fingerprint used for CapabilityMap drift detection; read-only, self-scoped.
  - >-
