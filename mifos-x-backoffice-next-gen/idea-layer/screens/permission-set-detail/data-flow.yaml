feature: permission-set-detail

# Read-only diagnostic. The held permission set is a LOCAL read from core/permissions
# (no network); the code catalog reads cache-first so the detail opens offline. No writes.

entries:
  - trigger: on_mount
    source: local.permission_set
    target_state: content
    loading_state: loading
    error_state: empty
    on_error:
      nav_target: null
      error_code: permission_set_unavailable
    persistence_contract:
      store: settings
      table: secure_session
      keys: [permission_codes, fingerprint]
      note: "The resolved PermissionSet (held codes + sha256 fingerprint) is read from the encrypted session in core/permissions — no HTTP GET. Empty when not yet bootstrapped."

  - trigger: on_mount
    source: remote.get_permissions_catalog
    target_state: content
    loading_state: loading
    error_state: error
    on_error:
      nav_target: null
      error_code: permissions_catalog_load_failed
    persistence_contract:
      store: room
      table: permission_catalog_cache
      keys: [code, grouping, entity_name, action_name]
      note: "CACHE_FIRST_SWR mirror of GET /v1/permissions; the grouping metadata joins with the local held set to render held-vs-total. Reference data, revalidated rarely."

  - trigger: on_action
    source: remote.refresh_role_permissions
    target_state: content
    loading_state: refreshing
    error_state: content
    on_error:
      nav_target: null
      error_code: permission_refresh_failure
    persistence_contract:
      store: settings
      table: secure_session
      keys: [permission_codes, fingerprint]
      note: "Password-less role-permission refresh (GET /v1/roles/{roleId}/permissions). core/permissions rebuilds the PermissionSet + sha256 fingerprint and, ONLY on a fingerprint change, atomically swaps the encrypted session set (owned by core/permissions.PermissionEvaluator — this screen re-reads secure_session, it does not write it directly). On failure the last-known set is kept (error degrades into content). Not an outbox write."

cache:
  strategy: cache_first_swr
  note: "Read-mostly screen. The catalog revalidates infrequently (reference data); the held set is authoritative-local and never fetched on mount. The optional Refresh-from-role re-pulls the role union so core/permissions can rebuild + swap the encrypted set. No outbox writes."

