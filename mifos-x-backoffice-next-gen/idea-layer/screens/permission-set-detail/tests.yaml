schema_version: v1.0.0
feature: permission-set-detail
# Regenerated 2026-07-25 (/idea-test-generate) against the enriched ui.yaml —
# coverage verified: one scenario per ui.yaml state (loading/content/empty/error)
# + per api operation (get_permissions_catalog).
scenarios:
  - id: loading_shows_grouped_shimmer
    preconditions: ["the detail is opened", "the local set + code catalog have not resolved yet"]
    actions: ["open Permission set detail from the permission engine"]
    assertions: ["the loading state shows a grouped-list shimmer", "no error is shown"]
    priority: medium
  - id: content_shows_grouped_codes_and_fingerprint
    preconditions: ["the local PermissionSet resolves + the code catalog loads"]
    actions: ["open the detail"]
    assertions:
      - "held codes are grouped by Fineract grouping (portfolio, transaction_loan, accounting, …) with held-vs-total counts"
      - "umbrella / short-circuit grants (ALL_FUNCTIONS, CHECKER_SUPER_USER) are highlighted"
      - "the header shows the sha256 fingerprint used for CapabilityMap drift detection"
    priority: high
  - id: empty_when_permission_set_unbootstrapped
    preconditions: ["the resolved PermissionSet is empty / not yet bootstrapped"]
    actions: ["open the detail"]
    assertions: ["a guidance panel is shown"]
    priority: low
  - id: error_when_catalog_fails_no_cache
    preconditions: ["the code catalog failed to load and no cache is available"]
    actions: ["open the detail"]
    assertions: ["the error state is shown", "Retry reloads the catalog"]
    priority: medium
  - id: renders_offline_from_local_set
    preconditions: ["the device is offline", "the catalog was cached"]
    actions: ["open the detail offline"]
    assertions: ["the held set renders from the local PermissionSet", "groupings label from the cached catalog"]
    priority: high
  - id: search_filters_codes_in_vm
    preconditions: ["codes are shown"]
    actions: ["type a code fragment in search"]
    assertions: ["the list filters in-VM across code and grouping with no refetch"]
    priority: low
  - id: copy_fingerprint_to_clipboard
    preconditions: ["the fingerprint header is shown"]
    actions: ["tap Copy fingerprint"]
    assertions: ["the sha256 fingerprint is copied to the clipboard for support / drift diagnosis"]
    priority: low
