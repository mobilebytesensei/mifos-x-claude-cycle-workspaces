feature: permission-set-detail

# Read-only. The held permission set comes from the local core/permissions PermissionSet
# (no HTTP GET); this endpoint supplies the code CATALOG + grouping metadata to render the
# grouped view. CACHE_FIRST_SWR so the detail opens offline.

endpoints:
  - id: get_permissions_catalog
    method: GET
    path: "/v1/permissions"
    description: >-
      Fetch the full permission code catalog with grouping metadata (grouping, code, entityName, actionName)
      so the resolved PermissionSet can be rendered grouped by Fineract grouping with held-vs-total counts.
      The catalog is reference data; the HELD subset comes from the local PermissionSet, not this call.
    query_params:
      - { name: makerCheckerable, type: boolean, required: false }
    response:
      shape: list
      dto: PermissionDto
      demo_source: PermissionDto.items
    pagination:
      style: none
      params: []
      envelope: bare_array
    requires_auth: true
    requires_permission: []

  - id: refresh_role_permissions
    method: GET
    path: "/v1/roles/{roleId}/permissions"
    description: >-
      Password-less refresh read of the signed-in user's role permission union — the same Fineract read
      endpoint the permission-capability-engine owns (permission_refresh contract). Re-pulls the role's held
      permission codes so core/permissions can rebuild the PermissionSet + sha256 fingerprint and, only on a
      fingerprint change, atomically swap the encrypted session set. Read/refresh only — never mutates permissions.
    path_params:
      - { name: roleId, type: long, required: true }
    response:
      shape: object
      dto: RolePermissionsDto
      demo_source: permissionSet
    pagination:
      style: none
      params: []
      envelope: bare_object
    requires_auth: true
    requires_permission: [READ_PERMISSION]