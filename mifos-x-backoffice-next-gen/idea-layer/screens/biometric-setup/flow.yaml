feature: biometric-setup
entry_points:
  - type: post_passcode_setup
    source: passcode-lock
    description: "Immediately after first-time passcode setup — 'Want to also set up biometric unlock?' offered as a next step."
  - type: settings_toggle
    source: m17-sync-settings
    component_id: biometric_lock_toggle
    description: "User turns on the biometric toggle in M17 settings — opens biometric-setup in prompt state if no biometric is enrolled yet."

transitions:
  - from: prompt
    to: enrolling
    trigger: "start_enrollment → BiometricManager.canAuthenticate OK → platform enrollment dialog shown"
  - from: prompt
    to: unavailable
    trigger: "BiometricManager.canAuthenticate returns BIOMETRIC_ERROR_NO_HARDWARE or BIOMETRIC_ERROR_HW_UNAVAILABLE"
  - from: prompt
    to: not_enrolled_in_os
    trigger: "BiometricManager.canAuthenticate returns BIOMETRIC_ERROR_NONE_ENROLLED"
  - from: enrolling
    to: success
    trigger: "enrollment dialog succeeds → biometric_lock_enabled=true persisted"
  - from: enrolling
    to: error
    trigger: "enrollment dialog failed or cancelled"
  - from: error
    to: enrolling
    trigger: "retry_button tapped"
  - from: error
    to: prompt
    trigger: "skip_button tapped → navigate back"
  - from: success
    to: success
    trigger: "done_button tapped → navigate back to M17 settings"
  - from: not_enrolled_in_os
    to: prompt
    trigger: "user returns from device Settings after enrolling a biometric"
  - from: prompt
    to: prompt
    trigger: "skip_button tapped → navigate back (biometric_lock_enabled remains false)"
  - from: unavailable
    to: unavailable
    trigger: "close/back → navigate back to M17 settings"
