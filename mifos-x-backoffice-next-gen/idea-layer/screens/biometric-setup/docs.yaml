feature: biometric-setup
status: enriched
scaffolded_at: '2026-08-01T00:00:00Z'
scaffolded_by: /idea-plan-add
schema_version: v2
cluster: foundation
module: foundation
priority: must_have
is_primary_flow: false
has_ui: true
has_api: false
has_server: false
capabilities:
  - has_ui
  - has_flow
  - has_local_preferences
  - has_system_integration
  - requires_auth
requires_features:
  - passcode-lock
  - fineract-auth-session
provides_to:
  - passcode-lock
  - m17-sync-settings
permissions_gate: >-
  No server permission gate — biometric enrollment is a device-local capability.
  Available to every authenticated user on devices that support biometrics (Android
  BiometricManager / iOS LocalAuthentication). Requires passcode-lock to be enabled first
  (biometric is a second factor, not a standalone lock).
contracts:
  apis: []
  tables:
    - name: secure_prefs
      backend: multiplatform_settings_encrypted
      keys:
        - biometric_lock_enabled
        - biometric_type
      note: "Biometric enrollment state in the encrypted key store. biometric_type: fingerprint | face | iris | none."
libraries:
  core_modules:
    - core/datastore
  external:
    - "BiometricPrompt (Android BiometricManager / iOS LocalAuthentication)"
    - "com.russhwolf.settings.Settings (encrypted variant)"
vm_actions:
  - action: OnEnrollClick
    maps_to_on_click: start_enrollment
    handler: "Open platform biometric enrollment flow (BiometricManager.canAuthenticate check first). On success: persist biometric_lock_enabled=true + biometric_type; route back to M17 with a 'Biometric set up' snackbar."
  - action: OnSkipClick
    maps_to_on_click: skip_enrollment
    handler: "User opts out — biometric_lock_enabled remains false; route back (passcode-lock still active)."
  - action: Internal.CheckBiometricAvailability
    handler: "On mount: call BiometricManager.canAuthenticate(BIOMETRIC_STRONG) — if unavailable, show the unavailable_state with the reason."
error_cases:
  - code: biometric_unavailable
    ux: "Unavailable state: 'Biometric authentication is not available on this device. You can still use your passcode.' Skip / back to M17."
  - code: biometric_not_enrolled_in_os
    ux: "Prompt state: 'No biometrics enrolled in your device settings. Go to Settings → Security to add a fingerprint or face.' with a 'Open device settings' deep-link."
  - code: enrollment_failed
    ux: "error state: 'Biometric setup failed — please try again or skip.' with Retry and Skip."
test_fixtures:
  - device supports biometrics + passcode enabled → prompt shown → enroll → biometric_lock_enabled=true persisted → lock screen shows fingerprint button
  - device does not support biometrics → unavailable state shown ('not available on this device')
  - OS biometrics not enrolled → 'Go to device Settings to enroll' message with deep-link
acceptance_refs:
  - plan: idea-plan.yaml#features (to be added)
  - evolve: evolve-plans/20260801-role-based-app-assembly.md §4.5 completeness gate capability 19
summary: >-
  First-time biometric enrollment screen — presented after passcode-lock setup or from M17 settings
  biometric toggle. Checks platform biometric availability (BiometricManager), explains the benefit,
  and opens the native enrollment dialog. On success, persists biometric_lock_enabled=true; thereafter
  the passcode-lock screen shows the biometric prompt icon. Distinct from the M17 on/off toggle,
  which only enables/disables a pre-enrolled biometric — this screen handles the initial enrollment flow.
plan_ref: idea-plan.yaml#features[biometric-setup]
