feature: biometric-setup
# Biometric setup makes no server API calls — all interactions are with
# the platform-native BiometricPrompt API and the local encrypted key store.
endpoints: []
notes:
  - "BiometricManager.canAuthenticate(BIOMETRIC_STRONG) determines availability — device-local, no network."
  - "Enrollment uses the OS biometric enrollment flow (native system UI). Biometric templates are stored in the OS Trusted Execution Environment (TEE) / Secure Enclave — never in app storage or on the server."
