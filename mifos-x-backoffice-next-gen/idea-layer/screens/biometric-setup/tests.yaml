schema_version: v1.0.0
feature: biometric-setup
scenarios:
  - id: enroll_fingerprint_success
    preconditions: ["device supports fingerprint", "passcode enabled", "biometric_lock_enabled = false"]
    actions: ["tap Enroll", "complete fingerprint enrollment in platform dialog"]
    assertions: ["success state shown", "biometric_lock_enabled = true in encrypted store", "biometric_type = fingerprint", "passcode-lock shows fingerprint icon on next lock"]
    priority: high

  - id: biometric_hardware_unavailable
    preconditions: ["device has no biometric hardware (desktop/emulator)"]
    actions: ["open biometric-setup"]
    assertions: ["unavailable state shown immediately", "'Not available on this device' message", "Skip/back option available"]
    priority: high

  - id: os_biometrics_not_enrolled
    preconditions: ["device supports biometrics", "no biometrics enrolled in OS"]
    actions: ["open biometric-setup"]
    assertions: ["not_enrolled_in_os state", "'Go to Settings → Security' message", "'Open Settings' button deep-links to device security settings"]
    priority: medium

  - id: enrollment_cancelled
    preconditions: ["device supports biometrics"]
    actions: ["tap Enroll", "cancel the platform enrollment dialog"]
    assertions: ["error state shown", "Retry and Skip available", "biometric_lock_enabled remains false"]
    priority: medium

  - id: skip_skips_setup
    preconditions: ["prompt state"]
    actions: ["tap Skip"]
    assertions: ["navigates back to M17 settings", "biometric_lock_enabled remains false", "passcode-lock still active (no biometric icon on lock screen)"]
    priority: medium
