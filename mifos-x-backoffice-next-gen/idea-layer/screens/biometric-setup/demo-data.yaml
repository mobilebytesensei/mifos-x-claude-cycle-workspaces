feature: biometric-setup

# All 6 ui.yaml states covered: prompt, enrolling, success, unavailable, not_enrolled_in_os, error.
# No server data — all values from platform BiometricManager and device encrypted_prefs.

items:
  # ── prompt — Android device with fingerprint sensor ───────────────────────────
  - id: "supported_fingerprint"
    state: prompt
    device: "Android — Pixel 7 (fingerprint sensor)"
    biometric_type: "fingerprint"
    can_authenticate: "BIOMETRIC_SUCCESS"
    biometric_lock_enabled: false
    headline: "Set up fingerprint unlock"
    description: "Use your fingerprint to unlock the app instantly. Your passcode is always the fallback if biometric fails."
    ux: "prompt state — fingerprint illustration shown, Enroll button + Skip link"

  # ── prompt — iOS device with Face ID ──────────────────────────────────────────
  - id: "supported_face"
    state: prompt
    device: "iOS — iPhone 15 (Face ID)"
    biometric_type: "face"
    can_authenticate: "BIOMETRIC_SUCCESS"
    biometric_lock_enabled: false
    headline: "Set up Face ID unlock"
    description: "Use Face ID to unlock the app instantly. Your passcode is always the fallback."
    ux: "prompt state — face ID illustration shown, Enroll button + Skip link"

  # ── enrolling — Platform enrollment dialog active ─────────────────────────────
  - id: "enrolling_in_progress"
    state: enrolling
    device: "Android — Pixel 7"
    biometric_type: "fingerprint"
    can_authenticate: "BIOMETRIC_SUCCESS"
    is_enrolling: true
    ux: "enrolling state — 'Waiting for biometric...' spinner shown in-app; OS fingerprint enrollment dialog active on top"
    note: "App screen shows spinner; user is placing finger on sensor in the OS system dialog."

  # ── success — Fingerprint enrollment complete ─────────────────────────────────
  - id: "enrolled_success"
    state: success
    device: "Android — Pixel 7"
    biometric_type: "fingerprint"
    can_authenticate: "BIOMETRIC_SUCCESS"
    biometric_lock_enabled: true
    written_keys:
      biometric_lock_enabled: true
      biometric_type: "fingerprint"
    ux: "success state: 'Fingerprint unlock enabled!' headline — Done button routes to M17 settings where the biometric toggle now reflects enabled"

  # ── not_enrolled_in_os — Hardware present but no fingerprint/face enrolled ─────
  - id: "not_enrolled_in_os"
    state: not_enrolled_in_os
    device: "Android — Samsung A54 (supports fingerprint but none enrolled in OS)"
    can_authenticate: "BIOMETRIC_ERROR_NONE_ENROLLED"
    biometric_lock_enabled: false
    ux: "not_enrolled_in_os state: 'No biometrics enrolled. Go to your device Settings → Security to add a fingerprint or face.' with Open Settings button"
    note: "After the user enrolls in OS settings and returns, the screen re-checks BiometricManager and transitions to prompt if now available."

  # ── unavailable — No biometric hardware ───────────────────────────────────────
  - id: "hardware_unavailable"
    state: unavailable
    device: "Desktop / Android emulator without biometric hardware"
    can_authenticate: "BIOMETRIC_ERROR_NO_HARDWARE"
    biometric_lock_enabled: false
    ux: "unavailable state: 'Not available on this device — you can still use your passcode to lock the app.' back/close button shown"

  # ── error — Enrollment attempt failed ────────────────────────────────────────
  - id: "error_enrollment_failed"
    state: error
    device: "Android — Pixel 7"
    biometric_type: "fingerprint"
    can_authenticate: "BIOMETRIC_SUCCESS"
    biometric_lock_enabled: false
    error_code: "BIOMETRIC_ERROR_LOCKOUT"
    error_message: "Biometric authentication temporarily locked due to too many failed attempts. Try again in 30 seconds."
    ux: "error state — error message shown, Retry button and Skip link available"
    note: "biometric_lock_enabled remains false — not written until a successful enrollment. User can retry or skip to use passcode-only."
