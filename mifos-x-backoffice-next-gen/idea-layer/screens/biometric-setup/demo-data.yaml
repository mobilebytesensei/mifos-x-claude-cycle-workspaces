feature: biometric-setup
items:
  - id: "supported_fingerprint"
    device: "Android — fingerprint sensor available"
    biometric_type: "fingerprint"
    can_authenticate: "BIOMETRIC_SUCCESS"
    biometric_lock_enabled: false
    ux: "prompt state: 'Set up fingerprint unlock' with fingerprint illustration"

  - id: "supported_face"
    device: "iOS — Face ID available"
    biometric_type: "face"
    can_authenticate: "BIOMETRIC_SUCCESS"
    biometric_lock_enabled: false
    ux: "prompt state: 'Set up Face ID unlock' with face illustration"

  - id: "enrolled_success"
    device: "Android"
    biometric_type: "fingerprint"
    can_authenticate: "BIOMETRIC_SUCCESS"
    biometric_lock_enabled: true
    ux: "success state: 'Fingerprint unlock enabled!' — Done routes to M17"

  - id: "not_enrolled_in_os"
    device: "Android — supports fingerprint but none enrolled in OS"
    can_authenticate: "BIOMETRIC_ERROR_NONE_ENROLLED"
    biometric_lock_enabled: false
    ux: "not_enrolled_in_os state: 'Go to Settings → Security to add a fingerprint'"

  - id: "hardware_unavailable"
    device: "Desktop / emulator without biometric hardware"
    can_authenticate: "BIOMETRIC_ERROR_NO_HARDWARE"
    biometric_lock_enabled: false
    ux: "unavailable state: 'Not available on this device — use your passcode instead.'"
