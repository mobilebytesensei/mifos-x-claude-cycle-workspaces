feature: biometric-setup
entries:
  - trigger: on_mount
    source: local.biometric_availability
    target_state: prompt
    loading_state: prompt
    error_state: unavailable
    on_error:
      nav_target: null
      error_code: biometric_unavailable
    persistence_contract:
      store: in_memory
      keys: [biometric_type, can_authenticate]
      note: "BiometricManager.canAuthenticate() result — checked on mount; not persisted (re-checked every time)."

  - trigger: on_event
    action: enrollment_success
    source: local.secure_prefs
    target_state: success
    loading_state: enrolling
    error_state: error
    on_error:
      nav_target: null
      error_code: enrollment_failed
    persistence_contract:
      store: encrypted_prefs
      keys: [biometric_lock_enabled, biometric_type]
      note: "On enrollment success: write biometric_lock_enabled=true and the detected biometric_type (fingerprint/face). This is the only write — biometric templates are stored in the OS TEE, never here."
