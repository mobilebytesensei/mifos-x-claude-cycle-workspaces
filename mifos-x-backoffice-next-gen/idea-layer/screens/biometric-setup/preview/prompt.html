<!doctype html>
<!-- render-hash: biometricsetupprompt01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biometric Setup — prompt</title>
<style>
:root {
  --primary: #0091EA; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001E30;
  --secondary: #00796B; --on-secondary: #FFFFFF; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  --error: #BA1A1A; --error-container: #FFDAD6; --on-error-container: #410002;
  --surface: #FCFCFF; --on-surface: #1A1C1E;
  --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9; --surface-container: #EDEFF4;
  --outline: #72777F; --outline-variant: #C2C7CF;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 9999px;
  --el-1: 0 1px 2px rgba(0,0,0,0.05);
  --el-2: 0 2px 6px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; background: #E8EAED; font-family: var(--font-body); }
body { display: flex; align-items: flex-start; justify-content: center; padding: 24px 0; }
.device {
  width: 360px; min-height: 720px;
  background: var(--surface);
  border-radius: 40px; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.08);
  display: flex; flex-direction: column; position: relative;
}

/* Top app bar */
header[data-shell="top-app-bar"] {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 24px));
  background: var(--surface);
  border-bottom: 1px solid var(--outline-variant);
  box-shadow: var(--el-1);
}
.leading-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: transparent; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--on-surface-variant);
}
.bar-title {
  font-size: 1.375rem; font-weight: 600; color: var(--on-surface); flex: 1;
}

/* Content */
main {
  flex: 1; display: flex; flex-direction: column;
  padding: 0 24px 32px; overflow-y: auto;
}

/* Illustration area */
.illustration-area {
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 0 32px;
  gap: 0;
}
.illustration-ring {
  width: 152px; height: 152px; border-radius: 50%;
  background: var(--primary-container);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.illustration-ring::before {
  content: '';
  position: absolute; inset: 8px; border-radius: 50%;
  border: 2px dashed color-mix(in srgb, var(--primary) 30%, transparent);
}

/* Fingerprint SVG illustration */
.fp-icon { color: var(--primary); }

/* Text block */
.text-block {
  display: flex; flex-direction: column; gap: 12px;
  text-align: center; padding: 0 8px;
}
.headline {
  font-size: 1.375rem; font-weight: 600; color: var(--on-surface); line-height: 1.3;
}
.description {
  font-size: 0.9375rem; color: var(--on-surface-variant); line-height: 1.6;
}

/* Security note */
.security-note {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--surface-container-low);
  border: 1px solid var(--outline-variant);
  border-radius: var(--r-md);
  padding: 12px 14px;
  margin-top: 16px;
}
.security-note svg { flex-shrink: 0; margin-top: 1px; color: var(--secondary); }
.security-note p { font-size: 0.8125rem; color: var(--on-surface-variant); line-height: 1.5; }

/* Actions */
.actions {
  margin-top: auto; padding-top: 32px;
  display: flex; flex-direction: column; gap: 12px;
}
.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; border-radius: var(--r-xl); border: none;
  background: var(--primary); color: var(--on-primary);
  font-family: var(--font-body); font-size: 0.9375rem; font-weight: 500;
  cursor: pointer; box-shadow: var(--el-2);
  transition: filter 100ms ease;
}
.btn-primary:active { filter: brightness(0.92); }
.btn-text {
  display: flex; align-items: center; justify-content: center;
  min-height: 44px; border-radius: var(--r-xl); border: none;
  background: transparent; color: var(--primary);
  font-family: var(--font-body); font-size: 0.9375rem; font-weight: 500;
  cursor: pointer;
}

.state-badge {
  position: absolute; top: 12px; right: 16px;
  font-size: 0.6875rem; font-weight: 600; font-family: var(--font-mono);
  color: var(--on-surface-variant); background: var(--surface-variant);
  padding: 2px 8px; border-radius: var(--r-full); opacity: 0.7; z-index: 5;
}
</style>
</head>
<body>
<div class="device">
<div data-shell="root" data-screen-id="biometric-setup" data-state="prompt">
  <span class="state-badge">prompt</span>

  <!-- Top app bar (top_app_bar_visible: true) -->
  <header data-shell="top-app-bar" data-variant="small">
    <button class="leading-btn" aria-label="Go back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
    <h1 class="bar-title"
        data-component-type="header" data-component-id="header"
        data-from-ui-yaml-path="components[0]">Biometric Setup</h1>
  </header>

  <main data-shell="content" data-state="prompt">

    <!-- Illustration: fingerprint device (biometric_type: fingerprint) -->
    <div class="illustration-area"
         data-component-type="image" data-component-id="illustration"
         data-from-ui-yaml-path="components[1]"
         aria-label="Fingerprint unlock illustration">

        </svg>
      </div>
    </div>

    <!-- Text content (demo-data: supported_fingerprint) -->
    <div class="text-block">
      <h2 class="headline">Set up fingerprint unlock</h2>
      <p class="description"
         data-component-type="text" data-component-id="description_text"
         data-from-ui-yaml-path="components[2]">
        Use your fingerprint to unlock the app instantly. Your passcode is always the fallback if biometric fails.
      </p>
      <!-- Security note -->
      <div class="security-note" role="note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3zm0 10.99h6c-.47 3.96-3.09 7.51-6 8.93V13H6V7.38l6-2.25v7.86z"/>
        </svg>
        <p>Biometric data never leaves this device. Authentication is handled by your OS security chip.</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <!-- Enroll button (primary) -->
      <button class="btn-primary"
              data-component-type="button" data-component-id="enroll_button"
              data-from-ui-yaml-path="components[3]"
              data-action="start_enrollment" data-state-to="enrolling"
              aria-label="Set up biometric unlock for this device">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.25.13.34.43.21.67-.09.18-.26.28-.44.28zM3.5 9.72c-.1 0-.2-.03-.29-.09-.23-.16-.28-.47-.12-.7.99-1.4 2.25-2.5 3.75-3.27C9.98 4.04 14 4.03 17.15 6.07c1.5.77 2.76 1.86 3.75 3.25.16.22.11.54-.12.7-.23.16-.54.11-.7-.12-.9-1.26-2.04-2.25-3.39-2.94-2.87-1.86-6.65-1.87-9.54.01-1.36.69-2.5 1.68-3.4 2.96-.08.14-.23.19-.25.19zm6.25 12.07c-.13 0-.26-.05-.35-.15-.87-.87-1.34-1.43-2.01-2.64-.69-1.23-1.05-2.73-1.05-4.34 0-2.97 2.54-5.39 5.66-5.39s5.66 2.42 5.66 5.39c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.42-2.09-4.39-4.66-4.39-2.57 0-4.66 1.97-4.66 4.39 0 1.44.32 2.77.93 3.85.64 1.15 1.08 1.64 1.85 2.42.19.2.19.51 0 .71-.11.1-.24.15-.37.15zm7.17-1.85c-1.19 1.19-2.85 1.85-4.81 1.85-1.24 0-2.31-.31-3.28-.94-.97-.63-1.72-1.51-2.23-2.61-.42-.9-.64-1.95-.64-3.03 0-1.64 1.41-2.97 3.14-2.97 1.74 0 3.14 1.33 3.14 2.97 0 1.02.43 1.97 1.18 2.68s1.77 1.1 2.84 1.1c1.07 0 2.09-.39 2.84-1.1.75-.71 1.18-1.65 1.18-2.68 0-.28.22-.5.5-.5s.5.22.5.5c0 1.33-.49 2.55-1.36 3.73z"/>
        </svg>
        Enable biometric unlock
      </button>

      <!-- Skip button (text) -->
      <button class="btn-text"
              data-component-type="button" data-component-id="skip_button"
              data-from-ui-yaml-path="components[4]"
              data-action="skip_enrollment"
              aria-label="Skip biometric setup and continue with passcode">
        Use passcode only
      </button>
    </div>

  </main>
</div>
</div>
</body>
</html>
