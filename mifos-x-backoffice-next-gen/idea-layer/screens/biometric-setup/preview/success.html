<!doctype html>
<!-- render-hash: biometricsetupsuccess01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biometric Setup — success</title>
<style>
:root {
  --primary: #0091EA; --on-primary: #FFFFFF; --primary-container: #CBE6FF; --on-primary-container: #001E30;
  --secondary: #00796B; --on-secondary: #FFFFFF; --secondary-container: #B8F2E6; --on-secondary-container: #00201A;
  --success: #2E7D32; --on-success: #FFFFFF; --success-container: #C8E6C9; --on-success-container: #002106;
  --surface: #FCFCFF; --on-surface: #1A1C1E;
  --surface-variant: #DEE3EB; --on-surface-variant: #42474E;
  --surface-container-low: #F3F4F9; --surface-container: #EDEFF4;
  --outline: #72777F; --outline-variant: #C2C7CF;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 9999px;
  --el-1: 0 1px 2px rgba(0,0,0,0.05);
  --el-2: 0 2px 6px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; background: #E8EAED; font-family: var(--font-body); }
body { display: flex; align-items: flex-start; justify-content: center; padding: 24px 0; }
.device {
  width: 360px; min-height: 720px;
  background: var(--surface);
  border-radius: 40px; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.08);
  display: flex; flex-direction: column; position: relative;
}
header[data-shell="top-app-bar"] {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 24px));
  background: var(--surface);
  border-bottom: 1px solid var(--outline-variant);
  box-shadow: var(--el-1);
}
.leading-btn {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: transparent; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--on-surface-variant);
}
.bar-title { font-size: 1.375rem; font-weight: 600; color: var(--on-surface); flex: 1; }
main {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 0 24px 40px; overflow-y: auto;
}

/* Success illustration */
.illustration-area {
  display: flex; flex-direction: column; align-items: center;
  padding: 48px 0 32px;
}
.success-ring {
  width: 152px; height: 152px; border-radius: 50%;
  background: var(--success-container);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  animation: successPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes successPop {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.success-ring::before {
  content: ''; position: absolute; inset: 6px; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--success) 25%, transparent);
}
.check-icon { color: var(--success); }

.text-block {
  display: flex; flex-direction: column; gap: 10px;
  text-align: center; padding: 0 8px;
}
.headline { font-size: 1.375rem; font-weight: 600; color: var(--on-surface); line-height: 1.3; }
.description { font-size: 0.9375rem; color: var(--on-surface-variant); line-height: 1.6; }

/* Confirmation details card */
.confirm-card {
  display: flex; flex-direction: column; gap: 0;
  margin-top: 24px; width: 100%;
  background: var(--surface-container-low);
  border: 1px solid var(--outline-variant);
  border-radius: var(--r-lg); overflow: hidden;
}
.confirm-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--surface-variant);
}
.confirm-row:last-child { border-bottom: none; }
.confirm-icon { color: var(--secondary); flex-shrink: 0; }
.confirm-label { font-size: 0.875rem; color: var(--on-surface-variant); }
.confirm-value { font-size: 0.875rem; font-weight: 500; color: var(--on-surface); margin-left: auto; font-family: var(--font-mono); }
.confirm-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 10px; border-radius: var(--r-full);
  background: var(--success-container); color: var(--on-success-container);
  font-size: 0.75rem; font-weight: 600; margin-left: auto;
}

.actions {
  margin-top: auto; padding-top: 32px; width: 100%;
  display: flex; flex-direction: column; gap: 0;
}
.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; border-radius: var(--r-xl); border: none;
  background: var(--primary); color: var(--on-primary);
  font-family: var(--font-body); font-size: 0.9375rem; font-weight: 500;
  cursor: pointer; box-shadow: var(--el-2);
  transition: filter 100ms ease;
}
.btn-primary:active { filter: brightness(0.92); }

.state-badge {
  position: absolute; top: 12px; right: 16px;
  font-size: 0.6875rem; font-weight: 600; font-family: var(--font-mono);
  color: var(--on-surface-variant); background: var(--surface-variant);
  padding: 2px 8px; border-radius: var(--r-full); opacity: 0.7; z-index: 5;
}
</style>
</head>
<body>
<div class="device">
<div data-shell="root" data-screen-id="biometric-setup" data-state="success">
  <span class="state-badge">success</span>

  <header data-shell="top-app-bar">
    <button class="leading-btn" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
    <h1 class="bar-title">Biometric Setup</h1>
  </header>

  <main data-shell="content" data-state="success">

    <!-- Success illustration -->
    <div class="illustration-area"
         data-component-type="image" data-component-id="illustration"
         data-from-ui-yaml-path="components[1]"
         aria-label="Fingerprint setup complete">
      <div class="success-ring">
        <!-- Check circle icon -->
        <svg class="check-icon" width="72" height="72" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
      </div>
    </div>

    <div class="text-block">
      <!-- demo-data enrolled_success: "Fingerprint unlock enabled!" -->
      <h2 class="headline">Fingerprint unlock enabled!</h2>
      <p class="description">You can now unlock Mifos Back Office with your fingerprint. Your passcode remains available as a fallback.</p>
    </div>

    <!-- Confirm what was written to secure_prefs -->
    <div class="confirm-card" role="list" aria-label="Setup summary">
      <div class="confirm-row" role="listitem">
        <svg class="confirm-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.25.13.34.43.21.67-.09.18-.26.28-.44.28zM3.5 9.72c-.1 0-.2-.03-.29-.09-.23-.16-.28-.47-.12-.7.99-1.4 2.25-2.5 3.75-3.27C9.98 4.04 14 4.03 17.15 6.07c1.5.77 2.76 1.86 3.75 3.25.16.22.11.54-.12.7-.23.16-.54.11-.7-.12-.9-1.26-2.04-2.25-3.39-2.94-2.87-1.86-6.65-1.87-9.54.01-1.36.69-2.5 1.68-3.4 2.96-.08.14-.23.19-.25.19zm6.25 12.07c-.13 0-.26-.05-.35-.15-.87-.87-1.34-1.43-2.01-2.64-.69-1.23-1.05-2.73-1.05-4.34 0-2.97 2.54-5.39 5.66-5.39s5.66 2.42 5.66 5.39c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.42-2.09-4.39-4.66-4.39-2.57 0-4.66 1.97-4.66 4.39 0 1.44.32 2.77.93 3.85.64 1.15 1.08 1.64 1.85 2.42.19.2.19.51 0 .71-.11.1-.24.15-.37.15zm7.17-1.85c-1.19 1.19-2.85 1.85-4.81 1.85-1.24 0-2.31-.31-3.28-.94-.97-.63-1.72-1.51-2.23-2.61-.42-.9-.64-1.95-.64-3.03 0-1.64 1.41-2.97 3.14-2.97 1.74 0 3.14 1.33 3.14 2.97 0 1.02.43 1.97 1.18 2.68s1.77 1.1 2.84 1.1c1.07 0 2.09-.39 2.84-1.1.75-.71 1.18-1.65 1.18-2.68 0-.28.22-.5.5-.5s.5.22.5.5c0 1.33-.49 2.55-1.36 3.73z"/>
        </svg>
        <span class="confirm-label">Biometric type</span>
        <!-- demo-data: biometric_type: fingerprint -->
        <span class="confirm-value">Fingerprint</span>
      </div>
      <div class="confirm-row" role="listitem">
        <svg class="confirm-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3zm0 10.99h6c-.47 3.96-3.09 7.51-6 8.93V13H6V7.38l6-2.25v7.86z"/>
        </svg>
        <span class="confirm-label">secure_prefs state</span>
        <!-- demo-data: biometric_lock_enabled: true -->
        <span class="confirm-chip">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          enabled
        </span>
      </div>
      <div class="confirm-row" role="listitem">
        <svg class="confirm-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
        <span class="confirm-label">Passcode fallback</span>
        <span class="confirm-value" style="color:var(--secondary)">Active</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary"
              data-component-type="button" data-component-id="done_button"
              data-from-ui-yaml-path="components[5]"
              data-action="finish_setup" data-nav-to="m17-sync-settings"
              aria-label="Finish biometric setup and return to settings">
        Done
      </button>
    </div>

  </main>
</div>
</div>
</body>
</html>
