<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Capability Bootstrap - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Roboto", "Inter", "sans-serif"],
                        "display": ["Roboto", "Inter", "sans-serif"],
                        "body": ["Roboto", "Inter", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
                        "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
                        "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
                        "body": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
                        "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
                        "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer-base {
            background: linear-gradient(90deg, #DEE3EB 25%, #F3F4F9 50%, #DEE3EB 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        /* Prevent layout shift */
        body {
            background-color: #FCFCFF;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .main-canvas {
            min-height: calc(100vh - 56px - 64px); /* TopAppBar (56px) + BottomNavBar (64px) */
            padding-bottom: 80px; /* Padding for FAB and Nav */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background">
<!-- TopAppBar Shell -->
<header class="bg-surface text-primary border-b border-outline docked full-width top-0 sticky z-50 flex justify-between items-center px-4 w-full h-14">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant/50 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline text-h3 font-bold text-on-surface">Mifos-X Back Office</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</div>
</header>
<!-- Main Content Canvas (Skeleton State) -->
<main class="main-canvas max-w-4xl mx-auto px-4 py-6 flex flex-col gap-6">
<!-- 1. Header Shimmer -->
<div class="shimmer-base h-10 w-3/4 rounded-md"></div>
<!-- 2. Persona Summary Card Shimmer -->
<div class="bg-surface border border-outline rounded-lg p-4 flex flex-col gap-4">
<div class="shimmer-base h-6 w-1/3 rounded-sm"></div>
<div class="flex flex-col gap-2">
<div class="shimmer-base h-4 w-full rounded-sm"></div>
<div class="shimmer-base h-4 w-full rounded-sm"></div>
<div class="shimmer-base h-4 w-2/3 rounded-sm"></div>
</div>
</div>
<!-- 3. Module Roster Area Shimmer -->
<div class="flex flex-col gap-3">
<div class="shimmer-base h-5 w-40 rounded-sm mb-2"></div>
<div class="space-y-3">
<!-- 5-6 Smaller horizontal blocks -->
<div class="shimmer-base h-16 w-full rounded-md border border-outline/20"></div>
<div class="shimmer-base h-16 w-full rounded-md border border-outline/20"></div>
<div class="shimmer-base h-16 w-full rounded-md border border-outline/20"></div>
<div class="shimmer-base h-16 w-full rounded-md border border-outline/20"></div>
<div class="shimmer-base h-16 w-full rounded-md border border-outline/20"></div>
<div class="shimmer-base h-16 w-full rounded-md border border-outline/20"></div>
</div>
</div>
<!-- 4. Version Info Chip Shimmer -->
<div class="flex">
<div class="shimmer-base h-8 w-24 rounded-xl"></div>
</div>
<!-- 5. Row Shimmer containing two distinct blocks -->
<div class="flex gap-4 w-full">
<div class="shimmer-base h-24 flex-1 rounded-lg"></div>
<div class="shimmer-base h-24 flex-1 rounded-lg"></div>
</div>
<!-- 6. Primary Button Shimmer -->
<div class="shimmer-base h-12 w-full rounded-xl mt-4"></div>
<!-- 7. Text Link Shimmer -->
<div class="flex justify-center">
<div class="shimmer-base h-4 w-32 rounded-sm"></div>
</div>
<!-- 8. Two additional button-shaped shimmers at the bottom -->
<div class="flex flex-col sm:flex-row gap-3 mt-4">
<div class="shimmer-base h-12 flex-1 rounded-xl"></div>
<div class="shimmer-base h-12 flex-1 rounded-xl"></div>
</div>
</main>
<!-- Contextual FAB (Suppressed on Details screen according to rules, but kept placeholder if required by intent) -->
<!-- As per rule: "You MUST suppress the FAB on Settings, Profile, Details, and Transactional screens." -->
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center px-4 py-2 h-16">
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all p-1 rounded-md">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[10px] font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all p-1 rounded-md">
<span class="material-symbols-outlined">groups</span>
<span class="font-label text-[10px] font-medium">Clients</span>
</div>
<!-- Active state for "Collections" or "Sync" or Home based on context; defaulting to Home for generic loading -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all p-1 rounded-md">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label text-[10px] font-medium">Collections</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all p-1 rounded-md">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[10px] font-medium">Sync</span>
</div>
</nav>
<!-- Micro-interaction script for the skeleton pulse -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Optional: Randomize shimmer timing slightly for more "organic" feel
            const shimmers = document.querySelectorAll('.shimmer-base');
            shimmers.forEach((el, index) => {
                el.style.animationDelay = `${index * 0.05}s`;
            });
        });
    </script>
</body></html>
