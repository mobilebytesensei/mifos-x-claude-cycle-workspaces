<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos Back Office - Clients</title>
<!-- Google Fonts: Roboto & Roboto Mono -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Inter:wght@400;600;700&amp;family=Public+Sans:wght@500&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "tertiary": "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "background": "#FCFCFF",
              "on-background": "#1A1C1E",
              "outline": "#72777F",
              "success": "#2E7D32",
              "warning": "#F57C00",
              "warning-strong": "#B45309",
              "error": "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002",
            },
            borderRadius: {
              "DEFAULT": "0.125rem",
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            spacing: {
              "xs": "4px",
              "sm": "8px",
              "md": "16px",
              "lg": "24px",
              "xl": "32px",
              "xxl": "48px"
            },
            fontFamily: {
              "headline": ["Inter", "Roboto", "sans-serif"],
              "display": ["Inter", "Roboto", "sans-serif"],
              "body": ["Roboto", "sans-serif"],
              "label": ["Public Sans", "Roboto", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"]
            },
            fontSize: {
              "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
              "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
              "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
              "body": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
              "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
              "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #DEE3EB;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface text-primary border-b border-outline flex justify-between items-center px-md h-14 w-full">
<div class="flex items-center gap-md">
<button aria-label="Menu" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold">Clients</h1>
</div>
<div class="flex items-center gap-sm">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined">search</span>
</button>
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-primary-container" style="font-size: 20px;">person</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-14 mb-20 px-md py-md flex flex-col gap-lg">
<!-- Search and Filter Section -->
<section class="flex flex-col gap-md">
<!-- Search Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-surface-variant border-none rounded-sm text-on-surface focus:ring-2 focus:ring-primary transition-all duration-200 font-body" placeholder="Search Clients" type="text"/>
</div>
<!-- Filter Chip Row -->
<div class="flex gap-sm overflow-x-auto custom-scrollbar pb-2">
<button class="flex items-center gap-xs px-4 py-1.5 bg-primary-container text-on-primary-container rounded-full border border-primary font-label whitespace-nowrap active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-size: 18px;">check</span>
                    All Clients
                </button>
<button class="flex items-center gap-xs px-4 py-1.5 bg-surface border border-outline text-on-surface-variant rounded-full font-label whitespace-nowrap hover:bg-surface-variant active:scale-95 transition-transform">
                    Active
                </button>
<button class="flex items-center gap-xs px-4 py-1.5 bg-surface border border-outline text-on-surface-variant rounded-full font-label whitespace-nowrap hover:bg-surface-variant active:scale-95 transition-transform">
                    Pending
                </button>
<button class="flex items-center gap-xs px-4 py-1.5 bg-surface border border-outline text-on-surface-variant rounded-full font-label whitespace-nowrap hover:bg-surface-variant active:scale-95 transition-transform">
                    Closed
                </button>
<button class="flex items-center gap-xs px-4 py-1.5 bg-surface border border-outline text-on-surface-variant rounded-full font-label whitespace-nowrap hover:bg-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-size: 18px;">tune</span>
                    More Filters
                </button>
</div>
</section>
<!-- Empty State Region -->
<section class="flex-1 flex flex-col items-center justify-center text-center p-xl gap-lg bg-surface rounded-lg">
<div class="relative w-full max-w-sm aspect-square flex items-center justify-center">
<!-- Background decorative element for the empty state -->
<div class="absolute inset-0 bg-primary-container/10 rounded-full blur-3xl"></div>
<img alt="No clients found" class="relative z-10 w-64 h-64 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtXfHXTMZxYrl5TjBhrveES5EOjGtchc66-dUzXfCkd9wlznESBYo6v3q8EnqT_U6mxWaDj8FY9MIjILa_NiFSJy8hFJDWUp68Gs0X4EwYS8WE9s9V-DXVpk6ua01wj60leM_iThv4Rc3CGD80437Mouudfkf0gaQXVD_wvbPLaDIP8opGPSolX4OtVkQLQsv6Kr6hMuaBzumyojqJuVQL0NZolg7Tpb_vs1RZV2aIngDYJkMetY5DLeUE"/>
</div>
<div class="flex flex-col items-center gap-sm max-w-xs">
<h2 class="font-headline text-h2 text-on-surface">No clients found</h2>
<p class="font-body text-on-surface-variant">Your client registry is currently empty. Get started by adding your first financial member to the platform.</p>
</div>
<button class="bg-primary text-on-primary font-label py-3 px-lg rounded-xl flex items-center gap-sm shadow-sm hover:shadow-md active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined">person_add</span>
                Create New Client
            </button>
</section>
</main>
<!-- FAB (Create Action) -->
<!-- Positioned according to M3 standards for task alignment -->
<button aria-label="New Client" class="fixed bottom-24 right-md w-14 h-14 bg-secondary text-on-secondary rounded-lg flex items-center justify-center shadow-lg hover:brightness-110 active:scale-95 transition-all duration-200 z-40">
<span class="material-symbols-outlined" style="font-size: 24px; font-variation-settings: 'wght' 600;">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface text-primary border-t border-outline flex justify-around items-center h-20 px-sm w-full">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors duration-200 py-1 px-4 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-label font-medium">Home</span>
</a>
<!-- Clients (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label text-label font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors duration-200 py-1 px-4 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-label font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-colors duration-200 py-1 px-4 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-label font-medium">Sync</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ripple effect logic could be added here
            const buttons = document.querySelectorAll('button, a');
            buttons.forEach(button => {
                button.addEventListener('mousedown', function(e) {
                    // Visual feedback is primarily handled by Tailwind's active:scale-95
                });
            });
        });
    </script>
</body></html>
