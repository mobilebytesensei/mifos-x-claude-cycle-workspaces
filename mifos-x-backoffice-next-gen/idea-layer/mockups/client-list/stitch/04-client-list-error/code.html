<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Inter:wght@400;600;700&amp;family=Public+Sans:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px",
                    },
                    fontFamily: {
                        "headline": ["Roboto", "Inter", "sans-serif"],
                        "display": ["Roboto", "Inter", "sans-serif"],
                        "body": ["Roboto", "Inter", "sans-serif"],
                        "label": ["Public Sans", "Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
                        "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
                        "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
                        "body": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
                        "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
                        "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }],
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
            -webkit-tap-highlight-color: transparent;
        }
        .error-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex justify-between items-center px-md h-14 w-full">
<div class="flex items-center gap-md">
<button class="p-2 hover:bg-surface-variant transition-colors duration-200 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-primary">Clients</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a corporate branch manager, wearing a clean, modern suit, looking friendly and capable. The lighting is soft and high-key, emphasizing trust and reliability within a bright office environment, adhering to the Mifos light-blue primary palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9PZGdfd0yOQ5KbuG9yjzDHtq3fFn_3HKySw5TRbDfn7lA3iMIMuOYyzEmdzJJDUrH0_QSyh_nkbsOPAuHmWyJTmz403qt40ogQkTT1OaeK99loEvqw_Y5pxCQALBX6HHRiO7nd2t0Ux0HuY7VBWt0WF85X0xgkb27etjp4n9nIaVtWEa_UaiCNmsNmAo4UuvKUj12TlzYqAUEBnbGrgAFDn0wVBRUieXcOcSQSBjRj1OvKVEG8ABjEo26xUp_g4-1tZHUD0UQ40Q1"/>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-14 pb-20 px-md flex flex-col gap-md max-w-2xl mx-auto w-full">
<!-- Search Field -->
<div class="mt-md">
<div class="flex items-center bg-surface-variant rounded-sm px-md h-14 group focus-within:ring-2 focus-within:ring-primary transition-all" id="cl_search">
<span class="material-symbols-outlined text-on-surface-variant mr-3">search</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body text-on-surface placeholder-on-surface-variant" placeholder="Search Clients" type="text"/>
</div>
</div>
<!-- Filter Chips -->
<div class="flex gap-sm overflow-x-auto pb-xs no-scrollbar" id="cl_status_filter">
<button class="flex-shrink-0 px-md py-1.5 bg-primary-container text-on-primary-container rounded-full text-label font-medium transition-transform active:scale-95">All Clients</button>
<button class="flex-shrink-0 px-md py-1.5 border border-outline text-on-surface-variant rounded-full text-label font-medium hover:bg-surface-variant transition-colors">Active</button>
<button class="flex-shrink-0 px-md py-1.5 border border-outline text-on-surface-variant rounded-full text-label font-medium hover:bg-surface-variant transition-colors">Pending</button>
<button class="flex-shrink-0 px-md py-1.5 border border-outline text-on-surface-variant rounded-full text-label font-medium hover:bg-surface-variant transition-colors">Overdue</button>
</div>
<!-- Error State Body -->
<div class="flex-grow flex flex-col items-center justify-center py-xl text-center">
<div class="w-64 h-64 mb-lg relative error-shake">
<!-- Circular background consistent with image archetype -->
<div class="absolute inset-0 rounded-full border-2 border-surface-variant opacity-50"></div>
<!-- Error Illustration Container -->
<div class="w-full h-full flex items-center justify-center p-md">
<img class="w-full h-full object-contain" data-alt="A flat, modern vector illustration of a broken circuit board connection. Blue and grey electrical lines snap in the middle with geometric shards and sparks flying out. The style is clean, technical, and clinical, using a palette of deep blue and slate grey on a pure white background, mimicking the visual language of financial software error states." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC70GOC6doU6FVfeoilpFz5WsFNCqY0aP7taRgq_x_pozGYTwPQ_gca0358X7rW8qK7jl-AuQBgRHXsaSvlAEviDd4GCUZ5BqZlRIysbvjzlLwPlYpUna6A9YRqEFiHj7Pr28_XSNBzAMe_qY2ow1PffRvtXgI_c1Jdk28cztGIDB8WXsOFk-YsO-3ZjWjwz-7eFSgEDoVR7Lsd2n44PDdTLyYSNwuguJmTlTKcBpBYGOVF-oUjgeL2vedap8UId_szhzx1Fnw_NV2B"/>
</div>
</div>
<h2 class="text-h2 font-bold text-on-surface mb-sm">Unable to load clients</h2>
<p class="text-body text-on-surface-variant max-w-xs mb-xl">
                Something went wrong while fetching the client list. Please check your connection and try again.
            </p>
<button class="bg-primary text-on-primary rounded-xl px-xl py-md text-label font-bold flex items-center gap-sm active:scale-95 transition-all shadow-sm" id="cl_error_retry" onclick="this.classList.add('animate-pulse')">
<span class="material-symbols-outlined">refresh</span>
                Retry
            </button>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-md bg-secondary text-on-secondary w-14 h-14 rounded-lg flex items-center justify-center shadow-lg active:scale-90 transition-transform duration-200 z-40" id="cl_new_client">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 px-sm w-full">
<a class="flex flex-col items-center justify-center text-on-surface-variant active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-label font-medium">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label text-label font-medium">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-label font-medium">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-label font-medium">Sync</span>
</a>
</nav>
<script>
        // Micro-interaction for retry button
        document.getElementById('cl_error_retry').addEventListener('click', function() {
            const btn = this;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Retrying...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">refresh</span> Retry';
                btn.disabled = false;
                btn.classList.remove('opacity-80');
            }, 2000);
        });

        // FAB active state
        const fab = document.getElementById('cl_new_client');
        fab.addEventListener('touchstart', () => fab.classList.add('scale-90'));
        fab.addEventListener('touchend', () => fab.classList.remove('scale-90'));
    </script>
</body></html>
