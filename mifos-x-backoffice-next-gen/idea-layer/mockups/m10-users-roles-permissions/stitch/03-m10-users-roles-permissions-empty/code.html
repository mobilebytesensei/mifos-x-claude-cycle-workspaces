        document.querySelectorAll('.flex.gap-sm button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.flex.gap-sm button').forEach(b => {
                    b.classList.remove('bg-primary-container', 'text-on-primary-container', 'font-bold');
                    b.classList.add('bg-surface', 'border', 'border-outline', 'text-on-surface-variant', 'font-medium');
                });
                button.classList.add('bg-primary-container', 'text-on-primary-container', 'font-bold');
                button.classList.remove('bg-surface', 'border', 'border-outline', 'text-on-surface-variant', 'font-medium');
            });
