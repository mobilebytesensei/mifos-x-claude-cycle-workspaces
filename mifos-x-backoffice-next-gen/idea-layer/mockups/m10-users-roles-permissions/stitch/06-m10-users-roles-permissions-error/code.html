<style>
        body {
            font-family: 'Roboto Flex', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .error-circle-glow {
            box-shadow: 0 0 20px rgba(186, 26, 26, 0.1);
        }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile h-14 w-full">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:bg-surface-variant transition-colors p-2 rounded-full active:opacity-80">
                account_balance
            </button>
<h1 class="font-headline-sm text-[24px] font-bold text-primary">Teal Ledger</h1>
</div>
<div class="flex items-center gap-2">
<button class="material-symbols-outlined text-primary hover:bg-surface-variant transition-colors p-2 rounded-full active:opacity-80">
                account_circle
            </button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-start px-margin-mobile md:px-margin-desktop py-6 overflow-y-auto w-full max-w-container-max-width mx-auto">
<!-- Header (#header) -->
<div class="mb-6" id="header">
<h2 class="font-title-lg text-title-lg text-on-surface">Users &amp; Permissions</h2>
</div>
<!-- Chip (#tab_strip) -->
<div class="flex gap-2 mb-8" id="tab_strip">
<button class="bg-secondary-container text-on-secondary-container px-6 py-2 rounded-full font-label-lg text-label-lg transition-colors border border-transparent">
                Users
            </button>
<button class="bg-surface-container text-on-surface-variant px-6 py-2 rounded-full font-label-lg text-label-lg hover:bg-surface-variant transition-colors border border-outline-variant">
                Roles
            </button>
</div>
<!-- Content Area (#content_area) -->
<div class="w-full flex-grow flex flex-col items-center justify-center py-12" id="content_area">
<!-- Error State Container -->
<div class="max-w-md w-full flex flex-col items-center text-center">
<!-- Error Illustration -->
<div class="w-24 h-24 bg-error-container rounded-full flex items-center justify-center mb-6 error-circle-glow">
<span class="material-symbols-outlined text-error text-5xl" style="font-variation-settings: 'FILL' 1;">
                        cloud_off
                    </span>
</div>
<!-- Message -->
<h3 class="font-title-lg text-title-lg text-on-surface mb-2">Oops! Something went wrong.</h3>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-10 max-w-sm">
                    Unable to load users &amp; permissions data. Please check your connection and try again.
                </p>
<!-- Retry Button (#retry_button) -->
<button class="bg-primary hover:bg-primary-container text-on-primary px-10 py-3 rounded-full font-label-lg text-label-lg shadow-sm hover:shadow-md transition-all active:scale-95 flex items-center gap-2" id="retry_button" onclick="retryLoad()">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                    Retry
                </button>
</div>
</div>
</main>
<!-- Spacer for Navigation -->
<div class="h-20"></div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 bg-surface-container pb-safe px-2">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-all active:scale-95 duration-100">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 transition-all active:scale-95 duration-100">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-md text-label-md">Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-all active:scale-95 duration-100">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-md text-label-md">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-all active:scale-95 duration-100">
<span class="material-symbols-outlined">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</button>
</nav>
<script>
        function retryLoad() {
            const btn = document.getElementById('retry_button');
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Interaction feedback
            icon.classList.add('animate-spin');
            btn.style.opacity = '0.7';
            btn.disabled = true;
            btn.innerText = 'Retrying...';

            // Simulate reload attempt
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.style.opacity = '1';
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">refresh</span>Retry';
                // In a real app, this would trigger the actual data fetch
            }, 1500);
        }
    </script>
</body></html>
