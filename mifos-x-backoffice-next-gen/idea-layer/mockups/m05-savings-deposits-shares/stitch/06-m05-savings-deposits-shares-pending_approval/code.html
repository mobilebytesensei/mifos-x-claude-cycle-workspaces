<style>
        body {
            font-family: 'Roboto Flex', sans-serif;
            background-color: #f7fafa;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #bdc9c8;
            border-radius: 10px;

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface border-b border-outline-variant">
<div class="flex justify-between items-center h-16 px-margin-desktop w-full max-w-container-max-width mx-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="account_balance">account_balance</span>
<h1 class="font-title-lg text-title-lg font-bold text-primary">Enterprise Ledger</h1>
</div>
<div class="flex items-center">
<button class="material-symbols-outlined text-on-surface-variant p-2 hover:bg-surface-container-high rounded-full transition-colors cursor-pointer active:opacity-80" data-icon="account_circle">account_circle</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-container-max-width mx-auto px-margin-desktop py-6 flex flex-col gap-6 overflow-y-auto custom-scrollbar pb-32">
<!-- Header -->
<section class="flex flex-col gap-2">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Accounts</h2>
</section>
<!-- Chips/Tabs -->
<nav class="flex gap-2 overflow-x-auto pb-2">
<button class="bg-primary-container text-on-primary-container px-6 py-2 rounded-full font-label-lg text-label-lg transition-all active:scale-95 cursor-pointer">Savings</button>
<button class="bg-surface-container-high text-on-surface-variant px-6 py-2 rounded-full font-label-lg text-label-lg hover:bg-surface-variant transition-all active:scale-95 cursor-pointer">Fixed Deposit</button>
<button class="bg-surface-container-high text-on-surface-variant px-6 py-2 rounded-full font-label-lg text-label-lg hover:bg-surface-variant transition-all active:scale-95 cursor-pointer">Share</button>
</nav>
<!-- Master-Detail Content -->
<div class="flex flex-col lg:flex-row gap-8 items-start">
<!-- List (Master) -->
<div class="w-full lg:w-1/3 flex flex-col gap-4">
<span class="font-label-md text-label-md tracking-wider text-on-surface-variant uppercase">ACCOUNT LIST</span>
<!-- Pending Account Card -->
<article class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl flex flex-col gap-3 transition-all hover:border-primary cursor-pointer group active:bg-surface-container">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">Johnathan Q. Sterling</span>
<span class="font-body-md text-body-md text-on-surface-variant">ID: SA-004825</span>
</div>
<span class="bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-tight">Pending Approval</span>
</div>
<div class="pt-2 border-t border-outline-variant">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Available Balance</span>
<div class="font-headline-sm text-headline-sm text-primary">$42,950.00</div>
</div>
</article>
</div>
<!-- Operations (Detail/Actions) -->
<div class="w-full lg:w-2/3 flex flex-col gap-4">
<span class="font-label-md text-label-md tracking-wider text-on-surface-variant uppercase">OPERATIONS</span>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Edit Account <span class="material-symbols-outlined text-on-surface-variant" data-icon="edit">edit</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-primary text-on-primary rounded-lg font-body-lg text-body-lg hover:brightness-110 transition-all cursor-pointer active:scale-95">
                        Approve <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Activate <span class="material-symbols-outlined text-on-surface-variant" data-icon="power_settings_new">power_settings_new</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Deposit <span class="material-symbols-outlined text-on-surface-variant" data-icon="account_balance_wallet">account_balance_wallet</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Withdrawal <span class="material-symbols-outlined text-on-surface-variant" data-icon="atm">atm</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Hold <span class="material-symbols-outlined text-on-surface-variant" data-icon="front_hand">front_hand</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Post Interest <span class="material-symbols-outlined text-on-surface-variant" data-icon="trending_up">trending_up</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Close Deposit <span class="material-symbols-outlined text-on-surface-variant" data-icon="lock_clock">lock_clock</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Subscribe Shares <span class="material-symbols-outlined text-on-surface-variant" data-icon="add_chart">add_chart</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Redeem Shares <span class="material-symbols-outlined text-on-surface-variant" data-icon="sell">sell</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Transfer <span class="material-symbols-outlined text-on-surface-variant" data-icon="move_up">move_up</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Standing Instruction <span class="material-symbols-outlined text-on-surface-variant" data-icon="rebase_edit">rebase_edit</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80">
                        Close Account <span class="material-symbols-outlined text-on-surface-variant" data-icon="no_accounts">no_accounts</span>
</button>
<button class="flex items-center justify-between px-4 py-3 bg-error-container text-on-error-container rounded-lg font-body-lg text-body-lg hover:brightness-95 transition-all cursor-pointer active:scale-95">
                        Review Failed <span class="material-symbols-outlined" data-icon="report">report</span>
</button>
<button class="flex items-center justify-center gap-2 px-4 py-3 bg-surface-container border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer active:opacity-80 col-span-full">
                        Retry Operations <span class="material-symbols-outlined text-on-surface-variant" data-icon="sync">sync</span>
</button>
</div>
</div>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-6 bg-primary-container text-on-primary-container flex items-center gap-3 px-6 py-4 rounded-xl shadow-lg hover:shadow-xl transition-all active:scale-90 z-40 cursor-pointer">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span class="font-label-lg text-label-lg">Open Account</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-gutter bg-surface-container border-t border-outline-variant">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all cursor-pointer active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-all cursor-pointer active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-md text-label-md">Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all cursor-pointer active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-md text-label-md">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all cursor-pointer active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</button>
</nav>
<script>
        // Micro-interactions for chips/tabs
        document.querySelectorAll('nav button').forEach(button => {
            button.addEventListener('click', function() {
                if(this.parentElement.tagName === 'NAV' && !this.closest('nav.fixed')) {
                    document.querySelectorAll('nav button').forEach(b => {
                        if(!b.closest('nav.fixed')) {
                            b.classList.remove('bg-primary-container', 'text-on-primary-container');
                            b.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                        }
                    });
                    this.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                    this.classList.add('bg-primary-container', 'text-on-primary-container');
                }
            });
        });
    </script>
</body></html>
