<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#324b4b",
                        "on-surface": "#181c1d",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#006565",
                        "on-primary-fixed-variant": "#004f4f",
                        "error": "#ba1a1a",
                        "surface-dim": "#d7dbdb",
                        "on-tertiary-fixed": "#002020",
                        "tertiary": "#006565",
                        "tertiary-container": "#277e7e",
                        "surface-tint": "#006a6a",
                        "secondary": "#4a6363",
                        "surface-container-low": "#f1f4f4",
                        "inverse-primary": "#76d6d5",
                        "secondary-container": "#cce8e7",
                        "surface-container-high": "#e6e9e9",
                        "on-tertiary-fixed-variant": "#004f4f",
                        "on-secondary-fixed": "#051f20",
                        "secondary-fixed": "#cce8e7",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#506969",
                        "surface-container-highest": "#e0e3e3",
                        "on-primary": "#ffffff",
                        "outline-variant": "#bdc9c8",
                        "tertiary-fixed": "#a0f0f0",
                        "on-surface-variant": "#3e4949",
                        "inverse-surface": "#2d3131",
                        "secondary-fixed-dim": "#b1cccb",
                        "background": "#f7fafa",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "on-background": "#181c1d",
                        "outline": "#6e7979",
                        "surface-variant": "#e0e3e3",
                        "primary-container": "#008080",
                        "primary-fixed": "#93f2f2",
                        "inverse-on-surface": "#eef1f1",
                        "surface-bright": "#f7fafa",
                        "primary-fixed-dim": "#76d6d5",
                        "surface-container": "#ebeeee",
                        "on-tertiary-container": "#e0fffe",
                        "surface": "#f7fafa",
                        "on-primary-fixed": "#002020",
                        "on-primary-container": "#e3fffe",
                        "tertiary-fixed-dim": "#84d4d3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "unit": "4px",
                        "margin-desktop": "24px",
                        "container-max-width": "1440px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Roboto Flex"],
                        "label-md": ["Roboto Flex"],
                        "body-md": ["Roboto Flex"],
                        "label-lg": ["Roboto Flex"],
                        "display-lg": ["Roboto Flex"],
                        "title-md": ["Roboto Flex"],
                        "title-lg": ["Roboto Flex"],
                        "body-lg": ["Roboto Flex"],
                        "headline-sm": ["Roboto Flex"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                        "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                        "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                        "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Roboto Flex', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spin-slow 1s linear infinite;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface border-b border-outline-variant">
<div class="flex justify-between items-center h-16 px-margin-mobile w-full">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="account_balance">account_balance</span>
<h1 class="font-title-lg text-title-lg font-bold text-primary">Accounts</h1>
</div>
<div class="cursor-pointer active:opacity-80 transition-colors hover:bg-surface-container-high p-2 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<main class="flex flex-col gap-4 pb-32">
<!-- Account Type Chips -->
<div class="flex gap-2 px-margin-mobile pt-4 overflow-x-auto no-scrollbar">
<button class="flex items-center justify-center px-4 py-2 rounded-lg bg-primary-container text-on-primary-container font-label-lg text-label-lg transition-all active:scale-95">
                Savings
            </button>
<button class="flex items-center justify-center px-4 py-2 rounded-lg border border-outline text-on-surface-variant font-label-lg text-label-lg transition-all active:scale-95">
                Fixed Deposit
            </button>
<button class="flex items-center justify-center px-4 py-2 rounded-lg border border-outline text-on-surface-variant font-label-lg text-label-lg transition-all active:scale-95">
                Share
            </button>
</div>
<!-- Content Area: Account List -->
<div class="flex flex-col gap-3 px-margin-mobile">
<!-- Submitting State Card -->
<div class="bg-surface-container-lowest border border-primary rounded-xl p-4 flex flex-col gap-2 relative overflow-hidden">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">SA-004825</span>
<span class="font-body-md text-body-md text-on-surface-variant">New Savings Account</span>
</div>
<div class="flex items-center gap-2 bg-primary-container/10 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-primary text-[18px] animate-spin-custom" data-icon="sync">sync</span>
<span class="font-label-md text-label-md text-primary">Submitting...</span>
</div>
</div>
<!-- Visual loading progress bar at the bottom of card -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-primary/10">
<div class="h-full bg-primary animate-[shimmer_2s_infinite]" style="width: 40%;"></div>
</div>
</div>
<!-- Existing Account: Active -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col gap-3 active:bg-surface-container transition-colors cursor-pointer">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">SA-004821</span>
<span class="font-body-md text-body-md text-on-surface-variant">Johnathan Q. Sterling</span>
</div>
<div class="bg-secondary-container text-on-secondary-container px-3 py-1 rounded-full">
<span class="font-label-md text-label-md">Active</span>
</div>
</div>
<div class="flex justify-between items-end border-t border-outline-variant/30 pt-3">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Balance</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-bold">$42,950.00</span>
</div>
</div>
<!-- Existing Account: Pending -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col gap-3 active:bg-surface-container transition-colors cursor-pointer">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-title-md text-title-md text-on-surface">SA-009124</span>
<span class="font-body-md text-body-md text-on-surface-variant">Elena Rodriguez-Smith</span>
</div>
<div class="bg-surface-container-highest text-on-surface-variant px-3 py-1 rounded-full">
<span class="font-label-md text-label-md">Pending</span>
</div>
</div>
<div class="flex justify-between items-end border-t border-outline-variant/30 pt-3">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Balance</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-bold">$12,400.50</span>
</div>
</div>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-6 bg-primary text-on-primary flex items-center gap-3 px-6 py-4 rounded-xl shadow-lg active:scale-95 transition-all z-50">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span class="font-label-lg text-label-lg">Open Account</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe bg-surface-container border-t border-outline-variant">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all cursor-pointer active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<!-- Clients (Active) -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-all cursor-pointer active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-md text-label-md">Clients</span>
</div>
<!-- Collections -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all cursor-pointer active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-md text-label-md">Collections</span>
</div>
<!-- Sync -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all cursor-pointer active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</div>
</nav>
<script>
        // Micro-interaction for account selection
        document.querySelectorAll('.active\\:bg-surface-container').forEach(card => {
            card.addEventListener('click', () => {
                // Future detail view transition
            });
        });
    </script>
</body></html>
