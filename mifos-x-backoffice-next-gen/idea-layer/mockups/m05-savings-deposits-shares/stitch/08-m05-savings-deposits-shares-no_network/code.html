<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Enterprise Ledger - Accounts Offline</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#324b4b",
                    "surface": "#f7fafa",
                    "primary-fixed-dim": "#76d6d5",
                    "outline-variant": "#bdc9c8",
                    "surface-variant": "#e0e3e3",
                    "primary-container": "#008080",
                    "surface-container-lowest": "#ffffff",
                    "background": "#f7fafa",
                    "on-error-container": "#93000a",
                    "surface-container-high": "#e6e9e9",
                    "on-surface-variant": "#3e4949",
                    "on-primary": "#ffffff",
                    "error-container": "#ffdad6",
                    "primary-fixed": "#93f2f2",
                    "on-secondary-container": "#506969",
                    "on-tertiary-container": "#e0fffe",
                    "inverse-primary": "#76d6d5",
                    "on-error": "#ffffff",
                    "secondary-fixed": "#cce8e7",
                    "surface-bright": "#f7fafa",
                    "on-tertiary-fixed-variant": "#004f4f",
                    "tertiary-fixed-dim": "#84d4d3",
                    "on-primary-fixed-variant": "#004f4f",
                    "on-background": "#181c1d",
                    "primary": "#006565",
                    "on-tertiary-fixed": "#002020",
                    "inverse-on-surface": "#eef1f1",
                    "secondary": "#4a6363",
                    "outline": "#6e7979",
                    "on-tertiary": "#ffffff",
                    "on-surface": "#181c1d",
                    "surface-container-highest": "#e0e3e3",
                    "error": "#ba1a1a",
                    "on-secondary": "#ffffff",
                    "surface-dim": "#d7dbdb",
                    "secondary-fixed-dim": "#b1cccb",
                    "tertiary-fixed": "#a0f0f0",
                    "tertiary": "#006565",
                    "on-primary-fixed": "#002020",
                    "surface-container-low": "#f1f4f4",
                    "secondary-container": "#cce8e7",
                    "inverse-surface": "#2d3131",
                    "on-secondary-fixed": "#051f20",
                    "on-primary-container": "#e3fffe",
                    "tertiary-container": "#277e7e",
                    "surface-tint": "#006a6a",
                    "surface-container": "#ebeeee"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "margin-desktop": "24px",
                    "unit": "4px",
                    "container-max-width": "1440px"
            },
            "fontFamily": {
                    "headline-lg": ["Roboto Flex"],
                    "body-lg": ["Roboto Flex"],
                    "title-lg": ["Roboto Flex"],
                    "label-lg": ["Roboto Flex"],
                    "title-md": ["Roboto Flex"],
                    "label-md": ["Roboto Flex"],
                    "headline-sm": ["Roboto Flex"],
                    "display-lg": ["Roboto Flex"],
                    "body-md": ["Roboto Flex"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Roboto Flex', sans-serif;
            background-color: #f7fafa;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface border-b border-outline-variant">
<div class="flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop w-full max-w-container-max-width mx-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary font-title-lg text-title-lg" data-icon="account_balance">account_balance</span>
<h1 class="font-title-lg text-title-lg font-bold text-primary">Accounts</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer active:opacity-80 transition-colors hover:bg-surface-container-high p-2 rounded-full" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<main class="flex-grow flex flex-col w-full max-w-container-max-width mx-auto px-margin-mobile md:px-margin-desktop py-6 gap-8">
<!-- Header & Account Type Tabs -->
<section class="flex flex-col gap-4">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Account Categories</h2>
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
<!-- Savings (Selected) -->
<button class="flex items-center justify-center px-4 py-2 bg-primary-container text-on-primary-container rounded-lg font-label-lg text-label-lg transition-all active:scale-95">
                    Savings
                </button>
<!-- Fixed Deposit -->
<button class="flex items-center justify-center px-4 py-2 border border-outline text-on-surface-variant rounded-lg font-label-lg text-label-lg hover:bg-surface-container-high transition-all active:scale-95">
                    Fixed Deposit
                </button>
<!-- Share -->
<button class="flex items-center justify-center px-4 py-2 border border-outline text-on-surface-variant rounded-lg font-label-lg text-label-lg hover:bg-surface-container-high transition-all active:scale-95">
                    Share
                </button>
</div>
</section>
<!-- Content Area: Account List label -->
<section class="flex flex-col flex-grow">
<div class="mb-4">
<h3 class="font-title-md text-title-md text-on-surface-variant">Account List</h3>
</div>
<!-- Error State Illustration/Content -->
<div class="flex-grow flex flex-col items-center justify-center text-center py-12 px-6">
<div class="mb-6 relative">
<div class="absolute -inset-4 bg-primary/5 rounded-full blur-2xl"></div>
<span class="material-symbols-outlined text-[80px] text-outline opacity-40 select-none" data-icon="wifi_off">wifi_off</span>
</div>
<h4 class="font-headline-sm text-headline-sm text-on-surface mb-3">Unable to load accounts</h4>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mb-10">
                    We encountered a problem while retrieving your account list. Please check your connection and try again.
                </p>
<!-- Retry Button -->
<button class="flex items-center gap-3 px-8 py-3 bg-primary text-on-primary rounded-lg font-title-md text-title-md shadow-sm hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span>Retry</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-gutter bg-surface-container border-t border-outline-variant">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-md text-label-md">Clients</span>
</a>
<!-- Collections (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined fill-icon" data-icon="payments" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md text-label-md">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-secondary-container transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</a>
</nav>
<!-- Spacer for fixed bottom nav -->
<div class="h-20 w-full"></div>
<script>
        // Micro-interaction for retry button
        const retryBtn = document.querySelector('button.bg-primary');
        if(retryBtn) {
            retryBtn.addEventListener('click', () => {
                const icon = retryBtn.querySelector('.material-symbols-outlined');
                icon.classList.add('animate-spin');
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                }, 2000);
            });
        }
    </script>
</body></html>
