<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Savings &amp; Deposits - Offline</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono&amp;family=Inter:wght@400;600;700&amp;family=Public+Sans:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    fontFamily: {
                        "headline": ["Inter", "Roboto", "sans-serif"],
                        "display": ["Inter", "Roboto", "sans-serif"],
                        "body": ["Inter", "Roboto", "sans-serif"],
                        "label": ["Public Sans", "Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .offline-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar (#m05_header) -->
<header class="fixed top-0 w-full z-50 bg-surface flex justify-between items-center px-md h-14 border-b border-outline" id="m05_header">
<div class="flex items-center gap-md">
<button aria-label="Menu" class="p-2 transition-colors duration-200 hover:bg-surface-variant rounded-full text-primary">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-xl font-bold text-primary">Savings &amp; Deposits</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full border border-outline overflow-hidden flex items-center justify-center bg-surface-variant">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="person">person</span>
</div>
</div>
</header>
<!-- Offline Banner (Design System Component) -->
<div class="mt-14 w-full bg-warning-strong text-white px-md py-2 flex items-center justify-center gap-sm sticky top-14 z-40">
<span class="material-symbols-outlined text-[18px]" data-icon="cloud_off">cloud_off</span>
<span class="text-caption font-medium uppercase tracking-wider">Offline Mode</span>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col pt-4 px-md pb-24 max-w-4xl mx-auto w-full">
<!-- Chip Group (#account_type_tabs) -->
<nav class="flex gap-sm mb-lg overflow-x-auto pb-2 no-scrollbar" id="account_type_tabs">
<button class="px-md py-2 rounded-full border border-primary text-primary font-label text-sm flex-shrink-0 bg-primary-container font-medium">
                Savings
            </button>
<button class="px-md py-2 rounded-full border border-outline text-on-surface-variant font-label text-sm flex-shrink-0 hover:bg-surface-variant transition-colors">
                Deposits
            </button>
<button class="px-md py-2 rounded-full border border-outline text-on-surface-variant font-label text-sm flex-shrink-0 hover:bg-surface-variant transition-colors">
                Shares
            </button>
</nav>
<!-- Content Area (#account_list) -->
<section class="flex-grow flex flex-col items-center justify-center text-center py-xl" id="account_list">
<!-- Illustration Area -->
<div class="relative w-64 h-64 md:w-80 md:h-80 mb-lg">
<div class="absolute inset-0 bg-primary-container/10 rounded-full scale-110 offline-pulse"></div>
<img alt="Disconnected node graphic representing network failure" class="w-full h-full object-contain relative z-10" data-alt="A professional, minimalist error illustration for a financial management app, featuring a broken data connection or a disconnected circuit graphic. The style should be clean, flat design, using the primary blue color #006CB5 and neutral greys. White background. Professional and corporate tone." src="https://lh3.googleusercontent.com/aida/AP1WRLtL6bWUJofHDdueJnK2F1D_YYqkwd-I9hi9GUAedq_r0c6qsR0RyUFByG7H0D6IhngyhlJj8Wi4igXbmB8YFKTweoLqVwxO4W1twOMQxKJY4QIZrHEK6ZBB3qEkGXdt1W2DqKMdrNLqIBi_uxa_2x9beVtBmvPzi73B5-LjBrdzUTkRD5Ofmqmx4ZEDpE7cSQVFlnfX0pxjP0dO4NLDXpmrTsSelckjzS0OVGEWkBgcEdNBiGTNnNOnxgU"/>
</div>
<!-- Error Message Content -->
<div class="max-w-md">
<h2 class="font-headline text-h2 font-bold text-on-surface mb-sm">Unable to reach the network</h2>
<p class="text-body text-on-surface-variant mb-xl leading-relaxed">
                    We couldn't load the accounts data. Please check your internet connection or sync settings and try again.
                </p>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-md justify-center items-center">
<button class="w-full sm:w-auto flex items-center justify-center gap-sm bg-primary text-on-primary px-xl py-3 rounded-xl font-label font-medium shadow-sm active:scale-95 transition-transform" id="retry_button">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
                        Retry
                    </button>
<button class="w-full sm:w-auto flex items-center justify-center gap-sm bg-surface border border-outline text-primary px-xl py-3 rounded-xl font-label font-medium hover:bg-surface-variant transition-colors" id="review_failed_button">
<span class="material-symbols-outlined text-[20px]" data-icon="sync">sync</span>
                        View Sync Settings
                    </button>
</div>
</div>
</section>
<!-- KPI Area (Minimal Shimmer to indicate pending data) -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-md mt-auto">
<div class="bg-surface-container-low p-md rounded-lg border border-outline/20">
<div class="h-3 w-16 bg-surface-variant rounded-sm mb-2"></div>
<div class="h-6 w-24 bg-surface-variant/50 rounded-sm"></div>
</div>
<div class="bg-surface-container-low p-md rounded-lg border border-outline/20">
<div class="h-3 w-16 bg-surface-variant rounded-sm mb-2"></div>
<div class="h-6 w-24 bg-surface-variant/50 rounded-sm"></div>
</div>
<div class="hidden md:block bg-surface-container-low p-md rounded-lg border border-outline/20">
<div class="h-3 w-16 bg-surface-variant rounded-sm mb-2"></div>
<div class="h-6 w-24 bg-surface-variant/50 rounded-sm"></div>
</div>
<div class="hidden md:block bg-surface-container-low p-md rounded-lg border border-outline/20">
<div class="h-3 w-16 bg-surface-variant rounded-sm mb-2"></div>
<div class="h-6 w-24 bg-surface-variant/50 rounded-sm"></div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 bg-surface border-t border-outline px-sm pb-safe">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 transition-transform active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-xs font-medium">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 transition-transform active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-xs font-medium">Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 transition-transform active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-xs font-medium">Collections</span>
</button>
<!-- ACTIVE TAB: Sync (Relevant for connectivity issues) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform active:scale-90 duration-150">
<span class="material-symbols-outlined" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label text-xs font-medium">Sync</span>
</button>
</nav>
<script>
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Interaction feedback
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80');
                // Simulate still offline
                alert('Connection could not be established. Please check your local network.');
            }, 1500);
        });

        // Handle offline/online browser events
        window.addEventListener('online', () => {
            document.querySelector('.bg-warning-strong').classList.add('hidden');
        });
        window.addEventListener('offline', () => {
            document.querySelector('.bg-warning-strong').classList.remove('hidden');
        });
    </script>
</body></html>
