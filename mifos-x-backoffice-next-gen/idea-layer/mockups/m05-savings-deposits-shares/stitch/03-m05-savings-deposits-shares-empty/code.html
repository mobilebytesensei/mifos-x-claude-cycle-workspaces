<style>
        body { font-family: 'Roboto', sans-serif; background-color: #FCFCFF; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-tab {
            border-bottom: 3px solid #006CB5;
            color: #006CB5;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface bg-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex justify-between items-center px-md h-14 w-full">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary cursor-pointer">menu</span>
<h1 class="font-headline text-h3 font-bold text-primary">Savings &amp; Deposits</h1>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-xs">
                JD
            </div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-14 pb-20 flex flex-col">
<!-- Tab Bar / Chip Group -->
<nav class="bg-surface px-md py-sm flex gap-sm overflow-x-auto no-scrollbar border-b border-outline/20">
<button class="active-tab px-lg py-2 font-label text-label transition-colors">Savings</button>
<button class="text-on-surface-variant px-lg py-2 font-label text-label hover:bg-surface-variant rounded-md transition-colors">Deposits</button>
<button class="text-on-surface-variant px-lg py-2 font-label text-label hover:bg-surface-variant rounded-md transition-colors">Shares</button>
</nav>
<!-- Empty State Section -->
<section class="flex-grow flex flex-col items-center justify-center p-xl text-center">
<!-- Illustration Container -->
<div class="relative w-64 h-64 mb-lg flex items-center justify-center">
<!-- Decorative background circles -->
<div class="absolute inset-0 bg-primary-container/20 rounded-full scale-75 animate-pulse"></div>
<div class="absolute inset-0 bg-secondary-container/10 rounded-full scale-100 opacity-50"></div>
<!-- Large Central Illustration -->
<div class="z-10 bg-white p-6 rounded-full shadow-sm border border-outline/10">
<img class="w-40 h-40 object-contain" data-alt="A clean and minimalist digital illustration of a stylized wallet and a magnifying glass, following a financial banking aesthetic. The wallet is rendered in soft light grey and white with a bold blue clasp. A magnifying glass with a blue handle hovers over it, showing a question mark inside the lens. The lighting is soft and high-key, creating a professional and clinical light-mode atmosphere using primary blue and neutral grey tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1RrYSVqEkLgjqUJgvYqgTq-bbVOuvBGhQ75UXIQtFPd8OQDWvNWe9WNMrPqREQUU5rwhhDCTXZFRV79pCh5SY3CXPA_ThZVVMviPji9UT3h050BPRM4mcqNfGikaHUTJ0rJC-aOhZshobqGpuKOyUcTXb7sUbOO9MQsnV2IHgfAb-n3qnUIrNCBi1T6YENq6J4xEpJhTVcQ4eqKdrHb5P6zh2zsSMAn53BXNhbJbENJ-pQC08fF5mnmJ8bPk1lNPJYDt4Tq6u90vM"/>
</div>
</div>
<!-- Typography & Action -->
<div class="max-w-sm space-y-md">
<h2 class="font-headline text-h2 text-on-surface">No Accounts Found</h2>
<p class="font-body text-body text-on-surface-variant px-md leading-relaxed">
                    Start by opening a new savings, deposit, or share account for your clients.
                </p>
<div class="pt-lg">
<button class="bg-primary text-on-primary font-label px-xxl py-md rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-sm mx-auto">
<span class="material-symbols-outlined">add</span>
<span>Open Account</span>
</button>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-sm pb-safe bg-surface border-t border-outline">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors cursor-pointer">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-caption font-medium mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors cursor-pointer">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-caption font-medium mt-1">Clients</span>
</div>
<!-- Active destination: Collections/Savings area contextually close to "Home" or "Collections" -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform duration-150 scale-100 cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label text-caption font-medium mt-1">Collections</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-colors cursor-pointer">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-caption font-medium mt-1">Sync</span>
</div>
</nav>
<!-- Offline Banner (Part of Design System Mandate) -->
<div class="hidden fixed top-14 left-0 w-full bg-warning-strong text-on-primary p-xs text-center font-label text-caption z-40" id="offline-banner">
<div class="flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px]">cloud_off</span>
            Working offline. Data will sync when reconnected.
        </div>
</div>
<script>
        // Simple online/offline simulator for the banner
        window.addEventListener('offline', () => {
            document.getElementById('offline-banner').classList.remove('hidden');
        });
        window.addEventListener('online', () => {
            document.getElementById('offline-banner').classList.add('hidden');
        });

        // Tab Switching Micro-interaction
        const tabs = document.querySelectorAll('nav[role="navigation"] button, nav.bg-surface button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('active-tab', 'text-primary');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('active-tab', 'text-primary');
                tab.classList.remove('text-on-surface-variant');
            });
        });
    </script>
</body></html>
