<!-- Offline Banner Placeholder (System Mandate) -->
<div class="hidden fixed top-0 w-full z-[60] bg-warning-strong text-on-primary px-4 py-2 text-center font-label text-label flex items-center justify-center gap-2" id="offline-banner">
<span class="material-symbols-outlined text-[20px]">cloud_off</span>
<span>You are currently offline. Actions will sync automatically when reconnected.</span>
</div>
<script>
        // Micro-interaction: Active Navigation Logic
        // Determined that "Collections" is the closest semantic fit for "Savings & Deposits" module in the provided JSON tabs
        
        // Simple tab switching simulation
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('active-tab');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('active-tab');
                tab.classList.remove('text-on-surface-variant');
            });
        });

        // Simulating the clinical offline-first feel
        window.addEventListener('offline', () => {
            document.getElementById('offline-banner').classList.remove('hidden');
        });
        window.addEventListener('online', () => {
            document.getElementById('offline-banner').classList.add('hidden');
        });
    </script>
