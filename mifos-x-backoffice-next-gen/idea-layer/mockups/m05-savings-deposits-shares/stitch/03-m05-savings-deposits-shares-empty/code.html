<script>
        // Simple micro-interaction for chips
        document.querySelectorAll('button.rounded-full').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('bg-primary')) return;
                
                // Toggle logic if we wanted them to stay active, but prompt says inactive context
                // This script just adds a ripple-like feedback
                this.classList.add('bg-surface-container-high');
                setTimeout(() => {
                    this.classList.remove('bg-surface-container-high');
                }, 200);
            });
        });

        // Simple observer for entrance animations
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('opacity-100', 'translate-y-0');
                    entry.target.classList.remove('opacity-0', 'translate-y-4');
                }
            });
        }, observerOptions);

        document.querySelectorAll('main > div').forEach(el => {
            el.classList.add('transition-all', 'duration-700', 'opacity-0', 'translate-y-4');
            observer.observe(el);
        });
    </script>
