<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Account Management - Error State</title>

                    "inverse-primary": "#76d6d5",
                    "inverse-on-surface": "#eef1f1",

                    "on-tertiary-fixed-variant": "#004f4f",

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "gutter": "16px",
                    "margin-mobile": "16px",

            },
            "fontFamily": {

                    "headline-sm": ["Roboto Flex"],

                    "headline-lg": ["Roboto Flex"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #f7fafa;
            color: #181c1d;
            font-family: 'Roboto Flex', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline">
<div class="flex justify-between items-center h-16 px-margin-desktop w-full max-w-container-max-width mx-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="account_balance">account_balance</span>
<h1 class="font-title-lg text-title-lg font-bold text-primary dark:text-primary-fixed-dim">Accounts</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant cursor-pointer active:opacity-80" data-icon="account_circle">account_circle</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col w-full max-w-container-max-width mx-auto px-margin-desktop py-gutter space-y-8">
<!-- Chip Group (Non-tappable in Error State) -->
<section class="flex flex-wrap gap-2">
<div class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-lg text-label-lg bg-surface-container-low opacity-60">
                Savings
            </div>
<div class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-lg text-label-lg bg-surface-container-low opacity-60">
                Fixed Deposit
            </div>
<div class="px-4 py-1.5 rounded-full border border-outline-variant text-on-surface-variant font-label-lg text-label-lg bg-surface-container-low opacity-60">
                Share
            </div>
</section>
<!-- List Header -->
<section>
<h2 class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">ACCOUNT LIST</h2>
</section>
<!-- Error State View (The Core Task) -->
<section class="flex-grow flex flex-col items-center justify-center text-center py-12 max-w-2xl mx-auto space-y-6">
<!-- Technical Error Illustration -->
<div class="w-full max-w-md aspect-video relative rounded-xl overflow-hidden bg-surface-container mb-4">
<img class="w-full h-full object-cover" data-alt="A sophisticated 3D digital illustration of a heavy bank vault door that is slightly ajar, with glitching digital binary code leaking out of the cracks. The vault is rendered in a brushed steel texture with teal and copper accents. The lighting is dramatic, using cool tones from the enterprise ledger brand palette, emphasizing a sense of technical disruption. The style is modern, professional, and high-fidelity, suitable for a corporate financial dashboard." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDTYeOOIzqupvkRlDMNXLKI6UcgCjSRXtFT2yzf2N8P-CSTKgefBorXcWopB0mlYaXWEzEg-BPXHqDCT_Vt9JfujVbj1tia8EaNo9w2KFd9luzPNjrPjY3dr-1RZI8a28xitaNWSgV3sGF7s8jbGoqyOkx4-gEQNfXoiSjk0DAPqYO571gn_WRb64VQr9XOeyMOxnp3U_mnvgm2QOuxiRGZcH3ujfT-bv75zFuRetlPu2fZQcirHX5UA989ofgDGssdx_-JPM1dFqA"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container/80 to-transparent"></div>
<div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 text-error">
<span class="material-symbols-outlined text-[48px]" data-icon="cloud_off">cloud_off</span>
</div>
</div>
<!-- Error Copy -->
<div class="space-y-2">
<h3 class="font-title-lg text-title-lg text-on-surface">Unable to load accounts</h3>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4">
                    We encountered a problem while retrieving your account list. Please check your connection and try again.
                </p>
</div>
<!-- Retry Button (Tappable) -->
<button class="mt-4 flex items-center gap-2 bg-primary dark:bg-primary-container text-on-primary dark:text-on-primary-container px-6 py-3 rounded-full font-label-lg text-label-lg shadow-sm hover:bg-surface-tint transition-all active:scale-95 duration-100 group" id="retry_button">
<span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500" data-icon="refresh">refresh</span>
<span>Retry</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-gutter bg-surface-container dark:bg-surface-container-low border-t border-outline-variant">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-secondary-container dark:hover:bg-secondary-fixed-dim transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-secondary-container dark:hover:bg-secondary-fixed-dim transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-md text-label-md">Clients</span>
</a>
<!-- Collections (Active state logic: This page is "Accounts/Collections" area) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-5 py-1 transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="payments" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md text-label-md">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-secondary-container dark:hover:bg-secondary-fixed-dim transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</a>
</nav>
<!-- Subtle atmospheric background effect -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-40">
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-secondary/5 rounded-full blur-[100px]"></div>
</div>
<script>
        // Simple micro-interaction for retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Visual feedback
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80');
                // Normally here we would trigger a data reload
            }, 1000);
        });
    </script>
</body></html>
