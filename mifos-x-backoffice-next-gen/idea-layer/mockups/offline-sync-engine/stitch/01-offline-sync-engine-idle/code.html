<script>
        // Simple micro-interaction for sync button
        document.getElementById('sync_now_button').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            this.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">sync</span> Syncing...`;
            this.disabled = true;
            this.classList.add('opacity-80');
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                this.innerHTML = `<span class="material-symbols-outlined text-[20px]">check_circle</span> Synced`;
                this.classList.remove('bg-primary');
                this.classList.add('bg-green-600'); // Temporary success state color
                
                setTimeout(() => {
                    this.innerHTML = `<span class="material-symbols-outlined text-[20px]">sync</span> Sync now`;
                    this.classList.remove('bg-green-600', 'opacity-80');
                    this.classList.add('bg-primary');
                    this.disabled = false;
                }, 2000);
            }, 1500);
        });
    </script>
