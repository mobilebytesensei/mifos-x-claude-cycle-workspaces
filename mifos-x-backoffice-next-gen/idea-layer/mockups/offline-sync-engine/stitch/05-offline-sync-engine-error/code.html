<script>
        // Simple interaction for the retry button
        document.getElementById('retry_failed_button').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">sync</span> Retrying...';
            btn.disabled = true;
            btn.classList.add('opacity-80');
            
            // Mock a delay then reset to show interaction
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                alert('Connection attempt failed. Please check your internet settings and try again.');
            }, 2000);
        });
    </script>
