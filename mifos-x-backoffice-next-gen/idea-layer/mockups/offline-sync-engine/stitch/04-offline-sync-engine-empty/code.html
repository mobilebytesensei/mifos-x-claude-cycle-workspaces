<!-- Main Content Area -->

</div>
</div>
<div class="px-margin-mobile flex-1 flex flex-col items-center justify-center py-gap.lg text-center">

<div class="w-full max-w-xs aspect-square mb-gap.lg flex items-center justify-center relative overflow-hidden rounded-xl">

<span class="material-symbols-outlined text-secondary text-[18px]" data-icon="description">description</span>
</div>
</div>
<div class="space-y-gap.sm max-w-[280px]">
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">Your outbox is empty</h2>

<span class="material-symbols-outlined" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label-lg text-label-lg">Sync</span>

<script>
        // Micro-interactions
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('opacity-80');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('opacity-80');
            });
        });

        // Simple rotation animation for sync icon on tap
        const syncBtn = document.querySelector('button.bg-primary');
        if(syncBtn) {
            syncBtn.addEventListener('click', () => {
                const icon = syncBtn.querySelector('.material-symbols-outlined');
                icon.classList.add('animate-spin');
                syncBtn.disabled = true;
                syncBtn.classList.add('opacity-50');
                
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                    syncBtn.disabled = false;
                    syncBtn.classList.remove('opacity-50');
                }, 2000);
            });
        }
    </script>
