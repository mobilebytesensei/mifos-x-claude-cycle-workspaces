<style>
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #DEE3EB 25%, #f0f2f5 50%, #DEE3EB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #FCFCFF;
      font-family: 'Roboto', sans-serif;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center justify-between px-md h-16 w-full">
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors p-2 rounded-full active:opacity-80">
        menu
      </button>
<h1 class="font-headline text-h3 font-bold text-on-surface">Organization Management</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<!-- Main Scrollable Content Area -->
<main class="pt-20 pb-24 px-md max-w-5xl mx-auto flex flex-col gap-lg items-start">
<!-- 1. Header skeleton (#header) -->
<div class="w-full space-y-sm" id="header">
<div class="shimmer h-8 w-64 rounded-md"></div>
<div class="shimmer h-4 w-full max-w-md rounded-md"></div>
</div>
<!-- 2. Tab bar skeleton (#entity_tabs) -->
<div class="w-full flex gap-md border-b border-outline overflow-x-auto" id="entity_tabs">
<div class="shimmer h-10 w-24 rounded-t-md mb-[-1px]"></div>
<div class="shimmer h-10 w-24 rounded-t-md"></div>
<div class="shimmer h-10 w-24 rounded-t-md"></div>
<div class="shimmer h-10 w-24 rounded-t-md"></div>
</div>
<!-- 3. Content area label skeleton (#org_content) -->
<div class="w-full pt-md" id="org_content">
<div class="shimmer h-6 w-48 rounded-md mb-md"></div>
</div>
<!-- 4. Three list item skeletons (#office_row, #staff_row, #code_row) -->
<div class="w-full flex flex-col gap-sm">
<!-- office_row -->
<div class="bg-surface border border-outline rounded-lg p-md flex items-center gap-md" id="office_row">
<div class="shimmer w-10 h-10 rounded-full shrink-0"></div>
<div class="flex-1 space-y-xs">
<div class="shimmer h-4 w-1/3 rounded-md"></div>
<div class="shimmer h-3 w-1/4 rounded-md opacity-70"></div>
</div>
</div>
<!-- staff_row -->
<div class="bg-surface border border-outline rounded-lg p-md flex items-center gap-md" id="staff_row">
<div class="shimmer w-10 h-10 rounded-full shrink-0"></div>
<div class="flex-1 space-y-xs">
<div class="shimmer h-4 w-1/2 rounded-md"></div>
<div class="shimmer h-3 w-1/5 rounded-md opacity-70"></div>
</div>
</div>
<!-- code_row -->
<div class="bg-surface border border-outline rounded-lg p-md flex items-center gap-md" id="code_row">
<div class="shimmer w-10 h-10 rounded-full shrink-0"></div>
<div class="flex-1 space-y-xs">
<div class="shimmer h-4 w-2/5 rounded-md"></div>
<div class="shimmer h-3 w-1/3 rounded-md opacity-70"></div>
</div>
</div>
</div>
<!-- 5. Grid of button skeletons -->
<div class="w-full grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-md">
<div class="shimmer h-12 rounded-xl" id="new_office_button"></div>
<div class="shimmer h-12 rounded-xl" id="new_staff_button"></div>
<div class="shimmer h-12 rounded-xl" id="add_currency_button"></div>
<div class="shimmer h-12 rounded-xl" id="new_holiday_button"></div>
<div class="shimmer h-12 rounded-xl" id="activate_holiday_button"></div>
<div class="shimmer h-12 rounded-xl" id="edit_working_days_button"></div>
<div class="shimmer h-12 rounded-xl" id="new_fund_button"></div>
<div class="shimmer h-12 rounded-xl" id="new_payment_type_button"></div>
<div class="shimmer h-12 rounded-xl" id="add_code_value_button"></div>
<div class="shimmer h-12 rounded-xl" id="bulk_reassign_button"></div>
</div>
<!-- 6. Empty state CTA button skeleton (#empty_new_cta) -->
<div class="w-full flex justify-center py-xl">
<div class="shimmer h-14 w-full max-w-sm rounded-xl" id="empty_new_cta"></div>
</div>
<!-- 7. Retry button skeleton (#retry_button) -->
<div class="w-full flex justify-center pt-md pb-xl">
<div class="shimmer h-10 w-32 rounded-xl opacity-60" id="retry_button"></div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-sm pb-safe bg-surface border-t border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-xl" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-label font-medium">Home</span>
</a>
<!-- Clients (Active state mapping to "Management" flow context as fallback) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined">groups</span>
<span class="font-label text-label font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-xl" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label text-label font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-xl" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-label font-medium">Sync</span>
</a>
</nav>
