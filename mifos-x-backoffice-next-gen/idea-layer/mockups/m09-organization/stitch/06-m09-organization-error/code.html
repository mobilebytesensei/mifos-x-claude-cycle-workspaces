<style>
    body {
      font-family: 'Roboto Flex', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .error-shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .main-canvas {
      height: calc(100vh - 144px); /* TopAppBar (64px) + BottomNavBar (80px) */
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full h-16 flex justify-between items-center px-margin-mobile z-50 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="account_balance">account_balance</span>
<h1 class="font-bold font-headline-sm text-headline-sm text-primary">Organization</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional corporate headshot of an executive in a well-lit modern office setting. The lighting is bright and high-key, reflecting a professional enterprise environment. The individual is wearing professional attire, with a calm and confident expression. Soft teal and white tones dominate the background, aligning with the clean and data-dense corporate design language." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBT_jW0JoU7hTRpa4s3-vlQfDzhrfBfGmFLjnVtm-SubcdUVONgRuvynwWkM8cRdhiuL7shoPiLIolWEd2UAkRAVqx9W1mgIi8N4Gket-azqJ9rV0x-Vgj7RUhiekI0EdAiCa3a8x1Jft536meNrtKOCNFF16s2_NiDveglyPYCOD9NVqxBhFRoHHrVmn5Je2Y33LjMhqVsTr1i7TOFZlB2QLJX6mefTwj2nAVi4uoRhyK4qv2q1J76AkHRuGQtKDvYQqkWOdgGExU"/>
</div>
</header>
<!-- Main Content Area -->
<main class="mt-16 pb-20 overflow-y-auto">
<!-- Tabs Navigation -->
<div class="flex border-b border-outline-variant sticky top-16 bg-surface z-40">
<button class="flex-1 py-4 font-label-lg text-label-lg text-on-surface border-b-2 border-primary">Offices</button>
<button class="flex-1 py-4 font-label-lg text-label-lg text-on-surface-variant">Staff</button>
<button class="flex-1 py-4 font-label-lg text-label-lg text-on-surface-variant">System Codes</button>
</div>
<!-- Error State Body -->
<section class="main-canvas flex flex-col items-center justify-center px-margin-mobile text-center">
<!-- Error Illustration Container -->
<div class="relative w-full max-w-[280px] mb-8 aspect-square flex items-center justify-center">
<!-- Background decorative shape -->
<div class="absolute inset-0 bg-error-container opacity-20 rounded-full scale-90 blur-2xl"></div>
<!-- Placeholder for Error Illustration -->
<div class="relative z-10 w-48 h-48 flex flex-col items-center justify-center">
<div class="w-full h-full bg-contain bg-no-repeat bg-center" data-alt="A sophisticated 3D isometric digital illustration representing a broken connection or data loss in a modern financial context. The scene features a stylized crystalline ledger block with a visible fracture, glowing with a soft red inner light. Floating around it are minimalist geometric particles in shades of grey and deep teal. The overall aesthetic is clean, professional, and corporate, utilizing a bright light-mode background to emphasize clarity and technical precision." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC9ly7z4fBxay3KzqjbnaAa0JRIY1KuHpIpCG2j96QRAof6-Lnf4TdblxxKYE8HNzAeui8hRECKzu-VKNmEQ7HQjkd0Sx8xg1nHuCKAQ--6e1N6_8fMQfFL8IxRPYWD4tWhbt7hjOYQVDry8q45uJlq7ngAhjCeh9jPYW-Th_1ezwJfE4KjU9qHVJ-hGxFAFIILTnWftyoIQ8IycZgEAthXZNQlEgEVNMLmpbQ8w1-KdPWPjtnE6an0K1HJJbz64V7-FcLZq_P1J4k')"></div>
</div>
</div>
<!-- Error Message -->
<h2 class="font-title-lg text-title-lg text-on-surface mb-3 font-bold">Unable to load organization data</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[320px] mb-10 leading-relaxed">
        Please check your connection and try again.
      </p>
<!-- Retry Button -->
<button class="bg-primary text-on-primary px-10 py-3 rounded-full font-label-lg text-label-lg shadow-sm hover:bg-primary-container active:scale-95 transition-all duration-200 flex items-center gap-2" id="retryButton">
<span class="material-symbols-outlined text-[18px]" data-icon="refresh">refresh</span>
        Retry
      </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-20 bg-surface-container border-t border-outline-variant flex justify-around items-center px-4 z-50">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-colors active:scale-90 duration-100">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-90 transition-transform duration-100">
<span class="material-symbols-outlined mb-1" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-md text-label-md font-bold">Clients</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-colors active:scale-90 duration-100">
<span class="material-symbols-outlined mb-1" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md">Collections</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-colors active:scale-90 duration-100">
<span class="material-symbols-outlined mb-1" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</div>
</nav>
<script>
    document.getElementById('retryButton').addEventListener('click', function() {
      const btn = this;
      const icon = btn.querySelector('.material-symbols-outlined');
      
      // Visual feedback for retry
      btn.classList.add('opacity-70', 'pointer-events-none');
      icon.classList.add('animate-spin');
      
      setTimeout(() => {
        btn.classList.remove('opacity-70', 'pointer-events-none');
        icon.classList.remove('animate-spin');
        // Simulate a shake if it fails again
        document.querySelector('.main-canvas').classList.add('error-shake');
        setTimeout(() => {
          document.querySelector('.main-canvas').classList.remove('error-shake');
        }, 500);
      }, 1500);
    });

    // Semantic Mapping: This is the Organization screen.
    // Based on the JSON, "Clients" is the closest logical fit for Organization Management in an Enterprise Ledger.
  </script>
</body></html>
