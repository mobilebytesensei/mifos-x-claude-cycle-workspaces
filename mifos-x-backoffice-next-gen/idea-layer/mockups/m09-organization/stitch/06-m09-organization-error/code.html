<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos Back Office - Organization</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006CB5",
            "on-primary": "#FFFFFF",
            "primary-container": "#CBE6FF",
            "on-primary-container": "#001D33",
            secondary: "#00796B",
            "on-secondary": "#FFFFFF",
            "secondary-container": "#B8F2E6",
            "on-secondary-container": "#00201A",
            surface: "#FCFCFF",
            "on-surface": "#1A1C1E",
            "surface-variant": "#DEE3EB",
            "on-surface-variant": "#42474E",
            "surface-container-low": "#F3F4F9",
            outline: "#72777F",
            error: "#BA1A1A",
            "on-error": "#FFFFFF",
            "error-container": "#FFDAD6",
            "on-error-container": "#410002",
          },
          borderRadius: {
            DEFAULT: "0.125rem",
            sm: "4px",
            md: "8px",
            lg: "16px",
            xl: "28px",
            full: "9999px"
          },
          fontFamily: {
            headline: ["Inter", "sans-serif"],
            display: ["Inter", "sans-serif"],
            body: ["Roboto", "sans-serif"],
            label: ["Public Sans", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          },
          fontSize: {
            h1: ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
            h2: ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
            h3: ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
            body: ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
            label: ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
            caption: ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
    
    body {
      background-color: #FCFCFF;
      color: #1A1C1E;
      font-family: 'Roboto', sans-serif;
    }

    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar (Shared Component: TopAppBar) -->
<header class="bg-surface sticky top-0 z-50 flex justify-between items-center w-full px-4 h-16 border-b border-outline/20">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="p-2 hover:bg-surface-variant/50 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined text-on-surface">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-on-surface">Organization</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional close-up portrait of a finance administrator in a modern office, characterized by soft directional lighting, shallow depth of field, and a clean corporate aesthetic reflecting trustworthiness and expertise." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1_05L67KzBIG4dC2uaN76r8tMl7ZYfWXuqULZZ0yCri6wonMcc_QYWYtn_KJyGLCZKZwFo2k_0SRrBRmFBsY9eUsdyOd4pAeJDxbfZPG1TBISDFFF7dyrc7tfqM1yN048gCBcZbbyMQeQ-eV9Pqql6CA9ziov-L3bcviEsFytSmGHkboxGCYE12Ebk4WDKTY-m9-FN8mvPwoU7S9Blyod8JmgLTmN-fiiIdA5LrwTg2i4sIzbp98Ww64W-3q36dqZChHa2Dplfv8g"/>
</div>
</div>
</header>
<!-- Content Area -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto">
<!-- Tab Bar -->
<nav class="flex w-full bg-surface border-b border-outline/10">
<div class="flex-1 flex flex-col items-center pt-3 pb-2 relative border-b-2 border-primary">
<span class="font-label text-label font-medium text-primary">Offices</span>
</div>
<div class="flex-1 flex flex-col items-center pt-3 pb-2 relative">
<span class="font-label text-label font-medium text-on-surface-variant">Staff</span>
</div>
<div class="flex-1 flex flex-col items-center pt-3 pb-2 relative">
<span class="font-label text-label font-medium text-on-surface-variant">Codes</span>
</div>
</nav>
<!-- Error State Canvas -->
<section class="flex-1 flex flex-col items-center justify-center px-8 py-12 text-center animate-in fade-in duration-700">
<!-- Error Illustration -->
<div class="mb-8 w-full max-w-[280px]">
<img alt="System connection error illustration" class="w-full h-auto drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLt6SDcdQPkPquKQ_uoMZEUhBCfS8M3YW7EvOx88zDG9e5qvlUR8ia473oJWiSouXsYXEBTicOktFoltEvPKnd2-37c5UIqndOaGZT73CBFXU5aVlWaBxbn1jgndbeGe56-HwqPvxNaeUApKOs-h05XLAFUPwSfoC5lw2kOykzHWNR6nugQjxpWBqIfMOpodptqqqflHkt4xS5Z6NTMrbqbTOh4aqMhKsC_xP7mSYqCAdWK5-xq-BiPvkJE"/>
</div>
<!-- Error Content -->
<div class="space-y-4 max-w-sm">
<h2 class="text-h3 font-semibold text-error">Connection Interrupted</h2>
<p class="text-body text-on-surface-variant leading-relaxed">
          Unable to load organization data. Something went wrong while fetching the organizational hierarchy.
        </p>
</div>
<!-- Action Button -->
<div class="mt-10">
<button class="bg-primary text-on-primary px-10 py-3 rounded-xl font-label text-label shadow-sm hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center gap-2">
<span class="material-symbols-outlined text-[1.2rem]">refresh</span>
          Retry
        </button>
</div>
<!-- Helper Text (Clinical Admin Style) -->
<p class="mt-12 font-mono text-caption text-on-surface-variant opacity-60">
        Error Code: 503_SERVICE_UNAVAILABLE<br/>
        Request ID: MF-ORG-HIER-4029
      </p>
</section>
</main>
<!-- Bottom Navigation (Shared Component: BottomNavBar) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-2 py-1 bg-surface border-t border-outline/10 safe-area-bottom">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform active:scale-90 duration-200">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[0.65rem] font-medium mt-1">Home</span>
</button>
<!-- Clients -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform active:scale-90 duration-200">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-[0.65rem] font-medium mt-1">Clients</span>
</button>
<!-- Collections -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform active:scale-90 duration-200">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-[0.65rem] font-medium mt-1">Collections</span>
</button>
<!-- Sync -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 transition-transform active:scale-90 duration-200">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[0.65rem] font-medium mt-1">Sync</span>
</button>
</nav>
<script>
    // Micro-interaction for the retry button
    document.querySelector('button.bg-primary').addEventListener('click', function() {
      const icon = this.querySelector('.material-symbols-outlined');
      icon.classList.add('animate-spin');
      
      // Simulating a reload attempt
      setTimeout(() => {
        icon.classList.remove('animate-spin');
      }, 1500);
    });
  </script>
</body></html>
