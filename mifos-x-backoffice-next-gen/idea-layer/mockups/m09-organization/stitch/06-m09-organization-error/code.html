<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline dark:border-outline flex items-center justify-between px-md h-16 w-full">
<div class="flex items-center gap-md">
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors active:opacity-80">
<span class="material-symbols-outlined text-primary dark:text-primary">menu</span>
</button>
<h1 class="font-headline text-h3 font-bold text-on-surface dark:text-on-surface">Organization Management</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-medium active:opacity-80 transition-opacity cursor-pointer">
<span class="material-symbols-outlined">person</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 mb-20 overflow-y-auto px-md py-xl flex flex-col items-center justify-center text-center">
<div class="max-w-md w-full flex flex-col items-center gap-lg">
<!-- Professional Error Illustration -->
<div class="w-full aspect-square max-w-[320px] flex items-center justify-center">
<img alt="A professional financial data visualization showing a line graph that literally shatters and breaks into blue and gray shards mid-way through Q4. The background is clean and sterile, while a warning icon is placed at the point of the data breakage. The overall style is clinical and corporate, utilizing the Mifos-X blue and neutral tones." class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvM4d4xJT2_qAAdfk25wSy0rwLy_CjM88qddOa2Wsm09HoSoDTMIXyTItegypcaI3U1QB3rEfckwPVWn-_eshDjut43ymYqzDTEfqEQUvrntVXuynMx0DDt3iU8zA_1MM8lLO8-6QPSL_T4oFWcLls-Tepsf00ydyc7qOfo5deb88ENtDCCdjV36egyU2iJD7P7xr-bri0YpdJ5vXiBt0PCSowS2eHF8bUMgK9LLpKTJPG8HyULp4Cp3iJh"/>
</div>
<!-- Error Messaging -->
<div class="flex flex-col gap-sm">
<h2 class="text-h2 text-on-surface font-bold">Unable to load organization data</h2>
<p class="text-body-large text-on-surface-variant leading-relaxed">
                    Something went wrong while fetching the organizational hierarchy and staff records. Please check your connection and try again.
                </p>
</div>
<!-- Action Button -->
<button class="bg-primary text-on-primary font-label text-label px-xl py-md rounded-xl active:scale-95 transition-all flex items-center gap-2 shadow-sm hover:brightness-110" id="retry_button">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                Retry
            </button>
<!-- Secondary Context Helper -->
<div class="mt-xl flex flex-col items-center gap-sm">
<p class="text-caption text-on-surface-variant italic">Error Code: CONN_TIMEOUT_082</p>
<button class="text-primary font-label text-label hover:underline">Contact Support</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-sm pb-safe bg-surface dark:bg-surface border-t border-outline dark:border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-xl group active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">home</span>
<span class="font-label text-[12px] font-medium">Home</span>
</a>
<!-- Clients (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">groups</span>
<span class="font-label text-[12px] font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-xl group active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">receipt_long</span>
<span class="font-label text-[12px] font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-xl group active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">sync</span>
<span class="font-label text-[12px] font-medium">Sync</span>
</a>
</nav>
<script>
        // Micro-interaction for the retry button
        const retryBtn = document.getElementById('retry_button');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            retryBtn.classList.add('opacity-80', 'cursor-not-allowed');
            retryBtn.disabled = true;
            
            // Simulating a reconnect attempt
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                retryBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                retryBtn.disabled = false;
                // In a real app, this would trigger a data refetch
                alert('Attempting to reconnect to Fineract server...');
            }, 2000);
        });
    </script>
</body></html>
