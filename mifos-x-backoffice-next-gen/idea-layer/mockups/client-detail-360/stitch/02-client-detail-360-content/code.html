</button>

<script>
        function handleRetry(btn) {
            const icon = btn.querySelector('#retry-icon');
            icon.classList.add('animate-spin');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            
            // Simulate refresh
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                
                // Show a brief success micro-interaction
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="material-symbols-outlined text-success text-sm">check_circle</span> Updated';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            }, 1500);
        }

        // Handle tab switching visually
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('active-tab', 'font-bold');
                    t.classList.add('text-on-surface-variant', 'font-medium');
                });
                tab.classList.add('active-tab', 'font-bold');
                tab.classList.remove('text-on-surface-variant', 'font-medium');
            });
        });
    </script>
