<body class="bg-surface text-on-surface min-h-screen flex flex-col">

<!-- Main Content Canvas -->

<img class="w-64 h-auto mx-auto object-contain" data-alt="A clean, minimalist 2D vector illustration of a broken blue data cable against a white background. The cable ends are jagged and sparking with small geometric fragments in shades of gray and primary blue, symbolizing a disconnected or failed network transmission. The style is clinical and professional, matching a modern financial administrative dashboard aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbskf6FNZBc4zoIS7dAI7OjzVmWZUpVS97McRPyAFnb7d-LgFfP_28U6GU6Hf3xzMRiz5xFQ03mhWO_QPjEHd_dUQns7jWtmqt9eEwgg5Rjk9bAs5tgZic-28eUCJmeTfPq3RKiSTOUK-egB1EBEq03uBzVlbAaTXiI53KraxjJAzmrHAkebtmWzq2StjNGMKA2x5a1J0ynQUXs6RVHG4DJa35QfqZX3b5KAb6v-oJ1LSZwNXGopUEROnv1cld4-JSfxLM2Ovk30_2"/>
</div>

        </p>
<button class="w-full mt-lg py-md bg-primary text-on-primary font-label text-label rounded-xl shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-sm" id="cd_error_retry">
<span class="material-symbols-outlined">refresh</span>

  </div>

</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>

</a>

<script>
    // Micro-interaction for retry button
    document.getElementById('cd_error_retry').addEventListener('click', function() {
      const btn = this;
      const originalText = btn.innerHTML;
      btn.innerHTML = `
        <svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Retrying...
      `;
      btn.classList.add('pointer-events-none', 'opacity-70');
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.classList.remove('pointer-events-none', 'opacity-70');
        // Simulated failure for the demo
      }, 2000);
    });

    // Detect offline state
    window.addEventListener('offline', () => {
      document.getElementById('offline-banner').classList.remove('hidden');
    });
    window.addEventListener('online', () => {
      document.getElementById('offline-banner').classList.add('hidden');
    });
  </script>
