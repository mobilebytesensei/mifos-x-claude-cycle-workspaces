<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",

                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",

                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",

                        "on-background": "#1A1C1E",

<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, #DEE3EB 25%, #F3F4F9 50%, #DEE3EB 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline text-[1.375rem] font-semibold border-b border-outline fixed top-0 w-full z-50 flex justify-between items-center px-4 h-16">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined cursor-pointer hover:bg-surface-variant/50 p-2 rounded-full transition-transform active:scale-95" data-icon="menu">menu</span>
<span class="font-bold">Mifos Back Office</span>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
</header>
<main class="pt-20 pb-32 px-4 max-w-2xl mx-auto space-y-6">
<!-- 1. Header: Skeleton for Title and Profile Info -->
<section class="bg-surface rounded-lg p-4 border border-outline/30 space-y-4">
<div class="flex items-center gap-4">
<div class="w-20 h-20 rounded-lg shimmer"></div>
<div class="flex-1 space-y-2">
<div class="h-6 w-3/4 shimmer rounded-sm"></div>
<div class="h-4 w-1/2 shimmer rounded-sm"></div>
</div>
</div>
<div class="grid grid-cols-2 gap-4 pt-2">
<div class="space-y-2">
<div class="h-3 w-16 shimmer rounded-sm"></div>
<div class="h-5 w-24 shimmer rounded-sm"></div>
</div>
<div class="space-y-2">
<div class="h-3 w-16 shimmer rounded-sm"></div>
<div class="h-5 w-24 shimmer rounded-sm"></div>
</div>
</div>
</section>
<!-- 2. Tab Row: Horizontal Skeleton Tabs -->
<nav class="flex gap-2 overflow-hidden border-b border-outline/20 pb-1">
<div class="h-10 w-24 shimmer rounded-full flex-shrink-0"></div>
<div class="h-10 w-28 shimmer rounded-full flex-shrink-0 opacity-60"></div>
<div class="h-10 w-24 shimmer rounded-full flex-shrink-0 opacity-60"></div>
<div class="h-10 w-24 shimmer rounded-full flex-shrink-0 opacity-40"></div>
</nav>
<!-- 3. List Item: Account Data Skeleton Rows -->
<section class="space-y-3">
<div class="h-5 w-32 shimmer rounded-sm mb-4"></div> <!-- Section Title Skeleton -->
<!-- Skeleton Rows -->
<div class="bg-surface border border-outline/20 rounded-lg overflow-hidden divide-y divide-outline/10">
<div class="p-4 flex justify-between items-center">
<div class="space-y-2">
<div class="h-4 w-40 shimmer rounded-sm"></div>
<div class="h-3 w-24 shimmer rounded-sm"></div>
</div>
<div class="h-6 w-16 shimmer rounded-sm"></div>
</div>
<div class="p-4 flex justify-between items-center">
<div class="space-y-2">
<div class="h-4 w-36 shimmer rounded-sm"></div>
<div class="h-3 w-28 shimmer rounded-sm"></div>
</div>
<div class="h-6 w-16 shimmer rounded-sm"></div>
</div>
<div class="p-4 flex justify-between items-center">
<div class="space-y-2">
<div class="h-4 w-44 shimmer rounded-sm"></div>

</div>
<div class="h-6 w-16 shimmer rounded-sm"></div>
</div>
<div class="p-4 flex justify-between items-center">
<div class="space-y-2">
<div class="h-4 w-32 shimmer rounded-sm"></div>
<div class="h-3 w-24 shimmer rounded-sm"></div>
</div>
<div class="h-6 w-16 shimmer rounded-sm"></div>
</div>
</div>
</section>

<section class="flex flex-col gap-3 pt-4">
<div class="h-12 w-full shimmer rounded-xl"></div> <!-- Primary Action -->
<div class="flex gap-3">
<div class="h-12 flex-1 shimmer rounded-xl"></div> <!-- Secondary Action -->
<div class="h-12 flex-1 shimmer rounded-xl"></div> <!-- Tertiary Action -->
</div>
</section>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full bg-surface border-t border-outline flex justify-around items-center h-20 px-2 pb-safe z-50">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/50 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label text-[0.875rem] font-medium">Home</span>
</div>
<!-- Clients (Active) -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined mb-1" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label text-[0.875rem] font-medium">Clients</span>
</div>
<!-- Collections -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/50 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined mb-1" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-[0.875rem] font-medium">Collections</span>
</div>
<!-- Sync -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant/50 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined mb-1" data-icon="sync">sync</span>
<span class="font-label text-[0.875rem] font-medium">Sync</span>
</div>
</nav>
