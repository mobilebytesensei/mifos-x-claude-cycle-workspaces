<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos-X - New Loan Application</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@400;500;600&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Inter", "Roboto", "sans-serif"],
                        display: ["Inter", "Roboto", "sans-serif"],
                        body: ["Roboto", "sans-serif"],
                        label: ["Public Sans", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        'h1': ['2rem', { lineHeight: '1.25', fontWeight: '700' }],
                        'h2': ['1.75rem', { lineHeight: '1.3', fontWeight: '600' }],
                        'h3': ['1.375rem', { lineHeight: '1.35', fontWeight: '600' }],
                        'body': ['1rem', { lineHeight: '1.5', fontWeight: '400' }],
                        'label': ['0.875rem', { lineHeight: '1.4', fontWeight: '500' }],
                        'caption': ['0.75rem', { lineHeight: '1.4', fontWeight: '400' }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .step-inactive {
            background-color: #DEE3EB;
        }
        .step-active {
            background-color: #006CB5;
        }
        .glass-card {
            background: rgba(252, 252, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #72777F;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline dark:border-outline docked full-width top-0 flex justify-between items-center px-4 w-full h-16 sticky z-50">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline text-h3 font-bold text-primary">New Loan Application</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline/20">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial loan officer in a bright, modern office environment. The person is smiling warmly, conveying trust and expertise. The lighting is soft and natural, emphasizing a high-end light-mode aesthetic with clean lines and a professional corporate atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCCcRkR1uL6tLKSxjt8N60qfBcKalLE0WZGPaNuPncw-D7g-xBy8fyr7Aa74RnLC4s_3y8wSvM97XtRxXYjRvNjbwkzvG_LB7QcvzFxZIS11fkZKLvXj8axPRqpWXRuEq8QwCTc93OXFcqFgO_kuZhuPgBngFA7lZmviR1vDuHc_T780PmivI7WsiirKKf7fHNYC-wTMlz9NgUflDcHF_KOgwYPaFFjI7vOFPmnZdyHG5Dk5qYHEGxzar8_RirUN7c-XFORViyDN3IT"/>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-4 md:px-8 py-8 max-w-4xl mx-auto w-full">
<!-- Step Indicator -->
<div class="w-full mb-12">
<div class="flex items-center justify-between mb-4 px-2">
<span class="text-label font-medium text-primary">Step 0 of 4</span>
<span class="text-caption text-on-surface-variant">Initialization</span>
</div>
<div class="flex gap-2 w-full h-1.5 px-1">
<div class="flex-1 rounded-full step-inactive opacity-40"></div>
<div class="flex-1 rounded-full step-inactive opacity-40"></div>
<div class="flex-1 rounded-full step-inactive opacity-40"></div>
<div class="flex-1 rounded-full step-inactive opacity-40"></div>
</div>
</div>
<!-- Empty State Content -->
<div class="flex-grow flex flex-col items-center justify-center text-center py-12 animate-in fade-in duration-700">
<!-- Illustration Area -->
<div class="relative w-64 h-64 md:w-80 md:h-80 mb-8 flex items-center justify-center">
<!-- Background decorative elements -->
<div class="absolute inset-0 bg-primary-container/20 rounded-full blur-3xl -z-10"></div>
<!-- Main Illustration -->
<img alt="Illustration of a new form starting" class="w-full h-auto drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLsuE589GzFqajJjsnyY1w_MmxkLWzzH3rBZ-qiBLm_p2LyfE2t_iG9hVn5Si3YC6_oi8XydYIZC7pgVKTEI6P-bxcrox9McooWbw4gvVSRCTr_2VnFtg4XXK336os0GaJ7DS8W_pwVs9UUxAfPuEJmFcGkG341gTIi4mT4MC_wUEoMbzvAt_9reKU-8LSmJwmWmn2M7M7tIcBp_bjogawXLFMgnrxTV1q4uAmWqacArQqAHZ0sV5cBlZpM"/>
</div>
<!-- Empty State Typography -->
<h2 class="text-h2 text-on-surface mb-4">No Active Loan Applications</h2>
<p class="text-body text-on-surface-variant max-w-md mb-10">
                You haven't started any loan applications yet. Begin a new application to help your clients access financial services.
            </p>
<!-- Primary CTA -->
<button class="flex items-center gap-3 bg-primary text-on-primary hover:bg-primary/90 active:scale-95 transition-all duration-200 px-8 py-4 rounded-xl shadow-lg shadow-primary/20 font-label text-md font-bold">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
                Start New Application
            </button>
<!-- Quick Help / Hint -->
<div class="mt-16 flex items-center gap-2 px-4 py-2 bg-surface-container-low rounded-lg border border-outline/10">
<span class="material-symbols-outlined text-secondary text-sm">info</span>
<span class="text-caption text-on-surface-variant">Need help? View the <a class="text-primary hover:underline" href="#">application guide</a>.</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center py-3 px-2 bg-surface border-t border-outline dark:border-outline h-16">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 px-4 py-1 rounded-full group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform">home</span>
<span class="font-label text-label font-medium">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 px-4 py-1 rounded-full group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform">group</span>
<span class="font-label text-label font-medium">Clients</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-1 group" href="#">
<span class="material-symbols-outlined scale-95" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label text-label font-medium">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 px-4 py-1 rounded-full group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform">sync</span>
<span class="font-label text-label font-medium">Sync</span>
</a>
</nav>
<!-- Spacer for BottomNavBar -->
<div class="h-16"></div>
<script>
        // Micro-interaction for the CTA button
        const ctaBtn = document.querySelector('button');
        ctaBtn.addEventListener('mouseenter', () => {
            ctaBtn.querySelector('.material-symbols-outlined').style.transform = 'rotate(90deg)';
            ctaBtn.querySelector('.material-symbols-outlined').style.transition = 'transform 0.3s ease';
        });
        ctaBtn.addEventListener('mouseleave', () => {
            ctaBtn.querySelector('.material-symbols-outlined').style.transform = 'rotate(0deg)';
        });
    </script>
</body></html>
