<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@400;500&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "tertiary": "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "background": "#FCFCFF",
              "on-background": "#1A1C1E",
              "outline": "#72777F",
              "success": "#2E7D32",
              "warning": "#F57C00",
              "warning-strong": "#B45309",
              "error": "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002"
            },
            borderRadius: {
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            spacing: {
              "xs": "4px",
              "sm": "8px",
              "md": "16px",
              "lg": "24px",
              "xl": "32px",
              "xxl": "48px"
            },
            fontFamily: {
              "headline": ["Roboto", "sans-serif"],
              "body": ["Roboto", "sans-serif"],
              "label": ["Roboto", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer {
            background: linear-gradient(90deg, #DEE3EB 25%, #F3F4F9 50%, #DEE3EB 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            font-family: 'Roboto', sans-serif;
        }
        
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar (JSON Mapping) -->
<header class="bg-surface dark:bg-surface border-b border-outline w-full top-0 sticky z-40 transition-colors duration-200">
<div class="flex justify-between items-center px-4 h-16 w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<h1 class="font-headline text-[1.375rem] font-bold text-on-surface">Capability Map Detail</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
</div>
</header>
<!-- Content Canvas (Detail Archetype) -->
<main class="flex-grow flex flex-col p-4 space-y-6 overflow-y-auto pb-24">
<!-- #cm_module Expandable Section Shimmer -->
<section class="bg-surface border border-outline rounded-lg p-4 space-y-4" id="cm_module">
<div class="flex justify-between items-center">
<div class="h-6 w-1/3 shimmer rounded-sm"></div>
<div class="w-6 h-6 shimmer rounded-full"></div>
</div>
<div class="space-y-3 pt-2">
<div class="h-4 w-full shimmer rounded-sm"></div>
<div class="h-4 w-5/6 shimmer rounded-sm"></div>
<div class="h-4 w-4/6 shimmer rounded-sm"></div>
</div>
<div class="pt-4 flex gap-2">
<div class="h-8 w-20 shimmer rounded-xl"></div>
<div class="h-8 w-20 shimmer rounded-xl"></div>
</div>
</section>
<!-- #cm_copy_checksum Button Shimmer -->
<div class="w-full" id="cm_copy_checksum">
<div class="h-12 w-full shimmer rounded-xl"></div>
</div>
<!-- #cm_error_retry Button Shimmer -->
<div class="w-full" id="cm_error_retry">
<div class="h-12 w-full shimmer rounded-xl"></div>
</div>
<!-- Density Mockup for Data-Dense Admin UI -->
<div class="space-y-4 pt-4">
<div class="h-4 w-24 shimmer rounded-sm"></div>
<div class="bg-surface-container-low rounded-lg p-4 border border-outline/20">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<div class="h-3 w-16 shimmer rounded-sm opacity-50"></div>
<div class="h-5 w-24 shimmer rounded-sm"></div>
</div>
<div class="space-y-2">
<div class="h-3 w-16 shimmer rounded-sm opacity-50"></div>
<div class="h-5 w-24 shimmer rounded-sm"></div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (JSON Mapping) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-2 pb-safe bg-surface border-t border-outline h-20 z-50">
<!-- Home (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full px-3 py-1 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[0.875rem]">Home</span>
</div>
<!-- Clients (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full px-3 py-1 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-[0.875rem]">Clients</span>
</div>
<!-- Collections (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full px-3 py-1 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-[0.875rem]">Collections</span>
</div>
<!-- Sync (Inactive - closest match to a detail/loading state for backoffice) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full px-3 py-1 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[0.875rem]">Sync</span>
</div>
</nav>
<!-- Offline Banner (Design System Mandate) -->
<div class="hidden fixed top-16 left-0 w-full bg-warning-strong text-on-primary p-2 text-center text-sm font-medium z-30" id="offline-status">
        Offline - Data may be stale. Reconnecting...
    </div>
<script>
        // Micro-interaction: Simulate network status or simple loading completion after delay if needed
        // For this task, it remains a permanent shimmer loading state.
        
        // Handle responsive visibility for offline banner (optional logic)
        window.addEventListener('offline', () => {
            document.getElementById('offline-status').classList.remove('hidden');
        });
        window.addEventListener('online', () => {
            document.getElementById('offline-status').classList.add('hidden');
        });
    </script>
</body></html>
