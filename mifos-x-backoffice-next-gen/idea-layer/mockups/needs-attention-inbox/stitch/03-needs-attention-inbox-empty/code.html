<script>
        // Micro-interaction for the Sync button
        const syncBtn = document.getElementById('nai_empty_sync');
        syncBtn.addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            this.classList.add('opacity-80');
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                this.classList.remove('opacity-80');
                // Navigation simulation or toast could go here
            }, 1200);
        });

        // Soft interaction for chips
        const chips = document.querySelectorAll('.flex-shrink-0');
        chips.forEach(chip => {
            chip.addEventListener('click', function() {
                // Remove active state from others
                chips.forEach(c => {
                    c.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
                    c.classList.add('border', 'border-outline', 'text-on-surface-variant');
                });
                // Add active state to clicked
                this.classList.remove('border', 'border-outline', 'text-on-surface-variant');
                this.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
            });
        });
    </script>
