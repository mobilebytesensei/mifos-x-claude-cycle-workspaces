<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos Back Office - Dashboard Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&amp;family=Roboto+Mono:wght@400;500&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              'primary': '#006CB5',
              'on-primary': '#FFFFFF',
              'primary-container': '#CBE6FF',
              'on-primary-container': '#001D33',
              'secondary': '#00796B',
              'on-secondary': '#FFFFFF',
              'secondary-container': '#B8F2E6',
              'on-secondary-container': '#00201A',
              'tertiary': '#5B5891',
              'on-tertiary': '#FFFFFF',
              'tertiary-container': '#E3DFFF',
              'on-tertiary-container': '#17124B',
              'surface': '#FCFCFF',
              'on-surface': '#1A1C1E',
              'surface-variant': '#DEE3EB',
              'on-surface-variant': '#42474E',
              'surface-container-low': '#F3F4F9',
              'background': '#FCFCFF',
              'on-background': '#1A1C1E',
              'outline': '#72777F',
              'success': '#2E7D32',
              'warning': '#F57C00',
              'warning-strong': '#B45309',
              'error': '#BA1A1A',
              'on-error': '#FFFFFF',
              'error-container': '#FFDAD6',
              'on-error-container': '#410002',

            borderRadius: {
              'DEFAULT': '0.125rem',
              'sm': '4px',
              'md': '8px',
              'lg': '16px',
              'xl': '28px',
              'full': '9999px',
            },
            fontFamily: {
              'headline': ['Roboto', 'sans-serif'],
              'display': ['Inter', 'sans-serif'],
              'body': ['Roboto', 'sans-serif'],
              'label': ['Public Sans', 'sans-serif'],
              'mono': ['Roboto Mono', 'monospace'],
            },
            spacing: {
              'xs': '4px',
              'sm': '8px',
              'md': '16px',
              'lg': '24px',
              'xl': '32px',
              'xxl': '48px',
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      body {
        font-family: 'Roboto', sans-serif;
        background-color: #FCFCFF;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline flex justify-between items-center px-4 w-full h-16 sticky top-0 z-50">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="p-2 hover:bg-surface-variant rounded-full transition-colors duration-200 text-on-surface">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display text-[1.375rem] font-semibold text-primary">Dashboard</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A professional high-resolution headshot of a financial office administrator with soft studio lighting. The background is a blurred modern office space with clean lines and a soft blue and grey color palette, reflecting a trustworthy and clinical corporate environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDcWSJ2E4k0gZprF56NFrQ4vlRmn0374V2NQd1GlW9A1u6tsF3rcyMdTmYN-E7dv5xqSw5IQWhhBRFH2FOwCCOKFmycxldlBHrJ0xiuD4UaZnP2HPccDHZw6a5UDyrJ9_bD9u_JaOm-rz5cAMSY-Y-Y6BvdRqWVx0M3oguJEjMD5tBGMwV5yeGSqHVXyDLH0bKZy5CZW7-qgziF8NIHgW5uyNrjRGEBZ7DhKPYziusdewC0KjSwt2jHijuta0g5cXmvwi05yz6_f_cB"/>
</div>
</header>
<!-- Offline Banner -->
<div class="bg-warning-strong text-on-primary px-4 py-3 flex items-center gap-3 animate-pulse">
<span class="material-symbols-outlined text-[20px]" data-icon="cloud_off">cloud_off</span>
<span class="font-body text-sm font-medium">You are currently offline. Some data may be outdated.</span>
</div>
<!-- Main Content Area (Error State) -->
<main class="flex-grow flex items-center justify-center p-6 md:p-12">
<div class="max-w-xl w-full text-center flex flex-col items-center">
<!-- Error Illustration -->
<div class="mb-10 w-full max-w-md aspect-square relative group">
<img class="w-full h-full object-contain filter drop-shadow-xl transition-transform duration-500 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida/AP1WRLvM4d4xJT2_qAAdfk25wSy0rwLy_CjM88qddOa2Wsm09HoSoDTMIXyTItegypcaI3U1QB3rEfckwPVWn-_eshDjut43ymYqzDTEfqEQUvrntVXuynMx0DDt3iU8zA_1MM8lLO8-6QPSL_T4oFWcLls-Tepsf00ydyc7qOfo5deb88ENtDCCdjV36egyU2iJD7P7xr-bri0YpdJ5vXiBt0PCSowS2eHF8bUMgK9LLpKTJPG8HyULp4Cp3iJh"/>
<!-- Atmospheric background glow for focus -->
<div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl -z-10"></div>
</div>
<!-- Error Heading -->
<h2 class="font-headline text-[1.75rem] font-semibold text-on-surface mb-3 tracking-tight">
                Data Connection Error
            </h2>
<!-- Subtext -->
<p class="font-body text-base text-on-surface-variant mb-10 max-w-md leading-relaxed">
                Unable to load dashboard data. Please check your connection and try again. The visualization stream has been interrupted by an authentication or network failure.
            </p>
<!-- Actions Container -->
<div class="flex flex-col sm:flex-row gap-4 items-center justify-center w-full">
<button class="w-full sm:w-auto bg-primary text-on-primary px-6 py-4 rounded-xl font-label font-medium text-sm hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-md" id="retry_dashboard_button">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                    Retry Dashboard
                </button>
<button class="w-full sm:w-auto bg-surface text-primary border border-primary px-6 py-4 rounded-xl font-label font-medium text-sm hover:bg-primary-container/20 active:scale-95 transition-all flex items-center justify-center gap-2" id="retry_tile_button">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
                    Retry Tile Sync
                </button>
</div>
<!-- External Link -->
<a class="mt-8 flex items-center gap-1.5 text-primary hover:underline font-label text-sm font-medium py-2 px-4 rounded-lg hover:bg-primary/5 transition-colors" href="#" id="view_access_link">
                View Access Permissions
                <span class="material-symbols-outlined text-[18px]" data-icon="open_in_new">open_in_new</span>
</a>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 scale-95 active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-[0.75rem] font-medium mt-0.5">Home</span>
</button>
<!-- Clients -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl p-2 transition-colors">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-[0.75rem] font-medium mt-0.5">Clients</span>
</button>
<!-- Collections -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl p-2 transition-colors">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-[0.75rem] font-medium mt-0.5">Collections</span>
</button>
<!-- Sync -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl p-2 transition-colors">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[0.75rem] font-medium mt-0.5">Sync</span>
</button>
</nav>
<!-- Spacer for BottomNavBar -->
<div class="h-20 w-full"></div>
<script>
        // Simple micro-interaction for the retry button
        document.getElementById('retry_dashboard_button').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            this.classList.add('opacity-80');
            this.innerText = 'Retrying...';
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                this.classList.remove('opacity-80');
                this.innerHTML = '<span class="material-symbols-outlined" data-icon="refresh">refresh</span>Retry Dashboard';
                alert('Connection check initiated...');
            }, 2000);
        });

        document.getElementById('retry_tile_button').addEventListener('click', function() {
            alert('Re-syncing dashboard tiles...');
        });
    </script>
</body></html>
