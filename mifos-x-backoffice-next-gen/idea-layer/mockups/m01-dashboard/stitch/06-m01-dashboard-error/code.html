<script>
        // Micro-interaction for the retry button
        const retryBtn = document.querySelector('button');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            retryBtn.classList.add('opacity-80');
            
            // Simulate reload delay
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                retryBtn.classList.remove('opacity-80');
                // Normally we'd trigger a reload here
            }, 1200);
        });

        // Simple observer for entrance animation
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-in', 'slide-in-from-bottom-4', 'duration-700');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('main > *').forEach(el => observer.observe(el));
    </script>
