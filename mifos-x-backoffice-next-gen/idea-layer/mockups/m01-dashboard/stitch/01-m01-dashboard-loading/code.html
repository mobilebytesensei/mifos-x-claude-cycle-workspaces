<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard Loading State - Mifos-X NextGen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px",
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"],
                    },
                },
            },
        }
    </script>
<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, #DEE3EB 25%, #F3F4F9 50%, #DEE3EB 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FCFCFF;
            font-family: 'Roboto', sans-serif;
            color: #1A1C1E;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline text-h3 font-bold docked full-width top-0 border-b border-outline flex justify-between items-center px-md w-full h-14 z-40 sticky" id="TopAppBar">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined cursor-pointer" data-icon="menu">menu</span>
<h1 class="text-[1.375rem] font-bold tracking-tight">Mifos-X Back Office</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="person">person</span>
</div>
</header>
<!-- Main Content Area (Scrollable Detail Screen Archetype) -->
<main class="flex-grow overflow-y-auto pb-24">
<!-- Offline Banner Skeleton -->
<div class="w-full h-12 shimmer px-md flex items-center mb-sm" id="offline_banner_skeleton">
<div class="h-4 w-3/4 bg-surface/30 rounded-sm"></div>
</div>
<div class="px-md space-y-lg">
<!-- KPI Tile Grid -->
<section class="grid grid-cols-2 gap-md pt-md">
<!-- kpi_portfolio_at_risk_card -->
<div class="bg-surface-container-low border border-outline rounded-lg p-md space-y-sm" id="kpi_portfolio_at_risk_card">
<div class="h-3 w-16 shimmer rounded-sm"></div>
<div class="h-6 w-24 shimmer rounded-sm"></div>
<div class="h-3 w-10 shimmer rounded-sm opacity-50"></div>
</div>
<!-- kpi_active_clients_card -->
<div class="bg-surface-container-low border border-outline rounded-lg p-md space-y-sm" id="kpi_active_clients_card">
<div class="h-3 w-20 shimmer rounded-sm"></div>
<div class="h-6 w-16 shimmer rounded-sm"></div>
<div class="h-3 w-12 shimmer rounded-sm opacity-50"></div>
</div>
<!-- kpi_collections_due_card -->
<div class="bg-surface-container-low border border-outline rounded-lg p-md space-y-sm" id="kpi_collections_due_card">
<div class="h-3 w-24 shimmer rounded-sm"></div>
<div class="h-6 w-28 shimmer rounded-sm"></div>
<div class="h-3 w-8 shimmer rounded-sm opacity-50"></div>
</div>
<!-- kpi_pending_approvals_card -->
<div class="bg-surface-container-low border border-outline rounded-lg p-md space-y-sm" id="kpi_pending_approvals_card">
<div class="h-3 w-18 shimmer rounded-sm"></div>
<div class="h-6 w-12 shimmer rounded-sm"></div>
<div class="h-3 w-14 shimmer rounded-sm opacity-50"></div>
</div>
</section>
<!-- Quick Action Tiles -->
<section class="space-y-sm">
<div class="h-5 w-32 shimmer rounded-sm mb-sm"></div>
<div class="grid grid-cols-1 gap-sm">
<!-- quick_action_new_client_tile -->
<div class="flex items-center gap-md bg-surface border border-outline rounded-lg p-md h-16" id="quick_action_new_client_tile">
<div class="w-10 h-10 rounded-full shimmer flex-shrink-0"></div>
<div class="flex-grow space-y-2">
<div class="h-4 w-32 shimmer rounded-sm"></div>
<div class="h-3 w-48 shimmer rounded-sm opacity-60"></div>
</div>
</div>
<!-- quick_action_take_repayment_tile -->
<div class="flex items-center gap-md bg-surface border border-outline rounded-lg p-md h-16" id="quick_action_take_repayment_tile">
<div class="w-10 h-10 rounded-full shimmer flex-shrink-0"></div>
<div class="flex-grow space-y-2">
<div class="h-4 w-40 shimmer rounded-sm"></div>
<div class="h-3 w-56 shimmer rounded-sm opacity-60"></div>
</div>
</div>
</div>
</section>
<!-- Recent Activity List -->
<section class="space-y-sm" id="recent_activity_list">
<div class="h-5 w-40 shimmer rounded-sm mb-md"></div>
<!-- Activity Skeleton Items -->
<div class="space-y-md">
<div class="flex justify-between items-start border-b border-outline/30 pb-md">
<div class="space-y-2 flex-grow">
<div class="h-4 w-2/3 shimmer rounded-sm"></div>
<div class="h-3 w-1/3 shimmer rounded-sm opacity-60"></div>
</div>
<div class="h-4 w-16 shimmer rounded-sm"></div>
</div>
<div class="flex justify-between items-start border-b border-outline/30 pb-md">
<div class="space-y-2 flex-grow">
<div class="h-4 w-1/2 shimmer rounded-sm"></div>
<div class="h-3 w-1/4 shimmer rounded-sm opacity-60"></div>
</div>
<div class="h-4 w-20 shimmer rounded-sm"></div>
</div>
<div class="flex justify-between items-start border-b border-outline/30 pb-md">
<div class="space-y-2 flex-grow">
<div class="h-4 w-3/4 shimmer rounded-sm"></div>
<div class="h-3 w-2/5 shimmer rounded-sm opacity-60"></div>
</div>
<div class="h-4 w-12 shimmer rounded-sm"></div>
</div>
<div class="flex justify-between items-start border-b border-outline/30 pb-md">
<div class="space-y-2 flex-grow">
<div class="h-4 w-2/3 shimmer rounded-sm"></div>
<div class="h-3 w-1/3 shimmer rounded-sm opacity-60"></div>
</div>
<div class="h-4 w-16 shimmer rounded-sm"></div>
</div>
</div>
</section>
<!-- Action Buttons -->
<section class="flex flex-col gap-sm py-lg">
<div class="h-12 w-full shimmer rounded-xl" id="retry_tile_button"></div>
<div class="h-12 w-full shimmer rounded-xl opacity-40" id="retry_dashboard_button"></div>
</section>
<!-- Footer Link -->
<footer class="flex justify-center pb-xl">
<div class="h-3 w-32 shimmer rounded-sm" id="view_access_link"></div>
</footer>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-md py-sm bg-surface border-t border-outline" id="BottomNavBar">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[0.75rem] font-medium font-label">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-transform scale-95 active:scale-90 px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="text-[0.75rem] font-medium font-label">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-transform scale-95 active:scale-90 px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="text-[0.75rem] font-medium font-label">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-transform scale-95 active:scale-90 px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="text-[0.75rem] font-medium font-label">Sync</span>
</a>
</nav>
<!-- Contextual FAB (Hidden during loading state as per common UX patterns, but structure included for compliance) -->
<div class="fixed right-md bottom-24 hidden">
<button class="bg-secondary text-on-secondary rounded-lg w-14 h-14 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</body></html>
