<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mifos-X Back Office - Dashboard Skeleton</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "tertiary": "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "background": "#FCFCFF",
              "on-background": "#1A1C1E",
              "outline": "#72777F",
              "success": "#2E7D32",
              "warning": "#F57C00",
              "warning-strong": "#B45309",
              "error": "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002",
            },
            borderRadius: {
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            fontFamily: {
              "headline": ["Roboto", "sans-serif"],
              "body": ["Roboto", "sans-serif"],
              "label": ["Roboto", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer {
            background: linear-gradient(90deg, #DEE3EB 25%, #E8EDF4 50%, #DEE3EB 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface flex justify-between items-center px-4 h-14 border-b border-outline/20">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer" data-icon="menu">menu</span>
<div class="h-6 w-40 shimmer rounded-sm"></div>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-14 mb-20 overflow-y-auto no-scrollbar scroll-smooth" id="m01-dashboard">
<!-- Offline Banner Skeleton -->
<div class="w-full bg-warning-strong/10 p-4 flex items-center gap-3" id="offline_banner">
<div class="w-5 h-5 shimmer rounded-full shrink-0"></div>
<div class="h-4 w-3/4 shimmer rounded-sm"></div>
</div>
<div class="px-4 py-6 space-y-6">
<!-- Header Skeleton -->
<div class="space-y-2" id="header">
<div class="h-8 w-1/2 shimmer rounded-md"></div>
<div class="h-4 w-1/3 shimmer rounded-sm opacity-60"></div>
</div>
<!-- KPI Card Grid -->
<div class="grid grid-cols-2 gap-4" id="tile_grid">
<!-- KPI Portfolio at Risk Card -->
<div class="bg-surface-container-low p-4 rounded-lg border border-outline/10 space-y-4" id="kpi_portfolio_at_risk_card">
<div class="h-3 w-3/4 shimmer rounded-sm"></div>
<div class="h-8 w-full shimmer rounded-md"></div>
<div class="h-2 w-1/2 shimmer rounded-sm opacity-40"></div>
</div>
<!-- KPI Active Clients Card -->
<div class="bg-surface-container-low p-4 rounded-lg border border-outline/10 space-y-4" id="kpi_active_clients_card">
<div class="h-3 w-3/4 shimmer rounded-sm"></div>
<div class="h-8 w-full shimmer rounded-md"></div>
<div class="h-2 w-1/2 shimmer rounded-sm opacity-40"></div>
</div>
<!-- KPI Collections Due Card -->
<div class="bg-surface-container-low p-4 rounded-lg border border-outline/10 space-y-4" id="kpi_collections_due_card">
<div class="h-3 w-3/4 shimmer rounded-sm"></div>
<div class="h-8 w-full shimmer rounded-md"></div>
<div class="h-2 w-1/2 shimmer rounded-sm opacity-40"></div>
</div>
<!-- KPI Pending Approvals Card -->
<div class="bg-surface-container-low p-4 rounded-lg border border-outline/10 space-y-4" id="kpi_pending_approvals_card">
<div class="h-3 w-3/4 shimmer rounded-sm"></div>
<div class="h-8 w-full shimmer rounded-md"></div>
<div class="h-2 w-1/2 shimmer rounded-sm opacity-40"></div>
</div>
</div>
<!-- Quick Actions Section -->
<div class="space-y-3">
<div class="h-4 w-28 shimmer rounded-sm mb-4"></div>
<!-- New Client Tile -->
<div class="flex items-center p-4 bg-surface rounded-lg border border-outline/10 gap-4" id="quick_action_new_client_tile">
<div class="w-10 h-10 shimmer rounded-lg shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-1/2 shimmer rounded-sm"></div>
<div class="h-3 w-3/4 shimmer rounded-sm opacity-50"></div>
</div>
<span class="material-symbols-outlined text-on-surface-variant/20" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Take Repayment Tile -->
<div class="flex items-center p-4 bg-surface rounded-lg border border-outline/10 gap-4" id="quick_action_take_repayment_tile">
<div class="w-10 h-10 shimmer rounded-lg shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-2/3 shimmer rounded-sm"></div>
<div class="h-3 w-1/2 shimmer rounded-sm opacity-50"></div>
</div>
<span class="material-symbols-outlined text-on-surface-variant/20" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- Recent Activity List -->
<div class="space-y-4 pt-4" id="recent_activity_list">
<div class="h-4 w-32 shimmer rounded-sm mb-2"></div>
<!-- Activity Row 1 -->
<div class="flex items-start gap-4 py-3 border-b border-outline/5">
<div class="w-8 h-8 shimmer rounded-full shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-full shimmer rounded-sm"></div>
<div class="h-2 w-1/4 shimmer rounded-sm opacity-40"></div>
</div>
</div>
<!-- Activity Row 2 -->
<div class="flex items-start gap-4 py-3 border-b border-outline/5">
<div class="w-8 h-8 shimmer rounded-full shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-4/5 shimmer rounded-sm"></div>
<div class="h-2 w-1/3 shimmer rounded-sm opacity-40"></div>
</div>
</div>
<!-- Activity Row 3 -->
<div class="flex items-start gap-4 py-3">
<div class="w-8 h-8 shimmer rounded-full shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-3 w-2/3 shimmer rounded-sm"></div>
<div class="h-2 w-1/5 shimmer rounded-sm opacity-40"></div>
</div>
</div>
</div>
<!-- Dashboard Controls -->
<div class="flex flex-col gap-3 pt-6">
<!-- Retry Tile Button -->
<div class="w-full h-12 shimmer rounded-xl" id="retry_tile_button"></div>
<!-- Retry Dashboard Button -->
<div class="w-full h-12 border border-outline/20 bg-surface rounded-xl flex items-center justify-center" id="retry_dashboard_button">
<div class="h-4 w-1/4 shimmer rounded-sm"></div>
</div>
<!-- View Access Link -->
<div class="flex justify-center py-4" id="view_access_link">
<div class="h-3 w-32 shimmer rounded-sm"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline/10">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform duration-150 active:scale-95">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[10px] font-medium font-label">Home</span>
</button>
<!-- Clients -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant/10 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="text-[10px] font-medium font-label">Clients</span>
</button>
<!-- Collections -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant/10 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">payments</span>
<span class="text-[10px] font-medium font-label">Collections</span>
</button>
<!-- Sync -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant/10 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="text-[10px] font-medium font-label">Sync</span>
</button>
</nav>
<!-- Floating Action Button (Suppressed on Dashboard loading as per context but template provided for shell integrity if needed) -->

            <span class="material-symbols-outlined" data-icon="add">add</span>
        </button>
    </div> -->
<script>
        // Micro-interactions for shimmer variation or simulated loading delay
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Mifos-X Dashboard Skeleton Loaded');
            
            // Randomize shimmer delays slightly for a more organic feel
            const shimmers = document.querySelectorAll('.shimmer');
            shimmers.forEach((el, index) => {
                el.style.animationDelay = `${index * 0.05}s`;
            });
        });
    </script>
</body></html>
