<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard - Mifos Back Office</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
                        "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
                        "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
                        "body-large": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
                        "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
                        "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen font-body">
<!-- 1. TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline/20 flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<h1 class="font-headline text-h3 font-semibold text-primary">Dashboard</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline/10 active:opacity-80 transition-opacity">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a middle-aged financial administrator with a friendly yet serious expression. The lighting is clean and balanced, consistent with a high-end corporate office setting. The background is a soft-focus office environment with neutral tones, aligning with the Mifos Back Office minimalist aesthetic. The image is crisp and professional, suited for a profile avatar in a banking application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDb6eJUDLuDFzRsIKoFAFcIxjGK-vQOFRqKS1jd6ee59Zx-TGJok3Z6FDiRg8-vEO1NPLqJLh2O4mM5cWp7H_9cm3s8s2ODNA9qZv4XscKX35OIKalb00SStXFOdxG-qfL-NfE2VhuiRIUS0BdInOUZDqE7ihluY7DOAEoTMmLrNJvy8WhC7RJh_DJso5IhltWuFGsu337OD3f3lbXrLpG4IWEQQN-fpSK5fnCAkjGDQtrvAOiQj3Sh9XMe0TB1cdMGanaPAkQpTo2e"/>
</div>
</header>
<!-- Content Area Wrapper -->
<main class="flex-1 mt-16 mb-20 flex flex-col">
<!-- 2. Offline Banner -->
<div class="bg-warning-strong text-white px-4 py-3 flex items-center gap-3">
<span class="material-symbols-outlined" data-icon="cloud_off">cloud_off</span>
<p class="text-label font-medium">Currently offline. Dashboard widgets may be out of date.</p>
</div>
<!-- Empty State Container -->
<div class="flex-1 flex flex-col items-center justify-center px-8 text-center py-10">
<!-- 3. Empty State Illustration -->
<div class="w-64 h-64 mb-8">
<img alt="No Data Available Illustration" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvM4d4xJT2_qAAdfk25wSy0rwLy_CjM88qddOa2Wsm09HoSoDTMIXyTItegypcaI3U1QB3rEfckwPVWn-_eshDjut43ymYqzDTEfqEQUvrntVXuynMx0DDt3iU8zA_1MM8lLO8-6QPSL_T4oFWcLls-Tepsf00ydyc7qOfo5deb88ENtDCCdjV36egyU2iJD7P7xr-bri0YpdJ5vXiBt0PCSowS2eHF8bUMgK9LLpKTJPG8HyULp4Cp3iJh"/>
</div>
<!-- 4. Empty State Text -->
<h2 class="text-h3 font-bold text-on-surface mb-3">No dashboard data available yet</h2>
<!-- 5. Empty State Description -->
<p class="text-body-large text-on-surface-variant mb-10 max-w-sm">
                It looks like you don't have any widgets pinned to your dashboard, or you lack the necessary permissions to view current data streams.
            </p>
<!-- Action Buttons Stack -->
<div class="w-full max-w-xs space-y-4">
<!-- 6. Primary CTA -->
<button class="w-full py-4 px-6 bg-primary text-on-primary rounded-xl font-label text-label hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                    Retry Dashboard
                </button>
<!-- 7. Secondary CTA -->
<button class="w-full py-4 px-6 bg-surface border border-outline text-primary rounded-xl font-label text-label hover:bg-surface-container-low active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
                    Retry Tile Sync
                </button>
<!-- 8. Text Link -->
<button class="w-full py-2 text-primary font-label text-label hover:underline active:opacity-70 transition-opacity">
                    View Access Permissions
                </button>
</div>
</div>
</main>
<!-- 9. BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline/20 flex justify-around items-center h-20 pb-safe px-2">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center text-primary group">
<div class="bg-primary-container text-on-primary-container rounded-full px-5 py-1 mb-1 transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<span class="font-label text-[12px] font-medium">Home</span>
</button>
<!-- Clients -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-lg py-1 px-3 transition-colors active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-label text-[12px] font-medium">Clients</span>
</button>
<!-- Collections -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-lg py-1 px-3 transition-colors active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="font-label text-[12px] font-medium">Collections</span>
</button>
<!-- Sync -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-lg py-1 px-3 transition-colors active:scale-95">
<span class="material-symbols-outlined mb-1" data-icon="sync">sync</span>
<span class="font-label text-[12px] font-medium">Sync</span>
</button>
</nav>
<script>
        // Simple ripple/interaction effect for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', function(e) {
                // Potential for adding visual feedback here if needed
            });
        });
    </script>
</body></html>
