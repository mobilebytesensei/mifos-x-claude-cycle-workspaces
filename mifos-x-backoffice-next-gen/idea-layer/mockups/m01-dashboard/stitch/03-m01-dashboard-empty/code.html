<style>

<body class="text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface text-primary border-b border-outline flex items-center justify-between px-4 h-16 transition-colors duration-200">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-display font-bold text-lg text-on-surface">Dashboard</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Area (Scrollable Column) -->
<main class="pt-16 pb-20 min-h-screen flex flex-col">
<!-- Offline Banner -->
<div class="bg-warning-strong text-white px-md py-sm flex items-center justify-center gap-2 sticky top-16 z-40 animate-pulse">
<span class="material-symbols-outlined text-sm">cloud_off</span>
<span class="text-xs font-medium tracking-wide uppercase">Offline Mode — Data may be stale</span>
</div>
<div class="flex-grow flex flex-col items-center justify-center px-lg py-xl text-center">
<!-- Empty State Illustration/Graphic -->
<div class="relative mb-xl w-64 h-64 flex items-center justify-center bg-surface-container-low rounded-xl border border-outline border-dashed overflow-hidden">
<!-- Abstract themed graphic placeholder -->
<div class="absolute inset-0 bg-cover bg-center opacity-80" data-alt="A clean, minimalist 3D isometric illustration of a floating, transparent data storage folder that is empty, set against a soft blue and white gradient background. The lighting is bright and professional, evoking a calm and clinical financial administration interface. Subtle teal accents highlight the edges of the folder, maintaining the Mifos-X brand aesthetic of trustworthy infrastructure." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCjY5Tojt5897zdlxjqFuBwxysfTNnUSaegGlaiyC6LRVrX4-5ew0MIDwcSZe03XULqw3Cst_WKBmNsGHrBtLD2xw8fidz9a1N2p8H3dctgxzneKe0x25DDZE5d3pQskTkIvm2my5Ad8vSOvZ-D_Tcj1I_TmThbIJ4JJmMsviAwiQX6cItBMYYUH2gepX24vZfhOlmpMcmjhBfaiD-L_7SbAo-3CUuY6PwQYQzyCHsW2Jd1sjt2Ru8ZBwZ5j1f0l2rigF8AjUq1by-i')"></div>
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-on-surface-variant text-6xl mb-md">query_stats</span>
<div class="h-1 w-24 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary/30 w-1/3"></div>
</div>
</div>
</div>
<!-- Empty State Text Content -->
<h2 class="text-2xl font-bold text-on-surface mb-sm">No Data Available</h2>
<p class="text-on-surface-variant max-w-xs mb-lg">
                It looks like there's nothing to show here right now. Try refreshing or checking your connection.
            </p>
<!-- Primary CTA -->
<button class="bg-primary text-on-primary font-medium px-xl py-md rounded-xl active:scale-95 transition-all shadow-sm hover:shadow-md flex items-center gap-2" onclick="console.log('retry_dashboard')">
<span class="material-symbols-outlined">refresh</span>
                Retry Dashboard
            </button>
<!-- Secondary Actions Column -->
<div class="mt-xxl w-full max-w-sm flex flex-col gap-md pt-lg border-t border-outline/20">
<button class="w-full flex items-center justify-center gap-2 py-md px-lg text-primary font-medium hover:bg-primary-container/30 rounded-xl transition-colors" onclick="console.log('retry_failed_tile')">
<span class="material-symbols-outlined text-sm">replay</span>
                    Retry Tile
                </button>
<button class="w-full flex items-center justify-center py-sm px-lg text-on-surface-variant text-sm font-medium hover:underline" onclick="console.log('view_access')">
                    View Access Permissions
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-2 bg-surface border-t border-outline z-50">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label font-medium text-xs">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 active:scale-95 transition-transform duration-100 hover:bg-surface-variant rounded-full" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label font-medium text-xs">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 active:scale-95 transition-transform duration-100 hover:bg-surface-variant rounded-full" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-label font-medium text-xs">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 active:scale-95 transition-transform duration-100 hover:bg-surface-variant rounded-full" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-label font-medium text-xs">Sync</span>
</a>
</nav>
<!-- FAB (Suppressed on Empty State/Dashboard for focus unless specifically defined, but adding for Shell context) -->
<!-- Not rendered as per Contextual FAB Suppression mandate for focused/empty journeys -->
<script>
        // Micro-interaction for the refresh button
        const retryBtn = document.querySelector('button[onclick*="retry_dashboard"]');
        if(retryBtn) {
            retryBtn.addEventListener('click', function() {
                const icon = this.querySelector('.material-symbols-outlined');
                icon.classList.add('animate-spin');
                setTimeout(() => {
                    icon.classList.remove('animate-spin');
                }, 1000);
            });
        }

        // Mock offline status toggle for demo
        window.addEventListener('offline', () => {
            document.querySelector('.bg-warning-strong').classList.remove('hidden');
        });
        window.addEventListener('online', () => {
            document.querySelector('.bg-warning-strong').classList.add('hidden');
        });
    </script>
</body></html>
