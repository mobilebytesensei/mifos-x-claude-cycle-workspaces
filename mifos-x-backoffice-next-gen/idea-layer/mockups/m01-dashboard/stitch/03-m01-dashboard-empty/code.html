<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dashboard - Mifos-X Back Office</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Roboto & Public Sans -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&amp;family=Public+Sans:wght@400;500;600;700&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "tertiary": "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "background": "#FCFCFF",
              "on-background": "#1A1C1E",
              "outline": "#72777F",
              "success": "#2E7D32",
              "warning": "#F57C00",
              "warning-strong": "#B45309",
              "error": "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002"
            },
            borderRadius: {
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            spacing: {
              "xs": "4px",
              "sm": "8px",
              "md": "16px",
              "lg": "24px",
              "xl": "32px",
              "xxl": "48px"
            },
            fontFamily: {
              "headline": ["Roboto", "sans-serif"],
              "display": ["Roboto", "sans-serif"],
              "body": ["Roboto", "sans-serif"],
              "label": ["Public Sans", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"]
            },
            fontSize: {
              "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
              "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
              "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
              "body-large": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
              "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
              "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }]
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #FCFCFF;
        color: #1A1C1E;
        font-family: 'Roboto', sans-serif;
      }
      .glass-card {
        background: rgba(252, 252, 255, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid #72777F;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen bg-background">
<!-- TopAppBar -->
<header class="bg-surface text-primary border-b border-outline fixed top-0 w-full z-50 flex justify-between items-center px-md h-14">
<div class="flex items-center gap-md">
<button class="p-2 hover:bg-surface-variant/50 transition-colors duration-200 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-h3 font-bold text-on-surface">Dashboard</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container overflow-hidden border border-outline/20">
<img class="w-full h-full object-cover" data-alt="A professional close-up headshot of a financial administrator, presented in a minimalist circular frame. The background is a soft, blurred office interior with neutral tones. The lighting is clean and bright, characteristic of a high-end corporate dashboard user profile, maintaining a professional and trustworthy visual identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD14zBWR_belE8-jLfSH4fZbA9atPKGF70Ya3jqgoECxaCNwX0gxq9J159XMm5kAGMPe8XR7KUdnCjSgJE6PM1yAshAGQyWdGcvZB0-MYcaeKlv3OCGbAC9iNAq4q928FzEmFf4V1MghSvNh4TeQOCmp8sTR1vvfhtw5ZjLGsyWXrPh4oP97yYv3arYVZtSmxGTjPFA5a6_UHDWVNkV0b-0i0G5qXcNgKzhnLtwlrj6pM5zh8-W4oqQZW8TrE4yUYA7AejRVp2fAMhB"/>
</div>
</div>
</header>
<main class="flex-grow pt-14 pb-20 flex flex-col">
<!-- Main Content Area: Empty State -->
<div class="flex-grow flex items-center justify-center p-md">
<div class="max-w-md w-full text-center space-y-lg animate-in fade-in duration-700">
<!-- Minimalist Illustration Container -->
<div class="relative mx-auto w-64 h-64 mb-xl flex items-center justify-center">
<div class="absolute inset-0 bg-primary-container/10 rounded-full scale-110 blur-2xl"></div>
<!-- Using the style of the data connection error but clean for empty state -->
<div class="relative z-10 w-full h-full flex items-center justify-center">
<img class="w-full h-full object-contain drop-shadow-sm" data-alt="A sophisticated, minimalist 2D vector illustration representing data absence in a professional banking environment. The central graphic features a clean, stylized blueprint of a dashboard grid with empty outlined slots and floating geometric fragments in Mifos-X primary blue and slate gray. The aesthetic is clinical, modern, and high-end, utilizing a pristine white background with subtle tonal shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC075Ef0KvbsB5Q-MDTJQWmn3r4ucOJquO9yjdV6Ua-jOINnvfcafRiwep8hKeXav1ncL1MVznft2uKBufvl7WZC-UGukyO66gUzsE59bqaYe-vYqq9HY0im3wHwxAkPXrY_dMtd89XdukLMg5wo_Wnp9skedP1N48Ogkag4ZN_tWSyIeEEtewbs2Wu9UCWwT8JU0gYmtcDON3sVMBs8n8z4WS09UQq3aGlEOeCvhG7_43s-vc2vK6TJU2f89BkyhacRgUeZdFlx_gE"/>
</div>
</div>
<!-- Messaging -->
<div class="space-y-sm">
<h2 class="text-h2 text-on-surface font-bold tracking-tight">
                        No dashboard data available yet
                    </h2>
<p class="text-body-large text-on-surface-variant px-md">
                        It looks like you don't have any widgets pinned to your dashboard, or you lack the necessary permissions to view current data streams.
                    </p>
</div>
<!-- Actions -->
<div class="flex flex-col gap-md pt-md items-center">
<button class="w-full max-w-xs bg-primary text-on-primary font-label text-label py-md px-lg rounded-xl shadow-sm hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
                        Retry Dashboard
                    </button>
<button class="w-full max-w-xs bg-surface text-primary border border-outline font-label text-label py-md px-lg rounded-xl hover:bg-surface-variant/30 active:scale-95 transition-all duration-200 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="sync">sync</span>
                        Retry Tile Sync
                    </button>
</div>
<!-- Footer Link -->
<div class="pt-xl">
<a class="inline-flex items-center gap-xs text-primary font-label text-label hover:underline underline-offset-4 transition-all group" href="#">
                        View Access Permissions
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform" data-icon="open_in_new">open_in_new</span>
</a>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-md py-sm bg-surface border-t border-outline">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-[10px] font-medium">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label text-[10px] font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-[10px] font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[10px] font-medium">Sync</span>
</a>
</nav>
<script>
        // Simple micro-interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                const icon = this.querySelector('.material-symbols-outlined');
                if (icon) {
                    icon.classList.add('animate-spin');
                    setTimeout(() => {
                        icon.classList.remove('animate-spin');
                    }, 1000);
                }
            });
        });
    </script>
</body></html>
