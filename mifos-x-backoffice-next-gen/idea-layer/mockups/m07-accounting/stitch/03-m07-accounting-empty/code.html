<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Accounting - Mifos Back Office</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Inter:wght@400;600;700&amp;family=Public+Sans:wght@500&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        body: ["Roboto", "sans-serif"],
                        label: ["Public Sans", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        h1: ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
                        h2: ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
                        h3: ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
                        body: ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
                        label: ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
                        caption: ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }],
                    },
                    spacing: {
                        xs: "4px",
                        sm: "8px",
                        md: "16px",
                        lg: "24px",
                        xl: "32px",
                        xxl: "48px",
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
            color: #1A1C1E;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface text-primary border-b border-outline flex items-center justify-between px-4 h-16 shadow-none">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant transition-colors rounded-full active:opacity-80">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold">Accounting</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 mb-20 px-4 py-8 flex flex-col items-center max-w-2xl mx-auto w-full">
<!-- List Screen Archetype Composition -->
<!-- 1. Header (Already in TopAppBar) -->
<!-- 2. Empty state illustration -->
<div class="w-64 h-64 mb-6 flex items-center justify-center">
<img alt="No financial records found" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs3saFr4Zwm9CNjGV_pkgKJedbvs_GjsgGvH7kPLRjhySPQ73aI06_459iSYwjyDjC-fMIva0m2yayeYFWxYBD33ssp2dYZSibrW225zNDbxDoK8G8NB4nKJ8mCQAhjrBKrm-0ETLelRaWW15DbyaBCOpGLILJ4SulnHq_aoGPmeJJE7XG4oBWju4-HdV6b9X84XhkWxYPGG2SnMj27R45T9waYJSlSR6H79_GuQsMlnXm0gGYWmk3inOk1"/>
</div>
<!-- 3. Empty state message -->
<div class="text-center mb-8">
<h2 class="text-h2 font-semibold mb-3 text-on-surface">No Records Found</h2>
<p class="text-body text-on-surface-variant max-w-md">
                No financial records found. Start by setting up your chart of accounts or recording your first journal entry.
            </p>
</div>
<!-- Action Cluster -->
<div class="flex flex-col gap-4 w-full px-6">
<!-- 5. Button: Start Journal Entry -->
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-label text-label hover:opacity-90 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add_box</span>
                Start Journal Entry
            </button>
<!-- 6. Button: Map Financial Activity -->
<button class="w-full bg-surface-variant text-primary py-4 rounded-xl font-label text-label hover:bg-outline/10 transition-all flex items-center justify-center gap-2 border border-outline/30">
<span class="material-symbols-outlined">account_tree</span>
                Map Financial Activity
            </button>
<!-- 7. Button: Run Accruals -->
<button class="w-full bg-surface-variant text-primary py-4 rounded-xl font-label text-label hover:bg-outline/10 transition-all flex items-center justify-center gap-2 border border-outline/30">
<span class="material-symbols-outlined">update</span>
                Run Accruals
            </button>
<!-- 8. Button: Retry -->
<button class="mt-4 w-full py-2 text-primary font-label text-label hover:underline flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-sm">refresh</span>
                Retry
            </button>
</div>
</main>
<!-- 4. FAB: Create GL Account -->
<button class="fixed right-6 bottom-24 bg-secondary text-on-secondary w-14 h-14 rounded-lg shadow-lg flex items-center justify-center active:scale-95 transition-transform z-40" title="Create GL Account">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe px-2 shadow-none">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-caption font-medium mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-caption font-medium mt-1">Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-caption font-medium mt-1">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-caption font-medium mt-1">Sync</span>
</button>
</nav>
<script>
        // Simple micro-interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.98)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
