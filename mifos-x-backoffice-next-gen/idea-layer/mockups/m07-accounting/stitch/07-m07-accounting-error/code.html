<style>

<style>

  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center justify-between px-4 h-16 shadow-none">

</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial administrator, a middle-aged man with a calm and confident expression. He is wearing a clean, modern white shirt against a neutral, high-key studio background that matches the minimalist Light-Blue primary aesthetic of the UI. The lighting is soft and even, emphasizing trustworthiness and clarity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDu7Hpe-Z0p2r-IBSP94u86sudVaYKrR2vCmbEet1qGktIKerRkcg-bsc10EVY4-C4nk0YQ1uwrHv4yVOfgYewTBP-CUNFRCzRW-LFSlvfSMSczxLx59iiNN9kUWYSwMrcjnC-1wPQWVY-I2YzXY5q6UYU9a9SUK37uPsVQOxUq1uShlDLiZffHMtTd8XHcM3Mg8N45T9S5swO8IhGnFUXsANfzHS6pxlh1NM9Xg7-p4dtiCLOa3oBbKwNtGc_dZBxxwTV5Z93D8FWd"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-16 pb-20 flex flex-col items-center justify-center px-6">
<div class="max-w-md w-full flex flex-col items-center text-center animate-in fade-in duration-700">
<!-- Error Illustration -->
<div class="w-full mb-8 relative aspect-square flex items-center justify-center">
<img alt="Data Connection Error Illustration" class="w-full h-auto max-h-[300px] object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvM4d4xJT2_qAAdfk25wSy0rwLy_CjM88qddOa2Wsm09HoSoDTMIXyTItegypcaI3U1QB3rEfckwPVWn-_eshDjut43ymYqzDTEfqEQUvrntVXuynMx0DDt3iU8zA_1MM8lLO8-6QPSL_T4oFWcLls-Tepsf00ydyc7qOfo5deb88ENtDCCdjV36egyU2iJD7P7xr-bri0YpdJ5vXiBt0PCSowS2eHF8bUMgK9LLpKTJPG8HyULp4Cp3iJh"/>
</div>
<!-- Error Message -->
<div class="space-y-4">
<h2 class="font-headline text-h2 text-on-surface">Unable to load accounting data</h2>
<p class="font-body text-body text-on-surface-variant leading-relaxed">
                    Something went wrong while fetching the chart of accounts and journal entries. Please check your connection and try again.
                </p>
</div>
<!-- Action Button -->
<div class="mt-10 w-full flex justify-center">
<button class="bg-primary text-on-primary rounded-xl px-8 py-3 font-label text-label flex items-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-sm" id="retry-button">
<span class="material-symbols-outlined">refresh</span>
<span>Retry</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe px-2 shadow-none">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low px-4 py-2 rounded-xl transition-colors active:scale-95" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-caption font-medium mt-1">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low px-4 py-2 rounded-xl transition-colors active:scale-95" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-caption font-medium mt-1">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low px-4 py-2 rounded-xl transition-colors active:scale-95" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-caption font-medium mt-1">Collections</span>
</a>
<!-- Sync (Active State Highlighted based on Offline-First/Sync context of an error state) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label text-caption font-medium mt-0.5">Sync</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        document.getElementById('retry-button').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Visual feedback
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80', 'pointer-events-none');
            btn.querySelector('span:not(.material-symbols-outlined)').textContent = 'Retrying...';

            // Simulate reload delay
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80', 'pointer-events-none');
                btn.querySelector('span:not(.material-symbols-outlined)').textContent = 'Retry';
                
                // Alert for demonstration in prototype
                console.log('Accounting data retry triggered.');
            }, 1500);
        });
    </script>
</body></html>
