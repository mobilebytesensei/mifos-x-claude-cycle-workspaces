<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Accounting - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px",
                        "sm": "4px",
                        "md": "8px"
                    },
                    fontFamily: {
                        "headline": ["Roboto", "Inter", "sans-serif"],
                        "display": ["Roboto", "Inter", "sans-serif"],
                        "body": ["Roboto", "Inter", "sans-serif"],
                        "label": ["Public Sans", "Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            font-family: 'Roboto', sans-serif;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-16 w-full bg-surface border-b border-outline transition-colors duration-200">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant rounded-full transition-colors duration-200 text-on-surface">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline text-[1.375rem] font-bold text-on-surface">Accounting</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A clean professional studio portrait of a corporate accountant with a friendly, trustworthy expression. The lighting is bright and even, fitting a high-end financial application interface. The background is a soft, out-of-focus modern office environment in neutral light-mode tones of white and grey." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGrE44KfjaUhBUQNdNH8s0IcUHVjj3XbdZvdrLwGGJIaCVccqUwmZBPvZTsLcGetfskK208w3ETPpg6RrR1wnFgrIBmckxGCncNF00uZVpoiZblfedwtEZmO8TcJ7NSnE3ObQANWPCgCyAjpHDmes_Md1AO8x8Qma5c4gJyUPGW2sDdXzUxW4KJM8Ai1z0top1XkLbt5mxuy_VVNB-Z6ksvFpGBZ1Hz01yFbbXW43ppiz4n-qcqPgo39tUAzA0qbnAMH8-nL7j2fGx"/>
</div>
</div>
</header>
<!-- Main Content Canvas (Error State) -->
<main class="flex-grow flex items-center justify-center px-4 py-20">
<div class="max-w-md w-full text-center flex flex-col items-center animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Error Illustration -->
<div class="w-64 h-64 mb-8 relative">
<img alt="Error loading accounting data" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLsass0U1CB1tJPYuyWSBDm9oGevlTvbD3Y2vKkFEfp8pz6J0DBLwwbH_BZYitV6wSeVez3sHrQssAJ2GB9YTYEQ2zSyx2apLcYtgpSTKsL8bnR0zVhdp15Ut_V1g_dqvp6lCIFgNOpEj2lkVy3qmS0UdPQk24MRUaF-r05Xxx4AUepJliycOnBC3Hg6dydf9IQ2sk66N-6sPfzArKXJ_Y7GR8THUCQGG2lXUMekHFbpDccyN2jRAtKWBGp-"/>
<!-- Decorative subtle pulses to indicate a 'broken' connection -->
<div class="absolute inset-0 bg-primary/5 rounded-full animate-ping opacity-20"></div>
</div>
<!-- Error Messaging -->
<div class="space-y-4 mb-10">
<h2 class="font-headline text-[1.75rem] font-semibold text-on-surface leading-tight">
                    Unable to load accounting data
                </h2>
<p class="font-body text-base text-on-surface-variant leading-relaxed px-2">
                    Something went wrong while fetching the chart of accounts and journal entries. Please check your connection and try again.
                </p>
</div>
<!-- Primary Action -->
<button class="bg-primary text-on-primary font-label text-sm font-medium px-8 py-3 rounded-xl flex items-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-sm" id="retry_button">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                Retry
            </button>
<!-- Secondary metadata/helper -->
<p class="mt-8 font-mono text-[0.75rem] text-on-surface-variant opacity-50">
                ERR_CONNECTION_FAILED (REQ_ACCO_404)
            </p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low p-2 rounded-lg transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[0.875rem] font-medium mt-1">Home</span>
</a>
<!-- Clients (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low p-2 rounded-lg transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-[0.875rem] font-medium mt-1">Clients</span>
</a>
<!-- Collections (Active State Mapping to Accounting/Finance Context) -->
<!-- Note: Picking Collections as it is the closest financial match to the 'Accounting' screen intent -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-label text-[0.875rem] font-medium mt-1">Collections</span>
</a>
<!-- Sync (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low p-2 rounded-lg transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[0.875rem] font-medium mt-1">Sync</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Visual feedback for clicking
            btn.classList.add('opacity-50');
            icon.classList.add('animate-spin');
            btn.disabled = true;
            
            // Simulate a reload attempt
            setTimeout(() => {
                btn.classList.remove('opacity-50');
                icon.classList.remove('animate-spin');
                btn.disabled = false;
                console.log('Retrying data fetch for Accounting module...');
            }, 1500);
        });

        // Autonomously determine active state logic based on page intent (Accounting maps to Collections)
        // This is handled in the static HTML above as per the hierarchy rules.
    </script>
</body></html>
