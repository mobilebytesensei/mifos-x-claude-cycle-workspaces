<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mifos Back Office - Accounting Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006CB5",
            "on-primary": "#FFFFFF",
            "primary-container": "#CBE6FF",
            "on-primary-container": "#001D33",
            "secondary": "#00796B",
            "on-secondary": "#FFFFFF",
            "secondary-container": "#B8F2E6",
            "on-secondary-container": "#00201A",
            "tertiary": "#5B5891",
            "on-tertiary": "#FFFFFF",
            "tertiary-container": "#E3DFFF",
            "on-tertiary-container": "#17124B",
            "surface": "#FCFCFF",
            "on-surface": "#1A1C1E",
            "surface-variant": "#DEE3EB",
            "on-surface-variant": "#42474E",
            "surface-container-low": "#F3F4F9",
            "background": "#FCFCFF",
            "on-background": "#1A1C1E",
            "outline": "#72777F",
            "success": "#2E7D32",
            "warning": "#F57C00",
            "warning-strong": "#B45309",
            "error": "#BA1A1A",
            "on-error": "#FFFFFF",
            "error-container": "#FFDAD6",
            "on-error-container": "#410002",
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "sm": "4px",
            "md": "8px",
            "lg": "16px",
            "xl": "28px",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Inter", "sans-serif"],
            "display": ["Inter", "sans-serif"],
            "body": ["Roboto", "sans-serif"],
            "label": ["Public Sans", "sans-serif"],
            "mono": ["Roboto Mono", "monospace"]
          },
          spacing: {
            "xs": "4px",
            "sm": "8px",
            "md": "16px",
            "lg": "24px",
            "xl": "32px",
            "xxl": "48px",
          }
        },
      },
    }
  </script>
<style>
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer {
      background: linear-gradient(90deg, #DEE3EB 25%, #E8EDF4 50%, #DEE3EB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #FCFCFF;
      font-family: 'Roboto', sans-serif;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center justify-between px-4 h-16 shadow-none">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">menu</span>
<div class="shimmer h-6 w-32 rounded-sm" id="accounting_header"></div>
</div>
<div class="w-8 h-8 rounded-full shimmer"></div>
</header>
<!-- Scrollable Canvas -->
<main class="flex-1 mt-16 mb-20 px-md py-lg overflow-y-auto space-y-md">
<!-- 1. Header Skeleton (#accounting_header) -->
<div class="space-y-sm">
<div class="shimmer h-10 w-3/4 rounded-md"></div>
<div class="shimmer h-4 w-1/2 rounded-sm opacity-60"></div>
</div>
<!-- 2. Chip Skeleton (#accounting_type_filter) -->
<div class="flex gap-sm overflow-hidden py-xs" id="accounting_type_filter">
<div class="shimmer h-8 w-20 rounded-xl"></div>
<div class="shimmer h-8 w-24 rounded-xl"></div>
<div class="shimmer h-8 w-20 rounded-xl"></div>
<div class="shimmer h-8 w-28 rounded-xl"></div>
</div>
<!-- 3. Content Area Skeleton (#accounting_content) -->
<div class="bg-surface border border-outline rounded-lg p-md space-y-md" id="accounting_content">
<div class="shimmer h-4 w-1/4 rounded-sm"></div>
<div class="grid grid-cols-2 gap-md">
<div class="shimmer h-20 rounded-lg"></div>
<div class="shimmer h-20 rounded-lg"></div>
</div>
</div>
<!-- 4. List item Skeleton (#gl_account_row) -->
<div class="bg-surface border border-outline rounded-lg p-md flex items-center gap-md" id="gl_account_row">
<div class="shimmer h-10 w-10 rounded-full flex-shrink-0"></div>
<div class="flex-1 space-y-sm">
<div class="shimmer h-5 w-2/3 rounded-sm"></div>
<div class="shimmer h-4 w-1/3 rounded-sm opacity-60"></div>
</div>
<div class="shimmer h-6 w-16 rounded-sm"></div>
</div>
<!-- 5. List item Skeleton (#journal_entry_row) -->
<div class="bg-surface border border-outline rounded-lg p-md flex items-center gap-md" id="journal_entry_row">
<div class="shimmer h-10 w-10 rounded-full flex-shrink-0"></div>
<div class="flex-1 space-y-sm">
<div class="shimmer h-5 w-1/2 rounded-sm"></div>
<div class="shimmer h-4 w-1/4 rounded-sm opacity-60"></div>
</div>
<div class="shimmer h-6 w-12 rounded-sm"></div>
</div>
<!-- 6. Chip Skeleton (#journal_status_chip) -->
<div class="flex gap-sm" id="journal_status_chip">
<div class="shimmer h-6 w-20 rounded-sm"></div>
</div>
<!-- 7. FAB Placeholder (Manual Placement logic, but follows archetype list) -->
<!-- The actual FAB will be fixed bottom-right, but for the scrollable order, we place its logical spot here -->
<div class="h-4"></div>
<!-- 8. Button Skeleton (#start_journal_entry_button) -->
<div class="shimmer h-12 w-full rounded-xl" id="start_journal_entry_button"></div>
<!-- 9. Button Skeleton (#add_debit_line_button) -->
<div class="shimmer h-10 w-1/2 rounded-xl" id="add_debit_line_button"></div>
<!-- 10. Button Skeleton (#add_credit_line_button) -->
<div class="shimmer h-10 w-1/2 rounded-xl ml-auto" id="add_credit_line_button"></div>
<!-- 11. Content Area Skeleton (#balance_indicator) -->
<div class="bg-surface-container-low rounded-lg p-md flex justify-between items-center border border-outline/20" id="balance_indicator">
<div class="shimmer h-4 w-24 rounded-sm"></div>
<div class="shimmer h-6 w-32 rounded-sm"></div>
</div>
<!-- 12. Button Skeleton (#post_journal_entry_button) -->
<div class="shimmer h-14 w-full rounded-xl bg-primary/20" id="post_journal_entry_button"></div>
<!-- 13. Button Skeleton (#reverse_journal_entry_button) -->
<div class="shimmer h-12 w-full rounded-xl border border-outline" id="reverse_journal_entry_button"></div>
<!-- 14. Button Skeleton (#create_gl_closure_button) -->
<div class="shimmer h-12 w-full rounded-xl" id="create_gl_closure_button"></div>
<!-- 15. Button Skeleton (#financial_activity_mapping_button) -->
<div class="shimmer h-12 w-full rounded-xl opacity-80" id="financial_activity_mapping_button"></div>
<!-- 16. Button Skeleton (#run_accruals_button) -->
<div class="shimmer h-12 w-full rounded-xl" id="run_accruals_button"></div>
<!-- 17. Button Skeleton (#retry_button) -->
<div class="shimmer h-10 w-32 mx-auto rounded-xl opacity-40" id="retry_button"></div>
<!-- Extra padding for scroll -->
<div class="h-10"></div>
</main>
<!-- FAB (#create_gl_account_fab) -->
<div class="fixed bottom-24 right-4 w-14 h-14 rounded-lg bg-secondary shadow-lg flex items-center justify-center shimmer opacity-90 transition-transform active:scale-95" id="create_gl_account_fab">
<div class="w-6 h-6 rounded-sm shimmer bg-on-secondary/30"></div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe px-2 shadow-none">
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label text-[11px] font-medium tracking-wide">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1">group</span>
<span class="font-label text-[11px] font-medium tracking-wide">Clients</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-label text-[11px] font-medium tracking-wide">Collections</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors px-4 py-2 rounded-xl">
<span class="material-symbols-outlined mb-1">sync</span>
<span class="font-label text-[11px] font-medium tracking-wide">Sync</span>
</div>
</nav>
<script>
    // Micro-interactions for navigation elements
    document.querySelectorAll('nav div, .fixed.bottom-24').forEach(el => {
      el.addEventListener('touchstart', () => {
        el.classList.add('scale-95', 'opacity-80');
      });
      el.addEventListener('touchend', () => {
        el.classList.remove('scale-95', 'opacity-80');
      });
    });

    // Simulate shimmer offset for a more organic feel
    document.querySelectorAll('.shimmer').forEach((el, index) => {
      el.style.animationDelay = (index * 0.05) + 's';
    });
  </script>
</body></html>
