</a>

<script>
        // Simple Interaction logic for feedback
        document.getElementById('cs_save')?.addEventListener('click', () => {
            const btn = document.getElementById('cs_save');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> Saving...';
            btn.disabled = true;
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Saved Successfully';
                btn.classList.replace('bg-primary', 'bg-success');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-success', 'bg-primary');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });

        document.getElementById('cs_error_retry')?.addEventListener('click', () => {
           window.location.reload(); 
        });

        // Numeric validation for mono inputs
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.addEventListener('blur', (e) => {
                if (e.target.value) {
                    e.target.value = parseFloat(e.target.value).toFixed(2);
                }
            });
        });
    </script>
