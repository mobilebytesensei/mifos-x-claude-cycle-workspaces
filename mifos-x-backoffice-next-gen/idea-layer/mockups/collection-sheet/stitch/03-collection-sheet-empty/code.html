<script>
        // Micro-interactions for button presses
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                // Logic for "Pick Meeting" or other interactions would go here
                console.log('Action triggered:', this.innerText.trim());
            });
        });

        // Simulate network state check (for Design System "Offline-First" requirement)
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        function updateOnlineStatus() {
            const banner = document.getElementById('offline-status');
            if (!navigator.onLine) {
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }
        
        // Initial check
        updateOnlineStatus();
    </script>
