<style>
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-container {
            position: relative;
            overflow: hidden;
            background-color: #DEE3EB; /* surface-variant */
        }
        .shimmer-effect::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            animation: shimmer 1.5s infinite;

<!-- Subtle atmospheric micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simulate gradual fade-in of UI shell while skeletons pulse
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transition = 'opacity 0.6s ease-out';
            setTimeout(() => {
                main.style.opacity = '1';
            }, 100);

            // Add slight hover tilt to the active nav item for fun
            const activeNav = document.querySelector('.bg-primary-container');
            if (activeNav) {
                activeNav.addEventListener('mousemove', (e) => {
                    const { left, top, width, height } = activeNav.getBoundingClientRect();
                    const x = (e.clientX - left) / width - 0.5;
                    const y = (e.clientY - top) / height - 0.5;
                    activeNav.style.transform = `perspective(100px) rotateX(${y * 10}deg) rotateY(${x * 10}deg) scale(1.05)`;
                });
                activeNav.addEventListener('mouseleave', () => {
                    activeNav.style.transform = 'scale(1)';
                });
            }
        });
    </script>
