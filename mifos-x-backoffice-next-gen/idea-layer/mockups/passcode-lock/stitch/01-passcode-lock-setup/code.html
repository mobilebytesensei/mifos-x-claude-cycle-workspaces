<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        theme: {
          extend: {
            "colors": {

              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "tertiary": "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "background": "#FCFCFF",
              "on-background": "#1A1C1E",
              "outline": "#72777F",
              "success": "#2E7D32",
              "warning": "#F57C00",
              "warning-strong": "#B45309",
              "error": "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002"
            },
            "borderRadius": {
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px"
            },
            "spacing": {
              "xs": "4px",
              "sm": "8px",
              "md": "16px",
              "lg": "24px",
              "xl": "32px",
              "xxl": "48px"
            },
            "fontFamily": {
              "headline": ["Roboto", "sans-serif"],
              "body": ["Roboto", "sans-serif"],
              "label": ["Roboto", "sans-serif"],
              "caption": ["Roboto", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"]
            },
            "fontSize": {
              "h1": ["2rem", { lineHeight: "1.25", letterSpacing: "0", fontWeight: "700" }],
              "h2": ["1.75rem", { lineHeight: "1.3", letterSpacing: "0", fontWeight: "600" }],
              "h3": ["1.375rem", { lineHeight: "1.35", letterSpacing: "0", fontWeight: "600" }],
              "body": ["1rem", { lineHeight: "1.5", letterSpacing: "0", fontWeight: "400" }],
              "label": ["0.875rem", { lineHeight: "1.4", letterSpacing: "0.1px", fontWeight: "500" }],
              "caption": ["0.75rem", { lineHeight: "1.4", letterSpacing: "0.4px", fontWeight: "400" }],
              "mono": ["0.875rem", { lineHeight: "1.4", letterSpacing: "0", fontWeight: "400" }]
            }
          }
        }
      }
    </script>
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body antialiased flex flex-col pt-safe pb-safe md:hidden">
<!-- Screen Intent: Linear/Transactional Setup. 
         Rule: Automatic Suppression of Navigation Shell. 
         Suppressing BottomNavBar as this is a setup/auth screen. -->
<main class="flex-1 flex flex-col items-center justify-center p-lg w-full max-w-md mx-auto h-full min-h-[884px]">
<!-- Header -->
<div class="flex flex-col items-center mb-xl w-full text-center">
<span class="material-symbols-outlined text-primary text-5xl mb-md" style="font-variation-settings: 'FILL' 1;">lock</span>
<h1 class="text-h1 text-on-surface mb-sm" id="lock_header">Secure Your Account</h1>
<p class="text-body text-on-surface-variant">Enter a 6-digit passcode to protect your data.</p>
</div>
<!-- Indicator row -->
<div class="flex justify-center items-center space-x-lg mb-xxl h-12" id="pin_dots">
<div class="w-4 h-4 rounded-full border-2 border-outline bg-surface"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline bg-surface"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline bg-surface"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline bg-surface"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline bg-surface"></div>
<div class="w-4 h-4 rounded-full border-2 border-outline bg-surface"></div>
</div>
<!-- Error Text Placeholder -->
<div class="min-h-[24px] mb-lg text-center w-full" id="error_label">
<p class="text-body text-error hidden">Passcodes do not match</p>
</div>
<!-- Chip Placeholder -->
<div class="hidden mb-lg px-md py-sm bg-secondary-container text-on-secondary-container rounded-sm text-label" id="lockout_countdown">
            Try again in 2:59
        </div>
<!-- Keypad -->
<div class="grid grid-cols-3 gap-md w-full max-w-[320px] mb-xl" id="digit_pad">
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">1</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">2</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">3</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">4</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">5</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">6</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">7</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">8</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">9</button>
<!-- Biometric Action -->
<button class="w-full aspect-square flex items-center justify-center rounded-full text-primary hover:bg-surface-variant active:bg-surface-variant transition-colors" id="biometric_button">
<span class="material-symbols-outlined text-3xl">fingerprint</span>
</button>
<button class="w-full aspect-square flex items-center justify-center rounded-full bg-surface-container-low text-on-surface text-h2 hover:bg-surface-variant active:bg-surface-variant transition-colors">0</button>
<!-- Delete Action -->
<button class="w-full aspect-square flex items-center justify-center rounded-full text-secondary hover:bg-surface-variant active:bg-surface-variant transition-colors" id="delete_key">
<span class="material-symbols-outlined text-3xl">backspace</span>
</button>
</div>
</main>
<script>
        // Simple visual interaction script for the dots
        const buttons = document.querySelectorAll('#digit_pad button:not(#biometric_button):not(#delete_key)');
        const deleteBtn = document.getElementById('delete_key');
        const dots = document.querySelectorAll('#pin_dots div');
        let currentLength = 0;

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < currentLength) {
                    dot.classList.remove('bg-surface', 'border-2', 'border-outline');
                    dot.classList.add('bg-primary');
                } else {
                    dot.classList.add('bg-surface', 'border-2', 'border-outline');
                    dot.classList.remove('bg-primary');
                }
            });
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (currentLength < 6) {
                    currentLength++;
                    updateDots();
                }
            });
        });

        deleteBtn.addEventListener('click', () => {
            if (currentLength > 0) {
                currentLength--;
                updateDots();
            }
        });
    </script>
</body></html>
