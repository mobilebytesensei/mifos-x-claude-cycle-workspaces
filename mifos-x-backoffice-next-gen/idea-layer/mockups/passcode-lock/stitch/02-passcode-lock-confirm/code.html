<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Confirm Passcode - Mifos-X Back Office</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006CB5",
            "on-primary": "#FFFFFF",
            "primary-container": "#CBE6FF",
            "on-primary-container": "#001D33",
            secondary: "#00796B",
            "on-secondary": "#FFFFFF",
            "secondary-container": "#B8F2E6",
            "on-secondary-container": "#00201A",
            tertiary: "#5B5891",
            "on-tertiary": "#FFFFFF",
            "tertiary-container": "#E3DFFF",
            "on-tertiary-container": "#17124B",
            surface: "#FCFCFF",
            "on-surface": "#1A1C1E",
            "surface-variant": "#DEE3EB",
            "on-surface-variant": "#42474E",
            "surface-container-low": "#F3F4F9",
            background: "#FCFCFF",
            "on-background": "#1A1C1E",
            outline: "#72777F",
            success: "#2E7D32",
            warning: "#F57C00",
            "warning-strong": "#B45309",
            error: "#BA1A1A",
            "on-error": "#FFFFFF",
            "error-container": "#FFDAD6",
            "on-error-container": "#410002"
          },
          borderRadius: {
            "sm": "4px",
            "md": "8px",
            "lg": "16px",
            "xl": "28px"
          },
          spacing: {
            "xs": "4px",
            "sm": "8px",
            "md": "16px",
            "lg": "24px",
            "xl": "32px",
            "xxl": "48px"
          },
          fontFamily: {
            h1: ["Roboto"],
            h2: ["Roboto"],
            h3: ["Roboto"],
            body: ["Roboto"],
            label: ["Roboto"],
            caption: ["Roboto"],
            mono: ["Roboto Mono"]
          }
        }
      }
    }
  </script>
<style>
    /* Component Tokens */
    .btn-primary { background-color: theme('colors.primary'); color: theme('colors.on-primary'); border-radius: theme('borderRadius.xl'); padding: theme('spacing.md'); }
    .btn-primary-disabled { background-color: theme('colors.surface-variant'); color: theme('colors.on-surface-variant'); border-radius: theme('borderRadius.xl'); padding: theme('spacing.md'); }
    .btn-secondary { background-color: theme('colors.surface'); color: theme('colors.primary'); border-radius: theme('borderRadius.xl'); padding: theme('spacing.md'); border: 1px solid theme('colors.outline'); }
    .status-chip { background-color: theme('colors.secondary-container'); color: theme('colors.on-secondary-container'); border-radius: theme('borderRadius.sm'); }
    .status-chip-error { background-color: theme('colors.error-container'); color: theme('colors.on-error-container'); border-radius: theme('borderRadius.sm'); }
    
    .keypad-btn {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 24px;
      font-weight: 400;
      color: theme('colors.on-surface');
      background-color: theme('colors.surface');
      border: 1px solid theme('colors.outline');
      transition: background-color 0.2s;
    }
    .keypad-btn:active {
      background-color: theme('colors.surface-variant');
    }
    .keypad-btn.action-btn {
      border: none;
      background: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas - Suppressing shell for transactional/auth screen -->
<main class="flex-1 flex flex-col items-center justify-center px-lg py-xl max-w-md mx-auto w-full">
<div class="w-full flex flex-col items-center gap-xl text-center">
<!-- #lock_header -->
<div class="flex flex-col items-center gap-md" id="lock_header">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 0;">lock</span>
<h1 class="text-[28px] font-bold leading-tight font-h1">Confirm Passcode</h1>
<p class="text-on-surface-variant text-[16px] font-body max-w-[280px]">Please enter your new 4-digit passcode again to confirm.</p>
</div>
<!-- #error_label -->
<div class="flex items-center gap-xs text-error font-label text-[14px] opacity-100 transition-opacity" id="error_label" role="alert">
<span class="material-symbols-outlined text-[16px]">error</span>
<span>Passcodes do not match. Try again.</span>
</div>
<!-- #pin_dots -->
<div aria-label="Passcode entry progress" class="flex justify-center gap-lg my-md" id="pin_dots">
<div aria-hidden="true" class="w-4 h-4 rounded-full bg-primary"></div>
<div aria-hidden="true" class="w-4 h-4 rounded-full bg-primary"></div>
<div aria-hidden="true" class="w-4 h-4 rounded-full bg-surface-variant border border-outline"></div>
<div aria-hidden="true" class="w-4 h-4 rounded-full bg-surface-variant border border-outline"></div>
</div>
<!-- #lockout_countdown -->
<div class="status-chip-error px-md py-xs font-label text-[14px] flex items-center gap-xs" id="lockout_countdown">
<span class="material-symbols-outlined text-[16px]">timer</span>
<span>Retry in 30s</span>
</div>
<!-- #digit_pad -->
<div class="grid grid-cols-3 gap-x-lg gap-y-lg mt-md w-full max-w-[280px] mx-auto place-items-center" id="digit_pad">
<button aria-label="1" class="keypad-btn font-mono">1</button>
<button aria-label="2" class="keypad-btn font-mono">2</button>
<button aria-label="3" class="keypad-btn font-mono">3</button>
<button aria-label="4" class="keypad-btn font-mono">4</button>
<button aria-label="5" class="keypad-btn font-mono">5</button>
<button aria-label="6" class="keypad-btn font-mono">6</button>
<button aria-label="7" class="keypad-btn font-mono">7</button>
<button aria-label="8" class="keypad-btn font-mono">8</button>
<button aria-label="9" class="keypad-btn font-mono">9</button>
<!-- #biometric_button -->
<button aria-label="Use Fingerprint" class="keypad-btn action-btn text-primary flex flex-col gap-xs" id="biometric_button">
<span class="material-symbols-outlined text-[32px]">fingerprint</span>
</button>
<button aria-label="0" class="keypad-btn font-mono">0</button>
<!-- #delete_key -->
<button aria-label="Delete" class="keypad-btn action-btn text-on-surface-variant flex flex-col gap-xs" id="delete_key">
<span class="material-symbols-outlined text-[28px]">backspace</span>
</button>
</div>
</div>
</main>
<script>
    // Lightweight interaction logic
    document.querySelectorAll('.keypad-btn').forEach(btn => {
      btn.addEventListener('touchstart', function() {
        if(!this.classList.contains('action-btn')){
          this.style.backgroundColor = 'var(--tw-colors-surface-variant)';
        }
      });
      btn.addEventListener('touchend', function() {
        if(!this.classList.contains('action-btn')){
          this.style.backgroundColor = 'var(--tw-colors-surface)';
        }
      });
    });
  </script>
</body></html>
