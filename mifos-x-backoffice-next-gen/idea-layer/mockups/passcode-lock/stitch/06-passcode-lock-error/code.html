            darkMode: "class",

                extend: {
                    colors: {
                        primary: "#006CB5",

                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",

                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px"
                    },
                    fontFamily: {
                        "h1": ["Roboto", "sans-serif"],

                        "body": ["Roboto", "sans-serif"],
                        "label": ["Roboto", "sans-serif"],
                        "caption": ["Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "h1": ["2rem", { lineHeight: "1.25", letterSpacing: "0", fontWeight: "700" }],

                        "caption": ["0.75rem", { lineHeight: "1.4", letterSpacing: "0.4px", fontWeight: "400" }],
                        "mono": ["0.875rem", { lineHeight: "1.4", letterSpacing: "0", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col md:flex-row antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (Semantic Shell - Rendered for Desktop Layout context or Mobile context if requested) -->
<header class="w-full top-0 sticky bg-surface border-b border-outline flex items-center px-4 h-16 w-full z-40 md:hidden">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-variant transition-colors duration-200 text-on-surface flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="ml-2 font-h2 text-h2 text-on-surface">Security Check</h1>
</header>
<!-- SideNav (Desktop) -->
<nav class="hidden md:flex flex-col w-20 bg-surface border-r border-outline min-h-screen z-40 fixed left-0 top-0 pt-4 pb-safe items-center">
<div class="mb-8 flex items-center justify-center w-12 h-12 rounded-full bg-primary-container text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<div class="flex flex-col gap-4 w-full">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-3 hover:bg-surface-variant transition-colors rounded-xl mx-2" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label text-label">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-3 hover:bg-surface-variant transition-colors rounded-xl mx-2" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">group</span>
<span class="font-label text-label">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-3 hover:bg-surface-variant transition-colors rounded-xl mx-2" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">receipt_long</span>
<span class="font-label text-label">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-2 py-3 hover:bg-surface-variant transition-colors rounded-xl mx-2" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">sync</span>
<span class="font-label text-label">Sync</span>
</a>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-center items-center px-4 py-md pb-24 md:pb-md md:pl-24 w-full max-w-lg mx-auto min-h-[calc(100vh-64px)] md:min-h-screen">
<div class="w-full flex flex-col items-center text-center">
<!-- Illustration -->
<div class="w-48 h-48 mb-8 relative flex items-center justify-center">
<img alt="Security Error Illustration" class="object-contain w-full h-full drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLuQILels9fF0w9GqHK_V-udTKjpbX_UY2U69xuBMyGv8UWhi0HJitYLRdWaXcrDSQHbzxfAF65eMibYGobdUHS3AIIbumzeejdNCA0Z8dSHPYtM6tFLJQCinkT4TxAYD1sCkCSsoiQ0IohhgCfBQVrYygETFZVZwdwx1MRz_KZXm32RqZAmmg00JqUUaBe2HkbfcDeb5ZgkDOg1e5496WE1t04wOE374MbmtVF8S2orPJhbslqMx92CqSFz"/>
</div>
<!-- Error Content -->
<h2 class="font-h2 text-h2 text-error mb-4" id="error_label">Security Lockout</h2>
<p class="font-body text-body text-on-surface-variant mb-6 px-4">
                Too many incorrect passcode attempts. Your account is temporarily locked for security reasons.
            </p>
<!-- Countdown Chip -->
<div class="inline-flex items-center justify-center bg-error-container text-on-error-container font-label text-label rounded-sm px-3 py-1.5 mb-12 border border-error/20 shadow-sm" id="lockout_countdown">
<span class="material-symbols-outlined text-[18px] mr-2" style="font-variation-settings: 'FILL' 0;">timer</span>
                Retry in 29:58
            </div>
<!-- Action Area -->
<div class="w-full mt-auto mb-4 px-4">
<button class="w-full bg-surface-variant text-on-surface-variant font-label text-label rounded-xl py-md px-6 flex items-center justify-center transition-all duration-200 shadow-none border border-outline/20 opacity-70 cursor-not-allowed" disabled="" id="retry_button">
<span class="material-symbols-outlined mr-2" style="font-variation-settings: 'FILL' 0;">refresh</span>
                    Retry
                </button>
</div>
<div class="w-full px-4 mb-8">
<button class="w-full bg-surface text-primary font-label text-label rounded-xl py-md px-6 flex items-center justify-center transition-all duration-200 border border-outline hover:bg-surface-variant">
                    Contact Support
                </button>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Layout context) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline z-50 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-transform duration-100 active:scale-95 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label text-label text-[10px]">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-transform duration-100 active:scale-95 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">group</span>
<span class="font-label text-label text-[10px]">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-transform duration-100 active:scale-95 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">receipt_long</span>
<span class="font-label text-label text-[10px]">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-transform duration-100 active:scale-95 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">sync</span>
<span class="font-label text-label text-[10px]">Sync</span>
</a>
</nav>
</body></html>
