<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Security Check - Locked Out</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary": "#006CB5",
            "on-primary": "#FFFFFF",
            "primary-container": "#CBE6FF",
            "on-primary-container": "#001D33",
            "secondary": "#00796B",
            "on-secondary": "#FFFFFF",
            "secondary-container": "#B8F2E6",
            "on-secondary-container": "#00201A",
            "tertiary": "#5B5891",
            "on-tertiary": "#FFFFFF",
            "tertiary-container": "#E3DFFF",
            "on-tertiary-container": "#17124B",
            "surface": "#FCFCFF",
            "on-surface": "#1A1C1E",
            "surface-variant": "#DEE3EB",
            "on-surface-variant": "#42474E",
            "surface-container-low": "#F3F4F9",
            "background": "#FCFCFF",
            "on-background": "#1A1C1E",
            "outline": "#72777F",
            "success": "#2E7D32",
            "warning": "#F57C00",
            "warning-strong": "#B45309",
            "error": "#BA1A1A",
            "on-error": "#FFFFFF",
            "error-container": "#FFDAD6",
            "on-error-container": "#410002"
          },
          "borderRadius": {
            "sm": "4px",
            "md": "8px",
            "lg": "16px",
            "xl": "28px"
          },
          "spacing": {
            "xs": "4px",
            "sm": "8px",
            "md": "16px",
            "lg": "24px",
            "xl": "32px",
            "xxl": "48px"
          },
          "fontFamily": {
            "h1": ["Roboto"],
            "h2": ["Roboto"],
            "h3": ["Roboto"],
            "body": ["Roboto"],
            "label": ["Roboto"],
            "caption": ["Roboto"],
            "mono": ["Roboto Mono"]
          },
          "fontSize": {
            "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
            "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
            "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
            "body": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
            "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500", letterSpacing: "0.1px" }],
            "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400", letterSpacing: "0.4px" }],
            "mono": ["0.875rem", { lineHeight: "1.4", fontWeight: "400" }]
          }
        }
      }
    }
  </script>
<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col pt-safe pb-safe">
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-lg py-xl gap-lg w-full max-w-md mx-auto">
<!-- 1. Header (#lock_header) -->
<header class="text-center w-full flex flex-col items-center gap-sm">
<span class="material-symbols-outlined text-[48px] text-error mb-2" data-icon="lock" style="font-variation-settings: 'FILL' 0;">lock</span>
<h1 class="text-h1 text-on-surface" id="lock_header">Security Check</h1>
</header>
<!-- 7. Error Text (#error_label) & 6. Lockout Chip (#lockout_countdown) -->
<div class="flex flex-col items-center text-center gap-md w-full mb-4">
<p class="text-body text-error font-medium px-md" id="error_label">
        Too many incorrect attempts. System locked for security.
      </p>
<div class="inline-flex items-center gap-2 bg-error-container text-on-error-container rounded-sm px-md py-sm shadow-sm border border-error-container" id="lockout_countdown">
<span class="material-symbols-outlined text-[20px]" data-icon="timer">timer</span>
<span class="text-label">Try again in <span class="font-mono font-bold" id="countdown_timer">30s</span></span>
</div>
</div>
<!-- 2. Indicator Row (#pin_dots) -->
<div class="flex justify-center items-center gap-md w-full mb-lg opacity-50 pointer-events-none" id="pin_dots">
<div class="w-4 h-4 rounded-full bg-error"></div>
<div class="w-4 h-4 rounded-full bg-error"></div>
<div class="w-4 h-4 rounded-full bg-error"></div>
<div class="w-4 h-4 rounded-full bg-surface-variant border border-outline"></div>
</div>
<!-- 3. Keypad (#digit_pad), 4. Delete (#delete_key), 5. Biometric (#biometric_button) -->
<div class="grid grid-cols-3 gap-md w-full max-w-[280px] mx-auto opacity-50 pointer-events-none">
<!-- Row 1 -->
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">1</button>
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">2</button>
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">3</button>
<!-- Row 2 -->
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">4</button>
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">5</button>
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">6</button>
<!-- Row 3 -->
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">7</button>
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">8</button>
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">9</button>
<!-- Row 4 -->
<!-- 5. Biometric Icon Button (#biometric_button) -->
<button aria-label="Biometric Login" class="w-16 h-16 rounded-full text-primary flex items-center justify-center mx-auto bg-transparent border-none shadow-none" id="biometric_button">
<span class="material-symbols-outlined text-[32px]" data-icon="fingerprint">fingerprint</span>
</button>
<button class="w-16 h-16 rounded-full bg-surface-variant text-on-surface text-h2 flex items-center justify-center mx-auto shadow-sm border border-outline">0</button>
<!-- 4. Delete Button (#delete_key) -->
<button aria-label="Delete last digit" class="w-16 h-16 rounded-full text-on-surface-variant flex items-center justify-center mx-auto bg-transparent border-none shadow-none" id="delete_key">
<span class="material-symbols-outlined text-[28px]" data-icon="backspace">backspace</span>
</button>
</div>
</main>
<!-- Dummy script for countdown -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      let seconds = 30;
      const timerElement = document.getElementById('countdown_timer');
      const dots = document.getElementById('pin_dots');
      const keypadButtons = document.querySelectorAll('.grid button');

      const interval = setInterval(() => {
        seconds--;
        if (seconds >= 0) {
          timerElement.textContent = `${seconds}s`;
        } else {
          clearInterval(interval);
          timerElement.parentElement.innerHTML = 'Try again now';
          
          // Re-enable visual state (demo purposes)
          dots.classList.remove('opacity-50', 'pointer-events-none');
          keypadButtons.forEach(btn => btn.parentElement.classList.remove('opacity-50', 'pointer-events-none'));
          
          // Reset dots to empty
          const dotsChildren = dots.children;
          for(let i=0; i<dotsChildren.length; i++) {
            dotsChildren[i].className = 'w-4 h-4 rounded-full bg-surface-variant border border-outline';
          }
          
          document.getElementById('error_label').classList.add('hidden');
          document.getElementById('lockout_countdown').classList.replace('bg-error-container', 'bg-surface-variant');
          document.getElementById('lockout_countdown').classList.replace('text-on-error-container', 'text-on-surface-variant');
          document.getElementById('lockout_countdown').classList.replace('border-error-container', 'border-outline');
          document.getElementById('lockout_countdown').querySelector('.material-symbols-outlined').textContent = 'lock_open';
          
          document.querySelector('header .material-symbols-outlined').classList.remove('text-error');
          document.querySelector('header .material-symbols-outlined').classList.add('text-primary');
        }
      }, 1000);
    });
  </script>
</body></html>
