<script>
        // Micro-interaction for the minimize button
        document.querySelector('button').addEventListener('click', function(e) {
            if (this.innerText.includes('Minimize')) {
                const overlay = this.closest('.fixed');
                overlay.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                overlay.classList.remove('opacity-100', 'scale-100');
                
                // Show a small toast indicator for background process
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-on-surface text-surface px-4 py-3 rounded-xl shadow-lg z-[60] flex items-center gap-3 transition-all transform translate-y-10 opacity-0';
                toast.innerHTML = `
                    <span class="material-symbols-outlined text-primary-fixed animate-spin" data-icon="sync">sync</span>
                    <span class="font-label-md">Submission running in background...</span>
                `;
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.remove('translate-y-10', 'opacity-0');
                    toast.classList.add('translate-y-0', 'opacity-100');
                }, 100);

                // Re-enable interactions on main content after a delay (simulating minimize)
                setTimeout(() => {
                    document.querySelector('main').classList.remove('blur-sm', 'pointer-events-none', 'select-none');
                }, 300);
            }
        });
    </script>
