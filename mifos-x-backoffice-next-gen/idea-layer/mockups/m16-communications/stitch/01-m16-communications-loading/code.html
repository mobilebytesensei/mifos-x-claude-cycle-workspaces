<script>
        // Simple micro-interaction for skeleton opacity pulse (manual)
        const shimmers = document.querySelectorAll('.shimmer');
        let currentOpacity = 0.8;
        let direction = -0.01;

        function pulse() {
            currentOpacity += direction;
            if (currentOpacity <= 0.4 || currentOpacity >= 0.9) direction *= -1;
            shimmers.forEach(s => {
                if (!s.classList.contains('opacity-50') && !s.classList.contains('opacity-60')) {
                    s.style.opacity = currentOpacity;
                }
            });
            requestAnimationFrame(pulse);
        }
        pulse();
    </script>
