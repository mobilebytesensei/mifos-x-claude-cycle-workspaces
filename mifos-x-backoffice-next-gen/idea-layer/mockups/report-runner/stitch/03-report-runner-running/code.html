<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Running Report - Mifos-X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    fontFamily: {
                        headline: ["Roboto", "sans-serif"],
                        display: ["Roboto", "sans-serif"],
                        body: ["Roboto", "sans-serif"],
                        label: ["Roboto", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        sm: "4px",
                        md: "8px",
                        lg: "16px",
                        xl: "28px",
                        full: "9999px"
                    },
                    spacing: {
                        xs: "4px",
                        sm: "8px",
                        md: "16px",
                        lg: "24px",
                        xl: "32px",
                        xxl: "48px"
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Roboto', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0; }
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin-slow 2s linear infinite; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface text-on-surface flex justify-between items-center w-full px-md h-16 shrink-0 border-b border-surface-variant z-10" style="box-shadow: none;">
<div class="flex items-center gap-md">
<button class="p-2 rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline text-[1.375rem] font-semibold">Run Report</h1>
</div>
<div class="flex items-center gap-2">
<!-- Actions could go here -->
</div>
</header>
<div class="flex flex-1 overflow-hidden">
<!-- Navigation Rail (Tablet/Desktop) - Supressed due to transactional nature of 'running report' but keeping shell structure if needed. Leaving out for focus on canvas as requested by 'dead end' rule. -->
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto p-md md:p-lg bg-background">
<div class="max-w-4xl mx-auto flex flex-col gap-lg">
<!-- Report Configuration Header Card -->
<section class="bg-surface rounded-lg p-md border border-outline/20">
<h2 class="text-[1.375rem] font-semibold text-on-surface mb-md">Report Configuration</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-md">
<div>
<span class="text-[0.75rem] font-medium text-on-surface-variant uppercase tracking-wider block mb-xs">Report Type</span>
<p class="text-base text-on-surface font-medium">Detailed Client Statement</p>
</div>
<div>
<span class="text-[0.75rem] font-medium text-on-surface-variant uppercase tracking-wider block mb-xs">Parameters</span>
<p class="text-base text-on-surface font-medium">All Branches, Active Accounts</p>
</div>
<div>
<span class="text-[0.75rem] font-medium text-on-surface-variant uppercase tracking-wider block mb-xs">Date Range</span>
<p class="text-base text-on-surface font-medium font-mono">01-Jan-2026 to 31-Dec-2026</p>
</div>
</div>
</section>
<!-- Running State Card -->
<section class="bg-surface rounded-lg p-lg border border-outline/20 flex flex-col items-center justify-center py-xxl text-center">
<div class="relative mb-lg">
<svg class="w-24 h-24 text-surface-variant animate-spin-slow" fill="none" viewbox="0 0 24 24">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75 text-primary" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl">autorenew</span>
</div>
</div>
<h3 class="text-[1.75rem] font-semibold text-on-surface mb-xs">Running Report</h3>
<p class="text-on-surface-variant mb-lg text-base">Aggregating branch data...</p>
<!-- Progress Bar -->
<div class="w-full max-w-md mx-auto mb-sm">
<div class="flex justify-between text-[0.875rem] font-medium mb-2 text-on-surface-variant">
<span>Progress</span>
<span class="font-mono text-primary">75%</span>
</div>
<div class="w-full h-2 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 75%;"></div>
</div>
</div>
</section>
<!-- Skeleton Area for Results -->
<section class="bg-surface rounded-lg p-md border border-outline/20 opacity-50 pointer-events-none">
<div class="flex justify-between items-center mb-md pb-md border-b border-surface-variant">
<h3 class="text-[1.375rem] font-semibold text-on-surface">Preview</h3>
<div class="flex items-center gap-xs text-on-surface-variant text-[0.875rem] font-medium">
<span class="material-symbols-outlined text-[1.25rem]">sort</span>
                            Sorting
                        </div>
</div>
<!-- Data Table Skeleton -->
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-surface-variant/50 text-on-surface-variant text-[0.875rem] font-medium border-b border-outline/20">
<th class="p-md py-sm">Client ID</th>
<th class="p-md py-sm">Name</th>
<th class="p-md py-sm">Branch</th>
<th class="p-md py-sm text-right">Balance</th>
</tr>
</thead>
<tbody>
<tr class="border-b border-surface-variant">
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-20 animate-pulse"></div></td>
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-40 animate-pulse"></div></td>
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-24 animate-pulse"></div></td>
<td class="p-md py-sm flex justify-end"><div class="h-4 bg-surface-variant rounded-sm w-24 animate-pulse"></div></td>
</tr>
<tr class="border-b border-surface-variant">
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-24 animate-pulse"></div></td>
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-32 animate-pulse"></div></td>
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-20 animate-pulse"></div></td>
<td class="p-md py-sm flex justify-end"><div class="h-4 bg-surface-variant rounded-sm w-28 animate-pulse"></div></td>
</tr>
<tr>
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-16 animate-pulse"></div></td>
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-36 animate-pulse"></div></td>
<td class="p-md py-sm"><div class="h-4 bg-surface-variant rounded-sm w-28 animate-pulse"></div></td>
<td class="p-md py-sm flex justify-end"><div class="h-4 bg-surface-variant rounded-sm w-20 animate-pulse"></div></td>
</tr>
</tbody>
</table>
</div>
</section>
<!-- Action Buttons (Secondary/Pending) -->
<section class="flex justify-end gap-md pt-md">
<button class="bg-surface text-primary rounded-xl px-md py-2 border border-outline/20 font-medium text-[0.875rem] flex items-center gap-xs hover:bg-surface-variant/30 transition-colors opacity-70 cursor-not-allowed">
<span class="material-symbols-outlined text-[1.25rem]">refresh</span>
                        Retry
                    </button>
<button class="bg-surface-variant text-on-surface-variant rounded-xl px-md py-2 font-medium text-[0.875rem] flex items-center gap-xs opacity-70 cursor-not-allowed">
<span class="material-symbols-outlined text-[1.25rem]">download</span>
                        Export to CSV
                    </button>
</section>
</div>
</main>
</div>
</body></html>
