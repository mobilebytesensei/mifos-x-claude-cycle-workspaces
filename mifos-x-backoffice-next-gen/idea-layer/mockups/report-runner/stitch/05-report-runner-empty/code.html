<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Runner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px"
                    },
                    fontFamily: {
                        "headline": ["Roboto", "sans-serif"],
                        "display": ["Roboto", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "h1": ["2rem", { lineHeight: "1.25", letterSpacing: "0", fontWeight: "700" }],
                        "h2": ["1.75rem", { lineHeight: "1.3", letterSpacing: "0", fontWeight: "600" }],
                        "h3": ["1.375rem", { lineHeight: "1.35", letterSpacing: "0", fontWeight: "600" }],
                        "body": ["1rem", { lineHeight: "1.5", letterSpacing: "0", fontWeight: "400" }],
                        "label": ["0.875rem", { lineHeight: "1.4", letterSpacing: "0.1px", fontWeight: "500" }],
                        "caption": ["0.75rem", { lineHeight: "1.4", letterSpacing: "0.4px", fontWeight: "400" }],
                        "mono": ["0.875rem", { lineHeight: "1.4", letterSpacing: "0", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for cleaner look while keeping functionality */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen flex flex-col overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface text-on-surface flex justify-between items-center w-full px-md py-sm sticky top-0 z-10 flex-shrink-0" style="min-height: 64px;">
<div class="flex items-center gap-sm">
<button aria-label="Menu" class="p-2 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors duration-200 flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-on-surface tracking-tight">Report Runner</h1>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto px-md py-md pb-xxl flex flex-col gap-lg bg-surface relative z-0">
<!-- Controls Section -->
<section class="flex flex-col gap-md">
<!-- Dynamic Form Field -->
<div class="flex flex-col gap-xs" id="rr_param">
<label class="font-label text-label text-on-surface-variant" for="report-type">Select Report Type</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-variant text-on-surface rounded-sm px-md py-3 font-body text-body border-0 focus:ring-2 focus:ring-primary outline-none transition-shadow" id="report-type">
<option disabled="" selected="" value="">Choose a report...</option>
<option value="balance_sheet">Balance Sheet</option>
<option value="income_statement">Income Statement</option>
<option value="cash_flow">Cash Flow</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Run Button -->
<button class="w-full bg-primary text-on-primary rounded-xl px-md py-3 font-label text-label flex justify-center items-center gap-sm hover:bg-primary/90 active:scale-[0.98] transition-all disabled:bg-surface-variant disabled:text-on-surface-variant disabled:active:scale-100" id="rr_run">
<span class="material-symbols-outlined text-[20px]" data-icon="play_arrow">play_arrow</span>
                Run Report
            </button>
</section>
<!-- Divider -->
<hr class="border-t border-outline/20"/>
<!-- Toolbar (Disabled State) -->
<section class="flex justify-between items-center">
<div class="flex items-center gap-xs text-on-surface-variant opacity-50 cursor-not-allowed" id="rr_sort">
<span class="material-symbols-outlined text-[20px]" data-icon="sort">sort</span>
<span class="font-label text-label">Sort By</span>
</div>
<button class="flex items-center gap-xs text-on-surface-variant opacity-50 cursor-not-allowed font-label text-label" disabled="" id="rr_export">
<span class="material-symbols-outlined text-[20px]" data-icon="download">download</span>
                Export
            </button>
</section>
<!-- Empty State Section -->
<section class="flex-1 flex flex-col items-center justify-center text-center px-lg py-xl gap-md min-h-[300px]">
<div class="w-48 h-48 mb-sm flex items-center justify-center">
<img alt="Illustration" class="w-full h-full object-contain mix-blend-multiply opacity-80" src="https://lh3.googleusercontent.com/aida/AP1WRLvRX0txR7t5Kxxivjo0W9bpFJ3v2NcJMagowMxFtUp-8YNNERIiM4JFLaj_aUZBem0AzxiZnOR2yyzSY9DCxVrLJRZaWDLEQ9f7aPlgexoJu7COfyK-WkPsFjXJ8fpGkkIGAm52M_GqMF4KnkZrHz2UjVXQfa9aCv2HyockAFZAjzsTDrZQVKN2cV_xZjbaLZe05id62-9KUyuON2SKsJTaTmlltrWu-JqU2h6OS4ZNnA6zXQ6StvUEbtxH"/>
</div>
<h2 class="font-headline text-h3 text-on-surface">No report selected</h2>
<p class="font-body text-body text-on-surface-variant max-w-sm">
                Choose a report type and parameters to generate financial insights.
            </p>
<button class="mt-sm bg-surface text-primary border border-primary rounded-xl px-md py-2.5 font-label text-label hover:bg-primary-container/30 active:bg-primary-container/50 transition-colors flex items-center gap-2" id="rr_error_retry">
<span class="material-symbols-outlined text-[18px]" data-icon="refresh">refresh</span>
                Refresh List
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface text-on-surface-variant flex justify-around items-center w-full pb-safe pt-xs px-sm fixed bottom-0 left-0 z-50 flex-shrink-0 shadow-[0_-1px_3px_rgba(0,0,0,0.05)] md:hidden" style="min-height: 80px;">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center gap-1 w-16 h-14 hover:bg-surface-variant/30 rounded-lg transition-colors group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform" data-icon="home">home</span>
<span class="font-label text-[11px] font-medium leading-tight">Home</span>
</a>
<!-- Clients (Inactive) -->
<a class="flex flex-col items-center justify-center gap-1 w-16 h-14 hover:bg-surface-variant/30 rounded-lg transition-colors group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform" data-icon="groups">groups</span>
<span class="font-label text-[11px] font-medium leading-tight">Clients</span>
</a>
<!-- Collections (Inactive) -->
<a class="flex flex-col items-center justify-center gap-1 w-16 h-14 hover:bg-surface-variant/30 rounded-lg transition-colors group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-[11px] font-medium leading-tight">Collections</span>
</a>
<!-- Sync (Inactive) -->
<a class="flex flex-col items-center justify-center gap-1 w-16 h-14 hover:bg-surface-variant/30 rounded-lg transition-colors group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform" data-icon="sync">sync</span>
<span class="font-label text-[11px] font-medium leading-tight">Sync</span>
</a>
</nav>
<!-- NavigationRail (Tablet/Desktop) -->
<nav class="hidden md:flex flex-col items-center py-md gap-lg bg-surface border-r border-outline/20 w-[80px] fixed left-0 top-[64px] bottom-0 z-20">
<a class="flex flex-col items-center justify-center gap-1 w-14 h-14 hover:bg-surface-variant/30 rounded-lg transition-colors text-on-surface-variant group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform" data-icon="home">home</span>
<span class="font-label text-[11px] font-medium leading-tight">Home</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 w-14 h-14 hover:bg-surface-variant/30 rounded-lg transition-colors text-on-surface-variant group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform" data-icon="groups">groups</span>
<span class="font-label text-[11px] font-medium leading-tight">Clients</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 w-14 h-14 hover:bg-surface-variant/30 rounded-lg transition-colors text-on-surface-variant group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-[11px] font-medium leading-tight">Collections</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 w-14 h-14 hover:bg-surface-variant/30 rounded-lg transition-colors text-on-surface-variant group" href="#">
<span class="material-symbols-outlined group-active:scale-95 transition-transform" data-icon="sync">sync</span>
<span class="font-label text-[11px] font-medium leading-tight">Sync</span>
</a>
</nav>
<!-- Adjust main content padding on md+ screens to account for NavigationRail -->
<style>
        @media (min-width: 768px) {
            main {
                padding-left: calc(80px + 24px); /* Rail width + lg padding */
                padding-right: 24px;
                padding-bottom: 24px;
            }
        }
    </style>
</body></html>
