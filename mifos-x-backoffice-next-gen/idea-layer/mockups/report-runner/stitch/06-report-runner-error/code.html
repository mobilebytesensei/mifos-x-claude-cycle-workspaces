<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Runner - Error State</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Roboto & Public Sans -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Public+Sans:wght@500&amp;family=Roboto+Mono&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px"
                    },
                    fontFamily: {
                        "headline": ["Roboto", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
                        "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
                        "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
                        "body": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
                        "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
                        "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-font-smoothing: antialiased;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #72777F;
            border-radius: 10px;
        }
    </style>
</head>
<body class="font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar -->
<header class="bg-surface dark:bg-surface fixed top-0 left-0 w-full z-50 flex justify-between items-center px-md h-16 shadow-sm">
<div class="flex items-center gap-md">
<button class="p-2 hover:bg-surface-variant/50 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-on-surface dark:text-on-surface">Report Runner</h1>
</div>
<div class="flex items-center">
<button class="p-2 hover:bg-surface-variant/50 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="pt-20 pb-24 px-md flex flex-col gap-lg min-h-screen">
<!-- Report Parameters Section -->
<section class="bg-surface border border-outline/20 rounded-lg p-md flex flex-col gap-md shadow-sm">
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface-variant ml-1">Choose a report type...</label>
<div class="relative group">
<select class="w-full bg-surface-variant text-on-surface rounded-sm border-none py-md px-md appearance-none focus:ring-2 focus:ring-primary cursor-pointer transition-all">
<option value="detailed_statement">Detailed Client Statement</option>
<option value="portfolio_summary">Portfolio Summary Report</option>
<option value="active_loans">Active Loans Distribution</option>
<option value="collection_efficiency">Collection Efficiency Table</option>
</select>
<div class="absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label text-label py-md rounded-xl hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]">play_arrow</span>
                Run Selected Report
            </button>
</section>
<!-- Controls Row -->
<div class="flex justify-between items-center px-xs">
<div class="flex flex-col">
<span class="font-label text-label text-on-surface-variant">Sort Order: None</span>
</div>
<button class="border border-outline text-primary font-label text-label px-md py-sm rounded-xl hover:bg-primary/5 transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">download</span>
                Export to CSV
            </button>
</div>
<!-- Error Area -->
<section class="flex-1 flex flex-col items-center justify-center text-center py-xl px-md">
<div class="w-full max-w-[280px] mb-lg aspect-square">
<img alt="Minimalist error illustration for report generation" class="w-full h-full object-contain mix-blend-multiply opacity-80" src="https://lh3.googleusercontent.com/aida/AP1WRLsBz7XKOnjas7jMgVVBFYORkBL30b32yVXAMumGbsgC2w6BN5CIs-EUigaNpD_VvVch7YYOmpB-d5OKZqLxE-WHqr8b9LnztvP4ATmkl7agk97cV2f4a4eECVzpupscVDQdiTQKA8OMm_-6e8TPlkhF2Dxh7ZB-GusX-K7T0IhyW3RtuEbXq0M0ONXbikfjav4ufwpI06S2CUjzFowZgzIsVea70xyAtQJ7uY-MknY9anCzyZNjYpKnT3S1"/>
</div>
<h2 class="font-headline text-h2 text-on-surface mb-sm">Unable to load report</h2>
<p class="font-body text-body text-on-surface-variant max-w-xs mb-xl">
                Something went wrong while fetching the report data. Please check your connection and try again.
            </p>
<button class="bg-primary text-on-primary font-label text-label px-xxl py-md rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-md flex items-center gap-sm" onclick="location.reload()">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                Retry
            </button>
</section>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-sm py-xs bg-surface dark:bg-surface border-t border-outline/20">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 px-4 py-1 rounded-full transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-caption font-medium mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 px-4 py-1 rounded-full transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label text-caption font-medium mt-1">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 px-4 py-1 rounded-full transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-caption font-medium mt-1">Collections</span>
</a>
<!-- ACTIVE: Sync -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label text-caption font-medium mt-1">Sync</span>
</a>
</nav>
<script>
        // Micro-interaction for feedback on click
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
