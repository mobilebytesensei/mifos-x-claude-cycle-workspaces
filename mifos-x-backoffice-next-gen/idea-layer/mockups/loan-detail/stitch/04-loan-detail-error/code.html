<script>
        // Micro-interaction for retry button
        document.getElementById('ld_error_retry').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Add spinning animation to icon
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80', 'pointer-events-none');
            btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span> Retrying...';

            // Simulate a network check
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80', 'pointer-events-none');
                btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">refresh</span> Retry';
                // Note: In a real app, this would re-fetch data.
            }, 1500);
        });

        // Tab selection logic
        const tabButtons = document.querySelectorAll('#ld_tabs button');
        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => {
                    b.classList.remove('active-tab', 'text-primary', 'font-bold');
                    b.classList.add('text-on-surface-variant', 'font-medium');
                });
                btn.classList.add('active-tab', 'text-primary', 'font-bold');
                btn.classList.remove('text-on-surface-variant', 'font-medium');
            });
        });
    </script>
