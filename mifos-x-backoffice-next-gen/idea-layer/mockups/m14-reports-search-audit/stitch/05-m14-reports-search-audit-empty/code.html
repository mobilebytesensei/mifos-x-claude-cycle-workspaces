<style>
    body {
      background-color: #FCFCFF;
      font-family: 'Roboto', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .active-tab-indicator {
      position: absolute;
      bottom: 0;
      height: 3px;
      background-color: #006CB5;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Hide scrollbar for tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-on-background min-h-screen flex flex-col">

</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-outline/10">

</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 pt-16 pb-20 overflow-y-auto bg-background flex flex-col">

<nav class="sticky top-16 z-40 bg-surface border-b border-outline/10 overflow-x-auto no-scrollbar" id="tab_strip">

<button class="flex-1 py-4 text-center text-on-surface-variant font-medium hover:bg-surface-variant transition-colors whitespace-nowrap px-sm">

<!-- Content Area (Empty State) -->

          Your reports library is currently empty. Run a report or search the audit trail to get started.
        </p>
</div>
<div class="mt-xl w-full px-xl">
<button class="w-full bg-primary text-on-primary font-label py-4 rounded-xl shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" id="run_report_button">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>

<!-- Quick Tips Bento Style -->
<div class="grid grid-cols-2 gap-md mt-xxl w-full text-left">

</div>

</main>
<!-- BottomNavBar -->

<span class="font-label text-[10px] mt-1">Home</span>

<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-all py-1 px-4 rounded-full active:scale-95">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-[10px] mt-1">Clients</span>

<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-all py-1 px-4 rounded-full active:scale-95">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-[10px] mt-1">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-all py-1 px-4 rounded-full active:scale-95">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[10px] mt-1">Sync</span>
</button>

<script>
    // Micro-interaction for tabs
    const tabs = document.querySelectorAll('#tab_strip button');
    const indicator = document.querySelector('.active-tab-indicator');

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', (e) => {
        // Update active state
        tabs.forEach(t => {
          t.classList.remove('text-primary', 'font-bold');
          t.classList.add('text-on-surface-variant', 'font-medium');
        });
        tab.classList.remove('text-on-surface-variant', 'font-medium');
        tab.classList.add('text-primary', 'font-bold');

        // Move indicator
        const width = tab.offsetWidth;
        const left = tab.offsetLeft;
        indicator.style.width = `${width}px`;
        indicator.style.left = `${left}px`;
      });
    });

    // Simulate ripple or scale effect on primary button
    const mainBtn = document.getElementById('run_report_button');
    mainBtn.addEventListener('click', () => {
      mainBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Running...';
      setTimeout(() => {
        mainBtn.innerHTML = '<span class="material-symbols-outlined" data-icon="add">add</span> Run First Report';
      }, 2000);
    });
  </script>
