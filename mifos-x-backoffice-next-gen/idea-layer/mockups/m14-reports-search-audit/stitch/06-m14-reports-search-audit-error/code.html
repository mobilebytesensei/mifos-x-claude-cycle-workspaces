<body class="bg-surface text-on-surface min-h-screen flex flex-col">

</button>
<h1 class="font-headline text-h3 font-bold text-primary">Reports &amp; Audit</h1>
</div>
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-outline hover:bg-surface-variant transition-colors cursor-pointer active:opacity-80">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial back-office administrator, captured in soft studio lighting with a clean, neutral background. The subject is wearing business attire, and the overall aesthetic is minimalist, modern, and trustworthy, matching the Material 3 light-mode design system of the Mifos-X platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAD9u6VnaAi477Ikfky4uoH01sn-HtBHFg2ZDOEc7Quiive6sQz1UroxPdJIzKNuy5vno5fBizBwdD-e-8GNuaUjYi7Lcceg_nprEo989xiN4FK55NsFuHbaQx9UhOml8RJHw36XyMYPd1q8vBTl3MIfKl9DcS1bv0jjJd7xMDPPJzphexQpNu3aHerYE8nTxO1Y2iH3-wlnwJWEebvMqZp5L-GWoDZZCzGyEORQDo9TK7i04F0YmFG4QQ49w-yIsC-7DUcYpgnd0c5"/>

<!-- Main Content Area -->
<main class="flex-grow pt-16 pb-20 flex flex-col">
<!-- Tab Strip (#tab_strip) -->
<nav class="px-md py-sm bg-surface sticky top-16 z-40" id="tab_strip">
<div class="flex gap-sm overflow-x-auto no-scrollbar py-2">
<!-- Reports Tab (Active) -->
<button class="bg-primary-container text-on-primary-container font-bold rounded-full px-lg py-sm flex items-center gap-xs transition-all active:scale-95 whitespace-nowrap">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">assessment</span>
<span class="font-label text-label">Reports</span>
</button>
<!-- Global Search Tab -->
<button class="text-on-surface-variant hover:bg-surface-variant rounded-full px-lg py-sm flex items-center gap-xs transition-all active:scale-95 whitespace-nowrap">
<span class="material-symbols-outlined">search</span>

</button>
<!-- Audit Trail Tab -->
<button class="text-on-surface-variant hover:bg-surface-variant rounded-full px-lg py-sm flex items-center gap-xs transition-all active:scale-95 whitespace-nowrap">
<span class="material-symbols-outlined">history</span>

</button>
</div>

<!-- Content Area (#content_area) -->
<section class="flex-grow flex flex-col items-center justify-center p-xl text-center" id="content_area">

<div class="max-w-md flex flex-col items-center animate-in fade-in duration-700">

</div>
<h2 class="text-h2 font-bold text-on-surface mb-sm">Unable to load reports</h2>
<p class="text-body text-on-surface-variant mb-xl leading-relaxed">
                    Something went wrong while fetching the data. Please check your connection and try again.
                </p>
<button class="bg-primary text-on-primary rounded-xl px-xl py-md font-label text-label flex items-center gap-sm hover:opacity-90 active:scale-95 transition-all shadow-sm" id="retry_button">
<span class="material-symbols-outlined">refresh</span>
                    Retry
                </button>
</div>
</section>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-sm bg-surface border-t border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-all active:scale-95 px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-label font-medium">Home</span>
</a>
<!-- Clients -->

<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-label font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant transition-all active:scale-95 px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-label font-medium">Collections</span>
</a>
<!-- Sync -->

<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-label font-medium">Sync</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const originalHtml = btn.innerHTML;
            
            // Show loading state
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Retrying...';
            btn.classList.add('opacity-80');

            // Simulate network request
            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
                btn.classList.remove('opacity-80');
                
                // For demonstration, we just shake the card to indicate it failed again
                const content = document.getElementById('content_area');
                content.classList.add('animate-bounce');
                setTimeout(() => content.classList.remove('animate-bounce'), 500);
            }, 1500);
        });
    </script>
