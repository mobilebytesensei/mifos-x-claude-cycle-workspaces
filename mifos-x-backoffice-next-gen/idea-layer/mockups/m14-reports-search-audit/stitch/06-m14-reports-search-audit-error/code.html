                    "outline": "#6e7979",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #f7fafa;
            color: #181c1d;
            font-family: 'Roboto Flex', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .error-state-container {
            min-height: calc(100vh - 64px - 80px - 48px); /* Height minus header, footer, tabs */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface overflow-x-hidden">
<!-- 1. TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline-variant flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="account_balance">account_balance</span>
<h1 class="font-title-lg text-title-lg font-bold text-primary">Reports &amp; Audit</h1>
</div>
<button class="active:opacity-80 transition-opacity p-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span>
</button>
</header>
<!-- Main Content Area with Scrollable Column -->
<main class="pt-16 pb-20 flex flex-col items-start w-full min-h-screen">
<!-- 2. Tab Strip (Chips) -->
<div class="w-full flex items-center px-margin-mobile py-unit gap-2 overflow-x-auto border-b border-outline-variant bg-surface sticky top-16 z-40">
<!-- Active Tab: Reports -->
<button class="flex items-center px-4 py-2 rounded-full bg-primary text-on-primary font-label-lg text-label-lg transition-colors active:scale-95 duration-150">
                Reports
            </button>
<!-- Inactive Tab: Audit Logs -->
<button class="flex items-center px-4 py-2 rounded-full bg-surface-container-high text-on-surface-variant font-label-lg text-label-lg transition-colors active:scale-95 duration-150 hover:bg-surface-container-highest">
                Audit Logs
            </button>
</div>
<!-- 3. Content Area (Error State) -->
<div class="error-state-container w-full flex flex-col items-center justify-center px-margin-mobile text-center py-12">
<!-- Error Illustration Placeholder -->
<div class="relative w-48 h-48 mb-8 flex items-center justify-center">
<div class="absolute inset-0 bg-error-container rounded-full opacity-20 scale-110"></div>
<div class="z-10 flex flex-col items-center">
<div class="w-24 h-24 rounded-full bg-surface-container-highest flex items-center justify-center mb-2 shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-error text-[48px]" data-icon="cloud_off" style="font-size: 48px;">cloud_off</span>
</div>
<div class="flex gap-1">
<div class="w-2 h-2 rounded-full bg-error animate-pulse"></div>
<div class="w-2 h-2 rounded-full bg-error animate-pulse delay-75"></div>
<div class="w-2 h-2 rounded-full bg-error animate-pulse delay-150"></div>
</div>
</div>
</div>
<!-- Headline -->
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-2 px-4">
                Unable to load reports
            </h2>
<!-- Supporting Text -->
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[320px] mb-8">
                We encountered a problem while retrieving your data. Please check your connection and try again.
            </p>
<!-- Primary Action: Retry Load -->
<button class="flex items-center gap-2 px-6 h-12 bg-primary text-on-primary rounded-full font-label-lg text-label-lg hover:shadow-md transition-all active:scale-95 duration-150" id="retryButton">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                Retry Load
            </button>
</div>
<!-- Spacer for footer -->
<div class="h-8"></div>
</main>
<!-- 4. Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-center bg-surface-container-low border-t border-outline-variant pb-safe z-50">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-md text-label-md">Clients</span>
</a>
<!-- Collections -->
<!-- Note: This is considered the top-level "Reports" or similar view in the ecosystem based on the tab context provided -->
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label-md text-label-md">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</a>
</nav>
<script>
        // Simple Micro-interaction for the Retry Button
        const retryBtn = document.getElementById('retryButton');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            retryBtn.classList.add('opacity-80');
            retryBtn.innerText = 'Retrying...';
            
            // Re-insert icon after text change
            const span = document.createElement('span');
            span.className = 'material-symbols-outlined animate-spin';
            span.innerText = 'refresh';
            retryBtn.prepend(span);

            setTimeout(() => {
                icon.classList.remove('animate-spin');
                retryBtn.classList.remove('opacity-80');
                // Simulate failure again or redirect
                location.reload(); 
            }, 1500);
        });
    </script>
</body></html>
