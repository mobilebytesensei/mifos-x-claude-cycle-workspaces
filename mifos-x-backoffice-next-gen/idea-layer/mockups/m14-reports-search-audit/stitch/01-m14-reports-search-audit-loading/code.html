        document.querySelectorAll('.cursor-pointer').forEach(el => {

                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 100);
            });

        const activeIndex = 3; // Mapping configuration to Sync context

        navButtons.forEach((btn, idx) => {
