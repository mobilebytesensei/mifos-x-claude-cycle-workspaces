<script>
    function switchTab(tabName) {
      const tabs = document.querySelectorAll('.tab-chip');
      tabs.forEach(tab => {
        if (tab.dataset.tab === tabName) {
          tab.classList.remove('bg-surface-variant', 'text-on-surface-variant');
          tab.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
        } else {
          tab.classList.add('bg-surface-variant', 'text-on-surface-variant');
          tab.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
        }
      });

      // Simple filter logic for visual feedback
      const sections = ['section_reports', 'section_search', 'section_audit'];
      sections.forEach(s => {
        const el = document.getElementById(s);
        if (s.includes(tabName)) {
          el.style.display = 'flex';
          el.style.opacity = '0';
          setTimeout(() => {
            el.style.transition = 'opacity 0.3s ease';
            el.style.opacity = '1';
          }, 10);
        } else {
          el.style.display = 'none';
        }
      });
      
      // If we switch to reports, we show the full flow
      if (tabName === 'reports') {
        sections.forEach(s => document.getElementById(s).style.display = 'flex');
      }
    }

    // Interactive button feedback
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        // Mock feedback
        console.log('Action performed:', btn.id || btn.innerText);
      });
    });
  </script>
