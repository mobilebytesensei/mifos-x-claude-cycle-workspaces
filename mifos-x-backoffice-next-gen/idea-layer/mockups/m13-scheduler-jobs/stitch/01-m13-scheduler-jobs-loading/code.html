<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Enterprise Ledger - Loading Scheduler</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #ebeeee 25%, #f7fafa 50%, #ebeeee 75%);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite linear;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      font-family: 'Roboto Flex', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .main-canvas {
      height: calc(100vh - 64px - 80px);
    }
    @media (min-width: 768px) {
      .main-canvas {
        height: calc(100vh - 64px);
        margin-left: 288px;
      }
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background overflow-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-desktop w-full h-16 fixed top-0 z-50 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="account_balance">account_balance</span>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Enterprise Ledger</h1>
</div>
<div class="w-10 h-10 rounded-full skeleton bg-surface-container-highest"></div>
</header>
<!-- NavigationDrawer (Desktop) -->
<aside class="fixed left-0 top-16 h-[calc(100vh-64px)] w-72 z-40 hidden md:flex flex-col p-4 bg-surface-container border-r border-outline-variant">
<div class="mb-6 px-4">
<p class="font-title-lg text-title-lg text-primary">Ledger Menu</p>
</div>
<nav class="space-y-1">
<div class="flex items-center gap-3 px-4 py-3 rounded-full bg-secondary-container text-on-secondary-container opacity-50">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-lg text-label-lg font-bold">Home</span>
</div>
<div class="flex items-center gap-3 px-4 py-3 rounded-full text-on-surface-variant opacity-50">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-lg text-label-lg">Clients</span>
</div>
<div class="flex items-center gap-3 px-4 py-3 rounded-full text-on-surface-variant opacity-50">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-lg text-label-lg">Collections</span>
</div>
<div class="flex items-center gap-3 px-4 py-3 rounded-full text-on-surface-variant opacity-50">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-lg text-label-lg">Sync</span>
</div>
</nav>
</aside>
<!-- Main Content -->
<main class="main-canvas mt-16 overflow-y-auto px-margin-mobile md:px-margin-desktop py-6">
<div class="max-w-screen-xl mx-auto flex flex-col gap-6 items-start">
<!-- 1. header (#scheduler_header) -->
<div class="w-full flex flex-col gap-2" id="scheduler_header">
<div class="h-10 w-64 skeleton rounded-lg"></div>
<div class="h-5 w-40 skeleton rounded"></div>
</div>
<!-- 2. banner (#offline_banner) -->
<div class="w-full p-4 rounded-xl skeleton bg-surface-container-low flex items-center gap-4 border border-outline-variant/30" id="offline_banner">
<div class="w-10 h-10 rounded-full bg-surface-variant"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-3/4 skeleton rounded"></div>
<div class="h-3 w-1/2 skeleton rounded"></div>
</div>
</div>
<!-- 3. switch (#scheduler_master_switch) -->
<div class="w-full flex items-center justify-between p-4 bg-surface rounded-xl border border-outline-variant" id="scheduler_master_switch">
<div class="flex flex-col gap-1">
<div class="h-5 w-32 skeleton rounded"></div>
<div class="h-4 w-48 skeleton rounded"></div>
</div>
<div class="w-12 h-6 rounded-full skeleton bg-surface-container-high"></div>
</div>
<!-- 4. content_area (#business_date_header) -->
<div class="w-full flex items-baseline gap-3 pt-4 border-b border-outline-variant pb-2" id="business_date_header">
<div class="h-8 w-40 skeleton rounded"></div>
<div class="h-4 w-24 skeleton rounded opacity-60"></div>
</div>
<!-- 5. content_area (#scheduler_content) -->
<div class="w-full grid grid-cols-1 md:grid-cols-3 gap-4" id="scheduler_content">
<div class="h-24 bg-surface rounded-xl border border-outline-variant p-4 flex flex-col gap-3">
<div class="h-4 w-1/2 skeleton rounded"></div>
<div class="h-8 w-3/4 skeleton rounded"></div>
</div>
<div class="h-24 bg-surface rounded-xl border border-outline-variant p-4 flex flex-col gap-3">
<div class="h-4 w-1/2 skeleton rounded"></div>
<div class="h-8 w-3/4 skeleton rounded"></div>
</div>
<div class="h-24 bg-surface rounded-xl border border-outline-variant p-4 flex flex-col gap-3">
<div class="h-4 w-1/2 skeleton rounded"></div>
<div class="h-8 w-3/4 skeleton rounded"></div>
</div>
</div>
<!-- 6. list_item (#job_row) -->
<div class="w-full flex flex-col gap-3" id="job_row">
<div class="flex items-center gap-4 p-4 bg-surface-container-lowest border border-outline-variant rounded-xl">
<div class="w-12 h-12 rounded-lg skeleton"></div>
<div class="flex-1 flex flex-col gap-2">
<div class="h-5 w-1/3 skeleton rounded"></div>
<div class="h-4 w-1/4 skeleton rounded opacity-70"></div>
</div>
<!-- 7. chip (#job_status_chip) -->
<div class="h-8 w-24 rounded-full skeleton" id="job_status_chip"></div>
</div>
<div class="flex items-center gap-4 p-4 bg-surface-container-lowest border border-outline-variant rounded-xl">
<div class="w-12 h-12 rounded-lg skeleton"></div>
<div class="flex-1 flex flex-col gap-2">
<div class="h-5 w-2/5 skeleton rounded"></div>
<div class="h-4 w-1/5 skeleton rounded opacity-70"></div>
</div>
<div class="h-8 w-24 rounded-full skeleton"></div>
</div>
</div>
<!-- Button Grid Actions (8-13) -->
<div class="w-full grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 mt-4">
<!-- 8. button (#run_job_button) -->
<div class="h-10 w-full rounded-full skeleton" id="run_job_button"></div>
<!-- 9. button (#toggle_job_active_button) -->
<div class="h-10 w-full rounded-full skeleton" id="toggle_job_active_button"></div>
<!-- 10. button (#edit_schedule_button) -->
<div class="h-10 w-full rounded-full skeleton" id="edit_schedule_button"></div>
<!-- 11. button (#advance_business_date_button) -->
<div class="h-10 w-full rounded-full skeleton" id="advance_business_date_button"></div>
<!-- 12. button (#view_run_history_button) -->
<div class="h-10 w-full rounded-full skeleton" id="view_run_history_button"></div>
<!-- 13. button (#retry_button) -->
<div class="h-10 w-full rounded-full skeleton" id="retry_button"></div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 md:hidden bg-surface-container px-4 border-t border-outline-variant">
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 opacity-50">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 opacity-50">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-md text-label-md">Clients</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 opacity-50">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md">Collections</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 opacity-50">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</div>
</nav>
<script>
    // Micro-interaction for skeleton animation smoothness
    document.addEventListener('DOMContentLoaded', () => {
      const skeletons = document.querySelectorAll('.skeleton');
      skeletons.forEach((s, index) => {
        // Slight stagger for a more organic feel
        s.style.animationDelay = `${index * 0.05}s`;
      });
    });
  </script>
</body></html>
