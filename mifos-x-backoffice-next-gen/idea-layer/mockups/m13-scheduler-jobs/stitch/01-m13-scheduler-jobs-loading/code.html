<script>
        // Optional: Simple script to mimic subtle shimmer randomization or interaction prevention
        document.addEventListener('DOMContentLoaded', () => {
            const shimmers = document.querySelectorAll('.shimmer');
            shimmers.forEach((s, index) => {
                // Stagger the animation start slightly for a more organic feel
                s.style.animationDelay = `${index * 0.1}s`;
            });

            // Prevent all clicks in main content during loading state
            const main = document.querySelector('main');
            main.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, true);
        });
    </script>
