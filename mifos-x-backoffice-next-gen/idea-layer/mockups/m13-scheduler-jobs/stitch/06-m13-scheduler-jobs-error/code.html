<script>
        // Simple micro-interaction for the retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            
            // Show loading state
            btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>
                Attempting...
            `;
            btn.disabled = true;
            btn.classList.add('opacity-80');

            // Simulate a network check
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80');
                // In a real app, this would trigger a re-fetch of the data
            }, 2000);
        });
    </script>
