<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@400;500;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "tertiary": "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "background": "#FCFCFF",
              "on-background": "#1A1C1E",
              "outline": "#72777F",
              "success": "#2E7D32",
              "warning": "#F57C00",
              "warning-strong": "#B45309",
              "error": "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002",
            },
            borderRadius: {
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
            },
            spacing: {
              "xs": "4px",
              "sm": "8px",
              "md": "16px",
              "lg": "24px",
              "xl": "32px",
              "xxl": "48px",
            },
            fontFamily: {
              "headline": ["Roboto", "Inter", "sans-serif"],
              "body": ["Roboto", "Inter", "sans-serif"],
              "label": ["Public Sans", "Roboto", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"],
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Roboto', sans-serif;
        background-color: #FCFCFF;
      }
      .font-headline { font-family: 'Roboto', sans-serif; }
      .font-label { font-family: 'Public Sans', sans-serif; }
      .text-h3 { font-size: 1.375rem; line-height: 1.35; font-weight: 600; }
      .text-label { font-size: 0.875rem; line-height: 1.4; font-weight: 500; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface text-primary border-b border-outline flex items-center justify-between px-md h-14" id="scheduler_header">
<div class="flex items-center gap-md">
<button class="p-2 hover:bg-surface-variant/50 transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-h3 font-bold text-on-surface">Scheduler Management</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial administrator, close-up, neutral background, soft studio lighting. The administrator has a calm, trustworthy expression, wearing business casual attire. The visual style is crisp and high-definition, integrated seamlessly into a modern light-mode financial application interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCdBlWwfw9lu7aw5z8oPevskT6lrbziTGtgYq2cWT4wvie8XSoeUVDIrRS2RPGw4LlWyPiDwGwM4NmkoN5XfdHGBzODjxpmclndBQM5w6UwqsQaB16bEYuptTBJwOrqMsD0VhrcolhSAdwyt5EPgr3yyIz7Enxq4ZR5hDrHg_BHtETguZZE2mf8v-uYpWTYxN-0z9cbA0XvtIRSkl3GNXK9z99oGyrxtIIYRPTwd3pkLaBtu0LJyS_yhsw9MfGNbaiVu_P6Q9sU7Uld"/>
</div>
</div>
</header>
<main class="pt-14 pb-20 flex flex-col min-h-screen">
<!-- Offline Banner -->
<section class="bg-warning-strong text-on-primary px-md py-md flex items-start gap-md animate-fade-in" id="offline_banner">
<span class="material-symbols-outlined shrink-0" data-icon="cloud_off">cloud_off</span>
<p class="font-body text-label">Unable to reach the network. Please check your internet connection or sync settings and try again.</p>
</section>
<!-- Content Area -->
<div class="flex-grow flex flex-col items-center justify-center px-lg py-xl text-center">
<!-- Error Illustration -->
<div class="w-full max-w-xs mb-lg">
<img alt="Connection Error Illustration" class="w-full h-auto" src="https://lh3.googleusercontent.com/aida/AP1WRLt6SDcdQPkPquKQ_uoMZEUhBCfS8M3YW7EvOx88zDG9e5qvlUR8ia473oJWiSouXsYXEBTicOktFoltEvPKnd2-37c5UIqndOaGZT73CBFXU5aVlWaBxbn1jgndbeGe56-HwqPvxNaeUApKOs-h05XLAFUPwSfoC5lw2kOykzHWNR6nugQjxpWBqIfMOpodptqqqflHkt4xS5Z6NTMrbqbTOh4aqMhKsC_xP7mSYqCAdWK5-xq-BiPvkJE"/>
</div>
<!-- Error Message -->
<div class="mb-xl">
<h2 class="font-headline text-h2 font-bold text-on-surface mb-sm">Connection Error</h2>
<p class="font-body text-on-surface-variant max-w-md mx-auto leading-relaxed">
                    We couldn't load the scheduler data. You can still access cached info in the Sync tab.
                </p>
</div>
<!-- Retry Button -->
<button class="bg-primary text-on-primary flex items-center gap-sm px-xl py-md rounded-xl active:scale-95 transition-all shadow-sm hover:shadow-md" id="retry_button">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
<span class="font-label text-label uppercase tracking-wide">Retry</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center px-sm py-xs pb-safe shadow-lg">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant/30 transition-colors rounded-md" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[10px] mt-1">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant/30 transition-colors rounded-md" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label text-[10px] mt-1">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant/30 transition-colors rounded-md" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-[10px] mt-1">Collections</span>
</a>
<!-- Sync (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 transition-all" href="#">
<span class="material-symbols-outlined" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label text-[10px] mt-1">Sync</span>
</a>
</nav>
<script>
        // Micro-interaction for retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            
            // Simulation of retry
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                // Normally here we would trigger a refresh logic
            }, 1500);
        });
    </script>
<style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in 0.4s ease-out forwards;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</body></html>
