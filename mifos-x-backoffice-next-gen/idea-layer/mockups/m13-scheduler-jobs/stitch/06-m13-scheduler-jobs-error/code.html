<!-- Error State Content -->
<div class="error-illustration-container mb-lg">

            Unable to load scheduler data. Please check your connection and try again.
        </p>
<button class="bg-primary text-on-primary rounded-xl px-xl py-3 font-label font-medium flex items-center gap-sm hover:opacity-90 active:scale-95 transition-all shadow-md" id="retry_button">
<span class="material-symbols-outlined">refresh</span>

        </button>

<!-- BottomNavBar -->

</a>

</a>

<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform active:scale-95" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label text-[11px] font-medium mt-1">Sync</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Retrying...`;
            btn.disabled = true;
            btn.classList.add('opacity-70');
            
            // Simulate network check
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                // Potential snackbar or UI update logic here
            }, 2000);
        });
    </script>
