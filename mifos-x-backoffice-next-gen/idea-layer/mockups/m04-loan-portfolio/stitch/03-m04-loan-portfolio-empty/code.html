<body class="font-body-lg text-body-lg overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full bg-surface border-b border-outline-variant transition-colors duration-200">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer transition-colors duration-200 hover:bg-surface-container-high p-2 rounded-full">menu</span>
<h1 class="font-title-lg text-title-lg text-primary font-bold">Loans</h1>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary cursor-pointer transition-colors duration-200 hover:bg-surface-container-high p-2 rounded-full">search</span>
</div>
</header>
<!-- Main Content Container -->
<main class="flex flex-col min-h-[calc(100vh-144px)] pb-32">
<!-- Search Field Section -->
<div class="px-margin-mobile pt-6 pb-4">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="w-full bg-surface-container-low border-none border-b-2 border-outline focus:border-primary focus:ring-0 rounded-t-lg pl-12 pr-4 h-14 font-body-lg transition-all" placeholder="Search loans by ID or account..." type="text"/>
</div>
</div>
<!-- Content Label -->
<div class="px-margin-mobile py-2">
<h2 class="font-label-lg text-label-lg text-on-surface-variant tracking-wider">LOAN LIST</h2>
</div>
<!-- Empty State Container -->
<div class="flex-grow flex flex-col items-center justify-center px-8 text-center mt-8">
<!-- Illustration Area -->
<div class="w-64 h-64 mb-8 relative flex items-center justify-center">
<div class="absolute inset-0 bg-secondary-container opacity-20 rounded-full scale-110 animate-pulse"></div>
<div class="bg-surface-container-highest rounded-3xl p-8 shadow-sm">
<img class="w-32 h-32 object-contain grayscale opacity-60" data-alt="A sophisticated minimalist vector illustration of an empty financial ledger or vault. The scene features clean lines, teal and white color tones, and a professional enterprise aesthetic. Soft volumetric lighting highlights the absence of data entries, creating a calm and modern empty state atmosphere for a banking application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuACCx2KbI9dZX8Lp5nCBT493rYuxsoLVvJWTCO3hnUlB3rpU0qESeXiv46vxLMpSgfdIh920liDplqGidVkGGhGzM8bQaOFTUajO3GBKn2C9Ox630o2wdjKaYrzUd5kECBE3PjQ6tnQOXZE3SumchFYdjM06YDh894JUW6uI5EBnZVmUA1LuoKYMkxAdeFLZDwet6Kayo8w5Rk3cD6LnX15NOKii62BhE_jtO1BX1O3wBhz7wcHtWPR6xGAf9Y8W7opQ1yKfntHbhA"/>
</div>
</div>
<!-- Message -->
<p class="text-on-surface-variant font-body-lg max-w-xs leading-relaxed mb-8">
                No loans found. Start by creating a new loan application to manage your portfolio.
            </p>
<!-- Primary CTA Button -->
<button class="flex items-center gap-2 bg-primary text-on-primary px-8 h-12 rounded-full font-label-lg shadow-sm hover:bg-primary-container active:scale-95 transition-all" id="empty_new_loan_cta">
<span class="material-symbols-outlined">add</span>
                New Loan
            </button>
</div>
</main>
<!-- Floating Action Button -->
<button class="fixed right-6 bottom-24 z-50 flex items-center gap-3 bg-tertiary-container text-on-tertiary-container px-4 h-14 rounded-2xl shadow-lg hover:shadow-xl active:scale-90 transition-all" id="new_loan_fab">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add</span>
<span class="font-label-lg">New Loan</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-2 bg-surface-container-low shadow-sm z-50">

<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<!-- Clients -->

<span class="material-symbols-outlined mb-1">group</span>
<span class="font-label-md text-label-md">Clients</span>
</div>
<!-- Collections (Assume active since we are in Loans/Collections context) -->

</div>

<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest transition-colors rounded-xl cursor-pointer">
<span class="material-symbols-outlined mb-1">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</div>
</nav>
<script>
        // Micro-interaction for the FAB
        const fab = document.getElementById('new_loan_fab');
        let lastScrollY = window.scrollY;

        window.addEventListener('scroll', () => {
            if (window.scrollY > lastScrollY && window.scrollY > 100) {
                // Scrolling down - collapse or hide fab slightly
                fab.classList.add('opacity-80', 'scale-90');
            } else {
                // Scrolling up - restore fab
                fab.classList.remove('opacity-80', 'scale-90');
            }
            lastScrollY = window.scrollY;
        });

        // Simple feedback for tappable elements
        document.querySelectorAll('button, [class*="cursor-pointer"]').forEach(el => {
            el.addEventListener('click', function(e) {
                const ripple = document.createElement('div');
                ripple.className = 'absolute inset-0 bg-current opacity-10 rounded-inherit pointer-events-none';
                this.classList.add('relative');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 400);
            });
        });
    </script>
