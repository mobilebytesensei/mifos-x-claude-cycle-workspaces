<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos-X Back Office - Loans</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@400;500;600&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px"
                    },
                    fontFamily: {
                        "headline": ["Roboto", "Inter", "sans-serif"],
                        "display": ["Roboto", "Inter", "sans-serif"],
                        "body": ["Roboto", "Inter", "sans-serif"],
                        "label": ["Public Sans", "Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    }
                }
            }
        };
    </script>
<style>
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom smooth transition for button interaction */
        .btn-active-scale:active {
            transform: scale(0.95);
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 bg-surface flex justify-between items-center w-full px-md h-14 border-b border-outline/20">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">menu</span>
</button>
<h1 class="text-h2 font-headline font-bold text-on-surface text-xl">Loans</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">search</span>
</button>
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-medium text-sm border border-outline/10 overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial loan officer in a minimalist studio setting, high-key lighting, soft shadows, wearing business casual attire, clean and clinical Mifos-X application user profile style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKnC5apbScf1DKELACvqcyn4YkjpiV5UYY5goNV9b-FbzW4AkGLu4FAU71qI2MPiz5OyG_PaHuPtzQZuQgUPs2fBz0uThkAyQwpq8spW7-AJ5sghXG350I3bH-iQC4V1_KQgBeRCRrcm2temEFO29eYdZPWFL3_52igCQ7wQS17ysHOqJR6hwtQJroG2SADqjmZHA0ntVDA4t0sU0W5ydEsBTqsi4zOrzTHoizh2Qurp1GIEXJdr9hQ86idojK6Tba2t8G1DsmbzHO"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow overflow-y-auto px-md py-lg flex flex-col gap-lg">
<!-- Search Field Section -->
<section class="w-full">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-surface-variant border-none rounded-md text-on-surface placeholder-on-surface-variant focus:ring-2 focus:ring-primary focus:bg-surface transition-all" placeholder="Search by ID or Client..." type="text"/>
</div>
</section>
<!-- Empty State Content -->
<section class="flex-grow flex flex-col items-center justify-center text-center px-lg py-xxl gap-xl">
<!-- Illustration Container -->
<div class="relative w-48 h-48 mb-4 animate-pulse-slow">
<img alt="No loans found" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLsDWuu5OJZry_wCcBABNAvbKiYoLMOHhxgT0o7VQMw59nws68jhqac0OI8leLpsEXbi3masNvFwSIBu2TAl0x7BewuqXeRq1bHxySyjNgMEuwMF2v1In7L3DvwkRyW023KZ6eGqgTAQm0UNs4ITA1ooe9cnvR4hWm5s1GygCxwOKhrPXvItIGmAmZmLBvs3SKzX9HYL_E7TuqHXuAtlnzUV7xwqGxoWAHZtDcMhhE1D_I7IO4lIOxCUFS0"/>
</div>
<!-- Text Content -->
<div class="max-w-md flex flex-col gap-md">
<h2 class="text-2xl font-bold font-headline text-on-surface">No loans found</h2>
<p class="text-body text-on-surface-variant leading-relaxed">
                    It looks like there are no loan accounts associated with this client yet. Start by creating a new application to help them achieve their financial goals.
                </p>
</div>
<!-- Actions Cluster -->
<div class="flex flex-col w-full max-w-xs gap-md mt-4">
<button class="btn-active-scale bg-primary text-on-primary font-medium py-3 px-lg rounded-xl flex items-center justify-center gap-2 shadow-sm hover:shadow-md transition-all active:opacity-80">
<span class="material-symbols-outlined">add</span>
<span class="text-label uppercase tracking-wide">+ New Loan</span>
</button>
<button class="btn-active-scale border border-outline text-primary font-medium py-3 px-lg rounded-xl flex items-center justify-center gap-2 hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined">refresh</span>
<span class="text-label">Retry</span>
</button>
</div>
</section>
</main>
<!-- Floating Action Button -->
<button class="fixed right-6 bottom-24 w-14 h-14 bg-secondary text-on-secondary rounded-lg shadow-lg flex items-center justify-center btn-active-scale z-40">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 0, 'wght' 500;">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-surface border-t border-outline/20">
<!-- Home Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 flex-1 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">home</span>
<span class="text-[10px] font-label mt-1">Home</span>
</a>
<!-- Clients Tab (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 flex-1" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="text-[10px] font-label mt-1 font-bold">Clients</span>
</a>
<!-- Collections Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 flex-1 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">account_balance_wallet</span>
<span class="text-[10px] font-label mt-1">Collections</span>
</a>
<!-- Sync Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 flex-1 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">sync</span>
<span class="text-[10px] font-label mt-1">Sync</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ripple-like effect for the primary button
            const primaryBtn = document.querySelector('.bg-primary');
            primaryBtn.addEventListener('mousedown', function(e) {
                this.classList.add('opacity-90');
            });
            primaryBtn.addEventListener('mouseup', function(e) {
                this.classList.remove('opacity-90');
            });

            // Handle navigation active state toggling for demo purposes
            const navItems = document.querySelectorAll('nav a');
            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    navItems.forEach(nav => {
                        nav.className = "flex flex-col items-center justify-center text-on-surface-variant py-1 flex-1 group";
                        const icon = nav.querySelector('.material-symbols-outlined');
                        if(icon) icon.style.fontVariationSettings = "'FILL' 0";
                    });
                    item.className = "flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 flex-1";
                    const activeIcon = item.querySelector('.material-symbols-outlined');
                    if(activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
                });
            });
        });
    </script>
</body></html>
