<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Loans Management - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              secondary: "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              tertiary: "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              surface: "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              background: "#FCFCFF",
              "on-background": "#1A1C1E",
              outline: "#72777F",
              success: "#2E7D32",
              warning: "#F57C00",
              "warning-strong": "#B45309",
              error: "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002",
            },
            borderRadius: {
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            spacing: {
              'xs': '4px',
              'sm': '8px',
              'md': '16px',
              'lg': '24px',
              'xl': '32px',
              'xxl': '48px',
            },
            fontFamily: {
              headline: ["Inter", "sans-serif"],
              display: ["Inter", "sans-serif"],
              body: ["Roboto", "sans-serif"],
              label: ["Public Sans", "sans-serif"],
              mono: ["Roboto Mono", "monospace"]
            },
            fontSize: {
              'h1': ['2rem', { lineHeight: '1.25', fontWeight: '700' }],
              'h2': ['1.75rem', { lineHeight: '1.3', fontWeight: '600' }],
              'h3': ['1.375rem', { lineHeight: '1.35', fontWeight: '600' }],
              'body-large': ['1rem', { lineHeight: '1.5', fontWeight: '400' }],
              'label': ['0.875rem', { lineHeight: '1.4', fontWeight: '500' }],
              'caption': ['0.75rem', { lineHeight: '1.4', fontWeight: '400' }],
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      body {
        background-color: #FCFCFF;
        color: #1A1C1E;
        font-family: 'Roboto', sans-serif;
      }
      .custom-scroll-hide::-webkit-scrollbar {
        display: none;
      }
      .custom-scroll-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface text-primary border-b border-outline fixed top-0 w-full h-14 z-50 flex justify-between items-center px-md">
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant p-2 rounded-full transition-colors duration-200">
                menu
            </button>
<h1 class="font-display font-bold text-h3">Loans</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-outline">
<span class="material-symbols-outlined text-on-primary-container text-[20px]">person</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-14 mb-20 overflow-y-auto custom-scroll-hide p-md max-w-5xl mx-auto w-full">
<div class="flex flex-col gap-xl">
<!-- Search Section -->
<div class="w-full">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">search</span>
<input class="w-full bg-surface-variant text-on-surface rounded-sm py-md pl-12 pr-md border-none focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-on-surface-variant/60" placeholder="Search loans by account or client..." type="text"/>
</div>
</div>
<!-- Error State Content Area (Archetype: master_detail / scrollable_column) -->
<div class="flex flex-col items-start text-start py-xxl animate-in fade-in duration-700">
<!-- Illustration -->
<div class="w-full max-w-sm mb-lg">
<img alt="Professional minimalist error illustration" class="w-full h-auto object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida/AP1WRLt9uG1R4C05_n-1V55wLjNzHKz9YZdI1E94QUOZ8Yr_ohWlIo4yFHZ16UnXg3-77n30MMyfcdLtrsUH8KZ60E0TCxny9EKAIEXRLrarmIgfQaB9Lc0TurErIiaQBJjOxMkXodY7XPxjdUM8ZtG92Wh3AM5E3jtg7-I1HjHhp-1UHWo4AF5gpz4CeVhgAc9c88cSNXclobUO-AmqRgBMR63xLGCbrq0VR9mpa8HnbTpe9DME3rY-7vCrGLzu"/>
</div>
<!-- Error Messaging -->
<div class="space-y-sm max-w-lg">
<h2 class="text-h2 text-on-surface font-headline leading-tight">Unable to load loans</h2>
<p class="text-body-large text-on-surface-variant">
                        We encountered a problem while retrieving the loan portfolio data. This may be due to a temporary connection issue with the core banking service.
                    </p>
</div>
<!-- Action -->
<div class="mt-xl">
<button class="bg-primary text-on-primary font-label px-xl py-md rounded-xl hover:opacity-90 active:scale-95 transition-all duration-200 flex items-center gap-sm shadow-sm" onclick="location.reload()">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                        Retry
                    </button>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-sm bg-surface border-t border-outline">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all duration-150 rounded-lg p-2" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-caption mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all duration-150 rounded-lg p-2" href="#">
<span class="material-symbols-outlined">groups</span>
<span class="font-label text-caption mt-1">Clients</span>
</a>
<!-- Active Tab: Collections -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-1 scale-95 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label text-caption font-bold mt-0.5">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-all duration-150 rounded-lg p-2" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-caption mt-1">Sync</span>
</a>
</nav>
<!-- Micro-interaction script for Retry button -->
<script>
        document.querySelector('button').addEventListener('click', function(e) {
            let btn = e.currentTarget;
            let icon = btn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            btn.style.opacity = '0.7';
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">sync</span> Retrying...';
            
            setTimeout(() => {
                // Mock reload behavior
                window.location.reload();
            }, 800);
        });
    </script>
</body></html>
