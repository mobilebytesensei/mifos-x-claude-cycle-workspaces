<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos Back Office - Loan Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
            color: #1A1C1E;
        }
        .font-h1 { font-size: 2rem; font-weight: 700; line-height: 1.25; }
        .font-h2 { font-size: 1.75rem; font-weight: 600; line-height: 1.3; }
        .font-h3 { font-size: 1.375rem; font-weight: 600; line-height: 1.35; }
        .font-body { font-size: 1rem; font-weight: 400; line-height: 1.5; }
        .font-label { font-size: 0.875rem; font-weight: 500; line-height: 1.4; }
        .font-caption { font-size: 0.75rem; font-weight: 400; line-height: 1.4; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline dark:border-outline shadow-none flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant transition-colors rounded-full active:opacity-80">
<span class="material-symbols-outlined text-primary dark:text-primary-container">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-primary">Loans</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline/20">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial bank manager in a clean, high-key office environment. The image is crisp and clinical, matching a professional Mifos back-office user interface. Subtle lighting highlights their confident expression, set against a blurred background of a modern office space with cool blue tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6EQGsS9MyiYkeyemdStjAz0hD3zdQiSgCUucriTDQ9GXXSsLA-_E-FT2UmRkwAN20Xy6UUQzNO13QdImkNSilTUBofyqHRRoP9_No137GrPAKdMF-uBNlPWte6iAP2ZIh5bHGXIWRGBwzc-uiNX2vVdeSJABsuC8gHnfz6AYyxF6Y3iUEYV_Cq9S4XF7o_Yyaao2zQPZ6jQNyRx6xT7MIuDE5U2GX4hhW6qyCi15Bvdppsk6bnj66sjWPGwY7qtobD4aZFTWdFutP"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start pt-24 pb-32 px-6 md:px-12 w-full max-w-2xl mx-auto overflow-y-auto">
<!-- Error Illustration -->
<div class="w-full aspect-square max-w-[400px] mb-8 flex items-center justify-center">
<img class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvM4d4xJT2_qAAdfk25wSy0rwLy_CjM88qddOa2Wsm09HoSoDTMIXyTItegypcaI3U1QB3rEfckwPVWn-_eshDjut43ymYqzDTEfqEQUvrntVXuynMx0DDt3iU8zA_1MM8lLO8-6QPSL_T4oFWcLls-Tepsf00ydyc7qOfo5deb88ENtDCCdjV36egyU2iJD7P7xr-bri0YpdJ5vXiBt0PCSowS2eHF8bUMgK9LLpKTJPG8HyULp4Cp3iJh"/>
</div>
<!-- Error Text Content -->
<div class="text-center space-y-4">
<h2 class="font-headline text-h2 text-on-surface">Unable to load loans</h2>
<p class="font-body text-on-surface-variant max-w-md mx-auto">
                Something went wrong while fetching the loan list. Please check your connection and try again.
            </p>
</div>
<!-- Retry Button -->
<div class="mt-10">
<button class="bg-primary text-on-primary rounded-xl px-12 py-4 font-label text-label tracking-wide shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center gap-2" id="retry_button">
<span class="material-symbols-outlined">refresh</span>
                Retry
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-surface border-t border-outline dark:border-outline shadow-none flex justify-around items-center h-20 pb-safe px-2">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full px-4 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label text-[11px] font-medium">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full px-4 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1">group</span>
<span class="font-label text-[11px] font-medium">Clients</span>
</a>
<!-- Collections (Assume active since Loans falls under financial management) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-label text-[11px] font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full px-4 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1">sync</span>
<span class="font-label text-[11px] font-medium">Sync</span>
</a>
</nav>
<script>
        // Simple ripple effect or micro-interaction for the retry button
        const retryBtn = document.getElementById('retry_button');
        retryBtn.addEventListener('click', function() {
            this.style.opacity = '0.5';
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Retrying...';
            
            // Mocking a reload behavior
            setTimeout(() => {
                this.style.opacity = '1';
                this.innerHTML = '<span class="material-symbols-outlined">refresh</span> Retry';
            }, 2000);
        });
    </script>
</body></html>
