        }

            content: "";

            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;

<script>
        // Micro-interaction for the retry button
        function handleRetry() {
            const btn = document.getElementById('retry_button');
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Temporary rotation effect
            icon.style.transition = 'transform 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
            icon.style.transform = 'rotate(360deg)';
            
            // Add a little haptic-like scale effect
            btn.style.transform = 'scale(0.98)';
            
            setTimeout(() => {
                icon.style.transition = 'none';
                icon.style.transform = 'rotate(0deg)';
                btn.style.transform = 'scale(1)';
                
                // Simulate reload logic or simple feedback
                console.log("Retrying connection...");
            }, 500);
        }

        // Logic to highlight active state if this was a top-level nav item
        // In this case, "Loans" isn't in the BottomNavBar provided, so we leave them inactive.
    </script>
