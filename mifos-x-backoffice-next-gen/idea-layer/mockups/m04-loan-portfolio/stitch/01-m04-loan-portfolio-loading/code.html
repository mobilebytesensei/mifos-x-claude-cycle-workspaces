<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Banking Operations - Loading State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006A6A",
            "on-primary": "#FFFFFF",
            "primary-container": "#6FF5F3",
            "on-primary-container": "#002020",
            "secondary": "#4A6363",
            "on-secondary": "#FFFFFF",
            "secondary-container": "#CCE8E7",
            "on-secondary-container": "#051F1F",
            "tertiary": "#4B607C",
            "on-tertiary": "#FFFFFF",
            "tertiary-container": "#D3E4FF",
            "on-tertiary-container": "#041C35",
            "error": "#BA1A1A",
            "on-error": "#FFFFFF",
            "surface": "#F4FBFA",
            "on-surface": "#161D1D",
            "surface-variant": "#DAE5E4",
            "on-surface-variant": "#3F4948",
            "outline": "#6F7978",
            "outline-variant": "#BEC9C8",
            "surface-container": "#E9F0EF",
            "surface-container-high": "#E3EAE9",
            "surface-container-highest": "#DDE4E3"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          fontFamily: {
            "headline": ["Public Sans"],
            "display": ["Public Sans"],
            "body": ["Public Sans"],
            "label": ["Public Sans"]
          }
        },
      },
    }
  </script>
<style>
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #E3EAE9 25%, #F4FBFA 50%, #E3EAE9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #F4FBFA;
      color: #161D1D;
      font-family: 'Public Sans', sans-serif;
      margin: 0;
      padding: 0;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased flex flex-col min-h-screen">
<!-- TopAppBar (#header) -->
<header class="w-full top-0 sticky z-50 flex justify-between items-center px-4 h-14 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">menu</span>
<h1 class="font-bold text-lg text-primary tracking-tight">Banking Operations</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 px-4 pt-4 pb-24 overflow-y-auto">
<!-- Loan List Header Skeleton -->
<div class="mb-4">
<div class="h-8 w-32 skeleton rounded-lg mb-4" id="header"></div>
<!-- Search Field Skeleton (#loan_search_field) -->
<div class="w-full h-12 bg-surface-container rounded-xl flex items-center px-4 gap-3 border border-outline-variant" id="loan_search_field">
<div class="w-5 h-5 rounded-full skeleton"></div>
<div class="h-4 w-32 skeleton rounded"></div>
</div>
</div>
<!-- Chips / Tabs Skeleton -->
<div class="flex gap-2 overflow-x-hidden mb-6 py-1">
<div class="h-8 w-24 skeleton rounded-full flex-shrink-0" id="view_schedule_tab"></div>
<div class="h-8 w-28 skeleton rounded-full flex-shrink-0" id="view_transactions_tab"></div>
<div class="h-8 w-20 skeleton rounded-full flex-shrink-0" id="view_charges_tab"></div>
<div class="h-8 w-28 skeleton rounded-full flex-shrink-0" id="view_guarantors_tab"></div>
<div class="h-8 w-24 skeleton rounded-full flex-shrink-0" id="view_collateral_tab"></div>
<div class="h-8 w-24 skeleton rounded-full flex-shrink-0" id="view_documents_tab"></div>
</div>
<!-- Content Area Label (#loan_list) -->
<div class="mb-4">
<div class="h-4 w-20 skeleton rounded mb-4"></div>
<!-- List Items (#loan_row) -->
<div class="space-y-3">
<!-- Row 1 -->
<div class="p-4 bg-white rounded-xl shadow-sm border border-outline-variant/50 flex flex-col gap-2">
<div class="flex justify-between items-start">
<div class="h-5 w-40 skeleton rounded"></div>
<div class="h-5 w-16 skeleton rounded-full"></div>
</div>
<div class="h-4 w-24 skeleton rounded opacity-60"></div>
<div class="mt-2 h-3 w-full skeleton rounded-full"></div>
</div>
<!-- Row 2 -->
<div class="p-4 bg-white rounded-xl shadow-sm border border-outline-variant/50 flex flex-col gap-2">
<div class="flex justify-between items-start">
<div class="h-5 w-32 skeleton rounded"></div>
<div class="h-5 w-16 skeleton rounded-full"></div>
</div>
<div class="h-4 w-28 skeleton rounded opacity-60"></div>
<div class="mt-2 h-3 w-full skeleton rounded-full"></div>
</div>
<!-- Row 3 -->
<div class="p-4 bg-white rounded-xl shadow-sm border border-outline-variant/50 flex flex-col gap-2">
<div class="flex justify-between items-start">
<div class="h-5 w-48 skeleton rounded"></div>
<div class="h-5 w-16 skeleton rounded-full"></div>
</div>
<div class="h-4 w-20 skeleton rounded opacity-60"></div>
<div class="mt-2 h-3 w-full skeleton rounded-full"></div>
</div>
<!-- Row 4 -->
<div class="p-4 bg-white rounded-xl shadow-sm border border-outline-variant/50 flex flex-col gap-2">
<div class="flex justify-between items-start">
<div class="h-5 w-36 skeleton rounded"></div>
<div class="h-5 w-16 skeleton rounded-full"></div>
</div>
<div class="h-4 w-32 skeleton rounded opacity-60"></div>
<div class="mt-2 h-3 w-full skeleton rounded-full"></div>
</div>
</div>
</div>
<!-- Action Buttons Skeleton Footer area (static block for loading) -->
<div class="mt-8 flex gap-3 pb-8">
<div class="flex-1 h-12 skeleton rounded-full"></div>
<div class="flex-1 h-12 skeleton rounded-full"></div>
</div>
</main>
<!-- FAB (#new_loan_fab) -->
<div class="fixed right-4 bottom-24 w-14 h-14 rounded-2xl skeleton shadow-lg z-40" id="new_loan_fab"></div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-4 bg-surface-container border-t border-outline-variant z-50">
<!-- Active: Dashboard/Home (Contextually determined for main app shell) -->
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="text-[11px] font-medium mt-0.5">Clients</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 opacity-40">
<span class="material-symbols-outlined">assignment</span>
<span class="text-[11px] font-medium mt-0.5">Tasks</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 opacity-40">
<span class="material-symbols-outlined">analytics</span>
<span class="text-[11px] font-medium mt-0.5">Reports</span>
</div>
</nav>
<!-- Background Texture/Atmosphere -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[-1]" style="background-image: url('https://www.transparenttextures.com/patterns/cubes.png');">
</div>
</body></html>
