<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .shimmer {
            background: linear-gradient(90deg, #DEE3EB 25%, #F3F4F9 50%, #DEE3EB 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        .dark .shimmer {
            background: linear-gradient(90deg, #42474E 25%, #72777F 50%, #42474E 75%);
            background-size: 200% 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
            color: #1A1C1E;
            margin: 0;
            padding: 0;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A"
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px"
                    },
                    fontFamily: {
                        headline: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        body: ["Roboto", "sans-serif"],
                        label: ["Public Sans", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface border-b border-outline flex justify-between items-center h-16 px-4">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">menu</span>
<h1 class="font-headline text-[1.375rem] font-bold text-on-surface">Mifos-X Back Office</h1>
</div>
<div class="w-8 h-8 rounded-full shimmer"></div>
</header>
<!-- Main Content Canvas -->
<main class="pt-16 pb-24 px-4 max-w-6xl mx-auto min-h-screen">
<!-- Search Field Shimmer -->
<div class="mt-md mb-lg">
<div class="h-14 w-full rounded-sm shimmer opacity-40"></div>
</div>
<div class="grid grid-cols-1 md:grid-cols-12 gap-lg">
<!-- Master View: Loan List Shimmer -->
<section class="md:col-span-5 space-y-md">
<div class="h-6 w-32 rounded shimmer mb-sm"></div>
<!-- Skeleton Rows -->
<div class="space-y-sm">
<!-- Row 1 -->
<div class="p-md border border-outline rounded-lg flex items-center justify-between">
<div class="space-y-xs w-full">
<div class="h-4 w-3/4 rounded shimmer"></div>
<div class="h-3 w-1/2 rounded shimmer opacity-60"></div>
</div>
<div class="h-6 w-16 rounded-sm shimmer opacity-80"></div>
</div>
<!-- Row 2 -->
<div class="p-md border border-outline rounded-lg flex items-center justify-between">
<div class="space-y-xs w-full">
<div class="h-4 w-2/3 rounded shimmer"></div>
<div class="h-3 w-1/3 rounded shimmer opacity-60"></div>
</div>
<div class="h-6 w-20 rounded-sm shimmer opacity-80"></div>
</div>
<!-- Row 3 -->
<div class="p-md border border-outline rounded-lg flex items-center justify-between">
<div class="space-y-xs w-full">
<div class="h-4 w-4/5 rounded shimmer"></div>
<div class="h-3 w-2/5 rounded shimmer opacity-60"></div>
</div>
<div class="h-6 w-14 rounded-sm shimmer opacity-80"></div>
</div>
<!-- Row 4 -->
<div class="p-md border border-outline rounded-lg flex items-center justify-between">
<div class="space-y-xs w-full">
<div class="h-4 w-1/2 rounded shimmer"></div>
<div class="h-3 w-1/4 rounded shimmer opacity-60"></div>
</div>
<div class="h-6 w-18 rounded-sm shimmer opacity-80"></div>
</div>
</div>
</section>
<!-- Detail View Shimmer -->
<section class="md:col-span-7 space-y-lg">
<div class="p-lg bg-surface-container-low border border-outline rounded-lg space-y-md">
<!-- Title/Amount Section -->
<div class="flex justify-between items-start">
<div class="space-y-sm w-1/2">
<div class="h-8 w-full rounded shimmer"></div>
<div class="h-4 w-3/4 rounded shimmer opacity-60"></div>
</div>
<div class="h-10 w-24 rounded-lg shimmer"></div>
</div>
<!-- Detail Grids -->
<div class="grid grid-cols-2 gap-md pt-md border-t border-outline">
<div class="space-y-xs">
<div class="h-3 w-16 rounded shimmer opacity-40"></div>
<div class="h-5 w-24 rounded shimmer"></div>
</div>
<div class="space-y-xs">
<div class="h-3 w-16 rounded shimmer opacity-40"></div>
<div class="h-5 w-24 rounded shimmer"></div>
</div>
<div class="space-y-xs">
<div class="h-3 w-16 rounded shimmer opacity-40"></div>
<div class="h-5 w-24 rounded shimmer"></div>
</div>
<div class="space-y-xs">
<div class="h-3 w-16 rounded shimmer opacity-40"></div>
<div class="h-5 w-24 rounded shimmer"></div>
</div>
</div>
<!-- Chips Shimmer -->
<div class="flex flex-wrap gap-sm pt-md">
<div class="h-8 w-20 rounded-xl shimmer opacity-70"></div>
<div class="h-8 w-24 rounded-xl shimmer opacity-70"></div>
<div class="h-8 w-16 rounded-xl shimmer opacity-70"></div>
</div>
<!-- Action Buttons Shimmer -->
<div class="flex gap-md pt-lg">
<div class="h-12 flex-1 rounded-xl shimmer"></div>
<div class="h-12 flex-1 rounded-xl shimmer opacity-60"></div>
</div>
</div>
<!-- Secondary Detail Section -->
<div class="p-lg border border-outline rounded-lg space-y-md">
<div class="h-6 w-40 rounded shimmer"></div>
<div class="space-y-sm">
<div class="h-4 w-full rounded shimmer opacity-40"></div>
<div class="h-4 w-full rounded shimmer opacity-40"></div>
<div class="h-4 w-2/3 rounded shimmer opacity-40"></div>
</div>
</div>
</section>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-4 w-14 h-14 bg-secondary text-on-secondary rounded-lg shadow-lg flex items-center justify-center active:scale-95 transition-transform duration-100 z-40">
<span class="material-symbols-outlined">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[0.875rem] font-medium">Home</span>
</a>
<!-- Clients (Active State Simulation) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label text-[0.875rem] font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-[0.875rem] font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[0.875rem] font-medium">Sync</span>
</a>
</nav>
<!-- Micro-interaction for shimmer offset -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const shimmers = document.querySelectorAll('.shimmer');
            shimmers.forEach((s, index) => {
                // Add slight delay to each shimmer for a more natural loading wave
                s.style.animationDelay = `${index * 0.05}s`;
            });
        });
    </script>
</body></html>
