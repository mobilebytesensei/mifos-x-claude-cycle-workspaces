<script>
        // Simple Interaction logic for retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const btnText = this.querySelector('span:last-child');
            const icon = this.querySelector('.material-symbols-outlined');
            
            btnText.textContent = "Attempting...";
            icon.classList.add('animate-spin');
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btnText.textContent = "Retry Load";
                // In a real app, this would trigger a data re-fetch
            }, 2000);
        });
