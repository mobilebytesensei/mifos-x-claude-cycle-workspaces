<!-- Optional micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('System Configuration Error Screen Loaded');
            // Adding a small entrance animation to the Retry button after content loads
            const retryBtn = document.querySelector('button[onclick="location.reload()"]');
            if(retryBtn) {
                retryBtn.classList.add('opacity-0');
                setTimeout(() => {
                    retryBtn.classList.remove('opacity-0');
                    retryBtn.classList.add('transition-opacity', 'duration-500', 'opacity-100');
                }, 300);
            }
        });
