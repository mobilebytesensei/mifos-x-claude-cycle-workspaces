<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Collections - Error State</title>

                    "tertiary-container": "#277e7e",
                    "surface-variant": "#e0e3e3",
                    "surface-container-high": "#e6e9e9",
                    "primary-fixed-dim": "#76d6d5",
                    "on-tertiary-fixed": "#002020",
                    "inverse-on-surface": "#eef1f1",
                    "surface": "#f7fafa",
                    "error-container": "#ffdad6",
                    "inverse-surface": "#2d3131",
                    "primary-fixed": "#93f2f2",
                    "surface-dim": "#d7dbdb",
                    "on-error-container": "#93000a",
                    "on-surface-variant": "#3e4949",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#506969",
                    "on-secondary": "#ffffff",
                    "on-primary-container": "#e3fffe",
                    "surface-container-lowest": "#ffffff",
                    "secondary-container": "#cce8e7",
                    "secondary-fixed": "#cce8e7",
                    "on-primary-fixed-variant": "#004f4f",
                    "on-primary-fixed": "#002020",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "secondary-fixed-dim": "#b1cccb",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed-variant": "#324b4b",
                    "on-secondary-fixed": "#051f20",
                    "outline": "#6e7979",
                    "on-tertiary-fixed-variant": "#004f4f",
                    "inverse-primary": "#76d6d5",
                    "surface-tint": "#006a6a",
                    "on-surface": "#181c1d",
                    "primary-container": "#008080",
                    "secondary": "#4a6363",
                    "background": "#f7fafa",
                    "surface-container": "#ebeeee",
                    "surface-bright": "#f7fafa",
                    "tertiary": "#006565",
                    "primary": "#006565",
                    "surface-container-low": "#f1f4f4",
                    "on-tertiary-container": "#e0fffe",
                    "on-background": "#181c1d"
            },
            "borderRadius": {
                    "DEFAULT": "4px",
                    "lg": "8px",
                    "xl": "12px",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "gutter": "16px",
                    "container-max-width": "1440px",

            },
            "fontFamily": {

                    "display-lg": ["Roboto Flex"],

            },
            "fontSize": {
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                    "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],

                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "title-lg-mobile": ["20px", {"lineHeight": "26px", "fontWeight": "500"}],
                    "headline-sm-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "500"}]

          },
        },
      }
    </script>
<style>
        body {
            background-color: #f7fafa;
            color: #181c1d;
            font-family: 'Roboto Flex', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .error-illustration-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-margin-mobile h-14 w-full z-50 bg-surface dark:bg-on-background border-b border-outline-variant top-0 sticky">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors p-2 rounded-full active:opacity-80">
                menu
            </button>
<h1 class="font-title-lg text-title-lg-mobile md:text-title-lg text-primary dark:text-primary-fixed-dim font-bold">
                Banking Operations
            </h1>
</div>
<div class="flex items-center">
<button class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors p-2 rounded-full active:opacity-80">
                search
            </button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex flex-col items-center justify-center min-h-[calc(100vh-136px)] px-margin-mobile text-center gap-6">
<!-- Error Illustration (Abstract/Atmospheric) -->
<div class="error-illustration-container">
<div class="absolute inset-0 bg-secondary-container opacity-20 rounded-full scale-110 blur-3xl animate-pulse"></div>
<!-- Referenced style SCREEN_2 (No Network) -->
<div class="relative w-64 h-64 bg-surface-container-high rounded-full overflow-hidden flex items-center justify-center border border-outline-variant">
<div class="absolute inset-0 opacity-10 mix-blend-multiply" style="background-image: radial-gradient(circle, #006a6a 1px, transparent 1px); background-size: 20px 20px;"></div>
<div class="flex flex-col items-center gap-4">
<span class="material-symbols-outlined text-outline text-7xl select-none" style="font-variation-settings: 'wght' 200;">
                        signal_wifi_off
                    </span>
<div class="flex gap-2">
<div class="w-2 h-2 bg-error rounded-full animate-bounce"></div>
<div class="w-2 h-2 bg-error rounded-full animate-bounce [animation-delay:0.2s]"></div>
<div class="w-2 h-2 bg-error rounded-full animate-bounce [animation-delay:0.4s]"></div>
</div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="max-w-md flex flex-col gap-2">
<h2 class="font-title-lg text-title-lg text-on-surface">
                Connection Error
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4">
                We couldn't load your collections. Please check your network and try again.
            </p>
</div>
<!-- Retry Button -->
<button class="bg-primary text-on-primary font-label-lg text-label-lg px-8 py-3 rounded-full hover:shadow-lg active:scale-95 transition-all duration-150 flex items-center gap-2" id="retry_button">
<span class="material-symbols-outlined text-[20px]">refresh</span>
            Retry Connection
        </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-4 bg-surface-container dark:bg-surface-container-lowest border-t border-outline-variant z-50">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container transition-all active:scale-95" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container transition-all active:scale-95" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md">Clients</span>
</a>
<!-- Collections (Active) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-full px-5 py-1 transition-all active:scale-95" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="font-label-md text-label-md">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high dark:hover:bg-surface-container transition-all active:scale-95" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</a>
</nav>
<script>
        // Micro-interaction for the retry button
        const retryBtn = document.getElementById('retry_button');
        retryBtn.addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            this.disabled = true;
            this.classList.add('opacity-70');
            
            // Artificial delay to simulate network attempt
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                this.disabled = false;
                this.classList.remove('opacity-70');
            }, 2000);
        });
    </script>
</body></html>
