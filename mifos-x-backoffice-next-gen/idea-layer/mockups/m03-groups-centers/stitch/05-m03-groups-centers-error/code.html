<!-- Error Description -->

                We encountered a problem fetching the groups and centers list. Please check your connection or try again.
            </p>
<!-- Retry Button (#retry_button) -->
<button class="mt-4 bg-primary text-on-primary font-label px-xl py-md rounded-xl flex items-center gap-2 hover:brightness-110 active:scale-95 transition-all duration-200 shadow-sm" id="retry_button">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                Retry
            </button>
</div>

<span class="font-label text-[12px] font-medium">Sync</span>
</a>

<!-- Spacer for fixed bottom nav -->
<div class="h-20"></div>
<script>
        // Micro-interaction for retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Add spinning animation
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            // Simulate reload attempt
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80', 'pointer-events-none');
            }, 1500);
        });
    </script>
