<style>

        }
        body {

            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom Tab Styling to match M3 */
        .tab-active {
            position: relative;
            color: #006CB5;
        }
        .tab-active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            right: 25%;
            height: 3px;
            background-color: #006CB5;
            border-radius: 3px 3px 0 0;
        }
    </style>
<style>

<style>

<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface flex justify-between items-center px-4 w-full h-14 border-b border-outline dark:border-outline" id="header">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="p-2 hover:bg-surface-variant rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-primary">Groups &amp; Centers</h1>
</div>
<div class="flex items-center">
<button class="w-8 h-8 rounded-full overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A clean, professional headshot of a financial administrator, medium shot, smiling slightly, wearing a neutral business casual outfit. The lighting is soft and corporate, set against a blurred office interior with a light-blue and white color palette that matches the Mifos-X design system. High definition, professional photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgSeHN0NNev60KjuIDBbdMx9II9sCiAggvScHO_jboby5QL2TY1yHO3GNosZ2T1BmKK2z5Tz9SNQwXNpYDZtP0YJCKiU8VzBdzRCcSOym28WvdIAuBoVTdrow4vuO2lzkxv45MsQaRqSSGffoe8ljfjuXPu_uiero1ao-_LzZkcTtlmiH2ICINroxVUdNi-YnfKNPb422MOXMsAJiuSpZwRJRT5KQovRL1oTiotd85coLAzTbQgVGAZ7w-vTlds_YDFOrij008OgRk"/>
</button>
</div>
</header>
<!-- TabBar (#scope_tabs) -->
<nav class="fixed top-14 left-0 right-0 z-40 bg-surface flex w-full border-b border-outline" id="scope_tabs">
<button class="flex-1 py-3 font-label text-label tab-active transition-colors">Groups</button>
<button class="flex-1 py-3 font-label text-label text-on-surface-variant hover:bg-surface-variant transition-colors">Centers</button>
</nav>
<!-- Main Content Area (#content_area) -->
<main class="flex-1 flex flex-col items-center justify-center px-6 pt-32 pb-24 text-center" id="content_area">
<!-- Minimalist Offline Illustration -->

<img class="w-full h-auto" data-alt="A minimalist, professional digital illustration representing a broken network connection in the Mifos-X corporate style. It features a stylized blue server node and a grey client node separated by a clean, geometric lightning bolt or zig-zag line. The background is a clean, surgical white. The aesthetic uses flat design with rounded terminals, strictly adhering to the primary blue #006CB5 and neutral grey color palette. Minimalist and trustworthy." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWz-f8GBGEdzEoPeN8SUCywXdI5pR2gDoKSuYe9Y4nZdwG7vC0UAif65q7_BRbvSm1gPLugFkBN2N6PXUyt10LvBl0frFx0AIq4yuGUCRav5mWuRphOgIrqLxtsqh31y29ocPJ07yDLCCxj49NiWsNoja3srqdze34E9nJSH4Yozml8xQ97n7kmxkKW42BMT75zsfGA5npmFGesnDg_uZCJynLlPWoTHVyI7jKYYHwdTDUXU5NPczrRIJGtV_XcS35a1Nq8yB2uqVV"/>

<!-- Headline & Subtext -->
<h2 class="font-headline text-h2 mb-3 text-on-surface">Connection Lost</h2>
<p class="font-body text-body text-on-surface-variant max-w-sm mb-8">
            No Network Connection. Unable to load groups and centers. Please check your internet connection and try again.
        </p>
<!-- Retry Button -->
<button class="flex items-center gap-2 bg-primary text-on-primary font-label text-label py-3 px-8 rounded-xl active:scale-95 transition-transform shadow-sm" id="retry_button">
<span class="material-symbols-outlined text-[20px]">refresh</span>
<span>Retry</span>
</button>
</main>
<!-- Persistent FAB (#create_group_center_fab) -->
<button aria-label="Create New" class="fixed bottom-24 right-6 w-14 h-14 bg-secondary text-on-secondary rounded-lg flex items-center justify-center shadow-lg active:scale-90 transition-transform z-40" id="create_group_center_fab">
<span class="material-symbols-outlined text-[24px]">add</span>
</button>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe">
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low active:scale-95 transition-transform">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[12px] font-medium mt-1">Home</span>
</button>
<!-- ACTIVE TAB: Clients -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label text-[12px] font-medium mt-1">Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low active:scale-95 transition-transform">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-[12px] font-medium mt-1">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low active:scale-95 transition-transform">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[12px] font-medium mt-1">Sync</span>
</button>
</footer>
<script>
        // Simple micro-interaction for the retry button
        const retryBtn = document.getElementById('retry_button');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            
            // Simulate a network check
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                // In a real app, this would trigger a re-fetch of the data
            }, 1500);
        });

        // Tab switching logic (Visual only)
        const tabs = document.querySelectorAll('#scope_tabs button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('tab-active', 'text-primary');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('tab-active', 'text-primary');
                tab.classList.remove('text-on-surface-variant');
            });
        });
    </script>
</body></html>
