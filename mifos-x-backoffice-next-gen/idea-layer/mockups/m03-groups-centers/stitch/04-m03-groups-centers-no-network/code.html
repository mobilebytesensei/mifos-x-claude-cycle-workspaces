<style>

<body class="bg-surface text-on-surface flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant z-50 flex justify-between items-center px-margin-mobile h-14">
<div class="flex items-center gap-md">
<button class="material-symbols-outlined text-primary active:opacity-80 transition-opacity duration-150">menu</button>
<h1 class="font-headline-sm-mobile text-headline-sm-mobile font-bold text-primary">Collections</h1>
</div>
<div class="flex items-center">
<button class="material-symbols-outlined text-primary active:opacity-80 transition-opacity duration-150">search</button>
</div>
</header>
<!-- Tab Bar -->
<nav class="bg-surface border-b border-outline-variant flex w-full sticky top-14 z-40">
<div class="flex-1 flex justify-center items-center h-12 active-tab">
<span class="font-label-lg text-primary">Centers</span>
</div>
<div class="flex-1 flex justify-center items-center h-12">
<span class="font-label-lg text-on-surface-variant">Groups</span>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-gap-lg text-center">
<!-- Offline Illustration / Icon Area -->
<div class="relative w-full max-w-[280px] aspect-square mb-gap-lg flex items-center justify-center">
<!-- Decorative atmospheric circles (Teal Enterprise Style) -->
<div class="absolute inset-0 bg-primary/5 rounded-full scale-110 blur-xl"></div>
<div class="absolute inset-0 border-2 border-dashed border-primary/20 rounded-full animate-[spin_20s_linear_infinite]"></div>
<!-- Central Icon -->
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-[120px] text-primary/40" style="font-variation-settings: 'wght' 200;">signal_disconnected</span>
<!-- Abstract "data density" elements -->
<div class="absolute -bottom-2 -right-4 bg-error-container text-on-error-container p-2 rounded-xl shadow-sm border border-outline-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">wifi_off</span>
<span class="font-label-md">Offline</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="flex flex-col gap-md max-w-sm">
<h2 class="font-title-lg-mobile text-title-lg-mobile text-on-surface font-semibold">Network Connection Lost</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant px-4">
                We're unable to retrieve the latest collections data. Please check your internet connection and try again.
            </p>
</div>
<!-- Retry Button -->
<div class="mt-gap-lg w-full max-w-xs">
<button class="w-full h-12 bg-primary text-on-primary rounded-full flex items-center justify-center gap-2 font-label-lg shadow-sm hover:opacity-90 active:scale-95 transition-all" id="retryButton">
<span class="material-symbols-outlined text-[20px]">refresh</span>
                Retry Connection
            </button>
</div>
</main>
<!-- Spacer for BottomNavBar -->
<div class="h-20"></div>
<!-- BottomNavBar -->
<footer class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-4 bg-surface-container border-t border-outline-variant z-50">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<!-- Clients -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md">Clients</span>
</div>
<!-- Collections (Active) -->
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 transition-all active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="font-label-md text-label-md">Collections</span>
</div>
<!-- Sync -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95 duration-100 cursor-pointer">
<span class="material-symbols-outlined">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</div>
</footer>
<!-- Micro-interaction Script -->
<script>
        document.getElementById('retryButton').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Start rotating icon
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80', 'pointer-events-none');
            
            // Simulate network check
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80', 'pointer-events-none');
                
                // Visual feedback that it's still offline for this mockup
                const originalText = btn.innerHTML;
                btn.classList.replace('bg-primary', 'bg-secondary');
                btn.innerHTML = '<span class="material-symbols-outlined">cloud_off</span> Still Offline';
                
                setTimeout(() => {
                    btn.classList.replace('bg-secondary', 'bg-primary');
                    btn.innerHTML = originalText;
                }, 2000);
            }, 1500);
        });
    </script>
