<script>
    // Ripple Effect for buttons
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', function(e) {
        let x = e.clientX - e.target.offsetLeft;
        let y = e.clientY - e.target.offsetTop;
        let ripples = document.createElement('span');
        ripples.style.left = x + 'px';
        ripples.style.top = y + 'px';
        ripples.classList.add('ripple');
        this.appendChild(ripples);
        setTimeout(() => ripples.remove(), 600);
      });
    });

    // Simple interaction for Retry button
    document.getElementById('retry_button').addEventListener('click', function() {
      const icon = this.querySelector('.material-symbols-outlined');
      icon.style.transition = 'transform 0.6s ease';
      icon.style.transform = 'rotate(360deg)';
      setTimeout(() => { icon.style.transform = 'rotate(0deg)'; }, 600);
    });
  </script>
<style>
    /* Utility for no-scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Subtle interaction ripple simulation */
    .ripple {
      position: absolute;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      pointer-events: none;
      border-radius: 50%;
      animation: animate 0.6s linear;
    }
    @keyframes animate {
      0% { width: 0px; height: 0px; opacity: 0.5; }
      100% { width: 500px; height: 500px; opacity: 0; }
    }
  </style>
