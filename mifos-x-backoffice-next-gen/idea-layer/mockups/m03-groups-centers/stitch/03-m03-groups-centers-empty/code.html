<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-lg">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface border-b border-outline-variant">
<div class="flex justify-between items-center h-16 px-4 w-full mx-auto">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer active:opacity-80" data-icon="account_balance">account_balance</span>
<h1 class="font-title-lg text-title-lg font-bold text-primary">Collections</h1>
</div>

</div>
</header>

<div class="flex-1 flex flex-col items-center justify-center h-12 relative cursor-pointer active:bg-surface-container-high transition-colors">
<span class="font-label-lg text-label-lg text-primary">Centers</span>
<div class="absolute bottom-0 w-full h-1 bg-primary rounded-t-full"></div>
</div>
<div class="flex-1 flex flex-col items-center justify-center h-12 relative cursor-pointer active:bg-surface-container-high transition-colors">
<span class="font-label-lg text-label-lg text-on-surface-variant">Groups</span>
</div>
</nav>
<!-- Main Content Area: Empty State -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile text-center gap-6 pb-32">
<!-- Friendly Illustration -->
<div class="w-48 h-48 rounded-full bg-surface-container-low flex items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 opacity-10 bg-primary group-hover:opacity-20 transition-opacity"></div>
<div class="z-10 bg-surface-container-lowest p-8 rounded-3xl shadow-sm">
<span class="material-symbols-outlined text-primary" data-icon="payments" style="font-size: 80px; font-variation-settings: 'FILL' 1;">payments</span>
</div>
<!-- Decorative atmospheric circles -->
<div class="absolute -top-4 -right-4 w-12 h-12 rounded-full bg-tertiary-container opacity-20"></div>
<div class="absolute -bottom-2 -left-2 w-16 h-16 rounded-full bg-secondary-container opacity-20"></div>
</div>
<div class="space-y-2 max-w-sm">
<h2 class="font-title-lg text-title-lg text-on-surface font-bold">No Collections Found</h2>
<p class="font-body-md text-body-md text-on-surface-variant">

            </p>
</div>
<!-- Primary Action Button -->
<button class="flex items-center gap-2 bg-primary text-on-primary px-6 py-3 rounded-full font-label-lg text-label-lg shadow-md active:scale-95 active:shadow-sm transition-all duration-100" id="retry_button">

<span class="font-label-lg text-label-lg font-bold">New Group/Center</span>
</button>
