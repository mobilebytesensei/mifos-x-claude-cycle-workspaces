                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",

                    borderRadius: {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer {
            background: linear-gradient(90deg, #DEE3EB 25%, #F3F4F9 50%, #DEE3EB 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .safe-top { padding-top: env(safe-area-inset-top); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant transition-colors active:opacity-80 rounded-full">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline text-[1.375rem] font-semibold text-primary">Groups &amp; Centers</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<main class="pt-16 pb-32 min-h-screen">
<!-- Tab Bar Skeleton -->
<div class="bg-surface border-b border-outline sticky top-16 z-40">
<div class="flex">
<div class="flex-1 flex flex-col items-center py-3 relative">
<div class="w-20 h-4 rounded-sm shimmer"></div>
<div class="absolute bottom-0 left-1/4 right-1/4 h-1 bg-primary rounded-t-full"></div>
</div>
<div class="flex-1 flex flex-col items-center py-3">
<div class="w-20 h-4 rounded-sm shimmer"></div>
</div>
</div>
</div>
<!-- Content Area: Office Scoped List -->
<div class="px-md mt-md space-y-md">
<!-- Skeleton Card 1 -->
<div class="bg-surface border border-outline rounded-lg p-md space-y-md">
<div class="flex justify-between items-start">
<div class="space-y-2 w-2/3">
<div class="w-full h-5 rounded-sm shimmer"></div>
<div class="w-1/2 h-3 rounded-sm shimmer"></div>
</div>
<div class="w-16 h-6 rounded-sm shimmer"></div>
</div>
<div class="grid grid-cols-2 gap-sm">
<div class="space-y-1">
<div class="w-12 h-2 rounded-sm shimmer opacity-60"></div>
<div class="w-20 h-4 rounded-sm shimmer"></div>
</div>
<div class="space-y-1">
<div class="w-20 h-2 rounded-sm shimmer opacity-60"></div>
<div class="w-24 h-4 rounded-sm shimmer"></div>
</div>
</div>
</div>
<!-- Detail View Section (Loading) - Integrated into the Master Flow -->
<div class="bg-surface-container-low rounded-lg p-md space-y-lg">
<div class="flex items-center gap-sm">
<div class="w-24 h-4 rounded-sm shimmer"></div>
<div class="flex-1 h-[1px] bg-outline opacity-20"></div>
</div>
<!-- Member Skeletons -->
<div class="space-y-sm">
<!-- Row 1 -->
<div class="flex items-center justify-between py-2 border-b border-outline border-opacity-10">
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full shimmer"></div>
<div class="space-y-1">
<div class="w-32 h-4 rounded-sm shimmer"></div>
<div class="w-16 h-3 rounded-sm shimmer opacity-60"></div>
</div>
</div>
<div class="w-12 h-5 rounded-sm shimmer"></div>
</div>
<!-- Row 2 -->
<div class="flex items-center justify-between py-2 border-b border-outline border-opacity-10">
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full shimmer"></div>
<div class="space-y-1">
<div class="w-28 h-4 rounded-sm shimmer"></div>
<div class="w-20 h-3 rounded-sm shimmer opacity-60"></div>
</div>
</div>
<div class="w-12 h-5 rounded-sm shimmer"></div>
</div>
</div>
<!-- Action Button Skeletons -->
<div class="grid grid-cols-2 gap-md">
<div class="h-12 rounded-xl shimmer"></div>
<div class="h-12 rounded-xl shimmer"></div>
<div class="h-12 rounded-xl shimmer"></div>
<div class="h-12 rounded-xl shimmer"></div>
</div>
</div>
<!-- Skeleton Card 2 (List Continuation) -->
<div class="bg-surface border border-outline rounded-lg p-md space-y-md">
<div class="flex justify-between items-start">
<div class="space-y-2 w-3/4">
<div class="w-full h-5 rounded-sm shimmer"></div>
<div class="w-1/3 h-3 rounded-sm shimmer"></div>
</div>
<div class="w-16 h-6 rounded-sm shimmer"></div>
</div>
</div>
<!-- Skeleton Card 3 (List Continuation) -->
<div class="bg-surface border border-outline rounded-lg p-md space-y-md">
<div class="flex justify-between items-start">
<div class="space-y-2 w-2/3">
<div class="w-full h-5 rounded-sm shimmer"></div>
<div class="w-1/2 h-3 rounded-sm shimmer"></div>
</div>
<div class="w-16 h-6 rounded-sm shimmer"></div>
</div>
</div>
</div>
</main>
<!-- Floating Action Button Skeleton -->
<div class="fixed bottom-24 right-md w-14 h-14 bg-secondary-container rounded-lg shadow-lg flex items-center justify-center">
<div class="w-8 h-8 rounded-md shimmer bg-on-secondary-container opacity-30"></div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe px-2">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform px-2">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[0.875rem] font-medium">Home</span>
</button>
<!-- Clients -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform px-2">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-[0.875rem] font-medium">Clients</span>
</button>
<!-- Collections -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform px-2">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-[0.875rem] font-medium">Collections</span>
</button>
<!-- Sync -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform px-2">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[0.875rem] font-medium">Sync</span>
</button>
</nav>
<script>
        // Micro-interaction: Mimic a gentle pulse on the active nav state or FAB
        // Although specifically requested to be static, subtle opacity oscillation 
        // can enhance the 'loading' feeling without breaking the static constraint.
        document.querySelectorAll('.shimmer').forEach(el => {
            el.style.opacity = '0.85';
        });

        // Add "active" style logic based on current screen context (Groups/Centers fall under "Home" or "Clients")
        // Since it's a sub-module of Groups, we keep it neutral or highlight nothing per anti-hallucination rules.
        // However, as this is a core "Clients/Groups" module, highlighting Clients is appropriate.
        const navItems = document.querySelectorAll('nav button');
        const clientsTab = navItems[1];
        if(clientsTab) {
            clientsTab.className = "flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-95 transition-transform";
        }
    </script>
</body></html>
