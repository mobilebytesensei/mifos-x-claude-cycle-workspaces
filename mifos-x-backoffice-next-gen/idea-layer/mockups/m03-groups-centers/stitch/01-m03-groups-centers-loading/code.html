<script>
        // Micro-interaction for tabs (purely visual for this loading state)
        const tabs = document.querySelectorAll('#scope_tabs > div');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('border-b-2', 'border-primary');
                });
                tab.classList.add('border-b-2', 'border-primary');
            });
        });

        // Suppression Logic Check:
        // Current screen is "Groups & Centers", which is a top-level administrative destination.
        // Therefore, BottomNavBar is preserved.
        // FAB is preserved as "Groups & Centers" is a dashboard/list view where creation is a primary action.
    </script>
