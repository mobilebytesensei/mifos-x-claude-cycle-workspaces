<style>
        @keyframes shimmer {
            0% { background-color: #ebeeee; }
            50% { background-color: #e6e9e9; }
            100% { background-color: #ebeeee; }
        }
        .animate-shimmer {
            animation: shimmer 1.5s infinite ease-in-out;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-on-background border-b border-outline-variant z-50 flex justify-between items-center px-margin-mobile h-14">
<div class="flex items-center gap-4">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors p-2 rounded-full active:opacity-80">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-title-lg text-title-lg-mobile text-primary dark:text-primary-fixed-dim">Collections</h1>
</div>
<div class="flex items-center">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors p-2 rounded-full active:opacity-80">
<span class="material-symbols-outlined">search</span>
</button>
</div>
</header>
<!-- Content Area -->
<main class="flex-1 pb-24">
<!-- Shimmer Tab Bar -->
<div class="flex w-full px-margin-mobile border-b border-outline-variant h-12 items-center gap-8">
<div class="h-4 w-20 animate-shimmer rounded-full"></div>
<div class="h-4 w-20 animate-shimmer rounded-full"></div>
<div class="h-4 w-20 animate-shimmer rounded-full"></div>
</div>
<!-- Master List Loading -->
<div class="flex flex-col p-margin-mobile gap-4">
<!-- Loading Item 1 -->
<div class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant">
<div class="w-12 h-12 rounded-full animate-shimmer flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-2/3 animate-shimmer rounded"></div>
<div class="h-3 w-1/3 animate-shimmer rounded opacity-60"></div>
</div>
<div class="w-16 h-4 animate-shimmer rounded self-start"></div>
</div>
<!-- Loading Item 2 -->
<div class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant">
<div class="w-12 h-12 rounded-full animate-shimmer flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-1/2 animate-shimmer rounded"></div>
<div class="h-3 w-1/4 animate-shimmer rounded opacity-60"></div>
</div>
<div class="w-16 h-4 animate-shimmer rounded self-start"></div>
</div>
<!-- Loading Item 3 -->
<div class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant">
<div class="w-12 h-12 rounded-full animate-shimmer flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-3/4 animate-shimmer rounded"></div>
<div class="h-3 w-1/2 animate-shimmer rounded opacity-60"></div>
</div>
<div class="w-16 h-4 animate-shimmer rounded self-start"></div>
</div>
<!-- Loading Item 4 -->
<div class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant">
<div class="w-12 h-12 rounded-full animate-shimmer flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-2/3 animate-shimmer rounded"></div>
<div class="h-3 w-1/3 animate-shimmer rounded opacity-60"></div>
</div>
<div class="w-16 h-4 animate-shimmer rounded self-start"></div>
</div>
<!-- Loading Item 5 -->
<div class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant">
<div class="w-12 h-12 rounded-full animate-shimmer flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-1/2 animate-shimmer rounded"></div>
<div class="h-3 w-1/4 animate-shimmer rounded opacity-60"></div>
</div>
<div class="w-16 h-4 animate-shimmer rounded self-start"></div>
</div>
<!-- Loading Item 6 -->
<div class="flex items-center gap-4 p-4 rounded-lg border border-outline-variant">
<div class="w-12 h-12 rounded-full animate-shimmer flex-shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-3/4 animate-shimmer rounded"></div>
<div class="h-3 w-1/2 animate-shimmer rounded opacity-60"></div>
</div>
<div class="w-16 h-4 animate-shimmer rounded self-start"></div>
</div>
</div>
</main>
<!-- FAB Shimmer -->
<div class="fixed bottom-24 right-6 w-14 h-14 rounded-xl animate-shimmer shadow-lg z-40"></div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-4 bg-surface-container dark:bg-surface-container-lowest border-t border-outline-variant z-50">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<!-- Clients -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md">Clients</span>
</button>
<!-- Collections (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-full px-5 py-1 transition-all active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md text-label-md">Collections</span>
</button>
<!-- Sync -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-5 py-1 hover:bg-surface-container-high transition-all active:scale-95">
<span class="material-symbols-outlined">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</button>
</nav>
<script>
        // Micro-interaction: Smooth transition simulation
        document.addEventListener('DOMContentLoaded', () => {
            const navItems = document.querySelectorAll('nav button');
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    navItems.forEach(i => {
                        i.classList.remove('bg-secondary-container', 'dark:bg-on-secondary-fixed-variant', 'text-on-secondary-container', 'dark:text-secondary-fixed', 'rounded-full');
                        i.classList.add('text-on-surface-variant', 'dark:text-outline-variant');
                        const icon = i.querySelector('.material-symbols-outlined');
                        if (icon) icon.style.fontVariationSettings = "'FILL' 0";
                    });
                    item.classList.add('bg-secondary-container', 'dark:bg-on-secondary-fixed-variant', 'text-on-secondary-container', 'dark:text-secondary-fixed', 'rounded-full');
                    item.classList.remove('text-on-surface-variant', 'dark:text-outline-variant');
                    const icon = item.querySelector('.material-symbols-outlined');
                    if (icon) icon.style.fontVariationSettings = "'FILL' 1";
                });
            });
        });
    </script>
</body></html>
