<!-- Descriptive Text -->
<p class="text-body text-on-surface-variant text-center mb-xl max-w-xs">Please check your connection and try again.</p>
<!-- Primary Action Button -->
<button class="bg-primary text-on-primary rounded-xl px-lg py-md flex items-center justify-center hover:bg-primary/90 transition-colors active:scale-95 shadow-sm min-w-[160px]">
<span class="material-symbols-outlined mr-sm" data-icon="refresh">refresh</span>
<span class="font-label text-label">Retry</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface dark:bg-surface text-primary dark:text-primary font-label text-label font-medium fixed bottom-0 w-full z-50 border-t border-outline dark:border-outline flat no shadows active:scale-95 transition-transform fixed bottom-0 left-0 w-full flex justify-around items-center h-20 px-sm pb-safe md:hidden bg-surface">
<!-- Home (Active logic: Intent fallback -> None match 'Path Tracking' or 'Error'. User is navigating. We'll leave all inactive as it's a detail dead end, wait, BottomNavBar dictates we MUST select something or leave default. Given the context, Path Tracking isn't a top tab. Let's default to Home as the active context if required by JSON, but actually the instructions say "suppress navigation to prioritize content canvas" if in a dead end. However, the prompt EXPLICITLY asks for "Shell: BottomNavBar with 4 items: Home, Clients, Collections, Sync." so we must render it.) 
    Since none match "Path Tracking", we will highlight 'Home' as the base module fallback, though semantic matching prefers none if irrelevant. Let's apply inactive to all since 'Path Tracking' is not Home, Clients, Collections, or Sync. -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 rounded-lg p-2 transition-colors flex-1">
<span class="material-symbols-outlined mb-xs" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 0;">home</span>
<span>Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 rounded-lg p-2 transition-colors flex-1">
<span class="material-symbols-outlined mb-xs" data-icon="group" data-weight="fill" style="font-variation-settings: 'FILL' 0;">group</span>
<span>Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 rounded-lg p-2 transition-colors flex-1">
<span class="material-symbols-outlined mb-xs" data-icon="payments" data-weight="fill" style="font-variation-settings: 'FILL' 0;">payments</span>
<span>Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/30 rounded-lg p-2 transition-colors flex-1">
<span class="material-symbols-outlined mb-xs" data-icon="sync" data-weight="fill" style="font-variation-settings: 'FILL' 0;">sync</span>
