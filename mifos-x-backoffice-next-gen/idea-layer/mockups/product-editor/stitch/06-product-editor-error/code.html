<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Edit Product</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        sm: "4px",
                        md: "8px",
                        lg: "16px",
                        xl: "28px"
                    },
                    spacing: {
                        xs: "4px",
                        sm: "8px",
                        md: "16px",
                        lg: "24px",
                        xl: "32px",
                        xxl: "48px"
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        mono: ['Roboto Mono', 'monospace']
                    },
                    fontSize: {
                        h1: ['2rem', { lineHeight: '1.25', fontWeight: '700' }],
                        h2: ['1.75rem', { lineHeight: '1.3', fontWeight: '600' }],
                        h3: ['1.375rem', { lineHeight: '1.35', fontWeight: '600' }],
                        body: ['1rem', { lineHeight: '1.5', fontWeight: '400' }],
                        label: ['0.875rem', { lineHeight: '1.4', letterSpacing: '0.1px', fontWeight: '500' }],
                        caption: ['0.75rem', { lineHeight: '1.4', letterSpacing: '0.4px', fontWeight: '400' }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-md h-16 bg-surface dark:bg-surface border-b border-outline dark:border-outline sticky top-0 z-40 shrink-0">
<div class="flex items-center gap-sm">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 dark:hover:bg-surface-variant/50 transition-colors duration-200 text-on-surface dark:text-on-surface">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-sans text-h3 font-bold text-on-surface dark:text-on-surface m-0 leading-none">Edit Product</h1>
</div>
<button aria-label="Account" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 dark:hover:bg-surface-variant/50 transition-colors duration-200 text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center p-lg text-center pb-32">
<!-- Error Graphic -->
<div class="mb-lg w-48 h-48 sm:w-64 sm:h-64 rounded-full bg-surface-variant/30 flex items-center justify-center p-md">
<img alt="Connection Error Illustration" class="w-full h-full object-contain" data-alt="A clean, minimalist vector illustration of a broken circuit board forming an X shape, colored in deep primary blue and cool grey, representing a digital connection failure or synchronization error on a stark white background." src="https://lh3.googleusercontent.com/aida/AP1WRLtL6bWUJofHDdueJnK2F1D_YYqkwd-I9hi9GUAedq_r0c6qsR0RyUFByG7H0D6IhngyhlJj8Wi4igXbmB8YFKTweoLqVwxO4W1twOMQxKJY4QIZrHEK6ZBB3qEkGXdt1W2DqKMdrNLqIBi_uxa_2x9beVtBmvPzi73B5-LjBrdzUTkRD5Ofmqmx4ZEDpE7cSQVFlnfX0pxjP0dO4NLDXpmrTsSelckjzS0OVGEWkBgcEdNBiGTNnNOnxgU"/>
</div>
<!-- Error Messaging -->
<h2 class="text-h2 text-on-surface mb-sm">Connection Error</h2>
<p class="text-body text-on-surface-variant mb-xl max-w-sm mx-auto">
            Unable to load product configuration. Please check your connection and try again.
        </p>
<!-- Retry Action -->
<button class="bg-primary text-on-primary rounded-xl px-md py-md font-label flex items-center gap-sm hover:bg-primary/90 active:scale-95 transition-all duration-200 shadow-sm" onclick="this.classList.add('opacity-70'); setTimeout(()=&gt;this.classList.remove('opacity-70'), 1000);">
<span class="material-symbols-outlined" style="font-size: 20px;">refresh</span>
            Retry
        </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 bg-surface px-sm pb-safe border-t border-outline dark:border-outline md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/30 dark:hover:bg-surface-variant/30 active:scale-95 transition-all duration-150 rounded-xl group w-full h-full">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">home</span>
<span class="font-sans text-caption font-medium group-hover:text-primary transition-colors">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/30 dark:hover:bg-surface-variant/30 active:scale-95 transition-all duration-150 rounded-xl group w-full h-full">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">group</span>
<span class="font-sans text-caption font-medium group-hover:text-primary transition-colors">Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/30 dark:hover:bg-surface-variant/30 active:scale-95 transition-all duration-150 rounded-xl group w-full h-full">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">payments</span>
<span class="font-sans text-caption font-medium group-hover:text-primary transition-colors">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-variant/30 dark:hover:bg-surface-variant/30 active:scale-95 transition-all duration-150 rounded-xl group w-full h-full">
<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors">sync</span>
<span class="font-sans text-caption font-medium group-hover:text-primary transition-colors">Sync</span>
</button>
</nav>
<!-- Desktop Sidebar (Hidden on mobile) -->
<aside class="hidden md:flex flex-col fixed left-0 top-16 bottom-0 w-20 bg-surface border-r border-outline z-30 py-md items-center gap-lg">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-lg hover:bg-surface-variant/50 transition-colors w-16 h-16 group">
<span class="material-symbols-outlined group-hover:text-primary">home</span>
<span class="text-[10px] mt-1 font-medium group-hover:text-primary">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-lg hover:bg-surface-variant/50 transition-colors w-16 h-16 group">
<span class="material-symbols-outlined group-hover:text-primary">group</span>
<span class="text-[10px] mt-1 font-medium group-hover:text-primary">Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-lg hover:bg-surface-variant/50 transition-colors w-16 h-16 group">
<span class="material-symbols-outlined group-hover:text-primary">payments</span>
<span class="text-[10px] mt-1 font-medium group-hover:text-primary">Collect</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 rounded-lg hover:bg-surface-variant/50 transition-colors w-16 h-16 group">
<span class="material-symbols-outlined group-hover:text-primary">sync</span>
<span class="text-[10px] mt-1 font-medium group-hover:text-primary">Sync</span>
</button>
</aside>
</body></html>
