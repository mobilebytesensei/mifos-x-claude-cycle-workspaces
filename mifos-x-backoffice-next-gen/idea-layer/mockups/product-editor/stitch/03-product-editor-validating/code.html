<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Edit Product - Mifos-X</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006CB5",
            "on-primary": "#FFFFFF",
            "primary-container": "#CBE6FF",
            "on-primary-container": "#001D33",
            secondary: "#00796B",
            "on-secondary": "#FFFFFF",
            "secondary-container": "#B8F2E6",
            "on-secondary-container": "#00201A",
            tertiary: "#5B5891",
            "on-tertiary": "#FFFFFF",
            "tertiary-container": "#E3DFFF",
            "on-tertiary-container": "#17124B",
            surface: "#FCFCFF",
            "on-surface": "#1A1C1E",
            "surface-variant": "#DEE3EB",
            "on-surface-variant": "#42474E",
            "surface-container-low": "#F3F4F9",
            background: "#FCFCFF",
            "on-background": "#1A1C1E",
            outline: "#72777F",
            success: "#2E7D32",
            warning: "#F57C00",
            "warning-strong": "#B45309",
            error: "#BA1A1A",
            "on-error": "#FFFFFF",
            "error-container": "#FFDAD6",
            "on-error-container": "#410002"
          },
          borderRadius: {
            sm: "4px",
            md: "8px",
            lg: "16px",
            xl: "28px"
          },
          spacing: {
            xs: "4px",
            sm: "8px",
            md: "16px",
            lg: "24px",
            xl: "32px",
            xxl: "48px"
          },
          fontFamily: {
            headline: ["Roboto", "sans-serif"],
            body: ["Roboto", "sans-serif"],
            label: ["Roboto", "sans-serif"],
            mono: ["Roboto Mono", "monospace"]
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top);
    }
    
    /* Indeterminate Progress Bar Animation */
    @keyframes progress-indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .animate-progress-indeterminate {
      animation: progress-indeterminate 1.5s infinite linear;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col pt-safe">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline text-h3 font-semibold docked full-width top-0 border-b border-outline flat no shadows flex items-center w-full px-md h-14 sticky z-40">
<button aria-label="Back" class="w-12 h-12 flex items-center justify-center -ml-3 text-on-surface hover:bg-surface-variant transition-colors active:opacity-80 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex-1 ml-2 text-h3 font-bold text-on-surface">Edit Product</div>
</header>
<!-- Main Scrollable Content -->
<!-- State: Validating (Overlay applied) -->
<main class="flex-1 overflow-y-auto px-md py-md pb-24 relative">
<!-- Validation Overlay -->
<div class="absolute inset-0 z-30 bg-surface/50 backdrop-blur-[1px] flex flex-col items-center justify-center pt-32 pointer-events-none">
<div class="bg-surface-container-low shadow-sm border border-outline rounded-lg p-md flex flex-col items-center gap-sm">
<div class="w-48 h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/2 rounded-full animate-progress-indeterminate"></div>
</div>
<span class="font-label text-label font-medium text-primary">Validating Configuration...</span>
</div>
</div>
<!-- Form Content (Pointer events disabled during validation) -->
<div class="flex flex-col gap-lg pointer-events-none opacity-60">
<!-- Expandable Section: Product Configuration -->
<section class="bg-surface rounded-lg border border-outline overflow-hidden" id="pe_section">
<button class="w-full flex items-center justify-between p-md hover:bg-surface-variant transition-colors">
<span class="font-headline text-h3 font-semibold text-on-surface">Product Configuration</span>
<span class="material-symbols-outlined text-on-surface-variant transition-transform rotate-180">expand_more</span>
</button>
<div class="p-md pt-0 flex flex-col gap-md border-t border-surface-variant">
<!-- Dynamic Form Field -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label font-medium text-on-surface-variant" for="pe_field">Product Name</label>
<input class="bg-surface-variant text-on-surface rounded-sm p-md border-none focus:ring-2 focus:ring-primary w-full font-body text-body" id="pe_field" readonly="" type="text" value="Small Business Micro-Loan"/>
</div>
<!-- Dropdown Selects -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label text-label font-medium text-on-surface-variant" for="pe_currency_select">Currency</label>
<div class="relative">
<select class="appearance-none bg-surface-variant text-on-surface rounded-sm p-md pr-10 border-none focus:ring-2 focus:ring-primary w-full font-body text-body" disabled="" id="pe_currency_select">
<option selected="">USD</option>
<option>EUR</option>
<option>GBP</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label text-label font-medium text-on-surface-variant" for="pe_amortisation_select">Amortization</label>
<div class="relative">
<select class="appearance-none bg-surface-variant text-on-surface rounded-sm p-md pr-10 border-none focus:ring-2 focus:ring-primary w-full font-body text-body" disabled="" id="pe_amortisation_select">
<option selected="">Equal Installments</option>
<option>Equal Principal Payments</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label text-label font-medium text-on-surface-variant" for="pe_interest_type_select">Interest Method</label>
<div class="relative">
<select class="appearance-none bg-surface-variant text-on-surface rounded-sm p-md pr-10 border-none focus:ring-2 focus:ring-primary w-full font-body text-body" disabled="" id="pe_interest_type_select">
<option selected="">Declining Balance</option>
<option>Flat</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label text-label font-medium text-on-surface-variant" for="pe_accounting_rule_select">Accounting Rule</label>
<div class="relative">
<select class="appearance-none bg-surface-variant text-on-surface rounded-sm p-md pr-10 border-none focus:ring-2 focus:ring-primary w-full font-body text-body" disabled="" id="pe_accounting_rule_select">
<option selected="">None</option>
<option>Cash</option>
<option>Accrual</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
</div>
</div>
</section>
<!-- Charges Section -->
<section class="bg-surface rounded-lg border border-outline p-md flex flex-col gap-md">
<div class="flex items-center justify-between">
<h2 class="font-headline text-h3 font-semibold text-on-surface">Charges</h2>
<button class="bg-surface text-primary rounded-xl px-md py-sm font-label text-label font-medium flex items-center gap-xs hover:bg-surface-variant transition-colors border border-outline disabled:opacity-50" disabled="" id="pe_add_charge">
<span class="material-symbols-outlined" style="font-size: 18px;">add</span>
            Add Charge
          </button>
</div>
<!-- Charge Item List -->
<div class="flex flex-col gap-sm">
<div class="bg-surface border border-outline rounded-sm p-md flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body text-body text-on-surface">Processing Fee</span>
<span class="font-caption text-caption text-on-surface-variant">2.00% Flat</span>
</div>
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-variant hover:text-error rounded-full transition-colors disabled:opacity-50" disabled="" id="pe_remove_charge">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
</section>
<!-- Accounting Section -->
<section class="bg-surface rounded-lg border border-outline p-md flex flex-col gap-md">
<h2 class="font-headline text-h3 font-semibold text-on-surface">Accounting</h2>
<div class="flex flex-col gap-xs">
<label class="font-label text-label font-medium text-on-surface-variant" for="pe_gl_mapping">GL Mapping</label>
<div class="relative">
<select class="appearance-none bg-surface-variant text-on-surface rounded-sm p-md pr-10 border-none focus:ring-2 focus:ring-primary w-full font-body text-body" disabled="" id="pe_gl_mapping">
<option selected="">Select GL Account...</option>
<option>1000 - Cash</option>
<option>2000 - Loans Receivable</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>
</div>
</section>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-md mt-md">
<button class="bg-primary-container text-on-primary-container rounded-xl p-md font-label text-label font-medium flex-1 justify-center flex items-center gap-xs transition-colors disabled:opacity-50" disabled="" id="pe_validate">
<span class="material-symbols-outlined" style="font-size: 18px; font-variation-settings: 'FILL' 1;">check_circle</span>
          Validate Form
        </button>
<button class="bg-primary text-on-primary rounded-xl p-md font-label text-label font-medium flex-1 justify-center transition-colors disabled:opacity-50" disabled="" id="pe_save">
          Save Changes
        </button>
<button class="bg-surface text-primary border border-outline rounded-xl p-md font-label text-label font-medium flex-1 justify-center transition-colors disabled:opacity-50" disabled="" id="pe_cancel">
          Cancel
        </button>
<button class="hidden bg-error-container text-on-error-container rounded-xl p-md font-label text-label font-medium justify-center items-center gap-xs transition-colors" id="pe_error_retry">
<span class="material-symbols-outlined" style="font-size: 18px;">refresh</span>
          Retry
        </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface font-label text-label font-medium text-on-surface-variant docked full-width bottom-0 border-t border-outline flat no shadows fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-sm pb-safe md:hidden">
<!-- Active Tab: Home (Fallback as none exactly match 'Edit Product') -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-95 transition-transform flex-1 max-w-[80px]" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[10px] mt-1 font-bold">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors active:scale-95 flex-1 max-w-[80px]" href="#">
<span class="material-symbols-outlined">group</span>
<span class="text-[10px] mt-1">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors active:scale-95 flex-1 max-w-[80px]" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="text-[10px] mt-1">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors active:scale-95 flex-1 max-w-[80px]" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="text-[10px] mt-1">Sync</span>
</a>
</nav>
</body></html>
