<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Mifos Back Office - Product Catalog</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Public+Sans:wght@500&amp;family=Roboto+Mono&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "tertiary": "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "background": "#FCFCFF",
              "on-background": "#1A1C1E",
              "outline": "#72777F",
              "success": "#2E7D32",
              "warning": "#F57C00",
              "warning-strong": "#B45309",
              "error": "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002",
            },
            borderRadius: {
              "DEFAULT": "0.125rem",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            spacing: {
              "xs": "4px",
              "sm": "8px",
              "md": "16px",
              "lg": "24px",
              "xl": "32px",
              "xxl": "48px",
            },
            fontFamily: {
              "headline": ["Roboto", "Inter", "sans-serif"],
              "display": ["Roboto", "Inter", "sans-serif"],
              "body": ["Roboto", "Inter", "sans-serif"],
              "label": ["Public Sans", "Roboto", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"]
            },
          },
        },
      }
    </script>
<style>
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .nav-indicator {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Mobile-first constraints */
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen font-body">
<!-- TopAppBar -->
<header class="bg-surface sticky top-0 z-50 flex justify-between items-center px-4 w-full h-16 border-b border-outline/20">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface" data-icon="menu">menu</span>
</button>
<h1 class="font-display text-[1.375rem] font-semibold text-primary leading-tight">Product Catalog</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden bg-primary-container flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial services staff member in a bright, modern office setting. The lighting is soft and natural, emphasizing a trustworthy and clinical administrative atmosphere. The background shows a clean, organized office with subtle hints of blue branding elements, maintaining the Mifos design system aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB50ll9VR4q-8ZC0ITvOOzpIgYoWRqd2d_ra7OCCoh7azqj4XtUw9pNtbRhpYL45yCqhfn1rFBO4S5WWF8F95Tw-mwWNLyxJZNXG9ZWBCbqFdH4oGC9osGDmuFfVUZwFLa8q9gsvzCoB-0cfenfIsROO8q3TFto3ubDO2N3sv8e9e_pvbe_Fh0x2eyttjQgsl-Afu4oQv9upRxa0WOfULoBn3csTlbmxGoTN_3S2G1ViC2QDEpTfGI5CfZCO-uEdd5QhXUNixPNCDqu"/>
</div>
</header>
<!-- Main Content Scroller -->
<main class="flex-1 overflow-y-auto pb-32">
<!-- Search & Filters Container -->
<div class="px-4 pt-4 space-y-4">
<!-- Search Field -->
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-variant text-on-surface rounded-md border-none focus:ring-2 focus:ring-primary placeholder-on-surface-variant/60" placeholder="Search catalog items..." type="text"/>
</div>
<!-- Filter Chips (Horizontal Scroll) -->
<div class="flex gap-2 overflow-x-auto pb-2 -mx-4 px-4 no-scrollbar">
<button class="flex-shrink-0 px-4 py-2 bg-primary text-on-primary rounded-full text-sm font-medium transition-colors">
                    All
                </button>
<button class="flex-shrink-0 px-4 py-2 border border-outline text-on-surface-variant rounded-full text-sm font-medium hover:bg-surface-variant transition-colors">
                    Loan Products
                </button>
<button class="flex-shrink-0 px-4 py-2 border border-outline text-on-surface-variant rounded-full text-sm font-medium hover:bg-surface-variant transition-colors">
                    Savings Products
                </button>
<button class="flex-shrink-0 px-4 py-2 border border-outline text-on-surface-variant rounded-full text-sm font-medium hover:bg-surface-variant transition-colors">
                    Charges
                </button>
</div>
</div>
<!-- Empty State Canvas -->
<div class="flex flex-col items-center justify-center px-6 pt-12 pb-8 text-center animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="w-full max-w-[280px] aspect-square mb-8">
<img alt="No products found" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs3saFr4Zwm9CNjGV_pkgKJedbvs_GjsgGvH7kPLRjhySPQ73aI06_459iSYwjyDjC-fMIva0m2yayeYFWxYBD33ssp2dYZSibrW225zNDbxDoK8G8NB4nKJ8mCQAhjrBKrm-0ETLelRaWW15DbyaBCOpGLILJ4SulnHq_aoGPmeJJE7XG4oBWju4-HdV6b9X84XhkWxYPGG2SnMj27R45T9waYJSlSR6H79_GuQsMlnXm0gGYWmk3inOk1"/>
</div>
<h2 class="font-display text-2xl font-bold text-primary mb-3">No items found.</h2>
<p class="font-body text-on-surface-variant leading-relaxed max-w-sm mb-10">
                Your financial catalog is currently empty. Start by creating your first product or charge to manage your financial services.
            </p>
<button class="inline-flex items-center justify-center px-8 py-4 bg-primary text-on-primary font-bold rounded-xl shadow-sm active:scale-95 transition-transform duration-200" id="empty_create_cta">
<span class="material-symbols-outlined mr-2" data-icon="add">add</span>
                + Create First Item
            </button>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline/20">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant group" href="#">
<div class="p-1 px-5 rounded-full transition-all group-active:scale-90">
<span class="material-symbols-outlined text-[24px]" data-icon="home">home</span>
</div>
<span class="font-label text-[0.75rem] font-medium mt-1">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant group" href="#">
<div class="p-1 px-5 rounded-full transition-all group-active:scale-90">
<span class="material-symbols-outlined text-[24px]" data-icon="group">group</span>
</div>
<span class="font-label text-[0.75rem] font-medium mt-1">Clients</span>
</a>
<!-- Collections (Active state placeholder logic) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant group" href="#">
<div class="p-1 px-5 rounded-full transition-all group-active:scale-90">
<span class="material-symbols-outlined text-[24px]" data-icon="payments">payments</span>
</div>
<span class="font-label text-[0.75rem] font-medium mt-1">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant group" href="#">
<div class="p-1 px-5 rounded-full transition-all group-active:scale-90">
<span class="material-symbols-outlined text-[24px]" data-icon="sync">sync</span>
</div>
<span class="font-label text-[0.75rem] font-medium mt-1">Sync</span>
</a>
</nav>
<!-- FAB (Suppressed on details, shown here for quick creation in empty catalog) -->
<button class="fixed bottom-24 right-4 w-14 h-14 bg-secondary text-on-secondary rounded-lg shadow-lg flex items-center justify-center active:scale-90 transition-transform z-40">
<span class="material-symbols-outlined text-[28px]" data-icon="add">add</span>
</button>
<script>
        // Micro-interactions for chip selection
        document.querySelectorAll('.flex-shrink-0').forEach(chip => {
            chip.addEventListener('click', function() {
                document.querySelectorAll('.flex-shrink-0').forEach(c => {
                    c.classList.remove('bg-primary', 'text-on-primary');
                    c.classList.add('border', 'border-outline', 'text-on-surface-variant');
                });
                this.classList.remove('border', 'border-outline', 'text-on-surface-variant');
                this.classList.add('bg-primary', 'text-on-primary');
            });
        });

        // Add touch feedbacks
        const buttons = document.querySelectorAll('button, a');
        buttons.forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.style.opacity = '0.7';
            });
            btn.addEventListener('touchend', function() {
                this.style.opacity = '1';
            });
        });
    </script>
</body></html>
