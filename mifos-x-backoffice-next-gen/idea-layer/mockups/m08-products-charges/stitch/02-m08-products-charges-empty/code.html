<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos Back Office - Product Catalog</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&amp;family=Roboto+Mono:wght@400;500&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px",
                    },
                    fontFamily: {
                        "headline": ["Roboto", "Inter", "sans-serif"],
                        "display": ["Roboto", "Inter", "sans-serif"],
                        "body": ["Roboto", "Inter", "sans-serif"],
                        "label": ["Public Sans", "Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            font-family: 'Roboto', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar: Content & Identity from JSON -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-4">
<button aria-label="Menu" class="p-2 rounded-full hover:bg-surface-variant transition-colors active:opacity-80">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-[1.375rem] font-semibold text-primary leading-tight">Product Catalog</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A clean, professional user avatar portrait for a financial administrator in a minimalist back-office environment. The style is modern and flat, utilizing the primary blue and surface white palette. The lighting is soft and even, suggesting a clinical yet trustworthy digital banking workspace." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmFHH7PC5muTgyz65kZ7N5bveSCyBd95aHvpa3hGqsnejtaCg9Npscz_u-8dW4TRxOKJArPgiEUpBKNCy47q6dhLdDTKZYU86-jfZ_GRIgeb7JWPzvHglGu1v9pBoKjV0PEof1__SQWr-f-z-Gb1MUOkGnMCrdKiJzmysyqUg6LkXdsu7vxHLypHswRYJxZ92FOsLb2wGu9YaErXIs5-htxwdH4Z2boI1bRESoYyT3U1Tx2IGWicFaqF4Ht5JvBok4i3-4969tviHe"/>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-16 mb-20 px-4 md:px-6 lg:px-8 py-6 flex flex-col gap-6 overflow-y-auto no-scrollbar">
<!-- Search Bar -->
<section class="w-full max-w-3xl mx-auto">
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-variant border-none rounded-md text-on-surface focus:ring-2 focus:ring-primary transition-all placeholder:text-on-surface-variant/60" placeholder="Search catalog items..." type="text"/>
</div>
</section>
<!-- Filter Chips -->
<section class="w-full max-w-3xl mx-auto overflow-x-auto no-scrollbar pb-2">
<div class="flex items-center gap-3">
<button class="px-6 py-2 rounded-full bg-primary-container text-on-primary-container font-medium text-[0.875rem] shadow-sm border border-primary/10 whitespace-nowrap active:scale-95 transition-transform">
                    Loan Products
                </button>
<button class="px-6 py-2 rounded-full bg-surface border border-outline text-on-surface-variant font-medium text-[0.875rem] whitespace-nowrap hover:bg-surface-container-low active:scale-95 transition-transform">
                    Savings Products
                </button>
<button class="px-6 py-2 rounded-full bg-surface border border-outline text-on-surface-variant font-medium text-[0.875rem] whitespace-nowrap hover:bg-surface-container-low active:scale-95 transition-transform">
                    Charges
                </button>
</div>
</section>
<!-- Empty State Area -->
<section class="flex-1 flex flex-col items-center justify-center text-center max-w-2xl mx-auto py-12">
<div class="w-64 h-64 mb-8 relative">
<!-- Abstract financial network representation based on prompt reference -->
<div class="absolute inset-0 bg-primary/5 rounded-full animate-pulse"></div>
<img class="w-full h-full object-contain relative z-10" data-alt="A minimalist and friendly vector illustration of a central hub connecting diverse financial icons. The image features a large blue circle containing three smaller profile icons linked by thin geometric lines, representing a community-driven catalog. The color palette is strictly limited to shades of deep blue, soft gray, and white, matching a professional banking interface. The lighting is bright and airy, creating a calm and trustworthy atmosphere for a financial back-office application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBdwrMYPvdwxRu9ADz1RaBpLV0asJtwWPbcn0qwGVp4wWtlm1HJ7_HDLiANZv6RSJXGpHiWvivPsnsv5BkWs0zsyfIi6Tq1A6gi8sGn1eakHOMfaTl0VfOoKFuwqsPZ0QmMmYpkpJ_SdZlQ9o65d3tclp_DNsfgFRqn9pa7kka0KZrO_y8n0t8ePKa-JyK4otRlq8dS2ZAek8J9pK8UcZDcIqjFGw9IZ2HYtHDRr_9I6g2ur0EA_OJ3VJRWFkShxrsUszuvlH_gjSPY"/>
</div>
<h2 class="font-headline text-[1.75rem] font-semibold text-on-surface mb-3">No items found.</h2>
<p class="font-body text-[1rem] text-on-surface-variant leading-relaxed mb-10 px-4">
                Get started by creating your first product or charge to manage your financial services. Your configured products will appear here once they are added to the catalog.
            </p>
<button class="flex items-center gap-2 bg-primary text-on-primary font-medium text-[0.875rem] px-8 py-4 rounded-xl shadow-md hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="add">add</span>
                Create First Item
            </button>
</section>
</main>
<!-- BottomNavBar: Execution from JSON & Conflict Resolution -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe px-2">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low px-4 py-2 transition-colors active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[0.875rem] font-medium mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low px-4 py-2 transition-colors active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-[0.875rem] font-medium mt-1">Clients</span>
</a>
<!-- Collections active mapping based on intent: Product Catalog relates to Collections/Financial Services -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-colors active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-[0.875rem] font-medium mt-1">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low px-4 py-2 transition-colors active:scale-95" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[0.875rem] font-medium mt-1">Sync</span>
</a>
</nav>
<!-- Micro-interaction for filter chips -->
<script>
        document.querySelectorAll('section button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Simplified active state toggle for UI demonstration
                if(this.classList.contains('px-6')) {
                    document.querySelectorAll('section button').forEach(b => {
                        b.classList.remove('bg-primary-container', 'text-on-primary-container');
                        b.classList.add('bg-surface', 'text-on-surface-variant');
                    });
                    this.classList.remove('bg-surface', 'text-on-surface-variant');
                    this.classList.add('bg-primary-container', 'text-on-primary-container');
                }
            });
        });
    </script>
</body></html>
