<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Product Catalog - Error State</title>
<!-- Material Symbols for Icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Design System Configuration -->
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006CB5",
            "on-primary": "#FFFFFF",
            "primary-container": "#CBE6FF",
            "on-primary-container": "#001D33",
            "secondary": "#00796B",
            "on-secondary": "#FFFFFF",
            "secondary-container": "#B8F2E6",
            "on-secondary-container": "#00201A",
            "tertiary": "#5B5891",
            "on-tertiary": "#FFFFFF",
            "tertiary-container": "#E3DFFF",
            "on-tertiary-container": "#17124B",
            "surface": "#FCFCFF",
            "on-surface": "#1A1C1E",
            "surface-variant": "#DEE3EB",
            "on-surface-variant": "#42474E",
            "surface-container-low": "#F3F4F9",
            "background": "#FCFCFF",
            "on-background": "#1A1C1E",
            "outline": "#72777F",
            "success": "#2E7D32",
            "warning": "#F57C00",
            "warning-strong": "#B45309",
            "error": "#BA1A1A",
            "on-error": "#FFFFFF",
            "error-container": "#FFDAD6",
            "on-error-container": "#410002",
          },
          borderRadius: {
            "sm": "4px",
            "md": "8px",
            "lg": "16px",
            "xl": "28px",
            "full": "9999px"
          },
          spacing: {
            "xs": "4px",
            "sm": "8px",
            "md": "16px",
            "lg": "24px",
            "xl": "32px",
            "xxl": "48px",
          },
          fontFamily: {
            "headline": ["Roboto", "sans-serif"],
            "body": ["Roboto", "sans-serif"],
            "label": ["Roboto", "sans-serif"],
            "mono": ["Roboto Mono", "monospace"]
          },
          fontSize: {
            "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
            "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
            "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
            "body": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
            "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
            "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }],
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #FCFCFF;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .active-nav-pill {
      height: 32px;
      width: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background-color: #CBE6FF;
      color: #001D33;
    }
    /* Subtle pulsing effect for the error illustration shards */
    @keyframes drift {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .shard {
      animation: drift 3s ease-in-out infinite;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface text-primary border-b border-outline flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant transition-colors rounded-full flex items-center justify-center active:opacity-80">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold">Product Catalog</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline cursor-pointer active:opacity-80 transition-colors">
<img class="w-full h-full object-cover" data-alt="A professional portrait of a financial administrator in a clean modern office, soft high-key lighting, focused on their desk which has a tablet showing banking dashboards. The overall aesthetic is clinical, trustworthy, and minimal with deep blue and teal accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBp7m5Mc4dsJtlY3gRYVTc9L4bf1m80K6mpznOiMNgSc_df3lbeKIwmS4bgMsi0Iz6h-DJ8k9EQqkL2nJFK9npFmuWNAj67UkhzasEO73PxQnE_zt_VGAM3P3NnT_X_fibmloBQBqHKKlPE_cPORwDdYjnISbuTtEW3gAvwO44ewxc4uB3jkkpq0o4j0a7NYOddXwXIl5cpSqnF-4K-tqBeZ1gfziuIk9jhGBQOKUEcjDSzOM6O4eXvMnXsSM1cI8VvGsBLsnHs75fA"/>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-start justify-center px-lg py-xxl mt-16 mb-20 overflow-hidden">
<!-- Professional Error Illustration Section -->
<div class="w-full max-w-sm">
<!-- Error Illustration Wrapper (Matching the provided style) -->
<div class="relative w-full aspect-square mb-lg flex items-center justify-center">
<!-- Background Grid/Chart Elements -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<div class="h-full w-full grid grid-cols-4 grid-rows-4 border border-outline border-dashed"></div>
</div>
<!-- Abstract Broken Data Stream Visualization -->
<div class="relative w-full h-full flex items-center justify-center">
<div class="w-3/4 h-3/4 relative">
<!-- Line Fragment -->
<svg class="absolute inset-0 w-full h-full" viewbox="0 0 400 400">
<polyline fill="none" points="0,300 80,240 160,280 240,180 300,220" stroke="#006CB5" stroke-width="4"></polyline>
<!-- Shattered Point -->
<circle cx="300" cy="220" fill="#006CB5" r="8"></circle>
<!-- Shard clusters around the failure point -->
<path class="shard" d="M310,230 L330,210 L340,240 Z" fill="#72777F" style="animation-delay: 0.2s"></path>
<path class="shard" d="M280,250 L300,270 L270,280 Z" fill="#DEE3EB" style="animation-delay: 0.5s"></path>
<circle class="shard" cx="350" cy="200" fill="#006CB5" r="6" style="animation-delay: 0.8s"></circle>
<rect class="shard" fill="#006CB5" height="12" transform="rotate(45 326 266)" width="12" x="320" y="260"></rect>
<path class="shard" d="M360,250 L380,260 L370,280 Z" fill="#72777F" style="animation-delay: 1.1s"></path>
</svg>
<!-- Central Error Icon Shield -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-surface border-2 border-on-surface p-4 rounded-lg shadow-sm z-10">
<span class="material-symbols-outlined text-4xl text-on-surface" data-icon="cloud_off" style="font-variation-settings: 'wght' 500;">cloud_off</span>
</div>
</div>
</div>
</div>
<!-- Error Text Content -->
<div class="space-y-sm animate-in fade-in slide-in-from-bottom-4 duration-500">
<h2 class="text-h2 text-on-surface font-semibold">Data Connection Error</h2>
<p class="text-body text-on-surface-variant max-w-xs">
          Unable to load products. The visualization stream has been interrupted or timed out.
        </p>
</div>
<!-- Action Area -->
<div class="mt-xl">
<button class="w-full sm:w-auto bg-primary text-on-primary text-label font-medium rounded-xl px-lg py-md shadow-none hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2" id="retry_button">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
          Retry
        </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe px-2">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform w-16">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-caption mt-1">Home</span>
</button>
<!-- Clients (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform w-16">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-caption mt-1">Clients</span>
</button>
<!-- Collections (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform w-16">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-caption mt-1">Collections</span>
</button>
<!-- Sync (Active Logic: Assuming Sync status context for the error) -->
<!-- Note: While 'Product Catalog' isn't explicitly one of the four tabs, 
         Sync is the closest intent-match for a data loading error screen. -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform w-16">
<div class="active-nav-pill">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</div>
<span class="font-label text-caption font-medium mt-1 text-on-primary-container">Sync</span>
</button>
</nav>
<script>
    // Micro-interaction for retry button
    document.getElementById('retry_button').addEventListener('click', function() {
      const icon = this.querySelector('.material-symbols-outlined');
      icon.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
      icon.style.transform = 'rotate(360deg)';
      
      setTimeout(() => {
        icon.style.transform = 'rotate(0deg)';
        // In a real app, this would trigger a re-fetch
      }, 600);
    });
  </script>
</body></html>
