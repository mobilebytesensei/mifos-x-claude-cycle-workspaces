<style>

            border: 1px solid #DEE3E3;
        }
        .error-vignette {
            background: radial-gradient(circle, rgba(255,255,255,0) 0%, rgba(186,26,26,0.03) 100%);

    body {

<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="account_balance">account_balance</span>
<h1 class="font-headline-sm text-headline-sm text-primary dark:text-primary-fixed-dim font-bold">Product Catalog</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional corporate headshot of a female financial administrator in a modern office. The lighting is bright and clean, emphasizing a professional light-mode aesthetic with teal and gray accents. The style is crisp and high-definition, suitable for a financial software user profile." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqCxB4Ral1ghfRaGtBvUO6pF7payNTLqY4Ea920abmy1jKGcdbTsoQ8jqn6h3GZ2c6kX-BiIqaNrX9656HQ3RMjRWlZGIVHVz9ogVsD_fMwBJJdu8DYRfTk1xZHkeh9KRu6tulkvlx59g4oPjoMOtUZxj7U9eMMoQgw-QZ0XFc1WANm__QB9TwupsZA5KJLBrvl7OBAuFRHGvx3oDCH55nk00Z3GTciL_zd0JmqKLWrTAlBskZdT7g_OUPxfgeDXTbFMQiJxA9WMs"/>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile error-vignette">
<!-- Error Content Container -->
<div class="w-full max-w-sm flex flex-col items-center text-center space-y-6">
<!-- Illustration / Icon -->
<div class="relative w-48 h-48 mb-4 flex items-center justify-center">
<div class="absolute inset-0 bg-error-container rounded-full opacity-20 animate-pulse"></div>
<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-error text-8xl mb-2" style="font-variation-settings: 'opsz' 48;">cloud_off</span>
</div>
<!-- Decorative Particles -->
<div class="absolute top-4 right-4 w-3 h-3 rounded-full bg-error opacity-40"></div>
<div class="absolute bottom-8 left-2 w-2 h-2 rounded-full bg-error opacity-20"></div>
</div>
<!-- Error Message -->
<div class="space-y-3">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-bold tracking-tight">
                    Unable to load products
                </h2>
<p class="font-body-md text-body-md text-on-surface-variant px-4">
                    Please check your connection and try again. If the issue persists, contact your system administrator.
                </p>
</div>
<!-- Action -->
<div class="w-full pt-4 px-8">
<button class="w-full h-12 bg-primary text-on-primary font-label-lg text-label-lg rounded-xl shadow-sm hover:bg-primary-container active:scale-95 transition-all flex items-center justify-center gap-2" id="retry_button">
<span class="material-symbols-outlined text-sm" data-icon="refresh">refresh</span>
                    Retry
                </button>
</div>
<!-- Secondary Detail (Optional/Subtle) -->
<div class="pt-8 opacity-40">
<p class="font-label-md text-label-md uppercase tracking-widest text-outline">
                    Error Code: 503_SERVICE_UNAVAILABLE
                </p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-2 z-50 border-t border-outline-variant dark:border-outline bg-surface dark:bg-inverse-surface">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-on-surface-variant/10 active:scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-on-surface-variant/10 active:scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-label-md text-label-md">Clients</span>
</a>
<!-- Active Tab: Collections (Semantic match for "Product Catalog" context in some ledger systems) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-4 py-1 active:scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-label-md text-label-md">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-on-surface-variant/10 active:scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="sync">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</a>
</nav>
<!-- Micro-interaction for retry button -->
<script>
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            
            // Temporary loading state
            btn.disabled = true;
            btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin text-sm" style="font-variation-settings: 'wght' 400;">sync</span>
                Retrying...
            `;
            
            // Simulate a network request
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                // Add a subtle shake or pulse to indicate the request finished but still errored (since this is an error state design)
                btn.classList.add('animate-pulse');
                setTimeout(() => btn.classList.remove('animate-pulse'), 1000);
            }, 1500);
        });
    </script>
</body></html>
