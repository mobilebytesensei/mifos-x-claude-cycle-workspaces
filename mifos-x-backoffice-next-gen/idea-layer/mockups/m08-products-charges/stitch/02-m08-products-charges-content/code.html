<!DOCTYPE html>

            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

<style>

<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline dark:border-outline fixed top-0 w-full z-50 flex justify-between items-center px-4 h-16 transition-colors duration-200">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant/50 transition-colors rounded-full text-on-surface">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-[1.375rem] font-bold text-on-surface">Product Catalog</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-outline/20">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial administrator with a clean, well-lit studio background. The style is modern and corporate with soft lighting and high clarity. The overall aesthetic is trustworthy and focused, matching a clinical banking application's visual language." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAS2i6dslU_Pb3es133Kj2hzIbYx-P2KU3W8DJOWB1pSfny5o_PXJJYBRzEFOAd__a8uU68g_3YdxvdmjYVxIMZr6g1IaED3MQL1e8JiS2pIoy8Z1Zv3DSBtr7D5Kpukl-CbKFy5IFME2gtU9UQ2EPNL0LbOZQdPHR20d8oM01vRY38ior1a2ltdHbB8KA1Wd3NXIztjUS9y2hvp1Xne9l8-9ddZRxIis9HG9WvTc9SSTIW_B45t-LN3mMQWs9RdC6Y2Nmrv1pVgLXd"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 mb-20 px-4 py-6 max-w-xl mx-auto w-full space-y-6">
<!-- 1. Page Header -->
<section>
<h2 class="text-[2rem] font-bold text-on-surface tracking-tight leading-tight">Product Catalog</h2>
</section>
<!-- 2. Filter Chips -->
<section class="flex gap-2 overflow-x-auto hide-scrollbar -mx-4 px-4">
<button class="px-4 py-1.5 rounded-full bg-primary-container text-on-primary-container font-medium text-[0.875rem] transition-transform active:scale-95 whitespace-nowrap">
                All
            </button>
<button class="px-4 py-1.5 rounded-full border border-outline text-on-surface-variant font-medium text-[0.875rem] hover:bg-surface-variant/30 transition-all active:scale-95 whitespace-nowrap">
                Loan Products
            </button>
<button class="px-4 py-1.5 rounded-full border border-outline text-on-surface-variant font-medium text-[0.875rem] hover:bg-surface-variant/30 transition-all active:scale-95 whitespace-nowrap">
                Savings Products
            </button>
<button class="px-4 py-1.5 rounded-full border border-outline text-on-surface-variant font-medium text-[0.875rem] hover:bg-surface-variant/30 transition-all active:scale-95 whitespace-nowrap">
                Charges
            </button>
</section>
<!-- 3. Search Field -->
<section>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="search">search</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-variant text-on-surface rounded-md border-none ring-1 ring-inset ring-outline/30 focus:ring-2 focus:ring-primary placeholder:text-on-surface-variant/60 transition-all" placeholder="Search catalog items..." type="text"/>
</div>
</section>
<!-- 4. Content Section Label -->
<section>
<h3 class="text-[1.125rem] font-semibold text-on-surface-variant flex items-center justify-between">
                Active Catalog (2)
                <span class="material-symbols-outlined text-[1.25rem]" data-icon="inventory_2">inventory_2</span>
</h3>
</section>
<!-- 5. List of Catalog Items -->
<section class="space-y-3">
<!-- Item 1 -->
<div class="group bg-surface border border-outline/20 p-4 rounded-lg flex items-center justify-between hover:bg-surface-container-low transition-colors cursor-pointer active:scale-[0.99]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="account_balance">account_balance</span>
</div>
<div>
<p class="font-semibold text-on-surface">Group Business Loan</p>
<div class="mt-1 flex items-center gap-2">
<span class="bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-sm text-[0.75rem] font-bold uppercase tracking-wider">Active</span>
</div>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
<!-- Item 2 -->
<div class="group bg-surface border border-outline/20 p-4 rounded-lg flex items-center justify-between hover:bg-surface-container-low transition-colors cursor-pointer active:scale-[0.99]">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<div>
<p class="font-semibold text-on-surface">Individual Micro Loan</p>
<div class="mt-1 flex items-center gap-2">
<span class="bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-sm text-[0.75rem] font-bold uppercase tracking-wider">Active</span>
</div>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
</section>
<!-- 6. Primary Action Buttons -->
<section class="grid grid-cols-1 gap-2">
<button class="w-full flex items-center justify-center gap-2 bg-primary text-on-primary py-4 rounded-xl font-medium shadow-sm hover:brightness-110 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="add">add</span>
                Create Loan Product
            </button>
<div class="grid grid-cols-2 gap-2">
<button class="flex items-center justify-center gap-2 border border-outline text-primary py-3 rounded-xl font-medium hover:bg-primary/5 active:scale-95 transition-all text-[0.875rem]">
<span class="material-symbols-outlined text-[1.25rem]" data-icon="savings">savings</span>
                    Create Savings
                </button>
<button class="flex items-center justify-center gap-2 border border-outline text-primary py-3 rounded-xl font-medium hover:bg-primary/5 active:scale-95 transition-all text-[0.875rem]">
<span class="material-symbols-outlined text-[1.25rem]" data-icon="payments">payments</span>
                    Create Charge
                </button>
</div>
<div class="grid grid-cols-2 gap-2">
<button class="flex items-center justify-center gap-2 border border-outline text-primary py-3 rounded-xl font-medium hover:bg-primary/5 active:scale-95 transition-all text-[0.875rem]">
<span class="material-symbols-outlined text-[1.25rem]" data-icon="account_balance_wallet">account_balance_wallet</span>
                    Create Fund
                </button>
<button class="flex items-center justify-center gap-2 border border-outline text-primary py-3 rounded-xl font-medium hover:bg-primary/5 active:scale-95 transition-all text-[0.875rem]">
<span class="material-symbols-outlined text-[1.25rem]" data-icon="gavel">gavel</span>
                    Create Tax Group
                </button>
</div>
</section>
<!-- 7. Batch/Management Actions -->
<section class="pt-4 border-t border-outline/10 space-y-3">
<div class="flex gap-2">
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-variant/50 text-on-surface-variant py-3 rounded-md font-medium hover:bg-surface-variant transition-colors text-[0.875rem]">
<span class="material-symbols-outlined text-[1.125rem]" data-icon="edit">edit</span>
                    Edit Product
                </button>
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-variant/50 text-on-surface-variant py-3 rounded-md font-medium hover:bg-surface-variant transition-colors text-[0.875rem]">
<span class="material-symbols-outlined text-[1.125rem]" data-icon="history">history</span>
                    Edit Charge
                </button>
</div>
<button class="w-full flex items-center justify-center gap-2 border border-error text-error py-3 rounded-md font-medium hover:bg-error/5 transition-colors text-[0.875rem]">
<span class="material-symbols-outlined text-[1.125rem]" data-icon="delete">delete</span>
                Delete Product
            </button>
</section>
<!-- 8. Toggle Switch -->
<section class="bg-surface-container-low p-4 rounded-lg flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="bolt">bolt</span>
<span class="font-medium text-on-surface">Charge Active</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-outline/30 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</section>
<!-- 9. System/Banner area -->
<section class="bg-secondary-container text-on-secondary-container p-4 rounded-lg flex items-center justify-between border border-secondary/20">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined" data-icon="info">info</span>
<p class="text-[0.875rem] font-medium">Connect to Edit</p>
</div>
<button class="text-[0.875rem] font-bold underline decoration-2 underline-offset-4 hover:opacity-80 transition-opacity">
                Retry
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-surface dark:bg-surface border-t border-outline dark:border-outline shadow-[0_-4px_12px_rgba(0,0,0,0.05)] transition-colors">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant py-1 hover:bg-surface-variant/30 rounded-lg transition-all scale-95 active:scale-90 flex-1" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[0.75rem] font-medium mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant py-1 hover:bg-surface-variant/30 rounded-lg transition-all scale-95 active:scale-90 flex-1" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-[0.75rem] font-medium mt-1">Clients</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container dark:bg-primary-container dark:text-on-primary-container rounded-full px-5 py-1 transition-all scale-100 flex-1" href="#">
<span class="material-symbols-outlined" data-icon="payments" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label text-[0.75rem] font-bold mt-0.5">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant py-1 hover:bg-surface-variant/30 rounded-lg transition-all scale-95 active:scale-90 flex-1" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[0.75rem] font-medium mt-1">Sync</span>
</a>
</nav>
<script>
        // Simple logic to handle visual selection of filter chips
        const filterChips = document.querySelectorAll('section:nth-of-type(2) button');
        filterChips.forEach(chip => {
            chip.addEventListener('click', () => {
                filterChips.forEach(c => {
                    c.classList.remove('bg-primary-container', 'text-on-primary-container');
                    c.classList.add('border', 'border-outline', 'text-on-surface-variant');
                });
                chip.classList.add('bg-primary-container', 'text-on-primary-container');
                chip.classList.remove('border', 'border-outline', 'text-on-surface-variant');
            });
        });
    </script>
</body></html>
