<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Product Catalog - Banking Ops</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {

        theme: {
          extend: {
            "colors": {

                    "surface-variant": "#e0e3e3",
                    "tertiary-fixed": "#a0f0f0",
                    "background": "#f7fafa",
                    "tertiary": "#006565",
                    "on-background": "#181c1d",
                    "inverse-primary": "#76d6d5",
                    "primary-container": "#008080",

                    "on-primary": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-tint": "#006a6a",
                    "outline": "#6e7979",
                    "on-secondary-container": "#506969",
                    "surface-container-lowest": "#ffffff",
                    "inverse-on-surface": "#eef1f1",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#cce8e7",
                    "secondary": "#4a6363",
                    "error-container": "#ffdad6",
                    "surface-container-highest": "#e0e3e3",
                    "secondary-fixed-dim": "#b1cccb",
                    "primary": "#006565",
                    "on-secondary": "#ffffff",
                    "on-tertiary-fixed-variant": "#004f4f",

                    "on-secondary-fixed": "#051f20",
                    "on-surface-variant": "#3e4949",

                    "primary-fixed-dim": "#76d6d5",
                    "on-error": "#ffffff",
                    "surface-container-low": "#f1f4f4",
                    "secondary-fixed": "#cce8e7",
                    "inverse-surface": "#2d3131",
                    "surface": "#f7fafa",
                    "on-primary-container": "#e3fffe",
                    "on-tertiary-container": "#e0fffe",
                    "surface-container": "#ebeeee",
                    "on-surface": "#181c1d",

                    "tertiary-container": "#277e7e",
                    "tertiary-fixed-dim": "#84d4d3",
                    "surface-dim": "#d7dbdb",

                    "error": "#ba1a1a"

            "borderRadius": {
                    "DEFAULT": "0.25rem",

                    "xl": "0.75rem",

            },
            "spacing": {
                    "gutter": "16px",
                    "margin-desktop": "24px",
                    "container-max-width": "1440px",
                    "unit": "4px",

            },
            "fontFamily": {
                    "body-md": ["Roboto Flex"],
                    "label-md": ["Roboto Flex"],
                    "title-md": ["Roboto Flex"],
                    "title-lg": ["Roboto Flex"],
                    "headline-sm": ["Roboto Flex"],
                    "label-lg": ["Roboto Flex"],
                    "headline-lg": ["Roboto Flex"],
                    "body-lg": ["Roboto Flex"],
                    "display-lg": ["Roboto Flex"]
            },
            "fontSize": {
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .skeleton {
            background: linear-gradient(90deg, #e0e3e3 25%, #ebeeee 50%, #e0e3e3 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .fab-menu-enter {
            transform: scale(0) translateY(20px);
            opacity: 0;
        }
        .fab-menu-active {
            transform: scale(1) translateY(0);
            opacity: 1;
        }
        body { font-family: 'Roboto Flex', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile h-16 transition-colors duration-200" id="header">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container-high rounded-full p-2 transition-colors">menu</span>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary">Product Catalog</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-container-high rounded-full p-2 transition-colors">search</span>
</div>
</header>
<!-- Scrollable Content Container -->
<main class="flex-1 overflow-y-auto pb-32">
<!-- Banner Actions -->
<div class="px-margin-mobile py-4 flex gap-2">
<button class="flex-1 bg-primary-container text-on-primary-container font-label-lg text-label-lg py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-[18px]">bolt</span>
                Connect to Edit
            </button>
<button class="bg-secondary-container text-on-secondary-container font-label-lg text-label-lg py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-transform active:scale-95 border border-outline-variant">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                Retry
            </button>
</div>
<!-- Catalog Tabs (Chips) -->
<div class="flex overflow-x-auto px-margin-mobile gap-2 pb-4 no-scrollbar" id="catalog_tabs">
<button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md border border-outline-variant transition-colors">Loan Products</button>
<button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-md text-label-md transition-colors hover:bg-surface-variant">Savings Products</button>
<button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-md text-label-md transition-colors hover:bg-surface-variant">Charges</button>
<button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-md text-label-md transition-colors hover:bg-surface-variant">Funds</button>
<button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-md text-label-md transition-colors hover:bg-surface-variant">Tax Groups</button>
</div>
<!-- Search Field -->
<div class="px-margin-mobile mb-6" id="catalog_search_field">
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant">search</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low border-b border-outline text-on-surface rounded-t-lg focus:outline-none focus:border-primary transition-colors font-body-md text-body-md" placeholder="Search products..." type="text"/>
</div>
</div>
<!-- Toggle Switch Section -->
<div class="px-margin-mobile mb-6 flex items-center justify-between p-4 bg-surface-container-low rounded-xl border border-outline-variant">
<div>
<p class="font-title-md text-title-md text-on-surface">Toggle Charge Active</p>
<p class="font-body-md text-body-md text-on-surface-variant">Show only active product charges</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Loading State Content Area -->
<div class="px-margin-mobile space-y-4" id="catalog_list">
<!-- Row 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex gap-4 animate-pulse" id="catalog_row">
<div class="w-12 h-12 rounded-lg skeleton shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-3/4 skeleton rounded"></div>
<div class="h-3 w-1/2 skeleton rounded opacity-70"></div>
<div class="flex gap-2 pt-2">
<div class="h-6 w-16 skeleton rounded-full"></div>
<div class="h-6 w-24 skeleton rounded-full"></div>
</div>
</div>
</div>
<!-- Row 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex gap-4 animate-pulse">
<div class="w-12 h-12 rounded-lg skeleton shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-2/3 skeleton rounded"></div>
<div class="h-3 w-1/3 skeleton rounded opacity-70"></div>
<div class="flex gap-2 pt-2">
<div class="h-6 w-20 skeleton rounded-full"></div>
</div>
</div>
</div>
<!-- Row 3 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex gap-4 animate-pulse">
<div class="w-12 h-12 rounded-lg skeleton shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-4/5 skeleton rounded"></div>
<div class="h-3 w-1/4 skeleton rounded opacity-70"></div>
</div>
</div>
<!-- Row 4 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex gap-4 animate-pulse">
<div class="w-12 h-12 rounded-lg skeleton shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-1/2 skeleton rounded"></div>
<div class="h-3 w-1/2 skeleton rounded opacity-70"></div>
</div>
</div>
</div>
<!-- Empty State CTA (Secondary) -->
<div class="mt-8 px-margin-mobile text-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Don't see your items? Try starting fresh.</p>
<button class="inline-flex items-center gap-2 px-6 py-2 rounded-full border border-primary text-primary font-label-lg text-label-lg hover:bg-primary-fixed transition-colors active:scale-95">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
                Create First Charge
            </button>
</div>
<!-- Subtle Action Buttons Cluster -->
<div class="mt-8 px-margin-mobile flex flex-wrap justify-center gap-4 border-t border-outline-variant pt-6 opacity-40 grayscale pointer-events-none">
<button class="text-on-surface-variant font-label-md text-label-md flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">edit</span> Edit Product
            </button>
<button class="text-on-surface-variant font-label-md text-label-md flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">settings</span> Edit Charge
            </button>
<button class="text-error font-label-md text-label-md flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">delete</span> Delete Product
            </button>
</div>
</main>
<!-- FAB Menu System -->
<div class="fixed bottom-24 right-6 flex flex-col items-end gap-3 z-50">
<!-- Expanded FAB Actions (hidden by default) -->
<div class="flex flex-col items-end gap-3 transition-all duration-300 transform origin-bottom scale-0 opacity-0 mb-2 pointer-events-none" id="fab_menu">
<div class="flex items-center gap-3">
<span class="bg-surface-container shadow-sm px-3 py-1 rounded text-label-md font-label-md text-on-surface">Create Tax Group</span>
<button class="w-10 h-10 rounded-full bg-secondary text-on-secondary shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">account_balance_wallet</span>
</button>
</div>
<div class="flex items-center gap-3">
<span class="bg-surface-container shadow-sm px-3 py-1 rounded text-label-md font-label-md text-on-surface">Create Fund</span>
<button class="w-10 h-10 rounded-full bg-secondary text-on-secondary shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">savings</span>
</button>
</div>
<div class="flex items-center gap-3">
<span class="bg-surface-container shadow-sm px-3 py-1 rounded text-label-md font-label-md text-on-surface">Create Charge</span>
<button class="w-10 h-10 rounded-full bg-secondary text-on-secondary shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">payments</span>
</button>
</div>
<div class="flex items-center gap-3">
<span class="bg-surface-container shadow-sm px-3 py-1 rounded text-label-md font-label-md text-on-surface">Create Savings Product</span>
<button class="w-10 h-10 rounded-full bg-secondary text-on-secondary shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">account_balance</span>
</button>
</div>
<div class="flex items-center gap-3">
<span class="bg-surface-container shadow-sm px-3 py-1 rounded text-label-md font-label-md text-on-surface">Create Loan Product</span>
<button class="w-10 h-10 rounded-full bg-secondary text-on-secondary shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">request_quote</span>
</button>
</div>
</div>
<!-- Primary Trigger FAB -->
<button class="w-14 h-14 rounded-2xl bg-primary text-on-primary shadow-xl flex items-center justify-center transition-transform active:scale-90" id="fab_trigger" onclick="toggleFabMenu()">
<span class="material-symbols-outlined text-[24px]" id="fab_icon">add</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-20 pb-safe px-2 bg-surface-container-low z-50 shadow-sm">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-transform active:scale-90 hover:bg-surface-container-highest rounded-full">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-transform active:scale-90 hover:bg-surface-container-highest rounded-full">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md">Clients</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 transition-transform active:scale-90">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-md text-label-md">Collections</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 transition-transform active:scale-90 hover:bg-surface-container-highest rounded-full">
<span class="material-symbols-outlined">sync</span>
<span class="font-label-md text-label-md">Sync</span>
</div>
</nav>
<script>
        let fabOpen = false;
        const menu = document.getElementById('fab_menu');
        const trigger = document.getElementById('fab_trigger');
        const icon = document.getElementById('fab_icon');

        function toggleFabMenu() {
            fabOpen = !fabOpen;
            if (fabOpen) {
                menu.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                menu.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
                icon.innerText = 'close';
                trigger.classList.remove('bg-primary');
                trigger.classList.add('bg-tertiary-container');
            } else {
                menu.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                menu.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
                icon.innerText = 'add';
                trigger.classList.remove('bg-tertiary-container');
                trigger.classList.add('bg-primary');
            }
        }
        
        // Hide FAB menu on scroll
        document.querySelector('main').addEventListener('scroll', () => {
            if (fabOpen) toggleFabMenu();
        });
    </script>
</body></html>
