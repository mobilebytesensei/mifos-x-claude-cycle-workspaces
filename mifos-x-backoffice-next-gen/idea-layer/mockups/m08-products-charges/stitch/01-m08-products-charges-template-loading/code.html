<script>
        // Micro-interaction: Subtle shimmer randomization or loading sequence
        document.addEventListener('DOMContentLoaded', () => {
            const shimmers = document.querySelectorAll('.shimmer');
            shimmers.forEach((el, index) => {
                // Slightly stagger the animation start for a more natural feel
                el.style.animationDelay = `${index * 0.05}s`;
            });
        });
