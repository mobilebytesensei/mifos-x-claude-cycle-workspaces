<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .shimmer {
            background: linear-gradient(90deg, #DEE3EB 25%, #E8EDF4 50%, #DEE3EB 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;

<script>
        // Simple micro-interaction for the skeletons (opacity pulse)
        document.addEventListener('DOMContentLoaded', () => {
            const skeletons = document.querySelectorAll('.shimmer');
            
            // Randomize starting delay of shimmers for a more organic feel
            skeletons.forEach(el => {
                const delay = Math.random() * 1.5;
                el.style.animationDelay = `${delay}s`;
            });
        });
    </script>
