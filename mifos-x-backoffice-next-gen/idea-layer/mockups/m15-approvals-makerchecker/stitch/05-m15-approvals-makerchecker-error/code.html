<span class="material-symbols-outlined text-[20px]">refresh</span>

<span class="font-label text-[10px] mt-0.5">Sync</span>
</a>

<script>
        // Simple micro-interaction for the retry button
        document.querySelector('button[onclick="location.reload()"]').addEventListener('mousedown', function() {
            this.classList.add('scale-95');
        });
        document.querySelector('button[onclick="location.reload()"]').addEventListener('mouseup', function() {
            this.classList.remove('scale-95');
        });
    </script>
