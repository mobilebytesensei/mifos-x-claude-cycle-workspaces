<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght,GRAD@8..144,25..151,100..1000,-200..150&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-fixed": "#002020",
                    "outline-variant": "#bdc9c8",
                    "primary": "#006565",
                    "on-error-container": "#93000a",
                    "on-primary-fixed": "#002020",
                    "tertiary": "#006565",
                    "surface-bright": "#f7fafa",
                    "surface-container": "#ebeeee",
                    "on-tertiary-container": "#e0fffe",
                    "error": "#ba1a1a",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-primary": "#ffffff",
                    "secondary-container": "#cce8e7",
                    "surface-container-highest": "#e0e3e3",
                    "outline": "#6e7979",
                    "error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#84d4d3",
                    "background": "#f7fafa",
                    "surface": "#f7fafa",
                    "secondary": "#4a6363",
                    "surface-tint": "#006a6a",
                    "on-tertiary": "#ffffff",
                    "on-secondary-container": "#506969",
                    "secondary-fixed-dim": "#b1cccb",
                    "inverse-surface": "#2d3131",
                    "tertiary-container": "#277e7e",
                    "primary-container": "#008080",
                    "on-tertiary-fixed-variant": "#004f4f",
                    "on-primary-fixed-variant": "#004f4f",
                    "on-surface": "#181c1d",
                    "secondary-fixed": "#cce8e7",
                    "surface-variant": "#e0e3e3",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#76d6d5",
                    "surface-dim": "#d7dbdb",
                    "inverse-on-surface": "#eef1f1",
                    "primary-fixed": "#93f2f2",
                    "on-secondary-fixed": "#051f20",
                    "surface-container-low": "#f1f4f4",
                    "on-secondary-fixed-variant": "#324b4b",
                    "on-surface-variant": "#3e4949",
                    "inverse-primary": "#76d6d5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "24px",
                    "container-max-width": "1440px",
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "display-lg": ["Roboto Flex"],
                    "headline-sm": ["Roboto Flex"],
                    "body-lg": ["Roboto Flex"],
                    "title-md": ["Roboto Flex"],
                    "body-md": ["Roboto Flex"],
                    "label-lg": ["Roboto Flex"],
                    "headline-lg": ["Roboto Flex"],
                    "title-lg": ["Roboto Flex"],
                    "label-md": ["Roboto Flex"]
            },
            "fontSize": {
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #f7fafa;
            color: #181c1d;
            font-family: 'Roboto Flex', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #bdc9c8;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen bg-background">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface border-b border-outline-variant flex justify-between items-center px-margin-mobile md:px-margin-desktop py-4 transition-colors duration-200 h-16">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="account_balance">account_balance</span>
<h1 class="font-title-lg text-title-lg font-bold text-primary">Pending Approvals</h1>
</div>
<div class="flex items-center gap-2">
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="search">search</span>
</button>
<button class="p-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col w-full max-w-[1440px] mx-auto overflow-y-auto custom-scrollbar pb-24">
<!-- Segmented Control Area -->
<div class="px-margin-mobile md:px-margin-desktop pt-6 pb-4">
<label class="font-label-lg text-label-lg text-on-surface-variant mb-3 block uppercase tracking-wider">Group by Entity</label>
<div class="flex w-full md:w-fit border border-outline rounded-lg overflow-hidden" id="group_by_selector">
<button class="flex-1 md:px-6 py-2.5 font-label-lg text-label-lg bg-secondary-container text-on-secondary-container border-r border-outline transition-colors">Entity</button>
<button class="flex-1 md:px-6 py-2.5 font-label-lg text-label-lg bg-surface hover:bg-surface-container-high text-on-surface-variant border-r border-outline transition-colors">Action</button>
<button class="flex-1 md:px-6 py-2.5 font-label-lg text-label-lg bg-surface hover:bg-surface-container-high text-on-surface-variant transition-colors">Maker</button>
</div>
</div>
<!-- Filter Bar -->
<div class="px-margin-mobile md:px-margin-desktop flex gap-2 overflow-x-auto no-scrollbar pb-2" id="filter_bar">
<button class="shrink-0 px-4 py-1.5 rounded-full bg-secondary-container text-on-secondary-container font-label-lg text-label-lg border border-outline-variant flex items-center gap-2">
                All
            </button>
<button class="shrink-0 px-4 py-1.5 rounded-full bg-surface text-on-surface-variant font-label-lg text-label-lg border border-outline-variant hover:bg-surface-container-high transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="priority_high">priority_high</span>
                High Priority
            </button>
<button class="shrink-0 px-4 py-1.5 rounded-full bg-surface text-on-surface-variant font-label-lg text-label-lg border border-outline-variant hover:bg-surface-container-high transition-colors flex items-center gap-2">
                Loans
            </button>
<button class="shrink-0 px-4 py-1.5 rounded-full bg-surface text-on-surface-variant font-label-lg text-label-lg border border-outline-variant hover:bg-surface-container-high transition-colors flex items-center gap-2">
                Savings
            </button>
</div>
<!-- Empty State Canvas -->
<div class="flex-1 flex flex-col items-center justify-center px-margin-mobile py-12 text-center max-w-2xl mx-auto">
<!-- Illustration Container -->
<div class="relative w-64 h-64 mb-8 group">
<!-- Decorative background elements -->
<div class="absolute inset-0 bg-secondary-container opacity-20 rounded-full blur-3xl scale-125 group-hover:scale-150 transition-transform duration-1000"></div>
<!-- Main Illustration Image -->
<div class="relative z-10 w-full h-full rounded-2xl overflow-hidden border border-outline-variant bg-surface-container-lowest flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A sophisticated 3D isometric digital illustration of a clean corporate office desk with a transparent glass tablet showing a checkmark. The environment is bathed in soft teal and white lighting, with minimalist geometric shapes floating in the background. The style is modern, professional, and corporate, representing a state of completed tasks and order. High-quality render with soft ambient occlusion and a calm light-mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrTvSFpoSelc3QjpRmRuux5sYFDWoG4JRf17R2Uu6PeiV8Xsx3l1M9Ba2lfTdextvdJVoOo0d8JhxbD0DBXklMsI4QX0DmegpuMSBM7PPvWegVeJMEkwzwSGauLFZhBJPBE3juZg9yRbttorUl1dRR3Cxt8XUVXetMXKZq9uDsjMidOwJUZrT4IR23Fb5JSfyYG2vxTMr-QG5pzVY-yOnRmD2RyWSK3_Q3XaNWis9b7w9yLz0FllN-V09478h8KDNFcsUZWXQJjxk"/>
</div>
<!-- Decorative floating icon -->
<div class="absolute -bottom-4 -right-4 bg-primary text-on-primary p-4 rounded-full shadow-lg z-20 flex items-center justify-center animate-bounce">
<span class="material-symbols-outlined text-[32px]" data-icon="verified">verified</span>
</div>
</div>
<!-- Empty State Text -->
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-3">No pending approvals found</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-10 max-w-md">
                You're all caught up! Administrative commands awaiting verification will appear here.
            </p>
<!-- Primary CTA -->
<button class="flex items-center gap-2 bg-primary text-on-primary px-8 py-3 rounded-full font-label-lg text-label-lg hover:shadow-lg hover:scale-105 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[20px]" data-icon="open_in_new">open_in_new</span>
                Open Needs Attention Inbox
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 bg-surface border-t border-outline-variant z-50 h-20">
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high rounded-xl transition-colors w-16">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high rounded-xl transition-colors w-16">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-md text-label-md mt-1">Clients</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-95 transition-transform duration-100 w-24">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md mt-0.5">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-container-high rounded-xl transition-colors w-16">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label-md text-label-md mt-1">Sync</span>
</button>
</nav>
<script>
        // Micro-interactions for chips
        document.querySelectorAll('#filter_bar button').forEach(button => {
            button.addEventListener('click', function() {
                // Reset others
                document.querySelectorAll('#filter_bar button').forEach(btn => {
                    btn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                    btn.classList.add('bg-surface', 'text-on-surface-variant');
                });
                // Set active
                this.classList.remove('bg-surface', 'text-on-surface-variant');
                this.classList.add('bg-secondary-container', 'text-on-secondary-container');
            });
        });

        // Micro-interactions for segmented control
        document.querySelectorAll('#group_by_selector button').forEach(button => {
            button.addEventListener('click', function() {
                document.querySelectorAll('#group_by_selector button').forEach(btn => {
                    btn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                    btn.classList.add('bg-surface', 'text-on-surface-variant');
                });
                this.classList.remove('bg-surface', 'text-on-surface-variant');
                this.classList.add('bg-secondary-container', 'text-on-secondary-container');
            });
        });
    </script>
</body></html>
