<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006CB5",
            "on-primary": "#FFFFFF",
            "primary-container": "#CBE6FF",
            "on-primary-container": "#001D33",
            "secondary": "#00796B",
            "on-secondary": "#FFFFFF",
            "secondary-container": "#B8F2E6",
            "on-secondary-container": "#00201A",
            "tertiary": "#5B5891",
            "on-tertiary": "#FFFFFF",
            "tertiary-container": "#E3DFFF",
            "on-tertiary-container": "#17124B",
            "surface": "#FCFCFF",
            "on-surface": "#1A1C1E",
            "surface-variant": "#DEE3EB",
            "on-surface-variant": "#42474E",
            "surface-container-low": "#F3F4F9",
            "background": "#FCFCFF",
            "on-background": "#1A1C1E",
            "outline": "#72777F",
            "success": "#2E7D32",
            "warning": "#F57C00",
            "warning-strong": "#B45309",
            "error": "#BA1A1A",
            "on-error": "#FFFFFF",
            "error-container": "#FFDAD6",
            "on-error-container": "#410002",

          borderRadius: {

          fontFamily: {
            "headline": ["Roboto", "Inter", "sans-serif"],
            "display": ["Inter", "sans-serif"],
            "body": ["Roboto", "Inter", "sans-serif"],
            "label": ["Public Sans", "Roboto", "sans-serif"],
            "mono": ["Roboto Mono", "monospace"]
          },
        },
      },
    }
  </script>
<style>
    body {
      background-color: #FCFCFF;
      color: #1A1C1E;
      font-family: 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center px-md h-14 w-full">
<button aria-label="Back" class="mr-md p-2 rounded-full hover:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline text-h1 font-bold text-primary truncate">Permission Set Detail</h1>
</header>
<!-- Main Scrollable Content -->
<main class="flex-1 mt-14 mb-20 overflow-y-auto px-md py-lg flex flex-col gap-md">
<!-- Search Field -->
<div class="relative group" id="psd_search">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">search</span>
</div>
<input aria-label="Search permissions..." class="w-full bg-surface-variant text-on-surface rounded-sm py-4 pl-10 pr-4 border-none focus:ring-2 focus:ring-primary text-body transition-shadow duration-200" placeholder="Search permissions..." type="text"/>
</div>
<!-- Expandable Grouping Section -->
<section class="border border-outline rounded-lg bg-surface overflow-hidden" id="psd_grouping">
<button class="w-full flex items-center justify-between p-md hover:bg-surface-variant transition-colors" onclick="this.nextElementSibling.classList.toggle('hidden')">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">folder_managed</span>
<span class="font-label text-label font-medium text-on-surface">Permission Grouping</span>
</div>
<span class="material-symbols-outlined transition-transform duration-200">expand_more</span>
</button>
<div class="hidden px-md pb-md">
<div class="p-md bg-surface-container-low rounded-md">
<p class="text-caption text-on-surface-variant">Manage logical clusters of permissions across different banking modules.</p>
</div>
</div>
</section>
<!-- Empty State Area -->
<div class="flex-1 flex flex-col items-center justify-center text-center py-xl gap-lg">
<!-- Illustration Placeholder based on user request -->
<div class="relative w-48 h-48 mb-4">
<img class="w-full h-full object-contain" data-alt="A professional and minimalist financial security illustration. It features a stylized digital padlock in soft blue and grey tones at the center, surrounded by a complex circular network of interconnected dots and nodes. The style is clean, clinical, and matches a high-end back-office banking application. The lighting is bright and even, reinforcing a trustworthy and modern light-mode interface aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeZr8PEqdsJP6It7UoQaaoWM0cEDD-G5D9CviOHr9McSktelHwkeN2jzcsh823uHeRTj8Ve5y9D0CatcyNHFTngN--zxUEI_pCTetDTF20zplfTuVH-haT_eCc3qcOmPM_G9ZToXm_ML2QXun7JHwxpfcglqDZemyWL5nSYJQfSawuDCKeKO-8gHCVIbQ0m1gx5wgo2md6UFEMR6iY_f9-p0R9aMdqOzFMzWme8ncLxmK0g9JNq5VMz6RekB4GvEvX3a8j3X_dPNJJ"/>
</div>
<div class="max-w-xs space-y-sm">
<h2 class="font-headline text-[1.75rem] font-bold text-on-surface">No Permissions Found</h2>
<p class="text-body text-on-surface-variant leading-relaxed">
          This permission set is currently empty. Start by adding permissions to define user access levels.
        </p>
</div>
<div class="flex flex-col w-full max-w-sm gap-md">
<!-- Primary Action -->
<button class="bg-primary text-on-primary font-label text-label font-medium rounded-xl py-4 px-xl hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="psd_error_retry">
<span class="material-symbols-outlined text-[20px]">refresh</span>
          Retry
        </button>
<!-- Secondary Action -->
<button class="bg-surface text-primary border border-outline font-label text-label font-medium rounded-xl py-4 px-xl hover:bg-surface-variant active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="psd_copy_fingerprint">
<span class="material-symbols-outlined text-[20px]">fingerprint</span>
          Copy Fingerprint
        </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 px-sm pb-safe">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-[12px] font-medium mt-0.5">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full transition-all" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-[12px] font-medium mt-0.5">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full transition-all" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-label text-[12px] font-medium mt-0.5">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-full transition-all" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[12px] font-medium mt-0.5">Sync</span>
</a>
</nav>
<script>
    // Micro-interaction for buttons
    document.querySelectorAll('button, a').forEach(el => {
      el.addEventListener('mousedown', () => el.style.transform = 'scale(0.96)');
      el.addEventListener('mouseup', () => el.style.transform = 'scale(1)');
      el.addEventListener('mouseleave', () => el.style.transform = 'scale(1)');
    });

    // Expandable Grouping rotation logic
    const groupingBtn = document.querySelector('#psd_grouping button');
    if (groupingBtn) {
      groupingBtn.addEventListener('click', () => {
        const icon = groupingBtn.querySelector('.material-symbols-outlined:last-child');
        icon.style.transform = icon.style.transform === 'rotate(180deg)' ? 'rotate(0deg)' : 'rotate(180deg)';
      });
    }

    // Fingerprint copy feedback
    const copyBtn = document.getElementById('psd_copy_fingerprint');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check</span> Copied';
        copyBtn.classList.replace('text-primary', 'text-success');
        setTimeout(() => {
          copyBtn.innerHTML = originalText;
          copyBtn.classList.replace('text-success', 'text-primary');
        }, 2000);
      });
    }
  </script>
</body></html>
