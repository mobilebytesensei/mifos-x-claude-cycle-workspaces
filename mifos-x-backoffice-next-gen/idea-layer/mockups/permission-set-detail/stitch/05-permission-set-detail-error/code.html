<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Permission Set Detail - Error</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              secondary: "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              tertiary: "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              surface: "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              background: "#FCFCFF",
              "on-background": "#1A1C1E",
              outline: "#72777F",
              success: "#2E7D32",
              warning: "#F57C00",
              "warning-strong": "#B45309",
              error: "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002"
            },
            borderRadius: {
              "DEFAULT": "0.125rem",
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            fontFamily: {
              headline: ["Inter", "Roboto", "sans-serif"],
              display: ["Inter", "Roboto", "sans-serif"],
              body: ["Inter", "Roboto", "sans-serif"],
              label: ["Public Sans", "Roboto", "sans-serif"],
              mono: ["Roboto Mono", "monospace"]
            },
            fontSize: {
              'h1': ['2rem', { lineHeight: '1.25', fontWeight: '700' }],
              'h2': ['1.75rem', { lineHeight: '1.3', fontWeight: '600' }],
              'h3': ['1.375rem', { lineHeight: '1.35', fontWeight: '600' }],
              'body': ['1rem', { lineHeight: '1.5', fontWeight: '400' }],
              'label': ['0.875rem', { lineHeight: '1.4', fontWeight: '500' }],
              'caption': ['0.75rem', { lineHeight: '1.4', fontWeight: '400' }]
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      body {
        background-color: #FCFCFF;
        color: #1A1C1E;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .error-pulse {
        animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse-subtle {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center px-4 h-14 w-full">
<button aria-label="Go back" class="mr-4 p-2 rounded-full hover:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline text-h3 font-bold text-on-surface">Permission Set Detail</h1>
</header>
<!-- Main Content -->
<main class="flex-grow pt-14 pb-20 px-4 md:px-6 lg:max-w-4xl lg:mx-auto w-full">
<!-- Search Field Section -->
<section class="mt-6 mb-4">
<div class="relative group" id="psd_search">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="w-full bg-surface-variant text-on-surface rounded-sm px-10 py-4 border-none focus:ring-2 focus:ring-primary transition-all duration-200 placeholder:text-on-surface-variant font-body" disabled="" placeholder="Search permissions..." type="text"/>
</div>
</section>
<!-- Grouping Header -->
<section class="mb-8 border border-outline rounded-lg bg-surface" id="psd_grouping">
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-variant transition-colors duration-200">
<span class="font-label text-label text-on-surface font-medium">Permission Grouping</span>
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</button>
</section>
<!-- Main Content Area: Error State -->
<div class="flex flex-col items-center justify-center min-h-[442px] text-center space-y-6">
<!-- Error Illustration -->
<div class="relative w-48 h-48 md:w-64 md:h-64 flex items-center justify-center bg-surface-container-low rounded-full error-pulse">
<div class="absolute inset-0 flex items-center justify-center opacity-10">
<span class="material-symbols-outlined text-[160px]" style="font-variation-settings: 'wght' 100;">wifi_off</span>
</div>
<div class="z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-6xl mb-2" style="font-variation-settings: 'FILL' 1;">cloud_off</span>
<div class="h-1 w-24 bg-outline rounded-full overflow-hidden">
<div class="h-full bg-error w-1/3 animate-[shimmer_2s_infinite_linear]"></div>
</div>
</div>
<!-- Mini broken links -->
<div class="absolute top-10 right-10">
<span class="material-symbols-outlined text-outline text-2xl">link_off</span>
</div>
<div class="absolute bottom-12 left-8">
<span class="material-symbols-outlined text-outline text-xl">sync_disabled</span>
</div>
</div>
<!-- Error Message -->
<div class="max-w-md space-y-3">
<h2 class="font-display text-h3 text-on-surface">Connection Interrupted</h2>
<p class="font-body text-on-surface-variant">
                    Unable to load permission set details. Please check your connection and try again.
                </p>
</div>
<!-- Retry Button -->
<button class="flex items-center gap-2 bg-primary text-on-primary font-label text-label rounded-xl px-8 py-3 hover:opacity-90 active:scale-95 transition-all duration-200 shadow-sm" id="psd_error_retry">
<span class="material-symbols-outlined text-[20px]">refresh</span>
<span>Retry</span>
</button>
</div>
<!-- Secondary Action -->
<div class="mt-8 flex justify-center">
<button class="flex items-center gap-2 text-primary border border-primary font-label text-label rounded-xl px-6 py-2 hover:bg-primary-container transition-colors duration-200" id="psd_copy_fingerprint">
<span class="material-symbols-outlined text-[18px]">fingerprint</span>
<span>Copy Fingerprint</span>
</button>
</div>
</main>
<!-- BottomNavBar (Mobile) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant w-1/4 h-full rounded-lg transition-all duration-200 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">home</span>
<span class="font-label text-[10px] mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant w-1/4 h-full rounded-lg transition-all duration-200 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">group</span>
<span class="font-label text-[10px] mt-1">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant w-1/4 h-full rounded-lg transition-all duration-200 group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform">account_balance_wallet</span>
<span class="font-label text-[10px] mt-1">Collections</span>
</a>
<!-- Sync Tab (Semi-active visually or indicated as sync state) -->
<a class="flex flex-col items-center justify-center text-primary hover:bg-surface-variant w-1/4 h-full rounded-lg transition-all duration-200 group" href="#">
<div class="bg-primary-container text-on-primary-container rounded-full px-4 py-1 flex flex-col items-center">
<span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500">sync</span>
<span class="font-label text-[10px] mt-0.5">Sync</span>
</div>
</a>
</nav>
<!-- Navigation Rail / Top Nav Desktop (Mocked within header logic usually, but here as a sidebar for layout) -->
<aside class="hidden md:flex fixed left-0 top-14 bottom-0 w-20 bg-surface border-r border-outline flex-col items-center py-8 space-y-8">
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary cursor-pointer">home</span>
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary cursor-pointer">group</span>
<span class="material-symbols-outlined text-on-surface-variant hover:text-primary cursor-pointer">account_balance_wallet</span>
<span class="material-symbols-outlined text-primary bg-primary-container p-3 rounded-xl cursor-pointer">sync</span>
</aside>
<script>
        // Simple micro-interaction for retry button
        const retryBtn = document.getElementById('psd_error_retry');
        retryBtn.addEventListener('click', () => {
            retryBtn.classList.add('opacity-50');
            retryBtn.innerHTML = `
                <span class="material-symbols-outlined text-[20px] animate-spin">sync</span>
                <span>Retrying...</span>
            `;
            setTimeout(() => {
                // Return to original state to simulate failure repeat or let user click again
                retryBtn.classList.remove('opacity-50');
                retryBtn.innerHTML = `
                    <span class="material-symbols-outlined text-[20px]">refresh</span>
                    <span>Retry</span>
                `;
            }, 1500);
        });

        // Copy fingerprint interaction
        const copyBtn = document.getElementById('psd_copy_fingerprint');
        copyBtn.addEventListener('click', () => {
            const originalContent = copyBtn.innerHTML;
            copyBtn.innerHTML = `
                <span class="material-symbols-outlined text-[18px]">check</span>
                <span>Copied</span>
            `;
            setTimeout(() => {
                copyBtn.innerHTML = originalContent;
            }, 2000);
        });
    </script>
</body></html>
