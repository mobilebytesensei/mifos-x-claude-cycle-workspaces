<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Mifos-X Back Office</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    spacing: {
                        xs: "4px",
                        sm: "8px",
                        md: "16px",
                        lg: "24px",
                        xl: "32px",
                        xxl: "48px",
                        safe: "env(safe-area-inset-bottom)"
                    },
                    borderRadius: {
                        DEFAULT: "4px",
                        sm: "4px",
                        md: "8px",
                        lg: "16px",
                        xl: "28px",

                    fontFamily: {
                        headline: ["Roboto", "sans-serif"],
                        body: ["Roboto", "sans-serif"],
                        label: ["Roboto", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body antialiased flex flex-col min-h-screen pt-14 pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline dark:border-outline flat no shadows docked full-width top-0 flex justify-between items-center px-md w-full h-14 fixed z-50 transition-colors">
<div class="flex items-center gap-sm">
<button class="p-sm rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-primary dark:text-primary-container truncate">Mifos-X Back Office</h1>
</div>
<div>
<button class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</header>
<!-- Main Scrollable Column -->
<main class="flex-1 flex flex-col p-md md:p-lg md:ml-20 lg:ml-64 pb-safe max-w-4xl mx-auto w-full">
<!-- Navigation Rail (Tablet/Desktop) -->
<nav class="hidden md:flex flex-col bg-surface border-r border-outline fixed left-0 top-14 bottom-0 w-20 lg:w-64 pt-md z-40">
<ul class="flex flex-col gap-sm px-sm lg:px-md">
<li>
<a class="flex items-center lg:gap-md px-sm py-sm lg:py-sm rounded-full bg-primary-container text-on-primary-container font-label text-label font-medium opacity-100 transition-colors" href="#">
<span class="material-symbols-outlined mx-auto lg:mx-0" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="hidden lg:block">Home</span>
</a>
</li>
<li>
<a class="flex items-center lg:gap-md px-sm py-sm lg:py-sm rounded-full text-on-surface-variant hover:bg-surface-container-low font-label text-label font-medium transition-colors" href="#">
<span class="material-symbols-outlined mx-auto lg:mx-0">group</span>
<span class="hidden lg:block">Clients</span>
</a>
</li>
<li>
<a class="flex items-center lg:gap-md px-sm py-sm lg:py-sm rounded-full text-on-surface-variant hover:bg-surface-container-low font-label text-label font-medium transition-colors" href="#">
<span class="material-symbols-outlined mx-auto lg:mx-0">payments</span>
<span class="hidden lg:block">Collections</span>
</a>
</li>
<li>
<a class="flex items-center lg:gap-md px-sm py-sm lg:py-sm rounded-full text-on-surface-variant hover:bg-surface-container-low font-label text-label font-medium transition-colors" href="#">
<span class="material-symbols-outlined mx-auto lg:mx-0">sync</span>
<span class="hidden lg:block">Sync</span>
</a>
</li>
</ul>
</nav>
<!-- Empty State Container -->
<div class="flex-1 flex flex-col items-center justify-center text-center px-xl py-xxl bg-surface rounded-lg border border-outline mt-md">
<img alt="Empty State Illustration" class="w-48 h-48 md:w-64 md:h-64 mb-lg object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtjqgSyXcjiWrbgCYvIT7sHF4FKMdccaFsNCvS_ynQmRq0f9Z2b-YXxi8vu50nHc61JVO1CKeNbphv5QJMjfLUQLuNVF0v4rfDk7noM9Fd5nSPDXd3Yy0VQL50c1rubQykeBXa-CNNm5FzJTyfEKQFlaVuNsJGHManLQkHBxxhH8BeFeymzQZ9XBVvbk8Um2RpxK9YFgyEK44Aw-MD4Fs2nY--8paAZnbx6CNTgyxZd8-MjBlMumsppWc-P"/>
<h2 class="font-headline text-h2 font-semibold text-on-surface mb-sm">Nothing to show yet</h2>
<p class="font-body text-body text-on-surface-variant mb-xl max-w-md">Select a module to begin or verify your network settings.</p>
<button class="bg-primary text-on-primary font-label text-label font-medium rounded-xl px-md py-sm hover:opacity-90 active:scale-95 transition-all">
                Retry
            </button>
<!-- User Profile & Nav Links -->
<div class="mt-xl flex flex-col gap-md w-full max-w-sm">
<button class="flex items-center justify-center gap-sm bg-surface-container-low text-on-surface rounded-sm px-md py-sm hover:bg-surface-variant transition-colors border border-outline">
<span class="material-symbols-outlined text-tertiary" data-icon="shield_person">shield_person</span>
<span class="font-label text-label font-medium">Admin User · Head Office</span>
</button>
<div class="flex flex-col gap-xs mt-sm border-t border-outline pt-md">
<a class="flex items-center gap-md px-md py-sm bg-surface text-on-surface hover:bg-surface-variant transition-colors rounded-sm" href="#">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="explore">explore</span>
<span class="font-label text-label font-medium flex-1 text-left">Explore Modules</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</a>
<a class="flex items-center gap-md px-md py-sm bg-surface text-on-surface hover:bg-surface-variant transition-colors rounded-sm" href="#">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="wifi">wifi</span>
<span class="font-label text-label font-medium flex-1 text-left">Network Configuration</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm">chevron_right</span>
</a>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-sm bg-surface dark:bg-surface border-t border-outline dark:border-outline flat no shadows">
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 flex-1 max-w-[80px] Active: scale-95 transition-transform hover:bg-surface-container-low">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-[12px] font-bold text-primary mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant flex-1 max-w-[80px] hover:bg-surface-container-low transition-colors rounded-lg py-2">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-[12px] font-medium mt-1">Clients</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant flex-1 max-w-[80px] hover:bg-surface-container-low transition-colors rounded-lg py-2">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label text-[12px] font-medium mt-1">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant flex-1 max-w-[80px] hover:bg-surface-container-low transition-colors rounded-lg py-2">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[12px] font-medium mt-1">Sync</span>
</button>
</nav>
