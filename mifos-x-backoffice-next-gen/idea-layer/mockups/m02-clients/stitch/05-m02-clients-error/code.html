<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",

                        "display": ["Inter", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
        }
        .font-h3 { font-family: 'Roboto', sans-serif; font-size: 1.375rem; font-weight: 600; line-height: 1.35; }
        .font-body-large { font-family: 'Roboto', sans-serif; font-size: 1rem; font-weight: 400; line-height: 1.5; }
        .font-label { font-family: 'Roboto', sans-serif; font-size: 0.875rem; font-weight: 500; line-height: 1.4; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline dark:border-outline flex items-center justify-between px-4 h-16 shadow-none">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-variant transition-colors rounded-full active:opacity-80">
<span class="material-symbols-outlined text-primary dark:text-primary-container">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-primary">Clients</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A clean professional avatar of a financial office administrator with soft lighting in a modern workspace. The background is a minimalist office with subtle blue and teal accents, maintaining a high-key, clinical aesthetic consistent with a banking environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCz0PEXopZSBbVs_dqrGOGzqGHuZyNPpdUPHyDHH99f_wjB0JvS5fTdwFwfpvVeivrk4o5s_5HVn2BR1445PS0u7WDd0ToeMdBeL6-Qc4fsr8UYgThUkjKfW7_sakfCCpvsAGCd__oYS7aN6lOHgfH3RB3TsG0HWuHsn6PYDPEHeHTiVwBIsCJuyWCmtzVdZn_pUNZ2x0NgipshHq5pGy5NSbZcNlCH_QYiLODv39IENAYPTWoizwYHDU96IixowXjodQqgxaLk57uq"/>
</div>
</div>
</header>
<!-- Scrollable Content Column -->
<main class="flex-1 mt-16 mb-20 overflow-y-auto px-4 md:px-lg py-md flex flex-col gap-lg items-center">
<!-- Search Input -->
<div class="w-full max-w-2xl mt-4">
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-variant text-on-surface rounded-sm border-none focus:ring-2 focus:ring-primary font-body-large placeholder:text-on-surface-variant transition-all" placeholder="Search Clients" type="text"/>
</div>
</div>
<!-- Error Content Area -->
<div class="flex-1 flex flex-col items-center justify-center text-center max-w-md mx-auto py-xl">
<!-- Illustration -->
<div class="mb-lg w-full max-w-sm aspect-square flex items-center justify-center">
<img class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvM4d4xJT2_qAAdfk25wSy0rwLy_CjM88qddOa2Wsm09HoSoDTMIXyTItegypcaI3U1QB3rEfckwPVWn-_eshDjut43ymYqzDTEfqEQUvrntVXuynMx0DDt3iU8zA_1MM8lLO8-6QPSL_T4oFWcLls-Tepsf00ydyc7qOfo5deb88ENtDCCdjV36egyU2iJD7P7xr-bri0YpdJ5vXiBt0PCSowS2eHF8bUMgK9LLpKTJPG8HyULp4Cp3iJh"/>
</div>
<!-- Headline -->
<h2 class="font-headline text-2xl font-bold text-on-surface mb-md">
                Unable to load clients
            </h2>
<!-- Supporting Text -->
<p class="font-body text-on-surface-variant mb-xl px-4">
                Something went wrong while fetching the client list. Please check your connection and try again.
            </p>
<!-- Primary Button (Retry) -->
<button class="bg-primary text-on-primary rounded-xl px-xl py-md font-label font-medium uppercase tracking-wide hover:brightness-110 active:scale-95 transition-all w-full md:w-auto min-w-[160px] flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">refresh</span>
                Retry
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-surface border-t border-outline dark:border-outline flex justify-around items-center h-20 pb-safe px-2 shadow-none">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 px-4 py-1 rounded-full" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-xs mt-1">Home</span>
</a>
<!-- Active Tab: Clients -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label text-xs mt-1">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 px-4 py-1 rounded-full" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-xs mt-1">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 px-4 py-1 rounded-full" href="#">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-xs mt-1">Sync</span>
</a>
</nav>
<!-- Micro-interaction script for button -->
<script>
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const btn = this;
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> Retrying...';
            
            // Mock recovery animation
            setTimeout(() => {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
