<body class="flex flex-col min-h-screen">

<h1 class="font-headline text-h3 font-semibold">Clients</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-variant overflow-hidden border border-outline">

</div>
</div>
</div>

<!-- Search Section -->

<div class="relative">

<!-- BottomNavBar -->
<nav class="bg-surface dark:bg-surface fixed bottom-0 w-full z-50 border-t border-outline dark:border-outline shadow-[0_-1px_3px_0_rgba(0,0,0,0.05)]">
<div class="flex justify-around items-center h-20 pb-safe w-full">
<!-- Home -->

<span class="material-symbols-outlined">home</span>
<span class="font-label text-caption mt-1 font-medium">Home</span>
</a>
<!-- Clients (ACTIVE) -->

</a>

</a>

<span class="material-symbols-outlined">sync</span>

</a>
</div>
</nav>
<!-- Space for Bottom Nav -->
<div class="h-20 w-full"></div>
<script>
        // Simple micro-interaction for the retry button
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80');
            btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">sync</span> Retrying...`;
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.classList.remove('opacity-80');
                btn.innerHTML = `<span class="material-symbols-outlined text-[20px]">refresh</span> Retry`;
            }, 2000);
        });
    </script>
