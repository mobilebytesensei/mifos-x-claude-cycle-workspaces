<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mifos Back Office - Clients (Loading)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {primary: "#006CB5", "on-primary": "#ffffff", "primary-container": "#cbe6ff", "on-primary-container": "#001e30", secondary: "#50606e", "on-secondary": "#ffffff", "secondary-container": "#d3e5f5", "on-secondary-container": "#0c1d29", surface: "#f8fafc", "on-surface": "#191c1e", "surface-variant": "#dee3eb", "on-surface-variant": "#42474e", outline: "#72777f", error: "#ba1a1a", "on-error": "#ffffff", "background-light": "#f5f7f8", "background-dark": "#0f1b23"}, borderRadius: {DEFAULT: "0.125rem", lg: "0.25rem", xl: "0.5rem", full: "0.75rem"}, fontFamily: {headline: ["Inter"], display: ["Inter"], body: ["Inter"], label: ["Public Sans"]}, fontSize: {}}}};</script>
<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        .dark .shimmer {
            background: linear-gradient(90deg, #334155 25%, #475569 50%, #334155 75%);
            background-size: 200% 100%;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body antialiased overflow-x-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline/20 flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary cursor-pointer hover:bg-surface-variant transition-colors p-2 rounded-full">menu</span>
<h1 class="font-headline text-xl font-bold text-primary tracking-tight">Mifos Back Office</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden border border-outline/10">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<!-- Main Content Area -->
<main class="pt-16 pb-32 min-h-screen px-4 flex flex-col gap-6 max-w-2xl mx-auto">
<!-- Header Section (#clients_header) -->
<section class="pt-6" id="clients_header">
<div class="h-9 w-32 shimmer rounded-lg"></div>
</section>
<!-- Search Input (#clients_search_field) -->
<section id="clients_search_field">
<div class="h-14 w-full shimmer rounded-xl border border-outline/10 shadow-sm"></div>
</section>
<!-- Content Area Label (#clients_content) -->
<section id="clients_content">
<div class="h-5 w-24 shimmer rounded-md mb-4 opacity-70"></div>
<!-- List Items (#client_row) -->
<div class="flex flex-col gap-3">
<!-- Repeat Row 1 -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-outline/5 flex items-center justify-between">
<div class="flex flex-col gap-2">
<div class="h-5 w-40 shimmer rounded"></div>
<div class="h-4 w-24 shimmer rounded opacity-60"></div>
</div>
<div class="h-6 w-16 shimmer rounded-full"></div>
</div>
<!-- Repeat Row 2 -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-outline/5 flex items-center justify-between">
<div class="flex flex-col gap-2">
<div class="h-5 w-48 shimmer rounded"></div>
<div class="h-4 w-20 shimmer rounded opacity-60"></div>
</div>
<div class="h-6 w-16 shimmer rounded-full"></div>
</div>
<!-- Repeat Row 3 -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-outline/5 flex items-center justify-between">
<div class="flex flex-col gap-2">
<div class="h-5 w-36 shimmer rounded"></div>
<div class="h-4 w-28 shimmer rounded opacity-60"></div>
</div>
<div class="h-6 w-16 shimmer rounded-full"></div>
</div>
<!-- Repeat Row 4 -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-outline/5 flex items-center justify-between">
<div class="flex flex-col gap-2">
<div class="h-5 w-44 shimmer rounded"></div>
<div class="h-4 w-16 shimmer rounded opacity-60"></div>
</div>
<div class="h-6 w-16 shimmer rounded-full"></div>
</div>
<!-- Repeat Row 5 -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-outline/5 flex items-center justify-between">
<div class="flex flex-col gap-2">
<div class="h-5 w-52 shimmer rounded"></div>
<div class="h-4 w-32 shimmer rounded opacity-60"></div>
</div>
<div class="h-6 w-16 shimmer rounded-full"></div>
</div>
</div>
</section>
<!-- Tab Bar (#client_360_tabs) -->
<section class="mt-4" id="client_360_tabs">
<div class="flex gap-4 border-b border-outline/10 pb-1">
<div class="h-8 w-20 shimmer rounded-t-lg"></div>
<div class="h-8 w-24 shimmer rounded-t-lg"></div>
<div class="h-8 w-16 shimmer rounded-t-lg"></div>
</div>
</section>
<!-- Action Buttons Stack (#client_edit_button, #add_identifier_button, etc) -->
<section class="grid grid-cols-2 gap-3 pb-8">
<div class="h-11 shimmer rounded-lg col-span-2" id="client_edit_button"></div>
<div class="h-11 shimmer rounded-lg" id="add_identifier_button"></div>
<div class="h-11 shimmer rounded-lg" id="upload_document_button"></div>
<div class="h-11 shimmer rounded-lg" id="add_note_button"></div>
<div class="h-11 shimmer rounded-lg" id="activate_client_button"></div>
<div class="h-11 shimmer rounded-lg" id="close_client_button"></div>
<div class="h-11 shimmer rounded-lg" id="reject_client_button"></div>
<div class="h-11 shimmer rounded-lg" id="withdraw_client_button"></div>
<div class="h-11 shimmer rounded-lg" id="propose_transfer_button"></div>
<div class="h-11 shimmer rounded-lg col-span-2 border-2 border-dashed border-outline/20" id="retry_button"></div>
</section>
</main>
<!-- FAB (#new_client_fab) -->
<div class="fixed bottom-24 right-6 z-40" id="new_client_fab">
<div class="w-14 h-14 rounded-2xl shimmer shadow-lg flex items-center justify-center">
<div class="w-6 h-6 bg-white/20 rounded-full"></div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline/20 flex justify-around items-center h-20 pb-safe px-2">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform px-4 py-1 rounded-full cursor-pointer">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[10px] font-medium mt-1">Home</span>
</div>
<!-- Clients (Active) -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label text-[10px] font-medium mt-1">Clients</span>
</div>
<!-- Collections -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform px-4 py-1 rounded-full cursor-pointer">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-[10px] font-medium mt-1">Collections</span>
</div>
<!-- Sync -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low active:scale-95 transition-transform px-4 py-1 rounded-full cursor-pointer">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[10px] font-medium mt-1">Sync</span>
</div>
</nav>
<script>
        // Simple micro-interaction for taps on nav items
        document.querySelectorAll('nav > div, header .material-symbols-outlined').forEach(item => {
            item.addEventListener('touchstart', function() {
                this.classList.add('opacity-70');
            });
            item.addEventListener('touchend', function() {
                this.classList.remove('opacity-70');
            });
        });
    </script>
</body></html>
