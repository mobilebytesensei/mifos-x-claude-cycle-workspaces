</div>

<div class="flex flex-col">

<span class="text-caption text-on-surface-variant">ID: 00293589</span>
</div>
<span class="bg-secondary-container text-on-secondary-container text-label px-3 py-1 rounded-sm font-medium">Active</span>
</div>

<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center gap-sm px-md py-3 bg-surface border border-outline/30 rounded-md text-on-surface hover:bg-surface-variant transition-colors text-label font-medium active:scale-95 duration-75">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="edit">edit</span>
                    Edit Client
                </button>
<button class="flex items-center gap-sm px-md py-3 bg-surface border border-outline/30 rounded-md text-on-surface hover:bg-surface-variant transition-colors text-label font-medium active:scale-95 duration-75">

                    Add Identifier
                </button>
<button class="flex items-center gap-sm px-md py-3 bg-surface border border-outline/30 rounded-md text-on-surface hover:bg-surface-variant transition-colors text-label font-medium active:scale-95 duration-75">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="upload_file">upload_file</span>
                    Upload Document
                </button>
<button class="flex items-center gap-sm px-md py-3 bg-surface border border-outline/30 rounded-md text-on-surface hover:bg-surface-variant transition-colors text-label font-medium active:scale-95 duration-75">

                    Add Note
                </button>
<button class="flex items-center gap-sm px-md py-3 bg-secondary-container border border-secondary/20 rounded-md text-on-secondary-container hover:opacity-90 transition-all text-label font-medium active:scale-95 duration-75">

                    Reject

<button class="flex items-center gap-sm px-md py-3 bg-surface border border-outline/30 rounded-md text-on-surface hover:bg-surface-variant transition-colors text-label font-medium active:scale-95 duration-75">
<span class="material-symbols-outlined text-warning-strong text-[20px]" data-icon="undo">undo</span>
                    Withdraw
                </button>
<button class="col-span-2 flex items-center justify-center gap-sm px-md py-3 bg-surface border border-outline/30 rounded-md text-on-surface hover:bg-surface-variant transition-colors text-label font-medium active:scale-95 duration-75">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="move_up">move_up</span>

<span class="font-label text-label font-medium">Clients</span>

<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-low transition-colors w-1/4 h-full active:scale-95 transition-transform duration-100">

<span class="font-label text-label font-medium">Collections</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-low transition-colors w-1/4 h-full active:scale-95 transition-transform duration-100">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-label font-medium">Sync</span>
</button>
</nav>
<script>
        // Simple touch interaction for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() {
                this.classList.add('opacity-70');
            });
            btn.addEventListener('touchend', function() {
                this.classList.remove('opacity-70');
            });
        });
    </script>
