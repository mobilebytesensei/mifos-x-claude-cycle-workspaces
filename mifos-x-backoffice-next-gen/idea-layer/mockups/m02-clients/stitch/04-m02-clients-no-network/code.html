<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mifos-X Back Office - Clients (No Network)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400&amp;family=Inter:wght@400;600;700&amp;family=Public+Sans:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px",
                    },
                    fontFamily: {
                        "headline": ["Roboto", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"],
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-tap-highlight-color: transparent;
        }
        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- Top App Bar -->
<header class="bg-surface sticky top-0 z-40 flex justify-between items-center px-md w-full h-14 border-b border-outline">
<div class="flex items-center gap-3">
<button class="p-2 hover:bg-surface-variant rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary">menu</span>
</button>
<h1 class="font-headline text-[1.375rem] font-semibold text-primary" id="clients_header">Mifos-X</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-medium text-xs overflow-hidden">
<span class="material-symbols-outlined">person</span>
</div>
</div>
</header>
<!-- Offline Banner -->
<div class="bg-warning-strong text-white px-md py-2 flex items-center gap-2 text-sm animate-pulse">
<span class="material-symbols-outlined text-[18px]">wifi_off</span>
<span class="font-medium">Working Offline</span>
</div>
<main class="flex-1 flex flex-col p-md max-w-4xl mx-auto w-full">
<!-- Search Field -->
<div class="mb-6 relative">
<div class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input class="w-full h-12 pl-11 pr-4 bg-surface-variant text-on-surface-variant border-none rounded-md cursor-not-allowed opacity-60" disabled="" id="clients_search_field" placeholder="Search clients..." type="text"/>
</div>
<!-- Content Area: Error State -->
<div class="flex-1 flex flex-col items-center justify-center text-center py-xl" id="clients_content">
<div class="w-64 h-64 mb-6">
<img alt="No Network Connection" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLt9uG1R4C05_n-1V55wLjNzHKz9YZdI1E94QUOZ8Yr_ohWlIo4yFHZ16UnXg3-77n30MMyfcdLtrsUH8KZ60E0TCxny9EKAIEXRLrarmIgfQaB9Lc0TurErIiaQBJjOxMkXodY7XPxjdUM8ZtG92Wh3AM5E3jtg7-I1HjHhp-1UHWo4AF5gpz4CeVhgAc9c88cSNXclobUO-AmqRgBMR63xLGCbrq0VR9mpa8HnbTpe9DME3rY-7vCrGLzu"/>
</div>
<h2 class="text-h2 font-semibold text-on-surface mb-2">Connection Lost</h2>
<p class="text-body text-on-surface-variant max-w-xs mb-8">
                No Network Connection. Unable to load the client directory. Please check your internet connection and try again.
            </p>
<button class="flex items-center justify-center gap-2 bg-primary text-on-primary font-medium px-md py-md rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-sm" id="retry_button">
<span class="material-symbols-outlined">refresh</span>
<span>Retry</span>
</button>
</div>
<!-- Quick Actions Grid -->
<div class="mt-xl pb-xxl">
<h3 class="text-label font-bold text-on-surface-variant uppercase tracking-wider mb-4 px-1">Quick Actions</h3>
<div class="bento-grid">
<!-- Action Buttons -->
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-primary mb-2">edit</span>
<span class="text-caption font-medium text-on-surface">Edit Client</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-primary mb-2">fingerprint</span>
<span class="text-caption font-medium text-on-surface">Add Identifier</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-primary mb-2">upload_file</span>
<span class="text-caption font-medium text-on-surface">Upload Document</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-primary mb-2">sticky_note_2</span>
<span class="text-caption font-medium text-on-surface">Add Note</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-success mb-2">task_alt</span>
<span class="text-caption font-medium text-on-surface">Activate</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-error mb-2">close</span>
<span class="text-caption font-medium text-on-surface">Close</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-error mb-2">block</span>
<span class="text-caption font-medium text-on-surface">Reject</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mb-2">undo</span>
<span class="text-caption font-medium text-on-surface">Withdraw</span>
</button>
<button class="flex flex-col items-center justify-center p-md bg-surface border border-outline rounded-lg opacity-50 cursor-not-allowed transition-colors">
<span class="material-symbols-outlined text-secondary mb-2">move_up</span>
<span class="text-caption font-medium text-on-surface text-center leading-tight">Propose Transfer</span>
</button>
</div>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-6 w-14 h-14 bg-secondary text-on-secondary rounded-lg shadow-lg flex items-center justify-center active:scale-95 transition-transform z-50" id="new_client_fab">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label text-[11px] font-medium">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label text-[11px] font-medium">Clients</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-label text-[11px] font-medium">Collections</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined mb-1">sync</span>
<span class="font-label text-[11px] font-medium">Sync</span>
</a>
</nav>
<script>
        // Micro-interaction for the retry button
        const retryBtn = document.getElementById('retry_button');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            retryBtn.classList.add('opacity-80');
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                retryBtn.classList.remove('opacity-80');
                // Simulate checking connection
                alert('No connection found. Please check your router.');
            }, 1200);
        });

        // Add shadow on scroll for header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('shadow-md');
            } else {
                header.classList.remove('shadow-md');
            }
        });
    </script>
</body></html>
