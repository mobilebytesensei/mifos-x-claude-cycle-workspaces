<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mifos Back Office - Clients</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "outline": "#72777F",
              "error": "#BA1A1A"
            },
            borderRadius: {
              "DEFAULT": "0.125rem",
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "display": ["Inter", "sans-serif"],
              "body": ["Roboto", "sans-serif"],
              "label": ["Public Sans", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"]
            },
            fontSize: {
              "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
              "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
              "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
              "body-large": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
              "title-large": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
              "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
              "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }]
            }
          }
        }
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #FCFCFF;
        color: #1A1C1E;
        font-family: 'Roboto', sans-serif;
      }
      .scroll-container {
        height: calc(100vh - 144px); /* Subtract Header and Bottom Nav */
        overflow-y: auto;
      }
      .safe-pb {
        padding-bottom: calc(1rem + env(safe-area-inset-bottom));
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased select-none">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center justify-between px-4 h-16">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary cursor-pointer active:opacity-80">menu</span>
<h1 class="font-headline text-h3 font-semibold text-primary">Clients</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline/20">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial office administrator, clean lighting, minimalist office background, high-key light-mode aesthetic, corporate and trustworthy visual style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBIu7NKHonf2LlUTmXopAK_hqzFhW7F15EwJtrj6Mry4JXX2S33XhoAxXMPldUDs2fCHcFoWv7U1Yq-6UqoODXCpD2u3Cn7WwPK0jtK1JCZRLpoj_-FxD_EIgQF-LDxJtVJsRRCR-8USA7z9DeuyJEXqSPDLEun7H4yRLlrZ1ZkQ_yIfN3DTz-t3KEjTONgoxXBYGedDRqlEDyj6CQZbi_QvRx8QJXTxcuPvLUe5opMOjDDwHSelctsDWBAS_6WJWvlWmmKBnepgNiX"/>
</div>
</header>
<!-- Main Content Area (Scrollable Column) -->
<main class="mt-16 mb-20 scroll-container flex flex-col">
<!-- Search Field -->
<div class="px-4 pt-6 pb-2">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-variant text-on-surface rounded-md border-none focus:ring-2 focus:ring-primary placeholder:text-on-surface-variant font-body" placeholder="Search Clients" type="text"/>
</div>
</div>
<!-- Content Area: Empty State -->
<div class="flex-grow flex flex-col items-center justify-center px-8 py-12 text-center max-w-md mx-auto">
<!-- Empty State Illustration -->
<div class="w-full aspect-square max-w-[280px] mb-8 animate-pulse-slow">
<img alt="No clients illustration" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs3saFr4Zwm9CNjGV_pkgKJedbvs_GjsgGvH7kPLRjhySPQ73aI06_459iSYwjyDjC-fMIva0m2yayeYFWxYBD33ssp2dYZSibrW225zNDbxDoK8G8NB4nKJ8mCQAhjrBKrm-0ETLelRaWW15DbyaBCOpGLILJ4SulnHq_aoGPmeJJE7XG4oBWju4-HdV6b9X84XhkWxYPGG2SnMj27R45T9waYJSlSR6H79_GuQsMlnXm0gGYWmk3inOk1"/>
</div>
<!-- Empty State Message -->
<h2 class="font-headline text-title-large text-on-surface mb-3">No clients found</h2>
<p class="font-body text-body-large text-on-surface-variant mb-10 leading-relaxed">
                Get started by adding your first client to manage their financial activities.
            </p>
<!-- Primary CTA -->
<button class="w-full py-4 px-6 bg-primary text-on-primary rounded-xl font-label text-label flex items-center justify-center gap-2 shadow-sm hover:opacity-90 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
                Create New Client
            </button>
</div>
<!-- Bottom Elements (Retry) -->
<div class="px-4 py-8 flex justify-center safe-pb">
<button class="px-8 py-2 border border-outline text-primary rounded-xl font-label text-label hover:bg-surface-container-low active:bg-surface-variant transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                Retry
            </button>
</div>
</main>
<!-- FAB -->
<button class="fixed bottom-24 right-6 w-14 h-14 bg-secondary text-on-secondary rounded-lg flex items-center justify-center shadow-lg active:scale-90 transition-transform z-40">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 pb-safe px-2">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full px-2 py-1 transition-colors">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[11px] font-medium mt-1">Home</span>
</div>
<!-- Clients (Active) -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-1 transition-transform active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label text-[11px] font-medium mt-1">Clients</span>
</div>
<!-- Collections -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full px-2 py-1 transition-colors">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-[11px] font-medium mt-1">Collections</span>
</div>
<!-- Sync -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full px-2 py-1 transition-colors">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[11px] font-medium mt-1">Sync</span>
</div>
</nav>
<script>
        // Simple micro-interaction for retry button
        document.querySelector('.border-outline').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            setTimeout(() => {
                icon.classList.remove('animate-spin');
            }, 1000);
        });
    </script>
<style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.95; transform: scale(1.02); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 4s ease-in-out infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</body></html>
