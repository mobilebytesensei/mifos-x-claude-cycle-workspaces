<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mifos-X - Clients</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@400;500;600&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px",
                    },
                    fontFamily: {
                        "headline": ["Roboto", "Inter", "sans-serif"],
                        "display": ["Roboto", "Inter", "sans-serif"],
                        "body": ["Roboto", "Inter", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
                        "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
                        "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
                        "body": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
                        "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
                        "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }],
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Roboto', sans-serif; background-color: #FCFCFF; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .active-pill { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .scroll-container { scrollbar-width: none; -ms-overflow-style: none; }
        .scroll-container::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface bg-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-40 bg-surface text-primary border-b border-outline/20 h-14 flex justify-between items-center px-md">
<div class="flex items-center gap-md">
<button class="p-2 hover:bg-surface-variant rounded-full transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-h3 font-semibold">Clients</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container overflow-hidden border border-outline/30">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial officer, smiling warmly in a bright, modern office setting with soft blue and white tones, matching the Mifos-X clean and trustworthy aesthetic. High quality corporate photography with natural lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8mMwUdyG7L4da__EinXI0g8rS16idMFUt8dDxUjEvkzxVJomGXnrfni78axwJS8bSHk4XGkcbryIu1II5D-t6-6oAaE18s_eowJgkKQjZEOE7E2cITDm69QDvN0omPM23I3y44HLGovGJ9RMwumONQjAO3WqYaSlY5Nyy0OYNbt4jUtY8ZPUzQzWVqSlOOf-ChIi00QCd_qmtYmxv4Xvo5N05G037SGD1ObH3zqOFc0Iz8_NzjKv3_GNrgB4lbfhoMBMl4m2DqLKT"/>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 mt-14 mb-20 scroll-container overflow-y-auto w-full px-md flex flex-col items-start gap-lg py-md">
<!-- Search Input Section -->
<div class="w-full">
<div class="relative flex items-center w-full">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-variant text-on-surface rounded-md border-none focus:ring-2 focus:ring-primary transition-all placeholder:text-on-surface-variant/70" placeholder="Search Clients" type="text"/>
</div>
</div>
<!-- Empty State Content Area -->
<div class="w-full flex-1 flex flex-col items-center justify-center py-xxl text-center">
<div class="max-w-md w-full flex flex-col items-center gap-lg">
<!-- Empty State Illustration -->
<div class="w-full aspect-square max-w-[280px] relative mb-md">
<img alt="Client Registry Nodes" class="w-full h-full object-contain drop-shadow-sm opacity-90 transition-opacity hover:opacity-100" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg"/>
</div>
<!-- Text Content -->
<div class="space-y-sm">
<h2 class="text-h2 font-bold text-on-surface tracking-tight">No clients found</h2>
<p class="text-body text-on-surface-variant px-md leading-relaxed">
                        Your client registry is currently empty. Get started by adding your first financial member to the platform.
                    </p>
</div>
<!-- Primary CTA -->
<button class="mt-md flex items-center gap-sm bg-primary text-on-primary px-lg py-md rounded-xl font-label text-label hover:opacity-90 active:scale-95 transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="add">add</span>
                    Create New Client
                </button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline/20 h-20 pb-safe flex justify-around items-center">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label text-label font-medium">Home</span>
</a>
<!-- Clients (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group" data-weight="fill">group</span>
<span class="font-label text-label font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="payments">payments</span>
<span class="font-label text-label font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-colors duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="sync">sync</span>
<span class="font-label text-label font-medium">Sync</span>
</a>
</nav>
<script>
        // Simple ripple effect for buttons
        document.querySelectorAll('button, a').forEach(elem => {
            elem.addEventListener('click', function(e) {
                // Micro-interaction logic can be added here
            });
        });
    </script>
</body></html>
