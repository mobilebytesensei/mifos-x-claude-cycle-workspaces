<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos Back Office - Loading Collections</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px"
                    }
                },
            },
        }
    </script>
<style>
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #DEE3EB 8%, #F3F4F9 18%, #DEE3EB 33%);
            background-size: 1000px 100%;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- TopAppBar Shell -->
<header class="bg-surface text-primary border-b border-outline fixed top-0 w-full h-16 flex justify-between items-center px-4 z-50">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined cursor-default">menu</span>
<h1 class="font-display text-h3 font-bold text-primary">Mifos Back Office</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<!-- Navigation Drawer (Desktop) -->
<aside class="hidden lg:flex flex-col fixed left-0 top-0 h-full w-80 bg-surface border-r border-outline z-40 pt-20">
<div class="px-6 mb-8 flex flex-col gap-1">
<div class="w-12 h-12 rounded-full bg-surface-variant mb-2"></div>
<p class="font-headline text-h2 text-primary font-bold">Staff Member</p>
<p class="text-on-surface-variant text-body">Branch Manager</p>
</div>
<nav class="flex flex-col gap-2">
<div class="flex items-center gap-4 py-3 px-6 text-on-surface-variant hover:bg-surface-variant rounded-full mx-3 transition-all">
<span class="material-symbols-outlined">home</span>
<span class="font-body">Home</span>
</div>
<div class="flex items-center gap-4 py-3 px-6 text-on-surface-variant hover:bg-surface-variant rounded-full mx-3 transition-all">
<span class="material-symbols-outlined">group</span>
<span class="font-body">Clients</span>
</div>
<div class="flex items-center gap-4 py-3 px-6 bg-primary-container text-on-primary-container font-bold rounded-full mx-3 transition-all">
<span class="material-symbols-outlined">payments</span>
<span class="font-body">Collections</span>
</div>
<div class="flex items-center gap-4 py-3 px-6 text-on-surface-variant hover:bg-surface-variant rounded-full mx-3 transition-all">
<span class="material-symbols-outlined">sync</span>
<span class="font-body">Sync</span>
</div>
</nav>
</aside>
<!-- Main Canvas -->
<main class="flex-1 mt-16 mb-20 lg:ml-80 p-4 lg:p-6 overflow-x-hidden">
<div class="max-w-4xl mx-auto space-y-6">
<!-- Header Skeleton -->
<div class="space-y-2" id="header">
<div class="h-8 w-64 shimmer rounded-md"></div>
<div class="h-4 w-40 shimmer rounded-md opacity-60"></div>
</div>
<!-- Meeting Picker Button Skeleton -->
<div class="flex items-center" id="sheet_context_picker">
<div class="h-12 w-full max-w-sm shimmer rounded-xl"></div>
</div>
<!-- Content Area: Group Header & Member Rows -->
<div class="space-y-4" id="content_area">
<div class="h-6 w-32 shimmer rounded-md"></div>
<div class="bg-surface rounded-lg border border-outline overflow-hidden">
<!-- Member Row 1 -->
<div class="p-4 border-b border-outline flex items-center justify-between gap-4" id="sheet_member_row">
<div class="flex items-center gap-4 flex-1">
<div class="w-10 h-10 rounded-full shimmer shrink-0"></div>
<div class="space-y-2 flex-1">
<div class="h-4 w-1/2 shimmer rounded-sm"></div>
<div class="h-3 w-1/4 shimmer rounded-sm opacity-60"></div>
</div>
</div>
<div class="w-32 h-10 shimmer rounded-sm shrink-0"></div>
</div>
<!-- Member Row 2 -->
<div class="p-4 border-b border-outline flex items-center justify-between gap-4">
<div class="flex items-center gap-4 flex-1">
<div class="w-10 h-10 rounded-full shimmer shrink-0"></div>
<div class="space-y-2 flex-1">
<div class="h-4 w-2/3 shimmer rounded-sm"></div>
<div class="h-3 w-1/3 shimmer rounded-sm opacity-60"></div>
</div>
</div>
<div class="w-32 h-10 shimmer rounded-sm shrink-0"></div>
</div>
<!-- Member Row 3 -->
<div class="p-4 border-b border-outline flex items-center justify-between gap-4">
<div class="flex items-center gap-4 flex-1">
<div class="w-10 h-10 rounded-full shimmer shrink-0"></div>
<div class="space-y-2 flex-1">
<div class="h-4 w-1/3 shimmer rounded-sm"></div>
<div class="h-3 w-1/5 shimmer rounded-sm opacity-60"></div>
</div>
</div>
<div class="w-32 h-10 shimmer rounded-sm shrink-0"></div>
</div>
<!-- Member Row 4 -->
<div class="p-4 flex items-center justify-between gap-4">
<div class="flex items-center gap-4 flex-1">
<div class="w-10 h-10 rounded-full shimmer shrink-0"></div>
<div class="space-y-2 flex-1">
<div class="h-4 w-1/2 shimmer rounded-sm"></div>
<div class="h-3 w-1/4 shimmer rounded-sm opacity-60"></div>
</div>
</div>
<div class="w-32 h-10 shimmer rounded-sm shrink-0"></div>
</div>
</div>
</div>
<!-- Capture Amount Field Skeleton -->
<div class="space-y-2" id="capture_amount_field">
<div class="h-4 w-24 shimmer rounded-sm opacity-60"></div>
<div class="h-14 w-full shimmer rounded-md"></div>
</div>
<!-- Total Summary Card Skeleton -->
<div class="bg-surface-container-low rounded-lg p-6 border border-outline" id="sheet_total_summary">
<div class="flex justify-between items-center mb-4">
<div class="h-5 w-32 shimmer rounded-sm"></div>
<div class="h-6 w-24 shimmer rounded-sm"></div>
</div>
<div class="space-y-3">
<div class="flex justify-between">
<div class="h-4 w-20 shimmer rounded-sm opacity-60"></div>
<div class="h-4 w-16 shimmer rounded-sm opacity-60"></div>
</div>
<div class="flex justify-between border-t border-outline pt-3">
<div class="h-5 w-24 shimmer rounded-sm font-bold"></div>
<div class="h-5 w-32 shimmer rounded-sm font-bold"></div>
</div>
</div>
</div>
<!-- Action Buttons Skeletons -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-8">
<div class="h-14 shimmer rounded-xl"></div> <!-- Submit Sheet -->
<div class="h-14 shimmer rounded-xl opacity-70"></div> <!-- View Receipts -->
<div class="h-14 shimmer rounded-xl opacity-50"></div> <!-- Review Failed -->
<div class="h-14 shimmer rounded-xl opacity-30"></div> <!-- Retry -->
</div>
</div>
</main>
<!-- BottomNavBar Shell (Mobile) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline md:hidden">
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-[10px] font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-[10px] font-medium">Clients</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-[10px] font-medium">Collections</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">sync</span>
<span class="font-label text-[10px] font-medium">Sync</span>
</div>
</nav>
<!-- Micro-interaction: Periodic shimmer intensity shift -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const shimmers = document.querySelectorAll('.shimmer');
            shimmers.forEach((s, index) => {
                s.style.animationDelay = `${index * 50}ms`;
            });
        });
    </script>
</body></html>
