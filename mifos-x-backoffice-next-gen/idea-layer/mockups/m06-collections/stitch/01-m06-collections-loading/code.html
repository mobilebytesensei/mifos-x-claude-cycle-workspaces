<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mifos-X | Collection Sheet Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              secondary: "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              tertiary: "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              surface: "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              background: "#FCFCFF",
              "on-background": "#1A1C1E",
              outline: "#72777F",
              success: "#2E7D32",
              warning: "#F57C00",
              "warning-strong": "#B45309",
              error: "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002",
            },
            borderRadius: {
              "DEFAULT": "4px",
              "sm": "4px",
              "md": "8px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            fontFamily: {
              headline: ["Roboto", "Inter", "sans-serif"],
              display: ["Inter", "sans-serif"],
              body: ["Roboto", "Inter", "sans-serif"],
              label: ["Public Sans", "Roboto", "sans-serif"],
              mono: ["Roboto Mono", "monospace"]
            }
          }
        }
      }
    </script>
<style>
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .shimmer {
        background: linear-gradient(90deg, #DEE3EB 25%, #F3F4F9 50%, #DEE3EB 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite linear;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        background-color: #FCFCFF;
        color: #1A1C1E;
        font-family: 'Roboto', sans-serif;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex justify-between items-center px-4 h-14">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface">menu</span>
<div class="h-6 w-32 shimmer rounded-sm"></div>
</div>
<div class="w-8 h-8 rounded-full shimmer"></div>
</header>
<main class="flex-1 mt-14 mb-20 px-4 py-6 space-y-6">
<div class="w-full h-12 shimmer rounded-xl"></div>
<section class="space-y-4">
<div class="h-6 w-24 shimmer rounded-sm"></div>
<div class="space-y-3">
<div class="bg-surface border border-outline rounded-lg p-4 flex items-center justify-between">
<div class="space-y-2 flex-1">
<div class="h-4 w-1/2 shimmer rounded-sm"></div>
<div class="h-3 w-1/3 shimmer rounded-sm opacity-60"></div>
</div>
<div class="h-8 w-20 shimmer rounded-xl"></div>
</div>
<div class="bg-surface border border-outline rounded-lg p-4 flex items-center justify-between">
<div class="space-y-2 flex-1">
<div class="h-4 w-2/3 shimmer rounded-sm"></div>
<div class="h-3 w-1/4 shimmer rounded-sm opacity-60"></div>
</div>
<div class="h-8 w-20 shimmer rounded-xl"></div>
</div>
</div>
</section>
<section class="space-y-4">
<div class="h-6 w-32 shimmer rounded-sm"></div>
<div class="space-y-2">
<div class="h-14 w-full bg-surface-variant rounded-sm shimmer"></div>
<div class="h-4 w-3/4 shimmer rounded-sm mx-auto opacity-50"></div>
</div>
</section>
<section class="bg-surface-container-low rounded-lg p-4 border border-outline border-dashed space-y-3">
<div class="flex justify-between items-center">
<div class="h-4 w-24 shimmer rounded-sm"></div>
<div class="h-5 w-16 shimmer rounded-sm"></div>
</div>
<div class="flex justify-between items-center border-t border-outline pt-2">
<div class="h-5 w-32 shimmer rounded-sm"></div>
<div class="h-6 w-24 shimmer rounded-sm"></div>
</div>
</section>
<section class="space-y-3 pt-4">
<div class="w-full h-14 shimmer rounded-xl"></div>
<div class="w-full h-14 bg-surface border border-primary text-primary rounded-xl flex items-center justify-center">
<div class="h-4 w-32 shimmer rounded-sm opacity-40"></div>
</div>
<div class="w-full h-14 bg-error-container rounded-xl flex items-center justify-center">
<div class="h-4 w-36 shimmer rounded-sm opacity-30"></div>
</div>
<div class="w-full h-10 flex items-center justify-center">
<div class="h-4 w-16 shimmer rounded-sm opacity-50"></div>
</div>
</section>
</main>
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface border-t border-outline flex justify-around items-center h-20 px-2 pb-safe">
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label text-[11px] font-medium">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined mb-1">group</span>
<span class="font-label text-[11px] font-medium">Clients</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label text-[11px] font-medium">Collections</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1">
<span class="material-symbols-outlined mb-1">sync</span>
<span class="font-label text-[11px] font-medium">Sync</span>
</div>
</nav>
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 w-full max-w-xs pointer-events-none">
<div class="mx-4 bg-warning-strong text-white px-4 py-2 rounded-md flex items-center gap-2 text-xs font-medium shadow-lg opacity-0 transition-opacity duration-500" id="offlineIndicator">
<span class="material-symbols-outlined text-sm">cloud_off</span>
            Offline Mode: Working from local cache
        </div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const indicator = document.getElementById('offlineIndicator');
            setTimeout(() => {
                indicator.classList.remove('opacity-0');
                indicator.classList.add('opacity-100');
            }, 800);
        });
    </script>
</body></html>
