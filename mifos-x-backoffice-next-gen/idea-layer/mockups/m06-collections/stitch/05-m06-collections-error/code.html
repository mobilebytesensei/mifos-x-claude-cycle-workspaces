<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #FCFCFF;
      color: #1A1C1E;
    }

    /* Separation logic from JSON */
    .app-bar-border {
      border-bottom: 1px solid #72777F;
    }
    .nav-bar-border {
      border-top: 1px solid #72777F;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface h-14 flex items-center px-md border-b border-outline dark:border-outline justify-between">
<div class="flex items-center gap-md">
<button class="p-2 transition-colors duration-200 hover:bg-surface-variant rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-h3 font-bold text-primary">Collection Sheet</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full overflow-hidden bg-primary-container flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial administrator wearing business attire. The person has a friendly, trustworthy expression. The lighting is clean and professional, characteristic of a high-end corporate environment. The background is a soft-focus office setting with neutral blue and grey tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCC5qf4RKUJb_WC8m2ltoDanDNDOeJ8V6nxdXAB8-1-51sjNOVaw0YuV9Nv2det2-NJm5QDrin1WtceGsWVxCdJIorr5TIqm4KZKmB1YqNLVj_LBIiI-Db2dW24bCxbgWJ1FIQo1NPcinlg3cqyWSlo-EvYnNAa4OuFJA1BJVxXgLyyNhtEc7XWDMLhV2qfnH4zrpcNmUKAFCcCSygXLqlHyoKJK4yP3hCMOo6knvCnSxA3qnQYDrpk9AvhHkrXjfpV0JA-01E3FbD-"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-lg pt-24 pb-24 overflow-y-auto">
<!-- Error State Container -->
<div class="max-w-md w-full flex flex-col items-center text-center gap-lg">
<!-- Error Illustration -->
<div class="w-full max-w-[240px] aspect-square flex items-center justify-center mb-md">
<img class="w-full h-auto object-contain" data-alt="A professional flat-style tech illustration depicting a broken connection between a server and a device. The color palette features Mifos deep blue and teal accents on a clean white background. A stylized jagged line or a disconnected plug icon signifies a network failure. The aesthetic is clean, clinical, and high-quality, fitting for a modern financial back-office application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAnZVeoC4dpXbDyW_hqVx877tQk1Ulu_IMfj3qURv-OIWJNPbjK3X2mK8F77UsEkOQPF19njvKAFZIoKShehIEdo-3cO-DRhJlbLY6xB6kJqSCP_PkU97J5dUvdxGV-nh-ayQqOyCaYkaX4zNNxS17ev0toWjZBGYRmHNsO3AEy2Hw1hHjgqr-_5BnBEZFsgvZOjPJznxeHDgirLBnroLWXwR1HpWXOIcLfO44H3WyykUyFChg62fvloEKzVF0PtNmwgyOZMOZH3GJK"/>
</div>
<!-- Error Text Content -->
<div class="flex flex-col gap-sm">
<h2 class="text-h2 font-bold text-on-surface">Unable to load collection sheet</h2>
<p class="text-body text-on-surface-variant max-w-[320px] mx-auto">
          Something went wrong while fetching the latest records. Please check your connection and try again.
        </p>
</div>
<!-- Action -->
<button class="bg-primary text-on-primary font-label text-label px-xxl py-md rounded-xl transition-transform active:scale-95 hover:brightness-110 flex items-center justify-center gap-sm" onclick="window.location.reload()">
<span class="material-symbols-outlined text-[18px]" data-icon="refresh">refresh</span>
        Retry
      </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface border-t border-outline dark:border-outline flex justify-around items-center h-20 px-sm pb-safe">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-transform scale-95 active:scale-90 rounded-md">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-caption font-medium mt-1">Home</span>
</button>
<!-- Clients (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-transform scale-95 active:scale-90 rounded-md">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label text-caption font-medium mt-1">Clients</span>
</button>
<!-- Collections (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined" data-icon="payments" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label text-caption font-medium mt-1">Collections</span>
</button>
<!-- Sync (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-low transition-transform scale-95 active:scale-90 rounded-md">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-caption font-medium mt-1">Sync</span>
</button>
</nav>
<!-- Offline Banner (Design System requirement) -->
<!-- Initially hidden, could be toggled via JS based on actual connection state -->
<div class="hidden fixed top-14 left-0 w-full bg-warning-strong text-white px-md py-2 flex items-center justify-center gap-sm z-40" id="offline-status">
<span class="material-symbols-outlined text-[18px]" data-icon="cloud_off">cloud_off</span>
<span class="text-caption font-medium">Device is currently offline. Viewing cached data.</span>
</div>
<script>
    // Micro-interaction: Subtle fade-in for the error container
    document.addEventListener('DOMContentLoaded', () => {
      const main = document.querySelector('main > div');
      main.style.opacity = '0';
      main.style.transform = 'translateY(10px)';
      main.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
      
      setTimeout(() => {
        main.style.opacity = '1';
        main.style.transform = 'translateY(0)';
      }, 100);
    });

    // Simulated network check for the offline banner
    window.addEventListener('offline', () => {
      document.getElementById('offline-status').classList.remove('hidden');
    });
    window.addEventListener('online', () => {
      document.getElementById('offline-status').classList.add('hidden');
    });
    if (!navigator.onLine) {
       document.getElementById('offline-status').classList.remove('hidden');
    }
  </script>
</body></html>
