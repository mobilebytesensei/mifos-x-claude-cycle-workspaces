<script>
        // Simple micro-interaction for retry button
        document.getElementById('retry_button').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Visual feedback
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80');
            btn.innerHTML = `
                <span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span>
                Retrying...
            `;
            
            // Simulate reload delay
            setTimeout(() => {
                window.location.reload();
            }, 1200);
        });

        // Background atmosphere script
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
