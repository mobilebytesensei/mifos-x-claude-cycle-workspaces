        // Micro-interaction for the Retry button

            icon.classList.add('animate-spin');
            retryBtn.classList.add('opacity-80', 'pointer-events-none');

            setTimeout(() => {
                icon.classList.remove('animate-spin');
                retryBtn.classList.remove('opacity-80', 'pointer-events-none');
                console.log('Retrying template fetch...');
            }, 2000);
        });

        // Prevention of tap affordances on non-interactive text
