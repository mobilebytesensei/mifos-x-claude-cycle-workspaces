<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos-X Back Office - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@500&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px",
                    },
                    fontFamily: {
                        headline: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        body: ["Roboto", "sans-serif"],
                        label: ["Public Sans", "sans-serif"],
                        mono: ["Roboto Mono", "monospace"],
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-tap-highlight-color: transparent;
        }
        .error-illustration-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .floating-node {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .glitch-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: dash 3s linear forwards;
        }
        @keyframes dash {
            to { stroke-dashoffset: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface border-b border-outline sticky top-0 z-50 flex justify-between items-center px-md w-full h-14">
<div class="flex items-center gap-md">
<button class="p-2 hover:bg-surface-variant/50 transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary dark:text-primary" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-[1.375rem] font-bold text-on-surface">Form Error</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A professional profile headshot of a financial administrator, clean studio lighting, neutral background, soft shadows, high definition digital photography, corporate aesthetic following the blue and white color scheme of the application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeBP6rcxDTtKSPtBwel3PDQCDt1SqnRKpI2vqST5nkH1--QSSjzwq_b6a-gv6O-Vc5PTFbIBVBOdlIeJpxWMf_Z6lOk22xNF-Dh-E0pU6F_3dWV3w9KGYPaDj0BbN5w1q7Sf1nIWmHCBEgzPNDBK3NnbD-y95mB4_ulFDdZM-uGIXDklFpXEQk_Ii5zx4Kq_gvMLHmTjcMkJ2K_b_THNmTOqYT96Dfo0cl1jJeJgZCqMCU5FfEvqj1dZwLW2lD0h8ECNTX9qwKGiTL"/>
</div>
</div>
</header>
<!-- Main Content (scrollable_column) -->
<main class="flex-grow overflow-y-auto px-md py-lg flex flex-col items-start gap-md max-w-4xl mx-auto w-full">
<!-- Header -->
<div class="w-full">
<h2 class="font-headline text-[1.75rem] font-semibold text-on-surface">Create New Loan</h2>
<div class="h-[2px] w-12 bg-primary mt-sm rounded-full"></div>
</div>
<!-- Main Content Area: Error State Card -->
<div class="w-full bg-surface border border-outline rounded-lg p-xl flex flex-col items-center justify-center text-center mt-lg shadow-sm">
<!-- Minimalist Error Illustration -->
<div class="error-illustration-container mb-lg">
<svg fill="none" height="240" viewbox="0 0 240 240" width="240" xmlns="http://www.w3.org/2000/svg">
<!-- Background Circle -->
<circle cx="120" cy="120" fill="#F3F4F9" r="100"></circle>
<!-- Broken Data Link Visual -->
<rect fill="#006CB5" height="50" opacity="0.1" rx="4" width="40" x="70" y="80"></rect>
<rect fill="#006CB5" height="50" opacity="0.1" rx="4" width="40" x="130" y="110"></rect>
<!-- Connection Line -->
<path class="glitch-path" d="M100 105L140 135" stroke="#72777F" stroke-dasharray="8 4" stroke-width="2"></path>
<!-- Error Icon in Center -->
<circle cx="120" cy="120" fill="#BA1A1A" fill-opacity="0.1" r="32"></circle>
<circle cx="120" cy="120" r="28" stroke="#BA1A1A" stroke-dasharray="4 4" stroke-width="2"></circle>
<!-- Warning Symbol -->
<g transform="translate(104, 104)">
<path d="M16 2L30 28H2L16 2Z" fill="#BA1A1A"></path>
<rect fill="white" height="10" rx="1" width="2" x="15" y="10"></rect>
<circle cx="16" cy="23" fill="white" r="1.5"></circle>
</g>
<!-- Floating decorative UI nodes -->
<circle class="floating-node" cx="50" cy="60" fill="#006CB5" r="6" style="animation-delay: 0s;"></circle>
<circle class="floating-node" cx="190" cy="180" fill="#DEE3EB" r="8" style="animation-delay: 1s;"></circle>
<rect class="floating-node" fill="#DEE3EB" height="12" rx="2" style="animation-delay: 2s;" width="12" x="40" y="160"></rect>
</svg>
</div>
<!-- Message Section -->
<div class="max-w-md space-y-md">
<h3 class="font-headline text-[1.375rem] font-semibold text-error">Unable to Load Form Template</h3>
<p class="font-body text-[1rem] leading-relaxed text-on-surface-variant">
                    We encountered a problem while fetching the required fields. Please check your connection and try again.
                </p>
</div>
<!-- Action Section -->
<div class="mt-xl flex flex-col sm:flex-row gap-md w-full sm:w-auto">
<button class="bg-primary text-on-primary rounded-xl px-xl py-md font-label text-[0.875rem] font-medium flex items-center justify-center gap-sm transition-transform active:scale-95 shadow-sm hover:brightness-110" onclick="location.reload()">
<span class="material-symbols-outlined text-[20px]" data-icon="refresh">refresh</span>
                    Retry
                </button>
<button class="bg-surface text-primary border border-primary/20 rounded-xl px-xl py-md font-label text-[0.875rem] font-medium flex items-center justify-center transition-colors hover:bg-primary/5">
                    Go Back
                </button>
</div>
</div>
<!-- Metadata / Context Info -->
<div class="w-full mt-lg p-md border border-outline rounded-lg bg-surface-container-low flex items-start gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="info">info</span>
<div class="flex flex-col">
<span class="text-caption font-mono uppercase tracking-wider text-on-surface-variant">Error Reference</span>
<span class="text-label font-mono text-on-surface">FIN-503-FETCH_TEMPLATE_FAILURE</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface dark:bg-surface border-t border-outline flex justify-around items-center px-md py-sm">
<!-- Home -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer rounded-lg px-4 py-1">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[0.75rem] font-medium">Home</span>
</div>
<!-- Clients -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer rounded-lg px-4 py-1">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label text-[0.75rem] font-medium">Clients</span>
</div>
<!-- Collections -->
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer rounded-lg px-4 py-1">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label text-[0.75rem] font-medium">Collections</span>
</div>
<!-- Sync (Active?) - Assuming we are in a state that might require sync -->
<div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-95 transition-transform active:scale-90">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[0.75rem] font-medium">Sync</span>
</div>
</nav>
<!-- Spacer for Bottom Nav -->
<div class="h-16 w-full"></div>
<script>
        // Simple ripple-like effect for the retry button
        document.querySelector('.bg-primary').addEventListener('click', function(e) {
            console.log('Retrying fetch...');
            // In a real app, this would trigger the permission-gated fetch logic
        });

        // Accessibility enhancement
        document.querySelectorAll('.material-symbols-outlined').forEach(icon => {
            icon.setAttribute('aria-hidden', 'true');
        });
    </script>
</body></html>
