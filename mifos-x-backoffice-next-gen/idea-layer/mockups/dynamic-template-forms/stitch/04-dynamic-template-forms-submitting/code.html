<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mifos-X Back Office - Processing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;family=Roboto+Mono&amp;family=Public+Sans:wght@400;500;600&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#006CB5",
              "on-primary": "#FFFFFF",
              "primary-container": "#CBE6FF",
              "on-primary-container": "#001D33",
              "secondary": "#00796B",
              "on-secondary": "#FFFFFF",
              "secondary-container": "#B8F2E6",
              "on-secondary-container": "#00201A",
              "tertiary": "#5B5891",
              "on-tertiary": "#FFFFFF",
              "tertiary-container": "#E3DFFF",
              "on-tertiary-container": "#17124B",
              "surface": "#FCFCFF",
              "on-surface": "#1A1C1E",
              "surface-variant": "#DEE3EB",
              "on-surface-variant": "#42474E",
              "surface-container-low": "#F3F4F9",
              "background": "#FCFCFF",
              "on-background": "#1A1C1E",
              "outline": "#72777F",
              "success": "#2E7D32",
              "warning": "#F57C00",
              "warning-strong": "#B45309",
              "error": "#BA1A1A",
              "on-error": "#FFFFFF",
              "error-container": "#FFDAD6",
              "on-error-container": "#410002"
            },
            borderRadius: {
              "DEFAULT": "4px",
              "lg": "16px",
              "xl": "28px",
              "full": "9999px"
            },
            spacing: {
              "xs": "4px",
              "sm": "8px",
              "md": "16px",
              "lg": "24px",
              "xl": "32px",
              "xxl": "48px"
            },
            fontFamily: {
              "headline": ["Inter", "Roboto", "sans-serif"],
              "display": ["Inter", "Roboto", "sans-serif"],
              "body": ["Inter", "Roboto", "sans-serif"],
              "label": ["Public Sans", "Roboto", "sans-serif"],
              "mono": ["Roboto Mono", "monospace"]
            }
          }
        }
      }
    </script>
<style>
      body { font-family: 'Roboto', sans-serif; }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .spin-slow {
        animation: spin 3s linear infinite;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .blur-overlay {
        backdrop-filter: blur(4px);
        background-color: rgba(26, 28, 30, 0.4);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface text-on-surface shadow-sm flex justify-between items-center px-4 h-16 w-full z-40 sticky top-0">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary p-2 hover:bg-surface-variant transition-colors active:scale-95 transition-transform">menu</button>
<h1 class="font-headline text-lg font-bold">Mifos-X Back Office</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline/20">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a financial officer in a clean, modern corporate environment. The lighting is bright and natural, reflecting a high-end, trustworthy light-mode office aesthetic. The color palette is composed of soft whites and professional blues, ensuring a clinical and reliable visual presence consistent with a banking back-office." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAK_Afe-SxuTjj8B2Rwis86mhZOogcFmvWzlqDqRN2asRJ9UY67C1VSbsq6eDZ7Vr3XpN7Ep98H1tonQHASVmlvd7-gherj3BTzH2YbXBh_iWBtGpPtDCIbRKvZJ6KVqFHzPRxHNNIqEBJ9l7C7kkcKfAFhllI_iA1Rn4W7eaRsbykmAztNjieInuF-YzIQbvBvL9-h-U0LBej_p8NcEzK7tykF9YJdW-tkr-kCz7c_99arun6LZo9iTUGBFVri-LEMAVPmSBJVNU3W"/>
</div>
</header>
<!-- Main Content (Blurred/Dimmed State) -->
<main class="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-6 filter blur-[2px] pointer-events-none select-none">
<header id="form-header">
<h2 class="text-2xl font-bold font-headline text-on-surface">Submit Loan Application</h2>
</header>
<section class="flex flex-col gap-4" id="schema-fields">
<!-- Applicant Name -->
<div class="flex flex-col gap-1" id="text-field">
<label class="text-sm font-medium text-on-surface-variant ml-1">Applicant Name</label>
<div class="bg-surface-variant rounded-md px-4 py-3 text-on-surface border-b border-outline">
                    Ananya Sharma
                </div>
</div>
<!-- Loan Product -->
<div class="flex flex-col gap-1" id="select-field">
<label class="text-sm font-medium text-on-surface-variant ml-1">Loan Product</label>
<div class="bg-surface-variant rounded-md px-4 py-3 flex justify-between items-center text-on-surface border-b border-outline">
<span>Individual Micro Loan</span>
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
<!-- Application Date -->
<div class="flex flex-col gap-1" id="date-field">
<label class="text-sm font-medium text-on-surface-variant ml-1">Application Date</label>
<div class="bg-surface-variant rounded-md px-4 py-3 flex justify-between items-center text-on-surface border-b border-outline">
<span>10/24/2023</span>
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</section>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-4">
<button class="w-full py-4 bg-surface-variant text-on-surface-variant font-bold rounded-xl flex items-center justify-center gap-2" disabled="" id="submit-button">
                Submit
            </button>
<button class="w-full py-4 border border-outline text-on-surface-variant font-bold rounded-xl flex items-center justify-center gap-2" disabled="" id="retry-button">
                Retry
            </button>
</div>
</main>
<!-- Submitting State Overlay (Foreground) -->
<div class="fixed inset-0 z-50 flex items-center justify-center px-6 blur-overlay">
<div class="bg-surface w-full max-w-sm rounded-lg shadow-2xl p-8 flex flex-col items-center text-center gap-6 border border-outline/10">
<!-- Animated Icon -->
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-4xl spin-slow">sync</span>
</div>
<div class="space-y-2">
<h3 class="text-xl font-bold font-headline text-on-surface">Processing...</h3>
<p class="text-sm text-on-surface-variant leading-relaxed">
                    Submitting updates to the core banking server. Please do not close this window.
                </p>
</div>
<!-- Progress Indicator -->
<div class="w-full space-y-2">
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 75%;"></div>
</div>
<div class="flex justify-end">
<span class="text-xs font-mono font-medium text-primary">75%</span>
</div>
</div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-40 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-xs font-medium">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-xs font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label text-xs font-medium">Collections</span>
</a>
<!-- Sync (Active State) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label text-xs font-medium">Sync</span>
</a>
</nav>
<script>
      // Simulate slight progress movement for aesthetic feel
      const progressBar = document.querySelector('.h-full.bg-primary');
      const progressText = document.querySelector('.text-xs.font-mono');
      let progress = 75;
      
      const interval = setInterval(() => {
        if (progress < 92) {
          progress += Math.random() * 0.5;
          progressBar.style.width = `${progress}%`;
          progressText.innerText = `${Math.floor(progress)}%`;
        } else {
          clearInterval(interval);
        }
      }, 2000);
    </script>
</body></html>
