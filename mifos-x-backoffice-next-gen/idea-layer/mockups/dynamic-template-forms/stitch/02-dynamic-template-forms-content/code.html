<script>
        // Simple tap affordance for form validation mockup
        document.getElementById('submit-button').addEventListener('click', () => {
            const inputs = document.querySelectorAll('input, select');
            let allFilled = true;
            inputs.forEach(input => {
                if (!input.value) {
                    input.classList.add('border-error');
                    allFilled = false;
                } else {
                    input.classList.remove('border-error');
                }
            });

            if (allFilled) {
                const btn = document.getElementById('submit-button');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';
                setTimeout(() => {
                    btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Client Created!';
                    btn.classList.replace('bg-primary', 'bg-tertiary-container');
                }, 1500);
            }
        });

        // Date input helper to ensure placeholder-like behavior
        const dateInput = document.getElementById('dob');
        dateInput.addEventListener('focus', () => {
            dateInput.showPicker();
        });
    </script>
