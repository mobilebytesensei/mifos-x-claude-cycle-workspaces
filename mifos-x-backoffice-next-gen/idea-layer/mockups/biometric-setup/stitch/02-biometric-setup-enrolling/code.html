<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Biometric Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        secondary: "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        tertiary: "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        surface: "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        background: "#FCFCFF",
                        "on-background": "#1A1C1E",
                        outline: "#72777F",
                        success: "#2E7D32",
                        warning: "#F57C00",
                        "warning-strong": "#B45309",
                        error: "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        sm: "4px",
                        md: "8px",
                        lg: "16px",
                        xl: "28px"
                    },
                    spacing: {
                        xs: "4px",
                        sm: "8px",
                        md: "16px",
                        lg: "24px",
                        xl: "32px",
                        xxl: "48px"
                    },
                    fontFamily: {
                        h1: ["Roboto"],
                        h2: ["Roboto"],
                        h3: ["Roboto"],
                        body: ["Roboto"],
                        label: ["Roboto"],
                        caption: ["Roboto"],
                        mono: ["Roboto Mono"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #FCFCFF;
            color: #1A1C1E;
            -webkit-tap-highlight-color: transparent;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        
        .biometric-pulse::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 2px solid #006CB5;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        .biometric-pulse::after {
            content: '';
            position: absolute;
            inset: -40px;
            border-radius: 50%;
            border: 2px solid rgba(0, 108, 181, 0.5);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            animation-delay: 0.5s;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface text-on-surface border-b border-outline flex justify-between items-center w-full px-md h-16 shrink-0 transition-colors duration-200 docked full-width top-0 z-50">
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-variant/50 text-on-surface transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h3 text-[1.375rem] font-semibold leading-[1.35] text-primary flex-1 text-center pr-12">
            Biometric Setup
        </h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto w-full max-w-md mx-auto px-md py-lg flex flex-col justify-start items-center">
<!-- Illustration -->
<div class="relative w-48 h-48 mb-xl mt-lg flex items-center justify-center rounded-full bg-surface-container-low shadow-sm border border-outline/20">
<div class="relative w-full h-full rounded-full overflow-hidden biometric-pulse">
<img alt="Biometric Scanning" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLuTXW7RE6VLnTNCdhglIEyVwJhGZD3UgKKYVcHLm5y2Nxqrw4of39cYf4TlNfitqE1eVHWHOuycIiT_utdsJqbFPTGB47ptetf_7dzpZRbdmvKjIphQe-lmb2CaRjHg9Bc2axCwSTYafYxsQg3J0R7eewwXQnP2fkBfcW-bkuUYbU5E4M-gBQM3BPrBhSeeiqNiU7WAA0EVGalAnwGS3ZrjnVh6uWD400jRB8iNiHj7YTAZImmY13IF3CKk"/>
</div>
</div>
<!-- Description -->
<p class="font-body text-[1rem] leading-[1.5] text-center text-on-surface-variant mb-xl px-sm">
            Scan your fingerprint to enable quick and secure access to the Mifos Back Office. This allows for offline-first authentication when network access is limited.
        </p>
<!-- Enrollment Progress -->
<div class="w-full mb-xl">
<div class="flex justify-between items-center mb-sm">
<span class="font-label text-[0.875rem] font-medium text-on-surface-variant">Enrolling...</span>
<span class="font-mono text-[0.875rem] text-primary font-medium">65%</span>
</div>
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-[65%] transition-all duration-300 ease-out"></div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-md mt-auto">
<button class="w-full bg-primary text-on-primary rounded-xl px-md py-3 font-label text-[0.875rem] font-medium flex items-center justify-center gap-sm active:scale-[0.98] transition-transform" id="enroll_button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
                Enroll Fingerprint
            </button>
<button class="w-full bg-surface text-primary border border-primary rounded-xl px-md py-3 font-label text-[0.875rem] font-medium flex items-center justify-center gap-sm active:bg-primary-container/30 transition-colors" id="open_os_settings_button">
<span class="material-symbols-outlined">settings</span>
                Open Device Settings
            </button>
<button class="w-full text-on-surface-variant rounded-xl px-md py-3 font-label text-[0.875rem] font-medium flex items-center justify-center gap-sm active:bg-surface-variant/50 transition-colors" id="retry_button">
<span class="material-symbols-outlined">sync</span>
                Retry
            </button>
</div>
<!-- Footer Buttons -->
<div class="w-full flex justify-between items-center mt-xl pt-md border-t border-surface-variant">
<button class="text-on-surface-variant font-label text-[0.875rem] font-medium px-sm py-2 hover:bg-surface-variant/30 rounded-md transition-colors" id="skip_button">
                Skip for Now
            </button>
<button class="bg-surface-variant text-on-surface-variant rounded-xl px-lg py-2 font-label text-[0.875rem] font-medium opacity-70 cursor-not-allowed" disabled="" id="done_button">
                Done
            </button>
</div>
</main>
<!-- Navigation Shell Suppressed: Linear/Transactional Flow -->
<!-- As per rules, navigation is excluded for Login, Sign-up, Onboarding, Checkout flows. Biometric Setup falls under Onboarding/Setup (Transactional/Task-focused with 'Skip/Done' actions). -->
</body></html>
