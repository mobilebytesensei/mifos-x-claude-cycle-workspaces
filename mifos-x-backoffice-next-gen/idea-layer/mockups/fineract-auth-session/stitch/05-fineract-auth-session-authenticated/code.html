<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Mifos-X Back Office - Connection Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono&amp;family=Inter:wght@400;600;700&amp;family=Public+Sans:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    fontFamily: {
                        "headline": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"],
                        "body": ["Roboto", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #FCFCFF;
            color: #1A1C1E;
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .font-title-large {
            font-size: 1.375rem;
            font-weight: 600;
            line-height: 1.35;
        }
        .font-body-large {
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar Shell -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-outline flex items-center justify-between px-md h-14 w-full">
<div class="flex items-center gap-md">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-variant/50 transition-colors duration-200 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-h3 font-semibold text-primary">Sign In</h1>
</div>
<button class="p-2 rounded-full hover:bg-surface-variant/50 transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-14 pb-20 overflow-y-auto">
<div class="px-md py-lg flex flex-col gap-lg max-w-xl mx-auto items-start">
<!-- Header & Description -->
<div class="flex flex-col gap-sm">
<h2 class="font-title-large text-on-surface">Connection Settings</h2>
<p class="font-body-large text-on-surface-variant">Enter your server details to connect to the core ledger.</p>
</div>
<!-- Form Section -->
<form class="w-full flex flex-col gap-md">
<!-- Base URL -->
<div class="flex flex-col gap-xs">
<label class="text-sm font-medium text-on-surface-variant ml-1">Base URL</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="dns">dns</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-variant border-none rounded-sm focus:ring-2 focus:ring-primary text-on-surface placeholder:text-on-surface-variant/60 font-body" placeholder="https://demo.mifos.io" type="url"/>
</div>
</div>
<!-- Tenant -->
<div class="flex flex-col gap-xs">
<label class="text-sm font-medium text-on-surface-variant ml-1">Tenant</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="corporate_fare">corporate_fare</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-variant border-none rounded-sm focus:ring-2 focus:ring-primary text-on-surface placeholder:text-on-surface-variant/60 font-body" placeholder="default" type="text"/>
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-xs">
<label class="text-sm font-medium text-on-surface-variant ml-1">Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-variant border-none rounded-sm focus:ring-2 focus:ring-primary text-on-surface placeholder:text-on-surface-variant/60 font-body" placeholder="admin" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="text-sm font-medium text-on-surface-variant ml-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-variant border-none rounded-sm focus:ring-2 focus:ring-primary text-on-surface placeholder:text-on-surface-variant/60 font-body" id="password-input" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Status Banner -->
<div class="mt-md bg-error-container p-md rounded-lg border border-error/20 flex items-start gap-md animate-in fade-in slide-in-from-top-1 duration-300">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="error">error</span>
<div class="flex flex-col">
<p class="text-sm font-medium text-on-error-container">Connection failed. Please verify your server settings and try again.</p>
</div>
</div>
<!-- Actions -->
<div class="mt-xl flex flex-col gap-md">
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-medium text-base shadow-sm hover:brightness-110 active:scale-[0.98] transition-all" type="submit">
                        Sign In
                    </button>
<button class="w-full py-4 bg-transparent border-2 border-primary text-primary rounded-xl font-medium text-base hover:bg-primary/5 active:scale-[0.98] transition-all" type="button">
                        Retry Connection
                    </button>
</div>
</form>
</div>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-sm pb-safe h-20 bg-surface border-t border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-transform duration-150 scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label text-[12px] font-medium">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-transform duration-150 scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="groups">groups</span>
<span class="font-label text-[12px] font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-variant transition-transform duration-150 scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label text-[12px] font-medium">Collections</span>
</a>
<!-- Sync (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform duration-150 scale-100" href="#">
<span class="material-symbols-outlined mb-1" data-icon="sync" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label text-[12px] font-medium">Sync</span>
</a>
</nav>
<script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const icon = document.getElementById('password-toggle-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
