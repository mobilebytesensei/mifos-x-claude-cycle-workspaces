<style>

<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-4 h-16 w-full bg-surface dark:bg-surface border-b border-outline dark:border-outline fixed top-0 left-0 z-50">

</div>
<div class="flex items-center">

</div>
</div>

<!-- Main Content: Error State -->
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-16 pb-20">
<div class="w-full max-w-md flex flex-col items-center text-center animate-fade-in">
<!-- Large Centered Error Illustration -->
<div class="w-64 h-64 mb-8 flex items-center justify-center relative">
<img alt="Error State Illustration" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLs_emhizJtha5ZQW4Om8aN1hyyfQ8qyS9eEmB92hTQMu-hKcEiWX35RbtNVJ1WKBP-fW_7gVAvbM5FpLB4nQMmsDga8bnHidhKCUadYjh-0N9uIewCujdMMpSeYaeng6LGI1jWox0wZX0d7_EOsknDUSBEED_c-ZKPrKn6rwkkSZQAVEq_lFLIOCsogKsApUvdGl7pwsGJPF_1qiYHLflfM-bzzi6s4qSuW0Ro5Hy0_55A7-AbLjS9e6Wu-"/>
<!-- Subtle Backdrop Glow for Depth -->
<div class="absolute -z-10 w-48 h-48 bg-error-container/30 blur-3xl rounded-full"></div>
</div>
<!-- Error Messaging -->
<h2 class="text-h2 font-bold text-on-surface mb-2 tracking-tight">Connection Interrupted</h2>
<p class="text-body text-on-surface-variant mb-10 leading-relaxed max-w-xs">
                Unable to load pending checker items. Please check your network connection and try again.
            </p>
<!-- Primary Action -->
<button class="group relative flex items-center gap-2 bg-primary text-on-primary px-8 py-4 rounded-xl font-label text-label font-bold transition-all duration-300 hover:bg-[#005a96] hover:shadow-lg active:scale-95" id="retryButton">
<span class="material-symbols-outlined transition-transform duration-500 group-hover:rotate-180">sync</span>
                Retry
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface dark:bg-surface border-t border-outline dark:border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-low p-2 rounded-lg transition-transform duration-150 scale-95" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label text-caption font-medium mt-1">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-low p-2 rounded-lg transition-transform duration-150 scale-95" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label text-caption font-medium mt-1">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-low p-2 rounded-lg transition-transform duration-150 scale-95" href="#">
<span class="material-symbols-outlined">payments</span>
<span class="font-label text-caption font-medium mt-1">Collections</span>
</a>
<!-- Sync (Active State) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">sync</span>
<span class="font-label text-caption font-bold mt-0.5">Sync</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        const retryBtn = document.getElementById('retryButton');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            retryBtn.innerText = 'Retrying...';
            
            // Simulate a brief delay before "failing" again or resetting
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                retryBtn.innerHTML = '<span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500">sync</span> Retry';
            }, 1500);
        });

        // Simple Fade In Animation for Content
        document.addEventListener('DOMContentLoaded', () => {
            const content = document.querySelector('.animate-fade-in');
            content.style.opacity = '0';
            content.style.transform = 'translateY(10px)';
            content.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
            
            requestAnimationFrame(() => {
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            });
        });
    </script>
</body></html>
