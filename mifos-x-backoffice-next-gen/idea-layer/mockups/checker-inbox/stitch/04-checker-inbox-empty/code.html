<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Checker Inbox - Mifos-X</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Public+Sans:wght@500;600;700&amp;family=Roboto+Mono&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Roboto", "Inter", "sans-serif"],
                        "display": ["Roboto", "Inter", "sans-serif"],
                        "body": ["Roboto", "Inter", "sans-serif"],
                        "label": ["Public Sans", "Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px"
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #FCFCFF;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Micro-interactions */
        .tap-target:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
    </style>
</head>
<body class="text-on-background bg-background min-h-screen flex flex-col overflow-x-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface shadow-sm flex items-center px-4 h-16 w-full">
<div class="flex items-center w-full max-w-2xl mx-auto">
<button class="material-symbols-outlined text-primary p-2 rounded-full hover:bg-surface-variant transition-colors duration-200">
                menu
            </button>
<h1 class="font-headline text-[1.375rem] font-bold text-on-surface ml-2">Checker Inbox</h1>
<div class="flex-grow"></div>
<button class="material-symbols-outlined text-on-surface-variant p-2 rounded-full hover:bg-surface-variant transition-colors duration-200">
                search
            </button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-16 pb-20 w-full max-w-2xl mx-auto px-4 flex flex-col">
<!-- Filter Chips Row -->
<div class="flex items-center space-x-2 py-4 overflow-x-auto no-scrollbar">
<!-- All (Active) -->
<button class="bg-primary-container text-on-primary-container px-4 py-1.5 rounded-md text-sm font-medium transition-all tap-target">
                All
            </button>
<!-- Loans -->
<button class="border border-outline text-on-surface-variant px-4 py-1.5 rounded-md text-sm font-medium hover:bg-surface-variant transition-all tap-target">
                Loans
            </button>
<!-- Savings -->
<button class="border border-outline text-on-surface-variant px-4 py-1.5 rounded-md text-sm font-medium hover:bg-surface-variant transition-all tap-target">
                Savings
            </button>
<!-- Clients -->
<button class="border border-outline text-on-surface-variant px-4 py-1.5 rounded-md text-sm font-medium hover:bg-surface-variant transition-all tap-target">
                Clients
            </button>
</div>
<!-- Empty State Container -->
<div class="flex-grow flex flex-col items-center justify-center text-center px-6 py-12">
<!-- Illustration -->
<div class="mb-8 w-64 h-64 flex items-center justify-center">
<img alt="Empty state illustration showing a clipboard with no items" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLuny6yuLoOSg1sueGpgQpeq-c-Dg8yDqNZUYhcp2ZYXYby1ZiZ7UIHB1y_tB3y55uRuorf-lZMjVuYVe2qaWbF3NGB0-q1ggRqHmmpxLiWfBjYDq30PjGrDFiew4bMQDQwN9J_W_bviUA4fwP1ON7bRIS1PWMk8AgvN2Br8bu9QFQ02WCigEMoaqnaGihKLDjMnZDzeXbwnt3jwKq9BU0y9RTr09ynT1LCU3Ki1-ZDq8pfY9Z4f7tp0ApJ4"/>
</div>
<!-- Content -->
<h2 class="font-headline text-2xl font-bold text-on-surface mb-3">No pending items found</h2>
<p class="text-on-surface-variant text-base leading-relaxed mb-8 max-w-xs mx-auto">
                Your checker inbox is clear. New items for review will appear here. Enjoy the calm while it lasts.
            </p>
<!-- Refresh Button -->
<button class="bg-primary text-on-primary px-6 py-3 rounded-xl font-medium flex items-center justify-center space-x-2 shadow-sm hover:opacity-90 active:scale-95 transition-all tap-target">
<span class="material-symbols-outlined">refresh</span>
<span class="font-label">Refresh Inbox</span>
</button>
</div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 transition-transform duration-100 scale-100 hover:scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label text-[0.75rem] font-medium">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 transition-transform duration-100 scale-100 hover:scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">group</span>
<span class="font-label text-[0.75rem] font-medium">Clients</span>
</a>
<!-- Collections -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 transition-transform duration-100 scale-100 hover:scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">payments</span>
<span class="font-label text-[0.75rem] font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 transition-transform duration-100 scale-100 hover:scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">sync</span>
<span class="font-label text-[0.75rem] font-medium">Sync</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the refresh button
        const refreshBtn = document.querySelector('button.bg-primary');
        refreshBtn.addEventListener('click', () => {
            const icon = refreshBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            
            // Simulate a brief delay then stop spinning
            setTimeout(() => {
                icon.classList.remove('animate-spin');
            }, 1000);
        });

        // Horizontal scroll for chips
        const scrollContainer = document.querySelector('.overflow-x-auto');
        scrollContainer.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            scrollContainer.scrollLeft += evt.deltaY;
        });
    </script>
</body></html>
