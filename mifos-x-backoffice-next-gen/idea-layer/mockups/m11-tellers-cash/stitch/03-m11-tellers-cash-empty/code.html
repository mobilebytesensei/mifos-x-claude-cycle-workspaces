    /* Custom Scrollbar for a clean admin look */

<body class="flex flex-col min-h-screen">
<!-- TopAppBar Component -->

</div>
</div>

<!-- Main Content Area -->
<main class="flex-grow pt-16 pb-20 flex flex-col items-center justify-center px-6">
<!-- Empty State Content -->
<div class="max-w-md w-full text-center flex flex-col items-center animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Empty State Illustration -->
<div class="mb-8 w-full max-w-[280px] aspect-square flex items-center justify-center rounded-lg">
<img alt="No Tellers illustration" class="w-full h-auto drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLtg7wQqX_5eVHXbw5nHPJkUMpj2grOTy5Dg58_AspFCiDC_uUAkhbY9nuYelLtPeMyDSHRQ01es5fAKrt9JQ8Gnn97yfLkd096KoXlcJ1cBPYx3v3shZC0ARWqEaXVBUuDThdFZfAvxy0cJoDA_nc5PN5Hu3UsDwLxfknQUCr4KTIsSUCS8j7dJbJwGljCE3rFOAQ2m2-JSlpQJXLx9eDtUyHpZxY-LPdnEVUDMaSvQZeEpOhfH39_bP2c"/>
</div>
<!-- Semantic Message Hierarchy -->
<h2 class="text-[1.75rem] font-semibold text-on-surface leading-tight mb-3">No Tellers Found</h2>
<p class="text-on-surface-variant text-base font-normal leading-relaxed mb-10 max-w-[320px]">
        You haven't added any tellers yet. Start by creating a new teller to manage branch cash operations.
      </p>
<!-- Primary CTA Button -->
<!-- button-primary mapping: primary color, white text, xl rounded (pill) -->
<button class="bg-primary text-on-primary font-label text-sm font-medium px-8 py-3 rounded-xl shadow-md hover:brightness-110 active:scale-95 transition-all flex items-center gap-2">

        New Teller

</div>
<!-- Background Subtle Texture (Non-intrusive) -->
<div class="fixed inset-0 -z-10 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#006CB5 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
</main>
<!-- BottomNavBar Component -->
<!-- JSON Logic: "Collections" is the active tab based on user intent. -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-2 pb-safe bg-surface border-t border-outline">
<!-- Home Item -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant rounded-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-[0.75rem] font-medium mt-1">Home</span>
</a>
<!-- Clients Item -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant rounded-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label text-[0.75rem] font-medium mt-1">Clients</span>
</a>
<!-- Collections Item (ACTIVE STATE) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 active:scale-95 transition-transform duration-100" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label text-[0.75rem] font-medium mt-1">Collections</span>
</a>
<!-- Sync Item -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-variant rounded-full transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-[0.75rem] font-medium mt-1">Sync</span>
</a>
</nav>
<!-- Micro-interactions & Visual Effects -->
<script>
    // Ripple effect for the primary button
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', function(e) {
        const x = e.clientX - e.target.offsetLeft;
        const y = e.clientY - e.target.offsetTop;
        const ripples = document.createElement('span');
        ripples.style.left = x + 'px';
        ripples.style.top = y + 'px';
        ripples.classList.add('ripple');
        this.appendChild(ripples);
        setTimeout(() => ripples.remove(), 600);
      });
    });
  </script>
<style>
    .ripple {
      position: absolute;
      background: white;
      transform: translate(-50%, -50%);
      pointer-events: none;
      border-radius: 50%;
      animation: animate 0.6s linear infinite;
      opacity: 0.3;
    }
    @keyframes animate {
      0% { width: 0px; height: 0px; opacity: 0.5; }
      100% { width: 500px; height: 500px; opacity: 0; }
    }
  </style>
</body></html>
