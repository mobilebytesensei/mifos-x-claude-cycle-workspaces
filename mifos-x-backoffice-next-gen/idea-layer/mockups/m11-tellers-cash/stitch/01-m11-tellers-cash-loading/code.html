<style>

            100% { background-position: 1000px 0; }

            background: linear-gradient(90deg, #ebeeee 25%, #f1f4f4 50%, #ebeeee 75%);

<!-- Logic for shimmer variations -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Apply slight random widths to skeletons to make them look more natural
            const skeletons = document.querySelectorAll('.skeleton-block:not([class*="w-"])');
            skeletons.forEach(skel => {
                const randomWidth = Math.floor(Math.random() * (90 - 40 + 1) + 40);
                skel.style.width = randomWidth + '%';
            });
        });
