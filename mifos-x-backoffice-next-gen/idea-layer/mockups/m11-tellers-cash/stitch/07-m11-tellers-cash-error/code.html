<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tellers &amp; Cash Management - Error State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&amp;family=Roboto+Mono:wght@400;500;700&amp;family=Public+Sans:wght@400;500;600&amp;family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006CB5",
                        "on-primary": "#FFFFFF",
                        "primary-container": "#CBE6FF",
                        "on-primary-container": "#001D33",
                        "secondary": "#00796B",
                        "on-secondary": "#FFFFFF",
                        "secondary-container": "#B8F2E6",
                        "on-secondary-container": "#00201A",
                        "tertiary": "#5B5891",
                        "on-tertiary": "#FFFFFF",
                        "tertiary-container": "#E3DFFF",
                        "on-tertiary-container": "#17124B",
                        "surface": "#FCFCFF",
                        "on-surface": "#1A1C1E",
                        "surface-variant": "#DEE3EB",
                        "on-surface-variant": "#42474E",
                        "surface-container-low": "#F3F4F9",
                        "background": "#FCFCFF",
                        "on-background": "#1A1C1E",
                        "outline": "#72777F",
                        "success": "#2E7D32",
                        "warning": "#F57C00",
                        "warning-strong": "#B45309",
                        "error": "#BA1A1A",
                        "on-error": "#FFFFFF",
                        "error-container": "#FFDAD6",
                        "on-error-container": "#410002"
                    },
                    borderRadius: {
                        "DEFAULT": "4px",
                        "sm": "4px",
                        "md": "8px",
                        "lg": "16px",
                        "xl": "28px",
                        "full": "9999px"
                    },
                    spacing: {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "48px"
                    },
                    fontFamily: {
                        "headline": ["Inter", "Roboto", "sans-serif"],
                        "display": ["Inter", "Roboto", "sans-serif"],
                        "body": ["Inter", "Roboto", "sans-serif"],
                        "label": ["Public Sans", "Roboto", "sans-serif"],
                        "mono": ["Roboto Mono", "monospace"]
                    },
                    fontSize: {
                        "h1": ["2rem", { lineHeight: "1.25", fontWeight: "700" }],
                        "h2": ["1.75rem", { lineHeight: "1.3", fontWeight: "600" }],
                        "h3": ["1.375rem", { lineHeight: "1.35", fontWeight: "600" }],
                        "body": ["1rem", { lineHeight: "1.5", fontWeight: "400" }],
                        "label": ["0.875rem", { lineHeight: "1.4", fontWeight: "500" }],
                        "caption": ["0.75rem", { lineHeight: "1.4", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            font-family: 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-surface text-primary border-b border-outline fixed top-0 w-full z-50 flex justify-between items-center px-md h-14">
<div class="flex items-center gap-md">
<button class="p-sm rounded-full hover:bg-surface-variant/50 transition-colors duration-200 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline text-h3 font-bold text-on-surface">Tellers &amp; Cash</h1>
</div>
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-primary-container overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a male bank administrator with a clean-cut look, wearing a professional business casual outfit. The lighting is soft and neutral, consistent with a high-end corporate financial application interface. The background is a blurred minimalist office setting to maintain focus on the user profile avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6sUaQMLNP94ZpaTwaAFsdq5RFfB9ZTbY5Nuw_S2ey024INkVYYv9VAdkMlbDZKWWNedZlpZN4UhiGTlAYIlPVpRqPba8lApO1AlR0VymyB3KJBbfijKlqrVVGX7bkqOEsK6_BGyNJcuaN5GdzIyEXL4fRD_h7k7LG-yaHGPMZeKYONSfT5-Cu6yX2Npur3HzjhaeW0TEk4OzzJdF9UqEL5O2GG3sC9Uo1Vnh5qYZ5LLOqCTqlDgxVRJKSbhvvS4wlyVaJKrOjteUS"/>
</div>
</div>
</header>
<!-- Offline Warning Banner -->
<div class="mt-14 bg-warning-strong text-on-primary px-md py-sm flex items-center gap-sm animate-pulse">
<span class="material-symbols-outlined text-[20px]" data-icon="cloud_off">cloud_off</span>
<p class="font-label text-label">You are currently offline. Local changes will sync when connection is restored.</p>
</div>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-lg pb-xxl text-center max-w-2xl mx-auto">
<!-- Error Illustration Container -->
<div class="relative w-48 h-48 md:w-64 md:h-64 mb-lg group">
<!-- Subtle glow background effect -->
<div class="absolute inset-0 bg-primary/5 rounded-full scale-110 blur-2xl transition-transform group-hover:scale-125 duration-700"></div>
<!-- Graphic Placeholder -->
<img alt="Connection Error Illustration" class="relative z-10 w-full h-full object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLtL6bWUJofHDdueJnK2F1D_YYqkwd-I9hi9GUAedq_r0c6qsR0RyUFByG7H0D6IhngyhlJj8Wi4igXbmB8YFKTweoLqVwxO4W1twOMQxKJY4QIZrHEK6ZBB3qEkGXdt1W2DqKMdrNLqIBi_uxa_2x9beVtBmvPzi73B5-LjBrdzUTkRD5Ofmqmx4ZEDpE7cSQVFlnfX0pxjP0dO4NLDXpmrTsSelckjzS0OVGEWkBgcEdNBiGTNnNOnxgU"/>
</div>
<!-- Typography -->
<div class="space-y-sm mb-xl">
<h2 class="text-h1 font-headline text-on-surface">Connection Error</h2>
<p class="text-body text-on-surface-variant max-w-md mx-auto">
                Unable to sync financial data. Please check your connection and try again.
            </p>
</div>
<!-- Actions -->
<button class="bg-primary text-on-primary rounded-xl px-xl py-md font-label flex items-center gap-sm shadow-sm hover:brightness-110 active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500" data-icon="sync">sync</span>
<span>Retry</span>
</button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-md py-sm bg-surface border-t border-outline">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-label font-medium mt-1">Home</span>
</a>
<!-- Clients -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label text-label font-medium mt-1">Clients</span>
</a>
<!-- Collections (ACTIVE) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-95 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label text-label font-medium">Collections</span>
</a>
<!-- Sync -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 p-2 rounded-lg" href="#">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
<span class="font-label text-label font-medium mt-1">Sync</span>
</a>
</nav>
<!-- Micro-interaction script -->
<script>
        document.querySelector('button').addEventListener('click', function() {
            const icon = this.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            setTimeout(() => {
                icon.classList.remove('animate-spin');
            }, 1000);
        });
    </script>
</body></html>
