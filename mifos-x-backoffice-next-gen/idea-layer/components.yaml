# Tier-3 Project Components — mifos-x-backoffice-next-gen (MifosX BackOffice)
#
# Domain-specific composite components for the permission-gated Fineract back-office.
# Each entry extends a framework primitive/pattern (inherited from PRIMITIVES.yaml +
# registry/*.yaml because inherits_registry: true) and registers the EXACT
# `components[].type` spelling used across the 21 features' screens/*/ui.yaml so the
# coherence audit (COMP-1 / RULE-COMPONENT-REGISTRY-001) resolves them.
#
# Design system: idea-layer/design-system/DESIGN.md
# Material 3 · Light-Blue primary · Teal accent #00796B · borders-over-shadows · density 7
# accessibility-first + regulated-industry (variance≤4 / motion≤3).
#
# Authored by an /idea sync foundation-wave coherence heal (component_type_unknown) — the
# 6 types below were the complete undeclared set flagged across all 21 features.

schema_version: "1.0"
project: "mifos-x-backoffice-next-gen"
inherits_registry: true

components:

  # ────────────────────────────────────────────────────────────────
  # content_area — the primary scrollable content slot every screen body
  # hangs its permission-filtered components inside. Present in all 21 features.
  # ────────────────────────────────────────────────────────────────
  - name: content_area
    type: content_area
    tier: project
    extends: column
    category: containers
    description: >
      Primary scrollable content region of a screen body. Hosts the screen's
      permission-filtered components and owns the screen-level scroll + safe-area
      padding. Renders the state-aware payload (content / loading / empty / error /
      no-network) surfaced by the ViewModel uiState.
    a11y:
      role: main
      semantic_html: main
      label_source: "{screenTitle} content"
      contrast_required: true
    default_style:
      background: surface
      padding: spacing.md
      gap: spacing.md
      scrollable: true
    slots:
      required: [body]
      optional: [header, footer, refresh_control]
    supported_states: [content, loading, empty, error, no_network]
    state_styles:
      loading: { opacity: opacity.loading }
      empty: { background: surface }
      error: { background: surface }
      no_network: { background: surfaceVariant }
    properties_schema:
      type: object
      properties:
        scrollable: { type: boolean, default: true }
        state: { type: string, enum: [content, loading, empty, error, no_network] }

  # ────────────────────────────────────────────────────────────────
  # tappable_card — a card surface with tap/navigation semantics
  # (dashboard KPI/quick-action tiles, list drill-down cards).
  # ────────────────────────────────────────────────────────────────
  - name: tappable_card
    type: tappable_card
    tier: project
    extends: card
    category: surfaces
    description: >
      Card surface that carries an on_click tap target — used for dashboard KPI
      tiles, quick-action tiles, and drill-down list cards. Border-over-shadow per
      the design system; independently hydrated (one failing tile never blanks the rest).
    a11y:
      role: button
      semantic_html: button
      label_source: "{cardTitle}"
      contrast_required: true
      min_touch_target_dp: 48
    default_style:
      background: surface
      border: outlineVariant
      border_width: border.sm
      corner_radius: radius.md
      padding: spacing.md
      elevation: elevation.level0
    slots:
      required: [title]
      optional: [leading_icon, value, caption, trailing_icon, badge]
    supported_states: [idle, pressed, loading, error, disabled]
    state_styles:
      pressed: { background: surfaceVariant, border: primary }
      loading: { opacity: opacity.loading }
      error: { border: error }
      disabled: { opacity: opacity.disabled }
    on_click:
      action: navigate
      target: null   # per-instance target set in the consuming ui.yaml component
    properties_schema:
      type: object
      required: [title]
      properties:
        title: { type: string }
        value: { type: string }
        enabled: { type: boolean, default: true }

  # ────────────────────────────────────────────────────────────────
  # segmented_control — mutually-exclusive segmented button group
  # (m15 approvals: pending / approved / rejected switcher).
  # ────────────────────────────────────────────────────────────────
  - name: segmented_control
    type: segmented_control
    tier: project
    extends: tab_row
    category: navigation
    description: >
      Single-select segmented button group for switching between mutually-exclusive
      views within a screen (e.g. maker-checker Pending / Approved / Rejected). M3
      segmented buttons; one segment selected at a time.
    a11y:
      role: tablist
      semantic_html: nav
      label_source: "View selector"
      contrast_required: true
    default_style:
      background: surface
      border: outlineVariant
      border_width: border.sm
      corner_radius: radius.full
      padding: "2dp"
    slots:
      required: [segments]
      optional: [count_badges]
    supported_states: [idle, selected, disabled]
    state_styles:
      selected: { background: secondaryContainer, color: onSecondaryContainer }
    properties_schema:
      type: object
      required: [segments, selectedIndex]
      properties:
        segments: { type: array, items: { type: string } }
        selectedIndex: { type: integer, default: 0 }

  # ────────────────────────────────────────────────────────────────
  # filter_chip_row — horizontal scrollable row of filter chips
  # (needs-attention-inbox, m15 approvals filtering).
  # ────────────────────────────────────────────────────────────────
  - name: filter_chip_row
    type: filter_chip_row
    tier: project
    extends: row
    category: inputs
    description: >
      Horizontally-scrollable row of selectable filter chips used to scope a list
      (by status / entity-type / priority). Multi-select; each chip toggles a filter
      facet. Used in needs-attention-inbox and the maker-checker inbox.
    a11y:
      role: group
      semantic_html: div
      label_source: "Filters"
      contrast_required: true
    default_style:
      background: surface
      gap: spacing.sm
      padding: "spacing.sm spacing.md"
      scrollable: horizontal
    slots:
      required: [chips]
      optional: [clear_all_action]
    supported_states: [idle, some_selected, all_cleared]
    properties_schema:
      type: object
      required: [chips]
      properties:
        chips: { type: array, items: { type: string } }
        selected: { type: array, items: { type: string } }

  # ────────────────────────────────────────────────────────────────
  # group_header — sticky section/group header for grouped lists
  # (needs-attention-inbox grouping, m15 grouped approvals).
  # ────────────────────────────────────────────────────────────────
  - name: group_header
    type: group_header
    tier: project
    extends: heading
    category: containers
    description: >
      Section header row that labels a group within a sectioned list (e.g. items
      grouped by entity type, priority, or date bucket). Optional trailing count.
      May stick to the top of its section while scrolling.
    a11y:
      role: heading
      semantic_html: h3
      label_source: "{groupLabel}"
      contrast_required: true
    default_style:
      background: surfaceVariant
      color: onSurfaceVariant
      padding: "spacing.xs spacing.md"
      typography: label_large
    slots:
      required: [label]
      optional: [count_badge, collapse_toggle]
    supported_states: [idle, collapsed]
    properties_schema:
      type: object
      required: [label]
      properties:
        label: { type: string }
        count: { type: integer }
        collapsible: { type: boolean, default: false }

  # ────────────────────────────────────────────────────────────────
  # status_banner — inline connectivity / sync-state banner
  # (offline-sync-engine, m17 sync-settings offline + sync-progress).
  # ────────────────────────────────────────────────────────────────
  - name: status_banner
    type: status_banner
    tier: project
    extends: banner
    category: feedback
    description: >
      Inline banner communicating connectivity / sync state (offline · syncing ·
      synced · queued · error) with an optional action (Retry / View queue). Central
      to the offline-first surfaces — sync console and any screen showing a
      NoNetwork uiState.
    a11y:
      role: status
      semantic_html: aside
      label_source: "Status: {statusLabel}"
      contrast_required: true
    default_style:
      corner_radius: radius.sm
      padding: spacing.md
      border_width: border.sm
    slots:
      required: [status_label]
      optional: [status_icon, action, pending_count]
    supported_states: [offline, syncing, synced, queued, error]
    state_color_map:
      offline:  { background: "#FFF3E0", text: "#E65100", icon: cloud_off }
      syncing:  { background: "#E0F2F1", text: "#00695C", icon: sync }
      synced:   { background: "#E8F5E9", text: "#1B5E20", icon: cloud_done }
      queued:   { background: "#E3F2FD", text: "#0D47A1", icon: schedule }
      error:    { background: "#FFEBEE", text: "#B71C1C", icon: sync_problem }
    properties_schema:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [offline, syncing, synced, queued, error] }
        pendingCount: { type: integer }

  # ────────────────────────────────────────────────────────────────
  # currency_field — money input with currency affix + validation
  # (loan-application-wizard principal, product-editor min/max/default
  # amounts, collection-sheet amount-due entry).
  # ────────────────────────────────────────────────────────────────
  - name: currency_field
    type: currency_field
    tier: project
    extends: text_field
    category: inputs
    description: >
      Numeric money input with a leading/trailing currency affix, thousands
      grouping and decimal-scale bound to the account/product currency. Used
      for principal, min/max/default amounts, charge amounts and cash entry
      across the loan-application wizard, product editor and collection sheet.
    a11y:
      role: spinbutton
      semantic_html: input
      label_source: "{fieldLabel}"
      contrast_required: true
    default_style:
      background: surface
      border: outlineVariant
      border_width: border.sm
      corner_radius: radius.sm
      padding: spacing.sm
      typography: body_large
    slots:
      required: [label]
      optional: [currency_affix, helper_text, error_text]
    supported_states: [idle, focused, disabled, error]
    state_styles:
      focused: { border: primary }
      error: { border: error }
      disabled: { opacity: opacity.disabled }
    properties_schema:
      type: object
      required: [label]
      properties:
        label: { type: string }
        currencyCode: { type: string }
        value: { type: string }
        minValue: { type: string }
        maxValue: { type: string }
        enabled: { type: boolean, default: true }

  # ────────────────────────────────────────────────────────────────
  # dynamic_form_field — runtime-metadata-driven form field
  # (dynamic-template-forms + loan-application-wizard render Fineract
  # template/datatable fields whose type is known only at runtime).
  # ────────────────────────────────────────────────────────────────
  - name: dynamic_form_field
    type: dynamic_form_field
    tier: project
    extends: input
    category: inputs
    description: >
      A form field whose concrete widget (text / number / date / dropdown /
      checkbox) is resolved at runtime from Fineract template + datatable
      column metadata. Backs the dynamic-template-forms feature and the
      template-driven steps of the loan-application wizard. Carries its own
      required/enum/regex validation sourced from the column definition.
    a11y:
      role: group
      semantic_html: div
      label_source: "{columnLabel}"
      contrast_required: true
    default_style:
      background: surface
      gap: spacing.xs
      padding: spacing.sm
    slots:
      required: [label, field_kind]
      optional: [helper_text, error_text, options]
    supported_states: [idle, focused, disabled, error, loading_options]
    state_styles:
      focused: { border: primary }
      error: { border: error }
      disabled: { opacity: opacity.disabled }
      loading_options: { opacity: opacity.loading }
    properties_schema:
      type: object
      required: [label, fieldKind]
      properties:
        label: { type: string }
        fieldKind: { type: string, enum: [text, number, date, dropdown, checkbox, decimal] }
        required: { type: boolean, default: false }
        options: { type: array, items: { type: string } }
        value: { type: string }

  # ────────────────────────────────────────────────────────────────
  # expandable_section — collapsible titled section
  # (product-editor grouped config sections, permission-set-detail /
  # capability-map-detail grouped permission groupings).
  # ────────────────────────────────────────────────────────────────
  - name: expandable_section
    type: expandable_section
    tier: project
    extends: card
    category: containers
    description: >
      Collapsible titled section grouping related fields or rows behind a
      header with an expand/collapse affordance. Used to fold the many config
      groups of the product editor and to group permissions by grouping in the
      permission-set and capability-map detail screens.
    a11y:
      role: region
      semantic_html: section
      label_source: "{sectionTitle}"
      contrast_required: true
    default_style:
      background: surface
      border: outlineVariant
      border_width: border.sm
      corner_radius: radius.md
      padding: spacing.md
      gap: spacing.sm
    slots:
      required: [title, body]
      optional: [leading_icon, trailing_summary, count_badge]
    supported_states: [expanded, collapsed]
    state_styles:
      collapsed: { gap: spacing.none }
    properties_schema:
      type: object
      required: [title]
      properties:
        title: { type: string }
        expanded: { type: boolean, default: false }
        count: { type: integer }

  # ────────────────────────────────────────────────────────────────
  # table_header — column-header row for tabular list surfaces
  # (collection-sheet attendance/repayment grid, report-runner tabular
  # results, m-module data tables).
  # ────────────────────────────────────────────────────────────────
  - name: table_header
    type: table_header
    tier: project
    extends: row
    category: containers
    description: >
      Column-header row for the tabular surfaces of the back-office — the
      collection-sheet repayment/attendance grid, report-runner tabular
      results, and datatable views. Labels each column and carries optional
      sort affordances; sticks to the top of its scrollable table body.
    a11y:
      role: row
      semantic_html: tr
      label_source: "Column headers"
      contrast_required: true
    default_style:
      background: surfaceVariant
      color: onSurfaceVariant
      padding: "spacing.xs spacing.md"
      typography: label_medium
      border_width: border.sm
    slots:
      required: [columns]
      optional: [sort_column, sticky]
    supported_states: [idle, sorted_asc, sorted_desc]
    properties_schema:
      type: object
      required: [columns]
      properties:
        columns: { type: array, items: { type: string } }
        sortColumn: { type: string }
        sortDirection: { type: string, enum: [asc, desc] }

  # ────────────────────────────────────────────────────────────────
  # dropdown_select — labelled single-select dropdown
  # (product-editor product-config selections: fund, interest-calc type,
  # amortization, repayment strategy; any enum-backed config field).
  # ────────────────────────────────────────────────────────────────
  - name: dropdown_select
    type: dropdown_select
    tier: project
    extends: dropdown
    category: inputs
    description: >
      A labelled single-select dropdown bound to a fixed option set. Backs the
      enum-valued configuration fields of the product editor (fund source,
      interest calculation type, amortization type, repayment strategy) where
      the choices are known ahead of time (distinct from dynamic_form_field
      whose widget + options resolve from runtime template metadata).
    a11y:
      role: combobox
      semantic_html: select
      label_source: "{fieldLabel}"
      contrast_required: true
    default_style:
      background: surface
      border: outlineVariant
      border_width: border.sm
      corner_radius: radius.sm
      padding: spacing.sm
    slots:
      required: [label, options]
      optional: [helper_text, error_text, value]
    supported_states: [idle, focused, disabled, error]
    state_styles:
      focused: { border: primary }
      error: { border: error }
      disabled: { opacity: opacity.disabled }
    properties_schema:
      type: object
      required: [label, options]
      properties:
        label: { type: string }
        options: { type: array, items: { type: string } }
        value: { type: string }
        required: { type: boolean, default: false }

  # ────────────────────────────────────────────────────────────────
  # date_range_picker — from/to date-range selector
  # (report-runner parameterised report date range; any from→to filter).
  # ────────────────────────────────────────────────────────────────
  - name: date_range_picker
    type: date_range_picker
    tier: project
    extends: date_picker
    category: inputs
    description: >
      A from→to date-range selector presenting two bound date fields (start and
      end) with validation that end >= start. Backs the report-runner date-range
      report parameter and any tabular filter that scopes results to a period.
    a11y:
      role: group
      semantic_html: fieldset
      label_source: "{rangeLabel}"
      contrast_required: true
    default_style:
      background: surface
      gap: spacing.sm
      padding: spacing.sm
    slots:
      required: [start_label, end_label]
      optional: [helper_text, error_text, min_date, max_date]
    supported_states: [idle, focused, disabled, error]
    state_styles:
      focused: { border: primary }
      error: { border: error }
      disabled: { opacity: opacity.disabled }
    properties_schema:
      type: object
      required: [startLabel, endLabel]
      properties:
        startLabel: { type: string }
        endLabel: { type: string }
        startValue: { type: string }
        endValue: { type: string }
        required: { type: boolean, default: false }

  # ────────────────────────────────────────────────────────────────
  # adaptive_nav_host — Material3 NavigationSuiteScaffold wrapper
  # (nav-shell-assembler — the authenticated app chrome that hosts all
  # 17 module roots and renders bottom-bar / rail / permanent-drawer
  # based on the current window size class).
  # ────────────────────────────────────────────────────────────────
  - name: adaptive_nav_host
    type: adaptive_nav_host
    tier: project
    extends: scaffold
    category: navigation
    description: >
      Material3 NavigationSuiteScaffold wrapper that renders the permission-driven
      nav roster as a bottom-bar (compact phone), navigation-rail (medium tablet),
      or permanent navigation-drawer (expanded desktop) depending on the adaptive
      window size class. Hosts the content pane for the currently active module.
      All nav roots are data-bound to the resolved NavRoster from the
      nav-shell-assembler ViewModel — no hardcoded items.
    a11y:
      role: navigation
      semantic_html: nav
      label_source: "Main navigation"
      contrast_required: true
    default_style:
      background: surface
    slots:
      required: [nav_roster, content_pane]
      optional: [drawer_header, drawer_footer, nav_badge]
    supported_states: [resolving, assembled, empty, error]
    state_styles:
      resolving: { opacity: opacity.loading }
      empty: { background: surface }
    properties_schema:
      type: object
      required: [navRoster]
      properties:
        navRoster: { type: array }
        activeModuleId: { type: string }
        isDrawerOpen: { type: boolean, default: false }

  # ────────────────────────────────────────────────────────────────
  # nav_item — a single permitted module root in the nav shell
  # (bottom-bar item / rail destination / drawer list row rendered by
  # nav-shell-assembler for each NavRoot in the resolved roster).
  # ────────────────────────────────────────────────────────────────
  - name: nav_item
    type: nav_item
    tier: project
    extends: list_item
    category: navigation
    description: >
      A single module root item rendered inside the adaptive_nav_host. Displays
      the module icon + label; carries the active/selected state highlight.
      HIDDEN entirely (not gray-out) when the user holds zero codes in the module's
      permission_family (Tier 1 fail-closed per §4.7). Never shows a disabled state
      to avoid revealing module names the user cannot access.
    a11y:
      role: link
      semantic_html: a
      label_source: "{moduleLabel}"
      contrast_required: true
      min_touch_target_dp: 48
    default_style:
      background: transparent
      color: onSurfaceVariant
      typography: label_medium
      padding: "spacing.sm spacing.md"
      corner_radius: radius.md
    slots:
      required: [icon, label]
      optional: [badge_count]
    supported_states: [idle, active, hidden]
    state_styles:
      active: { background: secondaryContainer, color: onSecondaryContainer }
      hidden: { display: none }
    properties_schema:
      type: object
      required: [moduleId, label, icon]
      properties:
        moduleId: { type: string }
        label: { type: string }
        icon: { type: string }
        badgeCount: { type: integer }
        isActive: { type: boolean, default: false }

  # ────────────────────────────────────────────────────────────────
  # info_banner — inline informational banner (not an error)
  # (network-config demo-mode explanation panel; any non-critical
  # contextual info block within a form).
  # ────────────────────────────────────────────────────────────────
  - name: info_banner
    type: info_banner
    tier: project
    extends: banner
    category: feedback
    description: >
      Inline informational (non-error) banner used to explain a feature or
      provide context before a user action. In network-config it describes
      the Mifos community demo. Uses a neutral tonal container with an info
      icon; distinct from status_banner (which is for connectivity/sync state)
      and from error snackbars.
    a11y:
      role: note
      semantic_html: aside
      label_source: "Information: {bannerText}"
      contrast_required: true
    default_style:
      background: "#E3F2FD"
      color: "#0D47A1"
      corner_radius: radius.sm
      padding: spacing.md
      border_width: border.sm
    slots:
      required: [message]
      optional: [icon, action]
    supported_states: [visible, hidden]
    properties_schema:
      type: object
      required: [message]
      properties:
        message: { type: string }
        icon: { type: string, default: info }

  # ────────────────────────────────────────────────────────────────
  # indicator_row — PIN-entry dot progress row
  # (passcode-lock setup / confirm / locked mode — shows N filled dots
  # tracking digit entry progress; animates shake on wrong PIN).
  # ────────────────────────────────────────────────────────────────
  - name: indicator_row
    type: indicator_row
    tier: project
    extends: row
    category: feedback
    description: >
      A horizontal row of N equally-spaced circular dots (default 6) that
      visualise PIN-entry progress. Filled dots = digits entered; empty = remaining
      slots. Animates a horizontal shake on failed PIN entry (shake + reset). Used
      exclusively by passcode-lock; a11y reads the fill count as spoken text.
    a11y:
      role: status
      semantic_html: div
      label_source: "{filledCount} of {totalCount} digits entered"
      contrast_required: true
    default_style:
      gap: spacing.md
      padding: spacing.sm
      alignment: center
    slots:
      required: [dots]
    supported_states: [empty, partial, complete, error]
    state_styles:
      error: { animation: shake_horizontal }
      complete: { color: primary }
    properties_schema:
      type: object
      required: [totalDots, filledDots]
      properties:
        totalDots: { type: integer, default: 6 }
        filledDots: { type: integer, default: 0 }

  # ────────────────────────────────────────────────────────────────
  # keypad — numeric PIN entry pad
  # (passcode-lock 1-9 / 0 / delete grid for passcode entry and setup).
  # ────────────────────────────────────────────────────────────────
  - name: keypad
    type: keypad
    tier: project
    extends: column
    category: inputs
    description: >
      A 3×4 numeric keypad grid (1–9 top-left, 0 bottom-center, ⌫ delete
      bottom-right). Each digit tap fires an OnDigitTap action; delete fires
      OnDeleteTap. Disabled as a unit when passcode-lock is in the locked_out
      state. Auto-submits at the configured digit count (default 6).
    a11y:
      role: group
      semantic_html: div
      label_source: "Numeric keypad"
      contrast_required: true
      min_touch_target_dp: 64
    default_style:
      background: surface
      gap: spacing.sm
      padding: spacing.sm
      alignment: center
    slots:
      required: [digit_buttons, delete_button]
    supported_states: [idle, disabled]
    state_styles:
      disabled: { opacity: opacity.disabled }
    properties_schema:
      type: object
      required: []
      properties:
        digitCount: { type: integer, default: 6 }
        enabled: { type: boolean, default: true }

  # ────────────────────────────────────────────────────────────────
  # map_view — interactive GPS map surface
  # (path-tracking — live recording polyline / historical route view;
  # any future client-pinpoint or field geo feature).
  # ────────────────────────────────────────────────────────────────
  - name: map_view
    type: map_view
    tier: project
    extends: box
    category: surfaces
    description: >
      An interactive map surface backed by maps-compose (Android) / MapKit (iOS).
      In recording/paused states renders a live growing polyline centered on the
      current GPS position with an accuracy circle. In viewing state renders a
      static bounded polyline fitting the full completed route with start/end
      markers. Permission required: OS location permission (not a Fineract code).
    a11y:
      role: img
      semantic_html: figure
      label_source: "GPS route map"
      contrast_required: true
    default_style:
      background: surfaceVariant
      corner_radius: radius.md
      clip: true
    slots:
      required: [polyline]
      optional: [current_position_marker, start_marker, end_marker, accuracy_circle]
    supported_states: [recording, paused, viewing, loading]
    state_styles:
      loading: { opacity: opacity.loading }
    properties_schema:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [recording, paused, viewing] }
        polylineColor: { type: string, default: "#1976D2" }
        cameraFollowsUser: { type: boolean, default: true }

  # ────────────────────────────────────────────────────────────────
  # control_bar — floating route-recording control bar
  # (path-tracking — shows elapsed time, distance, current speed +
  # Pause / Resume / Stop buttons while a route session is active).
  # ────────────────────────────────────────────────────────────────
  - name: control_bar
    type: control_bar
    tier: project
    extends: card
    category: surfaces
    description: >
      Floating Material3 bottom-anchored control bar overlaying the map_view during
      an active path-tracking session. Displays three real-time stats (elapsed time
      HH:MM:SS, total distance km, current speed km/h) and action buttons (Pause
      in recording state; Resume + Stop in paused state). Updates every second via
      a coroutine ticker. Dismissible into a compact mode (icon-only) when the user
      needs more map area.
    a11y:
      role: toolbar
      semantic_html: div
      label_source: "Recording controls"
      contrast_required: true
    default_style:
      background: surface
      border: outlineVariant
      border_width: border.sm
      corner_radius: "radius.lg radius.lg 0 0"
      padding: spacing.md
      elevation: elevation.level2
    slots:
      required: [elapsed_time, distance, action_buttons]
      optional: [current_speed, compact_toggle]
    supported_states: [recording, paused, compact]
    state_styles:
      paused: { background: surfaceVariant }
      compact: { padding: spacing.sm }
    properties_schema:
      type: object
      required: [sessionStatus]
      properties:
        sessionStatus: { type: string, enum: [recording, paused] }
        elapsedSeconds: { type: integer, default: 0 }
        distanceKm: { type: number, default: 0.0 }
        currentSpeedKmh: { type: number, default: 0.0 }

registry_authority: >
  layers/idea/templates/primitives/PRIMITIVES.yaml (framework primitives) +
  layers/idea/templates/registry/*.yaml (framework patterns, inherited via
  inherits_registry: true) + this file (project composites). Enforced by
  RULE-COMPONENT-REGISTRY-001; consumed by idea-graph-audit COMP-1.
