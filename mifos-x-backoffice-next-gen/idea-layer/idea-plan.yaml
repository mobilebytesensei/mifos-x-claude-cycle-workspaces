technical_decisions:
  _status: enriched
  _quality_score: 90
  _ref: idea-layer/research/OFFLINE_FIRST_BLUEPRINT.md
  content:
    kmp_arch: "stream-first@latest"
    ui_framework: compose-multiplatform
    platforms: [android, ios, desktop]
    template: openMF/kmp-project-template (Store5 offline-first, Room 3, Ktorfit, Koin)
    api_client: "PREFER the openMF Fineract Client KMP SDK (used by mifos-x-field-officer-app) over hand-rolling 965 endpoints; supplement via generated-from-OpenAPI(fineract.json)+Ktorfit for gaps; contract-test CI vs live spec. MifosInterceptor-style tenant-header pattern."
    offline_read: "StoreFactory.createStore + SourceOfTruth over Room + asScreenStream(CACHE_FIRST_SWR) + ScreenContent — reads cached EVERYWHERE (all 17 modules readable offline)"
    offline_write: "DraftSubmitHandler + RoomSubmitOutbox + OfflineSubmitSyncer; commands via outbox, entity edits via createMutableStore+Bookkeeper"
    offline_policy: "PER-DOMAIN, not global write-behind (reference-app anti-pattern #3): field-ops/transactions (repayment, deposit, collection sheet, onboarding) = offline-queued+replay; admin/accounting/config/roles (GL postings, role changes, product edits) = online-only + maker-checker (deferred sync is WRONG for these). Opt-in per module."
    adaptive_scaffold: "Material3 Adaptive BottomBar (phone) <-> NavigationRail/permanent drawer (desktop/tablet) — desktop/web first-class (back-office users at desks)"
    local_lock: "passcode + biometrics local lock (reference-app pattern)"
    receipts: "PDF transaction receipts (PDFBox-style) for savings/loan transactions"
    cross_entity_modules: "document / note / activate as entity-agnostic shared modules (attach to client/group/center/loan)"
    nav_model: "permission/capability-registry-driven nav (NOT hardcoded tabs) — task/permission-first IA, org-wide scoping with staffId as one filter"
    batch: "BatchSubmitHandler.AllOrNothing == POST /batches enclosingTransaction; Independent == collection-sheet rows"
    delta_sync: "Synchronizer.changeListSync per-entity adapter over lastModifiedSince; DataSyncWorker"
    permission_engine: "core/permissions PermissionEvaluator + data-driven remote-updatable CapabilityMap"
    dynamic_forms: "form-schema renderer from GET /{entity}/template + /datatables (NEW)"
    idempotency: "durable idempotency_key on DraftEntity (Room v11 — NEW)"
    tenant_multi_server: "Fineract-Platform-TenantId + DynamicBaseUrlPlugin (dev/sandbox/prod)"
    auth: "AuthProvider -> FineractAuthProvider (basic-auth key or OAuth2/OIDC); 2FA + password-renew flows"
    secure_storage: "Keystore/Keychain + biometric; SQLCipher DB; PII-scrub logs"
    backend: apache-fineract (consumed as-is; zero server forks)
    new_infra: [core/permissions, dynamic template-forms, durable idempotency (Room v11), needs-attention inbox, per-entity delta adapters]

