permission_scope:
  _status: enriched
  _quality_score: 88
  _ref: idea-layer/research/PERMISSION_SCOPE_MODEL.md
  content:
    input: "POST /v1/authentication -> permissions: Collection<String> (flat opaque codes, union of role selected perms)"
    grammar: "{ACTION}_{ENTITY}; checker {ACTION}_{ENTITY}_CHECKER; backdate {ACTION}INPAST_LOAN; report READ_{name}; datatable {ACTION}_{table}"
    umbrellas: [ALL_FUNCTIONS, ALL_FUNCTIONS_READ, CHECKER_SUPER_USER, REPORTING_SUPER_USER, TWOFACTOR_BYPASS]
    module_gate: "each of the 17 modules below is a nav root gated by its permission group; a module renders only if the user holds >=1 of its View codes"
    invariants:
      - codes are opaque strings — compose ({action}_{entity}), never decompose
      - canDo uses ALL_FUNCTIONS only (ALL_FUNCTIONS_READ never grants writes)
      - unmapped capability = HIDDEN (fail closed); server authorization is the only real gate
      - domain layer double-enforces; 403 -> refresh map + prune UI, never crash
    engine: "core/permissions: PermissionSet (O(1)+fingerprint) + CapabilityMap (data, remote-updatable) + PermissionEvaluator + Compose Gated{} + build-time nav filter"

requirements:
  _status: draft
  _quality_score: 82
  content:
    functional:
      - FR-1 Login POST /authentication + tenant header; persist permissions[]+fingerprint (encrypted); build CapabilityMap
      - FR-2 Permission-gated nav/actions across ALL 17 modules — hide roots/creates, disable+reason for workflow stages; domain double-enforce
      - FR-3 Offline outbox — every mutating command persisted w/ durable idempotency key + (action,entity); replay via POST /batches
      - FR-4 Delta-pull sync scoped to the user's office/portfolio; CACHE_FIRST_SWR reads everywhere
      - FR-5 Dynamic forms rendered from GET /{entity}/template + /datatables (cached offline)
      - FR-6 Maker-checker aware; checker inbox for authorized users
      - FR-7 403 drift protocol — refresh permissions, re-resolve, prune, notify once; replay revalidates permission
      - FR-8 Multi-platform (Android/iOS/Desktop) single codebase; tenant + server switch
    non_functional:
      - NFR-1 cold start <2.5s; large lists paginated <1s cache; day's ops sync <60s/3G
      - NFR-2 zero duplicate/lost transactions; outbox survives crash + reinstall-restore
      - NFR-3 English + N locales; a11y; Android 8.0+/iOS 15+/Desktop
    security:
      - SEC-1 TLS1.2+ + cert pinning; Keystore/Keychain + biometric; SQLCipher DB + encrypted media; PII-scrub logs
      - SEC-2 idempotency keys on all mutations; screenshot-block PII; maker-checker end-to-end
      - SEC-3 DPDP/GDPR consent/retention/erasure; root/jailbreak detection; OWASP MASVS L2 + pen test

# ── FOUNDATION (the platform infra every module rides on) ──
features:
  _status: enriched
  _quality_score: 88
  content:
    - id: fineract-auth-session
      title: "core/auth — Fineract Basic-auth login + persisted session + authenticated client"
      module: foundation
      priority: must_have
      new_infra: true
      is_auth_feature: true
      status: scaffold
      scaffolded_at: '2026-07-22T01:20:00Z'
      requires_features: [permission-capability-engine]
      acceptance_criteria:
        - Tenant login (base-URL, tenant default `default`, username, password) authenticates via HTTP Basic + Fineract-Platform-TenantId; a real AuthProvider replaces NoOpAuthProvider (isConfigured=true after login)
        - Session (base-url, tenant, basic-token, userId, permission codes) persisted encrypted via secure multiplatform-settings; restored on cold start; cleared on logout; a 401 drops it and routes to login
        - Authenticated Ktorfit/Ktor Fineract client over core-base/network injects the dynamic base-URL + Basic auth + tenant header — the transport every data feature consumes; POST /authentication returns the user + permissions[]
    - id: permission-capability-engine
      title: "core/permissions — PermissionSet + CapabilityMap + PermissionEvaluator"
      module: foundation
      priority: must_have
      new_infra: true
      acceptance_criteria:
        - Login permissions[] normalized to a PermissionSet w/ umbrella short-circuits; each of the 17 module roots gates on its permission group
        - Nav filtered at build time; Gated{} hides/disables per onDenied; unmapped id = HIDDEN (fail closed); domain double-enforces
        - Same binary renders admin vs teller vs field-officer surface purely from permissions (CapabilityMatrixTest golden file green)
    - id: offline-sync-engine
      title: "Offline outbox + batch replay + durable idempotency + per-entity delta"
      module: foundation
      priority: must_have
      new_infra: true
      acceptance_criteria:
        - Every offline mutation queued with a DURABLE idempotency_key (Room v11) + (action,entity); replay exactly-once (zero double-post)
        - Delta-pull hydrates the user's office/portfolio working set via changeListSync adapters; rejected replay -> Needs-Attention
    - id: dynamic-template-forms
      title: "Dynamic form renderer from Fineract entity templates + datatables"
      module: foundation
      priority: must_have
      new_infra: true
      acceptance_criteria:
        - Create/edit forms rendered from GET /{entity}/template + /datatables; a back-office config change appears next sync, no release
    - id: needs-attention-inbox
      title: "Needs-Attention — failed/rejected replay triage"
      module: foundation
      priority: must_have
      new_infra: true
      acceptance_criteria:
        - Rejected offline commands land here w/ the server error; Retry/Edit/Discard; ConflictStrategy resolved explicitly; never silently dropped

    # ── BACK-OFFICE DOMAIN MODULES (all permission-gated, all offline-first) ──
    - id: m01-dashboard
      title: "M01 · Role-adaptive Dashboard"
      priority: must_have
      permissions_gate: "renders tiles the user can view (IndependentCardLayout); field-officer sees today's route, manager sees portfolio KPIs, accountant sees pending journals"
      api: ["/v1/runreports", "/v1/notifications", "/v1/makercheckers", "/v1/collectionsheet"]
      acceptance_criteria: ["Home tiles = the intersection of the dashboard tile set and the user's permissions; one failing tile never blanks the rest"]
    - id: m02-clients
      title: "M02 · Clients & KYC"
      priority: must_have
      permissions_gate: "READ_/CREATE_/UPDATE_/DELETE_CLIENT + identifiers/documents/addresses/family/charges/notes + lifecycle (activate/close/transfer)"
      api: ["/v1/clients (+template,+external-id)", "/v1/clients/{id}/accounts", "identifiers/images/documents/addresses/familymembers/charges/notes"]
      acceptance_criteria: ["Client 360 offline; onboarding queues with client-generated externalId; every sub-resource + lifecycle command gated"]
    - id: m03-groups-centers
      title: "M03 · Groups & Centers"
      priority: should_have
      permissions_gate: "READ_/CREATE_/*_GROUP, *_CENTER, *_MEETING, SAVEORUPDATEATTENDANCE_MEETING"
      api: ["/v1/groups", "/v1/centers", "/v1/calendars", "/v1/meetings", "GLIM/GSIM"]
      acceptance_criteria: ["Group/center CRUD + membership + meetings + attendance, gated + offline"]
    - id: m04-loan-portfolio
      title: "M04 · Loan Portfolio (origination · servicing · delinquency · reschedule)"
      priority: must_have
      permissions_gate: "READ_/CREATE_/UPDATE_LOAN + APPROVE_/DISBURSE_/REPAYMENT_/WRITEOFF_/FORECLOSURE_LOAN + *_LOANCHARGE/_GUARANTOR/_COLLATERAL/_RESCHEDULELOAN; backdate *INPAST_LOAN; Working-Capital family"
      api: ["/v1/loans (+template, calculateLoanSchedule)", "transactions ?command=*", "rescheduleloans", "guarantors/collaterals", "working-capital-loans"]
      acceptance_criteria: ["Full loan lifecycle template->submit->approve->disburse->service->close; live schedule preview; every command gated; offline-queued"]
    - id: m05-savings-deposits-shares
      title: "M05 · Savings, Deposits & Shares"
      priority: must_have
      permissions_gate: "*_SAVINGSACCOUNT (+DEPOSIT_/WITHDRAWAL_/HOLDAMOUNT_/POSTINTEREST_), *_FIXEDDEPOSITACCOUNT, *_RECURRINGDEPOSITACCOUNT, *_SHAREACCOUNT, *_ACCOUNTTRANSFER, *_STANDINGINSTRUCTION"
      api: ["/v1/savingsaccounts", "/v1/fixeddepositaccounts", "/v1/recurringdepositaccounts", "/v1/accounts/{type=share}", "/v1/accounttransfers", "/v1/standinginstructions"]
