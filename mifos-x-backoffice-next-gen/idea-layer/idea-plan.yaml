      requires_features: [permission-capability-engine, offline-sync-engine, fineract-auth-session, dynamic-template-forms]
      api: ["/v1/loanproducts/{productId}", "/v1/loanproducts/template"]
      acceptance_criteria:
        - A sectioned, template-driven product form (drill-in from M08 list) — details, terms, settings, charges, accounting — matching the server product schema
        - Save posts PUT/POST /v1/loanproducts through the offline outbox; gated on CREATE/UPDATE_LOANPRODUCT (read-only otherwise)
    - id: report-runner
