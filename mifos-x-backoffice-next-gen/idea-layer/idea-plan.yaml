  content:
    strategy: phased
    phases:
      - { id: P0, name: Foundations, scope: "OpenAPI client, tenant/auth + core/permissions capability bootstrap, encrypted storage, FineractAuthProvider, dynamic-forms engine, CI", exit: "login flips the 17 module roots + actions by permissions vs sandbox" }
      - { id: P1, name: Read platform, scope: "Dashboard + Clients + Loans + Savings read/detail (gated, offline CACHE_FIRST_SWR), search, reports (read), audit", exit: "any role gets a complete read-only back-office offline" }
      - { id: P2, name: Money movement + collections, scope: "repayments/deposits/withdrawals/charges, collection sheets, outbox+batch+durable idempotency, Needs-Attention, tellers/cash", exit: "field + teller staff transact offline with zero double-post" }
      - { id: P3, name: Origination, scope: "template-driven client onboarding + loan/savings/FD/RD/share application wizards, guarantors/collateral, maker-checker submit", exit: "full origination without paper" }
      - { id: P4, name: Supervision + accounting, scope: "checker inbox, approve/disburse/reschedule/transfers; accounting (GL/journal/closure/provisioning)", exit: "supervisors approve; accountants close books in-app" }
      - { id: P5, name: Full admin + hardening, scope: "users/roles/permissions, products/charges, organization, datatables/config, scheduler, campaigns; i18n, MASVS L2, pen test, perf", exit: "every Fineract endpoint live as a feature, gated by login permissions" }
      - { id: P6, name: Rollout & ops, scope: "staged rollout per role, training, telemetry, Fineract-upgrade regression (contract tests vs live spec)", exit: "org-wide adoption across all roles" }

