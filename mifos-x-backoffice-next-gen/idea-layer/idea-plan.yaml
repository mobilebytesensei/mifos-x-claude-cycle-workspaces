vision:
  _status: enriched
  _quality_score: 90
  content:
    elevator_pitch: >-
      One mobile+desktop KMP binary exposing the ENTIRE Apache Fineract back-office API as real
      end-to-end features, where every screen and action is visible only if the signed-in user's
      server-returned permissions allow it (View/Create/Edit/Delete/action per feature). A role — field
      officer, teller, accountant, branch manager, product admin, system admin, auditor — is just a
      permission bundle; the same binary is every one of them. Offline-first throughout.
    problem_statement: >-
      Mifos institutions run the full back office (clients, loans, savings, accounting, products, users,
      tellers, config, reports) on a web app that assumes connectivity and a desktop; field staff use a
      separate limited app. There is no single, offline-capable, permission-driven client that serves
      EVERY role with the complete Fineract capability set.
    solution_statement: >-
      A generic back-office platform on openMF/kmp-project-template's offline-first Store5 stack, where a
      PermissionEvaluator resolves a data-driven Capability Map from the login permissions[] to gate every
      module/screen/action, and every Fineract endpoint is consumed offline-first (cached reads, queued
      writes, batch replay with durable idempotency). All capabilities exist in the binary; permissions
      decide what each user sees.
    target_users:
      - "system admin · branch manager · accountant · teller/cashier · product admin · loan officer · collections field officer · branch supervisor (checker) · CSR · auditor"
    value_propositions:
      - One binary, every role — accessibility is 100% a function of the login permission array
      - API-complete — all 965 Fineract operations shipped as real features across phases
      - Offline-first everywhere — full work with zero blocking spinners; zero duplicate/lost transactions
      - Configuration-driven — template + datatable forms + remote-updatable capability map, no release needed
      - Cross-platform — Android + iOS + Desktop (KMP), one codebase
      - Production-grade — encryption, maker-checker integrity, MASVS L2, ≥99.5% crash-free
    success_metrics:
      - "back-office task coverage: 100% of Fineract ops reachable by an ALL_FUNCTIONS user"
      - "zero hardcoded role checks · zero duplicate postings · 100% capture workflows offline"
      - "crash-free >99.5% · reversal rate <0.5% · sync latency <2h"

