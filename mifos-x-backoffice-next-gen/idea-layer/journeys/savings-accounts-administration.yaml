id: savings-accounts-administration
version: 1.0.0
name: Savings & Deposits Administration — Service a Client Deposit Account
description: >-
  A teller/officer opens a client from the 360 view, jumps into that client's savings/deposit/
  share account, performs a deposit or withdrawal, and the transaction is routed into the
  maker-checker approval queue — the client-scoped deposit-account servicing path.

persona:
  archetype: teller / deposit officer
  jtbd: process a deposit or withdrawal on a client's savings account and submit it for approval
  context: at the counter serving a client, needing an accurate account view and a clean submit
  knowledge_level: proficient
  emotional_state: attentive, accuracy-conscious

goal: >-
  Go from a client's 360 view to their savings/deposit/share account, submit a deposit or
  withdrawal, and confirm it entered the maker-checker approval queue.

success_metric:
  name: deposit_transaction_submitted
  kind: task_completion
  target: ">=95% of started deposit/withdrawal transactions reach the approval queue"
  measurement: "funnel: account_opened -> transaction_entered -> submitted_for_approval"

screen_sequence:
  - screen_id: client-detail-360
    feature_id: client-detail-360
    state: content
    user_intent: open the client's Accounts tab and pick a savings/deposit/share account
    success_signal: the client's deposit accounts list resolves and an account row is selectable
  - screen_id: m05-savings-deposits-shares
    feature_id: m05-savings-deposits-shares
    state: content
    user_intent: review the account and enter a deposit or withdrawal
    success_signal: the account detail resolves and the transaction form validates and submits
  - screen_id: m15-approvals-makerchecker
    feature_id: m15-approvals-makerchecker
    state: content
    user_intent: confirm the submitted transaction appears in the approval queue
    success_signal: the pending deposit/withdrawal command is listed for a checker to approve

expected_outcome: >-
  A deposit or withdrawal has been captured against the correct client account and submitted into
  the maker-checker queue, ready for a checker to approve — offline submissions queue and re-attempt
  on sync.

flows:
  - feature_id: m05-savings-deposits-shares
    flow_id: savings-accounts-administration
    role: primary
  - feature_id: client-detail-360
    flow_id: savings-accounts-administration
    role: background
  - feature_id: m15-approvals-makerchecker
    flow_id: savings-accounts-administration
    role: background

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: high
preconditions:
  - "an authenticated session holding >=1 READ_* deposit code (READ_SAVINGSACCOUNT / READ_FIXEDDEPOSITACCOUNT / READ_RECURRINGDEPOSITACCOUNT / READ_SHAREACCOUNT)"
  - "the client has at least one savings/deposit/share account"
failure_modes:
  - cause: "client has no deposit accounts in scope"
    recovery_screen: m05-savings-deposits-shares
    notes: "empty state; officer confirms account existence or scope"
  - cause: "transaction submit fails hard with no cache"
    recovery_screen: m05-savings-deposits-shares
    notes: "error state with Retry; offline submits enqueue (queued_offline) and re-attempt on sync"
