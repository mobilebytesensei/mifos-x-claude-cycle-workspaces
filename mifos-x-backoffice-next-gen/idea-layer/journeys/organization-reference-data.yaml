id: organization-reference-data
version: 1.0.0
name: Organization Reference Data — Configure an Office or Vocabulary Entity
description: >-
  A system administrator opens the M09 organization module — the reference-data control plane
  (offices, staff, currencies, holidays, working days, funds, payment types, codes) — and opens
  the create/edit form (rendered from the Fineract entity template) to author a permission-gated,
  online-only configuration entry that becomes the offline dropdown backbone for every form.

persona:
  archetype: expert administrator
  jtbd: maintain accurate, compliant reference data that every dynamic form depends on
  context: back-office configuration ahead of onboarding staff/offices or a rate/holiday change
  knowledge_level: expert
  emotional_state: precise, compliance-minded

goal: >-
  Go from the organization module into the dynamic entity form and save a reference-data entry
  (office, staff, currency, payment type, code-value) via the online-only outbox drain.

success_metric:
  name: reference_data_save_completion
  kind: task_completion
  target: ">=90% of reference-data edits saved without validation rework"
  measurement: "funnel: organization_module_opened -> entity_form_rendered -> save_success"

screen_sequence:
  - screen_id: m09-organization
    feature_id: m09-organization
    state: content
    user_intent: enter the organization module and pick a reference-data entity to create or edit
    success_signal: the reference-data lists render (cached CACHE_FIRST_SWR read side)
  - screen_id: dynamic-template-forms
    feature_id: dynamic-template-forms
    state: content
    user_intent: fill the entity form rendered from the Fineract template and save it
    success_signal: each entry point is gated by its exact {ACTION}_{ENTITY} permission and the write funnels through the online-only outbox

expected_outcome: >-
  A reference-data entity is created or updated (maker-checker aware, online-only) and becomes the
  offline dropdown backbone every dynamic-template-form consumes; rejected commands route to the
  needs-attention inbox.

flows:
  - feature_id: m09-organization
    flow_id: organization-config
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session with the exact {ACTION}_{ENTITY} organization permission"
failure_modes:
  - cause: "the entity template fails to load with no cache"
    recovery_screen: dynamic-template-forms
    notes: "error state with Retry"
  - cause: "the write is rejected by maker-checker or server validation"
    recovery_screen: needs-attention-inbox
    notes: "rejected command routes to the needs-attention inbox for correction"
