id: officer-authentication
version: 1.0.0
name: Officer Authentication & Session Bootstrap
description: >-
  A field/branch officer opens the back-office at the start of a shift, is silently
  restored or signs in against the tenant's Fineract instance, and lands on the
  dashboard with a bootstrapped PermissionSet governing everything they can see.

persona:
  archetype: returning power user
  jtbd: get into my branch's back-office quickly and securely so I can start servicing clients
  context: start of the working day, often on a low-bandwidth branch connection or intermittently offline in the field
  knowledge_level: familiar
  emotional_state: focused but time-pressured

goal: >-
  Go from cold app launch to an authenticated session with a resolved PermissionSet and the
  dashboard rendered, restoring silently when a valid session is already persisted.

success_metric:
  name: time_to_authenticated_dashboard
  kind: time_to_value
  target: ">=95% reach the dashboard in <5s on warm session-restore, <20s on fresh sign-in"
  measurement: "funnel: app_launch -> session_restored|authentication_success -> dashboard_rendered"

screen_sequence:
  - screen_id: fineract-auth-session
    feature_id: fineract-auth-session
    state: restoring
    user_intent: resume yesterday's session without re-typing credentials
    success_signal: a valid persisted session is restored, or the login form is shown when none exists
  - screen_id: fineract-auth-session
    feature_id: fineract-auth-session
    state: authenticating
    user_intent: sign in with base-URL, tenant, username and password
    success_signal: POST /authentication succeeds and the encrypted session is persisted
  - screen_id: permission-capability-engine
    feature_id: permission-capability-engine
    state: content
    user_intent: bootstrap the PermissionSet + CapabilityMap that gate the whole app
    success_signal: the PermissionSet resolves and downstream surfaces unlock
  - screen_id: m01-dashboard
    feature_id: m01-dashboard
    state: content
    user_intent: see today's actionable tiles (active clients, checker inbox, today's route, PAR)
    success_signal: the dashboard renders scoped to the officer's office + role

expected_outcome: >-
  The officer has an authenticated, encrypted, offline-capable session; the PermissionSet and
  CapabilityMap are bootstrapped; and the role-scoped dashboard is the active surface.

flows:
  - feature_id: fineract-auth-session
    flow_id: officer-login
    role: primary

capabilities_used: ["is_auth_feature", "has_ui", "has_flow", "has_api"]
tier: maximum
preconditions:
  - "the tenant base-URL is reachable OR a valid session is already persisted (offline restore)"
failure_modes:
  - cause: "401 invalid credentials or wrong base-URL/tenant"
    recovery_screen: fineract-auth-session
    notes: "returns to the login form with an inline error; retry re-submits"
  - cause: "network offline on a cold start with no persisted session"
    recovery_screen: fineract-auth-session
    notes: "login form shown; sign-in blocked until connectivity returns"
  - cause: "session expired / 401 mid-app"
    recovery_screen: fineract-auth-session
    notes: "any 401 clears the session and routes back here to re-authenticate"
