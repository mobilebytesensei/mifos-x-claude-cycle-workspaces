id: product-configuration
version: 1.0.0
name: Product Configuration — Author a Loan/Savings Product
description: >-
  A product administrator opens the M08 products & charges module and creates or edits a
  financial product in the product editor — configuring terms, interest, accounting and attached
  charges from the product template — then saves it for use in origination.

persona:
  archetype: expert administrator
  jtbd: define or adjust a compliant financial product so officers can originate against it
  context: back-office configuration work, typically head-office, ahead of a product launch or rate change
  knowledge_level: expert
  emotional_state: precise, compliance-minded

goal: >-
  Go from the products & charges module into the product editor and save a fully configured
  product (or an edit to an existing one) that is ready for origination.

success_metric:
  name: product_save_completion
  kind: task_completion
  target: ">=90% of product edits saved without validation rework on second attempt"
  measurement: "funnel: product_editor_opened -> fields_configured -> save_success"

screen_sequence:
  - screen_id: m08-products-charges
    feature_id: m08-products-charges
    state: content
    user_intent: enter the products & charges module and pick or create a product
    success_signal: the products module surface loads with the product list
  - screen_id: product-editor
    feature_id: product-editor
    state: content
    user_intent: configure terms, interest, accounting and attached charges from the template
    success_signal: the product + template resolve and edits validate on Save

expected_outcome: >-
  A financial product is created or updated and saved, available to the loan-application wizard
  and other origination surfaces with its configured terms, charges and accounting rules.

flows:
  - feature_id: product-editor
    flow_id: product-config
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session with product-configuration permissions"
failure_modes:
  - cause: "the product or template fails to load with no cache"
    recovery_screen: product-editor
    notes: "error state with Retry"
  - cause: "save fails hard (validation or server error) with no fallback"
    recovery_screen: product-editor
    notes: "error state; the editor retains entered values for correction"
