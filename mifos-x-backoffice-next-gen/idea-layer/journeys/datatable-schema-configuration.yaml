id: datatable-schema-configuration
version: 1.0.0
name: Data Tables & Configuration — Author a Custom Datatable Schema
description: >-
  A platform administrator opens the M12 data tables & configuration control plane and opens the
  datatable schema editor (rendered from the Fineract template) to register a user-defined
  custom-field schema against an entity — the schema the dynamic-template-forms engine will then
  render everywhere.

persona:
  archetype: expert administrator
  jtbd: extend the platform's data model and switches without a code change, safely and gated
  context: platform configuration work, ahead of a new field rollout or policy switch change
  knowledge_level: expert
  emotional_state: precise, systems-minded

goal: >-
  Go from the data-tables & configuration module into the dynamic schema/config form and register
  (or edit) a custom datatable, global-config switch, or entity check that the platform obeys.

success_metric:
  name: schema_config_save_completion
  kind: task_completion
  target: ">=90% of datatable/config edits saved without validation rework"
  measurement: "funnel: config_module_opened -> schema_form_rendered -> save_success"

screen_sequence:
  - screen_id: m12-datatables-config
    feature_id: m12-datatables-config
    state: content
    user_intent: enter the data-tables & configuration module and pick a datatable/config family
    success_signal: the master list of datatables, global config, entity checks and services renders
  - screen_id: dynamic-template-forms
    feature_id: dynamic-template-forms
    state: content
    user_intent: define columns / toggle a switch in the form rendered from the Fineract template and save
    success_signal: the edit is gated by its *_DATATABLE / *_CONFIGURATION permission and saves

expected_outcome: >-
  A custom datatable schema is registered (or a global-config switch toggled / entity check authored);
  the dynamic-template-forms engine renders the new schema and the platform obeys the new switch.

flows:
  - feature_id: m12-datatables-config
    flow_id: datatables-config
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session with the CREATE_DATATABLE / UPDATE_CONFIGURATION permission"
failure_modes:
  - cause: "the schema/config template fails to load with no cache"
    recovery_screen: dynamic-template-forms
    notes: "error state with Retry"
  - cause: "the datatable registration is rejected by server validation"
    recovery_screen: dynamic-template-forms
    notes: "error state; the editor retains the column definitions for correction"
