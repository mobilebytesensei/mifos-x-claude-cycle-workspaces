id: loan-lifecycle
version: 1.0.0
name: Loan Lifecycle — Originate to Service
description: >-
  A loan officer originates a new loan for a client through the application wizard, then
  services the resulting loan account — reviewing the schedule, approving/disbursing and
  taking repayments — from the loan-detail surface.

persona:
  archetype: returning power user
  jtbd: originate a compliant loan for my client and then manage its lifecycle end to end
  context: at the branch or in the field with a client present, working against product templates and eligibility rules
  knowledge_level: expert
  emotional_state: careful and deliberate

goal: >-
  Go from a client's 360 view through a submitted loan application to a serviceable loan-detail
  account where approve/disburse/repayment actions are available.

success_metric:
  name: loan_origination_completion
  kind: task_completion
  target: ">=85% of started applications reach a created loan-detail without re-entry"
  measurement: "funnel: wizard_started -> submit_success -> loan_detail_content_rendered"

screen_sequence:
  - screen_id: client-detail-360
    feature_id: client-detail-360
    state: content
    user_intent: start a loan application from the client's Accounts tab
    success_signal: the 'apply for loan' affordance opens the wizard for this client
  - screen_id: loan-application-wizard
    feature_id: loan-application-wizard
    state: content
    user_intent: complete product selection, terms and schedule preview
    success_signal: the multi-step form validates and the schedule preview computes
  - screen_id: m04-loan-portfolio
    feature_id: m04-loan-portfolio
    state: content
    user_intent: locate the newly created/pending loan in the portfolio
    success_signal: the loan appears in the portfolio list with its status
  - screen_id: loan-detail
    feature_id: loan-detail
    state: content
    user_intent: review the schedule and take lifecycle actions (approve, disburse, repay)
    success_signal: the loan aggregate resolves and lifecycle actions are enabled per permission

expected_outcome: >-
  A loan account exists and is being serviced from loan-detail, with the schedule visible and
  approve/disburse/repayment actions available subject to maker-checker and permissions.

flows:
  - feature_id: loan-application-wizard
    flow_id: loan-lifecycle
    role: primary
  - feature_id: loan-detail
    flow_id: loan-lifecycle
    role: primary
  - feature_id: client-detail-360
    flow_id: loan-lifecycle
    role: background

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: maximum
preconditions:
  - "an authenticated session with loan-origination + servicing permissions"
  - "the client is eligible for at least one loan product template"
failure_modes:
  - cause: "client ineligible — no template products available"
    recovery_screen: loan-application-wizard
    notes: "empty state; officer exits the wizard"
  - cause: "schedule-calc or submit fails hard with no fallback"
    recovery_screen: loan-application-wizard
    notes: "error state with Retry; re-attempts the failed call"
  - cause: "loanId resolves to no account (deleted/wrong id)"
    recovery_screen: loan-detail
    notes: "empty state; navigate back to the portfolio"
