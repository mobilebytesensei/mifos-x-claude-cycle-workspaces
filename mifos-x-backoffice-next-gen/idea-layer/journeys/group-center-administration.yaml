id: group-center-administration
version: 1.0.0
name: Group & Center Administration — Manage a Group and Drill to Members
description: >-
  A branch officer opens the Groups & Centers module, reviews the groups/centers they are
  permitted to see, opens a group to inspect its meeting/attendance context, then drills into a
  member client to continue servicing — the day-to-day administration surface for group lending.

persona:
  archetype: branch officer
  jtbd: keep my groups and centers organized and jump from a group to the member client I need
  context: at the branch on a desktop/tablet, managing the group book between field rounds
  knowledge_level: proficient
  emotional_state: methodical, task-focused

goal: >-
  Go from the Groups & Centers module root to a specific member client, having located the group
  and confirmed its meeting/attendance context along the way.

success_metric:
  name: group_to_member_navigation
  kind: task_completion
  target: ">=90% of group lookups reach the intended member client without a dead end"
  measurement: "funnel: module_loaded -> group_selected -> member_opened"

screen_sequence:
  - screen_id: m03-groups-centers
    feature_id: m03-groups-centers
    state: content
    user_intent: open the Groups & Centers module and locate a group/center
    success_signal: the permission-scoped groups/centers list renders and a group can be selected
  - screen_id: m02-clients
    feature_id: m02-clients
    state: content
    user_intent: drill from the selected group into one of its member clients
    success_signal: the member client list/detail opens scoped to the chosen group

expected_outcome: >-
  The officer has navigated from the Groups & Centers module into a member client, ready to
  continue client servicing — group context (meetings/attendance) confirmed en route.

flows:
  - feature_id: m03-groups-centers
    flow_id: group-center-administration
    role: primary
  - feature_id: m02-clients
    flow_id: group-center-administration
    role: background

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session holding >=1 of READ_GROUP / READ_CENTER"
  - "at least one group/center is visible to the officer's data scope"
failure_modes:
  - cause: "no groups/centers visible to this user's permission scope"
    recovery_screen: m03-groups-centers
    notes: "empty state; officer confirms scope or requests access"
  - cause: "group list load fails with no cache"
    recovery_screen: m03-groups-centers
    notes: "error / no-network state with Retry"
