id: daily-collections
version: 1.0.0
name: Daily Collections — Run Today's Sheet
description: >-
  A field collections agent opens today's route, works the staff-scoped collection sheet
  capturing amounts and attendance for each group/client, and saves the batch — offline-first,
  syncing when connectivity returns.

persona:
  archetype: returning power user
  jtbd: collect and record repayments for my route today, even where there is no signal
  context: in the field on a group-meeting round, frequently offline, needing fast per-row capture
  knowledge_level: expert
  emotional_state: hurried, working against a meeting schedule

goal: >-
  Go from the collections module to a completed, saved collection sheet for the officer's
  staffId and today's date, with amounts and attendance captured for every due row.

success_metric:
  name: collection_sheet_completion
  kind: task_completion
  target: ">=90% of due rows captured and the sheet saved before leaving the meeting"
  measurement: "funnel: sheet_generated -> rows_captured -> save_enqueued"

screen_sequence:
  - screen_id: m06-collections
    feature_id: m06-collections
    state: content
    user_intent: enter the collections module for today's route
    success_signal: the collections module surface loads scoped to the officer
  - screen_id: collection-sheet
    feature_id: collection-sheet
    state: content
    user_intent: capture amounts + attendance per due row and save the batch
    success_signal: the staff-scoped sheet generates and edits are enqueued on Save

expected_outcome: >-
  The day's collection sheet is captured and saved (batch enqueued), ready to sync to Fineract
  when the device is back online — repayments recorded against the correct loans/groups.

flows:
  - feature_id: collection-sheet
    flow_id: field-collections
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session with collections permissions for the officer's staffId"
  - "meetings are scheduled with dues for the chosen date"
failure_modes:
  - cause: "no dues for the chosen date (no meetings / all paid)"
    recovery_screen: collection-sheet
    notes: "empty state; agent confirms the route is clear"
  - cause: "sheet generation or Save fails hard with no cache"
    recovery_screen: collection-sheet
    notes: "error state with Retry; offline saves queue and re-attempt on sync"
