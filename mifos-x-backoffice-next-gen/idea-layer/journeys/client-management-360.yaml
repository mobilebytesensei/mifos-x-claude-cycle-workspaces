id: client-management-360
version: 1.0.0
name: Client Management — Browse to 360 View
description: >-
  A relationship officer opens the M02 clients module, filters the office-scoped roster,
  and drills into a single client's 360 view to inspect identity, accounts and lifecycle
  actions before servicing them.

persona:
  archetype: returning power user
  jtbd: find the right client and see everything about them in one place before acting
  context: mid-shift at the branch desk or in the field, responding to a walk-in or a scheduled visit
  knowledge_level: expert
  emotional_state: task-oriented

goal: >-
  Go from the clients module list to a fully resolved client-360 aggregate (identity, accounts,
  lifecycle actions) for a chosen client.

success_metric:
  name: time_to_client_360
  kind: task_completion
  target: ">=90% locate and open the correct client 360 in <30s"
  measurement: "funnel: client_list_render -> client_row_tapped -> client_360_content_rendered"

screen_sequence:
  - screen_id: m02-clients
    feature_id: m02-clients
    state: content
    user_intent: enter the clients module
    success_signal: the clients module surface loads with the default roster
  - screen_id: client-list
    feature_id: client-list
    state: content
    user_intent: filter/search the office-scoped roster to the target client
    success_signal: the matching client row is visible after search/status filtering
  - screen_id: client-detail-360
    feature_id: client-detail-360
    state: content
    user_intent: inspect the client's identity, accounts and available lifecycle actions
    success_signal: the client aggregate + accounts resolve and the 360 tabs render

expected_outcome: >-
  The officer is viewing a fully resolved client-360 aggregate for the intended client, with
  accounts and lifecycle actions ready — the springboard for loans, savings and KYC work.

flows:
  - feature_id: client-list
    flow_id: client-management
    role: primary
  - feature_id: client-detail-360
    flow_id: client-management
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session with client-read permissions in the current office"
failure_modes:
  - cause: "roster or client aggregate fails to load with no cache"
    recovery_screen: client-list
    notes: "error state with Retry; cache-first read serves stale data when offline"
  - cause: "clientId resolves to a deleted/wrong client"
    recovery_screen: client-detail-360
    notes: "empty state; officer navigates back to the list"
