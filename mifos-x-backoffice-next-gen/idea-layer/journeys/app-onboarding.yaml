id: app-onboarding
version: 1.0.0
name: App Onboarding — First-Run Setup to Role Dashboard
description: >-
  A brand-new user (or a user clearing credentials) opens the back-office app for the first time,
  configures which Fineract instance to connect to (demo pre-filled out-of-box or their own
  organisation's instance via QR scan or manual entry), signs in, sets up the passcode PIN and
  optionally enrols a biometric, then lands on a permission-assembled role dashboard — the
  complete splash-to-ready sequence that every role follows exactly once on install.

persona:
  archetype: first-time user
  jtbd: get the app configured and signed in with my credentials so I can start working, without needing IT to hold my hand
  context: first day with the app — often offline-provisioned by an admin who gives a QR code or a base URL; or evaluating using the Mifos community demo
  knowledge_level: unfamiliar
  emotional_state: cautious but motivated — wants reassurance each step is working

goal: >-
  Go from cold app launch through server/tenant configuration, authentication, PIN setup and
  optional biometric enrolment, to a role-assembled dashboard where the user can start
  their first real task.

success_metric:
  name: first_run_to_dashboard
  kind: time_to_value
  target: ">=90% of new users reach the role dashboard in <3 minutes from cold launch"
  measurement: "funnel: app_launch -> network_config_saved -> authentication_success -> passcode_set -> nav_shell_assembled -> dashboard_rendered"

screen_sequence:
  - screen_id: fineract-auth-session
    feature_id: fineract-auth-session
    state: restoring
    user_intent: open the app for the first time and see where to start
    success_signal: no valid session found — the sign-in form is shown with demo credentials pre-filled from core/network
  - screen_id: network-config
    feature_id: network-config
    state: idle
    user_intent: choose a Fineract instance — tap 'Use Mifos community demo' for instant out-of-box evaluation, or 'Your organisation' to enter a custom base-URL, tenant, username and password (or scan a config QR)
    success_signal: the selected config is persisted to core/network + core/datastore; the 'Connection verified' chip appears
  - screen_id: network-config
    feature_id: network-config
    state: saving
    user_intent: confirm and save the chosen network configuration, triggering a re-auth bootstrap
    success_signal: save completes and the session is routed to the sign-in authenticating state
  - screen_id: fineract-auth-session
    feature_id: fineract-auth-session
    state: authenticating
    user_intent: sign in with the username and password pre-filled from the chosen network config
    success_signal: POST /authentication succeeds; {roles, permissions[], officeId, staffId} returned and encrypted session persisted
  - screen_id: passcode-lock
    feature_id: passcode-lock
    state: setup
    user_intent: set a 6-digit PIN to protect the app from unauthorised access during the work day
    success_signal: PIN entry and confirmation match; passcode_hash persisted; passcode_enabled = true
  - screen_id: biometric-setup
    feature_id: biometric-setup
    state: prompt
    user_intent: optionally enrol a fingerprint or face unlock so the lock screen can be dismissed without re-typing the PIN
    success_signal: biometric enrolled (biometric_lock_enabled = true) or skipped — both proceed to the app shell
  - screen_id: permission-capability-engine
    feature_id: permission-capability-engine
    state: content
    user_intent: wait while the app bootstraps the PermissionSet and CapabilityMap from the login response
    success_signal: PermissionSet resolves and PermissionStateHolder emits the module roster
  - screen_id: nav-shell-assembler
    feature_id: nav-shell-assembler
    state: assembled
    user_intent: see the app assembled specifically for my role — the permitted module roots appear in the bottom-bar and/or drawer; no admin roots for a field officer, no field roots for a super user
    success_signal: NavRoster built (>=1 root visible); role-appropriate shell chrome rendered with no flicker
  - screen_id: m01-dashboard
    feature_id: m01-dashboard
    state: content
    user_intent: land on the role-appropriate home — 'My Field Day' feed for a loan officer, 'Operations' for an admin, 'Platform Admin' for a super user
    success_signal: the dashboard renders the correct role-scoped tile set (no blank/placeholder tiles)

expected_outcome: >-
  The user has a fully configured, authenticated, permission-scoped session: their chosen Fineract
  instance is persisted, the app is locked with a PIN (and optionally biometric), the NavShell
  is assembled from their role's permission set, and the role-appropriate dashboard is the active
  surface — ready to start the first real task.

flows:
  - feature_id: network-config
    flow_id: app-onboarding
    role: primary
  - feature_id: passcode-lock
    flow_id: app-onboarding
    role: primary
  - feature_id: biometric-setup
    flow_id: app-onboarding
    role: primary
  - feature_id: nav-shell-assembler
    flow_id: app-onboarding
    role: primary
  - feature_id: fineract-auth-session
    flow_id: app-onboarding
    role: background
  - feature_id: permission-capability-engine
    flow_id: app-onboarding
    role: background

capabilities_used: ["has_ui", "has_flow", "has_api", "is_auth_feature"]
tier: maximum
preconditions:
  - "the device can reach the chosen Fineract instance (demo or org) for the validate + save step"
  - "no valid persisted session (cold first-run or cleared credentials)"
failure_modes:
  - cause: "network unreachable during validate — wrong base-URL, org instance down, or no connectivity"
    recovery_screen: network-config
    notes: "error state on network-config; user corrects fields or switches to demo mode"
  - cause: "POST /authentication fails after save (wrong credentials or wrong tenant)"
    recovery_screen: fineract-auth-session
    notes: "login form re-shown; network-config persisted so user only corrects credentials"
  - cause: "passcode confirm mismatch"
    recovery_screen: passcode-lock
    notes: "shake animation + error; auto-resets after 1.5s; user re-enters"
  - cause: "biometric hardware unavailable or not enrolled in OS"
    recovery_screen: biometric-setup
    notes: "unavailable/not_enrolled_in_os state shown; user skips; flow continues"
  - cause: "PermissionSet resolves to empty roster (zero module codes for this role)"
    recovery_screen: nav-shell-assembler
    notes: "empty state shown; user prompted to contact admin to assign a role with codes"
