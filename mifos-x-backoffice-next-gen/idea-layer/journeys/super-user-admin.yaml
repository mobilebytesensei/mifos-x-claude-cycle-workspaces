id: super-user-admin
version: 1.0.0
name: Super User Administration — Platform Admin, Users/Roles, Config and Checker-on-All
description: >-
  A super user (ALL_FUNCTIONS + CHECKER_SUPER_USER, head-office scope) signs in and the NavShell
  assembler renders the full 17-module roster — every root visible, including the Users/Roles and
  Config surfaces that are HIDDEN for all other roles. From the 'Platform Admin' home they perform
  the three core admin workflows: create users and assign roles; grant or revoke permission codes
  and toggle maker-checker flags (PUT /permissions); and approve any pending maker-checker entry
  in the checker-on-all approvals queue. This journey also validates that the nav-shell-assembler
  correctly exposes admin-only roots that no other role can reach.

persona:
  archetype: expert administrator
  jtbd: onboard a new staff member (create user, assign role), tune the permission model (grant or revoke codes), and clear the approvals backlog — all from a single coherent admin surface
  context: at a head-office desktop or tablet; the sole operator who can touch users, roles, global config and approve any entry
  knowledge_level: expert
  emotional_state: deliberate and security-conscious — every action here is high-stakes and often irreversible

goal: >-
  Go from the Platform Admin dashboard through the create-user → assign-role → grant-permission
  chain and then drain the checker-on-all approvals queue — leaving the platform in a consistent
  access state with no orphaned maker entries.

success_metric:
  name: admin_workflow_completion
  kind: task_completion
  target: ">=90% of admin sessions that start a user-create or permission-change flow complete without abandoning mid-form"
  measurement: "funnel: platform_admin_dashboard_rendered -> user_created -> role_assigned -> permission_code_updated -> approvals_queue_drained"

screen_sequence:
  - screen_id: nav-shell-assembler
    feature_id: nav-shell-assembler
    state: assembled
    user_intent: verify that the full module roster is assembled — ALL_FUNCTIONS bypasses per-code checks so all 17 roots are visible, including Users, Roles & Permissions, Datatables, Config, Scheduler and Communications which are HIDDEN for every other role
    success_signal: bottom-bar and drawer render the full roster (>=17 roots); Users and Roles & Permissions items are present and navigable
  - screen_id: m01-dashboard
    feature_id: m01-dashboard
    state: content
    user_intent: review the Platform Admin home — platform health tiles, all-office KPIs, approvals count (checker-on-all), user and role activity summary, config toggle status
    success_signal: the 'Platform Admin' tile set renders with live data scoped to head-office (all sub-offices); approvals-pending count is accurate
  - screen_id: m10-users-roles-permissions
    feature_id: m10-users-roles-permissions
    state: content
    user_intent: create a new user (name, username, password, email, office, staff assignment), then assign one or more roles to that user — available because ALL_FUNCTIONS includes CREATE_USER + UPDATE_USER + READ_ROLE
    success_signal: the new user is created (POST /users succeeds); role assignment is persisted (PUT /users/{id}); the user appears in the user list with their assigned roles
  - screen_id: m10-users-roles-permissions
    feature_id: m10-users-roles-permissions
    state: content
    user_intent: open a role, add or remove specific permission codes, and toggle maker-checker on any permission via PUT /permissions — available only to ALL_FUNCTIONS + CHECKER_SUPER_USER
    success_signal: permission codes updated (PUT /permissions succeeds); the role's effective code set reflects the change immediately in the UI; no 403 drift on next role-holder login
  - screen_id: m15-approvals-makerchecker
    feature_id: m15-approvals-makerchecker
    state: content
    user_intent: open the checker-on-all approvals queue and review every pending maker-checker entry across all entity types and all offices; approve, reject or delete entries as CHECKER_SUPER_USER
    success_signal: the self-scoped four-eyes queue renders (CHECKER_SUPER_USER means all entries visible); approve/reject actions fire POST /makercheckers/{auditId}?command=approve|reject and each entry moves to the resolved state

expected_outcome: >-
  A new user exists in Fineract with the assigned role and updated permission codes taking effect
  on their next login; the maker-checker approvals backlog is cleared. The NavShell correctly
  exposes every admin-only module root, confirming the assembler's ALL_FUNCTIONS bypass path is
  working — every other role's session would not see Users, Roles or Config in the nav.

flows:
  - feature_id: nav-shell-assembler
    flow_id: super-user-admin
    role: primary
  - feature_id: m10-users-roles-permissions
    flow_id: super-user-admin
    role: primary
  - feature_id: m15-approvals-makerchecker
    flow_id: super-user-admin
    role: primary
  - feature_id: m01-dashboard
    flow_id: super-user-admin
    role: background

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: maximum
preconditions:
  - "an authenticated session with ALL_FUNCTIONS + CHECKER_SUPER_USER (super user role)"
  - "at least one pending maker-checker entry exists to exercise the approvals step"
failure_modes:
  - cause: "POST /users fails — duplicate username or missing required field"
    recovery_screen: m10-users-roles-permissions
    notes: "inline form validation highlights the conflicting field; user corrects and retries"
  - cause: "PUT /permissions returns 400 — invalid code or maker-checker toggle not allowed on a special permission"
    recovery_screen: m10-users-roles-permissions
    notes: "error snackbar shown; the previous permission state is still active; user reviews the code list and retries"
  - cause: "approvals queue is empty (no pending entries)"
    recovery_screen: m15-approvals-makerchecker
    notes: "empty state shown — the backlog is already clear; super user navigates back to the admin dashboard"
  - cause: "403 mid-session — session expired or role demoted by another admin"
    recovery_screen: fineract-auth-session
    notes: "403-drift handler clears the session and routes to re-authentication; new PermissionSet resolved on next login"
