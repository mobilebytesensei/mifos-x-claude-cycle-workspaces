id: scheduler-jobs-operations
version: 1.0.0
name: Scheduler & Jobs Operations — Monitor and Run Batch Jobs (COB)
description: >-
  An operations/admin user opens the M13 Scheduler & Jobs module to review the scheduled-job roster
  and the global scheduler status, inspects a job's run history, and either runs a job now or edits
  its schedule / advances the business date via the shared dynamic template form — the day-to-day
  Close-of-Business (COB) operations loop.

persona:
  archetype: operations administrator
  jtbd: keep scheduled batch jobs healthy and intervene when a run fails
  context: daily COB monitoring at head office
  knowledge_level: expert
  emotional_state: vigilant, remediation-focused

goal: >-
  Enter the scheduler console, identify a job needing action (failed run / schedule change), and
  complete the intervention (run-now or edit-schedule / advance-business-date) with a confirmed
  server result.

success_metric:
  name: scheduler_intervention_completion
  kind: task_completion
  target: ">=90% of interventions reach a confirmed CommandProcessingResult on the first attempt"
  measurement: "funnel: console_loaded -> job_selected -> command_submitted -> result_confirmed"

screen_sequence:
  - screen_id: m13-scheduler-jobs
    feature_id: m13-scheduler-jobs
    state: content
    user_intent: review the job roster + scheduler status and open a job's run history
    success_signal: the scheduler console renders the job list with last-run status chips from cache/live
  - screen_id: dynamic-template-forms
    feature_id: dynamic-template-forms
    state: content
    user_intent: edit the job schedule (cron/active) or advance the business date
    success_signal: the edit-schedule / advance-business-date form renders and submits online

expected_outcome: >-
  The chosen job has been run or rescheduled (or the business date advanced) with a confirmed
  server-side result — or a clear online-only/error state explaining why the mutating command could
  not proceed (offline, permission-drift, invalid cron).

flows:
  - feature_id: m13-scheduler-jobs
    flow_id: scheduler-jobs-operations
    role: primary
  - feature_id: dynamic-template-forms
    flow_id: scheduler-jobs-operations
    role: supporting

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session whose PermissionSet resolves READ_SCHEDULER (or an umbrella)"
  - "connectivity for mutating commands — scheduler operations are online-only and never queued"
failure_modes:
  - cause: "the job/scheduler/business-date fetch failed with no cached copy"
    recovery_screen: m13-scheduler-jobs
    notes: "error state with Retry that re-drains the list fetch"
  - cause: "a run/edit command rejected (400 invalid cron / 403 permission-drift / 409)"
    recovery_screen: m13-scheduler-jobs
    notes: "inline error; 403 routes through the permission-drift refresh, never a crash"
