id: permissions-administration
version: 1.0.0
name: Permissions Administration — Inspect Resolved Access
description: >-
  A system administrator inspects how the app's access is governed — opening the resolved
  PermissionSet and the active CapabilityMap metadata from the permission-capability engine to
  audit what the current role can do and why surfaces are gated.

persona:
  archetype: expert administrator
  jtbd: verify exactly what the signed-in role is permitted to do and trace where gating comes from
  context: during a role/access review or while diagnosing a "why can't I see X" support question
  knowledge_level: expert
  emotional_state: analytical

goal: >-
  Go from the users/roles/permissions module through the permission-capability engine into the
  resolved PermissionSet and CapabilityMap detail to audit effective access.

success_metric:
  name: access_audit_completion
  kind: task_completion
  target: ">=90% of access questions resolved without leaving the app"
  measurement: "funnel: permission_engine_render -> permission_set_detail|capability_map_detail viewed"

screen_sequence:
  - screen_id: m10-users-roles-permissions
    feature_id: m10-users-roles-permissions
    state: content
    user_intent: enter the users, roles & permissions module
    success_signal: the module surface loads
  - screen_id: permission-capability-engine
    feature_id: permission-capability-engine
    state: content
    user_intent: open the resolved permission/capability engine
    success_signal: the engine surface renders with the active PermissionSet + CapabilityMap
  - screen_id: permission-set-detail
    feature_id: permission-set-detail
    state: content
    user_intent: inspect the resolved PermissionSet against the code catalog
    success_signal: the PermissionSet resolves and grouped permissions render with a fingerprint
  - screen_id: capability-map-detail
    feature_id: capability-map-detail
    state: content
    user_intent: inspect the active CapabilityMap metadata + requirement tree
    success_signal: the CapabilityMap resolves and the module requirement tree renders

expected_outcome: >-
  The administrator has audited the effective PermissionSet and CapabilityMap for the current
  role, with fingerprints/checksums captured to confirm which access build is live.

flows:
  - feature_id: permission-set-detail
    flow_id: permissions-admin
    role: primary
  - feature_id: capability-map-detail
    flow_id: permissions-admin
    role: primary

capabilities_used: ["has_ui", "has_flow"]
tier: medium
preconditions:
  - "an authenticated session with a bootstrapped PermissionSet + CapabilityMap"
failure_modes:
  - cause: "the code/grouping catalog fails to load with no cache"
    recovery_screen: permission-set-detail
    notes: "error state with Retry; cache-first read serves the last catalog offline"
  - cause: "PermissionSet/CapabilityMap not yet bootstrapped (pre-login)"
    recovery_screen: capability-map-detail
    notes: "empty state; resolves after authentication completes"
