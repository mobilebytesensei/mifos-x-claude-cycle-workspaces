id: accounting-gl-management
version: 1.0.0
name: Accounting & GL Management — Post a Manual Journal Entry
description: >-
  An accountant opens the M07 accounting & GL module, browses the chart-of-accounts tree and
  opens the manual journal-entry form (rendered from the Fineract entity template) to post a
  balanced debit/credit entry that replays exactly-once through the durable outbox.

persona:
  archetype: expert administrator
  jtbd: record a compliant, balanced accounting entry without ever double-posting
  context: back-office finance work, period-end close or ad-hoc correction, head office
  knowledge_level: expert
  emotional_state: precise, compliance-minded

goal: >-
  Go from the accounting module into the dynamic journal-entry form and post a balanced
  (debits == credits) manual journal entry that funnels through the durable idempotent outbox.

success_metric:
  name: journal_entry_post_completion
  kind: task_completion
  target: ">=95% of manual journal entries posted balanced on first submit"
  measurement: "funnel: accounting_module_opened -> journal_form_rendered -> post_success"

screen_sequence:
  - screen_id: m07-accounting
    feature_id: m07-accounting
    state: content
    user_intent: enter the accounting & GL module and open the manual journal-entry action
    success_signal: the chart-of-accounts and GL surfaces load (offline-browsable, CACHE_FIRST_SWR)
  - screen_id: dynamic-template-forms
    feature_id: dynamic-template-forms
    state: content
    user_intent: fill the journal-entry form rendered from GET /{entity}/template and post it
    success_signal: debits == credits validates client-side and the posting enqueues to the durable outbox

expected_outcome: >-
  A balanced manual journal entry is posted through the durable outbox with an idempotency key so it
  replays exactly-once via POST /v1/batches; the GL reflects the entry and accounting never double-posts.

flows:
  - feature_id: m07-accounting
    flow_id: accounting-gl
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session with the CREATE_JOURNALENTRY permission"
failure_modes:
  - cause: "the entity template fails to load with no cache"
    recovery_screen: dynamic-template-forms
    notes: "error state with Retry"
  - cause: "debits != credits on submit"
    recovery_screen: dynamic-template-forms
    notes: "client-side balance gate blocks post; the form retains entered lines for correction"
