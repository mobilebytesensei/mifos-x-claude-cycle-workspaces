id: maker-checker-approvals
version: 1.0.0
name: Maker-Checker — Clear the Approval Queue
description: >-
  A branch checker opens the maker-checker module, reviews the self-scoped queue of commands
  awaiting their approval, and enqueues approve/reject/delete decisions so pending maker actions
  are committed or bounced.

persona:
  archetype: returning power user
  jtbd: review and clear the four-eyes approval queue so blocked operations can proceed
  context: at the branch, periodically through the day, exercising dual-control governance
  knowledge_level: expert
  emotional_state: diligent, accountability-aware

goal: >-
  Go from the approvals module to a worked-down maker-checker queue where every actionable
  command has an approve/reject/delete decision enqueued.

success_metric:
  name: approval_queue_throughput
  kind: task_completion
  target: ">=95% of decidable entries actioned per checker session with zero mis-approvals"
  measurement: "funnel: queue_rendered -> decision_enqueued per entity"

screen_sequence:
  - screen_id: m15-approvals-makerchecker
    feature_id: m15-approvals-makerchecker
    state: content
    user_intent: enter the maker-checker module
    success_signal: the approvals module surface loads
  - screen_id: checker-inbox
    feature_id: checker-inbox
    state: content
    user_intent: review self-scoped entries and decide approve/reject/delete
    success_signal: a decision is enqueued and the row leaves the queue

expected_outcome: >-
  The checker's queue is cleared of decidable entries; approved maker commands are committed and
  rejected/deleted ones are bounced, keeping four-eyes governance intact.

flows:
  - feature_id: checker-inbox
    flow_id: maker-checker
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: maximum
preconditions:
  - "an authenticated session whose role can approve/reject the queued command types"
failure_modes:
  - cause: "no queued commands await this checker"
    recovery_screen: checker-inbox
    notes: "empty state; nothing to action"
  - cause: "a decision fails hard with no fallback"
    recovery_screen: checker-inbox
    notes: "error state with Retry; the entry stays until the decision commits"
