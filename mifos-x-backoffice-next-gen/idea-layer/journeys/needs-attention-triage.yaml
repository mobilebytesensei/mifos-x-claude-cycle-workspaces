id: needs-attention-triage
version: 1.0.0
name: Needs-Attention Inbox — Triage What Needs Me
description: >-
  Any authenticated user opens the unified Needs-Attention inbox (the role-aware "what-needs-me"
  landing), reviews the permission-filtered, priority-sorted rows aggregated across approvals, failed
  syncs, overdue tasks and alerts, and drills through into the owning module to resolve an item —
  e.g. a maker-checker approval into M15, or a sync-diagnostics alert back into M17.

persona:
  archetype: any authenticated staff user
  jtbd: quickly see and clear everything that requires my action across modules
  context: role-aware landing at the start of a work session
  knowledge_level: familiar
  emotional_state: triage-minded, wants a clear worklist

goal: >-
  Enter the inbox, pick the highest-priority item, and either resolve it inline or drill through into
  the owning module (approvals / collections / loans / sync) to complete the action.

success_metric:
  name: attention_item_resolution
  kind: task_completion
  target: ">=90% of opened attention items are resolved inline or via a single drill-through"
  measurement: "funnel: inbox_loaded -> item_selected -> resolved_or_drilled_through"

screen_sequence:
  - screen_id: needs-attention-inbox
    feature_id: needs-attention-inbox
    state: content
    user_intent: review the aggregated, permission-filtered attention rows and pick an item
    success_signal: the inbox renders priority-sorted rows across the permitted category buckets
  - screen_id: m15-approvals-makerchecker
    feature_id: m15-approvals-makerchecker
    state: content
    user_intent: open the owning module to resolve the item (e.g. approve a maker-checker request)
    success_signal: the checker detail opens for the tapped approval row and the action completes

expected_outcome: >-
  The selected attention item has been resolved — inline (Retry / Edit / Discard) or by drilling into
  the owning module and completing the action — and the inbox row clears; an empty inbox shows the
  clean "nothing needs you" state.

flows:
  - feature_id: needs-attention-inbox
    flow_id: needs-attention-triage
    role: primary
  - feature_id: m15-approvals-makerchecker
    flow_id: needs-attention-triage
    role: supporting

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session — the inbox is a primary landing for every user, sources are permission-filtered"
failure_modes:
  - cause: "hard initialization failure before any source contributes (e.g. local Room read throws)"
    recovery_screen: needs-attention-inbox
    notes: "error state; per-category Retry re-loads an errored group source"
  - cause: "a permitted source errors while others succeed"
    recovery_screen: needs-attention-inbox
    notes: "per-source load-error strip with Retry, inbox still renders the healthy sources"
