id: report-generation
version: 1.0.0
name: Report Generation — Run a Parameterised Report
description: >-
  A branch manager or MIS analyst opens the M14 reports & audit module, picks a report, sets its
  parameters in the report runner, executes it and reviews/exports the tabular result — e.g. the
  portfolio-at-risk report deep-linked from the dashboard.

persona:
  archetype: returning power user
  jtbd: pull an accurate, parameterised operational report and share the result
  context: periodic MIS/portfolio review at the branch or head office
  knowledge_level: familiar
  emotional_state: analytical, deadline-aware

goal: >-
  Go from the reports module into the report runner, configure parameters, run the report and
  obtain a populated result set ready to sort/export.

success_metric:
  name: report_run_completion
  kind: task_completion
  target: ">=90% of report runs return the intended result set on the first parameter pass"
  measurement: "funnel: report_selected -> parameters_set -> run_success_rows_rendered"

screen_sequence:
  - screen_id: m14-reports-search-audit
    feature_id: m14-reports-search-audit
    state: content
    user_intent: enter the reports & audit module and choose a report
    success_signal: the reports module surface loads with the report catalog
  - screen_id: report-runner
    feature_id: report-runner
    state: content
    user_intent: set parameters, run the report, sort/export the result
    success_signal: parameter metadata resolves, the run returns rows and export is available

expected_outcome: >-
  The chosen report has been run with the intended parameters and a populated, sortable result
  set is on screen and available to export — or a clear empty/error state with a retry path.

flows:
  - feature_id: report-runner
    flow_id: report-generation
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session with report-run permissions for the selected report"
failure_modes:
  - cause: "the run returns zero rows for the chosen parameters"
    recovery_screen: report-runner
    notes: "empty state; adjust parameters and re-run"
  - cause: "parameter metadata or the run fails hard with no cache"
    recovery_screen: report-runner
    notes: "error state with Retry"
