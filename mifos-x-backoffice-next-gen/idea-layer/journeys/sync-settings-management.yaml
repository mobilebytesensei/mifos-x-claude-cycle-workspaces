id: sync-settings-management
version: 1.0.0
name: Sync & Settings — Drain the Outbox and Manage Preferences
description: >-
  Any authenticated user opens the M17 Sync & Settings module to see the sync watermark and pending
  outbox count, triggers a sync (or a delta pull) which delegates to the offline-sync-engine, and —
  when a replay is rejected — routes into the needs-attention inbox to triage the failed commands.

persona:
  archetype: field/branch user
  jtbd: get local changes safely synced and understand what still needs attention
  context: reconnecting after offline work or a periodic settings check
  knowledge_level: familiar
  emotional_state: reassurance-seeking, wants a clean state

goal: >-
  Enter the settings surface, trigger a sync that drains the outbox, and land on either a clean
  zero-pending state or a clear needs-attention route for any rejected commands.

success_metric:
  name: sync_drain_completion
  kind: task_completion
  target: ">=90% of sync runs end at zero-pending or a resolvable needs-attention route"
  measurement: "funnel: settings_loaded -> sync_triggered -> drain_complete_or_needs_attention"

screen_sequence:
  - screen_id: m17-sync-settings
    feature_id: m17-sync-settings
    state: content
    user_intent: review the sync banner (pending count / watermark) and start a sync
    success_signal: the settings surface renders the pending-outbox count and an enabled Sync-now CTA
  - screen_id: offline-sync-engine
    feature_id: offline-sync-engine
    state: content
    user_intent: drain the outbox / pull the latest delta
    success_signal: per-command drain progress advances and the batch settles
  - screen_id: needs-attention-inbox
    feature_id: needs-attention-inbox
    state: content
    user_intent: triage any rejected/failed commands (Retry / Edit / Discard)
    success_signal: rejected commands surface in the inbox with a recovery action

expected_outcome: >-
  The outbox has been drained to zero pending, or every rejected command has been routed to the
  needs-attention inbox with a Retry/Edit/Discard path — the user leaves with an unambiguous sync
  state rather than a silent failure.

flows:
  - feature_id: m17-sync-settings
    flow_id: sync-settings-management
    role: primary
  - feature_id: offline-sync-engine
    flow_id: sync-settings-management
    role: supporting
  - feature_id: needs-attention-inbox
    flow_id: sync-settings-management
    role: supporting

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session (settings is always available — no server permission gate)"
failure_modes:
  - cause: "settings read or sync-status derive failed"
    recovery_screen: m17-sync-settings
    notes: "error banner with Retry; cached preferences still render (never blank)"
  - cause: "sync produced rejected/failed commands"
    recovery_screen: needs-attention-inbox
    notes: "needs-attention badge routes to the inbox for Retry / Edit / Discard"
