id: communications-campaigns
version: 1.0.0
name: Communications — Create and Activate a Campaign
description: >-
  A marketing/admin operator opens the M16 Communications module, reviews the campaign list, template
  library and delivery hooks, then creates or activates a campaign — with the command completing
  online, queuing to the durable outbox when offline, or routing to maker-checker approval when the
  tenant requires it.

persona:
  archetype: communications operator
  jtbd: reach the right recipients with an approved, correctly-templated campaign
  context: outbound messaging administration at the branch or head office
  knowledge_level: familiar
  emotional_state: deliberate, compliance-aware

goal: >-
  Go from the communications module into a campaign's detail, submit a create/activate command, and
  obtain a confirmed status transition — accepted online, queued offline exactly-once, or submitted
  for approval.

success_metric:
  name: campaign_command_completion
  kind: task_completion
  target: ">=90% of campaign commands reach accepted / queued / pending-approval without validation rework"
  measurement: "funnel: list_loaded -> campaign_opened -> command_submitted -> status_resolved"

screen_sequence:
  - screen_id: m16-communications
    feature_id: m16-communications
    state: content
    user_intent: browse campaigns/templates/hooks and open a campaign detail
    success_signal: the campaign list and the selected campaign detail render from cache/live
  - screen_id: m16-communications
    feature_id: m16-communications
    state: submitting
    user_intent: submit a create / activate / close campaign command
    success_signal: the command posts online (2xx) or queues to the durable outbox with an idempotency key

expected_outcome: >-
  The campaign command has reached a definite state — accepted (status refreshed), queued offline for
  exactly-once replay, or submitted for maker-checker approval — or a clear validation/optimistic-lock
  error with a recovery path; a rejected offline replay routes to the needs-attention inbox.

flows:
  - feature_id: m16-communications
    flow_id: communications-campaigns
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session whose PermissionSet resolves the campaign/template group (READ_SMSCAMPAIGN or umbrella)"
failure_modes:
  - cause: "campaign list/detail fetch failed with no cache to fall back on"
    recovery_screen: m16-communications
    notes: "error state with Retry"
  - cause: "command rejected (400 validation / 409 optimistic-lock / 403 permission-drift)"
    recovery_screen: m16-communications
    notes: "inline error; the campaign status is not optimistically flipped"
