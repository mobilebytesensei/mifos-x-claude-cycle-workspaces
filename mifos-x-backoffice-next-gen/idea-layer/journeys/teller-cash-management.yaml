id: teller-cash-management
version: 1.0.0
name: Teller & Cash Management — Allocate Cash to a Cashier
description: >-
  A teller supervisor opens the M11 tellers & cash module, reviews the teller vault cash position,
  and opens the cash-allocation form (rendered from the Fineract template) to allocate cash from
  the vault to a cashier for a date range — every cash movement flowing exactly-once through the
  durable outbox.

persona:
  archetype: expert administrator
  jtbd: move and reconcile branch cash accurately with an auditable, exactly-once trail
  context: branch cash operations at day-open / day-close or shift handover
  knowledge_level: expert
  emotional_state: careful, accountable

goal: >-
  Go from the tellers & cash module into the dynamic cash-management form and settle a cash
  movement (allocate/settle) that funnels through the durable idempotent outbox.

success_metric:
  name: cash_movement_completion
  kind: task_completion
  target: ">=95% of cash allocations/settlements committed without reconciliation exception"
  measurement: "funnel: teller_module_opened -> cash_form_rendered -> movement_committed"

screen_sequence:
  - screen_id: m11-tellers-cash
    feature_id: m11-tellers-cash
    state: content
    user_intent: enter the tellers & cash module and open a teller's cash position
    success_signal: the teller list and vault cash position render (offline via CACHE_FIRST_SWR Store5)
  - screen_id: dynamic-template-forms
    feature_id: dynamic-template-forms
    state: content
    user_intent: fill the cash-allocation/settlement form rendered from the Fineract template and submit
    success_signal: every control is gated on its exact {ACTION}_{ENTITY} permission and the movement enqueues to the durable outbox

expected_outcome: >-
  Cash is allocated from the vault to a cashier (or settled back) with an exactly-once idempotency
  key through the offline-sync outbox; the teller cash position reflects the movement and reconciles.

flows:
  - feature_id: m11-tellers-cash
    flow_id: teller-cash
    role: primary

capabilities_used: ["has_ui", "has_flow", "has_api"]
tier: medium
preconditions:
  - "an authenticated session with the ALLOCATECASHIER / SETTLECASHIER teller permission"
failure_modes:
  - cause: "the cash-management template fails to load with no cache"
    recovery_screen: dynamic-template-forms
    notes: "error state with Retry"
  - cause: "the movement is queued offline and the drain has not yet run"
    recovery_screen: m11-tellers-cash
    notes: "queued_offline state; the movement replays exactly-once when connectivity returns"
