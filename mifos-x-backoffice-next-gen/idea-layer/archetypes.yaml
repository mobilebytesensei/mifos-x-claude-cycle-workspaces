---
schema_version: "1.0"
archetypes_version: "v1.0.0"
last_modified: "2026-07-30"
project: mifos-x-backoffice-next-gen
plan_origin: render-engine-bootstrap
note: |
  Project archetype extensions for the Mifos-X back-office console. The render
  engine merges (later wins on collision):
    1. layers/idea/templates/prototype-render/ARCHETYPES.yaml  (framework base:
       splash, onboarding_step, signin_form, home_feed, detail_screen, list_screen,
       index_chips, settings, about_marketing, paywall, empty_state, error_state,
       loading_state)
    2. THIS file (admin-console archetypes)
    3. screens/{id}/ui.yaml#/archetype_overrides
  Every screens/*/ui.yaml#archetype resolves against this merged set. The 7 archetypes
  below cover the admin roles the framework base lacks: dashboard, master_detail,
  form_screen, wizard, tab_screen, settings_console, mutation_console. list-type screens
  use base `list_screen`; record screens use base `detail_screen`; login uses base
  `signin_form`. All shared_partial refs resolve to preview/_shared/*.html generated from
  design-system/app-shell.yaml. All spacing/type/radius/elevation are token-native
  (--sp-*/--fs-*/--r-*/--el-*) per CRAFT_RULES §7.
---

archetypes:

  - id: dashboard
    description: |
      Role-adaptive KPI/quick-action home. Independent-card grid where each tile
      (KPI, quick-action, activity feed) hydrates and fails independently — one
      failing tile shows an inline error, never blanks the grid. Permission-gated:
      a tile renders only if the signed-in user holds its gating permission.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar.html
        slots: [menu_or_avatar, title, search_action, notification_action]
      - block: offline_banner
        shared_partial: _shared/offline-banner.html
        surface: { background: --warning-strong, elevation: --el-0 }
        visible_when: no-network
      - block: kpi_grid
        layout: grid_2_columns_mobile_4_desktop
        repeats: 4-8
        slots: [kpi_label, kpi_value_mono, kpi_delta, kpi_sparkline]
        typography: { kpi_value: --fs-h1, kpi_label: --fs-meta, kpi_delta: --fs-micro }
        spacing: { gap: --sp-3, padding_x: --sp-4, padding_y: --sp-3 }
        surface: { background: --surface-container-low, corner_radius: --r-lg, elevation: --el-1, border: --border }
      - block: quick_actions
        layout: horizontal_scroll_or_grid
        slots: [action_icon, action_label]
        typography: { action_label: --fs-meta }
        spacing: { gap: --sp-3, padding_x: --sp-4 }
        surface: { corner_radius: --r-md, elevation: --el-1 }
      - block: activity_feed
        slots: [activity_row+]
        typography: { primary: --fs-body, meta: --fs-meta, amount: --font-mono }
        spacing: { item_gap: --sp-2, padding_x: --sp-4, section_gap: --sp-6 }
        surface: { item_corner_radius: --r-md, elevation: --el-1 }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - blanking the whole grid when one tile fails (isolate to the tile)
      - hero_carousel (this is an admin console, not a discovery home)
      - accent color on more than 2 tiles
    allowed_variations:
      - omit quick_actions when the persona has no create permissions
      - promote bottom_nav to navigation-rail on tablet/desktop (--breakpoint tablet+)
      - omit activity_feed on metric-only dashboards

  - id: master_detail
    description: |
      Module hub: a searchable/filterable master list (left/top) that drives a
      detail/summary pane. On phone the list is primary and taps push the detail;
      on tablet/desktop both render side-by-side. Used by the M03-M12/M16 module
      roots. Each list row and detail field is permission-gated.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar.html
        slots: [back_or_menu, title, search_action, filter_action, overflow]
      - block: filter_chip_row
        typography: { chip_label: --fs-meta }
        spacing: { padding: --sp-3, gap: --sp-2 }
        surface: { corner_radius: --r-full }
        scrollable_horizontal: true
      - block: master_list
        slots: [list_row+]
        typography: { primary: --fs-body, secondary: --fs-meta, trailing_mono: --font-mono }
        spacing: { item_gap: --sp-2, padding_x: --sp-4 }
        surface: { item_corner_radius: --r-md, elevation: --el-1, divider: --border }
      - block: detail_pane
        layout: side_by_side_on_tablet_pushed_on_phone
        slots: [summary_header, status_chip, section_tabs, field_rows, action_row]
        typography: { header: --fs-h2, field_label: --fs-meta, field_value: --fs-body, numeric: --font-mono }
        spacing: { padding: --sp-4, section_gap: --sp-6 }
        surface: { background: --surface, corner_radius: --r-lg, elevation: --el-1, border: --border }
      - block: fab
        shared_partial: _shared/fab.html
        surface: { background: --secondary, corner_radius: --r-lg, elevation: --el-2 }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - hero imagery
      - accent color beyond the FAB + one status emphasis
      - inline-editing master rows (open the detail pane)
    allowed_variations:
      - single-pane push navigation on phone form-factor
      - omit fab when the persona holds no create permission
      - omit filter_chip_row when no filters are defined

  - id: form_screen
    description: |
      Data-entry / editor form. Grouped fields, inline validation below each field,
      one primary submit. Fields tint to button-primary-disabled when the action
      requires network and the app is offline. Used by product/entity editors and
      dynamic Fineract template + datatable renderers.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar.html
        slots: [back_action, title, save_action]
      - block: form_section
        repeats: 1-8
        slots: [section_label, field_row+]
        typography: { section_label: --fs-meta, label: --fs-meta, input: --fs-body, helper_or_error: --fs-micro }
        spacing: { section_gap: --sp-6, field_gap: --sp-4, padding_x: --sp-4 }
        surface: { field_background: --surface-variant, corner_radius: --r-sm, divider: --border }
      - block: primary_cta
        typography: { button_text: --fs-body }
        surface: { background: --primary, corner_radius: --r-xl, elevation: --el-1 }
        spacing: { padding: --sp-4, margin_top: --sp-6 }
    forbidden:
      - bottom_nav (editor owns the screen)
      - more than 1 primary CTA
      - inline errors above the field (errors render below)
    allowed_variations:
      - dynamic field set driven by a Fineract entity template
      - sticky save bar at bottom on long forms
      - secondary "Cancel" beside the primary CTA

  - id: wizard
    description: |
      Multi-step stepper flow. A progress header shows N steps; one step body at a
      time; Back/Next footer with a final Review+Submit. Used by the loan
      application wizard (product → terms → schedule → review).
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar.html
        slots: [close_or_back, title]
      - block: step_progress
        slots: [step_dot_or_number+, step_label]
        typography: { step_label: --fs-meta, step_number: --font-mono }
        spacing: { padding: --sp-4, gap: --sp-2 }
        surface: { active: --primary, inactive: --outline-variant }
      - block: step_body
        slots: [step_fields OR review_summary]
        typography: { label: --fs-meta, value: --fs-body, numeric: --font-mono }
        spacing: { field_gap: --sp-4, padding_x: --sp-4, padding_y: --sp-3 }
        surface: { field_background: --surface-variant, corner_radius: --r-sm }
      - block: wizard_footer
        slots: [back_button, next_or_submit_button]
        typography: { button_text: --fs-body }
        surface: { primary_background: --primary, secondary_background: --surface, corner_radius: --r-xl }
        spacing: { padding: --sp-4, gap: --sp-3, margin_top: auto }
    forbidden:
      - bottom_nav (wizard owns the back stack)
      - skipping the progress header
      - more than 1 primary action in the footer
    allowed_variations:
      - review step renders a read-only summary of all prior steps
      - omit back_button on the first step
      - vertical stepper on tablet/desktop

  - id: tab_screen
    description: |
      Tabbed console — a segmented/tab bar switches content panes within one screen
      (e.g. Reports / Search / Audit). Tab selection is a state change, not
      navigation. Used by M14 reports-search-audit.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar.html
        slots: [back_or_menu, title, search_action]
      - block: tab_bar
        slots: [tab+]
        typography: { tab_label: --fs-label }
        spacing: { padding_x: --sp-4, gap: --sp-4 }
        surface: { active_indicator: --primary, corner_radius: --r-none }
        scrollable_horizontal: true
      - block: tab_pane
        slots: [pane_content_list_or_form_or_table]
        typography: { primary: --fs-body, meta: --fs-meta, numeric: --font-mono }
        spacing: { padding: --sp-4, section_gap: --sp-6 }
        surface: { corner_radius: --r-lg, elevation: --el-1, border: --border }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - navigating away on tab select (swap pane content in place)
      - more than 5 top-level tabs (use overflow)
    allowed_variations:
      - promote tabs to a navigation-rail sub-nav on desktop
      - per-tab empty/loading/error states within the pane

  - id: settings_console
    description: |
      Grouped settings + operational status console. Sections of rows with trailing
      toggles/chevrons/values, plus a live sync/connectivity status header. Used by
      M17 sync & settings.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar.html
        slots: [back_action, title]
      - block: sync_status_header
        slots: [connectivity_chip, last_sync_time_mono, pending_count]
        typography: { status: --fs-body, timestamp: --font-mono, count: --font-mono }
        spacing: { padding: --sp-4 }
        surface: { background: --surface-container-low, corner_radius: --r-lg, elevation: --el-1, border: --border }
      - block: settings_section
        repeats: 2-6
        slots: [section_label, settings_row+]
        typography: { section_label: --fs-meta, row_primary: --fs-body, row_meta: --fs-meta }
        spacing: { section_gap: --sp-6, row_padding: --sp-4 }
        surface: { row_background: --surface, divider: --border }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - settings rows without a section
      - inline editing within rows (open a detail/form screen)
    allowed_variations:
      - omit bottom_nav in a modal/sheet context
      - mix toggle/chevron/value trailing elements within a section

  - id: mutation_console
    description: |
      Offline write/outbox operations console — queued mutations, batch replay
      progress, delta-pull status. Rows carry a state chip (queued/replaying/
      succeeded/failed) and a per-row retry. Used by the offline-sync-engine screen.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar.html
        slots: [back_action, title, replay_all_action]
      - block: replay_progress
        slots: [progress_bar, counts_mono]
        typography: { counts: --font-mono, label: --fs-meta }
        spacing: { padding: --sp-4 }
        surface: { corner_radius: --r-lg, elevation: --el-1, border: --border }
      - block: outbox_list
        slots: [mutation_row+]
        row_slots: [entity_label, operation_chip, queued_at_mono, state_chip, retry_action]
        typography: { primary: --fs-body, meta: --fs-meta, timestamp: --font-mono }
        spacing: { item_gap: --sp-2, padding_x: --sp-4 }
        surface: { item_corner_radius: --r-md, elevation: --el-1, divider: --border }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - hiding failed mutations (they must stay visible with a retry)
      - stack traces in the row error (plain-language cause only)
    allowed_variations:
      - group rows by entity type
      - omit replay_progress when the outbox is empty (render empty_state)
