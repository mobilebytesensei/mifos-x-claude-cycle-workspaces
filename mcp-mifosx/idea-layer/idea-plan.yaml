# ═══════════════════════════════════════════════════════════════════
# §flows (Phase 10)
# ═══════════════════════════════════════════════════════════════════
flows:
  _tag: "§flows"
  _status: approved
  _quality_score: 75
  _last_updated: "2026-05-02T03:40:00Z"
  _enrichment_count: 0
  _source: "source_analysis"

  items:
    - name: client-onboarding
      description: "Create client → activate → open savings → open loan"
      feature_refs: [client-management, savings-management, loan-management]
      steps:
        - "POST /clients (pending)"
        - "POST /clients/{id}?command=activate"
        - "POST /savingsaccounts → approve → activate"
        - "POST /loans → approve → disburse"

    - name: loan-lifecycle
      description: "Full loan from application to completion"
      feature_refs: [loan-management, savings-management]
      steps:
        - "GET /loanproducts → select product"
        - "POST /loans → submit application"
        - "POST /loans/{id}?command=approve"
        - "POST /loans/{id}?command=disburse"
        - "GET /loans/{id}/schedule → check due dates"
        - "POST /loans/{id}/transactions?command=repayment"
        - "Optional: reschedule, waive interest, apply late fee"

    - name: group-lending
      description: "Create group → add members → group loan"
      feature_refs: [group-management, loan-management]
      steps:
        - "POST /groups → create"
        - "POST /groups/{id}?command=activate"
        - "POST /groups/{id}?command=associateClients"
        - "POST /loans (groupId) → approve → disburse"

    - name: accounting-reconciliation
      description: "Check balances → record entries → run reports"
      feature_refs: [accounting, reporting, savings-management, loan-management]
      steps:
        - "GET /clients/{id}/accounts"
        - "GET /loans/{id}, GET /savingsaccounts/{id}"
        - "POST /journalentries"
        - "GET /runreports/{name}"

    - name: bulk-processing
      description: "Concurrent batch operations (Go/Rust)"
      feature_refs: [bulk-operations, loan-management, savings-management, client-management]
      steps:
        - "bulk_search_clients → find clients"
        - "bulk_disburse_loans → parallel disbursals"
        - "bulk_make_repayments → concurrent repayments"
        - "bulk_apply_fees → parallel fee application"

# ═══════════════════════════════════════════════════════════════════
# §api_surface (Phase 11)
# ═══════════════════════════════════════════════════════════════════
api_surface:
  _tag: "§api_surface"
  _status: approved
  _quality_score: 85
  _last_updated: "2026-05-02T03:40:00Z"
  _enrichment_count: 0
  _source: "source_analysis"

  base_url: "https://{host}/fineract-provider/api/v1"
  auth:
    method: basic
    headers:
      - "Authorization: Basic {base64(username:password)}"
      - "fineract-platform-tenantid: {tenant_id}"
      - "Content-Type: application/json"

  transport:
    stdio: "Default — local development (Claude Desktop, Cursor, VSCode)"
    sse: "Cloud deployments, web UIs, n8n workflows (Go via PORT env)"

  endpoint_domains:
    - domain: clients
      base_path: "/clients"
      operations: [GET, POST, PUT, DELETE]
      sub_resources: [accounts, identifiers, documents, charges, transactions, addresses]
    - domain: loans
      base_path: "/loans"
      operations: [GET, POST]
      sub_resources: [schedule, transactions, charges, collaterals, documents]
      commands: [approve, reject, disburse, repayment, waiveinterest, reschedule]
    - domain: savings
      base_path: "/savingsaccounts"
      operations: [GET, POST]
      sub_resources: [transactions, charges, documents]
      commands: [approve, activate, deposit, withdrawal, calculateInterest, close]
    - domain: groups
      base_path: "/groups"
      operations: [GET, POST, PUT]
      sub_resources: [accounts]
      commands: [activate, associateClients, disassociateClients, close]
    - domain: centers
      base_path: "/centers"
      operations: [GET, POST]
    - domain: glaccounts
      base_path: "/glaccounts"
      operations: [GET]
    - domain: journalentries
      base_path: "/journalentries"
      operations: [GET, POST]
    - domain: staff
      base_path: "/staff"
      operations: [GET]
    - domain: offices
      base_path: "/offices"
      operations: [GET]
    - domain: reports
      base_path: "/reports"
      operations: [GET, POST, PUT, DELETE]
    - domain: charges
      base_path: "/charges"
      operations: [GET, POST, PUT]
    - domain: codes
      base_path: "/codes"
      operations: [GET]
    - domain: datatables
      base_path: "/datatables"
      operations: [GET]
    - domain: loanproducts
      base_path: "/loanproducts"
      operations: [GET]
    - domain: savingsproducts
      base_path: "/savingsproducts"
      operations: [GET]

  env_vars:
    required:
      - name: MIFOSX_BASE_URL
        example: "https://localhost:8443/fineract-provider/api/v1"
      - name: MIFOSX_TENANT_ID
        default: "default"
      - name: MIFOSX_USERNAME
        example: "mifos"
      - name: MIFOSX_PASSWORD
        example: "password"
    optional:
      - name: PORT
        description: "Enables SSE mode (Go only)"
        default: "8080"
      - name: OPENAI_API_KEY
        description: "OpenAI API key"
      - name: OLLAMA_BASE_URL
        default: "http://localhost:11434"

