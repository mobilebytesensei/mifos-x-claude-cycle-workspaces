# Flow: Loan Lifecycle
name: loan-lifecycle
description: "Full loan from application to completion"
feature_refs: [loan-management, savings-management]
steps:
  - id: 1
    action: "GET /loanproducts"
    description: "Select loan product"
    tool: list_loan_products
  - id: 2
    action: "POST /loans"
    description: "Submit loan application"
    tool: create_loan
  - id: 3
    action: "POST /loans/{id}?command=approve"
    description: "Approve loan"
    tool: approve_loan
  - id: 4
    action: "POST /loans/{id}?command=disburse"
    description: "Disburse funds"
    tool: disburse_loan
  - id: 5
    action: "GET /loans/{id}/schedule"
    description: "Check repayment schedule"
    tool: get_repayment_schedule
  - id: 6
    action: "POST /loans/{id}/transactions?command=repayment"
    description: "Process repayment"
    tool: make_loan_repayment
