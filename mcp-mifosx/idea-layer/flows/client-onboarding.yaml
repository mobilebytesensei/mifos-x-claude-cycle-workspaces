# Flow: Client Onboarding
name: client-onboarding
description: "Create client, activate, open savings, open loan"
feature_refs: [client-management, savings-management, loan-management]
steps:
  - id: 1
    action: "POST /clients"
    description: "Create client (pending status)"
    tool: create_client
  - id: 2
    action: "POST /clients/{id}?command=activate"
    description: "Activate client"
    tool: activate_client
  - id: 3
    action: "POST /savingsaccounts"
    description: "Create savings account"
    tool: create_savings_account
  - id: 4
    action: "POST /savingsaccounts/{id}?command=approve"
    description: "Approve savings"
    tool: approve_savings
  - id: 5
    action: "POST /savingsaccounts/{id}?command=activate"
    description: "Activate savings"
    tool: activate_savings
