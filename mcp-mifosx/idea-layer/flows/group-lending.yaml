# Flow: Group Lending
name: group-lending
description: "Create group, add members, group loan"
feature_refs: [group-management, loan-management]
steps:
  - id: 1
    action: "POST /groups"
    description: "Create group"
    tool: create_group
  - id: 2
    action: "POST /groups/{id}?command=activate"
    description: "Activate group"
    tool: activate_group
  - id: 3
    action: "POST /groups/{id}?command=associateClients"
    description: "Add members"
    tool: add_group_member
  - id: 4
    action: "POST /loans (groupId)"
    description: "Create group loan"
    tool: create_group_loan
  - id: 5
    action: "POST /loans/{id}?command=approve"
    description: "Approve group loan"
    tool: approve_loan
  - id: 6
    action: "POST /loans/{id}?command=disburse"
    description: "Disburse group loan"
    tool: disburse_loan
