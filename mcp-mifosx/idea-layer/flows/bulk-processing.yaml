# Flow: Bulk Processing
name: bulk-processing
description: "Concurrent batch operations (Go/Rust optimized)"
feature_refs: [bulk-operations, loan-management, savings-management, client-management]
steps:
  - id: 1
    action: "bulk_search_clients"
    description: "Find clients concurrently"
    tool: bulk_search_clients
  - id: 2
    action: "bulk_disburse_loans"
    description: "Parallel loan disbursals"
    tool: bulk_disburse_loans
  - id: 3
    action: "bulk_make_repayments"
    description: "Concurrent repayments"
    tool: bulk_make_repayments
  - id: 4
    action: "bulk_apply_fees"
    description: "Parallel fee application"
    tool: bulk_apply_fees
