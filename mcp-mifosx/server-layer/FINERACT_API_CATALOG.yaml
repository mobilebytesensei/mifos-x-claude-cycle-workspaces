# Fineract API Catalog — All Known REST Endpoints
# Source: Apache Fineract 1.9.x REST API (baseline, manually curated)
# Used by /mifos-bridge to classify gaps as TIER 1 vs TIER 2

_version: 1
_source: baseline
_fineract_version: "1.9.x"
_created_at: "2026-05-01"
_total_endpoints: 186

domains:

  # ═══════════════════════════════════════════════════════════════
  # CLIENTS
  # ═══════════════════════════════════════════════════════════════
  clients:
    base_path: /clients
    description: "Client lifecycle — onboarding, KYC, identifiers, documents"
    endpoints:
      - {method: GET, path: "/clients", summary: "List/search clients", params: [sqlSearch, officeId, displayName, externalId, orderBy, sortOrder, limit, offset]}
      - {method: GET, path: "/clients/template", summary: "Client creation template"}
      - {method: POST, path: "/clients", summary: "Create client", body: [firstname, lastname, middlename, officeId, externalId, mobileNo, dateOfBirth, gender, active, activationDate, staffId]}
      - {method: GET, path: "/clients/{clientId}", summary: "Get client details"}
      - {method: PUT, path: "/clients/{clientId}", summary: "Update client"}
      - {method: DELETE, path: "/clients/{clientId}", summary: "Delete client"}
      - {method: POST, path: "/clients/{clientId}?command=activate", summary: "Activate client"}
      - {method: POST, path: "/clients/{clientId}?command=close", summary: "Close client"}
      - {method: POST, path: "/clients/{clientId}?command=reject", summary: "Reject client"}
      - {method: POST, path: "/clients/{clientId}?command=withdraw", summary: "Withdraw client"}
      - {method: POST, path: "/clients/{clientId}?command=reactivate", summary: "Reactivate client"}
      - {method: POST, path: "/clients/{clientId}?command=undoRejection", summary: "Undo rejection"}
      - {method: POST, path: "/clients/{clientId}?command=undoWithdrawal", summary: "Undo withdrawal"}
      - {method: POST, path: "/clients/{clientId}?command=assignStaff", summary: "Assign staff"}
      - {method: POST, path: "/clients/{clientId}?command=unassignStaff", summary: "Unassign staff"}
      - {method: POST, path: "/clients/{clientId}?command=updateSavingsAccount", summary: "Update default savings"}
      - {method: POST, path: "/clients/{clientId}?command=proposeTransfer", summary: "Propose transfer"}
      - {method: POST, path: "/clients/{clientId}?command=acceptTransfer", summary: "Accept transfer"}
      - {method: POST, path: "/clients/{clientId}?command=rejectTransfer", summary: "Reject transfer"}
      - {method: POST, path: "/clients/{clientId}?command=withdrawTransfer", summary: "Withdraw transfer"}
      - {method: GET, path: "/clients/{clientId}/accounts", summary: "Client accounts (loans + savings)"}
      - {method: GET, path: "/clients/{clientId}/identifiers", summary: "List identifiers"}
      - {method: POST, path: "/clients/{clientId}/identifiers", summary: "Create identifier"}
      - {method: GET, path: "/clients/{clientId}/identifiers/{identifierId}", summary: "Get identifier"}
      - {method: PUT, path: "/clients/{clientId}/identifiers/{identifierId}", summary: "Update identifier"}
      - {method: DELETE, path: "/clients/{clientId}/identifiers/{identifierId}", summary: "Delete identifier"}
      - {method: GET, path: "/clients/{clientId}/documents", summary: "List documents"}
      - {method: POST, path: "/clients/{clientId}/documents", summary: "Upload document"}
      - {method: GET, path: "/clients/{clientId}/documents/{documentId}", summary: "Get document"}
      - {method: PUT, path: "/clients/{clientId}/documents/{documentId}", summary: "Update document"}
      - {method: DELETE, path: "/clients/{clientId}/documents/{documentId}", summary: "Delete document"}
      - {method: GET, path: "/clients/{clientId}/documents/{documentId}/attachment", summary: "Download document"}
      - {method: GET, path: "/clients/{clientId}/charges", summary: "List client charges"}
      - {method: POST, path: "/clients/{clientId}/charges", summary: "Apply charge"}
      - {method: GET, path: "/clients/{clientId}/charges/{chargeId}", summary: "Get charge detail"}
      - {method: DELETE, path: "/clients/{clientId}/charges/{chargeId}", summary: "Delete charge"}
      - {method: POST, path: "/clients/{clientId}/charges/{chargeId}?command=paycharge", summary: "Pay charge"}
      - {method: POST, path: "/clients/{clientId}/charges/{chargeId}?command=waive", summary: "Waive charge"}
      - {method: GET, path: "/clients/{clientId}/transactions", summary: "Client transactions"}
      - {method: GET, path: "/clients/{clientId}/addresses", summary: "Client addresses"}
      - {method: POST, path: "/clients/{clientId}/addresses", summary: "Create address"}
      - {method: GET, path: "/clients/{clientId}/images", summary: "Get client image"}
      - {method: POST, path: "/clients/{clientId}/images", summary: "Upload client image"}
      - {method: DELETE, path: "/clients/{clientId}/images", summary: "Delete client image"}
      - {method: GET, path: "/clients/{clientId}/notes", summary: "List notes"}
      - {method: POST, path: "/clients/{clientId}/notes", summary: "Create note"}

  # ═══════════════════════════════════════════════════════════════
  # GROUPS
  # ═══════════════════════════════════════════════════════════════
  groups:
    base_path: /groups
    description: "Group management — lending groups, JLG, village banking"
    endpoints:
      - {method: GET, path: "/groups", summary: "List groups", params: [officeId, staffId, externalId, name, orderBy, sortOrder, limit, offset]}
      - {method: GET, path: "/groups/template", summary: "Group creation template"}
      - {method: POST, path: "/groups", summary: "Create group", body: [name, officeId, externalId, staffId, active, activationDate, clientMembers]}
      - {method: GET, path: "/groups/{groupId}", summary: "Get group details", params: [associations]}
      - {method: PUT, path: "/groups/{groupId}", summary: "Update group"}
      - {method: DELETE, path: "/groups/{groupId}", summary: "Delete group"}
      - {method: POST, path: "/groups/{groupId}?command=activate", summary: "Activate group"}
      - {method: POST, path: "/groups/{groupId}?command=close", summary: "Close group"}
      - {method: POST, path: "/groups/{groupId}?command=associateClients", summary: "Add members to group"}
      - {method: POST, path: "/groups/{groupId}?command=disassociateClients", summary: "Remove members from group"}
      - {method: POST, path: "/groups/{groupId}?command=transferClients", summary: "Transfer clients between groups"}
      - {method: POST, path: "/groups/{groupId}?command=generateCollectionSheet", summary: "Generate collection sheet"}
      - {method: POST, path: "/groups/{groupId}?command=saveCollectionSheet", summary: "Save collection sheet"}
      - {method: POST, path: "/groups/{groupId}?command=assignStaff", summary: "Assign staff to group"}
      - {method: POST, path: "/groups/{groupId}?command=unassignStaff", summary: "Unassign staff from group"}
      - {method: GET, path: "/groups/{groupId}/accounts", summary: "Group accounts"}
      - {method: GET, path: "/groups/{groupId}/notes", summary: "Group notes"}
      - {method: POST, path: "/groups/{groupId}/notes", summary: "Create group note"}

