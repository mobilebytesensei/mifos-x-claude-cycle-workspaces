      - {method: GET, path: "/loans/{loanId}", summary: "Get loan details"}
      - {method: PUT, path: "/loans/{loanId}", summary: "Update loan application"}
      - {method: DELETE, path: "/loans/{loanId}", summary: "Delete loan application"}
      - {method: POST, path: "/loans/{loanId}?command=approve", summary: "Approve loan"}
      - {method: POST, path: "/loans/{loanId}?command=reject", summary: "Reject loan"}
      - {method: POST, path: "/loans/{loanId}?command=withdraw", summary: "Withdraw application"}
      - {method: POST, path: "/loans/{loanId}?command=disburse", summary: "Disburse loan"}
      - {method: POST, path: "/loans/{loanId}?command=undoapproval", summary: "Undo approval"}
      - {method: POST, path: "/loans/{loanId}?command=undodisbursal", summary: "Undo disbursal"}
      - {method: POST, path: "/loans/{loanId}?command=assignLoanOfficer", summary: "Assign loan officer"}
      - {method: POST, path: "/loans/{loanId}?command=unassignLoanOfficer", summary: "Unassign loan officer"}
      - {method: POST, path: "/loans/{loanId}?command=recoverGuarantees", summary: "Recover guarantees"}
      - {method: GET, path: "/loans/{loanId}/repaymentschedule", summary: "Repayment schedule"}
      - {method: POST, path: "/loans/{loanId}/transactions?command=repayment", summary: "Make repayment"}
      - {method: POST, path: "/loans/{loanId}/transactions?command=waiveinterest", summary: "Waive interest"}
      - {method: POST, path: "/loans/{loanId}/transactions?command=writeoff", summary: "Write off loan"}
      - {method: POST, path: "/loans/{loanId}/transactions?command=close-rescheduled", summary: "Close rescheduled"}
      - {method: POST, path: "/loans/{loanId}/transactions?command=close", summary: "Close loan"}
      - {method: POST, path: "/loans/{loanId}/transactions?command=undotransaction", summary: "Undo transaction"}
      - {method: GET, path: "/loans/{loanId}/transactions", summary: "Loan transaction history"}
      - {method: GET, path: "/loans/{loanId}/transactions/{transactionId}", summary: "Transaction details"}
      - {method: GET, path: "/loans/{loanId}/charges", summary: "Loan charges"}
      - {method: POST, path: "/loans/{loanId}/charges", summary: "Apply charge/fee"}
      - {method: GET, path: "/loans/{loanId}/charges/{chargeId}", summary: "Get charge detail"}
      - {method: PUT, path: "/loans/{loanId}/charges/{chargeId}", summary: "Update charge"}
      - {method: DELETE, path: "/loans/{loanId}/charges/{chargeId}", summary: "Delete charge"}
      - {method: POST, path: "/loans/{loanId}/charges/{chargeId}?command=pay", summary: "Pay charge"}
      - {method: POST, path: "/loans/{loanId}/charges/{chargeId}?command=waive", summary: "Waive charge"}
      - {method: GET, path: "/loans/{loanId}/guarantors", summary: "List guarantors"}
      - {method: POST, path: "/loans/{loanId}/guarantors", summary: "Create guarantor"}
      - {method: GET, path: "/loans/{loanId}/collaterals", summary: "List collaterals"}
      - {method: POST, path: "/loans/{loanId}/collaterals", summary: "Create collateral"}
      - {method: GET, path: "/loans/{loanId}/documents", summary: "Loan documents"}
      - {method: GET, path: "/loans/{loanId}/notes", summary: "Loan notes"}
      - {method: POST, path: "/loans/{loanId}/notes", summary: "Create loan note"}
      - {method: POST, path: "/rescheduleloans", summary: "Create reschedule request"}
      - {method: POST, path: "/rescheduleloans/{scheduleId}?command=approve", summary: "Approve reschedule"}
      - {method: POST, path: "/rescheduleloans/{scheduleId}?command=reject", summary: "Reject reschedule"}

