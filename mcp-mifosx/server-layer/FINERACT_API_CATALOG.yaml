  centers:
    base_path: /centers
    description: "Center management — collection points for groups"
    endpoints:
      - {method: GET, path: "/centers", summary: "List centers"}
      - {method: POST, path: "/centers", summary: "Create center"}
      - {method: GET, path: "/centers/{centerId}", summary: "Get center details"}
      - {method: PUT, path: "/centers/{centerId}", summary: "Update center"}
      - {method: DELETE, path: "/centers/{centerId}", summary: "Delete center"}
      - {method: POST, path: "/centers/{centerId}?command=activate", summary: "Activate center"}
      - {method: POST, path: "/centers/{centerId}?command=close", summary: "Close center"}
      - {method: POST, path: "/centers/{centerId}?command=associateGroups", summary: "Associate groups"}
      - {method: POST, path: "/centers/{centerId}?command=disassociateGroups", summary: "Disassociate groups"}
      - {method: GET, path: "/centers/{centerId}/accounts", summary: "Center accounts"}

