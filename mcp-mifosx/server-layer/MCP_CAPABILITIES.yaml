        mcp_name: mcp__mifos__create_datatable
        operation: create
        params:
          - {name: datatable_name, type: str, required: true}
          - {name: apptable_name, type: str, required: true}
          - {name: columns, type: list, required: true}
        returns: "{resourceId}"
        fineract_api: POST /datatables
        notes: "apptable_name: m_client, m_group, m_loan, m_savings_account, m_office, m_center"

      - name: get_datatable_entries
        mcp_name: mcp__mifos__get_datatable_entries
        operation: read
        params:
          - {name: datatable_name, type: str, required: true}
          - {name: entity_id, type: int, required: true}
        returns: "{entries: [...], count: N}"
        fineract_api: GET /datatables/{datatableName}/{entityId}

      - name: create_datatable_entry
        mcp_name: mcp__mifos__create_datatable_entry
        operation: create
        params:
          - {name: datatable_name, type: str, required: true}
          - {name: entity_id, type: int, required: true}
          - {name: data, type: dict, required: true}
        returns: "{resourceId}"
        fineract_api: POST /datatables/{datatableName}/{entityId}

      - name: update_datatable_entry
        mcp_name: mcp__mifos__update_datatable_entry
        operation: update
        params:
          - {name: datatable_name, type: str, required: true}
          - {name: entity_id, type: int, required: true}
          - {name: data, type: dict, required: true}
        returns: "{resourceId}"
        fineract_api: PUT /datatables/{datatableName}/{entityId}

      - name: delete_datatable_entry
        mcp_name: mcp__mifos__delete_datatable_entry
        operation: delete
        params:
          - {name: datatable_name, type: str, required: true}
          - {name: entity_id, type: int, required: true}
        returns: "{resourceId}"
        fineract_api: DELETE /datatables/{datatableName}/{entityId}

  # ─── SELF-SERVICE (5 tools) — added by bridge-260504-001 ───
  self_service:
    consumer_scope: "all consumers (any KMP app supporting end-user login)"
    notes: "Optional username/password — falls back to env staff creds when omitted."
    tools:
      - name: authenticate
        mcp_name: mcp__mifos__authenticate
        operation: action
        params: [{name: username, type: str, required: true}, {name: password, type: str, required: true}]
        returns: "{base64EncodedAuthenticationKey, authenticated, userId, roles[]}"
        fineract_api: POST /authentication
      - name: self_authenticate
        mcp_name: mcp__mifos__self_authenticate
        operation: action
        params: [{name: username, type: str, required: true}, {name: password, type: str, required: true}]
        returns: "{base64EncodedAuthenticationKey, clientId, displayName}"
        fineract_api: POST /self/authentication
        production_only: true
      - name: get_self_client
        mcp_name: mcp__mifos__get_self_client
        operation: read
        params: [{name: username, type: str, required: false}, {name: password, type: str, required: false}]
        returns: "{clientId, displayName, mobileNo, status, activationDate}"
        fineract_api: GET /self/clients
        production_only: true
      - name: list_self_savings
        mcp_name: mcp__mifos__list_self_savings
        operation: list
        returns: "[{savingsId, accountNo, productName, balance_USD, status}]"
        fineract_api: GET /self/savingsaccounts
        production_only: true
      - name: list_self_loans
        mcp_name: mcp__mifos__list_self_loans
        operation: list
        returns: "[{loanId, accountNo, productName, principal_USD, outstandingBalance_USD, status}]"
        fineract_api: GET /self/loans
        production_only: true

  # ─── BATCH (1 tool) — added by bridge-260504-001 ───
  batch:
    consumer_scope: "all consumers (offline-first apps need this)"
    tools:
      - name: send_batch
        mcp_name: mcp__mifos__send_batch
        operation: action
        params:
          - {name: operations, type: list, required: true}
          - {name: enclosing_transaction, type: bool, required: false, default: false}
        returns: "[{requestId, statusCode, body}]"
        fineract_api: POST /batches
        notes: "Up to 200 ops/request. enclosing_transaction=true → atomic batch."

  # ─── GROUP_BANKING (30 tools, 15 datatables) — added by bridge-260504-001 ───
  group_banking:
    consumer_scope: "mifos-x-group-banking primary; reusable by any VSLA/ROSCA app"
    notes: "30 wrappers over 15 datatables. Single-row tables use upsert via GET-then-PUT/POST; multi-row tables append via POST."
    tools:
      # T2-1 dt_group_config
      - { name: get_group_config,         mcp_name: mcp__mifos__get_group_config,         fineract_api: "GET /datatables/dt_group_config/{centerId}" }
      - { name: upsert_group_config,      mcp_name: mcp__mifos__upsert_group_config,      fineract_api: "POST/PUT /datatables/dt_group_config/{centerId}" }
      - { name: advance_cycle,            mcp_name: mcp__mifos__advance_cycle,            fineract_api: "PUT /datatables/dt_group_config/{centerId}" }
      # T2-2 dt_meeting_record
