      - { name: record_attendance,        mcp_name: mcp__mifos__record_attendance,        fineract_api: "POST /datatables/dt_meeting_attendance/{clientId}" }
      # T2-4 dt_member_role
      - { name: get_member_role,          mcp_name: mcp__mifos__get_member_role,          fineract_api: "GET /datatables/dt_member_role/{clientId}" }
      - { name: assign_member_role,       mcp_name: mcp__mifos__assign_member_role,       fineract_api: "POST/PUT /datatables/dt_member_role/{clientId}" }
      # T2-5 dt_share_out
      - { name: list_share_outs,          mcp_name: mcp__mifos__list_share_outs,          fineract_api: "GET /datatables/dt_share_out/{centerId}" }
      - { name: record_share_out,         mcp_name: mcp__mifos__record_share_out,         fineract_api: "POST /datatables/dt_share_out/{centerId}" }
      # T2-6 dt_social_fund
      - { name: get_social_fund,          mcp_name: mcp__mifos__get_social_fund,          fineract_api: "GET /datatables/dt_social_fund/{centerId}" }
      - { name: update_social_fund,       mcp_name: mcp__mifos__update_social_fund,       fineract_api: "POST/PUT /datatables/dt_social_fund/{centerId}" }
      # T2-7 dt_loan_vote
      - { name: get_loan_vote,            mcp_name: mcp__mifos__get_loan_vote,            fineract_api: "GET /datatables/dt_loan_vote/{loanId}" }
      - { name: record_loan_vote,         mcp_name: mcp__mifos__record_loan_vote,         fineract_api: "POST/PUT /datatables/dt_loan_vote/{loanId}" }
      # T2-8 dt_sync_metadata
      - { name: get_sync_state,           mcp_name: mcp__mifos__get_sync_state,           fineract_api: "GET /datatables/dt_sync_metadata/{centerId}" }
      - { name: update_sync_state,        mcp_name: mcp__mifos__update_sync_state,        fineract_api: "POST/PUT /datatables/dt_sync_metadata/{centerId}" }
      # T2-9 dt_loan_request
      - { name: list_loan_requests,       mcp_name: mcp__mifos__list_loan_requests,       fineract_api: "GET /datatables/dt_loan_request/{clientId}" }
      - { name: submit_loan_request,      mcp_name: mcp__mifos__submit_loan_request,      fineract_api: "POST /datatables/dt_loan_request/{clientId}" }
      # T2-10 dt_group_corpus
      - { name: get_group_corpus,         mcp_name: mcp__mifos__get_group_corpus,         fineract_api: "GET /datatables/dt_group_corpus/{centerId}" }
      - { name: update_group_corpus,      mcp_name: mcp__mifos__update_group_corpus,      fineract_api: "POST/PUT /datatables/dt_group_corpus/{centerId}" }
      # T2-11 dt_group_loan_policy
      - { name: get_loan_policy,          mcp_name: mcp__mifos__get_loan_policy,          fineract_api: "GET /datatables/dt_group_loan_policy/{centerId}" }
      - { name: set_loan_policy,          mcp_name: mcp__mifos__set_loan_policy,          fineract_api: "POST/PUT /datatables/dt_group_loan_policy/{centerId}" }
      # T2-12 dt_member_ceiling_override
      - { name: get_member_ceiling,       mcp_name: mcp__mifos__get_member_ceiling,       fineract_api: "GET /datatables/dt_member_ceiling_override/{clientId}" }
      - { name: set_member_ceiling,       mcp_name: mcp__mifos__set_member_ceiling,       fineract_api: "POST/PUT /datatables/dt_member_ceiling_override/{clientId}" }
      # T2-13 dt_loan_guarantor
      - { name: list_loan_guarantors,     mcp_name: mcp__mifos__list_loan_guarantors,     fineract_api: "GET /datatables/dt_loan_guarantor/{loanId}" }
      - { name: add_loan_guarantor,       mcp_name: mcp__mifos__add_loan_guarantor,       fineract_api: "POST /datatables/dt_loan_guarantor/{loanId}" }
      # T2-14 dt_notification
      - { name: list_notifications,       mcp_name: mcp__mifos__list_notifications,       fineract_api: "GET /datatables/dt_notification/{clientId}" }
      - { name: push_notification,        mcp_name: mcp__mifos__push_notification,        fineract_api: "POST /datatables/dt_notification/{clientId}" }
      # T2-15 dt_member_invitation
      - { name: list_invitations,         mcp_name: mcp__mifos__list_invitations,         fineract_api: "GET /datatables/dt_member_invitation/{clientId}" }
