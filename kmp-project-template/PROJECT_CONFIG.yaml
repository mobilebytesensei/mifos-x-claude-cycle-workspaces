# ═════════════════════════════════════════════════════════════════════════════
# PROJECT_CONFIG.yaml — kmp-project-template (schema v2)
#
# Machine-readable project config for the KMP Multi-Module Project Template —
# production-ready scaffold spanning Android, iOS, Desktop, and Web with
# full CI/CD, MVI architecture, and Store5 offline-first capabilities.
#
# Contract: RULE-PROJECT-CONFIG-001
# Flow:     core/scripts/load-project-config.md
# Reader:   core/scripts/read-project-config.md
# ═════════════════════════════════════════════════════════════════════════════

schema_version: 2

tech_stack: kmp                          # CI_ADAPTER_TABLE lookup key (drives /ci local_runner precedence)

# Template version — semver bump on every `template_version`-bumping epic.
# 2.6.0 marks the fastlane-modernization epic close (deployment/ tree + dual-mode
# secrets pipeline + /release dispatcher consuming DEPLOYMENT_MANIFEST). See
# plan-layer/project-plans/mifos-x/kmp-project-template/active/fastlane-modernization/
# for the full epic. Legacy `fastlane/` + `fastlane-config/` deletion is deferred
# to a follow-up PR (gated on actionhub v2.0.0 tags landing — see SP-14 notes).
template_version: "2.6.0"

project:
  name: kmp-project-template
  display_name: KMP Project Template
  type: kmp
  subtype: template
  status: active
  workspace: mifos-x
  package_name: template                # placeholder — overridden per consumer project
  version: "2026.5.0"                   # CalVer — year.month.patch
  created: 2026-03-27

repository:
  origin: "https://github.com/therajanmaurya/kmp-project-template"   # fork
  upstream: "https://github.com/openMF/kmp-project-template"          # PR target
  default_branch: dev
  fork_workflow: true

tech:
  language: kotlin
  ui_framework: compose-multiplatform
  architecture: mvi
  di: koin
  navigation: compose-navigation
  network: ktor
  database: room-kmp
  datastore: multiplatform-datastore
  ci_cd: github-actions + fastlane

platforms: [android, ios, desktop, web]

modules:
  feature: [home, profile, settings]
  core: [analytics, common, data, database, datastore, designsystem, domain, model, network, ui]
  core_base: [analytics, common, database, designsystem, network, platform, store, ui]
  platform: [cmp-android, cmp-ios, cmp-desktop, cmp-web, cmp-shared, cmp-navigation]

backend:
  provider: none                        # template has no backend — consumers wire their own
  environments:
    local:
      auto_generated: false

design_system:
  theme: material3
  dynamic_color: true
  touch_target_min: "48dp"

layers:
  plan:
    enabled: true
  idea:
    enabled: true
  design-spec:
    enabled: true
  server:
    enabled: true
  client:
    enabled: true
  feature:
    enabled: true
  infrastructure:
    enabled: true
  platform:
    enabled: true
  testing:
    enabled: true
    frameworks: [kotlin-test, turbine, compose-ui-test]
  release:
    enabled: true
    strategy: kmp-fastlane
    platforms:
      android:
        enabled: true
        track: production
        fastlane_lane: deployToPlayStore
      ios_testflight:
        enabled: true
        fastlane_lane: beta
        distribute: testflight
      ios_appstore:
        enabled: false
        fastlane_lane: release
        distribute: appstore

# ─── deployment/ tree (fastlane-modernization epic, sub-plan 06) ────────────
# Schema bump to v3 (with `schema_version: 3`) is deferred to sub-plan 14
# acceptance — see PLAN fastlane-modernization-14-fastlane-legacy-removal.
# Until then, the deployment: block is additive at schema v2 and read by
# /release {platform} {target} commands once they migrate off the legacy
# fastlane/ tree (sub-plans 07-10).
deployment:
  enabled: true
  deployment_dir: "deployment"               # canonical scaffold introduced by SP-06
  fastlane_dir: "fastlane"                   # DEPRECATED — removed in SP-14 (DM-LEGACY gate)
  fastlane_dir_deprecation_note: |
    The legacy fastlane/ tree at project root is read-only until sub-plan
    14 of the fastlane-modernization epic deletes it. Per-target lane
    definitions live under deployment/<platform>/<target>/Fastfile and
    are imported by deployment/Fastfile. See RULE-DEPLOYMENT-MANIFEST-001
    (DM-LEGACY) for enforcement.
  dual_mode_default: manual                  # vault | manual — fallback when target's secrets-needs.yaml omits a row's mode
  manifest: "deployment/DEPLOYMENT_MANIFEST.yaml"
  promotion_log: "deployment/PROMOTION_LOG.yaml"
  shared_scripts_dir: "deployment/_shared/scripts"
  shared_lib_dir: "deployment/_shared/lib"
  secrets_needs_schema: "deployment/_shared/secrets-needs-schema.yaml"
