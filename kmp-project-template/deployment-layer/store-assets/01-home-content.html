<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Asset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <style>
    :root {
      --frame-bg: linear-gradient(160deg, #4C56C0 0%, #232766 100%);
      --overlay-text: #F5F2FF;
      --overlay-eyebrow: #C7CBF2;
      --pill-bg: rgba(255,255,255,0.15);
    }
    html, body { margin: 0; padding: 0; }
    body { display: flex; justify-content: center; align-items: center; background: #000; }
    .frame {
      background: var(--frame-bg);
      color: var(--overlay-text);
      font-family: 'Figtree', -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .frame[data-frame="phone"]           { width: 1080px; height: 1920px; }
    .frame[data-frame="feature-graphic"] { width: 1024px; height:  500px; }
    .frame[data-frame="tablet"]          { width: 2160px; height: 3840px; }
    .overlay { padding: 96px 80px 48px; }
    .overlay .eyebrow {
      font-size: 24px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--overlay-eyebrow); margin-bottom: 14px;
    }
    .overlay .title {
      font-family: 'Instrument Serif', serif;
      font-size: 88px; font-weight: 400; line-height: 1.04;
      margin: 0 0 22px; letter-spacing: -0.016em;
    }
    .overlay .subtitle { font-size: 32px; line-height: 1.35; opacity: 0.92; margin: 0; }
    .overlay .tags { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
    .overlay .tag {
      background: var(--pill-bg); color: var(--overlay-text);
      padding: 8px 20px; border-radius: 9999px; font-size: 20px; font-weight: 500;
    }
    .screen-slot {
      flex: 1; display: flex; justify-content: center; align-items: flex-end;
      padding: 40px 120px 0;
    }
    .screen-slot iframe.primary {
      width: 100%; max-width: 720px; height: 100%;
      border: 0; border-radius: 48px 48px 0 0;
      box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.35);
      background: #fff;
    }
    /* Second iframe is only surfaced by feature-graphic's `duo` variant.
       Phone/tablet frames keep it out of the layout via `display: none`
       so the same template body serves every frame kind. */
    .screen-slot iframe.secondary { display: none; }

    /* `.device` wraps the primary screen. By default it's a passthrough
       (`display: contents`) so the feature-graphic variants keep their
       iframe-border device look unchanged. Phone + tablet PROMOTE it to a
       real device body (clean all-corner bezel) so the app screen sits INSIDE
       a phone/tablet — fitting the frame instead of floating. */
    .device { display: contents; }

    /* PHONE device — bezel body, screen fills it, subtle depth.
       Fix B: symmetric top/bottom padding + reduced height so the device sits
       CENTERED vertically in the slot (not bottom-biased) and the corner radius
       drops to a natural phone read (~11% of width). */
    .frame[data-frame="phone"] .screen-slot { justify-content: center; align-items: center; padding: 24px 150px 24px; }
    .frame[data-frame="phone"] .device {
      display: block; position: relative;
      width: 624px; height: 1240px; box-sizing: border-box;
      background: #0b0b0d; border-radius: 72px; padding: 18px;
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.07),
        0 60px 130px -30px rgba(0, 0, 0, 0.55),
        0 24px 60px -30px rgba(0, 0, 0, 0.5);
    }
    .frame[data-frame="phone"] .device iframe.primary {
      width: 100%; height: 100%; max-width: none;
      border: 0; border-radius: 56px; box-shadow: none; background: #fff; display: block;
    }

    /* ────────────────────────────────────────────────────────────────
       Feature graphic (1024×500, landscape) — FOUR selectable variants.
       All four author at production fidelity: gradient blobs, tilted
       device shadows, tag pills, and serif display type matching the
       polish of the Play Store Exports / Logo Studio references.
       ─────────────────────────────────────────────────────────────── */
    .frame[data-frame="feature-graphic"] { position: relative; }

    /* Variant 1 — hero-right (default, existing layout preserved):
       copy on the left, tilted phone on the right, soft accent glow. */
    .frame[data-frame="feature-graphic"][data-variant="hero-right"] { flex-direction: row; align-items: center; }
    .frame[data-frame="feature-graphic"][data-variant="hero-right"] .overlay { flex: 0 0 56%; padding: 0 20px 0 72px; position: relative; z-index: 2; }
    .frame[data-frame="feature-graphic"][data-variant="hero-right"] .overlay .title { font-size: 58px; margin-bottom: 14px; }
    .frame[data-frame="feature-graphic"][data-variant="hero-right"] .overlay .subtitle { font-size: 23px; }
    .frame[data-frame="feature-graphic"][data-variant="hero-right"] .overlay .tags { margin-top: 18px; }
    .frame[data-frame="feature-graphic"][data-variant="hero-right"] .overlay .tag { font-size: 16px; padding: 6px 16px; }
    .frame[data-frame="feature-graphic"][data-variant="hero-right"] .screen-slot {
      flex: 1; align-items: center; justify-content: center; padding: 0; overflow: hidden;
      position: relative; z-index: 2;
    }
    .frame[data-frame="feature-graphic"][data-variant="hero-right"] .screen-slot iframe.primary {
      width: 300px; height: 600px; max-width: none;
      border-radius: 36px; border: 6px solid rgba(0, 0, 0, 0.4);
      transform: rotate(8deg) translateY(34px);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45);
    }
    .frame[data-frame="feature-graphic"][data-variant="hero-right"]::before {
      content: ""; position: absolute; left: -120px; top: -140px;
      width: 420px; height: 420px; border-radius: 50%;
      background: radial-gradient(circle, var(--overlay-eyebrow) 0%, transparent 70%);
      opacity: 0.28; filter: blur(48px); pointer-events: none; z-index: 1;
    }

    /* Variant 2 — centered (brand-forward, no device):
       eyebrow + large centered serif + subtitle + tags, soft radial glow,
       device intentionally hidden so the wordmark carries the frame. */
    .frame[data-frame="feature-graphic"][data-variant="centered"] { flex-direction: column; align-items: center; justify-content: center; }
    .frame[data-frame="feature-graphic"][data-variant="centered"] .overlay {
      flex: none; padding: 0 80px; text-align: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      max-width: 900px; position: relative; z-index: 2;
    }
    .frame[data-frame="feature-graphic"][data-variant="centered"] .overlay .eyebrow { margin-bottom: 22px; letter-spacing: 0.14em; font-size: 20px; }
    .frame[data-frame="feature-graphic"][data-variant="centered"] .overlay .title { font-size: 76px; margin: 0 0 20px; letter-spacing: -0.024em; line-height: 1.0; }
    .frame[data-frame="feature-graphic"][data-variant="centered"] .overlay .subtitle { font-size: 22px; max-width: 720px; margin: 0 auto; }
    .frame[data-frame="feature-graphic"][data-variant="centered"] .overlay .tags { margin-top: 26px; justify-content: center; }
    .frame[data-frame="feature-graphic"][data-variant="centered"] .overlay .tag { font-size: 15px; padding: 6px 18px; }
    .frame[data-frame="feature-graphic"][data-variant="centered"] .screen-slot { display: none; }
    .frame[data-frame="feature-graphic"][data-variant="centered"]::before {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: 780px; height: 780px; border-radius: 50%;
      background: radial-gradient(circle, var(--overlay-eyebrow) 0%, transparent 65%);
      opacity: 0.22; filter: blur(60px); pointer-events: none;
      transform: translate(-50%, -50%); z-index: 1;
    }
    .frame[data-frame="feature-graphic"][data-variant="centered"]::after {
      content: ""; position: absolute; right: -160px; bottom: -160px;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, transparent 70%);
      opacity: 0.14; filter: blur(50px); pointer-events: none; z-index: 1;
    }

    /* Variant 3 — showcase (device is the star):
       straightened, LARGER phone on the right that bleeds off the top
       and bottom edges via oversized height + overflow:hidden on frame;
       copy left tight; strong accent glow behind the phone. */
    .frame[data-frame="feature-graphic"][data-variant="showcase"] { flex-direction: row; align-items: center; }
    .frame[data-frame="feature-graphic"][data-variant="showcase"] .overlay { flex: 0 0 50%; padding: 0 20px 0 68px; position: relative; z-index: 2; }
    .frame[data-frame="feature-graphic"][data-variant="showcase"] .overlay .eyebrow { font-size: 18px; letter-spacing: 0.12em; margin-bottom: 12px; }
    .frame[data-frame="feature-graphic"][data-variant="showcase"] .overlay .title { font-size: 62px; line-height: 0.98; margin: 0 0 14px; letter-spacing: -0.024em; }
    .frame[data-frame="feature-graphic"][data-variant="showcase"] .overlay .subtitle { font-size: 22px; max-width: 420px; margin: 0; }
    .frame[data-frame="feature-graphic"][data-variant="showcase"] .overlay .tags { margin-top: 18px; }
    .frame[data-frame="feature-graphic"][data-variant="showcase"] .overlay .tag { font-size: 15px; padding: 6px 16px; }
    .frame[data-frame="feature-graphic"][data-variant="showcase"] .screen-slot {
      flex: 1; display: flex; align-items: center; justify-content: flex-end;
      padding: 0 44px 0 0; position: relative; z-index: 2;
    }
    .frame[data-frame="feature-graphic"][data-variant="showcase"] .screen-slot iframe.primary {
      width: 340px; height: 640px; max-width: none;
      border-radius: 42px; border: 8px solid #0a0a0a;
      transform: translateY(0);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.06),
        0 60px 120px -30px rgba(0, 0, 0, 0.6),
        0 30px 60px -20px rgba(0, 0, 0, 0.45);
    }
    .frame[data-frame="feature-graphic"][data-variant="showcase"]::before {
      content: ""; position: absolute; right: -160px; top: -180px;
      width: 520px; height: 520px; border-radius: 50%;
      background: radial-gradient(circle, var(--overlay-eyebrow) 0%, transparent 65%);
      opacity: 0.3; filter: blur(60px); pointer-events: none; z-index: 1;
    }
    .frame[data-frame="feature-graphic"][data-variant="showcase"]::after {
      content: ""; position: absolute; left: -160px; bottom: -180px;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 70%);
      opacity: 0.14; filter: blur(50px); pointer-events: none; z-index: 1;
    }

    /* Variant 4 — duo (two phones fanned):
       copy on the left; primary phone rotated +6°, secondary phone rotated
       -10° and offset left, both bearing the same srcdoc so the wallpaper
       and app content match — evokes a real "family of screens" hero shot. */
    .frame[data-frame="feature-graphic"][data-variant="duo"] { flex-direction: row; align-items: center; }
    .frame[data-frame="feature-graphic"][data-variant="duo"] .overlay { flex: 0 0 50%; padding: 0 20px 0 68px; position: relative; z-index: 2; }
    .frame[data-frame="feature-graphic"][data-variant="duo"] .overlay .eyebrow { font-size: 18px; letter-spacing: 0.12em; margin-bottom: 12px; }
    .frame[data-frame="feature-graphic"][data-variant="duo"] .overlay .title { font-size: 56px; line-height: 1.02; margin: 0 0 14px; letter-spacing: -0.02em; }
    .frame[data-frame="feature-graphic"][data-variant="duo"] .overlay .subtitle { font-size: 22px; max-width: 420px; margin: 0; }
    .frame[data-frame="feature-graphic"][data-variant="duo"] .overlay .tags { margin-top: 18px; }
    .frame[data-frame="feature-graphic"][data-variant="duo"] .overlay .tag { font-size: 15px; padding: 6px 16px; }
    .frame[data-frame="feature-graphic"][data-variant="duo"] .screen-slot {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 0; position: relative; z-index: 2;
    }
    .frame[data-frame="feature-graphic"][data-variant="duo"] .screen-slot iframe.primary {
      width: 280px; height: 560px; max-width: none;
      border-radius: 34px; border: 6px solid #0a0a0a;
      transform: rotate(6deg) translate(28px, 22px);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.08),
        0 40px 100px -20px rgba(0, 0, 0, 0.6);
      position: relative; z-index: 3;
    }
    /* Duo REVEALS the secondary iframe (overrides the base display:none). */
    .frame[data-frame="feature-graphic"][data-variant="duo"] .screen-slot iframe.secondary {
      display: block;
      width: 260px; height: 520px; max-width: none;
      border-radius: 32px; border: 6px solid #0a0a0a;
      transform: rotate(-10deg) translate(-70px, -4px);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.06),
        0 30px 80px -20px rgba(0, 0, 0, 0.55);
      position: absolute; z-index: 2;
      opacity: 0.9;
    }
    .frame[data-frame="feature-graphic"][data-variant="duo"]::before {
      content: ""; position: absolute; right: -120px; top: -140px;
      width: 460px; height: 460px; border-radius: 50%;
      background: radial-gradient(circle, var(--overlay-eyebrow) 0%, transparent 65%);
      opacity: 0.28; filter: blur(55px); pointer-events: none; z-index: 1;
    }
    .frame[data-frame="feature-graphic"][data-variant="duo"]::after {
      content: ""; position: absolute; left: -120px; bottom: -140px;
      width: 380px; height: 380px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 70%);
      opacity: 0.14; filter: blur(50px); pointer-events: none; z-index: 1;
    }

    /* Tablet (2160×3840): overlay + a real, large tablet device — NOT a 2× phone.
       Wider screen area (max 1500px vs phone's 720px), full four-corner bezel,
       and overlay type scaled up so it reads at tablet resolution. */
    .frame[data-frame="tablet"] .overlay { padding: 168px 150px 64px; }
    .frame[data-frame="tablet"] .overlay .eyebrow { font-size: 46px; margin-bottom: 28px; }
    .frame[data-frame="tablet"] .overlay .title { font-size: 156px; line-height: 1.02; margin-bottom: 44px; }
    .frame[data-frame="tablet"] .overlay .subtitle { font-size: 60px; line-height: 1.3; }
    .frame[data-frame="tablet"] .overlay .tags { margin-top: 52px; gap: 22px; }
    .frame[data-frame="tablet"] .overlay .tag { font-size: 38px; padding: 16px 38px; }
    /* Fix C: healld is a phone-only app. To make the tablet frame FILL like
       the phone does (rather than showing a stretched or letterboxed layout),
       we render the app iframe at PHONE inner-px (588×1204 — mirrors the
       phone's post-Fix-B inner box exactly) then `transform: scale(2)` from
       the top-left. The scaled iframe is 1176×2408, which lands inside the
       tablet device's inner box (1248 − 2·36 = 1176 wide, 2480 − 2·36 = 2408
       tall) with zero gap — content density matches the phone 1:1. */
    .frame[data-frame="tablet"] .screen-slot { justify-content: center; align-items: center; padding: 40px 250px 40px; }
    .frame[data-frame="tablet"] .device {
      display: block; position: relative;
      width: 1248px; height: 2480px; box-sizing: border-box;
      background: #0b0b0d; border-radius: 144px; padding: 36px;
      overflow: hidden;
      box-shadow:
        inset 0 0 0 3px rgba(255, 255, 255, 0.06),
        0 90px 180px -40px rgba(0, 0, 0, 0.5);
    }
    .frame[data-frame="tablet"] .device iframe.primary {
      width: 588px; height: 1204px; max-width: none;
      transform: scale(2); transform-origin: top left;
      border: 0; border-radius: 56px; box-shadow: none; background: #fff; display: block;
    }
  </style>
</head>

  --el-3: 0 8px 20px rgba(0,0,0,0.60); --el-4: 0 12px 28px rgba(0,0,0,0.66);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
.mono { font-family: var(--font-mono); font-feature-settings: &quot;tnum&quot; 1; }

/* Top app bar */
header[data-shell=&quot;top-app-bar&quot;] { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); color: var(--on-surface); border-bottom: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-2); }
header[data-shell=&quot;top-app-bar&quot;] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; font-family: var(--font-display); }
header[data-shell=&quot;top-app-bar&quot;] .bar-trailing { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell=&quot;top-app-bar&quot;] .bar-trailing:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

main[data-shell=&quot;content&quot;] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px) + var(--sp-md)); overflow-y: auto; overflow-x: hidden; }

/* Hero card */
.hero-card { position: relative; display: flex; flex-direction: column; gap: var(--sp-sm); padding: var(--sp-lg); border-radius: var(--r-lg); background: linear-gradient(135deg, var(--primary), color-mix(in oklch, var(--primary) 55%, var(--tertiary))); color: var(--on-primary); box-shadow: var(--el-2); overflow: hidden; }
.hero-card::after { content: &quot;&quot;; position: absolute; top: -40%; right: -20%; width: 60%; aspect-ratio: 1/1; border-radius: var(--r-full); background: color-mix(in oklch, var(--on-primary) 10%, transparent); pointer-events: none; }
.hero-card .hero-label { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: color-mix(in oklch, var(--on-primary) 85%, transparent); margin: 0; }
.hero-card .hero-amount { font-family: var(--font-mono); font-size: var(--fs-display-sm); font-weight: var(--fw-bold); letter-spacing: -0.5px; margin: 0; line-height: var(--lh-tight); }
.hero-card .hero-sub { font-size: var(--fs-body-sm); color: color-mix(in oklch, var(--on-primary) 90%, transparent); margin: 0; }
.hero-stat-row { display: flex; gap: var(--sp-xl); margin-top: var(--sp-sm); position: relative; z-index: 1; }
.hero-stat { display: flex; flex-direction: column; gap: 2px; }
.hero-stat .k { font-size: var(--fs-caption); color: color-mix(in oklch, var(--on-primary) 80%, transparent); text-transform: uppercase; letter-spacing: var(--ls-caption); }
.hero-stat .v { font-family: var(--font-mono); font-size: var(--fs-title); font-weight: var(--fw-semibold); }

/* Section header */
.section-header { display: flex; flex-direction: column; gap: 2px; margin-top: var(--sp-xs); }
.section-header h2 { font-size: var(--fs-title); font-weight: var(--fw-semibold); font-family: var(--font-display); color: var(--on-surface); margin: 0; }
.section-header .subtitle { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.section-title-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); }
.section-title-row .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

/* Loans carousel */
.carousel { display: flex; gap: var(--sp-sm); overflow-x: auto; padding: var(--sp-xxs) 2px var(--sp-sm) 2px; margin: 0 calc(-1 * var(--sp-md)); padding-left: var(--sp-md); padding-right: var(--sp-md); scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.loan-tile { flex: 0 0 auto; width: 240px; scroll-snap-align: start; display: flex; flex-direction: column; gap: var(--sp-xs); padding: var(--sp-md); border-radius: var(--r-md); background: var(--surface); border: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-1); cursor: pointer; text-align: left; font-family: inherit; color: inherit; }
.loan-tile .lt-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-xs); }
.loan-tile .lt-name { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); }
.loan-tile .lt-kind { display: inline-flex; align-items: center; padding: 2px var(--sp-sm); border-radius: var(--r-full); font-size: var(--fs-caption-sm); font-weight: var(--fw-semibold); letter-spacing: var(--ls-caption); text-transform: uppercase; flex: 0 0 auto; }
.loan-tile .lt-kind.k-mortgage { background: var(--secondary-container); color: var(--on-secondary-container); }
.loan-tile .lt-kind.k-auto { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.loan-tile .lt-kind.k-personal { background: var(--primary-container); color: var(--on-primary-container); }
.loan-tile .lt-remaining-label { font-size: var(--fs-caption-sm); color: var(--on-surface-variant); }
.loan-tile .lt-remaining { font-family: var(--font-mono); font-size: var(--fs-title-sm); font-weight: var(--fw-semibold); color: var(--error); }
.progress-track { position: relative; width: 100%; height: 6px; border-radius: var(--r-full); background: var(--surface-container-high); overflow: hidden; }
.progress-track .fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: var(--r-full); }
.progress-track .fill.p-mortgage { background: var(--secondary); }
.progress-track .fill.p-auto { background: var(--tertiary); }
.progress-track .fill.p-personal { background: var(--primary); }
.loan-tile .lt-footer { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.loan-tile .lt-footer .mono { font-family: var(--font-mono); }
.loan-tile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* App cards (source cards) */
.app-card { display: flex; flex-direction: column; gap: var(--sp-sm); padding: var(--sp-md); border-radius: var(--r-md); background: var(--surface); border: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-1); }
.app-card .ac-head { display: flex; align-items: center; gap: var(--sp-sm); }
.app-card .ac-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; aspect-ratio: 1/1; border-radius: var(--r-md); background: var(--primary-container); color: var(--on-primary-container); }
.app-card .ac-icon .material-symbols-outlined { font-size: 20px; }
.app-card .ac-title { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); flex: 1; }
.freshness-indicator { display: inline-flex; align-items: center; gap: 2px; font-size: var(--fs-caption-sm); color: var(--on-surface-variant); background: none; border: none; cursor: pointer; padding: var(--sp-xxs) var(--sp-xs); border-radius: var(--r-full); font-family: inherit; }
.freshness-indicator .material-symbols-outlined { font-size: 16px; }
.freshness-indicator:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ac-total-line { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: var(--sp-xxs); border-bottom: var(--border-w) solid var(--outline-variant); }
.ac-total-line .lbl { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.ac-total-line .val { font-family: var(--font-mono); font-size: var(--fs-title-sm); font-weight: var(--fw-semibold); color: var(--error); }

/* Bill rows */
.bill-row { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-xs) 0; }
.urgency-dot { flex: 0 0 auto; width: 8px; height: 8px; aspect-ratio: 1/1; border-radius: var(--r-full); background: var(--warning-strong); }
.bill-row .b-name { flex: 1; min-width: 0; font-size: var(--fs-body-sm); color: var(--on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bill-row .b-day { font-size: var(--fs-caption); color: var(--on-surface-variant); flex: 0 0 auto; }
.bill-row .b-amount { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--error); flex: 0 0 auto; }

/* Rate rows */
.rate-row { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-xxs) 0; }
.rate-row .r-label { font-size: var(--fs-body-sm); color: var(--on-surface); display: inline-flex; align-items: center; gap: var(--sp-xs); }
.rate-row .r-value { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); display: inline-flex; align-items: center; gap: var(--sp-xxs); }
.rate-row .r-value .material-symbols-outlined { font-size: 16px; }
.rate-row .r-value.dir-up .material-symbols-outlined { color: var(--error); }
.rate-row .r-value.dir-flat .material-symbols-outlined { color: var(--on-surface-variant); }

/* Exchange rate pair rows */
.rate-pair-row { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-xxs) 0; }
.rate-pair-row .pair-label { font-size: var(--fs-body-sm); color: var(--on-surface); display: inline-flex; align-items: center; gap: var(--sp-xxs); }
.rate-pair-row .pair-label .material-symbols-outlined { font-size: 16px; color: var(--on-surface-variant); }
.rate-pair-row .pair-value { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); }

/* See-all link */
.see-all { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; margin-top: var(--sp-xs); background: none; border: none; padding: 0; font-family: inherit; font-size: var(--fs-label-sm); font-weight: var(--fw-semibold); color: var(--primary); cursor: pointer; }
.see-all .material-symbols-outlined { font-size: 16px; }
.see-all:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-xs); }

/* Tools grid */
.tools-grid { display: flex; flex-direction: column; gap: var(--sp-xs); }
.feature-row { display: flex; align-items: center; gap: var(--sp-md); width: 100%; min-height: 56px; padding: var(--sp-sm) var(--sp-md); border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-md); background: var(--surface); color: var(--on-surface); cursor: pointer; text-align: left; font-family: inherit; box-shadow: var(--el-1); }
.feature-row .fr-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; aspect-ratio: 1/1; border-radius: var(--r-md); background: var(--surface-container-high); color: var(--primary); }
.feature-row .fr-icon .material-symbols-outlined { font-size: 20px; }
.feature-row .fr-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.feature-row .fr-title { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--on-surface); }
.feature-row .fr-subtitle { font-size: var(--fs-caption); color: var(--on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feature-row .fr-chevron { color: var(--on-surface-variant); flex: 0 0 auto; }
.feature-row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .loan-tile, .feature-row, .see-all, .freshness-indicator, .bar-trailing { transition: filter 120ms ease, box-shadow 120ms ease; }
  .loan-tile:active, .feature-row:active { filter: brightness(0.97); }
}

/* Bottom nav */
nav[data-shell=&quot;bottom-nav&quot;] { position: sticky; bottom: 0; margin-top: auto; z-index: 18; display: flex; background: var(--surface); border-top: var(--border-w) solid var(--outline-variant); padding-bottom: env(safe-area-inset-bottom, 0); box-shadow: var(--el-2); }

.mono { font-family: var(--font-mono); font-feature-settings: &quot;tnum&quot; 1; }

/* Top app bar */
header[data-shell=&quot;top-app-bar&quot;] { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); color: var(--on-surface); border-bottom: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-2); }
header[data-shell=&quot;top-app-bar&quot;] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; font-family: var(--font-display); }
header[data-shell=&quot;top-app-bar&quot;] .bar-trailing { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell=&quot;top-app-bar&quot;] .bar-trailing:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

main[data-shell=&quot;content&quot;] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px) + var(--sp-md)); overflow-y: auto; overflow-x: hidden; }

/* Hero card */
.hero-card { position: relative; display: flex; flex-direction: column; gap: var(--sp-sm); padding: var(--sp-lg); border-radius: var(--r-lg); background: linear-gradient(135deg, var(--primary), color-mix(in oklch, var(--primary) 55%, var(--tertiary))); color: var(--on-primary); box-shadow: var(--el-2); overflow: hidden; }
.hero-card::after { content: &quot;&quot;; position: absolute; top: -40%; right: -20%; width: 60%; aspect-ratio: 1/1; border-radius: var(--r-full); background: color-mix(in oklch, var(--on-primary) 10%, transparent); pointer-events: none; }
.hero-card .hero-label { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: color-mix(in oklch, var(--on-primary) 85%, transparent); margin: 0; }
.hero-card .hero-amount { font-family: var(--font-mono); font-size: var(--fs-display-sm); font-weight: var(--fw-bold); letter-spacing: -0.5px; margin: 0; line-height: var(--lh-tight); }
.hero-card .hero-sub { font-size: var(--fs-body-sm); color: color-mix(in oklch, var(--on-primary) 90%, transparent); margin: 0; }
.hero-stat-row { display: flex; gap: var(--sp-xl); margin-top: var(--sp-sm); position: relative; z-index: 1; }
.hero-stat { display: flex; flex-direction: column; gap: 2px; }
.hero-stat .k { font-size: var(--fs-caption); color: color-mix(in oklch, var(--on-primary) 80%, transparent); text-transform: uppercase; letter-spacing: var(--ls-caption); }
.hero-stat .v { font-family: var(--font-mono); font-size: var(--fs-title); font-weight: var(--fw-semibold); }

/* Section header */
.section-header { display: flex; flex-direction: column; gap: 2px; margin-top: var(--sp-xs); }
.section-header h2 { font-size: var(--fs-title); font-weight: var(--fw-semibold); font-family: var(--font-display); color: var(--on-surface); margin: 0; }
.section-header .subtitle { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.section-title-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); }
.section-title-row .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

/* Loans carousel */
.carousel { display: flex; gap: var(--sp-sm); overflow-x: auto; padding: var(--sp-xxs) 2px var(--sp-sm) 2px; margin: 0 calc(-1 * var(--sp-md)); padding-left: var(--sp-md); padding-right: var(--sp-md); scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.loan-tile { flex: 0 0 auto; width: 240px; scroll-snap-align: start; display: flex; flex-direction: column; gap: var(--sp-xs); padding: var(--sp-md); border-radius: var(--r-md); background: var(--surface); border: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-1); cursor: pointer; text-align: left; font-family: inherit; color: inherit; }
.loan-tile .lt-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-xs); }
.loan-tile .lt-name { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); }
.loan-tile .lt-kind { display: inline-flex; align-items: center; padding: 2px var(--sp-sm); border-radius: var(--r-full); font-size: var(--fs-caption-sm); font-weight: var(--fw-semibold); letter-spacing: var(--ls-caption); text-transform: uppercase; flex: 0 0 auto; }
.loan-tile .lt-kind.k-mortgage { background: var(--secondary-container); color: var(--on-secondary-container); }
.loan-tile .lt-kind.k-auto { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.loan-tile .lt-kind.k-personal { background: var(--primary-container); color: var(--on-primary-container); }
.loan-tile .lt-remaining-label { font-size: var(--fs-caption-sm); color: var(--on-surface-variant); }
.loan-tile .lt-remaining { font-family: var(--font-mono); font-size: var(--fs-title-sm); font-weight: var(--fw-semibold); color: var(--error); }
.progress-track { position: relative; width: 100%; height: 6px; border-radius: var(--r-full); background: var(--surface-container-high); overflow: hidden; }
.progress-track .fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: var(--r-full); }
.progress-track .fill.p-mortgage { background: var(--secondary); }
.progress-track .fill.p-auto { background: var(--tertiary); }
.progress-track .fill.p-personal { background: var(--primary); }
.loan-tile .lt-footer { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.loan-tile .lt-footer .mono { font-family: var(--font-mono); }
.loan-tile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* App cards (source cards) */
.app-card { display: flex; flex-direction: column; gap: var(--sp-sm); padding: var(--sp-md); border-radius: var(--r-md); background: var(--surface); border: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-1); }
.app-card .ac-head { display: flex; align-items: center; gap: var(--sp-sm); }
.app-card .ac-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; aspect-ratio: 1/1; border-radius: var(--r-md); background: var(--primary-container); color: var(--on-primary-container); }
.app-card .ac-icon .material-symbols-outlined { font-size: 20px; }
.app-card .ac-title { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); flex: 1; }
.freshness-indicator { display: inline-flex; align-items: center; gap: 2px; font-size: var(--fs-caption-sm); color: var(--on-surface-variant); background: none; border: none; cursor: pointer; padding: var(--sp-xxs) var(--sp-xs); border-radius: var(--r-full); font-family: inherit; }
.freshness-indicator .material-symbols-outlined { font-size: 16px; }
.freshness-indicator:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ac-total-line { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: var(--sp-xxs); border-bottom: var(--border-w) solid var(--outline-variant); }
.ac-total-line .lbl { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.ac-total-line .val { font-family: var(--font-mono); font-size: var(--fs-title-sm); font-weight: var(--fw-semibold); color: var(--error); }

/* Bill rows */
.bill-row { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-xs) 0; }
.urgency-dot { flex: 0 0 auto; width: 8px; height: 8px; aspect-ratio: 1/1; border-radius: var(--r-full); background: var(--warning-strong); }
.bill-row .b-name { flex: 1; min-width: 0; font-size: var(--fs-body-sm); color: var(--on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bill-row .b-day { font-size: var(--fs-caption); color: var(--on-surface-variant); flex: 0 0 auto; }
.bill-row .b-amount { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--error); flex: 0 0 auto; }

/* Rate rows */
.rate-row { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-xxs) 0; }
.rate-row .r-label { font-size: var(--fs-body-sm); color: var(--on-surface); display: inline-flex; align-items: center; gap: var(--sp-xs); }
.rate-row .r-value { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); display: inline-flex; align-items: center; gap: var(--sp-xxs); }
.rate-row .r-value .material-symbols-outlined { font-size: 16px; }
.rate-row .r-value.dir-up .material-symbols-outlined { color: var(--error); }
.rate-row .r-value.dir-flat .material-symbols-outlined { color: var(--on-surface-variant); }

/* Exchange rate pair rows */
.rate-pair-row { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-xxs) 0; }
.rate-pair-row .pair-label { font-size: var(--fs-body-sm); color: var(--on-surface); display: inline-flex; align-items: center; gap: var(--sp-xxs); }
.rate-pair-row .pair-label .material-symbols-outlined { font-size: 16px; color: var(--on-surface-variant); }
.rate-pair-row .pair-value { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); }

/* See-all link */
.see-all { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; margin-top: var(--sp-xs); background: none; border: none; padding: 0; font-family: inherit; font-size: var(--fs-label-sm); font-weight: var(--fw-semibold); color: var(--primary); cursor: pointer; }
.see-all .material-symbols-outlined { font-size: 16px; }
.see-all:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-xs); }

/* Tools grid */
.tools-grid { display: flex; flex-direction: column; gap: var(--sp-xs); }
.feature-row { display: flex; align-items: center; gap: var(--sp-md); width: 100%; min-height: 56px; padding: var(--sp-sm) var(--sp-md); border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-md); background: var(--surface); color: var(--on-surface); cursor: pointer; text-align: left; font-family: inherit; box-shadow: var(--el-1); }
.feature-row .fr-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; aspect-ratio: 1/1; border-radius: var(--r-md); background: var(--surface-container-high); color: var(--primary); }
.feature-row .fr-icon .material-symbols-outlined { font-size: 20px; }
.feature-row .fr-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.feature-row .fr-title { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--on-surface); }
.feature-row .fr-subtitle { font-size: var(--fs-caption); color: var(--on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feature-row .fr-chevron { color: var(--on-surface-variant); flex: 0 0 auto; }
.feature-row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .loan-tile, .feature-row, .see-all, .freshness-indicator, .bar-trailing { transition: filter 120ms ease, box-shadow 120ms ease; }
  .loan-tile:active, .feature-row:active { filter: brightness(0.97); }
}

/* Bottom nav */
nav[data-shell=&quot;bottom-nav&quot;] { position: sticky; bottom: 0; margin-top: auto; z-index: 18; display: flex; background: var(--surface); border-top: var(--border-w) solid var(--outline-variant); padding-bottom: env(safe-area-inset-bottom, 0); box-shadow: var(--el-2); }

header[data-shell=&quot;top-app-bar&quot;] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; font-family: var(--font-display); }
header[data-shell=&quot;top-app-bar&quot;] .bar-trailing { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell=&quot;top-app-bar&quot;] .bar-trailing:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

main[data-shell=&quot;content&quot;] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px) + var(--sp-md)); overflow-y: auto; overflow-x: hidden; }

/* Hero card */
.hero-card { position: relative; display: flex; flex-direction: column; gap: var(--sp-sm); padding: var(--sp-lg); border-radius: var(--r-lg); background: linear-gradient(135deg, var(--primary), color-mix(in oklch, var(--primary) 55%, var(--tertiary))); color: var(--on-primary); box-shadow: var(--el-2); overflow: hidden; }
.hero-card::after { content: &quot;&quot;; position: absolute; top: -40%; right: -20%; width: 60%; aspect-ratio: 1/1; border-radius: var(--r-full); background: color-mix(in oklch, var(--on-primary) 10%, transparent); pointer-events: none; }
.hero-card .hero-label { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: color-mix(in oklch, var(--on-primary) 85%, transparent); margin: 0; }
.hero-card .hero-amount { font-family: var(--font-mono); font-size: var(--fs-display-sm); font-weight: var(--fw-bold); letter-spacing: -0.5px; margin: 0; line-height: var(--lh-tight); }
.hero-card .hero-sub { font-size: var(--fs-body-sm); color: color-mix(in oklch, var(--on-primary) 90%, transparent); margin: 0; }
.hero-stat-row { display: flex; gap: var(--sp-xl); margin-top: var(--sp-sm); position: relative; z-index: 1; }
.hero-stat { display: flex; flex-direction: column; gap: 2px; }
.hero-stat .k { font-size: var(--fs-caption); color: color-mix(in oklch, var(--on-primary) 80%, transparent); text-transform: uppercase; letter-spacing: var(--ls-caption); }
.hero-stat .v { font-family: var(--font-mono); font-size: var(--fs-title); font-weight: var(--fw-semibold); }

/* Section header */
.section-header { display: flex; flex-direction: column; gap: 2px; margin-top: var(--sp-xs); }
.section-header h2 { font-size: var(--fs-title); font-weight: var(--fw-semibold); font-family: var(--font-display); color: var(--on-surface); margin: 0; }
.section-header .subtitle { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.section-title-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); }
.section-title-row .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

/* Loans carousel */
.carousel { display: flex; gap: var(--sp-sm); overflow-x: auto; padding: var(--sp-xxs) 2px var(--sp-sm) 2px; margin: 0 calc(-1 * var(--sp-md)); padding-left: var(--sp-md); padding-right: var(--sp-md); scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.loan-tile { flex: 0 0 auto; width: 240px; scroll-snap-align: start; display: flex; flex-direction: column; gap: var(--sp-xs); padding: var(--sp-md); border-radius: var(--r-md); background: var(--surface); border: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-1); cursor: pointer; text-align: left; font-family: inherit; color: inherit; }
.loan-tile .lt-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-xs); }
.loan-tile .lt-name { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); }
.loan-tile .lt-kind { display: inline-flex; align-items: center; padding: 2px var(--sp-sm); border-radius: var(--r-full); font-size: var(--fs-caption-sm); font-weight: var(--fw-semibold); letter-spacing: var(--ls-caption); text-transform: uppercase; flex: 0 0 auto; }
.loan-tile .lt-kind.k-mortgage { background: var(--secondary-container); color: var(--on-secondary-container); }
.loan-tile .lt-kind.k-auto { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.loan-tile .lt-kind.k-personal { background: var(--primary-container); color: var(--on-primary-container); }
.loan-tile .lt-remaining-label { font-size: var(--fs-caption-sm); color: var(--on-surface-variant); }
.loan-tile .lt-remaining { font-family: var(--font-mono); font-size: var(--fs-title-sm); font-weight: var(--fw-semibold); color: var(--error); }
.progress-track { position: relative; width: 100%; height: 6px; border-radius: var(--r-full); background: var(--surface-container-high); overflow: hidden; }
.progress-track .fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: var(--r-full); }
.progress-track .fill.p-mortgage { background: var(--secondary); }
.progress-track .fill.p-auto { background: var(--tertiary); }
.progress-track .fill.p-personal { background: var(--primary); }
.loan-tile .lt-footer { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.loan-tile .lt-footer .mono { font-family: var(--font-mono); }
.loan-tile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* App cards (source cards) */
.app-card { display: flex; flex-direction: column; gap: var(--sp-sm); padding: var(--sp-md); border-radius: var(--r-md); background: var(--surface); border: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-1); }
.app-card .ac-head { display: flex; align-items: center; gap: var(--sp-sm); }
.app-card .ac-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; aspect-ratio: 1/1; border-radius: var(--r-md); background: var(--primary-container); color: var(--on-primary-container); }
.app-card .ac-icon .material-symbols-outlined { font-size: 20px; }
.app-card .ac-title { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); flex: 1; }
.freshness-indicator { display: inline-flex; align-items: center; gap: 2px; font-size: var(--fs-caption-sm); color: var(--on-surface-variant); background: none; border: none; cursor: pointer; padding: var(--sp-xxs) var(--sp-xs); border-radius: var(--r-full); font-family: inherit; }
.freshness-indicator .material-symbols-outlined { font-size: 16px; }
.freshness-indicator:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ac-total-line { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: var(--sp-xxs); border-bottom: var(--border-w) solid var(--outline-variant); }
.ac-total-line .lbl { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.ac-total-line .val { font-family: var(--font-mono); font-size: var(--fs-title-sm); font-weight: var(--fw-semibold); color: var(--error); }

/* Bill rows */
.bill-row { display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-xs) 0; }
.urgency-dot { flex: 0 0 auto; width: 8px; height: 8px; aspect-ratio: 1/1; border-radius: var(--r-full); background: var(--warning-strong); }
.bill-row .b-name { flex: 1; min-width: 0; font-size: var(--fs-body-sm); color: var(--on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bill-row .b-day { font-size: var(--fs-caption); color: var(--on-surface-variant); flex: 0 0 auto; }
.bill-row .b-amount { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--error); flex: 0 0 auto; }

/* Rate rows */
.rate-row { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-xxs) 0; }
.rate-row .r-label { font-size: var(--fs-body-sm); color: var(--on-surface); display: inline-flex; align-items: center; gap: var(--sp-xs); }
.rate-row .r-value { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); display: inline-flex; align-items: center; gap: var(--sp-xxs); }
.rate-row .r-value .material-symbols-outlined { font-size: 16px; }
.rate-row .r-value.dir-up .material-symbols-outlined { color: var(--error); }
.rate-row .r-value.dir-flat .material-symbols-outlined { color: var(--on-surface-variant); }

/* Exchange rate pair rows */
.rate-pair-row { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-xxs) 0; }
.rate-pair-row .pair-label { font-size: var(--fs-body-sm); color: var(--on-surface); display: inline-flex; align-items: center; gap: var(--sp-xxs); }
.rate-pair-row .pair-label .material-symbols-outlined { font-size: 16px; color: var(--on-surface-variant); }
.rate-pair-row .pair-value { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); }

/* See-all link */
.see-all { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; margin-top: var(--sp-xs); background: none; border: none; padding: 0; font-family: inherit; font-size: var(--fs-label-sm); font-weight: var(--fw-semibold); color: var(--primary); cursor: pointer; }
.see-all .material-symbols-outlined { font-size: 16px; }
.see-all:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-xs); }

/* Tools grid */
.tools-grid { display: flex; flex-direction: column; gap: var(--sp-xs); }
.feature-row { display: flex; align-items: center; gap: var(--sp-md); width: 100%; min-height: 56px; padding: var(--sp-sm) var(--sp-md); border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-md); background: var(--surface); color: var(--on-surface); cursor: pointer; text-align: left; font-family: inherit; box-shadow: var(--el-1); }
.feature-row .fr-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; aspect-ratio: 1/1; border-radius: var(--r-md); background: var(--surface-container-high); color: var(--primary); }
.feature-row .fr-icon .material-symbols-outlined { font-size: 20px; }
.feature-row .fr-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.feature-row .fr-title { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: var(--on-surface); }
.feature-row .fr-subtitle { font-size: var(--fs-caption); color: var(--on-surface-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feature-row .fr-chevron { color: var(--on-surface-variant); flex: 0 0 auto; }
.feature-row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .loan-tile, .feature-row, .see-all, .freshness-indicator, .bar-trailing { transition: filter 120ms ease, box-shadow 120ms ease; }
  .loan-tile:active, .feature-row:active { filter: brightness(0.97); }
}

/* Bottom nav */
nav[data-shell=&quot;bottom-nav&quot;] { position: sticky; bottom: 0; margin-top: auto; z-index: 18; display: flex; background: var(--surface); border-top: var(--border-w) solid var(--outline-variant); padding-bottom: env(safe-area-inset-bottom, 0); box-shadow: var(--el-2); }
nav[data-shell=&quot;bottom-nav&quot;] a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--sp-sm) var(--sp-xs); min-height: 48px; color: var(--on-surface-variant); text-decoration: none; font-size: var(--fs-caption); letter-spacing: var(--ls-caption); cursor: pointer; }

nav[data-shell=&quot;bottom-nav&quot;] a[data-nav-selected=&quot;true&quot;] { color: var(--on-primary-container); }
