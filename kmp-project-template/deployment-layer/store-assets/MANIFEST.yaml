# MANIFEST.yaml — Money Toolkit store-asset deck (only-media, variant v1).
# Grounded in idea-layer state: palette from the STEP 2 brief (primary #4C56C0),
# copy aligned to deployment-layer/store-listing/variants/v1/text + app-profile/app.yaml.
# Screen sources = the existing idea-layer/screens/{screen}/preview/content.html
# (content-state HTML of the shipped idea-layer screens — no new Stitch mockups).
schema_version: "1"
project: Money Toolkit

themes:
  - id: toolkit-indigo
    frameBg: "linear-gradient(160deg, #4C56C0 0%, #232766 100%)"
    overlayText: "#F5F2FF"
    overlayEyebrow: "#C7CBF2"
    pillBg: "rgba(255,255,255,0.15)"
  - id: toolkit-night
    frameBg: "radial-gradient(120% 110% at 50% 120%, #6B74E0 0%, #3A3F8C 45%, #1B1E52 100%)"
    overlayText: "#EAF3F0"
    overlayEyebrow: "#A9B0F0"
    pillBg: "rgba(76,86,192,0.16)"
  - id: toolkit-mint
    frameBg: "linear-gradient(160deg, #1EA97C 0%, #0C5C46 100%)"
    overlayText: "#F1FFF9"
    overlayEyebrow: "#B7F0D8"
    pillBg: "rgba(255,255,255,0.15)"

assets:
  - order: 1
    screen: home
    state: content
    source: local-llm
    theme: toolkit-indigo
    frame: phone
    copy:
      en:
        eyebrow: 9 tools, 0 logins
        title: Every money tool in one app
        subtitle: Loans, EMI, bills & live rates — all 100% offline. No account, no ads.
        tags: [Offline, Private]

  - order: 2
    screen: loans
    state: content
    source: local-llm
    theme: toolkit-night
    frame: phone
    copy:
      en:
        eyebrow: Loan Tracker
        title: Track every loan you owe
        subtitle: Principal, interest, EMI & due date — stored on-device, fully private.
        tags: [Loans, Private]

  - order: 3
    screen: emi-calculator
    state: content
    source: local-llm
    theme: toolkit-indigo
    frame: phone
    copy:
      en:
        eyebrow: EMI Calculator
        title: Know your EMI instantly
        subtitle: Any amount, rate & tenure — your monthly payment in a tap. No server call.
        tags: [Calculator, Offline]

  - order: 4
    screen: calculators
    state: content
    source: local-llm
    theme: toolkit-mint
    frame: phone
    copy:
      en:
        eyebrow: Plan before you borrow
        title: Afford it? Compare it.
        subtitle: Max affordable loan plus side-by-side comparison before you ever sign.
        tags: [Affordability, Compare]

  - order: 5
    screen: bills
    state: content
    source: local-llm
    theme: toolkit-night
    frame: phone
    copy:
      en:
        eyebrow: Bill Reminders
        title: Never miss a due date
        subtitle: Rent, utilities & loan reminders — notified on time, no cloud sync.
        tags: [Reminders, Offline]

  - order: 6
    screen: amortization
    state: content
    source: local-llm
    theme: toolkit-indigo
    frame: phone
    copy:
      en:
        eyebrow: Amortization
        title: See where your interest goes
        subtitle: Month-by-month principal, interest & outstanding balance for any loan.
        tags: [Schedule, Detail]

  - order: 7
    screen: currency-rates
    state: content
    source: local-llm
    theme: toolkit-mint
    frame: phone
    copy:
      en:
        eyebrow: Live FX Rates
        title: Rates for every currency
        subtitle: Live exchange rates by base currency — travel & transfers made simple.
        tags: [Currency, Live]

  - order: 9
    screen: feature-graphic
    state: hero
    source: local-llm
    theme: toolkit-indigo
    frame: feature-graphic
    variant: hero-right
    hero_screen: home
    hero_state: default
    copy:
      en:
        eyebrow: By Mifos Initiative
        title: Money Toolkit
        subtitle: Loans, EMI, bills & live rates — every money tool, all offline.
        tags: [Offline, Free]
