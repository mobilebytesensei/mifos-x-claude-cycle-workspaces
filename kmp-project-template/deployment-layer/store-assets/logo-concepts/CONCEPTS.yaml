# CONCEPTS.yaml — Money Toolkit brand marks (STEP 5 output; consumed by store-assets-icon-gen.ts)
# Grounded in idea-layer/design-system/design-tokens.yaml: primary #6C63FF (seedColor),
# Plus Jakarta Sans, finance-utility category. Brand tone: confident, modern fintech-utility.
# icon-gen reads concepts[0].mark_svg (rendered on themes[0].mark_bg with color = themes[0].mark)
# for BOTH the 1024² master (all flat formats) AND the Android adaptive FOREGROUND layer.
# Marks are inner-SVG for a 0 0 512 512 viewBox; use currentColor / var(--mark) (icon-gen wires
# --mark/--accent/--accent2/--track + svg{color} all to themes[0].mark) and {{uid}} for local defs ids.
schema_version: "1"
project: Money Toolkit

themes:
  - id: toolkit-indigo          # primary — brand indigo backdrop, white mark
    mark_bg: "#6C63FF"          # design-tokens primary → adaptive background COLOR + master canvas
    mark: "#FFFFFF"             # foreground glyph (currentColor / var(--mark))
    accent: "#FFFFFF"
    accent2: "#FFFFFF"
    track: "#FFFFFF"
  - id: toolkit-night           # deep-indigo night backdrop
    mark_bg: "#3A3F8C"
    mark: "#EAF3F0"
    accent: "#EAF3F0"
    accent2: "#EAF3F0"
    track: "#EAF3F0"
  - id: toolkit-mint            # positive money-movement mint backdrop
    mark_bg: "#1EA97C"
    mark: "#F1FFF9"
    accent: "#F1FFF9"
    accent2: "#F1FFF9"
    track: "#F1FFF9"

concepts:
  - id: gear-dollar
    rationale: >
      Primary mark. A gear/cog bearing an engraved "$" — the two core metaphors of
      Money Toolkit fused into one bold silhouette: tools/utility (the cog) + money
      (the $). A single white shape on brand indigo, so nothing merges or muddies;
      the $ is negative space that inherits the backdrop on every surface (master
      canvas and the Android adaptive-background layer alike). Reads unmistakably at
      48px — the 8-tooth cog outline is legible even when the $ softens.
    mark_svg: |
      <defs>
        <mask id="gear-{{uid}}">
          <rect width="512" height="512" fill="black"/>
          <!-- 8 cog teeth (white), drawn before the body so the disc seals their base -->
          <g fill="white">
            <g transform="rotate(0 256 256)"><rect x="226" y="50" width="60" height="80" rx="22"/></g>
            <g transform="rotate(45 256 256)"><rect x="226" y="50" width="60" height="80" rx="22"/></g>
            <g transform="rotate(90 256 256)"><rect x="226" y="50" width="60" height="80" rx="22"/></g>
            <g transform="rotate(135 256 256)"><rect x="226" y="50" width="60" height="80" rx="22"/></g>
            <g transform="rotate(180 256 256)"><rect x="226" y="50" width="60" height="80" rx="22"/></g>
            <g transform="rotate(225 256 256)"><rect x="226" y="50" width="60" height="80" rx="22"/></g>
            <g transform="rotate(270 256 256)"><rect x="226" y="50" width="60" height="80" rx="22"/></g>
            <g transform="rotate(315 256 256)"><rect x="226" y="50" width="60" height="80" rx="22"/></g>
          </g>
          <!-- cog body (white disc) -->
          <circle cx="256" cy="256" r="152" fill="white"/>
          <!-- $ engraved as negative space (black punch) -->
          <g fill="none" stroke="black" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
            <line x1="256" y1="168" x2="256" y2="344"/>
            <path d="M306 206 q0 -34 -50 -34 q-50 0 -50 40 q0 34 50 40 q50 6 50 44 q0 40 -52 40 q-52 0 -52 -36"/>
          </g>
        </mask>
      </defs>
      <rect width="512" height="512" fill="currentColor" mask="url(#gear-{{uid}})"/>

  - id: money-monogram
    rationale: >
      Alternate. A bold "M" (Money) whose valley reads as a downstroke chevron — a
      confident single-stroke monogram. Maximum legibility at the smallest sizes.
    mark_svg: |
      <g fill="none" stroke="currentColor" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
        <path d="M120 376 V150 L256 300 L392 150 V376"/>
      </g>

  - id: coin-stack
    rationale: >
      Alternate. A stack of coins (savings / balance) with a "$" plate on top —
      signals the money-tracking / accumulation side of the toolkit.
    mark_svg: |
      <g fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="256" cy="176" rx="150" ry="52"/>
        <path d="M106 176 v86 a150 52 0 0 0 300 0 v-86"/>
        <path d="M106 262 v86 a150 52 0 0 0 300 0 v-86"/>
      </g>
