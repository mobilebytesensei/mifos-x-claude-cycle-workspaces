# GOVERNANCE_LEDGER.yaml — rail-assignment register for mifos-x/kmp-project-template
#
# WHAT THIS IS: the standing register that classifies EVERY active plan under
#   plan-layer/project-plans/mifos-x/kmp-project-template/active/
# onto one of two governance vehicles (GOAL D5 two-vehicle model). Authored by
# Claude Write — idea-layer content is NEVER written by bash/python (RULE-CI-001).
# Asserted by .claude-runtime/scripts/framework-verify-governance-ledger.sh
# (zero unclassified active epics → exit 0). Phase 7 / AC-GOVERNANCE-LEDGER (AC-19).
#
# ── THE TWO-VEHICLE BOUNDARY ────────────────────────────────────────────────
# PRODUCT work (new UI screen / user-facing flow / navigation target / data model
#   for UI) flows through the `/idea-agent` rail: drift-gated + Rule-7 pre-plan
#   (idea-first, RULE-GAP-IDEA-FIRST-001). The idea-graph-audit dispatch_queue is
#   a pure function of the idea-graph, so it CAN and MUST drive product gaps.
# INFRA work (build-logic, CI/CD, release plumbing, template sync, secrets) has
#   NO idea-layer analog — no screen/flow/DTO — so the idea-graph-audit
#   dispatch_queue structurally CANNOT drive it. Each INFRA epic is governed by
#   its NAMED native SoT + driver command instead, as a direct-fix rail.
# ─────────────────────────────────────────────────────────────────────────────

governance_ledger:
  version: 1
  boundary:
    product: { vehicle: /idea-agent, gate: "drift-gated + Rule-7 pre-plan (idea-first)" }
    infra:   { vehicle: "native SoT + driver command", gate: "native — no idea-layer analog; the idea-graph-audit dispatch_queue cannot drive infra" }
  active_plans:
    - { slug: whole-source-idea-layer-reimport,                class: INFRA, sot: "idea-layer/ + /idea-agent handoff",         driver: "/idea-import + /idea-agent" }
    - { slug: white-label-template-hardening,                  class: INFRA, sot: "sync-dirs.sh + customization-surface.yaml", driver: "/kmp-project-template-sync + /kmp-project-template-retrain + /ci" }
    - { slug: multi-platform-release-completion,               class: INFRA, sot: "deployment/DEPLOYMENT_MANIFEST.yaml",        driver: "/idea-deploy + /secrets" }
    - { slug: showcase-framework-separation,                  class: INFRA, sot: "build-logic/ + kmp-project-template",        driver: "/kmp-project-template-retrain" }
    - { slug: actionhub-constellation-consolidation,          class: INFRA, sot: ".github/workflows/",                         driver: "CI/CD ops" }
    - { slug: room-3-stable,                                  class: INFRA, sot: "build-logic/ + core/database",               driver: "/kmp-project-template-retrain" }
    - { slug: act-runtime-multi-platform-release-pipeline,    class: INFRA, sot: ".github/workflows/ + act runtime",           driver: "dashboard / act" }
