# site.yaml — Money Toolkit product SITE CONTENT (idea-layer SoT, RULE-GAP-IDEA-FIRST-001).
# Companions: theme/tokens.css (palette, from design-system/design-tokens.yaml) · SITE_DEPLOY.yaml.
# Legal pages come from idea-layer/legal/. /idea-site generate composes this → web-template/content/.
# Copy is derived from IDEA.md + FEATURES.md (shipped modules only — nothing invented).
schema_version: 1
project: kmp-project-template

brand:
  name: "Money Toolkit"
  tagline: "Private, offline-first money utilities — on every platform"
  contact_email: "team@mifos.org"
  company: "Mifos Initiative"
  category: "FinanceApplication"
  operating_system: "Android, iOS, macOS, Windows, Linux, Web"

hero:
  headline: "Money tools that stay on your device"
  subhead: "Track loans, plan EMIs, remember bills and watch rates, FX and markets — with no account, no sign-in and no server holding your data. One Kotlin Multiplatform codebase on Android, iOS, macOS, desktop and the web."
  primary_cta: { label: "Get the source", href: "#download" }
  secondary_cta: { label: "See what's inside", href: "#features" }
  waveform: false
  availability: "Open source — fork it and ship your own."

features:
  - icon: "lock"
    title: "No account, no server"
    body: "Loans, bills and settings live on your device. The app reads only public rate and market data, and never needs you to sign in."
  - icon: "bolt"
    title: "Loan & EMI calculators"
    body: "Work out monthly EMIs, what you can afford, a full month-by-month amortization schedule, and compare loans side by side."
  - icon: "folder"
    title: "Loan tracker & bill reminders"
    body: "Keep your loans and recurring bills in one place, with reminders before a bill is due — stored offline in a local database."
  - icon: "globe"
    title: "Rates, FX & country macro"
    body: "Interest-rate series, live exchange rates with history, and GDP, inflation and unemployment by country — cached so they still load offline."
  - icon: "shield"
    title: "Privacy you control"
    body: "Analytics and crash reports stay off until you switch them on in Settings → Privacy, and you can turn them off again with one tap."
  - icon: "device"
    title: "One codebase, five platforms"
    body: "Android, iOS, macOS, desktop (Windows, macOS, Linux) and the web, built from one shared Kotlin Multiplatform and Compose codebase."

how_it_works:
  eyebrow: "For builders"
  title: "A production-ready starting point"
  steps:
    - icon: "download"
      title: "Fork the template"
      body: "Start from a working five-platform app with navigation, design system, offline-first data, CI and a release pipeline already wired."
    - icon: "edit"
      title: "Make it yours"
      body: "Set your name, IDs, endpoints and colors in one profile file; one sync carries them to every platform. Keep the demo features or remove them."
    - icon: "cpu"
      title: "Ship everywhere"
      body: "Release to Google Play, the App Store, macOS, desktop installers and the web through one guided release ladder."

faq:
  eyebrow: "FAQ"
  title: "Questions, answered"
  items:
    - q: "Do I need an account?"
      a: "No. Money Toolkit has no sign-in and no backend of its own. Your loans, bills and preferences stay on your device."
    - q: "What data leaves my device?"
      a: "Only requests for public data — interest rates, exchange rates, country statistics and crypto prices. Usage analytics and crash reports are off unless you turn them on in Settings → Privacy."
    - q: "Does it work offline?"
      a: "Yes. Your own data is stored locally, and rate and market data is cached, so screens keep working without a connection."
    - q: "Which platforms does it run on?"
      a: "Android, iOS, macOS, desktop (Windows, macOS, Linux) and the web — from one shared codebase."
    - q: "Can I build my own app from it?"
      a: "Yes. It is an open-source template from the Mifos Initiative: fork it, brand it from one profile file, and keep or remove the demo features."

use_cases:
  title: "What you can do with it"
  items:
    - "See the real monthly cost of a loan before you take it."
    - "Get reminded before a recurring bill is due."
    - "Follow interest rates and exchange rates, even offline."
    - "Compare country economics at a glance."
    - "Start your own multi-platform finance app from a working base."

audience: "People who want small, private money utilities without handing their data to a server — and teams who want a production-ready Kotlin Multiplatform starting point."

pricing:
  model: "free"
  note: "Free and open source."

download:
  title: "Get Money Toolkit"
  subtitle: "Open source on GitHub — build it, fork it, and ship your own."
  channels:
    - { platform: "source", store: "web", label: "GitHub", state: "live", url: "https://github.com/openMF/kmp-project-template" }

nav:
  product:  [ { label: "Features", href: "#features" }, { label: "Download", href: "#download" } ]
  company:  [ { label: "About", href: "/company" }, { label: "Contact", href: "/contact" } ]
  legal:    [ { label: "Privacy Policy", href: "/privacy" }, { label: "Terms", href: "/terms" } ]

footer:
  copyright: "© Mifos Initiative. Money Toolkit."
  note: "Private, offline-first money utilities — an open-source Kotlin Multiplatform template."
