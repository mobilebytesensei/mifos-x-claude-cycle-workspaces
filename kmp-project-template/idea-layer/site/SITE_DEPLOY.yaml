# SITE_DEPLOY.yaml — where kmp-project-template's web presence lives.
#
# HOSTED ON mifos-products, not a site of its own (owner decision 2026-10-30): the product page is
# https://mifos-products.pages.dev/mobile/kmp-project-template/ and the legal pages are its
# /privacy/ and /terms/ children. Their content is copied from idea-layer/legal/*.md into
# workspaces/mifos-x/mifos-products/source/mifos-products/content/legal/kmp-project-template/ —
# after editing the policy here, re-copy it there and deploy mifos-products:
#   bash core/scripts/idea-site-deploy.sh --project workspaces/mifos-x/mifos-products --mode prod
#
# site.yaml + theme/tokens.css in this folder describe a standalone web-template site that was
# built but never published. Do NOT deploy this project on its own — deploy mifos-products.
schema_version: 2
project: kmp-project-template
provider: cloudflare-pages
hosted_by: mifos-x/mifos-products

cloudflare:
  project_name: mifos-products
  api_token_alias:  mifos-x-cloudflare-api-token
  account_id_alias: mifos-x-cloudflare-account-id

domains:
  - host: "mifos-products.pages.dev"
    status: "primary"

# app-profile/app.yaml#org.privacy_url (in-app Settings → Privacy → "Privacy policy" + store listings).
publishes_back:
  - target: "app-content.privacy_policy_url"
    value: "https://mifos-products.pages.dev/mobile/kmp-project-template/privacy/"
