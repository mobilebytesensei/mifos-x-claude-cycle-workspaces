    hash_before: null
    hash_after: "sha256:ab06388a46b93b4f070d989076376efcb50de0832ffd48ad170b19c880fb67d1"
    status_before: designed
    status_after: approved
    contract_version: "2.0.0"
    predicate_version: "1.0.0"
    predicate_failures: []
    capabilities: [has_ui, has_api, has_flow]
    bypass_flags: []
    reason: >-
      Human gate satisfied — user invoked /idea approve cloudtodo. NEW feature (not an import):
      docset authored via /idea-plan-add, validated by idea-graph-audit (errors=0), design source
      rendered to preview/content.html. Closes the PR #294 gap where the entire Store5 write path
      (MutationGateway / MutationPolicy / MutationResult / ConflictInbox / DeleteSync) had ZERO UI
      consumers, and MutationResult.Conflicted carried a formRoute with no destination.
    hash_provenance: >-
      Computed by core/scripts/content-stale.sh --current-hash over screens/cloudtodo/*.yaml — the
      sanctioned idea-layer hasher per RULE-CI-001's CI-INTEGRITY carve-out (a raw shasum is
      refused). Valid as a stripped-content digest: no approve_hash/approved_at field existed on
      disk at computation time, so the on-disk bytes were the excluded-field-stripped content.
  - timestamp: "2026-09-03T00:00:00Z"
    feature: cloudtodo
    action: unapprove
    actor: "/idea approve"
    hash_before: "sha256:ab06388a46b93b4f070d989076376efcb50de0832ffd48ad170b19c880fb67d1"
    hash_after: null
    status_before: approved
    status_after: designed
    contract_version: "2.0.0"
    predicate_version: "1.0.0"
    predicate_failures: []
    capabilities: [has_ui, has_api, has_flow]
    bypass_flags: []
    reason: >-
      SPEC CONTAINED A FALSE CLAIM — withdrawn. The approved revision asserted that
      MutationResult.Conflicted routed to a conflict-resolution screen that "does not exist" and
      scaffolded a duplicate `conflict-inbox` screen. It DOES exist and is fully wired:
      ConflictInboxViewModel (feature/settings), SyncAndDraftsScreen rendering ConflictEntry rows
      with ACCEPT_SERVER / RETRY_LOCAL, viewModelOf(::ConflictInboxViewModel) in SettingsModule,
      SyncAndDraftsRoute + navigateToSyncAndDrafts(), reachable via BackboneRegistry:88, with 6
      feature_settings_conflicts_* strings shipped. Implementing the scaffolded screen would have
      been a G-IMPL-DUP violation. Root cause: the audit grepped for CloudTodoRepository consumers
      and over-generalised "no cloudtodo UI" to "no conflict UI" without checking the conflict path
      separately. Editing the docset to correct it invalidated the hash — drift working as designed.
  - timestamp: "2026-09-03T00:00:00Z"
    feature: cloudtodo
    action: approve
    actor: "/idea approve"
    hash_before: null
    hash_after: "sha256:767ea8bae44a982679917ac6d894399c82aae977c9cb8dba790ab35d56e72135"
    status_before: designed
    status_after: approved
    contract_version: "2.0.0"
    predicate_version: "1.0.0"
    predicate_failures: []
    capabilities: [has_ui, has_api, has_flow]
    bypass_flags: []
    reason: >-
      Re-approved over the CORRECTED spec. Scope narrowed to ONE screen (cloud-todo-detail): the
      duplicate conflict-inbox screen, its 3 components, 3 test-tag families, 4 i18n keys and 4 test
      scenarios were removed, and the Conflicted outcome now navigates to the shipped
      SyncAndDraftsRoute instead. 5 action_contracts remain on the single screen. The real gap this
      feature closes is unchanged and still real: CloudTodoRepository — the only createMutableStore +
      MutationGateway consumer — has zero UI, so the two MutationPolicy arms and the MutationResult
      rendering have no on-device surface.
    hash_provenance: >-
      Same sanctioned hasher + stripped-content conditions as the superseded entry above.
