@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #6C63FF;
  --primary-light: #8B83FF;
  --primary-dark: #4F46E5;
  --primary-container: #E8E6FF;
  --on-primary: #FFFFFF;
  --bg: #FFFFFF;
  --surface: #F8F9FA;
  --surface-variant: #F0F1F3;
  --text: #1C1B1F;
  --text-secondary: #49454F;
  --text-tertiary: #79747E;
  --text-disabled: #CAC4D0;
  --border: #E7E0EC;
  --outline: #79747E;
  --error: #B3261E;
  --error-container: #F9DEDC;
  --success: #146C2E;
  --success-container: #C4EED0;
  --warning: #E65100;
  --warning-container: #FFE0B2;
  --info: #0B57D0;
  --secondary: #03DAC6;
  --elevation-1: 0 1px 2px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.1);
  --elevation-2: 0 2px 4px rgba(0,0,0,.05), 0 4px 8px rgba(0,0,0,.1);
  --elevation-3: 0 4px 8px rgba(0,0,0,.08), 0 8px 16px rgba(0,0,0,.12);
  --elevation-4: 0 8px 16px rgba(0,0,0,.1), 0 16px 32px rgba(0,0,0,.15);
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 28px;
  --radius-full: 9999px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --transition: cubic-bezier(.4, 0, .2, 1);
}

body {
  font-family: var(--font);
  background: #0F0F23;
  color: #E2E8F0;
  display: flex;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── SIDEBAR ─────────────────────────────────────────────────── */
.sidebar {
  width: 280px;
  background: linear-gradient(180deg, #13132B 0%, #0D0D1F 100%);
  border-right: 1px solid rgba(255,255,255,.06);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

.sidebar-brand {
  padding: 20px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.sidebar-brand h1 {
  font-size: 15px;
  font-weight: 700;
  color: #F1F5F9;
  letter-spacing: -.01em;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-brand h1 .brand-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--primary), #A855F7);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.sidebar-brand p {
  font-size: 12px;
  color: #64748B;
  margin-top: 6px;
  padding-left: 42px;
}

.sidebar-tabs {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,.06);
  padding: 0 12px;
}

.sidebar-tab {
  flex: 1;
  padding: 10px 4px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: #64748B;
  text-align: center;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .2s var(--transition);
}

.sidebar-tab:hover { color: #94A3B8; }
.sidebar-tab.active { color: var(--primary-light); border-bottom-color: var(--primary-light); }

.sidebar-search {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,.04);
}

.sidebar-search input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.04);
  color: #E2E8F0;
  font-size: 13px;
  font-family: var(--font);
  outline: none;
  transition: border-color .2s;
}

.sidebar-search input::placeholder { color: #475569; }
.sidebar-search input:focus { border-color: var(--primary); background: rgba(99,102,241,.06); }

.sidebar-search-wrap {
  position: relative;
}

.sidebar-search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #475569;
}

.screen-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.1) transparent;
}

.screen-list::-webkit-scrollbar { width: 4px; }
.screen-list::-webkit-scrollbar-track { background: transparent; }
.screen-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

.screen-group-label {
  padding: 12px 8px 6px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #475569;
}

.screen-item {
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1px;
  transition: all .15s var(--transition);
  position: relative;
  color: #94A3B8;
}

.screen-item:hover { background: rgba(255,255,255,.04); color: #CBD5E1; }

.screen-item.active {
  background: linear-gradient(135deg, rgba(99,102,241,.15), rgba(168,85,247,.1));
  color: #C4B5FD;
}

.screen-item .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

.screen-item .screen-name { flex: 1; font-weight: 500; }

.screen-item .screen-count {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  background: rgba(255,255,255,.06);
  color: #64748B;
}

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: #475569;
}

/* ── MAIN AREA ───────────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.toolbar {
  height: 52px;
  background: rgba(15,15,35,.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,.06);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}

.toolbar-section { display: flex; align-items: center; gap: 8px; }
.toolbar-section.center { flex: 1; justify-content: center; }

.toolbar-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.08);
  background: transparent;
  color: #94A3B8;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}

.toolbar-btn:hover { background: rgba(255,255,255,.06); color: #E2E8F0; }
.toolbar-btn.active { background: rgba(99,102,241,.15); color: var(--primary-light); border-color: rgba(99,102,241,.3); }

.device-switcher {
  display: flex;
  background: rgba(255,255,255,.04);
  border-radius: 8px;
  padding: 2px;
  border: 1px solid rgba(255,255,255,.06);
}

.device-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: #64748B;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font);
}

.device-btn:hover { color: #94A3B8; }
.device-btn.active { background: rgba(99,102,241,.2); color: var(--primary-light); }

.breadcrumb {
  font-size: 12px;
  color: #64748B;
  display: flex;
  align-items: center;
  gap: 6px;
}

.breadcrumb .sep { color: #334155; }
.breadcrumb .current { color: #C4B5FD; font-weight: 500; }

/* ── PHONE FRAME ─────────────────────────────────────────────── */
.canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #1a1a3e 0%, #0F0F23 70%);
  overflow: auto;
  padding: 24px;
}

.phone-wrap { position: relative; }

.phone {
  width: 375px;
  height: 812px;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.1),
    0 0 0 12px #1a1a2e,
    0 0 0 13px rgba(255,255,255,.05),
    var(--elevation-4),
    0 0 80px rgba(99,102,241,.15);
  display: flex;
  flex-direction: column;
  position: relative;
  transition: width .4s var(--transition), height .4s var(--transition), border-radius .4s var(--transition);
}

.phone.tablet {
  width: 768px;
  height: 1024px;
  border-radius: 24px;
}

.phone.desktop {
  width: 1280px;
  height: 800px;
  border-radius: 12px;
}

/* Status Bar */
.status-bar {
  height: 54px;
  padding: 14px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  flex-shrink: 0;
  z-index: 10;
}

.status-bar .time {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.status-bar .icons {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Dynamic Island */
.dynamic-island {
  width: 126px;
  height: 36px;
  background: #000;
  border-radius: 20px;
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
}

/* Screen Content */
.screen-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.screen-content::-webkit-scrollbar { width: 0; }

/* Home Indicator */
.home-indicator-wrap {
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  flex-shrink: 0;
}

.home-indicator {
  width: 134px;
  height: 5px;
  background: var(--text);
  border-radius: 3px;
  opacity: .2;
}

/* ── COMPONENT STYLES ────────────────────────────────────────── */

/* Header */
.c-header {
  padding: 8px 20px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 5;
}

.c-header .back-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}

.c-header .back-btn:hover { background: var(--surface); }

.c-header .header-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
}

.c-header .header-actions {
  display: flex;
  gap: 4px;
}

.c-header .header-action {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}

.c-header .header-action:hover { background: var(--surface); }

/* Text */
.c-text { padding: 0 20px; }
.c-text.headline { font-size: 28px; font-weight: 800; color: var(--text); line-height: 1.2; margin-bottom: 8px; letter-spacing: -.02em; }
.c-text.title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; letter-spacing: -.01em; }
.c-text.subtitle { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.c-text.body { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; }
.c-text.caption { font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px; }
.c-text.label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-tertiary); margin-bottom: 8px; }

/* Buttons */
.c-button {
  margin: 6px 20px;
  padding: 14px 24px;
  border-radius: var(--radius-md);
  border: none;
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all .2s var(--transition);
  position: relative;
  overflow: hidden;
  width: calc(100% - 40px);
}

/* Text/link buttons — auto width, centered */
.c-button.text-btn { width: auto; margin-left: auto; margin-right: auto; }

.c-button::after {
  content: '';
  position: absolute;
  inset: 0;
  background: currentColor;
  opacity: 0;
  transition: opacity .2s;
}

.c-button:active::after { opacity: .12; }

.c-button.primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--on-primary);
  box-shadow: 0 2px 8px rgba(108,99,255,.35);
}

.c-button.primary:hover { box-shadow: 0 4px 16px rgba(108,99,255,.45); transform: translateY(-1px); }

.c-button.outline {
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--primary);
}

.c-button.outline:hover { background: var(--primary-container); border-color: var(--primary); }

.c-button.text-btn {
  background: transparent;
  color: var(--primary);
  padding: 10px 20px;
}

.c-button.text-btn:hover { background: var(--primary-container); }

.c-button.danger {
  background: var(--error);
  color: white;
}

.c-button.secondary {
  background: var(--surface);
  color: var(--text);
}

.c-button.secondary:hover { background: var(--surface-variant); }

/* Input */
.c-input-wrap {
  margin: 6px 20px;
}

.c-input {
  width: 100%;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

.c-input::placeholder { color: var(--text-disabled); }
.c-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,99,255,.12); }

.c-input-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

/* Cards */
.c-card {
  margin: 6px 20px;
  padding: 16px;
  border-radius: var(--radius-lg);
  background: var(--bg);
  border: 1px solid var(--border);
  transition: all .2s var(--transition);
  cursor: pointer;
  box-shadow: var(--elevation-1);
}

.c-card:hover { box-shadow: var(--elevation-2); transform: translateY(-2px); }

.c-card .card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.c-card .card-subtitle { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

/* Lists */
.c-list {
  margin: 4px 20px;
}

.c-list-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  border-radius: 8px;
  margin: 0 -8px;
  padding-left: 8px;
  padding-right: 8px;
}

.c-list-item:last-child { border-bottom: none; }
.c-list-item:hover { background: var(--surface); }
.c-list-item.selected-item { background: var(--primary-container); }
.c-list-item.selected-item .item-trailing { color: var(--primary); }
.c-list-item.active-filter { background: var(--primary-container); border-left: 3px solid var(--primary); }
.c-list-item .item-detail { display: none; font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-top: 6px; padding: 8px 0; border-top: 1px solid var(--border); }
.c-list-item .item-detail.expanded { display: block; }

.c-list-item .item-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.c-list-item .item-content { flex: 1; min-width: 0; }
.c-list-item .item-label { font-size: 14px; font-weight: 500; color: var(--text); }
.c-list-item .item-subtitle { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

.c-list-item .item-trailing {
  color: var(--text-disabled);
  display: flex;
  align-items: center;
}

/* List item inline controls */
.c-list-item .toggle-track { flex-shrink: 0; margin-left: auto; }
.list-slider { display: flex; align-items: center; gap: 8px; min-width: 120px; flex-shrink: 0; }
.list-slider input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 80px; height: 4px; background: var(--border); border-radius: 2px; outline: none;
}
.list-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; background: var(--primary); border-radius: 50%; cursor: pointer;
}
.list-slider span { font-size: 12px; color: var(--text-secondary); min-width: 24px; text-align: right; }
.list-picker-val {
  display: flex; align-items: center; gap: 4px; color: var(--text-secondary);
  font-size: 13px; flex-shrink: 0;
}

/* Toggle/Switch */
.c-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  cursor: pointer;
}

.c-toggle .toggle-label { font-size: 14px; font-weight: 500; color: var(--text); }
.c-toggle .toggle-desc { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

.c-toggle .toggle-track {
  width: 52px;
  height: 32px;
  border-radius: 16px;
  background: #E0E0E0;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
}

.c-toggle .toggle-track.on { background: var(--primary); }

.c-toggle .toggle-thumb {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: white;
  position: absolute;
  top: 4px;
  left: 4px;
  box-shadow: var(--elevation-1);
  transition: transform .2s var(--transition);
}

.c-toggle .toggle-track.on .toggle-thumb { transform: translateX(20px); }

/* Section */
.c-section {
  padding: 8px 16px 12px;
}
.c-section .section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0 6px;
}
.c-section .section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
}
.c-section .see-all {
  font-size: 11px;
  color: var(--accent, #6200EE);
  cursor: pointer;
  font-weight: 500;
}
.c-section .section-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 6px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.c-section .section-scroll::-webkit-scrollbar { display: none; }
.c-section .section-card {
  min-width: 100px;
  max-width: 110px;
  flex-shrink: 0;
  cursor: pointer;
}
.c-section .section-card-poster {
  width: 100%;
  aspect-ratio: 2/3;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  margin-bottom: 4px;
  background: var(--surface-variant, #e0e0e0);
  color: rgba(255,255,255,0.7);
}
.c-section .section-card-title {
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary);
}
.c-section .section-card-sub {
  font-size: 10px;
  color: var(--text-secondary);
}
.c-section .section-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 500;
  color: white;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}
.c-section .section-chip svg { width: 14px; height: 14px; }
.c-section .section-avatar-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 70px;
  flex-shrink: 0;
}
.c-section .section-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  margin-bottom: 4px;
}
.c-section .section-avatar-name {
  font-size: 10px;
  font-weight: 500;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 70px;
  color: var(--text-primary);
}
.c-section .section-avatar-sub {
  font-size: 9px;
  color: var(--text-secondary);
  text-align: center;
}
.c-section .section-platform {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 11px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Divider */
.c-divider {
  height: 1px;
  background: var(--border);
  margin: 8px 20px;
}

/* Image */
.c-image {
  margin: 8px 20px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  position: relative;
}

.c-image.square { aspect-ratio: 1; }
.c-image.wide { aspect-ratio: 16/9; }
.c-image.portrait { aspect-ratio: 3/4; }

.c-image .img-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: white;
  font-size: 12px;
  font-weight: 500;
}

/* Chip */
.c-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
  background: var(--bg);
  font-size: 13px;
  color: var(--text-secondary);
  margin: 4px;
  cursor: pointer;
  transition: all .15s;
}

.c-chip:hover { background: var(--primary-container); border-color: var(--primary); color: var(--primary); }
.c-chip.selected { background: var(--primary-container); border-color: var(--primary); color: var(--primary); }

.c-chips { padding: 4px 16px; display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.c-chips::-webkit-scrollbar { display: none; }

/* Picker / Dropdown */
.c-picker {
  margin: 6px 20px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border);
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: border-color .2s;
}

.c-picker:hover { border-color: var(--primary); }
.c-picker .picker-label { font-size: 14px; color: var(--text); }
.c-picker .picker-value { font-size: 14px; color: var(--text-tertiary); }

/* Slider */
.c-slider-wrap {
  padding: 6px 20px;
}

.c-slider {
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  appearance: none;
  outline: none;
}

.c-slider::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
  box-shadow: var(--elevation-2);
}

/* Progress Bar */
.c-progress {
  margin: 8px 20px;
}

.c-progress-track {
  height: 6px;
  border-radius: 3px;
  background: var(--surface-variant);
  overflow: hidden;
}

.c-progress-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  transition: width .6s var(--transition);
}

.c-progress-label {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-tertiary);
}

.c-progress-fill { position: relative; overflow: hidden; }
.c-progress-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
  animation: shimmer 2s infinite;
}

/* Animated Loader/Spinner */
.c-loader { padding: 32px 20px; text-align: center; }
.c-loader .spinner {
  width: 48px; height: 48px; border: 4px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 1s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.c-loader .loader-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
.c-loader .loader-sublabel { font-size: 12px; color: var(--text-tertiary); }

/* Lottie-style Animated Placeholder */
.c-lottie {
  margin: 12px 20px; border-radius: var(--radius-lg); overflow: hidden;
  background: linear-gradient(135deg, var(--surface), var(--primary-container));
  aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
  position: relative;
}
.c-lottie::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,.3) 50%, transparent 75%);
  animation: shimmer 2s infinite;
}
.c-lottie .lottie-label {
  position: relative; z-index: 1; font-size: 13px;
  color: var(--text-secondary); text-align: center; padding: 16px;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

/* Shimmer Skeleton Cards */
.c-shimmer { margin: 8px 20px; }
.c-shimmer-item {
  height: 64px; border-radius: var(--radius-md); margin-bottom: 8px;
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-variant) 50%, var(--surface) 75%);
  background-size: 200% 100%; animation: shimmerBg 1.5s infinite;
}
@keyframes shimmerBg { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Circular Progress */
.c-circular-progress { width: 64px; height: 64px; position: relative; margin: 16px auto; }
.c-circular-progress svg { transform: rotate(-90deg); }
.c-circular-progress .progress-text {
  position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; font-size: 14px; font-weight: 700; color: var(--text);
}

/* State Transition Animation */
.state-enter { animation: stateFadeIn .3s var(--transition); }
@keyframes stateFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Media Player */
.c-media-player {
  margin: 8px 20px;
  border-radius: var(--radius-lg);
  aspect-ratio: 16/9;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.c-media-player .play-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  backdrop-filter: blur(12px);
  border: 2px solid rgba(255,255,255,.2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s;
  color: white;
}

.c-media-player .play-btn:hover { background: rgba(255,255,255,.25); transform: scale(1.1); }

.c-media-player .media-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px;
  background: linear-gradient(transparent, rgba(0,0,0,.7));
  color: white;
}

.c-media-player .media-title { font-size: 13px; font-weight: 600; }
.c-media-player .media-duration { font-size: 11px; opacity: .7; margin-top: 2px; }

/* Avatar */
.c-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

/* Badge/Stat */
.c-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.c-stat .stat-value { font-size: 20px; font-weight: 800; color: var(--text); }
.c-stat .stat-label { font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .04em; }

.c-stats-row {
  display: flex;
  justify-content: space-around;
  padding: 16px 20px;
}

/* Bottom Navigation */
.bottom-nav {
  height: 64px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 8px;
  flex-shrink: 0;
}

.bottom-nav .nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  padding: 6px 16px;
  border-radius: 16px;
  transition: all .2s;
  position: relative;
}

.bottom-nav .nav-item .nav-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-tertiary);
  transition: color .2s;
}

.bottom-nav .nav-item .nav-icon {
  color: var(--text-tertiary);
  transition: color .2s;
  position: relative;
}

.bottom-nav .nav-item.active .nav-icon { color: var(--primary); }
.bottom-nav .nav-item.active .nav-label { color: var(--primary); font-weight: 600; }

.bottom-nav .nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: var(--primary);
}

/* FAB — rendered outside screen-content as overlay */
/* FAB — positioned above bottom-nav (64px) + home-indicator (34px) + 16px gap = 114px */
.c-fab {
  position: absolute;
  bottom: 114px;
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(108,99,255,.4);
  transition: all .2s var(--transition);
  z-index: 15;
}
/* When no bottom-nav visible, FAB sits closer to bottom */
.c-fab.no-nav {
  bottom: 50px;
}

.c-fab:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(108,99,255,.5); }

/* Snackbar/Toast */
.toast-container {
  position: absolute;
  bottom: 100px;
  left: 20px;
  right: 20px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  padding: 14px 20px;
  border-radius: var(--radius-md);
  background: #323232;
  color: white;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--elevation-3);
  animation: toastIn .3s var(--transition);
  pointer-events: auto;
}

.toast.success { background: var(--success); }
.toast.error { background: var(--error); }
.toast.info { background: var(--info); }

.toast .toast-action {
  margin-left: auto;
  color: var(--primary-light);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Modal */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}

.modal-overlay.visible { opacity: 1; pointer-events: auto; }

.modal-sheet {
  width: 100%;
  background: white;
  border-radius: 24px 24px 0 0;
  padding: 16px 0 34px;
  max-height: 70%;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform .3s var(--transition);
}

.modal-overlay.visible .modal-sheet { transform: translateY(0); }

/* Dialog mode — centered, compact */
.modal-overlay.dialog-mode { align-items: center; padding: 20px; }
.modal-overlay.dialog-mode .modal-sheet {
  border-radius: 24px;
  max-width: 340px;
  max-height: 60%;
  padding: 24px 0;
  transform: scale(.9);
  opacity: 0;
  transition: transform .3s var(--transition), opacity .3s;
}
.modal-overlay.dialog-mode.visible .modal-sheet { transform: scale(1); opacity: 1; }

.modal-handle {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: #E0E0E0;
  margin: 0 auto 16px;
}

/* Spacer */
.c-spacer { height: 12px; }
.c-spacer-lg { height: 24px; }

/* Empty State */
.c-empty-state {
  padding: 40px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.c-empty-state .empty-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-disabled);
}

/* Tab Bar */
.c-tab-bar {
  display: flex;
  margin: 0 20px;
  border-bottom: 1px solid var(--border);
}

.c-tab {
  padding: 12px 0;
  margin-right: 24px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-tertiary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .2s;
}

.c-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* Search Bar (in-app) */
.c-search-bar {
  margin: 8px 20px;
  padding: 12px 16px;
  border-radius: var(--radius-xl);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background .15s;
}

.c-search-bar:hover { background: var(--surface-variant); }
.c-search-bar .search-text { font-size: 14px; color: var(--text-tertiary); flex: 1; }

/* ── INSPECTOR PANEL ─────────────────────────────────────────── */
.inspector {
  width: 300px;
  background: linear-gradient(180deg, #13132B 0%, #0D0D1F 100%);
  border-left: 1px solid rgba(255,255,255,.06);
  overflow-y: auto;
  padding: 16px;
  display: none;
  flex-shrink: 0;
}

.inspector.visible { display: block; }

.inspector h3 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #64748B;
  margin-bottom: 12px;
}

.inspector-field {
  margin-bottom: 12px;
}

.inspector-field .field-label {
  font-size: 11px;
  color: #475569;
  margin-bottom: 4px;
}

.inspector-field .field-value {
  font-size: 13px;
  color: #CBD5E1;
  font-family: 'SF Mono', 'Fira Code', monospace;
  padding: 6px 10px;
  background: rgba(255,255,255,.04);
  border-radius: 6px;
  word-break: break-all;
}

.inspector-tag {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(99,102,241,.15);
  color: #C4B5FD;
  font-size: 11px;
  font-family: monospace;
  margin: 2px;
}

/* ── SFR PANEL (Server Requirements Side Panel) ──────────────── */
.sfr-panel {
  width: 320px;
  background: linear-gradient(180deg, #13132B 0%, #0D0D1F 100%);
  border-left: 1px solid rgba(255,255,255,.06);
  overflow-y: auto;
  padding: 16px;
  display: none;
  flex-shrink: 0;
}
.sfr-panel.visible { display: block; }
.sfr-panel h3 {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: #64748B;
  margin-bottom: 12px;
}
.sfr-endpoint-card {
  padding: 8px 10px;
  margin-bottom: 6px;
  background: rgba(255,255,255,.03);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,.04);
}
.sfr-endpoint-card:hover { background: rgba(255,255,255,.05); }
.sfr-group-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  background: rgba(99,102,241,.12);
  color: #A5B4FC;
}
.sfr-comp-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
  cursor: pointer;
}
.sfr-comp-header:hover { background: rgba(255,255,255,.02); border-radius: 6px; }
.sfr-comp-body { padding: 6px 0 6px 12px; }
.sfr-empty {
  text-align: center;
  padding: 32px 16px;
  color: #475569;
  font-size: 13px;
}
.sfr-empty-icon { font-size: 32px; opacity: .3; margin-bottom: 8px; }
.sfr-coverage-footer {
  margin-top: 16px;
  padding: 12px;
  background: rgba(255,255,255,.03);
  border-radius: 8px;
  font-size: 12px;
  color: #94A3B8;
}

/* ── TAG OVERLAY ─────────────────────────────────────────────── */
.tag-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(234,88,12,.9);
  color: white;
  font-size: 8px;
  font-weight: 700;
  font-family: monospace;
  white-space: nowrap;
  z-index: 15;
  display: none;
  pointer-events: none;
}

.show-tags .tag-badge { display: block; }

/* ── FLOW DIAGRAM TAB ───────────────────────────────────────── */
.flow-panel {
  flex: 1;
  padding: 40px;
  display: none;
  overflow: auto;
  background: radial-gradient(ellipse at center, #1a1a3e 0%, #0F0F23 70%);
}

.flow-panel.visible { display: block; }

.flow-node {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: 10px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  color: #CBD5E1;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  margin: 8px;
  transition: all .2s;
}

.flow-node:hover {
  background: rgba(99,102,241,.15);
  border-color: rgba(99,102,241,.3);
}

/* ── COVERAGE TAB ───────────────────────────────────────────── */
.coverage-panel {
  flex: 1;
  padding: 40px;
  display: none;
  overflow: auto;
  background: radial-gradient(ellipse at center, #1a1a3e 0%, #0F0F23 70%);
}

.coverage-panel.visible { display: block; }

.coverage-card {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  max-width: 600px;
}

.coverage-card h4 {
  font-size: 14px;
  font-weight: 600;
  color: #E2E8F0;
  margin-bottom: 12px;
}

.coverage-bar {
  height: 8px;
  border-radius: 4px;
  background: rgba(255,255,255,.08);
  overflow: hidden;
  margin-bottom: 8px;
}

.coverage-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width .6s var(--transition);
}

.coverage-stat {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #94A3B8;
}

/* ── API TAB ───────────────────────────────────────────────── */
.api-panel {
  flex: 1;
  padding: 40px;
  display: none;
  overflow: auto;
  background: radial-gradient(ellipse at center, #1a1a3e 0%, #0F0F23 70%);
}

.api-panel.visible { display: block; }

.api-method-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  flex-shrink: 0;
}

.api-method-get { background: rgba(16,185,129,.15); color: #10B981; }
.api-method-post { background: rgba(99,102,241,.15); color: #818CF8; }
.api-method-patch { background: rgba(245,158,11,.15); color: #F59E0B; }
.api-method-put { background: rgba(245,158,11,.15); color: #F59E0B; }
.api-method-delete { background: rgba(239,68,68,.15); color: #EF4444; }

.api-endpoint-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 6px;
}

.api-endpoint-row:hover {
  background: rgba(99,102,241,.1);
  border-color: rgba(99,102,241,.25);
}

.api-group-card {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  max-width: 700px;
}

.api-group-card h4 {
  font-size: 14px;
  font-weight: 600;
  color: #E2E8F0;
  margin-bottom: 12px;
}

.api-unmapped {
  background: rgba(239,68,68,.06);
  border: 1px solid rgba(239,68,68,.15);
  border-left: 3px solid #EF4444;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  max-width: 700px;
}

.api-screen-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #818CF8;
  display: inline-block;
  margin-left: 4px;
  flex-shrink: 0;
}

.api-strategy-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  background: rgba(99,102,241,.12);
  color: #A5B4FC;
}

.api-detail-expand {
  padding: 10px 14px;
  margin-top: 4px;
  background: rgba(255,255,255,.02);
  border-radius: 8px;
  font-size: 12px;
  color: #94A3B8;
  display: none;
}

.api-detail-expand.open { display: block; }

/* ── iOS PLATFORM OVERRIDES ──────────────────────────────────── */
.phone.ios {
  --font: -apple-system, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
  --radius-sm: 8px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 22px;
  --primary: #007AFF; --primary-light: #409CFF; --primary-dark: #0056CC;
  --primary-container: #E5F0FF; --success: #34C759;
}

/* iOS Header — blur backdrop */
.phone.ios .c-header {
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  background: rgba(255,255,255,.85);
  border-bottom: 0.5px solid rgba(0,0,0,.12);
}
.phone.ios .c-header .back-btn { color: #007AFF; }
.phone.ios .c-header .header-title { font-size: 17px; font-weight: 600; }

/* iOS Buttons — system blue */
.phone.ios .c-button.primary {
  background: #007AFF; border-radius: 10px;
  box-shadow: none; font-weight: 600;
}
.phone.ios .c-button.primary:hover { background: #0056CC; box-shadow: none; transform: none; }
.phone.ios .c-button.outline { border-color: #007AFF; color: #007AFF; border-radius: 10px; }
.phone.ios .c-button.text-btn { color: #007AFF; }
.phone.ios .c-button.danger { background: #FF3B30; }

/* iOS Toggle — green, wider track */
.phone.ios .c-toggle .toggle-track {
  width: 51px; height: 31px; border-radius: 16px; background: #E9E9EB;
}
.phone.ios .c-toggle .toggle-track.on { background: #34C759; }
.phone.ios .c-toggle .toggle-thumb {
  width: 27px; height: 27px; top: 2px; left: 2px;
  box-shadow: 0 1px 3px rgba(0,0,0,.2), 0 3px 8px rgba(0,0,0,.1);
}
.phone.ios .c-toggle .toggle-track.on .toggle-thumb { transform: translateX(20px); }

/* iOS List — table cells, inset borders */
.phone.ios .c-list-item {
  border-bottom: 0.5px solid rgba(0,0,0,.1);
  padding-left: 16px; padding-right: 16px;
  border-radius: 0; margin: 0;
}
.phone.ios .c-list-item:hover { background: rgba(0,0,0,.03); }
.phone.ios .c-list-item .item-icon { border-radius: 8px; width: 36px; height: 36px; }
.phone.ios .c-list-item.selected-item { background: rgba(0,122,255,.08); }
.phone.ios .c-list-item.selected-item .item-trailing { color: #007AFF; }
.phone.ios .c-list-item.active-filter { border-left: 3px solid #007AFF; background: rgba(0,122,255,.06); }

/* iOS Bottom nav — tab bar with blur */
.phone.ios .bottom-nav {
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  background: rgba(249,249,249,.94);
  border-top: 0.5px solid rgba(0,0,0,.12);
  height: 56px;
}
.phone.ios .bottom-nav .nav-item .nav-icon { color: #8E8E93; }
.phone.ios .bottom-nav .nav-item .nav-label { color: #8E8E93; font-size: 10px; }
.phone.ios .bottom-nav .nav-item.active .nav-icon { color: #007AFF; }
.phone.ios .bottom-nav .nav-item.active .nav-label { color: #007AFF; }
.phone.ios .bottom-nav .nav-item.active::before { background: #007AFF; height: 2px; }

/* iOS Input — rounded rect, gray bg */
.phone.ios .c-input {
  background: rgba(118,118,128,.12); border: none; border-radius: 10px;
  padding: 12px 14px; font-size: 15px;
}
.phone.ios .c-input::placeholder { color: rgba(60,60,67,.3); }
.phone.ios .c-input:focus { box-shadow: 0 0 0 3px rgba(0,122,255,.25); }

/* iOS Section headers — gray, system style */
.phone.ios .c-section {
  color: #8E8E93; font-size: 13px; text-transform: uppercase;
  letter-spacing: .02em; padding-left: 20px;
}

/* iOS Divider — inset */
.phone.ios .c-divider { margin-left: 56px; background: rgba(0,0,0,.08); }

/* iOS Cards — subtle, no shadow */
.phone.ios .c-card {
  box-shadow: none; border: 0.5px solid rgba(0,0,0,.1);
  border-radius: 10px;
}
.phone.ios .c-card:hover { box-shadow: none; transform: none; }

/* iOS Search bar */
.phone.ios .c-search-bar {
  background: rgba(118,118,128,.12); border-radius: 10px;
}

/* iOS FAB — hidden (iOS convention: action in header) */
.phone.ios .c-fab { display: none; }

/* iOS Status bar text */
.phone.ios .status-bar .time { font-weight: 600; font-size: 15px; }

/* iOS Chips */
.phone.ios .c-chip { border-radius: 8px; border-color: rgba(0,0,0,.1); }
.phone.ios .c-chip:hover { background: rgba(0,122,255,.08); border-color: #007AFF; color: #007AFF; }
.phone.ios .c-chip.selected { background: #007AFF; border-color: #007AFF; color: white; }

/* iOS Progress */
.phone.ios .c-progress-fill { background: linear-gradient(90deg, #007AFF, #409CFF); }

/* iOS Slider */
.phone.ios .c-slider { height: 3px; }
.phone.ios .c-slider::-webkit-slider-thumb { width: 28px; height: 28px; background: white; box-shadow: 0 1px 4px rgba(0,0,0,.2); }

/* iOS Toast — rounded, top-aligned feel */
.phone.ios .toast { border-radius: 14px; backdrop-filter: blur(20px); background: rgba(50,50,50,.88); }

/* iOS Modal sheet */
.phone.ios .modal-sheet { border-radius: 14px 14px 0 0; }

/* ── RESPONSIVE ──────────────────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .inspector { display: none !important; }
  .toolbar { padding: 0 12px; }
}

/* ── ANIMATIONS ──────────────────────────────────────────────── */
.screen-enter {
  animation: screenSlideIn .35s var(--transition);
}

@keyframes screenSlideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

.screen-enter-back {
  animation: screenSlideBack .35s var(--transition);
}

@keyframes screenSlideBack {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ── GRADIENT PALETTE ────────────────────────────────────────── */
.gradient-1 { background: linear-gradient(135deg, #6C63FF, #A855F7); }
.gradient-2 { background: linear-gradient(135deg, #06B6D4, #3B82F6); }
.gradient-3 { background: linear-gradient(135deg, #F59E0B, #EF4444); }
.gradient-4 { background: linear-gradient(135deg, #10B981, #059669); }
.gradient-5 { background: linear-gradient(135deg, #EC4899, #8B5CF6); }
.gradient-6 { background: linear-gradient(135deg, #F97316, #FBBF24); }
.gradient-7 { background: linear-gradient(135deg, #14B8A6, #22D3EE); }
.gradient-8 { background: linear-gradient(135deg, #8B5CF6, #6366F1); }

/* ═══ WEB MODE — Browser Frame ═══════════════════════════════ */
.browser-frame {
  background: var(--bg);
  border-radius: 12px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.1),
    var(--elevation-4),
    0 0 80px rgba(99,102,241,.15);
  display: none; /* shown only when isWeb */
  flex-direction: column;
  position: relative;
  transition: width .4s var(--transition), height .4s var(--transition);
  width: 1280px;
  max-height: 800px;
}

.browser-frame.active { display: flex; }

.browser-frame.viewport-desktop { width: 1280px; }
.browser-frame.viewport-tablet  { width: 768px; }
.browser-frame.viewport-mobile  { width: 375px; }

/* Browser Chrome Bar */
.browser-chrome {
  height: 40px;
  background: #1E1E2E;
  border-bottom: 1px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 10px;
  flex-shrink: 0;
  user-select: none;
}

.browser-traffic-lights {
  display: flex;
  gap: 7px;
  align-items: center;
  padding-right: 6px;
}

.browser-traffic-lights .dot-close,
.browser-traffic-lights .dot-minimize,
.browser-traffic-lights .dot-maximize {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

.browser-traffic-lights .dot-close    { background: #FF5F57; }
.browser-traffic-lights .dot-minimize { background: #FFBD2E; }
.browser-traffic-lights .dot-maximize { background: #28C840; }

.browser-nav-btns {
  display: flex;
  gap: 4px;
  align-items: center;
}

.browser-nav-btns button {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  background: rgba(255,255,255,.06);
  color: #64748B;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s;
}

.browser-nav-btns button:hover { background: rgba(255,255,255,.1); color: #94A3B8; }

.browser-url-bar {
  flex: 1;
  height: 28px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 6px;
  font-size: 12px;
  color: #64748B;
  font-family: var(--font);
  overflow: hidden;
}

.browser-url-bar .url-lock {
  color: #28C840;
  flex-shrink: 0;
}

.browser-url-bar .url-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #94A3B8;
}

/* Browser page content */
.browser-page-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  background: var(--bg);
}

/* Viewport switcher (web mode) */
.viewport-switcher {
  display: none; /* shown only when isWeb */
  background: rgba(255,255,255,.04);
  border-radius: 8px;
  padding: 2px;
  border: 1px solid rgba(255,255,255,.06);
}

.viewport-switcher.active { display: flex; }

.viewport-btn {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: #64748B;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font);
}

.viewport-btn:hover { color: #94A3B8; }
.viewport-btn.active { background: rgba(99,102,241,.2); color: var(--primary-light); }

/* ═══ WEB COMPONENTS ═════════════════════════════════════════ */
.wc-nav-bar {
  display: flex;
  align-items: center;
  padding: 0 32px;
  height: 64px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}

.wc-nav-bar .nav-logo {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  margin-right: 32px;
}

.wc-nav-bar .nav-links {
  display: flex;
  gap: 24px;
  flex: 1;
}

.wc-nav-bar .nav-links a {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  text-decoration: none;
  cursor: pointer;
  transition: color .15s;
}

.wc-nav-bar .nav-links a:hover { color: var(--primary); }

.wc-nav-bar .nav-cta {
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: var(--on-primary);
  font-size: 13px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: background .15s;
}

.wc-nav-bar .nav-cta:hover { background: var(--primary-dark); }

.wc-hero {
  padding: 80px 48px;
  text-align: center;
  background: linear-gradient(135deg, rgba(108,99,255,.08), rgba(168,85,247,.06));
}

.wc-hero .hero-headline {
  font-size: 48px;
  font-weight: 800;
  color: var(--text);
  line-height: 1.15;
  margin-bottom: 16px;
}

.wc-hero .hero-subheadline {
  font-size: 18px;
  color: var(--text-secondary);
  max-width: 600px;
  margin: 0 auto 32px;
  line-height: 1.6;
}

.wc-hero .hero-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.wc-hero .hero-actions button {
  padding: 12px 28px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: var(--font);
  transition: all .15s;
}

.wc-hero .hero-actions .btn-primary { background: var(--primary); color: var(--on-primary); }
.wc-hero .hero-actions .btn-primary:hover { background: var(--primary-dark); }
.wc-hero .hero-actions .btn-secondary { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.wc-hero .hero-actions .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

.wc-hero.left-aligned { text-align: left; }
.wc-hero.left-aligned .hero-subheadline { margin: 0 0 32px; }
.wc-hero.left-aligned .hero-actions { justify-content: flex-start; }

.wc-section-title {
  font-size: 32px;
  font-weight: 800;
  color: var(--text);
  text-align: center;
  margin-bottom: 12px;
}

.wc-section-subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  text-align: center;
  margin-bottom: 40px;
}

/* Card Grid */
.wc-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
  padding: 40px 48px;
}

.wc-card-grid .grid-card {
  background: var(--surface);
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all .2s;
}

.wc-card-grid .grid-card:hover { transform: translateY(-2px); box-shadow: var(--elevation-3); }

.wc-card-grid .grid-card .card-img {
  width: 100%;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: rgba(255,255,255,.6);
}

.wc-card-grid .grid-card .card-body { padding: 16px; }
.wc-card-grid .grid-card .card-body .card-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.wc-card-grid .grid-card .card-body .card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.wc-card-grid .grid-card .card-body .card-badges { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.wc-card-grid .grid-card .card-body .badge-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  background: var(--primary-container);
  color: var(--primary-dark);
}

/* Feature Grid */
.wc-feature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 32px;
  padding: 40px 48px;
}

.wc-feature-grid .feature-block { text-align: center; }
.wc-feature-grid .feature-block .feature-icon { font-size: 32px; margin-bottom: 12px; }
.wc-feature-grid .feature-block .feature-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.wc-feature-grid .feature-block .feature-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

/* Testimonial Slider */
.wc-testimonials {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
  padding: 40px 48px;
}

.wc-testimonials .testimonial-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 24px;
}

.wc-testimonials .testimonial-card .quote {
  font-style: italic;
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 16px;
}

.wc-testimonials .testimonial-card .quote::before { content: '\201C'; font-size: 24px; color: var(--primary); margin-right: 4px; }
.wc-testimonials .testimonial-card .quote::after  { content: '\201D'; font-size: 24px; color: var(--primary); margin-left: 4px; }

.wc-testimonials .testimonial-card .author-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.wc-testimonials .testimonial-card .author-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #A855F7);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 14px;
}

.wc-testimonials .testimonial-card .author-name { font-size: 14px; font-weight: 700; color: var(--text); }
.wc-testimonials .testimonial-card .author-role { font-size: 12px; color: var(--text-tertiary); }

/* Pricing Table */
.wc-pricing {
  display: flex;
  gap: 24px;
  padding: 40px 48px;
  justify-content: center;
  flex-wrap: wrap;
}

.wc-pricing .pricing-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 32px 28px;
  min-width: 260px;
  flex: 1;
  max-width: 340px;
  text-align: center;
  transition: all .2s;
}

.wc-pricing .pricing-card.highlighted {
  border-color: var(--primary);
  box-shadow: 0 0 0 1px var(--primary), var(--elevation-3);
  transform: scale(1.03);
}

.wc-pricing .pricing-card .plan-name { font-size: 14px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.wc-pricing .pricing-card .plan-price { font-size: 40px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.wc-pricing .pricing-card .plan-period { font-size: 13px; color: var(--text-tertiary); margin-bottom: 20px; }

.wc-pricing .pricing-card .plan-features {
  list-style: none;
  text-align: left;
  margin-bottom: 24px;
}

.wc-pricing .pricing-card .plan-features li {
  padding: 6px 0;
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.wc-pricing .pricing-card .plan-features li::before { content: '\2713'; color: var(--success); font-weight: 700; }

.wc-pricing .pricing-card .plan-cta {
  width: 100%;
  padding: 10px 0;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--primary);
  background: transparent;
  color: var(--primary);
  font-family: var(--font);
  transition: all .15s;
}

.wc-pricing .pricing-card .plan-cta:hover { background: var(--primary); color: var(--on-primary); }
.wc-pricing .pricing-card.highlighted .plan-cta { background: var(--primary); color: var(--on-primary); }

/* Form */
.wc-form {
  padding: 40px 48px;
  max-width: 560px;
  margin: 0 auto;
}

.wc-form .form-group { margin-bottom: 20px; }
.wc-form .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.wc-form .form-group input,
.wc-form .form-group textarea,
.wc-form .form-group select {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-family: var(--font);
  outline: none;
  transition: border-color .2s;
}

.wc-form .form-group input:focus,
.wc-form .form-group textarea:focus,
.wc-form .form-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,99,255,.15); }

.wc-form .form-group textarea { min-height: 100px; resize: vertical; }

.wc-form .form-submit {
  padding: 10px 28px;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: var(--on-primary);
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  transition: background .15s;
}

.wc-form .form-submit:hover { background: var(--primary-dark); }

/* Footer */
.wc-footer {
  background: #1a1a2e;
  color: #94A3B8;
  padding: 48px 48px 24px;
}

.wc-footer .footer-columns {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 32px;
  margin-bottom: 32px;
}

.wc-footer .footer-col .col-title { font-size: 14px; font-weight: 700; color: #E2E8F0; margin-bottom: 12px; }
.wc-footer .footer-col .col-links { list-style: none; }
.wc-footer .footer-col .col-links li { margin-bottom: 8px; }
.wc-footer .footer-col .col-links a { font-size: 13px; color: #64748B; text-decoration: none; cursor: pointer; transition: color .15s; }
.wc-footer .footer-col .col-links a:hover { color: var(--primary-light); }

.wc-footer .footer-bottom {
  border-top: 1px solid rgba(255,255,255,.06);
  padding-top: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.wc-footer .footer-bottom .social-icons { display: flex; gap: 8px; }
.wc-footer .footer-bottom .social-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,.06);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #64748B;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}

.wc-footer .footer-bottom .social-icon:hover { background: var(--primary); color: white; }
.wc-footer .footer-bottom .copyright { font-size: 12px; color: #475569; }

/* CTA Banner */
.wc-cta-banner {
  padding: 48px 48px;
  text-align: center;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
}

.wc-cta-banner .cta-headline { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.wc-cta-banner .cta-subheadline { font-size: 16px; opacity: .85; margin-bottom: 24px; }
.wc-cta-banner .cta-btn {
  padding: 12px 32px;
  border-radius: var(--radius-sm);
  background: white;
  color: var(--primary-dark);
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  font-family: var(--font);
}

/* Blog Grid */
.wc-blog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
  padding: 40px 48px;
}

.wc-blog-grid .blog-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
}

.wc-blog-grid .blog-card:hover { transform: translateY(-2px); box-shadow: var(--elevation-3); }

.wc-blog-grid .blog-card .blog-img {
  width: 100%;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: rgba(255,255,255,.5);
}

.wc-blog-grid .blog-card .blog-body { padding: 16px; }
.wc-blog-grid .blog-card .blog-category { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.wc-blog-grid .blog-card .blog-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.wc-blog-grid .blog-card .blog-excerpt { font-size: 13px; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wc-blog-grid .blog-card .blog-meta { font-size: 12px; color: var(--text-tertiary); margin-top: 10px; }

/* Accordion */
.wc-accordion { padding: 40px 48px; max-width: 720px; margin: 0 auto; }

.wc-accordion .accordion-item {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  overflow: hidden;
}

.wc-accordion .accordion-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  background: var(--surface);
  transition: background .15s;
  user-select: none;
}

.wc-accordion .accordion-header:hover { background: var(--surface-variant); }
.wc-accordion .accordion-header .toggle-icon { font-size: 18px; color: var(--text-tertiary); transition: transform .2s; }
.wc-accordion .accordion-item.open .accordion-header .toggle-icon { transform: rotate(45deg); }
.wc-accordion .accordion-body { padding: 0 18px 14px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; display: none; }
.wc-accordion .accordion-item.open .accordion-body { display: block; }

/* Breadcrumb */
.wc-breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 48px;
  font-size: 13px;
  color: var(--text-tertiary);
}

.wc-breadcrumb a { color: var(--text-secondary); text-decoration: none; cursor: pointer; }
.wc-breadcrumb a:hover { color: var(--primary); }
.wc-breadcrumb .bc-sep { color: var(--text-disabled); }
.wc-breadcrumb .bc-current { font-weight: 700; color: var(--text); }

/* Tabs */
.wc-tabs { padding: 24px 48px; }

.wc-tabs .tab-bar {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: 20px;
}

.wc-tabs .tab-label {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-tertiary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all .15s;
}

.wc-tabs .tab-label:hover { color: var(--text); }
.wc-tabs .tab-label.active { color: var(--primary); border-bottom-color: var(--primary); }
.wc-tabs .tab-content { font-size: 14px; color: var(--text-secondary); line-height: 1.6; min-height: 60px; }

/* Gallery */
.wc-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  padding: 40px 48px;
}

.wc-gallery .gallery-item {
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}

.wc-gallery .gallery-item:hover { transform: scale(1.02); box-shadow: var(--elevation-3); }

.wc-gallery .gallery-item .gallery-img {
  width: 100%;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: rgba(255,255,255,.5);
}

.wc-gallery .gallery-item .gallery-caption { padding: 8px 12px; font-size: 12px; color: var(--text-secondary); background: var(--surface); }

/* Stats Bar */
.wc-stats-bar {
  display: flex;
  justify-content: space-around;
  padding: 40px 48px;
  flex-wrap: wrap;
  gap: 24px;
}

.wc-stats-bar .stat-block { text-align: center; min-width: 120px; }
.wc-stats-bar .stat-block .stat-icon { font-size: 24px; margin-bottom: 8px; }
.wc-stats-bar .stat-block .stat-value { font-size: 36px; font-weight: 800; color: var(--text); }
.wc-stats-bar .stat-block .stat-label { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }

/* Embed */
.wc-embed {
  padding: 40px 48px;
}

.wc-embed .embed-box {
  border: 2px dashed var(--border);
  border-radius: var(--radius-md);
  padding: 40px;

}

.wc-embed .embed-box .embed-icon { font-size: 32px; margin-bottom: 8px; }
.wc-embed .embed-box .embed-label { font-size: 14px; font-weight: 600; }

/* ═══ END WEB MODE ═══════════════════════════════════════════ */

function applyThemePreset(presetId) {
  if (!presetId) return;
  const preset = THEME_PRESETS[presetId];
  if (!preset) return;
  const root = document.documentElement;
  const c = preset.colors;
  const map = {'--primary':c.primary,'--primary-light':c.primary_light,'--primary-dark':c.primary_dark,
    '--primary-container':c.primary_container,'--on-primary':c.on_primary,'--bg':c.background,
    '--surface':c.surface,'--surface-variant':c.surface_variant,'--text':c.text,
    '--text-secondary':c.text_secondary,'--text-tertiary':c.text_tertiary,'--border':c.border,
    '--error':c.error,'--success':c.success};
  Object.entries(map).forEach(([k,v]) => { if(v) root.style.setProperty(k, v); });
  if (preset.radius) {
    Object.entries({'--radius-sm':preset.radius.sm,'--radius-md':preset.radius.md,
      '--radius-lg':preset.radius.lg,'--radius-xl':preset.radius.xl
    }).forEach(([k,v]) => { if(v) root.style.setProperty(k, v); });
  }
  if (preset.font) root.style.setProperty('--font', preset.font);
  renderScreen(currentScreenId);
  showToast('Theme: ' + preset.name, 'success');
}

function initThemePicker() {
  const picker = document.getElementById('themePicker');
  if (!picker) return;
  Object.entries(THEME_PRESETS).forEach(([id, p]) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = p.emoji + ' ' + p.name;
    picker.appendChild(opt);
  });
}

   DATA LOADING
   ═══════════════════════════════════════════════════════════════ */
function loadData() {
  // APP_DATA is embedded inline — no fetch needed, works offline with file:// protocol
  if (!APP_DATA) {
    document.getElementById('screenContent').innerHTML = `
      <div class="c-empty-state">
        <div class="empty-icon">${icon('alert-triangle', 32)}</div>
        <div class="c-text title" style="text-align:center">No data injected</div>
        <div class="c-text body" style="text-align:center">This is the dashboard shell. Run /idea sync to inject screens.json data.</div>
      </div>`;
    return;
  }
  applyProjectMeta();
  applyDesignTokens();
  init();
}

function applyProjectMeta() {
  const meta = (typeof PROJECT_META !== 'undefined' && PROJECT_META.name) ? PROJECT_META : {
    name: APP_DATA.project || 'Prototype',
    screens: APP_DATA.screens ? APP_DATA.screens.length : 0,
    version: APP_DATA.version || '1.0'
  };
  document.getElementById('brandName').textContent = meta.name.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
  document.getElementById('brandMeta').textContent = meta.screens + ' screens';
  document.getElementById('breadcrumbProject').textContent = meta.name;
  document.title = meta.name.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) + ' — Interactive Prototype';
}

function applyDesignTokens() {
  if (!DESIGN_TOKENS) return;
  const root = document.documentElement;
  const c = DESIGN_TOKENS.colors || {};

  // Support both flat (colors.primary) and nested (colors.light.primary) formats
  const light = c.light || {};
  const dark = c.dark || {};
  const custom = c.custom || {};
  const flat = { ...light, ...c }; // flat takes precedence for old format

  // Apply M3 color tokens
  const primary = flat.primary || light.primary;
  if (primary) {
    root.style.setProperty('--primary', primary);
    root.style.setProperty('--accent', primary);
  }
  if (flat.onPrimary || flat.on_primary) root.style.setProperty('--on-primary', flat.onPrimary || flat.on_primary);
  if (flat.surface) root.style.setProperty('--surface', flat.surface);
  if (flat.onSurface || flat.on_surface) root.style.setProperty('--text-primary', flat.onSurface || flat.on_surface);
  if (flat.background) root.style.setProperty('--bg', flat.background);
  if (flat.error) root.style.setProperty('--error', flat.error);
  if (flat.outline) root.style.setProperty('--text-tertiary', flat.outline);
  if (flat.surfaceVariant) root.style.setProperty('--surface-variant', flat.surfaceVariant);
  if (flat.surfaceContainerHigh) root.style.setProperty('--surface-container', flat.surfaceContainerHigh);

  // Custom colors (mood accents)
  if (custom.brandPrimary || custom.moodAccent) {
    root.style.setProperty('--mood-primary', custom.brandPrimary || custom.moodAccent || primary);
  }
  if (custom.success || custom.matchPercentage) {
    root.style.setProperty('--success', custom.success || custom.matchPercentage);
  }

  // Typography
  const t = DESIGN_TOKENS.typography || {};
  if (t.fontFamily || t.font_family) root.style.setProperty('--font', t.fontFamily || t.font_family);

  // Gradients — store for JS use
  const grads = c.gradients || {};
  if (grads.moodPrimary) {
    window._moodGradient = `linear-gradient(135deg, ${grads.moodPrimary[0]}, ${grads.moodPrimary[1]})`;
  }
}
