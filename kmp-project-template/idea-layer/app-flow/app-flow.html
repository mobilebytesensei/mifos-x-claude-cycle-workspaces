function switchMainTab(tab) {
  currentMainTab = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));

  document.getElementById('prototypeCanvas').style.display = tab === 'prototype' ? '' : 'none';
  document.getElementById('flowPanel').style.display = tab === 'flow' ? 'block' : 'none';
  document.getElementById('coveragePanel').style.display = tab === 'coverage' ? 'block' : 'none';
  document.getElementById('apiPanel').style.display = tab === 'api' ? 'block' : 'none';
}

/* ═══════════════════════════════════════════════════════════════
   FLOW DIAGRAM
   ═══════════════════════════════════════════════════════════════ */
function buildFlowDiagram() {
  const panel = document.getElementById('flowPanel');
  // Always compute from screen data — never "No data"
  const connections = [];
  APP_DATA.screens.forEach(screen => {
    screen.components.forEach(comp => {
      if (comp.target) connections.push({ from: screen.id, to: comp.target, via: comp.label || comp.type });
      if (Array.isArray(comp.items)) comp.items.forEach(item => {
        if (item && item.target) connections.push({ from: screen.id, to: item.target, via: item.label || 'item' });
      });
      if (Array.isArray(comp.actions)) comp.actions.forEach(act => {
        if (act && act.target) connections.push({ from: screen.id, to: act.target, via: act.label || 'action' });
      });
    });
  });

  let html = '<div style="max-width:900px">';
  html += '<h3 style="color:#E2E8F0;margin-bottom:8px;font-size:18px">Navigation Flow Graph</h3>';
  html += `<p style="color:#64748B;margin-bottom:24px;font-size:13px">${APP_DATA.screens.length} screens, ${connections.length} connections. Click any node to navigate.</p>`;

  // Feature-level flow from flow_diagram if available
  if (APP_DATA.flow_diagram && APP_DATA.flow_diagram.nodes) {
    html += '<div style="margin-bottom:28px">';
    html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748B;margin-bottom:12px">Feature Flow</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">';
    APP_DATA.flow_diagram.nodes.forEach(n => {
      const sc = n.status==='implemented'?'#10B981':n.status==='designed'?'#6C63FF':'#F59E0B';
      html += `<div class="flow-node" style="border-left:3px solid ${sc}"><span style="font-weight:600">${n.name}</span><span style="font-size:10px;color:#475569">${n.screens} screens</span></div>`;
    });
    html += '</div>';
    if (APP_DATA.flow_diagram.edges) {
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
      APP_DATA.flow_diagram.edges.forEach(e => {
        html += `<span style="font-size:11px;color:#64748B;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)">${e.from} <span style="color:#475569">\u2192</span> ${e.to} <span style="color:#334155;font-size:9px">${e.label||''}</span></span>`;
      });
      html += '</div>';
    }
    html += '</div>';
  }

  // Screen-level grouped by feature
  const grouped = {};
  APP_DATA.screens.forEach(s => { const f=s.feature||'other'; if(!grouped[f])grouped[f]=[]; grouped[f].push(s); });
  html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748B;margin-bottom:12px">Screen Navigation</div>';
  Object.entries(grouped).forEach(([feature, screens]) => {
    const fc = connections.filter(c => screens.some(s => s.id === c.from));
    html += `<div style="margin-bottom:20px"><div style="font-size:12px;font-weight:600;color:#94A3B8;margin-bottom:8px">${feature.replace(/-/g,' ')} <span style="color:#475569;font-weight:400">(${screens.length} screens, ${fc.length} links)</span></div><div style="display:flex;flex-wrap:wrap;gap:6px">`;
    screens.forEach(s => {
      const out=connections.filter(c=>c.from===s.id).length, inn=connections.filter(c=>c.to===s.id).length;
      const sc = s.status==='implemented'?'#10B981':s.status==='designed'?'#6C63FF':'#F59E0B';
      html += `<div class="flow-node" onclick="switchMainTab('prototype');navigateTo('${s.id}')" title="In:${inn} Out:${out}" style="border-left:3px solid ${sc}">${s.name}<span style="font-size:10px;color:#475569">${out}\u2192 \u2190${inn}</span></div>`;
    });
    html += '</div></div>';
  });

  html += `<div style="margin-top:24px;padding:16px;background:rgba(255,255,255,.03);border-radius:12px;border:1px solid rgba(255,255,255,.06)">`;
  html += `<h4 style="color:#E2E8F0;margin-bottom:10px;font-size:13px">All Connections (${connections.length})</h4><div style="max-height:250px;overflow-y:auto">`;
  connections.forEach(c => {
    html += `<div style="padding:3px 0;font-size:12px;color:#94A3B8;display:flex;align-items:center;gap:8px"><span style="cursor:pointer;color:#C4B5FD" onclick="switchMainTab('prototype');navigateTo('${c.from}')">${c.from}</span><span style="color:#475569">\u2192</span><span style="cursor:pointer;color:#C4B5FD" onclick="switchMainTab('prototype');navigateTo('${c.to}')">${c.to}</span><span style="color:#334155;font-size:10px">${c.via}</span></div>`;
  });
  html += '</div></div></div>';
  panel.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════
   COVERAGE
   ═══════════════════════════════════════════════════════════════ */
function buildCoverage() {
  const panel = document.getElementById('coveragePanel');
  // Always compute from screen data — never "No data"
  const total = APP_DATA.screens.length;
  const implemented = APP_DATA.screens.filter(s => s.status === 'implemented').length;
  const designed = APP_DATA.screens.filter(s => s.status === 'designed').length;
  const planned = total - implemented - designed;
  const cov = APP_DATA.coverage || {};

  let html = '<div style="max-width:600px">';
  html += '<h3 style="color:#E2E8F0;margin-bottom:24px;font-size:18px">Feature Coverage</h3>';

  html += `<div class="coverage-card"><h4>Overall Screen Status</h4>
    <div style="display:flex;gap:20px;margin-bottom:16px">
      <div class="c-stat"><div class="stat-value" style="color:#10B981">${implemented}</div><div class="stat-label">Implemented</div></div>
      <div class="c-stat"><div class="stat-value" style="color:#6C63FF">${designed}</div><div class="stat-label">Designed</div></div>
      <div class="c-stat"><div class="stat-value" style="color:#F59E0B">${planned}</div><div class="stat-label">Planned</div></div>
      <div class="c-stat"><div class="stat-value">${total}</div><div class="stat-label">Total</div></div>
    </div>
    <div class="coverage-bar"><div class="coverage-bar-fill" style="width:${total?Math.round(implemented/total*100):0}%;background:linear-gradient(90deg,#10B981,#059669)"></div></div>
    <div class="coverage-stat"><span>Implementation Progress</span><span>${total?Math.round(implemented/total*100):0}%</span></div></div>`;

  // Per-feature — always computed from screens
  const features = {};
  APP_DATA.screens.forEach(s => {
    const f=s.feature||'other';
    if(!features[f]) features[f]={total:0,implemented:0,designed:0,planned:0};
    features[f].total++;
    if(s.status==='implemented') features[f].implemented++;
    else if(s.status==='designed') features[f].designed++;
    else features[f].planned++;
  });

  Object.entries(features).sort((a,b)=>b[1].total-a[1].total).forEach(([feature, data]) => {
    const pct = data.total ? Math.round(data.implemented/data.total*100) : 0;
    const color = pct>=80?'#10B981':pct>=50?'#F59E0B':'#EF4444';
    html += `<div class="coverage-card"><h4 style="display:flex;justify-content:space-between">${feature.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase())} <span style="font-size:12px;font-weight:400;color:#64748B">${data.implemented}/${data.total} impl</span></h4>
      <div class="coverage-bar"><div class="coverage-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="coverage-stat"><span>${data.designed} designed, ${data.planned} planned</span><span>${pct}%</span></div></div>`;
  });

  // Version roadmap from coverage data
  if (cov.versions && cov.versions.length) {
    html += '<div style="margin-top:16px"><h4 style="color:#E2E8F0;margin-bottom:12px;font-size:14px">Version Roadmap</h4>';
    cov.versions.forEach(v => {
      const sc = v.status==='complete'?'#10B981':v.status==='designed'?'#6C63FF':'#F59E0B';
      html += `<div class="coverage-card" style="border-left:3px solid ${sc}"><h4>${v.version} \u2014 ${v.name} <span style="font-size:11px;font-weight:400;color:${sc}">${v.status}</span></h4>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${(v.features||[]).map(f=>`<span style="font-size:11px;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.04);color:#94A3B8">${f}</span>`).join('')}</div></div>`;
    });
    html += '</div>';
  }

  // Layer progress from coverage data
  if (cov.layers) {
    html += '<div style="margin-top:16px"><h4 style="color:#E2E8F0;margin-bottom:12px;font-size:14px">Layer Progress</h4>';
    Object.entries(cov.layers).forEach(([layer, data]) => {
      const pct = data.pct||(data.total?Math.round(data.done/data.total*100):0);
      const color = pct>=80?'#10B981':pct>=50?'#F59E0B':'#EF4444';
      html += `<div class="coverage-card"><h4 style="display:flex;justify-content:space-between">${layer} <span style="font-size:12px;font-weight:400;color:#64748B">${data.done||0}/${data.total||0}</span></h4>
        <div class="coverage-bar"><div class="coverage-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="coverage-stat"><span>Progress</span><span>${pct}%</span></div></div>`;
    });
    html += '</div>';
  }

  // Tag coverage
  const totalComps = APP_DATA.screens.reduce((sum,s)=>sum+s.components.length,0);
  const taggedComps = APP_DATA.screens.reduce((sum,s)=>sum+s.components.filter(c=>c.tag).length,0);
  const tagPct = totalComps?Math.round(taggedComps/totalComps*100):0;
  html += `<div class="coverage-card"><h4>Tag Coverage</h4>
    <div class="coverage-bar"><div class="coverage-bar-fill" style="width:${tagPct}%;background:linear-gradient(90deg,var(--primary),var(--primary-light))"></div></div>
    <div class="coverage-stat"><span>${taggedComps}/${totalComps} components tagged</span><span>${tagPct}%</span></div></div>`;

  html += '</div>';
  panel.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════
   API PANEL (Server Requirements)
   ═══════════════════════════════════════════════════════════════ */
function buildApiPanel() {
  const panel = document.getElementById('apiPanel');
  if (!SERVER_DATA) {
    panel.innerHTML = '<div style="max-width:600px;text-align:center;padding:80px 40px"><div style="font-size:48px;margin-bottom:16px;opacity:.3">&#128268;</div><h3 style="color:#64748B;font-size:16px;margin-bottom:8px">No Server Data</h3><p style="color:#475569;font-size:13px">This project has no server backends configured.<br>Add <code>server.backends</code> to PROJECT_CONFIG.yaml and run <code>/idea sync</code>.</p></div>';
    return;
  }

  const stats = SERVER_DATA.stats || {};
  const endpoints = SERVER_DATA.endpoints || [];
  const groups = SERVER_DATA.endpoint_groups || [];
  const covPct = stats.coverage_pct || 0;
  const covColor = covPct >= 80 ? '#10B981' : covPct >= 50 ? '#F59E0B' : '#EF4444';

  let html = '<div style="max-width:700px">';
  html += '<h3 style="color:#E2E8F0;margin-bottom:24px;font-size:18px">Server Requirements (SFRs)</h3>';

  // Coverage Summary
  html += `<div class="api-group-card"><h4>API Coverage</h4>
    <div style="display:flex;gap:20px;margin-bottom:16px">
      <div class="c-stat"><div class="stat-value">${stats.total_sfrs || 0}</div><div class="stat-label">Total SFRs</div></div>
      <div class="c-stat"><div class="stat-value" style="color:#10B981">${stats.mapped || 0}</div><div class="stat-label">Mapped</div></div>
      <div class="c-stat"><div class="stat-value" style="color:#EF4444">${stats.unmapped || 0}</div><div class="stat-label">Unmapped</div></div>
      <div class="c-stat"><div class="stat-value" style="color:#818CF8">${stats.groups || 0}</div><div class="stat-label">Groups</div></div>
    </div>
    <div class="coverage-bar"><div class="coverage-bar-fill" style="width:${covPct}%;background:${covColor}"></div></div>
    <div class="coverage-stat"><span>Screen Binding Coverage</span><span>${covPct}%</span></div></div>`;

  // Endpoint Groups
  if (groups.length) {
    html += '<div style="margin-top:8px"><h4 style="color:#E2E8F0;margin-bottom:12px;font-size:14px">Endpoint Groups</h4>';
    groups.forEach(g => {
      html += `<div class="api-group-card"><h4 style="display:flex;align-items:center;gap:10px">${g.id} <span class="api-strategy-badge">${g.strategy || 'default'}</span> <span style="font-size:11px;color:#64748B">${(g.endpoints||[]).length} endpoints</span></h4>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${(g.endpoints||[]).map(e => `<span style="font-size:11px;padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.04);color:#94A3B8;cursor:pointer" onclick="toggleApiDetail('${e}')">${e}</span>`).join('')}</div></div>`;
    });
    html += '</div>';
  }

  // All Endpoints
  html += '<div style="margin-top:8px"><h4 style="color:#E2E8F0;margin-bottom:12px;font-size:14px">All Endpoints</h4>';
  endpoints.forEach(ep => {
    const method = (ep.method || 'GET').toLowerCase();
    const screenCount = (ep.screens || []).length;
    const screenColor = screenCount > 0 ? '#10B981' : '#EF4444';
    html += `<div class="api-endpoint-row" onclick="toggleApiDetail('${ep.id}')">
      <span class="api-method-badge api-method-${method}">${ep.method || 'GET'}</span>
      <span style="font-size:12px;color:#A5B4FC;font-weight:600;min-width:65px">${ep.id}</span>
      <span style="font-size:12px;color:#CBD5E1;flex:1">${ep.name || ''}</span>
      <span style="font-size:11px;color:${screenColor}">${screenCount} screen${screenCount !== 1 ? 's' : ''}</span>
    </div>
    <div class="api-detail-expand" id="api-detail-${ep.id}">
      <div style="display:grid;grid-template-columns:80px 1fr;gap:6px 12px">
        ${ep.base_url ? `<span style="color:#64748B">Base URL</span><span style="color:#CBD5E1;font-family:monospace;font-size:11px">${ep.base_url}</span>` : ''}
        ${ep.path ? `<span style="color:#64748B">Path</span><span style="color:#CBD5E1;font-family:monospace;font-size:11px">${ep.path}</span>` : ''}
        ${ep.auth ? `<span style="color:#64748B">Auth</span><span style="color:#CBD5E1">${ep.auth}</span>` : ''}
        ${ep.group ? `<span style="color:#64748B">Group</span><span style="color:#CBD5E1">${ep.group}</span>` : ''}
        ${ep.feature ? `<span style="color:#64748B">Feature</span><span style="color:#CBD5E1">${ep.feature}</span>` : ''}
        ${ep.request ? `<span style="color:#64748B">Request</span><span style="color:#CBD5E1;font-family:monospace;font-size:11px">${ep.request}</span>` : ''}
        ${ep.response ? `<span style="color:#64748B">Response</span><span style="color:#CBD5E1;font-family:monospace;font-size:11px">${ep.response}</span>` : ''}
        ${ep.errors ? `<span style="color:#64748B">Errors</span><span style="color:#F59E0B">${ep.errors}</span>` : ''}
      </div>
      ${screenCount > 0 ? `<div style="margin-top:8px"><span style="color:#64748B;font-size:11px">Linked screens:</span> ${ep.screens.map(s => `<span style="font-size:11px;color:#C4B5FD;cursor:pointer;text-decoration:underline;margin-left:6px" onclick="event.stopPropagation();switchMainTab('prototype');navigateTo('${s}')">${s}</span>`).join('')}</div>` : ''}
    </div>`;
  });
  html += '</div>';

  // Unmapped SFRs
  const unmapped = endpoints.filter(ep => !(ep.screens && ep.screens.length));
  if (unmapped.length) {
    html += `<div class="api-unmapped" style="margin-top:16px"><h4 style="color:#EF4444;margin-bottom:12px;font-size:14px;display:flex;align-items:center;gap:8px">Unmapped SFRs <span style="font-size:11px;font-weight:400;color:#94A3B8">${unmapped.length} need screen bindings</span></h4>`;
    unmapped.forEach(ep => {
      html += `<div style="padding:4px 0;display:flex;align-items:center;gap:8px">
        <span class="api-method-badge api-method-${(ep.method||'GET').toLowerCase()}">${ep.method||'GET'}</span>
        <span style="font-size:12px;color:#A5B4FC;font-weight:600">${ep.id}</span>
        <span style="font-size:12px;color:#94A3B8">${ep.name || ''}</span>
      </div>`;
    });
    html += '</div>';
  }

  html += '</div>';
  panel.innerHTML = html;
}

function toggleApiDetail(id) {
  const el = document.getElementById('api-detail-' + id);
  if (el) el.classList.toggle('open');
}

/* ═══════════════════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modalOverlay').classList.remove('visible');
  }
  if (e.key === 'Backspace' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    navigateBack();
  }
  if (e.key === 't' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    toggleTags();
  }
  if (e.key === 'i' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    toggleInspector();
  }
  if (e.key === 's' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    toggleSfrPanel();
  }
});

   BOOT
   ═══════════════════════════════════════════════════════════════ */
loadData();
</script>
