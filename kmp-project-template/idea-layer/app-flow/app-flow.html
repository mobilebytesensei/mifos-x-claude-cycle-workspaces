/* ═══════════════════════════════════════════════════════════════
   SIDEBAR SCREEN LIST
   ═══════════════════════════════════════════════════════════════ */
function buildScreenList() {
  const list = document.getElementById('screenList');
  const grouped = {};

  APP_DATA.screens.forEach(s => {
    const feature = s.feature || 'other';
    if (!grouped[feature]) grouped[feature] = [];
    grouped[feature].push(s);
  });

  let html = '';
  let colorIdx = 0;

  Object.entries(grouped).forEach(([feature, screens]) => {
    html += `<div class="screen-group-label">${feature.replace(/-/g, ' ')}</div>`;
    screens.forEach(s => {
      const statusColors = {
        implemented: '#10B981',
        designed: '#6C63FF',
        planned: '#F59E0B',
        'not-started': '#64748B'
      };
      const dotColor = statusColors[s.status] || '#64748B';
      html += `
        <div class="screen-item${s.id === currentScreenId ? ' active' : ''}"
             data-id="${s.id}" onclick="navigateTo('${s.id}')">
          <span class="dot" style="background:${dotColor}"></span>
          <span class="screen-name">${s.name}</span>
          <span class="screen-count">${s.components.length}</span>${s.states ? `<span class="screen-count" style="background:rgba(99,102,241,.2);color:#C4B5FD;margin-left:2px">${Object.keys(s.states).length}s</span>` : ''}${s.components.some(c => c.api) ? '<span class="api-screen-dot" title="Has API dependencies"></span>' : ''}
        </div>`;
    });
    colorIdx++;
  });

  list.innerHTML = html;
  document.getElementById('screenCount').textContent = `${APP_DATA.screens.length} screens`;
}

function filterScreens(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.screen-item').forEach(item => {
    const name = item.querySelector('.screen-name').textContent.toLowerCase();
    const id = item.dataset.id.toLowerCase();
    item.style.display = (name.includes(q) || id.includes(q)) ? '' : 'none';
  });

  document.querySelectorAll('.screen-group-label').forEach(label => {
    const next = [];
    let sib = label.nextElementSibling;
    while (sib && !sib.classList.contains('screen-group-label')) {
      if (sib.classList.contains('screen-item')) next.push(sib);
      sib = sib.nextElementSibling;
    }
    label.style.display = next.some(n => n.style.display !== 'none') ? '' : 'none';
  });
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════════════ */
function navigateTo(screenId, pushHistory = true) {
  const screen = APP_DATA.screens.find(s => s.id === screenId);
  if (!screen) {
    showToast(`Screen "${screenId}" not found`, 'error');
    return;
  }

  if (pushHistory && currentScreenId !== screenId) {
    history.push(currentScreenId);
  }
  currentScreenId = screenId;
  currentState = ''; // Reset state when navigating to new screen

  renderScreen(screenId);
  updateSidebarActive();
  document.getElementById('breadcrumbScreen').textContent = screen.name;

  if (showInspector) updateInspector(screen);
  if (showSfrPanel) updateSfrPanel(screen.id);
}

function navigateBack() {
  if (history.length > 0) {
    const prev = history.pop();
    navigateTo(prev, false);
    animateScreen('back');
  }
}

function updateSidebarActive() {
  document.querySelectorAll('.screen-item').forEach(item => {
    item.classList.toggle('active', item.dataset.id === currentScreenId);
  });
}

function animateScreen(direction = 'forward') {
  const content = document.getElementById('screenContent');
  content.classList.remove('screen-enter', 'screen-enter-back');
  void content.offsetWidth;
  content.classList.add(direction === 'back' ? 'screen-enter-back' : 'screen-enter');
}

/* ═══════════════════════════════════════════════════════════════
   SCREEN RENDERER
   ═══════════════════════════════════════════════════════════════ */
let currentState = '';

function switchState(stateId) {
  currentState = stateId;
  const content = document.getElementById('screenContent');
  content.classList.remove('state-enter');
  void content.offsetWidth;
  content.classList.add('state-enter');
  renderScreen(currentScreenId);
  // Update dropdown to match
  const picker = document.getElementById('statePicker');
  if (picker) picker.value = stateId || '';
}

function populateStateDropdown(screen) {
  const picker = document.getElementById('statePicker');
  picker.innerHTML = '';

  if (screen.states && Object.keys(screen.states).length > 0) {
    const defOpt = document.createElement('option');
    defOpt.value = '';
    defOpt.textContent = 'State: Default';
    picker.appendChild(defOpt);

    Object.entries(screen.states).forEach(([id, state]) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = (state.name || id);
      picker.appendChild(opt);
    });
    picker.disabled = false;
    picker.style.opacity = '1';
    picker.value = currentState;
  } else {
    const defOpt = document.createElement('option');
    defOpt.value = '';
    defOpt.textContent = 'State: Default (only)';
    picker.appendChild(defOpt);
    picker.disabled = true;
    picker.style.opacity = '0.5';
    currentState = '';
  }
}

function renderScreen(screenId) {
  const screen = APP_DATA.screens.find(s => s.id === screenId);
  if (!screen) return;

  // Populate state dropdown
  populateStateDropdown(screen);

  // Determine which components to render (default or state-specific)
  let components = screen.components;
  if (currentState && screen.states && screen.states[currentState]) {
    components = screen.states[currentState].components;
  }

  /* ═══ WEB MODE — Render into browser frame ═══ */
  if (isWeb) {
    const webContentEl = document.getElementById('webScreenContent');
    const tagClass = showTags ? 'show-tags' : '';
    let html = `<div class="${tagClass}">`;

    components.forEach((comp, idx) => {
      html += renderComponent(comp, idx, screen);
    });

    html += '</div>';
    webContentEl.innerHTML = html;

    // Update browser URL bar with screen route
    const route = screen.route || screen.path || '/' + screenId.replace(/_/g, '/');
    const domain = APP_DATA.domain || APP_DATA.project || 'example.com';
    document.getElementById('browserUrlText').textContent = `https://${domain}${route}`;

    animateScreen('forward');
    return;
  }
  /* ═══ END WEB MODE ═══ */

  const contentEl = document.getElementById('screenContent');
  const tagClass = showTags ? 'show-tags' : '';

  let html = `<div class="${tagClass}">`;

  components.forEach((comp, idx) => {
    html += renderComponent(comp, idx, screen);
  });

  html += '<div class="c-spacer-lg"></div>';
  html += '</div>';

  contentEl.innerHTML = html;

  // Determine bottom-nav visibility FIRST (needed for FAB positioning)
  const navTargets = (APP_DATA.nav_bar?.items || []).map(i => i.target);
  const screensWithNavComp = (APP_DATA.screens || []).filter(s => s.components?.some(c => c.type === 'bottom-nav')).map(s => s.id);
  const navScreens = [...new Set([...navTargets, ...screensWithNavComp])];
  const hasBottomNav = APP_DATA.nav_bar && navScreens.includes(screenId);
  const navContainer = document.getElementById('bottomNavContainer');

  if (hasBottomNav) {
    navContainer.innerHTML = renderBottomNav(screenId);
    navContainer.style.display = '';
  } else {
    navContainer.innerHTML = '';
    navContainer.style.display = 'none';
  }

  // FAB — render as overlay, position depends on whether bottom-nav is visible
  const fabContainer = document.getElementById('fabContainer');
  const fabComp = screen.components.find(c => c.type === 'fab');
  if (fabComp) {
    const fabTag = fabComp.tag ? ` data-tag="${fabComp.tag}"` : '';
    const fabClick = fabComp.target ? `navigateTo('${fabComp.target}')` : `showToast('${(fabComp.label||'Add').replace(/'/g,"\\'")}')`;
    const fabNavClass = hasBottomNav ? '' : ' no-nav';
    fabContainer.innerHTML = `<button class="c-fab${fabNavClass}" onclick="${fabClick}"${fabTag}>${showTags && fabComp.tag ? `<span class="tag-label">${fabComp.tag}</span>` : ''}${icon(fabComp.icon || 'plus', 24)}</button>`;
    fabContainer.style.display = '';
    contentEl.style.paddingBottom = '80px';
  } else {
    fabContainer.innerHTML = '';
    fabContainer.style.display = 'none';
    contentEl.style.paddingBottom = '';
  }

  animateScreen('forward');
}

function renderComponent(comp, idx, screen) {
  const tagHtml = comp.tag ? `<span class="tag-badge">${comp.tag}</span>` : '';

  switch (comp.type) {
    case 'header': return renderHeader(comp, tagHtml);
    case 'text': return renderText(comp, tagHtml);
    case 'button': return renderButton(comp, tagHtml);
    case 'input': return renderInput(comp, tagHtml);
    case 'card': return renderCard(comp, tagHtml, idx);
    case 'list': return renderList(comp, tagHtml, idx);
    case 'toggle': return renderToggle(comp, tagHtml);
    case 'section': return renderSection(comp, tagHtml);
    case 'divider': return `<div class="c-divider" style="position:relative">${tagHtml}</div>`;
    case 'image': return renderImage(comp, tagHtml, idx);
    case 'chip': return renderChip(comp, tagHtml);
    case 'chips': case 'chip-group': case 'chip_group': return renderChips(comp, tagHtml);
    case 'picker': return renderPicker(comp, tagHtml);
    case 'slider': return renderSlider(comp, tagHtml);
    case 'progress': return renderProgress(comp, tagHtml);
    case 'media_player': case 'media-player': return renderMediaPlayer(comp, tagHtml);
    case 'avatar': return renderAvatar(comp, tagHtml, idx);
    case 'stats': case 'stat': return renderStats(comp, tagHtml);
    case 'search_bar': case 'search-bar': return renderSearchBar(comp, tagHtml);
    case 'tab_bar': case 'tab-bar': return renderTabBar(comp, tagHtml);
    case 'spacer': return '<div class="c-spacer"></div>';
    case 'grid': return renderGrid(comp, tagHtml, idx);
    case 'loader': return renderLoader(comp, tagHtml);
    case 'lottie': return renderLottie(comp, tagHtml);
    case 'shimmer': return renderShimmer(comp, tagHtml);
    case 'circular-progress': case 'circular_progress': return renderCircularProgress(comp, tagHtml);
    case 'fab': return ''; // FAB rendered as overlay outside screen-content
    case 'bottom-nav': return ''; // Bottom-nav rendered by bottomNavContainer
    case 'empty_state': case 'empty-state': {
      // Hide empty-state if sibling list has items (production-like behavior)
      const hasListWithItems = screen.components.some(c =>
        c.type === 'list' && c.items && c.items.length > 0
      );
      return hasListWithItems ? '' : renderEmptyState(comp, tagHtml);
    }
    /* ═══ WEB MODE — Web Component Types ═══ */
    case 'nav-bar':              return renderWebComponent(comp, tagHtml);
    case 'hero':                 return renderWebComponent(comp, tagHtml);
    case 'card-grid':            return renderWebComponent(comp, tagHtml);
    case 'feature-grid':         return renderWebComponent(comp, tagHtml);
    case 'testimonial-slider':   return renderWebComponent(comp, tagHtml);
    case 'pricing-table':        return renderWebComponent(comp, tagHtml);
    case 'form':                 return renderWebComponent(comp, tagHtml);
    case 'footer':               return renderWebComponent(comp, tagHtml);
    case 'cta-banner':           return renderWebComponent(comp, tagHtml);
    case 'blog-grid':            return renderWebComponent(comp, tagHtml);
    case 'accordion':            return renderWebComponent(comp, tagHtml);
    case 'breadcrumb':           return renderWebComponent(comp, tagHtml);
    case 'tabs':                 return renderWebComponent(comp, tagHtml);
    case 'gallery':              return renderWebComponent(comp, tagHtml);
    case 'stats-bar':            return renderWebComponent(comp, tagHtml);
    case 'embed':                return renderWebComponent(comp, tagHtml);
    /* ═══ END WEB MODE ═══ */
    default:
      if (comp.label || comp.content || comp.title) {
        return renderText({ ...comp, style: comp.style || 'body', content: comp.label || comp.content || comp.title }, tagHtml);
      }
      return '';
  }
}

/* ═══════════════════════════════════════════════════════════════
   WEB MODE — Web Component Renderer
   ═══════════════════════════════════════════════════════════════ */
function renderWebComponent(comp, tagHtml) {
  switch (comp.type) {

    case 'nav-bar': {
      const links = (comp.links || comp.items || []).map(l =>
        `<a onclick="${l.target ? `navigateTo('${l.target}')` : `showToast('${(l.label||'').replace(/'/g,"\\'")}')`}">${l.label || l.text || ''}</a>`
      ).join('');
      const cta = comp.cta || comp.button;
      return `<div class="wc-nav-bar" style="position:relative">${tagHtml}
        <span class="nav-logo">${comp.logo || comp.title || 'Brand'}</span>
        <div class="nav-links">${links}</div>
        ${cta ? `<button class="nav-cta" onclick="${cta.target ? `navigateTo('${cta.target}')` : `showToast('${(cta.label||'CTA').replace(/'/g,"\\'")}')`}">${cta.label || 'Get Started'}</button>` : ''}
      </div>`;
    }

    case 'hero': {
      const align = comp.align === 'left' ? ' left-aligned' : '';
      const btns = (comp.buttons || comp.actions || []);
      let btnHtml = '';
      if (btns.length > 0) {
        btnHtml = btns.map((b, i) => {
          const cls = i === 0 ? 'btn-primary' : 'btn-secondary';
          const onclick = b.target ? `navigateTo('${b.target}')` : `showToast('${(b.label||'').replace(/'/g,"\\'")}')`;
          return `<button class="${cls}" onclick="${onclick}">${b.label || 'Action'}</button>`;
        }).join('');
      } else if (comp.button_label || comp.cta) {
        const lbl = comp.button_label || (typeof comp.cta === 'string' ? comp.cta : (comp.cta && comp.cta.label) || 'Get Started');
        btnHtml = `<button class="btn-primary" onclick="showToast('${lbl.replace(/'/g,"\\'")}')">${lbl}</button>`;
      }
      return `<div class="wc-hero${align}" style="position:relative">${tagHtml}
        <div class="hero-headline">${comp.headline || comp.title || 'Welcome'}</div>
        ${comp.subheadline || comp.subtitle ? `<div class="hero-subheadline">${comp.subheadline || comp.subtitle}</div>` : ''}
        ${btnHtml ? `<div class="hero-actions">${btnHtml}</div>` : ''}
      </div>`;
    }

    case 'card-grid': {
      const cards = (comp.cards || comp.items || []).map((c, i) => {
        const grad = GRADIENTS[i % GRADIENTS.length];
        const onclick = c.target ? `navigateTo('${c.target}')` : `showToast('${(c.title||'Card').replace(/'/g,"\\'")}')`;
        const badges = (c.badges || []).map(b => `<span class="badge-pill">${b}</span>`).join('');
        return `<div class="grid-card" onclick="${onclick}">
          <div class="card-img" style="background:${grad}">${c.image ? c.image : ''}</div>
          <div class="card-body">
            <div class="card-title">${c.title || ''}</div>
            ${c.description ? `<div class="card-desc">${c.description}</div>` : ''}
            ${badges ? `<div class="card-badges">${badges}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      return `<div style="position:relative">${tagHtml}
        ${comp.title ? `<div class="wc-section-title">${comp.title}</div>` : ''}
        ${comp.subtitle ? `<div class="wc-section-subtitle">${comp.subtitle}</div>` : ''}
        <div class="wc-card-grid">${cards}</div>
      </div>`;
    }

    case 'feature-grid': {
      const features = (comp.features || comp.items || []).map(f =>
        `<div class="feature-block">
          <div class="feature-icon">${f.icon || f.emoji || '&#9733;'}</div>
          <div class="feature-title">${f.title || ''}</div>
          <div class="feature-desc">${f.description || ''}</div>
        </div>`
      ).join('');
      return `<div style="position:relative">${tagHtml}
        ${comp.title ? `<div class="wc-section-title">${comp.title}</div>` : ''}
        ${comp.subtitle ? `<div class="wc-section-subtitle">${comp.subtitle}</div>` : ''}
        <div class="wc-feature-grid">${features}</div>
      </div>`;
    }

    case 'testimonial-slider': {
      const items = (comp.testimonials || comp.items || []).map(t => {
        const initials = (t.author || t.name || 'A').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        return `<div class="testimonial-card">
          <div class="quote">${t.quote || t.text || ''}</div>
          <div class="author-row">
            <div class="author-avatar">${initials}</div>
            <div>
              <div class="author-name">${t.author || t.name || ''}</div>
              <div class="author-role">${t.role || t.company || ''}</div>
            </div>
          </div>
        </div>`;
      }).join('');
      return `<div style="position:relative">${tagHtml}
        ${comp.title ? `<div class="wc-section-title">${comp.title}</div>` : ''}
        <div class="wc-testimonials">${items}</div>
      </div>`;
    }

    case 'pricing-table': {
      const plans = (comp.plans || comp.items || []).map(p => {
        const features = (p.features || []).map(f => `<li>${f}</li>`).join('');
        const highlighted = p.highlighted || p.popular ? ' highlighted' : '';
        const onclick = p.target ? `navigateTo('${p.target}')` : `showToast('${(p.name||'Plan').replace(/'/g,"\\'")}')`;
        return `<div class="pricing-card${highlighted}">
          <div class="plan-name">${p.name || p.title || 'Plan'}</div>
          <div class="plan-price">${p.price || '$0'}</div>
          <div class="plan-period">${p.period || '/month'}</div>
          <ul class="plan-features">${features}</ul>
          <button class="plan-cta" onclick="${onclick}">${p.cta || p.button_label || 'Choose Plan'}</button>
        </div>`;
      }).join('');
      return `<div style="position:relative">${tagHtml}
        ${comp.title ? `<div class="wc-section-title">${comp.title}</div>` : ''}
        ${comp.subtitle ? `<div class="wc-section-subtitle">${comp.subtitle}</div>` : ''}
        <div class="wc-pricing">${plans}</div>
      </div>`;
    }

    case 'form': {
      const fields = (comp.fields || comp.items || []).map(f => {
        const fieldType = f.type || f.input_type || 'text';
        let input;
        if (fieldType === 'textarea') {
          input = `<textarea placeholder="${f.placeholder || ''}">${f.value || ''}</textarea>`;
        } else if (fieldType === 'select') {
          const opts = (f.options || []).map(o => `<option>${o}</option>`).join('');
          input = `<select>${opts}</select>`;
        } else {
          input = `<input type="${fieldType}" placeholder="${f.placeholder || ''}" ${f.value ? `value="${f.value}"` : ''}>`;
        }
        return `<div class="form-group">
          ${f.label ? `<label>${f.label}</label>` : ''}
          ${input}
        </div>`;
      }).join('');
      return `<div class="wc-form" style="position:relative">${tagHtml}
        ${comp.title ? `<div class="wc-section-title">${comp.title}</div>` : ''}
        ${fields}
        <button class="form-submit" onclick="showToast('Form submitted!')">${comp.submit_label || comp.button_label || 'Submit'}</button>
      </div>`;
    }

    case 'footer': {
      const columns = (comp.columns || comp.sections || []).map(col => {
        const links = (col.links || col.items || []).map(l =>
          `<li><a onclick="${l.target ? `navigateTo('${l.target}')` : `showToast('${(l.label||l.text||'').replace(/'/g,"\\'")}')`}">${l.label || l.text || ''}</a></li>`
        ).join('');
        return `<div class="footer-col">
          <div class="col-title">${col.title || ''}</div>
          <ul class="col-links">${links}</ul>
        </div>`;
      }).join('');
      const socials = (comp.social || comp.social_icons || []).map(s =>
        `<span class="social-icon" title="${s.label || s.name || ''}">${(s.label || s.name || 'S')[0].toUpperCase()}</span>`
      ).join('');
      return `<div class="wc-footer" style="position:relative">${tagHtml}
        <div class="footer-columns">${columns}</div>
        <div class="footer-bottom">
          <span class="copyright">${comp.copyright || '&copy; 2025 Company'}</span>
          ${socials ? `<div class="social-icons">${socials}</div>` : ''}
        </div>
      </div>`;
    }

    case 'cta-banner': {
      const onclick = comp.target ? `navigateTo('${comp.target}')` : `showToast('${(comp.button_label||'CTA').replace(/'/g,"\\'")}')`;
      return `<div class="wc-cta-banner" style="position:relative">${tagHtml}
        <div class="cta-headline">${comp.headline || comp.title || 'Ready to get started?'}</div>
        ${comp.subheadline || comp.subtitle ? `<div class="cta-subheadline">${comp.subheadline || comp.subtitle}</div>` : ''}
        <button class="cta-btn" onclick="${onclick}">${comp.button_label || comp.cta || 'Get Started'}</button>
      </div>`;
    }

    case 'blog-grid': {
      const posts = (comp.posts || comp.items || []).map((p, i) => {
        const grad = GRADIENTS[i % GRADIENTS.length];
        const onclick = p.target ? `navigateTo('${p.target}')` : `showToast('${(p.title||'Post').replace(/'/g,"\\'")}')`;
        return `<div class="blog-card" onclick="${onclick}">
          <div class="blog-img" style="background:${grad}">${p.image || ''}</div>
          <div class="blog-body">
            ${p.category ? `<div class="blog-category">${p.category}</div>` : ''}
            <div class="blog-title">${p.title || ''}</div>
            ${p.excerpt ? `<div class="blog-excerpt">${p.excerpt}</div>` : ''}
            <div class="blog-meta">${p.date || ''} ${p.read_time ? '&bull; ' + p.read_time : ''}</div>
          </div>
        </div>`;
      }).join('');
      return `<div style="position:relative">${tagHtml}
        ${comp.title ? `<div class="wc-section-title">${comp.title}</div>` : ''}
        <div class="wc-blog-grid">${posts}</div>
      </div>`;
    }

    case 'accordion': {
      const items = (comp.items || []).map((item, i) => {
        const openClass = i === 0 ? ' open' : '';
        return `<div class="accordion-item${openClass}" onclick="this.classList.toggle('open')">
          <div class="accordion-header">
            <span>${item.question || item.title || ''}</span>
            <span class="toggle-icon">+</span>
          </div>
          <div class="accordion-body">${item.answer || item.content || ''}</div>
        </div>`;
      }).join('');
      return `<div style="position:relative">${tagHtml}
        ${comp.title ? `<div class="wc-section-title">${comp.title}</div>` : ''}
        <div class="wc-accordion">${items}</div>
      </div>`;
    }

    case 'breadcrumb': {
      const crumbs = (comp.items || comp.path || []);
      const html = crumbs.map((c, i) => {
        const isLast = i === crumbs.length - 1;
        if (isLast) return `<span class="bc-current">${c.label || c.text || c}</span>`;
        const onclick = c.target ? `navigateTo('${c.target}')` : '';
        return `<a ${onclick ? `onclick="${onclick}"` : ''}>${c.label || c.text || c}</a><span class="bc-sep">/</span>`;
      }).join('');
      return `<div class="wc-breadcrumb" style="position:relative">${tagHtml}${html}</div>`;
    }

    case 'tabs': {
      const tabs = (comp.tabs || comp.items || []);
      const tabBar = tabs.map((t, i) =>
        `<span class="tab-label${i === 0 ? ' active' : ''}" onclick="switchWebTab(this, '${('wt-' + Math.random().toString(36).slice(2,6))}')">${t.label || t.title || ''}</span>`
      ).join('');
      const content = tabs.length > 0 ? (tabs[0].content || '') : '';
      return `<div class="wc-tabs" style="position:relative">${tagHtml}
        <div class="tab-bar">${tabBar}</div>
        <div class="tab-content">${content}</div>
      </div>`;
    }

    case 'gallery': {
      const items = (comp.images || comp.items || []).map((img, i) => {
        const grad = GRADIENTS[i % GRADIENTS.length];
        return `<div class="gallery-item">
          <div class="gallery-img" style="background:${grad}">${img.alt || img.label || ''}</div>
          ${img.caption ? `<div class="gallery-caption">${img.caption}</div>` : ''}
        </div>`;
      }).join('');
      return `<div style="position:relative">${tagHtml}
        ${comp.title ? `<div class="wc-section-title">${comp.title}</div>` : ''}
        <div class="wc-gallery">${items}</div>
      </div>`;
    }

    case 'stats-bar': {
      const stats = (comp.stats || comp.items || []).map(s =>
        `<div class="stat-block">
          ${s.icon ? `<div class="stat-icon">${s.icon}</div>` : ''}
          <div class="stat-value">${s.value || s.number || '0'}</div>
          <div class="stat-label">${s.label || ''}</div>
        </div>`
      ).join('');
      return `<div style="position:relative">${tagHtml}
        <div class="wc-stats-bar">${stats}</div>
      </div>`;
    }

    case 'embed': {
      return `<div class="wc-embed" style="position:relative">${tagHtml}
        <div class="embed-box">
          <div class="embed-icon">${comp.icon || '&#128230;'}</div>
          <div class="embed-label">Widget: ${comp.service || comp.label || 'External'}</div>
        </div>
      </div>`;
    }

    default: return '';
  }
}

/* ═══ WEB MODE — Tab Switcher Helper ═══ */
function switchWebTab(el, id) {
  const tabsContainer = el.closest('.wc-tabs');
  tabsContainer.querySelectorAll('.tab-label').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function renderHeader(comp, tagHtml) {
  let actions = '';
  if (comp.actions) {
    actions = `<div class="header-actions">${comp.actions.map(a => {
      let onclick;
      if (a.on_click && a.on_click.components) {
        const ocId = 'oc-' + Math.random().toString(36).slice(2,8);
        window['_oc_' + ocId] = a.on_click.components;
        const ocTitle = (a.on_click.title || a.label || '').replace(/'/g, "\\'");
        onclick = a.on_click.type === 'dialog'
          ? `showDialog('${ocTitle}', window['_oc_${ocId}'])`
          : `showSheet('${ocTitle}', window['_oc_${ocId}'])`;
      } else if (a.target) {
        onclick = `navigateTo('${a.target}')`;
      } else {
        onclick = `showToast('${(a.label || a.icon || 'Action').replace(/'/g,"\\'")}')`;
      }
      return `<button class="header-action" onclick="${onclick}" title="${a.label || ''}">${getIcon(a.icon || 'more-vertical')}</button>`;
    }).join('')}</div>`;
  }

  const backClick = comp.back_target ? `navigateTo('${comp.back_target}')` : 'navigateBack()';
  return `
    <div class="c-header" style="position:relative">
      ${tagHtml}
      ${comp.back ? `<button class="back-btn" onclick="${backClick}">${currentPlatform === 'ios' ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>' : icon('arrow-left', 20)}</button>` : ''}
      <span class="header-title">${comp.title || ''}</span>
      ${actions}
    </div>`;
}

function renderText(comp, tagHtml) {
  const styleClass = comp.style || 'body';
  return `<div class="c-text ${styleClass}" style="position:relative">${tagHtml}${comp.content || ''}</div>`;
}

function renderButton(comp, tagHtml) {
  const styles = {
    primary: 'primary',
    secondary: 'secondary',
    outline: 'outline',
    text: 'text-btn',
    danger: 'danger',
    link: 'text-btn',
  };
  const cls = styles[comp.style] || 'secondary';
  let onclick;
  if (comp.on_click && comp.on_click.type === 'state') {
    const ar = comp.on_click.auto_return;
    const lbl = (comp.label||'').replace(/'/g,"\\'");
    onclick = `switchState('${comp.on_click.target||''}');${ar ? `showToast('${lbl}');setTimeout(()=>{switchState('');showToast('Done!','success')},${ar})` : ''}`;
  } else if (comp.on_click && comp.on_click.components) {
    const ocId = 'oc-' + Math.random().toString(36).slice(2,8);
    window['_oc_' + ocId] = comp.on_click.components;
    const ocTitle = (comp.on_click.title || comp.label || '').replace(/'/g, "\\'");
    onclick = comp.on_click.type === 'dialog'
      ? `showDialog('${ocTitle}', window['_oc_${ocId}'])`
      : `showSheet('${ocTitle}', window['_oc_${ocId}'])`;
  } else if (comp.on_click && comp.on_click.type === 'toast') {
    onclick = `showToast('${(comp.on_click.message||comp.label||'').replace(/'/g,"\\'")}')`;
  } else if (comp.target) {
    onclick = `navigateTo('${comp.target}')`;
  } else {
    onclick = `showToast('${(comp.label||'').replace(/'/g,"\\'")}')`;
  }

  return `
    <button class="c-button ${cls}" onclick="${onclick}" style="position:relative">
      ${tagHtml}
      ${comp.icon ? getIcon(comp.icon) : ''}
      ${comp.label || ''}
    </button>`;
}

function renderInput(comp, tagHtml) {
  return `
    <div class="c-input-wrap" style="position:relative">
      ${tagHtml}
      ${comp.label ? `<label class="c-input-label">${comp.label}</label>` : ''}
      <input class="c-input" type="${comp.input_type || 'text'}" placeholder="${comp.placeholder || comp.hint || ''}" ${comp.value ? `value="${comp.value}"` : ''}>
    </div>`;
}

function renderCard(comp, tagHtml, idx) {
  const props = comp.properties || comp;
  const variant = props.variant || '';
  const gradient = props.gradient;
  const onclick = comp.target ? `navigateTo('${comp.target}')` : (comp.on_click ? `showToast('${(comp.title||'Card').replace(/'/g,"\\'")}')` : '');
  const clickAttr = onclick ? `onclick="${onclick}" style="cursor:pointer;position:relative"` : `style="position:relative"`;

  // Mood gradient card
  if (gradient || variant === 'mood_info' || variant === 'mood_display') {
    const bg = gradient === 'moodPrimary' ? 'linear-gradient(135deg, var(--accent,#7A5CFF), #DA45FF)'
             : gradient === 'moodDeep' ? 'linear-gradient(135deg, #7A5CFF, #4A2DB5)'
             : `linear-gradient(135deg, ${getGradient(idx)})`;
    const fields = props.fields || [];
    let content = '';
    fields.forEach(f => {
      if (typeof f === 'string') {
        content += `<div style="font-size:11px;opacity:0.9">${f}</div>`;
      } else if (f.type === 'emoji') {
        content += `<div style="font-size:28px">${f.content_example || '😊'}</div>`;
      } else if (f.type === 'text') {
        const s = f.style === 'title-large' ? 'font-size:16px;font-weight:700' : 'font-size:12px;opacity:0.9';
        content += `<div style="${s}">${f.content_example || f.field || ''}</div>`;
      } else if (f.type === 'button') {
        content += `<div style="margin-top:6px;padding:4px 12px;border:1px solid rgba(255,255,255,0.5);border-radius:16px;font-size:11px;display:inline-block">${f.label || 'Action'}</div>`;
      } else if (f.type === 'row') {
        const stats = (f.stats || f.fields || []).map(s => `<span style="text-align:center"><b>${s.value_example||s.value||'0'}</b><br><span style="font-size:9px;opacity:0.7">${s.label||''}</span></span>`).join('');
        content += `<div style="display:flex;gap:16px;margin-top:6px">${stats}</div>`;
      } else if (f.type === 'avatar') {
        content += `<div style="width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 6px">${icon('user',24)}</div>`;
      }
    });
    if (!content && comp.title) {
      content = `<div style="font-size:14px;font-weight:600">${comp.title}</div>`;
      if (comp.subtitle) content += `<div style="font-size:11px;opacity:0.9">${comp.subtitle}</div>`;
    }
    if (props.action_label) {
      content += `<div style="margin-top:6px;padding:4px 12px;border:1px solid rgba(255,255,255,0.5);border-radius:16px;font-size:11px;display:inline-block">${props.action_label}</div>`;
    }
    return `<div class="c-card mood-card" ${clickAttr} style="background:${bg};color:white;border-radius:12px;padding:14px;margin:0 16px;position:relative">
      ${tagHtml}${content}
    </div>`;
  }

  // Avatar stats card
  if (variant === 'avatar_stats') {
    const fields = props.fields || [];
    let content = '';
    fields.forEach(f => {
      if (f.type === 'avatar') {
        content += `<div style="width:60px;height:60px;border-radius:50%;background:${getGradient(idx)};display:flex;align-items:center;justify-content:center;color:white;margin:0 auto 8px">${icon('user',28)}</div>`;
      } else if (f.type === 'text') {
        const s = f.style === 'title-large' ? 'font-size:16px;font-weight:700;text-align:center' : 'font-size:12px;color:var(--text-secondary);text-align:center';
        content += `<div style="${s}">${f.content_example || f.field || ''}</div>`;
      } else if (f.type === 'row') {
        const stats = (f.stats || f.fields || []).map(s => `<span style="text-align:center"><b>${s.value_example||s.value||'0'}</b><br><span style="font-size:10px;color:var(--text-secondary)">${s.label||''}</span></span>`).join('');
        content += `<div style="display:flex;gap:20px;justify-content:center;margin-top:8px">${stats}</div>`;
      }
    });
    return `<div class="c-card" ${clickAttr} style="padding:16px;position:relative">${tagHtml}${content}</div>`;
  }

  // Default card
  return `
    <div class="c-card" ${clickAttr}>
      ${tagHtml}
      ${comp.title ? `<div class="card-title">${comp.title}</div>` : ''}
      ${comp.subtitle || comp.description ? `<div class="card-subtitle">${comp.subtitle || comp.description}</div>` : ''}
      ${(props.items||[]).length > 0 ? `<div class="section-scroll" style="margin-top:6px">${props.items.map((item,i) => `<div class="section-card"><div class="section-card-poster" style="background:${getGradient(i)}"><span style="position:relative;z-index:1">${icon('film',16)}</span></div><div class="section-card-title">${item.title||item.label||''}</div><div class="section-card-sub">${item.rating?'★ '+item.rating:(item.subtitle||'')}</div></div>`).join('')}</div>` : ''}
    </div>`;
}

function renderList(comp, tagHtml, idx) {
  if (!comp.items || !comp.items.length) return '';
  const listId = 'list-' + Math.random().toString(36).slice(2, 8);

  let html = `<div class="c-list" id="${listId}" style="position:relative">${tagHtml}`;
  comp.items.forEach((item, i) => {
    const itemTag = item.tag ? `<span class="tag-badge">${item.tag}</span>` : '';
    const iconName = ICON_MAP[item.icon] || item.icon || 'chevron-right';
    const gradient = getGradient(idx * 3 + i);
    const isSelected = item.selected === true;
    const escapedLabel = (item.label||'').replace(/'/g,"\\'");

    let onclick = '';
    let trailingHtml = '';
    let extraClass = '';
    let detailHtml = '';

    // Priority: on_click > target > behavior > interactive:false > default
    if (item.on_click) {
      // Claude-decided interaction — render whatever Claude specified
      const oc = item.on_click;
      const ocTitle = (oc.title || item.label || '').replace(/'/g, "\\'");
      const ocDataId = 'oc-' + Math.random().toString(36).slice(2,8);
      if (oc.components) {
        // Store components data for runtime rendering
        window['_oc_' + ocDataId] = oc.components;
      }
      switch (oc.type) {
        case 'sheet':
          onclick = `showSheet('${ocTitle}', window['_oc_${ocDataId}'])`;
          trailingHtml = `<span class="item-trailing">${icon('chevron-right', 16)}</span>`;
          break;
        case 'dialog':
          onclick = `showDialog('${ocTitle}', window['_oc_${ocDataId}'])`;
          trailingHtml = `<span class="item-trailing">${icon('chevron-right', 16)}</span>`;
          break;
        case 'toast':
          onclick = `showToast('${oc.message || escapedLabel}', '${oc.toast_type || ''}')`;
          trailingHtml = '';
          break;
        case 'state':
          // Switch to a screen state, optionally auto-return to default
          onclick = `switchState('${oc.target || ''}');${oc.auto_return ? `showToast('${escapedLabel}');setTimeout(()=>{switchState('');showToast('Done!','success')},${oc.auto_return})` : ''}`;
          trailingHtml = `<span class="item-trailing">${icon('chevron-right', 16)}</span>`;
          break;
        case 'screen':
          onclick = `navigateTo('${oc.target}')`;
          trailingHtml = `<span class="item-trailing">${icon('chevron-right', 16)}</span>`;
          break;
        default:
          // Any other type Claude invents — try sheet as fallback
          if (oc.components) {
            onclick = `showSheet('${ocTitle}', window['_oc_${ocDataId}'])`;
          } else {
            onclick = `showToast('${escapedLabel}')`;
          }
          trailingHtml = `<span class="item-trailing">${icon('chevron-right', 16)}</span>`;
      }
    } else if (item.target) {
      onclick = `navigateTo('${item.target}')`;
      const trailingIconMap = {share:'share',send:'send',chevron_right:'chevron-right',arrow_forward:'arrow-right',open_in_new:'external-link',edit:'edit',delete:'trash-2',more:'more-vertical'};
      const trailingIcon = item.trailing ? (trailingIconMap[item.trailing] || item.trailing) : 'chevron-right';
      trailingHtml = `<span class="item-trailing">${icon(trailingIcon, 16)}</span>`;
    } else if (item.behavior === 'select') {
      extraClass = isSelected ? ' selected-item' : '';
      onclick = `selectItem(this,'${listId}','${escapedLabel}')`;
      trailingHtml = `<span class="item-trailing">${isSelected ? icon('check', 18) : ''}</span>`;
    } else if (item.behavior === 'filter') {
      extraClass = isSelected ? ' active-filter' : '';
      onclick = `filterItem(this,'${listId}','${escapedLabel}')`;
      trailingHtml = '';
    } else if (item.behavior === 'info') {
      onclick = `toggleDetail(this)`;
      detailHtml = item.detail ? `<div class="item-detail">${item.detail}</div>` : '';
      trailingHtml = `<span class="item-trailing">${icon('chevron-down', 16)}</span>`;
    } else if (item.behavior === 'action') {
      const actionDetail = (item.detail || escapedLabel).replace(/'/g, "\\'");
      onclick = `showActionSheet('${escapedLabel}','${actionDetail}')`;
      trailingHtml = `<span class="item-trailing">${icon('chevron-right', 16)}</span>`;
    } else if (item.interactive === false) {
      onclick = '';
      trailingHtml = '';
    } else {
      // No on_click, no target, no behavior — non-interactive
      onclick = '';
      trailingHtml = '';
    }

    // Override trailing for typed controls (slider/toggle/picker)
    const itemType = item.type || '';

    if ((itemType === 'toggle' || itemType === 'switch') && !item.on_click) {
      const isOn = item.default === true || item.value === true;
      const toggleId = 'tgl-' + Math.random().toString(36).slice(2,8);
      trailingHtml = `<div class="toggle-track${isOn ? ' on' : ''}" id="${toggleId}"><div class="toggle-thumb"></div></div>`;
      onclick = `toggleSwitch('${toggleId}')`;
    } else if ((itemType === 'toggle' || itemType === 'switch') && item.on_click) {
      // on_click handled above — just render the toggle visual
      const isOn = item.default === true || item.value === true;
      const toggleId = 'tgl-' + Math.random().toString(36).slice(2,8);
      trailingHtml = `<div class="toggle-track${isOn ? ' on' : ''}" id="${toggleId}"><div class="toggle-thumb"></div></div>`;
    }

    if (itemType === 'slider' && !item.on_click) {
      const val = item.value || 50;
      const mn = item.min || 0;
      const mx = item.max || 100;
      trailingHtml = `<div class="list-slider"><input type="range" min="${mn}" max="${mx}" value="${val}" oninput="this.nextElementSibling.textContent=this.value" onclick="event.stopPropagation()"><span>${val}</span></div>`;
      onclick = '';
    }

    if (itemType === 'picker' && item.options && !item.target && !item.on_click) {
      // Picker without on_click — pre-build options and store for runtime
      const curVal = item.subtitle || item.options[0] || '';
      trailingHtml = `<div class="list-picker-val"><span>${curVal}</span>${icon('chevron-down', 14)}</div>`;
      const pkId = 'pk-' + Math.random().toString(36).slice(2,8);
      const pkItems = item.options.map(o => ({
        label: o, behavior: 'select', icon: o === curVal ? 'check-circle' : 'circle'
      }));
      window['_pk_' + pkId] = [{ type: 'list', tag: 'pk-opts', items: pkItems }];
      onclick = `showSheet('${escapedLabel}', window['_pk_${pkId}'])`;
    } else if (itemType === 'picker' && (item.on_click || item.target)) {
      // Picker with on_click/target already handled above — just fix trailing
      const curVal = item.subtitle || '';
      trailingHtml = `<div class="list-picker-val"><span>${curVal}</span>${icon('chevron-down', 14)}</div>`;
    }

    html += `
      <div class="c-list-item${extraClass}" ${onclick ? `onclick="${onclick}" style="cursor:pointer;position:relative"` : 'style="position:relative"'}>
        ${itemTag}
        <div class="item-icon" style="background:${gradient};color:white">
          ${icon(iconName, 18)}
        </div>
        <div class="item-content">
          <div class="item-label">${item.label || ''}</div>
          ${item.subtitle ? `<div class="item-subtitle">${item.subtitle}</div>` : ''}
          ${detailHtml}
        </div>
        ${trailingHtml}
      </div>`;
  });
  html += '</div>';
  return html;
}

function selectItem(el, listId, label) {
  const list = document.getElementById(listId);
  if (list) {
    list.querySelectorAll('.c-list-item').forEach(item => {
      item.classList.remove('selected-item');
      const trail = item.querySelector('.item-trailing');
      if (trail) trail.innerHTML = '';
    });
  }
  el.classList.add('selected-item');
  const trail = el.querySelector('.item-trailing');
  if (trail) trail.innerHTML = icon('check', 18);
  showToast('Selected: ' + label, 'success');
  setTimeout(() => navigateBack(), 400);
}

function filterItem(el, listId, label) {
  const list = document.getElementById(listId);
  if (list) list.querySelectorAll('.c-list-item').forEach(item => item.classList.remove('active-filter'));
  el.classList.add('active-filter');
  showToast('Filter: ' + label);
}

function toggleDetail(el) {
  const detail = el.querySelector('.item-detail');
  if (detail) {
    detail.classList.toggle('expanded');
    const chevron = el.querySelector('.item-trailing');
    if (chevron) chevron.style.transform = detail.classList.contains('expanded') ? 'rotate(180deg)' : '';
  }
}

function showActionSheet(title, detail) {
  showSheet(title, [
    { type: 'text', content: detail, style: 'body' },
    { type: 'button', label: 'Confirm', style: 'primary' },
    { type: 'button', label: 'Cancel', style: 'text' }
  ]);
}

function showSheet(title, components) {
  let html = '<div style="padding:0 20px">';
  html += `<div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:12px">${title}</div>`;
  if (components && components.length) {
    const fakeScreen = { id: '_sheet', components: [] };
    components.forEach((comp, i) => {
      // Buttons in sheets close the modal + show toast
      if (comp.type === 'button' && !comp.target) {
        const lbl = (comp.label||'').replace(/'/g,"\\'");
        const btnStyle = comp.style === 'primary' ? 'primary' : comp.style === 'danger' ? 'danger' : comp.style === 'text' ? 'text-btn' : 'secondary';
        html += `<button class="c-button ${btnStyle}" onclick="dismissModal();${comp.style !== 'text' ? `showToast('${lbl}','success')` : ''}" style="width:100%;margin:6px 0">${comp.label || ''}</button>`;
      } else {
        html += renderComponent(comp, i, fakeScreen);
      }
    });
  }
  html += '</div>';
  showModal(html, 'sheet');
}

function showDialog(title, components) {
  let html = '<div style="padding:0 20px">';
  html += `<div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:12px;text-align:center">${title}</div>`;
  if (components && components.length) {
    const fakeScreen = { id: '_dialog', components: [] };
    components.forEach((comp, i) => {
      if (comp.type === 'button' && !comp.target) {
        const lbl = (comp.label||'').replace(/'/g,"\\'");
        const btnStyle = comp.style === 'primary' ? 'primary' : comp.style === 'danger' ? 'danger' : comp.style === 'text' ? 'text-btn' : 'secondary';
        html += `<button class="c-button ${btnStyle}" onclick="dismissModal();${comp.style !== 'text' ? `showToast('${lbl}','success')` : ''}" style="width:100%;margin:6px 0">${comp.label || ''}</button>`;
      } else {
        html += renderComponent(comp, i, fakeScreen);
      }
    });
  }
  html += '</div>';
  showModal(html, 'dialog');
}

function dismissModal() {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('visible');
  setTimeout(() => overlay.classList.remove('dialog-mode'), 300);
}

function renderToggle(comp, tagHtml) {
  const isOn = comp.default === true || comp.value === true;
  const toggleId = 'toggle-' + Math.random().toString(36).slice(2, 8);
  return `
    <div class="c-toggle" onclick="toggleSwitch('${toggleId}')" style="position:relative">
      ${tagHtml}
      <div>
        <div class="toggle-label">${comp.label || ''}</div>
        ${comp.description ? `<div class="toggle-desc">${comp.description}</div>` : ''}
      </div>
      <div class="toggle-track${isOn ? ' on' : ''}" id="${toggleId}">
        <div class="toggle-thumb"></div>
      </div>
    </div>`;
}

function renderSection(comp, tagHtml) {
  const props = comp.properties || comp;
  const title = props.title || comp.title || '';
  const seeAll = props.see_all;
  const items = props.items || [];
  const cardVariant = props.card_variant || 'poster';

  let html = `<div class="c-section" style="position:relative">${tagHtml}`;
  html += `<div class="section-header"><span class="section-title">${title}</span>`;
  if (seeAll) html += `<span class="see-all" onclick="showToast('See All: ${title.replace(/'/g,"\\'")}')">See All ›</span>`;
  html += `</div>`;

  if (items.length > 0) {
    html += `<div class="section-scroll">`;
    items.forEach((item, i) => {
      const t = item.title || item.label || item.name || item.query || '';
      const sub = item.rating ? `★ ${item.rating}` : (item.subtitle || item.mood_match || item.count || item.award || item.release || item.remaining || item.department || '');
      const gradient = getGradient(i);
      const seed = (t || 'card' + i).replace(/[^a-z0-9]/gi, '').slice(0,20);
      const imgUrl = item.poster ? `https://picsum.photos/seed/${seed}/200/300` : '';

      if (cardVariant === 'genre_chip') {
        const chipColor = item.color || gradient;
        html += `<div class="section-chip" style="background:${chipColor}" onclick="showToast('${t.replace(/'/g,"\\'")}')">
          ${item.icon ? getIcon(item.icon) : ''}
          <span>${t}</span>
        </div>`;
      } else if (cardVariant === 'circular_avatar_name' || cardVariant === 'circular_avatar') {
        html += `<div class="section-avatar-card">
          <div class="section-avatar" style="background:${gradient}">${icon('user',20)}</div>
          <div class="section-avatar-name">${t}</div>
          <div class="section-avatar-sub">${sub}</div>
        </div>`;
      } else if (cardVariant === 'platform_icon') {
        html += `<div class="section-platform" style="background:var(--surface-container,#f0f0f0)">
          ${icon('play-circle',24)}
          <span>${t}</span>
        </div>`;
      } else {
        // Default: poster card (Netflix-style)
        html += `<div class="section-card" onclick="${item.tag ? `showToast('${t.replace(/'/g,"\\'")}')` : ''}">
          <div class="section-card-poster" style="background:${gradient}">
            ${imgUrl ? `<img src="${imgUrl}" alt="${t}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;position:absolute;inset:0;z-index:2" onerror="this.style.display='none'" loading="lazy">` : ''}
            <span style="position:relative;z-index:1">${icon('film',20)}</span>
          </div>
          <div class="section-card-title">${t}</div>
          ${sub ? `<div class="section-card-sub">${sub}</div>` : ''}
        </div>`;
      }
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function renderImage(comp, tagHtml, idx) {
  const aspect = comp.aspect || 'wide';
  const gradient = getGradient(idx);
  const dims = { square: [200,200], wide: [335,190], portrait: [250,330] };
  const [w,h] = dims[aspect] || dims.wide;
  const seed = (comp.alt || comp.tag || 'img' + idx).replace(/[^a-z0-9]/gi, '');
  const imgUrl = comp.img_url || `https://picsum.photos/seed/${seed}/${w}/${h}`;
  return `
    <div class="c-image ${aspect}" style="position:relative">
      ${tagHtml}
      <div class="img-placeholder" style="background:${gradient};position:relative;overflow:hidden">
        <img src="${imgUrl}" alt="${comp.alt || 'Image'}"
             style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:inherit;z-index:2"
             onerror="this.style.display='none'" loading="lazy">
        <span style="position:relative;z-index:1">${icon('image', 32)}</span>
        <span style="position:relative;z-index:1">${comp.alt || 'Image'}</span>
      </div>
    </div>`;
}

function renderChip(comp, tagHtml, groupId) {
  let onclick;
  if (comp.target) {
    onclick = `navigateTo('${comp.target}')`;
  } else if (comp.on_click && comp.on_click.components) {
    const ocId = 'oc-' + Math.random().toString(36).slice(2,8);
    window['_oc_' + ocId] = comp.on_click.components;
    onclick = `showSheet('${(comp.on_click.title||comp.label||'').replace(/'/g,"\\'")}', window['_oc_${ocId}'])`;
  } else if (comp.behavior === 'filter' && groupId) {
    onclick = `filterChipInGroup(this,'${groupId}')`;
  } else if (comp.behavior === 'select' && groupId) {
    onclick = `selectChipInGroup(this,'${groupId}')`;
  } else {
    onclick = `this.classList.toggle('selected')`;
  }
  return `<span class="c-chip${comp.selected ? ' selected' : ''}" onclick="${onclick}" style="position:relative">${tagHtml}${comp.icon ? getIcon(comp.icon) : ''}${comp.label || ''}</span>`;
}

function renderChips(comp, tagHtml) {
  if (!comp.items) return '';
  const groupId = 'cg-' + Math.random().toString(36).slice(2,8);
  return `<div class="c-chips" id="${groupId}" style="position:relative">${tagHtml}${comp.items.map(c => renderChip(c, c.tag ? `<span class="tag-badge">${c.tag}</span>` : '', groupId)).join('')}</div>`;
}

function filterChipInGroup(el, groupId) {
  const group = document.getElementById(groupId);
  if (group) { group.querySelectorAll('.c-chip').forEach(c => c.classList.remove('selected')); }
  el.classList.add('selected');
  showToast('Filter: ' + el.textContent.trim(), 'info');
}

function selectChipInGroup(el, groupId) {
  const group = document.getElementById(groupId);
  if (group) { group.querySelectorAll('.c-chip').forEach(c => c.classList.remove('selected')); }
  el.classList.add('selected');
}

function renderPicker(comp, tagHtml) {
  return `
    <div class="c-picker" onclick="showToast('Picker: ${(comp.label||'').replace(/'/g,"\\'")}');" style="position:relative">
      ${tagHtml}
      <span class="picker-label">${comp.label || ''}</span>
      <span class="picker-value" style="display:flex;align-items:center;gap:6px">
        ${comp.value || comp.placeholder || 'Select...'}
        ${icon('chevron-down', 16)}
      </span>
    </div>`;
}

function renderSlider(comp, tagHtml) {
  const val = comp.value || 50;
  return `
    <div class="c-slider-wrap" style="position:relative">
      ${tagHtml}
      ${comp.label ? `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;display:flex;justify-content:space-between"><span>${comp.label}</span><span>${val}%</span></div>` : ''}
      <input type="range" class="c-slider" min="${comp.min || 0}" max="${comp.max || 100}" value="${val}">
    </div>`;
}

function renderProgress(comp, tagHtml) {
  const val = comp.value || comp.percent || 0;
  return `
    <div class="c-progress" style="position:relative">
      ${tagHtml}
      <div class="c-progress-track"><div class="c-progress-fill" style="width:${val}%"></div></div>
      <div class="c-progress-label"><span>${comp.label || ''}</span><span>${val}%</span></div>
    </div>`;
}

function renderMediaPlayer(comp, tagHtml) {
  const seed = (comp.title || comp.tag || 'video').replace(/[^a-z0-9]/gi, '');
  const thumbUrl = comp.img_url || `https://picsum.photos/seed/${seed}/335/190`;
  return `
    <div class="c-media-player" style="position:relative">
      ${tagHtml}
      <img src="${thumbUrl}" alt="${comp.title || 'Video'}"
           style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:inherit;opacity:.6"
           onerror="this.style.display='none'" loading="lazy">
      <div class="play-btn" onclick="showToast('Playing video...')">${icon('play', 28)}</div>
      <div class="media-overlay">
        <div class="media-title">${comp.title || comp.label || 'Video'}</div>
        <div class="media-duration">${comp.duration || '0:30'}</div>
      </div>
    </div>`;
}

function renderAvatar(comp, tagHtml, idx) {
  const gradient = getGradient(idx);
  const initials = (comp.name || comp.label || 'U').slice(0, 2).toUpperCase();
  return `
    <div style="display:flex;align-items:center;gap:14px;padding:8px 20px;position:relative">
      ${tagHtml}
      <div class="c-avatar" style="background:${gradient}">${initials}</div>
      <div>
        <div style="font-size:15px;font-weight:600;color:var(--text)">${comp.name || comp.label || ''}</div>
        ${comp.subtitle ? `<div style="font-size:12px;color:var(--text-tertiary)">${comp.subtitle}</div>` : ''}
      </div>
    </div>`;
}

function renderStats(comp, tagHtml) {
  if (!comp.items) return '';
  return `
    <div class="c-stats-row" style="position:relative">
      ${tagHtml}
      ${comp.items.map(s => `
        <div class="c-stat">
          <div class="stat-value">${s.value || '0'}</div>
          <div class="stat-label">${s.label || ''}</div>
        </div>
      `).join('')}
    </div>`;
}

function renderSearchBar(comp, tagHtml) {
  const onclick = comp.target ? `navigateTo('${comp.target}')` : `showToast('Search')`;
  return `
    <div class="c-search-bar" onclick="${onclick}" style="position:relative">
      ${tagHtml}
      ${icon('search', 18)}
      <span class="search-text">${comp.placeholder || comp.hint || 'Search...'}</span>
    </div>`;
}

function renderTabBar(comp, tagHtml) {
  if (!comp.tabs) return '';
  return `
    <div class="c-tab-bar" style="position:relative">
      ${tagHtml}
      ${comp.tabs.map((t, i) => `<div class="c-tab${i === 0 ? ' active' : ''}" onclick="this.parentElement.querySelectorAll('.c-tab').forEach(c=>c.classList.remove('active'));this.classList.add('active');showToast('Tab: ${t}')">${t}</div>`).join('')}
    </div>`;
}

function renderFab(comp, tagHtml) {
  const iconName = ICON_MAP[comp.icon] || comp.icon || 'plus';
  const onclick = comp.target ? `navigateTo('${comp.target}')` : `showToast('${(comp.label||'Add').replace(/'/g,"\\'")}')`;
  return `<button class="c-fab" onclick="${onclick}" style="position:relative">${tagHtml}${icon(iconName, 24)}</button>`;
}

function renderEmptyState(comp, tagHtml) {
  return `
    <div class="c-empty-state" style="position:relative">
      ${tagHtml}
      <div class="empty-icon">${icon(comp.icon || 'folder', 36)}</div>
      <div class="c-text title" style="text-align:center;padding:0">${comp.title || 'Nothing here yet'}</div>
      <div class="c-text body" style="text-align:center;padding:0">${comp.description || comp.subtitle || ''}</div>
    </div>`;
}

function renderGrid(comp, tagHtml, idx) {
  const cols = comp.columns || 3;
  if (!comp.items || !comp.items.length) return '';
  let html = `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:8px;padding:8px 20px;position:relative">${tagHtml}`;
  comp.items.forEach((item, i) => {
    const iconName = ICON_MAP[item.icon] || item.icon || 'grid';
    const gradient = getGradient(idx * 3 + i);
    const onclick = item.target ? `onclick="navigateTo('${item.target}')" style="cursor:pointer"` : '';
    html += `<div ${onclick} style="background:var(--surface);border-radius:var(--radius-md);padding:16px;text-align:center;border:1px solid var(--border);transition:all .2s">
      <div style="width:40px;height:40px;border-radius:10px;background:${gradient};display:flex;align-items:center;justify-content:center;margin:0 auto 8px;color:white">${icon(iconName, 20)}</div>
      <div style="font-size:13px;font-weight:600;color:var(--text)">${item.label || ''}</div>
      ${item.subtitle ? `<div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">${item.subtitle}</div>` : ''}
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderLoader(comp, tagHtml) {
  return `
    <div class="c-loader" style="position:relative">
      ${tagHtml}
      <div class="spinner"></div>
      <div class="loader-label">${comp.label || 'Loading...'}</div>
      ${comp.subtitle ? `<div class="loader-sublabel">${comp.subtitle}</div>` : ''}
    </div>`;
}

function renderLottie(comp, tagHtml) {
  return `
    <div class="c-lottie" style="position:relative">
      ${tagHtml}
      <div class="lottie-label">
        ${icon(comp.icon || 'play', 32)}
        <div style="margin-top:8px">${comp.label || 'Loading animation...'}</div>
      </div>
    </div>`;
}

function renderShimmer(comp, tagHtml) {
  const count = comp.count || 3;
  let items = '';
  for (let i = 0; i < count; i++) {
    items += `<div class="c-shimmer-item" style="animation-delay:${i * 0.15}s"></div>`;
  }
  return `<div class="c-shimmer" style="position:relative">${tagHtml}${items}</div>`;
}

function renderCircularProgress(comp, tagHtml) {
  const val = comp.value || 0;
  const r = 28; const c = 2 * Math.PI * r;
  const offset = c - (val / 100) * c;
  return `
    <div class="c-circular-progress" style="position:relative">
      ${tagHtml}
      <svg width="64" height="64">
        <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--border)" stroke-width="4"/>
        <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--primary)" stroke-width="4"
                stroke-dasharray="${c}" stroke-dashoffset="${offset}"
                stroke-linecap="round" style="transition:stroke-dashoffset .6s"/>
      </svg>
      <div class="progress-text">${val}%</div>
    </div>
    ${comp.label ? `<div style="text-align:center;font-size:12px;color:var(--text-tertiary)">${comp.label}</div>` : ''}`;
}

/* ═══════════════════════════════════════════════════════════════
   BOTTOM NAVIGATION

function renderBottomNav(activeScreenId) {

/* ═══════════════════════════════════════════════════════════════
   TOAST SYSTEM
   ═══════════════════════════════════════════════════════════════ */
function showToast(message, type = '') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    ${type === 'error' ? icon('x', 16) : type === 'success' ? icon('check', 16) : icon('info', 16)}
    <span>${message}</span>
    <span class="toast-action" onclick="this.parentElement.remove()">Dismiss</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

/* ═══════════════════════════════════════════════════════════════
   MODAL / BOTTOM SHEET
   ═══════════════════════════════════════════════════════════════ */
function showModal(content, mode) {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('dialog-mode');
  if (mode === 'dialog') overlay.classList.add('dialog-mode');
  document.getElementById('modalContent').innerHTML = content;
  overlay.classList.add('visible');
}

function closeModal(event) {
  if (event.target === document.getElementById('modalOverlay')) {
    dismissModal();
  }
}

/* ═══════════════════════════════════════════════════════════════
   TOGGLE SWITCH
   ═══════════════════════════════════════════════════════════════ */
function toggleSwitch(id) {
  const track = document.getElementById(id);
  if (track) {
    track.classList.toggle('on');
    showToast(track.classList.contains('on') ? 'Enabled' : 'Disabled');
  }
}

/* ═══════════════════════════════════════════════════════════════
   DEVICE SWITCHER
   ═══════════════════════════════════════════════════════════════ */
function switchDevice(device) {
  currentDevice = device;
  const phone = document.getElementById('phoneFrame');
  phone.classList.remove('mobile', 'tablet', 'desktop');
  if (device !== 'mobile') phone.classList.add(device);

  document.querySelectorAll('.device-btn[data-device]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.device === device);
  });
}

function switchPlatform(platform) {
  currentPlatform = platform;
  const phone = document.getElementById('phoneFrame');
  phone.classList.remove('android', 'ios');
  phone.classList.add(platform);

  document.querySelectorAll('.device-btn[data-platform]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.platform === platform);
  });

  // Re-render to apply platform-specific component changes
  renderScreen(currentScreenId);
  showToast('Platform: ' + (platform === 'ios' ? 'iOS' : 'Android'));
}

/* ═══ WEB MODE — Viewport Switcher ═══════════════════════════ */
function switchWebViewport(viewport) {
  currentWebViewport = viewport;
  const frame = document.getElementById('browserFrame');
  frame.classList.remove('viewport-desktop', 'viewport-tablet', 'viewport-mobile');
  frame.classList.add('viewport-' + viewport);

  document.querySelectorAll('.viewport-btn[data-viewport]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.viewport === viewport);
  });

  showToast('Viewport: ' + viewport.charAt(0).toUpperCase() + viewport.slice(1));
}

/* ═══ WEB MODE — Initialize Web UI ═══ */
function initWebMode() {
  if (!isWeb) return;

  // Show browser frame, hide phone frame
  document.getElementById('phoneWrap').style.display = 'none';
  document.getElementById('browserFrame').classList.add('active');

  // Show web viewport switcher, hide mobile device/platform switchers
  document.getElementById('webViewportSwitcher').classList.add('active');
  document.getElementById('mobileDeviceSwitcher').style.display = 'none';
  // Hide platform switcher (Android/iOS)
  document.querySelectorAll('.device-switcher').forEach(ds => {
    if (ds.querySelector('[data-platform]')) ds.style.display = 'none';
  });

  // Update page title for web
  document.title = document.title.replace('Interactive Prototype', 'Web Prototype');
}
/* ═══ END WEB MODE ═══ */

function updateInspector(screen) {
  let html = `
    <div class="inspector-field">
      <div class="field-label">Screen ID</div>
      <div class="field-value">${screen.id}</div>
    </div>
    <div class="inspector-field">
      <div class="field-label">Feature</div>
      <div class="field-value">${screen.feature}</div>
    </div>
    <div class="inspector-field">
      <div class="field-label">Status</div>
      <div class="field-value">${screen.status}</div>
    </div>
    <div class="inspector-field">
      <div class="field-label">Tag</div>
      <div class="inspector-tag">${screen.tag}</div>
    </div>
    <div class="inspector-field">
      <div class="field-label">Components (${screen.components.length})</div>
      ${screen.components.map(c => `
        <div style="padding:4px 0;display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;color:#94A3B8;width:60px">${c.type}</span>

        </div>
      `).join('')}
    </div>
    <h3 style="margin-top:20px">Navigation</h3>
    <div class="inspector-field">

      ${screen.components.filter(c => c.target).map(c => `
        <div style="padding:3px 0">
          <span style="font-size:12px;color:#CBD5E1;cursor:pointer;text-decoration:underline" onclick="navigateTo('${c.target}')">${c.target}</span>
          <span style="font-size:10px;color:#475569;margin-left:6px">(${c.label || c.type})</span>
        </div>
      `).join('') || '<div style="font-size:12px;color:#475569">None</div>'}
    </div>
    <div class="inspector-field">
      <div class="field-label">Incoming from</div>
      ${APP_DATA.screens.filter(s => s.components.some(c => c.target === screen.id)).map(s => `
        <div style="padding:3px 0">
          <span style="font-size:12px;color:#CBD5E1;cursor:pointer;text-decoration:underline" onclick="navigateTo('${s.id}')">${s.name}</span>
        </div>
      `).join('') || '<div style="font-size:12px;color:#475569">None (entry point)</div>'}
    </div>`;

    if (screen.states && Object.keys(screen.states).length > 0) {
      html += '<h3 style="margin-top:20px">States</h3>';
      html += `<div class="inspector-field"><div class="field-label">Available States (${Object.keys(screen.states).length})</div>`;
      Object.entries(screen.states).forEach(([id, state]) => {
        html += `<div style="padding:4px 0;display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:#CBD5E1;cursor:pointer;text-decoration:underline" onclick="document.getElementById('statePicker').value='${id}';switchState('${id}')">${state.name || id}</span>
          <span style="font-size:10px;color:#475569">(${state.components ? state.components.length : 0} comps)</span>

    const apiComps = screen.components.filter(c => c.api);
    if (apiComps.length > 0) {
      html += '<h3 style="margin-top:20px">API Dependencies</h3>';
      html += `<div class="inspector-field"><div class="field-label">Components with API (${apiComps.length})</div>`;
      apiComps.forEach(c => {
        const sfrId = c.api.endpoint || c.api.group || 'unknown';
        const ep = SERVER_DATA && SERVER_DATA.endpoints ? SERVER_DATA.endpoints.find(e => e.id === c.api.endpoint) : null;
        const method = ep ? ep.method : '';
        const path = ep ? ep.path : '';
        html += `<div style="padding:5px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap">

/* ═══════════════════════════════════════════════════════════════
   SFR PANEL (Server Requirements Side Panel)
   ═══════════════════════════════════════════════════════════════ */
function toggleSfrPanel() {
  showSfrPanel = !showSfrPanel;
  document.getElementById('sfrToggle').classList.toggle('active', showSfrPanel);
  document.getElementById('sfrPanel').classList.toggle('visible', showSfrPanel);
  if (showSfrPanel) updateSfrPanel(currentScreenId);
}

function collectApiComponents(components) {
  const result = [];
  (components || []).forEach(c => {
    if (c.api) result.push(c);
    if (Array.isArray(c.items)) c.items.forEach(item => { if (item && item.api) result.push(item); });
    if (Array.isArray(c.actions)) c.actions.forEach(act => { if (act && act.api) result.push(act); });
  });
  return result;
}

function updateSfrPanel(screenId) {
  const container = document.getElementById('sfrPanelContent');
  const screen = APP_DATA.screens.find(s => s.id === screenId);
  if (!screen) { container.innerHTML = ''; return; }

  // Guard: no SERVER_DATA
  if (!SERVER_DATA) {
    container.innerHTML = '<div class="sfr-empty"><div class="sfr-empty-icon">&#128268;</div><div>No server data available.<br><span style="font-size:11px;color:#64748B">Add <code>server.backends</code> to PROJECT_CONFIG.yaml and run <code>/idea sync</code>.</span></div></div>';
    return;
  }

  const endpoints = SERVER_DATA.endpoints || [];
  const groups = SERVER_DATA.endpoint_groups || [];
  const apiComps = collectApiComponents(screen.components);

  let html = '';

  // Section 1: Screen API Summary
  html += `<div class="inspector-field">
    <div class="field-label">Screen</div>
    <div class="field-value">${screen.name || screen.id}</div>
  </div>`;
  if (screen.feature) {
    html += `<div class="inspector-field">
      <div class="field-label">Feature</div>
      <div class="field-value">${screen.feature}</div>
    </div>`;
  }

  if (apiComps.length === 0) {
    html += '<div class="sfr-empty"><div class="sfr-empty-icon">&#10003;</div><div>No API calls on this screen</div></div>';
    container.innerHTML = html;
    return;
  }

  html += `<div class="inspector-field">
    <div class="field-label">API-bound Components</div>
    <div class="field-value" style="color:#818CF8">${apiComps.length}</div>
  </div>`;

  // Section 2: Component → SFR Bindings
  html += '<h3 style="margin-top:16px">Component Bindings</h3>';
  apiComps.forEach((c, idx) => {
    const compLabel = c.label || c.type || 'component';
    const compType = c.type || 'unknown';
    const apiGroup = c.api.group || null;
    const apiEndpoint = c.api.endpoint || null;

    // Resolve group info
    const group = apiGroup ? groups.find(g => g.id === apiGroup) : null;
    // Resolve endpoint IDs: from group or single endpoint
    let epIds = [];
    if (group && group.endpoints) {
      epIds = group.endpoints;
    } else if (apiEndpoint) {
      epIds = [apiEndpoint];
    }

    const sectionId = `sfr-comp-${idx}`;
    html += `<div class="sfr-endpoint-card">
      <div class="sfr-comp-header" onclick="document.getElementById('${sectionId}').style.display = document.getElementById('${sectionId}').style.display === 'none' ? 'block' : 'none'">
        <span style="font-size:11px;color:#94A3B8;font-family:monospace">[${compType}]</span>
        <span style="font-size:12px;color:#CBD5E1;flex:1">"${compLabel}"</span>
        <span style="font-size:10px;color:#64748B">${epIds.length} SFR${epIds.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="sfr-comp-body" id="${sectionId}">`;

    // Group badge
    if (group) {
      html += `<div style="margin-bottom:6px">
        <span style="font-size:10px;color:#64748B">Group:</span>
        <span class="sfr-group-badge">${group.id}</span>
        <span class="sfr-group-badge" style="background:rgba(16,185,129,.12);color:#6EE7B7">${group.strategy || 'default'}</span>
      </div>`;
    }

    // State mappings
    if (c.api.states) {
      html += '<div style="margin-bottom:6px">';
      Object.entries(c.api.states).forEach(([key, val]) => {
        html += `<span style="font-size:10px;display:inline-block;margin-right:8px;color:#94A3B8">${key} → <span style="color:#C4B5FD">${val}</span></span>`;
      });
      html += '</div>';
    }

    // Endpoint list
    epIds.forEach(epId => {
      const ep = endpoints.find(e => e.id === epId);
      if (ep) {
        const method = (ep.method || 'GET').toLowerCase();
        html += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0">
          <span class="api-method-badge api-method-${method}" style="font-size:9px">${ep.method || 'GET'}</span>
          <span style="font-size:11px;color:#A5B4FC">${ep.id}</span>
          ${ep.base_url ? `<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.06);color:#64748B">${ep.base_url.replace(/^https?:\/\//, '').split('/')[0]}</span>` : ''}
          <span style="font-size:10px;color:#475569;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ep.path || ''}</span>
        </div>`;
      } else {
        html += `<div style="padding:3px 0;font-size:11px;color:#64748B">${epId} (not found)</div>`;
      }
    });

    html += '</div></div>';
  });

  // Section 3: Coverage Context
  const allScreenSfrIds = new Set();
  apiComps.forEach(c => {
    const apiGroup = c.api.group || null;
    const group = apiGroup ? groups.find(g => g.id === apiGroup) : null;
    if (group && group.endpoints) group.endpoints.forEach(e => allScreenSfrIds.add(e));
    else if (c.api.endpoint) allScreenSfrIds.add(c.api.endpoint);
  });
  const totalSfrs = endpoints.length;
  const screenSfrCount = allScreenSfrIds.size;
  const pct = totalSfrs > 0 ? Math.round((screenSfrCount / totalSfrs) * 100) : 0;

  html += `<div class="sfr-coverage-footer">
    <div>This screen uses <strong style="color:#E2E8F0">${screenSfrCount}</strong> of <strong style="color:#E2E8F0">${totalSfrs}</strong> SFRs (${pct}%)</div>
    <div style="margin-top:8px"><a href="#" onclick="switchMainTab('api');return false" style="color:#818CF8;font-size:11px;text-decoration:underline">View all SFRs →</a></div>
  </div>`;

  container.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════
   MAIN TAB SWITCHING (Prototype / Flow / Coverage)
