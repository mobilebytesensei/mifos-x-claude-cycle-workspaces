<!-- _shared/bottom-nav.html — Money Toolkit shell chrome. BYTE-IDENTICAL across every
     consuming screen (home, profile) except the two data-nav-selected booleans, which
     flip per current screen. Composed inline at the bottom of <main data-shell="content">
     for home / profile only — every other screen has bottom_navigation_visible:false
     per app-shell.yaml#/defaults (pushed destination). -->
<nav data-shell="bottom-nav" data-shell-source="app-shell.yaml" aria-label="Primary">
  <a data-nav-item="home" data-nav-to="home" data-nav-type="tab" data-nav-selected="__HOME_SELECTED__" role="button" tabindex="0">
    <span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">home</span></span>Home
  </a>
  <a data-nav-item="profile" data-nav-to="profile" data-nav-type="tab" data-nav-selected="__PROFILE_SELECTED__" role="button" tabindex="0">
    <span class="nav-pill"><span class="material-symbols-outlined" aria-hidden="true">person</span></span>Profile
  </a>
</nav>
