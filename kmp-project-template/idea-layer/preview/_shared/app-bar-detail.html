<!-- _shared/app-bar-detail.html — top app bar for PUSHED destinations (every screen
     except home/profile). Back action + title, no bottom-nav sibling (bottom_navigation_
     visible:false for these screens per app-shell.yaml#/defaults override). __TITLE__ /
     __BACK_TARGET__ are the per-screen data-bound slots. -->
<header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="top_app_bar">
  <button type="button" class="leading" data-nav-to="__BACK_TARGET__" data-nav-type="pop" aria-label="Back">
    <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
  </button>
  <h1 class="app-title">__TITLE__</h1>
</header>
