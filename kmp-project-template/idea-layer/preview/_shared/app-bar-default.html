<!-- _shared/app-bar-default.html — top app bar for TAB-ROOT screens (home, profile).
     No back action (tab root). Optional trailing icon action (e.g. home's Settings gear).
     Structure/CSS classes are byte-identical across consumers; __TITLE__ / trailing markup
     are the per-screen data-bound slots (title_source: "screen" per app-shell.yaml). -->
<header data-shell="top-app-bar" data-variant="center_aligned" data-component-type="LayoutBox" data-component-id="top_app_bar">
  <h1 class="app-title">__TITLE__</h1>
  <!-- trailing action slot — omit entirely when the screen has none -->
</header>
