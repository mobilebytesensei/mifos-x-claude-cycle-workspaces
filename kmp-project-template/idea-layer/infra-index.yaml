# idea-layer/infra-index.yaml
# Whole-source REFERENCE + BOUNDARY tier — infra is NOT idea-representable (RESEARCH F3, GOAL D2).
#
# Fastlane targets, convention plugins, CI workflows, and root gradle/version config have no
# screen / flow / DTO analog, so they cannot live in the drivable product surface (screens/*/).
# This file is the NON-DRIVEN reference tier: one pointer row per infra Source-of-Truth →
# its native SoT path + the command that drives it.
#
# HONESTY NOTE (GOAL AC-9, RESEARCH F3): the shipped core/scripts/idea-graph-audit.ts does NOT
# read this file. Its dispatch_queue is built purely from screens/*/, flows, DTOs, and
# CAPABILITY_GAPS keyed by feature-slug — so infra can never be queued by consuming this tier,
# and this file does NOT gate the audit. It is a reference / pointer + boundary document. The
# boundary discipline it encodes ("infra lives ONLY here, never as a drivable screens/<id>/
# feature") is proved by the AC-9 canary tests/idea-reimport/infra-nondriven/{red,green}/, which
# runs the REAL audit and asserts no infra id ever leaks into the emitted dispatch_queue.
#
# GOVERNANCE (GOAL D5, two-vehicle model): the PRODUCT surface is governed by /idea-agent;
# the INFRA surface is governed by these native SoT drivers. Infra work (e.g.
# white-label-template-hardening) is an INFRA change routed through its native driver here,
# NEVER re-expressed as an idea-feature.
#
# RULE-CI-001: this file lives under idea-layer/ and is authored with Claude Write ONLY —
# never python/bash/jq/sed/awk.
version: 1
tier: reference
non_driven_tier: true
rows:
  - id: deployment
    source_path: deployment/
    native_sot: deployment/DEPLOYMENT_MANIFEST.yaml
    driver: /idea-deploy
    non_driven: true
    reason: Fastlane deploy targets (Android/iOS/desktop/web lanes) have no screen/flow/DTO analog (F3)
  - id: build-logic
    source_path: build-logic/
    native_sot: build-logic/
    driver: /kmp-project-template-retrain
    non_driven: true
    reason: Gradle convention plugins are build config, not idea-representable (F3)
  - id: ci-workflows
    source_path: .github/workflows/
    native_sot: .github/workflows/
    driver: /ci
    non_driven: true
    reason: GitHub Actions CI workflows are not idea-representable (F3)
  - id: customization-surface
    source_path: customization-surface.yaml
    native_sot: customization-surface.yaml
    driver: /kmp-project-template-retrain
    non_driven: true
    reason: white-label ownership/customization map, no drivable UI node (F3)
  - id: template-sync
    source_path: sync-dirs.sh
    native_sot: sync-dirs.sh
    driver: /kmp-project-template-retrain
    non_driven: true
    reason: template-sync script, not idea-representable (F3)
  - id: root-build-config
    source_path: settings.gradle.kts
    native_sot: settings.gradle.kts, gradle/libs.versions.toml
    driver: /kmp-project-template-retrain
    non_driven: true
    reason: root gradle module graph + version catalog, no idea analog (F3)
