# ============================================================
# CAPABILITY_STATE.yaml — Project-Side Idea Capability Tracker
# ============================================================
# Generated by: /idea init (Phase 1 backfill) and updated by each
#               /idea {capability} runtime on success (Phase 3+).
# Read by:      /idea dashboard (Layer Sanity row + Capabilities grid)
#               PROJECT_MIGRATION (drift detection between framework
#               registry version and per-capability artifact_template_version_at_run)
# Spec:         core/registries/IDEA_CAPABILITY_REGISTRY.yaml (framework-side)
# Plan:         PLAN-fw-260506-idea-capability-registry
#
# DO NOT hand-edit unless you know what you're doing — this is
# auto-maintained. To force re-init: delete the file and run /idea init.
# ============================================================

schema_version: "1.0.0"
project: "mifos-x/kmp-project-template"
generated: "2026-08-01"
generator: "/idea init (Phase 1 backfill)"   # "/idea init (Phase 1 backfill)" OR "/idea {cap} runtime"
framework_version_at_init: "2.86.0"
init_mode: "backfill"                          # screens/*/ui.yaml non-empty ⇒ backfill (not bootstrap)

# ============================================================
# Capabilities used (rows added by detection or per-run writers)
# ============================================================
# Rules for reading:
#   - Capability ABSENT from this map  →  never used in this project
#   - last_run: "inferred-{date}"       →  backfilled by /idea init (artifact-detection)
#   - last_run: "{ISO_TIMESTAMP}"       →  real run record from a capability runtime (Phase 3+)
#   - backfilled: true                  →  versions are unknown (pre-registry origin)
#   - drift: true                       →  artifact_template_version_at_run < REGISTRY.{cap}.artifacts[].template_version
#
# Per-row schema:
#   capabilities_used:
#     {capability_name}:
#       last_run: "inferred-{ISO_DATE}" | "{ISO_TIMESTAMP}" | "never"
#       framework_version_at_run: "{semver}" | "<2.86.0" | "unknown"
#       capability_version_at_run: "{semver}" | "unknown"
#       artifact_template_version_at_run: "{semver}" | "unknown"
#       backfilled: true | false                 # default false (real run)
#       detection_rule: "{string}"               # backfill only — describes how it was inferred
#       artifact_count: {N}                      # backfill only — how many artifacts matched
#       drift: false                             # set true on each render if template_version moved (Phase 3+)
# ============================================================

capabilities_used:
  # import + verify rows carried forward from idea-layer.archive-20260801 (Phase 4
  # re-apply, Gov-6). The fresh /idea init backfill detected only enrich + sync;
  # this preserves the prior terminal run history so proven capabilities are not
  # silently reset to not-run. enrich + sync keep their fresher 2026-08-01 records.
  import:
    last_run: "inferred-2026-08-01"
    framework_version_at_run: "<2.86.0"
    capability_version_at_run: "unknown"
    artifact_template_version_at_run: "unknown"
    backfilled: true
    detection_rule: "reverse-engineered idea-layer produced via /idea import — 15 feature sibling-sets + IDEA/FEATURES/REQUIREMENTS/ROADMAP (fresh re-import 2026-08-01)"
    artifact_count: 15
    drift: false
    carried_forward_from: "idea-layer.archive-20260801/CAPABILITY_STATE.yaml"
  enrich:
    last_run: "inferred-2026-08-01"
    framework_version_at_run: "<2.86.0"
    capability_version_at_run: "unknown"
    artifact_template_version_at_run: "unknown"
    backfilled: true
    detection_rule: "idea-layer/screens/*/ui.yaml (sibling layout) >= 1"
    artifact_count: 15
    drift: false
  verify:
    last_run: "2026-07-25"
    framework_version_at_run: "2.86.0"
    capability_version_at_run: "unknown"
    artifact_template_version_at_run: "unknown"
    backfilled: false
    detection_rule: "/idea verify coherence pass — verdict PASS-WITH-GAPS (100% action_contract coverage, clean DTO/nav-param resolution; gaps = enrich + P1 implement targets)"
    carried_forward_from: "idea-layer.archive-20260801/CAPABILITY_STATE.yaml"
  sync:
    last_run: "inferred-2026-08-01"
    framework_version_at_run: "<2.86.0"
    capability_version_at_run: "unknown"
    artifact_template_version_at_run: "unknown"
    backfilled: true
    detection_rule: "idea-layer/flows/*.yaml >= 1 OR prototype/index.html OR APP_FLOW.mmd"
    artifact_count: 3
    drift: false

# ============================================================
# Init metadata (audit trail)
# ============================================================

init:
  ran_at: "2026-08-01"
  detected_count: 2                      # enrich, sync
  not_detected_count: 93                 # 95 non-deprecated registry capabilities − 2 detected
  skipped_due_to_error: []               # capabilities whose detection rule errored

# ============================================================
# Phase 3+ fields (placeholder — populated when feature ships)
# ============================================================

drift_check:
  last_run: null
  drifted_capabilities: []               # list of capability_names where template_version moved

per_capability_writes_enabled: false     # flips to true when Phase 3 ships
