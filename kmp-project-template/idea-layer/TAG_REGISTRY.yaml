# Auto-generated from screens/*/ui.yaml (fresh import)
# ─────────────────────────────────────────────────────────────────────────────
# Analytics tag registry for the Money Toolkit (kmp-project-template) idea-layer.
# One row per tagged component/screen declared in screens/{feature}/ui.yaml.
#
#   tag       — stable analytics ID, T-{FEATURE}-{ELEMENT}-NN
#   test_tag  — the REAL TestTags constant the sibling ui.yaml references
#               (source of truth; per-row dynamic tags keep their {…} template)
#   screen    — screen_id the tag lives on
#   component — the UI element carrying the tag
#   label     — human-readable label of the element
#   feature   — owning feature id
#   provenance— present only when the tag is NOT shipped in source
#               (proposed = tag suggested for an unshipped UI;
#                pending  = backend shipped, UI documented but not yet in-tree)
#
# Faithful: only screens/components actually declared in the current siblings.
# NO auth tags (the app is fully local — no login / account surface).
# ─────────────────────────────────────────────────────────────────────────────

