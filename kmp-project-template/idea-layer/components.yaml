# components.yaml — Money Toolkit project-tier component registry.
# Bootstrapped by /idea-render-mockup Phase 1 (RULE-PROTO-RENDER-LLM-001 / RULE-COMPONENT-REGISTRY-001).
# Extends the framework Tier-1/Tier-2 registries (layers/idea/templates/primitives/PRIMITIVES.yaml +
# layers/idea/templates/registry/*.yaml — box, text, card, list, list_item, chip, chip_group,
# button family, icon_button, text_field, switch, radio_group, dropdown(select), banner,
# empty_state, error_state, shimmer, progress_linear, extended_fab, carousel, section, hero,
# app_bar, bottom_nav, dialog, avatar, stat_block). Types below are the Money-Toolkit-specific
# vocabulary observed across all 16 screens' ui.yaml (grep of `type:` usage) that are NOT already
# covered 1:1 by a framework primitive/pattern.
schema_version: "1.0"
project: money-toolkit

components:

  # ── Hero / summary surfaces ──────────────────────────────────────────────
  - type: hero_card
    tier: project
    extends: card
    description: "Elevated brand-gradient summary tile. Top of a list/detail screen — headline amount + supporting stat row."
    default_style:
      background: "linear-gradient(135deg, var(--primary), color-mix(in oklch, var(--primary) 55%, var(--tertiary)))"
      color: on_primary
      padding: spacing.lg
      corner_radius: radius.lg
      elevation: elevation.level2
    slots:
      required: [primary_value]
      optional: [primary_label, stat_row, supporting_text]

  - type: amount_display
    tier: project
    extends: text
    description: "Large monospace currency figure + a small label beneath. Used inside hero_card and detail heroes."
    default_style:
      typography: typography.display_small
      font_family: font_family_mono
      color: inherit
    slots:
      required: [content]
      optional: [label]

  - type: money_text
    tier: project
    extends: text
    description: "Inline monospace currency figure with a semantic tone (positive/negative/neutral)."
    default_style:
      font_family: font_family_mono
      typography: typography.body_medium
    variants:
      negative: { default_style: { color: error } }
      positive: { default_style: { color: success } }
      neutral:  { default_style: { color: on_surface } }

  - type: hero_stat
    tier: project
    extends: box
    description: "Compact label/value pair inside a hero_card stat row."
    default_style:
      padding: spacing.none
    slots:
      required: [label, value]

  # ── Rate / market rows ───────────────────────────────────────────────────
  - type: rate_row
    tier: project
    extends: box
    description: "Label + monospace value + directional arrow (up/down/flat). Used in Today's Rates, currency, macro cards."
    default_style:
      padding_y: spacing.xxs
    slots:
      required: [label, value, direction]

  - type: rate_pair_row
    tier: project
    extends: box
    description: "Repeated 'USD → CODE  value' rows for the exchange card, one per currency pair."
    default_style:
      padding_y: spacing.xxs
    slots:
      required: [pairs]

  - type: rate_badge
    tier: project
    extends: chip
    description: "Small colored badge showing a rate delta (e.g. +0.12%) with success/error tone."
    default_style:
      corner_radius: radius.full
      padding_x: spacing.sm
      typography: typography.label_small
      font_family: font_family_mono

  - type: sparkline
    tier: project
    extends: box
    description: "Inline SVG polyline trend chart (7-30 pt), no axes — a compact historical-trend affordance."
    default_style:
      height: 40dp
      corner_radius: radius.none

  - type: chart
    tier: project
    extends: box
    description: "Larger SVG line/area chart with light gridlines, used on rate-history / macro detail screens."
    default_style:
      height: 180dp
      background: surface_container_low
      corner_radius: radius.md
      padding: spacing.md

  # ── Freshness / status ───────────────────────────────────────────────────
  - type: freshness_indicator
    tier: project
    extends: box
    description: "Small refresh icon + 'Updated Ns ago' label; tap re-fetches. Trailing slot on network-backed cards."
    default_style:
      typography: typography.label_small
      color: on_surface_variant
    supported_states: [fresh, stale, refreshing, error]

  - type: freshness_overlay
    tier: project
    extends: banner
    description: "Full-width banner variant of freshness_indicator for stale-data screens."

  - type: status_chip
    tier: project
    extends: chip
    description: "Semantic status label (loan kind, alert severity, submit state)."
    default_style:
      corner_radius: radius.full
      padding_x: spacing.sm
      typography: typography.label_small

  - type: status_text
    tier: project
    extends: text
    description: "Inline submit/status line (Saving… / Saved ✓ / Save failed)."
    default_style:
      typography: typography.body_small

  # ── Feature navigation ───────────────────────────────────────────────────
  - type: feature_row
    tier: project
    extends: list_item
    description: "Icon + title + subtitle + chevron tappable row. Used in the home Tools grid and hub screens."
    default_style:
      padding: spacing.md
      corner_radius: radius.md
      background: surface
      border: "1px solid var(--outline-variant)"

  - type: list_row
    tier: project
    extends: list_item
    description: "Generic dense list row (name + trailing value/meta)."

  # ── Tables (amortization schedule) ───────────────────────────────────────
  - type: table
    tier: project
    extends: box
    description: "Column-aligned data table (LazyColumn projection). Header + zebra-striped data rows + optional summary."
    default_style:
      corner_radius: radius.md
      border: "1px solid var(--outline-variant)"
      background: surface
    slots:
      required: [table_header_row]
      optional: [table_data_row, summary_card]

  - type: table_header_row
    tier: project
    extends: row
    description: "End-aligned column-heading row, surface_variant background."
    default_style:
      background: surface_variant
      padding: spacing.sm
      typography: typography.label_small

  - type: table_data_row
    tier: project
    extends: row
    description: "Zebra-striped data row (alternating surface / surface_container_low)."
    default_style:
      padding: spacing.sm
      typography: typography.body_small
      font_family: font_family_mono

  - type: summary_card
    tier: project
    extends: card
    description: "Totals block appended after a table — label/value line pairs, one emphasized (e.g. total interest)."
    default_style:
      background: primary_container
      corner_radius: radius.md
      padding: spacing.md

  # ── Empty / loading affordances ──────────────────────────────────────────
  - type: error_slot
    tier: project
    extends: error_state
    description: "Per-card inline error presentation (not full-screen) — icon + message + retry, used inside a single dashboard card slot."

  - type: empty_slot
    tier: project
    extends: empty_state
    description: "Per-card inline empty presentation (not full-screen) — used inside a single dashboard card slot."

  - type: loading_indicator
    tier: project
    extends: shimmer
    description: "Alias — framework shimmer primitive."

  - type: linear_progress_indicator
    tier: project
    extends: progress_linear
    description: "Alias — framework linear progress primitive; used for loan payoff / tenure progress bars."

  - type: dashboard_progress_bar
    tier: project
    extends: progress_linear
    description: "Thin progress bar variant used inline within dashboard hero/loan rows."

  # ── Forms / calculators ──────────────────────────────────────────────────
  - type: decimal_field
    tier: project
    extends: text_field
    description: "Numeric text field constrained to decimal input (principal, rate, amounts)."
    default_style:
      font_family: font_family_mono

  - type: number_field
    tier: project
    extends: text_field
    description: "Numeric text field constrained to integer input (tenure months)."
    default_style:
      font_family: font_family_mono

  - type: date_field
    tier: project
    extends: text_field
    description: "ISO date text field (YYYY-MM-DD)."

  - type: preview_box
    tier: project
    extends: card
    description: "Read-only live-computed preview tile (e.g. EMI calculator result) — outlined, dashed border, mono figures."
    default_style:
      background: surface_container_low
      border: "1px dashed var(--outline)"
      corner_radius: radius.md
      padding: spacing.md

  - type: preferences
    tier: project
    extends: box
    description: "Grouped settings-row container — alias of settings archetype's settings_section."

  # ── Showcase / demo galleries ─────────────────────────────────────────────
  - type: labeled_demo
    tier: project
    extends: box
    description: "Label + monospace demo-value tile used on the showcase/state-gallery screen."
    default_style:
      border: "1px dashed var(--outline-variant)"
      corner_radius: radius.md
      background: surface_container_low
      padding: spacing.sm

  - type: state_demo_group
    tier: project
    extends: box
    description: "Grouping wrapper for a set of labeled_demo tiles illustrating one ScreenState variant."

  - type: step_body
    tier: project
    extends: card
    description: "Wizard step container — step counter + prompt + step-specific fields."
    default_style:
      corner_radius: radius.lg
      border: "1px solid var(--outline-variant)"
      padding: spacing.md

  - type: draft_resume_banner
    tier: project
    extends: banner
    description: "Prompt to resume an offline-saved draft submission."

  - type: alert_dialog
    tier: project
    extends: dialog
    description: "Alias — framework dialog primitive, used for delete-confirmation flows."

  - type: filter_chip_group
    tier: project
    extends: chip_group
    description: "Alias — framework chip_group, horizontally scrollable filter row."

  - type: metric
    tier: project
    extends: box
    description: "Centered label/value pair (small stat) inside a row of metrics."

# ─────────────────────────────────────────────────────────────────────────────
# Motion — shimmer pulse keyframe referenced by loading-state archetype blocks.
# ─────────────────────────────────────────────────────────────────────────────
motion:
  pulse:
    keyframes: "@keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }"
    duration_ms: 1400
    easing: "cubic-bezier(0.4,0,0.6,1)"
    reduced_motion_fallback: "opacity: 0.75;"
