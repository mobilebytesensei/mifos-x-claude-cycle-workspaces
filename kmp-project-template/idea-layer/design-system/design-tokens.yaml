# Design Tokens — Money Toolkit (mifos-x/kmp-project-template)
# Bootstrapped by /idea-render-mockup Phase 1 (RULE-PROTO-RENDER-LLM-001 prerequisite).
# Brand: confident, modern fintech-utility. Violet primary (carried over from the
#   established prototype brand already used across screens/*.html legacy mockups),
#   teal/green for positive money movement + success, amber for warnings/due-soon,
#   red for negative/error. Plus Jakarta Sans display+body, mono for ALL numerics
#   (amounts, rates, dates, IDs) per CRAFT_RULES.md §7c rule 6.
# Canonical nested colors.{light,dark} shape. Consumed by /idea-feature-render (LLM
# HD path), /idea-feature-stitch, /implement Compose codegen, /design-validate.

