  disabled: 0.38
  loading:  0.60
  hover:    0.08
  focus:    0.12
  pressed:  0.12
  dragged:  0.16

# ─── Motion ──────────────────────────────────────────────────────────────────
motion:
  durations: { short1: 50, short2: 100, short3: 150, short4: 200, medium1: 250, medium2: 300, medium3: 350, medium4: 400, long1: 450, long2: 500 }
  easings:
    standard:              "cubic-bezier(0.2, 0, 0, 1)"
    emphasized_decelerate: "cubic-bezier(0.05, 0.7, 0.1, 1)"
    emphasized_accelerate: "cubic-bezier(0.3, 0, 0.8, 0.15)"
    linear:                "linear"

# ─── Breakpoints ─────────────────────────────────────────────────────────────
