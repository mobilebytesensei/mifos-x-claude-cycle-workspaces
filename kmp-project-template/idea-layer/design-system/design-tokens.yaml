# ─── Typography (Plus Jakarta Sans; JetBrains Mono for numerics) ──────────────
typography:
  font_family:         "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
  font_family_display: "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif"
  font_family_mono:    "'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace"

  display_large:   { size: "48px", line_height: "56px", weight: 700, letter_spacing: "-0.25px" }
  display_medium:  { size: "38px", line_height: "46px", weight: 700, letter_spacing: "0" }
  display_small:   { size: "30px", line_height: "38px", weight: 700, letter_spacing: "0" }
  headline_large:  { size: "26px", line_height: "34px", weight: 700, letter_spacing: "0" }
  headline_medium: { size: "22px", line_height: "30px", weight: 600, letter_spacing: "0" }
  headline_small:  { size: "20px", line_height: "27px", weight: 600, letter_spacing: "0" }
  title_large:     { size: "18px", line_height: "24px", weight: 600, letter_spacing: "0" }
  title_medium:    { size: "16px", line_height: "22px", weight: 600, letter_spacing: "0.1px" }
  title_small:     { size: "14px", line_height: "20px", weight: 600, letter_spacing: "0.1px" }
  body_large:      { size: "16px", line_height: "24px", weight: 400, letter_spacing: "0.1px" }
  body_medium:     { size: "14px", line_height: "20px", weight: 400, letter_spacing: "0.15px" }
  body_small:      { size: "12px", line_height: "17px", weight: 400, letter_spacing: "0.2px" }
  label_large:     { size: "14px", line_height: "20px", weight: 600, letter_spacing: "0.1px" }
  label_medium:    { size: "12px", line_height: "16px", weight: 600, letter_spacing: "0.3px" }
  label_small:     { size: "11px", line_height: "15px", weight: 600, letter_spacing: "0.3px" }

# ─── Spacing (8pt grid; 4dp base unit) ─────────────────────────────────────────
spacing:
  none:  "0"
  xxs:   "2px"
  xs:    "4px"
  sm:    "8px"
  md:    "16px"
  lg:    "24px"
  xl:    "32px"
  xxl:   "48px"
  xxxl:  "64px"
  base_unit: 4

# ─── Corner radius ──────────────────────────────────────────────────────────
radius:
  none: "0"
  xs:   "6px"
  sm:   "10px"
  md:   "16px"
  lg:   "20px"
  xl:   "28px"
  full: "9999px"

# ─── Elevation (M3 level0-5 → CSS box-shadow, CRAFT §7a) ──────────────────────
elevation:
  level0: "none"
  level1: "0 1px 3px rgba(28,17,84,0.08), 0 1px 2px rgba(28,17,84,0.06)"
  level2: "0 3px 8px rgba(28,17,84,0.10), 0 2px 4px rgba(28,17,84,0.08)"
  level3: "0 8px 20px rgba(28,17,84,0.14), 0 4px 8px rgba(28,17,84,0.10)"
  level4: "0 12px 28px rgba(28,17,84,0.16)"
  level5: "0 20px 40px rgba(28,17,84,0.20)"

# ─── Border ────────────────────────────────────────────────────────────────
border:
  none:   "0"
  thin:   "1px"
  medium: "2px"
  thick:  "4px"
  focus:  "2px"

# ─── Opacity ───────────────────────────────────────────────────────────────
