# Generated by /idea-render-mockup Phase 1 bootstrap (2026-08-08) — Phase 11 app-shell coherence.
# Money Toolkit — grounded in cmp-navigation/authenticatednavbar/AuthenticatedNavbarNavigationScreen.kt
# (per idea-layer/screens/home/ui.yaml#/shell). Two bottom-nav tabs: Home + Profile. Every
# OTHER screen is reached via outbound cross-feature navigation (feature_row / see-all /
# card taps on Home) and is a PUSHED destination — top app bar with back, no bottom nav.
schema_version: "1.0"
project: "money-toolkit"

# ─── Bottom navigation (start destination = home; only Home + Profile are tabs) ──
bottom_navigation:
  enabled: true
  items:
    - id: home
      label: "Home"
      icon: "home"
      target_screen: home
      order: 0
    - id: profile
      label: "Profile"
      icon: "person"
      target_screen: profile
      order: 1
  selected_color: "primary"
  unselected_color: "on-surface-variant"

# ─── Top app bar ──────────────────────────────────────────────────────────
top_app_bar:
  enabled: true
  variant: "center_aligned"
  title_source: "screen"
  static_title: null
  leading: "auto"
  trailing_actions: []

# ─── Navigation drawer — not used (bottom-nav + push stack only) ──────────
drawer:
  enabled: false

# ─── FAB host ──────────────────────────────────────────────────────────────
fab_host:
  enabled: true
  default_position: "bottom-end"
  per_screen_overrideable: true

# ─── Snackbar host ───────────────────────────────────────────────────────
snackbar_host:
  enabled: true
  default_position: "bottom"
  z_index: 100

# ─── Safe-area handling ──────────────────────────────────────────────────
safe_area:
  top: "respect"
  bottom: "respect"
  notch_handling: "extend-and-pad"

# ─── Per-screen defaults (screen.ui.yaml.shell overrides these) ───────────
defaults:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  drawer_accessible: false
  fab_visible: false
  snackbar_visible: true

# ─── Per-screen resolution notes (informational — actual resolution merges
#     this file with each screen's ui.yaml#/shell) ─────────────────────────
# home, profile               → bottom_navigation_visible: true  (the two tabs)
# every OTHER screen           → bottom_navigation_visible: false (pushed destination,
#                                 top_app_bar with back_action per its own ui.yaml#/shell)
