# RateHistory — currency domain model (core/model/demo/currency/RateHistory.kt), the
# RateHistoryDto.toDomain(target) projection. Cached in the LOCAL Room table rate_history
# via RateHistoryStore (Store5 NETWORK_WITH_CACHE, dynamic RateHistoryKey). origin
# synthetic (client domain; external wire is RateHistoryDto). Reverse-engineered from
# screens/currency-rates/api.yaml (historical-rates) + data-flow.yaml.
name: RateHistory
version: "1.0.0"
description: >-
  A historical FX series for a from→to currency pair over a window (7/14/30/90 days).
  The domain shape is a sorted List<RatePoint(date, value)>; modeled here as an ordered
  date→value map for the registry contract. Rendered by the rate-history chart with
  stale carry-forward on a failed key change.
source:
  origin: synthetic
fields:
  - { name: from,      type: String, description: "Base currency (USD)." }
  - { name: to,        type: String, description: "Target currency (INR/EUR/GBP/JPY/AUD)." }
  - { name: startDate, type: String, description: "Window start (YYYY-MM-DD, key-derived)." }
  - { name: endDate,   type: String, description: "Window end (YYYY-MM-DD, key-derived)." }
  - { name: rates,     type: { map_of: { key: String, value: Double } }, description: "date (YYYY-MM-DD) → target rate; domain is List<RatePoint(date,value)>." }
used_by:
  - { feature: currencyRates, kind: response, api_id: historical-rates, role: body }
capabilities_used: [has_api]
tier: medium
tags: [currency, frankfurter, network-with-cache, domain, time-series]
