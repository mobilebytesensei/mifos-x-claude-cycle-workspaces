# CoinDetailDto — CoinGecko /api/v3/coins/{id} wire shape
# (core/network/demo/crypto/api/CoinGeckoApi.kt). THIRD-PARTY wire, no first-party
# server → origin synthetic (see CoinMarketDto note). The wire nests market_data{…}/
# image{large}/description{en}; flattened here with source-note fields. Maps via
# toDomain() → CoinDetail.
name: CoinDetailDto
version: "1.0.0"
description: >-
  Wire shape from CoinGecko GET api/v3/coins/{id} (localization/tickers/community/developer
  data forced off). USD values pulled from the per-currency maps (marketData.currentPrice[usd]
  etc.); absent fields default to 0.0/0L/''. External endpoint — not server-backed.
source:
  origin: synthetic
fields:
  - { name: id,                          type: String, description: "Coin id." }
  - { name: name,                        type: String, description: "Display name." }
  - { name: symbol,                      type: String, description: "Ticker symbol." }
  - { name: image_large,                 type: { optional: String }, required: false, source_field: "image.large", description: "Large icon URL." }
  - { name: current_price_usd,           type: { optional: Double }, required: false, source_field: "market_data.current_price.usd", description: "USD price." }
  - { name: market_cap_usd,              type: { optional: Double }, required: false, source_field: "market_data.market_cap.usd", description: "USD market cap." }
  - { name: market_cap_rank,             type: { optional: Int },    required: false, source_field: "market_data.market_cap_rank", description: "Rank." }
  - { name: price_change_percentage_24h, type: { optional: Double }, required: false, source_field: "market_data.price_change_percentage_24h", description: "24h % change." }
  - { name: high_24h_usd,                type: { optional: Double }, required: false, source_field: "market_data.high_24h.usd", description: "24h high USD." }
  - { name: low_24h_usd,                 type: { optional: Double }, required: false, source_field: "market_data.low_24h.usd", description: "24h low USD." }
  - { name: circulating_supply,          type: { optional: Double }, required: false, source_field: "market_data.circulating_supply", description: "Circulating supply." }
  - { name: max_supply,                  type: { optional: Double }, required: false, source_field: "market_data.max_supply", description: "Max supply." }
  - { name: description_en,              type: { optional: String }, required: false, source_field: "description.en", description: "English description." }
used_by:
  - { feature: crypto, kind: response, api_id: coingecko-coin-detail, role: body }
capabilities_used: [has_api]
tier: medium
tags: [crypto, coingecko, external-wire, third-party-rest]
