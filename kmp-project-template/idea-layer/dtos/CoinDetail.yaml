# CoinDetail — crypto detail domain model (core/model/demo/crypto/CoinDetail.kt), the
# CoinDetailDto.toDomain() projection (adds circulatingSupply/maxSupply/description over
# CoinMarket). Cached in the LOCAL Room table coin_detail via CoinDetailStore (Store5
# NETWORK_WITH_CACHE). Data-wired at HEAD; the CoinDetailScreen UI is NOT shipped
# (CryptoNavigation no-ops onCoinClick) but the full data contract is modeled.
# origin synthetic (client domain projection; external wire shape is CoinDetailDto).
name: CoinDetail
version: "1.0.0"
description: >-
  Full per-coin detail — the market row plus circulating/max supply and a description.
  Consumed by the (planned) coin-detail destination and reused by the watchlist row
  short-tap navigation. 5-minute Store5 TTL.
source:
  origin: synthetic
fields:
  - { name: id,                     type: String,             description: "Coin id." }
  - { name: name,                   type: String,             description: "Display name." }
  - { name: symbol,                 type: String,             description: "Ticker symbol." }
  - { name: imageUrl,               type: String,             description: "Coin icon URL (wire: image.large)." }
  - { name: currentPrice,           type: Double,             description: "Current USD price (marketData.currentPrice[usd])." }
  - { name: marketCap,              type: Double,             description: "Market cap USD." }
  - { name: marketCapRank,          type: Int,                description: "Rank by market cap." }
  - { name: priceChangePercent24h,  type: Double,             description: "24h % change." }
  - { name: high24h,                type: Double,             description: "24h high USD." }
  - { name: low24h,                 type: Double,             description: "24h low USD." }
  - { name: circulatingSupply,      type: Double,             description: "Circulating supply." }
  - { name: maxSupply,              type: { optional: Double }, required: false, description: "Max supply (absent → null)." }
  - { name: description,            type: String,             description: "English description (wire: description.en; absent → '')." }
used_by:
  - { feature: crypto,    kind: response,     api_id: coingecko-coin-detail,     role: body }
  - { feature: watchlist, kind: subscription, api_id: crypto-coin-detail-stream, role: value-join }
capabilities_used: [has_api]
tier: medium
tags: [crypto, coingecko, network-with-cache, domain, planned-ui]
