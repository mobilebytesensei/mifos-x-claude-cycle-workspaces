# RateHistoryDto — Frankfurter GET v1/{start}..{end} wire shape
# (core/network/demo/currency/api/FrankfurterApi.kt). THIRD-PARTY public FX API, no
# first-party server → origin synthetic (see CoinMarketDto note). Maps via
# toDomain(target) → RateHistory (projects each day's target value into RatePoint).
name: RateHistoryDto
version: "1.0.0"
description: >-
  Wire shape from Frankfurter GET v1/{startDate}..{endDate}?from={base}&to={target}
  (open, no key). `rates` is a nested date→{code→rate} map. Frankfurter may return an
  end_date earlier than requested (last business day). External endpoint — not server-backed.
source:
  origin: synthetic
fields:
  - { name: amount,     type: Double, description: "Base amount." }
  - { name: base,       type: String, description: "Echoed base (from)." }
  - { name: start_date, type: String, source_field: start_date, description: "Series start (YYYY-MM-DD)." }
  - { name: end_date,   type: String, source_field: end_date,   description: "Series end (YYYY-MM-DD)." }
  - { name: rates,      type: { map_of: { key: String, value: { map_of: { key: String, value: Double } } } }, description: "date → { targetCode → rate }." }
used_by:
  - { feature: currencyRates, kind: response, api_id: historical-rates, role: body }
capabilities_used: [has_api]
tier: minimal
tags: [currency, frankfurter, external-wire, third-party-rest]
