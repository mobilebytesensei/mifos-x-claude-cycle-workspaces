# BillReminderSchedule — platform notification-scheduling payload
# (core/model + BillNotificationGateway.schedule(BillReminderSchedule)). NOT a Room
# row and NOT a network shape — it is the value handed to the expect/actual
# BillReminderScheduler. origin synthetic (client-composed side-effect payload).
# Reverse-engineered from screens/bills/api.yaml + data-flow.yaml platform_side_effect.
name: BillReminderSchedule
version: "1.0.0"
description: >-
  The payload for scheduling a local device notification for a bill. Computed by
  BillReminderRecurrence.nextDueDate + reminderTriggerMs (09:00 local, reminderDaysBefore
  before due-date) and passed to BillReminderScheduler (WorkManager / UNUserNotificationCenter
  / no-op). Best-effort — a past instant or denied permission is a silent no-op.
source:
  origin: synthetic
fields:
  - { name: billId,      type: String, description: "The bill this schedule belongs to (cancel key)." }
  - { name: title,       type: String, description: "Notification title." }
  - { name: body,        type: String, description: "Notification body ('Due in {reminderDaysBefore} day(s)')." }
  - { name: triggerAtMs, type: Long,   description: "When the notification fires (epoch ms, local 09:00 lead)." }
used_by:
  - { feature: bills, kind: request, api_id: schedule-bill-notification, role: payload }
capabilities_used: [has_api]
tier: minimal
tags: [banking, platform-notification, side-effect]
