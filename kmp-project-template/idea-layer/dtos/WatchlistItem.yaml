# WatchlistItem — UI projection of the watch-list membership row
# (WatchlistEntity → {coinId, addedAtMs}). Backed by the LOCAL Room table
# personal_watchlist (WatchlistDao) through WatchlistRepository — a direct DAO +
# core-base/database invalidation bridge (NOT a Store5 store). origin synthetic
# (local membership; no first-party server). The live coin values it renders come
# from feat-crypto's CoinMarket/CoinDetail streams, not from this row.
name: WatchlistItem
version: "1.0.0"
description: >-
  One tracked coin in the personal watchlist — the coin id plus when it was added.
  Persisted locally; read reactively (order addedAtMs DESC) and toggled via a simple
  SubmitHandler (add=insert REPLACE, remove=delete; both idempotent). Joined against
  the crypto market stream (WatchlistItem.coinId == CoinMarket.id) to render live price.
source:
  origin: synthetic
fields:
  - { name: coinId,    type: String, description: "Tracked coin id; join key to CoinMarket.id." }
  - { name: addedAtMs, type: Long,   description: "When the coin was added (list order desc)." }
used_by:
  - { feature: watchlist, kind: response, api_id: observe-watchlist,    role: body }
  - { feature: watchlist, kind: request,  api_id: add-to-watchlist,     role: key }
capabilities_used: [has_offline_cache]
tier: minimal
tags: [watchlist, local-room, offline-first]
