# ExchangeRatesDto — Frankfurter GET v1/latest wire shape
# (core/network/demo/currency/api/FrankfurterApi.kt). THIRD-PARTY public FX API, no
# first-party server → origin synthetic (see CoinMarketDto note). Maps via toDomain()
# → ExchangeRates (drops amount).
name: ExchangeRatesDto
version: "1.0.0"
description: >-
  Wire shape from Frankfurter GET v1/latest?from={base} (open, no key). External
  endpoint — not server-backed.
source:
  origin: synthetic
fields:
  - { name: amount, type: Double, description: "Base amount (typically 1.0); dropped in toDomain()." }
  - { name: base,   type: String, description: "Echoed base currency code." }
  - { name: date,   type: String, description: "Rate date (YYYY-MM-DD)." }
  - { name: rates,  type: { map_of: { key: String, value: Double } }, description: "Target code → rate." }
used_by:
  - { feature: currencyRates, kind: response, api_id: latest-rates,      role: body }
  - { feature: home,          kind: response, api_id: frankfurter-latest, role: body }
capabilities_used: [has_api]
tier: minimal
tags: [currency, frankfurter, external-wire, third-party-rest]
