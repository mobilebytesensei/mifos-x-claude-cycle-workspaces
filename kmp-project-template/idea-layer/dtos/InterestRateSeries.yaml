# InterestRateSeries — economic domain model
# (core/model/demo/economic/InterestRateSeries.kt), the FredObservationsDto.toDomain
# projection. Cached in the LOCAL Room table interest_rate_series via
# InterestRateSeriesStore (Store5 NETWORK_WITH_CACHE, 24h TTL) over the FRED API.
# origin synthetic (client domain; external wire is FredObservationsDto).
# Reverse-engineered from screens/{rates,home}/api.yaml + data-flow.yaml.
name: InterestRateSeries
version: "1.0.0"
description: >-
  A FRED interest-rate series (fed funds / prime / 30Y mortgage / 10Y treasury) with its
  observations and latest value. The domain shape is List<RateObservation(date, value)>;
  modeled here as an ordered date→value map. name + unit are threaded from the request key
  (FRED omits them). Rendered by the 4-row list and per-series detail; the home tile reads
  only `current` for 2 series.
source:
  origin: synthetic
fields:
  - { name: seriesId,     type: String,                        description: "FRED series id (DFF/DPRIME/MORTGAGE30US/DGS10)." }
  - { name: name,         type: String,                        description: "Human series name (from request key)." }
  - { name: unit,         type: String,                        description: "Unit label (e.g. %) (from request key)." }
  - { name: current,      type: { optional: Double }, required: false, description: "Latest observation value (last.value); null when no data." }
  - { name: observations, type: { map_of: { key: String, value: Double } }, description: "date (YYYY-MM-DD) → value; '.' missing markers stripped; domain is List<RateObservation(date,value)>." }
used_by:
  - { feature: rates, kind: response, api_id: fred-series-observations, role: body }
  - { feature: home,  kind: response, api_id: fred-series-observations, role: nested }
capabilities_used: [has_api]
tier: medium
tags: [economic, fred, network-with-cache, domain, time-series]
