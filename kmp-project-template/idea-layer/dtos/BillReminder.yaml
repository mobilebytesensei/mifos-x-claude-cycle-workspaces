# BillReminder — fork-owned banking domain model (core/model/demo/banking/BillReminder.kt).
# Backed by the LOCAL Room table banking_bill_reminders (BillReminderDao) through
# BillReminderRepository / BillRemindersStore (Store5 OFFLINE_LOCAL_ONLY). No
# first-party server → origin synthetic. Reverse-engineered from screens/{bills,home}/
# api.yaml + data-flow.yaml.
name: BillReminder
version: "1.0.0"
description: >-
  A recurring bill reminder — amount, due-day, recurrence and notification lead
  time. Persisted locally in Room; read by the bills list and the home upcoming-bills
  tile; written by the bill add/edit form and the mark-paid / toggle-enabled / delete
  list actions (delete + toggle are ViewModel-only, not surfaced in the shipped UI).
source:
  origin: synthetic
fields:
  - { name: id,                 type: String,  description: "Primary key (banking_bill_reminders.id)." }
  - { name: name,               type: String,  description: "Bill label." }
  - { name: amount,             type: Double,  description: "Bill amount; summed into totalUpcomingAmount." }
  - { name: dueDay,             type: Int,     description: "Day-of-month due (1..31); upcoming-window math wraps the month." }
  - { name: recurrence,         type: String,  description: "BillRecurrence domain enum (kept String at screen-surface fidelity)." }
  - { name: category,           type: String,  description: "Bill category label." }
  - { name: enabled,            type: Boolean, description: "Whether the reminder is active (drives the upcoming filter)." }
  - { name: reminderDaysBefore, type: Int,     description: "Days before due-date to fire the notification." }
  - { name: createdAtMs,        type: Long,    description: "Creation epoch ms." }
  - { name: updatedAtMs,        type: Long,    description: "Last-update epoch ms." }
used_by:
  - { feature: bills, kind: response, api_id: observe-all-bills,   role: body }
  - { feature: bills, kind: response, api_id: get-bill-by-id,      role: body }
  - { feature: bills, kind: request,  api_id: upsert-bill,         role: body }
  - { feature: bills, kind: request,  api_id: delete-bill,         role: key }
  - { feature: home,  kind: response, api_id: observe-upcoming-bills, role: nested }
capabilities_used: [has_offline_cache]
tier: medium
tags: [banking, local-room, offline-first]
