# PriceAlert — fork-owned alerts domain model (core/model/demo/alerts/PriceAlert.kt).
# Backed by the LOCAL Room table `alerts` (AlertDao) through AlertsRepository /
# AlertsStore (Store5 OFFLINE_LOCAL_ONLY). origin synthetic (no first-party server).
# ⚠ Persistence is LOSSY (AlertEntity has no `enabled`/PCT_CHANGE): direction collapses
# to conditionAbove and enabled reads back true. Reverse-engineered from
# screens/alerts/api.yaml + data-flow.yaml.
name: PriceAlert
version: "1.0.0"
description: >-
  A user-configured crypto price threshold. Persisted locally in Room; read by the
  alerts list; written by the alert add/edit form (DraftSubmitHandler + OfflineSubmitSyncer
  outbox) and removed by the list delete action. @Serializable so the outbox can JSON-encode
  an unsent payload into framework_submit_drafts.
source:
  origin: synthetic
fields:
  - { name: id,          type: String,                     description: "Primary key (alerts.id)." }
  - { name: coinId,      type: String,                     description: "Tracked coin id (e.g. bitcoin)." }
  - { name: direction,   type: { enum_ref: AlertDirection }, description: "Threshold direction; persistence collapses to conditionAbove (ABOVE→true)." }
  - { name: targetValue, type: Double,                     description: "Trigger price / percentage target." }
  - { name: enabled,     type: Boolean,                    description: "Active flag (NOT persisted — reads back true)." }
  - { name: createdAtMs, type: Long,                       description: "Creation epoch ms (list order: createdAt DESC)." }
enums:
  - name: AlertDirection
    description: "Alert trigger direction. Only ABOVE/BELOW survive the lossy AlertEntity.conditionAbove mapping."
    values:
      - { id: ABOVE,      description: "Fires when price rises above targetValue (conditionAbove=true)." }
      - { id: BELOW,      description: "Fires when price falls below targetValue (conditionAbove=false)." }
      - { id: PCT_CHANGE, description: "Percentage-change alert (NOT persisted — folds to BELOW on round-trip)." }
used_by:
  - { feature: alerts, kind: response, api_id: observe-all-alerts, role: body }
  - { feature: alerts, kind: request,  api_id: submit-alert,       role: body }
  - { feature: alerts, kind: request,  api_id: delete-alert,       role: key }
capabilities_used: [has_offline_cache]
tier: medium
tags: [alerts, local-room, offline-first, lossy-persistence]
