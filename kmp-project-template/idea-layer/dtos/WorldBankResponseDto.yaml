# WorldBankResponseDto — World Bank Open Data v2/country/{c}/indicator/{i} wire shape
# (core/network/demo/economic/api/WorldBankApi.kt). The wire is a TWO-element JSON array
# [metadata, observations[]] destructured by a custom WorldBankResponseSerializer.
# THIRD-PARTY public API, no first-party server → origin synthetic (see CoinMarketDto
# note). Maps via toDomain → MacroIndicator.
name: WorldBankResponseDto
version: "1.0.0"
description: >-
  Wire shape from World Bank GET v2/country/{code}/indicator/{code}?format=json (open,
  no key). Metadata half (only `total` used — was there data) plus the observations half
  (year→value, nulls explicit). On 404/rate-limit the API returns {"message":[…]} which
  the serializer maps to an empty object. External endpoint — not server-backed.
source:
  origin: synthetic
fields:
  - { name: page,         type: { optional: Int }, required: false, description: "Metadata: page (1-based)." }
  - { name: pages,        type: { optional: Int }, required: false, description: "Metadata: total pages." }
  - { name: perPage,      type: { optional: Int }, required: false, source_field: per_page, description: "Metadata: rows per page." }
  - { name: total,        type: Int, description: "Metadata: total rows — used to detect 'any data returned'." }
  - { name: countryIso3,  type: { optional: String }, required: false, source_field: countryiso3code, description: "Observation: ISO-3 country code (threads countryName)." }
  - { name: indicatorId,  type: { optional: String }, required: false, source_field: "indicator.id", description: "Observation: indicator code." }
  - { name: observations, type: { map_of: { key: String, value: { optional: Double } } }, description: "date (YYYY) → value; explicit nulls for years with no data (dropped in toDomain)." }
used_by:
  - { feature: macro, kind: response, api_id: worldbank-country-indicator, role: body }
capabilities_used: [has_api]
tier: medium
tags: [economic, worldbank, external-wire, third-party-rest]
