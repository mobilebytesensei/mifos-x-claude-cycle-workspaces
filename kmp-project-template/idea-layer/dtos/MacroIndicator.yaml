# MacroIndicator — economic domain model (core/model/demo/economic/MacroIndicator.kt),
# the WorldBankResponseDto.toDomain projection. Cached in-memory ONLY via
# MacroIndicatorStore (Store5 MEMORY_ONLY — createMemoryStore, NO Room, NO SourceOfTruth,
# lost on process death) over the World Bank Open Data API. origin synthetic (client
# domain; external wire is WorldBankResponseDto). Reverse-engineered from screens/macro/
# api.yaml + data-flow.yaml.
name: MacroIndicator
version: "1.0.0"
description: >-
  A country macro indicator time-series (GDP / CPI inflation / unemployment / …) with
  its annual observations. The domain shape is List<IndicatorObservation(year, value)>;
  modeled here as an ordered year→value map. Rendered by the 3-card dashboard and the
  per-indicator detail; 7-day TTL, in-memory only (cold start re-fetches).
source:
  origin: synthetic
fields:
  - { name: countryCode,  type: String,                        description: "ISO 3166-1 alpha-2 country code." }
  - { name: countryName,  type: String,                        description: "Resolved country name (from first observation, falls back to code)." }
  - { name: indicator,    type: { enum_ref: IndicatorKind },   description: "Which macro indicator this series is." }
  - { name: observations, type: { map_of: { key: String, value: Double } }, description: "year (YYYY) → value; nulls dropped, sorted ascending; domain is List<IndicatorObservation(year,value)>." }
  - { name: source,       type: String,                        description: "Data source label ('World Bank Open Data')." }
enums:
  - name: IndicatorKind
    description: "World Bank indicator (IndicatorKind enum → worldBankCode)."
    values:
      - { id: GDP,            description: "GDP (current US$) — NY.GDP.MKTP.CD (dashboard)." }
      - { id: INFLATION_CPI,  description: "Inflation, consumer prices annual % — FP.CPI.TOTL.ZG (dashboard)." }
      - { id: UNEMPLOYMENT,   description: "Unemployment, total % labor force — SL.UEM.TOTL.ZS (dashboard)." }
      - { id: GDP_PER_CAPITA, description: "GDP per capita (current US$) — NY.GDP.PCAP.CD." }
      - { id: GINI,           description: "GINI index (income inequality) — SI.POV.GINI." }
used_by:
  - { feature: macro, kind: response, api_id: worldbank-country-indicator, role: body }
capabilities_used: [has_api]
tier: medium
tags: [economic, worldbank, memory-only, domain, time-series]
