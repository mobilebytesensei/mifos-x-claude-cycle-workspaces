# Loan — fork-owned banking domain model (core/model/demo/banking/Loan.kt).
# Backed by the LOCAL Room table banking_loans (LoanDao) through LoanRepository /
# LoansStore (Store5 OFFLINE_LOCAL_ONLY). This template has NO first-party server:
# origin is `synthetic` because there is no owned backend wire shape — the shape is
# the on-device Room/domain contract. Reverse-engineered from screens/{loans,home,
# amortization}/api.yaml + data-flow.yaml (NOT from core/model Kotlin).
name: Loan
version: "1.0.0"
description: >-
  A tracked loan in the Money Toolkit — principal, rate, tenure and derived
  repayment fields. Persisted locally in Room (banking_loans); read reactively by
  the loans list/detail, the home dashboard summary, and the amortization schedule;
  written by the loan add/edit form and the calculator wizard.
source:
  origin: synthetic          # local Room domain model; no first-party server wire shape
fields:
  - { name: id,                  type: String,  description: "Stable primary key (banking_loans.id)." }
  - { name: name,                type: String,  description: "User-entered loan label." }
  - { name: kind,                type: String,  description: "LoanKind domain enum (HOME/AUTO/… — kept String at screen-surface fidelity; enum values not declared in the api/data-flow surface)." }
  - { name: principal,           type: Double,  description: "Original loan principal." }
  - { name: principalRemaining,  type: Double,  description: "Outstanding principal; drives totalPrincipalRemaining aggregate." }
  - { name: annualRatePercent,   type: Double,  description: "Annual interest rate (APR %)." }
  - { name: tenureMonths,        type: Int,     description: "Original term in months." }
  - { name: monthsRemaining,     type: Int,     description: "Remaining installments; row count for amortization." }
  - { name: monthlyPayment,      type: Double,  description: "EMI; summed into totalMonthlyEmi." }
  - { name: nextDueDate,         type: { optional: Long }, required: false, description: "Next due-date epoch ms (list order: nextDueDate ASC)." }
  - { name: totalPaid,           type: Double,  description: "Cumulative amount paid to date." }
  - { name: createdAtMs,         type: Long,    description: "Creation epoch ms." }
  - { name: updatedAtMs,         type: Long,    description: "Last-update epoch ms." }
used_by:
  - { feature: loans,        kind: response, api_id: observe-all-loans,     role: body }
  - { feature: loans,        kind: response, api_id: observe-loan-by-id,    role: body }
  - { feature: loans,        kind: request,  api_id: upsert-loan,           role: body }
  - { feature: amortization, kind: response, api_id: observe-loan-by-id,    role: body }
  - { feature: home,         kind: response, api_id: observe-all-loans,     role: nested }
capabilities_used: [has_offline_cache]
tier: medium
tags: [banking, local-room, offline-first]
