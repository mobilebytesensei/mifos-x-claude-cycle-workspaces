# FredObservationsDto — FRED GET fred/series/observations wire shape
# (core/network/demo/economic/api/FredApi.kt). THIRD-PARTY API (requires an api_key
# query param — vault alias mifos_x_fred_api_key), no first-party server → origin
# synthetic (see CoinMarketDto note). Maps via toDomain → InterestRateSeries
# (name/unit threaded from the request key; "." missing markers stripped).
name: FredObservationsDto
version: "1.0.0"
description: >-
  Wire shape from FRED GET fred/series/observations?series_id=…&api_key=…&file_type=json.
  Each observation is {date, value} where value is a STRING and "." marks missing data.
  External endpoint — not server-backed; an absent api_key surfaces ScreenState.Error.
source:
  origin: synthetic
fields:
  - { name: observations, type: { map_of: { key: String, value: String } }, description: "date (YYYY-MM-DD) → value string; '.' == missing (NO_DATA_MARKER), stripped in toDomain." }
used_by:
  - { feature: rates, kind: response, api_id: fred-series-observations, role: body }
  - { feature: home,  kind: response, api_id: fred-series-observations, role: body }
capabilities_used: [has_api]
tier: minimal
tags: [economic, fred, external-wire, third-party-rest, requires-api-key]
