# CoinMarketDto — CoinGecko /api/v3/coins/markets wire row
# (core/network/demo/crypto/api/CoinGeckoApi.kt, Ktorfit). THIRD-PARTY wire shape,
# NOT a first-party server contract — this template has no owned server-layer/api_specs.
# origin synthetic is used deliberately so RULE-DTO-REGISTRY-001 D6 (server-owned
# origin match) is not falsely tripped for an external public API. The external
# endpoint is documented in `description`/`tags`. Maps via toDomain() → CoinMarket.
name: CoinMarketDto
version: "1.0.0"
description: >-
  Wire shape from CoinGecko GET api/v3/coins/markets (public, no auth). Snake_case
  fields per the JSON; nullable 24h fields default in toDomain() (priceChange→0.0,
  high/low→currentPrice). External endpoint — not backed by this template's server.
source:
  origin: synthetic
fields:
  - { name: id,                            type: String, description: "Coin id." }
  - { name: symbol,                         type: String, description: "Ticker symbol." }
  - { name: name,                           type: String, description: "Display name." }
  - { name: image,                          type: String, description: "Icon URL → CoinMarket.imageUrl." }
  - { name: current_price,                  type: Double, description: "Current USD price." }
  - { name: market_cap,                     type: Double, description: "Market cap USD." }
  - { name: market_cap_rank,                type: Int,    description: "Rank by market cap." }
  - { name: price_change_percentage_24h,    type: { optional: Double }, required: false, description: "24h % change (nullable → 0.0)." }
  - { name: high_24h,                       type: { optional: Double }, required: false, description: "24h high (nullable → currentPrice)." }
  - { name: low_24h,                        type: { optional: Double }, required: false, description: "24h low (nullable → currentPrice)." }
used_by:
  - { feature: crypto, kind: response, api_id: coingecko-coins-markets, role: body }
capabilities_used: [has_api]
tier: medium
tags: [crypto, coingecko, external-wire, third-party-rest]
