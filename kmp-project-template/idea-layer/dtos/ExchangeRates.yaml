# ExchangeRates — currency domain model (core/model/demo/currency/ExchangeRates.kt),
# the ExchangeRatesDto.toDomain() projection (drops amount). Cached in the LOCAL Room
# table exchange_rates via ExchangeRatesStore / SpotRateLookupStore (Store5
# NETWORK_WITH_CACHE over the Frankfurter public FX API). origin synthetic (client
# domain; external wire is ExchangeRatesDto). Reverse-engineered from
# screens/{currency-rates,home}/api.yaml + data-flow.yaml.
name: ExchangeRates
version: "1.0.0"
description: >-
  Latest FX rates for a base currency — a code→rate map plus the rate date. Rendered
  by the currency list (search-filtered), the embedded spot converter, and the home
  exchange-rate tile (PERIODIC 5-min refresh). Base is USD at v1.
source:
  origin: synthetic
fields:
  - { name: base,  type: String, description: "Base currency code (USD at v1)." }
  - { name: date,  type: String, description: "Rate date (YYYY-MM-DD)." }
  - { name: rates, type: { map_of: { key: String, value: Double } }, description: "Target currency code → rate." }
used_by:
  - { feature: currencyRates, kind: response, api_id: latest-rates,      role: body }
  - { feature: home,          kind: response, api_id: frankfurter-latest, role: nested }
capabilities_used: [has_api]
tier: medium
tags: [currency, frankfurter, network-with-cache, domain]
