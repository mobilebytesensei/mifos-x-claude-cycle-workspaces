# CoinMarket — crypto domain model (core/model/demo/crypto/CoinMarket.kt), the
# CoinMarketDto.toDomain() projection. Cached in the LOCAL Room table coin_markets
# via CoinMarketsStore (Store5 NETWORK_WITH_CACHE over the CoinGecko public API).
# origin synthetic (client domain projection; the external wire shape is CoinMarketDto,
# not a first-party server shape). Reverse-engineered from screens/{crypto,watchlist}/
# api.yaml + data-flow.yaml.
name: CoinMarket
version: "1.0.0"
description: >-
  A coin markets row — symbol, name, USD price, market cap and 24h change. Rendered by
  the paged crypto markets list and joined into watchlist rows for live value resolution.
  Backed by a paged Store5 cache (Room coin_markets, ordered by marketCapRank).
source:
  origin: synthetic
fields:
  - { name: id,                     type: String, description: "Coin id (e.g. bitcoin); join key for watchlist." }
  - { name: symbol,                 type: String, description: "Ticker symbol (e.g. btc)." }
  - { name: name,                   type: String, description: "Display name (e.g. Bitcoin)." }
  - { name: imageUrl,               type: String, description: "Coin icon URL (wire: image)." }
  - { name: currentPrice,           type: Double, description: "Current USD price." }
  - { name: marketCap,              type: Double, description: "Market capitalization (USD)." }
  - { name: marketCapRank,          type: Int,    description: "Rank by market cap (list order asc)." }
  - { name: priceChangePercent24h,  type: Double, description: "24h % change (wire nullable → 0.0)." }
  - { name: high24h,                type: Double, description: "24h high (wire nullable → currentPrice)." }
  - { name: low24h,                 type: Double, description: "24h low (wire nullable → currentPrice)." }
used_by:
  - { feature: crypto,    kind: response,     api_id: coingecko-coins-markets,    role: body }
  - { feature: watchlist, kind: subscription, api_id: crypto-coin-markets-stream, role: value-join }
capabilities_used: [has_api]
tier: medium
tags: [crypto, coingecko, network-with-cache, domain]
