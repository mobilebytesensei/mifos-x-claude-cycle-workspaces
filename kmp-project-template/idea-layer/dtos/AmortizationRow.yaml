# AmortizationRow — computed (derived) domain model
# (core/model/demo/banking/AmortizationRow.kt). Produced purely in-memory by
# AmortizationScheduleViewModel.computeSchedule(loan) — NO data source, NO I/O, NO
# persistence. origin synthetic (client-computed composite). Reverse-engineered from
# screens/amortization/api.yaml (compute-amortization-schedule) + data-flow.yaml.
name: AmortizationRow
version: "1.0.0"
description: >-
  One month of a reducing-balance amortization schedule computed from a Loan. Per row:
  interest = balance × (annualRatePercent/100/12) [0 when rate==0]; principal =
  min(monthlyPayment − interest, balance) [last row clamps]; balance = max(0, balance −
  principal). Row count == loan.monthsRemaining; runs in microseconds (not paginated).
source:
  origin: synthetic
fields:
  - { name: month,     type: Int,    description: "1-based installment index." }
  - { name: payment,   type: Double, description: "Payment for the month (== loan.monthlyPayment)." }
  - { name: principal, type: Double, description: "Principal portion of the payment." }
  - { name: interest,  type: Double, description: "Interest portion of the payment." }
  - { name: balance,   type: Double, description: "Outstanding balance after this payment." }
used_by:
  - { feature: amortization, kind: response, api_id: compute-amortization-schedule, role: body }
capabilities_used: [has_api]
tier: minimal
tags: [banking, computed, pure-local]
