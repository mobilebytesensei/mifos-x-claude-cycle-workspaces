# VISION.yaml — Money Toolkit (kmp-project-template)
# Structured aim / quality bar / completeness dimensions.
# Bootstrapped from idea-layer/IDEA.md + FEATURES.md via the sanctioned
# vision oracle (layers/idea/commands/_shared/vision-enrichment.md) — matrix-green
# conjunct-4 (AC-VISION-BOOTSTRAP / AC-15). Schema: core/schemas/vision.schema.json.

vision_statement: >-
  Money Toolkit is a white-label Kotlin Multiplatform finance-utility template — a
  production-wired starting point that ships as a runnable demo of 15 feature modules
  across five targets (Android, iOS, macOS, Desktop/JVM, Web) with no login and no
  backend of its own, and doubles as the reference implementation of every
  core-base/store Store5 persistence archetype. It is offline-first by default, forks
  and rebrands in minutes via customizer.sh, and degrades gracefully to in-app
  "key not configured" / offline / empty states instead of crashing.

quality_bar:
  ship_gate: device-verified
  zero_gap_required: false

completeness_dimensions:
  - structural
  - behavioral
  - coherence
  - staleness
  - coverage
  - resilience
  - permission
  - i18n
  - a11y

constraints:
  - "No backend, no auth, no server-held user data — core/auth is removed; loans and bills live only on-device."
  - "Kotlin 2.x + Compose Multiplatform (Material 3); shared business logic + shared Compose UI; platform code only behind expect/actual."
  - "Five platform builds must stay green in CI (Android, iOS, macOS, Desktop/JVM, Web Kotlin-JS + WASM); iOS/macOS need Xcode."
  - "FRED-backed features require a free developer key; all other external sources (Frankfurter, World Bank, CoinGecko) are keyless — a missing key degrades to an in-app not-configured state, never a crash."
  - "MVI (BaseViewModel<State,Event,Action>) + Koin DI + Compose Navigation (type-safe @Serializable routes) + Ktorfit/Ktor Result<T,RemoteError> are the fixed architectural spine forks build on."
  - "The demo showcase is removed by default by customizer.sh (opt back in with --keep-demo); only cmp-navigation references demo modules, fenced by demo:begin/demo:end and gated on !isReleaseBuild()."
  - "Zero per-screen state boilerplate — the core-base/store DecisionEngine drives loading/error/empty/content/stale for every screen."

hypotheses:
  - "A fork author can rename namespaces and strip the demo to a clean production shell in under 5 minutes via customizer.sh."
  - "Demonstrating every Store5 archetype in a real feature (not toy code) is what makes the template a credible KMP reference, not a hello-world starter."
  - "Graceful degradation on every network feature (offline / stale / key-missing) is a stronger adoption signal than feature count."

edge_cases_to_avoid:
  - "A missing or unset FRED_API_KEY crashing the app instead of rendering the Rates card as an Error slot while other cards keep working."
  - "A flaky single network source blanking a whole composite screen (Home fans four independent sources — each card must load, error, and retry on its own)."
  - "customizer --clean deleting a framework-owned shell (Scaffold, nav, DI) instead of only the demo:begin/demo:end-fenced demo body."
  - "Background store writes clobbering a user's in-progress edit on loan-detail (LOAD_ONCE archetype must protect the open editor)."
  - "Offline draft submits (loans/bills/alerts) silently lost instead of surviving via the SubmitOutbox until connectivity returns."
  - "A network feature with no offline/empty/stale state rendering a blank screen when data is unavailable."
  - "Cross-platform drift — a feature that renders correctly on Android but breaks on Web/WASM or iOS because platform code leaked outside expect/actual."

claude_enriched: true
