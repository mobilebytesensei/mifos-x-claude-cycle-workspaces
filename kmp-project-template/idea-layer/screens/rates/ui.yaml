  list_viewmodel: "feature/rates/src/commonMain/kotlin/kpt/feature/rates/ui/InterestRatesViewModel.kt"
  detail_screen: "feature/rates/src/commonMain/kotlin/kpt/feature/rates/ui/InterestRateDetailScreen.kt"
  detail_viewmodel: "feature/rates/src/commonMain/kotlin/kpt/feature/rates/ui/InterestRateDetailViewModel.kt"
  stream_seam: "feature/rates/src/commonMain/kotlin/kpt/feature/rates/ui/RateStreamFactory.kt"
  catalog: "feature/rates/src/commonMain/kotlin/kpt/feature/rates/ui/RateSeriesCatalog.kt"
  navigation: "feature/rates/src/commonMain/kotlin/kpt/feature/rates/navigation/RatesNavigation.kt"
  di: "feature/rates/src/commonMain/kotlin/kpt/feature/rates/di/RatesModule.kt"
  test_tags: "feature/rates/src/commonMain/kotlin/kpt/feature/rates/ui/TestTags.kt"
  strings: "feature/rates/src/commonMain/composeResources/values/strings.xml"
