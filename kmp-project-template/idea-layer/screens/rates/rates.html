<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interest Rates — Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#6C63FF','on-primary':'#ffffff'}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#6C63FF;--on-primary:#fff;--bg:#fff;--text:#1C1B1F;--border:#E7E0EC;--error:#BA1A1A;--success:#146C2E;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
body.embedded{background:var(--bg);margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;background:var(--bg);}
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span id="screenTitle" class="text-sm font-semibold text-slate-200 flex-1">Loading…</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none"></select>
  <button onclick="toggleTags()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">Tags</button>
</div>
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-white shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-white">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-slate-50" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900 rounded-full"></div></div>
    <div id="fab-container" class="absolute bottom-8 right-5"></div>
  </div>
</div>
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-white shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-slate-50 flex-1"></div>
  <div id="embedded-fab" class="fixed bottom-8 right-5"></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>
<script>
/* ══ feature/rates — B7 Interest Rate Tracker. Four INDEPENDENT FRED-backed rows,
   each its own ScreenState (Loading/Content/Empty/Error/NoNetwork). rateDetail drill-down.
   NETWORK_WITH_CACHE + DataFreshness. Real values from demo-data.yaml. ══ */
function spark(vals,color){var w=130,h=38,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),r=(mx-mn)||1;var pts=vals.map(function(v,i){var x=(i/(vals.length-1))*w;var y=h-4-((v-mn)/r)*(h-8);return x.toFixed(1)+','+y.toFixed(1);}).join(' ');return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
var RATES=[
 {id:'DFF',name:'Federal Funds Rate',cur:5.33,delta:0.00,obs:[5.33,5.33,5.33,5.33,5.33]},
 {id:'DPRIME',name:'Prime Rate',cur:8.50,delta:0.00,obs:[8.50,8.50,8.50,8.50,8.50]},
 {id:'MORTGAGE30US',name:'30-Year Mortgage',cur:6.86,delta:0.01,obs:[6.94,6.90,6.88,6.85,6.86]},
 {id:'DGS10',name:'10-Year Treasury',cur:4.42,delta:0.02,obs:[4.47,4.45,4.44,4.40,4.42]}
];
function badge(d){if(d>0)return '<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700"><span class="material-symbols-outlined text-sm">arrow_upward</span>+'+d.toFixed(2)+'</span>';if(d<0)return '<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-700"><span class="material-symbols-outlined text-sm">arrow_downward</span>'+d.toFixed(2)+'</span>';return '<span class="inline-flex items-center gap-0.5 px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-500"><span class="material-symbols-outlined text-sm">remove</span>0.00</span>';}
function sparkColor(d){return d>0?'#16a34a':d<0?'#dc2626':'#94a3b8';}
function appBar(title,back,fresh){var trailing=fresh?'<span class="flex items-center gap-1 text-xs font-medium text-emerald-600 px-2 py-1 rounded-full bg-emerald-50 cursor-pointer" onclick="showToast(\'Refreshing all series…\')"><span class="material-symbols-outlined text-sm">check_circle</span>Fresh</span><span class="material-symbols-outlined text-xl text-slate-600 cursor-pointer ml-1" onclick="showToast(\'Refresh all — re-fetch DFF/DPRIME/MORTGAGE30US/DGS10\')">refresh</span>':'';
 return '<div class="sticky top-0 z-10 flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-100"><span class="material-symbols-outlined text-xl text-slate-700 cursor-pointer" onclick="navigateTo(\''+(back||'')+'\')">arrow_back</span><span class="flex-1 text-lg font-semibold text-slate-900">'+title+'</span>'+trailing+'</div>';}
function rateCard(r){var accent=r.delta>0?'border-l-4 border-emerald-400':r.delta<0?'border-l-4 border-red-400':'border-l-4 border-slate-200';
 return '<div onclick="navigateTo(\'rateDetail\')" class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm '+accent+' cursor-pointer active:scale-[0.99] transition">'
 +'<div class="flex items-start justify-between"><div><div class="text-sm text-slate-500">'+r.name+'</div><div class="text-2xl font-bold text-slate-900 mt-0.5">'+r.cur.toFixed(2)+'<span class="text-base font-medium text-slate-400"> %</span></div><div class="mt-2">'+badge(r.delta)+'</div></div>'
 +'<div class="mt-1">'+spark(r.obs,sparkColor(r.delta))+'</div></div></div>';}
function contentHtml(){return appBar('Interest Rates','home',true)+'<div class="pt-1 pb-6">'+RATES.map(rateCard).join('')+'</div>';}
function loadingHtml(){var s='';for(var i=0;i<4;i++){s+='<div class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100" style="height:120px"><div class="shimmer h-4 w-40 mb-3"></div><div class="shimmer h-8 w-24 mb-3"></div><div class="shimmer h-6 w-16 rounded-full"></div></div>';}return appBar('Interest Rates','home',false)+'<div class="pt-1">'+s+'</div>';}
function slotCard(icon,color,title,body,retry){return '<div class="mx-4 my-2 p-6 rounded-2xl bg-white border border-slate-100 shadow-sm flex flex-col items-center text-center" style="min-height:120px;justify-content:center"><span class="material-symbols-outlined text-4xl '+color+' mb-2">'+icon+'</span><div class="text-sm font-semibold text-slate-700">'+title+'</div><div class="text-xs text-slate-400 mt-1">'+body+'</div>'+(retry?'<button onclick="showToast(\'Retry — refresh this row\')" class="mt-3 text-primary text-sm font-semibold">Retry</button>':'')+'</div>';}
function emptyHtml(){return appBar('Interest Rates','home',true)+'<div class="pt-1">'+slotCard('inbox','text-slate-300','No published observations','This FRED series resolved with zero observations in the [today-365d, today] window.',true)+RATES.slice(1).map(rateCard).join('')+'</div>';}
function errorHtml(){return appBar('Interest Rates','home',false)+'<div class="pt-1">'+slotCard('key_off','text-amber-400','FRED_API_KEY is not configured','FRED_API_KEY is not configured — supply a key via FredApiConfig. See CLAUDE.md → First-time fork setup.',true)+slotCard('key_off','text-amber-400','FRED_API_KEY is not configured','ScreenState.Error on every row when no Room cache exists (isNetworkError=false).',true)+slotCard('key_off','text-amber-400','FRED_API_KEY is not configured','With a warm cache the rows show stale Content instead.',true)+slotCard('key_off','text-amber-400','FRED_API_KEY is not configured','',true)+'</div>';}
function nonetHtml(){return appBar('Interest Rates','home',false)+'<div class="mx-4 mt-3 mb-1 px-4 py-2 rounded-xl bg-amber-50 text-amber-700 text-xs flex items-center gap-2"><span class="material-symbols-outlined text-base">cloud_off</span>Couldn’t reach FRED. Showing last synced data where available.</div>'+'<div class="pt-1">'+slotCard('wifi_off','text-slate-300','Couldn’t reach FRED','Couldn’t reach FRED. Showing last synced data where available.',true)+RATES.slice(1).map(rateCard).join('')+'</div>';}
function detailHtml(){var r=RATES[0];return appBar('Federal Funds Rate','rates',true)
 +'<div class="mx-4 mt-3 p-5 rounded-3xl text-white shadow-lg" style="background:linear-gradient(135deg,#6C63FF,#8B7BFF)"><div class="text-xs opacity-80 uppercase tracking-wide">Current</div><div class="text-4xl font-bold mt-1">'+r.cur.toFixed(2)+' %</div><div class="text-sm opacity-90 mt-1">Source: FRED</div></div>'
 +'<div class="mx-4 my-3 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="text-sm font-semibold text-slate-700 mb-2">365-day range</div><div class="w-full">'+function(){var w=320,h=90,vals=r.obs,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;var pts=vals.map(function(v,i){return ((i/(vals.length-1))*w).toFixed(1)+','+(h-6-((v-mn)/rg)*(h-12)).toFixed(1);}).join(' ');return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#6C63FF" stroke-width="2.5"/></svg>';}()+'</div></div>'
 +'<div class="mx-4 mb-6 rounded-2xl bg-white border border-slate-100 shadow-sm overflow-hidden"><div class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase">Observations</div>'
 +[['2026-05-23',5.33],['2026-05-22',5.33],['2026-05-21',5.33],['2026-05-20',5.33],['2026-05-19',5.33]].map(function(o){return '<div class="flex items-center justify-between px-4 py-2.5 border-t border-slate-50 text-sm"><span class="text-slate-500">'+o[0]+'</span><span class="font-medium text-slate-900">'+o[1].toFixed(2)+' %</span></div>';}).join('')+'</div>';}

var DATA={id:'rates',name:'Interest Rates',feature:'feat-rates',status:'designed',fab:null,
 states:{initial_state:'content',
  content:{name:'Content (4 rows)',html:contentHtml()},
  loading:{name:'Loading',html:loadingHtml()},
  empty:{name:'Empty (per-row)',html:emptyHtml()},
  error:{name:'Error · FRED key missing',html:errorHtml()},
  nonetwork:{name:'No network',html:nonetHtml()},
  detail:{name:'Rate detail (drill-down)',html:detailHtml()}
 }};

/* ══ engine ══ */
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
var showTags=false,currentState=null;
function contentEl(){return document.getElementById(isEmbedded?'embedded-screen-content':'screen-content');}
function fabEl(){return document.getElementById(isEmbedded?'embedded-fab':'fab-container');}
function populateStates(){var p=document.getElementById('statePicker');if(!p)return;p.innerHTML='';Object.keys(DATA.states).forEach(function(k){if(k==='initial_state')return;var o=document.createElement('option');o.value=k;o.textContent=DATA.states[k].name||k;p.appendChild(o);});}
function switchState(id){if(!DATA.states[id]||id==='initial_state')id=DATA.states.initial_state;currentState=id;var p=document.getElementById('statePicker');if(p)p.value=id;contentEl().innerHTML='<div id="comp-wrap">'+(DATA.states[id].html||'')+'</div>';renderFab();}
function renderFab(){if(!DATA.fab){fabEl().innerHTML='';return;}var f=DATA.fab;fabEl().innerHTML='<button onclick="navigateTo(\''+f.target+'\')" class="flex items-center gap-2 pl-4 pr-5 h-14 rounded-2xl shadow-lg text-white font-semibold" style="background:var(--primary)"><span class="material-symbols-outlined">'+f.icon+'</span>'+f.label+'</button>';}
function navigateTo(t){if(!t){return;}if(t==='rateDetail'){switchState('detail');return;}if(window!==window.top){window.parent.postMessage({action:'navigate',screenId:t},'*');}else if(DATA.states[t]){switchState(t);}else{showToast('→ '+t);}}
function showToast(m){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';t.textContent=m;document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},1800);}
function toggleTags(){showTags=!showTags;}
function notifyParent(){if(window===window.top)return;try{window.parent.postMessage({action:'screenLoaded',screenId:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,inspectorData:{id:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,states:Object.keys(DATA.states).filter(function(k){return k!=='initial_state';})}},'*');}catch(e){}}
window.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state);if(e.data.action==='getInspectorData')notifyParent();if(e.data.action==='applyTheme'&&e.data.cssVars){var r=document.documentElement;Object.keys(e.data.cssVars).forEach(function(k){if(e.data.cssVars[k])r.style.setProperty(k,e.data.cssVars[k]);});}});
function boot(){if(isEmbedded){document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col');document.body.classList.add('embedded');}document.title=DATA.name+' — Prototype';var t=document.getElementById('screenTitle');if(t)t.textContent=DATA.name;populateStates();var urlState=new URLSearchParams(location.search).get('state');switchState(urlState||DATA.states.initial_state);notifyParent();}
boot();
</script>
</body>
</html>
