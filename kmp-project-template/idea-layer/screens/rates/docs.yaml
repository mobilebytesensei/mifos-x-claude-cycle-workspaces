title: Interest Rate Tracker
purpose: >-
  B7 Interest Rate Tracker — a live dashboard of four key U.S. interest-rate
  series (Federal Funds, Prime, 30-Year Mortgage, 10-Year Treasury) sourced from
  FRED, each an independently-loading card with a 365-day sparkline and 1-day
  delta, plus a per-series drill-down with a full area chart and observation
  table. Doubles as the canonical showcase of the toolkit's NETWORK_WITH_CACHE
  Store5 archetype + DataFreshness surface.
status: approved
last_modified: '2026-07-25'
quality_score: 88          # reverse-engineered (read-only) network feature: well-formed 4-stream NETWORK_WITH_CACHE showcase with rich business_logic + action_contracts + test_tags + source_refs; ~22 raw English literals extracted to screens_rates_* i18n keys; initial_state declared on rates + rateDetail. Held below the 90 shipped-UI ceiling because it is reverse-engineered and its degraded FRED-key-missing path is contract-modeled.
source: reverse-engineered
origin: "/idea-import — read-only reverse-engineering of the shipped feature/rates module"

showcase_note: >-
  B7 is the reference implementation for NETWORK_WITH_CACHE + 4-stream combine
  (see kmp-project-template CLAUDE.md → Toolkit feature showcase, and the Store
  Archetype Showcases table: InterestRateSeriesStore under NETWORK_WITH_CACHE).
  Unlike a combineScreenStates fan-in (Home dashboard), the rate list keeps four
  INDEPENDENT ScreenState slots so one failed series never blanks the screen —
  the "independent cards" pattern. It also demonstrates the framework
  FreshnessIndicator (worst-of-4 aggregate in the app bar + per-card signals).

fred_setup_note: >-
  Requires a free FRED developer key (https://fred.stlouisfed.org/docs/api/api_key.html,
  ~30s signup). Two ways to supply it:
    - Path A (OSS fork): add FRED_API_KEY=<key> to local.properties (gitignored),
      wire single { FredApiConfig(apiKey = <key>) } in the app Koin module.
    - Path B (framework vault): /secrets request mifos_x_fred_api_key from a
      project-bound session, then /secrets pull.
  Leave it unset and every FRED-backed row renders "FRED_API_KEY is not configured"
  (an Error slot, not a crash). Add new series by appending an
  InterestRateSeriesKey to feature/rates/.../RateSeriesCatalog.kt — no client,
  store, or repository change needed. Rate limit 120 calls/min; the 24h Store5
  TTL keeps usage far below it.

data_sources:
  - name: FRED
    endpoint: "GET https://api.stlouisfed.org/fred/series/observations"
    series: [DFF, DPRIME, MORTGAGE30US, DGS10]
    auth: "api_key query param (FredApiConfig)"
    cache: "Store5 NETWORK_WITH_CACHE, 24h TTL, Room source-of-truth (interest_rate_series)"

user_stories:
  - "As a user, I want to see today's federal funds, prime, mortgage and treasury rates in one place so I can gauge the borrowing climate."
  - "As a user, I want each rate to show whether it moved up or down since the last reading so I can spot trends at a glance."
  - "As a user, I want to tap a rate and see its 365-day chart + full history so I can understand its trajectory."
  - "As a user offline, I want to still see the last synced rates (marked stale) so the screen is useful without a connection."
  - "As a fork developer, I want to add a new FRED series by editing one catalog list so I can extend the tracker without touching the data layer."

metrics:
  - { name: fred_fetch_success_rate, description: "share of FRED fetches that return usable observations (per series)" }
  - { name: cache_hit_rate, description: "share of subscriptions served from the Room cache before/without a network round-trip" }
  - { name: rate_row_error_rate, description: "per-row error frequency (incl. fred_key_missing vs network)" }
  - { name: detail_drilldown_rate, description: "list-row taps that open the per-series detail" }
  - { name: refresh_all_frequency, description: "manual refresh-all invocations per session" }

edge_cases:
  - "FRED '.' no-data markers on daily series (weekends/holidays) — stripped by FredObservationsDto.toDomain; deltas use consecutive PUBLISHED values, not calendar days."
  - "MORTGAGE30US is a weekly (not daily) series — fewer, spaced observations."
  - "<2 observations → 1-day delta is null → RateBadge hidden."
  - "Unknown seriesId on the detail route → minimal fallback key (seriesId used as name); screen still renders."
  - "Unconfigured FRED key with no cache → every row Error 'FRED_API_KEY is not configured'."

related_features:
  - { id: feat-country-macro, note: "B8 Country Macro — sibling economic feature sharing core/*/economic packages but backed by the World Bank API (different source, out of scope here)." }
  - { id: feat-dashboard, note: "Home dashboard surfaces a rates tile that links into this feature (combineScreenStates fan-in)." }

