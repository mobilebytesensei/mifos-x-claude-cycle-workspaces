<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price Alerts — content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  /* Primary — violet brand */
  --primary: #6C63FF; --on-primary: #FFFFFF; --primary-container: #E4E0FF; --on-primary-container: #1A0F6B;
  --primary-hover: #5D53F0; --primary-pressed: #4E44D8;
  /* Secondary — green (positive money movement) */
  --secondary: #146C2E; --on-secondary: #FFFFFF; --secondary-container: #C3F2CE; --on-secondary-container: #00210A;
  /* Tertiary */
  --tertiary: #7D5260; --on-tertiary: #FFFFFF; --tertiary-container: #FFD9E3; --on-tertiary-container: #31101C;
  /* Error / success / warning / info */
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #146C2E; --on-success: #FFFFFF; --success-container: #C3F2CE; --on-success-container: #00210A;
  --warning: #8A5300; --on-warning: #FFFFFF; --warning-container: #FFDDB3; --on-warning-container: #2B1700; --warning-strong: #B45309;
  --info: #0061A4; --on-info: #FFFFFF;
  /* Surfaces */
  --background: #FFFBFE; --on-background: #1C1B1F;
  --surface: #FFFBFE; --on-surface: #1C1B1F; --surface-variant: #E7E0EC; --on-surface-variant: #49454F;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
  --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9; --surface-dim: #DED8E1; --surface-bright: #FFFBFE;
  /* Outlines / inverse / accent */
  --outline: #79747E; --outline-variant: #CAC4D0;
  --inverse-surface: #313033; --inverse-on-surface: #F4EFF4; --inverse-primary: #C3BEFF;
  --accent: #00BFA5; --on-accent: #00201A; --scrim: #000000;
  /* Typography */
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-display-lg: 3rem; --fs-display-md: 2.375rem; --fs-display-sm: 1.875rem;
  --fs-h1: 1.625rem; --fs-h2: 1.375rem; --fs-h3: 1.25rem;
  --fs-title: 1.125rem; --fs-title-md: 1rem; --fs-title-sm: 0.875rem;
  --fs-body: 1rem; --fs-body-sm: 0.875rem; --fs-label: 0.875rem; --fs-label-sm: 0.75rem;
  --fs-caption: 0.75rem; --fs-caption-sm: 0.6875rem;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-label: 0.1px; --ls-caption: 0.3px; --ls-wide: 0.5px;
  /* Radius */
  --r-xs: 6px; --r-sm: 10px; --r-md: 16px; --r-lg: 20px; --r-xl: 28px; --r-full: 9999px;
  /* Spacing (8pt grid) */
  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
  /* Elevation — §7a. Violet-tinted shadows (not neutral black) for brand cohesion. */
  --el-0: none;
  --el-1: 0 1px 3px rgba(28,17,84,0.08), 0 1px 2px rgba(28,17,84,0.06);
  --el-2: 0 3px 8px rgba(28,17,84,0.10), 0 2px 4px rgba(28,17,84,0.08);
  --el-3: 0 8px 20px rgba(28,17,84,0.14), 0 4px 8px rgba(28,17,84,0.10);
  --el-4: 0 12px 28px rgba(28,17,84,0.16);
  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #C3BEFF; --on-primary: #2E2299; --primary-container: #453AB1; --on-primary-container: #E4E0FF;
  --primary-hover: #D4D0FF; --primary-pressed: #E5E2FF;
  --secondary: #A8D5AF; --on-secondary: #013913; --secondary-container: #00531E; --on-secondary-container: #C3F2CE;
  --tertiary: #EFB8C8; --on-tertiary: #4A2532; --tertiary-container: #633B48; --on-tertiary-container: #FFD9E3;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #A8D5AF; --on-success: #013913; --success-container: #00531E; --on-success-container: #C3F2CE;
  --warning: #FFB955; --on-warning: #472A00; --warning-container: #663D00; --on-warning-container: #FFDDB3; --warning-strong: #E0912F;
  --info: #9CCAFF; --on-info: #003258;
  --background: #1C1B1F; --on-background: #E6E1E5;
  --surface: #1C1B1F; --on-surface: #E6E1E5; --surface-variant: #49454F; --on-surface-variant: #CAC4D0;
  --surface-container-lowest: #0F0E11; --surface-container-low: #1D1B1E; --surface-container: #211F23;
  --surface-container-high: #2B292D; --surface-container-highest: #363438; --surface-dim: #141316; --surface-bright: #3A383C;
  --outline: #938F99; --outline-variant: #49454F;
  --inverse-surface: #E6E1E5; --inverse-on-surface: #313033; --inverse-primary: #6C63FF;
  --accent: #4FD8C4; --on-accent: #00201A;
  --el-1: 0 1px 3px rgba(0,0,0,0.40); --el-2: 0 3px 8px rgba(0,0,0,0.50);
  --el-3: 0 8px 20px rgba(0,0,0,0.60); --el-4: 0 12px 28px rgba(0,0,0,0.66);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); color: var(--on-surface); border-bottom: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-2); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px) + var(--sp-lg)); overflow-y: auto; }

/* section label */
.section-label { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); }
.section-label h2 { font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--on-surface-variant); margin: 0; display: inline-flex; align-items: center; gap: var(--sp-xs); }
.section-label h2 .material-symbols-outlined { font-size: 18px; color: var(--primary); }
.section-label .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

/* alert list */
.alert-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.alert-row { display: flex; align-items: center; gap: var(--sp-md); width: 100%; padding: var(--sp-md); border-radius: var(--r-md); background: var(--surface); color: var(--on-surface); box-shadow: var(--el-1); cursor: pointer; }
.alert-avatar { flex: 0 0 auto; width: 44px; height: 44px; aspect-ratio: 1 / 1; border-radius: var(--r-full); background: var(--primary-container); color: var(--on-primary-container); display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: var(--ls-wide); }
.alert-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.alert-coin { font-size: var(--fs-body); font-weight: var(--fw-semibold); color: var(--on-surface); }
.alert-sub { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.alert-value-col { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.direction-chip { display: inline-flex; align-items: center; padding: 2px var(--sp-sm); border-radius: var(--r-xs); font-size: var(--fs-caption-sm); font-weight: var(--fw-semibold); letter-spacing: var(--ls-caption); text-transform: uppercase; }
.direction-chip.above { background: var(--success-container); color: var(--on-success-container); }
.direction-chip.below { background: var(--error-container); color: var(--on-error-container); }
.direction-chip.pct { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.alert-target { font-family: var(--font-mono); font-size: var(--fs-title-md); font-weight: var(--fw-semibold); color: var(--on-surface); }
.status-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: var(--sp-xxs); padding: 2px var(--sp-sm); border-radius: var(--r-full); font-size: var(--fs-caption-sm); font-weight: var(--fw-medium); }
.status-chip.on { background: var(--secondary-container); color: var(--on-secondary-container); }
.status-chip.off { background: var(--surface-container-high); color: var(--on-surface-variant); }
.alert-delete { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); border: none; background: transparent; color: var(--on-surface-variant); cursor: pointer; }
.alert-delete .material-symbols-outlined { font-size: 20px; }
.alert-row:focus-visible, .alert-delete:focus-visible, .fab-extended:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* extended FAB — §7g: never occludes; content bottom-padding clears it */
.fab-extended { position: fixed; right: var(--sp-md); bottom: calc(var(--sp-lg) + env(safe-area-inset-bottom, 0px)); z-index: 25; display: inline-flex; align-items: center; gap: var(--sp-sm); height: 56px; padding: 0 var(--sp-lg); border-radius: var(--r-full); border: none; background: var(--primary); color: var(--on-primary); font-family: inherit; font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); box-shadow: var(--el-3); cursor: pointer; }
.fab-extended .material-symbols-outlined { font-size: 22px; }

@media (prefers-reduced-motion: no-preference) {
  .alert-row, .alert-delete, .fab-extended { transition: filter 120ms ease, box-shadow 120ms ease; }
  .alert-row:active, .alert-delete:active, .fab-extended:active { filter: brightness(0.97); }
}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="alerts-list" data-state="content">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="top_app_bar" data-from-ui-yaml-path="shell.top_app_bar">
    <button type="button" class="leading" data-component-type="IconButton" data-component-id="top_app_bar_back" data-nav-to="home" data-nav-type="pop" aria-label="Back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="app-title">Price Alerts</h1>
  </header>

  <main data-shell="content" data-state="content">

    <div class="section-label" data-component-type="LayoutBox" data-component-id="alerts_section_label">
      <h2><span class="material-symbols-outlined" aria-hidden="true">notifications_active</span>Your price alerts</h2>
      <span class="count">3 alerts</span>
    </div>

    <!-- Alert rows (#alert_row × 3, newest-first) → alert_row_tap navigates to AddOrEditAlertRoute(alertId) -->
    <ul class="alert-list" data-component-type="List" data-component-id="alert_list" aria-label="Price alerts">
      <li>
        <div class="alert-row" data-component-type="ListItem" data-component-id="alert_row_alert-btc-above-01" data-from-ui-yaml-path="components[0]" data-nav-to="alert-addedit" data-nav-type="push" data-nav-params='{"alertId":"alert-btc-above-01"}' data-action-id="alert_row_tap" role="button" tabindex="0" aria-label="Bitcoin alert, above $75,000.00, enabled, created Jun 15, 2025. Edit alert.">
          <span class="alert-avatar" aria-hidden="true">BTC</span>
          <span class="alert-meta">
            <span class="alert-coin">Bitcoin</span>
            <span class="alert-sub">Created <span class="mono">Jun 15, 2025</span></span>
          </span>
          <span class="alert-value-col">
            <span class="direction-chip above">Above</span>
            <span class="alert-target mono">$75,000.00</span>
          </span>
          <span class="status-chip on"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:14px">check_circle</span>Enabled</span>
          <button type="button" class="alert-delete" data-component-type="IconButton" data-component-id="alert_row_delete_alert-btc-above-01" data-action="delete_alert" data-action-params='{"id":"alert-btc-above-01"}' aria-label="Delete Bitcoin alert">
            <span class="material-symbols-outlined" aria-hidden="true">delete</span>
          </button>
        </div>
      </li>
      <li>
        <div class="alert-row" data-component-type="ListItem" data-component-id="alert_row_alert-eth-below-01" data-from-ui-yaml-path="components[0]" data-nav-to="alert-addedit" data-nav-type="push" data-nav-params='{"alertId":"alert-eth-below-01"}' data-action-id="alert_row_tap" role="button" tabindex="0" aria-label="Ethereum alert, below $2,800.00, enabled, created Jun 04, 2025. Edit alert.">
          <span class="alert-avatar" aria-hidden="true">ETH</span>
          <span class="alert-meta">
            <span class="alert-coin">Ethereum</span>
            <span class="alert-sub">Created <span class="mono">Jun 04, 2025</span></span>
          </span>
          <span class="alert-value-col">
            <span class="direction-chip below">Below</span>
            <span class="alert-target mono">$2,800.00</span>
          </span>
          <span class="status-chip on"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:14px">check_circle</span>Enabled</span>
          <button type="button" class="alert-delete" data-component-type="IconButton" data-component-id="alert_row_delete_alert-eth-below-01" data-action="delete_alert" data-action-params='{"id":"alert-eth-below-01"}' aria-label="Delete Ethereum alert">
            <span class="material-symbols-outlined" aria-hidden="true">delete</span>
          </button>
        </div>
      </li>
      <li>
        <div class="alert-row" data-component-type="ListItem" data-component-id="alert_row_alert-sol-pct-01" data-from-ui-yaml-path="components[0]" data-nav-to="alert-addedit" data-nav-type="push" data-nav-params='{"alertId":"alert-sol-pct-01"}' data-action-id="alert_row_tap" role="button" tabindex="0" aria-label="Solana alert, 24-hour percent change of 10.0, disabled, created May 23, 2025. Edit alert.">
          <span class="alert-avatar" aria-hidden="true">SOL</span>
          <span class="alert-meta">
            <span class="alert-coin">Solana</span>
            <span class="alert-sub">Created <span class="mono">May 23, 2025</span></span>
          </span>
          <span class="alert-value-col">
            <span class="direction-chip pct">% Change</span>
            <span class="alert-target mono">10.0%</span>
          </span>
          <span class="status-chip off"><span class="material-symbols-outlined" aria-hidden="true" style="font-size:14px">radio_button_unchecked</span>Disabled</span>
          <button type="button" class="alert-delete" data-component-type="IconButton" data-component-id="alert_row_delete_alert-sol-pct-01" data-action="delete_alert" data-action-params='{"id":"alert-sol-pct-01"}' aria-label="Delete Solana alert">
            <span class="material-symbols-outlined" aria-hidden="true">delete</span>
          </button>
        </div>
      </li>
    </ul>

  </main>

  <!-- FAB (#new_alert_fab) → navigate to AddOrEditAlertRoute(alertId=null) -->
  <button type="button" class="fab-extended" data-component-type="FAB" data-component-id="new_alert_fab" data-from-ui-yaml-path="shell.fab" data-nav-to="alert-addedit" data-nav-type="push" data-nav-params='{"alertId":null}' aria-label="New alert">
    <span class="material-symbols-outlined" aria-hidden="true">add</span>New alert
  </button>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
