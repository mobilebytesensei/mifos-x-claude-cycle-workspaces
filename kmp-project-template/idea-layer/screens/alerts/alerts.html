<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Alerts — Prototype (UI pending)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#6C63FF','on-primary':'#ffffff'}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#6C63FF;--on-primary:#fff;--bg:#fff;--text:#1C1B1F;--border:#E7E0EC;--error:#BA1A1A;--success:#146C2E;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
body.embedded{background:var(--bg);margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;background:var(--bg);}
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span id="screenTitle" class="text-sm font-semibold text-slate-200 flex-1">Loading…</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none"></select>
  <button onclick="toggleTags()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">Tags</button>
</div>
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-white shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-white">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-slate-50" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900 rounded-full"></div></div>
    <div id="fab-container" class="absolute bottom-8 right-5"></div>
  </div>
</div>
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-white shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-slate-50 flex-1"></div>
  <div id="embedded-fab" class="fixed bottom-8 right-5"></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>
<script>
/* ══ feature/alerts — Price Alerts (local-only threshold rows; NO notification scheduled).
   ⚠ UI PENDING (provenance: modeled-from-data-contract). DATA layer fully shipped
   (model/entity/DAO/repository/store/DI/outbox). The feature/alerts UI module is NOT
   implemented (only build/, no src). Screens below are modeled from the data contract +
   repository KDoc; Composable/ViewModel/Route names are PROPOSED. Real fixtures from demo-data.yaml. ══ */
var DIRC={ABOVE:['Above','bg-emerald-50 text-emerald-700'],BELOW:['Below','bg-red-50 text-red-700'],PCT_CHANGE:['% Change','bg-violet-50 text-violet-700']};
var ALERTS=[
 {sym:'bitcoin',dir:'ABOVE',target:75000.00,enabled:true},
 {sym:'ethereum',dir:'BELOW',target:2800.00,enabled:true},
 {sym:'solana',dir:'PCT_CHANGE',target:10.0,enabled:false}
];
function money(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function tgt(a){return a.dir==='PCT_CHANGE'?a.target.toFixed(1)+'%':money(a.target);}
function pendingBanner(){return '<div class="mx-4 mt-3 mb-1 px-3 py-2 rounded-xl bg-amber-100 border border-amber-200 text-amber-800 text-[11px] flex items-start gap-2"><span class="material-symbols-outlined text-sm mt-px">construction</span><span><b>UI PENDING</b> — data layer shipped; the feature/alerts screen module is NOT implemented. Modeled from the data contract + KDoc. Names are proposed.</span></div>';}
function appBar(title,back){return '<div class="sticky top-0 z-10 flex items-center gap-2 px-4 py-3 bg-white border-b border-slate-100"><span class="material-symbols-outlined text-xl text-slate-700 cursor-pointer" onclick="navigateTo(\''+(back||'')+'\')">arrow_back</span><span class="flex-1 text-lg font-semibold text-slate-900">'+title+'</span><span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-[10px] font-semibold">PROPOSED</span></div>';}
function alertRow(a){var d=DIRC[a.dir];return '<div onclick="navigateTo(\'alert-addedit\')" class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm cursor-pointer active:scale-[0.99] transition">'
 +'<div class="flex items-center gap-3"><span class="flex-1 font-semibold text-slate-900 capitalize">'+a.sym+'</span><span class="text-sm font-semibold text-slate-900 tabular-nums">'+tgt(a)+'</span></div>'
 +'<div class="flex items-center gap-2 mt-3"><span class="px-2.5 py-1 rounded-full text-xs font-medium '+d[1]+'">'+d[0]+'</span>'
 +'<span class="px-2.5 py-1 rounded-full text-xs font-medium '+(a.enabled?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-500')+'">'+(a.enabled?'Enabled':'Disabled')+'</span>'
 +'<span class="flex-1"></span>'
 +'<span onclick="event.stopPropagation();showToast(\'Deleted (repository.deleteAlert)\')" class="material-symbols-outlined text-slate-400 cursor-pointer hover:text-red-500" title="Delete alert">delete</span></div></div>';}
function contentHtml(){return appBar('Price Alerts','home')+pendingBanner()
 +'<div class="mx-4 mt-1 mb-1 px-3 py-1.5 rounded-lg bg-slate-100 text-slate-500 text-[11px] flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">warning</span>Lossy persistence: PCT_CHANGE degrades to BELOW &amp; disabled resets to enabled on reload (entity gap).</div>'
 +'<div class="pb-24">'+ALERTS.map(alertRow).join('')+'</div>';}
function loadingHtml(){var s='';for(var i=0;i<3;i++){s+='<div class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100"><div class="flex items-center gap-3"><div class="shimmer h-4 w-28"></div><div class="flex-1"></div><div class="shimmer h-4 w-20"></div></div><div class="flex gap-2 mt-3"><div class="shimmer h-6 w-16 rounded-full"></div><div class="shimmer h-6 w-20 rounded-full"></div></div></div>';}return appBar('Price Alerts','home')+pendingBanner()+s;}
function emptyHtml(){return appBar('Price Alerts','home')+pendingBanner()+'<div class="flex flex-col items-center justify-center text-center px-8 py-20"><span class="material-symbols-outlined text-6xl text-slate-300 mb-3">notifications_off</span><p class="text-base font-semibold text-slate-700">No alerts yet</p><p class="text-sm text-slate-400 mt-1">The alerts table ships empty (no seeded rows). Tap “New alert” to add one.</p></div>';}
function errorHtml(){return appBar('Price Alerts','home')+pendingBanner()+'<div class="flex flex-col items-center justify-center text-center px-8 py-20"><span class="material-symbols-outlined text-6xl text-red-300 mb-3">error_outline</span><p class="text-base font-semibold text-slate-700">Something went wrong</p><p class="text-sm text-slate-400 mt-1">onRetry is a no-op — the local Store5 OFFLINE_LOCAL_ONLY source rarely errors.</p></div>';}
function fld(label,val,ph){return '<div class="mb-3"><label class="block text-sm font-medium text-slate-600 mb-1">'+label+'</label><input value="'+(val||'')+'" placeholder="'+(ph||'')+'" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none"/></div>';}
function section(title,body){return '<div class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="text-sm font-semibold text-slate-900 mb-3">'+title+'</div>'+body+'</div>';}
function dropdown(label,val){return '<div class="mb-1"><label class="block text-sm font-medium text-slate-600 mb-1">'+label+'</label><div class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm flex items-center justify-between text-slate-900">'+val+'<span class="material-symbols-outlined text-slate-400">expand_more</span></div><div class="text-[11px] text-amber-600 mt-1">⚠ AlertEntity has no PCT_CHANGE column — mapper degrades it to BELOW.</div></div>';}
function formHtml(){return appBar('Add Alert','alerts-list')+pendingBanner()+'<div class="pb-28">'
 +section('Coin',fld('Coin (CoinGecko id or symbol)','bitcoin'))
 +section('Condition',dropdown('Trigger when price is','Above')+fld('Target value','75000.00','USD for Above/Below; percent for % Change'))
 +section('Settings','<div class="flex items-center justify-between"><span class="text-sm text-slate-700">Alert enabled</span><div class="w-11 h-6 rounded-full bg-primary relative"><div class="absolute right-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow"></div></div></div><div class="text-[11px] text-amber-600 mt-2">⚠ No `enabled` column — a disabled alert reappears enabled after reload.</div>')
 +'<div class="mx-4 my-3"><button onclick="showToast(\'Saved ✓ (repository.submitAlert)\')" class="w-full py-3.5 rounded-xl font-semibold text-white shadow-sm" style="background:var(--primary)">Save Alert</button><div class="mt-3 text-sm text-slate-400">Status: Idle — DraftSubmitHandler (formKey=&quot;price_alert&quot;); Saving… / Saved ✓ / Saved offline on submit.</div></div></div>';}

var DATA={id:'alerts-list',name:'Price Alerts',feature:'feat-alerts',status:'pending',
 fab:{icon:'add',label:'New alert',target:'alert-addedit'},
 states:{initial_state:'content',
  content:{name:'Content',html:contentHtml()},
  loading:{name:'Loading',html:loadingHtml()},
  empty:{name:'Empty (ships empty)',html:emptyHtml()},
  error:{name:'Error (no-op retry)',html:errorHtml()},
  form:{name:'Add/Edit form',html:formHtml(),noFab:true}
 }};

/* ══ engine ══ */
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
var showTags=false,currentState=null;
function contentEl(){return document.getElementById(isEmbedded?'embedded-screen-content':'screen-content');}
function fabEl(){return document.getElementById(isEmbedded?'embedded-fab':'fab-container');}
function populateStates(){var p=document.getElementById('statePicker');if(!p)return;p.innerHTML='';Object.keys(DATA.states).forEach(function(k){if(k==='initial_state')return;var o=document.createElement('option');o.value=k;o.textContent=DATA.states[k].name||k;p.appendChild(o);});}
function switchState(id){if(!DATA.states[id]||id==='initial_state')id=DATA.states.initial_state;currentState=id;var p=document.getElementById('statePicker');if(p)p.value=id;contentEl().innerHTML='<div id="comp-wrap">'+(DATA.states[id].html||'')+'</div>';renderFab(DATA.states[id].noFab);}
function renderFab(hide){if(!DATA.fab||hide){fabEl().innerHTML='';return;}var f=DATA.fab;fabEl().innerHTML='<button onclick="navigateTo(\''+f.target+'\')" class="flex items-center gap-2 pl-4 pr-5 h-14 rounded-2xl shadow-lg text-white font-semibold active:scale-95 transition" style="background:var(--primary)"><span class="material-symbols-outlined">'+f.icon+'</span>'+f.label+'</button>';}
function navigateTo(t){if(!t){return;}if(t==='alert-addedit'){switchState('form');return;}if(t==='alerts-list'){switchState('content');return;}if(window!==window.top){window.parent.postMessage({action:'navigate',screenId:t},'*');}else if(DATA.states[t]){switchState(t);}else{showToast('→ '+t);}}
function showToast(m){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';t.textContent=m;document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},1800);}
function toggleTags(){showTags=!showTags;}
function notifyParent(){if(window===window.top)return;try{window.parent.postMessage({action:'screenLoaded',screenId:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,inspectorData:{id:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,states:Object.keys(DATA.states).filter(function(k){return k!=='initial_state';})}},'*');}catch(e){}}
window.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state);if(e.data.action==='getInspectorData')notifyParent();if(e.data.action==='applyTheme'&&e.data.cssVars){var r=document.documentElement;Object.keys(e.data.cssVars).forEach(function(k){if(e.data.cssVars[k])r.style.setProperty(k,e.data.cssVars[k]);});}});
function boot(){if(isEmbedded){document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col');document.body.classList.add('embedded');}document.title=DATA.name+' — Prototype';var t=document.getElementById('screenTitle');if(t)t.textContent=DATA.name;populateStates();var urlState=new URLSearchParams(location.search).get('state');switchState(urlState||DATA.states.initial_state);notifyParent();}
boot();
</script>
</body>
</html>
