# flow.yaml — feature/alerts navigation flow (Price Alerts).
# ⚠ MODELED FROM DATA CONTRACT — feature/alerts has NO navigation source yet
# (feature/alerts/ is build-only). Graph/route names are PROPOSED, following the
# loans naming convention (LoansGraphRoute → PersonalLoansListRoute).
screen_id: alerts-list
feature_ref: feat-alerts
provenance: modeled-from-data-contract
graph_route: PriceAlertsGraphRoute          # PROPOSED
start_destination: PriceAlertsListRoute     # PROPOSED
flow_groups: [flow-alerts-browse, flow-alerts-manage]
participates_in_flows: [flow-alerts-browse, flow-alerts-manage]

entry_points:
  - id: from-home
    description: "Home dashboard → Price Alerts (navigateToAlerts / PriceAlertsGraphRoute)."
    trigger: navigate_to_alerts
  - id: from-crypto-markets-topbar
    description: >-
      Coin Markets top-bar Price-alerts action → alerts-list (the agreed crypto-cluster
      entry model, /idea sync STEP 3). Declared this side; the crypto top-bar affordance
      (coinMarkets.alertsAction) is declared in crypto/{flow,ui}.yaml.
    trigger: alerts_action_tap
  - id: back-from-addedit
    description: "Return to list after a save or back from the add/edit form."
    trigger: on_saved_or_back

# Screen nodes in this feature graph (2 screens — list + add/edit form).
nodes:
  - { id: alerts-list,   route: PriceAlertsListRoute,        screen: PriceAlertsListScreen }
  - { id: alert-addedit, route: "AddOrEditAlertRoute(alertId?)", screen: AddOrEditAlertScreen }

inbound_routes:
  - from: home            # feature/home dashboard (Money Toolkit home)
    to: alerts-list
    trigger: view_alerts
    flow: flow-alerts-browse
  # /idea sync STEP 3 — crypto-cluster entry: coinMarkets top-bar Price-alerts action → alerts-list.
  - from: crypto          # feature/crypto CoinMarkets — markets top-bar action (coinMarkets.alertsAction)
    to: alerts-list
    trigger: alerts_action_tap
    label: "Coin Markets top-bar Price-alerts action → alerts list"
    flow: flow-alerts-browse

outbound_routes:
  # ── from alerts-list ──
  - from: alerts-list
    to: alert-addedit
    action: navigate
    trigger: new_alert_fab_tap
    params: { alertId: null }
    label: "New alert FAB → Add alert form"
    flow: flow-alerts-manage
  - from: alerts-list
    to: alert-addedit
    action: navigate
    trigger: alert_row_tap
    params: { alertId: "{alert.id}" }
    label: "Alert row tap → edit form (edit mode)"
    flow: flow-alerts-manage
  - from: alerts-list
    to: alerts-list
    action: mutate_in_place
    trigger: alert_row_delete_tap
    label: "Row delete icon → repository.deleteAlert(id) → row removed (stream re-emits)"
    flow: flow-alerts-manage
  - from: alerts-list
    to: home
    action: navigate_back
    trigger: back_tap
    label: "Back → Home dashboard"
    flow: flow-alerts-browse

  # ── from alert-addedit ──
  - from: alert-addedit
    to: alerts-list
    action: navigate_back
    trigger: on_saved
    label: "Save success (SubmitState.Submitted) → onSaved() pops back to the list"
    flow: flow-alerts-manage
  - from: alert-addedit
    to: alerts-list
    action: navigate_back
    trigger: back_tap
    label: "Back → Alerts list"
    flow: flow-alerts-manage
