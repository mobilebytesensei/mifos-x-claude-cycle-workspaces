source_refs:
  model: "core/model/src/commonMain/kotlin/kpt/core/model/demo/alerts/PriceAlert.kt"
  database: "core/database/src/commonMain/kotlin/kpt/core/database/demo/alerts/{AlertEntity.kt,AlertDao.kt}"
  store: "core/store/src/commonMain/kotlin/kpt/core/store/demo/alerts/impl/AlertsStore.kt"
  store_registry: "core/store/src/commonMain/kotlin/kpt/core/store/{AppStoreRegistry.kt#Alerts,di/StoreModule.kt}"
  repository: "core/data/src/commonMain/kotlin/kpt/core/data/demo/alerts/{AlertsRepository.kt,impl/AlertsRepositoryImpl.kt}"
  di: "core/data/src/commonMain/kotlin/kpt/core/data/di/{RepositoryModule.kt,OutboxQualifiers.kt#PriceAlert}"
  database_schema: "core/database/src/commonMain/kotlin/kpt/core/database/AppDatabase.kt (v8→v10 migration adds `alerts`)"
  tests: "core/store/.../AlertsStoreTest.kt · core/data/.../AlertsReactiveInvalidationTest.kt · core/data/.../FakeAlertDao.kt"
  invalidation_bridge: "core-base/database/.../invalidation/{daoFlow,notifyingWrite}"
  draft_pipeline: "core-base/store/.../submit/{DraftSubmitHandler,OfflineSubmitSyncer,RoomSubmitOutbox} · core-base/ui/.../submit/{MutationScreenContent,DraftResumeBanner}"
  ui: "NOT SHIPPED — feature/alerts/ contains only build/ (no src). Screens above are modeled from the data contract."
