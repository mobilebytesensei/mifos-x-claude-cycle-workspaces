schema_version: '1.0'
contract_version: "2.0.0"
screen_id: cloud-todo-detail
feature_id: feat-cloudtodo
archetype: screen-content
flow: flow-cloudtodo-write
title: Cloud Todo (write-path demo)
purpose: >-
  Give the Store5 WRITE path an on-device surface. `CloudTodoRepository` is the template's only
  `createMutableStore` + `MutationGateway` consumer, and it shipped with no UI at all — so the write
  architecture (MutationGateway / MutationPolicy / MutationResult / ConflictInbox / DeleteSync) was
  covered by unit tests but nothing exercised it in a running app. This screen reads one todo through
  the offline-first stream and drives BOTH mutation policies against it, rendering every
  `MutationResult` arm so an offline write and a blocked write are observable, not just asserted.
