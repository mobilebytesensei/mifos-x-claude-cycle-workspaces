schema_version: "1.0"
feature_id: feat-cloudtodo
name: Cloud Todo demo data
status: designed

# JSONPlaceholder serves a fixed, publicly-known dataset — no seeding is required and no fixture
# needs to be shipped. /todos/1 is the stable row the screen opens on.

items:
  - id: 1
    userId: 1
    title: "delectus aut autem"
    completed: false
    note: "The canonical JSONPlaceholder row. Stable across requests — safe to hardcode as the demo id."

  - id: 2
    userId: 1
    title: "quis ut nam facilis et officia qui"
    completed: false
    note: "Available if the demo is ever widened to a list; not used by the single-todo screen."

seeding:
  required: false
  note: >-
    Nothing is seeded into Room at install. The first open fetches /todos/1 and the SourceOfTruth
    caches it; from then on the screen is offline-capable, which is what makes the offline arms
    demonstrable at all.

demo_script:
  - step: "Open Cloud Todo from the dev menu (online). The row loads and renders."
  - step: "Tap Toggle (optimistic). The summary flips immediately; outcome shows Applied."
  - step: "Turn the network OFF (airplane mode)."
  - step: >-
      Tap Toggle (optimistic) again. It STILL succeeds locally and the summary flips — the network
      leg is queued.
  - step: >-
      Tap Complete (online-required). It is Blocked(OFFLINE) and the summary does NOT change —
      the two policies diverge exactly here.
  - step: "Turn the network back ON. The queued optimistic write drains and syncs."
  - step: >-
      If the server echo diverges, the outcome becomes Conflicted and Resolve conflict opens the
      inbox, where Keep server version / Retry my version settle it.

note: >-
  This script IS the manual acceptance test for the feature — every step maps to a scenario in
  tests.yaml (T2, T3, T5, T7, T8).
