feature_id: feat-currency-rates
screen_id: currency-rates
archetype: screen-content
flow: flow-currency-rates
title: Currency Rates
purpose: >-
  Currency Rates — live foreign-exchange rates by base currency (USD at v1)
  sourced from the open-source Frankfurter API, with a case-insensitive search
  filter and an emptyIfContent no-match state, plus an embedded spot-conversion
  facet that demonstrates connectivity-aware policy routing (NETWORK_ONLY online /
  CACHE_ONLY offline), and a sibling Rate History screen that charts historical FX
  for a USD→target pair over a selectable period via a dynamic-key Store5 flow.
  Doubles as the canonical showcase of the toolkit's Store + search filter +
  emptyIfContent pattern and the CACHE_ONLY/NETWORK_ONLY archetype.
status: designed
last_modified: '2026-07-25'
quality_score: 88          # reverse-engineered (read-only) network feature: well-formed dual-stream showcase (ExchangeRatesStore NETWORK_WITH_CACHE + SpotRateLookupStore policy-routing + dynamic-key RateHistoryStore) with rich business_logic + action_contracts + test_tags; i18n annotated inline (screens_currencyrates_* keys); initial_state declared on all 3 screens (list/spot-converter/history) + top-level states. Held below the 90 shipped-UI ceiling because it is reverse-engineered.
source: reverse-engineered
origin: "/idea-import — read-only reverse-engineering of the shipped feature/currency-rates module"

showcase_note: >-
  Currency Rates is the reference implementation for "Store + search filter +
  emptyIfContent" (kmp-project-template CLAUDE.md → Toolkit feature showcase).
  The embedded spotConversionRate on CurrencyRatesViewModel is the canonical
  CACHE_ONLY + NETWORK_ONLY policy-routing showcase (Store Archetype Showcases
  table: SpotRateLookupStore under NETWORK_ONLY/CACHE_ONLY, driven by
  CurrencyConverterViewModel*). Rate History is the dynamic-key-flow +
  auto-refresh showcase (RateHistoryStore). All three surfaces share the
  ExchangeRates/RateHistory domain models and the Frankfurter API via Store5
  NETWORK_WITH_CACHE (list + history) with a Room source of truth.

setup_note: >-
  NO API key required — Frankfurter is fully open. The only configurable surface
  is the base URL (FrankfurterApiConfig), which forks override for a local
  MockWebServer or a self-hosted Frankfurter instance. Source pins the canonical
  host https://api.frankfurter.dev/ (the older api.frankfurter.app returns a
  broken HTTP 301 redirect). Base currency is hard-coded "USD" at v1; history
  offers currency chips [INR, EUR, GBP, JPY, AUD] and period chips [7, 14, 30, 90].

data_sources:
  - name: Frankfurter
    endpoint: "GET https://api.frankfurter.dev/v1/latest (list + spot converter)"
    auth: "none (open API)"
    cache: "Store5 NETWORK_WITH_CACHE (list), policy-routed NETWORK_ONLY/CACHE_ONLY (spot); Room source-of-truth (exchange_rates)"
  - name: Frankfurter
    endpoint: "GET https://api.frankfurter.dev/v1/{start}..{end} (rate history)"
    auth: "none (open API)"
    cache: "Store5 NETWORK_WITH_CACHE, dynamic RateHistoryKey; Room source-of-truth (rate_history)"

user_stories:
  - "As a user, I want to see today's exchange rates for a base currency so I know what my money is worth abroad."
  - "As a user, I want to search the rate list by currency code so I can jump straight to the currency I care about."
  - "As a user offline, I want to still see the last synced rates (marked stale) so the screen is useful without a connection."
  - "As a user, I want a point-in-time spot rate that's always fresh when I'm online and doesn't error when I'm offline."
  - "As a user, I want to see how a currency pair has moved over the last week/month/quarter so I can spot a trend."
  - "As a fork developer, I want FX rates with zero API-key setup so the feature works out of the box."

metrics:
  - { name: fx_fetch_success_rate, description: "share of Frankfurter fetches that return usable rates" }
  - { name: cache_hit_rate, description: "share of subscriptions served from the Room cache before/without a network round-trip" }
  - { name: search_usage_rate, description: "sessions where the currency search filter is used" }
  - { name: history_selection_rate, description: "currency/period chip selections per history session" }
  - { name: offline_render_rate, description: "renders served from stale cache while offline (list + history)" }

edge_cases:
  - "Search query matching no currency code → Empty (emptyIfContent), search box stays interactive."
  - "Offline with warm cache → stale Content + FreshnessIndicator band; cold cache → NoNetwork/Error with retry."
  - "Spot converter offline (CACHE_ONLY) never fires a request — avoids an error-state flicker; cold cache → Loading→Empty."
  - "Frankfurter returns an end_date earlier than requested (last business day) — Store writer overrides start/end with key-derived dates so the SOT reader matches."
  - "Rate history: a failed new key carries forward the previous selection's data as stale Content + OfflineDataBanner instead of a full-screen error."
  - "Header/row arrows use a Material ArrowForward icon (not U+2192) because the bundled Outfit font lacks the glyph on wasmJs."

related_features:
