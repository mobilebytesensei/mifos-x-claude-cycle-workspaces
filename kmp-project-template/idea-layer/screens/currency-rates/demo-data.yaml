# demo-data.yaml — Currency Rates demo/offline data.
# Sample Frankfurter responses shaped as ExchangeRates / RateHistory (domain) and
# exchange_rates / rate_history (Room) rows. Used for offline render, previews, and
# tests (mirrors fixtures in FakeCurrencyRepository / the ViewModel tests). Values are
# realistic-but-illustrative, NOT live FX data. History rates are trimmed samples
# (a real 30-day window carries ~20-30 business-day rows).
schema_version: "1.0"
screen_id: currency-rates

consumes:
  - collection: exchange_rates
    dto: ExchangeRates
    used_by: [latest-rates]
  - collection: rate_history
    dto: RateHistory
    used_by: [historical-rates]

samples:
  # Latest USD-based rates (list screen + spot converter). base=USD hard-coded at v1.
  exchange_rates:
    - base: USD
      date: "2026-05-25"
      rates:
        EUR: 0.9200
        GBP: 0.7900
        INR: 83.5000
        JPY: 156.8000
        AUD: 1.5100
        CAD: 1.3700
        CHF: 0.9050

  # Historical USD→INR over ~30 days (default history selection). List<RatePoint>.
  rate_history:
    - from: USD
      to: INR
      startDate: "2026-04-25"
      endDate: "2026-05-25"
      rates:
        - { date: "2026-04-25", value: 83.20 }
        - { date: "2026-05-02", value: 83.35 }
        - { date: "2026-05-09", value: 83.48 }
        - { date: "2026-05-16", value: 83.42 }
        - { date: "2026-05-23", value: 83.50 }
    - from: USD
      to: EUR
      startDate: "2026-04-25"
      endDate: "2026-05-25"
      rates:
        - { date: "2026-04-25", value: 0.9180 }
        - { date: "2026-05-02", value: 0.9195 }
        - { date: "2026-05-09", value: 0.9210 }
        - { date: "2026-05-16", value: 0.9188 }
        - { date: "2026-05-23", value: 0.9200 }

# Edge-case fixtures for state coverage.
edge_cases:
  - id: empty_search
    screen: currency-rates-list
    trigger: "search query matches no currency code (e.g. \"ZZZ\")"
    renders: "ScreenState.Empty via emptyIfContent { it.rates.isEmpty() }."
  - id: offline_warm_cache
    screen: currency-rates-list
    trigger: "offline with a prior fetch cached in exchange_rates"
    renders: "cached rates render as stale Content; FreshnessIndicator shows Stale/VeryStale band."
  - id: offline_cold_cache
    screen: currency-rates-list
    trigger: "offline with no cache"
    renders: "ScreenState.NoNetwork / Error with retry."
  - id: spot_cache_only_cold
    screen: currency-spot-converter
    trigger: "offline (CACHE_ONLY) with cold cache"
    renders: "Loading → Empty; NO network request fired."
  - id: history_stale_carry_forward
    screen: rate-history
    trigger: "new currency/period key fetch fails while a previous selection is cached"
    renders: "previous RateHistory renders as stale Content + inline OfflineDataBanner (\"No network · Updated <ago>\" / \"No network · Cached data\")."
  - id: history_empty_window
    screen: rate-history
    trigger: "no rate points for the pair/window"
    renders: "ScreenState.Empty (framework Empty slot)."
