# flow.yaml — Currency Rates
# Per-screen flow sibling. TWO nav destinations in one graph:
#   currency-rates-list (CurrencyRatesScreen) · rate-history (RateHistoryScreen).
# Reverse-engineered from feature/currency-rates/navigation/CurrencyRatesNavigation.kt
# (nested nav graph: CurrencyRatesGraphRoute startDestination = CurrencyRatesRoute).
screen_id: currency-rates
feature_ref: feat-currency-rates
flow_groups: [flow-currency-rates]
participates_in_flows: [flow-currency-rates]

# Nav graph: navigation<CurrencyRatesGraphRoute>(startDestination = CurrencyRatesRoute) {
#   CurrencyRatesRoute, RateHistoryRoute }
# NOTE: both destinations are declared in the graph, but source wires no in-graph
# edge FROM the list TO history — RateHistoryRoute is reached via the standalone
# NavController.navigateToRateHistory() entry point (e.g. from a tools/home hub).
nav_graph:
  parent_route: CurrencyRatesGraphRoute
  start_destination: CurrencyRatesRoute
  destinations:
    - { route: CurrencyRatesRoute, screen: currency-rates-list, entry: "NavController.navigateToCurrencyRates()" }
    - { route: RateHistoryRoute,   screen: rate-history,        entry: "NavController.navigateToRateHistory()" }

entry_points:
  - id: from-tools-hub-rates
    description: "Tools/home hub 'Currency Rates' entry → FX list"
    trigger: currency_rates_tile_tap
  - id: from-tools-hub-history
    description: "Tools/home hub 'Rate History' entry → history screen (navigateToRateHistory)"
    trigger: rate_history_tile_tap
  - id: back-from-history
    description: "Back from rate history returns to the caller"
    trigger: history_back

inbound_routes:
  - from: hub
    trigger: currency_rates_tile_tap
    to: currency-rates-list
    flow: flow-currency-rates
    label: "Hub → Currency Rates list"
  - from: hub
    trigger: rate_history_tile_tap
    to: rate-history
    flow: flow-currency-rates
    label: "Hub → Rate History"

outbound_routes:
  - to: back
    action: navigate_back
    trigger: list_back_tap
    label: "Back (popBackStackSafely) → caller"
    flow: flow-currency-rates
    from: currency-rates-list

# Rate-history screen's own outbound (leaf).
history_routes:
  screen_id: rate-history
  outbound_routes:
    - to: back
      action: navigate_back
      trigger: history_back_tap
      label: "Back (popBackStackSafely) → caller / list"
      flow: flow-currency-rates

# In-screen actions that do NOT navigate (Store5 fetch / local-state mutations).
in_screen_actions:
  - { screen: currency-rates-list, action: "Search(query)", trigger: "search field text change", effect: "filter rates map live (case-insensitive); emptyIfContent → Empty on no match" }
  - { screen: currency-rates-list, action: Retry,   trigger: "freshness indicator tap / error-slot retry", effect: "exchangeRatesStream.retry() — re-fetch USD latest rates" }
  - { screen: currency-rates-list, action: Refresh, trigger: "pull-to-refresh / programmatic", effect: "exchangeRatesStream.refresh() — force re-fetch" }
  - { screen: currency-spot-converter, action: "policy flip", trigger: "NetworkMonitor connectivity change", effect: "flatMapLatest rebuilds spotConversionRate with NETWORK_ONLY (online) / CACHE_ONLY (offline)" }
  - { screen: rate-history, action: "SelectCurrency(code)", trigger: "currency FilterChip tap [INR|EUR|GBP|JPY|AUD]", effect: "new RateHistoryKey → re-fetch USD→code window" }
  - { screen: rate-history, action: "SelectPeriod(days)",   trigger: "period FilterChip tap [7|14|30|90]",         effect: "new RateHistoryKey → re-fetch [today-days, today]" }
  - { screen: rate-history, action: Retry, trigger: "freshness indicator tap / error retry", effect: "rateHistoryStream.retry() — re-fetch current key" }
