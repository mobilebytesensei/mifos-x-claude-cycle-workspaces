  list_viewmodel: "feature/currency-rates/src/commonMain/kotlin/kpt/feature/currencyrates/ui/CurrencyRatesViewModel.kt"
  history_screen: "feature/currency-rates/src/commonMain/kotlin/kpt/feature/currencyrates/ui/RateHistoryScreen.kt"
