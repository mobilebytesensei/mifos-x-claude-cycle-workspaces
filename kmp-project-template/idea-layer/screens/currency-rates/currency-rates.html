<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Rates — Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#6C63FF','on-primary':'#ffffff'}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#6C63FF;--on-primary:#fff;--bg:#fff;--text:#1C1B1F;--border:#E7E0EC;--error:#BA1A1A;--success:#146C2E;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
body.embedded{background:var(--bg);margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;background:var(--bg);}
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span id="screenTitle" class="text-sm font-semibold text-slate-200 flex-1">Loading…</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none"></select>
  <button onclick="toggleTags()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">Tags</button>
</div>
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-white shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-white">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-slate-50" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900 rounded-full"></div></div>
    <div id="fab-container" class="absolute bottom-8 right-5"></div>
  </div>
</div>
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-white shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-slate-50 flex-1"></div>
  <div id="embedded-fab" class="fixed bottom-8 right-5"></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>
<script>
/* ══ feature/currency-rates — live FX via Frankfurter (no auth), NETWORK_WITH_CACHE.
   currency-rates-list (primary) + embedded spot-converter facet + rate-history sibling.
   Real values from demo-data.yaml. Freshness overlay for offline stale cache. ══ */
var FX=[['EUR',0.9200],['GBP',0.7900],['INR',83.5000],['JPY',156.8000],['AUD',1.5100],['CAD',1.3700],['CHF',0.9050]];
var HIST=[['2026-04-25',83.20],['2026-05-02',83.35],['2026-05-09',83.48],['2026-05-16',83.42],['2026-05-23',83.50]];
function appBar(title,back,fresh){var trailing=fresh?'<span class="flex items-center gap-1 text-xs font-medium text-emerald-600 px-2 py-1 rounded-full bg-emerald-50 cursor-pointer" onclick="showToast(\'Refresh USD latest rates\')"><span class="material-symbols-outlined text-sm">check_circle</span>Fresh</span>':(fresh===false?'<span class="flex items-center gap-1 text-xs font-medium text-amber-600 px-2 py-1 rounded-full bg-amber-50 cursor-pointer" onclick="showToast(\'Retry — re-fetch rates\')"><span class="material-symbols-outlined text-sm">history</span>Stale</span>':'');
 return '<div class="sticky top-0 z-10 flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-100"><span class="material-symbols-outlined text-xl text-slate-700 cursor-pointer" onclick="navigateTo(\''+(back||'')+'\')">arrow_back</span><span class="flex-1 text-lg font-semibold text-slate-900">'+title+'</span>'+trailing+'</div>';}
function searchCard(){return '<div class="mx-4 mt-3 mb-2 p-3 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-100"><span class="material-symbols-outlined text-slate-400">search</span><span class="text-sm text-slate-400">Search currency…</span></div></div>';}
function baseLabel(){return '<div class="px-5 py-1 text-xs font-medium text-slate-500">Base: USD • 2026-05-25</div>';}
function fxRow(c){return '<div class="flex items-center justify-between px-5 py-3 border-b border-slate-100 bg-white"><span class="text-sm font-semibold text-slate-900">'+c[0]+'</span><span class="text-sm text-slate-600 tabular-nums">'+c[1].toFixed(4)+'</span></div>';}
function contentHtml(fresh){return appBar('Currency Rates','home',fresh!==false)+searchCard()+baseLabel()+'<div class="mx-4 mb-6 rounded-2xl overflow-hidden border border-slate-100 shadow-sm">'+FX.map(fxRow).join('')+'</div>';}
function loadingHtml(){return appBar('Currency Rates','home',null)+searchCard()+'<div class="flex flex-col items-center justify-center py-24 gap-3"><div class="w-8 h-8 border-4 border-primary/30 border-t-primary rounded-full animate-spin"></div><span class="text-sm text-slate-400">Loading currency rates…</span></div>';}
function emptyHtml(){return appBar('Currency Rates','home',true)+searchCard()+'<div class="flex flex-col items-center justify-center text-center px-8 py-20"><span class="material-symbols-outlined text-6xl text-slate-300 mb-3">search_off</span><p class="text-base font-semibold text-slate-700">No currencies match your search</p><p class="text-sm text-slate-400 mt-1">emptyIfContent collapses a zero-match filter to Empty. Clear the query to see all rates.</p></div>';}
function errorHtml(){return appBar('Currency Rates','home',false)+searchCard()+'<div class="flex flex-col items-center justify-center text-center px-8 py-20"><span class="material-symbols-outlined text-6xl text-red-300 mb-3">wifi_off</span><p class="text-base font-semibold text-slate-700">Couldn’t reach the exchange-rate service</p><p class="text-sm text-slate-400 mt-1">Pull to retry. With a warm cache the last rates render as stale Content instead.</p><button onclick="showToast(\'Retry — re-fetch USD latest\')" class="mt-4 px-5 py-2 rounded-xl text-white text-sm font-semibold" style="background:var(--primary)">Retry</button></div>';}
function offlineHtml(){return appBar('Currency Rates','home',false)+'<div class="mx-4 mt-3 mb-1 px-4 py-2 rounded-xl bg-amber-50 text-amber-700 text-xs flex items-center gap-2"><span class="material-symbols-outlined text-base">cloud_off</span>Showing last synced rates · Stale band (cached ExchangeRates keep rendering as Content)</div>'+searchCard()+baseLabel()+'<div class="mx-4 mb-6 rounded-2xl overflow-hidden border border-slate-100 shadow-sm">'+FX.map(fxRow).join('')+'</div>';}
/* ── rate-history sibling ── */
function chipRow(opts,sel,fmt){return '<div class="flex flex-wrap gap-2">'+opts.map(function(o){var on=o===sel;var lbl=fmt?fmt(o):o;return '<span class="px-3 py-1.5 rounded-full text-sm border '+(on?'border-primary bg-primary/10 text-primary font-medium':'border-slate-300 text-slate-600')+'">'+lbl+'</span>';}).join('')+'</div>';}
function histHtml(offline){return appBar('Rate History','currency-rates-list',offline?false:true)
 +(offline?'<div class="mx-4 mt-3 mb-1 px-4 py-2 rounded-xl bg-rose-50 text-rose-700 text-xs flex items-center gap-2"><span class="material-symbols-outlined text-base">cloud_off</span>No network · Updated 2h ago (previous selection carried forward as stale)</div>':'')
 +'<div class="mx-4 mt-3 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="text-xs font-medium text-slate-500 mb-2">Currency</div>'+chipRow(['INR','EUR','GBP','JPY','AUD'],'INR')+'<div class="text-xs font-medium text-slate-500 mt-3 mb-2">Period</div>'+chipRow([7,14,30,90],30,function(d){return d+'d';})+'</div>'
 +'<div class="px-5 py-3 flex items-center gap-1 text-sm font-semibold text-slate-900">USD <span class="material-symbols-outlined text-base text-slate-400">arrow_forward</span> INR <span class="text-xs font-normal text-slate-400 ml-1">(2026-04-25 to 2026-05-25)</span></div>'
 +'<div class="mx-4 mb-6 rounded-2xl overflow-hidden border border-slate-100 shadow-sm bg-white">'+HIST.map(function(h){return '<div class="flex items-center justify-between px-5 py-3 border-b border-slate-100"><span class="text-sm text-slate-500 flex items-center gap-1"><span class="material-symbols-outlined text-sm text-slate-300">arrow_forward</span>'+h[0]+'</span><span class="text-sm font-medium text-slate-900 tabular-nums">'+h[1].toFixed(4)+'</span></div>';}).join('')+'</div>';}

var DATA={id:'currency-rates-list',name:'Currency Rates',feature:'feat-currency-rates',status:'designed',fab:null,
 states:{initial_state:'content',
  content:{name:'Content',html:contentHtml(true)},
  loading:{name:'Loading',html:loadingHtml()},
  empty:{name:'Empty (no match)',html:emptyHtml()},
  error:{name:'Error / No network',html:errorHtml()},
  offline:{name:'Offline (stale cache)',html:offlineHtml()},
  history:{name:'Rate History',html:histHtml(false)},
  'history-offline':{name:'Rate History · offline',html:histHtml(true)}
 }};

/* ══ engine ══ */
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
var showTags=false,currentState=null;
function contentEl(){return document.getElementById(isEmbedded?'embedded-screen-content':'screen-content');}
function fabEl(){return document.getElementById(isEmbedded?'embedded-fab':'fab-container');}
function populateStates(){var p=document.getElementById('statePicker');if(!p)return;p.innerHTML='';Object.keys(DATA.states).forEach(function(k){if(k==='initial_state')return;var o=document.createElement('option');o.value=k;o.textContent=DATA.states[k].name||k;p.appendChild(o);});}
function switchState(id){if(!DATA.states[id]||id==='initial_state')id=DATA.states.initial_state;currentState=id;var p=document.getElementById('statePicker');if(p)p.value=id;contentEl().innerHTML='<div id="comp-wrap">'+(DATA.states[id].html||'')+'</div>';renderFab();}
function renderFab(){fabEl().innerHTML='';}
function navigateTo(t){if(!t){return;}if(t==='rate-history'){switchState('history');return;}if(window!==window.top){window.parent.postMessage({action:'navigate',screenId:t},'*');}else if(DATA.states[t]){switchState(t);}else{showToast('→ '+t);}}
function showToast(m){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';t.textContent=m;document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},1800);}
function toggleTags(){showTags=!showTags;}
function notifyParent(){if(window===window.top)return;try{window.parent.postMessage({action:'screenLoaded',screenId:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,inspectorData:{id:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,states:Object.keys(DATA.states).filter(function(k){return k!=='initial_state';})}},'*');}catch(e){}}
window.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state);if(e.data.action==='getInspectorData')notifyParent();if(e.data.action==='applyTheme'&&e.data.cssVars){var r=document.documentElement;Object.keys(e.data.cssVars).forEach(function(k){if(e.data.cssVars[k])r.style.setProperty(k,e.data.cssVars[k]);});}});
function boot(){if(isEmbedded){document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col');document.body.classList.add('embedded');}document.title=DATA.name+' — Prototype';var t=document.getElementById('screenTitle');if(t)t.textContent=DATA.name;populateStates();var urlState=new URLSearchParams(location.search).get('state');switchState(urlState||DATA.states.initial_state);notifyParent();}
boot();
</script>
</body>
</html>
