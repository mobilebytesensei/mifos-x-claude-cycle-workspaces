<!doctype html>
<!-- render-hash: currencyrateshd01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Currency Rates — content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  /* Primary — violet brand */
  --primary: #6C63FF; --on-primary: #FFFFFF; --primary-container: #E4E0FF; --on-primary-container: #1A0F6B;
  --primary-hover: #5D53F0; --primary-pressed: #4E44D8;
  /* Secondary — green (positive money movement) */
  --secondary: #146C2E; --on-secondary: #FFFFFF; --secondary-container: #C3F2CE; --on-secondary-container: #00210A;
  /* Tertiary */
  --tertiary: #7D5260; --on-tertiary: #FFFFFF; --tertiary-container: #FFD9E3; --on-tertiary-container: #31101C;
  /* Error / success / warning / info */
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #146C2E; --on-success: #FFFFFF; --success-container: #C3F2CE; --on-success-container: #00210A;
  --warning: #8A5300; --on-warning: #FFFFFF; --warning-container: #FFDDB3; --on-warning-container: #2B1700; --warning-strong: #B45309;
  --info: #0061A4; --on-info: #FFFFFF;
  /* Surfaces */
  --background: #FFFBFE; --on-background: #1C1B1F;
  --surface: #FFFBFE; --on-surface: #1C1B1F; --surface-variant: #E7E0EC; --on-surface-variant: #49454F;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
  --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9; --surface-dim: #DED8E1; --surface-bright: #FFFBFE;
  /* Outlines / inverse / accent */
  --outline: #79747E; --outline-variant: #CAC4D0;
  --inverse-surface: #313033; --inverse-on-surface: #F4EFF4; --inverse-primary: #C3BEFF;
  --accent: #00BFA5; --on-accent: #00201A; --scrim: #000000;
  /* Typography */
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-display-lg: 3rem; --fs-display-md: 2.375rem; --fs-display-sm: 1.875rem;
  --fs-h1: 1.625rem; --fs-h2: 1.375rem; --fs-h3: 1.25rem;
  --fs-title: 1.125rem; --fs-title-md: 1rem; --fs-title-sm: 0.875rem;
  --fs-body: 1rem; --fs-body-sm: 0.875rem; --fs-label: 0.875rem; --fs-label-sm: 0.75rem;
  --fs-caption: 0.75rem; --fs-caption-sm: 0.6875rem;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-label: 0.1px; --ls-caption: 0.3px; --ls-wide: 0.5px;
  /* Radius */
  --r-xs: 6px; --r-sm: 10px; --r-md: 16px; --r-lg: 20px; --r-xl: 28px; --r-full: 9999px;
  /* Spacing (8pt grid) */
  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
  /* Elevation — §7a. Violet-tinted shadows (not neutral black) for brand cohesion. */
  --el-0: none;
  --el-1: 0 1px 3px rgba(28,17,84,0.08), 0 1px 2px rgba(28,17,84,0.06);
  --el-2: 0 3px 8px rgba(28,17,84,0.10), 0 2px 4px rgba(28,17,84,0.08);
  --el-3: 0 8px 20px rgba(28,17,84,0.14), 0 4px 8px rgba(28,17,84,0.10);
  --el-4: 0 12px 28px rgba(28,17,84,0.16);
  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #C3BEFF; --on-primary: #2E2299; --primary-container: #453AB1; --on-primary-container: #E4E0FF;
  --primary-hover: #D4D0FF; --primary-pressed: #E5E2FF;
  --secondary: #A8D5AF; --on-secondary: #013913; --secondary-container: #00531E; --on-secondary-container: #C3F2CE;
  --tertiary: #EFB8C8; --on-tertiary: #4A2532; --tertiary-container: #633B48; --on-tertiary-container: #FFD9E3;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #A8D5AF; --on-success: #013913; --success-container: #00531E; --on-success-container: #C3F2CE;
  --warning: #FFB955; --on-warning: #472A00; --warning-container: #663D00; --on-warning-container: #FFDDB3; --warning-strong: #E0912F;
  --info: #9CCAFF; --on-info: #003258;
  --background: #1C1B1F; --on-background: #E6E1E5;
  --surface: #1C1B1F; --on-surface: #E6E1E5; --surface-variant: #49454F; --on-surface-variant: #CAC4D0;
  --surface-container-lowest: #0F0E11; --surface-container-low: #1D1B1E; --surface-container: #211F23;
  --surface-container-high: #2B292D; --surface-container-highest: #363438; --surface-dim: #141316; --surface-bright: #3A383C;
  --outline: #938F99; --outline-variant: #49454F;
  --inverse-surface: #E6E1E5; --inverse-on-surface: #313033; --inverse-primary: #6C63FF;
  --accent: #4FD8C4; --on-accent: #00201A;
  --el-1: 0 1px 3px rgba(0,0,0,0.40); --el-2: 0 3px 8px rgba(0,0,0,0.50);
  --el-3: 0 8px 20px rgba(0,0,0,0.60); --el-4: 0 12px 28px rgba(0,0,0,0.66);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

/* top app bar */
header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); color: var(--on-surface); border-bottom: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-2); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; }
header[data-shell="top-app-bar"] .bar-trailing { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-full); }

main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--sp-lg)); overflow-y: auto; }

/* freshness chip (trailing) — data-action retry */
.freshness-chip { display: inline-flex; align-items: center; gap: var(--sp-xxs); padding: var(--sp-xxs) var(--sp-sm); border-radius: var(--r-full); background: var(--success-container); color: var(--on-success-container); font-size: var(--fs-caption-sm); font-weight: var(--fw-medium); border: none; cursor: pointer; font-family: inherit; }
.freshness-chip .material-symbols-outlined { font-size: 16px; }
.freshness-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* search card — el-1 raised surface */
.search-card { display: flex; flex-direction: column; padding: var(--sp-md); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--el-1); border: var(--border-w) solid var(--outline-variant); }
.search-field { display: flex; align-items: center; gap: var(--sp-sm); min-height: 48px; padding: 0 var(--sp-md); border-radius: var(--r-full); background: var(--surface-container-low); cursor: text; }
.search-field .lead { color: var(--on-surface-variant); flex: 0 0 auto; }
.search-field .lead .material-symbols-outlined { font-size: 20px; }
.search-field .ph { flex: 1; min-width: 0; font-size: var(--fs-body-sm); color: var(--on-surface-variant); }
.search-field:focus-within { box-shadow: 0 0 0 2px var(--primary) inset; }

/* base/date label */
.base-label { padding: 0 var(--sp-xs); font-size: var(--fs-label-sm); font-weight: var(--fw-medium); color: var(--on-surface-variant); letter-spacing: var(--ls-caption); }
.base-label .mono { color: var(--on-surface); }

/* section label */
.section-label { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-xs); }
.section-label h2 { font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--on-surface-variant); margin: 0; }
.section-label .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

/* fx list — single elevated container, divided rows (matches source: HorizontalDivider between rows) */
.fx-list { list-style: none; margin: 0; padding: 0; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--el-1); border: var(--border-w) solid var(--outline-variant); overflow: hidden; }
.fx-row { display: flex; align-items: center; gap: var(--sp-md); width: 100%; min-height: 56px; padding: var(--sp-sm) var(--sp-md); border-bottom: var(--border-w) solid var(--outline-variant); background: var(--surface); }
.fx-row:last-child { border-bottom: none; }
.fx-avatar { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; aspect-ratio: 1 / 1; border-radius: var(--r-full); background: var(--primary-container); color: var(--on-primary-container); font-family: var(--font-mono); font-size: var(--fs-caption-sm); font-weight: var(--fw-semibold); }
.fx-code { flex: 1; min-width: 0; font-size: var(--fs-title-sm); font-weight: var(--fw-medium); color: var(--on-surface); }
.fx-value { font-size: var(--fs-body-sm); color: var(--on-surface); text-align: right; }

@media (prefers-reduced-motion: no-preference) {
  .freshness-chip { transition: filter 120ms ease; }
  .freshness-chip:active { filter: brightness(0.96); }
}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="currency-rates" data-state="content">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="top_app_bar">
    <button type="button" class="leading" data-nav-to="home" data-nav-type="pop" data-component-type="icon_button" data-component-id="back_button" aria-label="Back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="app-title">Currency Rates</h1>
    <span class="bar-trailing">
      <button type="button" class="freshness-chip" data-component-type="freshness_indicator" data-component-id="freshness" data-action="retry" aria-label="Data freshness — tap to refresh">
        <span class="material-symbols-outlined" aria-hidden="true">check_circle</span>Fresh
      </button>
    </span>
  </header>

  <main data-shell="content" data-state="content">

    <!-- Search card (#search_card → #search_field) — RatesAction.Search(query) filters rates live -->
    <div class="search-card" data-component-type="card" data-component-variant="app_card" data-component-id="search_card" data-from-ui-yaml-path="components[0]">
      <div class="search-field" role="search" data-component-type="text_field" data-component-id="search_field" data-action="search" data-action-params='{"query":""}' aria-label="Search currency">
        <span class="lead"><span class="material-symbols-outlined" aria-hidden="true">search</span></span>
        <span class="ph">Search currency&hellip;</span>
      </div>
    </div>

    <!-- Base/date label (#base_label) -->
    <div class="base-label" data-component-type="text" data-component-variant="label_medium" data-component-id="base_label">Base: <span class="mono">USD</span> &middot; <span class="mono">25 May 2026</span></div>

    <div class="section-label">
      <h2>Live rates</h2>
      <span class="count">7 currencies</span>
    </div>

    <!-- Rates list (#rates_list → #rate_item × 7) — display-only rows, no on_click (per ui.yaml note) -->
    <ul class="fx-list" data-component-type="list" data-component-id="rates_list" aria-label="Latest USD exchange rates">
      <li class="fx-row" data-component-type="row" data-component-id="rate_item_EUR">
        <span class="fx-avatar" aria-hidden="true">EU</span>
        <span class="fx-code">EUR</span>
        <span class="fx-value mono">0.9200</span>
      </li>
      <li class="fx-row" data-component-type="row" data-component-id="rate_item_GBP">
        <span class="fx-avatar" aria-hidden="true">GB</span>
        <span class="fx-code">GBP</span>
        <span class="fx-value mono">0.7900</span>
      </li>
      <li class="fx-row" data-component-type="row" data-component-id="rate_item_INR">
        <span class="fx-avatar" aria-hidden="true">IN</span>
        <span class="fx-code">INR</span>
        <span class="fx-value mono">83.5000</span>
      </li>
      <li class="fx-row" data-component-type="row" data-component-id="rate_item_JPY">
        <span class="fx-avatar" aria-hidden="true">JP</span>
        <span class="fx-code">JPY</span>
        <span class="fx-value mono">156.8000</span>
      </li>
      <li class="fx-row" data-component-type="row" data-component-id="rate_item_AUD">
        <span class="fx-avatar" aria-hidden="true">AU</span>
        <span class="fx-code">AUD</span>
        <span class="fx-value mono">1.5100</span>
      </li>
      <li class="fx-row" data-component-type="row" data-component-id="rate_item_CAD">
        <span class="fx-avatar" aria-hidden="true">CA</span>
        <span class="fx-code">CAD</span>
        <span class="fx-value mono">1.3700</span>
      </li>
      <li class="fx-row" data-component-type="row" data-component-id="rate_item_CHF">
        <span class="fx-avatar" aria-hidden="true">CH</span>
        <span class="fx-code">CHF</span>
        <span class="fx-value mono">0.9050</span>
      </li>
    </ul>

  </main>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
