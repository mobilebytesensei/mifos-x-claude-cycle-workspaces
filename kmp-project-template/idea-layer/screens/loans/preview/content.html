<style>

}
:root[data-theme="dark"] {

  --success: #A8D5AF; --on-success: #013913; --success-container: #00531E; --on-success-container: #C3F2CE;

  --surface-container-high: #2B292D; --surface-container-highest: #363438; --surface-dim: #141316; --surface-bright: #3A383C;
  --outline: #938F99; --outline-variant: #49454F;
  --inverse-surface: #E6E1E5; --inverse-on-surface: #313033; --inverse-primary: #6C63FF;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); color: var(--on-surface); border-bottom: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-2); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell="top-app-bar"] .leading:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; font-family: var(--font-display); }

main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px) + var(--sp-lg)); overflow-y: auto; overflow-x: hidden; position: relative; }

/* Summary hero */
.hero-card { position: relative; display: flex; flex-direction: column; gap: var(--sp-sm); padding: var(--sp-lg); border-radius: var(--r-lg); background: linear-gradient(135deg, var(--primary), color-mix(in oklch, var(--primary) 55%, var(--tertiary))); color: var(--on-primary); box-shadow: var(--el-2); overflow: hidden; }
.hero-card::after { content: ""; position: absolute; top: -40%; right: -20%; width: 60%; aspect-ratio: 1/1; border-radius: var(--r-full); background: color-mix(in oklch, var(--on-primary) 10%, transparent); pointer-events: none; }
.hero-card .hero-label { font-size: var(--fs-body-sm); font-weight: var(--fw-medium); color: color-mix(in oklch, var(--on-primary) 85%, transparent); margin: 0; }
.hero-card .hero-amount { font-family: var(--font-mono); font-size: var(--fs-display-sm); font-weight: var(--fw-bold); letter-spacing: -0.5px; margin: 0; line-height: var(--lh-tight); }
.hero-stat-row { display: flex; gap: var(--sp-xl); margin-top: var(--sp-sm); position: relative; z-index: 1; }
.hero-stat { display: flex; flex-direction: column; gap: 2px; }
.hero-stat .k { font-size: var(--fs-caption); color: color-mix(in oklch, var(--on-primary) 80%, transparent); text-transform: uppercase; letter-spacing: var(--ls-caption); }
.hero-stat .v { font-family: var(--font-mono); font-size: var(--fs-title); font-weight: var(--fw-semibold); }

.section-title-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); }
.section-title-row h2 { font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--on-surface-variant); margin: 0; }
.section-title-row .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

/* Loan row list */
.loan-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.loan-row { display: flex; align-items: center; gap: var(--sp-md); width: 100%; padding: var(--sp-md); border: var(--border-w) solid var(--outline-variant); border-radius: var(--r-md); background: var(--surface); box-shadow: var(--el-1); }
.loan-row .lr-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-xs); text-align: left; background: none; border: none; padding: 0; font-family: inherit; color: inherit; cursor: pointer; }
.loan-row .lr-head { display: flex; align-items: center; gap: var(--sp-sm); }
.loan-row .lr-name { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kind-chip { display: inline-flex; align-items: center; padding: 2px var(--sp-sm); border-radius: var(--r-full); font-size: var(--fs-caption-sm); font-weight: var(--fw-semibold); letter-spacing: var(--ls-caption); text-transform: uppercase; flex: 0 0 auto; }
.kind-chip.k-secondary { background: var(--secondary-container); color: var(--on-secondary-container); }
.kind-chip.k-tertiary { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.kind-chip.k-primary { background: var(--primary-container); color: var(--on-primary-container); }
.loan-row .lr-figures { display: flex; align-items: baseline; gap: var(--sp-md); flex-wrap: wrap; }
.loan-row .lr-figures .fig { display: flex; flex-direction: column; gap: 1px; }
.loan-row .lr-figures .fig .k { font-size: var(--fs-caption-sm); color: var(--on-surface-variant); }
.loan-row .lr-figures .fig .v { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-medium); }
.loan-row .lr-figures .fig .v.remaining { color: var(--error); }
.progress-track { position: relative; width: 100%; height: 6px; border-radius: var(--r-full); background: var(--surface-container-high); overflow: hidden; }
.progress-track .fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: var(--r-full); }
.progress-track .fill.p-secondary { background: var(--secondary); }
.progress-track .fill.p-tertiary { background: var(--tertiary); }
.progress-track .fill.p-primary { background: var(--primary); }
.loan-row .lr-footer { font-size: var(--fs-caption); color: var(--on-surface-variant); display: flex; align-items: center; justify-content: space-between; }
.loan-row .lr-more { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); border: none; background: transparent; color: var(--on-surface-variant); cursor: pointer; align-self: flex-start; }
.loan-row .lr-more:focus-visible, .loan-row .lr-main:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* Extended FAB */
.fab-extended { position: fixed; right: var(--sp-md); bottom: calc(var(--sp-md) + env(safe-area-inset-bottom, 0px)); z-index: 25; display: inline-flex; align-items: center; gap: var(--sp-sm); min-height: 56px; padding: 0 var(--sp-lg); border-radius: var(--r-lg); border: none; background: var(--primary-container); color: var(--on-primary-container); font-family: inherit; font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); cursor: pointer; box-shadow: var(--el-3); }
.fab-extended .material-symbols-outlined { font-size: 22px; }
.fab-extended:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }

@media (prefers-reduced-motion: no-preference) {
  .loan-row .lr-main, .fab-extended, .loan-row .lr-more { transition: filter 120ms ease, box-shadow 120ms ease; }
  .loan-row .lr-main:active, .fab-extended:active { filter: brightness(0.97); }
}
</style>

<div data-shell="root" data-screen-id="loans" data-state="content">

    </div>

    <div class="section-title-row">

            <div class="lr-figures">

            <div class="lr-footer"><span>16% paid</span><span class="mono">Next due Aug 1</span></div>

        </div>
      </li>

            <div class="lr-head">
              <span class="lr-name">Auto Loan — Sedan</span>
              <span class="kind-chip k-tertiary">Auto</span>

            <div class="lr-figures">

            <div class="lr-footer"><span>45% paid</span><span class="mono">Next due Aug 5</span></div>
          </button>

            <span class="material-symbols-outlined" aria-hidden="true">more_vert</span>
          </button>
        </div>
      </li>

              <span class="fig"><span class="k">Monthly EMI</span><span class="v mono">$466.43</span></span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="31" aria-valuemin="0" aria-valuemax="100" aria-label="31% paid"><span class="fill p-tertiary" style="width:30.67%"></span></div>
            <div class="lr-footer"><span>31% paid</span><span class="mono">Next due Aug 15</span></div>
          </button>
          <button type="button" class="lr-more" data-component-type="IconButton" data-component-id="loan_row_more_loan-student-01" data-action="confirm_delete" data-action-params='{"id":"loan-student-01"}' aria-label="More options for Student Loan">
            <span class="material-symbols-outlined" aria-hidden="true">more_vert</span>
          </button>
        </div>
      </li>
      <li>
        <div class="loan-row" data-component-type="ListItem" data-component-variant="loan_row_card" data-component-id="loan_row_loan-personal-01">

            <div class="lr-head">
              <span class="lr-name">Personal Loan</span>
              <span class="kind-chip k-primary">Personal</span>
