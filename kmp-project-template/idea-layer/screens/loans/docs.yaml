schema_version: '1.0'
screen_id: loans-list
feature_id: feat-loans
archetype: paging-list
flow: flow-loans-browse
title: Personal Loans (B1 Loan Tracker)
purpose: >-
  Track personal loans locally — principal, EMI, interest rate, tenure, and next due-date.
  A purely offline feature (Room + Store5, no backend): browse the loan portfolio with a
  summary tile (total outstanding, monthly EMI, active count), drill into a loan's detail,
  and add / edit / delete loans through an offline-resilient DraftSubmitHandler form.
status: reverse-engineered
source_of_truth: source            # imported FROM shipped source, not FROM idea-layer
quality_score: 90
last_modified: '2026-08-01'

# ── B1 showcase note (why this feature exists in the Money Toolkit template) ──
showcase:
  toolkit_id: B1
  name: "Loan Tracker"
  patterns_demonstrated:
    - "PagingScreenStream list + SubmitHandler edit form (per template CLAUDE.md feature showcase)"
    - "OFFLINE_LOCAL_ONLY Store5 store (LoansStore, key=Unit → List<LoanEntity>)"
    - "LOAD_ONCE archetype (LoanDetailViewModel.loadOnceScreenState) — background writes don't clobber edits"
    - "ScreenWithMutationStream seam (LoanDetailViewModel.combinedState: read ScreenState + write SubmitState)"
    - "Multi-formKey BaseDraftMutationViewModel (EditLoanViewModel) — concurrent offline drafts, one per loan"
    - "Cross-module WorkScheduler consumption (LoanReminderUseCase → sync module, zero direct dep)"
  store_archetype: OFFLINE_LOCAL_ONLY
  note: >-
    The shipped PersonalLoansListScreen renders a full ScreenContent + LazyColumn over the
    complete loan list (Room reactive stream), not literal API pagination — the 'paging' label
    is the template's showcase vocabulary for the list-stream pattern; there is no remote page cursor.

components:
  - top_app_bar
  - extended_fab
  - hero_card
  - lazy_column
  - loan_row_card
  - status_chip
  - amount_display
  - money_text
  - linear_progress_indicator
  - alert_dialog
  - app_card
  - outlined_text_field
  - dropdown_menu
  - button

screens_summary:
  - { id: loans-list,   composable: PersonalLoansListScreen, viewmodel: PersonalLoansListViewModel, states: "loading, content, empty, error" }
  - { id: loan-detail,  composable: LoanDetailScreen,        viewmodel: LoanDetailViewModel,        states: "loading, content, empty" }
  - { id: loan-addedit, composable: AddOrEditLoanScreen,     viewmodel: EditLoanViewModel,          states: "content, submitting, submitted, failed" }

user_stories:
  - "As a user, I want to see all my loans with outstanding balance and monthly EMI so I know what I owe at a glance."
  - "As a user, I want to add a new loan and see its computed monthly EMI + total interest before I save."
  - "As a user, I want to edit a loan's details and delete loans I've paid off."
  - "As a user, I want my edits to survive being offline — nothing lost even if I edit several loans without a connection."
  - "As a user, I want a reminder before a loan payment is due."

metrics:
  - "loans_added / loans_edited / loans_deleted"
  - "avg_active_loans_per_user"
  - "add_edit_form_completion_rate"
  - "offline_draft_recovery_rate (drafts committed on reconnect)"
  - "due_date_reminders_scheduled"

data_model:
  entity: Loan
  table: banking_loans
  fields:
    - { name: id, type: String, note: "client UUID, primary key" }
    - { name: name, type: String }
    - { name: kind, type: "LoanKind (PERSONAL|MORTGAGE|AUTO|STUDENT|BUSINESS|OTHER)" }
    - { name: principal, type: Double }
    - { name: principalRemaining, type: Double, note: "user-maintained" }
    - { name: annualRatePercent, type: Double }
    - { name: tenureMonths, type: Int }
    - { name: monthsRemaining, type: Int, note: "user-maintained" }
    - { name: monthlyPayment, type: Double, note: "computed EMI" }
    - { name: nextDueDate, type: LocalDate }
    - { name: totalPaid, type: Double, note: "user-maintained" }
    - { name: createdAtMs, type: Long }
    - { name: updatedAtMs, type: Long }

notes:
  - "This is a tracker, not a live ledger — remaining/totalPaid reflect user-entered values, not a computed payment history."
  - "No auth, no backend, no remote sync. Forks can swap repository.upsert for a remote API with zero ViewModel changes."
  - "The 'Schedule' button on detail navigates to feature/amortization (B5) — a separate module, out of scope for this import."
