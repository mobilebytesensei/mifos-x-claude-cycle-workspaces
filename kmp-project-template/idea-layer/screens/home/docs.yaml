schema_version: '1.0'
contract_version: "2.0.0"   # backfilled to VERSION_MANIFEST#contract_versions.current (schema-contract migration, Phase 6 T3 — clears /idea approve BLOCK_LEGACY)
screen_id: home
feature_id: feat-home
archetype: dashboard
flow: flow-home-hub
title: Money Toolkit Home Dashboard
purpose: >-
  The app's main landing surface and one of the two bottom-nav tabs.
  A COMPOSITE dashboard that fans four independent reactive sources into one screen:
  a local loans snapshot (hero + carousel), upcoming bills (next 7 days), today's
  interest rates (Fed Funds + 30Y Mortgage from FRED), and a self-refreshing USD
  exchange tile (Frankfurter, 5-minute cadence) — plus a Tools grid of eight
  calculator/indicator tiles. Each card loads, errors, and retries independently;
  every tile is an outbound hop into its own feature module.
status: reverse-engineered
source_of_truth: source            # imported FROM shipped source, not FROM idea-layer
quality_score: 90
last_modified: '2026-08-01'
origin: "/idea-import — read-only reverse-engineering of the shipped feature/home module"

# ── Showcase note (why this feature exists in the Money Toolkit template) ──
showcase:
  name: "Home Dashboard — combineScreenStates 4-way fan-in"
  patterns_demonstrated:
    - "COMPOSITE / AGGREGATION archetype — HomeViewModel merges 4 sources into HomeUiState (4 independent ScreenState slots)"
    - "combineScreenStates helper — fedFunds + mortgage FRED streams → one RatesQuickView slot (Content iff BOTH Content)"
    - "Mixed store composition — 2 local reactive Room Flows (loans, bills) + 2 Store5 NETWORK_WITH_CACHE streams (rates, exchange)"
    - "FetchPolicy.PERIODIC(300_000) — the ambient auto-refresh archetype on the exchange-rate tile"
    - "Per-card FreshnessSignal — exchangeFreshness + ratesFreshness (worst-of-2 FreshnessBand) driving FreshnessIndicator"
    - "Bottom-nav shell that survives `customizer --clean` — HomeScreen Scaffold is framework-owned; the HomeDashboard demo body is strip-able"
    - "retainedKoinViewModel (koinNavViewModel) — the VM instance survives bottom-nav tab switches"
  note: >-
    Unlike feature/rates (B7) which keeps four INDEPENDENT rate rows, Home uses
    combineScreenStates to fuse only two FRED series into a single compact 'Today's
    Rates' card. Home requests a 30-day FRED window (fast first paint) versus the
    365-day full-screen window used by feature/rates.

# HomeScreen wraps HomeDashboard; there are no sub-routes. The composables:
screens_summary:
  - { id: home, composable: HomeScreen, wraps: HomeDashboard, viewmodel: HomeViewModel, states: "loading, content, empty, error" }

components:
  - center_aligned_top_app_bar
  - bottom_navigation_bar
  - hero_card
  - amount_display
  - lazy_row            # loans carousel
  - app_card
  - money_text
  - linear_progress_indicator
  - section_header
  - urgency_dot
  - rate_badge
  - freshness_indicator
  - feature_row         # tools grid tile
  - screen_content      # per-card Loading/Empty/Error slot host

user_stories:
  - "As a user, I want a single landing screen that shows what I owe, what's due this week, and where rates are — so I get the full picture at a glance."
  - "As a user, I want each dashboard card to load and fail on its own, so one flaky network source never blanks my whole home screen."
  - "As a user, I want the USD exchange tile to stay current on its own without me pulling to refresh."
  - "As a user, I want quick tiles to jump straight into the loan calculators, rate history, and macro indicators."

metrics:
  - "home_impressions / home_tab_selections"
  - "tile_taps_by_target (loans, bills, rates, currency, emi, affordability, amortization, compare, wizard, history, macro)"
  - "rates_card_retry_rate / exchange_card_retry_rate"
  - "exchange_periodic_refresh_success_rate"
  - "loans_hero_zero_state_rate (users with no loans)"

# The four upstream sources fanned into HomeUiState.
data_sources:
  - { slot: loans,        source: "LoanRepository.observeAll()",              kind: local_room,    table: banking_loans,           projection: "ScreenState<LoansSummary>" }
  - { slot: bills,        source: "BillReminderRepository.observeUpcoming(7)", kind: local_room,    table: banking_bill_reminders,  projection: "ScreenState<List<BillReminder>>" }
  - { slot: rates,        source: "EconomicRatesRepository.interestRateSeriesStream (DFF + MORTGAGE30US, 30d)", kind: "Store5 NETWORK_WITH_CACHE", remote: "FRED fred/series/observations", projection: "ScreenState<RatesQuickView> via combineScreenStates" }
  - { slot: exchangeRate, source: "CurrencyRepository.exchangeRatesStream(USD, PERIODIC 5-min)", kind: "Store5 NETWORK_WITH_CACHE", remote: "Frankfurter latest", projection: "ScreenState<ExchangeRates>" }

# Aggregate projections (co-located with HomeViewModel).
data_model:
  ui_state: HomeUiState
  slots:
    - { name: loans,        type: "ScreenState<LoansSummary>" }
    - { name: bills,        type: "ScreenState<List<BillReminder>>" }
    - { name: rates,        type: "ScreenState<RatesQuickView>" }
    - { name: exchangeRate, type: "ScreenState<ExchangeRates>" }
  projections:
    - { name: LoansSummary,  fields: "count: Int, totalMonthlyEmi: Double, totalOutstanding: Double, loans: List<Loan>" }
    - { name: RatesQuickView, fields: "fedFundsPercent: Double, mortgage30YPercent: Double" }
  actions:
    - { name: "HomeAction.RefreshAll",        effect: "refresh exchange + both FRED streams" }
    - { name: "HomeAction.RetryRates",        effect: "retry both FRED streams" }
    - { name: "HomeAction.RetryExchangeRate", effect: "retry the exchange stream" }
  constants:
    - { name: UPCOMING_BILLS_WINDOW_DAYS,       value: 7 }
    - { name: EXCHANGE_RATE_REFRESH_INTERVAL_MS, value: 300000 }
    - { name: STATE_TIMEOUT_MS,                 value: 5000 }

fred_setup_note: >-
  The Today's Rates card needs a free FRED developer key (same as feature/rates):
  Path A adds FRED_API_KEY to local.properties; Path B pulls the mifos_x_fred_api_key
  vault alias. Unset → the Rates card renders 'FRED_API_KEY is not configured' (an
  Error slot, not a crash) while the loans/bills/exchange cards still work. The
  Frankfurter exchange source needs no key.

notes:
  - "Home is the NavHost start destination and the Home bottom-nav tab; the other tab is Profile."
  - "Every tile/card action navigates OUTBOUND to a separate feature module (loans, bills, rates, currency, emi-calculator, affordability, amortization, loan-comparison, loan-calc-wizard, rate-history, country-macro) or app Settings — those features are out of scope for this import."
  - "HomeScreen (the Scaffold shell + settings action) is framework-owned and survives `customizer --clean`; the HomeDashboard demo body under kpt.feature.home.demo is deleted by --clean, leaving an empty shell for the fork to fill."
  - "The loans + bills slots are pure-local Room reads (always FRESH, no freshness surface); only the rates + exchange slots carry FreshnessIndicators and retry actions."
  - "Home requests a 30-day FRED window and only 2 of the 4 series feature/rates uses — the dashboard needs just the latest value per rate."
