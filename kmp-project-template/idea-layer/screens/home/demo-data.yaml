# demo-data.yaml — feature/home Money Toolkit dashboard demo data.
# The dashboard aggregates four upstream sources, so this file carries a sample
# for each of the four collections it reads. Shapes mirror the real domain models:
#   loans               → core/model/demo/banking/Loan.kt        (table banking_loans)
#   bill_reminders      → core/model/demo/banking/BillReminder.kt (table banking_bill_reminders)
#   interest_rate_series→ core/model/demo/economic/InterestRateSeries.kt (FRED, 2 series)
#   exchange_rates      → core/model/demo/currency/ExchangeRates.kt (Frankfurter, base USD)
# Values are realistic-but-illustrative, NOT live data. Loans reuse the same shape
# feature/loans demo data uses; rate/exchange samples are trimmed windows.
schema_version: "1.0"
screen_id: home

consumes:
  - { collection: loans,                dto: Loan,               table: banking_loans,           used_by: [observe-all-loans] }
  - { collection: bill_reminders,       dto: BillReminder,       table: banking_bill_reminders,  used_by: [observe-upcoming-bills] }
  - { collection: interest_rate_series, dto: InterestRateSeries, table: interest_rate_series,    used_by: [fred-series-observations] }
  - { collection: exchange_rates,       dto: ExchangeRates,      table: exchange_rates,          used_by: [frankfurter-latest] }

samples:
  # ── loans slot — LoansSummary aggregates: totalOutstanding, totalMonthlyEmi, count ──
  loans:
    - id: loan-home-01
      name: "Home Mortgage"
      kind: MORTGAGE
      principal: 320000.00
      principalRemaining: 268400.00
      annualRatePercent: 6.5
      tenureMonths: 360
      monthsRemaining: 312
      monthlyPayment: 2022.62
      nextDueDate: "2026-08-01"
      totalPaid: 97085.76
      createdAtMs: 1735689600000
      updatedAtMs: 1750000000000
    - id: loan-auto-01
      name: "Auto Loan — Sedan"
      kind: AUTO
      principal: 28000.00
      principalRemaining: 15400.00
      annualRatePercent: 5.9
      tenureMonths: 60
      monthsRemaining: 33
      monthlyPayment: 539.86
      nextDueDate: "2026-08-05"
      totalPaid: 14576.22
      createdAtMs: 1717200000000
      updatedAtMs: 1749000000000
    - id: loan-personal-01
      name: "Personal Loan"
      kind: PERSONAL
      principal: 12000.00
      principalRemaining: 4800.00
      annualRatePercent: 11.0
      tenureMonths: 36
      monthsRemaining: 14
      monthlyPayment: 392.86
      nextDueDate: "2026-09-01"
      totalPaid: 8637.96
      createdAtMs: 1720000000000
      updatedAtMs: 1749500000000
    # Hero aggregates for these 3 rows:
    #   totalOutstanding = 288600.00 ; totalMonthlyEmi = 2955.34 ; count = 3

  # ── bills slot — observeUpcoming(7): enabled reminders due within 7 days ──
  bill_reminders:
    - id: bill-electric-01
      name: "Electricity Bill"
      amount: 118.40
      dueDay: 2
      recurrence: MONTHLY
      category: UTILITIES
      enabled: true
      reminderDaysBefore: 1
      createdAtMs: 1735689600000
      updatedAtMs: 1750000000000
    - id: bill-netflix-01
      name: "Netflix"
      amount: 15.99
      dueDay: 4
      recurrence: MONTHLY
      category: SUBSCRIPTIONS
      enabled: true
      reminderDaysBefore: 1
      createdAtMs: 1735689600000
      updatedAtMs: 1750000000000
    - id: bill-rent-01
      name: "Apartment Rent"
      amount: 1650.00
      dueDay: 5
      recurrence: MONTHLY
      category: HOUSING
      enabled: true
      reminderDaysBefore: 2
      createdAtMs: 1735689600000
      updatedAtMs: 1750000000000
    # Card total (next 7d) for these 3 rows: 1784.39

  # ── rates slot — the two headline FRED series (30-day window, card reads .current) ──
  interest_rate_series:
    - seriesId: DFF
      name: "Federal Funds Rate"
      unit: "%"
      source: "FRED"
      current: 5.33
      observations:
        - { date: "2026-06-19", value: 5.33 }
        - { date: "2026-06-26", value: 5.33 }
        - { date: "2026-07-03", value: 5.33 }
        - { date: "2026-07-10", value: 5.33 }
        - { date: "2026-07-17", value: 5.33 }
    - seriesId: MORTGAGE30US
      name: "30-Year Mortgage"
      unit: "%"
      source: "FRED"
      current: 7.12
      observations:
        - { date: "2026-06-19", value: 7.05 }
        - { date: "2026-06-26", value: 7.08 }
        - { date: "2026-07-03", value: 7.10 }
        - { date: "2026-07-10", value: 7.07 }
        - { date: "2026-07-17", value: 7.12 }

  # ── exchangeRate slot — Frankfurter latest, base USD (card shows EUR/GBP/INR) ──
  exchange_rates:
    - base: "USD"
      date: "2026-07-17"
      rates:
        EUR: 0.9210
        GBP: 0.7840
        INR: 83.2100
        JPY: 157.4200
        CAD: 1.3650
        AUD: 1.5030
