# flow.yaml — feature/home navigation flow (Money Toolkit home dashboard).
# Home is the landing surface AND the start destination of the bottom-nav graph
# (2 tabs: Home + Profile). Grounded in HomeDestination.kt (homeGraph,
# startDestination = HomeRoute) + cmp-navigation/authenticatednavbar/
# AuthenticatedNavbarNavigationScreen.kt (NavHost startDestination = HomeDestination).
#
# Home owns NO sub-screens — it is a single dashboard. Every tile/card is an
# OUTBOUND cross-feature navigation callback threaded from the app nav graph
# (12 callbacks total: onSettingsClick + 11 demo nav callbacks); those target
# features are separate modules and are NOT authored in this sibling set.
screen_id: home
feature_ref: feat-home
graph_route: HomeDestination
start_destination: HomeRoute
flow_groups: [flow-home-hub]
participates_in_flows: [flow-home-hub]

# The two bottom-nav tabs (from AuthenticatedNavBarTabItem).
bottom_nav_tabs:
  - { tab: HomeTab,    graph: HomeDestination,    start: HomeRoute,    screen: home,    active_default: true }
  - { tab: ProfileTab, graph: ProfileDestination, start: ProfileRoute, screen: profile, active_default: false }   # cross-feature (feature/profile)

entry_points:
  - id: nav-host-landing
    description: "The NavHost opens with HomeDestination as its start destination — home is the first screen."
    trigger: app_launch
  - id: bottom-nav-home-tap
    description: "Tapping the Home tab (re-selects / pops to the home start destination)."
    trigger: home_tab_tap
  - id: back-from-tile-feature
    description: "Returning to home after popping any tile-launched feature (loans, rates, calculators, …)."
    trigger: navigate_back

# Single node — home has no internal sub-routes.
nodes:
  - { id: home, route: HomeRoute, screen: HomeScreen, wraps: HomeDashboard }

inbound_routes:
  - from: nav-host
    to: home
    trigger: app_launch
    label: "NavHost start destination → Home dashboard"
    flow: flow-home-hub
  - from: profile
    to: home
    trigger: home_tab_tap
    label: "Bottom-nav Home tab → Home dashboard"
    flow: flow-home-hub

# Every outbound route is a cross-feature callback (separate module). Targets are
# grounded in the homeGraph(...) callback parameters + the app wiring.
outbound_routes:
  # ── Shell: settings action (top-bar) ──
  - from: home
    to: settings                     # onSettingsClick — app Settings (framework shell, survives customizer --clean)
    action: navigate
    trigger: settings_icon_tap
    label: "Settings icon → app Settings"
    flow: ad-hoc

  # ── Hero / loans slot ──
  - from: home
    to: loans                        # onNavigateToLoans (feature/loans, B1)
    action: navigate
    trigger: loan_tile_tap
    label: "Loan carousel tile / hero → Personal Loans list"
    flow: flow-home-hub

  # ── This-week cards ──
  - from: home
    to: bills                        # onNavigateToBills (feature/bills, B4)
    action: navigate
    trigger: bills_see_all_tap
    label: "Upcoming Bills 'See all' → Bill Reminders"
    flow: flow-home-hub
  - from: home
    to: rates                        # onNavigateToRates (feature/rates, B7)
    action: navigate
    trigger: rates_see_all_tap
    label: "Today's Rates 'See all' → Interest Rate Tracker"
    flow: flow-home-hub
  - from: home
    to: currency-rates               # onNavigateToExchangeRates (feature/currency, B6)
    action: navigate
    trigger: exchange_see_all_or_currency_tile_tap
    label: "USD Exchange 'See all' / Currency Rates tile → Currency Rates"
    flow: flow-home-hub

  # ── Tools grid (8 tiles) ──
  - from: home
    to: emi-calculator               # onNavigateToEmi (feature/emi-calculator)
    action: navigate
    trigger: emi_tile_tap
    label: "EMI Calculator tile → EMI Calculator"
    flow: flow-home-hub
  - from: home
    to: affordability                # onNavigateToAffordability
    action: navigate
    trigger: affordability_tile_tap
    label: "Affordability tile → Affordability calculator"
    flow: flow-home-hub
  - from: home
    to: amortization                 # onNavigateToAmortization (B5)
    action: navigate
    trigger: amortization_tile_tap
    label: "Amortization tile → Amortization schedule"
    flow: flow-home-hub
  - from: home
    to: loan-comparison              # onNavigateToLoanComparison
    action: navigate
    trigger: compare_tile_tap
    label: "Compare Loans tile → Loan comparison"
    flow: flow-home-hub
  - from: home
    to: loan-calc-wizard             # onNavigateToLoanCalcWizard
    action: navigate
    trigger: wizard_tile_tap
    label: "Loan Wizard tile → Loan calculator wizard"
    flow: flow-home-hub
  - from: home
    to: rate-history                 # onNavigateToRateHistory
    action: navigate
    trigger: history_tile_tap
    label: "Rate History tile → Historical FX charts"
    flow: flow-home-hub
  - from: home
    to: country-macro                # onNavigateToMacro (B8)
    action: navigate
    trigger: macro_tile_tap
    label: "Country Macro tile → World Bank macro indicators"
    flow: flow-home-hub

# In-screen actions that do NOT navigate (re-run the network fetches for the
# two remote slots; loans/bills are local reactive Flows — nothing to refresh).
in_screen_actions:
  - { screen: home, action: RefreshAll,        trigger: "pull-to-refresh", effect: "re-fetch exchange + both FRED rate series" }
  - { screen: home, action: RetryRates,        trigger: "Rates card freshness-indicator tap", effect: "re-fetch DFF + MORTGAGE30US" }
  - { screen: home, action: RetryExchangeRate, trigger: "Exchange card freshness-indicator tap", effect: "re-fetch USD-base Frankfurter rates" }
