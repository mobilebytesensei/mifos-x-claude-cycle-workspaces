# ─────────────────────────────────────────────────
# INTENTIONALLY EMPTY — dev-only, pure-UI showcase feature.
#
# feature/showcase is a developer-facing reference surface (a component & pattern
# gallery). It has NO ViewModel, NO Store, NO repository, NO Ktor client, NO
# Supabase, and NO network calls. Both galleries are stateless @Composable
# functions that render literal, hard-coded demo instances of design-system
# state primitives and navigation transition factories. There are therefore
# zero API operations to declare.
#
# Any future non-empty api[] here would be a reverse-engineering error — the
# source imports no service/repository and the screens take no data-bearing
# parameters (only navigation callbacks).
# ─────────────────────────────────────────────────
api: []
