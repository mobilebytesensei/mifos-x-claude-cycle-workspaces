schema_version: "1.0"
screen_id: state-gallery
feature_id: feat-showcase
archetype: pure-ui
surface: dev-only
flow: flow-dev-showcase
title: Showcase — Component & Transition Gallery (dev)
purpose: >-
  A developer-facing, on-device reference gallery bundled with the
  kmp-project-template. It is a living visual smoke test for two things the
  template ships: (1) the design-system state UI — every ScreenState variant plus
  the component-scale state primitives and full-screen defaults — and (2) the
  navigation transition factories. It has no product value for end users; it exists
  so engineers (and forks) can eyeball the reference surfaces without writing a
  throwaway harness.
status: implemented
store_pattern: none
quality_score: 88
last_modified: "2026-07-25"

dev_only_note: >-
  This feature is DEV-ONLY and is expected to be removed by forks. Its entry
  points (onStateGalleryClick / onTransitionGalleryClick in AuthenticatedNavigation)
  are computed as `if (!isReleaseBuild()) { navigate(...) } else null`, so release
  builds never surface it and the SettingsScreen dev menu hides the entries. The
  whole `feature/showcase` module, its two graphs in AuthenticatedNavigation, and
  the `include(":feature:showcase")` in settings.gradle.kts can be deleted cleanly
  by a fork that doesn't want the reference gallery — nothing in the product feature
  tree depends on it (only cmp-navigation references it, behind demo:begin/demo:end
  markers).

showcase_note: >-
  Sits one rung below emi-calculator on the state-complexity spectrum. Where
  emi-calculator is the canonical "local state, NO Store" archetype, showcase is
  the "NO state at all" archetype: both galleries are stateless @Composable
  functions with no ViewModel, no State/Event/Action, and only navigation
  callbacks. Every demo instance is literal in-source. Forks and new contributors
  read this feature to see what the design-system state UI and navigation
  transitions actually look like rendered.

what_it_showcases:
  state_gallery:
    - "ScreenState.Loading / Empty / Error / NoNetwork / Content — via CardStateBox<String>"
    - "InlineErrorPill (with and without retry)"
    - "ErrorChip"
    - "RowLoadingShimmer (3 rows in a divided Card)"
    - "CardLoadingSkeleton"
    - "Full-screen defaults: LocalScreenStateDefaults.empty, DefaultErrorContent, DefaultNoNetworkContent (captive-portal and plain-offline variants)"
  transition_gallery:
    - "All 9 TransitionVariant factories: SharedAxisForward, SharedAxisBack, FadeThrough, PushLeft, PushRight, SlideUp, SlideDown, Stay, None"
    - "Each tapped variant pushes a TransitionDemoScreen using that transition, which auto-pops after 2s so the animation (and any blink / duration-asymmetry) can be observed"

user_stories:
  - "As an engineer, I want a single scroll that renders every ScreenState and component-scale state primitive, so I can visually verify the design-system state UI without building a harness."
  - "As an engineer, I want to tap each navigation transition and watch it run on-device, so I can check for blinks and duration symmetry (SharedAxisSpec / TransitionPushSpec)."
  - "As a fork maintainer, I want the gallery cleanly gated to non-release builds and deletable, so it never ships to end users."

success_metrics:
  - "Both gallery scaffolds render (asserted by StateGalleryScreenUiTest + TransitionGalleryScreenUiTest)"
  - "Zero presence in release builds (entry points null when isReleaseBuild())"
  - "No dependency from any product feature — removable by deleting the module + its two graphs"

components:
  - top_app_bar
  - card
  - button
  - text
  - lazy_column
  # demonstrated (not owned): InlineErrorPill, ErrorChip, CardLoadingSkeleton,
  # RowLoadingShimmer, CardStateBox, DefaultErrorContent, DefaultNoNetworkContent

non_functional:
  - "Pure commonMain — no platform-specific code, no permissions, no secrets"
  - "Dev-only: gated on !isReleaseBuild(); stripped from release builds"
  - "i18n: engineer-facing copy routed through compose-resources string keys (screens_showcase_*) to satisfy RULE-IMPL-NO-HARDCODED-STRING-001, though strings stay English for diagnostics"
  - "Accessibility: back buttons carry contentDescription/aria_label"

data_requirements: []   # none — dev-only, pure-UI, no DTOs, no tables, no cache

dependencies:
  tier: leaf
  upstream_features: []          # entered from Settings dev menu; depends on no product feature's data
  core_modules_used:
    - "core/designsystem (component/state: InlineErrorPill, ErrorChip, CardLoadingSkeleton, RowLoadingShimmer, CardStateBox; theme spacing + KptTheme)"
    - "core-base/ui (screen: DefaultErrorContent, DefaultNoNetworkContent, LocalScreenStateDefaults; nav: composableWithPushTransitions, SharedAxisSpec, TransitionPushSpec, popBackStackSafely)"
    - "core-base/store (screen: ScreenState sealed hierarchy)"
    - "core/ui (scaffold: KptScaffold)"
  consumed_by:
    - "cmp-navigation (AuthenticatedNavigation — behind demo:begin/demo:end, gated on !isReleaseBuild())"
