<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: {
  fontFamily: { display: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
  colors: {
    primary: '#6C63FF', 'on-primary': '#FFFFFF', 'primary-container': '#E8E6FF',
    secondary: '#625B71', tertiary: '#7D5260',
    surface: '#FFFBFE', 'on-surface': '#1C1B1F',
    'surface-variant': '#E7E0EC', background: '#FFFBFE',
    error: '#BA1A1A', outline: '#79747E', success: '#146C2E',
  }
}}};
</script>
<style>
:root {
  --primary: #6C63FF; --on-primary: #FFFFFF;
  --bg: #FFFFFF; --surface: #FFFBFE; --surface-variant: #F3F0F7;
  --text: #1C1B1F; --text-secondary: #49454F; --text-tertiary: #79747E;
  --border: #E7E0EC; --error: #BA1A1A; --success: #146C2E;
}
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
.phone { width: 393px; min-height: 852px; border-radius: 2.5rem; overflow: hidden; position: relative; }
.tag-badge { display: none; position: absolute; top: -4px; right: -4px; padding: 1px 5px; border-radius: 4px; background: rgba(234,88,12,.9); color: white; font-size: 8px; font-weight: 700; font-family: monospace; z-index: 15; pointer-events: none; }
.show-tags .tag-badge { display: block; }
body.embedded { background: var(--bg); margin: 0; padding: 0; min-height: 100vh; display: block; }
body.embedded #standalone-toolbar { display: none !important; }
body.embedded #phone-wrapper { display: none !important; }
body.embedded #embedded-content { display: flex !important; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; background: var(--bg); }
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e6e3ee 50%, #f0f0f0 75%); background-size: 800px 100%; animation: shimmer 1.5s infinite; border-radius: 10px; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span id="screenTitle" class="text-sm font-semibold text-slate-200 flex-1">Loading...</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none"></select>
  <button onclick="toggleTags()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">Tags</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-white shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-white">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-slate-900">wifi</span>
        <span class="material-symbols-outlined text-sm text-slate-900">battery_full</span>
      </div>
    </div>
    <div id="top-bar"></div>
    <div id="screen-content" class="overflow-y-auto bg-white" style="height:700px"></div>
    <div id="bottom-nav"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900 rounded-full"></div></div>
    <div id="fab-container" class="absolute bottom-24 right-4"></div>
  </div>
</div>

<div id="embedded-content" style="display:none">
  <div id="embedded-status-bar" class="flex items-center justify-between px-6 py-2 bg-white shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-slate-900">wifi</span>
      <span class="material-symbols-outlined text-sm text-slate-900">battery_full</span>
    </div>
  </div>
  <div id="embedded-top-bar" class="shrink-0"></div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-white flex-1"></div>
  <div id="embedded-bottom-nav" class="shrink-0"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  <div id="embedded-fab" class="fixed bottom-24 right-4"></div>
</div>

<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   SCREEN_DATA — inline, self-contained (NO fetch; file:// safe).
   Injected per-feature. See CONTRACT.md for the normalized schema.
   ══════════════════════════════════════════════════════════════════════════ */
var SCREEN_DATA = {
  id:'state-gallery', name:'Showcase (dev)', feature:'feat-showcase', status:'implemented', initial_state:'state-gallery',
  top_bar:{ enabled:true, title:'State Gallery (dev)', back:true },
  states:{
    'state-gallery':{ name:'State Gallery', top_bar:{ enabled:true, title:'State Gallery (dev)', back:true }, components:[
      { type:'text', variant:'body_medium', content:'A living, on-device catalogue of every design-system state surface — eyeball each variant in one scroll.' },
      { type:'section', title:'Component-scale primitives' },
      { type:'labeled_demo', label:'InlineErrorPill (no retry)', demo:'InlineErrorPill(message = "Couldn\'t refresh balance")' },
      { type:'labeled_demo', label:'InlineErrorPill (with retry)', demo:'InlineErrorPill(message = "Network error", onRetry = {})' },
      { type:'labeled_demo', label:'ErrorChip', demo:'ErrorChip(message = "Failed to load", onClick = {})' },
      { type:'section', title:'RowLoadingShimmer' },
      { type:'card', variant:'app', children:[ { type:'shimmer', count:3 } ] },
      { type:'section', title:'CardLoadingSkeleton' },
      { type:'shimmer', count:1 },
      { type:'section', title:'CardStateBox — every variant' },
      { type:'state_demo', label:'ScreenState.Loading', state:'loading' },
      { type:'state_demo', label:'ScreenState.Empty', state:'empty', body:'No data' },
      { type:'state_demo', label:'ScreenState.Error', state:'error', body:'balance fetch failed' },
      { type:'state_demo', label:'ScreenState.NoNetwork', state:'nonet', body:'No connection' },
      { type:'state_demo', label:'ScreenState.Content', state:'content', body:'Account: $1,234.56' },
      { type:'section', title:'Full-screen state defaults (compact preview)' },
      { type:'labeled_demo', label:'Empty default', demo:'LocalScreenStateDefaults.current.empty (title + message)' },
      { type:'labeled_demo', label:'Error default', demo:'DefaultErrorContent(RuntimeException("Demo error: server unreachable"), onRetry = {})' },
      { type:'labeled_demo', label:'NoNetwork (captive portal)', demo:'DefaultNoNetworkContent(onRetry = {}, isCaptivePortal = true)' },
      { type:'labeled_demo', label:'NoNetwork (offline)', demo:'DefaultNoNetworkContent(onRetry = {}, isCaptivePortal = false)' }
    ]},
    'transition-gallery':{ name:'Transition Gallery', top_bar:{ enabled:true, title:'Transition Gallery (dev)', back:true }, components:[
      { type:'text', variant:'body_medium', content:'Tap a transition to push a demo screen using that factory — it auto-pops after 2s so you can watch the animation.' },
      { type:'button', variant:'outlined', label:'Shared-axis push forward', stateTarget:'transition-demo' },
      { type:'button', variant:'outlined', label:'Shared-axis pop back', stateTarget:'transition-demo' },
      { type:'button', variant:'outlined', label:'Fade-through (siblings)', stateTarget:'transition-demo' },
      { type:'button', variant:'outlined', label:'Push left (enter+exit)', stateTarget:'transition-demo' },
      { type:'button', variant:'outlined', label:'Push right (enter+exit)', stateTarget:'transition-demo' },
      { type:'button', variant:'outlined', label:'Slide up', stateTarget:'transition-demo' },
      { type:'button', variant:'outlined', label:'Slide down', stateTarget:'transition-demo' },
      { type:'button', variant:'outlined', label:'Stay (no-op)', stateTarget:'transition-demo' },
      { type:'button', variant:'outlined', label:'None', stateTarget:'transition-demo' }
    ]},
    'transition-demo':{ name:'Transition Demo', top_bar:{ enabled:true, title:'Transition Demo', back:true }, components:[
      { type:'stack', direction:'column', align:'center', justify:'center', children:[
        { type:'spacer', height:120 },
        { type:'text', variant:'title_medium', content:'Demo: Slide up', align:'center' },
        { type:'text', variant:'body_medium', content:'(auto-pops in 2s)', align:'center', color:'on_surface_variant' }
      ]}
    ]}
  }
};

/* ══ ENV ══ */
var urlParams = new URLSearchParams(location.search);
var isEmbedded = (window !== window.top) || urlParams.has('embedded');
var currentState = null, showTags = false;
if (isEmbedded) {
  document.body.classList.remove('bg-[#0F0F23]', 'min-h-screen', 'flex', 'flex-col');
  document.body.classList.add('embedded');
}
function contentEl()  { return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content'); }
function topBarEl()   { return isEmbedded ? document.getElementById('embedded-top-bar') : document.getElementById('top-bar'); }
function bottomNavEl(){ return isEmbedded ? document.getElementById('embedded-bottom-nav') : document.getElementById('bottom-nav'); }
function fabEl()      { return isEmbedded ? document.getElementById('embedded-fab') : document.getElementById('fab-container'); }

/* ══ ICON MAP — Material Symbol names for every icon a sibling uses ══ */
var ICON_MAP = {
  home:'home', person:'person', profile:'person', profile_boarder:'person', account_circle:'account_circle',
  settings:'settings', sun:'light_mode', language:'language', arrow_back:'arrow_back', arrow_right:'chevron_right',
  add:'add', calculate:'calculate', savings:'savings', trending_up:'trending_up', compare:'compare_arrows',
  tune:'tune', currency_exchange:'currency_exchange', receipt_long:'receipt_long', public:'public',
  notifications_active:'notifications_active', outlined_notifications:'notifications', check_circle:'check_circle',
  error_outline:'error_outline', refresh:'refresh', chevron_right:'chevron_right', calendar_today:'calendar_today'
};
function icon(name, cls) { var m = ICON_MAP[name] || name || 'circle'; return '<span class="material-symbols-outlined ' + (cls||'') + '">' + m + '</span>'; }

/* ══ RENDER ══ */
function renderComponent(c) {
  if (!c) return '';
  if (typeof c === 'string') return '<div class="px-5 py-1 text-sm text-slate-600">' + c + '</div>';
  var tag = c.tag ? '<span class="tag-badge">' + c.tag + '</span>' : '';
  var kids = (c.children || []).map(renderComponent).join('');
  switch (c.type) {
    case 'stack': {
      var dir = c.direction === 'row' ? 'flex-row' : 'flex-col';
      var al  = c.align === 'center' ? 'items-center' : c.align === 'end' ? 'items-end' : '';
      var ju  = c.justify === 'center' ? 'justify-center' : c.justify === 'space_between' ? 'justify-between' : c.justify === 'end' ? 'justify-end' : '';
      var gap = c.gap === 'sm' ? 'gap-2' : c.gap === 'lg' ? 'gap-5' : 'gap-3';
      var pad = c.pad === false ? '' : 'p-4';
      return '<div class="relative flex ' + dir + ' ' + al + ' ' + ju + ' ' + gap + ' ' + pad + '">' + tag + kids + '</div>';
    }
    case 'row': {
      var ju = c.justify === 'space_between' ? 'justify-between' : c.justify === 'center' ? 'justify-center' : c.justify === 'end' ? 'justify-end' : 'justify-start';
      var hl = c.highlight ? ' bg-primary/5 rounded-lg px-2' : '';
      return '<div class="relative flex items-center ' + ju + ' gap-3 py-1' + hl + '">' + tag + (c.children||[]).map(renderComponent).join('') + '</div>';
    }
    case 'card': {
      var hero = c.variant === 'hero' || c.variant === 'hero_card';
      var accent = c.accent ? ' style="border-left:4px solid ' + c.accent + '"' : '';
      var base = hero
        ? 'relative mx-4 my-2 rounded-2xl p-5 text-white shadow-lg" style="background:linear-gradient(135deg,var(--primary),#8B7CFF)'
        : 'relative mx-4 my-2 rounded-2xl bg-white border border-slate-200 shadow-sm p-4';
      var click = c.target ? ' onclick="navigateTo(\'' + c.target + '\')" role="button"' : (c.stateTarget ? ' onclick="switchState(\'' + c.stateTarget + '\')" role="button"' : '');
      var head = '';
      if (c.title || c.icon || c.trailingIcon) {
        head = '<div class="flex items-center gap-2 ' + (hero ? '' : 'mb-2') + '">' +
          (c.leadingIcon ? icon(c.leadingIcon, 'text-primary') : (c.icon ? icon(c.icon, hero ? 'text-white/80' : 'text-primary') : '')) +
          (c.title ? '<span class="flex-1 font-semibold ' + (hero ? 'text-white' : 'text-slate-900') + '">' + c.title + '</span>' : '<span class="flex-1"></span>') +
          (c.trailingIcon ? icon(c.trailingIcon, hero ? 'text-white/70' : 'text-slate-400') : '') + '</div>';
      }
      var see = c.seeAll ? '<div class="mt-2 text-right"><span class="text-sm text-primary font-medium cursor-pointer" onclick="navigateTo(\'' + c.seeAll.target + '\')">' + (c.seeAll.label || 'See all') + '</span></div>' : '';
      var empty = c.empty ? '<p class="text-sm ' + (hero ? 'text-white/80' : 'text-slate-400') + '">' + c.empty + '</p>' : '';
      var inner = '<div class="' + base + '"' + accent.replace(' style="border-left','; border-left').replace(/^ /,'') + click + '>' + tag + head +
        '<div class="' + (hero ? 'text-white' : 'text-slate-700') + '">' + kids + empty + '</div>' + see + '</div>';
      // fix accent+hero style merge
      if (c.accent && !hero) inner = '<div class="relative mx-4 my-2 rounded-2xl bg-white border border-slate-200 shadow-sm p-4" style="border-left:4px solid ' + c.accent + '"' + click + '>' + tag + head + '<div class="text-slate-700">' + kids + empty + '</div>' + see + '</div>';
      return inner;
    }
    case 'text': {
      var styles = {
        headline:'text-2xl font-bold', title_large:'text-xl font-bold', title_medium:'text-lg font-semibold', title:'text-lg font-semibold',
        body_large:'text-base', body_medium:'text-sm', body:'text-sm', body_small:'text-xs',
        label_medium:'text-xs font-medium', label:'text-sm font-medium', caption:'text-xs'
      };
      var cls = styles[c.variant] || styles.body_medium;
      var col = c.onCard ? 'text-white/90'
        : c.color === 'on_surface_variant' ? 'text-slate-500'
        : c.color === 'error' ? 'text-error'
        : c.color === 'primary' ? 'text-primary'
        : c.emphasis === 'semibold' ? 'text-slate-900 font-semibold'
        : (c.variant && c.variant.indexOf('title') === 0) ? 'text-slate-900'
        : c.variant === 'headline' ? 'text-slate-900' : 'text-slate-600';
      if (c.onCard && c.color === 'error') col = 'text-red-200';
      var al = c.align === 'center' ? ' text-center block' : c.align === 'end' ? ' text-right block' : '';
      return '<div class="relative px-1 py-0.5">' + tag + '<span class="' + cls + ' ' + col + al + '">' + (c.content || '') + '</span></div>';
    }
    case 'amount': {
      var sup = (c.supporting || []).map(renderComponent).join('');
      return '<div class="relative">' + tag +
        '<div class="text-3xl font-bold ' + (c.onCard === false ? 'text-slate-900' : 'text-white') + '">' + (c.amount || '') + '</div>' +
        '<div class="text-sm ' + (c.onCard === false ? 'text-slate-500' : 'text-white/80') + ' mb-2">' + (c.label || '') + '</div>' +
        (sup ? '<div class="mt-3 pt-3 border-t ' + (c.onCard === false ? 'border-slate-200' : 'border-white/20') + ' flex flex-col gap-1">' + sup + '</div>' : '') + '</div>';
    }
    case 'hero_stat': {
      return '<div class="flex-1 text-center"><div class="text-lg font-bold text-white">' + (c.value || '') + '</div><div class="text-xs text-white/70">' + (c.label || '') + '</div></div>';
    }
    case 'section': {
      return '<div class="relative flex items-center justify-between px-5 pt-4 pb-1">' + tag +
        '<div><div class="text-base font-bold text-slate-900">' + (c.title || '') + '</div>' +
        (c.supporting ? '<div class="text-xs text-slate-400">' + c.supporting + '</div>' : '') + '</div></div>';
    }
    case 'feature_row': {
      return '<div class="relative mx-4 my-1 flex items-center gap-3 p-3 rounded-xl border border-slate-200 bg-white hover:border-primary/40 hover:bg-primary/5 cursor-pointer transition-all" onclick="navigateTo(\'' + (c.target || '') + '\')">' + tag +
        '<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center">' + icon(c.icon, 'text-primary') + '</div>' +
        '<div class="flex-1 min-w-0"><div class="text-sm font-semibold text-slate-900">' + (c.title || '') + '</div>' +
        (c.subtitle ? '<div class="text-xs text-slate-500 truncate">' + c.subtitle + '</div>' : '') + '</div>' +
        icon('chevron_right', 'text-slate-300') + '</div>';
    }
    case 'loan_row': {
      var pct = c.progress != null ? c.progress : 0;
      var click = c.target ? ' onclick="navigateTo(\'' + c.target + '\')"' : (c.stateTarget ? ' onclick="switchState(\'' + c.stateTarget + '\')"' : '');
      return '<div class="relative mx-4 my-2 rounded-2xl bg-white border border-slate-200 shadow-sm p-4 cursor-pointer hover:border-primary/40"' + click + '>' + tag +
        '<div class="flex items-center justify-between mb-1"><span class="font-semibold text-slate-900">' + (c.name || '') + '</span>' +
        '<span class="text-xs px-2 py-0.5 rounded-full bg-primary/10 text-primary font-medium">' + (c.kind || '') + '</span></div>' +
        '<div class="flex items-baseline justify-between"><span class="text-lg font-bold text-slate-900">' + (c.remaining || '') + '</span>' +
        '<span class="text-xs text-slate-400">remaining</span></div>' +
        '<div class="w-full h-1.5 bg-slate-100 rounded-full my-2"><div class="h-1.5 bg-primary rounded-full" style="width:' + Math.round(pct*100) + '%"></div></div>' +
        '<div class="flex items-center justify-between text-xs text-slate-500"><span>EMI ' + (c.emi || '') + '</span><span>Next due ' + (c.due || '') + '</span></div></div>';
    }
    case 'rate_row': {
      var arrow = c.direction === 'up' ? '<span class="material-symbols-outlined text-sm text-red-500">north_east</span>' : c.direction === 'down' ? '<span class="material-symbols-outlined text-sm text-green-600">south_east</span>' : '<span class="material-symbols-outlined text-sm text-slate-400">trending_flat</span>';
      return '<div class="relative flex items-center justify-between py-1.5">' + tag +
        '<span class="text-sm ' + (c.onCard === false ? 'text-slate-600' : 'text-white/80') + '">' + (c.label || '') + '</span>' +
        '<span class="flex items-center gap-1 font-semibold ' + (c.onCard === false ? 'text-slate-900' : 'text-white') + '">' + (c.value || '') + arrow + '</span></div>';
    }
    case 'rate_pair': {
      var darkP = c.onCard === false;
      return '<div class="relative flex flex-col gap-1.5">' + tag + (c.pairs || []).map(function(p){
        return '<div class="flex items-center justify-between py-1"><span class="text-sm ' + (darkP?'text-slate-500':'text-white/80') + '">' + p.label + '</span><span class="font-semibold ' + (darkP?'text-slate-900':'text-white') + '">' + p.value + '</span></div>';
      }).join('') + '</div>';
    }
    case 'freshness': {
      return '<div class="inline-flex items-center gap-1 text-xs ' + (c.onCard === false ? 'text-slate-400' : 'text-white/70') + '">' + icon('refresh','text-sm') + (c.label || 'Updated just now') + '</div>';
    }
    case 'metric': {
      return '<div class="flex-1 text-center"><div class="text-xs text-slate-400">' + (c.label || '') + '</div><div class="text-sm font-semibold text-slate-900">' + (c.value || '') + '</div></div>';
    }
    case 'metric_row': {
      return '<div class="relative flex items-center justify-between py-2 border-b border-slate-50 last:border-0">' + tag +
        '<span class="text-sm text-slate-500">' + (c.label || '') + '</span>' +
        '<span class="text-sm font-medium ' + (c.emphasis === 'error' ? 'text-error' : 'text-slate-900') + '">' + (c.value || '') + '</span></div>';
    }
    case 'progress': {
      var v = c.value != null ? c.value : 0;
      return '<div class="relative px-4 py-2">' + tag + (c.label ? '<div class="text-xs text-slate-500 mb-1">' + c.label + '</div>' : '') +
        '<div class="w-full h-1.5 bg-slate-200 rounded-full"><div class="h-1.5 bg-primary rounded-full transition-all" style="width:' + Math.round(v*100) + '%"></div></div></div>';
    }
    case 'button': {
      var v = c.variant || 'filled';
      var cls = v === 'outlined' ? 'border-2 border-primary text-primary bg-white'
        : v === 'text' ? 'text-primary bg-transparent'
        : v === 'tonal' ? 'bg-primary/10 text-primary'
        : 'text-white';
      var st = (v === 'filled' || v === 'primary') ? 'background:var(--primary);' : '';
      var dis = c.disabled ? ' opacity-40 pointer-events-none' : '';
      var click = c.target ? "navigateTo('" + c.target + "')" : c.stateTarget ? "switchState('" + c.stateTarget + "')" : "showToast('" + (c.label || '').replace(/'/g,"") + "')";
      return '<div class="relative px-4 py-1.5' + (c.inline ? ' inline-block' : '') + '">' + tag +
        '<button class="' + (c.inline ? '' : 'w-full') + ' py-3 px-5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 active:scale-[.98] transition ' + cls + dis + '" style="' + st + '" onclick="' + click + '">' +
        (c.icon ? icon(c.icon, 'text-lg') : '') + (c.label || '') + '</button></div>';
    }
    case 'field': {
      return '<div class="relative px-4 py-1.5">' + tag +
        '<label class="block text-xs font-medium text-slate-500 mb-1">' + (c.label || '') + '</label>' +
        '<div class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 bg-white flex items-center justify-between">' +
        '<span>' + (c.value != null && c.value !== '' ? c.value : '<span class="text-slate-400">' + (c.hint || '') + '</span>') + '</span>' +
        (c.suffix ? '<span class="text-slate-400 text-xs">' + c.suffix + '</span>' : '') + '</div></div>';
    }
    case 'dropdown': {
      return '<div class="relative px-4 py-1.5">' + tag +
        '<label class="block text-xs font-medium text-slate-500 mb-1">' + (c.label || '') + '</label>' +
        '<div class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 bg-white flex items-center justify-between">' +
        '<span>' + (c.value || '') + '</span>' + icon('expand_more','text-slate-400') + '</div></div>';
    }
    case 'radio_group': {
      var opts = (c.options || []).map(function(o){
        var sel = o.selected;
        return '<label class="flex items-center gap-3 py-2 cursor-pointer">' +
          '<span class="material-symbols-outlined ' + (sel ? 'text-primary' : 'text-slate-300') + '">' + (sel ? 'radio_button_checked' : 'radio_button_unchecked') + '</span>' +
          '<span class="text-sm ' + (sel ? 'text-slate-900 font-medium' : 'text-slate-600') + '">' + o.label + '</span></label>';
      }).join('');
      return '<div class="relative px-1 py-1">' + tag + (c.title ? '<div class="text-sm font-semibold text-slate-900 mb-1">' + c.title + '</div>' : '') + opts + '</div>';
    }
    case 'toggle': {
      var on = c.value !== false;
      return '<div class="relative flex items-center justify-between px-1 py-2">' + tag + '<span class="text-sm text-slate-700">' + (c.label || '') + '</span>' +
        '<div class="w-10 h-6 rounded-full ' + (on ? 'bg-primary/80' : 'bg-slate-300') + ' relative"><div class="absolute ' + (on ? 'right-0.5' : 'left-0.5') + ' top-0.5 w-5 h-5 rounded-full bg-white shadow"></div></div></div>';
    }
    case 'chip': {
      var intent = c.intent === 'success' ? 'bg-green-100 text-green-700' : c.intent === 'info' ? 'bg-primary/10 text-primary' : 'bg-slate-100 text-slate-600';
      return '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium ' + intent + '">' + (c.label || '') + '</span>';
    }
    case 'icon': {
      var sz = c.size ? 'font-size:' + c.size + 'px;' : '';
      return '<div class="relative flex ' + (c.center !== false ? 'justify-center' : '') + ' py-1">' + tag + '<span class="material-symbols-outlined ' + (c.onCard ? 'text-white' : 'text-primary') + '" style="' + sz + '">' + (ICON_MAP[c.icon] || c.icon) + '</span></div>';
    }
    case 'divider': return '<div class="h-px bg-slate-100 mx-4 my-1"></div>';
    case 'spacer': return '<div style="height:' + (c.height || 16) + 'px"></div>';
    case 'shimmer': {
      var n = c.count || 3;
      var one = c.variant === 'hero' ? '<div class="shimmer h-28 mx-4 my-2 rounded-2xl"></div>' : '<div class="shimmer h-20 mx-4 my-2 rounded-2xl"></div>';
      return tag + Array(n).fill(one).join('');
    }
    case 'error': {
      return '<div class="relative flex flex-col items-center text-center px-6 py-8 gap-2">' + tag +
        icon('error_outline', 'text-4xl text-error') +
        '<p class="text-base font-semibold text-slate-900">' + (c.title || "Couldn't load") + '</p>' +
        '<p class="text-sm text-slate-500">' + (c.body || '') + '</p>' +
        (c.retry ? '<button class="mt-2 px-4 py-2 rounded-xl border-2 border-primary text-primary text-sm font-semibold" onclick="showToast(\'Retrying…\')">' + icon('refresh','text-base align-middle mr-1') + 'Retry</button>' : '') + '</div>';
    }
    case 'empty_state': {
      return '<div class="relative flex flex-col items-center text-center px-6 py-10 gap-2">' + tag +
        icon(c.icon || 'inbox', 'text-4xl text-slate-300') +
        '<p class="text-base font-semibold text-slate-900">' + (c.title || 'Nothing here yet') + '</p>' +
        '<p class="text-sm text-slate-500">' + (c.body || '') + '</p></div>';
    }
    case 'table': {
      var cols = c.columns || [];
      var head = '<div class="flex items-center bg-slate-50 px-4 py-2 border-b border-slate-200">' + cols.map(function(col,i){
        return '<div class="text-xs font-semibold text-slate-500 ' + (i===0?'text-left w-10':'flex-1 text-right') + '">' + col + '</div>';
      }).join('') + '</div>';
      var rows = (c.rows || []).map(function(r,ri){
        return '<div class="flex items-center px-4 py-1.5 ' + (ri%2?'bg-slate-50/50':'') + ' border-b border-slate-50">' + r.map(function(cell,i){
          return '<div class="text-xs ' + (i===0?'text-slate-400 w-10':'flex-1 text-right text-slate-700') + '">' + cell + '</div>';
        }).join('') + '</div>';
      }).join('');
      var more = c.moreNote ? '<div class="px-4 py-2 text-center text-xs text-slate-400">' + c.moreNote + '</div>' : '';
      var sum = '';
      if (c.summary) {
        sum = '<div class="mx-4 mt-3 mb-2 p-3 rounded-xl bg-primary/5"><div class="text-sm font-bold text-slate-900 mb-1">' + (c.summary.title || 'Summary') + '</div>' +
          (c.summary.lines || []).map(function(l){ return '<div class="flex justify-between text-sm py-0.5"><span class="text-slate-500">' + l.label + '</span><span class="font-medium ' + (l.emphasis==='error'?'text-error':'text-slate-900') + '">' + l.value + '</span></div>'; }).join('') + '</div>';
      }
      return '<div class="relative mx-2 my-2 rounded-2xl border border-slate-200 overflow-hidden bg-white">' + tag + head + rows + more + '</div>' + sum;
    }
    case 'labeled_demo': {
      return '<div class="relative px-2 py-1"><div class="text-xs font-medium text-slate-500 mb-1">' + (c.label || '') + '</div>' +
        '<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-3 font-mono text-xs text-slate-600">' + (c.demo || '') + '</div></div>';
    }
    case 'state_demo': {
      var m = { loading:'shimmer h-8 w-full rounded', empty:'text-slate-400 text-sm', error:'text-error text-sm', nonet:'text-amber-600 text-sm', content:'text-slate-900 text-sm font-medium' };
      var body = c.state === 'loading' ? '<div class="shimmer h-6 rounded"></div>' : '<span class="' + (m[c.state]||'') + '">' + (c.body || '') + '</span>';
      return '<div class="relative px-2 py-1"><div class="text-xs font-medium text-slate-500 mb-1">' + (c.label || '') + '</div><div class="rounded-xl border border-slate-200 bg-white px-3 py-3">' + body + '</div></div>';
    }
    case 'step_body': {
      return '<div class="relative mx-4 my-2 rounded-2xl border border-slate-200 bg-white p-4">' +
        '<div class="text-xs font-semibold text-primary mb-1">Step ' + (c.step || 1) + ' of ' + (c.total || 5) + '</div>' +
        '<div class="text-base font-semibold text-slate-900 mb-3">' + (c.prompt || '') + '</div>' + kids + '</div>';
    }
    case 'note': return '<div class="px-5 py-2 text-xs text-slate-400 italic">' + (c.content || '') + '</div>';
    default:
      return '<div class="relative px-5 py-2 border-b border-slate-50">' + tag + '<span class="text-xs text-slate-400">[' + (c.type||'?') + ']</span> <span class="text-sm text-slate-600">' + (c.title || c.label || c.content || '') + '</span>' + kids + '</div>';
  }
}

function renderComponents(list) {
  contentEl().innerHTML = '<div id="comp-wrap" class="' + (showTags ? 'show-tags' : '') + ' pb-6">' + (list || []).map(renderComponent).join('') + '</div>';
}

/* ══ TOP BAR / BOTTOM NAV / FAB ══ */
function renderTopBar() {
  var st = SCREEN_DATA.states[currentState] || {};
  var tb = st.top_bar || SCREEN_DATA.top_bar;
  if (!tb || tb.enabled === false) { topBarEl().innerHTML = ''; return; }
  var back = tb.back ? '<span class="material-symbols-outlined text-slate-700 cursor-pointer" onclick="showToast(\'Back\')">arrow_back</span>' : '';
  var actions = (tb.actions || []).map(function(a){ return '<span class="material-symbols-outlined text-slate-700 cursor-pointer" onclick="' + (a.target ? "navigateTo('"+a.target+"')" : "showToast('"+(a.label||'')+"')") + '">' + (ICON_MAP[a.icon]||a.icon) + '</span>'; }).join('');
  var center = tb.center ? 'text-center' : '';
  topBarEl().innerHTML = '<div class="flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-100">' + back +
    '<span class="flex-1 text-lg font-semibold text-slate-900 ' + center + '">' + (tb.title || '') + '</span>' +
    '<div class="flex gap-3">' + actions + '</div></div>';
}
function renderBottomNav() {
  var nav = SCREEN_DATA.bottom_nav;
  if (!nav || !nav.length) { bottomNavEl().innerHTML = ''; return; }
  bottomNavEl().innerHTML = '<div class="flex items-center justify-around py-2 bg-white border-t border-slate-100">' + nav.map(function(n){
    var active = n.active;
    return '<div class="flex flex-col items-center gap-0.5 cursor-pointer ' + (active ? 'text-primary' : 'text-slate-400') + '" onclick="navigateTo(\'' + n.target + '\')">' +
      icon(n.icon, 'text-xl') + '<span class="text-[10px] font-medium">' + n.label + '</span></div>';
  }).join('') + '</div>';
}
function renderFab() {
  var st = SCREEN_DATA.states[currentState] || {};
  var f = st.hasOwnProperty('fab') ? st.fab : SCREEN_DATA.fab;
  if (!f) { fabEl().innerHTML = ''; return; }
  var click = f.target ? "navigateTo('" + f.target + "')" : f.stateTarget ? "switchState('" + f.stateTarget + "')" : "showToast('" + (f.label||'') + "')";
  var ext = f.label ? '<span class="text-sm font-semibold pr-1">' + f.label + '</span>' : '';
  fabEl().innerHTML = '<button class="h-14 ' + (f.label?'px-5':'w-14') + ' rounded-2xl shadow-lg flex items-center justify-center gap-1 text-white active:scale-95 transition" style="background:var(--primary)" onclick="' + click + '">' + icon(f.icon || 'add') + ext + '</button>';
}

/* ══ STATE ══ */
function populateStates() {
  var p = document.getElementById('statePicker');
  if (!p) return;
  p.innerHTML = '';
  Object.keys(SCREEN_DATA.states).forEach(function(k){
    var o = document.createElement('option'); o.value = k; o.textContent = SCREEN_DATA.states[k].name || k; p.appendChild(o);
  });
}
function switchState(key) {
  if (!SCREEN_DATA.states[key]) key = SCREEN_DATA.initial_state || Object.keys(SCREEN_DATA.states)[0];
  currentState = key;
  var p = document.getElementById('statePicker'); if (p) p.value = key;
  renderTopBar(); renderFab();
  renderComponents(SCREEN_DATA.states[key].components || []);
  notifyParent();
}

/* ══ NAV / UTIL ══ */
function navigateTo(target) {
  if (!target) return;
  if (window !== window.top) window.parent.postMessage({ action: 'navigate', screenId: target }, '*');
  else location.href = target + '.html';
}
function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(function(){ t.remove(); }, 1800);
}
function toggleTags() { showTags = !showTags; var w = document.getElementById('comp-wrap'); if (w) w.classList.toggle('show-tags', showTags); }

/* ══ PARENT BRIDGE ══ */
function notifyParent() {
  if (window === window.top || !SCREEN_DATA) return;
  var stObjs = Object.keys(SCREEN_DATA.states).map(function(k){ return { id: k, name: SCREEN_DATA.states[k].name || k }; });
  window.parent.postMessage({
    action: 'screenLoaded', screenId: SCREEN_DATA.id, name: SCREEN_DATA.name,
    feature: SCREEN_DATA.feature || '', status: SCREEN_DATA.status || 'implemented',
    states: stObjs, currentState: currentState,
    inspectorData: { id: SCREEN_DATA.id, name: SCREEN_DATA.name, feature: SCREEN_DATA.feature || '', states: SCREEN_DATA.states }
  }, '*');
}
window.addEventListener('message', function(e){
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.action === 'switchState') switchState(e.data.stateId || e.data.state || '');
  if (e.data.action === 'toggleTags') { showTags = !!e.data.show; var w = document.getElementById('comp-wrap'); if (w) w.classList.toggle('show-tags', showTags); }
  if (e.data.action === 'getInspectorData') notifyParent();
});

/* ══ BOOT ══ */
function boot() {
  document.title = (SCREEN_DATA.name || SCREEN_DATA.id) + ' — Prototype';
  var t = document.getElementById('screenTitle'); if (t) t.textContent = SCREEN_DATA.name || SCREEN_DATA.id;
  if (urlParams.get('showTags') === 'true') showTags = true;
  renderTopBar(); renderBottomNav(); renderFab();
  populateStates();
  switchState(urlParams.get('state') || SCREEN_DATA.initial_state || Object.keys(SCREEN_DATA.states)[0]);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
