schema_version: "1.0"
# ─────────────────────────────────────────────────────────────────────────────
# feature/showcase — DEV-ONLY component & pattern gallery (reverse-engineered).
#
# The kmp-project-template doubles as a reference implementation; this feature is
# its living, on-device catalogue of the design-system state UI + the navigation
# transition factories. It is NOT a product feature — it is a visual smoke test
# for engineers, wired only in non-release builds (see flow.yaml / docs.yaml).
#
# Two galleries + one throwaway demo destination, declared in screens[]:
#   state-gallery       → StateGalleryScreen       (scroll gallery of ScreenState + primitives)
#   transition-gallery  → TransitionGalleryScreen  (hub: tap a variant → push a demo)
#   transition-demo     → TransitionDemoScreen      (private leaf; auto-pops after 2s)
#
# GROUNDED: every screen / component / state below exists in
# feature/showcase/src/commonMain. There is NO ViewModel, NO Store, NO api,
# NO async state anywhere in this feature — both galleries are stateless
# @Composable functions that render literal, hard-coded demo instances.
# ─────────────────────────────────────────────────────────────────────────────
screen_id: state-gallery          # primary entry screen of the feature
feature: feat-showcase
feature_profile:
  combo_id: dev_state_gallery
  facets: [content]
  archetype: pure-ui
  recipe_ref: FEATURE_LAYER.md
  heal: manual
surface: dev-only                  # gated on !isReleaseBuild(); a fork may delete this feature
platforms: [android, ios, desktop, web]
# Both galleries always render fully — nothing is async, nothing can fail or be
# empty at the SCREEN level. The states the StateGallery *exhibits* (loading /
# empty / error / no-network / content) are literal demo instances of
# core/designsystem + core-base/ui state primitives, NOT states of this screen.
states: [content]
initial_state: content   # both galleries render fully on entry — nothing async, nothing can fail/empty at screen level

business_logic:
  kind: showcase
  processing_kind: static_render
  library_refs: []
  external_library_refs: []
  description: >-
    A developer-facing reference surface with zero domain logic. StateGalleryScreen
    statically instantiates every kpt.core.base.store.screen.ScreenState variant
    (Loading / Empty / Error / NoNetwork / Content) plus the five component-scale
    state primitives shipped by core/designsystem (InlineErrorPill, ErrorChip,
    CardLoadingSkeleton, RowLoadingShimmer, CardStateBox) and the full-screen
    defaults (DefaultErrorContent, DefaultNoNetworkContent, LocalScreenStateDefaults.empty)
    so an engineer can eyeball the whole state-UI surface in one scroll.
    TransitionGalleryScreen lists every TransitionVariant (the navigation transition
    factories — SharedAxis, FadeThrough, Push, Slide, Stay, None) as a tappable button;
    tapping one pushes a TransitionDemoScreen using that transition, which auto-pops
    after 2 seconds so the engineer can watch the animation (and check for blinks /
    duration-symmetry). No inputs, no persistence, no network, no ViewModel — the
    screens are pure functions of their (mostly no-op) callbacks.
  processing_location: on_device
  library_note: "State primitives live in core/designsystem/component/state + core-base/ui/screen; transition factories in core-base/ui/nav (SharedAxisSpec, TransitionPushSpec). Showcase only consumes them."

# ─────────────────────────────────────────────────
# State model — NONE. Both galleries are stateless composables (no ViewModel).
# ─────────────────────────────────────────────────
state_model:
  viewmodel: none
  base: none
  note: >-
    Neither StateGalleryScreen nor TransitionGalleryScreen has a ViewModel, State,
    Event, or Action type. They take only navigation callbacks (onBackClick,
    onNavigateToDemo). All demo data is literal in-source (e.g.
    ScreenState.Error(RuntimeException("balance fetch failed")),
    CardStateBox.Content("Account: $1,234.56")). This is the intended "no state at
    all" end of the archetype spectrum, one step below emi-calculator's "local state,
    no Store".

# ═════════════════════════════════════════════════════════════════════════════
# SCREENS
# ═════════════════════════════════════════════════════════════════════════════
screens:

  # ───────────────────────────────────────────────────────────────────────────
  # 1) StateGalleryScreen — every ScreenState variant + component-scale primitives
  # ───────────────────────────────────────────────────────────────────────────
  - screen_id: state-gallery
    composable: StateGalleryScreen
    viewmodel: none
    route: StateGalleryRoute            # @Serializable data object (no params)
    archetype: pure-ui
    states: [content]
    title: "State Gallery (dev)"
    shell:
      bottom_nav: { enabled: false }
      top_app_bar:
        enabled: true
        title: "State Gallery (dev)"
        leading:
          - type: icon_button
            icon: arrow_back
            aria_label: "Back"
            on_click:
              action: "navigate_back"
              action_contract:
                effect: navigate
                description: "onBackClick → popBackStackSafely(); returns to the Settings dev menu that launched the gallery."
    # A single vertically-scrolling Column (KptScaffold) of labelled demo instances.
    state_components:
      content:
        - type: stack
          direction: column
          scroll: vertical
          padding: "{spacing.lg}"
          gap: "{spacing.lg}"
          children:
            - { type: text, variant: body_medium, content_key: "screens_showcase_state_gallery_intro" }

            # ── Section: component-scale primitives ──
            - { type: section_header, content: "Component-scale primitives" }
            - type: labeled_demo
              label: "InlineErrorPill (no retry)"
              demonstrates: "InlineErrorPill(message = \"Couldn't refresh balance\")"
            - type: labeled_demo
              label: "InlineErrorPill (with retry)"
              demonstrates: "InlineErrorPill(message = \"Network error\", onRetry = {})"
            - type: labeled_demo
              label: "ErrorChip"
              demonstrates: "ErrorChip(message = \"Failed to load\", onClick = {})"

            # ── Section: RowLoadingShimmer (3 rows in a Card, divided) ──
            - { type: section_header, content: "RowLoadingShimmer" }
            - type: card
              demonstrates: "3× RowLoadingShimmer separated by HorizontalDivider"

            # ── Section: CardLoadingSkeleton ──
            - { type: section_header, content: "CardLoadingSkeleton" }
            - { type: component, demonstrates: "CardLoadingSkeleton()" }

            # ── Section: CardStateBox — every ScreenState variant ──
            - { type: section_header, content: "CardStateBox — every variant" }
            - type: state_demo_group
              component: "CardStateBox<String>"
              variants:
                - { label_key: "screens_showcase_state_gallery_loading", state: "ScreenState.Loading" }
                - { label_key: "screens_showcase_state_gallery_empty",   state: "ScreenState.Empty" }
                - { label_key: "screens_showcase_state_gallery_error",   state: "ScreenState.Error(RuntimeException(\"balance fetch failed\"))" }
                - { label_key: "screens_showcase_state_gallery_nonet",   state: "ScreenState.NoNetwork(isCaptivePortal = false)" }
                - { label_key: "screens_showcase_state_gallery_content", state: "ScreenState.Content(\"Account: $1,234.56\")" }

            # ── Section: full-screen state defaults (compact preview boxes) ──
            - { type: section_header, content: "Full-screen state defaults (compact preview)" }
            - type: preview_box
              label_key: "screens_showcase_state_gallery_preview_empty"
              demonstrates: "LocalScreenStateDefaults.current.empty (title + message)"
            - type: preview_box
              label_key: "screens_showcase_state_gallery_preview_error"
              demonstrates: "DefaultErrorContent(error = RuntimeException(\"Demo error: server unreachable\"), onRetry = {})"
            - type: preview_box
              label_key: "screens_showcase_state_gallery_preview_nonet_captive"
              demonstrates: "DefaultNoNetworkContent(onRetry = {}, isCaptivePortal = true)"
            - type: preview_box
              label_key: "screens_showcase_state_gallery_preview_nonet_offline"
              demonstrates: "DefaultNoNetworkContent(onRetry = {}, isCaptivePortal = false)"
    test_tags:
      - { id: "state_gallery_screen", note: "TestTags.StateGallery.SCREEN — root scaffold, always rendered." }

  # ───────────────────────────────────────────────────────────────────────────
  # 2) TransitionGalleryScreen — hub listing every transition factory
  # ───────────────────────────────────────────────────────────────────────────
  - screen_id: transition-gallery
    composable: TransitionGalleryScreen
    viewmodel: none
    route: TransitionGalleryRoute       # @Serializable data object (no params)
    archetype: pure-ui
    states: [content]
    title: "Transition Gallery (dev)"
    shell:
      bottom_nav: { enabled: false }
      top_app_bar:
        enabled: true
        title: "Transition Gallery (dev)"
        leading:
          - type: icon_button
            icon: arrow_back
            aria_label: "Back"
            on_click:
              action: "navigate_back"
              action_contract:
                effect: navigate
                description: "onBackClick → popBackStackSafely(); returns to the Settings dev menu."
    state_components:
      content:
        - type: stack
          direction: column
          padding: "{spacing.lg}"
          children:
            - { type: text, variant: body_medium, content_key: "screens_showcase_transition_gallery_intro" }
            - type: list
              layout: lazy_column
              gap: "{spacing.sm}"
              source: "TransitionVariant.entries"
              item:
                type: button
                label_source: "variant.displayName"
                on_click:
                  action: "navigate_to_transition_demo"
                  action_contract:
                    effect: navigate
                    description: "onNavigateToDemo(variant) → navController.navigate(TransitionDemoRoute(variant.name)); pushes the demo destination using the tapped transition factory."
                items:
                  # The 9 TransitionVariant enum entries (name → displayName), grounded in source.
                  - { name: SharedAxisForward, label: "Shared-axis push forward" }
                  - { name: SharedAxisBack,    label: "Shared-axis pop back" }
                  - { name: FadeThrough,       label: "Fade-through (siblings)" }
                  - { name: PushLeft,          label: "Push left (enter+exit)" }
                  - { name: PushRight,         label: "Push right (enter+exit)" }
                  - { name: SlideUp,           label: "Slide up" }
                  - { name: SlideDown,         label: "Slide down" }
                  - { name: Stay,              label: "Stay (no-op)" }
                  - { name: None,              label: "None" }
    test_tags:
      - { id: "transition_gallery_screen", note: "TestTags.TransitionGallery.SCREEN — root scaffold, always rendered." }

  # ───────────────────────────────────────────────────────────────────────────
  # 3) TransitionDemoScreen — private throwaway leaf; auto-pops after 2s
  # ───────────────────────────────────────────────────────────────────────────
  - screen_id: transition-demo
    composable: TransitionDemoScreen        # private @Composable in TransitionGalleryNavigation.kt
    viewmodel: none
    route: TransitionDemoRoute              # @Serializable data class(variantName: String)
    route_params:
      - { name: variantName, type: String, note: "TransitionVariant.name; resolved back to the enum via valueOf." }
    archetype: pure-ui
    states: [content]
    private: true
    note: >-
      Not reachable except via a TransitionGallery tile. Renders a single centered
      Text (screens_showcase_transition_demo_label with the variant's displayName)
      and a LaunchedEffect that delay(2000ms) then calls onAutoPop → popBackStackSafely().
      Exists only to exhibit the entering/exiting transition; has no controls.
    state_components:
      content:
        - type: box
          align: center
          children:
            - { type: text, content_key: "screens_showcase_transition_demo_label", note: "formatted with variant.displayName; e.g. 'Demo: Slide up\\n(auto-pops in 2s)'" }
      auto_dismiss:
        after_ms: 2000
        action: "navigate_back"
        action_contract:
          effect: navigate
          description: "LaunchedEffect(variant) { delay(2000); onAutoPop() } → popBackStackSafely() back to the Transition Gallery hub."

# ─────────────────────────────────────────────────
# Source provenance (reverse-engineered, read-only)
# ─────────────────────────────────────────────────
source_refs:
  state_gallery_screen: "feature/showcase/src/commonMain/kotlin/kpt/feature/showcase/stategallery/StateGalleryScreen.kt"
  state_gallery_nav: "feature/showcase/src/commonMain/kotlin/kpt/feature/showcase/stategallery/StateGalleryNavigation.kt"
  transition_gallery_screen: "feature/showcase/src/commonMain/kotlin/kpt/feature/showcase/transitions/TransitionGalleryScreen.kt"
  transition_gallery_nav: "feature/showcase/src/commonMain/kotlin/kpt/feature/showcase/transitions/TransitionGalleryNavigation.kt (contains TransitionDemoScreen + TransitionVariant enum)"
  test_tags: "feature/showcase/src/commonMain/kotlin/kpt/feature/showcase/TestTags.kt"
  strings: "feature/showcase/src/commonMain/composeResources/values/strings.xml"
  entry_wiring: "cmp-navigation/.../authenticated/AuthenticatedNavigation.kt (onStateGalleryClick / onTransitionGalleryClick — gated on !isReleaseBuild(), surfaced by SettingsScreen dev menu)"
  design_system:
    - "core/designsystem/component/state (InlineErrorPill, ErrorChip, CardLoadingSkeleton, RowLoadingShimmer, CardStateBox)"
    - "core-base/ui/screen (DefaultErrorContent, DefaultNoNetworkContent, LocalScreenStateDefaults)"
    - "core-base/store/screen (ScreenState sealed hierarchy)"
    - "core-base/ui/nav (composableWithPushTransitions, SharedAxisSpec, TransitionPushSpec — the factories TransitionVariant exercises)"
    - "core/ui/scaffold (KptScaffold); core/designsystem/theme (spacing, KptTheme)"
