<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Macro — Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#6C63FF','on-primary':'#ffffff'}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#6C63FF;--on-primary:#fff;--bg:#fff;--text:#1C1B1F;--border:#E7E0EC;--error:#BA1A1A;--success:#146C2E;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
body.embedded{background:var(--bg);margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;background:var(--bg);}
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span id="screenTitle" class="text-sm font-semibold text-slate-200 flex-1">Loading…</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none"></select>
  <button onclick="toggleTags()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">Tags</button>
</div>
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-white shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-white">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-slate-50" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900 rounded-full"></div></div>
    <div id="fab-container" class="absolute bottom-8 right-5"></div>
  </div>
</div>
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-white shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-slate-50 flex-1"></div>
  <div id="embedded-fab" class="fixed bottom-8 right-5"></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>
<script>
/* ══ feature/macro — B8 Country Macro Snapshot. THREE independent World-Bank cards
   (GDP/Inflation/Unemployment), MEMORY_ONLY Store5 (no Room). Country picker + detail.
   Real values from demo-data.yaml (United States, 2019-2023). ══ */
function spark(vals,color){var w=120,h=34,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),r=(mx-mn)||1;var pts=vals.map(function(v,i){return ((i/(vals.length-1))*w).toFixed(1)+','+(h-4-((v-mn)/r)*(h-8)).toFixed(1);}).join(' ');return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round"/></svg>';}
var CARDS=[
 {kind:'GDP',title:'GDP',headline:'$27.36T',accent:'emerald',color:'#059669',obs:[21521395000000,21322950000000,23594030000000,25744110000000,27360940000000]},
 {kind:'INFLATION_CPI',title:'Inflation (CPI)',headline:'4.1%',accent:'amber',color:'#d97706',obs:[1.81,1.23,4.70,8.00,4.12]},
 {kind:'UNEMPLOYMENT',title:'Unemployment',headline:'3.6%',accent:'rose',color:'#e11d48',obs:[3.67,8.05,5.35,3.65,3.64]}
];
var ABORD={emerald:'border-l-4 border-emerald-400',amber:'border-l-4 border-amber-400',rose:'border-l-4 border-rose-400'};
var COUNTRIES=[['US','United States'],['IN','India'],['DE','Germany'],['JP','Japan'],['BR','Brazil'],['ZA','South Africa']];
function appBar(title,back,country){var trailing=country?'<span class="flex items-center gap-1 text-xs font-medium text-primary px-2.5 py-1 rounded-full bg-primary/10 cursor-pointer" onclick="navigateTo(\'countryPicker\')">'+country+'<span class="material-symbols-outlined text-sm">expand_more</span></span><span class="material-symbols-outlined text-xl text-slate-600 cursor-pointer ml-1" onclick="showToast(\'Refresh all — re-fetch GDP/Inflation/Unemployment\')">refresh</span>':'';
 return '<div class="sticky top-0 z-10 flex items-center gap-2 px-4 py-3 bg-white border-b border-slate-100"><span class="material-symbols-outlined text-xl text-slate-700 cursor-pointer" onclick="navigateTo(\''+(back||'')+'\')">arrow_back</span><span class="flex-1 text-lg font-semibold text-slate-900">'+title+'</span>'+trailing+'</div>';}
function progressBar(){return '<div class="mx-4 mt-3 mb-1"><div class="flex items-center justify-between text-xs text-slate-500 mb-1"><span>Indicators loaded</span><span>3 of 3</span></div><div class="w-full h-1.5 rounded-full bg-slate-200"><div class="h-1.5 rounded-full bg-primary" style="width:100%"></div></div></div>';}
function indCard(c){return '<div onclick="navigateTo(\'macroIndicatorDetail\')" class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm '+ABORD[c.accent]+' cursor-pointer active:scale-[0.99] transition"><div class="flex items-start justify-between"><div><div class="text-sm text-slate-500">'+c.title+'</div><div class="text-2xl font-bold text-slate-900 mt-0.5">'+c.headline+'</div><div class="text-xs text-slate-400 mt-1">Latest: 2023</div></div><div class="mt-1">'+spark(c.obs,c.color)+'</div></div></div>';}
function contentHtml(stale){return appBar('Country Macro','home','United States')
 +(stale?'<div class="mx-4 mt-3 mb-0 px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 text-xs inline-flex items-center gap-1"><span class="material-symbols-outlined text-sm">history</span>STALE — showing cached data</div>':'')
 +progressBar()+'<div class="pb-6">'+CARDS.map(indCard).join('')+'</div>';}
function loadingHtml(){var accents=['emerald','amber','rose'];var titles=['GDP','Inflation (CPI)','Unemployment'];var s='';for(var i=0;i<3;i++){s+='<div class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100 '+ABORD[accents[i]]+'"><div class="text-sm text-slate-500">'+titles[i]+'</div><div class="shimmer h-7 w-28 mt-2 mb-2"></div><div class="text-xs text-slate-400">Loading…</div></div>';}return appBar('Country Macro','home','United States')+'<div class="pt-2">'+s+'</div>';}
function emptyHtml(){return appBar('Country Macro','home','United States')+'<div class="mx-4 my-3 p-6 rounded-2xl bg-white border border-slate-100 shadow-sm text-center"><span class="material-symbols-outlined text-4xl text-slate-300">inbox</span><p class="text-sm font-semibold text-slate-700 mt-2">No data published for this indicator.</p><button onclick="showToast(\'Retry — re-fetch this indicator\')" class="mt-3 text-primary text-sm font-semibold">Retry</button></div>'+indCard(CARDS[1])+indCard(CARDS[2]);}
function errorHtml(){return appBar('Country Macro','home','United States')
 +'<div class="mx-4 my-3 p-6 rounded-2xl bg-white border border-slate-100 shadow-sm text-center"><span class="material-symbols-outlined text-4xl text-rose-300">wifi_off</span><p class="text-sm font-semibold text-slate-700 mt-2">Offline — connect to fetch this indicator.</p><p class="text-xs text-slate-400 mt-1">MEMORY_ONLY has no Room fallback, so a cold cache surfaces NoNetwork (no stale content).</p><button onclick="showToast(\'Retry\')" class="mt-3 text-primary text-sm font-semibold">Retry</button></div>'
 +'<div class="mx-4 my-3 p-6 rounded-2xl bg-white border border-slate-100 shadow-sm text-center"><span class="material-symbols-outlined text-4xl text-rose-300">error_outline</span><p class="text-sm font-semibold text-slate-700 mt-2">Couldn’t load this indicator.</p><button onclick="showToast(\'Retry\')" class="mt-3 text-primary text-sm font-semibold">Retry</button></div>'
 +indCard(CARDS[2]);}
function pickerHtml(){return appBar('Select country','macro',null)
 +'<div class="mx-4 mt-3 mb-2"><div class="flex items-center gap-2 px-3 py-2.5 rounded-xl bg-white border border-slate-200"><span class="material-symbols-outlined text-slate-400">search</span><span class="text-sm text-slate-400">Search country or ISO code</span></div></div>'
 +'<div class="mx-4 mb-6 rounded-2xl overflow-hidden border border-slate-100 shadow-sm bg-white">'+COUNTRIES.map(function(c){return '<div onclick="navigateTo(\'macro\')" class="flex items-center gap-3 px-4 py-3 border-b border-slate-50 cursor-pointer hover:bg-slate-50"><span class="w-9 h-9 rounded-lg bg-primary/10 text-primary text-xs font-bold flex items-center justify-center">'+c[0]+'</span><span class="flex-1 text-sm font-medium text-slate-900">'+c[1]+'</span><span class="text-xs text-slate-400">'+c[0]+'</span></div>';}).join('')+'</div>';}
function detailHtml(){var c=CARDS[0];var years=[[2023,27360940000000],[2022,25744110000000],[2021,23594030000000],[2020,21322950000000],[2019,21521395000000]];
 return appBar('GDP','macro',null)
 +'<div class="mx-4 mt-3 p-5 rounded-3xl text-white shadow-lg" style="background:linear-gradient(135deg,#059669,#34d399)"><div class="text-xs opacity-80 uppercase tracking-wide">GDP (current US$)</div><div class="text-4xl font-bold mt-1">'+c.headline+'</div><div class="text-sm opacity-90 mt-1">Source: World Bank Open Data</div></div>'
 +'<div class="mx-4 my-3 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="text-sm font-semibold text-slate-700 mb-2">25-year trend</div>'+function(){var w=320,h=80,vals=c.obs,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;var pts=vals.map(function(v,i){return ((i/(vals.length-1))*w).toFixed(1)+','+(h-6-((v-mn)/rg)*(h-12)).toFixed(1);}).join(' ');return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="#059669" stroke-width="2.5"/></svg>';}()+'</div>'
 +'<div class="mx-4 mb-6 rounded-2xl bg-white border border-slate-100 shadow-sm overflow-hidden"><div class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase">Year by year</div>'+years.map(function(y){return '<div class="flex items-center justify-between px-4 py-2.5 border-t border-slate-50 text-sm"><span class="text-slate-500">'+y[0]+'</span><span class="font-medium text-slate-900">$'+(y[1]/1e12).toFixed(2)+'T</span></div>';}).join('')+'</div>';}

var DATA={id:'macro',name:'Country Macro',feature:'feat-country-macro',status:'designed',fab:null,
 states:{initial_state:'content',
  content:{name:'Content (3 cards)',html:contentHtml(false)},
  'content-stale':{name:'Content · STALE',html:contentHtml(true)},
  loading:{name:'Loading',html:loadingHtml()},
  empty:{name:'Empty (per-card)',html:emptyHtml()},
  error:{name:'Error / Offline',html:errorHtml()},
  picker:{name:'Country picker',html:pickerHtml()},
  detail:{name:'Indicator detail',html:detailHtml()}
 }};

/* ══ engine ══ */
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
var showTags=false,currentState=null;
function contentEl(){return document.getElementById(isEmbedded?'embedded-screen-content':'screen-content');}
function fabEl(){return document.getElementById(isEmbedded?'embedded-fab':'fab-container');}
function populateStates(){var p=document.getElementById('statePicker');if(!p)return;p.innerHTML='';Object.keys(DATA.states).forEach(function(k){if(k==='initial_state')return;var o=document.createElement('option');o.value=k;o.textContent=DATA.states[k].name||k;p.appendChild(o);});}
function switchState(id){if(!DATA.states[id]||id==='initial_state')id=DATA.states.initial_state;currentState=id;var p=document.getElementById('statePicker');if(p)p.value=id;contentEl().innerHTML='<div id="comp-wrap">'+(DATA.states[id].html||'')+'</div>';renderFab();}
function renderFab(){fabEl().innerHTML='';}
function navigateTo(t){if(!t){return;}if(t==='countryPicker'){switchState('picker');return;}if(t==='macroIndicatorDetail'){switchState('detail');return;}if(t==='macro'){switchState('content');return;}if(window!==window.top){window.parent.postMessage({action:'navigate',screenId:t},'*');}else if(DATA.states[t]){switchState(t);}else{showToast('→ '+t);}}
function showToast(m){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';t.textContent=m;document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},1800);}
function toggleTags(){showTags=!showTags;}
function notifyParent(){if(window===window.top)return;try{window.parent.postMessage({action:'screenLoaded',screenId:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,inspectorData:{id:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,states:Object.keys(DATA.states).filter(function(k){return k!=='initial_state';})}},'*');}catch(e){}}
window.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state);if(e.data.action==='getInspectorData')notifyParent();if(e.data.action==='applyTheme'&&e.data.cssVars){var r=document.documentElement;Object.keys(e.data.cssVars).forEach(function(k){if(e.data.cssVars[k])r.style.setProperty(k,e.data.cssVars[k]);});}});
function boot(){if(isEmbedded){document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col');document.body.classList.add('embedded');}document.title=DATA.name+' — Prototype';var t=document.getElementById('screenTitle');if(t)t.textContent=DATA.name;populateStates();var urlState=new URLSearchParams(location.search).get('state');switchState(urlState||DATA.states.initial_state);notifyParent();}
boot();
</script>
</body>
</html>
