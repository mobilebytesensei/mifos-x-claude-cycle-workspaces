# demo-data.yaml — B8 Country Macro Snapshot demo/offline data.
# Sample World Bank observations for the three dashboard indicators, shaped as
# MacroIndicator (domain). Used for offline render, previews, and tests (mirrors
# fixtures in FakeMacroIndicatorsRepository / CountryMacroViewModelTest). Values
# are realistic-but-illustrative, NOT live World Bank data. observations are
# trimmed samples (real windows carry ~25 annual rows). No Room table — this
# feature is MEMORY_ONLY, so these samples model in-memory Store payloads only.
schema_version: "1.0"
screen_id: macro

consumes:
  - collection: macro_indicators
    dto: MacroIndicator
    used_by: [worldbank-country-indicator]
  - collection: supported_countries
    dto: Country
    used_by: [supported-countries-static]

samples:
  macro_indicators:
    # ── United States (default country, CountryMacroRoute countryCode="US") ──
    - countryCode: US
      countryName: "United States"
      indicator: GDP
      source: "World Bank Open Data"
      # GDP current US$ — headlineValue() renders latest non-null as $NN.NNT.
      observations:
        - { year: 2019, value: 21521395000000 }
        - { year: 2020, value: 21322950000000 }
        - { year: 2021, value: 23594030000000 }
        - { year: 2022, value: 25744110000000 }
        - { year: 2023, value: 27360940000000 }

    - countryCode: US
      countryName: "United States"
      indicator: INFLATION_CPI
      source: "World Bank Open Data"
      # CPI inflation annual % — headlineValue() renders latest as NN.N%.
      observations:
        - { year: 2019, value: 1.81 }
        - { year: 2020, value: 1.23 }
        - { year: 2021, value: 4.70 }
        - { year: 2022, value: 8.00 }
        - { year: 2023, value: 4.12 }

    - countryCode: US
      countryName: "United States"
      indicator: UNEMPLOYMENT
      source: "World Bank Open Data"
      # Unemployment total (% labor force, ILO modeled) — headlineValue() NN.N%.
      observations:
        - { year: 2019, value: 3.67 }
        - { year: 2020, value: 8.05 }
        - { year: 2021, value: 5.35 }
        - { year: 2022, value: 3.65 }
        - { year: 2023, value: 3.64 }

    # ── India (second pinned sync key; picker demo) ──
    - countryCode: IN
      countryName: "India"
      indicator: GDP
      source: "World Bank Open Data"
      observations:
        - { year: 2019, value: 2835610000000 }
        - { year: 2020, value: 2674850000000 }
        - { year: 2021, value: 3167270000000 }
        - { year: 2022, value: 3353470000000 }
        - { year: 2023, value: 3549920000000 }

    - countryCode: IN
      countryName: "India"
      indicator: INFLATION_CPI
      source: "World Bank Open Data"
      observations:
        - { year: 2019, value: 3.73 }
        - { year: 2020, value: 6.62 }
        - { year: 2021, value: 5.13 }
        - { year: 2022, value: 6.70 }
        - { year: 2023, value: 5.65 }

    - countryCode: IN
      countryName: "India"
      indicator: UNEMPLOYMENT
      source: "World Bank Open Data"
      observations:
        - { year: 2019, value: 5.27 }
        - { year: 2020, value: 7.86 }
        - { year: 2021, value: 6.38 }
        - { year: 2022, value: 4.82 }
        - { year: 2023, value: 4.17 }

  # Curated picker list — trimmed sample of SupportedCountries.list (full = 31, G20-plus).
  supported_countries:
    - { code: "US", name: "United States", flagEmoji: "🇺🇸" }
    - { code: "IN", name: "India",          flagEmoji: "🇮🇳" }
    - { code: "DE", name: "Germany",        flagEmoji: "🇩🇪" }
    - { code: "JP", name: "Japan",          flagEmoji: "🇯🇵" }
    - { code: "BR", name: "Brazil",         flagEmoji: "🇧🇷" }
    - { code: "ZA", name: "South Africa",   flagEmoji: "🇿🇦" }

# Edge-case fixtures for state coverage.
edge_cases:
  - id: empty_indicator
    countryCode: US
    indicator: GINI
    observations: []
    renders: "ScreenState.Empty (IndicatorCard InlineMessage) — 'No data published for this indicator.' + Retry. Common for GINI (sparse reporting)."
  - id: sparse_series_with_nulls
    countryCode: NG
    indicator: UNEMPLOYMENT
    observations:
      - { year: 2021, value: null }
      - { year: 2022, value: 3.83 }
      - { year: 2023, value: null }
    renders: "Content — headlineValue()/latestYear() pick the most-recent NON-null (2022, 3.83%); Sparkline skips null gaps; missing years show '—'."
  - id: single_observation
    countryCode: SG
    indicator: GDP
    observations:
      - { year: 2023, value: 501428000000 }
    renders: "Content but Sparkline shows '—' (screens_macro_sparkline_empty) — <2 non-null values → degenerate path guarded."
  - id: all_null_series
    countryCode: KE
    indicator: GINI
    observations:
      - { year: 2022, value: null }
      - { year: 2023, value: null }
    renders: "Content with headlineValue() = '—' (no non-null observation)."
  - id: offline_cold_cache
    trigger: "device offline AND in-memory Store cache empty (cold start / post-process-death)"
    renders: "ScreenState.NoNetwork — 'Offline — connect to fetch this indicator.' No Room fallback (MEMORY_ONLY), so no stale content."
