schema_version: "1.0"
feature_id: feat-country-macro
screen_id: macro
archetype: screen-content
flow: flow-macro
title: Country Macro Snapshot
purpose: >-
  B8 Country Macro Snapshot — a per-country dashboard of three key macro
  indicators (GDP, Inflation/CPI, Unemployment) sourced from the World Bank Open
  Data API, each an independently-loading card with a trend sparkline and a
  latest-year headline, plus a searchable country picker and a per-indicator
  25-year drill-down. Doubles as the canonical showcase of the toolkit's
  MEMORY_ONLY Store5 archetype + multi-source combine + country-picker pattern.
status: designed
last_modified: '2026-07-25'
quality_score: 89          # reverse-engineered (read-only) network feature: cleanest of the three economic siblings — well-formed MEMORY_ONLY 3-stream dashboard + pure-local country picker + per-indicator detail, with rich business_logic + action_contracts + test_tags + full inline screens_macro_* i18n annotation; initial_state declared on dashboard + countryPicker (content) + macroIndicatorDetail (loading). Held below the 90 shipped-UI ceiling because it is reverse-engineered.
source: reverse-engineered
origin: "/idea-import — read-only reverse-engineering of the shipped feature/macro module"

showcase_note: >-
  B8 is the reference implementation for the MEMORY_ONLY Store archetype (see
  kmp-project-template CLAUDE.md → Store Archetype Showcases table:
  MacroIndicatorStore under MEMORY_ONLY, EconomicMemoryOnlyTest) and for the
  multi-source-combine + country-picker pattern. Unlike its sibling B7/feat-rates
  (NETWORK_WITH_CACHE, which persists FRED series to a Room table),
  MacroIndicatorStore uses StoreFactory.createMemoryStore(fetcher) with NO
  SourceOfTruth — the cache is in-memory only and is lost on process death, so a
  cold start re-fetches from the World Bank. This is deliberate: World Bank macro
  data is public, cheap, and published annually, so refetch-on-cold-start costs
  almost nothing (the store's 7-day TTL + annual cadence means real fetches are
  ≤ ~weekly). Like B7 it keeps INDEPENDENT ScreenState cells so one failed
  indicator never blanks the screen — the "independent cards" pattern.

worldbank_setup_note: >-
  NO setup required. World Bank Open Data is a fully open API — no key, no auth,
  no secret. (Contrast FRED / B7 which needs a free developer key.) The only
  configurable surface is the base URL (WorldBankApiConfig.baseUrl), overridden
  via Koin for a MockWebServer or internal mirror. Add new indicators by
  extending core/model/economic/MacroIndicator.kt IndicatorKind (~1,500 World
  Bank indicators exist; the toolkit exposes 5, surfaces 3 on the dashboard).
  Add new countries by appending to SupportedCountries.list.

data_sources:
  - name: "World Bank Open Data"
    endpoint: "GET https://api.worldbank.org/v2/country/{code}/indicator/{indicator}?format=json&date=YYYY:YYYY"
    indicators:
      - { kind: GDP,           code: "NY.GDP.MKTP.CD" }
      - { kind: INFLATION_CPI, code: "FP.CPI.TOTL.ZG" }
      - { kind: UNEMPLOYMENT,  code: "SL.UEM.TOTL.ZS" }
    auth: "none (fully open)"
    cache: "Store5 MEMORY_ONLY, 7-day TTL, in-memory only (NO Room, NO SourceOfTruth)"

user_stories:
  - "As a user, I want to see a country's GDP, inflation and unemployment in one place so I can gauge its economic health at a glance."
  - "As a user, I want each indicator to show a trend sparkline and its latest year so I can spot direction without opening a chart."
  - "As a user, I want to switch countries via a searchable picker so I can compare economies I care about."
  - "As a user, I want to tap an indicator and see its full 25-year history + year-by-year table so I can understand its trajectory."
  - "As a user with a spotty connection, I want one failed indicator to not blank the whole screen, and each card to retry on its own."
  - "As a fork developer, I want zero-setup macro data (World Bank needs no key) and a one-list way to add countries/indicators."

metrics:
  - { name: worldbank_fetch_success_rate, description: "share of World Bank fetches that return usable observations (per country/indicator)" }
  - { name: cold_start_refetch_rate, description: "share of screen opens that re-fetch because the in-memory cache was cold (MEMORY_ONLY has no persistence)" }
  - { name: indicator_card_error_rate, description: "per-card error/offline frequency" }
  - { name: country_change_frequency, description: "picker-driven country switches per session" }
  - { name: indicator_drilldown_rate, description: "dashboard card taps that open the per-indicator detail" }

edge_cases:
  - "World Bank emits explicit JSON null for unreported (country, indicator, year) triples — preserved as IndicatorObservation.value=null and rendered '—', never 0."
  - "Wire-format quirk: responses are a 2-element array [metadata, observations[]]; on 404/rate-limit the API returns {\"message\":[...]} — the serializer maps a non-array root to an empty domain object (Empty slot, no crash)."
  - "<2 non-null observations → Sparkline renders an em-dash instead of a degenerate path."
  - "MEMORY_ONLY: offline with a cold cache surfaces NoNetwork (no Room stale fallback); a warm in-memory cache keeps last content with a STALE band."
  - "Flag emojis dropped from chip + picker rows — regional-indicator code points are tofu in the Outfit font on wasmJs; a theme-tinted ISO-code badge is used instead."
  - "ChangeCountry cancels + re-subscribes all 3 streams so previous-country emissions cannot bleed into the post-switch UI; same-code change is a no-op."

related_features:
