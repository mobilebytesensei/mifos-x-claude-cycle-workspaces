<!doctype html>
<!-- render-hash: countrymacrohd01 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Country Macro — content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #6C63FF; --on-primary: #FFFFFF; --primary-container: #E4E0FF; --on-primary-container: #1A0F6B;
  --primary-hover: #5D53F0; --primary-pressed: #4E44D8;
  --secondary: #146C2E; --on-secondary: #FFFFFF; --secondary-container: #C3F2CE; --on-secondary-container: #00210A;
  --tertiary: #7D5260; --on-tertiary: #FFFFFF; --tertiary-container: #FFD9E3; --on-tertiary-container: #31101C;
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #146C2E; --on-success: #FFFFFF; --success-container: #C3F2CE; --on-success-container: #00210A;
  --warning: #8A5300; --on-warning: #FFFFFF; --warning-container: #FFDDB3; --on-warning-container: #2B1700; --warning-strong: #B45309;
  --info: #0061A4; --on-info: #FFFFFF;
  --background: #FFFBFE; --on-background: #1C1B1F;
  --surface: #FFFBFE; --on-surface: #1C1B1F; --surface-variant: #E7E0EC; --on-surface-variant: #49454F;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
  --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9; --surface-dim: #DED8E1; --surface-bright: #FFFBFE;
  --outline: #79747E; --outline-variant: #CAC4D0;
  --inverse-surface: #313033; --inverse-on-surface: #F4EFF4; --inverse-primary: #C3BEFF;
  --accent: #00BFA5; --on-accent: #00201A; --scrim: #000000;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-display-lg: 3rem; --fs-display-md: 2.375rem; --fs-display-sm: 1.875rem;
  --fs-h1: 1.625rem; --fs-h2: 1.375rem; --fs-h3: 1.25rem;
  --fs-title: 1.125rem; --fs-title-md: 1rem; --fs-title-sm: 0.875rem;
  --fs-body: 1rem; --fs-body-sm: 0.875rem; --fs-label: 0.875rem; --fs-label-sm: 0.75rem;
  --fs-caption: 0.75rem; --fs-caption-sm: 0.6875rem;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-label: 0.1px; --ls-caption: 0.3px; --ls-wide: 0.5px;
  --r-xs: 6px; --r-sm: 10px; --r-md: 16px; --r-lg: 20px; --r-xl: 28px; --r-full: 9999px;
  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
  --el-0: none;
  --el-1: 0 1px 3px rgba(28,17,84,0.08), 0 1px 2px rgba(28,17,84,0.06);
  --el-2: 0 3px 8px rgba(28,17,84,0.10), 0 2px 4px rgba(28,17,84,0.08);
  --el-3: 0 8px 20px rgba(28,17,84,0.14), 0 4px 8px rgba(28,17,84,0.10);
  --el-4: 0 12px 28px rgba(28,17,84,0.16);
  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #C3BEFF; --on-primary: #2E2299; --primary-container: #453AB1; --on-primary-container: #E4E0FF;
  --primary-hover: #D4D0FF; --primary-pressed: #E5E2FF;
  --secondary: #A8D5AF; --on-secondary: #013913; --secondary-container: #00531E; --on-secondary-container: #C3F2CE;
  --tertiary: #EFB8C8; --on-tertiary: #4A2532; --tertiary-container: #633B48; --on-tertiary-container: #FFD9E3;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #A8D5AF; --on-success: #013913; --success-container: #00531E; --on-success-container: #C3F2CE;
  --warning: #FFB955; --on-warning: #472A00; --warning-container: #663D00; --on-warning-container: #FFDDB3; --warning-strong: #E0912F;
  --info: #9CCAFF; --on-info: #003258;
  --background: #1C1B1F; --on-background: #E6E1E5;
  --surface: #1C1B1F; --on-surface: #E6E1E5; --surface-variant: #49454F; --on-surface-variant: #CAC4D0;
  --surface-container-lowest: #0F0E11; --surface-container-low: #1D1B1E; --surface-container: #211F23;
  --surface-container-high: #2B292D; --surface-container-highest: #363438; --surface-dim: #141316; --surface-bright: #3A383C;
  --outline: #938F99; --outline-variant: #49454F;
  --inverse-surface: #E6E1E5; --inverse-on-surface: #313033; --inverse-primary: #6C63FF;
  --accent: #4FD8C4; --on-accent: #00201A;
  --el-1: 0 1px 3px rgba(0,0,0,0.40); --el-2: 0 3px 8px rgba(0,0,0,0.50);
  --el-3: 0 8px 20px rgba(0,0,0,0.60); --el-4: 0 12px 28px rgba(0,0,0,0.66);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); color: var(--on-surface); border-bottom: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-2); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; }
header[data-shell="top-app-bar"] .bar-trailing { margin-left: auto; display: inline-flex; align-items: center; gap: var(--sp-xs); }

main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--sp-lg)); overflow-y: auto; }

/* country chip (trailing) — navigate to countryPicker */
.country-chip { display: inline-flex; align-items: center; gap: var(--sp-xxs); padding: var(--sp-xxs) var(--sp-sm); border-radius: var(--r-full); background: var(--primary-container); color: var(--on-primary-container); font-size: var(--fs-caption-sm); font-weight: var(--fw-medium); border: none; cursor: pointer; font-family: inherit; }
.country-chip .material-symbols-outlined { font-size: 16px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }

/* indicator card — accent conveyed via the leading icon chip only (no left-border, per anti-slop §1.5) */
.indicator-card { display: flex; flex-direction: column; gap: var(--sp-sm); width: 100%; padding: var(--sp-md); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--el-1); border: none; text-align: left; font-family: inherit; cursor: pointer; }
.ind-head { display: flex; align-items: center; gap: var(--sp-sm); }
.ind-icon { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; aspect-ratio: 1 / 1; border-radius: var(--r-md); }
.ind-icon .material-symbols-outlined { font-size: 20px; }
.ind-icon.gdp { background: var(--secondary-container); color: var(--on-secondary-container); }
.ind-icon.inflation { background: var(--tertiary-container); color: var(--on-tertiary-container); }
.ind-icon.unemployment { background: var(--error-container); color: var(--on-error-container); }
.ind-title { flex: 1; min-width: 0; font-size: var(--fs-title-sm); font-weight: var(--fw-medium); color: var(--on-surface-variant); }
.ind-chevron { color: var(--on-surface-variant); flex: 0 0 auto; }
.ind-chevron .material-symbols-outlined { font-size: 20px; }
.ind-body { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-md); }
.ind-value { display: flex; flex-direction: column; gap: 2px; }
.ind-value .num { font-family: var(--font-mono); font-size: var(--fs-h2); font-weight: var(--fw-semibold); color: var(--on-surface); }
.ind-value .year { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.sparkline { flex: 0 0 auto; display: block; }
.sparkline path { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.sparkline.gdp path { stroke: var(--secondary); }
.sparkline.inflation path { stroke: var(--warning-strong); }
.sparkline.unemployment path { stroke: var(--error); }

@media (prefers-reduced-motion: no-preference) {
  .indicator-card, .country-chip, .icon-btn { transition: filter 120ms ease, box-shadow 120ms ease; }
  .indicator-card:active { filter: brightness(0.98); }
}
.indicator-card:focus-visible, .country-chip:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="macro" data-state="content">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="top_app_bar">
    <button type="button" class="leading" data-nav-to="home" data-nav-type="pop" data-component-type="icon_button" data-component-id="back_button" aria-label="Back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="app-title">Country Macro</h1>
    <span class="bar-trailing">
      <button type="button" class="country-chip" data-component-type="status_chip" data-component-id="country_chip" data-nav-to="countryPicker" data-nav-type="push" aria-label="Change country">
        <span class="material-symbols-outlined" aria-hidden="true">public</span>United States
      </button>
      <button type="button" class="icon-btn" data-component-type="icon_button" data-component-id="refresh_all_button" data-action="refresh" aria-label="Refresh all">
        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
      </button>
    </span>
  </header>

  <main data-shell="content" data-state="content">

    <div data-component-type="stack" data-component-id="country_macro_screen" style="display:flex;flex-direction:column;gap:var(--sp-md)">

      <!-- GDP — headline currency value, secondary/emerald accent -->
      <button type="button" class="indicator-card" data-component-type="card" data-component-variant="app_card" data-component-id="gdp_card" data-nav-to="macroIndicatorDetail" data-nav-type="push" data-nav-params='{"countryCode":"US","indicatorKindName":"GDP"}' aria-label="GDP — tap for 25-year detail">
        <div class="ind-head">
          <span class="ind-icon gdp" aria-hidden="true"><span class="material-symbols-outlined">trending_up</span></span>
          <span class="ind-title" data-component-type="text" data-component-variant="title_medium">GDP</span>
          <span class="ind-chevron"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></span>
        </div>
        <div class="ind-body">
          <div class="ind-value">
            <span class="num" data-component-type="text" data-component-variant="headline_small">$27.36T</span>
            <span class="year" data-component-type="text" data-component-variant="label_small">Latest: 2023</span>
          </div>
          <svg class="sparkline gdp" data-component-type="sparkline" width="116" height="40" viewBox="0 0 232 40" role="img" aria-label="GDP 5-year trend, dip in 2020 then rising through 2023">
            <path d="M0,31.2 L58,32 L116,23 L174,14.4 L232,8"/>
          </svg>
        </div>
      </button>

      <!-- Inflation (CPI) — headline percentage, tertiary/amber accent -->
      <button type="button" class="indicator-card" data-component-type="card" data-component-variant="app_card" data-component-id="inflation_card" data-nav-to="macroIndicatorDetail" data-nav-type="push" data-nav-params='{"countryCode":"US","indicatorKindName":"INFLATION_CPI"}' aria-label="Inflation (CPI) — tap for 25-year detail">
        <div class="ind-head">
          <span class="ind-icon inflation" aria-hidden="true"><span class="material-symbols-outlined">local_fire_department</span></span>
          <span class="ind-title" data-component-type="text" data-component-variant="title_medium">Inflation (CPI)</span>
          <span class="ind-chevron"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></span>
        </div>
        <div class="ind-body">
          <div class="ind-value">
            <span class="num" data-component-type="text" data-component-variant="headline_small">4.12%</span>
            <span class="year" data-component-type="text" data-component-variant="label_small">Latest: 2023</span>
          </div>
          <svg class="sparkline inflation" data-component-type="sparkline" width="116" height="40" viewBox="0 0 232 40" role="img" aria-label="Inflation 5-year trend, peaked in 2022 then eased in 2023">
            <path d="M0,29.9 L58,32 L116,19.7 L174,8 L232,21.8"/>
          </svg>
        </div>
      </button>

      <!-- Unemployment — headline percentage, error/rose accent -->
      <button type="button" class="indicator-card" data-component-type="card" data-component-variant="app_card" data-component-id="unemployment_card" data-nav-to="macroIndicatorDetail" data-nav-type="push" data-nav-params='{"countryCode":"US","indicatorKindName":"UNEMPLOYMENT"}' aria-label="Unemployment — tap for 25-year detail">
        <div class="ind-head">
          <span class="ind-icon unemployment" aria-hidden="true"><span class="material-symbols-outlined">work_off</span></span>
          <span class="ind-title" data-component-type="text" data-component-variant="title_medium">Unemployment</span>
          <span class="ind-chevron"><span class="material-symbols-outlined" aria-hidden="true">chevron_right</span></span>
        </div>
        <div class="ind-body">
          <div class="ind-value">
            <span class="num" data-component-type="text" data-component-variant="headline_small">3.64%</span>
            <span class="year" data-component-type="text" data-component-variant="label_small">Latest: 2023</span>
          </div>
          <svg class="sparkline unemployment" data-component-type="sparkline" width="116" height="40" viewBox="0 0 232 40" role="img" aria-label="Unemployment 5-year trend, spiked in 2020 then declined through 2023">
            <path d="M0,31.8 L58,8 L116,22.7 L174,31.9 L232,32"/>
          </svg>
        </div>
      </button>

    </div>

  </main>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
