# flow.yaml — B8 Country Macro Snapshot
# Per-screen flow sibling. Three screens: macro (dashboard) → countryPicker
# (re-keys the dashboard's country) and macro → macroIndicatorDetail (drill-down).
# Reverse-engineered from feature/macro/navigation/MacroNavigation.kt (nested nav graph).
screen_id: macro
feature_ref: feat-country-macro
flow_groups: [flow-macro]
participates_in_flows: [flow-macro]

# Nav graph: MacroGraphRoute(startDestination = CountryMacroRoute()) {
#   CountryMacroRoute(countryCode="US"), CountryPickerRoute, IndicatorDetailRoute(countryCode, indicatorKindName) }
nav_graph:
  parent_route: MacroGraphRoute
  start_destination: "CountryMacroRoute(countryCode = \"US\")"
  destinations:
    - { route: "CountryMacroRoute(countryCode: String = \"US\")",              screen: macro,                entry: "NavController.navigateToMacroGraph()" }
    - { route: CountryPickerRoute,                                             screen: countryPicker,        entry: "navController.navigate(CountryPickerRoute)" }
    - { route: "IndicatorDetailRoute(countryCode: String, indicatorKindName: String)", screen: macroIndicatorDetail, entry: "navController.navigate(IndicatorDetailRoute(...))" }

entry_points:
  - id: from-home-macro-tile
    description: "Home dashboard / utilities hub 'Country Macro' tile → macro dashboard (defaults to US)"
    trigger: macro_tile_tap
  - id: back-from-picker
    description: "Selecting a country pops the picker and rebuilds the dashboard on the new country"
    trigger: country_picked
  - id: back-from-detail
    description: "Back from a per-indicator detail returns to the dashboard"
    trigger: detail_back

inbound_routes:
  - from: home
    trigger: macro_tile_tap
    to: macro
    flow: flow-macro
    label: "Home Country Macro tile → dashboard (US default)"

outbound_routes:
  - to: countryPicker
    action: navigate
    trigger: country_chip_tap
    label: "Country chip (TopAppBar) → country picker"
    flow: flow-macro
  - to: macroIndicatorDetail
    action: navigate
    trigger: indicator_card_tap
    params: { countryCode: "<current>", indicatorKindName: "GDP | INFLATION_CPI | UNEMPLOYMENT" }
    label: "Indicator card → per-indicator 25-year detail"
    flow: flow-macro
  - to: back
    action: navigate_back
    trigger: dashboard_back_tap
    label: "Back (popBackStackSafely) → caller (home / utilities hub)"
    flow: flow-macro

# Picker's own routing — selecting a country RE-LAUNCHES the dashboard (not a plain pop).
picker_routes:
  screen_id: countryPicker
  outbound_routes:
    - to: macro
      action: navigate
      trigger: country_row_tap
      params: { countryCode: "<picked code>" }
      transition: "navigate CountryMacroRoute(code) { popUpTo(CountryMacroRoute()){ inclusive = true } }"
      label: "Country row → rebuild dashboard on picked country (fresh VM)"
      flow: flow-macro
    - to: back
      action: navigate_back
      trigger: picker_back_tap
      label: "Back (popBackStackSafely) → dashboard (unchanged country)"
      flow: flow-macro

# Detail screen's own outbound (drill-down leaf)
detail_routes:
  screen_id: macroIndicatorDetail
  outbound_routes:
    - to: back
      action: navigate_back
      trigger: detail_back_tap
      label: "Back (popBackStackSafely) → macro dashboard"
      flow: flow-macro

# In-screen actions that do NOT navigate (refresh / retry / search / change-country re-run the fetch or filter)
in_screen_actions:
  - { screen: macro,                action: RefreshAll,         trigger: "refresh-all icon tap",           effect: "re-fetch all 3 World Bank indicators for the current country" }
  - { screen: macro,                action: "Retry{Indicator}", trigger: "per-card Retry button tap",       effect: "re-fetch that card's indicator only" }
  - { screen: macro,                action: ChangeCountry,      trigger: "picker returns a code (via nav)", effect: "cancel + re-subscribe all 3 streams on the new country" }
  - { screen: countryPicker,        action: Search,             trigger: "search text change",              effect: "filter SupportedCountries.search(query) in-process (no nav, no network)" }
  - { screen: macroIndicatorDetail, action: "Refresh/Retry",    trigger: "ScreenContent retry / refresh",   effect: "re-fetch the single (country, indicator) pair" }
