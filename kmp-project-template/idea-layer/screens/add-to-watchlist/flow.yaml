# flow.yaml — feature/add-to-watchlist navigation flow (Watchlist star toggle, WRITE side).
# Scaffolded from screens/watchlist/flow.yaml (the add-to-watchlist embedded node).
#
# The star is an EMBEDDED toggle, NOT a navigable destination. It is rendered inside
# feature/crypto's coin surfaces (CoinMarkets rows + Coin Detail Scaffold). Its only
# edge is the in-place membership toggle (add/remove via SubmitHandler); it never
# navigates. CryptoNavigation.kt notes the watchlist + coin-detail destinations are
# designed to nest in the crypto graph, so this embedded star lives alongside them.
screen_id: add-to-watchlist
feature_ref: feat-add-to-watchlist
graph_route: CryptoGraphRoute          # embedded within the crypto graph's coin surfaces
start_destination: n/a                 # embedded component — not a graph destination
flow_groups: [flow-watchlist-track]
participates_in_flows: [flow-watchlist-track]

entry_points:
  - id: hosted-on-coin-markets
    description: "Rendered as a trailing star on each feature/crypto CoinMarkets row."
    trigger: host_surface_visible
  - id: hosted-on-coin-detail
    description: "Rendered in the feature/crypto Coin Detail top bar / header."
    trigger: host_surface_visible

# The embedded star is a single node; route: none, no own Scaffold.
nodes:
  - { id: add-to-watchlist, route: none, screen: AddToWatchlistStar, embedded: true, host: "CoinMarketsScreen rows + CoinDetailScreen" }

# No inbound nav — it is composed into its host surfaces, never routed to.
inbound_routes: []

outbound_routes:
  # The only edge: tap the star → add()/remove() via SubmitHandler → contains() re-emits,
  # the star flips. In-place mutation, no navigation.
  - from: add-to-watchlist
    to: add-to-watchlist
    action: mutate_in_place
    trigger: star_toggle_tap
    params: { coinId: "{coinId}" }
    label: "Tap star → add()/remove() via SubmitHandler → contains() re-emits, star flips"
    flow: flow-watchlist-track
