# demo-data.yaml — feature/add-to-watchlist demo data (Watchlist star toggle, WRITE side).
# The persisted rows are LOCAL-ONLY Room rows on `personal_watchlist`
# (WatchlistEntity: coinId, addedAtMs). Only real CoinGecko coin identifiers are used.
# Scaffolded from screens/watchlist/demo-data.yaml.
schema_version: "1.0"
screen_id: add-to-watchlist

consumes:
  - collection: watchlist
    dto: WatchlistItem
    table: personal_watchlist
    used_by: [observe-contains, add-to-watchlist, remove-from-watchlist]

# Persisted watch-list membership (WatchlistEntity: coinId, addedAtMs).
# Real CoinGecko ids; addedAtMs newest-first (bitcoin most recently added).
# The star toggle reads contains(coinId) against these and writes add/remove.
samples:
  watchlist:
    - { coinId: "bitcoin",  addedAtMs: 1752710400000 }   # tracked → star_filled
    - { coinId: "ethereum", addedAtMs: 1752624000000 }   # tracked → star_filled
    - { coinId: "solana",   addedAtMs: 1752537600000 }   # tracked → star_filled

# Toggle demo scenarios:
#  - observe-contains("bitcoin")  → true  → star_filled (tap → remove → outline)
#  - observe-contains("dogecoin") → false → star_outline (tap → add(addedAtMs=now) → filled)
#  - re-tap is idempotent: add REPLACEs the row, remove no-ops if absent.
