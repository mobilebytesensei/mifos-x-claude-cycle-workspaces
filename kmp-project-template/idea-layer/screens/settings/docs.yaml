schema_version: "1.0"
screen_id: settings
feature_id: feat-settings
archetype: preferences-backed
flow: flow-settings
title: App Settings
purpose: >-
  App-level appearance and language settings, persisted entirely on-device with no
  login and no backend. Users pick a dark-mode preference (System default / Light /
  Dark) and an app language from a full locale list; on Android they can additionally
  choose a theme brand (Default / Android) and toggle Material You dynamic color.
  A companion Notification screen renders a static empty-state placeholder.
status: implemented
store_pattern: preferences               # multiplatform-settings — NOT Store5, NOT Room
persistence: "com.russhwolf.settings (plain user_data_key + secure secure_data_key)"
quality_score: 88
last_modified: "2026-08-01"

showcase_note: >-
  feature/settings is the kmp-project-template's canonical showcase of the
  "local preferences (multiplatform-settings)" persistence seam — distinct from the
  Store5/Room offline-first archetypes (B1 Loans, B7 Rates) and from the pure-local
  no-persistence archetype (B2 EMI Calculator). It demonstrates the split plain/secure
  Settings backends, a reactive StateFlow<UserData> surface, and per-field optimistic
  writes that drive the app theme app-wide (dark mode + dynamic color) and app
  localization (language) with zero network.

user_stories:
  - "As a user, I want to switch between light, dark, and system-default themes, so the app matches my preference."
  - "As an Android user, I want to enable Material You dynamic color, so the app adopts my wallpaper palette."
  - "As a user, I want to change the app language from a full list of locales, so I can use the app in my language."
  - "As a user, I want my appearance and language choices to persist across restarts without any account or sign-in."

success_metrics:
  - "Preference change is persisted and reflected app-wide within one frame (optimistic StateFlow re-emit)"
  - "Choices survive an app restart (encoded into the on-device Settings store before the StateFlow updates)"
  - "Works on all four platforms with identical behavior; theme-brand + dynamic-color controls correctly gated to Android"
  - "Zero backend calls — no secrets, no API key, no connectivity required"

business_logic_summary: >-
  SettingsScreen is a pure-UI host (no ViewModel) that opens two AlertDialog overlays.
  Both dialogs share a SettingsViewmodel that maps UserDataRepository.userData
  (StateFlow<UserData>) into UserEditableSettings and exposes settingsUiState
  (Loading | Success). Each selection calls a repository setter
  (setThemeBrand / setDarkThemeConfig / setDynamicColorPreference / setLanguage),
  which copies the field into UserData, encodes the blob into the plain + secure
  multiplatform-settings stores, and re-emits the StateFlow. An AnalyticsHelper logs
  each change. NotificationScreen is a static empty state with no data source.

components:
  - top_app_bar          # KptScaffold with back arrow (Settings + Notification)
  - card                 # AppCard rows (theme / language) + HeroCard (notification empty)
  - alert_dialog         # SettingsDialog + LanguageDialog + DevMenuDialog
  - radio_group          # theme-brand / dynamic-color / dark-mode / language choosers
  - icon
  - text
  - button

non_functional:
  - "Persistence via multiplatform-settings (com.russhwolf.settings) — plain store for UI prefs, secure store for auth fields (this feature touches only UI prefs)"
  - "No secrets, no keystore, no API key; no permissions required"
  - "i18n: all copy via compose-resources string keys (feature_settings_*) per RULE-IMPL-NO-HARDCODED-STRING-001 (KptScaffold titles 'Settings'/'Notification' are the only literal exceptions)"
  - "Accessibility: back button + trailing chevrons carry contentDescription; radio rows use Role.RadioButton via Modifier.selectable"
  - "Platform gating: theme-brand + dynamic-color rows only on Android (getPlatform() == Platform.Android) and dynamic-color additionally requires supportsDynamicTheming()"

data_requirements:
  # Preference keys/fields this feature reads and writes (serialized UserData blob).
  store: multiplatform-settings
  plain_key: user_data_key
  fields:
    - { name: themeBrand, type: ThemeBrand, values: [DEFAULT, ANDROID], default: DEFAULT, platform: android }
    - { name: useDynamicColor, type: Boolean, default: false, platform: android, gate: "brand == DEFAULT && supportsDynamicTheming()" }
    - { name: darkThemeConfig, type: DarkThemeConfig, values: [FOLLOW_SYSTEM, LIGHT, DARK], default: FOLLOW_SYSTEM, platform: all }
    - { name: appLanguage, type: LanguageConfig, default: DEFAULT, platform: all, note: "41 entries: DEFAULT (System Default) + 40 locales" }
  not_touched_by_feature:
    note: "UserData also carries auth/security fields (passcode, isAuthenticated, isUnlocked, isPasscodeEnabled, isBiometricsEnabled, enableScreenCapture, showOnboarding, firstTimeUser, activeUserId) in the secure store — the settings feature does NOT read or write these. (There is no core/auth or feature/auth module; these fields live only on UserData + UserDataRepository setters.)"

dependencies:
  tier: leaf
  upstream_features: []                  # entered from the authenticated navbar host; depends on no other feature's data
  core_modules_used:
    - "core/data (UserDataRepository)"
    - "core/datastore (UserPreferencesRepositoryImpl — multiplatform-settings)"
    - "core/model (UserData, ThemeBrand, DarkThemeConfig, LanguageConfig)"
    - "core-base/analytics (AnalyticsHelper, TrackScreenView, rememberAnalyticsHelper)"
    - "core/ui (KptScaffold)"
    - "core-base/designsystem (AppCard, HeroCard)"
    - "core/designsystem (AppIcons, spacing, KptTheme)"
    - "core-base/ui/nav (composableWithPushTransitions)"
  external_libraries:
    - "com.russhwolf.settings (multiplatform-settings) — local key-value persistence"
    - "org.koin (viewModelOf(::SettingsViewmodel))"
