acceptance_criteria:
  - ref: "AC-SET-01"
    name: "Change dark mode"
    given: "the user opens Settings → Change Theme"
    when: "the user selects Light, Dark, or System default"
    then: "the choice is persisted locally and the app theme updates app-wide with no network call"
  - ref: "AC-SET-02"
    name: "Change language"
    given: "the user opens Settings → Change Language"
    when: "the user selects a language from the list"
    then: "the choice is persisted locally and the app relocalizes"
  - ref: "AC-SET-03"
    name: "Android-only theming controls"
    given: "the user is not on Android"
    when: "the SettingsDialog renders"
    then: "the theme-brand and dynamic-color choosers are hidden; only dark-mode is shown"
  - ref: "AC-SET-04"
    name: "Persisted across restart"
    given: "the user changed appearance or language preferences"
    when: "the app is relaunched"
    then: "the previously chosen preferences are restored from the on-device Settings store"
  - ref: "AC-SET-05"
    name: "Return to caller"
    given: "the user is on the Settings screen"
    when: "the user taps the back arrow"
    then: "the app pops back to the navbar host that launched Settings"
