interactions:
  - component: "top_app_bar back (icon_button) on SettingsScreen"
    trigger: "tap"
    name: "tapping back pops the back stack"
    expected: "nav: back"
    assertions:
      - "onBackClick invoked → popBackStackSafely returns to the navbar host"
  - component: "Change Theme card"
    trigger: "tap"
    name: "opens the theme SettingsDialog"
    expected: "showSettingsDialog = true; logSettingsDialogVisible(true)"
    assertions:
      - "SettingsDialog composes over the list"
  - component: "Change Language card"
    trigger: "tap"
    name: "opens the LanguageDialog"
    expected: "showLanguageDialog = true; logLanguageDialogVisible(true)"
    assertions:
      - "LanguageDialog composes over the list"
  - component: "Dark mode radio (SettingsDialog)"
    trigger: "select Dark"
    name: "selecting a dark-mode option persists it"
    expected: "viewModel.updateDarkThemeConfig(DarkThemeConfig.DARK)"
    assertions:
      - "repository.setDarkThemeConfig(DARK) called → UserData.darkThemeConfig becomes DARK"
      - "settingsUiState re-emits Success with darkThemeConfig = DARK"
      - "analyticsHelper logs dark_theme_config_changed"
  - component: "Theme brand radio (SettingsDialog, Android)"
    trigger: "select Android"
    name: "selecting a theme brand persists it"
    expected: "viewModel.updateThemeBrand(ThemeBrand.ANDROID)"
    assertions:
      - "repository.setThemeBrand(ANDROID) called → UserData.themeBrand becomes ANDROID"
      - "analyticsHelper logs theme_brand_changed"
  - component: "Dynamic color radio (SettingsDialog, Android + DEFAULT brand)"
    trigger: "select Yes"
    name: "toggling dynamic color persists it"
    expected: "viewModel.updateDynamicColorPreference(true)"
    assertions:
      - "repository.setDynamicColorPreference(true) called → UserData.useDynamicColor becomes true"
      - "the dynamic-color group is only visible when brand == DEFAULT && supportDynamicColor"
  - component: "Language radio (LanguageDialog)"
    trigger: "select French"
    name: "selecting a language persists it"
    expected: "viewModel.updateLanguage(LanguageConfig.FRENCH)"
    assertions:
      - "repository.setLanguage(FRENCH) called → UserData.appLanguage becomes FRENCH"
      - "analyticsHelper logs language_changed with locale 'fr'"
  - component: "version footer label"
    trigger: "long-press (debug build)"
    name: "long-pressing the footer opens the dev menu"
    expected: "showDevMenu = true (only when a gallery callback is non-null)"
    assertions:
      - "DevMenuDialog lists Transition Gallery + State Gallery"
      - "in release builds both callbacks are null so the long-press handler is not wired"

persistence:
  - name: "preference writes survive a repository reload"
    setup: "setDarkThemeConfig(DARK) then reconstruct the repository (loadCombinedUserData)"
    assertions:
      - "the reloaded UserData still has darkThemeConfig == DARK (encoded into the plain Settings store)"
    note: "Grounded in UserPreferencesRepositoryImpl.updatePreference (encodeValue before StateFlow update)."
  - name: "defaults come from UserData.DEFAULT on a fresh install"
    setup: "no prior Settings data"
    assertions:
      - "themeBrand == DEFAULT, darkThemeConfig == FOLLOW_SYSTEM, useDynamicColor == false, appLanguage == DEFAULT"

acceptance_criteria:
  - ref: "AC-SET-01"
    name: "Change dark mode"
    given: "the user opens Settings → Change Theme"
    when: "the user selects Light, Dark, or System default"
    then: "the choice is persisted locally and the app theme updates app-wide with no network call"
  - ref: "AC-SET-02"
    name: "Change language"
    given: "the user opens Settings → Change Language"
    when: "the user selects a language from the list"
    then: "the choice is persisted locally and the app relocalizes"
  - ref: "AC-SET-03"
    name: "Android-only theming controls"
    given: "the user is not on Android"
    when: "the SettingsDialog renders"
    then: "the theme-brand and dynamic-color choosers are hidden; only dark-mode is shown"
  - ref: "AC-SET-04"
    name: "Persisted across restart"
    given: "the user changed appearance or language preferences"
    when: "the app is relaunched"
    then: "the previously chosen preferences are restored from the on-device Settings store"
  - ref: "AC-SET-05"
    name: "Return to caller"
    given: "the user is on the Settings screen"
    when: "the user taps the back arrow"
    then: "the app pops back to the navbar host that launched Settings"
