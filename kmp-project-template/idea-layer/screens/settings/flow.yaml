# flow.yaml — feature/settings navigation flow (App Settings).
# Grounded in feature/settings/SettingsRoute.kt (settingsDestination / notificationDestination)
# + cmp-navigation/.../authenticated/AuthenticatedNavigation.kt (settingsDestination wiring,
#   onBackClick = popBackStackSafely(), dev-only gallery callbacks)
# + cmp-navigation/.../authenticatednavbar/AuthenticatedNavbarNavigation.kt (navigateToSettingsScreen).
screen_id: settings
feature_ref: feat-settings
flow_groups: [flow-settings]
participates_in_flows: [flow-settings]

entry_points:
  - id: from-authenticated-navbar
    description: >-
      Launched from the authenticated navbar host (home/dashboard chrome) via the
      onSettingsClick → navigateToSettingsScreen callback, which calls
      navController.navigateToSettings() to push SettingsRoute.
    trigger: settings_tap
  - id: back-from-dialog
    description: "Theme/Language dialogs are in-screen overlays (rememberSaveable) — dismissing returns to the same SettingsScreen, not a nav pop."
    trigger: dialog_dismiss

# Screen / route nodes. SettingsRoute + NotificationRoute are parameterless @Serializable
# data objects. The theme + language panels are AlertDialog overlays (no route).
nodes:
  - { id: settings,        route: SettingsRoute,     screen: SettingsScreen,     kind: destination }
  - { id: theme-dialog,    route: null,              screen: SettingsDialog,     kind: dialog_overlay }
  - { id: language-dialog, route: null,              screen: LanguageDialog,     kind: dialog_overlay }
  - { id: notification,    route: NotificationRoute, screen: NotificationScreen, kind: destination }

inbound_routes:
  - from: authenticated-navbar        # home/dashboard chrome
    to: settings
    trigger: settings_icon_tap
    flow: flow-settings
    note: >-
      AuthenticatedNavigation wires navigateToSettingsScreen = navController::navigateToSettings
      into authenticatedNavbarGraph; settingsDestination(onBackClick = { popBackStackSafely() })
      registers the SettingsRoute destination with dev-only gallery callbacks (onTransitionGalleryClick,
      onStateGalleryClick — non-null only in non-release builds).

outbound_routes:
  # ── from settings ──
  - from: settings
    to: theme-dialog
    action: open_dialog
    trigger: change_theme_card_tap
    label: "Change Theme card → SettingsDialog overlay (showSettingsDialog = true)"
    flow: flow-settings
  - from: settings
    to: language-dialog
    action: open_dialog
    trigger: change_language_card_tap
    label: "Change Language card → LanguageDialog overlay (showLanguageDialog = true)"
    flow: flow-settings
  - from: settings
    to: dev-menu                       # DevMenuDialog → feature/showcase galleries (debug builds only)
    action: open_dialog
    trigger: version_footer_long_press
    label: "Version footer long-press → DevMenuDialog (Transition Gallery / State Gallery). Non-release only; null in release."
    flow: ad-hoc
  - from: settings
    to: authenticated-navbar
    action: navigate_back
    trigger: back_tap
    target_kind: shell-container      # NOT a screen — this is a shell-return, not a dead nav target
    label: "Back (TopAppBar arrow) → popBackStackSafely() → returns to the navbar host"
    note: >-
      'authenticated-navbar' is the app shell CONTAINER (AuthenticatedNavbarNavigationScreen /
      bottom-nav host), NOT a routable sibling screen. This edge is a SHELL-RETURN via
      popBackStackSafely() to whatever navbar-tab surface Settings was pushed over — it must
      NOT be flagged as a dead/unresolved nav target by the route→screen index (there is no
      'authenticated-navbar.yaml' screen file and none is expected).
    flow: flow-settings

  # ── from theme-dialog / language-dialog (overlays, dismissed in place) ──
  - from: theme-dialog
    to: settings
    action: dismiss_dialog
    trigger: ok_or_scrim_tap
    label: "OK / dismiss → showSettingsDialog = false → back to the list (no nav pop)"
    flow: flow-settings
  - from: language-dialog
    to: settings
    action: dismiss_dialog
    trigger: ok_or_scrim_tap
    label: "OK / dismiss → showLanguageDialog = false → back to the list (no nav pop)"
    flow: flow-settings

  # ── notification (declared sibling destination) ──
  - from: notification
    to: caller
    action: navigate_back
    trigger: back_tap
    label: "Back → popBackStackSafely(). NotificationScreen is a registered destination (notificationDestination / navigateToNotification) with a static empty state."
    flow: flow-settings

# Route params — both destinations are parameterless @Serializable data objects.
routes:
  - { type: SettingsRoute,     serializable: true, params: [] }
  - { type: NotificationRoute, serializable: true, params: [] }
