schema_version: '1.0'
contract_version: "2.0.0"   # backfilled to VERSION_MANIFEST#contract_versions.current (schema-contract migration, Phase 6 T3 — clears /idea approve BLOCK_LEGACY)
screen_id: bills-list
feature_id: feat-bills
archetype: screen-content
flow: flow-bills-browse
title: Bill Reminders (B4 Bill Reminders)
purpose: >-
  Track recurring (and one-time) bills locally — name, amount, due-day, recurrence, category,
  and a per-bill reminder lead-time. A purely offline feature (Room + Store5, no backend): browse
  the bill dashboard with an "upcoming this month" summary tile, add / edit bills through an
  offline-resilient DraftSubmitHandler form, mark a bill paid from the list, and schedule an
  in-app / OS notification (best-effort, per-platform) that fires reminderDaysBefore days before
  each bill's next due-date.
status: approved
source_of_truth: source            # imported FROM shipped source, not FROM idea-layer
quality_score: 92
last_modified: '2026-08-01'

# ── B4 showcase note (why this feature exists in the Money Toolkit template) ──
showcase:
  toolkit_id: B4
  name: "Bill Reminders"
  patterns_demonstrated:
    - "DraftSubmitHandler (offline-resilient form) — per template CLAUDE.md feature showcase"
    - "SECOND multi-formKey BaseDraftMutationViewModel (EditBillReminderViewModel) — concurrent offline drafts, one per bill (formKey='bill', uniqueKey=billId)"
    - "OFFLINE_LOCAL_ONLY Store5 store (BillRemindersStore, key=Unit → List<BillReminderEntity>)"
    - "combine() of 3 reactive repository Flows (all + upcoming + total) → one ScreenState.Content"
    - "Platform notification scheduling via expect/actual BillReminderScheduler behind a feature-local mockable BillNotificationGateway seam"
    - "Feature-local pure recurrence math (BillReminderRecurrence: next due-date + month-end clamp + 09:00 trigger)"
  store_archetype: OFFLINE_LOCAL_ONLY
  note: >-
    The distinguishing B4 pattern over B1 (loans) is the platform notification side-effect: the
    submit is TWO operations — a local Room upsert plus a best-effort OS notification schedule.
    The scheduler is an expect/actual (WorkManager on Android, UNUserNotificationCenter on iOS,
    no-op stubs on Desktop/JS/WasmJS), wrapped in a small feature-local interface so the
    ViewModel depends on something mockable in tests.

