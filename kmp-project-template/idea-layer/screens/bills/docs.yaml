schema_version: '1.0'
screen_id: bills-list
feature_id: feat-bills
archetype: screen-content
flow: flow-bills-browse
title: Bill Reminders (B4 Bill Reminders)
purpose: >-
  Track recurring (and one-time) bills locally — name, amount, due-day, recurrence, category,
  and a per-bill reminder lead-time. A purely offline feature (Room + Store5, no backend): browse
  the bill dashboard with an "upcoming this month" summary tile, add / edit / delete / mark-paid /
  enable-disable bills through an offline-resilient DraftSubmitHandler form, and schedule an
  in-app / OS notification (best-effort, per-platform) that fires reminderDaysBefore days before
  each bill's next due-date.
status: reverse-engineered
source_of_truth: source            # imported FROM shipped source, not FROM idea-layer
quality_score: 90
last_modified: '2026-07-25'

# ── B4 showcase note (why this feature exists in the Money Toolkit template) ──
showcase:
  toolkit_id: B4
  name: "Bill Reminders"
  patterns_demonstrated:
    - "DraftSubmitHandler (offline-resilient form) — per template CLAUDE.md feature showcase"
    - "SECOND multi-formKey BaseDraftMutationViewModel (EditBillReminderViewModel) — concurrent offline drafts, one per bill (formKey='bill', uniqueKey=billId)"
    - "OFFLINE_LOCAL_ONLY Store5 store (BillRemindersStore, key=Unit → List<BillReminderEntity>)"
    - "combine() of 3 reactive repository Flows (all + upcoming + total) → one ScreenState.Content"
    - "Platform notification scheduling via expect/actual BillReminderScheduler behind a feature-local mockable BillNotificationGateway seam"
    - "Feature-local pure recurrence math (BillReminderRecurrence: next due-date + month-end clamp + 09:00 trigger)"
  store_archetype: OFFLINE_LOCAL_ONLY
  note: >-
    The distinguishing B4 pattern over B1 (loans) is the platform notification side-effect: the
    submit is TWO operations — a local Room upsert plus a best-effort OS notification schedule.
    The scheduler is an expect/actual (WorkManager on Android, UNUserNotificationCenter on iOS,
    no-op stubs on Desktop/JS/WasmJS), wrapped in a small feature-local interface so the
    ViewModel depends on something mockable in tests.

components:
  - top_app_bar
  - extended_fab
  - hero_card
  - amount_display
  - lazy_column
  - app_card
  - urgency_dot
  - status_chip
  - money_text
  - text_button
  - outlined_text_field
  - radio_button
  - filter_chip
  - switch
  - button
  - circular_progress_indicator

screens_summary:
  - { id: bills-list,   composable: BillRemindersListScreen,     viewmodel: BillRemindersListViewModel, states: "loading, content, empty, error" }
  - { id: bill-addedit, composable: AddOrEditBillReminderScreen, viewmodel: EditBillReminderViewModel,  states: "content, submitting, submitted, failed" }

user_stories:
  - "As a user, I want to see all my bills with amount and how soon they're due so I never miss a payment."
  - "As a user, I want a reminder notification a few days before each bill is due."
  - "As a user, I want to add a bill with its recurrence (monthly / quarterly / annually / one-time) and category."
  - "As a user, I want to mark a bill paid, disable a reminder without deleting it, or delete it entirely."
  - "As a user, I want my edits to survive being offline — nothing lost even if I edit several bills without a connection."

metrics:
  - "bills_added / bills_edited / bills_deleted / bills_marked_paid"
  - "reminders_scheduled / reminders_cancelled"
  - "avg_active_bills_per_user"
  - "add_edit_form_completion_rate"
  - "offline_draft_recovery_rate (drafts committed on reconnect)"
  - "notification_schedule_success_rate (OS-permission-gated)"

data_model:
  entity: BillReminder
  table: banking_bill_reminders
  fields:
    - { name: id, type: String, note: "client UUID, primary key" }
    - { name: name, type: String }
    - { name: amount, type: Double }
    - { name: dueDay, type: Int, note: "day-of-month 1..31; month-end clamp applied at scheduling time" }
    - { name: recurrence, type: "Recurrence (MONTHLY|QUARTERLY|ANNUALLY|ONCE)" }
    - { name: category, type: "BillCategory (UTILITIES|HOUSING|TRANSPORT|FOOD|SUBSCRIPTIONS|OTHER)" }
    - { name: enabled, type: Boolean, default: "true", note: "disabled bills persist but fire no notification" }
    - { name: reminderDaysBefore, type: Int, default: "1", note: "0..30 lead time before dueDay" }
    - { name: createdAtMs, type: Long }
    - { name: updatedAtMs, type: Long }

platform_dependencies:
  capability: notification_scheduling
  contract: BillReminderScheduler        # core/platform/notification/bill/ (expect/actual)
  seam: BillNotificationGateway          # feature/bills/notification/ (mockable interface + Impl)
  payload: BillReminderSchedule          # {billId, title, body, triggerAtMs}
  di: "BillsModule includes(notificationModule); single<BillNotificationGateway> { BillNotificationGatewayImpl(get()) }"
  actuals:
    android: "WorkManager OneTimeWorkRequest (REPLACE) → BillReminderWorker; survives process death"
    ios: "UNUserNotificationCenter calendar trigger; needs runtime permission"
    desktop: "no-op stub (in-app banner only)"
    js: "no-op stub (Service Worker deferred)"
    wasmJs: "no-op stub"

notes:
  - "This is a tracker + reminder scheduler, not a live ledger — amounts and due-days are user-entered."
  - "No auth, no backend, no remote sync. Forks can swap repository.upsert for a remote API with zero ViewModel changes."
  - "Two screens only — a bill row short-tap opens the edit form directly; there is NO separate detail screen."
  - "BillRemindersAction.Delete and .ToggleEnabled are ViewModel APIs (fully tested) but not yet surfaced as row controls in the shipped list UI — only the Paid button + row-tap-to-edit are wired."
  - "mark-paid is a bump (updatedAtMs) + cancel today — per-row lastPaidAtMs is a declared future extension; recurring bills derive next-due from dueDay, not stored state."
