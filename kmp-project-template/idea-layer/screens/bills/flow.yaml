# flow.yaml — feature/bills navigation flow (B4 Bill Reminders).
# Grounded in feature/bills/navigation/BillsNavigation.kt (billsGraph).
# Graph route: BillsGraphRoute → startDestination BillRemindersListRoute.
# NOTE: two screens only — a bill row short-tap opens the edit form directly (no detail screen).
screen_id: bills-list
feature_ref: feat-bills
graph_route: BillsGraphRoute
start_destination: BillRemindersListRoute
flow_groups: [flow-bills-browse, flow-bills-manage]
participates_in_flows: [flow-bills-browse, flow-bills-manage]

entry_points:
  - id: from-home
    description: "Home dashboard → Bills (navigateToBills / BillsGraphRoute)."
    trigger: navigate_to_bills
  - id: back-from-addedit
    description: "Return to list after a save (Saved ✓) or back from the add/edit form."
    trigger: on_saved_or_back

# Screen nodes in this feature graph.
nodes:
  - { id: bills-list,   route: BillRemindersListRoute,          screen: BillRemindersListScreen }
  - { id: bill-addedit, route: "AddOrEditBillReminderRoute(billId?)", screen: AddOrEditBillReminderScreen }

inbound_routes:
  - from: home            # feature/home dashboard (Money Toolkit home)
    to: bills-list
    trigger: view_bills
    flow: flow-bills-browse

outbound_routes:
  # ── from bills-list ──
  - from: bills-list
    to: bill-addedit
    action: navigate
    trigger: new_bill_fab_tap
    params: { billId: null }
    label: "New bill FAB → Add bill reminder form"
    flow: flow-bills-manage
  - from: bills-list
    to: bill-addedit
    action: navigate
    trigger: bill_row_tap
    params: { billId: "{bill.id}" }
    label: "Bill row (short-tap) → Edit bill reminder form (edit mode)"
    flow: flow-bills-manage
  - from: bills-list
    to: bills-list
    action: mutate_in_place
    trigger: mark_paid_tap
    label: "Paid button → upsert(updatedAtMs=now) + cancel notification → stream re-emits"
    flow: flow-bills-manage
  - from: bills-list
    to: home
    action: navigate_back
    trigger: back_tap
    label: "Back → Home dashboard"
    flow: flow-bills-browse

  # ── from bill-addedit ──
  - from: bill-addedit
    to: bill-addedit
    action: mutate_in_place
    trigger: on_saved
    label: "Save success (SubmitState.Submitted) → status line shows Saved ✓ + 'Add another' (does NOT auto-pop)"
    flow: flow-bills-manage
  - from: bill-addedit
    to: bills-list
    action: navigate_back
    trigger: back_tap
    label: "Back → Bills list"
    flow: flow-bills-manage

# NOTE (F-009): BillRemindersAction.Delete and .ToggleEnabled are fully-tested ViewModel
# APIs but have NO trigger in BillRemindersListScreen, so there are NO delete / toggle
# outbound routes here — only new-bill FAB, row-tap-to-edit, mark-paid, and back are wired.
