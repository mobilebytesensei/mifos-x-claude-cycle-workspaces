schema_version: "1.0"
# ─────────────────────────────────────────────────────────────────────────────
# feature/bills — B4 Bill Reminders (reverse-engineered from source).
# Recurring bill tracker with in-app + OS notification scheduling, tracked
# LOCALLY only. No backend, no network — Room + Store5 (OFFLINE_LOCAL_ONLY),
# plus a platform notification-scheduling side-effect (expect/actual scheduler).
#
# One feature, TWO screens (declared in screens[]):
#   bills-list    → BillRemindersListScreen   (list dashboard, read side)
#   bill-addedit  → AddOrEditBillReminderScreen (input form, write side, DraftSubmitHandler)
#
# GROUNDED: only screens / actions / fields that exist in source are represented.
# There is NO bill-detail screen — a row short-tap opens the edit form directly.
# ─────────────────────────────────────────────────────────────────────────────
screen_id: bills-list             # primary entry screen of the feature
feature: feat-bills
archetype: screen-content
platforms: [android, ios, desktop, web]
states: [loading, content, empty, error]
# Data-backed: the dashboard combines three repository Flows, so it opens in
# loading until the first combine() emission (then content / empty).
initial_state: loading

business_logic:
  kind: crud
  processing_kind: reactive_local
  library_refs: [store5, room]
  external_library_refs: [store5]
  description: >-
    Recurring bill-reminder tracker with purely local persistence — NO backend, NO network.
    The list dashboard reads reactively by combining three repository Flows —
    observeAll() + observeUpcoming(7) + observeTotalUpcomingAmount(30) — into one
    BillRemindersUiState surfaced as a single ScreenState.Content (Empty when zero bills).
    Reads flow from a Room-backed Store5 OFFLINE_LOCAL_ONLY store (BillRemindersStore,
    key=Unit → List<BillReminderEntity>) via BillReminderRepository. Writes (create / edit,
    delete, mark-paid, toggle-enabled) go through repository.upsert / repository.delete on the
    banking_bill_reminders Room table. The add/edit form wraps its local upsert in the
    framework DraftSubmitHandler (BaseDraftMutationViewModel, formKey="bill",
    uniqueKey=billId|"new") so the Saving…/Saved ✓/Saved-offline UX applies even though the
    "submit" is a local commit. On submit the ViewModel ALSO computes the next due-date
    (recurrence math: MONTHLY/QUARTERLY/ANNUALLY/ONCE + month-end clamp) and hands a
    BillReminderSchedule to the platform BillReminderScheduler (via BillNotificationGateway)
    so the OS fires an in-app / system notification reminderDaysBefore days before the bill
    is due — best-effort: if the OS rejects it (permission), the bill still persists and the
    in-app upcoming-bills tile is the fallback reminder.

# The Room table backing every read/write in this feature.
data_source:
  kind: local_room
  store: BillRemindersStore                 # core/store/demo/banking/impl/BillRemindersStore.kt
  store_archetype: OFFLINE_LOCAL_ONLY
  repository: BillReminderRepository        # core/data/demo/banking/BillReminderRepository.kt
  table: banking_bill_reminders             # core/database/demo/banking/entity/BillReminderEntity.kt
  dto: BillReminder                         # core/model/demo/banking/BillReminder.kt
  remote: none

# Platform capability this feature consumes beyond Room (the B4 distinguishing pattern).
platform_capabilities:
  - capability: notification_scheduling
    contract: BillReminderScheduler         # core/platform/notification/bill/BillReminderScheduler.kt (expect/actual)
    seam: BillNotificationGateway           # feature/bills/notification/BillNotificationGateway.kt (mockable interface)
    payload: BillReminderSchedule           # {billId, title, body, triggerAtMs}
    actuals:
      android: "WorkManager OneTimeWorkRequest → BillReminderWorker (survives process death)"
      ios: "UNUserNotificationCenter calendar trigger (needs permission)"
      desktop: "best-effort no-op stub (in-app banner only)"
      web: "no-op stub (Service Worker deferred)"
    note: "schedule() is best-effort — permission-denied / past-instant → silent no-op; bill still persists."

# ═════════════════════════════════════════════════════════════════════════════
# SCREENS
# ═════════════════════════════════════════════════════════════════════════════
screens:

  # ───────────────────────────────────────────────────────────────────────────
  # 1) BillRemindersListScreen — the bill dashboard (list, read side)
  # ───────────────────────────────────────────────────────────────────────────
  - screen_id: bills-list
    composable: BillRemindersListScreen
    viewmodel: BillRemindersListViewModel
    route: BillRemindersListRoute
    archetype: screen-content
    states: [loading, content, empty, error]
    initial_state: loading
    business_logic:
      kind: list
      processing_kind: reactive_local
      library_refs: [store5, room]
      description: >-
        combine(observeAll(), observeUpcoming(7), observeTotalUpcomingAmount(30)) →
        BillRemindersUiState projected to ScreenState. Zero bills → Empty; any bills → Content.
        A summary HeroCard shows the total amount due in the next 30 days plus an "N bills due
        in next 7 days" supporting line. Each bill renders as an AppCard row: leading UrgencyDot,
        name, amount (MoneyText, negative tone), a due-relative StatusChip (Overdue/Today/
        Tomorrow/Due in Nd) whose intent is colour-coded by days-until-due, a category StatusChip,
        a "Paid" action button, and a "Reminders disabled" caption when enabled=false. Rows are
        sorted by dueDay ASC then createdAtMs ASC (DAO default order).
    shell:
      top_app_bar:
        enabled: true
        title: "Bill Reminders"        # screens_bills_list_title
        leading:
          - type: icon_button
            icon: arrow_back
            aria_label: "Back"          # screens_bills_list_back_cd
            on_click:
              action: "navigate_back"
              action_contract:
                effect: navigate
                description: "popBackStackSafely() to the previous destination (Home dashboard)."
      fab:
        type: extended_fab
        label: "New bill"               # screens_bills_list_new_fab_text
        icon: add
        test_tag: bills_list_fab
        on_click:
          action: "navigate"
          target: "bill-addedit"
          params: { billId: null }
          action_contract:
            effect: navigate
            description: "Navigate to AddOrEditBillReminderRoute(billId=null) to add a brand-new bill reminder."
    components:
      - id: summary_hero
        type: hero_card
        description: "Upcoming tile: total amount due in next 30 days (AmountDisplay) + '{upcomingCount} bill(s) due in next 7 days' supporting line."
        binds:
          - { field: totalUpcomingAmount, from: observeTotalUpcomingAmount }
          - { field: upcoming.size, label: "bill(s) due in next 7 days" }   # screens_bills_list_summary_due_single|plural
      - id: bill_row
        type: list_item
        variant: bill_reminder_row_card
        test_tag: "bills_list_row_{bill.id}"
        repeat_for: all
        description: "Per-bill AppCard: UrgencyDot + name + amount; due-relative StatusChip (colour-coded by dueDay-today) + category StatusChip + Paid button; 'Reminders disabled' caption when !enabled."
        on_click:
          action: "navigate"
          target: "bill-addedit"
          params: { billId: "{bill.id}" }
          action_contract:
            effect: navigate
            description: "Short-tap a row → navigate to AddOrEditBillReminderRoute(billId) — the edit form hydrates from repository.getById(billId). There is no separate detail screen."
      - id: mark_paid_button
        type: text_button
        label: "Paid"                   # screens_bills_list_paid_button
        icon: check_circle
        aria_label: "Mark paid"         # screens_bills_list_mark_paid_cd
        on_click:
          action: "mark_paid"
          params: { id: "{bill.id}" }
          action_contract:
            effect: write
            writes_to:
              - { table: banking_bill_reminders, dto: BillReminder, op: upsert }
            platform_effect:
              capability: notification_scheduling
              op: cancel
            description: >-
              viewModel.onMarkPaid(id) → BillRemindersAction.MarkPaid → repository.getById(id) →
              repository.upsert(existing.copy(updatedAtMs=now)) (bumps the row so it sorts to
              'recently touched'), then scheduler.cancel(id) to drop the pending notification —
              the next edit / app-launch re-registers a fresh reminder.
      - id: reminder_enabled_toggle
        type: switch
        label: "Reminders"              # screens_bills_list_reminders_toggle_label
        aria_label: "Toggle reminders"  # screens_bills_list_toggle_enabled_cd
        test_tag: "bills_list_toggle_{bill.id}"
        binds: [{ field: "bill.enabled" }]
        value_source: "bill.enabled"
        on_change:
          action: "toggle_enabled"
          params: { id: "{bill.id}" }
          action_contract:
            effect: write
            writes_to:
              - { table: banking_bill_reminders, dto: BillReminder, op: upsert }
            platform_effect:
              capability: notification_scheduling
              op: "cancel (when toggled off) | re-registered on next edit / app-launch (when toggled on)"
            description: >-
              viewModel.onToggleEnabled(id) → BillRemindersAction.ToggleEnabled → repository.getById(id) →
              repository.upsert(existing.copy(enabled = !existing.enabled, updatedAtMs = now)); when the new
              value is disabled, scheduler.cancel(id) drops the pending notification and the row shows the
              'Reminders disabled' caption. Re-enabling re-registers a fresh reminder on the next edit / app-launch.
      - id: delete_button
        type: icon_button
        icon: delete_outline
        aria_label: "Delete bill"       # screens_bills_list_delete_cd
        test_tag: "bills_list_delete_{bill.id}"
        on_click:
          action: "delete"
          params: { id: "{bill.id}" }
          action_contract:
            effect: write
            writes_to:
              - { table: banking_bill_reminders, dto: BillReminder, op: delete }
            platform_effect:
              capability: notification_scheduling
              op: cancel
            description: >-
              viewModel.onDelete(id) → BillRemindersAction.Delete → repository.delete(id) removes the row from
              banking_bill_reminders (the combine() stream re-emits without it), then scheduler.cancel(id) drops
              any pending notification. Destructive — gated by a confirm dialog before the action fires.
    state_model:
      viewmodel_base: "BaseViewModel<Unit, Nothing, BillRemindersAction>"
      screen_state: "StateFlow<ScreenState<BillRemindersUiState>>"
      initial: ScreenState.Loading
      states:
        loading:
          when: "combine() has not yet emitted"
          render: "ScreenContent Loading (framework default skeleton/spinner)"
        content:
          when: "observeAll() emits a non-empty list"
          render: "summary HeroCard + LazyColumn of BillReminderRow, dueDay-ascending"
          data: BillRemindersUiState
        empty:
          when: "observeAll() emits an empty list"
          render: "framework ScreenState.Empty default (no bills yet)"
        error:
          when: "ScreenContent error slot (onRetry is a no-op — local source rarely errors)"
          render: "framework ScreenContent error surface"
      ui_state:
        name: BillRemindersUiState
        fields:
          - { name: all, type: "List<BillReminder>" }
          - { name: upcoming, type: "List<BillReminder>", note: "due within next 7 days" }
          - { name: totalUpcomingAmount, type: Double, note: "sum(amount) due within next 30 days" }
      actions:
        - { name: "BillRemindersAction.MarkPaid", params: { billId: String }, effect: "repository.upsert(copy(updatedAtMs=now)) + scheduler.cancel(billId)" }
        - { name: "BillRemindersAction.Delete", params: { billId: String }, effect: "repository.delete(billId) + scheduler.cancel(billId)", note: "Surfaced as the row delete_button (destructive, confirm-gated) in the bills-list row spec." }
        - { name: "BillRemindersAction.ToggleEnabled", params: { billId: String }, effect: "repository.upsert(copy(enabled=!enabled)) + scheduler.cancel when disabling", note: "Surfaced as the row reminder_enabled_toggle switch in the bills-list row spec." }

  # ───────────────────────────────────────────────────────────────────────────
  # 2) AddOrEditBillReminderScreen — create/edit form (input, write side, DraftSubmitHandler)
  # ───────────────────────────────────────────────────────────────────────────
  - screen_id: bill-addedit
    composable: AddOrEditBillReminderScreen
    viewmodel: EditBillReminderViewModel
    route: AddOrEditBillReminderRoute
    route_args: { billId: "String?" }   # null → add; non-null → edit
    archetype: input
    states: [content, submitting, submitted, failed]
    business_logic:
      kind: crud
      processing_kind: draft_mutation
      library_refs: [store5, room]
      external_library_refs: [store5]
      description: >-
        The SECOND multi-formKey BaseDraftMutationViewModel showcase (after EditLoanViewModel).
        billId==null → add (uniqueKey="new"); billId!=null → edit (form hydrated once via
        repository.getById(billId) in init). formKey="bill" groups every bill draft; uniqueKey
        partitions per-bill so N concurrent offline edits coexist as N independent PENDING drafts
        in the shared SubmitOutbox (OutboxQualifiers.BillReminder). onSubmit() validates
        (name non-blank AND amount > 0), snapshots the form to a BillReminder payload
        (id = billId ?: randomId()), then super.onSubmit(payload) → performSubmit. performSubmit
        does TWO things: (1) repository.upsert(payload) — local Room commit; (2) if enabled,
        computes nextDueDate + reminderTriggerMs and calls scheduler.schedule(BillReminderSchedule);
        if disabled, scheduler.cancel(payload.id). autoSaveDraft=true — a categorized-Network
        submit failure silently auto-saves the draft (Saved-offline UX). The form has four
        sections: Basic info (name/amount/dueDay), Recurrence (radio: Monthly/Quarterly/Annually/
        One-time), Category (filter chips: Utilities/Housing/Transport/Food/Subscriptions/Other),
        Reminder settings (remindDaysBefore field + Enabled switch).
    shell:
      top_app_bar:
        enabled: true
        title_add: "New bill reminder"   # screens_bills_add_title
        title_edit: "Edit bill reminder" # screens_bills_edit_title
        leading:
          - type: icon_button
            icon: arrow_back
            aria_label: "Back"          # screens_bills_addedit_back_cd
            on_click:
              action: "navigate_back"
              action_contract: { effect: navigate, description: "popBackStackSafely()." }
    components:
      # ── Basic info section ──
      - { id: name_field, type: text_field, label: "Name (e.g. Electricity)", binds: [{ field: name }], on_change: onNameChange, disabled_when: isSubmitting }
      - { id: amount_field, type: decimal_field, label: "Amount", binds: [{ field: amount }], on_change: onAmountChange, disabled_when: isSubmitting }
      - { id: due_day_field, type: number_field, label: "Due day of month (1-31)", binds: [{ field: dueDay }], on_change: onDueDayChange, note: "coerced to 1..31" }
      # ── Recurrence section (radio group) ──
      - id: recurrence_radios
        type: radio_group
        title: "Recurrence"              # screens_bills_addedit_recurrence_title
        options: [Monthly, Quarterly, Annually, One-time]   # Recurrence.{MONTHLY,QUARTERLY,ANNUALLY,ONCE}
        binds: [{ field: recurrence }]
        on_change: onRecurrenceChange
      # ── Category section (filter chips) ──
      - id: category_chips
        type: filter_chip_group
        title: "Category"               # screens_bills_addedit_category_title
        options: [Utilities, Housing, Transport, Food, Subscriptions, Other]  # BillCategory enum
        binds: [{ field: category }]
        on_change: onCategoryChange
      # ── Reminder settings section ──
      - { id: remind_days_before_field, type: number_field, label: "Remind days before", binds: [{ field: reminderDaysBefore }], on_change: onReminderDaysBeforeChange, note: "coerced to 0..30" }
      - id: enabled_switch
        type: switch
        label: "Enabled"               # screens_bills_addedit_enabled_label
        binds: [{ field: enabled }]
        on_change: onEnabledChange
        description: "When off, the bill persists silently — performSubmit calls scheduler.cancel instead of schedule."
      # ── Submit + status ──
      - id: submit_button
        type: button
        label: "Save"                   # screens_bills_addedit_save_button
        test_tag: bills_addedit_save_button
        enabled_when: "submit !is Submitting && name.isNotBlank() && amount > 0.0"
        on_click:
          action: "submit"
          action_contract:
            effect: write
            writes_to:
              - { table: banking_bill_reminders, dto: BillReminder, op: upsert }
            platform_effect:
              capability: notification_scheduling
              op: "schedule (when enabled) | cancel (when disabled)"
            description: >-
              viewModel.onSubmit() → validate → build BillReminder(id = billId ?: randomId()) →
              super.onSubmit → performSubmit → repository.upsert(payload) into
              banking_bill_reminders; if enabled and nextDueDate/reminderTriggerMs resolve, also
              scheduler.schedule(BillReminderSchedule). On Submitted the status line shows Saved ✓
              with an "Add another" button (does not auto-pop).
      - id: submit_status_line
        type: status_text
        description: "SubmitState surface — Saving… / Saved ✓ + 'Add another' / 'Saved offline — will sync when online.' / 'Save failed: {msg}' with Retry + Dismiss buttons."
        states: [Idle, Submitting, Submitted, Failed]
      - { id: retry_button, type: button, label: "Retry", visible_when: "submit is Failed", on_change: onRetry, action_contract: { effect: write, description: "re-attempt repository.upsert + reschedule" } }
      - { id: dismiss_button, type: button, label: "Dismiss / Add another", visible_when: "submit is Failed || submit is Submitted", on_change: onDismissResult, action_contract: { effect: transform_state, description: "reset submit + clear form back to defaults (initialFormState)" } }
    state_model:
      viewmodel_base: "BaseDraftMutationViewModel<BillReminder, BillReminder>(formKey=\"bill\", uniqueKey=billId ?: \"new\", autoSaveDraft=true)"
      billId_injection: "Koin parametersOf(billId); koinViewModel { parametersOf(billId) }"
      form_state:
        name: BillReminderFormState
        fields:
          - { name: name, type: String, default: "" }
          - { name: amount, type: Double, default: 0.0 }
          - { name: dueDay, type: Int, default: 1 }
          - { name: recurrence, type: Recurrence, default: MONTHLY }
          - { name: category, type: BillCategory, default: UTILITIES }
          - { name: enabled, type: Boolean, default: true }
          - { name: reminderDaysBefore, type: Int, default: 1 }
        derived:
          - { name: canSubmit, expr: "name.isNotBlank() && amount > 0.0 && submit !is Submitting" }
      submit_state: "SubmitState { Idle | Submitting | Submitted(result) | Failed(error, draftSaved) }"
      submit_target: "repository.upsert(payload) + scheduler.schedule/cancel  # local Room commit + best-effort OS notification, no network"
