<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bill Reminders — Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#6C63FF','on-primary':'#ffffff'}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#6C63FF;--on-primary:#fff;--bg:#fff;--surface:#FFFBFE;--text:#1C1B1F;--border:#E7E0EC;--error:#BA1A1A;--success:#146C2E;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
body.embedded{background:var(--bg);margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;background:var(--bg);}
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span id="screenTitle" class="text-sm font-semibold text-slate-200 flex-1">Loading…</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none"></select>
  <button onclick="toggleTags()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">Tags</button>
</div>
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-white shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-white">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-slate-50" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900 rounded-full"></div></div>
    <div id="fab-container" class="absolute bottom-8 right-5"></div>
  </div>
</div>
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-white shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-slate-50 flex-1"></div>
  <div id="embedded-fab" class="fixed bottom-8 right-5"></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>
<script>
/* ══ feature/bills — B4 Bill Reminders. bills-list (primary) + bill-addedit form.
   Self-contained: real components + states embedded inline from ui.yaml + demo-data.yaml. ══ */
function money(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
var CATC={HOUSING:'bg-indigo-50 text-indigo-700',UTILITIES:'bg-sky-50 text-sky-700',SUBSCRIPTIONS:'bg-fuchsia-50 text-fuchsia-700',TRANSPORT:'bg-amber-50 text-amber-700',FOOD:'bg-emerald-50 text-emerald-700',OTHER:'bg-slate-100 text-slate-600'};
var TONE={red:'bg-red-50 text-red-700',amber:'bg-amber-50 text-amber-700',slate:'bg-slate-100 text-slate-600'};
var DOT={red:'bg-red-500',amber:'bg-amber-500',slate:'bg-slate-300'};
var BILLS=[
 {name:'Apartment Rent',amount:1450.00,cat:'HOUSING',enabled:true,due:'Overdue',tone:'red'},
 {name:'Electricity Bill',amount:92.40,cat:'UTILITIES',enabled:true,due:'Due in 3d',tone:'amber'},
 {name:'Internet & Fibre',amount:59.99,cat:'UTILITIES',enabled:true,due:'Due in 10d',tone:'slate'},
 {name:'Streaming Bundle',amount:22.99,cat:'SUBSCRIPTIONS',enabled:false,due:'Due in 13d',tone:'slate'},
 {name:'Car Insurance',amount:384.00,cat:'TRANSPORT',enabled:true,due:'Due in 18d',tone:'slate'},
 {name:'Domain Renewal',amount:14.00,cat:'OTHER',enabled:true,due:'Due in 26d',tone:'slate'}
];
function cap(s){return s.charAt(0)+s.slice(1).toLowerCase();}
function appBar(title,back){return '<div class="sticky top-0 z-10 flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-100">'
 +'<span class="material-symbols-outlined text-xl text-slate-700 cursor-pointer" onclick="navigateTo(\''+(back||'')+'\')">arrow_back</span>'
 +'<span class="flex-1 text-lg font-semibold text-slate-900">'+title+'</span></div>';}
function heroCard(){return '<div class="mx-4 mt-3 mb-1 p-5 rounded-3xl text-white shadow-lg" style="background:linear-gradient(135deg,#6C63FF,#8B7BFF)">'
 +'<div class="text-xs font-medium opacity-80 uppercase tracking-wide">Due in next 30 days</div>'
 +'<div class="text-3xl font-bold mt-1">'+money(1986.39)+'</div>'
 +'<div class="text-sm opacity-90 mt-1">2 bills due in next 7 days</div></div>';}
function billRow(b){return '<div onclick="navigateTo(\'bill-addedit\')" class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm cursor-pointer active:scale-[0.99] transition">'
 +'<div class="flex items-center gap-3"><span class="w-2.5 h-2.5 rounded-full '+DOT[b.tone]+'"></span>'
 +'<span class="flex-1 font-semibold text-slate-900">'+b.name+'</span>'
 +'<span class="font-semibold text-red-600">-'+money(b.amount)+'</span></div>'
 +'<div class="flex items-center gap-2 mt-3 flex-wrap">'
 +'<span class="px-2.5 py-1 rounded-full text-xs font-medium '+TONE[b.tone]+'">'+b.due+'</span>'
 +'<span class="px-2.5 py-1 rounded-full text-xs font-medium '+CATC[b.cat]+'">'+cap(b.cat)+'</span>'
 +'<span class="flex-1"></span>'
 +'<button onclick="event.stopPropagation();showToast(\'Marked paid — reminder cancelled\')" class="flex items-center gap-1 text-primary text-sm font-semibold px-2 py-1 rounded-lg hover:bg-primary/5"><span class="material-symbols-outlined text-base">check_circle</span>Paid</button></div>'
 +(b.enabled?'':'<div class="mt-2 text-xs text-slate-400 flex items-center gap-1"><span class="material-symbols-outlined text-sm">notifications_off</span>Reminders disabled</div>')
 +'</div>';}
function contentHtml(){return appBar('Bill Reminders','home')+heroCard()+'<div class="pb-24">'+BILLS.map(billRow).join('')+'</div>';}
function loadingHtml(){var s='';for(var i=0;i<5;i++){s+='<div class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100"><div class="flex items-center gap-3"><div class="w-2.5 h-2.5 rounded-full shimmer"></div><div class="shimmer h-4 w-32"></div><div class="flex-1"></div><div class="shimmer h-4 w-16"></div></div><div class="flex gap-2 mt-3"><div class="shimmer h-6 w-20 rounded-full"></div><div class="shimmer h-6 w-16 rounded-full"></div></div></div>';}
 return appBar('Bill Reminders','home')+'<div class="mx-4 mt-3 mb-2 h-28 rounded-3xl shimmer"></div>'+s;}
function emptyHtml(){return appBar('Bill Reminders','home')+'<div class="flex flex-col items-center justify-center text-center px-8 py-24"><span class="material-symbols-outlined text-6xl text-slate-300 mb-3">receipt_long</span><p class="text-lg font-semibold text-slate-700">No bills yet</p><p class="text-sm text-slate-400 mt-1">Tap “New bill” to add your first recurring bill reminder.</p></div>';}
function errorHtml(){return appBar('Bill Reminders','home')+'<div class="flex flex-col items-center justify-center text-center px-8 py-24"><span class="material-symbols-outlined text-6xl text-red-300 mb-3">error_outline</span><p class="text-lg font-semibold text-slate-700">Something went wrong</p><p class="text-sm text-slate-400 mt-1">Local combine() never emits Error in practice — onRetry is a no-op for this offline-local source.</p></div>';}
/* ── bill-addedit form (write side, DraftSubmitHandler) ── */
function fld(label,val,ph){return '<div class="mb-3"><label class="block text-sm font-medium text-slate-600 mb-1">'+label+'</label><input value="'+(val||'')+'" placeholder="'+(ph||'')+'" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none"/></div>';}
function radio(opts,sel){return '<div class="flex flex-col gap-2">'+opts.map(function(o){var on=o===sel;return '<label class="flex items-center gap-3 text-sm '+(on?'text-slate-900 font-medium':'text-slate-600')+'"><span class="material-symbols-outlined '+(on?'text-primary':'text-slate-400')+'">'+(on?'radio_button_checked':'radio_button_unchecked')+'</span>'+o+'</label>';}).join('')+'</div>';}
function chips(opts,sel){return '<div class="flex flex-wrap gap-2">'+opts.map(function(o){var on=o===sel;return '<span class="px-3 py-1.5 rounded-full text-sm border '+(on?'border-primary bg-primary/10 text-primary font-medium':'border-slate-300 text-slate-600')+'">'+o+'</span>';}).join('')+'</div>';}
function section(title,body){return '<div class="mx-4 my-2 p-4 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="text-sm font-semibold text-slate-900 mb-3">'+title+'</div>'+body+'</div>';}
function formHtml(saved){return appBar('New bill reminder','bills-list')+'<div class="pb-28">'
 +section('Basic info',fld('Name (e.g. Electricity)','Electricity Bill')+fld('Amount','92.40')+fld('Due day of month (1-31)','5'))
 +section('Recurrence',radio(['Monthly','Quarterly','Annually','One-time'],'Monthly'))
 +section('Category',chips(['Utilities','Housing','Transport','Food','Subscriptions','Other'],'Utilities'))
 +section('Reminder settings',fld('Remind days before','2')+'<div class="flex items-center justify-between mt-1"><span class="text-sm text-slate-700">Enabled</span><div class="w-11 h-6 rounded-full bg-primary relative"><div class="absolute right-0.5 top-0.5 w-5 h-5 rounded-full bg-white shadow"></div></div></div>')
 +'<div class="mx-4 my-3"><button onclick="showToast(\'Saved ✓\')" class="w-full py-3.5 rounded-xl font-semibold text-white shadow-sm" style="background:var(--primary)">Save</button>'
 +(saved?'<div class="mt-3 flex items-center gap-2 text-sm text-emerald-700"><span class="material-symbols-outlined text-base">check_circle</span>Saved ✓ <button onclick="switchState(\'form\')" class="ml-2 text-primary font-medium">Add another</button></div>'
        :'<div class="mt-3 text-sm text-slate-400">Draft status: Idle — validates name non-blank &amp; amount &gt; 0 before Save.</div>')
 +'</div></div>';}

var DATA={id:'bills-list',name:'Bill Reminders',feature:'feat-bills',status:'designed',
 fab:{icon:'add',label:'New bill',target:'bill-addedit'},
 states:{initial_state:'content',
  content:{name:'Content',html:contentHtml()},
  loading:{name:'Loading',html:loadingHtml()},
  empty:{name:'Empty',html:emptyHtml()},
  error:{name:'Error (unreachable)',html:errorHtml()},
  form:{name:'Add/Edit form',html:formHtml(false),noFab:true},
  'form-saved':{name:'Form · Saved ✓',html:formHtml(true),noFab:true}
 }};

/* ══ engine ══ */
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
var showTags=false,currentState=null;
function contentEl(){return document.getElementById(isEmbedded?'embedded-screen-content':'screen-content');}
function fabEl(){return document.getElementById(isEmbedded?'embedded-fab':'fab-container');}
function populateStates(){var p=document.getElementById('statePicker');if(!p)return;p.innerHTML='';Object.keys(DATA.states).forEach(function(k){if(k==='initial_state')return;var o=document.createElement('option');o.value=k;o.textContent=DATA.states[k].name||k;p.appendChild(o);});}
function switchState(id){if(!DATA.states[id]||id==='initial_state')id=DATA.states.initial_state||Object.keys(DATA.states).filter(function(k){return k!=='initial_state';})[0];currentState=id;var p=document.getElementById('statePicker');if(p)p.value=id;contentEl().innerHTML='<div id="comp-wrap">'+(DATA.states[id].html||'')+'</div>';renderFab(DATA.states[id].noFab);}
function renderFab(hide){if(!DATA.fab||hide){fabEl().innerHTML='';return;}var f=DATA.fab;fabEl().innerHTML='<button onclick="navigateTo(\''+f.target+'\')" class="flex items-center gap-2 pl-4 pr-5 h-14 rounded-2xl shadow-lg text-white font-semibold active:scale-95 transition" style="background:var(--primary)"><span class="material-symbols-outlined">'+f.icon+'</span>'+f.label+'</button>';}
function navigateTo(t){if(!t){return;}if(window!==window.top){window.parent.postMessage({action:'navigate',screenId:t},'*');}else if(DATA.states[t]){switchState(t);}else{showToast('→ '+t);}}
function showToast(m){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';t.textContent=m;document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},1800);}
function toggleTags(){showTags=!showTags;}
function notifyParent(){if(window===window.top)return;try{window.parent.postMessage({action:'screenLoaded',screenId:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,inspectorData:{id:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,states:Object.keys(DATA.states).filter(function(k){return k!=='initial_state';})}},'*');}catch(e){}}
window.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state);if(e.data.action==='getInspectorData')notifyParent();if(e.data.action==='applyTheme'&&e.data.cssVars){var r=document.documentElement;Object.keys(e.data.cssVars).forEach(function(k){if(e.data.cssVars[k])r.style.setProperty(k,e.data.cssVars[k]);});}});
function boot(){if(isEmbedded){document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col');document.body.classList.add('embedded');}document.title=DATA.name+' — Prototype';var t=document.getElementById('screenTitle');if(t)t.textContent=DATA.name;populateStates();var urlState=new URLSearchParams(location.search).get('state');switchState(urlState||DATA.states.initial_state);notifyParent();}
boot();
</script>
</body>
</html>
