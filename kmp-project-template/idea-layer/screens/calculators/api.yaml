schema_version: "1.0"
screen_id: affordability-calculator
feature: feat-calculators
# ─────────────────────────────────────────────────
# INTENTIONALLY EMPTY — no network backend.
#
# All four calculators (B3 Affordability, B5 Amortization, B6 Comparison, B6
# Wizard) are pure on-device math over core/domain/demo/calc (computeEmi /
# amortizationSchedule / maxAffordableLoan). There is NO Ktor client, NO Supabase,
# NO FRED/World-Bank call, NO HTTP operation anywhere in feature/calculators.
#
# Two screens DO touch persistence, but it is LOCAL ONLY (Room / DraftSubmit
# outbox), not a remote API — so it belongs in ui.yaml#data_source, not here:
#   - amortization : reads a saved Loan via LoanRepository.observeById (local Room)
#                    to pre-fill inputs when launched with a loanId.
#   - wizard       : persists per-step snapshots to the framework_submit_drafts
#                    outbox and, on the final step, upserts a Loan into
#                    banking_loans via LoanRepository.upsert (local Room).
#
# Any future non-empty api[] here would be a reverse-engineering error — no
# service interface, no network model, no endpoint exists in the source module.
# ─────────────────────────────────────────────────
api: []
