# flow.yaml — feature/watchlist navigation flow (Personal Crypto Watchlist).
# NAV GRAPH NOT YET SHIPPED. The data layer is in-tree; the nav destinations are
# documented intent. CryptoNavigation.kt states future sibling destinations
# "(coin detail, watchlist) can be added inside the same navigation<CryptoGraphRoute>
# block" — so the WatchlistScreen is designed to live in (or beside) the crypto graph,
# and the add-to-watchlist star is an EMBEDDED toggle on crypto coin surfaces
# (CoinMarkets rows + Coin Detail), not a navigable destination.
screen_id: watchlist
feature_ref: feat-watchlist
graph_route: CryptoGraphRoute          # WatchlistRoute designed to nest under the crypto graph
start_destination: n/a                 # not a graph start — reached from Coin Markets / Home
# /idea sync STEP 3 — aligned to the real crypto group name (was flow-crypto-browse → flow-crypto).
flow_groups: [flow-crypto, flow-watchlist-track]
participates_in_flows: [flow-watchlist-track, flow-crypto]

entry_points:
  - id: from-coin-markets
    description: "Coin Markets list → Watchlist (a 'star' / 'watchlist' affordance in the crypto surface)."
    trigger: navigate_to_watchlist
  - id: from-home
    description: "Home dashboard → Watchlist (Money Toolkit home entry, when wired)."
    trigger: navigate_to_watchlist
  - id: back-to-caller
    description: "Return to the previous surface after browsing the watchlist."
    trigger: navigate_back

# Screen nodes. add-to-watchlist is an embedded component, not a routed node.
nodes:
  - { id: watchlist, route: WatchlistRoute, screen: WatchlistScreen }
  - { id: add-to-watchlist, route: none, screen: AddToWatchlistStar, embedded: true, host: "CoinMarketsScreen rows + CoinDetailScreen" }

inbound_routes:
  # /idea sync STEP 3 — the agreed crypto-cluster entry: coinMarkets top-bar Watchlist action → watchlist.
  - from: crypto             # feature/crypto CoinMarkets — markets top-bar action (coinMarkets.watchlistAction)
    to: watchlist
    trigger: watchlist_action_tap
    label: "Coin Markets top-bar Watchlist action → watchlist"
    flow: flow-crypto
  - from: home
    to: watchlist
    trigger: view_watchlist
    flow: flow-watchlist-track

outbound_routes:
  # ── from watchlist ──
  - from: watchlist
    to: coin-detail           # cross-feature: feature/crypto CoinDetail (arrives with its own sub-plan)
    action: navigate
    trigger: watchlist_row_tap
    params: { coinId: "{item.coinId}" }
    label: "Coin row (short-tap) → Coin detail (crypto feature)"
    flow: flow-crypto
  - from: watchlist
    to: watchlist
    action: mutate_in_place
    trigger: watchlist_remove_star_tap
    label: "Tap filled star → repository.remove → row removed (stream re-emits)"
    flow: flow-watchlist-track
  - from: watchlist
    to: coin-markets
    action: navigate
    trigger: empty_state_cta_tap
    label: "Empty state CTA → open Coin Markets to add coins"
    flow: flow-watchlist-track
  - from: watchlist
    to: coin-markets
    action: navigate_back
    trigger: back_tap
    label: "Back → previous surface"
    flow: flow-crypto

  # ── from add-to-watchlist (embedded star on crypto surfaces) ──
  - from: add-to-watchlist
    to: add-to-watchlist
    action: mutate_in_place
    trigger: star_toggle_tap
    params: { coinId: "{coinId}" }
    label: "Tap star → add()/remove() via SubmitHandler → contains() re-emits, star flips"
    flow: flow-watchlist-track
