<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Markets — content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #6C63FF; --on-primary: #FFFFFF; --primary-container: #E4E0FF; --on-primary-container: #1A0F6B;
  --primary-hover: #5D53F0; --primary-pressed: #4E44D8;
  --secondary: #146C2E; --on-secondary: #FFFFFF; --secondary-container: #C3F2CE; --on-secondary-container: #00210A;
  --tertiary: #7D5260; --on-tertiary: #FFFFFF; --tertiary-container: #FFD9E3; --on-tertiary-container: #31101C;
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #146C2E; --on-success: #FFFFFF; --success-container: #C3F2CE; --on-success-container: #00210A;
  --warning: #8A5300; --on-warning: #FFFFFF; --warning-container: #FFDDB3; --on-warning-container: #2B1700; --warning-strong: #B45309;
  --info: #0061A4; --on-info: #FFFFFF;
  --background: #FFFBFE; --on-background: #1C1B1F;
  --surface: #FFFBFE; --on-surface: #1C1B1F; --surface-variant: #E7E0EC; --on-surface-variant: #49454F;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
  --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9; --surface-dim: #DED8E1; --surface-bright: #FFFBFE;
  --outline: #79747E; --outline-variant: #CAC4D0;
  --inverse-surface: #313033; --inverse-on-surface: #F4EFF4; --inverse-primary: #C3BEFF;
  --accent: #00BFA5; --on-accent: #00201A; --scrim: #000000;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-display-lg: 3rem; --fs-display-md: 2.375rem; --fs-display-sm: 1.875rem;
  --fs-h1: 1.625rem; --fs-h2: 1.375rem; --fs-h3: 1.25rem;
  --fs-title: 1.125rem; --fs-title-md: 1rem; --fs-title-sm: 0.875rem;
  --fs-body: 1rem; --fs-body-sm: 0.875rem; --fs-label: 0.875rem; --fs-label-sm: 0.75rem;
  --fs-caption: 0.75rem; --fs-caption-sm: 0.6875rem;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-label: 0.1px; --ls-caption: 0.3px; --ls-wide: 0.5px;
  --r-xs: 6px; --r-sm: 10px; --r-md: 16px; --r-lg: 20px; --r-xl: 28px; --r-full: 9999px;
  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
  --el-0: none;
  --el-1: 0 1px 3px rgba(28,17,84,0.08), 0 1px 2px rgba(28,17,84,0.06);
  --el-2: 0 3px 8px rgba(28,17,84,0.10), 0 2px 4px rgba(28,17,84,0.08);
  --el-3: 0 8px 20px rgba(28,17,84,0.14), 0 4px 8px rgba(28,17,84,0.10);
  --el-4: 0 12px 28px rgba(28,17,84,0.16);
  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #C3BEFF; --on-primary: #2E2299; --primary-container: #453AB1; --on-primary-container: #E4E0FF;
  --primary-hover: #D4D0FF; --primary-pressed: #E5E2FF;
  --secondary: #A8D5AF; --on-secondary: #013913; --secondary-container: #00531E; --on-secondary-container: #C3F2CE;
  --tertiary: #EFB8C8; --on-tertiary: #4A2532; --tertiary-container: #633B48; --on-tertiary-container: #FFD9E3;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #A8D5AF; --on-success: #013913; --success-container: #00531E; --on-success-container: #C3F2CE;
  --warning: #FFB955; --on-warning: #472A00; --warning-container: #663D00; --on-warning-container: #FFDDB3; --warning-strong: #E0912F;
  --info: #9CCAFF; --on-info: #003258;
  --background: #1C1B1F; --on-background: #E6E1E5;
  --surface: #1C1B1F; --on-surface: #E6E1E5; --surface-variant: #49454F; --on-surface-variant: #CAC4D0;
  --surface-container-lowest: #0F0E11; --surface-container-low: #1D1B1E; --surface-container: #211F23;
  --surface-container-high: #2B292D; --surface-container-highest: #363438; --surface-dim: #141316; --surface-bright: #3A383C;
  --outline: #938F99; --outline-variant: #49454F;
  --inverse-surface: #E6E1E5; --inverse-on-surface: #313033; --inverse-primary: #6C63FF;
  --accent: #4FD8C4; --on-accent: #00201A;
  --el-1: 0 1px 3px rgba(0,0,0,0.40); --el-2: 0 3px 8px rgba(0,0,0,0.50);
  --el-3: 0 8px 20px rgba(0,0,0,0.60); --el-4: 0 12px 28px rgba(0,0,0,0.66);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); color: var(--on-surface); border-bottom: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-2); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; }
header[data-shell="top-app-bar"] .bar-actions { margin-left: auto; display: inline-flex; align-items: center; gap: var(--sp-xxs); }
header[data-shell="top-app-bar"] .bar-actions button { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--sp-lg)); overflow-y: auto; }

.section-label { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-sm); }
.section-label h2 { font-size: var(--fs-label); font-weight: var(--fw-semibold); letter-spacing: var(--ls-label); text-transform: uppercase; color: var(--on-surface-variant); margin: 0; display: inline-flex; align-items: center; gap: var(--sp-xs); }
.section-label h2 .material-symbols-outlined { font-size: 18px; color: var(--primary); }
.section-label .count { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--on-surface-variant); }

.coin-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-sm); }
.coin-row { display: flex; align-items: center; gap: var(--sp-md); width: 100%; padding: var(--sp-sm) var(--sp-md); min-height: 64px; border-radius: var(--r-md); background: var(--surface); color: var(--on-surface); box-shadow: var(--el-1); cursor: pointer; text-align: left; font-family: inherit; border: none; }
.coin-rank { flex: 0 0 auto; width: 20px; text-align: center; font-family: var(--font-mono); font-size: var(--fs-caption-sm); color: var(--on-surface-variant); }
.coin-avatar { flex: 0 0 auto; width: 40px; height: 40px; aspect-ratio: 1 / 1; border-radius: var(--r-full); background: var(--primary-container); color: var(--on-primary-container); display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-caption-sm); font-weight: var(--fw-bold); letter-spacing: var(--ls-wide); }
.coin-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.coin-symbol { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); }
.coin-name { font-size: var(--fs-caption); color: var(--on-surface-variant); }
.coin-value-col { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.coin-price { font-family: var(--font-mono); font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); color: var(--on-surface); }
.coin-change { font-family: var(--font-mono); font-size: var(--fs-caption); font-weight: var(--fw-medium); }
.coin-change.up { color: var(--primary); }
.coin-change.down { color: var(--error); }
.coin-row:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.append-footer { display: flex; align-items: center; justify-content: center; gap: var(--sp-xs); padding: var(--sp-md); color: var(--on-surface-variant); font-size: var(--fs-caption); }
.append-footer .material-symbols-outlined { font-size: 18px; color: var(--secondary); }

@media (prefers-reduced-motion: no-preference) {
  .coin-row, header[data-shell="top-app-bar"] .bar-actions button { transition: filter 120ms ease, box-shadow 120ms ease; }
  .coin-row:active, header[data-shell="top-app-bar"] .bar-actions button:active { filter: brightness(0.97); }
}
</style>
</head>
<body>
<div data-shell="root" data-screen-id="coinMarkets" data-state="content">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="top_app_bar" data-from-ui-yaml-path="shell.top_app_bar">
    <button type="button" class="leading" data-component-type="IconButton" data-component-id="top_app_bar_back" data-nav-to="home" data-nav-type="pop" aria-label="Back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="app-title">Coin Markets</h1>
    <span class="bar-actions">
      <button type="button" data-component-type="IconButton" data-component-id="coinMarkets_watchlistAction" data-nav-to="watchlist" data-nav-type="push" aria-label="Watchlist">
        <span class="material-symbols-outlined" aria-hidden="true">star</span>
      </button>
      <button type="button" data-component-type="IconButton" data-component-id="coinMarkets_alertsAction" data-nav-to="alerts-list" data-nav-type="push" aria-label="Price alerts">
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
      </button>
    </span>
  </header>

  <main data-shell="content" data-state="content">

    <div class="section-label" data-component-type="LayoutBox" data-component-id="coin_markets_section_label">
      <h2><span class="material-symbols-outlined" aria-hidden="true">bar_chart</span>Top coins by market cap</h2>
      <span class="count">10 coins</span>
    </div>

    <!-- Coin market rows (#coinMarkets.row × 10, page 0, market_cap_desc) — coin.id navigation to coinDetail is PLANNED (status: planned), not shipped → tracked as data-action -->
    <ul class="coin-list" data-component-type="List" data-component-id="coin_markets_list" data-from-ui-yaml-path="state_components.content[0]" aria-label="Coin markets, ranked by market capitalization">
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_bitcoin" data-action="open_coin_detail" data-action-params='{"coinId":"bitcoin"}' aria-label="Rank 1, Bitcoin, BTC, $68,450.12, up 2.14 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">1</span>
          <span class="coin-avatar" aria-hidden="true">BTC</span>
          <span class="coin-meta"><span class="coin-symbol">BTC</span><span class="coin-name">Bitcoin</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$68,450.12</span><span class="coin-change up mono">+2.14%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_ethereum" data-action="open_coin_detail" data-action-params='{"coinId":"ethereum"}' aria-label="Rank 2, Ethereum, ETH, $3,542.88, up 1.02 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">2</span>
          <span class="coin-avatar" aria-hidden="true">ETH</span>
          <span class="coin-meta"><span class="coin-symbol">ETH</span><span class="coin-name">Ethereum</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$3,542.88</span><span class="coin-change up mono">+1.02%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_tether" data-action="open_coin_detail" data-action-params='{"coinId":"tether"}' aria-label="Rank 3, Tether, USDT, $1.00, down 0.01 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">3</span>
          <span class="coin-avatar" aria-hidden="true">USDT</span>
          <span class="coin-meta"><span class="coin-symbol">USDT</span><span class="coin-name">Tether</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$1.00</span><span class="coin-change down mono">-0.01%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_binancecoin" data-action="open_coin_detail" data-action-params='{"coinId":"binancecoin"}' aria-label="Rank 4, BNB, BNB, $592.34, down 0.87 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">4</span>
          <span class="coin-avatar" aria-hidden="true">BNB</span>
          <span class="coin-meta"><span class="coin-symbol">BNB</span><span class="coin-name">BNB</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$592.34</span><span class="coin-change down mono">-0.87%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_solana" data-action="open_coin_detail" data-action-params='{"coinId":"solana"}' aria-label="Rank 5, Solana, SOL, $168.72, up 4.56 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">5</span>
          <span class="coin-avatar" aria-hidden="true">SOL</span>
          <span class="coin-meta"><span class="coin-symbol">SOL</span><span class="coin-name">Solana</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$168.72</span><span class="coin-change up mono">+4.56%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_usd-coin" data-action="open_coin_detail" data-action-params='{"coinId":"usd-coin"}' aria-label="Rank 6, USDC, USDC, $1.00, unchanged in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">6</span>
          <span class="coin-avatar" aria-hidden="true">USDC</span>
          <span class="coin-meta"><span class="coin-symbol">USDC</span><span class="coin-name">USDC</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$1.00</span><span class="coin-change up mono">+0.00%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_ripple" data-action="open_coin_detail" data-action-params='{"coinId":"ripple"}' aria-label="Rank 7, XRP, XRP, $0.5234, down 1.33 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">7</span>
          <span class="coin-avatar" aria-hidden="true">XRP</span>
          <span class="coin-meta"><span class="coin-symbol">XRP</span><span class="coin-name">XRP</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$0.5234</span><span class="coin-change down mono">-1.33%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_cardano" data-action="open_coin_detail" data-action-params='{"coinId":"cardano"}' aria-label="Rank 8, Cardano, ADA, $0.4478, up 3.21 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">8</span>
          <span class="coin-avatar" aria-hidden="true">ADA</span>
          <span class="coin-meta"><span class="coin-symbol">ADA</span><span class="coin-name">Cardano</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$0.4478</span><span class="coin-change up mono">+3.21%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_dogecoin" data-action="open_coin_detail" data-action-params='{"coinId":"dogecoin"}' aria-label="Rank 9, Dogecoin, DOGE, $0.1567, up 5.89 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">9</span>
          <span class="coin-avatar" aria-hidden="true">DOGE</span>
          <span class="coin-meta"><span class="coin-symbol">DOGE</span><span class="coin-name">Dogecoin</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$0.1567</span><span class="coin-change up mono">+5.89%</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="coin-row" data-component-type="ListItem" data-component-id="coinMarkets_row_avalanche-2" data-action="open_coin_detail" data-action-params='{"coinId":"avalanche-2"}' aria-label="Rank 10, Avalanche, AVAX, $36.14, down 2.05 percent in 24 hours.">
          <span class="coin-rank mono" aria-hidden="true">10</span>
          <span class="coin-avatar" aria-hidden="true">AVAX</span>
          <span class="coin-meta"><span class="coin-symbol">AVAX</span><span class="coin-name">Avalanche</span></span>
          <span class="coin-value-col"><span class="coin-price mono">$36.14</span><span class="coin-change down mono">-2.05%</span></span>
        </button>
      </li>
    </ul>

    <div class="append-footer" data-component-type="LayoutBox" data-component-id="coin_markets_append_footer" aria-live="polite">
      <span class="material-symbols-outlined" aria-hidden="true">check_circle</span>You're all caught up
    </div>

  </main>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
