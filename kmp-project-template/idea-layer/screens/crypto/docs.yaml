schema_version: "1.0"
contract_version: "2.0.0"   # backfilled to VERSION_MANIFEST#contract_versions.current (schema-contract migration, Phase 6 T3 — clears /idea approve BLOCK_LEGACY)
feature_id: feat-crypto
screen_id: coinMarkets
archetype: paging-list
flow: flow-crypto
title: Crypto Coin Markets
purpose: >-
  Crypto Coin Markets — an infinite-scroll list of the top cryptocurrencies by
  market cap, sourced live from the CoinGecko public API. Each row shows the
  coin's symbol, name, current USD price and 24-hour change (green up / red
  down). Doubles as the canonical showcase of the toolkit's PagingScreenContent
  archetype over a page-keyed Store5 NETWORK_WITH_CACHE cache (Room source-of-truth),
  and backs the store5-screen-state-persistence AC-17 deep-scroll-restore flow.
status: approved
quality_score: 85          # /idea sync STEP 3 enrichment — one fully-shipped screen (coinMarkets, rich business_logic + test_tags + source_refs) + data-wired coinDetail (UI-pending, status: planned)
last_modified: '2026-07-25'
source: reverse-engineered
origin: "/idea-import — read-only reverse-engineering of the shipped feature/crypto module"

showcase_note: >-
  feat-crypto is the reference implementation for the PAGING-LIST archetype:
  core-base/ui PagingScreenContent owns the LazyColumn, the load-more tail trigger
  and the footer (loading / error+retry / end-of-list), while the screen declares
  only per-item content. The read-side ViewModel (BaseViewModel<Unit, Nothing,
  CoinMarketsAction>) carries NO retention plumbing — PagingScreenContent's internal
  rememberLazyListState()+rememberSaveable plus the Room page cache restore scroll
  position and prior pages across tab-switch, config-change and process-death.

wired_but_not_shipped_note: >-
  A per-coin detail (coinDetail) is FULLY WIRED in the data layers at HEAD —
  CoinDetail model, CoinDetailStore (Store5 NETWORK_WITH_CACHE, 5-min TTL),
  CryptoRepository.coinDetailStream, CoinDetailDto, CoinDetailDao and the coin_detail
  Room table all exist — but the CoinDetailScreen UI is NOT shipped. CoinMarketsScreen
  exposes onCoinClick, but CryptoNavigation passes an intentional-noop; the
  CoinDetailRoute destination + Compose Screen/ViewModel arrive with a future
  sub-plan. Modelled under ui.yaml#related_screens (status: planned) and
  api.yaml/data-flow.yaml (coingecko-coin-detail, ships: false) for faithful coverage.

no_setup_note: >-
  No API key or setup required — CoinGecko's free public tier is unauthenticated.
  Subject to CoinGecko's shared demo-tier rate limits (HTTP 429 on breach); the
  2-minute markets / 5-minute detail Store5 TTLs keep round-trips well under the ceiling.

data_sources:
  - name: CoinGecko
    endpoint: "GET https://api.coingecko.com/api/v3/coins/markets"
    params: "vs_currency=usd, order=market_cap_desc, per_page=20, page=N+1"
    auth: "none (public tier)"
    cache: "Store5 NETWORK_WITH_CACHE, page-keyed, 2-min TTL, Room source-of-truth (coin_markets)"
  - name: CoinGecko (planned detail)
    endpoint: "GET https://api.coingecko.com/api/v3/coins/{id}"
    auth: "none"
    cache: "Store5 NETWORK_WITH_CACHE, single key, 5-min TTL, Room source-of-truth (coin_detail) — data-wired, UI-pending"

user_stories:
  - "As a user, I want to see the top cryptocurrencies with their current price and 24h change so I can gauge the market at a glance."
  - "As a user, I want to keep scrolling to load more coins so I can browse beyond the top few."
  - "As a user, I want each coin's 24h change coloured up/down so I can spot movers instantly."
  - "As a user, I want my scroll position kept when I switch tabs or rotate so I don't lose my place."
  - "As a user offline, I want to still see the last synced coins (marked stale) so the screen is useful without a connection."

metrics:
  - { name: coingecko_fetch_success_rate, description: "share of CoinGecko page fetches that return usable rows" }
  - { name: cache_hit_rate, description: "share of subscriptions served from the Room page cache before/without a network round-trip" }
  - { name: pages_loaded_per_session, description: "average number of paging pages fetched per session (scroll depth)" }
  - { name: scroll_restore_rate, description: "share of returns-to-screen that restore prior scroll position + pages (AC-17)" }
  - { name: coin_row_tap_rate, description: "coin-row taps (once the detail screen ships)" }

edge_cases:
  - "Empty first page + cold cache → framework Empty slot ('No coins to show yet.') — the case the shipped UI test exercises."
  - "A page returning < 20 rows → end-of-list footer ('You're all caught up'); no further load-more requests."
  - "CoinGecko free-tier rate limit (HTTP 429) on cold cache → Error slot + retry; warm cache renders stale pages."
  - "Nullable wire fields — price_change_percentage_24h null → 0.0; high_24h/low_24h null → currentPrice (CoinMarketDto.toDomain defaults)."
  - "Locale-free formatters (formatPrice / formatChange) — no java.util.Locale, safe on Kotlin/JS + wasmJs."
  - "onCoinClick is a no-op at HEAD (detail UI not shipped) — a tap does nothing today."

related_features:
  - { id: feat-rates, note: "B7 Interest Rates — sibling NETWORK_WITH_CACHE showcase, but 4-independent-stream screen-content (non-paged); crypto is the PAGING-LIST showcase." }

