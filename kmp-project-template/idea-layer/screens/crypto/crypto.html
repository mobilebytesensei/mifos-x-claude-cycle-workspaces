<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Markets — Prototype</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#6C63FF','on-primary':'#ffffff'}}}};</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#6C63FF;--on-primary:#fff;--bg:#fff;--text:#1C1B1F;--border:#E7E0EC;--error:#BA1A1A;--success:#146C2E;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e6e6e6 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
body.embedded{background:var(--bg);margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;background:var(--bg);}
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span id="screenTitle" class="text-sm font-semibold text-slate-200 flex-1">Loading…</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none"></select>
  <button onclick="toggleTags()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">Tags</button>
</div>
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-white shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-white">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-white" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900 rounded-full"></div></div>
    <div id="fab-container" class="absolute bottom-8 right-5"></div>
  </div>
</div>
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-white shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1"><span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span><span class="material-symbols-outlined text-sm text-slate-900">wifi</span><span class="material-symbols-outlined text-sm text-slate-900">battery_full</span></div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-white flex-1"></div>
  <div id="embedded-fab" class="fixed bottom-8 right-5"></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"></div>
<script>
/* ══ feature/crypto — CoinGecko infinite-scroll coin-markets list (PagingScreenContent,
   NETWORK_WITH_CACHE). ONE screen ships. coinDetail is UI-PENDING (onCoinClick is an
   intentional-noop at HEAD — data layer wired, no CoinDetailScreen yet). Real values
   from demo-data.yaml. Top-bar Watchlist/Alerts actions are proposed cross-feature nav. ══ */
var COINS=[
 {sym:'btc',name:'Bitcoin',price:68450.12,chg:2.14},{sym:'eth',name:'Ethereum',price:3542.88,chg:1.02},
 {sym:'usdt',name:'Tether',price:1.00,chg:-0.01},{sym:'bnb',name:'BNB',price:592.34,chg:-0.87},
 {sym:'sol',name:'Solana',price:168.72,chg:4.56},{sym:'usdc',name:'USDC',price:1.00,chg:0.00},
 {sym:'xrp',name:'XRP',price:0.5234,chg:-1.33},{sym:'ada',name:'Cardano',price:0.4478,chg:3.21},
 {sym:'doge',name:'Dogecoin',price:0.1567,chg:5.89},{sym:'avax',name:'Avalanche',price:36.14,chg:-2.05}
];
function fmtPrice(p){return p>=1?'$'+p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'$'+p.toFixed(4);}
function fmtChg(c){return (c>=0?'+':'')+c.toFixed(2)+'%';}
function appBar(){return '<div class="sticky top-0 z-10 flex items-center gap-2 px-4 py-3 bg-white border-b border-slate-100"><span class="material-symbols-outlined text-xl text-slate-700 cursor-pointer" onclick="navigateTo(\'home\')">arrow_back</span><span class="flex-1 text-lg font-semibold text-slate-900">Coin Markets</span>'
 +'<span class="material-symbols-outlined text-xl text-slate-600 cursor-pointer" onclick="navigateTo(\'watchlist\')" title="Watchlist">star</span>'
 +'<span class="material-symbols-outlined text-xl text-slate-600 cursor-pointer" onclick="navigateTo(\'alerts-list\')" title="Price alerts">notifications</span></div>';}
function pendingBanner(){return '<div class="mx-4 mt-2 px-3 py-1.5 rounded-lg bg-amber-50 text-amber-700 text-[11px] flex items-center gap-1.5"><span class="material-symbols-outlined text-sm">info</span>Coin-detail screen is UI-pending — tapping a row is a no-op at HEAD (data layer wired).</div>';}
function coinRow(c){var up=c.chg>=0;return '<div onclick="showToast(\'Coin detail — UI pending (onCoinClick no-op)\')" class="flex items-center justify-between px-5 py-3.5 border-b border-slate-50 cursor-pointer hover:bg-slate-50/60">'
 +'<div class="min-w-0"><div class="text-sm font-bold text-slate-900">'+c.sym.toUpperCase()+'</div><div class="text-xs text-slate-500 truncate">'+c.name+'</div></div>'
 +'<div class="text-right"><div class="text-sm font-semibold text-slate-900 tabular-nums">'+fmtPrice(c.price)+'</div><div class="text-xs font-medium tabular-nums '+(up?'text-emerald-600':'text-red-600')+'">'+fmtChg(c.chg)+'</div></div></div>';}
function footer(msg,spin){return '<div class="flex items-center justify-center gap-2 py-4 text-xs text-slate-400">'+(spin?'<div class="w-4 h-4 border-2 border-slate-300 border-t-slate-500 rounded-full animate-spin"></div>':'')+msg+'</div>';}
function contentHtml(){return appBar()+pendingBanner()+'<div>'+COINS.map(coinRow).join('')+footer('Loading more…',true)+'</div>';}
function endHtml(){return appBar()+pendingBanner()+'<div>'+COINS.map(coinRow).join('')+footer('You’re all caught up',false)+'</div>';}
function loadingHtml(){var s='';for(var i=0;i<9;i++){s+='<div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-50"><div><div class="shimmer h-4 w-12 mb-1.5"></div><div class="shimmer h-3 w-20"></div></div><div class="text-right"><div class="shimmer h-4 w-16 mb-1.5 ml-auto"></div><div class="shimmer h-3 w-10 ml-auto"></div></div></div>';}return appBar()+'<div>'+s+'</div>';}
function emptyHtml(){return appBar()+'<div class="flex flex-col items-center justify-center text-center px-8 py-24"><span class="material-symbols-outlined text-6xl text-slate-300 mb-3">currency_bitcoin</span><p class="text-base font-semibold text-slate-700">No coins to show yet.</p><p class="text-sm text-slate-400 mt-1">Page 0 returned an empty list and the Room cache is empty.</p></div>';}
function errorHtml(){return appBar()+'<div class="flex flex-col items-center justify-center text-center px-8 py-24"><span class="material-symbols-outlined text-6xl text-red-300 mb-3">cloud_off</span><p class="text-base font-semibold text-slate-700">Couldn’t load coin markets</p><p class="text-sm text-slate-400 mt-1">CoinGecko unreachable / rate-limited (HTTP 429). Cached pages render as stale Content when present.</p><button onclick="showToast(\'Retry — reset cursor to page 0\')" class="mt-4 px-5 py-2 rounded-xl text-white text-sm font-semibold" style="background:var(--primary)">Retry</button></div>';}

var DATA={id:'coinMarkets',name:'Coin Markets',feature:'feat-crypto',status:'designed',fab:null,
 states:{initial_state:'content',
  content:{name:'Content (paging)',html:contentHtml()},
  'content-end':{name:'Content · end of list',html:endHtml()},
  loading:{name:'Loading',html:loadingHtml()},
  empty:{name:'Empty',html:emptyHtml()},
  error:{name:'Error / rate-limited',html:errorHtml()}
 }};

/* ══ engine ══ */
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
var showTags=false,currentState=null;
function contentEl(){return document.getElementById(isEmbedded?'embedded-screen-content':'screen-content');}
function fabEl(){return document.getElementById(isEmbedded?'embedded-fab':'fab-container');}
function populateStates(){var p=document.getElementById('statePicker');if(!p)return;p.innerHTML='';Object.keys(DATA.states).forEach(function(k){if(k==='initial_state')return;var o=document.createElement('option');o.value=k;o.textContent=DATA.states[k].name||k;p.appendChild(o);});}
function switchState(id){if(!DATA.states[id]||id==='initial_state')id=DATA.states.initial_state;currentState=id;var p=document.getElementById('statePicker');if(p)p.value=id;contentEl().innerHTML='<div id="comp-wrap">'+(DATA.states[id].html||'')+'</div>';renderFab();}
function renderFab(){fabEl().innerHTML='';}
function navigateTo(t){if(!t){return;}if(window!==window.top){window.parent.postMessage({action:'navigate',screenId:t},'*');}else if(DATA.states[t]){switchState(t);}else{showToast('→ '+t);}}
function showToast(m){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';t.textContent=m;document.getElementById('toast-container').appendChild(t);setTimeout(function(){t.remove();},1800);}
function toggleTags(){showTags=!showTags;}
function notifyParent(){if(window===window.top)return;try{window.parent.postMessage({action:'screenLoaded',screenId:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,inspectorData:{id:DATA.id,name:DATA.name,feature:DATA.feature,status:DATA.status,states:Object.keys(DATA.states).filter(function(k){return k!=='initial_state';})}},'*');}catch(e){}}
window.addEventListener('message',function(e){if(!e.data||typeof e.data!=='object')return;if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state);if(e.data.action==='getInspectorData')notifyParent();if(e.data.action==='applyTheme'&&e.data.cssVars){var r=document.documentElement;Object.keys(e.data.cssVars).forEach(function(k){if(e.data.cssVars[k])r.style.setProperty(k,e.data.cssVars[k]);});}});
function boot(){if(isEmbedded){document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col');document.body.classList.add('embedded');}document.title=DATA.name+' — Prototype';var t=document.getElementById('screenTitle');if(t)t.textContent=DATA.name;populateStates();var urlState=new URLSearchParams(location.search).get('state');switchState(urlState||DATA.states.initial_state);notifyParent();}
boot();
</script>
</body>
</html>
