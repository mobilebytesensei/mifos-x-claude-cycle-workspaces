# demo-data.yaml — Crypto (CoinGecko) demo/offline data.
# Sample coin-markets rows shaped as CoinMarket (domain) / coin_markets (Room), plus a
# sample CoinDetail for the planned detail screen. Used for offline render, previews and
# tests (the shipped CoinMarketsScreenUiTest uses an EMPTY fetcher via FakeCryptoRepository,
# so these fixtures back manual previews + future detail tests, not the current UI test).
# Real coins + realistic market-cap ranks, but values are illustrative, NOT live prices.
schema_version: "1.0"
screen_id: coinMarkets

consumes:
  - collection: coin_markets
    dto: CoinMarket
    used_by: [coingecko-coins-markets]
  - collection: coin_detail
    dto: CoinDetail
    used_by: [coingecko-coin-detail]

samples:
  # Page 0 (first 20 by market_cap_desc) — trimmed to a representative 10 rows.
  coin_markets:
    - { id: bitcoin,      symbol: btc,  name: Bitcoin,      imageUrl: "https://assets.coingecko.com/coins/images/1/large/bitcoin.png",   currentPrice: 68450.12, marketCap: 1350000000000, marketCapRank: 1,  priceChangePercent24h: 2.14,  high24h: 69120.00, low24h: 66980.40, page: 0 }
    - { id: ethereum,     symbol: eth,  name: Ethereum,     imageUrl: "https://assets.coingecko.com/coins/images/279/large/ethereum.png", currentPrice: 3542.88,  marketCap: 425000000000,  marketCapRank: 2,  priceChangePercent24h: 1.02,  high24h: 3588.10,  low24h: 3480.55,  page: 0 }
    - { id: tether,       symbol: usdt, name: Tether,       imageUrl: "https://assets.coingecko.com/coins/images/325/large/Tether.png",   currentPrice: 1.00,     marketCap: 112000000000,  marketCapRank: 3,  priceChangePercent24h: -0.01, high24h: 1.001,    low24h: 0.999,    page: 0 }
    - { id: binancecoin,  symbol: bnb,  name: BNB,          imageUrl: "https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png", currentPrice: 592.34, marketCap: 87000000000, marketCapRank: 4, priceChangePercent24h: -0.87, high24h: 601.20, low24h: 588.10, page: 0 }
    - { id: solana,       symbol: sol,  name: Solana,       imageUrl: "https://assets.coingecko.com/coins/images/4128/large/solana.png",  currentPrice: 168.72,   marketCap: 78000000000,   marketCapRank: 5,  priceChangePercent24h: 4.56,  high24h: 171.90,   low24h: 159.30,   page: 0 }
    - { id: usd-coin,     symbol: usdc, name: USDC,          imageUrl: "https://assets.coingecko.com/coins/images/6319/large/usdc.png",    currentPrice: 1.00,     marketCap: 34000000000,   marketCapRank: 6,  priceChangePercent24h: 0.00,  high24h: 1.001,    low24h: 0.999,    page: 0 }
    - { id: ripple,       symbol: xrp,  name: XRP,           imageUrl: "https://assets.coingecko.com/coins/images/44/large/xrp-symbol-white-128.png", currentPrice: 0.5234, marketCap: 29000000000, marketCapRank: 7, priceChangePercent24h: -1.33, high24h: 0.5361, low24h: 0.5188, page: 0 }
    - { id: cardano,      symbol: ada,  name: Cardano,       imageUrl: "https://assets.coingecko.com/coins/images/975/large/cardano.png",  currentPrice: 0.4478,   marketCap: 15800000000,   marketCapRank: 8,  priceChangePercent24h: 3.21,  high24h: 0.4551,   low24h: 0.4302,   page: 0 }
    - { id: dogecoin,     symbol: doge, name: Dogecoin,      imageUrl: "https://assets.coingecko.com/coins/images/5/large/dogecoin.png",   currentPrice: 0.1567,   marketCap: 22500000000,   marketCapRank: 9,  priceChangePercent24h: 5.89,  high24h: 0.1602,   low24h: 0.1441,   page: 0 }
