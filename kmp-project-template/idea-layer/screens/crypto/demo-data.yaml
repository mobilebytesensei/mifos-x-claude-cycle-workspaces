  # Sample CoinDetail for the planned detail screen (bitcoin).
  coin_detail:
    - id: bitcoin
      name: Bitcoin
      symbol: btc
      imageUrl: "https://assets.coingecko.com/coins/images/1/large/bitcoin.png"
      currentPrice: 68450.12
      marketCap: 1350000000000
      marketCapRank: 1
      priceChangePercent24h: 2.14
      high24h: 69120.00
      low24h: 66980.40
      circulatingSupply: 19700000.0
      maxSupply: 21000000.0
      description: "Bitcoin is the first decentralized cryptocurrency, introduced in 2009 by the pseudonymous Satoshi Nakamoto. It runs on a peer-to-peer network with a fixed 21-million supply cap."

# Edge-case fixtures for state coverage.
edge_cases:
  - id: empty_first_page
    trigger: "page 0 returns [] AND coin_markets Room table empty"
    renders: "ScreenState.Empty — framework Empty slot ('No coins to show yet.'). This is the case the shipped CoinMarketsScreenUiTest exercises (empty fetcher)."
  - id: end_of_list
    trigger: "a page returns < 20 rows"
    renders: "Content with append footer 'You're all caught up' — no further load-more requests."
  - id: offline_with_cache
    trigger: "NetworkMonitor offline AND coin_markets has cached pages"
    renders: "cached pages render as stale Content; FreshnessSignal reflects Stale/VeryStale."
  - id: negative_change_row
    seed: avalanche-2
    renders: "24h change rendered in colorScheme.error (down) — e.g. -2.05%."
  - id: stablecoin_flat
    seed: usd-coin
    renders: "priceChangePercent24h == 0.0 → non-negative branch → colorScheme.primary; price formats as $1.00."
  - id: null_wire_change
    trigger: "CoinGecko returns price_change_percentage_24h: null"
    renders: "CoinMarketDto.toDomain defaults priceChangePercent24h to 0.0; high_24h/low_24h default to currentPrice."
