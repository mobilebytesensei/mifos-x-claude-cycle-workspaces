schema_version: "1.0"
screen_id: profile
feature: feat-profile
feature_profile:
  combo_id: static_content
  facets: [content]
  archetype: pure-ui
  # Derived from FEATURE_FACETS.yaml#store_archetype_map[static_content] (FPC-5).
  store_archetype: MEMORY_ONLY
  recipe_ref: FEATURE_LAYER.md
  heal: auto
platforms: [android, ios, desktop, web]
# Informational screen — ZERO network, no persistence, no user input. This is the
# "Profile" tab of the authenticated bottom-nav bar; it exists to explain that the
# app is fully local (no login / no account).
#
# SHELL/SEAM SPLIT (WS01): ProfileScreen is an opaque shell rendering whatever
# BackboneRegistry.profileBody supplies. Only the DEFAULT demo body is store-backed
# — it reads a MEMORY_ONLY Store5 store (ProfileInfo) through
# ProfileViewModel → ScreenContent, mirroring feature/home. The two seams are
# orthogonal: BackboneRegistry decides WHICH composable renders, the store decides
# WHERE its data comes from. The store's value here is the SEAM, not the caching —
# a fork showing a signed-in user swaps the fetcher and gets loading/error/retry
# for free instead of restructuring the Composable.
states: [loading, content]
initial_state: loading   # settles to content immediately (local source), but the state is real

# ─────────────────────────────────────────────────
# Feature business logic (RULE-IDEA-IMPL-INTELLIGENCE-001 II-1..II-3)
# ─────────────────────────────────────────────────
business_logic:
  kind: static_info
  processing_kind: none
  library_refs: []
  external_library_refs: []
    None. There is no computation and no mutation — the screen is presentational.
    ProfileScreen itself stays a stateless @Composable shell (it renders whatever
    BackboneRegistry.profileBody supplies). The DEFAULT demo body reads ProfileInfo
    from a MEMORY_ONLY Store5 store via ProfileViewModel and renders it through
    ScreenContent: a hero card with an AccountCircle icon, a title ("Local profile"),
    and a supporting message explaining that Money Toolkit runs entirely on-device
    with no account required. The app display name is the store's payload rather than
    a constant read inline, so a fork that loads a signed-in user replaces only the
    store's fetcher — the ViewModel and Composable are unchanged.
  processing_location: on_device
  library_note: "Renders core-base/designsystem HeroCard + core/designsystem AppIcons.AccountCircle + core/ui KptScaffold. No domain, no model, no repository."

# ─────────────────────────────────────────────────
# State model — NONE. ProfileScreen is a pure stateless composable.
# ─────────────────────────────────────────────────
state_model:
  viewmodel: null   # no ViewModel — ProfileScreen() takes only a Modifier
  base: null
  event_type: null  # no one-shot events — no navigation/toast/snackbar effects
  state: null       # no state class — content is entirely static
  derived: []
  actions: null     # no actions — the screen has zero interactive elements

# ─────────────────────────────────────────────────
# Shell — bottom-nav tab (Profile tab of the authenticated navbar); no top app
# bar, no back button. KptScaffold wraps the content with no title argument.
# ─────────────────────────────────────────────────
shell:
  bottom_nav:
    enabled: true
    tab_id: ProfileTab
    label: "Profile"
    selected_icon: profile_boarder   # AppIcons.ProfileBoarder
    unselected_icon: profile         # AppIcons.Profile
    note: >-
      Registered as AuthenticatedNavBarTabItem.ProfileTab (testTag "ProfileTab").
      ProfileRoute is both the graph route and the start destination of the tab.
  top_app_bar:
    enabled: false
    note: "ProfileScreen wraps content in KptScaffold with no title — there is no TopAppBar and no back affordance (it is a root tab, not a pushed destination)."

# ─────────────────────────────────────────────────
# CONTENT state — a single centered HeroCard. No conditional sub-regions.
# ─────────────────────────────────────────────────
state_components:
  content:
    - type: stack
      direction: column
      justify: center            # verticalArrangement = Center
      align: center              # horizontalAlignment = CenterHorizontally
      padding: "{spacing.lg}"
      children:
        - type: card
          variant: hero_card
          id: profile_hero_card
          aria_label: "Local profile"
          children:
            - type: stack
              direction: column
              align: center
              padding: "{spacing.lg}"
              gap: "{spacing.sm}"
              children:
                - type: icon
                  icon: account_circle          # AppIcons.AccountCircle
                  size: 64
                  aria_label: null              # contentDescription = null (decorative)
                - type: text
                  variant: title_medium
                  emphasis: semibold            # FontWeight.SemiBold
                  content: "Local profile"
                  string_key: screens_profile_local_title
                - type: text
                  variant: body_medium
                  color: on_surface_variant
                  content: "Money Toolkit runs entirely on-device. No account required."
                  string_key: screens_profile_local_message

# ─────────────────────────────────────────────────
# Test tags present in source (feature/profile/.../TestTags.kt)
# ─────────────────────────────────────────────────
test_tags:
  - { id: "profile_screen", note: "Root scaffold — always rendered regardless of content state (screen has only the one static state)." }

# ─────────────────────────────────────────────────
# Source provenance (reverse-engineered, read-only)
# ─────────────────────────────────────────────────
source_refs:
  screen: "feature/profile/src/commonMain/kotlin/kpt/feature/profile/ProfileScreen.kt"
  viewmodel: null   # no ViewModel exists for this feature
  navigation: "feature/profile/src/commonMain/kotlin/kpt/feature/profile/ProfileRoute.kt (ProfileRoute data object + navigateToProfile + profileDestination)"
  tab_registration: "cmp-navigation/src/commonMain/kotlin/cmp/navigation/authenticatednavbar/AuthenticatedNavBarTabItem.kt (ProfileTab)"
  strings: "feature/profile/src/commonMain/composeResources/values/strings.xml (screens_profile_local_title, screens_profile_local_message)"
  test: "feature/profile/src/commonTest/kotlin/kpt/feature/profile/ProfileScreenUiTest.kt"
  design_system: ["core-base/designsystem HeroCard", "core/designsystem AppIcons.AccountCircle + spacing", "core/ui KptScaffold"]
