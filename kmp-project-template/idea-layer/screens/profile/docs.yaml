schema_version: "1.0"
contract_version: "2.0.0"   # backfilled to VERSION_MANIFEST#contract_versions.current (schema-contract migration, Phase 6 T3 — clears /idea approve BLOCK_LEGACY)
screen_id: profile
feature_id: feat-profile
archetype: pure-ui
flow: flow-shell
title: Profile
purpose: >-
  The Profile tab of the Money Toolkit's authenticated bottom-navigation bar. It
  is a purely informational surface that tells the user the app runs entirely
  on-device with no login and no account. Because the toolkit has no backend and
  no user identity, this screen intentionally carries no editable profile fields,
  no avatar upload, and no settings — it renders a single explanatory hero card.
status: implemented
store_pattern: none
quality_score: 85
last_modified: "2026-08-01"

showcase_note: >-
  Profile is the kmp-project-template's canonical showcase of the simplest
  possible screen: a pure-static, stateless @Composable with NO ViewModel at all
  (ProfileScreen takes only a Modifier). It is the reference proof that a
  bottom-nav tab destination can be fully valid with zero state, zero actions,
  and zero data dependencies — the minimal end of the archetype spectrum, below
  even the no-Store EMI Calculator (which still has a BaseViewModel). Forks that
  add real account/settings functionality replace this screen's body while
  keeping the ProfileTab + ProfileRoute wiring.

user_stories:
  - "As a first-time user, I want to understand that this app needs no sign-in or account, so I know my data stays on my device."
  - "As a user, I want a recognizable Profile tab in the navigation bar, so the app feels complete and familiar even though it is fully local."

success_metrics:
  - "Screen renders instantly with no spinner and no async work (fully static composition)"
  - "Zero crashes and zero network activity — nothing to fail (no ViewModel, no Store, no api)"
  - "Works on all four platforms (android, ios, desktop, web) with identical output — pure commonMain, no expect/actual"

business_logic_summary: >-
  None. ProfileScreen is a stateless composable that renders a fixed HeroCard
  (AccountCircle icon + "Local profile" title + on-device explanatory message).
  There is no state, no derivation, no mutation, and no user input.

components:
  - card          # HeroCard
  - icon          # AppIcons.AccountCircle (64.dp)
  - text          # title (titleMedium, SemiBold) + message (bodyMedium)

non_functional:
  - "Pure commonMain — no platform-specific code, no permissions, no ViewModel"
  - "No secrets, no keystore, no API key, no network"
  - "i18n: all copy via compose-resources string keys (screens_profile_local_title, screens_profile_local_message) per RULE-IMPL-NO-HARDCODED-STRING-001"
  - "Accessibility: decorative icon has null contentDescription; text is read verbatim by the screen reader"

data_requirements: []   # none — pure-static, no DTOs, no tables, no cache, no preferences

dependencies:
  tier: leaf
  upstream_features: []          # a root nav tab; depends on no other feature's data
  core_modules_used:
    - "core-base/designsystem (HeroCard)"
    - "core/designsystem (AppIcons.AccountCircle, spacing, MaterialTheme typography/colorScheme)"
    - "core/ui (KptScaffold)"
    - "compose-resources (stringResource for the two profile strings)"
