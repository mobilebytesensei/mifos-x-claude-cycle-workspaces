<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMI Calculator — content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap">
<style>
:root {
  --primary: #6C63FF; --on-primary: #FFFFFF; --primary-container: #E4E0FF; --on-primary-container: #1A0F6B;
  --primary-hover: #5D53F0; --primary-pressed: #4E44D8;
  --secondary: #146C2E; --on-secondary: #FFFFFF; --secondary-container: #C3F2CE; --on-secondary-container: #00210A;
  --tertiary: #7D5260; --on-tertiary: #FFFFFF; --tertiary-container: #FFD9E3; --on-tertiary-container: #31101C;
  --error: #BA1A1A; --on-error: #FFFFFF; --error-container: #FFDAD6; --on-error-container: #410002;
  --success: #146C2E; --on-success: #FFFFFF; --success-container: #C3F2CE; --on-success-container: #00210A;
  --warning: #8A5300; --on-warning: #FFFFFF; --warning-container: #FFDDB3; --on-warning-container: #2B1700; --warning-strong: #B45309;
  --info: #0061A4; --on-info: #FFFFFF;
  --background: #FFFBFE; --on-background: #1C1B1F;
  --surface: #FFFBFE; --on-surface: #1C1B1F; --surface-variant: #E7E0EC; --on-surface-variant: #49454F;
  --surface-container-lowest: #FFFFFF; --surface-container-low: #F7F2FA; --surface-container: #F3EDF7;
  --surface-container-high: #ECE6F0; --surface-container-highest: #E6E0E9; --surface-dim: #DED8E1; --surface-bright: #FFFBFE;
  --outline: #79747E; --outline-variant: #CAC4D0;
  --inverse-surface: #313033; --inverse-on-surface: #F4EFF4; --inverse-primary: #C3BEFF;
  --accent: #00BFA5; --on-accent: #00201A; --scrim: #000000;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-display-lg: 3rem; --fs-display-md: 2.375rem; --fs-display-sm: 1.875rem;
  --fs-h1: 1.625rem; --fs-h2: 1.375rem; --fs-h3: 1.25rem;
  --fs-title: 1.125rem; --fs-title-md: 1rem; --fs-title-sm: 0.875rem;
  --fs-body: 1rem; --fs-body-sm: 0.875rem; --fs-label: 0.875rem; --fs-label-sm: 0.75rem;
  --fs-caption: 0.75rem; --fs-caption-sm: 0.6875rem;
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700;
  --lh-body: 1.5; --lh-tight: 1.3; --ls-label: 0.1px; --ls-caption: 0.3px; --ls-wide: 0.5px;
  --r-xs: 6px; --r-sm: 10px; --r-md: 16px; --r-lg: 20px; --r-xl: 28px; --r-full: 9999px;
  --sp-xxs: 2px; --sp-xs: 4px; --sp-sm: 8px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-xxl: 48px;
  --el-0: none;
  --el-1: 0 1px 3px rgba(28,17,84,0.08), 0 1px 2px rgba(28,17,84,0.06);
  --el-2: 0 3px 8px rgba(28,17,84,0.10), 0 2px 4px rgba(28,17,84,0.08);
  --el-3: 0 8px 20px rgba(28,17,84,0.14), 0 4px 8px rgba(28,17,84,0.10);
  --el-4: 0 12px 28px rgba(28,17,84,0.16);
  --border-w: 1px;
}
:root[data-theme="dark"] {
  --primary: #C3BEFF; --on-primary: #2E2299; --primary-container: #453AB1; --on-primary-container: #E4E0FF;
  --primary-hover: #D4D0FF; --primary-pressed: #E5E2FF;
  --secondary: #A8D5AF; --on-secondary: #013913; --secondary-container: #00531E; --on-secondary-container: #C3F2CE;
  --tertiary: #EFB8C8; --on-tertiary: #4A2532; --tertiary-container: #633B48; --on-tertiary-container: #FFD9E3;
  --error: #FFB4AB; --on-error: #690005; --error-container: #93000A; --on-error-container: #FFDAD6;
  --success: #A8D5AF; --on-success: #013913; --success-container: #00531E; --on-success-container: #C3F2CE;
  --warning: #FFB955; --on-warning: #472A00; --warning-container: #663D00; --on-warning-container: #FFDDB3; --warning-strong: #E0912F;
  --info: #9CCAFF; --on-info: #003258;
  --background: #1C1B1F; --on-background: #E6E1E5;
  --surface: #1C1B1F; --on-surface: #E6E1E5; --surface-variant: #49454F; --on-surface-variant: #CAC4D0;
  --surface-container-lowest: #0F0E11; --surface-container-low: #1D1B1E; --surface-container: #211F23;
  --surface-container-high: #2B292D; --surface-container-highest: #363438; --surface-dim: #141316; --surface-bright: #3A383C;
  --outline: #938F99; --outline-variant: #49454F;
  --inverse-surface: #E6E1E5; --inverse-on-surface: #313033; --inverse-primary: #6C63FF;
  --accent: #4FD8C4; --on-accent: #00201A;
  --el-1: 0 1px 3px rgba(0,0,0,0.40); --el-2: 0 3px 8px rgba(0,0,0,0.50);
  --el-3: 0 8px 20px rgba(0,0,0,0.60); --el-4: 0 12px 28px rgba(0,0,0,0.66);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { display: flex; flex-direction: column; min-height: 100vh; background: var(--background); color: var(--on-surface); font-family: var(--font-body); font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; display: inline-block; vertical-align: middle; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }

header[data-shell="top-app-bar"] { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); padding-top: calc(var(--sp-sm) + env(safe-area-inset-top, 24px)); background: var(--surface); color: var(--on-surface); border-bottom: var(--border-w) solid var(--outline-variant); box-shadow: var(--el-2); }
header[data-shell="top-app-bar"] .leading { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--r-full); color: var(--on-surface-variant); background: transparent; border: none; cursor: pointer; }
header[data-shell="top-app-bar"] .app-title { font-size: var(--fs-h3); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--on-surface); margin: 0; flex: 1; }

main[data-shell="content"] { flex: 1; display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-lg) var(--sp-md); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--sp-lg)); overflow-y: auto; }

/* input card — el-1 raised surface, three outlined fields */
.input-card { display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-md); border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--el-1); border: var(--border-w) solid var(--outline-variant); }
.field { display: flex; flex-direction: column; gap: var(--sp-xxs); }
.field label { font-size: var(--fs-label); font-weight: var(--fw-medium); color: var(--on-surface-variant); letter-spacing: var(--ls-label); }
.field .field-box { display: flex; align-items: center; gap: var(--sp-sm); min-height: 56px; padding: 0 var(--sp-md); border-radius: var(--r-sm); border: var(--border-w) solid var(--outline); background: var(--surface); }
.field .field-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
.field .prefix { color: var(--on-surface-variant); flex: 0 0 auto; font-size: var(--fs-body); }
.field .prefix .material-symbols-outlined { font-size: 20px; }
.field .value { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: var(--fs-title); color: var(--on-surface); background: transparent; border: none; outline: none; padding: 0; }
.field .suffix { color: var(--on-surface-variant); flex: 0 0 auto; font-size: var(--fs-body-sm); font-weight: var(--fw-medium); }

/* result hero card — brand gradient, el-2 */
.result-card { display: flex; flex-direction: column; gap: var(--sp-md); padding: var(--sp-lg); border-radius: var(--r-lg); background: linear-gradient(135deg, var(--primary), color-mix(in oklch, var(--primary) 55%, var(--tertiary))); color: var(--on-primary); box-shadow: var(--el-2); margin-top: var(--sp-md); }
.result-label { font-size: var(--fs-label); font-weight: var(--fw-medium); letter-spacing: var(--ls-wide); text-transform: uppercase; opacity: 0.85; }
.result-value { font-family: var(--font-mono); font-size: var(--fs-display-sm); font-weight: var(--fw-bold); line-height: var(--lh-tight); }
.result-divider { height: var(--border-w); background: color-mix(in oklch, var(--on-primary) 25%, transparent); border: none; margin: var(--sp-xs) 0; }
.result-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-md); font-size: var(--fs-body-sm); }
.result-row .k { color: color-mix(in oklch, var(--on-primary) 85%, transparent); }
.result-row .v { font-family: var(--font-mono); font-weight: var(--fw-semibold); color: var(--on-primary); }

/* formula footnote */
.formula-note { display: flex; align-items: flex-start; gap: var(--sp-sm); padding: var(--sp-sm) var(--sp-md); border-radius: var(--r-md); background: var(--surface-container-low); color: var(--on-surface-variant); font-size: var(--fs-caption); }
.formula-note .material-symbols-outlined { font-size: 18px; flex: 0 0 auto; margin-top: 1px; }
.formula-note .mono { color: var(--on-surface); }
</style>
</head>
<body>
<div data-shell="root" data-screen-id="emiCalculator" data-state="content">

  <header data-shell="top-app-bar" data-variant="small" data-component-type="LayoutBox" data-component-id="top_app_bar">
    <button type="button" class="leading" data-nav-to="home" data-nav-type="pop" data-component-type="icon_button" data-component-id="back_button" aria-label="Back">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
    </button>
    <h1 class="app-title">EMI Calculator</h1>
  </header>

  <main data-shell="content" data-state="content">

    <!-- Input card — three numeric OutlinedTextFields (#principal_field, #rate_field, #tenure_field) -->
    <div class="input-card" data-component-type="card" data-component-variant="app_card" data-component-id="input_card">

      <div class="field">
        <label for="principal_field">Principal Amount</label>
        <div class="field-box" data-component-type="text_field" data-component-id="principal_field" data-action="update_principal" data-action-params='{"value":25000}'>
          <span class="prefix" aria-hidden="true"><span class="material-symbols-outlined">attach_money</span></span>
          <input id="principal_field" class="value mono" type="text" inputmode="numeric" value="25000" aria-label="Principal Amount" readonly>
        </div>
      </div>

      <div class="field">
        <label for="rate_field">Annual Rate (%)</label>
        <div class="field-box" data-component-type="text_field" data-component-id="rate_field" data-action="update_rate" data-action-params='{"value":6.5}'>
          <span class="prefix" aria-hidden="true"><span class="material-symbols-outlined">percent</span></span>
          <input id="rate_field" class="value mono" type="text" inputmode="decimal" value="6.5" aria-label="Annual Rate (%)" readonly>
        </div>
      </div>

      <div class="field">
        <label for="tenure_field">Tenure (months)</label>
        <div class="field-box" data-component-type="text_field" data-component-id="tenure_field" data-action="update_tenure" data-action-params='{"value":48}'>
          <span class="prefix" aria-hidden="true"><span class="material-symbols-outlined">calendar_month</span></span>
          <input id="tenure_field" class="value mono" type="text" inputmode="numeric" value="48" aria-label="Tenure (months)" readonly>
          <span class="suffix">mo</span>
        </div>
      </div>

    </div>

    <!-- Result hero card — live-computed, visible_when emiResult != null (true: 25000, 6.5%, 48mo all positive) -->
    <div class="result-card" data-component-type="card" data-component-variant="hero_card" data-component-id="emi_result_card" aria-label="EMI result">
      <div>
        <div class="result-label">Monthly EMI</div>
        <div class="result-value mono" data-component-type="amount_display" data-component-id="emi_amount">$592.87</div>
      </div>
      <hr class="result-divider">
      <div class="result-row">
        <span class="k">Total payment</span>
        <span class="v">$28,457.94</span>
      </div>
      <div class="result-row">
        <span class="k">Total interest</span>
        <span class="v">$3,457.94</span>
      </div>
    </div>

    <div class="formula-note">
      <span class="material-symbols-outlined" aria-hidden="true">functions</span>
      <span>EMI = P &times; r &times; (1+r)<sup>n</sup> &divide; ((1+r)<sup>n</sup> &minus; 1), monthly rate r = <span class="mono">6.5% &divide; 12</span> = <span class="mono">0.5417%</span>, n = <span class="mono">48</span></span>
    </div>

  </main>

</div>
<script src="../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
