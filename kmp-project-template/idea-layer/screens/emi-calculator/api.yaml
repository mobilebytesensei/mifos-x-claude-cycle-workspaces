schema_version: "1.0"
screen_id: emiCalculator
# ─────────────────────────────────────────────────
# INTENTIONALLY EMPTY — pure-local feature.
#
# B2 EMI Calculator is the canonical showcase of the "pure local state (no Store)"
# pattern (see kmp-project-template CLAUDE.md → Toolkit feature showcase).
# It has NO backend, NO Supabase, NO Ktor client, NO repository, NO Store5 cache,
# and NO network calls. All computation is a synchronous pure-Kotlin function
# (core/domain/demo/emi/calculateEmi) executed on-device against transient local
# UI state (EmiState). There are therefore zero API operations to declare.
#
# Any future non-empty api[] here would be a reverse-engineering error — the
# source imports no service/repository and the ViewModel takes a no-arg constructor.
# ─────────────────────────────────────────────────
api: []
