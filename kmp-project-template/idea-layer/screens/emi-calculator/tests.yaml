    setup: "EmiCalculatorViewModel built with its no-arg constructor; default EmiState(principal=100000.0, ratePercent=8.5, tenureMonths=12)"
    assertions:
      - "root scaffold (test tag emi_calculator_screen) is displayed"
      - "Principal Amount field shows the default 100000"
      - "Annual Rate (%) field shows the default 8.5"
      - "Tenure (months) field shows the default 12"
      - "because all three defaults are positive, the result HeroCard (Monthly EMI) is visible"
  - state: content
    name: "result card is hidden when any input is non-positive"
    setup: "dispatch UpdatePrincipal(0.0) (or UpdateTenure(0)) so a required input becomes non-positive"
    assertions:
      - "emiResult derives to null"
      - "the Monthly EMI HeroCard is not rendered"
      - "the input card and scaffold remain displayed"

interactions:
  - component: "top_app_bar back (icon_button)"
    trigger: "tap"
    name: "tapping back pops the back stack"
    expected: "nav: back"
    assertions:
      - "onBackClick invoked → popBackStackSafely returns to the caller"
  - component: "Principal Amount field (outlined text_field)"
    trigger: "change → 250000"
    name: "editing principal updates only the principal slice"
    expected: "action: EmiAction.UpdatePrincipal(250000.0)"
    assertions:
      - "EmiState.principal becomes 250000.0; ratePercent and tenureMonths unchanged"
      - "emiResult recomputes from the new principal"
  - component: "Annual Rate (%) field (outlined text_field)"
    trigger: "change → 7.5"
    name: "editing rate updates only the rate slice"
    expected: "action: EmiAction.UpdateRate(7.5)"
    assertions:
      - "EmiState.ratePercent becomes 7.5; principal and tenureMonths unchanged"
      - "emiResult recomputes from the new rate"
  - component: "Tenure (months) field (outlined text_field)"
    trigger: "change → 120"
    name: "editing tenure updates only the tenure slice"
    expected: "action: EmiAction.UpdateTenure(120)"
    assertions:
      - "EmiState.tenureMonths becomes 120; principal and ratePercent unchanged"
      - "emiResult recomputes from the new tenure"
  - component: "unparseable input"
    trigger: "change → non-numeric text"
    name: "non-numeric input is ignored (no action dispatched)"
    expected: "no state change"
    assertions:
      - "toDoubleOrNull()/toIntOrNull() returns null so no Update action fires; state is preserved"

computation:
  - name: "EMI math is correct for 100k at 12% for 10 months"
    setup: "principal=100000.0, ratePercent=12.0, tenureMonths=10"
    assertions:
      - "emiResult.emi ≈ 10,558.20 (within ±1.0)"
      - "emiResult.totalInterest > 0 for a non-zero rate"
      - "emiResult.totalPayment == emi × tenureMonths"
  - name: "default state produces a populated result at first composition"
    setup: "default EmiState (100000.0 / 8.5 / 12)"
    assertions:
      - "emiResult is non-null (all inputs positive)"
  - name: "zero rate falls back to straight-line division"
    setup: "ratePercent=0.0 with positive principal + tenure"
    assertions:
      - "emi == principal / tenureMonths; totalInterest == 0"
    note: "Grounded in calculateEmi's monthlyRate==0.0 branch; not directly asserted by the source unit test but implied by the formula."

acceptance_criteria:
  - ref: "AC-EMI-01"
    name: "Instant local EMI"
    given: "the user is on the EMI Calculator with valid principal, rate, and tenure"
    when: "the user edits any input"
    then: "the Monthly EMI, Total payment, and Total interest recompute on-device with no network call"
  - ref: "AC-EMI-02"
    name: "Guarded result"
    given: "any of principal, rate, or tenure is zero or negative"
    when: "the calculator renders"
    then: "the result card is hidden and only the input form is shown"
  - ref: "AC-EMI-03"
    name: "Return to caller"
    given: "the user is on the EMI Calculator"
    when: "the user taps the back arrow"
    then: "the app pops back to the screen that launched the calculator"
