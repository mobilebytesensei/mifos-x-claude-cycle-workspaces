# idea-layer/_strings/strings.yaml — i18n string table (RULE-IDEA-STATE-COHERENCE-001 SC-2).
#
# SC-2 invariant: every `{strings.<key>}` interpolation token referenced by any
# screens/*/ui.yaml MUST have a matching top-level key here.
#
# CURRENT STATE (whole-source-idea-layer-reimport Phase 5, 2026-08-01):
#   The Phase-1 re-import (source -> idea-layer) produced screens that carry LITERAL
#   labels, not `{strings.<key>}` interpolation tokens. An exhaustive scan of all 96
