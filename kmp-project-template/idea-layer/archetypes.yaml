# idea-layer/archetypes.yaml — Money Toolkit project archetype extensions.
# Bootstrapped by /idea-render-mockup Phase 1. Framework base archetypes
# (layers/idea/templates/prototype-render/ARCHETYPES.yaml — splash, onboarding_step,
# signin_form, home_feed, detail_screen, list_screen, index_chips, settings,
# about_marketing, paywall, empty_state, error_state, loading_state) are merged
# UNDER these per the resolution order (framework base → this file → per-screen
# ui.yaml#/archetype_overrides, later wins on collision). Money Toolkit adds three
# archetypes not covered by the framework base: a composite multi-source dashboard,
# a live-computed calculator form, and a read-only schedule/table projection.
schema_version: "1.0"
archetypes_version: "v1.0.0"
last_modified: "2026-08-08"
project: money-toolkit

archetypes:

  - id: dashboard_composite
    description: |
      Composite fan-in dashboard: a hero summary card, then N independent
      per-source cards (each own its own loading/empty/error), then a Tools
      grid of feature_row navigation tiles. Used by home — the ONLY screen
      that fans multiple independent reactive sources into one scroll.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-default.html
        slots: [title, trailing_action]
      - block: hero_card
        typography: { value: --fs-display-small, label: --fs-body-medium }
        spacing: { padding: --sp-lg, margin: --sp-md }
        surface: { corner_radius: --r-lg, elevation: --el-2 }
      - block: carousel
        slots: [item_card]
        spacing: { item_gap: --sp-sm, padding_x: --sp-md }
        allowed_variations: [omit when the underlying collection is empty]
      - block: section_header
        repeats: 2-4
        typography: { title: --fs-title-small }
      - block: source_card
        repeats: 2-4
        slots: [icon, title, freshness_indicator, body_rows, see_all_link]
        typography: { title: --fs-title-medium, body: --fs-body-medium }
        spacing: { padding: --sp-md, gap: --sp-sm }
        surface: { corner_radius: --r-md, elevation: --el-1 }
        state_aware: true
        note: "EACH source_card renders its OWN loading/empty/error independently — one card being Loading never blocks the others from showing Content."
      - block: tools_grid
        slots: [feature_row+]
        typography: { title: --fs-body-medium, subtitle: --fs-body-small }
        spacing: { row_gap: --sp-xs, padding_x: --sp-md }
      - block: bottom_nav
        shared_partial: _shared/bottom-nav.html
    forbidden:
      - a single monolithic loading state that blanks all cards when ANY source is loading
      - inventing a source card not declared in ui.yaml#/data_sources
    allowed_variations:
      - omit carousel when the primary source collection is empty (render its own empty presentation instead)
      - reorder source_card blocks to match ui.yaml declaration order

  - id: calculator_form
    description: |
      Single-scroll input form with a live-computed read-only preview tile
      that updates as fields change — no submit/loading round-trip, pure
      on-device computation. Used by emi-calculator, calculators (hub/detail).
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-default.html
        slots: [back_action, title]
      - block: form_fields
        repeats: 2-6
        slots: [label, input, helper]
        typography: { label: --fs-label-large, input: --fs-body-large }
        spacing: { field_gap: --sp-md, padding_x: --sp-md }
      - block: preview_box
        typography: { value: --fs-headline-small, label: --fs-body-small }
        spacing: { padding: --sp-md, margin_top: --sp-lg }
        surface: { corner_radius: --r-md, background: --surface-container-low }
        live_computed: true
      - block: primary_cta
        typography: { button_text: --fs-label-large }
        surface: { background: --primary, corner_radius: --r-full, elevation: --el-1 }
        spacing: { padding: --sp-md, margin_top: --sp-lg }
        optional: true
    forbidden:
      - a loading spinner on the preview_box (computation is synchronous, on-device)
      - more than 1 preview_box
    allowed_variations:
      - omit primary_cta when the screen is read-only (no persisted output, e.g. affordability calculator)
      - stack fields two-per-row on tablet/desktop widths

  - id: schedule_table
    description: |
      Read-only tabular projection: sticky header row + zebra-striped data
      rows + a summary total row. Used by amortization (payment schedule).
      No bottom_nav (pushed destination), no user actions beyond back + scroll.
    structure:
      - block: app_bar
        shared_partial: _shared/app-bar-detail.html
        slots: [back_action, title]
      - block: table_header_row
        surface: { background: --surface-variant }
        typography: { column_label: --fs-label-small }
        spacing: { padding: --sp-sm }
        sticky: true
      - block: table_data_row
        repeats: "N (one per computed row, full resolved set per CRAFT §7c)"
        typography: { cell: --fs-body-small }
        spacing: { padding: --sp-sm }
        surface: { zebra_alternate: [--surface, --surface-container-low] }
      - block: summary_card
        slots: [total_line+]
        typography: { title: --fs-title-small, line: --fs-body-medium }
        spacing: { padding: --sp-md, margin_top: --sp-sm }
        surface: { background: --primary-container, corner_radius: --r-md }
    forbidden:
      - bottom_nav (pushed destination — owns the back stack)
      - truncating the row set below the full computed schedule
      - a filled/elevated FAB (schedule screens have no add/edit action)
    allowed_variations:
      - horizontal scroll container on narrow widths instead of column-collapse (table content, per CRAFT §7f, may use an intentional horizontal scroller)

# ───────────────────────────────────────────────────────────────────
# Resolution order (later wins on collision):
#   1. layers/idea/templates/prototype-render/ARCHETYPES.yaml (framework base)
#   2. THIS FILE (project extension)
#   3. screens/{id}/ui.yaml#/archetype_overrides (per-screen rare override)
# ───────────────────────────────────────────────────────────────────
