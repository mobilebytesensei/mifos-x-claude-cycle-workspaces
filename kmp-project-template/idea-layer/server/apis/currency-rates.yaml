schema_version: "1.0"
feature: currency-rates
screen_id: currency-rates
spec_source: screens/currency-rates/api.yaml + screens/currency-rates/data-flow.yaml

# External API spec — mirrors screens/currency-rates/api.yaml faithfully.
# NOT an owned backend (PROJECT_CONFIG server.backends: []). Catalogs the PUBLIC
# open-source Frankfurter FX integration consumed through Store5 caches.

external_source:
  name: Frankfurter
  full_name: "Frankfurter — open-source exchange-rates API (ECB reference rates)"
  base_url: "https://api.frankfurter.dev/"   # canonical host (overridable via FrankfurterApiConfig)
  transport: rest
  client: ktorfit                            # FrankfurterApi
  auth:
    type: none
    required: false
    note: "Fully open — no api key, no token, no user auth. Only baseUrl is configurable (fork/mock)."
  host_note: >-
    Older api.frankfurter.app returns HTTP 301 with a BROKEN redirect target
    (duplicated /v1/v1/); source pins the new canonical host api.frankfurter.dev.
  rate_limit: "Unpublished soft limit; Store5 TTL keeps call volume low via cache reuse."
  docs: "https://frankfurter.dev/"

endpoints:
  - operation: latest-rates
    method: GET
    path: "v1/latest"
    source: frankfurter
    request:
      query:
        from: "<base currency code> — list VM hard-codes USD at v1"
    response:
      dto: ExchangeRatesDto
      shape: object
      body:
        amount: "Double (base amount, typically 1.0)"
        base: "String — echoed base currency"
        date: "String — rate date (YYYY-MM-DD)"
        rates: "Map<String, Double> — target code → rate"
        note: "toDomain() drops amount, keeps base/date/rates → ExchangeRates."
    consumed_by:
      - { screen: currency-rates-list, base: USD, via: ExchangeRatesStore, fetch_policy: NETWORK_WITH_CACHE }
      - { screen: currency-spot-converter, base: USD, via: SpotRateLookupStore, fetch_policy: "NETWORK_ONLY (online) | CACHE_ONLY (offline)" }
    cache:
      strategy: stale_while_revalidate       # list; policy-routed for the spot converter
      ttl: "AppStoreRegistry.Ttl.EXCHANGE_RATES (list) — SpotRateLookupStore has NO validator/TTL"
      store: "ExchangeRatesStore (list) · SpotRateLookupStore (converter facet)"
      room_table: exchange_rates             # PK baseCurrency
      source_of_truth: ExchangeRatesDao
      key_template: "currency:exchangeRates:{base}  |  currency:spotRate:{base}"
      retry: "NetworkMonitor.executeWithRetry(RetryPolicy{ maxAttempts = 1 })"
    demo_source: exchange_rates
    notes: >-
      SAME endpoint backs the main list (ExchangeRatesStore, TTL-validated,
      stale-while-revalidate) and the embedded spot converter (SpotRateLookupStore,
      NO validator — NETWORK_ONLY online, CACHE_ONLY offline). Both write through the
      same exchange_rates Room table.

  - operation: historical-rates
    method: GET
    path: "v1/{startDate}..{endDate}"        # date-range path segment (e.g. v1/2026-04-25..2026-05-25)
    source: frankfurter
    request:
      path_params:
        startDate: "today - key.days (YYYY-MM-DD, UTC)"
        endDate: "today (YYYY-MM-DD, UTC)"
      query:
        from: "<base currency code> — USD (RateHistoryKey.from)"
        to: "<target currency code> — INR | EUR | GBP | JPY | AUD (RateHistoryKey.to)"
    response:
      dto: RateHistoryDto
      shape: object
      body:
        amount: "Double"
        base: "String — echoed base (from)"
        start_date: "String (SerialName start_date)"
        end_date: "String (SerialName end_date)"
        rates: "Map<String, Map<String, Double>> — date → { targetCode → rate }"
        note: >-
          toDomain(targetCurrency) sorts by date, projects each day's targetCode value
          into RatePoint(date, value) → RateHistory{from, to, startDate, endDate, rates}.
          The Store WRITER overrides start/end with the KEY-derived dates so the SOT
          reader (queries by key dates) matches.
    consumed_by:
      - { screen: rate-history, from: USD, to: "<currency chip>", days: "7|14|30|90", via: RateHistoryStore, fetch_policy: NETWORK_WITH_CACHE }
    cache:
      strategy: stale_while_revalidate
      ttl: "AppStoreRegistry.Ttl.RATE_HISTORY"
      store: RateHistoryStore                 # dynamic RateHistoryKey(from, to, days)
      room_table: rate_history                # PK [fromCurrency, toCurrency, startDate, endDate]
      source_of_truth: RateHistoryDao
      key_template: "currency:rateHistory:{from}-{to}-{days}d"
      retry: "NetworkMonitor.executeWithRetry(RetryPolicy{ maxAttempts = 1 })"
    demo_source: rate_history
    notes: >-
      Dynamic-key store. Every currency/period chip selection produces a new key
      (distinctUntilChanged) re-driving the fetch; on a failed new key the previous
      selection's data carries forward as a stale fallback (inline OfflineDataBanner).

# Forced-refresh seam (not a UI-triggered endpoint) — CurrencyRepository is Syncable.
sync:
  syncable: true
  operation: "CurrencyRepositoryImpl.syncWith(synchronizer)"
  behavior: >-
    Fans out Store5 stream(fresh(base)) across pinned bases [USD, EUR, INR] in
    parallel (DataSyncWorker seam); fresh() bypasses cache → v1/latest → writes
    through exchange_rates SOT. Rate history is NOT part of syncWith at v1.
