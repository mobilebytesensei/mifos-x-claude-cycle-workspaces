schema_version: "1.0"
feature: rates
screen_id: rates
spec_source: screens/rates/api.yaml + screens/rates/data-flow.yaml

# External API spec — mirrors screens/rates/api.yaml faithfully.
# NOT an owned backend (PROJECT_CONFIG server.backends: []). This catalogs the
# PUBLIC FRED integration the rates feature consumes through a Store5 cache.

external_source:
  name: FRED
  full_name: "Federal Reserve Economic Data (St. Louis Fed)"
  base_url: "https://api.stlouisfed.org/"
  transport: rest
  client: ktorfit                        # FredApi (core/network/demo/economic/api/FredApi.kt)
  auth:
    type: api_key
    param: api_key                       # query param — REQUIRED; FRED returns HTTP 400 without it
    required: true
    secret_alias: mifos_x_fred_api_key   # framework vault (Path B); Path A = FRED_API_KEY in local.properties
    source: "FredApiConfig(apiKey: String?) — Koin singleton"
    unconfigured_behavior: >-
      apiKey null/blank → Store5 Fetcher throws IllegalStateException
      ("FRED_API_KEY is not configured …") instead of firing api_key=null;
      the row surfaces ScreenState.Error (ui.yaml error.fred_key_missing).
  rate_limit: "120 calls/min (free tier). Store5 24h TTL keeps daily usage far under the ceiling."
  docs: "https://fred.stlouisfed.org/docs/api/fred/series_observations.html"

endpoints:
  - operation: fred-series-observations
    method: GET
    path: "fred/series/observations"
    source: fred
    request:
      query:
        series_id: "<FRED series id> — DFF | DPRIME | MORTGAGE30US | DGS10 (case-sensitive)"
        api_key: "FredApiConfig.apiKey (required)"
        file_type: "json (forced — FRED defaults to XML)"
        observation_start: "today - key.days (YYYY-MM-DD, days default 365)"
        observation_end: "today (YYYY-MM-DD, UTC)"
    response:
      dto: FredObservationsDto
      shape: object
      body:
        observations: "List<FredObservationDto> { date: String, value: String }"
        note: >-
          value arrives as String; FRED encodes missing data as literal "."
          (NO_DATA_MARKER). toDomain strips "." + unparseable rows → InterestRateSeries
          {seriesId, name, unit, current=last.value, observations=[RateObservation(date,value)]}.
          name + unit are threaded from the request key (FRED omits them).
    consumed_by:
      - { screen: rates, series_ids: [DFF, DPRIME, MORTGAGE30US, DGS10], fan_out: 4 }
      - { screen: rateDetail, series_ids: ["<route seriesId>"], fan_out: 1 }
    cache:
      strategy: stale_while_revalidate     # Store5 NETWORK_WITH_CACHE archetype
      ttl: "24h"
      store: InterestRateSeriesStore       # StoreFactory.createStore(fetcher=FredApi, sourceOfTruth=Dao)
      room_table: interest_rate_series     # PK [seriesId, date]
      source_of_truth: InterestRateSeriesDao
      key_template: "economic:rates:{seriesId}:{days}d"
      retry: "NetworkMonitor.executeWithRetry(RetryPolicy{ maxAttempts = 1 })"
    demo_source: interest_rate_series
    notes: >-
      SAME endpoint + Store backs both the list rows and the detail screen; only the
      number of series ids requested differs. World Bank (macro/B8) is a sibling
      economic feature sharing core/*/economic packages but a DIFFERENT API.
