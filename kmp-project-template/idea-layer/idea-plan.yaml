# idea-plan.yaml — kmp-project-template
#
# SCOPE: this file exists ONLY to carry the gate WAIVER blocks the template legitimately needs.
# It is deliberately NOT a `/idea-plan` wizard product plan — kmp-project-template is a template,
# not a shipped app, and it has no roadmap of its own. `_wizard_state` is intentionally ABSENT so
# `idea-plan-resume-detect.sh` (CR10) does not surface a phantom "unfinished idea-plan" banner on
# every /context-start.
#
# Until this file existed, several gates documented a waiver mechanism
# (`idea-plan.yaml#<block>[]`) that had nowhere to live in this project — so a legitimate,
# by-design exception had no way to be declared and the gate simply stayed red. Each block below
# records WHY, not just WHAT; an entry without a reason is not a waiver, it is a silenced gate.

schema_version: "1.0"
project: kmp-project-template
workspace: mifos-x

# ─── §pure_kotlin_services (RULE-IMPL-STUB-DETECTION-001 SD-2/SD-3 allowlist) ───
# SD-2 flags an `*Impl` class that references no platform API as a suspect stub. These four are
# Store5 REPOSITORIES: their entire job is to wrap an injected Store and expose a ScreenDataStream.
# A platform-API reference in one of them would be the defect — the read path is pure Kotlin by
# construction, and any device/network access belongs below them in core/network or core/platform.
pure_kotlin_services:
  - AlertsRepositoryImpl              # wraps the OFFLINE_LOCAL_ONLY alerts store + write store
  - AmortizationCalcRepositoryImpl    # wraps the MEMORY_ONLY compute store (calculator_multi)
  - CloudTodoRepositoryImpl           # wraps read + MutableStore; the network leg lives in core/network
  - CryptoRepositoryImpl              # wraps paged CoinMarkets/CoinDetail stores
  - EmiCalculatorRepositoryImpl       # wraps the MEMORY_ONLY compute store (calculator_pure)
  - ProfileRepositoryImpl             # wraps the MEMORY_ONLY profile store (static_content)

# ─── §screen_composable_excludes (RULE-IMPL-SCREEN-STORE5-COMPOSABLE-001 waiver) ───
# The gate resolves "store5-backed" per FEATURE MODULE, then requires every `*Screen.kt` in that
# module to delegate to a core-base/ui state composable. That is right for a screen that RENDERS
# store data, but a multi-screen module also contains screens that own no data at all. The
# shell/seam case (HomeScreen/ProfileScreen → `*Body: @Composable () -> Unit`) is now exempted
# STRUCTURALLY in the evaluator rather than listed here, because it is a pattern the template
# itself ships and no fork should have to re-declare it.
#
# Each entry below is a screen with genuinely no ScreenState to render:
screen_composable_excludes:
  - feature: showcase
    reason: >-
      DECLARED STORE EXCEPTION (mirrors screens/showcase/ui.yaml#feature_profile). The galleries
      hand-construct ScreenState.Loading/.Empty/.Error/.NoNetwork/.Content side by side to EXHIBIT
      how each renders. A Store cannot be asked to produce NoNetwork on demand — the hand-built
      states ARE the feature, so delegating to ScreenContent would destroy the only thing these
      screens exist to do. Dev-only (gated on !isReleaseBuild()).
  - feature: calculators
    reason: >-
      Three of the four sibling screens own no store data. affordability + comparison are pure
      derived math over form inputs (no async, nothing that can fail or be empty); the wizard is a
      5-step form whose state is the form itself plus a draft outbox. Only amortization reads the
      MEMORY_ONLY compute store, and it DOES delegate (ScreenContent). The module-level
      store5-backed verdict is what pulls the other three in.
  - feature: macro
    reason: >-
      CountryPickerScreen renders a static country list from BaseViewModel local state — no Store
      read, nothing async. The module is store5-backed because of CountryMacroScreen +
      MacroIndicatorDetailScreen, both of which DO delegate (IndependentCardLayout / ScreenContent).
