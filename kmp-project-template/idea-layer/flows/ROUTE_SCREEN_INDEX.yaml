# flows/ROUTE_SCREEN_INDEX.yaml
# Route → screen reconciliation index (systematic nav-resolution table).
# Re-materialized from the 15 fresh per-feature siblings, 2026-08-01.
#
# The home-hub edges + cross-feature nav callbacks refer to features / graph-routes /
# callback names that do NOT match the target screen_id 1:1. This table maps every
# nav-target token used as a `to:` in a flow connection (or a navigateTo* callback / graph
# route) to its REAL screen_id, so nav-resolution can certify the home-hub + crypto-cluster
# edges instead of flagging them as dead/unresolved targets.
#
# Sources: screens/{feature}/flow.yaml graph_route / start_destination / nav_graph /
# nodes / inbound_routes / outbound_routes + screens/{feature}/ui.yaml screens[].route.

schema_version: "1.0"
project: kmp-project-template
app_name: "Money Toolkit"

# ---------------------------------------------------------------------------
# 1. Nav-target token → screen_id (home-hub tiles / cross-feature callbacks)
# ---------------------------------------------------------------------------
nav_target_to_screen:
  # home-hub tile / 'See all' targets (screens/home/flow.yaml outbound_routes — 12 callbacks)
  - { token: settings,          screen_id: settings,                 owning_feature: feat-settings,        callback: onSettingsClick }
  - { token: loans,             screen_id: loans-list,               owning_feature: feat-loans,           callback: onNavigateToLoans }
  - { token: bills,             screen_id: bills-list,               owning_feature: feat-bills,           callback: onNavigateToBills }
  - { token: rates,             screen_id: rates,                    owning_feature: feat-rates,           callback: onNavigateToRates }
  - { token: currency-rates,    screen_id: currency-rates-list,      owning_feature: feat-currency-rates,  callback: onNavigateToExchangeRates }
  - { token: exchange-rates,    screen_id: currency-rates-list,      owning_feature: feat-currency-rates,  callback: onNavigateToExchangeRates }
  - { token: emi-calculator,    screen_id: emiCalculator,            owning_feature: feat-emi-calculator,  callback: onNavigateToEmi }
  - { token: affordability,     screen_id: affordability-calculator, owning_feature: feat-calculators,     callback: onNavigateToAffordability }
  - { token: amortization,      screen_id: amortization,             owning_feature: feat-calculators,     callback: onNavigateToAmortization, note: "calculators AmortizationRoute(loanId?) — NOT feat-amortization's amortization-schedule" }
  - { token: loan-comparison,   screen_id: comparison,               owning_feature: feat-calculators,     callback: onNavigateToLoanComparison }
  - { token: loan-calc-wizard,  screen_id: wizard,                   owning_feature: feat-calculators,     callback: onNavigateToLoanCalcWizard }
  - { token: rate-history,      screen_id: rate-history,             owning_feature: feat-currency-rates,  callback: onNavigateToRateHistory }
  - { token: country-macro,     screen_id: macro,                    owning_feature: feat-country-macro,   callback: onNavigateToMacro }
  # crypto-cluster tokens (declared-intent / cross-feature — NO home tile ships at HEAD)
  - { token: coinMarkets,       screen_id: coinMarkets,              owning_feature: feat-crypto,          callback: "NavController.navigateToCrypto()", note: "reached programmatically at HEAD — no home tile" }
  - { token: markets,           screen_id: coinMarkets,              owning_feature: feat-crypto,          callback: "NavController.navigateToCrypto()", note: "declared-intent 'Markets' tile (crypto/flow.yaml inbound) — not shipped in home/flow.yaml" }
  # crypto-cluster top-bar actions (coinMarkets → watchlist / alerts)
  - { token: watchlist,         screen_id: watchlist,                owning_feature: feat-watchlist,       callback: coinMarkets.watchlistAction }
  - { token: alerts,            screen_id: alerts-list,              owning_feature: feat-alerts,          callback: coinMarkets.alertsAction }
  - { token: alerts-list,       screen_id: alerts-list,              owning_feature: feat-alerts,          callback: coinMarkets.alertsAction }
  - { token: coin-markets,      screen_id: coinMarkets,              owning_feature: feat-crypto,          callback: "watchlist empty-state CTA", note: "watchlist/flow.yaml uses `coin-markets` token for the same coinMarkets screen" }
  # cross-feature leaf from loan-detail (distinct amortization)
  - { token: amortization-schedule, screen_id: amortization-schedule, owning_feature: feat-amortization,  callback: navigateToAmortizationSchedule, note: "feat-amortization AmortizationScheduleRoute(loanId) — reached from loan-detail 'Schedule'" }
  # crypto per-coin detail (PLANNED)
  - { token: coin-detail,       screen_id: coinDetail,               owning_feature: feat-crypto,          callback: "watchlist_row_tap / onCoinClick", note: "PLANNED — see planned_targets" }

# ---------------------------------------------------------------------------
# 2. Graph route → start screen_id (nested feature nav graphs)
# ---------------------------------------------------------------------------
graph_route_to_start_screen:
  - { graph_route: HomeDestination,          start_route: HomeRoute,                    screen_id: home }
  - { graph_route: ProfileDestination,       start_route: ProfileRoute,                 screen_id: profile }
  - { graph_route: LoansGraphRoute,          start_route: PersonalLoansListRoute,       screen_id: loans-list }
  - { graph_route: BillsGraphRoute,          start_route: BillRemindersListRoute,       screen_id: bills-list }
  - { graph_route: RatesGraphRoute,          start_route: RatesListRoute,               screen_id: rates }
  - { graph_route: CurrencyRatesGraphRoute,  start_route: CurrencyRatesRoute,           screen_id: currency-rates-list }
  - { graph_route: MacroGraphRoute,          start_route: "CountryMacroRoute(US)",      screen_id: macro }
  - { graph_route: CryptoGraphRoute,         start_route: CoinMarketsListRoute,         screen_id: coinMarkets }
  - { graph_route: CalculatorsGraphRoute,    start_route: AffordabilityCalculatorRoute, screen_id: affordability-calculator }
  - { graph_route: PriceAlertsGraphRoute,    start_route: PriceAlertsListRoute,         screen_id: alerts-list, provenance: PROPOSED }
  # single-destination graphs / standalone destinations
  - { graph_route: "(standalone)",           start_route: EmiCalculatorRoute,           screen_id: emiCalculator }
  - { graph_route: "(standalone)",           start_route: AmortizationScheduleRoute,    screen_id: amortization-schedule }
  - { graph_route: SettingsRoute,            start_route: SettingsRoute,                screen_id: settings }

# ---------------------------------------------------------------------------
# 3. Secondary / drill-down route → screen_id (non-start destinations)
# ---------------------------------------------------------------------------
secondary_route_to_screen:
  - { route: "LoanDetailRoute(loanId)",             screen_id: loan-detail }
  - { route: "AddOrEditLoanRoute(loanId?)",         screen_id: loan-addedit }
  - { route: "AddOrEditBillReminderRoute(billId?)", screen_id: bill-addedit }
  - { route: "RateDetailRoute(seriesId)",           screen_id: rateDetail }
  - { route: RateHistoryRoute,                      screen_id: rate-history }
  - { route: "AmortizationRoute(loanId?)",          screen_id: amortization, note: "calculators leaf" }
  - { route: LoanComparisonRoute,                   screen_id: comparison }
  - { route: "LoanCalcWizardRoute(scenarioId?)",    screen_id: wizard }
  - { route: CountryPickerRoute,                    screen_id: countryPicker }
  - { route: "IndicatorDetailRoute(countryCode, indicatorKindName)", screen_id: macroIndicatorDetail }
  - { route: NotificationRoute,                     screen_id: notification }
  - { route: StateGalleryRoute,                     screen_id: state-gallery }
  - { route: TransitionGalleryRoute,                screen_id: transition-gallery }
  - { route: "TransitionDemoRoute(variantName)",    screen_id: transition-demo }
  - { route: WatchlistRoute,                        screen_id: watchlist, provenance: "nav graph not yet shipped" }
  - { route: "AddOrEditAlertRoute(alertId?)",       screen_id: alert-addedit, provenance: PROPOSED }

# ---------------------------------------------------------------------------
# 4. Planned / not-yet-shipped targets (documented so nav-resolution treats them
#    as PLANNED rather than dead)
# ---------------------------------------------------------------------------
planned_targets:
  - { token: coinDetail,  route: "CoinDetailRoute(coinId)", screen_id: coinDetail, status: planned,
      referenced_by: [coinMarkets.onCoinClick, watchlist.watchlist_row_tap],
      note: "Data-wired, nav destination NOT shipped — onCoinClick is an intentional no-op at HEAD; arrives with a future crypto sub-plan." }

# ---------------------------------------------------------------------------
# 5. Shell / synthetic targets that are NOT routable screens (must not be flagged dead)
# ---------------------------------------------------------------------------
non_screen_targets:
  - { token: nav-host,             kind: shell-container,  note: "authenticated NavHost — HomeDestination start destination (screens/home inbound from: nav-host)" }
  - { token: authenticated-navbar, kind: shell-container,  note: "app bottom-nav host (AuthenticatedNavbarNavigationScreen) — shell-return via popBackStackSafely(), no screen file expected" }
  - { token: hub,                  kind: shell-container,  note: "generic tools/home hub token used in screens/currency-rates inbound_routes — resolves to home" }
  - { token: caller,               kind: dynamic-back,     note: "popBackStackSafely() to whichever surface launched the leaf — resolved at runtime" }
  - { token: back,                 kind: dynamic-back,     note: "system/TopAppBar back → popBackStackSafely()" }
  - { token: dev-menu,             kind: dialog-gateway,   note: "DevMenuDialog overlay (non-release) — gateway into flow-dev-showcase, not a routed screen" }
  - { token: theme-dialog,         kind: dialog-overlay,   note: "SettingsDialog AlertDialog overlay — no route" }
  - { token: language-dialog,      kind: dialog-overlay,   note: "LanguageDialog AlertDialog overlay — no route" }
  - { token: currency-spot-converter, kind: embedded-component, note: "spot-converter facet rendered inside CurrencyRatesScreen VM — route: none, not a nav destination" }
  - { token: add-to-watchlist,     kind: embedded-component, note: "star toggle embedded on CoinMarkets rows + CoinDetail — not a routed node" }
