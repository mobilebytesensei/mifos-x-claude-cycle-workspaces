# flows/kmp-project-template-flows.yaml
# T1 flow-group index + definitions — all 16 Money Toolkit flow groups in one file
# (RULE-FLOW-INDEX-001). Generated by /idea sync STEP 4 / /idea-flows, 2026-07-25.
#
# Derived STRICTLY from the 15 per-feature screens/{feature}/flow.yaml siblings —
# their flow_groups / participates_in_flows membership + inbound_routes / outbound_routes.
# `id` == `name` is the kebab flow-group tag (matches screens/*/flow.yaml#flow_groups,
# resolves flow_ref_unknown); `title` carries the human label. Every connection below
# traces to a declared route in a per-feature flow.yaml — no invented edges.
#
# Nav-target / callback names used in home-hub edges are resolved to real screen_ids
# via the sibling ROUTE_SCREEN_INDEX.yaml. Cross-cutting `flow: ad-hoc` edges are
# declared in kmp-project-template-bridge-flows.yaml.

schema_version: "1.0"
project: kmp-project-template
app_name: "Money Toolkit"
source: "screens/*/flow.yaml flow_groups + inbound_routes/outbound_routes"

# ---------------------------------------------------------------------------
# App entry topology (grounded in screens/home/flow.yaml#bottom_nav_tabs +
# screens/profile/flow.yaml + the crypto-cluster entry agreed at /idea sync STEP 3).
# ---------------------------------------------------------------------------
app_entry_topology:
  authenticated_navhost_start: home            # HomeDestination is the NavHost startDestination
  bottom_nav:
    tab_count: 2
    tabs:
      - { tab: HomeTab,    screen: home,    graph: HomeDestination,    start: HomeRoute,    active_default: true }
      - { tab: ProfileTab, screen: profile, graph: ProfileDestination, start: ProfileRoute, active_default: false }
  crypto_cluster_entry:
    description: >-
      The crypto cluster is reached from the home dashboard "Markets" tile, NOT a
      bottom-nav tab. Home 'Markets' tile → coinMarkets; from Coin Markets the
      top-bar actions branch to watchlist + alerts-list.
    path: "home --Markets tile--> coinMarkets --top-bar--> {watchlist, alerts-list}"

flows:

  # -------------------------------------------------------------------------
  - id: flow-home-hub
    name: flow-home-hub
    title: "Home Hub"
    type: hub
    description: >-
      The post-auth landing dashboard — a single scrolling surface whose tiles / cards
      fan out to every tool feature. Home owns no sub-screens; each target is a
      cross-feature navigation callback threaded from the app nav graph.
    entry_screen: home
    screens:
      - home
      - loans-list
      - bills-list
      - rates
      - currency-rates-list
      - emiCalculator
      - affordability-calculator
      - amortization
      - comparison
      - wizard
      - rate-history
      - macro
      - coinMarkets
    connections:
      - { from: authenticated-navhost, to: home,                    trigger: "auth success — HomeDestination NavHost start",       type: replace }
      - { from: profile,               to: home,                    trigger: "tap Home tab in bottom nav",                         type: shell-tab-switch }
      - { from: home, to: loans-list,          trigger: "tap loan carousel tile / hero",                         type: push }   # onNavigateToLoans
      - { from: home, to: bills-list,          trigger: "tap Upcoming Bills 'See all'",                          type: push }   # onNavigateToBills
      - { from: home, to: rates,               trigger: "tap Today's Rates 'See all'",                           type: push }   # onNavigateToRates
      - { from: home, to: currency-rates-list, trigger: "tap USD Exchange 'See all' / Currency Rates tile",      type: push }   # onNavigateToExchangeRates
      - { from: home, to: emiCalculator,       trigger: "tap EMI Calculator tile",                               type: push }   # onNavigateToEmi
      - { from: home, to: affordability-calculator, trigger: "tap Affordability tile",                           type: push }   # onNavigateToAffordability
      - { from: home, to: amortization,        trigger: "tap Amortization tile",                                 type: push }   # onNavigateToAmortization (calculators AmortizationRoute)
      - { from: home, to: comparison,          trigger: "tap Compare Loans tile",                                type: push }   # onNavigateToLoanComparison
      - { from: home, to: wizard,              trigger: "tap Loan Wizard tile",                                  type: push }   # onNavigateToLoanCalcWizard
      - { from: home, to: rate-history,        trigger: "tap Rate History tile",                                 type: push }   # onNavigateToRateHistory
      - { from: home, to: macro,               trigger: "tap Country Macro tile",                                type: push }   # onNavigateToMacro
      - { from: home, to: coinMarkets,         trigger: "tap Markets tile (crypto-cluster entry)",               type: push }   # onNavigateToCrypto
    in_screen_actions:
      - { screen: home, action: RefreshAll,        trigger: "pull-to-refresh",                       effect: "re-fetch exchange + both FRED rate series" }
      - { screen: home, action: RetryRates,        trigger: "Rates card freshness-indicator tap",    effect: "re-fetch DFF + MORTGAGE30US" }
      - { screen: home, action: RetryExchangeRate, trigger: "Exchange card freshness-indicator tap", effect: "re-fetch USD-base Frankfurter rates" }

  # -------------------------------------------------------------------------
  - id: flow-shell
    name: flow-shell
    title: "App Shell (bottom nav)"
    type: app-shell
    description: >-
      The authenticated bottom-navigation shell — 2 tabs (Home + Profile). Home is the
      active-default start destination; Profile is a terminal leaf tab with no interactive
      elements (the only exit is switching tabs, handled by the navbar host).
    entry_screen: home
    screens:
      - home
      - profile
    connections:
      - { from: authenticated-navbar, to: home,    trigger: "app launch / auth success — HomeTab active_default", type: replace }
      - { from: home,                 to: profile, trigger: "tap Profile tab in bottom nav",                       type: shell-tab-switch }
      - { from: profile,              to: home,    trigger: "tap Home tab in bottom nav",                          type: shell-tab-switch }

  # -------------------------------------------------------------------------
  - id: flow-settings
    name: flow-settings
    title: "App Settings"
    type: user-journey
    description: >-
      App settings tree — theme + language are in-screen AlertDialog overlays (no route);
      NotificationRoute is a registered sibling destination. Back is a shell-return via
      popBackStackSafely() to the navbar host.
    entry_screen: settings
    screens:
      - settings
      - notification
      - theme-dialog       # AlertDialog overlay (no route)
      - language-dialog    # AlertDialog overlay (no route)
    connections:
      - { from: authenticated-navbar, to: settings,        trigger: "settings icon tap (navbar chrome)",       type: push }
      - { from: settings,        to: theme-dialog,         trigger: "tap Change Theme card",                    type: open_dialog }
      - { from: settings,        to: language-dialog,      trigger: "tap Change Language card",                 type: open_dialog }
      - { from: theme-dialog,    to: settings,             trigger: "OK / scrim dismiss",                       type: dismiss_dialog }
      - { from: language-dialog, to: settings,             trigger: "OK / scrim dismiss",                       type: dismiss_dialog }
      - { from: settings,        to: authenticated-navbar, trigger: "TopAppBar back → popBackStackSafely()",    type: shell-return }
      - { from: notification,    to: caller,               trigger: "TopAppBar back → popBackStackSafely()",    type: pop }
    notes:
      - "NotificationRoute is registered (notificationDestination / navigateToNotification) but has no declared inbound SCREEN edge in source — reached programmatically. Registered-leaf, not a dead target."
      - "settings → dev-menu (version footer long-press) is a `flow: ad-hoc` edge — see bridge-flows; it opens the DevMenuDialog gateway into flow-dev-showcase (non-release builds only)."

  # -------------------------------------------------------------------------
  - id: flow-dev-showcase
    name: flow-dev-showcase
    title: "Dev Component & Pattern Gallery"
    type: dev-only
    surface: dev-only
    description: >-
      DEV-ONLY gallery reachable ONLY via the Settings dev menu, and ONLY in non-release
      builds (onStateGalleryClick/onTransitionGalleryClick = null in release). Stripped by
      forks that drop the reference gallery.
    entry_screen: state-gallery
    screens:
      - state-gallery
      - transition-gallery
      - transition-demo
    connections:
      - { from: settings,            to: state-gallery,      trigger: "dev menu → 'State Gallery' (non-release)",       type: push }
      - { from: settings,            to: transition-gallery, trigger: "dev menu → 'Transition Gallery' (non-release)",  type: push }
      - { from: transition-gallery,  to: transition-demo,    trigger: "tap a TransitionVariant button",                 type: push }
      - { from: transition-demo,     to: transition-gallery, trigger: "LaunchedEffect delay(2000) → auto-pop",          type: pop }
      - { from: state-gallery,       to: settings,           trigger: "TopAppBar back → popBackStackSafely()",          type: pop }
      - { from: transition-gallery,  to: settings,           trigger: "TopAppBar back → popBackStackSafely()",          type: pop }

  # -------------------------------------------------------------------------
  - id: flow-loans-browse
    name: flow-loans-browse
    title: "Browse Loans"
    type: user-journey
    description: >-
      Browse the personal loan list, drill into a loan detail, and view its amortization
      schedule (cross-feature leaf in feat-amortization).
    entry_screen: loans-list
    screens:
      - loans-list
      - loan-detail
      - amortization-schedule
    connections:
      - { from: home,        to: loans-list,            trigger: "navigateToLoans / LoansGraphRoute",              type: push }
      - { from: loans-list,  to: loan-detail,           trigger: "tap loan row (short-tap)",                       type: push }
      - { from: loans-list,  to: home,                  trigger: "TopAppBar back → Home dashboard",                type: pop }
      - { from: loan-detail, to: amortization-schedule, trigger: "tap 'Schedule' outlined button (loanId)",        type: push }   # feat-amortization authoritative edge; loans-side tags this ad-hoc
      - { from: loan-detail, to: loans-list,            trigger: "TopAppBar back → Loans list",                    type: pop }
      - { from: amortization-schedule, to: loan-detail, trigger: "TopAppBar back → popBackStackSafely()",          type: pop }

  # -------------------------------------------------------------------------
  - id: flow-loans-manage
    name: flow-loans-manage
    title: "Manage Loans"
    type: user-journey
    description: "Create, edit, and delete loans via the add/edit form; delete-in-place on the list + detail."
    entry_screen: loans-list
    screens:
      - loans-list
      - loan-detail
      - loan-addedit
    connections:
      - { from: loans-list,   to: loan-addedit, trigger: "tap New loan FAB (loanId=null)",                    type: push }
      - { from: loans-list,   to: loans-list,   trigger: "long-press → confirm delete (stream re-emits)",     type: mutate_in_place }
      - { from: loan-detail,  to: loan-addedit, trigger: "tap Edit (loanId)",                                 type: push }
      - { from: loan-detail,  to: loans-list,   trigger: "delete confirm → repository.delete → pop",          type: pop }
      - { from: loan-addedit, to: loans-list,   trigger: "Save success (SubmitState.Submitted) → onSaved()",  type: pop }
      - { from: loan-addedit, to: loans-list,   trigger: "TopAppBar back → previous screen",                  type: pop }

  # -------------------------------------------------------------------------
  - id: flow-calculators
    name: flow-calculators
    title: "Loan Calculators"
    type: user-journey
    description: >-
      Four sibling calculator leaves (EMI, Affordability, Amortization, Comparison) plus
      the multi-step Loan Calc Wizard. No hub screen — each is reached via its own
      navigateTo* entry from home and returns to caller via popBackStackSafely().
    entry_screen: affordability-calculator     # CalculatorsGraphRoute start destination
    screens:
      - emiCalculator
      - affordability-calculator
      - amortization
      - comparison
      - wizard
    connections:
      - { from: home,          to: emiCalculator,             trigger: "navigateToEmiCalculator()",             type: push }
      - { from: home,          to: affordability-calculator,  trigger: "navigateToAffordability()",              type: push }
      - { from: home,          to: amortization,              trigger: "navigateToAmortization()",               type: push }
      - { from: home,          to: comparison,                trigger: "navigateToLoanComparison()",             type: push }
      - { from: home,          to: wizard,                    trigger: "navigateToLoanCalcWizard(scenarioId?)",  type: push }
      - { from: emiCalculator, to: home,                      trigger: "TopAppBar back → popBackStackSafely()",  type: pop }
      - { from: affordability-calculator, to: caller,         trigger: "TopAppBar back → popBackStackSafely()",  type: pop }
      - { from: amortization,  to: caller,                    trigger: "TopAppBar back → popBackStackSafely()",  type: pop }
      - { from: comparison,    to: caller,                    trigger: "TopAppBar back → popBackStackSafely()",  type: pop }
      - { from: wizard,        to: caller,                    trigger: "TopAppBar back → EXIT wizard (popBackStackSafely)", type: pop }
      - { from: wizard,        to: wizard,                    trigger: "Step 5 Save → repository.upsert(Loan) → form reset", type: mutate_in_place }
    notes:
      - "Intra-wizard step transitions (currentStep 1..5) are state-machine cursor moves, NOT screen navigation — see ui.yaml#screens[wizard].flow_logic."
      - "calculators.amortization (AmortizationRoute, loanId?) is DISTINCT from feat-amortization's amortization-schedule (AmortizationScheduleRoute) reached from loan-detail — see ROUTE_SCREEN_INDEX.yaml."

  # -------------------------------------------------------------------------
  - id: flow-bills-browse
    name: flow-bills-browse
    title: "Browse Bills"
    type: user-journey
    description: "Browse the bill-reminders list from the home dashboard."
    entry_screen: bills-list
    screens:
      - bills-list
    connections:
      - { from: home,       to: bills-list, trigger: "navigateToBills / BillsGraphRoute",  type: push }
      - { from: bills-list, to: home,       trigger: "TopAppBar back → Home dashboard",    type: pop }

  # -------------------------------------------------------------------------
  - id: flow-bills-manage
    name: flow-bills-manage
    title: "Manage Bills"
    type: user-journey
    description: >-
      Add/edit bill reminders (a row short-tap opens the edit form directly — no detail
      screen) and mark-paid in place. Save shows 'Saved ✓ / Add another' without auto-pop.
    entry_screen: bills-list
    screens:
      - bills-list
      - bill-addedit
    connections:
      - { from: bills-list,   to: bill-addedit, trigger: "tap New bill FAB (billId=null)",                 type: push }
      - { from: bills-list,   to: bill-addedit, trigger: "tap bill row (short-tap → edit mode)",           type: push }
      - { from: bills-list,   to: bills-list,   trigger: "Paid button → upsert + cancel notification",     type: mutate_in_place }
      - { from: bill-addedit, to: bill-addedit, trigger: "Save success → 'Saved ✓' + 'Add another'",       type: mutate_in_place }
      - { from: bill-addedit, to: bills-list,   trigger: "TopAppBar back → Bills list",                    type: pop }

  # -------------------------------------------------------------------------
  - id: flow-rates
    name: flow-rates
    title: "Interest Rate Tracker"
    type: user-journey
    description: "Interest-rate list (4 FRED series) → per-series 365-day drill-down detail."
    entry_screen: rates
    screens:
      - rates
      - rateDetail
    connections:
      - { from: home,       to: rates,      trigger: "tap Interest Rates tile",                          type: push }
      - { from: rates,      to: rateDetail, trigger: "tap rate row card (seriesId)",                     type: push }
      - { from: rates,      to: caller,     trigger: "TopAppBar back → popBackStackSafely()",            type: pop }
      - { from: rateDetail, to: rates,      trigger: "TopAppBar back → popBackStackSafely()",            type: pop }
    in_screen_actions:
      - { screen: rates,      action: RefreshAll,     trigger: "refresh-all icon / freshness tap", effect: "re-fetch all 4 FRED series" }
      - { screen: rates,      action: "Retry{Row}",   trigger: "per-row error-slot retry tap",     effect: "re-fetch that row's series only" }
      - { screen: rateDetail, action: "Refresh/Retry", trigger: "refresh icon / error retry tap",  effect: "re-fetch the single series" }

  # -------------------------------------------------------------------------
  - id: flow-currency-rates
    name: flow-currency-rates
    title: "Currency Rates"
    type: user-journey
    description: >-
      FX rates list + a Rate History screen. Both are graph destinations, but source wires
      no in-graph list→history edge — each is reached independently via its own home-hub
      entry (navigateToCurrencyRates / navigateToRateHistory).
    entry_screen: currency-rates-list
    screens:
      - currency-rates-list
      - rate-history
    connections:
      - { from: home,                to: currency-rates-list, trigger: "tap Currency Rates tile / USD Exchange 'See all'", type: push }
      - { from: home,                to: rate-history,        trigger: "tap Rate History tile (navigateToRateHistory)",    type: push }
      - { from: currency-rates-list, to: caller,              trigger: "TopAppBar back → popBackStackSafely()",            type: pop }
      - { from: rate-history,        to: caller,              trigger: "TopAppBar back → popBackStackSafely()",            type: pop }
    in_screen_actions:
      - { screen: currency-rates-list, action: "Search(query)", trigger: "search field text change", effect: "filter rates map live; Empty on no match" }
      - { screen: currency-rates-list, action: Retry,   trigger: "freshness indicator tap / error retry", effect: "exchangeRatesStream.retry()" }
      - { screen: currency-rates-list, action: Refresh, trigger: "pull-to-refresh",                        effect: "exchangeRatesStream.refresh()" }
      - { screen: rate-history, action: "SelectCurrency(code)", trigger: "currency FilterChip tap", effect: "new RateHistoryKey → re-fetch USD→code window" }
      - { screen: rate-history, action: "SelectPeriod(days)",   trigger: "period FilterChip tap",   effect: "new RateHistoryKey → re-fetch window" }
      - { screen: rate-history, action: Retry, trigger: "freshness indicator tap / error retry", effect: "rateHistoryStream.retry()" }

  # -------------------------------------------------------------------------
  - id: flow-macro
    name: flow-macro
    title: "Country Macro Snapshot"
    type: user-journey
    description: >-
      Country macro dashboard (defaults to US) → country picker (re-keys the dashboard) and
      → per-indicator 25-year detail drill-down.
    entry_screen: macro
    screens:
      - macro
      - countryPicker
      - macroIndicatorDetail
    connections:
      - { from: home,                 to: macro,                trigger: "tap Country Macro tile (US default)",       type: push }
      - { from: macro,                to: countryPicker,        trigger: "tap country chip (TopAppBar)",              type: push }
      - { from: macro,                to: macroIndicatorDetail, trigger: "tap indicator card",                        type: push }
      - { from: macro,                to: caller,               trigger: "TopAppBar back → popBackStackSafely()",     type: pop }
      - { from: countryPicker,        to: macro,                trigger: "tap country row → rebuild dashboard (popUpTo inclusive)", type: replace }
      - { from: countryPicker,        to: macro,                trigger: "TopAppBar back → dashboard (unchanged)",    type: pop }
      - { from: macroIndicatorDetail, to: macro,                trigger: "TopAppBar back → macro dashboard",          type: pop }
    in_screen_actions:
      - { screen: macro,                action: RefreshAll,         trigger: "refresh-all icon tap",   effect: "re-fetch all 3 World Bank indicators for the current country" }
      - { screen: macro,                action: "Retry{Indicator}", trigger: "per-card Retry tap",     effect: "re-fetch that card's indicator only" }
      - { screen: macro,                action: ChangeCountry,      trigger: "picker returns a code",  effect: "cancel + re-subscribe all 3 streams on the new country" }
      - { screen: countryPicker,        action: Search,             trigger: "search text change",     effect: "filter SupportedCountries.search(query) in-process" }
      - { screen: macroIndicatorDetail, action: "Refresh/Retry",    trigger: "retry / refresh",        effect: "re-fetch the single (country, indicator) pair" }

  # -------------------------------------------------------------------------
  - id: flow-crypto
    name: flow-crypto
    title: "Crypto Coin Markets"
    type: user-journey
    description: >-
      CoinGecko paged coin-markets list (the crypto-cluster app-shell entry, reached from
      the home 'Markets' tile). Top-bar actions branch to watchlist + alerts. A per-coin
      detail (coinDetail) is data-wired but NOT shipped — onCoinClick is an intentional no-op.
    entry_screen: coinMarkets
    screens:
      - coinMarkets
      - watchlist
      - alerts-list
    planned_screens:
      - { screen: coinDetail, route: "CoinDetailRoute(coinId)", status: planned, note: "future sub-plan — replaces the no-op onCoinClick" }
    connections:
      - { from: home,        to: coinMarkets, trigger: "tap Markets tile (crypto-cluster entry)",       type: push }
      - { from: coinMarkets, to: watchlist,   trigger: "top-bar Watchlist action",                      type: push }
      - { from: coinMarkets, to: alerts-list, trigger: "top-bar Price-alerts action",                   type: push }
      - { from: coinMarkets, to: caller,      trigger: "TopAppBar back → popBackStackSafely()",         type: pop }
      - { from: coinMarkets, to: coinDetail,  trigger: "tap coin row (PLANNED — no-op at HEAD)",        type: push, status: planned }
      - { from: watchlist,   to: coinDetail,  trigger: "tap watchlist coin row (arrives with sub-plan)", type: push, status: planned }
      - { from: watchlist,   to: coinMarkets, trigger: "TopAppBar back → previous surface",             type: pop }
    in_screen_actions:
      - { screen: coinMarkets, action: "retry (refresh)",   trigger: "pull-to-refresh / initial-error retry", effect: "pagingStream.refresh() — reset cursor to page 0" }
      - { screen: coinMarkets, action: "load-more (append)", trigger: "scroll near list tail",                effect: "PagingScreenStream requests page N+1 (per_page 20)" }

  # -------------------------------------------------------------------------
  - id: flow-watchlist-track
    name: flow-watchlist-track
    title: "Crypto Watchlist"
    type: user-journey
    description: >-
      Personal crypto watchlist — a star toggle embedded on crypto coin surfaces
      (CoinMarkets rows + CoinDetail) plus the standalone Watchlist screen. Nav graph not
      yet shipped; the data layer is in-tree, destinations are documented intent.
    entry_screen: watchlist
    screens:
      - watchlist
      - coin-markets
      - add-to-watchlist        # embedded star component (not a routed node)
    connections:
      - { from: home,             to: watchlist,        trigger: "navigateToWatchlist (when wired)",             type: push }
      - { from: watchlist,        to: watchlist,        trigger: "tap filled star → repository.remove (stream re-emits)", type: mutate_in_place }
      - { from: watchlist,        to: coin-markets,     trigger: "empty-state CTA → open Coin Markets to add coins", type: push }
      - { from: add-to-watchlist, to: add-to-watchlist, trigger: "tap star → add()/remove() via SubmitHandler → contains() re-emits", type: mutate_in_place }

  # -------------------------------------------------------------------------
  - id: flow-alerts-browse
    name: flow-alerts-browse
    title: "Browse Price Alerts"
    type: user-journey
    provenance: modeled-from-data-contract     # feature/alerts has no nav source yet; route names PROPOSED
    description: >-
      Browse the price-alerts list, reached from both the home dashboard and the Coin
      Markets top-bar Price-alerts action (crypto-cluster entry, /idea sync STEP 3).
    entry_screen: alerts-list
    screens:
      - alerts-list
    connections:
      - { from: home,        to: alerts-list, trigger: "navigateToAlerts / PriceAlertsGraphRoute",  type: push }
      - { from: coinMarkets, to: alerts-list, trigger: "Coin Markets top-bar Price-alerts action",  type: push }
      - { from: alerts-list, to: home,        trigger: "TopAppBar back → Home dashboard",            type: pop }

  # -------------------------------------------------------------------------
  - id: flow-alerts-manage
    name: flow-alerts-manage
    title: "Manage Price Alerts"
    type: user-journey
    provenance: modeled-from-data-contract
    description: "Add/edit/delete price alerts via the add/edit form; delete-in-place on the list."
    entry_screen: alerts-list
    screens:
      - alerts-list
      - alert-addedit
    connections:
      - { from: alerts-list,   to: alert-addedit, trigger: "tap New alert FAB (alertId=null)",         type: push }
      - { from: alerts-list,   to: alert-addedit, trigger: "tap alert row (edit mode)",                type: push }
      - { from: alerts-list,   to: alerts-list,   trigger: "row delete icon → deleteAlert(id)",        type: mutate_in_place }
      - { from: alert-addedit, to: alerts-list,   trigger: "Save success → onSaved() pops back",       type: pop }
      - { from: alert-addedit, to: alerts-list,   trigger: "TopAppBar back → Alerts list",             type: pop }
