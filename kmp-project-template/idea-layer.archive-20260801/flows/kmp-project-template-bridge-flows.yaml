# flows/kmp-project-template-bridge-flows.yaml
# Cross-cutting synthetic bridge flow(s) — NOT release-scoped user journeys.
#
# Several per-feature screens/*/flow.yaml edges carry `flow: ad-hoc` (a cross-cutting
# nav grouping rather than a named user journey). Because they span every release phase
# by construction they carry the RULE-IDEA-RELEASE-PHASES-001 `phase_assignment: unscoped`
# waiver. Declaring them here resolves the G-GRAPH-PHASE "phantom bridge flow" finding —
# every `flow:` route tag found in a per-screen sibling now maps to a declared flow.

schema_version: "1.0"
project: kmp-project-template
app_name: "Money Toolkit"
source: "screens/*/flow.yaml edges tagged `flow: ad-hoc`"
phase_assignment: unscoped   # explicit waiver — cross-cutting nav, not part of any release phase

flows:
  - id: ad-hoc
    name: ad-hoc
    title: "Ad-hoc Navigation"
    type: bridge
    phase_assignment: unscoped
    description: >-
      Cross-cutting quick-access + shell-return jumps not tied to a named user journey:
      the top-bar Settings action from home, the Settings dev-menu gateway into the dev
      showcase, and the loan-detail → amortization-schedule schedule jump.
    screens:
      - home
      - settings
      - dev-menu           # DevMenuDialog gateway (non-release only) → flow-dev-showcase
      - loan-detail
      - amortization-schedule
    connections:
      - { from: home,        to: settings,               trigger: "tap Settings icon (top bar)",                            type: push }        # screens/home outbound settings_icon_tap
      - { from: settings,    to: dev-menu,               trigger: "version footer long-press → DevMenuDialog (non-release)", type: open_dialog } # screens/settings outbound version_footer_long_press
      - { from: loan-detail, to: amortization-schedule,  trigger: "tap 'Schedule' outlined button (loanId)",                type: push }        # screens/loans outbound schedule_tap (loans-side tag; feat-amortization tags flow-loans-browse)
    notes:
      - "The loan-detail → amortization-schedule edge is dual-tagged: screens/loans/flow.yaml tags it `ad-hoc`, screens/amortization/flow.yaml (authoritative owner) tags it `flow-loans-browse`. It is realised in flow-loans-browse; listed here only to account for the loans-side ad-hoc tag."
      - "dev-menu is a dialog gateway, not a routed screen — it exposes the State/Transition Gallery entries that push into flow-dev-showcase in non-release builds."
