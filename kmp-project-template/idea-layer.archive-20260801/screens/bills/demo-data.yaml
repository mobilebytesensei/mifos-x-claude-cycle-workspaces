# demo-data.yaml — feature/bills demo data (B4 Bill Reminders).
# Local-only Room rows for the banking_bill_reminders table. BillReminder DTO shape mirrors
# core/model/demo/banking/BillReminder.kt (dedup by id, no placeholders).
# Sorted dueDay-ascending to match the DAO order the list screen renders.
schema_version: "1.0"
screen_id: bills-list

consumes:
  - collection: bills
    dto: BillReminder
    table: banking_bill_reminders
    used_by: [observe-all-bills, observe-upcoming-bills, observe-total-upcoming-amount, observe-bill-by-id, get-bill-by-id, observe-bill-count]

# Representative sample bill reminders (BillReminder DTO: id, name, amount, dueDay,
# recurrence [MONTHLY|QUARTERLY|ANNUALLY|ONCE], category [UTILITIES|HOUSING|TRANSPORT|
# FOOD|SUBSCRIPTIONS|OTHER], enabled, reminderDaysBefore, createdAtMs, updatedAtMs).
samples:
  bills:
    - id: bill-rent-01
      name: "Apartment Rent"
      amount: 1450.00
      dueDay: 1
      recurrence: MONTHLY
      category: HOUSING
      enabled: true
      reminderDaysBefore: 3
      createdAtMs: 1735689600000
      updatedAtMs: 1750000000000

    - id: bill-electricity-01
      name: "Electricity Bill"
      amount: 92.40
      dueDay: 5
      recurrence: MONTHLY
      category: UTILITIES
      enabled: true
      reminderDaysBefore: 2
      createdAtMs: 1735689600000
      updatedAtMs: 1749000000000

    - id: bill-internet-01
      name: "Internet & Fibre"
      amount: 59.99
      dueDay: 12
      recurrence: MONTHLY
      category: UTILITIES
      enabled: true
      reminderDaysBefore: 1
      createdAtMs: 1717200000000
      updatedAtMs: 1748000000000

    - id: bill-streaming-01
      name: "Streaming Bundle"
      amount: 22.99
      dueDay: 15
      recurrence: MONTHLY
      category: SUBSCRIPTIONS
      enabled: false
      reminderDaysBefore: 1
      createdAtMs: 1704067200000
      updatedAtMs: 1749500000000

    - id: bill-carinsurance-01
      name: "Car Insurance"
      amount: 384.00
      dueDay: 20
      recurrence: QUARTERLY
      category: TRANSPORT
      enabled: true
      reminderDaysBefore: 5
      createdAtMs: 1720000000000
      updatedAtMs: 1749800000000

    - id: bill-domain-01
      name: "Domain Renewal"
      amount: 14.00
      dueDay: 28
      recurrence: ANNUALLY
      category: OTHER
      enabled: true
      reminderDaysBefore: 7
      createdAtMs: 1730000000000
      updatedAtMs: 1749900000000

# Aggregates the summary HeroCard would reflect for the above 6 rows:
#   total bills             = 6 (5 enabled, 1 disabled — Streaming)
#   totalUpcomingAmount     = sum(amount) of enabled rows due within next 30 days
#   upcomingCount (7-day)   = count of enabled rows whose dueDay is within the next 7 days
