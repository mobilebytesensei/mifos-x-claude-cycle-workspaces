# flow.yaml — profile
# T2 per-screen flow sibling (RULE-FLOW-INDEX-001)
# Reverse-engineered from cmp-navigation/.../AuthenticatedNavbarNavigationScreen.kt +
# cmp-navigation/.../AuthenticatedNavBarTabItem.kt + feature/profile/.../ProfileRoute.kt.
screen_id: profile
feature_ref: feat-profile
flow_groups: [flow-shell]
participates_in_flows: [flow-shell]
entry_points:
  - id: from-navbar-tab
    description: "Selected as the Profile tab of the authenticated bottom navigation bar."
    trigger: profile_tab_tap
inbound_routes:
  - from: authenticated-navbar
    trigger: select_profile_tab
    flow: flow-shell
    note: >-
      AuthenticatedNavbarNavigationScreen wires the ProfileTab: on selection it calls
      navigateToProfile(navOptions = it); profileDestination() registers the ProfileRoute
      destination via composableWithStayTransitions. ProfileRoute is both the tab's
      graphRoute and startDestinationRoute (AuthenticatedNavBarTabItem.ProfileTab).
outbound_routes: []
  # Terminal leaf tab — the screen has NO interactive elements, NO buttons, and
  # no ViewModel, so it emits no navigation. The only way to leave is selecting a
  # different bottom-nav tab (handled by the navbar shell, not by this screen).
# ProfileRoute is a parameterless @Serializable data object — no route params.
route:
  type: ProfileRoute
  serializable: true
  params: []
