schema_version: "1.0"
screen_id: profile
# ─────────────────────────────────────────────────
# INTENTIONALLY EMPTY — pure-static local screen.
#
# The Profile tab is a purely presentational surface for the Money Toolkit,
# which runs entirely on-device with NO login and NO backend. ProfileScreen is a
# stateless @Composable: it has NO ViewModel, NO Supabase, NO Ktor client, NO
# repository, NO Store5 cache, NO DataStore/preferences, and NO network calls.
# It renders a fixed hero card (icon + title + message) and nothing more.
#
# Any future non-empty api[] here would be a reverse-engineering error — the
# source imports no service/repository and the screen holds no state.
# ─────────────────────────────────────────────────
api: []
