# flow.yaml — B7 Interest Rate Tracker
# Per-screen flow sibling. Two screens: rates (list) → rateDetail (per-series drill-down).
# Reverse-engineered from feature/rates/navigation/RatesNavigation.kt (nested nav graph).
screen_id: rates
feature_ref: feat-rates
flow_groups: [flow-rates]
participates_in_flows: [flow-rates]

# Nav graph: RatesGraphRoute(startDestination = RatesListRoute) { RatesListRoute, RateDetailRoute(seriesId) }
nav_graph:
  parent_route: RatesGraphRoute
  start_destination: RatesListRoute
  destinations:
    - { route: RatesListRoute, screen: rates, entry: "NavController.navigateToRates()" }
    - { route: "RateDetailRoute(seriesId: String)", screen: rateDetail, entry: "NavController.navigateToRateDetail(seriesId)" }

entry_points:
  - id: from-home-rates-tile
    description: "Home dashboard 'Interest Rates' tile / calculators hub → rates list"
    trigger: rates_tile_tap
  - id: back-from-detail
    description: "Back from a per-series detail returns to the list"
    trigger: detail_back

inbound_routes:
  - from: home
    trigger: rates_tile_tap
    to: rates
    flow: flow-rates
    label: "Home rates tile → Interest Rates list"

outbound_routes:
  - to: rateDetail
    action: navigate
    trigger: rate_row_tap
    params: { seriesId: "DFF | DPRIME | MORTGAGE30US | DGS10" }
    label: "Rate row card → per-series 365-day detail"
    flow: flow-rates
  - to: back
    action: navigate_back
    trigger: list_back_tap
    label: "Back (popBackStackSafely) → caller (home / calculators hub)"
    flow: flow-rates

# Detail screen's own outbound (drill-down leaf)
detail_routes:
  screen_id: rateDetail
  outbound_routes:
    - to: back
      action: navigate_back
      trigger: detail_back_tap
      label: "Back (popBackStackSafely) → rates list"
      flow: flow-rates

# In-screen actions that do NOT navigate (refresh / retry re-run the Store5 fetch)
in_screen_actions:
  - { screen: rates, action: RefreshAll, trigger: "refresh-all icon / freshness indicator tap", effect: "re-fetch all 4 FRED series" }
  - { screen: rates, action: "Retry{Row}", trigger: "per-row error-slot retry tap", effect: "re-fetch that row's series only" }
  - { screen: rateDetail, action: "Refresh/Retry", trigger: "refresh icon / error retry tap", effect: "re-fetch the single series" }
