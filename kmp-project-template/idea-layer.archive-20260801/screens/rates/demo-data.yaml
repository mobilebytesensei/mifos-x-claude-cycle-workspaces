# demo-data.yaml — B7 Interest Rate Tracker demo/offline data.
# Sample FRED observations for the four default RateSeriesCatalog series, shaped as
# InterestRateSeries (domain) / interest_rate_series (Room) rows. Used for offline
# render, previews, and tests (mirrors the fixtures in FakeEconomicRatesRepository /
# InterestRatesViewModelTest). Values are realistic-but-illustrative, NOT live FRED
# data. observations are trimmed samples (real windows carry ~365 daily rows).
schema_version: "1.0"
screen_id: rates

consumes:
  - collection: interest_rate_series
    dto: InterestRateSeries
    used_by: [fred-series-observations]

samples:
  interest_rate_series:
    - seriesId: DFF
      name: "Federal Funds Rate"
      unit: "%"
      source: "FRED"
      current: 5.33
      observations:
        - { date: "2026-05-19", value: 5.33 }
        - { date: "2026-05-20", value: 5.33 }
        - { date: "2026-05-21", value: 5.33 }
        - { date: "2026-05-22", value: 5.33 }
        - { date: "2026-05-23", value: 5.33 }

    - seriesId: DPRIME
      name: "Prime Rate"
      unit: "%"
      source: "FRED"
      current: 8.50
      observations:
        - { date: "2026-05-19", value: 8.50 }
        - { date: "2026-05-20", value: 8.50 }
        - { date: "2026-05-21", value: 8.50 }
        - { date: "2026-05-22", value: 8.50 }
        - { date: "2026-05-23", value: 8.50 }

    - seriesId: MORTGAGE30US
      name: "30-Year Mortgage"
      unit: "%"
      source: "FRED"
      current: 6.86
      # Freddie Mac weekly survey — weekly cadence, not daily.
      observations:
        - { date: "2026-04-24", value: 6.94 }
        - { date: "2026-05-01", value: 6.90 }
        - { date: "2026-05-08", value: 6.88 }
        - { date: "2026-05-15", value: 6.85 }
        - { date: "2026-05-22", value: 6.86 }

    - seriesId: DGS10
      name: "10-Year Treasury"
      unit: "%"
      source: "FRED"
      current: 4.42
      observations:
        - { date: "2026-05-19", value: 4.47 }
        - { date: "2026-05-20", value: 4.45 }
        - { date: "2026-05-21", value: 4.44 }
        - { date: "2026-05-22", value: 4.40 }
        - { date: "2026-05-23", value: 4.42 }

# Edge-case fixtures for state coverage.
edge_cases:
  - id: empty_series
    seriesId: DFF
    observations: []
    renders: "ScreenState.Empty (framework Empty slot) — series resolved with no observations in window."
  - id: fred_key_missing
    trigger: "FredApiConfig.apiKey = null AND no Room cache"
    renders: "ScreenState.Error — message 'FRED_API_KEY is not configured …' on every row."
  - id: single_observation
    seriesId: DGS10
    observations:
      - { date: "2026-05-23", value: 4.42 }
    renders: "Content but RateBadge hidden — computeOneDayDelta returns null with <2 observations."
