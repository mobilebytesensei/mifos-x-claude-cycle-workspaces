# demo-data.yaml — feature/alerts sample data (Price Alerts).
# ⚠ IMPORTANT: NO demo alert rows ship in source. Alerts are user-configured, so
# the `alerts` table starts EMPTY on first run (alerts-list → ScreenState.Empty).
# The samples below are ILLUSTRATIVE FIXTURES ONLY — they mirror the shape used by
# the real test (core/data/.../AlertsReactiveInvalidationTest.sampleAlert) and the
# PriceAlert DTO, for preview/test seeding. They are NOT a shipped seed set.
schema_version: "1.0"
screen_id: alerts-list

ships_empty: true                 # the `alerts` table has no seeded rows in source
purpose: illustrative_fixture     # preview / test seeding only — not a real demo dataset

consumes:
  - collection: alerts
    dto: PriceAlert
    table: alerts
    used_by: [observe-all-alerts]

# PriceAlert DTO: id, coinId, direction (ABOVE|BELOW|PCT_CHANGE), targetValue,
# enabled (default true), createdAtMs. Sorted newest-first to match the DAO order
# (ORDER BY createdAt DESC).
# ⚠ Round-trip caveat: on save→reload PCT_CHANGE degrades to BELOW and `enabled`
# resets to true (AlertEntity persists neither). Fixtures reflect the DTO the UI
# builds, not the lossy re-read.
samples:
  alerts:
    - id: alert-btc-above-01
      coinId: bitcoin
      direction: ABOVE
      targetValue: 75000.00        # USD threshold
      enabled: true
      createdAtMs: 1750000000000

    - id: alert-eth-below-01
      coinId: ethereum
      direction: BELOW
      targetValue: 2800.00         # USD threshold
      enabled: true
      createdAtMs: 1749000000000

    - id: alert-sol-pct-01
      coinId: solana
      direction: PCT_CHANGE
      targetValue: 10.0            # percent (24h move) — ⚠ degrades to BELOW after persistence
      enabled: false               # ⚠ resets to true after persistence (entity has no `enabled`)
      createdAtMs: 1748000000000
