# flow.yaml — feature/calculators (B3 Affordability · B5 Amortization · B6 Comparison + Wizard)
# Reverse-engineered from feature/calculators/navigation/CalculatorsNavigation.kt.
# Graph route: CalculatorsGraphRoute → startDestination AffordabilityCalculatorRoute.
# Four sibling leaf screens; NO hub screen — each is reachable via its own
# navigateTo* entry point and returns to the caller via popBackStackSafely().
screen_id: affordability-calculator
feature_ref: feat-calculators
graph_route: CalculatorsGraphRoute
start_destination: AffordabilityCalculatorRoute
flow_groups: [flow-calculators]
participates_in_flows: [flow-calculators]

entry_points:
  - id: from-home-affordability
    description: "navigateToAffordability() → the graph start destination."
    trigger: navigate_to_affordability
  - id: from-home-comparison
    description: "navigateToLoanComparison() → LoanComparisonRoute."
    trigger: navigate_to_comparison
  - id: from-home-wizard
    description: "navigateToLoanCalcWizard(scenarioId?) → LoanCalcWizardRoute."
    trigger: navigate_to_wizard
  # NOTE: loan-detail's 'Schedule' button is NOT an entry point to this graph.
  # That edge authoritatively targets feat-amortization's amortization-schedule
  # screen (see screens/amortization/flow.yaml + screens/loans/flow.yaml). The
  # calculators AmortizationRoute(loanId?) is reachable only via its own
  # navigateToAmortization entry point (home / calculators callers).

# Screen nodes in this feature graph.
nodes:
  - { id: affordability-calculator, route: AffordabilityCalculatorRoute, screen: AffordabilityCalculatorScreen }
  - { id: amortization,             route: "AmortizationRoute(loanId?)",  screen: AmortizationScreen }
  - { id: comparison,               route: LoanComparisonRoute,           screen: LoanComparisonScreen }
  - { id: wizard,                   route: "LoanCalcWizardRoute(scenarioId?)", screen: LoanCalcWizardScreen }

inbound_routes:
  - from: home
    to: affordability-calculator
    trigger: navigate_to_affordability
    flow: flow-calculators
    note: "AffordabilityCalculatorRoute is the graph start destination."
  - from: home
    to: comparison
    trigger: navigate_to_comparison
    flow: flow-calculators
  - from: home
    to: wizard
    trigger: navigate_to_wizard
    flow: flow-calculators
    params: { scenarioId: null }
  # DRIFT REMOVED: the loan-detail 'Schedule' → calculators.amortization inbound
  # edge was a duplicate of feat-amortization's authoritative amortization-schedule
  # edge. loan-detail routes to AmortizationScheduleRoute (feat-amortization), not
  # to this graph's AmortizationRoute. See screens/loans/flow.yaml (loan-detail
  # schedule_tap → amortization-schedule) + screens/amortization/flow.yaml.

outbound_routes:
  # Every screen is a terminal leaf — the only forward navigation is exit-to-caller.
  - from: affordability-calculator
    to: caller
    action: navigate_back
    trigger: back_button_tap
    label: "Back (TopAppBar arrow) → popBackStackSafely()"
    flow: flow-calculators
  - from: amortization
    to: caller
    action: navigate_back
    trigger: back_button_tap
    label: "Back → popBackStackSafely() (returns to the home / calculators caller)"
    flow: flow-calculators
  - from: comparison
    to: caller
    action: navigate_back
    trigger: back_button_tap
    label: "Back → popBackStackSafely()"
    flow: flow-calculators
  - from: wizard
    to: caller
    action: navigate_back
    trigger: back_button_tap
    label: "TopAppBar Back → popBackStackSafely() — EXITS the wizard (distinct from the in-wizard Back button = goBack() step machine)"
    flow: flow-calculators
  - from: wizard
    to: wizard
    action: mutate_in_place
    trigger: save_as_loan_tap
    label: "Step 5 Save → repository.upsert(Loan) into banking_loans → draft cleared → form reset to fresh scenario (no navigation; the new Loan is now visible in feat-loans)"
    flow: flow-calculators
    note: "Terminal write. The saved Loan surfaces in the feat-loans list/detail; the wizard itself resets in place rather than navigating."

# Intra-wizard step transitions are NOT screen navigation — they are state-machine
# cursor moves within LoanCalcWizardScreen (currentStep 1..5). See
# ui.yaml#screens[wizard].flow_logic for the full linear-wizard transition table.
wizard_internal_transitions:
  note: "goNext / goBack move currentStep and persist a snapshot to framework_submit_drafts; a resume AlertDialog appears on relaunch if a pending draft exists."
