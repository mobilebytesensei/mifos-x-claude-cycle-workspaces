# demo-data.yaml — feature/watchlist demo data (Personal Crypto Watchlist).
# The persisted watch-list rows are LOCAL-ONLY Room rows on `personal_watchlist`
# (WatchlistEntity: coinId, addedAtMs). Only real CoinGecko coin identifiers are used.
# The `coin_values` block is the CoinMarket data the watchlist JOINS against at render
# time — it is OWNED by feature/crypto (not this table); reproduced here so the
# value-resolved list can be previewed. Sorted newest-added-first (addedAtMs DESC),
# matching WatchlistDao.observeAll().
schema_version: "1.0"
screen_id: watchlist

consumes:
  - collection: watchlist
    dto: WatchlistItem
    table: personal_watchlist
    used_by: [observe-watchlist, observe-contains]
  - collection: coin_values
    dto: CoinMarket
    owner_feature: feat-crypto           # join source — not persisted by this feature
    used_by: [watchlist]                 # value-resolution join

# Persisted watch-list membership (WatchlistEntity: coinId, addedAtMs).
# Real CoinGecko ids; addedAtMs newest-first (bitcoin most recently added).
samples:
  watchlist:
    - { coinId: "bitcoin",  addedAtMs: 1752710400000 }   # newest
    - { coinId: "ethereum", addedAtMs: 1752624000000 }
    - { coinId: "solana",   addedAtMs: 1752537600000 }
    - { coinId: "cardano",  addedAtMs: 1752451200000 }   # oldest

  # Live values the list joins against (CoinMarket shape mirrors
  # core/model/demo/crypto/CoinMarket.kt). Representative CoinGecko-style figures.
  coin_values:
    - id: "bitcoin"
      symbol: "btc"
      name: "Bitcoin"
      imageUrl: "https://assets.coingecko.com/coins/images/1/large/bitcoin.png"
      currentPrice: 64250.00
      marketCap: 1268000000000
      marketCapRank: 1
      priceChangePercent24h: 1.84
      high24h: 64980.00
      low24h: 62710.00
    - id: "ethereum"
      symbol: "eth"
      name: "Ethereum"
      imageUrl: "https://assets.coingecko.com/coins/images/279/large/ethereum.png"
      currentPrice: 3410.55
      marketCap: 409800000000
      marketCapRank: 2
      priceChangePercent24h: -0.72
      high24h: 3475.10
      low24h: 3388.20
    - id: "solana"
      symbol: "sol"
      name: "Solana"
      imageUrl: "https://assets.coingecko.com/coins/images/4128/large/solana.png"
      currentPrice: 146.32
      marketCap: 67900000000
      marketCapRank: 5
      priceChangePercent24h: 3.11
      high24h: 149.80
      low24h: 141.05
    - id: "cardano"
      symbol: "ada"
      name: "Cardano"
      imageUrl: "https://assets.coingecko.com/coins/images/975/large/cardano.png"
      currentPrice: 0.39
      marketCap: 13900000000
      marketCapRank: 9
      priceChangePercent24h: -1.25
      high24h: 0.40
      low24h: 0.38

# Notes:
#  - Empty-state preview: an empty `watchlist` collection → WatchlistScreen renders
#    ScreenState.Empty ("No coins tracked yet" + CTA to Coin Markets).
#  - contains() demo: observe-contains("bitcoin") → true; observe-contains("dogecoin") → false.
#  - The star toggle add("dogecoin") would insert a new row with addedAtMs = now.
