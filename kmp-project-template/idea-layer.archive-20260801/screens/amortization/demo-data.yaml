# demo-data.yaml — feature/amortization demo data (B5 Amortization Schedule).
# Amortization owns NO table — it reads a single banking_loans row (by id) and computes
# the schedule in memory. So the "demo data" is the input loan it reads (a subset of the
# feature/loans banking_loans rows) plus the shape of the computed AmortizationRow output.
# No placeholders — loan fixtures mirror core/model/demo/banking/Loan.kt.
schema_version: "1.0"
screen_id: amortization-schedule

consumes:
  - collection: loans
    dto: Loan
    table: banking_loans
    used_by: [observe-loan-by-id]
    note: "Reads ONE loan by its route loanId; reuses the same banking_loans rows seeded for feature/loans."

produces:
  - collection: schedule
    dto: AmortizationRow
    persisted: false
    used_by: [compute-amortization-schedule]
    note: "Derived in memory via computeSchedule(loan) — never written to any table."

# Representative input loans the schedule can be computed from (subset of feature/loans rows).
samples:
  loans:
    - id: loan-auto-01
      name: "Auto Loan — Sedan"
      kind: AUTO
      principal: 28000.00
      principalRemaining: 15400.00
      annualRatePercent: 5.9
      tenureMonths: 60
      monthsRemaining: 33
      monthlyPayment: 539.86
      nextDueDate: "2026-08-05"
      totalPaid: 14576.22
      createdAtMs: 1717200000000
      updatedAtMs: 1749000000000

    - id: loan-personal-01
      name: "Personal Loan"
      kind: PERSONAL
      principal: 12000.00
      principalRemaining: 4800.00
      annualRatePercent: 11.0
      tenureMonths: 36
      monthsRemaining: 14
      monthlyPayment: 392.86
      nextDueDate: "2026-09-01"
      totalPaid: 8637.96
      createdAtMs: 1720000000000
      updatedAtMs: 1749500000000

    # Edge fixture: a fully-paid loan → monthsRemaining == 0 → ScreenState.Empty (no schedule).
    - id: loan-paidoff-00
      name: "Paid-off Loan"
      kind: OTHER
      principal: 5000.00
      principalRemaining: 0.00
      annualRatePercent: 7.0
      tenureMonths: 24
      monthsRemaining: 0
      monthlyPayment: 223.86
      nextDueDate: "2026-06-01"
      totalPaid: 5372.64
      createdAtMs: 1700000000000
      updatedAtMs: 1749900000000

# Shape of the computed output (illustrative — the FIRST computed row for loan-personal-01:
#   balance start = 4800.00, monthlyRate = 11.0/100/12 = 0.0091667
#   interest = 4800.00 × 0.0091667 = 44.00 ; principal = 392.86 − 44.00 = 348.86
#   balance  = 4800.00 − 348.86 = 4451.14). Row count == monthsRemaining (14).
schedule_row_shape:
  dto: AmortizationRow
  fields:
    - { name: month,     type: Int,    note: "1-indexed payment number" }
    - { name: payment,   type: Double, note: "== loan.monthlyPayment (constant per row)" }
    - { name: principal, type: Double, note: "portion of the payment reducing balance" }
    - { name: interest,  type: Double, note: "portion of the payment paying interest (0 when rate==0)" }
    - { name: balance,   type: Double, note: "outstanding balance AFTER this row's payment" }
