# flow.yaml — feature/amortization navigation flow (B5 Amortization Schedule).
# Grounded in feature/amortization/navigation/AmortizationNavigation.kt +
# the loan-detail "Schedule" button (feature/loans flow.yaml outbound schedule_tap).
# A single-screen feature graph: one parameterized destination, terminal leaf.
screen_id: amortization-schedule
feature_ref: feat-amortization
flow_groups: [flow-loans-browse]
participates_in_flows: [flow-loans-browse]

entry_points:
  - id: from-loan-detail
    description: "Reached only from LoanDetailScreen's 'Schedule' outlined button (navigateToAmortizationSchedule(loanId))."
    trigger: schedule_tap

# Screen nodes in this feature graph (one destination).
nodes:
  - { id: amortization-schedule, route: "AmortizationScheduleRoute(loanId)", screen: AmortizationScheduleScreen }

inbound_routes:
  - from: loan-detail             # feature/loans — LoanDetailScreen (separate module, cross-feature nav)
    to: amortization-schedule
    trigger: schedule_tap
    params: { loanId: "{loan.id}" }
    flow: flow-loans-browse
    note: >-
      LoanDetailScreen renders a 'Schedule' outlined_button whose on_click navigates to
      AmortizationScheduleRoute(loanId). Registered via
      NavGraphBuilder.amortizationScheduleDestination(navController) +
      NavController.navigateToAmortizationSchedule(loanId). loanId is REQUIRED — there is
      no add-mode / null variant. Injected into the ViewModel via Koin parametersOf(loanId).

outbound_routes:
  - from: amortization-schedule
    to: loan-detail
    action: navigate_back
    trigger: back_tap
    label: "Back (TopAppBar arrow) → popBackStackSafely() to the loan detail"
    flow: flow-loans-browse
    note: >-
      onBackClick → navController.popBackStackSafely(). No forward navigation exists —
      this is a terminal read-only leaf screen. No row is clickable; the table is display-only.

# AmortizationScheduleRoute is a @Serializable data class with a single required loanId param.
route:
  type: AmortizationScheduleRoute
  serializable: true
  params:
    - { name: loanId, type: String, required: true }
