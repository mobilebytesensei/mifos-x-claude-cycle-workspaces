# flow.yaml — Crypto (CoinGecko coin markets)
# Per-screen flow sibling. ONE screen ships: coinMarkets (paged list). A per-coin
# detail (coinDetail) is data-wired but NOT shipped — onCoinClick is an intentional-noop.
# Reverse-engineered from feature/crypto/navigation/CryptoNavigation.kt (nested nav graph)
# + cmp-navigation AuthenticatedNavigation.kt (cryptoGraph registration).
screen_id: coinMarkets
feature_ref: feat-crypto
flow_groups: [flow-crypto]
participates_in_flows: [flow-crypto]

# Nav graph: CryptoGraphRoute(startDestination = CoinMarketsListRoute) { CoinMarketsListRoute }
# CoinDetailRoute is intentionally absent at HEAD (arrives with a future sub-plan).
nav_graph:
  parent_route: CryptoGraphRoute
  start_destination: CoinMarketsListRoute
  destinations:
    - { route: CoinMarketsListRoute, screen: coinMarkets, entry: "NavController.navigateToCrypto()" }
  planned_destinations:
    - { route: "CoinDetailRoute(coinId: String)", screen: coinDetail, status: planned, note: "future sub-plan — replaces CryptoNavigation's no-op onCoinClick" }

entry_points:
  - id: crypto-graph-registered
    description: >-
      cryptoGraph(navController) is wired into the authenticated NavHost
      (AuthenticatedNavigation.kt) for the store5-screen-state-persistence AC-17
      deep-scroll-restore Maestro flow. No dedicated home tile navigates to it at
      HEAD — reached via navigateToCrypto() / the paging-restore Maestro flow.
    trigger: navigate_to_crypto
  - id: from-home-markets-tile
    description: >-
      Home dashboard "Markets" tile → Coin Markets (the crypto-cluster app-shell
      entry — agreed entry model, /idea sync STEP 3). The home side (the tile itself)
      is owned by a separate agent; THIS side declares the inbound edge.
    trigger: markets_tile_tap

# Inbound edges INTO coinMarkets (declared this side; home tile owned by the home agent).
inbound_routes:
  - from: home
    to: coinMarkets
    trigger: markets_tile_tap
    label: "Home 'Markets' tile → Coin Markets (crypto-cluster app-shell entry)"
    flow: flow-crypto

outbound_routes:
  - to: watchlist
    action: navigate
    trigger: watchlist_action_tap
    label: "Top-bar Watchlist action → personal watchlist (cross-feature → feature/watchlist)"
    flow: flow-crypto
  - to: alerts-list
    action: navigate
    trigger: alerts_action_tap
    label: "Top-bar Price-alerts action → alerts list (cross-feature → feature/alerts)"
    flow: flow-crypto
  - to: back
    action: navigate_back
    trigger: list_back_tap
    label: "Back (popBackStackSafely) → caller"
    flow: flow-crypto
  - to: coinDetail
    action: navigate
    status: planned
    trigger: coin_row_tap
    params: { coinId: "coin.id" }
    label: "Coin row → per-coin detail (PLANNED — onCoinClick is a no-op at HEAD)"
    flow: flow-crypto

# In-screen actions that do NOT navigate (refresh/load-more re-run the Store5 fetch).
in_screen_actions:
  - { screen: coinMarkets, action: "retry (refresh)", trigger: "pull-to-refresh / initial-error retry", effect: "pagingStream.refresh() — reset cursor to page 0, re-fetch from CoinGecko" }
  - { screen: coinMarkets, action: "load-more (append)", trigger: "scroll near list tail", effect: "PagingScreenStream requests page N+1 (per_page 20); end-of-list when a page returns < 20 rows" }
