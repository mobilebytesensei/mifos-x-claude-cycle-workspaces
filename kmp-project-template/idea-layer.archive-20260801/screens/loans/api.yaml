schema_version: "1.0"
screen_id: loans-list
feature_id: feat-loans

# ─────────────────────────────────────────────────────────────────────────────
# feature/loans is OFFLINE_LOCAL_ONLY — there are NO remote/RPC endpoints.
# Every "operation" is a LOCAL Room read or write against the banking_loans table,
# surfaced through LoanRepository (backed by LoansStore, a Store5 offline store).
# The concrete transport/table wiring lives in data-flow.yaml; this file records
# the operation surface so cross-layer tooling can resolve on_click action_contracts.
# ─────────────────────────────────────────────────────────────────────────────
remote_endpoints: none
source: local_room
store: LoansStore                 # core/store/demo/banking/impl/LoansStore.kt (OFFLINE_LOCAL_ONLY)
repository: LoanRepository        # core/data/demo/banking/LoanRepository.kt
table: banking_loans              # core/database/demo/banking/entity/LoanEntity.kt
dto: Loan                         # core/model/demo/banking/Loan.kt

# Local data operations (all on-device — no network round-trip).
api:
  # ── Reads (reactive Flow from Room via Store5) ──
  - operation: observe-all-loans
    method: local-read
    source: room
    kind: reactive
    request: { key: Unit, order: "nextDueDate ASC, createdAtMs ASC" }
    response: { dto: Loan, shape: list }
    dao: "LoanDao.observeAll()"
    demo_source: loans

  - operation: observe-loan-by-id
    method: local-read
    source: room
    kind: reactive
    request: { key: loanId }
    response: { dto: Loan, shape: single, nullable: true }
    dao: "LoanDao.observeById(id)"
    demo_source: loans

  - operation: get-loan-by-id
    method: local-read
    source: room
    kind: one_shot
    request: { key: loanId }
    response: { dto: Loan, shape: single, nullable: true }
    dao: "LoanDao.getById(id)"
    demo_source: loans
    used_by: [loan-addedit]        # edit-mode form hydration

  - operation: observe-total-monthly-emi
    method: local-read
    source: room
    kind: reactive
    request: { key: Unit, aggregate: "sum(monthlyPayment)" }
    response: { dto: Double, shape: scalar }
    dao: "LoanDao.observeAll() → sumOf { monthlyPayment }"
    demo_source: loans

  - operation: observe-total-principal-remaining
    method: local-read
    source: room
    kind: reactive
    request: { key: Unit, aggregate: "sum(principalRemaining)" }
    response: { dto: Double, shape: scalar }
    dao: "LoanDao.observeAll() → sumOf { principalRemaining }"
    demo_source: loans

  - operation: observe-loan-count
    method: local-read
    source: room
    kind: reactive
    request: { key: Unit, aggregate: count }
    response: { dto: Int, shape: scalar }
    dao: "LoanDao.count()"
    demo_source: loans

  # ── Writes (suspend, local commit; UI wraps in DraftSubmitHandler) ──
  - operation: upsert-loan
    method: local-write
    source: room
    kind: suspend
    request: { dto: Loan }
    response: { dto: Loan, shape: single }
    dao: "LoanDao.upsert(entity)"   # @Upsert — insert-or-replace by primary key id
    used_by: [loan-addedit]

  - operation: delete-loan
    method: local-write
    source: room
    kind: suspend
    request: { key: loanId }
    response: { shape: none }
    dao: "LoanDao.deleteById(id)"
    used_by: [loans-list, loan-detail]
