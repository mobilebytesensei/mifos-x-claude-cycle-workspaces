# flow.yaml — feature/loans navigation flow (B1 Loan Tracker).
# Grounded in feature/loans/navigation/LoansNavigation.kt (loansGraph).
# Graph route: LoansGraphRoute → startDestination PersonalLoansListRoute.
screen_id: loans-list
feature_ref: feat-loans
graph_route: LoansGraphRoute
start_destination: PersonalLoansListRoute
flow_groups: [flow-loans-browse, flow-loans-manage]
participates_in_flows: [flow-loans-browse, flow-loans-manage]

entry_points:
  - id: from-home
    description: "Home dashboard → Loans (navigateToLoans / LoansGraphRoute)."
    trigger: navigate_to_loans
  - id: back-from-detail
    description: "Return to list after popping the detail screen."
    trigger: navigate_back
  - id: back-from-addedit
    description: "Return to list/detail after a save or back from the add/edit form."
    trigger: on_saved_or_back

# Screen nodes in this feature graph.
nodes:
  - { id: loans-list,   route: PersonalLoansListRoute, screen: PersonalLoansListScreen }
  - { id: loan-detail,  route: "LoanDetailRoute(loanId)", screen: LoanDetailScreen }
  - { id: loan-addedit, route: "AddOrEditLoanRoute(loanId?)", screen: AddOrEditLoanScreen }

inbound_routes:
  - from: home            # feature/home dashboard (Money Toolkit home)
    to: loans-list
    trigger: view_loans
    flow: flow-loans-browse

outbound_routes:
  # ── from loans-list ──
  - from: loans-list
    to: loan-addedit
    action: navigate
    trigger: new_loan_fab_tap
    params: { loanId: null }
    label: "New loan FAB → Add loan form"
    flow: flow-loans-manage
  - from: loans-list
    to: loan-detail
    action: navigate
    trigger: loan_row_tap
    params: { loanId: "{loan.id}" }
    label: "Loan row (short-tap) → Loan detail"
    flow: flow-loans-browse
  - from: loans-list
    to: loans-list
    action: mutate_in_place
    trigger: loan_row_long_press_delete_confirm
    label: "Long-press → confirm delete → row removed (stream re-emits)"
    flow: flow-loans-manage
  - from: loans-list
    to: home
    action: navigate_back
    trigger: back_tap
    label: "Back → Home dashboard"
    flow: flow-loans-browse

  # ── from loan-detail ──
  - from: loan-detail
    to: loan-addedit
    action: navigate
    trigger: edit_tap
    params: { loanId: "{loan.id}" }
    label: "Edit → Add/Edit form (edit mode)"
    flow: flow-loans-manage
  - from: loan-detail
    to: amortization-schedule       # cross-feature: feature/amortization (B5), separate module
    action: navigate
    trigger: schedule_tap
    params: { loanId: "{loan.id}" }
    label: "Schedule → Amortization schedule (external feature)"
    flow: ad-hoc
  - from: loan-detail
    to: loans-list
    action: navigate_back
    trigger: delete_confirm
    label: "Delete confirm → repository.delete → pop back to list"
    flow: flow-loans-manage
  - from: loan-detail
    to: loans-list
    action: navigate_back
    trigger: back_tap
    label: "Back → Loans list"
    flow: flow-loans-browse

  # ── from loan-addedit ──
  - from: loan-addedit
    to: loans-list                   # (or back to detail when reached via edit)
    action: navigate_back
    trigger: on_saved
    label: "Save success (SubmitState.Submitted) → onSaved() pops back"
    flow: flow-loans-manage
  - from: loan-addedit
    to: loans-list
    action: navigate_back
    trigger: back_tap
    label: "Back → previous screen"
    flow: flow-loans-manage
