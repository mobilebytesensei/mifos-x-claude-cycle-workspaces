# demo-data.yaml — feature/loans demo data (B1 Loan Tracker).
# Local-only Room rows for the banking_loans table. Loan DTO shape mirrors
# core/model/demo/banking/Loan.kt (dedup by id, no placeholders).
# Sorted soonest-due-first to match the DAO order the list screen renders.
schema_version: "1.0"
screen_id: loans-list

consumes:
  - collection: loans
    dto: Loan
    table: banking_loans
    used_by: [observe-all-loans, observe-loan-by-id, get-loan-by-id, observe-total-monthly-emi, observe-total-principal-remaining, observe-loan-count]

# Representative sample loans (Loan DTO: id, name, kind, principal, principalRemaining,
# annualRatePercent, tenureMonths, monthsRemaining, monthlyPayment, nextDueDate, totalPaid,
# createdAtMs, updatedAtMs). monthlyPayment values are consistent with computeMonthlyEmi.
samples:
