# flow.yaml — emi-calculator
# T2 per-screen flow sibling (RULE-FLOW-INDEX-001)
# Reverse-engineered from cmp-navigation/.../AuthenticatedNavigation.kt +
# feature/emi-calculator/.../EmiCalculatorNavigation.kt.
screen_id: emiCalculator
feature_ref: feat-emi-calculator
flow_groups: [flow-calculators]
participates_in_flows: [flow-calculators]
entry_points:
  - id: from-home-tools
    description: "Launched from the authenticated navbar / home tools hub via the navigateToEmi callback"
    trigger: emi_calculator_tap
inbound_routes:
  - from: home
    trigger: navigate_to_emi
    flow: flow-calculators
    note: >-
      AuthenticatedNavigation wires navigateToEmi = { navController.navigateToEmiCalculator() }
      into authenticatedNavbarGraph; the EmiCalculatorRoute destination is registered by
      emiCalculatorDestination(onBackClick = { navController.popBackStackSafely() }).
outbound_routes:
  - to: home
    action: navigate_back
    trigger: back_button_tap
    label: "Back (TopAppBar arrow) → pop back stack"
    flow: flow-calculators
    note: "onBackClick → popBackStackSafely(); returns to whichever caller launched the calculator. No forward navigation exists — this is a terminal leaf screen."
# EmiCalculatorRoute is a parameterless @Serializable data object — no route params.
route:
  type: EmiCalculatorRoute
  serializable: true
  params: []
