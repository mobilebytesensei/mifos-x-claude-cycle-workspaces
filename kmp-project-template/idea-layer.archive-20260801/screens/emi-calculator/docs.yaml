schema_version: "1.0"
screen_id: emiCalculator
feature_id: feat-emi-calculator
archetype: pure-ui
flow: flow-calculators
title: EMI Calculator
purpose: >-
  A pure-local calculator that computes the monthly EMI (Equated Monthly
  Installment) for any loan from principal, annual interest rate, and tenure —
  instantly, on-device, with no login, no backend, and no network. Also surfaces
  the total payment and total interest over the loan term.
status: implemented
store_pattern: none
quality_score: 90
last_modified: "2026-07-25"

showcase_note: >-
  B2 EMI Calculator is the kmp-project-template's canonical showcase of the
  "pure local state (NO Store)" archetype. It is the reference proof that a
  feature can be fully functional with only a BaseViewModel<State, Nothing,
  Action> holding transient local UI state and a pure-Kotlin domain function
  (calculateEmi) — zero repository, zero Store5 cache, zero api, zero
  persistence. Forks study this feature to learn the minimal no-Store pattern
  before graduating to the offline-first Store-backed features (B1 Loans, B4
  Bills, B7 Rates).

user_stories:
  - "As a borrower, I want to enter a loan amount, interest rate, and tenure and instantly see my monthly EMI, so I can budget before applying."
  - "As a borrower, I want to see the total amount I will pay and the total interest, so I understand the true cost of the loan."
  - "As a user, I want the calculator to work offline with no sign-in, so I can use it anywhere without an account or connectivity."
  - "As a user, I want the result to update live as I change any input, so I can compare scenarios quickly."

success_metrics:
  - "Time-to-first-result under 1 second (synchronous on-device compute, no network round trip)"
  - "EMI output matches the standard reducing-balance formula within ±1.0 currency unit (locked by EmiCalculatorViewModelTest)"
  - "Zero crashes on non-numeric input (toDoubleOrNull/toIntOrNull guards drop unparseable text)"
  - "Works on all four platforms (android, ios, desktop, web) with identical math — pure commonMain, no expect/actual"

business_logic_summary: >-
  Monthly rate r = annualRatePercent / 12 / 100; n = tenureMonths.
  EMI = P·r·(1+r)^n / ((1+r)^n − 1); when r == 0, EMI = P / n.
  totalPayment = EMI × n; totalInterest = totalPayment − P.
  Result is suppressed (null) whenever any of principal, rate, or tenure is non-positive.

components:
  - top_app_bar
  - card          # AppCard (input) + HeroCard (result)
  - text_field    # three OutlinedTextFields
  - amount_display
  - text
  - row

non_functional:
  - "Pure commonMain — no platform-specific code, no permissions"
  - "No secrets, no keystore, no API key (unlike B7/B8 which need FRED_API_KEY)"
  - "i18n: all copy via compose-resources string keys (screens_emicalculator_*) per RULE-IMPL-NO-HARDCODED-STRING-001"
  - "Accessibility: back button has contentDescription; numeric keyboards per field type"

data_requirements: []   # none — pure-local, no DTOs, no tables, no cache

dependencies:
  tier: leaf
  upstream_features: []          # entered from home tools hub, depends on no other feature's data
  core_modules_used:
    - "core/domain (calculateEmi)"
    - "core/model (EmiResult)"
    - "core/common (formatGrouped)"
    - "core/designsystem (AmountDisplay, spacing, KptTheme)"
    - "core-base/designsystem (AppCard, HeroCard)"
    - "core-base/ui (BaseViewModel, composableWithPushTransitions)"
