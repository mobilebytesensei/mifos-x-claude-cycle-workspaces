schema_version: "1.0"
screen_id: settings
# ─────────────────────────────────────────────────
# INTENTIONALLY EMPTY — local preferences feature, NO backend.
#
# feature/settings persists appearance + language preferences entirely on-device
# via multiplatform-settings (com.russhwolf.settings). There is NO Supabase, NO
# Ktor client, NO REST endpoint, NO RPC. All reads/writes are local key-value
# operations on the serialized UserData blob — modeled in data-flow.yaml under
# `preferences:` (op: read | write), NOT as api operations.
#
# The SettingsViewmodel takes (UserDataRepository, AnalyticsHelper) — neither is a
# network service. Any future non-empty api[] here would be a reverse-engineering
# error for this feature as it exists in source.
# ─────────────────────────────────────────────────
api: []
