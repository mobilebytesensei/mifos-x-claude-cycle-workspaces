# flow.yaml — showcase (DEV-ONLY component & pattern gallery)
# T2 per-feature flow sibling (RULE-FLOW-INDEX-001)
# Reverse-engineered from cmp-navigation/.../AuthenticatedNavigation.kt +
# feature/showcase/.../{StateGalleryNavigation,TransitionGalleryNavigation}.kt.
feature_ref: feat-showcase
primary_screen_id: state-gallery
flow_groups: [flow-dev-showcase]
participates_in_flows: [flow-dev-showcase]
surface: dev-only
flow_note: >-
  Both galleries are reachable ONLY through the Settings screen's dev menu, and
  ONLY in non-release builds. AuthenticatedNavigation computes
  onStateGalleryClick / onTransitionGalleryClick = if (!isReleaseBuild()) { navigate(...) } else null,
  and passes them into settingsDestination; a released build receives null and
  SettingsScreen hides the dev-menu entries entirely. This flow does not exist for
  end users and is expected to be stripped by forks that don't want the reference gallery.

entry_points:
  - id: from-settings-dev-menu-state
    description: "Settings → dev menu → 'State Gallery' (non-release builds only)"
    trigger: state_gallery_tap
    target_screen: state-gallery
  - id: from-settings-dev-menu-transitions
    description: "Settings → dev menu → 'Transition Gallery' (non-release builds only)"
    trigger: transition_gallery_tap
    target_screen: transition-gallery

inbound_routes:
  - from: settings
    trigger: state_gallery_tap
    to: state-gallery
    flow: flow-dev-showcase
    note: "onStateGalleryClick → navController.navigate(StateGalleryRoute); registered by stateGalleryGraph(navController)."
  - from: settings
    trigger: transition_gallery_tap
    to: transition-gallery
    flow: flow-dev-showcase
    note: "onTransitionGalleryClick → navController.navigate(TransitionGalleryRoute); registered by transitionGalleryGraph(navController)."

internal_routes:
  - from: transition-gallery
    to: transition-demo
    trigger: transition_variant_tap
    flow: flow-dev-showcase
    note: >-
      Each TransitionVariant button → onNavigateToDemo(variant) →
      navController.navigate(TransitionDemoRoute(variant.name)). The demo is pushed using
      the tapped transition factory (that IS the thing being showcased).
  - from: transition-demo
    to: transition-gallery
    action: navigate_back
    trigger: auto_dismiss_2s
    flow: flow-dev-showcase
    note: "TransitionDemoScreen LaunchedEffect { delay(2000); onAutoPop() } → popBackStackSafely(); returns automatically to the hub. No user control."

outbound_routes:
  - from: state-gallery
    to: settings
    action: navigate_back
    trigger: back_button_tap
    label: "Back (TopAppBar arrow) → pop back stack"
    flow: flow-dev-showcase
    note: "onBackClick → popBackStackSafely(). Terminal leaf — no forward navigation from the State Gallery."
  - from: transition-gallery
    to: settings
    action: navigate_back
    trigger: back_button_tap
    label: "Back (TopAppBar arrow) → pop back stack"
    flow: flow-dev-showcase
    note: "onBackClick → popBackStackSafely(). The only forward move is pushing a throwaway transition-demo, which auto-pops back."

# Routes are @Serializable; StateGalleryRoute + TransitionGalleryRoute are parameterless
# data objects. TransitionDemoRoute carries the variant name.
routes:
  - { type: StateGalleryRoute, serializable: true, params: [] }
  - { type: TransitionGalleryRoute, serializable: true, params: [] }
  - { type: TransitionDemoRoute, serializable: true, params: [ { name: variantName, type: String } ] }
