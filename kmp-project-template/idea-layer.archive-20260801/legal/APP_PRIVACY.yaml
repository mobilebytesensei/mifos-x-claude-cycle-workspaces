# App Privacy — kmp-project-template
# For Apple App Store Privacy Labels

privacy_types:
  - type: Data Used to Track You
    data: []
    description: "This app does not track you across other companies' apps or websites."

  - type: Data Linked to You
    data: []
    description: "No data is linked to your identity."

  - type: Data Not Linked to You
    data:
      - category: Usage Data
        purpose: Analytics
        description: "Anonymized app interaction events via Firebase Analytics (Android only)"
      - category: Diagnostics
        purpose: App Functionality
        description: "Crash reports and performance data"

data_not_collected:
  - Contact Info
  - Health & Fitness
  - Financial Info
  - Location
  - Sensitive Info
  - Contacts
  - User Content
  - Browsing History
  - Search History
  - Identifiers
  - Purchases
