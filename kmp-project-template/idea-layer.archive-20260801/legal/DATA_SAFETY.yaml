# Data Safety — kmp-project-template
# For Google Play Data Safety section

data_collected:
  - category: App activity
    type: App interactions
    purpose: Analytics
    optional: true
    shared: false
    encrypted: true
    deletion_available: true

  - category: Device or other IDs
    type: Device identifiers
    purpose: Analytics
    optional: true
    shared: false
    encrypted: true
    deletion_available: true

data_not_collected:
  - Personal info (name, email, address)
  - Financial info
  - Health and fitness
  - Messages
  - Photos and videos
  - Audio files
  - Files and docs
  - Calendar
  - Contacts
  - Location

security_practices:
  data_encrypted_in_transit: true
  data_deletion_mechanism: "Clear app data in device settings"
  independent_security_review: false

children:
  target_audience_includes_children: false
  compliant_with_coppa: true
