# VERSION_MATRIX.yaml — Release platform state for mifos-x-group-banking
# Managed by /release — updated on each deploy action
schema_version: "1.0"
project: mifos-x-group-banking
project_name: MifosSave
organization: MifosSave / Mifos Initiative
last_updated: "2026-05-09"

platforms:
  android:
    label: "Android (Play Store)"
    deployed: false
    version: null
    status: "not_released"
    track: internal          # internal | alpha | beta | production
    package_name: "org.mifos.groupbanking"
    min_sdk: 26
    fastlane_lanes:
      - assembleReleaseApks
      - bundleReleaseApks
      - deployReleaseApkOnFirebase
      - publishOnPlayStore
    aab_path: "cmp-android/build/outputs/bundle/prodRelease/cmp-android-prod-release.aab"
    firebase_app_id: "1:728434912738:android:3902eb3363b0938f1a1dbb"
    firebase_groups: "mifos-mobile-apps"
    credentials:
      keystore_file: "release_keystore.keystore"     # must be present in source root
      play_store_json_key: "secrets/playStorePublishServiceCredentialsFile.json"
    requires: "keystore + Play Console service account JSON"

  ios:
    label: "iOS (App Store / TestFlight)"
    deployed: false
    version: null
    status: "not_released"
    track: testflight        # testflight | appstore
    bundle_id: "org.mifos.groupbanking"
    min_ios: "16.0"
    team_id: "L432S2FZP5"
    fastlane_lanes:
      - deployOnTestflight
      - deployOnAppStore
    xcode_project: "cmp-ios/iosApp.xcodeproj"
    xcode_workspace: "cmp-ios/iosApp.xcworkspace"
    firebase_app_id: "1:728434912738:ios:1d81f8e53ca7a6f31a1dbb"
    firebase_groups: "mifos-mobile-apps"
    credentials:
      appstore_key_id: "ZVQ6W6P822"
      appstore_issuer_id: "7ab9e361-9603-4c3e-b147-be3b0f816099"
      appstore_key_path: "secrets/AuthKey.p8"
      match_repo: "git@github.com:openMF/ios-provisioning-profile.git"
    requires: "App Store Connect API key + Match provisioning profiles"

  firebase:
    label: "Firebase App Distribution"
    deployed: false
    version: null
    status: "not_released"
    track: beta
    groups: ["mifos-mobile-apps"]
    credentials:
      service_credentials: "secrets/firebaseAppDistributionServiceCredentialsFile.json"
    requires: "Firebase service account JSON"

release_config:
  version_name: null
  version_code: null
  tag_prefix: "v"
  branch_pattern: "release/*"
  changelog_path: "plan-layer/versions/{version}/CHANGELOG.md"
  promote_workflow: ".github/workflows/promote-to-production.yml"
  build_workflow: ".github/workflows/multi-platform-build-and-publish.yml"

github_secrets_required:
  android:
    - ORIGINAL_KEYSTORE_FILE          # base64-encoded release_keystore.keystore
    - ORIGINAL_KEYSTORE_FILE_PASSWORD
    - ORIGINAL_KEYSTORE_ALIAS
    - ORIGINAL_KEYSTORE_ALIAS_PASSWORD
    - UPLOAD_KEYSTORE_FILE            # base64-encoded upload keystore
    - UPLOAD_KEYSTORE_FILE_PASSWORD
    - UPLOAD_KEYSTORE_ALIAS
    - UPLOAD_KEYSTORE_ALIAS_PASSWORD
    - GOOGLESERVICES                  # google-services.json content
    - PLAYSTORECREDS                  # Play Console service account JSON
    - FIREBASECREDS                   # Firebase App Distribution credentials
  ios:
    - APPSTORE_KEY_ID                 # ZVQ6W6P822
    - APPSTORE_ISSUER_ID              # 7ab9e361-9603-4c3e-b147-be3b0f816099
    - APPSTORE_KEY_PATH               # AuthKey.p8 content
    - MATCH_GIT_URL                   # git@github.com:openMF/ios-provisioning-profile.git
    - MATCH_SSH_KEY_PATH              # SSH key for match repo
    - TEAM_ID                         # L432S2FZP5
    - NOTARIZATION_APPLE_ID
    - NOTARIZATION_PASSWORD
    - NOTARIZATION_TEAM_ID

security_warnings:
  - "⚠️  keystore password is hardcoded in fastlane-config/project_config.rb — move to ENV vars"
  - "⚠️  Match SSH key must be set before iOS CI deploys"
  - "⚠️  secrets/ directory must be gitignored (never commit credentials)"
