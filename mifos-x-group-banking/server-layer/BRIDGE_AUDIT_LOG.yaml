companion_known_issues:
  - id: CK1
    severity: low
    summary: >
      dt_group_type_config uses entityId=0 as the global catalogue lookup convention.
      Fineract datatables normally key on a real entity row id. The companion API must
      handle entityId=0 as a special catalogue-mode query (SELECT * with no WHERE).
      Document this in the companion API implementation spec.

  - id: CK2
    severity: low
    summary: >
      /companion/datatables/invitations/{entityId} serves dual semantics: token-lookup
      (entityId = 6-char string) vs list-pending (entityId = numeric groupId).
      The companion must disambiguate by content type. Two separate MCP tools
      (companion_validate_invite_token + companion_list_pending_invites) use the same
      Fineract path template — keep them as distinct tool names in the contract.

  - id: CK3
    severity: medium
    summary: >
      dt_group_type_config (27-column schema on m_group) is a companion-managed archetype
      registry, NOT per-group config (dt_group_config on m_center is the per-group instance).
      These are two different datatables. The companion create_group orchestrator must:
      (1) read the archetype row from dt_group_type_config, (2) merge caller's overrides,
      (3) upsert the merged config into dt_group_config for the new group's centerId.
      Implementation must not conflate the two tables.

  - id: CK4
    severity: low
    summary: >
      companion_execute_shareout and companion_execute_rotation_payout apply Fineract money
      moves server-side, but the MifosSave client computes the payout amounts locally
      (offline-first). The companion must validate that the server-side corpus balance ≥ the
      requested payout before executing. Conflict resolution: companion is the authority;
      stale client preview should surface a refresh prompt.

