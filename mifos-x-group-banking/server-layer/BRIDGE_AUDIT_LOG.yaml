# ───────────────────────────────────────────────────────────────────
# Known issues (do NOT block this run; logged for follow-up)
# ───────────────────────────────────────────────────────────────────

known_issues:
  - id: K1
    severity: medium
    location: workspaces/mifos-x/mcp-mifosx/source/mcp-mifosx/python/tools/domains/codetables.py
    summary: |
      Pre-existing `create_datatable` MCP tool hardcodes `multiRow: True` and uses
      capitalized type names (Integer, String, etc.). It will fail against modern
      Fineract which requires `entitySubType` and lowercase types.
    impact: "Manual datatable creation via this tool fails on sandbox.mifos.community."
    workaround: "/mifos-bridge run uses direct HTTP POST with correct payload."
    follow_up: "Patch _map_column_type to lowercase + accept multi_row + entitySubType params. Out of scope for this bridge run."

  - id: K2
    severity: low
    location: tier1 wrappers (T1-2..T1-5)
    summary: "/self/* endpoints not deployed on sandbox.mifos.community."
    impact: "Cannot exercise self-service flows from local sandbox."
    workaround: "Wrappers stay registered; production deployments with /self/* enabled work directly."

  - id: K3
    severity: low
    location: workspaces/mifos-x/mcp-mifosx/source/mcp-mifosx/python/tools/domains/group_banking.py
    summary: |
      Multi-row table updates that need row-id PUT (close_meeting, mark_notification_read,
      revoke_invitation, etc.) are not exposed as named wrappers.
    impact: "Callers requiring row-level mutation use generic update_datatable_entry."
    follow_up: "Add row-id-aware wrappers in a future bridge enhancement."

