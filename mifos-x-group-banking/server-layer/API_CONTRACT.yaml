      - { name: list_invitations,      mcp_tool: mcp__mifos__list_invitations,      method: GET,  path: /datatables/dt_member_invitation/{clientId} }
      - { name: create_invitation,     mcp_tool: mcp__mifos__create_invitation,     method: POST, path: /datatables/dt_member_invitation/{clientId} }
    kotlin_mapping:
      service: InvitationService
      methods:
        - "suspend fun listInvitations(clientId: Long): List<Invitation>"
        - "suspend fun createInvitation(clientId: Long, inv: Invitation)"

