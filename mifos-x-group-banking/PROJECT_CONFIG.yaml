# ═════════════════════════════════════════════════════════════════════════════
# PROJECT_CONFIG.yaml — mifos-x-group-banking (schema v2)
#
# Machine-readable project config for CommonPurse — a KMP group-banking app
# built on kmp-project-template targeting field-officer + end-user clients.
#
# Contract: RULE-PROJECT-CONFIG-001
# Flow:     core/scripts/load-project-config.md
# Reader:   core/scripts/read-project-config.md
# Updated by /idea-migration reference from mood-movies | 2026-05-08
# ═════════════════════════════════════════════════════════════════════════════

schema_version: "2"

project:
  name: "mifos-x-group-banking"
  display_name: "CommonPurse"
  tech_stack: "kmp-app"
  type: "kmp"
  version: "1.0.0"
  idea_layer_version: "3.1"
  description: "Community savings group management app built on Apache Fineract"
  status: in-progress
  workspace: mifos-x
  package_name: org.mifos.groupbanking
  created: 2026-05-02
  promoted: 2026-05-05

repository:
  origin: "https://github.com/therajanmaurya/mifos-x-group-banking"
  upstream: "https://github.com/openMF/mifos-x-group-banking"
  template_source: "https://github.com/openMF/kmp-project-template"
  default_branch: dev
  fork_workflow: true

branding:
  app_name: "CommonPurse"
  tagline: "Your community savings group"
  logo: "idea-layer/assets/branding/logo.svg"
  logo_dark: "idea-layer/assets/branding/logo_dark.svg"
  primary_color: "#2E7D32"
  secondary_color: "#FF8F00"
  tertiary_color: "#1565C0"
  font_family: "Noto Sans"
  design_system: "Material Design 3"

platforms:
  enabled: [android, ios]
  primary: "android"
  min_versions:
    android: 26
    ios: "16.0"
# desktop + web excluded: rural field-officer use-case is mobile-only

tech:
  language: kotlin
  ui_framework: compose-multiplatform
  architecture: mvi
  di: koin
  network: ktor-ktorfit
  database: room-kmp
  template_version: "2026.5.0"    # kmp-project-template tag at scaffold time

backend:
  provider: fineract
  mcp_server: mifos
  bridge: auto
  bridge_run_id: bridge-260504-001
  api_contract: server-layer/API_CONTRACT.yaml
  environments:
    local:
      api_base_url: "http://10.0.2.2:8443/fineract-provider/api/v1"
      self_service_url: "http://10.0.2.2:8443/fineract-provider/api/v1/self"
      ssl_verify: false
      tenant_id: default
    production:
      api_base_url: "https://your-fineract-server.com/fineract-provider/api/v1"
      self_service_url: "https://your-fineract-server.com/fineract-provider/api/v1/self"
      ssl_verify: true
      tenant_id: default
  auth:
    admin: "POST /authentication (Basic Auth)"
    end_user: "POST /self/authentication (Basic Auth)"
  custom_datatables:
    - dt_group_config
    - dt_meeting_record
    - dt_meeting_attendance
    - dt_member_role
    - dt_share_out
    - dt_social_fund
    - dt_loan_vote
    - dt_sync_metadata
    - dt_loan_request
    - dt_group_corpus

client_types:
  - id: admin
    description: "Group treasurer, chairperson, field officer"
    auth_endpoint: "/authentication"
    home_screen: "admin-dashboard"
  - id: end_user
    description: "Group member (self-service)"
    auth_endpoint: "/self/authentication"
    home_screen: "personal-dashboard"

design_system:
  theme: material3
  primary_color: "#2E7D32"          # deep VSLA-green — growth + trust (WCAG AAA on white)
  on_primary: "#FFFFFF"
  primary_container: "#A6F1A6"
  on_primary_container: "#002106"
  secondary_color: "#526350"
  tertiary_color: "#386569"
  error_color: "#BA1A1A"
  font: "Noto Sans"
  font_brand: "Noto Sans"
  dynamic_color: false              # consistent brand identity across devices
  touch_target_min: "48dp"
  card_corner_radius: "12dp"
  button_height: "48dp"

layers:
  idea: { version: "3.1", screens: 30, features: 15 }
  server: { provider: fineract, api_groups: 6, datatables: 10 }
  client: { status: pending }
  feature: { status: pending }
  infrastructure: { status: pending }
  platform: { status: pending }
  plan:
    enabled: true
  design-spec:
    enabled: true
  testing:
    enabled: true
    frameworks: [kotlin-test, turbine, compose-ui-test]
  release:
    enabled: true

features:
  total: 15
  must: 11
  should: 3
  could: 1
  milestones:
    v1.0.0:
      label: "Core Group Banking"
      features: [authentication, group-management, member-onboarding,
                 meeting-lifecycle, savings-collection, group-linked-savings,
                 corpus-tracking, loan-management, share-out, offline-sync,
                 fines-tracking, multi-language, end-user-dashboard]
    v1.1.0:
      label: "Supervision & Social"
      features: [field-officer-view, social-fund]
    v2.0.0:
      label: "Scale & Integrate"
      features: [mobile-money-integration, web-admin-dashboard,
                 sms-notifications, inter-group-lending, credit-scoring]
