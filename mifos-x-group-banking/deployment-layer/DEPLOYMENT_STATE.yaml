# DEPLOYMENT_STATE.yaml — Persistent Release State
# Framework template: layers/deployment/templates/DEPLOYMENT_STATE.yaml
# Copied to: {workspace_path}/deployment-layer/DEPLOYMENT_STATE.yaml on first /idea-deploy setup
# Updated after every /idea-deploy action (dual-write: GH Release body + this file)
#
# Schema changelog:
#   v1 (2026-04-28): Initial schema — 13 platform entries
#   v2 (2026-04-28): Desktop signing variants, web provider field, GH release assets
#   v3 (2026-04-28): last_release pointer, release_summary, deprecate inline history
#   v4 (2026-04-28): config_verification section for [GV] manual file tracking
#   v5 (2026-04-29): Play Store verification + first_deploy tracking for [A1]
#   v6 (2026-04-29): release_notes persistence for all platforms
#   v7 (2026-05-01): deployment_stage field for beta/rc/stable lifecycle
#   v8 (2026-05-01): build_duration + build_duration_seconds per platform, release notes auto-generation enforcement
schema_version: 8

version: ""
tag_created: false
release_created: false
release_url: ""
deploy_mode: ""                        # local | ci
deployment_stage: "beta"               # beta | rc | stable — stage lifecycle for version

platforms:
  # Android (actions A1-A4)
  android_internal:
    status: pending                    # pending | deployed | failed | skipped | rolled_back
    timestamp: null
    build_number: null
    first_deploy: true                 # true until first successful deploy (uses deployInternalFullSetup)
    playstore_verified: false          # set true after checkPlayStoreAccess passes
    playstore_verified_at: null        # timestamp of verification
    release_notes: ""                  # consumer-facing notes for this deploy
    build_duration: null               # human-readable, e.g., "2m 34s"
    build_duration_seconds: null       # integer seconds for sorting/comparison
  android_beta:
    status: pending
    timestamp: null
    rollout_percentage: null           # 5 | 10 | 25 | 50 | 100
    release_notes: ""
  android_production:
    status: pending
    timestamp: null
    rollout_percentage: null
    release_notes: ""
  firebase_android:
    status: pending
    timestamp: null
    console_url: ""
    release_name: ""                   # for rollback reference
    release_notes: ""

  # iOS (actions I1-I3)
  ios_testflight:
    status: pending
    timestamp: null
    build_number: null
    release_notes: ""
  ios_appstore:
    status: pending
    timestamp: null
    review_status: null                # waiting_for_review | in_review | approved | rejected
    release_notes: ""
  firebase_ios:
    status: pending
    timestamp: null
    console_url: ""
    release_notes: ""

  # Mac (actions M1-M2)
  mac_testflight:
    status: pending
    timestamp: null
    release_notes: ""
  mac_appstore:
    status: pending
    timestamp: null
    release_notes: ""

  # Web (provider-dispatched via DEPLOYMENT_PROVIDER_REGISTRY.yaml)
  web:
    status: pending
    timestamp: null
    provider: "github-pages"           # netlify | vercel | firebase-hosting | github-pages | cloudflare-pages | aws-amplify | custom-server
    deploy_url: ""
    deploy_id: ""                      # provider-specific deploy reference
    preview_url: ""                    # preview deploy URL (if applicable)
    release_notes: ""

  # Desktop (actions D1-D7)
  desktop_macos:
    status: pending
    timestamp: null
    signed: false                      # true if code-signed (D1 = unsigned, D5 = notarized)
    artifact_path: ""                  # path to .dmg file
    release_notes: ""
  desktop_macos_notarized:
    status: pending
    timestamp: null
    notarization_id: ""                # xcrun notarytool submission ID
    artifact_path: ""
    release_notes: ""
  desktop_windows:
    status: pending
    timestamp: null
    signed: false                      # true if Authenticode-signed (D3 CI or D7 local)
    artifact_path: ""                  # path to .msi/.exe file
    release_notes: ""
  desktop_linux:
    status: pending
    timestamp: null
    artifact_path: ""                  # path to .deb file
    release_notes: ""
  desktop_linux_appimage:
    status: pending
    timestamp: null
    artifact_path: ""                  # path to .AppImage file
    release_notes: ""

# GitHub Release asset tracking (D4 upload action)
github_release_assets:
  uploaded: []                         # [{name, size, download_url}]
  total_size: null

promotion:
  pending: null                        # null | {platform, deployed_at}
  min_beta_hours: 24

# DEPRECATED in v3 — use DEPLOYMENT_HISTORY.yaml instead. Kept for backward compat, no longer written.
history: []                            # DEPRECATED — see DEPLOYMENT_HISTORY.yaml

# Last completed release (quick lookup, no history scan)
last_release:
  version: ""                          # e.g., "1.0.2"
  timestamp: ""                        # when last release was finalized
  git_tag: ""                          # e.g., "v1.0.2"
  platforms_deployed: []               # ["android", "ios", "web"] — which platforms were deployed
  total_platforms: 0                   # count of deployed platforms
  status: ""                           # active | rolled_back

# Release summary (quick stats)
release_summary:
  total_releases: 0                    # total count from DEPLOYMENT_HISTORY
  last_deploy_platform: ""             # most recently deployed platform (any version)
  last_deploy_timestamp: ""            # when the most recent deploy happened

# Manual file verification state (from [GV] runs)
config_verification:
  last_verified_at: ""                 # ISO timestamp of last [GV] run
  framework_template_version: 0        # schema_version of DEPLOYMENT_CONFIG_MATRIX template at last verify
  total_manual: 0                      # count of manual config files
  synced_count: 0                      # manual files confirmed in sync
  drift_count: 0                       # manual files with missing structures
  drift_files: []                      # list of file keys with drift (e.g., ["fastfile", "project_config"])
