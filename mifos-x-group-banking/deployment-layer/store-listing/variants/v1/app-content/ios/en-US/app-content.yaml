# App Store Connect app-content SoT — MifosSave (derived from data-posture)
platform: ios
locale: en-US
age_rating: "4+"                    # no objectionable content; not a gambling app
privacy_policy_url: "https://mifos.org/privacy-policy/"
app_privacy:
  data_collected: true
  data_used_to_track_you: false     # no cross-app/website tracking, no ad SDKs
  data_linked_to_you:
    - "Contact Info — Name"
    - "Contact Info — Phone Number / Email Address"
    - "Financial Info — Other Financial Info (savings, loans, group balances)"
    - "User Content"
  data_not_linked_to_you:
    - "Usage Data — Product Interaction"
    - "Diagnostics — Crash Data"
  encrypted_in_transit: true
  account_deletion_supported: true
questionnaire:
  age-rating:
    form: "Age rating"
    where: "App Store Connect → App → App Information → Age Rating → Edit"
    steps:
      - { q: "Cartoon or Fantasy Violence", a: "None" }
      - { q: "Realistic Violence", a: "None" }
      - { q: "Sexual Content or Nudity", a: "None" }
      - { q: "Profanity or Crude Humor", a: "None" }
      - { q: "Alcohol, Tobacco, or Drug Use or References", a: "None" }
      - { q: "Simulated Gambling", a: "None" }
      - { q: "Contests", a: "None" }
      - { q: "Unrestricted Web Access", a: "No" }
      - { q: "Made for Kids", a: "No" }
    outcome: "4+"
  app-privacy:
    form: "App Privacy (Nutrition Label)"
    where: "App Store Connect → App → App Privacy → Get Started / Edit"
    steps:
      - { q: "Do you or your partners collect data from this app?", a: "Yes" }
      - { q: "Contact Info — Name", a: "Collected · Linked to user · App Functionality (not used to track)" }
      - { q: "Contact Info — Phone Number / Email", a: "Collected · Linked to user · App Functionality (not used to track)" }
      - { q: "Financial Info — Other Financial Info", a: "Collected · Linked to user · App Functionality" }
      - { q: "User Content", a: "Collected · Linked to user · App Functionality" }
      - { q: "Usage Data — Product Interaction", a: "Collected · Not linked · Analytics" }
      - { q: "Diagnostics — Crash Data", a: "Collected · Not linked · App Functionality/Analytics" }
      - { q: "Is any collected data used to track users?", a: "No" }
    outcome: "Data Linked to You (Contact, Financial, User Content) + Data Not Linked (Usage, Diagnostics); no tracking"
  privacy-policy:
    form: "Privacy Policy URL"
    where: "App Store Connect → App → App Information → General Information → Privacy Policy URL"
    steps:
      - { q: "Privacy Policy URL", a: "https://mifos.org/privacy-policy/" }
    outcome: "Privacy policy URL provided"
