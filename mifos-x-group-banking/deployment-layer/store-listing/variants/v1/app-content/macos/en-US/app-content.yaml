# Mac App Store app-content SoT — MifosSave (mirrors iOS ASC posture)
platform: macos
locale: en-US
age_rating: "4+"
privacy_policy_url: "https://mifos.org/privacy-policy/"
app_privacy:
  data_collected: true
  data_used_to_track_you: false
  data_linked_to_you:
    - "Contact Info — Name"
    - "Contact Info — Phone Number / Email Address"
    - "Financial Info — Other Financial Info"
    - "User Content"
  data_not_linked_to_you:
    - "Usage Data — Product Interaction"
    - "Diagnostics — Crash Data"
  encrypted_in_transit: true
  account_deletion_supported: true
questionnaire:
  age-rating:
    form: "Age rating"
    where: "App Store Connect → App → App Information → Age Rating → Edit"
    steps:
      - { q: "Violence / Sexual Content / Profanity / Substances", a: "None" }
      - { q: "Simulated Gambling", a: "None" }
      - { q: "Unrestricted Web Access", a: "No" }
      - { q: "Made for Kids", a: "No" }
    outcome: "4+"
  app-privacy:
    form: "App Privacy (Nutrition Label)"
    where: "App Store Connect → App → App Privacy → Edit"
    steps:
      - { q: "Do you collect data?", a: "Yes" }
      - { q: "Contact Info (Name, Phone/Email)", a: "Collected · Linked · App Functionality" }
      - { q: "Financial Info / User Content", a: "Collected · Linked · App Functionality" }
      - { q: "Usage Data / Diagnostics", a: "Collected · Not linked · Analytics" }
      - { q: "Used to track users?", a: "No" }
    outcome: "Same nutrition label as iOS; no tracking"
  privacy-policy:
    form: "Privacy Policy URL"
    where: "App Store Connect → App → App Information → Privacy Policy URL"
    steps:
      - { q: "Privacy Policy URL", a: "https://mifos.org/privacy-policy/" }
    outcome: "Privacy policy URL provided"
