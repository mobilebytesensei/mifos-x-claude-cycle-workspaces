# Play Console app-content SoT — MifosSave (derived from data-posture, not guessed)
platform: android
locale: en-US
content_rating: Everyone            # IARC — finance utility, no objectionable content
target_audience: [18+]              # financial tool for adult group members
ads: false
in_app_purchases: false
app_access:
  all_functionality_available_without_account: false
  demo_credentials_required: true   # reviewer uses the Demo Explore guest session
  demo_note: "Tap 'Demo Explore' on the login screen for a guest session — no account needed to review."
special_categories: []             # not a financial-services/lending institution app; peer group record-keeping only
privacy_policy_url: "https://mifossave.pages.dev/privacy"
data_safety:
  collects_data: true
  shares_data: false               # no transfer to third parties for ads/analytics-sale
  encrypted_in_transit: true
  user_can_request_deletion: true
  collected:
    - { type: "Personal info — Name", purpose: [App functionality, Account management], optional: false }
    - { type: "Personal info — Phone number / Email", purpose: [App functionality, Account management], optional: false }
    - { type: "Financial info — Other financial info (savings, loan & group balances)", purpose: [App functionality], optional: false }
    - { type: "App activity — In-app actions", purpose: [Analytics], optional: true }
    - { type: "App info & performance — Crash logs & Diagnostics", purpose: [Analytics], optional: true }

# ── Structured console questionnaire (rendered step-by-step by the store-readiness gate) ──
questionnaire:
  content-rating:
    form: "Content rating (IARC) questionnaire"
    where: "Play Console → Policy → App content → Content ratings"
    steps:
      - { q: "Category", a: "Utility, Productivity, Communication, or Other" }
      - { q: "Does the app contain violence?", a: "No" }
      - { q: "Sexual content / nudity?", a: "No" }
      - { q: "Profanity or crude humor?", a: "No" }
      - { q: "Controlled substances (drugs/alcohol/tobacco)?", a: "No" }
      - { q: "Gambling / simulated gambling?", a: "No — this is community savings, not gambling" }
      - { q: "Users can interact / share content or location?", a: "No" }
    outcome: "Everyone / PEGI 3 / IARC 3+"
  data-safety:
    form: "Data safety"
    where: "Play Console → Policy → App content → Data safety"
    steps:
      - { q: "Does your app collect or share any of the required user data types?", a: "Yes — collect; No — share" }
      - { q: "Is all collected data encrypted in transit?", a: "Yes" }
      - { q: "Do you provide a way for users to request data deletion?", a: "Yes" }
      - { q: "Personal info — Name", a: "Collected, not shared, required (account management)" }
      - { q: "Personal info — Phone number / Email address", a: "Collected, not shared, required (account management)" }
      - { q: "Financial info — Other financial info (savings/loan records)", a: "Collected, not shared, app functionality" }
      - { q: "App activity — In-app actions", a: "Collected, not shared, analytics" }
      - { q: "App info & performance — Crash logs / Diagnostics", a: "Collected, not shared, analytics" }
    outcome: "Data collected, none shared, encrypted in transit, deletion available"
  target-audience:
    form: "Target audience and content"
    where: "Play Console → Policy → App content → Target audience and content"
    steps:
      - { q: "Which age groups is your app targeting?", a: "18 and over" }
      - { q: "Could the app unintentionally appeal to children?", a: "No" }
    outcome: "Adults only — not in the Designed for Families / Teacher Approved program"
  ads:
    form: "Ads"
    where: "Play Console → Policy → App content → Ads"
    steps:
      - { q: "Does your app contain ads?", a: "No" }
    outcome: "No ads"
  app-access:
    form: "App access"
    where: "Play Console → Policy → App content → App access"
    steps:
      - { q: "Is all app functionality available without special access?", a: "No — some features need an account" }
      - { q: "Provide access instructions/credentials for review", a: "Use the 'Demo Explore' guest session on the login screen — no account required" }
    outcome: "Restricted — Demo Explore guest path provided for reviewers"
  news:
    form: "News apps"
    where: "Play Console → Policy → App content → News apps"
    steps:
      - { q: "Is this a news app?", a: "No" }
    outcome: "Not a news app"
  privacy-policy:
    form: "Privacy policy"
    where: "Play Console → Policy → App content → Privacy policy"
    steps:
      - { q: "Privacy policy URL", a: "https://mifos.org/privacy-policy/" }
    outcome: "Privacy policy URL provided"
