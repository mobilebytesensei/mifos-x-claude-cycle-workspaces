# DEPLOYMENT_HISTORY.yaml — Release History Tracking
#
# Schema version: 1.0.0
# Location: {workspace_path}/deployment-layer/DEPLOYMENT_HISTORY.yaml (per-project)
# Written by: /idea-deploy after every successful deploy
# Read by: /idea-deploy rollback, /idea-deploy-verify, release dashboard (localhost:7576)
#
# This file is the single source of truth for what was deployed, when, and where.
# RULE-DEPLOYMENT-004 enforces that every deploy writes an entry here.

release_history:
  schema_version: "1.0.0"

  # Releases are appended in chronological order (newest last).
  # Each release entry represents a version cut (git tag + GitHub Release).
  # Platform deployments are recorded as sub-entries under the release.
  releases: []
    # Example entry (do not remove — used as schema reference):
    #
    # - version: "1.0.0"
    #   build_number: 1
    #   timestamp: "2026-04-27T10:00:00Z"
    #   platforms:
    #     android:
    #       track: "internal"           # internal | beta | production
    #       deployed_at: "2026-04-27T10:05:00Z"
    #       deployed_by: "local"        # local | ci
    #       artifact: "app-release.aab"
    #       build_duration: "2m 34s"    # human-readable
    #       build_duration_seconds: 154 # integer for aggregation
    #       release_notes: "What's New:\n• Server picker for downloads"
    #     ios:
    #       track: "testflight"         # testflight | appstore
    #       deployed_at: "2026-04-27T10:10:00Z"
    #       deployed_by: "ci"
    #       build_id: "abc123"
    #     mac:
    #       track: "testflight"         # testflight | appstore | desktop_dmg
    #       deployed_at: "2026-04-27T10:15:00Z"
    #       deployed_by: "local"
    #     tvos:
    #       track: "testflight"         # testflight | appstore
    #       deployed_at: "2026-04-27T10:20:00Z"
    #       deployed_by: "ci"
    #     desktop:
    #       targets:                    # dmg | deb | msi | github_release
    #         - "dmg"
    #         - "deb"
    #       deployed_at: "2026-04-27T10:25:00Z"
    #       deployed_by: "local"
    #     web:
    #       target: "github_pages"      # github_pages | custom_server
    #       deployed_at: "2026-04-27T10:30:00Z"
    #       deployed_by: "ci"
    #     firebase:
    #       deployed_at: "2026-04-27T10:35:00Z"
    #       deployed_by: "local"
    #     maven_central:
    #       deployed_at: "2026-04-27T10:40:00Z"
    #       deployed_by: "ci"
    #       group_id: "com.example"
    #       artifact_id: "my-library"
    #   git_tag: "v1.0.0"
    #   git_sha: "abc1234567890"
    #   changelog: "Initial release"
    #   status: "active"               # active | rolled_back | superseded
    #   rollback_info:                  # present only if status=rolled_back
    #     rolled_back_at: "2026-04-28T08:00:00Z"
    #     rolled_back_by: "local"
    #     reason: "Critical crash in onboarding flow"
    #     replaced_by: "v1.0.1"

# Field reference:
#
# version         (required) Semantic version string
# build_number    (required) Monotonically increasing integer
# timestamp       (required) ISO 8601 UTC — when the release was cut (git tag time)
# platforms       (required) Map of platform → deployment details (at least one)
# git_tag         (required) Git tag name (e.g., "v1.0.0")
# git_sha         (required) Short SHA of the tagged commit
# changelog       (required) Consumer-facing release notes (auto-generated from git, RULE-DEPLOYMENT-008 quality-gated)
# status          (required) One of: active, rolled_back, superseded
#                            - active: currently deployed
#                            - rolled_back: was deployed, then reverted
#                            - superseded: was active, then a newer version replaced it
# rollback_info   (optional) Present only when status=rolled_back
