schema_version: "1.0"
id: share-out-flow
name: Distribution / Share-Out Flow
type: happy
feature_ref: share-out
milestone: v1.0.0
description: >
  The pluggable distribution flow (global self-signup pivot, 2026-07-17; FR-023). The
  distribution strategy is selected by the group's GroupTypeConfig, not hard-coded to
  pro-rata. An organizer or chairperson initiates distribution from the organizer
  dashboard; the app computes the payout client-side per the group's strategy — PRO_RATA
  share-out (VSLA/SILC/ASCA, end-of-cycle savings + earnings), ROTATION payout (ROSCA
  family, one member takes the pot per payout_order_method), or AUCTION/BID (chit/hui) —
  the group reviews the preview and confirms; the companion API executes the resulting
  Fineract money movements.

entry_point:
  screen: organizer-dashboard
  condition: organizer_or_chairperson_taps_distribute

steps:
  - step: 1
    screen: organizer-dashboard
    action: >
      Organizer / chairperson taps "Distribute" (labelled per type: "Share-Out" for
      accumulating groups, "Payout" for rotating groups). The group's GroupTypeConfig
      distribution_strategy determines the compute branch.
    transition: share-out-preview
    condition: distribution_initiated

  # ── BRANCH A: PRO_RATA share-out (VSLA / SILC / ASCA) ──
  - step: 2a
    screen: share-out-preview
    action: >
      PRO_RATA branch — fetch total corpus + total profit (loan interest + fees +
      penalties); compute each member's share = (member_savings / total_savings) × total_pool
      plus proportional earnings.
    transition: share-out-preview
    condition: strategy_is_pro_rata

  # ── BRANCH B: ROTATION payout (ROSCA family) ──
  - step: 2b
    screen: share-out-preview
    action: >
      ROTATION branch — determine this period's recipient from payout_order_method
      (FIXED_ORDER | LOTTERY | AUCTION | NEED_BASED); the recipient takes the pot (sum of
      this period's contributions, less any agreed fee); no cycle close.
    transition: share-out-preview
    condition: strategy_is_rotation

  # ── BRANCH C: AUCTION / BID (chit / hui) ──
  - step: 2c
    screen: share-out-preview
    action: >
      AUCTION branch — members bid a discount; the winning (lowest-take / highest-discount)
      bidder receives the pot; the discount is redistributed as dividend to the others.
    transition: share-out-preview
    condition: strategy_is_auction

  - step: 3
    screen: share-out-preview
    action: >
      The group reviews the per-member breakdown (savings return + earnings for pro-rata;
      recipient + remaining schedule for rotation; winning bid + dividend split for auction)
      and confirms.
    transition: share-out-execute
    condition: group_confirms

  - step: 4
    screen: share-out-execute
    action: Confirm final payouts on the double-confirmation screen; tap Distribute
    transition: organizer-dashboard
    condition: distribution_confirmed

  - step: 5
    screen: share-out-execute
    action: >
      Distribution computed client-side; the companion API executes the resulting Fineract
      money movements (withdrawals / disbursals) and posts the distribution record.
    transition: organizer-dashboard
    condition: transactions_posted

  - step: 6
    screen: organizer-dashboard
    action: >
      For PRO_RATA — cycle closed, historical record saved, new cycle started. For ROTATION /
      AUCTION — the recipient is marked paid and the rotation advances; cycle continues.
    transition: end
    condition: distribution_finalized

exit_points:
  - screen: organizer-dashboard
    outcome: success
    description: Distribution executed per the group's strategy; pro-rata closes the cycle, rotation/auction advances it.

  - screen: share-out-execute
    outcome: failure
    description: Companion API money-movement error — partial disbursement rolled back; error shown with retry.

screens_involved:
  - organizer-dashboard
  - share-out-preview
  - share-out-execute

api_calls:
  - endpoint: /datatables/group_type_config/{groupId}
    method: GET
    purpose: Read the group's distribution_strategy + payout_order_method to select the compute branch.

  - endpoint: /companion/groups/{groupId}/corpus
    method: GET
    purpose: Fetch group corpus balance and earnings to seed the distribution calculation.

  - endpoint: /companion/groups/{groupId}/distribute
    method: POST
    purpose: Execute the client-computed distribution as Fineract money movements and record the distribution event.

  - endpoint: /datatables/rosca_rotation/{groupId}
    method: POST
    purpose: Advance the rotation schedule and record the period recipient (ROTATION branch).

offline_capable: false
offline_notes: "Distribution is a high-stakes irreversible action; connectivity required. Organizer is warned if offline."

analytics_events:
  - distribution_initiated: "Organizer/chairperson taps Distribute (strategy: pro_rata|rotation|auction)"
  - distribution_computed: "Payout computed client-side per strategy (member_count: N)"
  - distribution_preview_viewed: Preview loaded with per-member breakdown
  - distribution_confirmed: Organizer taps Distribute on share-out-execute
  - distribution_success: "Money movements executed (strategy: pro_rata|rotation|auction)"
  - cycle_closed: PRO_RATA cycle closed and new cycle started
  - rotation_advanced: ROTATION/AUCTION recipient paid and schedule advanced
  - distribution_failed: Companion API error; rollback attempted
