schema_version: "1.0"
id: share-out-flow
name: Share-Out Flow
type: happy
feature_ref: share-out
client_type: admin
milestone: v1.0.0
description: >
  At end of savings cycle, admin initiates share-out from group-dashboard; the system
  computes each member's payout (savings return + proportional profit share); the group
  reviews the preview screen and confirms; individual withdrawal transactions are disbursed
  to each member; cycle is closed and a new one begins.

entry_point:
  screen: group-dashboard
  condition: user_taps_initiate_share_out

steps:
  - step: 1
    screen: group-dashboard
    action: Tap "Initiate Share-Out" at cycle end
    transition: share-out-preview
    condition: admin_authenticated_cycle_end

  - step: 2
    screen: share-out-preview
    action: System fetches total corpus and total profit; computes per-member share pro-rata by savings contribution
    transition: share-out-preview
    condition: data_loaded

  - step: 3
    screen: share-out-preview
    action: Admin and group review per-member breakdown table (savings return + profit share)
    transition: share-out-execute
    condition: group_confirms

  - step: 4
    screen: share-out-execute
    action: Confirm final payouts on double-confirmation screen; tap Distribute
    transition: group-dashboard
    condition: distribution_confirmed

  - step: 5
    screen: share-out-execute
    action: System records withdrawal transactions for each member and posts dt_share_out record
    transition: group-dashboard
    condition: transactions_posted

  - step: 6
    screen: group-dashboard
    action: Cycle closed — historical record saved; new cycle counter started
    transition: end
    condition: cycle_reset

exit_points:
  - screen: group-dashboard
    outcome: success
    description: All member payouts disbursed, cycle closed, new cycle begun.

  - screen: share-out-execute
    outcome: failure
    description: Batch withdrawal API error — partial disbursement rolled back; error shown with retry option.

screens_involved:
  - group-dashboard
  - share-out-preview
  - share-out-execute

api_calls:
  - endpoint: /centers/{centerId}/accounts
    method: GET
    purpose: Fetch group corpus balance and total profit to seed share-out calculation.

  - endpoint: /datatables/dt_share_out
    method: POST
    purpose: Record the share-out event with per-member payout amounts and cycle metadata.

  - endpoint: /savingsaccounts/{savingsId}/transactions
    method: POST
    purpose: Record individual withdrawal transactions for each member's payout (called per member in batch).

  - endpoint: /api/v1/batches
    method: POST
    purpose: Submit all withdrawal transactions as a batch for atomicity.

offline_capable: false
offline_notes: "Share-out is a high-stakes irreversible action; connectivity required. Admin is warned if offline."

analytics_events:
  - share_out_initiated: Admin taps Initiate Share-Out on group-dashboard
  - share_out_preview_viewed: Preview screen loaded with per-member breakdown
  - share_out_confirmed: Admin taps Distribute on share-out-execute
  - share_out_success: All batch transactions recorded; cycle closed
  - share_out_failed: Batch API error; rollback attempted
