schema_version: "1.0"
id: admin-auth-flow
name: Admin Authentication Flow
type: happy
feature_ref: authentication
client_type: admin
milestone: v1.0.0
description: >
  Staff user selects the admin path on app launch, authenticates with Fineract staff
  credentials, reads their role from dt_member_role, sets up PIN/biometric, and lands
  on group-list.

entry_point:
  screen: client-type-selector
  condition: app_launch_no_cached_token

steps:
  - step: 1
    screen: client-type-selector
    action: Tap "I manage a group" tile
    transition: login
    condition: no_cached_token

  - step: 2
    screen: login
    action: Enter Fineract staff username and password, tap Login
    transition: group-list
    condition: client_type == admin

  - step: 3
    screen: login
    action: System authenticates via /api/v1/authentication
    transition: group-list
    condition: auth_success

  - step: 4
    screen: login
    action: Cache token + client_type=admin; read dt_member_role to determine role
    transition: group-list
    condition: token_cached

  - step: 5
    screen: login
    action: Prompt user to set up local 4-digit PIN for offline access
    transition: group-list
    condition: pin_not_set

  - step: 6
    screen: login
    action: Optionally enable biometric unlock (fingerprint/face)
    transition: group-list
    condition: biometric_available

  - step: 7
    screen: group-list
    action: Arrive at group list; admin navigation active
    transition: end
    condition: authenticated

exit_points:
  - screen: group-list
    outcome: success
    description: Admin is authenticated, role determined, and lands on group-list.

  - screen: login
    outcome: failure
    description: Invalid credentials or server error — user stays on login with error banner.

screens_involved:
  - client-type-selector
  - login
  - group-list

api_calls:
  - endpoint: /api/v1/authentication
    method: POST
    purpose: Authenticate staff user with username and password; returns token and roles.

  - endpoint: /datatables/dt_member_role/{clientId}
    method: GET
    purpose: Determine admin role (treasurer, chairperson, or field officer) post-login.

offline_capable: false
offline_notes: "Authentication requires connectivity; offline login via cached PIN handled as a separate path on the login screen."

analytics_events:
  - client_type_selected: User taps "I manage a group" tile on client-type-selector
  - login_attempted: User taps Login button with admin credentials
  - login_success: /api/v1/authentication returns 200
  - login_failed: /api/v1/authentication returns 401 or 503
  - pin_setup_completed: User sets 4-digit PIN after first successful login
  - biometric_enabled: User opts in to biometric unlock
