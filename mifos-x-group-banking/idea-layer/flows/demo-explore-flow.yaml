schema_version: "1.0"
id: demo-explore-flow
name: Demo Explore Flow
type: happy
feature_ref: demo-explore
milestone: v1.0.0
description: >
  A zero-friction "try before you sign up" path (F1 / B1, 2026-08-01). On the unified
  login-signup screen a "Demo Explore" button opens a confirm dialog explaining "this is a
  demo user logging in to explore the application"; on confirm the app enters a guest demo
  session seeded entirely from bundled offline demo data (PROJECT_DEMO_DATA.yaml — the
  Mwangaza Women's Group VSLA with members, savings, meetings and a live invite code). The
  demo user is seeded as the organizer of that group, so the session lands on the same
  organizer-dashboard a real authenticated organizer would see and can freely explore
  meetings, members, savings, loans and share-out. NO live server, NO real credentials, and
  NO writes to Fineract — the demo session is fully offline and read-mostly, and can be
  exited back to login-signup at any time to sign up or accept an invitation for real.

entry_point:
  screen: login-signup
  condition: app_launch_no_cached_session

steps:
  - step: 1
    screen: login-signup
    action: >
      Unified login/signup screen renders. Below the auth form a "Demo Explore" button is
      shown for users who want to explore the app without an account. User taps it.
    transition: login-signup
    condition: demo_explore_tapped

  - step: 2
    screen: login-signup
    action: >
      A confirm dialog appears: "this is a demo user logging in to explore the application"
      (Cancel / Continue). Cancel dismisses back to the auth form; Continue proceeds.
    transition: login-signup
    condition: demo_confirm_accepted

  - step: 3
    screen: login-signup
    action: >
      The app initialises a guest demo session from bundled offline demo data — no network
      call. A synthetic demo session token + the seeded Mwangaza Women's Group (demo-group-001)
      and its members/savings/meetings are loaded into the local SQLDelight cache. The demo
      user is resolved as the seeded group's organizer.
    transition: organizer-dashboard
    condition: demo_session_seeded

  - step: 4
    screen: organizer-dashboard
    action: >
      Organizer dashboard opens for the seeded demo group (corpus, members, next meeting,
      sync status). A persistent "Demo mode" banner indicates the session is a read-only
      exploration. From here the demo user can drill into group-dashboard, meeting-calendar,
      member-list, savings-dashboard and share-out to explore the full app end-to-end.
    transition: end
    condition: demo_exploration_active

exit_points:
  - screen: organizer-dashboard
    outcome: success
    description: Demo user lands on the seeded organizer dashboard and can explore the whole app offline.

  - screen: login-signup
    outcome: cancelled
    description: User cancels the confirm dialog and returns to the auth form to log in, sign up, or accept an invitation.

screens_involved:
  - login-signup
  - organizer-dashboard

api_calls: []

offline_capable: true
offline_notes: >
  The demo session is 100% offline. It never calls the companion API or Fineract; the entire
  dataset is bundled demo data (PROJECT_DEMO_DATA.yaml) hydrated into the local SQLDelight
  cache under a synthetic demo session token. Any write attempted inside demo mode is a
  local-only no-op (nothing is persisted to a server). Exiting demo mode clears the demo
  session and returns to the unified login-signup screen.

analytics_events:
  - demo_explore_tapped: User taps the Demo Explore button on login-signup
  - demo_confirm_shown: Confirm dialog ("demo user logging in to explore") is shown
  - demo_confirm_accepted: User confirms and enters the demo session
  - demo_confirm_cancelled: User cancels the confirm dialog and returns to the auth form
  - demo_session_seeded: Offline demo data hydrated into the local cache; demo session started
  - demo_dashboard_viewed: Seeded organizer dashboard rendered in demo mode
