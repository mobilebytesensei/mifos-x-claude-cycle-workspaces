schema_version: "1.0"
id: end-user-loan-request-flow
name: End User Loan Request Flow
type: happy
feature_ref: end-user-dashboard
client_type: end_user
milestone: v1.0.0
description: >
  Group member self-service flows: view savings balance via personal-savings, request a
  loan from personal-dashboard, fill the loan-request form with amount/purpose/duration;
  eligibility is auto-calculated based on own savings × group loan multiplier; on
  submission the request is stored in dt_loan_request and surfaces in the admin's next
  meeting agenda; member tracks loan status via personal-loans.

entry_point:
  screen: personal-dashboard
  condition: user_taps_request_loan

steps:
  - step: 1
    screen: personal-dashboard
    action: Member views dashboard — can tap "View Savings" (→ personal-savings) or "Request Loan" (→ loan-request)
    transition: personal-savings
    condition: end_user_authenticated

  - step: 1b
    screen: personal-savings
    action: Member views savings balance, transaction history, and interest accrued; taps back or continues to loan request
    transition: personal-dashboard
    condition: savings_reviewed

  - step: 2
    screen: personal-dashboard
    action: Tap "Request Loan" CTA button
    transition: loan-request
    condition: member_wants_loan

  - step: 2
    screen: loan-request
    action: Enter requested amount, purpose, and repayment duration
    transition: loan-request
    condition: form_in_progress

  - step: 3
    screen: loan-request
    action: System auto-calculates eligibility ceiling (own_savings × group_loan_multiplier)
    transition: loan-request
    condition: eligibility_computed

  - step: 4
    screen: loan-request
    action: Tap Submit — request stored in dt_loan_request on m_client
    transition: personal-loans
    condition: eligible_and_submitted

  - step: 5
    screen: personal-loans
    action: Confirmation shown; request appears with "Pending Review" status badge
    transition: end
    condition: submission_acknowledged

exit_points:
  - screen: personal-loans
    outcome: success
    description: Loan request submitted; member shown confirmation and pending status; request queued for next meeting agenda.

  - screen: loan-request
    outcome: blocked
    description: Requested amount exceeds eligibility ceiling — member shown max eligible amount and cannot submit.

screens_involved:
  - personal-dashboard
  - personal-savings
  - loan-request
  - personal-loans

api_calls:
  - endpoint: /datatables/dt_loan_request/{clientId}
    method: POST
    purpose: Store the member's loan request linked to their client record; amount, purpose, duration, and eligibility snapshot.

offline_capable: true
offline_notes: >
  If offline, loan request is queued in sync_queue. Member sees a "Will sync when online"
  confirmation. Request appears in admin's meeting agenda only after sync completes.

analytics_events:
  - loan_request_started: End user taps Request Loan on personal-dashboard
  - loan_eligibility_computed: Eligibility ceiling calculated and displayed
  - loan_request_submitted: Member taps Submit on loan-request form
  - loan_request_queued_offline: Request stored locally due to no connectivity
  - loan_request_synced: Queued request successfully posted to Fineract
