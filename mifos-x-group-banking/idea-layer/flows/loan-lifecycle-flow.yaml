schema_version: "1.0"
id: loan-lifecycle-flow
name: Loan Lifecycle Flow
type: happy
feature_ref: loan-management
milestone: v1.0.0
description: >
  The organizer (or chairperson) browses loan-list to see all active, overdue, and pending
  group loans; opens a member's loan detail or initiates a new application from
  member-profile; the application passes an eligibility check; the request is presented to
  the group for a democratic vote during meeting-conduct Step 5; on approval the
  disbursement is recorded; repayments are tracked via loan-repayment-dialog in subsequent
  meetings; overdue loans may be escalated via loan-mark-defaulted-dialog until fully
  repaid. (Global self-signup pivot, 2026-07-17 — no admin client_type; loan-officer
  capabilities are the organizer's / chairperson's per-group role.)

entry_point:
  screen: loan-list
  condition: organizer_taps_loans_nav

steps:
  - step: 1
    screen: loan-list
    action: Organizer views all group loans (active, overdue, pending, closed); taps a loan to inspect or navigates to member-profile to start a new application
    transition: member-profile
    condition: organizer_authenticated

  - step: 2
    screen: member-profile
    action: Tap "Request Loan" button for selected member
    transition: loan-apply
    condition: loan_creation_initiated

  - step: 3
    screen: loan-apply
    action: Enter loan amount, duration, and purpose; system validates eligibility (savings × multiplier) and corpus check
    transition: meeting-conduct
    condition: eligibility_passed

  - step: 4
    screen: meeting-conduct
    action: "Step 5 — Loan request presented; group votes (approve/reject/abstain) per member"
    transition: loan-detail
    condition: vote_majority_approve

  - step: 5
    screen: meeting-conduct
    action: Approved — disbursement amount recorded as a loan transaction
    transition: loan-detail
    condition: loan_disbursed

  - step: 6
    screen: loan-detail
    action: Organizer views repayment schedule; tracks outstanding balance and next due date
    transition: loan-repayment-dialog
    condition: repayment_due

  - step: 7
    screen: loan-repayment-dialog
    action: Organizer enters repayment amount; system calculates principal + interest split; confirms payment
    transition: loan-detail
    condition: repayment_amount_entered

  - step: 8
    screen: loan-detail
    action: Repayment recorded; outstanding balance updated; loan closed if fully repaid
    transition: end
    condition: loan_fully_repaid

  - step: 9
    screen: loan-mark-defaulted-dialog
    action: Organizer / chairperson marks an overdue loan as defaulted after exhausting repayment options; confirms with reason code
    transition: loan-detail
    condition: loan_overdue_and_unrecoverable

exit_points:
  - screen: loan-detail
    outcome: success
    description: Loan fully repaid; account status updated to closed in Fineract.

  - screen: loan-apply
    outcome: failure
    description: Eligibility check failed — user shown max eligible amount; application not submitted.

  - screen: meeting-conduct
    outcome: blocked
    description: Group vote results in rejection; loan marked rejected; member can reapply next meeting.

screens_involved:
  - loan-list
  - member-profile
  - loan-apply
  - meeting-conduct
  - loan-detail
  - loan-repayment-dialog
  - loan-mark-defaulted-dialog

api_calls:
  - endpoint: /loans
    method: POST
    purpose: Submit loan application with status "submitted and pending approval".

  - endpoint: /datatables/dt_loan_vote
    method: POST
    purpose: Record individual member votes for the loan request during the group meeting.

  - endpoint: /loans/{loanId}/state-transitions
    method: POST
    purpose: Approve and disburse the loan after majority group vote.

  - endpoint: /loans/{loanId}/transactions
    method: POST
    purpose: Record repayment transactions collected during each subsequent meeting.

offline_capable: false
offline_notes: "Loan application and vote submission require connectivity; meeting steps queue offline but disbursement is confirmed online."

analytics_events:
  - loan_list_opened: Organizer opens loan-list screen
  - loan_application_started: Organizer taps Request Loan on member-profile
  - loan_eligibility_checked: Eligibility computed client-side on loan-apply screen
  - loan_submitted: POST /loans returns 200
  - loan_vote_recorded: Each member vote recorded during meeting Step 5
  - loan_approved: Majority vote approves; disbursement recorded
  - loan_rejected: Majority vote rejects; loan status set to rejected
  - loan_repayment_recorded: Repayment collected during meeting Step 3
  - loan_closed: Outstanding balance reaches zero; loan account closed
