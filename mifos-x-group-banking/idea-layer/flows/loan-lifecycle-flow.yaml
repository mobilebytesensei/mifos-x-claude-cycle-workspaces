schema_version: "1.0"
id: loan-lifecycle-flow
name: Loan Lifecycle Flow
type: happy
feature_ref: loan-management
client_type: admin
milestone: v1.0.0
description: >
  Admin initiates a loan application on behalf of a member from member-profile;
  application passes eligibility check; the request is presented to the group
  for a democratic vote during meeting-conduct Step 5; on approval the disbursement
  is recorded; repayments are tracked in subsequent meetings until the loan is fully
  repaid and closed.

entry_point:
  screen: member-profile
  condition: user_taps_request_loan

steps:
  - step: 1
    screen: member-profile
    action: Tap "Request Loan" button for selected member
    transition: loan-apply
    condition: admin_authenticated

  - step: 2
    screen: loan-apply
    action: Enter loan amount, duration, and purpose; system validates eligibility (savings × multiplier) and corpus check
    transition: meeting-conduct
    condition: eligibility_passed

  - step: 3
    screen: meeting-conduct
    action: "Step 5 — Loan request presented; group votes (approve/reject/abstain) per member"
    transition: loan-detail
    condition: vote_majority_approve

  - step: 4
    screen: meeting-conduct
    action: Approved — disbursement amount recorded as a loan transaction
    transition: loan-detail
    condition: loan_disbursed

  - step: 5
    screen: loan-detail
    action: Admin views repayment schedule; tracks outstanding balance and next due date
    transition: meeting-conduct
    condition: repayment_due

  - step: 6
    screen: meeting-conduct
    action: "Step 3 — Repayment collected from member during next meeting"
    transition: loan-detail
    condition: repayment_recorded

  - step: 7
    screen: loan-detail
    action: Loan marked as fully repaid when outstanding balance reaches zero
    transition: end
    condition: loan_fully_repaid

exit_points:
  - screen: loan-detail
    outcome: success
    description: Loan fully repaid; account status updated to closed in Fineract.

  - screen: loan-apply
    outcome: failure
    description: Eligibility check failed — user shown max eligible amount; application not submitted.

  - screen: meeting-conduct
    outcome: blocked
    description: Group vote results in rejection; loan marked rejected; member can reapply next meeting.

screens_involved:
  - member-profile
  - loan-apply
  - meeting-conduct
  - loan-detail

api_calls:
  - endpoint: /loans
    method: POST
    purpose: Submit loan application with status "submitted and pending approval".

  - endpoint: /datatables/dt_loan_vote
    method: POST
    purpose: Record individual member votes for the loan request during the group meeting.

  - endpoint: /loans/{loanId}/state-transitions
    method: POST
    purpose: Approve and disburse the loan after majority group vote.

  - endpoint: /loans/{loanId}/transactions
    method: POST
    purpose: Record repayment transactions collected during each subsequent meeting.

offline_capable: false
offline_notes: "Loan application and vote submission require connectivity; meeting steps queue offline but disbursement is confirmed online."

analytics_events:
  - loan_application_started: Admin taps Request Loan on member-profile
  - loan_eligibility_checked: Eligibility computed client-side on loan-apply screen
  - loan_submitted: POST /loans returns 200
  - loan_vote_recorded: Each member vote recorded during meeting Step 5
  - loan_approved: Majority vote approves; disbursement recorded
  - loan_rejected: Majority vote rejects; loan status set to rejected
  - loan_repayment_recorded: Repayment collected during meeting Step 3
  - loan_closed: Outstanding balance reaches zero; loan account closed
