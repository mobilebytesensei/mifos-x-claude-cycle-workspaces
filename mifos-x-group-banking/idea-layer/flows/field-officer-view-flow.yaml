schema_version: "1.0"
id: field-officer-view-flow
name: Field Officer Supervision Flow
type: happy
feature_ref: field-officer-view
tier: optional
persona_tier: optional_supervisory
deferred: "1.1.0"
milestone: v1.1.0
description: >
  OPTIONAL supervisory tier — NOT a first-class v1 flow (global self-signup pivot,
  2026-07-17; FR-009). Deferred to 1.1.0 and only present in MFI/NGO deployments. A field
  officer uses the SAME unified login-signup as everyone else, but their account is
  additionally granted an opt-in, read-only cross-group supervisory view; they do NOT
  self-signup into this tier — it is back-office-provisioned. On login they land on the
  field-officer-dashboard: KPI cards aggregated across assigned groups, a filterable group
  health list with GREEN/AMBER/RED indicators, and an Export Report button. They can filter,
  review individual group health, and export a CSV — but cannot initiate transactions or
  modify any group data. In a pure self-signup deployment this flow may not exist at all.

entry_point:
  screen: field-officer-dashboard
  condition: supervisory_tier_user_authenticated_via_unified_login_and_routed_to_dashboard

steps:
  - step: 1
    screen: field-officer-dashboard
    action: >
      Dashboard loads; GET /centers?staffId={staffId} fetches all assigned groups.
      Four KPI cards render: Total Groups, Active Members, Overdue Loans, Sync Alerts.
      Group health list shows each group with a coloured health dot (GREEN / AMBER / RED).
    transition: field-officer-dashboard-loaded
    condition: data_fetched_or_cached

  - step: 2
    screen: field-officer-dashboard
    action: Field officer taps a region filter chip (e.g. "Nairobi West") to narrow the group list
    transition: field-officer-dashboard-filtered
    condition: filter_chip_tapped

  - step: 3
    screen: field-officer-dashboard
    action: >
      Group list re-renders showing only groups in the selected region.
      KPI cards update to reflect the filtered subset.
      Active filter chip is highlighted (filled tonal style).
    transition: field-officer-dashboard-filtered
    condition: filter_applied

  - step: 4
    screen: field-officer-dashboard
    action: Field officer taps a specific GroupHealthCard to drill into that group's status summary
    transition: group-dashboard
    condition: group_card_tapped

  - step: 5
    screen: field-officer-dashboard
    action: >
      Read-only group-dashboard opens for the tapped group.
      All write actions (Start Meeting, Add Member, Apply Loan) are hidden or disabled
      for the field officer role. Corpus balance, savings totals, and last sync time visible.
    transition: field-officer-dashboard
    condition: admin_taps_back

  - step: 6
    screen: field-officer-dashboard
    action: Field officer taps Export Report button to generate a CSV summary of all visible groups
    transition: field-officer-dashboard
    condition: export_triggered

  - step: 7
    screen: field-officer-dashboard
    action: >
      GET /reports with runReport=true generates the group health CSV.
      System share sheet opens with the CSV file for export via email or file manager.
      Snackbar confirms "Report exported".
    transition: end
    condition: csv_generated_and_shared

exit_points:
  - screen: field-officer-dashboard
    outcome: success
    description: Field officer has reviewed group health and optionally exported a report.

  - screen: field-officer-dashboard
    outcome: empty
    description: No groups assigned to this staff ID — empty state shown with a "contact your program administrator" prompt.

  - screen: field-officer-dashboard
    outcome: offline
    description: No connectivity — dashboard renders from SQLDelight cache; sync alerts KPI shows stale data warning.

screens_involved:
  - field-officer-dashboard

api_calls:
  - endpoint: /centers?staffId={staffId}
    method: GET
    purpose: Fetch all groups (Fineract Centers) assigned to the logged-in field officer staff ID.

  - endpoint: /groups?staffId={staffId}
    method: GET
    purpose: Fetch group-level health metrics (meeting frequency, savings totals, overdue loans) for KPI aggregation.

  - endpoint: /runreports/GroupHealthSummary
    method: GET
    purpose: Generate the CSV group health report for the Export Report action.

offline_capable: true
offline_notes: >
  Field officer dashboard reads from SQLDelight cache when offline.
  KPI cards and group list show last-synced values with a staleness timestamp.
  Export Report requires connectivity — button shows disabled state with
  "Connect to export" tooltip when offline. Group drill-down to group-dashboard
  works offline using cached data.

analytics_events:
  - field_officer_dashboard_viewed: "Field officer opens dashboard (group_count: N)"
  - field_officer_filter_applied: "Region or overdue filter tapped (filter_type: region|overdue, value: string)"
  - field_officer_filter_cleared: All filters removed
  - field_officer_group_drilldown: "GroupHealthCard tapped (group_id: string, health_status: GREEN|AMBER|RED)"
  - field_officer_report_exported: Export Report CSV generated and shared
  - field_officer_dashboard_offline: "Dashboard loaded from cache (stale_minutes: N)"
