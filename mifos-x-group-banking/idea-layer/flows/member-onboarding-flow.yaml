schema_version: "1.0"
id: member-onboarding-flow
name: Member Onboarding Flow
type: happy
feature_ref: member-onboarding
client_type: admin
milestone: v1.0.0
description: >
  Admin navigates to the member list for a group, taps the FAB to add a new member,
  captures their name, phone number, photo, and role assignment, then confirms to
  create a new Fineract Client and assign their dt_member_role. The new member
  appears immediately in the member list and on the group-dashboard.

entry_point:
  screen: member-list
  condition: admin_navigates_from_group_dashboard

steps:
  - step: 1
    screen: member-list
    action: View all current members for the group; list loads from GET /groups/{groupId}/clients
    transition: member-add
    condition: admin_taps_add_member_fab

  - step: 2
    screen: member-add
    action: Optionally capture a photo via camera or gallery using the photo picker area
    transition: member-add-details
    condition: photo_selected_or_skipped

  - step: 3
    screen: member-add
    action: Enter first name, last name, and phone number; select role from dropdown (chairperson / treasurer / secretary / member)
    transition: member-add-review
    condition: required_fields_valid

  - step: 4
    screen: member-add
    action: Tap Save — POST /clients creates the Fineract Client; POST /datatables/dt_member_role assigns the role
    transition: member-profile
    condition: create_success_or_queued

  - step: 5
    screen: member-profile
    action: New member profile opens; savings history sparkline and loan cards visible; role badge shows assigned role
    transition: member-savings-detail
    condition: admin_taps_savings_card

  - step: 5b
    screen: member-profile
    action: Admin taps back from member profile
    transition: member-list
    condition: admin_taps_back

  - step: 6
    screen: member-savings-detail
    action: Full savings transaction history for the member; filter by deposits/withdrawals; pagination
    transition: member-profile
    condition: admin_taps_back

  - step: 7
    screen: member-list
    action: Member list refreshed — new member appears at top; group member count incremented
    transition: end
    condition: list_refreshed

exit_points:
  - screen: member-list
    outcome: success
    description: New member created and visible in the group member list.

  - screen: member-add
    outcome: failure
    description: API error (e.g. duplicate phone) — inline error shown; form data preserved for retry.

  - screen: member-add
    outcome: offline_queued
    description: Connectivity absent — member creation queued in SyncQueue; offline banner shown on member-list.

screens_involved:
  - member-list
  - member-add
  - member-profile
  - member-savings-detail

api_calls:
  - endpoint: /groups/{groupId}/clients
    method: GET
    purpose: Load existing group members for the member-list screen.

  - endpoint: /clients
    method: POST
    purpose: Create a new Fineract Client representing the new group member.

  - endpoint: /datatables/dt_member_role/{clientId}
    method: POST
    purpose: Assign the member's role (chairperson/treasurer/secretary/member) and client_type (admin/end_user).

  - endpoint: /clients/{clientId}/images
    method: POST
    purpose: Upload member photo if captured during onboarding.

offline_capable: true
offline_notes: >
  Member creation (POST /clients, POST dt_member_role, photo upload) is queued
  in SyncQueue when offline. The member appears locally in the list with a
  "pending sync" badge until the queue drains. Photo upload is retried after
  the client creation sync completes to ensure {clientId} is available.

analytics_events:
  - member_add_started: Admin taps FAB on member-list
  - member_photo_captured: Admin captures or selects a photo
  - member_photo_skipped: Admin skips photo step
  - member_role_selected: Admin selects a role from the dropdown (role: chairperson|treasurer|secretary|member)
  - member_created: POST /clients returns 200 and role assigned
  - member_creation_queued: Offline — request queued for sync
  - member_profile_viewed: New member profile opened after creation
