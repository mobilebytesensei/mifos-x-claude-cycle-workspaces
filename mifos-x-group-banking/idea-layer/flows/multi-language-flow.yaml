schema_version: "1.0"
id: multi-language-flow
name: Multi-Language Settings Flow
type: happy
feature_ref: multi-language
client_type: both
milestone: v1.0.0
description: >
  User opens Settings from the bottom navigation or top-bar overflow menu and
  selects a new display language (English, Swahili, French, or Hindi). The app
  applies the new locale at runtime using CompositionLocalProvider — no
  Activity restart required. Also covers theme switching (System / Light / Dark),
  PIN change, biometric toggle, and logout from the same settings screen.

entry_point:
  screen: settings
  condition: user_taps_settings_nav_item

steps:
  - step: 1
    screen: settings
    action: Settings screen loads; current language highlighted in the language selector group; current theme shown in the appearance section
    transition: settings-language-selection
    condition: screen_loaded

  - step: 2
    screen: settings
    action: User taps a language radio option (e.g. Swahili — "Kiswahili")
    transition: settings-locale-applied
    condition: language_option_tapped

  - step: 3
    screen: settings
    action: >
      App applies new CompositionLocal locale via LocaleManager.setLocale(). All string
      resources re-render with the new locale. Noto Sans renders Swahili (Latin),
      French (Latin + diacritics), or Hindi (Devanagari) correctly via font subsetting.
      A snackbar confirms: "Language changed to Kiswahili"
    transition: settings
    condition: locale_applied

  - step: 4
    screen: settings
    action: User optionally changes theme (System / Light / Dark) by tapping a theme radio row
    transition: settings-theme-applied
    condition: theme_option_tapped

  - step: 5
    screen: settings
    action: App applies new MaterialTheme dynamically; snackbar confirms "Theme updated"
    transition: settings
    condition: theme_applied_or_user_exits

  - step: 6
    screen: settings
    action: User taps Logout button at the bottom of the settings screen
    transition: settings-logout-dialog
    condition: logout_tapped

  - step: 7
    screen: settings-logout-dialog
    action: Confirmation dialog — "Log out of MobileByteSensei?" with Cancel / Log Out actions; on confirm clears session and navigates to login
    transition: end
    condition: logout_confirmed_or_cancelled

exit_points:
  - screen: settings
    outcome: success
    description: Language and/or theme changed; new locale persisted to DataStore preferences and survives app restart.

  - screen: settings
    outcome: no_change
    description: User opens settings and navigates away without changing anything.

screens_involved:
  - settings
  - settings-logout-dialog

api_calls:
  - endpoint: /self/user/updatePassword
    method: PUT
    purpose: Called only when user completes the Change PIN dialog (4-digit PIN update via Fineract self-service). Not called during language/theme change.

offline_capable: true
offline_notes: >
  Language and theme changes are purely local — stored in DataStore and applied
  via CompositionLocalProvider. No network call required. The Change PIN action
  requires connectivity and queues to SyncQueue if offline.

analytics_events:
  - settings_opened: User navigates to settings screen
  - language_changed: "User selects a new language (from: en|sw|fr|hi, to: en|sw|fr|hi)"
  - theme_changed: "User changes display theme (theme: system|light|dark)"
  - biometric_toggled: "User enables or disables biometric unlock (enabled: true|false)"
  - change_pin_started: User taps Change PIN row
  - change_pin_completed: PIN successfully updated
  - logout_tapped: User taps Logout button
  - logout_confirmed: User confirms logout in the dialog
