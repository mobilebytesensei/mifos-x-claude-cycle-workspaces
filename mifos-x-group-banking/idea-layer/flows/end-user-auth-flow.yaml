schema_version: "1.0"
id: end-user-auth-flow
name: End User Authentication Flow
type: happy
feature_ref: authentication
client_type: end_user
milestone: v1.0.0
description: >
  Group member selects the member path on app launch, authenticates via Fineract
  self-service API, fetches their own client data, and lands on personal-dashboard.

entry_point:
  screen: client-type-selector
  condition: app_launch_no_cached_token

steps:
  - step: 1
    screen: client-type-selector
    action: Tap "I'm a group member" tile
    transition: login
    condition: no_cached_token

  - step: 2
    screen: login
    action: Enter Fineract self-service username and password, tap Login
    transition: personal-dashboard
    condition: client_type == end_user

  - step: 3
    screen: login
    action: System authenticates via /api/v1/self/authentication
    transition: personal-dashboard
    condition: auth_success

  - step: 4
    screen: login
    action: Cache token + client_type=end_user; fetch own client data (savings, loans, group membership)
    transition: personal-dashboard
    condition: token_cached

  - step: 5
    screen: login
    action: Prompt user to set up local 4-digit PIN for offline access
    transition: personal-dashboard
    condition: pin_not_set

  - step: 6
    screen: personal-dashboard
    action: Arrive at personal dashboard; end-user navigation active
    transition: end
    condition: authenticated

exit_points:
  - screen: personal-dashboard
    outcome: success
    description: End user is authenticated and lands on their personal dashboard.

  - screen: login
    outcome: failure
    description: Invalid credentials or server error — user stays on login with error banner.

screens_involved:
  - client-type-selector
  - login
  - personal-dashboard

api_calls:
  - endpoint: /api/v1/self/authentication
    method: POST
    purpose: Authenticate end user via Fineract self-service credentials; returns selfServiceToken and clientId.

  - endpoint: /api/v1/self/clients
    method: GET
    purpose: Fetch own client profile, group membership, savings, and loan summary after login.

offline_capable: false
offline_notes: "Authentication requires connectivity; offline login via cached PIN handled as a separate path on the login screen."

analytics_events:
  - client_type_selected: User taps "I'm a group member" tile on client-type-selector
  - login_attempted: User taps Login button with end-user credentials
  - login_success: /api/v1/self/authentication returns 200
  - login_failed: /api/v1/self/authentication returns 401 or 503
  - pin_setup_completed: User sets 4-digit PIN after first successful login
