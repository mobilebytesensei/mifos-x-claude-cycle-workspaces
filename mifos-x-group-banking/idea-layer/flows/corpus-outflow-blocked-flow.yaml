schema_version: "1.0"
id: corpus-outflow-blocked-flow
name: Corpus Outflow Blocked Flow
type: error
feature_ref: corpus-tracking
client_type: admin
milestone: v1.0.0
description: >
  During meeting-conduct Step 4 (Withdrawals/Disbursements), the system detects that a
  requested cash outflow would reduce the group corpus below zero; the transaction is
  blocked inline with a clear error showing available vs. requested amounts — no screen
  navigation occurs; admin can reduce the amount or skip the transaction.

entry_point:
  screen: meeting-conduct
  condition: step_4_outflow_amount_entered

steps:
  - step: 1
    screen: meeting-conduct
    action: "Step 4 — Admin enters a withdrawal or disbursement amount"
    transition: meeting-conduct
    condition: outflow_amount_entered

  - step: 2
    screen: meeting-conduct
    action: System checks corpus_balance - requested_outflow < 0
    transition: meeting-conduct
    condition: corpus_check_triggered

  - step: 3
    screen: meeting-conduct
    action: "Inline error displayed: 'Insufficient group funds. Available: X, Requested: Y'"
    transition: meeting-conduct
    condition: corpus_would_go_negative

  - step: 4
    screen: meeting-conduct
    action: Admin reduces amount to within available corpus balance, or skips transaction
    transition: meeting-conduct-step-5
    condition: admin_acknowledges_error

exit_points:
  - screen: meeting-conduct
    outcome: blocked
    description: Transaction blocked; admin corrects amount or skips — meeting continues from Step 4.

screens_involved:
  - meeting-conduct

api_calls: []

offline_capable: true
offline_notes: >
  Corpus check is performed client-side against locally cached corpus balance.
  No API call is required; guard works fully offline.

analytics_events:
  - corpus_gate_triggered: corpus_balance < requested_outflow detected during Step 4
  - corpus_gate_acknowledged: Admin reduces amount or skips after seeing the error
  - corpus_gate_bypassed_admin_reduced: Admin reduced amount to fit within corpus
  - corpus_gate_transaction_skipped: Admin chose to skip the blocked transaction entirely
