schema_version: "1.0"
id: group-creation-flow
name: Group Creation Flow
type: happy
feature_ref: group-management
client_type: admin
milestone: v1.0.0
description: >
  Admin taps the FAB on group-list to launch a 3-step creation wizard, configures
  the group's name, meeting schedule, savings rules, and loan policies, then confirms
  to create a new Fineract Center and group config; navigates to the new group-dashboard.

entry_point:
  screen: group-list
  condition: user_taps_fab

steps:
  - step: 1
    screen: group-list
    action: Tap + FAB to start group creation
    transition: group-create
    condition: admin_authenticated

  - step: 2
    screen: group-create
    action: "Step 1 — Enter group name and cycle length (e.g. 12-week cycle)"
    transition: group-create-step-2
    condition: name_valid

  - step: 3
    screen: group-create
    action: "Step 2 — Set meeting frequency (weekly/biweekly) and individual savings contribution rules"
    transition: group-create-step-3
    condition: meeting_config_valid

  - step: 4
    screen: group-create
    action: "Step 3 — Set loan policies: multiplier (e.g. 3×) and interest rate"
    transition: review-and-create
    condition: loan_policy_valid

  - step: 5
    screen: group-create
    action: Review all settings on summary screen and tap Create Group
    transition: group-dashboard
    condition: all_steps_complete

  - step: 6
    screen: group-dashboard
    action: Group created; system syncs to Fineract Center and saves dt_group_config
    transition: end
    condition: sync_success_or_queued

exit_points:
  - screen: group-dashboard
    outcome: success
    description: Group created and config persisted; admin lands on the new group's dashboard.

  - screen: group-create
    outcome: failure
    description: API error during creation — error shown inline; draft config preserved.

screens_involved:
  - group-list
  - group-create
  - group-dashboard

api_calls:
  - endpoint: /centers
    method: POST
    purpose: Create a new Fineract Center representing the savings group.

  - endpoint: /datatables/dt_group_config
    method: POST
    purpose: Persist group configuration (cycle length, meeting frequency, loan multiplier, interest rate).

offline_capable: true
offline_notes: >
  Group creation request is queued in sync_queue if connectivity is absent.
  Group-dashboard renders in offline-draft state until sync completes.

analytics_events:
  - group_creation_started: Admin taps FAB on group-list
  - group_creation_step_completed: "Each wizard step is advanced (step_number: 1|2|3)"
  - group_creation_confirmed: Admin taps Create Group on review screen
  - group_creation_success: POST /centers returns 200
  - group_creation_queued: Request queued offline for later sync
