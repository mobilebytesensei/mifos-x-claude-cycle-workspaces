schema_version: "1.0"
id: meeting-flow
name: Meeting Flow
type: happy
feature_ref: meeting-lifecycle
client_type: admin
milestone: v1.0.0
description: >
  Admin checks meeting-calendar to see today's scheduled group meetings; taps a group
  to open group-dashboard; starts the weekly meeting; reviews the previous meeting
  summary; steps through a 7-step wizard covering attendance, savings collection,
  loan repayments, disbursements, new loan votes, notes, and closing balance;
  closes with meeting-summary and optionally reviews the group savings-dashboard.

entry_point:
  screen: meeting-calendar
  condition: admin_opens_calendar

steps:
  - step: 1
    screen: meeting-calendar
    action: Admin views today's scheduled meetings and upcoming meetings by group; taps a group row to proceed
    transition: group-dashboard
    condition: admin_authenticated

  - step: 2
    screen: group-dashboard
    action: Tap "Start Meeting" — system shows opening fund balance
    transition: previous-meeting-review
    condition: meeting_scheduled_today

  - step: 3
    screen: previous-meeting-review
    action: "Step 0 — Review last meeting summary, balances, and outstanding action items"
    transition: meeting-conduct
    condition: review_acknowledged

  - step: 4
    screen: meeting-conduct
    action: "Step 1 — Attendance: roll call, mark present/absent/late, auto-apply penalty for latecomers"
    transition: meeting-conduct-step-2
    condition: attendance_recorded

  - step: 5
    screen: meeting-conduct
    action: "Step 2 — Savings Collection: record group-linked and individual savings deposits for each member"
    transition: meeting-conduct-step-3
    condition: savings_recorded

  - step: 6
    screen: meeting-conduct
    action: "Step 3 — Loan Repayments: collect principal + interest from borrowers, mark paid"
    transition: meeting-conduct-step-4
    condition: repayments_recorded

  - step: 7
    screen: meeting-conduct
    action: "Step 4 — Withdrawals/Disbursements: record outflows; corpus gate blocks if balance insufficient"
    transition: meeting-conduct-step-5
    condition: outflows_within_corpus

  - step: 8
    screen: meeting-conduct
    action: "Step 5 — New Loans: present pending requests, group votes, approve or reject each"
    transition: meeting-conduct-step-6
    condition: votes_recorded

  - step: 9
    screen: meeting-conduct
    action: "Step 6 — Notes & Action Items: capture free-text notes and assign next-meeting actions"
    transition: meeting-conduct-step-7
    condition: notes_saved

  - step: 10
    screen: meeting-conduct
    action: "Step 7 — Review & Close: confirm opening + inflows - outflows = closing balance"
    transition: meeting-summary
    condition: closing_balance_confirmed

  - step: 11
    screen: meeting-summary
    action: View final meeting summary and tap Close Meeting
    transition: savings-dashboard
    condition: summary_confirmed

  - step: 12
    screen: savings-dashboard
    action: Admin optionally reviews total group savings balance, per-member breakdown, and interest accrued since last meeting
    transition: group-dashboard
    condition: review_complete_or_skipped

  - step: 13
    screen: group-dashboard
    action: All transactions synced to Fineract (or queued for later sync)
    transition: end
    condition: sync_triggered

exit_points:
  - screen: meeting-summary
    outcome: success
    description: Meeting closed successfully; all transactions persisted and sync triggered.

  - screen: meeting-conduct
    outcome: blocked
    description: Corpus gate blocked a disbursement — user must reduce amount or skip; meeting can continue.

screens_involved:
  - meeting-calendar
  - group-dashboard
  - previous-meeting-review
  - meeting-conduct
  - meeting-summary
  - savings-dashboard

api_calls:
  - endpoint: /datatables/dt_meeting_record
    method: POST
    purpose: Persist the meeting record with attendance, notes, and action items.

  - endpoint: /savingsaccounts/{savingsId}/transactions
    method: POST
    purpose: Record individual savings deposits and withdrawals per member per meeting.

  - endpoint: /loans/{loanId}/transactions
    method: POST
    purpose: Record loan repayments and newly approved disbursements.

  - endpoint: /datatables/dt_loan_vote
    method: POST
    purpose: Record group voting outcome for each new loan application.

  - endpoint: /api/v1/batches
    method: POST
    purpose: Bulk-sync all queued meeting transactions when connectivity is restored.

offline_capable: true
offline_notes: >
  All wizard steps persist to local SQLDelight DB on each step advance.
  Transactions are queued in sync_queue when offline and synced automatically
  when connectivity is detected. Corpus gate operates on locally cached balances.

analytics_events:
  - calendar_opened: Admin opens meeting-calendar
  - meeting_tapped: Admin taps a group row on meeting-calendar to navigate to group-dashboard
  - meeting_started: Admin taps Start Meeting on group-dashboard
  - meeting_step_completed: "Each wizard step is completed (step: 1-7)"
  - meeting_corpus_gate_triggered: Outflow would cause negative corpus (step 4)
  - loan_vote_recorded: Group votes on a new loan application (step 5)
  - meeting_closed: Admin confirms closing balance and taps Close Meeting
  - meeting_synced: All transactions successfully pushed to Fineract
