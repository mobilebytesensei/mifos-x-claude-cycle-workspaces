schema_version: "1.0"
id: meeting-flow
name: Meeting Flow
type: happy
feature_ref: meeting-lifecycle
milestone: v1.0.0
description: >
  The organizer (or a chairperson/treasurer with the conduct-meeting role) checks
  meeting-calendar to see today's scheduled group meetings; taps a group to open
  group-dashboard; starts the meeting; reviews the previous meeting summary; steps through
  a 7-step wizard covering attendance, savings collection, loan repayments, disbursements,
  new loan votes, notes, and closing balance; closes with meeting-summary and optionally
  reviews the group savings-dashboard. (Global self-signup pivot, 2026-07-17 — no admin
  client_type; meeting capabilities are the organizer's / delegated per-group role.)

# ── F6 decision (2026-08-01): meeting scheduling model ──
# CHOSEN: (b) meetings AUTO-GENERATE from the group's recurring meeting schedule; add a
#   reschedule/adjust-schedule affordance rather than a separate ad-hoc "schedule meeting" leg.
# WHY: this is the canonical Fineract model and the one already wired in this idea-layer —
#   group-create step 1 captures REQUIRED meetingDay + meetingTime (+ meeting frequency in
#   step 2), which provision the group Calendar entity at creation. meeting-calendar
#   then READS the recurring meetings from groups/{groupId}/meetings; the app never needs to
#   create a one-off meeting because the recurrence produces them. Option (a) — an in-app
#   ad-hoc "schedule a meeting" step — would fork the source of truth away from the group
#   Calendar and duplicate what the recurrence already generates. Therefore the only missing
#   affordance is RESCHEDULE (move/adjust the next occurrence or the recurring schedule), and
#   the "no upcoming meeting" state must offer Set/Adjust-Schedule instead of dead-ending on a
#   "Next meeting not scheduled" placeholder. The RescheduleMeeting UI affordance on
#   meeting-calendar (empty + upcoming states) is authored in the downstream enrich stage (G3);
#   this flow provides the structural step + hook.
schedule_model:
  kind: auto_generated_recurring
  source_of_truth: group_calendar   # provisioned from group-create meetingDay + meetingTime + frequency
  affordance: reschedule            # adjust next occurrence / recurring schedule (no ad-hoc create leg)
  dead_end_removed: "no-upcoming state routes to Set/Adjust Schedule (was a 'Next meeting not scheduled' placeholder)"

entry_point:
  screen: meeting-calendar
  condition: organizer_opens_calendar

steps:
  - step: 1
    screen: meeting-calendar
    action: Organizer views today's scheduled meetings and upcoming meetings by group; taps a group row to proceed
    transition: group-dashboard
    condition: organizer_authenticated

  - step: 1r
    screen: meeting-calendar
    action: >
      RESCHEDULE affordance (F6, alternate branch). Meetings auto-generate from the group's
      recurring schedule (meetingDay/meetingTime/frequency from group-create); the organizer
      does not create meetings ad-hoc. Instead, from the upcoming-meeting card (or the
      no-upcoming state — which offers "Set/Adjust Schedule" rather than dead-ending) the
      organizer taps Reschedule to move the next occurrence or adjust the recurring schedule.
      This updates the group Calendar; groups/{groupId}/meetings then re-reads the shifted
      recurrence. Returns to the refreshed calendar. (The RescheduleMeeting UI affordance is
      wired in the enrich stage — G3.)
    transition: meeting-calendar
    condition: organizer_reschedules_or_sets_schedule

  - step: 2
    screen: group-dashboard
    action: Tap "Start Meeting" — system shows opening fund balance
    transition: previous-meeting-review
    condition: meeting_scheduled_today

  - step: 3
    screen: previous-meeting-review
    action: "Step 0 — Review last meeting summary, balances, and outstanding action items"
    transition: meeting-conduct
    condition: review_acknowledged

  - step: 4
    screen: meeting-conduct
    action: "Step 1 — Attendance: roll call, mark present/absent/late, auto-apply penalty for latecomers"
    transition: meeting-conduct-step-2
    condition: attendance_recorded

  - step: 5
    screen: meeting-conduct
    action: "Step 2 — Savings Collection: record group-linked and individual savings deposits for each member"
    transition: meeting-conduct-step-3
    condition: savings_recorded

  - step: 6
    screen: meeting-conduct
    action: "Step 3 — Loan Repayments: collect principal + interest from borrowers, mark paid"
    transition: meeting-conduct-step-4
    condition: repayments_recorded

  - step: 7
    screen: meeting-conduct
    action: "Step 4 — Withdrawals/Disbursements: record outflows; corpus gate blocks if balance insufficient"
    transition: meeting-conduct-step-5
    condition: outflows_within_corpus

  - step: 8
    screen: meeting-conduct
    action: "Step 5 — New Loans: present pending requests, group votes, approve or reject each"
    transition: meeting-conduct-step-6
    condition: votes_recorded

  - step: 9
    screen: meeting-conduct
    action: "Step 6 — Notes & Action Items: capture free-text notes and assign next-meeting actions"
    transition: meeting-conduct-step-7
    condition: notes_saved

  - step: 10
    screen: meeting-conduct
    action: "Step 7 — Review & Close: confirm opening + inflows - outflows = closing balance"
    transition: meeting-summary
    condition: closing_balance_confirmed

  - step: 11
    screen: meeting-summary
    action: Organizer views the final meeting summary and taps Close Meeting
    transition: savings-dashboard
    condition: summary_confirmed

  - step: 12
    screen: savings-dashboard
    action: Organizer optionally reviews total group savings balance, per-member breakdown, and interest accrued since last meeting
    transition: group-dashboard
    condition: review_complete_or_skipped

  - step: 13
    screen: group-dashboard
    action: All transactions synced to Fineract (or queued for later sync)
    transition: end
    condition: sync_triggered

exit_points:
  - screen: meeting-summary
    outcome: success
    description: Meeting closed successfully; all transactions persisted and sync triggered.

  - screen: meeting-conduct
    outcome: blocked
    description: Corpus gate blocked a disbursement — user must reduce amount or skip; meeting can continue.

screens_involved:
  - meeting-calendar
  - group-dashboard
  - previous-meeting-review
  - meeting-conduct
  - meeting-summary
  - savings-dashboard

api_calls:
  - endpoint: /datatables/dt_meeting_record
    method: POST
    purpose: Persist the meeting record with attendance, notes, and action items.

  - endpoint: /savingsaccounts/{savingsId}/transactions
    method: POST
    purpose: Record individual savings deposits and withdrawals per member per meeting.

  - endpoint: /loans/{loanId}/transactions
    method: POST
    purpose: Record loan repayments and newly approved disbursements.

  - endpoint: /datatables/dt_loan_vote
    method: POST
    purpose: Record group voting outcome for each new loan application.

  - endpoint: /api/v1/batches
    method: POST
    purpose: Bulk-sync all queued meeting transactions when connectivity is restored.

offline_capable: true
offline_notes: >
  All wizard steps persist to local SQLDelight DB on each step advance.
  Transactions are queued in sync_queue when offline and synced automatically
  when connectivity is detected. Corpus gate operates on locally cached balances.

analytics_events:
  - calendar_opened: Organizer opens meeting-calendar
  - meeting_rescheduled: "Organizer reschedules the next occurrence or adjusts the recurring group schedule (F6)"
  - meeting_schedule_set: Organizer sets the group meeting schedule from the no-upcoming state (replaces the dead-end placeholder)
  - meeting_tapped: Organizer taps a group row on meeting-calendar to navigate to group-dashboard
  - meeting_started: Organizer taps Start Meeting on group-dashboard
  - meeting_step_completed: "Each wizard step is completed (step: 1-7)"
  - meeting_corpus_gate_triggered: Outflow would cause negative corpus (step 4)
  - loan_vote_recorded: Group votes on a new loan application (step 5)
  - meeting_closed: Organizer confirms closing balance and taps Close Meeting
  - meeting_synced: All transactions successfully pushed to Fineract
