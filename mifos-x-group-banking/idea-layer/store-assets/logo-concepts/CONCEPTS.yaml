themes:
  - id: savings
    mark: '#F5F2FF'
    mark_bg: '#4C56C0'
    accent: '#D9DCFF'
    accent2: '#7C84E6'
    track: 'rgba(245,242,255,0.35)'
concepts:
  - id: pooled-fund
    rationale: >-
      A ring of six member dots orbiting one shared central fund — the core
      MifosSave metaphor of a savings group pooling money into a common purse.
      Reads as a coin/community mark, legible down to 48px as a single-color glyph.
    mark_svg: >-
      <circle cx="256" cy="256" r="78" fill="var(--mark)"/>
      <circle cx="256" cy="90" r="34" fill="var(--mark)"/>
      <circle cx="400" cy="173" r="34" fill="var(--mark)"/>
      <circle cx="400" cy="339" r="34" fill="var(--mark)"/>
      <circle cx="256" cy="422" r="34" fill="var(--mark)"/>
      <circle cx="112" cy="339" r="34" fill="var(--mark)"/>
      <circle cx="112" cy="173" r="34" fill="var(--mark)"/>
