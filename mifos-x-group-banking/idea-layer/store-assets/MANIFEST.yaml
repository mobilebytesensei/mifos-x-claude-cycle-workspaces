    screen: group-dashboard
    state: content
    source: stitch
    theme: savings
    frame: phone
    assetPath: idea-layer/store-assets/01-group-dashboard-content.html
    copy:
      en:
        eyebrow: Your group at a glance
        title: The whole group, on one screen.
        subtitle: Savings, loans, fines and the next meeting — every member's balance, live and offline.
