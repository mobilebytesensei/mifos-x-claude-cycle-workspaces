themes:
  - id: savings
    frameBg: 'linear-gradient(160deg, #4C56C0 0%, #2A2F73 100%)'
    overlayText: '#F5F2FF'
    overlayEyebrow: '#D9DCFF'
    pillBg: rgba(255, 255, 255, 0.15)
  - id: horizon
    frameBg: 'linear-gradient(160deg, #7C84E6 0%, #4C56C0 100%)'
    overlayText: '#FFFFFF'
    overlayEyebrow: '#EEF0FF'
    pillBg: rgba(255, 255, 255, 0.18)
  - id: nightfund
    frameBg: >-
      radial-gradient(circle at 30% 20%, rgba(76, 86, 192, 0.16) 0%, transparent 55%),
      linear-gradient(160deg, #0E0F1F 0%, #05060F 100%)
    overlayText: '#EAECFF'
    overlayEyebrow: '#A9B0FF'
    pillBg: rgba(76, 86, 192, 0.18)
assets:
