# Tag taxonomy — mifos-x-group-banking (CommonPurse)
# Derived from TAG_REGISTRY.yaml analytics events, organized by category.
# Use these tags in screen YAML `tags:` arrays for cross-screen querying.

version: "1.0.0"

categories:

  feature_group:
    description: "Which product feature group this screen/flow belongs to"
    values:
      - tag: authentication
        screens: [login, client-type-selector, settings-logout-dialog]
        description: "Login, session management, logout"

      - tag: group-management
        screens: [group-list, group-dashboard, group-create]
        description: "VSLA group CRUD and dashboard"

      - tag: member-onboarding
        screens: [member-list, member-add, member-profile]
        description: "Member registration and profile"

      - tag: meeting-lifecycle
        screens: [meeting-calendar, meeting-conduct, meeting-summary, previous-meeting-review]
        description: "Weekly meeting recording and review"

      - tag: savings
        screens: [savings-dashboard, member-savings-detail, personal-savings]
        description: "Group and individual savings tracking"

      - tag: loans
        screens: [loan-list, loan-apply, loan-detail, loan-request, loan-repayment-dialog, loan-mark-defaulted-dialog, personal-loans]
        description: "Loan applications, repayments, and defaults"

      - tag: share-out
        screens: [share-out-preview, share-out-execute]
        description: "Cycle-end distribution workflow"

      - tag: sync-offline
        screens: [sync-status]
        description: "Offline queue management and sync status"

      - tag: settings
        screens: [settings, settings-logout-dialog]
        description: "App preferences, security, language"

      - tag: field-officer
        screens: [field-officer-dashboard, admin-dashboard]
        description: "Staff-facing administrative screens"

      - tag: personal-banking
        screens: [personal-dashboard, personal-savings, personal-loans]
        description: "End-user self-service screens"

  role:
    description: "Which user role(s) can access this screen"
    values:
      - tag: role_admin
        description: "Field officer, treasurer, chairperson, secretary"

      - tag: role_end_user
        description: "Group member self-service"

      - tag: role_chairperson
        description: "Chairperson-only actions (share-out execute, loan approval)"

      - tag: role_treasurer
        description: "Treasurer-only actions (corpus management, payment posting)"

      - tag: role_all
        description: "All authenticated users"

  flow:
    description: "Named user flows this screen participates in"
    values:
      - tag: flow_onboarding
        description: "New user registration + group join"

      - tag: flow_weekly_meeting
        description: "Full weekly meeting cycle: open → conduct → close → summary"

      - tag: flow_loan_request
        description: "Member loan application → vote → approval → disbursement"

      - tag: flow_share_out
        description: "Cycle-end share-out: preview → confirm → execute → done"

      - tag: flow_sync_recovery
        description: "Offline sync queue review and retry"

      - tag: flow_settings_security
        description: "PIN change, biometric, logout"

  priority:
    description: "Implementation priority tier for gap planning"
    values:
      - tag: p0_critical
        description: "Must ship in MVP — blocks all users if missing"

      - tag: p1_important
        description: "Ships in cycle 1 release — high user value"

      - tag: p2_nice_to_have
        description: "Can defer to cycle 2 — improvement, not blocker"

  offline_support:
    description: "Offline capability level of this screen"
    values:
      - tag: offline_full
        description: "Fully functional offline — reads from and writes to local cache"

      - tag: offline_read_only
        description: "Can display cached data offline but cannot submit"

      - tag: offline_queue
        description: "Queues operations to SyncQueue when offline"

      - tag: offline_none
        description: "Requires network — shows error when offline"
