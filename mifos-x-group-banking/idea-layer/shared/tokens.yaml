# Token aliases — mifos-x-group-banking (CommonPurse)
# References design-tokens.yaml values — do not duplicate hex values here.
# Import this file in screens/components to use semantic aliases.

version: "1.0.0"
source_ref: "idea-layer/design-tokens.yaml"

color:
  # Brand primaries
  primary:
    alias: color_palette.light.primary
    value_ref: "#2E7D32"
    role: "Main brand color — VSLA green. Buttons, active tabs, progress bars."
    wcag: "5.83:1 AAA on white"

  on_primary:
    alias: color_palette.light.on_primary
    value_ref: "#FFFFFF"
    role: "Text/icons on primary-colored surfaces"

  primary_container:
    alias: color_palette.light.primary_container
    value_ref: "#A6F1A6"
    role: "Light green container — cycle progress card, chips"

  on_primary_container:
    alias: color_palette.light.on_primary_container
    value_ref: "#002106"
    role: "Text on primary container"

  secondary:
    alias: color_palette.light.secondary
    value_ref: "#FF8F00"
    role: "Warm amber — harvest/shared coin accent. Secondary actions, individual savings charts."

  on_secondary:
    alias: color_palette.light.on_secondary
    value_ref: "#FFFFFF"
    role: "Text/icons on secondary-colored surfaces"

  secondary_container:
    alias: color_palette.light.secondary_container
    value_ref: "#FFDDB3"
    role: "Light amber container — individual savings rows"

  on_secondary_container:
    alias: color_palette.light.on_secondary_container
    value_ref: "#2A1700"
    role: "Text on secondary container"

  tertiary:
    alias: color_palette.light.tertiary
    value_ref: "#1565C0"
    role: "Trust blue — informational chips, links, data table highlights"

  on_tertiary:
    alias: color_palette.light.on_tertiary
    value_ref: "#FFFFFF"
    role: "Text/icons on tertiary-colored surfaces"

  tertiary_container:
    alias: color_palette.light.tertiary_container
    value_ref: "#D2E4FF"
    role: "Light blue container — formula chips, conflict indicators"

  on_tertiary_container:
    alias: color_palette.light.on_tertiary_container
    value_ref: "#001C39"
    role: "Text on tertiary container"

  surface:
    alias: color_palette.light.surface
    value_ref: "#FAFAFA"
    role: "Default screen/card background"

  on_surface:
    alias: color_palette.light.on_surface
    value_ref: "#1A1C19"
    role: "Primary text on surface"

  surface_variant:
    alias: color_palette.light.surface_variant
    value_ref: "#DEE5DA"
    role: "Dividers, inactive tabs, sync band background"

  on_surface_variant:
    alias: color_palette.light.on_surface_variant
    value_ref: "#424942"
    role: "Secondary text, supporting text, trailing metadata"

  error:
    alias: color_palette.light.error
    value_ref: "#D32F2F"
    role: "Destructive actions, error states, logout button border"

  on_error:
    alias: color_palette.light.on_error
    value_ref: "#FFFFFF"
    role: "Text on error-colored backgrounds"

  error_container:
    alias: color_palette.light.error_container
    value_ref: "#FFDAD6"
    role: "Failed operations section background"

  on_error_container:
    alias: color_palette.light.on_error_container
    value_ref: "#410002"
    role: "Text on error container"

typography:
  body:
    large:
      alias: typography.body_large
      font_size: 16sp
      line_height: 24sp
      role: "Primary list item text, main content"
    medium:
      alias: typography.body_medium
      font_size: 14sp
      line_height: 20sp
      role: "Supporting description text, card body"
    small:
      alias: typography.body_small
      font_size: 12sp
      line_height: 16sp
      role: "Metadata, timestamps, disclaimers"

  title:
    large:
      alias: typography.title_large
      font_size: 22sp
      line_height: 28sp
      role: "Dialog titles, screen hero text"
    medium:
      alias: typography.title_medium
      font_size: 16sp
      line_height: 24sp
      role: "Section headers, card titles"
    small:
      alias: typography.title_small
      font_size: 14sp
      line_height: 20sp
      role: "Card sub-titles, list group headers"

  label:
    large:
      alias: typography.label_large
      font_size: 14sp
      line_height: 20sp
      font_weight: 500
      role: "Section category headers, prominent chip labels"
    medium:
      alias: typography.label_medium
      font_size: 12sp
      line_height: 16sp
      role: "Trailing value labels, secondary KPIs"
    small:
      alias: typography.label_small
      font_size: 11sp
      line_height: 16sp
      role: "Sync timestamps, sub-labels, app version"

  headline:
    small:
      alias: typography.headline_small
      font_size: 24sp
      line_height: 32sp
      role: "Hero KPI numbers (corpus balance, total pool)"
    medium:
      alias: typography.headline_medium
      font_size: 28sp
      line_height: 36sp
      role: "Large balance displays"

spacing:
  xs:
    value: 4dp
    role: "Icon-to-text gap, tight padding"
  sm:
    value: 8dp
    role: "Chip internal padding, small gaps"
  md:
    value: 16dp
    role: "Standard card padding, screen horizontal margin"
  lg:
    value: 24dp
    role: "Section vertical spacing, card-to-card gap"
  xl:
    value: 32dp
    role: "Hero section top padding, large screen breathing room"
