# Shared error vocabulary — mifos-x-group-banking
version: "1.0.0"

fineract_api_errors:
  - code: "401"
    key: error_auth_required
    message_en: "Session expired. Please log in again."
    behavior: navigate_to_login

  - code: "403"
    key: error_forbidden
    message_en: "You don't have permission to perform this action."
    behavior: show_dialog

  - code: "404"
    key: error_not_found
    message_en: "The requested record was not found."
    behavior: show_snackbar

  - code: "503"
    key: error_server_unavailable
    message_en: "Server unavailable. Working offline."
    behavior: fallback_cache

  - code: "network.offline"
    key: error_offline
    message_en: "No internet connection. Using cached data."
    behavior: fallback_cache

domain_errors:
  - code: "loan.ceiling_exceeded"
    key: error_loan_ceiling
    message_en: "This loan exceeds your group-approved ceiling."
    behavior: show_dialog

  - code: "meeting.already_recorded"
    key: error_meeting_recorded
    message_en: "This meeting has already been recorded."
    behavior: show_snackbar

  - code: "savings.insufficient"
    key: error_savings_insufficient
    message_en: "Insufficient savings balance for this operation."
    behavior: show_dialog

  - code: "sync.conflict"
    key: error_sync_conflict
    message_en: "Data conflict detected during sync. Please review."
    behavior: show_dialog

  - code: "share_out.confirmation_required"
    key: error_confirmation_required
    message_en: "Please type \"SHARE OUT\" or use biometric to confirm this irreversible action."
    behavior: show_inline_error

  - code: "share_out.already_executed"
    key: error_share_out_executed
    message_en: "Share-out for this cycle has already been executed."
    behavior: show_dialog

  - code: "pin.mismatch"
    key: error_pin_mismatch
    message_en: "Current PIN is incorrect. Please try again."
    behavior: show_inline_error

  - code: "biometric.unavailable"
    key: error_biometric_unavailable
    message_en: "Biometric authentication is not available on this device."
    behavior: show_snackbar

  - code: "local.db_read_failed"
    key: error_db_read
    message_en: "Could not read local data. Please restart the app."
    behavior: show_error_state

  - code: "local.write_failed"
    key: error_local_write
    message_en: "Failed to save settings locally. Please try again."
    behavior: show_snackbar
