schema_version: "3.1"

id: personal-loans
name: Personal Loans
description: >
  End user's loan list screen. Shows all loans (active, pending, closed) with
  repayment schedule, overdue indicators. FAB to request a new loan. Covers FR-016.
feature: end-user-dashboard
flow: end-user-dashboard-flow
version: "1.0.0"
tags: [loans, end_user, repayment, self-service, FR-016]

status: enriched
quality_score: 88
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: claude-product-cycle

entry_point: false
bottom_nav: true
navigates_to:
  - target: loan-request
    condition: user_taps_fab or user_taps_request_loan_empty
  - target: personal-dashboard
    condition: user_taps_back
route: /loans
entry_points:
  - source: personal-dashboard
    condition: user_taps_loan_card
nav_params:
  clientId: { type: Long, required: true }

screens:
  - id: personal_loans_screen
    name: PersonalLoansScreen
    composable: PersonalLoansScreen
    description: Loan list with status chips, repayment cards, and FAB
    layout: Scaffold (top-bar + LazyColumn + FAB)

state_model:
  PersonalLoansViewModel:
    state:
      name: PersonalLoansState
      fields:
        clientId: { type: Long, default: "0L" }
        loans: { type: "List<LoanDto>", default: "emptyList()" }
        selectedLoanId: { type: "Long?", default: "null" }
        filterStatus: { type: LoanStatusFilter, default: "LoanStatusFilter.ALL" }
        isLoading: { type: Boolean, default: "true" }
        isRefreshing: { type: Boolean, default: "false" }
        error: { type: "LoanError?", default: "null" }
    screen_state:
      name: PersonalLoansScreenState
      members: [Loading, Content, Empty, Error]
    errors:
      name: LoanError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Unauthorized, retry: false, message_key: error_session_expired }
    events:
      name: PersonalLoansEvent
      members:
        - { name: NavigateToLoanRequest }
        - { name: NavigateBack }
    actions:
      name: PersonalLoansAction
      members:
        - { name: OnRefresh, trigger: "Pull-to-refresh" }
        - { name: OnRetry, trigger: "Tap Retry button" }
        - { name: OnLoanExpand, params: { loanId: Long }, trigger: "Tap loan card to expand repayment schedule" }
        - { name: OnFilterChange, params: { status: LoanStatusFilter }, trigger: "Tap status filter chip" }
        - { name: OnRequestLoanClick, trigger: "Tap FAB or empty state CTA" }
    di:
      - LoanRepository
      - SessionManager

flow_logic:
  - decision: loans_available
    branches:
      - condition: "loans.isNotEmpty()"
        action: show loan list with FAB
      - condition: "loans.isEmpty() && !isLoading"
        action: show empty state with CTA to request loan
  - decision: loan_filter
    branches:
      - condition: filterStatus == ALL
        action: show all loans sorted by date desc
      - condition: filterStatus == ACTIVE
        action: show only loans with status active/disbursed
      - condition: filterStatus == CLOSED
        action: show only completed/closed loans
  - decision: overdue_check
    branches:
      - condition: "loan.isOverdue == true"
        action: show overdue badge and highlight due amount in error color

dependencies:
  tier: ui
  features: [end-user-dashboard]
  services:
    - LoanRepository
    - SessionManager
    - OfflineCacheManager
  shared_entities:
    - Loan

api:
  - id: get_self_loans
    function: get_self_loans
    method: get
    endpoint: "/self/loans"
    description: Get all loans for the authenticated self-service client
    params:
      associations: { type: String, required: false, default: "repaymentSchedule", source: query_param }
    response:
      type: array
      items:
        id: Long
        accountNo: String
        productName: String
        loanProductId: Long
        status:
          id: Int
          code: String
          value: String
          active: Boolean
          closed: Boolean
        principal: Double
        interestRatePerPeriod: Double
        termFrequency: Int
        termPeriodFrequencyType:
          id: Int
          value: String
        repaymentSchedule:
          totalPrincipalExpected: Double
          totalInterestCharged: Double
          totalRepaymentExpected: Double
          periods:
            - period: Int
              dueDate: "List<Int>"
              principalDue: Double
              interestDue: Double
              totalDueForPeriod: Double
              totalPaidForPeriod: Double
              obligationsMetOnDate: "List<Int>?"
              complete: Boolean
        summary:
          principalDisbursed: Double
          principalPaid: Double
          principalOutstanding: Double
          interestCharged: Double
          interestPaid: Double
          interestOutstanding: Double
          totalExpectedRepayment: Double
          totalRepayment: Double
          totalOutstanding: Double
    errors:
      401: Session expired
      503: Server unavailable
    cache: { ttl: 180, strategy: stale-while-revalidate, offline: use_sqldelight }

dtos:
  - name: LoanDto
    fields:
      id: Long
      accountNo: String
      productName: String
      loanProductId: Long
      status: LoanStatusDto
      principal: Double
      interestRatePerPeriod: Double
      termFrequency: Int
      repaymentSchedule: RepaymentScheduleDto
      summary: LoanSummaryDto
      isOverdue: Boolean

  - name: LoanStatusDto
    fields:
      id: Int
      code: String
      value: String
      active: Boolean
      closed: Boolean

  - name: RepaymentScheduleDto
    fields:
      totalPrincipalExpected: Double
      totalInterestCharged: Double
      totalRepaymentExpected: Double
      periods: "List<RepaymentPeriodDto>"

  - name: RepaymentPeriodDto
    fields:
      period: Int
      dueDate: "List<Int>"
      principalDue: Double
      interestDue: Double
      totalDueForPeriod: Double
      totalPaidForPeriod: Double
      complete: Boolean

  - name: LoanSummaryDto
    fields:
      principalDisbursed: Double
      principalOutstanding: Double
      totalOutstanding: Double
      totalRepayment: Double

components:
  - id: top_bar
    type: top-bar
    name: LoansTopBar
    description: Top bar with back navigation and screen title
    style:
      background: primary
      elevation: 0dp
    navigation_icon:
      name: FluentIcons.arrow_left_24_regular
      tint: onPrimary
    title:
      text_key: i18n.screen_title
      text_style: titleLarge
      color: onPrimary
    a11y:
      content_description: "My Loans — back to dashboard"
    test_context:
      purpose: Back navigation to personal-dashboard
      interaction_type: tap
      data_driven: false
      required_fields: []
    on_click:
      action: NavigateBack
      target: personal-dashboard

  - id: filter_chips_row
    type: chip
    name: LoanStatusFilterChips
    description: Filter row — All / Active / Closed
    style:
      scroll_horizontal: true
      selected_background: primary
      selected_text_color: onPrimary
      unselected_background: surface
      unselected_text_color: onSurface
      border_color: outline
      cornerRadius: full
      padding: "6dp 14dp"
      margin_horizontal: 16dp
      margin_vertical: 8dp
      chip_spacing: 8dp
    chips:
      - label_key: i18n.filter_all
        value: ALL
      - label_key: i18n.filter_active
        value: ACTIVE
      - label_key: i18n.filter_closed
        value: CLOSED
    a11y:
      content_description: "Filter loans by status"
    test_context:
      purpose: Filter chips update displayed loan list; selected chip shows correct style
      interaction_type: tap
      data_driven: true
      required_fields: [filterStatus, loans]
    on_click:
      action: OnFilterChange
      target: state.filterStatus

  - id: loan_card
    type: card
    name: LoanCard
    description: >
      Expandable loan card. Collapsed: product name, status chip, outstanding balance.
      Expanded: full repayment schedule with per-period rows.
    style:
      background: surface
      cornerRadius: lg
      elevation: 2dp
      padding: 16dp
      margin_horizontal: 16dp
      margin_bottom: 12dp
    header_row:
      product_name:
        text_style: titleMedium
        color: onSurface
        weight: semibold
      account_number:
        text_style: labelSmall
        color: onSurfaceVariant
      status_chip:
        active:
          background: primaryContainer
          text_color: onPrimaryContainer
          text: "Active"
        pending_approval:
          background: secondaryContainer
          text_color: onSecondaryContainer
          text: "Pending"
        closed:
          background: surfaceVariant
          text_color: onSurfaceVariant
          text: "Closed"
        overdue:
          background: errorContainer
          text_color: onErrorContainer
          text: "Overdue"
    balance_row:
      outstanding_label:
        text_key: i18n.outstanding_label
        text_style: labelMedium
        color: onSurfaceVariant
      outstanding_amount:
        text: "KES 15,000"
        text_style: headlineSmall
        color: onSurface
        weight: bold
    next_repayment_row:
      visible_when: "loan.status.active == true"
      label_key: i18n.next_repayment_label
      amount: "KES 1,500"
      due_date: "15 May 2026"
      overdue_icon:
        visible_when: "loan.isOverdue == true"
        name: FluentIcons.warning_24_filled
        tint: error
      amount_color:
        normal: onSurface
        overdue: error
    expand_icon:
      collapsed: FluentIcons.chevron_down_24_regular
      expanded: FluentIcons.chevron_up_24_regular
      tint: onSurfaceVariant
    repayment_schedule_section:
      visible_when: "selectedLoanId == loan.id"
      header:
        text_key: i18n.repayment_schedule_label
        text_style: labelLarge
        color: onSurfaceVariant
        margin_top: 12dp
        divider_above: true
      period_row:
        period_number: "#1"
        due_date: "15 Apr 2026"
        amount: "KES 1,500"
        status_icon:
          paid: FluentIcons.checkmark_circle_24_filled
          paid_tint: primary
          pending: FluentIcons.circle_24_regular
          pending_tint: onSurfaceVariant
          overdue: FluentIcons.dismiss_circle_24_filled
          overdue_tint: error
    a11y:
      content_description: "Loan {productName} — outstanding KES {outstanding}. Tap to expand repayment schedule."
      role: button
      min_touch_target: 48dp
    test_context:
      purpose: Card expands/collapses on tap; overdue periods highlighted; status chip correct
      interaction_type: tap
      data_driven: true
      required_fields: [loans]
    on_click:
      action: OnLoanExpand
      target: state.selectedLoanId

  - id: request_loan_fab
    type: fab
    name: RequestLoanFab
    description: FAB to navigate to loan-request form. Visible when loans list is non-empty.
    style:
      background: secondary
      icon: FluentIcons.add_24_filled
      text_key: i18n.request_loan_fab
      tint: onSecondary
      extended: true
      cornerRadius: full
      min_touch_target: 56dp
      visible_when: "loans.isNotEmpty()"
    a11y:
      content_description: "Request a new loan"
      role: button
      min_touch_target: 56dp
    test_context:
      purpose: FAB navigates to loan-request; visible when loans list non-empty
      interaction_type: tap
      data_driven: true
      required_fields: []
    on_click:
      action: OnRequestLoanClick
      target: loan-request

  - id: empty_state
    type: empty-state
    name: LoansEmptyState
    description: Empty state when member has no loans
    style:
      visible_when: "loans.isEmpty() && !isLoading && error == null"
      icon: FluentIcons.money_24_regular
      icon_size: 64dp
      icon_tint: onSurfaceVariant
      title_key: i18n.empty_title
      subtitle_key: i18n.empty_subtitle
      button_text_key: i18n.request_loan_button
      button_background: primary
      button_text_color: onPrimary
    a11y:
      content_description: "No loans yet. Tap to request a loan."
      role: button
      min_touch_target: 48dp
    test_context:
      purpose: Empty state shown when no loans; CTA tapped navigates to loan-request
      interaction_type: tap
      data_driven: true
      required_fields: [loans]
    on_click:
      action: OnRequestLoanClick
      target: loan-request

  - id: shimmer_loading
    type: shimmer
    name: LoansShimmer
    description: Skeleton cards during data fetch
    style:
      visible_when: isLoading == true
      card_count: 3
      card_height: 120dp
      cornerRadius: lg
      margin_horizontal: 16dp
      margin_bottom: 12dp
    a11y:
      content_description: "Loading loans"
    test_context:
      purpose: Shimmer shown during fetch; replaced by list on success
      interaction_type: non_interactive
      data_driven: false
      required_fields: []
    on_click: {}

  - id: error_state
    type: empty-state
    name: LoansErrorState
    description: Error state with retry
    style:
      visible_when: "error != null && !isLoading"
      icon: FluentIcons.wifi_off_24_filled
      icon_size: 64dp
      icon_tint: onSurfaceVariant
      title_key: i18n.error_title
      subtitle_key: i18n.error_subtitle
      button_text_key: i18n.retry_button
    a11y:
      content_description: "Could not load loans. Tap retry."
      role: button
      min_touch_target: 48dp
    test_context:
      purpose: Error state shown on failure; retry re-fetches
      interaction_type: tap
      data_driven: true
      required_fields: [error]
    on_click:
      action: OnRetry
      target: api.get_self_loans

states:
  initial_state: loading
  loading:
    description: Fetching loans
    components_visible: [top_bar, filter_chips_row, shimmer_loading]
  content:
    description: Loans listed with filter and FAB
    components_visible: [top_bar, filter_chips_row, loan_card, request_loan_fab]
  empty:
    description: No loans — empty state with CTA
    components_visible: [top_bar, empty_state]
  error:
    description: Load failure
    components_visible: [top_bar, filter_chips_row, error_state]

i18n:
  screen_title: "My Loans"
  filter_all: "All"
  filter_active: "Active"
  filter_closed: "Closed"
  outstanding_label: "Outstanding"
  next_repayment_label: "Next repayment"
  repayment_schedule_label: "Repayment Schedule"
  request_loan_fab: "Request Loan"
  request_loan_button: "Request a Loan"
  empty_title: "No loans yet"
  empty_subtitle: "Apply for a loan of up to 3× your savings balance."
  error_title: "Could not load loans"
  error_subtitle: "Check your internet connection and try again."
  retry_button: "Try Again"

analytics:
  screen_viewed:
    event: screen_viewed
    params:
      screen_id: personal-loans
      flow: end-user-dashboard-flow
  events:
    - name: loan_expanded
      trigger: user taps loan card to expand
      params:
        loan_id: Long
        status: String
    - name: filter_changed
      trigger: user taps filter chip
      params:
        filter: "{ ALL | ACTIVE | CLOSED }"
    - name: request_loan_tapped
      trigger: user taps FAB or empty state CTA
      params:
        source: "{ fab | empty_state }"
