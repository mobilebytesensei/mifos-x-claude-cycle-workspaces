sibling: api
schema_version: "4.0"
feature_id: loan-list

api:
  - id: get_group_loans
    function: get_group_loans
    method: get
    endpoint: "/groups/{groupId}/loans"
    description: Fetch paginated loan list for the selected group
    params:
      groupId: { type: Long, required: true, source: nav_params }
      limit: { type: Int, default: 20 }
      offset: { type: Int, default: 0 }
      loanStatus: { type: String, required: false, description: "active|overdue|closed|all" }
    response:
      type: object
      fields:
        totalFilteredRecords: Int
        pageItems:
          type: array
          items:
            id: Long
            clientId: Long
            clientName: String
            loanProductName: String
            principal: { type: Double, currency: KES }
            summary:
              principalOutstanding: Double
              totalOverdue: Double
            status: { id: Int, value: String }
            timeline:
              expectedDisbursementDate: List<Int>
              actualDisbursementDate: List<Int>
            nextRepaymentDate: List<Int>
    errors:
      401: Unauthorized — redirect to login
      403: Forbidden — insufficient permissions
      404: Group not found
      500: Server error — show retry
    cache:
      ttl: 180
      strategy: stale-while-revalidate
      offline: show_cached
    pagination:
      type: offset
      page_size: 20

dtos:
  LoanSummary:
    id: Long
    memberId: Long
    memberName: String
    memberPhotoUrl: "String?"
    loanProductName: String
    principalAmount: { type: Double, currency: KES }
    outstandingBalance: { type: Double, currency: KES }
    overdueAmount: { type: Double, currency: KES }
    status: LoanStatus
    nextRepaymentDate: "String?"
    isOverdue: Boolean
    fineractLoanId: Long

  LoanStatus:
    values: [ACTIVE, OVERDUE, CLOSED, PENDING, REJECTED]

  LoanStatusFilter:
    values: [ALL, ACTIVE, OVERDUE, CLOSED]

cache_strategy:
  ttl: 180
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: LoanRepository
      methods:
        - "getGroupLoans(groupId: Long, limit: Int, offset: Int): Flow<List<LoanSummary>>"
        - "getLoansByStatus(groupId: Long, status: LoanStatusFilter): Flow<List<LoanSummary>>"
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: loans
      schema: SQLDelight Loan entity
