requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: loan-list

route: /groups/{groupId}/loans
entry_points:
  - source: group-dashboard
    label: Loans
    params: { groupId: Long, viewerRole: String }   # viewerRole forwarded from group-dashboard's nav_params (dt_member_role)
  - source: bottom_nav
    condition: group_selected
nav_params:
  groupId: { type: Long, required: true }
  viewerRole: { type: String, required: true }    # ORGANIZER | MEMBER | TREASURER | CHAIRPERSON — forwarded from group-dashboard; drives canApplyLoan gate

screens:
  - id: loan-list-screen
    title: "{strings.screen_title}"
    type: list
    description: Filterable, paginated list of loans with FAB for new application

state_model:
  LoanListViewModel:
    state:
      name: LoanListState
      fields:
        isLoading: { type: Boolean, default: "true" }
        loans: { type: "List<LoanSummary>", default: "emptyList()" }
        selectedFilter: { type: LoanStatusFilter, default: "LoanStatusFilter.ALL" }
        filteredLoans: { type: "List<LoanSummary>", default: "emptyList()" }
        isRefreshing: { type: Boolean, default: "false" }
        error: { type: "LoanListError?", default: "null" }
        groupId: { type: Long, default: "0L" }
        canApplyLoan: { type: Boolean, default: "false" }   # derived from viewerRole nav_param: true for CHAIRPERSON | TREASURER, false for MEMBER
    screen_state:
      name: LoanListScreenState
      members: [Loading, Content, Error, Empty]
    errors:
      name: LoanListError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: LoanListEvent
      members:
        - { name: NavigateToLoanDetail, params: { loanId: Long } }
        - { name: NavigateToLoanApply, params: { groupId: Long } }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: LoanListAction
      members:
        - { name: OnLoanClick, params: { loanId: Long }, trigger: "Tap loan card" }
        - { name: OnFilterChange, params: { filter: LoanStatusFilter }, trigger: "Tap filter chip" }
        - { name: OnApplyLoan, trigger: "Tap FAB" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
        - { name: Retry, trigger: "Tap retry button on error state" }
        - { name: OnLoadNextPage, trigger: "Scroll to list end" }
    di:
      - LoanRepository
      - NetworkMonitor
      - SessionManager

business_logic:
  kind: crud
  description: "Read-list group loans offline-first: a Store5 stream sources loans from the SQLDelight loans cache first, then background-refreshes paginated pages from the Fineract companion API; cmp-network-monitor gates the refresh so offline shows cached rows. Status-filter chips and next-page loads transform the in-memory list without a network call."
  library_refs:
    - cmp-network-monitor
  external_library_refs:
    - SQLDelight
    - Store5
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_bar
    type: top-bar
    title: "{strings.screen_title}"
    accessibility_label: "Group Loans top bar with back navigation"
    style:
      background: primary
      text_color: onPrimary
    navigation_icon: arrow_back
    on_nav_click:
      action: OnBack
      action_contract:
        effect: navigate
        description: "Pops the loan-list destination off the NavController back stack, returning to the group-dashboard entry point; no state is persisted and no network call is made."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: filter_chips_row
    type: chip-group
    i18n: skip
    accessibility_label: "Loan status filter chips"
    style:
      scroll: horizontal
      padding: "8dp 16dp"
    chips:
      - id: chip_all
        label: "All"
        i18n: skip
        accessibility_label: "Show all loans"
        selected_color: primaryContainer
        on_click:
          action: OnFilterChange
          params: { filter: ALL }
          state: selectedFilter
          action_contract:
            effect: transform_state
            external_library_refs: [Store5]
            description: "Sets selectedFilter to ALL and recomputes filteredLoans from the Store5-backed in-memory loans list; pure client-side transform, no Fineract network call."
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: chip_active
        label: "Active"
        i18n: skip
        accessibility_label: "Show active loans"
        selected_color: primaryContainer
        on_click:
          action: OnFilterChange
          params: { filter: ACTIVE }
          state: selectedFilter
          action_contract:
            effect: transform_state
            external_library_refs: [Store5]
            description: "Sets selectedFilter to ACTIVE and recomputes filteredLoans by filtering the Store5-backed in-memory loans to status ACTIVE; pure client-side transform, no network call."
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: chip_overdue
        label: "Overdue"
        i18n: skip
        accessibility_label: "Show overdue loans"
        selected_color: errorContainer
        on_click:
          action: OnFilterChange
          params: { filter: OVERDUE }
          state: selectedFilter
          action_contract:
            effect: transform_state
            external_library_refs: [Store5]
            description: "Sets selectedFilter to OVERDUE and recomputes filteredLoans by filtering the Store5-backed in-memory loans to overdue accounts; pure client-side transform, no network call."
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: chip_closed
        label: "Closed"
        i18n: skip
        accessibility_label: "Show closed loans"
        selected_color: surfaceVariant
        on_click:
          action: OnFilterChange
          params: { filter: CLOSED }
          state: selectedFilter
          action_contract:
            effect: transform_state
            external_library_refs: [Store5]
            description: "Sets selectedFilter to CLOSED and recomputes filteredLoans by filtering the Store5-backed in-memory loans to closed accounts; pure client-side transform, no network call."
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: loan_card
    type: card
    i18n: skip
    accessibility_label: "Loan card, tap to view loan details"
    style:
      background: surface
      elevation: 2dp
      corner_radius: 12dp
      padding: 16dp
      min_touch_target: 72dp
    content:
      - id: member_avatar
        type: avatar
        i18n: skip
        accessibility_label: "Member photo"
        size: 40dp
        src: "{{loan.memberPhotoUrl}}"
        fallback_icon: person
      - id: member_name_text
        type: text
        i18n: skip
        style: { text_style: titleMedium, color: onSurface }
        value: "{{loan.memberName}}"
      - id: loan_amount_text
        type: text
        i18n: skip
        style: { text_style: bodyMedium, color: onSurfaceVariant }
        value: "KES {{loan.principalAmount | number}}"
      - id: outstanding_text
        type: text
        i18n: skip
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "Outstanding: KES {{loan.outstandingBalance | number}}"
      - id: status_badge
        type: badge
        i18n: skip
        style:
          ACTIVE: { background: "#C8E6C9", text_color: "#1B5E20" }
          OVERDUE: { background: "#FFCDD2", text_color: "#B71C1C" }
          CLOSED: { background: "#F5F5F5", text_color: "#757575" }
          PENDING: { background: "#FFF9C4", text_color: "#E65100" }
        value: "{{loan.status}}"
      - id: next_repayment_text
        type: text
        i18n: skip
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "Next: {{loan.nextRepaymentDate}}"
        visible_when: "loan.status == ACTIVE"
      - id: overdue_indicator
        type: text
        i18n: skip
        style: { text_style: labelSmall, color: error, font_weight: bold }
        value: "OVERDUE — KES {{loan.overdueAmount | number}}"
        visible_when: "loan.isOverdue"
    on_click:
      action: OnLoanClick
      params: { loanId: "{{loan.id}}" }
      target: loan-detail
      action_contract:
        effect: navigate
        description: "Navigates via NavController to the loan-detail destination, passing the tapped loanId as a route argument so the detail screen can load that loan account's repayment schedule."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: apply_loan_fab
    type: fab
    icon: add
    label: "{strings.apply_loan_fab}"
    accessibility_label: "Apply for a new group loan"
    style:
      background: primary
      icon_color: onPrimary
      min_touch_target: 56dp
      position: bottom_end
    visible_when: "canApplyLoan"
    on_click:
      action: OnApplyLoan
      target: loan-apply
      action_contract:
        effect: navigate
        description: "Navigates via NavController to the loan-apply destination, passing the current groupId so an authorized chairperson or treasurer can start a new group loan application."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: shimmer_list
    type: shimmer
    i18n: skip
    accessibility_label: "Loading loans placeholder"
    count: 5
    style: { height: 96dp, corner_radius: 12dp, background: surfaceVariant }

  - id: empty_state
    type: empty-state
    i18n: skip
    accessibility_label: "No loans available for the selected filter"
    icon: account_balance_wallet
    title: "{strings.loans_empty_title}"
    body: "No loans match the selected filter."

  - id: error_state
    type: error-state
    i18n: skip
    accessibility_label: "Loan list failed to load, tap retry"
    icon: cloud_off
    title: "{strings.loans_error_title}"
    body: "{{error.message}}"
    cta_label: "Retry"
    on_click:
      action: Retry
      state: reload
      action_contract:
        effect: call_api
        external_library_refs: [Store5]
        description: "Re-triggers the Store5 stream with fresh=true to re-call get_group_loans on the Fineract companion API and reload the loan list after a network or server error."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: loading
  loading:
    components: [top_bar, filter_chips_row, shimmer_list]
    description: "Fetching loans from local cache then Fineract API"
  content:
    components: [top_bar, filter_chips_row, loan_card, apply_loan_fab]
    description: "Loans loaded; FAB visible only for chairperson/treasurer"
    demo_data:
      loans:
        - memberName: "Peter Otieno"
          memberPhotoUrl: null
          principalAmount: 1500
          outstandingBalance: 1125
          overdueAmount: 0
          status: ACTIVE
          nextRepaymentDate: "2026-05-12"
          isOverdue: false
        - memberName: "Grace Wanjiku"
          principalAmount: 3000
          outstandingBalance: 2625
          overdueAmount: 375
          status: OVERDUE
          isOverdue: true
  empty:
    components: [top_bar, filter_chips_row, empty_state, apply_loan_fab]
    description: "No loans for selected filter"
  error:
    components: [top_bar, error_state]
    description: "API failed; error message with retry"

i18n:
  en:
    screen_title: "Group Loans"
    filter_all: "All"
    filter_active: "Active"
    filter_overdue: "Overdue"
    filter_closed: "Closed"
    loan_amount_label: "KES {{amount}}"
    outstanding_label: "Outstanding: KES {{amount}}"
    next_repayment_label: "Next: {{date}}"
    overdue_label: "OVERDUE — KES {{amount}}"
    fab_label: "Apply for Loan"
    empty_title: "No loans yet"
    empty_body: "No loans match the selected filter."
    error_network: "No internet connection. Showing cached data."
    error_server: "Server error. Please try again."
    error_auth: "Session expired. Please log in again."
  sw:
    screen_title: "Mikopo ya Kikundi"
    filter_all: "Yote"
    filter_active: "Inayoendelea"
    filter_overdue: "Iliyochelewa"
    filter_closed: "Iliyofungwa"
    fab_label: "Omba Mkopo"
    empty_title: "Hakuna mikopo bado"
  fr:
    screen_title: "Prêts du Groupe"
    fab_label: "Demander un Prêt"
    empty_title: "Aucun prêt"
  hi:
    screen_title: "समूह ऋण"
    fab_label: "ऋण के लिए आवेदन करें"
    empty_title: "कोई ऋण नहीं"
