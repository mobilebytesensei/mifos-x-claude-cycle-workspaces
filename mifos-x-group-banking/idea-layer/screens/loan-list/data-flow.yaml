sibling: data-flow
schema_version: "2.1.0"
feature_id: loan-list

entries:
  - screen_id: loanListScreen
    trigger: on_mount
    description: Load paginated group loans on screen entry
    endpoints:
      - { api_id: get_group_loans, transport: rest, method: get }
    dtos:
      - { name: LoanSummary, role: response, api_id: get_group_loans }
      - { name: LoanStatus, role: response, api_id: get_group_loans }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 180
      key_template: "loan_list:group:{groupId}:offset:{offset}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "403", behavior: show_error, message_key: error_insufficient_permissions }
      - { error_code: "404", behavior: show_empty, message_key: error_group_not_found }
      - { error_code: "500", behavior: show_error_with_retry, message_key: error_server }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_cached }

  - screen_id: loanListScreen
    trigger: on_refresh
    description: Pull-to-refresh — invalidate cache and reload loans
    endpoints:
      - { api_id: get_group_loans, transport: rest, method: get }
    dtos:
      - { name: LoanSummary, role: response, api_id: get_group_loans }
    produces_state: Content
    auth_required: true
    cache:
      strategy: network_first
      ttl_seconds: 180
      key_template: "loan_list:group:{groupId}:offset:0"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_cached }

  - screen_id: loanListScreen
    trigger: on_interact
    description: Status filter change — client-side filter, no network call
    endpoints: []
    dtos:
      - { name: LoanStatusFilter, role: request, api_id: get_group_loans }
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "loan_list:filter:{statusFilter}"
    error_paths: []

  - screen_id: loanListScreen
    trigger: on_interact
    description: Pagination — load next page of loans
    endpoints:
      - { api_id: get_group_loans, transport: rest, method: get }
    dtos:
      - { name: LoanSummary, role: response, api_id: get_group_loans }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 180
      key_template: "loan_list:group:{groupId}:offset:{offset}"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_cached }
