sibling: flow
schema_version: "4.0"
feature_id: loan-list

navigates_to:
  - loan-apply
  - loan-detail

flow_logic:
  on_load:
    - action: fetch_loans
      api: get_group_loans
      on_success: show_content
      on_empty: show_empty
      on_error: show_error
      offline: show_cached_data
  on_filter_change:
    - action: filter_loans_locally
      description: Client-side filter by status; no extra API call
  on_refresh:
    - action: fetch_loans
      api: get_group_loans
      invalidate_cache: true
  on_loan_click:
    - navigate: loan-detail
      params: { loanId: "{loan.id}" }
  on_apply_loan:
    - navigate: loan-apply
      params: { groupId: "{groupId}" }
  on_load_next_page:
    - action: fetch_loans
      api: get_group_loans
      pagination: increment_offset
