<!DOCTYPE html>

<head><meta charset="UTF-8"><title>loan-list · loading · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
.skeleton { background: var(--bg-muted); border-radius: var(--radius-md); position: relative; overflow: hidden; }
.skeleton::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shimmer 1.4s infinite; }
@keyframes shimmer { 100% { transform: translateX(100%); } }
.skel-card { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--border-subtle); min-height: 72px; }
.skel-card:last-child { border-bottom: none; }
.skel-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
.skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.skel-line { height: 12px; }
.skel-line.w70 { width: 70%; } .skel-line.w45 { width: 45%; }
.skel-badge { width: 56px; height: 22px; border-radius: var(--radius-sm); flex-shrink: 0; }
.skel-chip { width: 64px; height: 30px; border-radius: 9999px; flex-shrink: 0; }
</style></head>
