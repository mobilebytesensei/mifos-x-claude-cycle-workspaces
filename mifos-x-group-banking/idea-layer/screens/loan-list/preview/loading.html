<!doctype html>
<!-- render-hash: loading:loanlist-v2-loading -->
<html lang="en" data-feature="loan-list" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>loan-list · loading · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* loan-list loading — shimmer_list skeleton; semantic chrome from preview-style.css, only skeleton glue lives here */
  .skeleton { background: var(--bg-muted); border-radius: var(--radius-md); position: relative; overflow: hidden; }
  .skeleton::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shimmer 1.4s infinite; }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .skel-card { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--border-subtle); min-height: 96px; }
  .skel-card:last-child { border-bottom: none; }
  .skel-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .skel-line { height: 12px; }
  .skel-line.w60 { width: 60%; } .skel-line.w40 { width: 40%; } .skel-line.w75 { width: 75%; }
  .skel-badge { width: 60px; height: 22px; border-radius: var(--radius-sm); flex-shrink: 0; }
  .skel-chip { width: 64px; height: 30px; border-radius: 9999px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<!-- top_bar — primary fill, back arrow (OnBack → pop), sync badge -->
<header class="top-app-bar" data-component-type="top_bar" data-component-id="top_bar">
  <button class="back-btn" data-action="OnBack" aria-label="Back">‹</button>
  <h1>Group Loans</h1>
  <span class="sync-badge" aria-label="Syncing">⟳ syncing</span>
</header>
<main aria-busy="true" aria-label="Loading loans">
  <!-- filter_chips_row — skeleton placeholders (4 chips: All / Active / Overdue / Closed) -->
  <div class="chip-row" data-component-id="filter_chips_row">
    <span class="skeleton skel-chip"></span>
    <span class="skeleton skel-chip"></span>
    <span class="skeleton skel-chip"></span>
    <span class="skeleton skel-chip"></span>
  </div>

  <!-- shimmer_list — count: 5, height: 96dp -->
  <div class="list" data-component-id="shimmer_list">
    <div class="skel-card"><span class="skeleton skel-avatar"></span><div class="skel-lines"><span class="skeleton skel-line w60"></span><span class="skeleton skel-line w75"></span><span class="skeleton skel-line w40"></span></div><span class="skeleton skel-badge"></span></div>
    <div class="skel-card"><span class="skeleton skel-avatar"></span><div class="skel-lines"><span class="skeleton skel-line w60"></span><span class="skeleton skel-line w75"></span><span class="skeleton skel-line w40"></span></div><span class="skeleton skel-badge"></span></div>
    <div class="skel-card"><span class="skeleton skel-avatar"></span><div class="skel-lines"><span class="skeleton skel-line w60"></span><span class="skeleton skel-line w75"></span><span class="skeleton skel-line w40"></span></div><span class="skeleton skel-badge"></span></div>
    <div class="skel-card"><span class="skeleton skel-avatar"></span><div class="skel-lines"><span class="skeleton skel-line w60"></span><span class="skeleton skel-line w75"></span><span class="skeleton skel-line w40"></span></div><span class="skeleton skel-badge"></span></div>
    <div class="skel-card"><span class="skeleton skel-avatar"></span><div class="skel-lines"><span class="skeleton skel-line w60"></span><span class="skeleton skel-line w75"></span><span class="skeleton skel-line w40"></span></div><span class="skeleton skel-badge"></span></div>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
