<!doctype html>
<!-- render-hash: error:loanlist-v2-error -->
<html lang="en" data-feature="loan-list" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>loan-list · error · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<!-- top_bar — primary fill, back arrow (OnBack → pop), offline sync badge -->
<header class="top-app-bar" data-component-type="top_bar" data-component-id="top_bar">
  <button class="back-btn" data-action="OnBack" aria-label="Back">‹</button>
  <h1>Group Loans</h1>
  <span class="sync-badge offline" aria-label="Offline">⚠ offline</span>
</header>
<main>
  <!-- error_state — icon cloud_off, "Could not load loans"; Retry (call_api, re-triggers Store5 fresh load) -->
  <div class="empty-state" data-component-id="error_state">
    <div class="illus" aria-hidden="true">☁</div>
    <h2>Could not load loans</h2>
  </div>
  <div class="alert alert-danger" role="alert">
    <div>
      <h3>No internet connection</h3>
      <p>Showing cached data. Check your connection and try again.</p>
    </div>
  </div>
  <button class="btn btn-primary btn-full" data-action="Retry" aria-label="Retry loading loans">Retry</button>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
