<!doctype html>
<!-- render-hash: empty:loanlist-v2-empty -->
<html lang="en" data-feature="loan-list" data-state="empty" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>loan-list · empty · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<!-- top_bar — primary fill, back arrow (OnBack → pop) -->
<header class="top-app-bar" data-component-type="top_bar" data-component-id="top_bar">
  <button class="back-btn" data-action="OnBack" aria-label="Back">‹</button>
  <h1>Group Loans</h1>
</header>
<main>
  <!-- filter_chips_row — Overdue selected, no matches → empty; OnFilterChange transform_state via data-state-to -->
  <div class="chip-row" data-component-id="filter_chips_row">
    <button class="chip" data-state-to="content" data-component-id="chip_all">All</button>
    <button class="chip" data-state-to="content" data-component-id="chip_active">Active</button>
    <button class="chip selected" data-state-to="empty" data-component-id="chip_overdue">Overdue</button>
    <button class="chip" data-state-to="content" data-component-id="chip_closed">Closed</button>
  </div>

  <!-- empty_state — icon account_balance_wallet, "No loans yet" -->
  <div class="empty-state" data-component-id="empty_state">
    <div class="illus" aria-hidden="true">👛</div>
    <h2>No loans yet</h2>
    <p>No loans match the selected filter.</p>
  </div>
</main>
<!-- apply_loan_fab — extended FAB (FILLED green primary), OnApplyLoan → loan-apply nav -->
<button class="fab extended" style="background:var(--primary-700);" data-component-id="apply_loan_fab" data-nav-to="loan-apply" data-nav-params='{"groupId":"GRP-20260509-001"}' aria-label="Apply for Loan">＋ Apply for Loan</button>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
