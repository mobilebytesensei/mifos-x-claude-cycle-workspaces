<!DOCTYPE html>
<html lang="en" data-feature="loan-list" data-state="empty" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-list · empty · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar"><button class="back-btn" data-nav-to="group-dashboard">‹</button><h1>Group Loans</h1></header>
<main>
  <div class="chip-row">
    <button class="chip" data-state-to="content">All</button>
    <button class="chip" data-state-to="content">Active</button>
    <button class="chip selected" data-state-to="empty">Overdue</button>
    <button class="chip" data-state-to="content">Closed</button>
  </div>
  <div class="empty-state">
    <div class="illus" aria-hidden="true">💼</div>
    <h2>No loans yet</h2>
    <p>No loans match the selected filter.</p>
  </div>
</main>
<button class="fab" data-nav-to="loan-apply" aria-label="Apply for Loan">+</button>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
