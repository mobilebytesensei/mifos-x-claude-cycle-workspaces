id: loan-list
name: Loan List
description: >
  Paginated list of all loans in the selected savings group. Each card shows member name,
  loan amount, outstanding balance, status badge, next repayment date, and a red overdue
  indicator when applicable. Chairperson and treasurer may apply for a new loan via the FAB.
  Loads from local SQLDelight cache first; background-syncs from Fineract.
