sibling: tests
schema_version: "4.0"
feature_id: loan-list

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LLT-001
      scenario: "On mount, fetches group loans and renders content state"
      type: ViewModel
      priority: P0
      given: "groupId=10, network online"
      when: "screen mounts"
      then: "GET /groups/10/loans called; LoanSummary list populated; uiState=Content"

    - id: TC-LLT-002
      scenario: "OVERDUE status chip shown for Joseph's loan with overdueAmount > 0"
      type: Screen
      priority: P0
      given: "LoanSummary with overdueAmount=600.0, status=OVERDUE"
      when: "list renders"
      then: "OVERDUE chip visible; overdueAmount displayed in red; nextRepaymentDate shows missed date"

    - id: TC-LLT-003
      scenario: "Filter by ACTIVE status shows only active loans"
      type: ViewModel
      priority: P1
      given: "loans list contains ACTIVE, OVERDUE, CLOSED"
      when: "user selects ACTIVE filter"
      then: "client-side filter applied; only ACTIVE loans visible; no extra API call"

    - id: TC-LLT-004
      scenario: "Pull-to-refresh invalidates cache and refetches"
      type: ViewModel
      priority: P1
      given: "cached loan list present"
      when: "user triggers pull-to-refresh"
      then: "cache invalidated; GET /groups/{groupId}/loans called with offset=0; list updated"

    - id: TC-LLT-005
      scenario: "Tapping a loan card navigates to loan-detail with loanId"
      type: Screen
      priority: P0
      given: "LoanSummary rendered with id=5001"
      when: "user taps Amina's loan card"
      then: "navigate to loan-detail with loanId=5001"

    - id: TC-LLT-006
      scenario: "Empty state shown when group has no loans"
      type: Screen
      priority: P1
      given: "GET /groups/{groupId}/loans returns totalFilteredRecords=0"
      when: "screen renders"
      then: "empty state component visible; no loan cards; apply-loan CTA visible"

    - id: TC-LLT-007
      scenario: "Network error shows error state with retry button"
      type: ViewModel
      priority: P1
      given: "server returns 500"
      when: "on_mount fetch fails"
      then: "uiState=Error; retry button visible; cached data shown if available"

    - id: TC-LLT-008
      scenario: "Offline shows cached data with stale indicator"
      type: ViewModel
      priority: P1
      given: "network.offline, cached loans present"
      when: "screen mounts"
      then: "cached LoanSummary list rendered; offline banner shown"

    - id: TC-LLT-009
      scenario: "Pagination loads next 20 loans on scroll to bottom"
      type: ViewModel
      priority: P2
      given: "first page returned 20 items, totalFilteredRecords=35"
      when: "user scrolls to bottom"
      then: "GET /groups/{groupId}/loans called with offset=20; appended to list"

    - id: TC-LLT-010
      scenario: "LoanRepository.getGroupLoans emits list from local DB then refreshes"
      type: Repository
      priority: P0
      given: "local DB has 3 cached LoanSummary, network returns 5"
      when: "getGroupLoans() called"
      then: "Flow emits cached 3 first, then 5 after network response"

    - id: TC-LLT-011
      scenario: "401 redirects to login screen"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "server returns 401"
      then: "navigate to login; session cleared"
