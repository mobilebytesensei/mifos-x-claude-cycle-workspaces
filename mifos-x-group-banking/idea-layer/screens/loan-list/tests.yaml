sibling: tests
schema_version: "4.0"
feature_id: loan-list
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LL-001
      scenario: "On mount, loans load for groupId from LoanRepository with pagination"
      type: ViewModel
      priority: P0
      given: "groupId=1; network online"
      when: "LoanListScreen enters composition"
      then: "LoanRepository.getLoans(groupId=1, offset=0) called; first page loaded; LoanListScreenState=Content"

    - id: TC-LL-002
      scenario: "Filter ALL shows all loans; ACTIVE filter shows only active loans"
      type: ViewModel
      priority: P0
      given: "loans=[ACTIVE x3, COMPLETED x2, OVERDUE x1]"
      when: "OnFilterChange(LoanStatusFilter.ACTIVE)"
      then: "filteredLoans contains only 3 ACTIVE loans; selectedFilter=ACTIVE; no network call"

    - id: TC-LL-003
      scenario: "Tapping a loan card navigates to loan-detail with loanId"
      type: Screen
      priority: P0
      given: "Content state; loanId=10 card visible"
      when: "OnLoanClick(10) fires"
      then: "NavigateToLoanDetail emitted with loanId=10"

    - id: TC-LL-004
      scenario: "FAB navigates to loan-apply when canApplyLoan=true"
      type: Screen
      priority: P0
      given: "canApplyLoan=true; Content state"
      when: "OnApplyLoan fires"
      then: "NavigateToLoanApply emitted with groupId=1; FAB visible"

    - id: TC-LL-005
      scenario: "FAB hidden when canApplyLoan=false"
      type: Screen
      priority: P1
      given: "canApplyLoan=false"
      when: "LoanListScreen renders"
      then: "FAB not visible; OnApplyLoan cannot be triggered"

    - id: TC-LL-006
      scenario: "Scroll to end triggers OnLoadNextPage and appends next page"
      type: ViewModel
      priority: P1
      given: "hasNextPage=true; first page loaded with 20 loans"
      when: "OnLoadNextPage fires"
      then: "LoanRepository.getLoans called with offset=20; new loans appended to list; currentOffset=20"

    - id: TC-LL-007
      scenario: "Empty state shown when no loans exist for this group"
      type: Screen
      priority: P1
      given: "load succeeds with loans.isEmpty()"
      when: "Content evaluation runs"
      then: "LoanListScreenState=Empty; empty state message shown; FAB still visible if canApplyLoan=true"

    - id: TC-LL-008
      scenario: "Pull-to-refresh resets to page 0 and re-fetches loans"
      type: ViewModel
      priority: P1
      given: "Content state; user scrolled to page 3"
      when: "OnRefresh fires"
      then: "isRefreshing=true; LoanRepository.getLoans(offset=0) called; loans reset to first page; isRefreshing=false"

    - id: TC-LL-009
      scenario: "Network error shows error state with retry"
      type: Screen
      priority: P1
      given: "GET loans returns network error"
      when: "load completes"
      then: "LoanListScreenState=Error; retry CTA shown"

    - id: TC-LL-010
      scenario: "Auth 401 redirects to login"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "LoanRepository.getLoans returns 401"
      then: "LoanListError type=Auth redirect=login; navigation to login triggered"
