sibling: tests
schema_version: "4.0"
feature_id: loan-list

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LLT-001
      scenario: "On mount, the Store5 stream sources cached loans then background-refreshes and Content renders"
      type: ViewModel
      priority: P0
      given: "groupId=10; SQLDelight loans cache present; network online"
      when: "LoanListScreen enters composition"
      then: "Store5 stream emits cached loans first then refreshes get_group_loans from the Fineract companion API; filteredLoans populated; LoanListScreenState=Content"

    - id: TC-LLT-002
      scenario: "Loan card renders member name, principal, outstanding, status badge and next repayment"
      type: Screen
      priority: P0
      given: "loan Peter Otieno principal 1500, outstanding 1125, status ACTIVE, next 2026-05-12"
      when: "loan_card renders"
      then: "member_name_text='Peter Otieno'; loan_amount_text='KES 1,500'; outstanding_text='Outstanding: KES 1,125'; status_badge ACTIVE; next_repayment_text 'Next: 2026-05-12' visible"

    - id: TC-LLT-003
      scenario: "Status badge maps ACTIVE/OVERDUE/CLOSED/PENDING colors"
      type: Screen
      priority: P0
      given: "loans with status ACTIVE, OVERDUE, CLOSED, PENDING"
      when: "status_badge renders"
      then: "ACTIVE #C8E6C9/#1B5E20, OVERDUE #FFCDD2/#B71C1C, CLOSED #F5F5F5/#757575, PENDING #FFF9C4/#E65100"

    - id: TC-LLT-004
      scenario: "Overdue indicator shows on overdue loans with the overdue amount"
      type: Screen
      priority: P0
      given: "loan Grace Wanjiku status OVERDUE, isOverdue=true, overdueAmount=375"
      when: "loan_card renders"
      then: "overdue_indicator visible showing 'OVERDUE — KES 375' in error color; hidden when isOverdue=false"

    - id: TC-LLT-005
      scenario: "Filter chip ACTIVE recomputes filteredLoans from the in-memory list without a network call"
      type: ViewModel
      priority: P1
      given: "loans contain ACTIVE, OVERDUE, CLOSED"
      when: "chip_active OnFilterChange(ACTIVE) fires"
      then: "selectedFilter=ACTIVE; filteredLoans contains only ACTIVE loans; transform_state over the Store5-backed list; no Fineract call"

    - id: TC-LLT-006
      scenario: "Filter chip OVERDUE shows only overdue loans"
      type: ViewModel
      priority: P1
      given: "loans list with one OVERDUE row"
      when: "chip_overdue OnFilterChange(OVERDUE) fires"
      then: "selectedFilter=OVERDUE; filteredLoans contains only overdue accounts; no network call"

    - id: TC-LLT-007
      scenario: "Filter chip ALL restores the full in-memory loan list"
      type: ViewModel
      priority: P1
      given: "a narrower filter previously applied"
      when: "chip_all OnFilterChange(ALL) fires"
      then: "selectedFilter=ALL; filteredLoans equals the full loans list; transform_state only"

    - id: TC-LLT-008
      scenario: "Tapping a loan card navigates to loan-detail with the tapped loanId"
      type: Screen
      priority: P0
      given: "loan card with id=5001 rendered"
      when: "OnLoanClick fires"
      then: "navigate effect to loan-detail with loanId=5001 as route argument"

    - id: TC-LLT-009
      scenario: "Apply for Loan FAB visible only when canApplyLoan and navigates to loan-apply with groupId"
      type: Screen
      priority: P0
      given: "canApplyLoan=true (authorized chairperson/treasurer), groupId=10"
      when: "apply_loan_fab OnApplyLoan fires"
      then: "FAB visible; navigate effect to loan-apply passing groupId=10; FAB hidden when canApplyLoan=false"

    - id: TC-LLT-010
      scenario: "Empty state shown when no loans match the selected filter"
      type: Screen
      priority: P1
      given: "get_group_loans returns zero rows for the filter"
      when: "screen renders"
      then: "empty_state 'No loans yet' / 'No loans match the selected filter.' visible; no loan cards; FAB still shown when canApplyLoan"

    - id: TC-LLT-011
      scenario: "Loading state shows the shimmer list while cache-then-Fineract fetch runs"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "loading state rendered"
      then: "shimmer_list (count 5) shown with top_bar and filter_chips_row; loan cards and FAB not yet rendered"

    - id: TC-LLT-012
      scenario: "Network/500 error shows error state with retry; Retry re-triggers the Store5 stream fresh"
      type: ViewModel
      priority: P1
      given: "server returns 500"
      when: "error_state Retry fires"
      then: "LoanListError type=Server; error_state shown; Retry re-triggers the Store5 stream with fresh=true to re-call get_group_loans; call_api effect asserted; cached data shown if available"

    - id: TC-LLT-013
      scenario: "Offline shows cached loans with an offline/stale banner"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor offline; cached loans present"
      when: "screen mounts"
      then: "cached LoanSummary rows rendered from the Store5 SQLDelight cache; offline banner shown; no hard error state"

    - id: TC-LLT-014
      scenario: "401 redirects to login and clears the session"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "get_group_loans returns 401"
      then: "LoanListError type=Auth (redirect=login); navigate to login; session cleared"

    - id: TC-LLT-015
      scenario: "Pull-to-refresh invalidates cache and re-fetches from offset 0"
      type: ViewModel
      priority: P1
      given: "cached loan list present, isRefreshing=false"
      when: "OnRefresh triggered by pull-to-refresh"
      then: "isRefreshing toggles true; cache invalidated; get_group_loans re-called with offset=0; list updated; isRefreshing back to false"

    - id: TC-LLT-016
      scenario: "OnLoadNextPage appends the next page on scroll to list end without clearing current items"
      type: ViewModel
      priority: P2
      given: "first page returned 20 items, more available"
      when: "OnLoadNextPage fires at list end"
      then: "get_group_loans called with offset=20; new items appended to existing filteredLoans; no clear of current rows"

    - id: TC-LLT-017
      scenario: "OnBack pops the loan-list destination returning to the group-dashboard"
      type: Screen
      priority: P2
      given: "Content state entered from group-dashboard"
      when: "top-bar navigation OnBack fires"
      then: "navigate effect pops back stack to group-dashboard; no state persisted, no network call"

    - id: TC-LLT-018
      scenario: "LoanRepository.getGroupLoans emits cached rows from the SQLDelight loans cache then the network refresh"
      type: Repository
      priority: P0
      given: "local DB has 3 cached LoanSummary; network returns 5"
      when: "getGroupLoans(groupId=10) called"
      then: "Store5 stream emits the cached 3 first, then the refreshed 5 after the companion API response; cache updated"
