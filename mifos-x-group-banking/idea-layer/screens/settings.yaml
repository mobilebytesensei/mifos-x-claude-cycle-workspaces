analytics:
  screen_view: settings_viewed
  events:
    - trigger: language changed
      name: settings_language_changed
      params: { from_language: String, to_language: String }
    - trigger: theme changed
      name: settings_theme_changed
      params: { theme: String }
    - trigger: biometric toggled
      name: settings_biometric_toggled
      params: { enabled: Boolean }
    - trigger: notifications toggled
      name: settings_notifications_toggled
      params: { enabled: Boolean }
    - trigger: change PIN submitted
      name: settings_pin_changed
    - trigger: logout confirmed
      name: settings_logout
