schema_version: "3.1"
id: settings
name: Settings
description: >
  App settings screen accessible by both admin and member client types. Provides language
  selection (English, Swahili, French, Hindi) with runtime composable-tree restart, light/dark/system
  theme toggle, biometric unlock toggle, Change PIN action (calls Fineract password update),
  notifications toggle, and app version display. No API calls are made on load; only the
  Change PIN action calls POST /self/user/updatePassword.
feature: settings
flow: settings-flow
version: "1.0.0"
tags:
  - settings
  - both
  - multi-language
  - FR-010
  - FR-013

status: enriched
quality_score: 85
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system

entry_point: false
bottom_nav:
  visible: true
  selected_tab: settings
navigates_to: []
route: /settings
entry_points:
  - source: bottom_nav
    label: Settings
  - source: profile_menu
    label: Settings
nav_params: {}

screens:
  - id: settings-screen
    title: Settings
    type: settings
    description: Grouped settings sections; no loading state needed

state_model:
  SettingsViewModel:
    state:
      name: SettingsState
      fields:
        selectedLanguage: { type: AppLanguage, default: "AppLanguage.ENGLISH" }
        selectedTheme: { type: AppTheme, default: "AppTheme.SYSTEM" }
        isBiometricEnabled: { type: Boolean, default: "false" }
        isNotificationsEnabled: { type: Boolean, default: "true" }
        isBiometricAvailable: { type: Boolean, default: "false" }
        appVersion: { type: String, default: '""' }
        buildNumber: { type: String, default: '""' }
        isChangingPin: { type: Boolean, default: "false" }
        pinChangeError: { type: "String?", default: "null" }
        pinChangeSuccess: { type: Boolean, default: "false" }
        isLoggingOut: { type: Boolean, default: "false" }
    screen_state:
      name: SettingsScreenState
      members: [Content, ChangingPin, LoggingOut]
    errors:
      name: SettingsError
      types:
        - { type: PinChangeFailed, retry: true, message_key: error_pin_change }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: SettingsEvent
      members:
        - { name: RestartComposableTree, params: { language: AppLanguage } }
        - { name: ShowPinChangeDialog }
        - { name: ShowSnackbar, params: { message: String } }
        - { name: NavigateToLogin }
    actions:
      name: SettingsAction
      members:
        - { name: OnLanguageSelected, params: { language: AppLanguage }, trigger: "Select language option" }
        - { name: OnThemeSelected, params: { theme: AppTheme }, trigger: "Select theme option" }
        - { name: OnBiometricToggle, params: { enabled: Boolean }, trigger: "Toggle biometric switch" }
        - { name: OnNotificationsToggle, params: { enabled: Boolean }, trigger: "Toggle notifications switch" }
        - { name: OnChangePin, trigger: "Tap Change PIN row" }
        - { name: OnSubmitPinChange, params: { currentPin: String, newPin: String }, trigger: "Submit PIN change dialog" }
        - { name: OnLogout, trigger: "Tap Logout button" }
        - { name: OnConfirmLogout, trigger: "Confirm logout dialog" }
    di:
      - PreferencesRepository
      - AuthRepository
      - BiometricManager

flow_logic:
  on_load:
    - action: load_preferences
      source: local_preferences
      description: >
        Read language, theme, biometric, notifications settings from DataStore.
        Check biometric hardware availability via BiometricManager.
        Read app version and build number from BuildConfig.
  on_language_selected:
    - action: persist_language
      source: local_preferences
    - event: RestartComposableTree
      description: "Triggers setContent { MifosApp(language=...) } so the entire composable tree re-renders in the new locale"
  on_theme_selected:
    - action: persist_theme
      source: local_preferences
    - action: apply_theme
      description: "Dynamic theme recomposition via MaterialTheme provider"
  on_biometric_toggle:
    - action: persist_biometric_setting
      source: local_preferences
    - guard_on_enable: "isBiometricAvailable"
    - action: request_biometric_enrollment
      on_fail: revert_toggle
  on_notifications_toggle:
    - action: persist_notification_setting
      source: local_preferences
  on_change_pin:
    - event: ShowPinChangeDialog
  on_submit_pin_change:
    - action: validate_pin_format
      rule: "newPin.length >= 4 && newPin.all { it.isDigit() }"
    - action: change_pin
      api: update_password
      on_success: show_success_snackbar
      on_error: show_pin_change_error
  on_logout:
    - action: show_confirm_dialog
  on_confirm_logout:
    - action: clear_session
    - action: clear_local_db
    - event: NavigateToLogin

dependencies:
  repositories:
    - name: PreferencesRepository
      methods:
        - "getLanguage(): Flow<AppLanguage>"
        - "setLanguage(language: AppLanguage): Flow<Unit>"
        - "getTheme(): Flow<AppTheme>"
        - "setTheme(theme: AppTheme): Flow<Unit>"
        - "getBiometricEnabled(): Flow<Boolean>"
        - "setBiometricEnabled(enabled: Boolean): Flow<Unit>"
        - "getNotificationsEnabled(): Flow<Boolean>"
        - "setNotificationsEnabled(enabled: Boolean): Flow<Unit>"
    - name: AuthRepository
      methods:
        - "changePin(currentPassword: String, newPassword: String): Flow<Unit>"
        - "logout(): Flow<Unit>"
  services:
    - BiometricManager

api:
  - id: update_password
    function: update_mobile
    method: put
    endpoint: "/self/user/updatePassword"
    description: Change the user's PIN/password via Fineract self-service API
    body:
      currentPassword: String
      newPassword: String
    response:
      type: object
      fields:
        resourceId: Long
    errors:
      400: Current password incorrect or new password does not meet policy
      401: Unauthorized
      500: Server error

dtos:
  AppLanguage:
    values:
      - { id: ENGLISH, display: "English", locale: "en" }
      - { id: SWAHILI, display: "Kiswahili", locale: "sw" }
      - { id: FRENCH, display: "Français", locale: "fr" }
      - { id: HINDI, display: "हिन्दी", locale: "hi" }

  AppTheme:
    values: [LIGHT, DARK, SYSTEM]

components:
  - id: top_bar
    type: top-bar
    title: "Settings"
    style:
      background: primary
      text_color: onPrimary
    test_context:
      purpose: "Screen title — no back navigation, accessed via bottom nav"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: language_section_header
    type: section-header
    label: "Language"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 8dp" }
    test_context:
      purpose: "Section header for language settings group"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: language_selector_group
    type: radio-group
    style:
      background: surface
      corner_radius: 12dp
      padding: "4dp 0dp"
    options:
      - { id: ENGLISH, label: "English", sublabel: "English", icon: flag_gb }
      - { id: SWAHILI, label: "Kiswahili", sublabel: "Swahili", icon: flag_ke }
      - { id: FRENCH, label: "Français", sublabel: "French", icon: flag_fr }
      - { id: HINDI, label: "हिन्दी", sublabel: "Hindi", icon: flag_in }
    selected_value: "{{selectedLanguage}}"
    on_change: { action: OnLanguageSelected, param: language }
    item_style:
      min_touch_target: 56dp
      padding: "12dp 16dp"
    test_context:
      purpose: "Language selection — change triggers full composable tree restart (FR-010)"
      interaction_type: radio_select
      data_driven: true
      required_fields: [selectedLanguage]

  - id: appearance_section_header
    type: section-header
    label: "Appearance"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 8dp" }
    test_context:
      purpose: "Section header for appearance settings"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: theme_selector_group
    type: radio-group
    style:
      background: surface
      corner_radius: 12dp
      padding: "4dp 0dp"
    options:
      - { id: LIGHT, label: "Light", icon: light_mode }
      - { id: DARK, label: "Dark", icon: dark_mode }
      - { id: SYSTEM, label: "System Default", icon: contrast }
    selected_value: "{{selectedTheme}}"
    on_change: { action: OnThemeSelected, param: theme }
    item_style:
      min_touch_target: 56dp
      padding: "12dp 16dp"
    test_context:
      purpose: "Theme selection — applies dynamically without app restart"
      interaction_type: radio_select
      data_driven: true
      required_fields: [selectedTheme]

  - id: security_section_header
    type: section-header
    label: "Security"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 8dp" }
    test_context:
      purpose: "Section header for security settings"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: biometric_toggle_row
    type: settings-row
    icon: fingerprint
    label: "Biometric Unlock"
    sublabel: "Use fingerprint or face ID to log in"
    style:
      background: surface
      min_touch_target: 56dp
      padding: "0dp 16dp"
    trailing:
      type: switch
      checked: "{{isBiometricEnabled}}"
      enabled_when: "isBiometricAvailable"
      on_change: { action: OnBiometricToggle, param: enabled }
    disabled_hint: "Biometric hardware not available on this device"
    test_context:
      purpose: "Toggle biometric unlock; disabled if hardware not present (FR-013)"
      interaction_type: toggle
      data_driven: true
      required_fields: [isBiometricEnabled, isBiometricAvailable]

  - id: change_pin_row
    type: settings-row
    icon: lock_reset
    label: "Change PIN"
    sublabel: "Update your 4-digit security PIN"
    style:
      background: surface
      min_touch_target: 56dp
      padding: "0dp 16dp"
    trailing:
      type: icon
      icon: chevron_right
    on_click: { action: OnChangePin, dialog: change_pin_dialog }
    test_context:
      purpose: "Open Change PIN dialog; calls Fineract self/user/updatePassword"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: notifications_section_header
    type: section-header
    label: "Notifications"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 8dp" }
    test_context:
      purpose: "Section header for notification preferences"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: notifications_toggle_row
    type: settings-row
    icon: notifications
    label: "Push Notifications"
    sublabel: "Receive alerts for meetings, repayments, and sync events"
    style:
      background: surface
      min_touch_target: 56dp
      padding: "0dp 16dp"
    trailing:
      type: switch
      checked: "{{isNotificationsEnabled}}"
      on_change: { action: OnNotificationsToggle, param: enabled }
    test_context:
      purpose: "Toggle push notification preference"
      interaction_type: toggle
      data_driven: true
      required_fields: [isNotificationsEnabled]

  - id: about_section_header
    type: section-header
    label: "About"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 8dp" }
    test_context:
      purpose: "Section header for app information"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: app_version_row
    type: settings-row
    icon: info_outline
    label: "App Version"
    sublabel: "{{appVersion}} (Build {{buildNumber}})"
    style:
      background: surface
      min_touch_target: 48dp
      padding: "0dp 16dp"
    test_context:
      purpose: "Display app version and build number for support reference"
      interaction_type: static
      data_driven: true
      required_fields: [appVersion, buildNumber]

  - id: logout_button
    type: button
    label: "Logout"
    icon: logout
    style:
      background: errorContainer
      text_color: onErrorContainer
      corner_radius: 12dp
      min_touch_target: 56dp
      width: fill
      margin: "16dp"
    loading_when: "isLoggingOut"
    on_click: { action: OnLogout, dialog: settings-logout-dialog }
    test_context:
      purpose: "Logout; clears session and local data, redirects to login"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: change_pin_dialog
    type: dialog
    title: "Change PIN"
    visible_when: "isChangingPin"
    content:
      - id: current_pin_field
        type: text-field
        label: "Current PIN"
        input_type: password
        keyboard: number
        style: { min_touch_target: 48dp }
      - id: new_pin_field
        type: text-field
        label: "New PIN (min 4 digits)"
        input_type: password
        keyboard: number
        style: { min_touch_target: 48dp }
      - id: pin_change_error_text
        type: text
        style: { text_style: bodySmall, color: error }
        value: "{{pinChangeError}}"
        visible_when: "pinChangeError != null"
    actions:
      cancel: { label: "Cancel", on_click: { action: OnDismissPinDialog } }
      confirm: { label: "Update PIN", on_click: { action: OnSubmitPinChange, api: change_pin } }
    test_context:
      purpose: "PIN change dialog; submits to Fineract self-service updatePassword endpoint"
      interaction_type: dialog
      data_driven: false
      required_fields: []

states:
  initial_state: content
  content:
    components:
      - top_bar
      - language_section_header
      - language_selector_group
      - appearance_section_header
      - theme_selector_group
      - security_section_header
      - biometric_toggle_row
      - change_pin_row
      - notifications_section_header
      - notifications_toggle_row
      - about_section_header
      - app_version_row
      - logout_button
    description: "All settings sections visible; preferences loaded from DataStore"
    demo_data:
      selectedLanguage: ENGLISH
      selectedTheme: SYSTEM
      isBiometricEnabled: false
      isBiometricAvailable: true
      isNotificationsEnabled: true
      appVersion: "1.0.0"
      buildNumber: "42"
  changing_pin:
    components:
      - top_bar
      - language_section_header
      - language_selector_group
      - appearance_section_header
      - theme_selector_group
      - security_section_header
      - biometric_toggle_row
      - change_pin_row
      - notifications_section_header
      - notifications_toggle_row
      - about_section_header
      - app_version_row
      - logout_button
      - change_pin_dialog
    description: "PIN change dialog overlaid on settings"
  logging_out:
    components: [top_bar, logout_button]
    description: "Logout button shows loading; session being cleared"

