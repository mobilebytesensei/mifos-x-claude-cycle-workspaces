sibling: api
schema_version: "4.0"
feature_id: organizer-dashboard

api:
  - id: get_organizer_dashboard
    function: get_organizer_dashboard
    method: GET
    endpoint: "/companion/organizer/dashboard"   # companion API — organizer-per-group surface
    description: >
      Fetch organizer dashboard summary for the logged-in user. The companion API resolves
      group membership via dt_member_role and returns only groups where the user holds
      organizer/treasurer/chairperson role. Returns KPIs scoped to "my groups" (not all-branch).
      Replaces raw Fineract /staff/{id}/summary + /groups + /journal-entries.
    params: {}   # identity resolved server-side from auth token (unified identity, no staffId)
    response:
      type: object
      fields:
        organizerName: String
        myGroupCount: Int
        totalMembers: Int
        pendingShareOutCount: Int     # share-outs due across my groups
        meetingsTodayCount: Int
        fieldOfficerEnabled: Boolean  # optional tier flag
        todaySchedule: "List<ScheduledMeeting>"
        recentActivity: "List<ActivityItem>"
    errors:
      401: Unauthorized
      403: Not an organizer in any group
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached

dtos:
  OrganizerDashboardSummary:
    organizerName: String
    myGroupCount: Int
    totalMembers: Int
    pendingShareOutCount: Int
    meetingsTodayCount: Int
    fieldOfficerEnabled: Boolean
    todaySchedule: "List<ScheduledMeeting>"
    recentActivity: "List<ActivityItem>"

  ScheduledMeeting:
    groupId: String
    groupName: String
    meetingTime: String
    memberCount: Int
    location: "String?"

  ActivityItem:
    id: String
    type: String          # MEETING | DEPOSIT | SHARE_OUT | NEW_MEMBER | LOAN (optional)
    description: String
    amount: "Double?"
    date: String
    memberName: "String?"
    groupName: "String?"
