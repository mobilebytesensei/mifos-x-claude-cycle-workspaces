<!DOCTYPE html>
<html lang="en" data-feature="organizer-dashboard" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>organizer-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <h1>Dashboard</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" data-action="OnOpenNotifications" aria-label="Notifications">🔔</button>
    </div>
  </header>

  <main>
    <!-- error_state (icon: cloud_off) — title + body + retry -->
    <div class="empty-state">
      <div class="illus" aria-hidden="true">☁️</div>
      <h2>Could not load dashboard</h2>
    </div>

    <div class="alert alert-danger" role="alert">
      <span aria-hidden="true">⚠️</span>
      <div>
        <h3>No internet connection</h3>
        <p>Showing cached data. Check your connection and try again.</p>
      </div>
    </div>

    <button class="btn btn-primary btn-full" data-state-to="loading">Retry</button>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
