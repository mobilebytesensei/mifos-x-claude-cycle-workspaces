<!DOCTYPE html>
<html lang="en" data-feature="organizer-dashboard" data-state="empty" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>organizer-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* welcome_header — primaryContainer band (same as content state) */
  .welcome-band { background: var(--primary-100); padding: var(--space-base) var(--space-base) var(--space-md); }
  .welcome-band h2 { font-size: 18px; font-weight: 600; color: var(--primary-900); margin-bottom: 2px; }
  .welcome-band p { font-size: 14px; color: var(--primary-700); }
  main { padding-top: var(--space-base); }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <h1>Dashboard</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" data-action="OnOpenNotifications" aria-label="Notifications">🔔</button>
    </div>
  </header>

  <!-- welcome_header -->
  <div class="welcome-band">
    <h2>Welcome back, Jane Wanjiru</h2>
    <p>Here's your overview for today</p>
  </div>

  <main>
    <!-- empty_state (icon: dashboard_customize) -->
    <div class="empty-state">
      <div class="illus" aria-hidden="true">🗂️</div>
      <h2>No data yet</h2>
      <p>Your groups and activity will appear here once set up.</p>
      <button class="btn btn-primary btn-full" data-nav-to="group-list">View Groups</button>
    </div>
  </main>

  <!-- bottom_nav (dashboard shell) — Home active -->
  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-item active" aria-current="page"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-item" data-nav-to="group-list"><span class="nav-icon">👥</span>Groups</button>
    <button class="nav-item" data-nav-to="meeting-calendar"><span class="nav-icon">📅</span>Meetings</button>
    <button class="nav-item" data-nav-to="settings"><span class="nav-icon">⚙️</span>Settings</button>
  </nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
