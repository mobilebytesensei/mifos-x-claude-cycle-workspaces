<!DOCTYPE html>
<html lang="en" data-feature="organizer-dashboard" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>organizer-dashboard · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* welcome_header — primaryContainer band (same as content state) */
  .welcome-band { background: var(--primary-100); padding: var(--space-base) var(--space-base) var(--space-md); }
  .welcome-band h2 { font-size: 18px; font-weight: 600; color: var(--primary-900); margin-bottom: 2px; }
  .welcome-band p { font-size: 14px; color: var(--primary-700); }
  main { padding-top: var(--space-base); }
  /* shimmer_dashboard — skeleton fill inside the shared .summary-card / .card containers */
  .skel { background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: skel 1.4s infinite; border-radius: var(--radius-sm); }
  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skel-metric { height: 22px; width: 40px; margin-bottom: var(--space-xs); }
  .skel-line { height: 12px; }
  .skel-line.w-60 { width: 60%; }
  .skel-line.w-40 { width: 40%; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <h1>Dashboard</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" data-action="OnOpenNotifications" aria-label="Notifications">🔔</button>
    </div>
  </header>

  <!-- welcome_header (rendered — greeting known before data loads) -->
  <div class="welcome-band">
    <h2>Welcome back, Jane Wanjiru</h2>
    <p>Here's your overview for today</p>
  </div>

  <main aria-busy="true">
    <!-- shimmer_dashboard: count=4 KPI skeletons in the shared card-group -->
    <div class="card-group">
      <div class="summary-card"><div class="skel skel-metric"></div><div class="skel skel-line w-60"></div></div>
      <div class="summary-card"><div class="skel skel-metric"></div><div class="skel skel-line w-60"></div></div>
      <div class="summary-card"><div class="skel skel-metric"></div><div class="skel skel-line w-60"></div></div>
      <div class="summary-card"><div class="skel skel-metric"></div><div class="skel skel-line w-60"></div></div>
    </div>

    <!-- schedule / activity block skeletons -->
    <div class="card">
      <div class="skel skel-line w-40" style="height:16px;margin-bottom:var(--space-md);"></div>
      <div class="list">
        <div class="list-item"><span class="avatar skel" style="background:var(--bg-muted);"></span><div class="main"><div class="skel skel-line w-60" style="margin-bottom:6px;"></div><div class="skel skel-line w-40"></div></div></div>
        <div class="list-item"><span class="avatar skel" style="background:var(--bg-muted);"></span><div class="main"><div class="skel skel-line w-60" style="margin-bottom:6px;"></div><div class="skel skel-line w-40"></div></div></div>
      </div>
    </div>

    <!-- spinner reinforcing in-flight parallel API calls -->
    <div class="spinner" aria-label="Loading dashboard"></div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
