# ─────────────────────────────────────────────────────────────────────────────
# E2E — Settings reachable from the organizer dashboard (the fix for the
#        user-flagged "can't see settings" gap)
# ─────────────────────────────────────────────────────────────────────────────
# login → organizer-dashboard → tap the top-bar overflow (⋮) → Settings item →
#   settings screen. Previously the organizer landing had no Settings entry.
appId: org.mifos.groupbanking
name: e2e — settings reachable from organizer dashboard
tags:
  - e2e
  - group-banking
  - organizer-dashboard
  - settings
---
- launchApp:
    clearState: true
- assertVisible: { id: "login_signup_screen" }
- tapOn: { id: "login_signup_field_email_phone" }
- inputText: "mifos"
- tapOn: { id: "login_signup_field_password" }
- inputText: "password"
- hideKeyboard
- tapOn: { id: "login_signup_login_button" }
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 20000

# --- top-bar overflow (⋮) is the rightmost action; the bell is to its left ---
- tapOn:
    point: "96%,9%"
- assertVisible: "Settings"
- assertVisible: "Sync Status"
- tapOn: "Settings"
- extendedWaitUntil:
    visible: { id: "settings_screen" }
    timeout: 15000
