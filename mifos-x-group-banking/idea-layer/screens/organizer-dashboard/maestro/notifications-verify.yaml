# ─────────────────────────────────────────────────────────────────────────────
# E2E — organizer-dashboard notifications bell (G4, offline demo)
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (OFFLINE via demo): Demo Explore → organizer-dashboard → tap the
#   top-bar Notifications bell → assert the deferred-notifications snackbar. Verifies
#   the G4 dead-affordance fix: the bell now has a declared OnOpenNotifications action
#   + NotificationsDeferred event backing a real snackbar (was an undeclared handler).
appId: org.mifos.groupbanking
name: e2e — organizer-dashboard notifications bell (offline demo)
tags:
  - e2e
  - group-banking
  - organizer-dashboard
  - offline
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_demo_explore_button"
- assertVisible: "Explore as a demo user"
- tapOn: "Continue"
- assertVisible:
    id: "organizer_dashboard_screen"

# --- G4: tap the top-bar Notifications bell. TopAppBarAction exposes only a
# content-description (no testTag slot on the framework component); it renders in
# the top-right (accessibility content-desc "Notifications"), tapped by point. ---
- tapOn:
    point: "96%,9%"
# deferred snackbar surfaces (declared event → real snackbar, no dead click)
- assertVisible: "Notifications centre is coming in a later release."
