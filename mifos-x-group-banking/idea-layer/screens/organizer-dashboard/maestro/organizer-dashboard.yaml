# ─────────────────────────────────────────────────────────────────────────────
# E2E — organizer-dashboard : login-landing → Content → KPI drill-down to group-list
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (GroupBankingNavHost §1 + LoginSignupViewModel:532):
#   login-signup is the NavHost start. On login success the ViewModel inspects
#   groupMemberships — memberships.any { role == ORGANIZER } routes to
#   organizer-dashboard. This is the ONLY in-app entry (no deep-link launch arg).
# Backend seed required: a demo account that holds the ORGANIZER role in ≥1 group.
# TestTag constants: OrganizerDashboardTestTags.kt + LoginSignupTestTags.kt (CU-5).
#
# Run: maestro test --env ORGANIZER_USER=<u> --env ORGANIZER_PASS=<p> \
#        idea-layer/screens/organizer-dashboard/maestro/organizer-dashboard.yaml
appId: org.mifos.groupbanking
name: e2e — organizer-dashboard (login-landing → content → drill-down)
tags:
  - e2e
  - group-banking
  - organizer-dashboard
env:
  ORGANIZER_USER: "organizer@demo.mifos"
  ORGANIZER_PASS: "Demo1234!"
---
# --- guaranteed prefix: fresh launch + login screen (always reachable) ---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: ${ORGANIZER_USER}
- tapOn:
    id: "login_signup_field_password"
- inputText: ${ORGANIZER_PASS}
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- state: Loading → Content (organizer role lands here) ---
# extendedWaitUntil waits through OrganizerDashboardScreenState.Loading
# (organizer_dashboard_loading_indicator) until Content composes.
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000
- assertVisible:
    id: "organizer_dashboard_content"          # Content state surface
- assertVisible:
    id: "organizer_dashboard_welcome_header"
- assertVisible:
    id: "organizer_dashboard_kpi_row"
- assertVisible:
    id: "organizer_dashboard_quick_nav_section"
- assertVisible:
    id: "organizer_dashboard_schedule_section"

# --- primary on_click: Groups KPI card → group-list (OnViewAllGroups) ---
- tapOn:
    id: "organizer_dashboard_kpi_groups_card"
- assertVisible:
    id: "group_list_screen"                     # nav result asserted
