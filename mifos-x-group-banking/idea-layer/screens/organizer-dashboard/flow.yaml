sibling: flow
schema_version: "4.0"
feature_id: organizer-dashboard

navigates_to:
  - group-list
  - field-officer-dashboard
  - meeting-calendar          # G7 — Today's Schedule row + Meetings-Today KPI open the group's meeting calendar

flow_logic:
  on_load:
    # Unified identity — no admin role check. Companion API resolves organizer groups from token.
    - api_call: get_organizer_dashboard   # single companion API call replaces 3 Fineract calls
      on_success: show_content
      on_error: show_error

  on_view_all_groups:
    - navigate: group-list

  on_view_field_officer:
    - guard: "fieldOfficerEnabled"
    - navigate: field-officer-dashboard

  on_meeting_group_click:                  # G7 — was navigate group-list (mis-route)
    - navigate: meeting-calendar
      params: { group_id: "{{groupId}}" }

  on_view_meetings_today:                  # G7 — Meetings-Today KPI → earliest today's meeting's calendar
    - guard: "meetingsTodayCount > 0"
    - navigate: meeting-calendar
      params: { group_id: "{{todaySchedule.first().groupId}}" }

  on_open_notifications:                   # G4 — deferred notifications (no screen yet)
    - emit: NotificationsDeferred
      snackbar_message_key: notifications_deferred

  on_refresh:
    - api_call: get_organizer_dashboard
      invalidate_cache: true

dependencies:
  repositories:
    - name: OrganizerDashboardRepository    # companion API /companion/organizer/dashboard
      methods:
        - "getOrganizerDashboard(): Flow<OrganizerDashboardSummary>"
  services:
    - SessionManager
    - NetworkMonitor
  local_db:
    - table: organizer_dashboard_cache
      schema: SQLDelight OrganizerDashboardSummary entity
