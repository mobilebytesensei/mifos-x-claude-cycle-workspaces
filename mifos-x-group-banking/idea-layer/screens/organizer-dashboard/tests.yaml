sibling: tests
schema_version: "4.0"
feature_id: organizer-dashboard
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-OD-001
      scenario: "On mount, organizer dashboard loads from companion /companion/organizer/dashboard"
      type: ViewModel
      priority: P0
      given: "groupId=1; userRole=ORGANIZER; network online"
      when: "OrganizerDashboardScreen enters composition"
      then: "GET /companion/organizer/dashboard called; metrics populated; OrganizerDashboardScreenState=Content"

    - id: TC-OD-002
      scenario: "Today schedule section shows upcoming meetings with Start Meeting CTA"
      type: Screen
      priority: P0
      given: "Content state; todaySchedule=[{groupId:'ctr-001', groupName:'Mwangaza', meetingTime:'14:00'}]"
      when: "TodayScheduleSection renders"
      then: "meeting at 14:00 shown; row tap emits NavigateToMeetingCalendar(centerId=ctr-001) → that group's calendar where the upcoming meeting is pinned with Start Meeting (canonical calendar-first path, consistent with group-dashboard OnStartMeeting)"

    - id: TC-OD-003
      scenario: "FieldOfficer tile visible when API v1.1 fieldOfficerEnabled=true"
      type: Screen
      priority: P1
      given: "Content state; apiVersion>=1.1; fieldOfficerEnabled=true; fieldOfficer.name='Amina'"
      when: "FieldOfficerSection renders"
      then: "field officer tile shows 'Amina'; contact action visible"

    - id: TC-OD-004
      scenario: "FieldOfficer tile hidden when apiVersion<1.1 or fieldOfficerEnabled=false"
      type: Screen
      priority: P1
      given: "apiVersion=1.0 OR fieldOfficerEnabled=false"
      when: "OrganizerDashboardScreen renders"
      then: "FieldOfficerSection not rendered; no nil pointer"

    - id: TC-OD-005
      scenario: "Pending loan approvals count shows in action tile with approve CTA"
      type: Screen
      priority: P0
      given: "Content state; pendingLoanApprovals=3"
      when: "PendingActionsSection renders"
      then: "3 pending loans badge visible; tap navigates to loan-list with status=PENDING filter"

    - id: TC-OD-006
      scenario: "Overdue members count shows in warning tile"
      type: Screen
      priority: P1
      given: "Content state; overdueMembers=2"
      when: "OrganizerDashboardScreen renders"
      then: "overdue warning tile shows 2 members; amber color; tap navigates to member-list"

    - id: TC-OD-007
      scenario: "Pull-to-refresh reloads organizer dashboard metrics"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh fires"
      then: "isRefreshing=true; GET /companion/organizer/dashboard re-called; isRefreshing=false"

    - id: TC-OD-008
      scenario: "Error state shows retry on load failure"
      type: Screen
      priority: P1
      given: "GET /companion/organizer/dashboard returns network error"
      when: "load completes"
      then: "OrganizerDashboardScreenState=Error; retry CTA shown"

    - id: TC-OD-009
      scenario: "Auth 401 redirects to login-signup"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "dashboard load returns 401"
      then: "OrganizerDashboardError type=Auth; NavigateToLoginSignup emitted"
