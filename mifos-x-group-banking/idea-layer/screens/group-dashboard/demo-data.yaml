sibling: demo-data
schema_version: "2.1.0"
feature_id: group-dashboard

entries:
  - dto: GroupSummary
    count_hint: 1
    source_notes: >
      Mwangaza Women's Group — 12 members, weekly meetings, cycle 1 in progress, VSLA type.
      Returned by get_group companion call. String groupId, no numeric fineractCenterId exposed.
    items:
      - groupId: "GRP-20260509-001"
        name: "Mwangaza Women's Group"
        groupType: "VSLA"
        cycleNumber: 1
        cycleLengthMonths: 12
        meetingFrequency: "WEEKLY"
        memberCount: 12
        overdueLoansCount: 1
        status: "ACTIVE"

  - dto: ViewerRole
    count_hint: 2
    source_notes: >
      Returned by get_viewer_role for the authenticated user. Two variants to cover
      ORGANIZER (shows admin actions) and MEMBER (hides admin actions).
    items:
      - groupId: "GRP-20260509-001"
        userId: "USR-001"
        role: "ORGANIZER"

      - groupId: "GRP-20260509-001"
        userId: "USR-002"
        role: "MEMBER"

  - dto: GroupCorpus
    count_hint: 1
    source_notes: >
      Returned by get_group_corpus (network_first, TTL 60s).
      After 4 weeks of KES 100-500 contributions from 12 members.
      ACCUMULATING poolModel — shareOutProjection shown on dashboard.
    items:
      - currentBalance: 16400.00
        openingBalance: 0.00
        totalContributionsThisCycle: 14400.00
        totalLoansOutstanding: 32000.00
        shareOutProjection: 18200.00
        lastUpdated: "2026-05-09"

  - dto: GroupTypeConfig
    count_hint: 1
    source_notes: >
      From group_type_config_cache (source_datatable dt_group_type_config).
      VSLA rules: KES 100 min, KES 500 max contribution per week. Loan multiplier 3x.
      10% annual interest. 12-month cycle. KES 50 fine for missed meetings.
    items:
      - typeSlug: "VSLA"
        displayName: "VSLA"
        pool_model: "ACCUMULATING"
        contribution_model: "FIXED_AMOUNT"
        contributionMin: 100.00
        contributionMax: 500.00
        loanMultiplier: 3.0
        interestRate: 10.0
        cycleLengthMonths: 12
        fineAmount: 50.00
        minimumDisbursementThreshold: 10000.00
        lendingEnabled: true

  - dto: GroupAccounts
    count_hint: 1
    source_notes: >
      Returned by get_group_accounts. Savings balance reflects member contributions minus loans.
      4 active loans including Grace Akinyi (KES 8,000) and Joseph Kamau (KES 5,000).
    items:
      - savingsBalance: 48000.00
        loansOutstanding: 32000.00
        activeLoanCount: 4

  - dto: ActivityItem
    count_hint: 5
    source_notes: >
      Recent activity for Mwangaza group from OrganizerDashboardSummary.recentActivity[].
      Mix of MEETING, DEPOSIT, LOAN, and SHARE_OUT types with KES amounts and member names.
    items:
      - id: "ACT-201-001"
        type: "MEETING"
        description: "Weekly meeting — week 4 recorded"
        amount: null
        date: "2026-05-05"
        memberName: null

      - id: "ACT-201-002"
        type: "DEPOSIT"
        description: "Weekly contribution"
        amount: 300.00
        date: "2026-05-05"
        memberName: "Amina Wanjiru"

      - id: "ACT-201-003"
        type: "DEPOSIT"
        description: "Weekly contribution"
        amount: 500.00
        date: "2026-05-05"
        memberName: "Joseph Kamau"

      - id: "ACT-201-004"
        type: "LOAN"
        description: "Loan disbursed"
        amount: 8000.00
        date: "2026-05-05"
        memberName: "Grace Akinyi"

      - id: "ACT-201-005"
        type: "NEW_MEMBER"
        description: "New member joined"
        amount: null
        date: "2026-04-28"
        memberName: "Peter Mwangi"

