sibling: demo-data
schema_version: "2.1.0"
feature_id: group-dashboard

entries:
  - dto: Group
    count_hint: 2
    source_notes: >
      Two group variants exercising both pool_model branches of the dashboard.
      (1) Mwangaza Women's Group — 20 members, weekly VSLA (ACCUMULATING, SHARE_BASED_VARIABLE).
          Drives corpus_card + shareout_projection_text + savings_summary_card share-based variant.
      (2) Jiunge ROSCA Circle — 10 members, monthly ROSCA (ROTATING_PAYOUT, FIXED_AMOUNT).
          Drives rotation_card + viewer_position_text + next_recipient_chip.
      Returned by get_group companion call. String groupId, no numeric fineractCenterId exposed.
    items:
      - groupId: "GRP-20260509-001"
        name: "Mwangaza Women's Group"
        groupType: "VSLA"
        cycleNumber: 1
        cycleLengthMonths: 12
        meetingFrequency: "Weekly"
        memberCount: 20
        overdueLoansCount: 0
        status: "ACTIVE"

      - groupId: "GRP-20260610-002"
        name: "Jiunge ROSCA Circle"
        groupType: "ROSCA"
        cycleNumber: 3
        cycleLengthMonths: 10
        meetingFrequency: "Monthly"
        memberCount: 10
        overdueLoansCount: 0
        status: "ACTIVE"

  - dto: ViewerRole
    count_hint: 4
    source_notes: >
      Returned by get_viewer_role for the authenticated user. Four variants covering all
      role gates in ui.yaml: ORGANIZER and TREASURER show management_actions_grid;
      CHAIRPERSON also shows management_actions_grid; MEMBER shows member_actions_grid.
      Also includes a MEMBER role for the ROSCA group (content_rotating state).
    items:
      - groupId: "GRP-20260509-001"
        userId: "USR-001"
        role: "ORGANIZER"
        memberId: 101

      - groupId: "GRP-20260509-001"
        userId: "USR-002"
        role: "MEMBER"
        memberId: 102

      - groupId: "GRP-20260509-001"
        userId: "USR-003"
        role: "TREASURER"
        memberId: 103

      - groupId: "GRP-20260610-002"
        userId: "USR-004"
        role: "MEMBER"
        memberId: 201

  - dto: GroupCorpus
    count_hint: 2
    source_notes: >
      Two variants matching the two Group entries.
      (1) ACCUMULATING (VSLA): KES 47,500 corpus after cycle-1 contributions from 20 members;
          shareOutProjection shown (KES 2,750 / share); rotation fields null.
      (2) ROTATING_PAYOUT (ROSCA): pool at KES 20,000, month 3 of 10; rotationPosition + nextRecipientName
          drive the rotation_card; openingBalance/totalContributions not shown to member.
