sibling: flow
schema_version: "4.0"
feature_id: group-dashboard

navigates_to:
  - meeting-calendar
  - member-list
  - loan-list
  - share-out-preview
  - savings-dashboard   # G9 — MEMBER "My Savings" (self-scoped; was member-savings-detail mis-route)
  - settings            # G13 — overflow menu
  - sync-status         # G13 — overflow menu

flow_logic:
  on_load:
    - action: fetch_all_parallel
      calls:
        - api: get_group
        - api: get_group_accounts
        - api: get_group_corpus
        - api: get_group_config
      on_all_success: compute_derived_state
      on_error: show_error
  compute_derived_state:
    - isCorpusInsufficient: "corpus.currentBalance < config.minimumDisbursementThreshold"
    - isCycleEnd: "corpus.isCycleEnd"   # server-computed cycle-end flag from get_group_corpus (replaces the legacy cycleWeek==cycleLengthWeeks formula whose fields never existed on the domain model)
  on_start_meeting:
    - check: corpus_sufficient
      if_insufficient: emit NavigateToMeetingCalendar (corpus warning shown inline)
      if_sufficient: navigate meeting-calendar
  on_view_members:
    - navigate: member-list
      params: { groupId: "{groupId}" }
  on_view_loans:
    - navigate: loan-list
      params: { groupId: "{groupId}", viewerRole: "{viewerRole}" }   # forward viewerRole so loan-list can gate canApplyLoan
  on_share_out:
    - condition: isCycleEnd
      true: navigate share-out-preview
      false: show_snackbar message_key=share_out_not_available
  on_view_savings:              # G9 — MEMBER role; forwards params the dashboard already holds
    - navigate: savings-dashboard
      params: { groupId: "{groupId}", typeConfig: "{typeConfig}" }
  on_more_options:              # G13 — toggle overflow dropdown (local UI state only)
    - transform_state: { isMoreMenuExpanded: "!isMoreMenuExpanded" }
  on_group_settings:           # G13 — overflow menu item
    - navigate: settings
  on_sync_status:              # G13 — overflow menu item
    - navigate: sync-status
  on_refresh:
    - action: fetch_all_parallel
      invalidate_cache: true

dependencies:
  repositories:
    - name: GroupRepository
      methods:
        - "getGroup(groupId: String): Flow<Group>"
        - "getGroupAccounts(groupId: String): Flow<GroupAccounts>"
    - name: CorpusRepository
      methods:
        - "getCorpus(groupId: String): Flow<GroupCorpus>"
        - "getGroupConfig(groupId: String): Flow<GroupConfig>"
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: groups
    - table: group_corpus
    - table: group_config
