# ─────────────────────────────────────────────────────────────────────────────
# E2E — REAL group drill-down: login → group-list → group-dashboard, LIVE
#        mifos-bank-2 data end to end
# ─────────────────────────────────────────────────────────────────────────────
# login (mifos/password) → organizer-dashboard → All Groups → group-list
#   (GET /companion/groups/mine → real Mwangaza from mifos-bank-2) → tap the
#   group → group-dashboard (GET /companion/groups/1/dashboard → real detail:
#   3 members, savings, Grace's loan). Verifies the group-list + group-dashboard
#   companion reads against LIVE Fineract on device.
# Prereq: Go companion :8090 + adb reverse tcp:8080 tcp:8090.
appId: org.mifos.groupbanking
name: e2e — real group drill-down (login → group-list → group-dashboard, live)
tags:
  - e2e
  - group-banking
  - real-network
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: "mifos"
- tapOn:
    id: "login_signup_field_password"
- inputText: "password"
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000

# --- real group-list (GET /companion/groups/mine → live Mwangaza) ---
- tapOn: "All Groups"
- extendedWaitUntil:
    visible:
      id: "group_list_screen"
    timeout: 15000
- assertVisible: "Mwangaza Women's Group"
- tapOn: "Mwangaza Women's Group"

# --- real group-dashboard (GET /companion/groups/1/dashboard → live detail) ---
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 20000
