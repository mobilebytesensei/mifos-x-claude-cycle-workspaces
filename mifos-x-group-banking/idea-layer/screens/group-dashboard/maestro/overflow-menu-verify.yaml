# ─────────────────────────────────────────────────────────────────────────────
# E2E — group-dashboard overflow menu (G13) + group path (offline demo)
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (OFFLINE via the extended demo seed): Demo Explore → organizer-dashboard
#   → All Groups (group-list, now seeded) → tap Mwangaza Women's Group → group-dashboard
#   (now seeded) → open the top-bar overflow (G13) → assert Settings + Sync Status items
#   → dismiss → View Members → member-list (now seeded). Verifies the G13 dead-affordance
#   fix AND the group-scoped screens render offline from the extended DemoSessionManager seed.
appId: org.mifos.groupbanking
name: e2e — group-dashboard overflow menu + group path (offline demo)
tags:
  - e2e
  - group-banking
  - group-dashboard
  - offline
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_demo_explore_button"
- assertVisible: "Explore as a demo user"
- tapOn: "Continue"
- assertVisible:
    id: "organizer_dashboard_screen"

# --- group-list (now seeded offline) ---
- tapOn: "All Groups"
- assertVisible:
    id: "group_list_screen"
- assertVisible: "Mwangaza Women's Group"
- tapOn: "Mwangaza Women's Group"

# --- group-dashboard renders offline (seed proof) ---
- assertVisible:
    id: "group_dashboard_screen"

# --- G13: overflow menu — declared handler + defined menu (was a dead click).
# The overflow is a framework TopAppBarAction (content-desc "More options", no
# testTag slot), rendered top-right — tap by point. ---
- tapOn:
    point: "96%,9%"
- assertVisible: "Settings"
- assertVisible: "Sync Status"
# dismiss the menu (tap outside)
- tapOn:
    point: "50%,55%"

# --- group → member-list (now seeded offline) ---
- tapOn:
    id: "group_dashboard_view_members_button"
- assertVisible:
    id: "member_list_screen"
