# ─────────────────────────────────────────────────────────────────────────────
# E2E — group-dashboard overflow menu (G13, offline demo)
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (OFFLINE via demo): Demo Explore → organizer-dashboard → All Groups
#   (group-list) → tap the seeded Mwangaza Women's Group row → group-dashboard →
#   tap the top-bar overflow (more_vert) → assert the dropdown renders its two items
#   (Settings, Sync Status). Verifies the G13 dead-affordance fix: the overflow icon
#   now has a declared handler + a defined menu (was a dead click).
appId: org.mifos.groupbanking
name: e2e — group-dashboard overflow menu (offline demo)
tags:
  - e2e
  - group-banking
  - group-dashboard
  - offline
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_demo_explore_button"
- assertVisible: "Explore as a demo user"
- tapOn: "Continue"
- assertVisible:
    id: "organizer_dashboard_screen"

# --- navigate to the group via All Groups (Quick Navigation) ---
- tapOn: "All Groups"
- assertVisible:
    id: "group_list_screen"
- tapOn: "Mwangaza Women's Group"

# --- group-dashboard: open the overflow menu (G13) and assert its items ---
- assertVisible:
    id: "group_dashboard_more_options_button"
- tapOn:
    id: "group_dashboard_more_options_button"
- assertVisible: "Settings"
- assertVisible: "Sync Status"
