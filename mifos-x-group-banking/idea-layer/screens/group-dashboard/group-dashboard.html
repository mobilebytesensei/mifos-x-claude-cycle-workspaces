<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Dashboard — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=bump" rel="stylesheet"/>
<script>
tailwind.config = { darkMode:'class', theme:{extend:{fontFamily:{display:['Noto Sans','system-ui','sans-serif']}}} };
</script>
<style>
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width:393px; min-height:852px; border-radius:2.5rem; overflow:hidden; position:relative; }
body.embedded { background:#F1F4EF; margin:0; padding:0; min-height:100vh; display:block; }
body.embedded #standalone-toolbar { display:none !important; }
body.embedded #phone-wrapper { display:none !important; }
body.embedded #embedded-content { display:flex !important; flex-direction:column; width:100%; height:100vh; overflow:hidden; background:#F1F4EF; }
.card { background:white; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.action-btn { cursor:pointer; border-radius:12px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform 0.1s; }
.action-btn:hover { transform:scale(1.03); }
.action-btn:active { transform:scale(0.97); }
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.shimmer { background:linear-gradient(90deg,#e8f0e7 25%,#d4e8d2 50%,#e8f0e7 75%); background-size:800px 100%; animation:shimmer 1.5s infinite; border-radius:16px; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Group Dashboard — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="content">Content</option>
    <option value="corpus_blocked">Corpus Blocked</option>
    <option value="loading">Loading</option>
    <option value="error">Error</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-[#F1F4EF] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2" style="background:#2E7D32">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-sm text-white">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto" style="height:732px; background:#F1F4EF"></div>
    <div id="bottom-nav"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 shrink-0" style="background:#2E7D32; padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-white">wifi</span>
      <span class="material-symbols-outlined text-sm text-white">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto flex-1" style="background:#F1F4EF"></div>
  <div id="embedded-bottom-nav"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) { document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col'); document.body.classList.add('embedded'); }
function getContentEl() { return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content'); }
function getNavEl() { return isEmbedded ? document.getElementById('embedded-bottom-nav') : document.getElementById('bottom-nav'); }

var demoData = {
  group: { name: "Mwangaza Women's Group", cycle: 1, cycleLength: 12, freq: 'Weekly', members: 5, overdueLoans: 0 },
  corpus: { current: 47500, opening: 0, contributions: 52500, loansOut: 5000 },
  config: { contribMin: 100, contribMax: 500, multiplier: 3.0, interest: 10, cycleMonths: 12, fine: 50, minDisb: 5000 },
  accounts: { savings: 52500, loansOut: 5000, activeLoan: 1 }
};

var activityFeed = [
  { type: 'MEETING', icon: 'meeting_room', desc: 'Weekly meeting conducted', date: '28 Apr 2026', member: 'Grace Mwangi', amt: null, color: '#2E7D32' },
  { type: 'DEPOSIT', icon: 'savings', desc: 'Savings contribution', date: '28 Apr 2026', member: 'Amara Diallo', amt: '+KES 500', color: '#2E7D32' },
  { type: 'DEPOSIT', icon: 'savings', desc: 'Savings contribution', date: '28 Apr 2026', member: 'Peter Otieno', amt: '+KES 500', color: '#2E7D32' },
  { type: 'LOAN', icon: 'account_balance', desc: 'Loan repayment received', date: '28 Apr 2026', member: 'Mary Akinyi', amt: '+KES 1,500', color: '#1565C0' },
  { type: 'DEPOSIT', icon: 'savings', desc: 'Savings contribution', date: '28 Apr 2026', member: 'Fatima Ouedraogo', amt: '+KES 500', color: '#2E7D32' },
];

function renderContent(corpusBlocked) {
  var d = demoData;
  return `
  <div>
    <!-- Top bar -->
    <div class="flex items-center px-4 py-3 gap-2" style="background:#2E7D32">
      <!-- back: navigates to group-list -->
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('group-list')">arrow_back</span>
      <span class="text-base font-bold text-white flex-1 truncate">${d.group.name}</span>
      <span class="material-symbols-outlined text-white cursor-pointer" onclick="showToast('More options')">more_vert</span>
    </div>

    <!-- Group header (primaryContainer) -->
    <div class="px-4 py-4" style="background:#C8E6C9;">
      <div class="text-xl font-bold text-[#1B5E20] mb-0.5">${d.group.name}</div>
      <div class="text-sm text-[#2E7D32] mb-2">Cycle ${d.group.cycle} of ${d.group.cycleLength} months · ${d.group.freq} meetings</div>
      <div class="flex gap-2 flex-wrap">
        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold" style="background:#FFE0B2; color:#E65100;">
          <span class="material-symbols-outlined text-xs" style="font-variation-settings:'FILL' 1">group</span>${d.group.members} members
        </span>
        <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold ${d.group.overdueLoans > 0 ? 'bg-[#FFDAD6] text-[#D32F2F]' : 'bg-[#E7E0EC] text-[#42493F]'}">
          <span class="material-symbols-outlined text-xs" style="font-variation-settings:'FILL' 1">warning</span>${d.group.overdueLoans} overdue
        </span>
      </div>
    </div>

    <div class="px-4 flex flex-col gap-3 pb-4 pt-3">
      <!-- Corpus Card (FR-018) -->
      <!-- GET /datatables/dt_group_corpus/{centerId} -->
      <div class="card p-5 ${corpusBlocked ? 'border-2 border-[#D32F2F]' : ''}">
        <div class="flex items-center gap-2 mb-1">
          <span class="material-symbols-outlined text-xl" style="color:#2E7D32; font-variation-settings:'FILL' 1">account_balance_wallet</span>
          <span class="text-base font-bold text-[#1A1C19]">Corpus Fund</span>
        </div>
        <div class="text-3xl font-bold mb-3" style="color:#2E7D32">KES ${d.corpus.current.toLocaleString()}</div>
        ${corpusBlocked ? `
        <div class="flex items-center gap-2 p-3 rounded-xl mb-3" style="background:#FFDAD6;">
          <span class="material-symbols-outlined text-[#D32F2F]" style="font-variation-settings:'FILL' 1">warning</span>
          <span class="text-sm text-[#D32F2F] font-medium">Loan disbursement is blocked — corpus balance is below minimum threshold.</span>
        </div>` : ''}
        <div class="grid grid-cols-3 gap-2">
          <div class="text-center p-2 rounded-lg" style="background:#F1F4EF">
            <div class="text-xs text-[#72796F]">Opening</div>
            <div class="text-sm font-bold text-[#1A1C19]">KES 0</div>
          </div>
          <div class="text-center p-2 rounded-lg" style="background:#F1F4EF">
            <div class="text-xs text-[#72796F]">Contributions</div>
            <div class="text-sm font-bold text-[#2E7D32]">KES 52,500</div>
          </div>
          <div class="text-center p-2 rounded-lg" style="background:#F1F4EF">
            <div class="text-xs text-[#72796F]">Loans Out</div>
            <div class="text-sm font-bold text-[#1565C0]">KES 5,000</div>
          </div>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="card p-4">
        <div class="text-sm font-semibold text-[#72796F] uppercase tracking-wide mb-3">Quick Actions</div>
        <div class="grid grid-cols-2 gap-3">
          <!-- tap: navigates to meeting-calendar -->
          <button class="action-btn" style="background:#E8F5E9;" onclick="showToast('Start Meeting → meeting-calendar')">
            <span class="material-symbols-outlined text-2xl" style="color:#2E7D32; font-variation-settings:'FILL' 1">meeting_room</span>
            <span class="text-sm font-semibold text-[#1B5E20]">Start Meeting</span>
          </button>
          <!-- tap: navigates to member-list -->
          <button class="action-btn border border-[#C8D8C5]" onclick="showToast('Members → member-list')">
            <span class="material-symbols-outlined text-2xl" style="color:#2E7D32;">group</span>
            <span class="text-sm font-semibold text-[#2E7D32]">Members</span>
          </button>
          <!-- tap: navigates to loan-list -->
          <button class="action-btn border border-[#C8D8C5]" onclick="showToast('Loans → loan-list')">
            <span class="material-symbols-outlined text-2xl" style="color:#2E7D32;">account_balance</span>
            <span class="text-sm font-semibold text-[#2E7D32]">Loans</span>
          </button>
          <!-- tap: navigates to share-out-preview (only at cycle end) -->
          <button class="action-btn border border-[#C8D8C5] opacity-50" onclick="showToast('Share-Out only available at cycle end')">
            <span class="material-symbols-outlined text-2xl text-[#72796F]">share</span>
            <span class="text-sm font-semibold text-[#72796F]">Share-Out</span>
          </button>
        </div>
      </div>

      <!-- Savings Summary -->
      <div class="card p-4">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-xl" style="color:#2E7D32; font-variation-settings:'FILL' 1">savings</span>
          <span class="text-base font-bold text-[#1A1C19]">Savings Summary</span>
        </div>
        <div class="text-sm text-[#42493F] mb-2">Mandatory contribution: KES 100 – KES 500 per meeting</div>
        <div class="text-xl font-bold" style="color:#1565C0">KES 52,500 <span class="text-sm font-normal text-[#72796F]">total</span></div>
      </div>

      <!-- Recent Activity -->
      <div class="card p-4">
        <div class="text-base font-bold text-[#1A1C19] mb-3">Recent Activity</div>
        ${activityFeed.map(a => `
          <div class="flex items-center gap-3 py-2.5 border-b border-slate-50 last:border-0">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background:${a.color}15">
              <span class="material-symbols-outlined text-lg" style="color:${a.color}; font-variation-settings:'FILL' 1">${a.icon}</span>
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold text-[#1A1C19] truncate">${a.desc}</div>
              <div class="text-xs text-[#72796F]">${a.date} · ${a.member}</div>
            </div>
            ${a.amt ? `<div class="text-sm font-bold" style="color:${a.color}">${a.amt}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  </div>`;
}

function renderLoading() {
  return `<div>
    <div class="flex items-center px-4 py-3 gap-2" style="background:#2E7D32">
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('group-list')">arrow_back</span>
      <span class="text-base font-bold text-white flex-1">Mwangaza Women's Group</span>
    </div>
    <div class="px-4 flex flex-col gap-3 pt-4">
      ${[80,120,160,140].map(h=>`<div class="shimmer" style="height:${h}px;"></div>`).join('')}
    </div>
  </div>`;
}

function renderError() {
  return `<div>
    <div class="flex items-center px-4 py-3 gap-2" style="background:#2E7D32">
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('group-list')">arrow_back</span>
      <span class="text-base font-bold text-white flex-1">Group Dashboard</span>
    </div>
    <div class="flex flex-col items-center py-16 px-6 text-center">
      <span class="material-symbols-outlined text-5xl text-[#72796F] mb-4">cloud_off</span>
      <p class="text-lg font-semibold text-[#1A1C19] mb-2">Could not load group</p>
      <p class="text-sm text-[#72796F] mb-6">Server error. Please retry.</p>
      <button class="px-6 py-3 rounded-full text-white font-semibold" style="background:#2E7D32;" onclick="switchState('content')">Retry</button>
    </div>
  </div>`;
}

function renderBottomNav() {
  var items = [
    { id: 'group-dashboard', icon: 'home', label: 'Dashboard' },
    { id: 'group-list', icon: 'group', label: 'Groups' },
    { id: 'meeting-calendar', icon: 'calendar_month', label: 'Meetings' },
    { id: 'settings', icon: 'settings', label: 'Settings' },
  ];
  getNavEl().innerHTML = '<div class="flex items-center justify-around py-2 bg-white border-t border-slate-100">' +
    items.map(n => `<div class="flex flex-col items-center gap-0.5 cursor-pointer ${n.id==='group-dashboard'?'text-[#2E7D32]':'text-slate-400'}" onclick="navigateTo('${n.id}')">
      <span class="material-symbols-outlined text-xl" ${n.id==='group-dashboard'?'style="font-variation-settings:\'FILL\' 1"':''}>${n.icon}</span>
      <span class="text-[10px]">${n.label}</span>
    </div>`).join('') + '</div>';
}

var currentState = 'content';
function switchState(s) {
  currentState = s || 'content';
  document.getElementById('statePicker').value = currentState;
  var html = '';
  if (s === 'loading') html = renderLoading();
  else if (s === 'error') html = renderError();
  else if (s === 'corpus_blocked') html = renderContent(true);
  else html = renderContent(false);
  getContentEl().innerHTML = html;
  renderBottomNav();
}

function navigateTo(t) {
  if (window !== window.top) window.parent.postMessage({action:'navigate',screenId:t},'*');
  else showToast('Navigate to: '+t);
}
function showToast(msg) {
  var t = document.createElement('div'); t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg'; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),2500);
}
function toggleDark() { document.querySelector('.phone')&&document.querySelector('.phone').classList.toggle('bg-slate-900'); }
window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state||'');
  if(e.data.action==='getInspectorData')notifyParent();
});
function notifyParent() {
  if(window===window.top)return;
  window.parent.postMessage({
    action:'screenLoaded',screenId:'group-dashboard',name:'Group Dashboard',
    feature:'group-management',status:'enriched',componentCount:9,
    states:[{id:'content',name:'Content'},{id:'corpus_blocked',name:'Corpus Blocked'},{id:'loading',name:'Loading'},{id:'error',name:'Error'}],
    inspectorData:{id:'group-dashboard',name:'Group Dashboard',feature:'group-management',status:'enriched',
      components:[
        {type:'top-bar',label:"Mwangaza Women's Group",target:'group-list'},
        {type:'card',label:'Group Header — Cycle 1',target:''},
        {type:'card',label:'Corpus Fund KES 47,500 (FR-018)',target:''},
        {type:'card',label:'Quick Actions Grid',target:''},
        {type:'button',label:'Start Meeting',target:'meeting-calendar'},
        {type:'button',label:'Members',target:'member-list'},
        {type:'button',label:'Loans',target:'loan-list'},
        {type:'card',label:'Savings Summary KES 52,500',target:''},
        {type:'list',label:'Recent Activity',target:''}
      ],states:{},incoming_from:['group-list']}
  },'*');
}
switchState('content');
notifyParent();
</script>
</body>
</html>
