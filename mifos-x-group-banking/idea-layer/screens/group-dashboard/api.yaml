sibling: api
schema_version: "4.0"
feature_id: group-dashboard

api:
  - id: get_center
    function: get_center
    method: get
    endpoint: "/centers/{centerId}"
    description: Fetch a single Fineract Center (group) by ID
    params:
      centerId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        id: Long
        name: String
        status: { id: Int, value: String }
        activationDate: List<Int>
        staffId: Long
        officeId: Long
        meetingSchedule: String
    errors:
      401: Unauthorized
      403: Forbidden
      404: Group not found
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_center_accounts
    function: get_center_accounts
    method: get
    endpoint: "/centers/{centerId}/accounts"
    description: Fetch savings and loan accounts linked to the group
    params:
      centerId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        savingsAccounts:
          type: array
          items:
            id: Long
            productName: String
            accountBalance: Double
            status: { id: Int, value: String }
        loanAccounts:
          type: array
          items:
            id: Long
            productName: String
            loanBalance: Double
            status: { id: Int, value: String }
    errors:
      401: Unauthorized
      404: Group not found
      500: Server error
    cache:
      ttl: 180
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_group_corpus
    function: get_group_corpus
    method: get
    endpoint: "/datatables/dt_group_corpus/{centerId}"
    description: Fetch real-time corpus (fund balance) for the group from custom datatable
    params:
      centerId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        currentBalance: Double
        openingBalance: Double
        totalContributionsThisCycle: Double
        totalLoansOutstanding: Double
        lastUpdated: String
    errors:
      401: Unauthorized
      404: Corpus record not found — show zero balance
      500: Server error
    cache:
      ttl: 60
      strategy: network-first
      offline: show_cached

  - id: get_group_config
    function: get_group_config
    method: get
    endpoint: "/datatables/dt_group_config/{centerId}"
    description: Fetch group configuration rules (contribution rates, loan multiplier, etc.)
    params:
      centerId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        contributionMin: Double
        contributionMax: Double
        loanMultiplier: Double
        interestRate: Double
        cycleLengthMonths: Int
        fineAmount: Double
        minimumDisbursementThreshold: Double
    errors:
      401: Unauthorized
      404: Config not found
      500: Server error
    cache:
      ttl: 600
      strategy: stale-while-revalidate
      offline: show_cached

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached

dtos:
  Group:
    id: String
    fineractCenterId: Long
    name: String
    cycleNumber: Int
    cycleLengthMonths: Int
    meetingFrequency: String
    memberCount: Int
    overdueLoansCount: Int
    status: String

  GroupCorpus:
    currentBalance: Double
    openingBalance: Double
    totalContributionsThisCycle: Double
    totalLoansOutstanding: Double
    lastUpdated: String

  GroupConfig:
    contributionMin: Double
    contributionMax: Double
    loanMultiplier: Double
    interestRate: Double
    cycleLengthMonths: Int
    fineAmount: Double
    minimumDisbursementThreshold: Double

  GroupAccounts:
    savingsBalance: Double
    loansOutstanding: Double
    activeLoanCount: Int

  ActivityItem:
    id: String
    type: String        # MEETING | DEPOSIT | LOAN | PENALTY | SHARE_OUT
    description: String
    amount: Double?
    date: String
    memberName: String?
