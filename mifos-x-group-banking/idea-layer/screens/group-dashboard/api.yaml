sibling: api
schema_version: "4.0"
feature_id: group-dashboard

api:
  - id: get_group
    function: get_group
    method: get
    endpoint: "/companion/groups/{groupId}"    # COMP-GRP-001 read path — returns group + typeConfig in one call
    description: >
      Fetch group details including group_type_config via companion API. Returns group identity,
      cycle info, and the full GroupTypeConfig that drives metric card selection (ACCUMULATING vs ROTATING_PAYOUT).
    params:
      groupId: { type: String, required: true, source: nav_params }
    response:
      type: object
      fields:
        id: String
        fineractGroupId: Long
        name: String
        cycleNumber: Int
        cycleLengthMonths: Int
        meetingFrequency: String
        memberCount: Int
        overdueLoansCount: Int
        status: String
        typeConfig: GroupTypeConfig
    errors:
      401: Unauthorized
      403: Forbidden
      404: Group not found
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_viewer_role
    function: get_viewer_role
    method: get
    endpoint: "/companion/groups/{groupId}/my-role"    # reads dt_member_role for current user
    description: "Resolve the authenticated user's role in this specific group from dt_member_role"
    params:
      groupId: { type: String, required: true, source: nav_params }
    response:
      type: object
      fields:
        role: String    # ORGANIZER | MEMBER | TREASURER | CHAIRPERSON | SECRETARY
        memberId: Long
    errors:
      401: Unauthorized
      404: Not a member of this group
      500: Server error
    cache:
      ttl: 600
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_group_corpus
    function: get_group_corpus
    method: get
    endpoint: "/companion/groups/{groupId}/corpus"
    description: >
      Fetch corpus for ACCUMULATING types (currentBalance, contributions, loans-outstanding) or
      rotation state for ROTATING_PAYOUT types (rotationPosition, nextRecipientName, poolAmount).
    params:
      groupId: { type: String, required: true, source: nav_params }
    response:
      type: object
      fields:
        currentBalance: Double
        openingBalance: Double
        totalContributionsThisCycle: Double
        totalLoansOutstanding: Double
        lastUpdated: String
        isCycleEnd: Boolean          # true when the group's savings cycle has reached its end and Share-Out is available (backs GroupDashboardState.isCycleEnd; gates the Share-Out action)
        rotationPosition: "Int?"
        nextRecipientName: "String?"
        nextRecipientPosition: "Int?"
    errors:
      401: Unauthorized
      404: Corpus record not found
      500: Server error
    cache:
      ttl: 60
      strategy: network-first
      offline: show_cached

  - id: get_group_accounts
    function: get_group_accounts
    method: get
    endpoint: "/companion/groups/{groupId}/accounts"
    description: >
      Fetch savings and loan account summary including shareOutProjection (ACCUMULATING types only)
      and the last 10 recent activity items (meetings, deposits, loans, penalties, share-outs)
      for the activity_feed_section on the group dashboard.
    params:
      groupId: { type: String, required: true, source: nav_params }
    response:
      type: object
      fields:
        savingsBalance: Double
        loansOutstanding: Double
        activeLoanCount: Int
        shareOutProjection: "Double?"
        recentActivity: "List<ActivityItem>"
    errors:
      401: Unauthorized
      404: Group not found
      500: Server error
    cache:
      ttl: 180
      strategy: stale-while-revalidate
      offline: show_cached

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached

dtos:
  GroupTypeConfig:
    group_type: String
    pool_model: String          # ROTATING_PAYOUT | ACCUMULATING | NONE
    contribution_model: String  # FIXED_AMOUNT | SHARE_BASED_VARIABLE | FIXED_NEGOTIATED
    shareout_formula: String
    payout_order_method: String
    share_value: Double
    contribution_amount: Double
    social_fund_enabled: Boolean
    cycle_length_months: Int
    loan_multiplier: Double
    interest_rate: Double
    fine_amount: Double

  Group:
    id: String
    fineractGroupId: Long
    name: String
    cycleNumber: Int
    cycleLengthMonths: Int
    meetingFrequency: String
    memberCount: Int
    overdueLoansCount: Int
    status: String
    typeConfig: GroupTypeConfig

  GroupCorpus:
    currentBalance: Double
    openingBalance: Double
    totalContributionsThisCycle: Double
    totalLoansOutstanding: Double
    lastUpdated: String
    isCycleEnd: Boolean          # server-computed cycle-end flag; backs GroupDashboardState.isCycleEnd (Share-Out gate)
    rotationPosition: "Int?"
    nextRecipientName: "String?"
    nextRecipientPosition: "Int?"

  GroupAccounts:
    savingsBalance: Double
    loansOutstanding: Double
    activeLoanCount: Int
    shareOutProjection: "Double?"

  ViewerRole:
    role: String
    memberId: Long

  ActivityItem:
    id: String
    type: String        # MEETING | DEPOSIT | LOAN | PENALTY | SHARE_OUT
    description: String
    amount: "Double?"
    date: String
    memberName: "String?"

  GroupConfig:
    # Client-side DTO mapped from GroupTypeConfig fields. Not returned directly by any API endpoint;
    # constructed in GroupRepository from the GroupTypeConfig embedded in get_group response.
    # Backs ui.yaml savings_summary_card bindings: config.shareValue, config.shareMin,
    # config.shareMax, config.contributionAmount, config.loanMultiplier, config.interestRate.
    shareValue: "Double?"
    shareMin: "Int?"
    shareMax: "Int?"
    contributionAmount: "Double?"
    loanMultiplier: "Double?"
    interestRate: "Double?"
    cycleLengthMonths: Int
    fineAmount: "Double?"
    minimumDisbursementThreshold: "Double?"
