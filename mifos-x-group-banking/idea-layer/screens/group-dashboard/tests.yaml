sibling: tests
schema_version: "4.0"
feature_id: group-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GD-001
      scenario: "On mount, group + typeConfig + viewer role + corpus + accounts fetch in parallel and Content renders on success"
      type: ViewModel
      priority: P0
      given: "groupId='GRP-001' and viewerRole from nav args"
      when: "GroupDashboardScreen enters composition"
      then: "companion API COMP-GRP-001 read path dispatches group, group_type_config, dt_member_role, corpus, accounts concurrently; isLoading=false; Content state with group name, typeConfig, viewerRole resolved"

    - id: TC-GD-002
      scenario: "Header card shows group name, cycle info, group-type chip and viewer role chip"
      type: Screen
      priority: P0
      given: "Content: group name='Mwangaza Women's Group', cycleNumber=1, cycleLengthMonths=12, groupTypeName='VSLA', viewerRole='ORGANIZER'"
      when: "group_header_card renders"
      then: "headline shows group name; cycle line 'Cycle 1 of 12 months • Weekly meetings'; group_type_chip='VSLA'; viewer_role_chip='organizer'; member_count_chip='20 members'"

    - id: TC-GD-003
      scenario: "ACCUMULATING pool_model renders corpus_card, not rotation_card"
      type: Screen
      priority: P0
      given: "typeConfig.pool_model='ACCUMULATING' (VSLA), corpus.currentBalance=47500.00"
      when: "Content state rendered"
      then: "corpus_card visible showing 'KES 47,500'; rotation_card NOT visible"

    - id: TC-GD-004
      scenario: "ROTATING_PAYOUT pool_model renders rotation_card with position and next recipient, not corpus_card"
      type: Screen
      priority: P0
      given: "typeConfig.pool_model='ROTATING_PAYOUT' (ROSCA), rotationPosition=7, nextRecipientName='Amina Hassan', nextRecipientPosition=4"
      when: "Content state rendered"
      then: "rotation_card visible showing 'Your position: #7' and next_recipient_chip 'Amina Hassan (#4)'; corpus_card NOT visible"

    - id: TC-GD-005
      scenario: "shareOutProjection line renders inside corpus_card for ACCUMULATING types when present"
      type: Screen
      priority: P1
      given: "ACCUMULATING type with shareOutProjection=2750.00"
      when: "corpus_card renders"
      then: "shareout_projection_text visible showing 'Projected share-out: KES 2,750'"

    - id: TC-GD-006
      scenario: "isCorpusInsufficient computed true when corpus balance below GroupTypeConfig minimum threshold"
      type: ViewModel
      priority: P0
      given: "corpus.currentBalance=4000.00, config.minimumDisbursementThreshold=5000.00"
      when: "state derivation runs after load"
      then: "isCorpusInsufficient=true; corpus_card renders error border and corpus_blocked_banner"

    - id: TC-GD-007
      scenario: "isCorpusInsufficient false and blocked banner hidden when corpus meets threshold"
      type: ViewModel
      priority: P0
      given: "corpus.currentBalance=47500.00, config.minimumDisbursementThreshold=5000.00"
      when: "state derivation runs"
      then: "isCorpusInsufficient=false; corpus_blocked_banner not shown; border sufficient/transparent"

    - id: TC-GD-008
      scenario: "Management quick-actions grid shown for ORGANIZER/CHAIRPERSON/TREASURER; member grid hidden"
      type: Screen
      priority: P1
      given: "viewerRole='ORGANIZER'"
      when: "quick_actions_section renders"
      then: "management_actions_grid visible with Start Meeting, Members, Loans, Share-Out; member_actions_grid NOT visible"

    - id: TC-GD-009
      scenario: "Member read-only quick-actions grid shown for MEMBER; management grid hidden"
      type: Screen
      priority: P1
      given: "viewerRole='MEMBER'"
      when: "quick_actions_section renders"
      then: "member_actions_grid visible with My Savings, My Loans, Meetings, Members; management_actions_grid NOT visible"

    - id: TC-GD-010
      scenario: "OnStartMeeting navigates to meeting-calendar when corpus sufficient (organizer/chairperson)"
      type: ViewModel
      priority: P0
      given: "viewerRole='ORGANIZER', isCorpusInsufficient=false, groupId='GRP-001'"
      when: "start_meeting_button OnStartMeeting fires"
      then: "navigate effect to meeting-calendar with groupId; no ShowCorpusBlockedDialog"

    - id: TC-GD-011
      scenario: "OnStartMeeting emits ShowCorpusBlockedDialog when corpus insufficient"
      type: ViewModel
      priority: P1
      given: "viewerRole='ORGANIZER', isCorpusInsufficient=true"
      when: "OnStartMeeting fires"
      then: "ShowCorpusBlockedDialog emitted; navigation to meeting-calendar suppressed"

    - id: TC-GD-012
      scenario: "OnViewMembers navigates to member-list with correct groupId"
      type: Screen
      priority: P0
      given: "Content, groupId='GRP-001'"
      when: "view_members_button OnViewMembers fires"
      then: "navigate effect to member-list with groupId='GRP-001'"

    - id: TC-GD-013
      scenario: "OnViewLoans navigates to loan-list with correct groupId (management and member paths)"
      type: Screen
      priority: P0
      given: "Content, groupId='GRP-001'"
      when: "view_loans_button (or member view_loans) OnViewLoans fires"
      then: "navigate effect to loan-list with groupId='GRP-001'"

    - id: TC-GD-014
      scenario: "Share-Out button enabled and navigates to share-out-preview only when isCycleEnd and organizer/treasurer"
      type: ViewModel
      priority: P1
      given: "viewerRole='ORGANIZER', isCycleEnd=true, typeConfig ACCUMULATING with shareout_formula PRORATA_SHARES"
      when: "share_out_button OnShareOut fires"
      then: "navigate effect to share-out-preview with groupId and distributionStrategy; shareout_formula applied"

    - id: TC-GD-015
      scenario: "Share-Out disabled and emits snackbar 'share_out_not_available' when isCycleEnd is false"
      type: ViewModel
      priority: P1
      given: "viewerRole='ORGANIZER', isCycleEnd=false"
      when: "OnShareOut fires while share_out_button disabled"
      then: "no navigation; ShowSnackbar 'share_out_not_available' emitted; button in disabled style"

    - id: TC-GD-016
      scenario: "MEMBER OnViewSavings navigates to member-savings-detail"
      type: Screen
      priority: P1
      given: "viewerRole='MEMBER', groupId='GRP-001'"
      when: "view_savings_button OnViewSavings fires"
      then: "navigate effect to member-savings-detail with groupId"

    - id: TC-GD-017
      scenario: "Savings summary contribution model text adapts to typeConfig.contribution_model"
      type: Screen
      priority: P1
      given: "SHARE_BASED_VARIABLE with shareValue=200, shareMin=1, shareMax=5 vs FIXED_AMOUNT with contribution_amount=2000"
      when: "savings_summary_card renders"
      then: "SHARE_BASED_VARIABLE shows 'Share-based: KES 200 / share · 1–5 shares / meeting'; FIXED shows 'Fixed: KES 2000 per meeting'"

    - id: TC-GD-018
      scenario: "overdueLoansCount > 0 shows the overdue chip in the header badges row"
      type: Screen
      priority: P1
      given: "group.overdueLoansCount=3"
      when: "header_badges_row renders"
      then: "overdue_loans_chip visible showing '3 overdue' in errorContainer; hidden when overdueLoansCount==0"

    - id: TC-GD-019
      scenario: "Recent activity feed renders ActivityItem rows with description, date·member, and amount"
      type: Screen
      priority: P1
      given: "recentActivity has contribution and loan-repayment ActivityItems"
      when: "activity_feed_section renders"
      then: "each activity_list_item shows description headline, '{date} • {memberName}' supporting, and 'KES {amount}' trailing"

    - id: TC-GD-020
      scenario: "OnMoreOptions toggles the top-bar overflow menu (local state only)"
      type: Screen
      priority: P2
      given: "Content state"
      when: "top-bar more_vert OnMoreOptions fires"
      then: "group-dashboard-more-menu expands via Compose DropdownMenu; transform_state only, no network call"

    - id: TC-GD-021
      scenario: "404 from get_group shows group-not-found error state"
      type: ViewModel
      priority: P0
      given: "companion get_group returns 404"
      when: "on mount"
      then: "GroupDashboardError type=NotFound set; error_state shown with 'Group not found.'; other parallel calls cancelled"

    - id: TC-GD-022
      scenario: "Auth 401 sets Auth error and redirects to login"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "any companion call returns 401"
      then: "GroupDashboardError type=Auth (redirect=login); navigation to login triggered"

    - id: TC-GD-023
      scenario: "Retry re-triggers the parallel companion fetch with cache invalidation"
      type: ViewModel
      priority: P1
      given: "error!=null after a Network failure"
      when: "error_state Retry fires"
      then: "cmp-network-monitor connectivity checked; get_group + get_viewer_role + get_group_corpus + get_group_accounts re-dispatched with cache invalidation; call_api effect asserted"

    - id: TC-GD-024
      scenario: "Offline with cached data renders group + corpus with offline banner"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor offline; companion cache holds group and corpus"
      when: "on mount"
      then: "cached group and corpus rendered; offline banner shown; no hard error state"

    - id: TC-GD-025
      scenario: "OnBack pops the back stack returning to group-list or group-create"
      type: Screen
      priority: P2
      given: "Content state entered from group-list"
      when: "top-bar navigation OnBack fires"
      then: "navigate effect pops back stack to previous screen; no network call"

    - id: TC-GD-026
      scenario: "Loading state shows dashboard shimmer while parallel companion calls are in flight"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "loading state rendered"
      then: "shimmer_dashboard (count 4) shown with top_bar; metric cards and quick actions not yet rendered"

    - id: TC-GD-027
      scenario: "CorpusRepository get_group_corpus uses network_first with TTL 60s"
      type: Repository
      priority: P1
      given: "get_group_corpus fetched and cached"
      when: "a second read within 60s TTL"
      then: "network_first strategy returns cached corpus within TTL; refetch after expiry"

    - id: TC-GD-028
      scenario: "group_type_config cache uses stale_while_revalidate 300s; remount within TTL does not refetch"
      type: Repository
      priority: P2
      given: "typeConfig fetched and cached at t0"
      when: "screen remounts at t0+120s"
      then: "cached typeConfig served immediately; no new fetch until 300s TTL expiry"
