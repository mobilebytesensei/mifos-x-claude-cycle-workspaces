sibling: tests
schema_version: "4.0"
feature_id: group-dashboard
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GD-001
      scenario: "On mount, group details, viewer role, corpus and accounts load in parallel via companion API"
      type: ViewModel
      priority: P0
      given: "groupId='g1' in nav_params; network online"
      when: "GroupDashboardScreen enters composition"
      then: "GET /companion/groups/g1, GET /companion/groups/g1/my-role, GET corpus, GET accounts all dispatched concurrently; isLoading flips false on all resolved; GroupDashboardScreenState=Content"

    - id: TC-GD-002
      scenario: "ACCUMULATING type shows corpus + shareout projection metric cards"
      type: Screen
      priority: P0
      given: "typeConfig.pool_model=ACCUMULATING; shareOutProjection=45000.0; corpus loaded"
      when: "Content renders"
      then: "Corpus balance card visible; ShareOut Projection card shows KES 45000; rotation position / next-recipient card NOT shown"

    - id: TC-GD-003
      scenario: "ROTATING_PAYOUT type shows rotation position and next-recipient chip instead of corpus card"
      type: Screen
      priority: P0
      given: "typeConfig.pool_model=ROTATING_PAYOUT; rotationPosition=3; nextRecipientName='Jane'"
      when: "Content renders"
      then: "Rotation position card shows '3'; next-recipient chip shows 'Jane'; shareOut projection card NOT shown"

    - id: TC-GD-004
      scenario: "Organizer/treasurer/chairperson see management actions (Start Meeting, Members, Loans, Share-Out)"
      type: Screen
      priority: P0
      given: "viewerRole=ORGANIZER; Content state"
      when: "QuickActions renders"
      then: "Start Meeting, Members, Loans, Share-Out actions visible and enabled"

    - id: TC-GD-005
      scenario: "MEMBER role sees only read-only quick actions"
      type: Screen
      priority: P0
      given: "viewerRole=MEMBER; Content state"
      when: "QuickActions renders"
      then: "View savings, View loans, Meetings actions visible; management actions (Start Meeting, Share-Out) NOT shown"

    - id: TC-GD-006
      scenario: "OnStartMeeting navigates to meeting-calendar with groupId"
      type: Screen
      priority: P0
      given: "viewerRole=ORGANIZER; Content loaded"
      when: "OnStartMeeting action fires"
      then: "NavigateToMeetingCalendar event emitted with groupId='g1'"

    - id: TC-GD-007
      scenario: "OnViewMembers navigates to member-list"
      type: Screen
      priority: P1
      given: "viewerRole=ORGANIZER; Content loaded"
      when: "OnViewMembers fires"
      then: "NavigateToMemberList event emitted with groupId='g1'"

    - id: TC-GD-008
      scenario: "Share-Out gated by corpus insufficiency shows blocked dialog instead of navigation"
      type: ViewModel
      priority: P1
      given: "isCorpusInsufficient=true; viewerRole=ORGANIZER"
      when: "OnShareOut fires"
      then: "ShowCorpusBlockedDialog event emitted; NavigateToShareOut NOT emitted"

    - id: TC-GD-009
      scenario: "Share-Out navigates to share-out-preview when corpus is sufficient"
      type: ViewModel
      priority: P1
      given: "isCorpusInsufficient=false; viewerRole=ORGANIZER"
      when: "OnShareOut fires"
      then: "NavigateToShareOut emitted with groupId and typeConfig.shareout_formula as distributionStrategy"

    - id: TC-GD-010
      scenario: "Group type badge shows correct VSLA/ROSCA/SHG label from groupTypeName"
      type: Screen
      priority: P1
      given: "groupTypeName='VSLA'; Content loaded"
      when: "GroupHeader renders"
      then: "Group type badge displays 'VSLA'; viewer role chip shows current role"

    - id: TC-GD-011
      scenario: "Error state shows retry CTA on network or server failure"
      type: Screen
      priority: P1
      given: "GET /companion/groups/g1 returns 500"
      when: "load completes with error"
      then: "GroupDashboardScreenState=Error; error card with retry CTA shown; content area hidden"

    - id: TC-GD-012
      scenario: "OnRetry re-fetches all parallel calls on retry tap"
      type: ViewModel
      priority: P1
      given: "error state active from prior 500"
      when: "OnRetry fires"
      then: "all 4 parallel Fineract/companion calls re-dispatched; GroupDashboardScreenState transitions back to Loading then Content on success"

    - id: TC-GD-013
      scenario: "404 group not found transitions to NotFound error (no retry)"
      type: ViewModel
      priority: P1
      given: "GET /companion/groups/invalid returns 404"
      when: "load completes"
      then: "GroupDashboardError type=NotFound retry=false; GroupDashboardScreenState=Error; no retry CTA"

    - id: TC-GD-014
      scenario: "Auth 401 redirects to login"
      type: ViewModel
      priority: P0
      given: "session token expired"
      when: "any companion API call returns 401"
      then: "GroupDashboardError type=Auth redirect=login; NavigateToLogin event emitted"

    - id: TC-GD-015
      scenario: "Offline with cache shows cached group data with stale-while-revalidate banner"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor offline; SQLDelight cache has group data within 300s TTL"
      when: "LoadGroupDashboard runs"
      then: "cached group, corpus and accounts rendered; stale banner shown; no error state"
