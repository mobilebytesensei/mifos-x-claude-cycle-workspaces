sibling: tests
schema_version: "4.0"
feature_id: group-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GD-001
      scenario: "On mount, all four APIs fire in parallel and screen shows Content state on success"
      type: ViewModel
      priority: P0

    - id: TC-GD-002
      scenario: "Corpus balance tile shows currentBalance formatted as KES with correct value"
      type: Screen
      priority: P0

    - id: TC-GD-003
      scenario: "Member count tile shows correct memberCount from Group DTO"
      type: Screen
      priority: P0

    - id: TC-GD-004
      scenario: "Loans outstanding tile shows correct loansOutstanding from GroupAccounts DTO"
      type: Screen
      priority: P0

    - id: TC-GD-005
      scenario: "isCorpusInsufficient is true when corpus.currentBalance < config.minimumDisbursementThreshold"
      type: ViewModel
      priority: P0

    - id: TC-GD-006
      scenario: "isCorpusInsufficient false when corpus balance meets threshold"
      type: ViewModel
      priority: P0

    - id: TC-GD-007
      scenario: "Start Meeting button navigates to meeting-calendar"
      type: Screen
      priority: P0

    - id: TC-GD-008
      scenario: "View Members button navigates to member-list with correct groupId param"
      type: Screen
      priority: P0

    - id: TC-GD-009
      scenario: "View Loans button navigates to loan-list with correct groupId param"
      type: Screen
      priority: P0

    - id: TC-GD-010
      scenario: "Share Out button navigates to share-out-preview only when isCycleEnd = true"
      type: ViewModel
      priority: P1

    - id: TC-GD-011
      scenario: "Share Out button shows snackbar 'share_out_not_available' when isCycleEnd = false"
      type: ViewModel
      priority: P1

    - id: TC-GD-012
      scenario: "Activity feed renders last 5 ActivityItems with correct type icons and amounts"
      type: Screen
      priority: P1

    - id: TC-GD-013
      scenario: "404 from get_center shows group-not-found error state"
      type: ViewModel
      priority: P0

    - id: TC-GD-014
      scenario: "When offline with cached data, corpus and group info render with offline banner"
      type: ViewModel
      priority: P1

    - id: TC-GD-015
      scenario: "Pull-to-refresh invalidates all four caches and re-fetches in parallel"
      type: ViewModel
      priority: P1

    - id: TC-GD-016
      scenario: "CorpusRepository.getCorpus uses network-first strategy with TTL 60s"
      type: Repository
      priority: P1

    - id: TC-GD-017
      scenario: "GroupConfig cache TTL is 600 seconds (stale-while-revalidate)"
      type: Repository
      priority: P2

    - id: TC-GD-018
      scenario: "overdueLoansCount > 0 shows alert chip on loans tile"
      type: Screen
      priority: P1

    - id: TC-GD-019
      scenario: "Group name from get_center displays in screen header / AppBar"
      type: Screen
      priority: P0
