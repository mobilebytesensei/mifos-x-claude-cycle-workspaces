sibling: tests
schema_version: "4.0"
feature_id: group-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GD-001
      scenario: "On mount, get_group + get_viewer_role + get_group_corpus + get_group_accounts fire in parallel; Content state on all success"
      type: ViewModel
      priority: P0
      given: "groupId='GRP-001' from nav arg"
      when: "GroupDashboardScreen enters composition"
      then: "4 parallel companion API calls dispatched; isLoading=false; Content state rendered with group name, corpus, accounts, viewerRole"

    - id: TC-GD-002
      scenario: "Corpus balance tile shows currentBalance formatted as KES with correct value"
      type: Screen
      priority: P0

    - id: TC-GD-003
      scenario: "Member count tile shows correct memberCount from GroupSummary DTO"
      type: Screen
      priority: P0

    - id: TC-GD-004
      scenario: "Loans outstanding tile shows correct loansOutstanding from GroupAccounts DTO"
      type: Screen
      priority: P0

    - id: TC-GD-005
      scenario: "isCorpusInsufficient is true when corpus.currentBalance < typeConfig.minimumDisbursementThreshold"
      type: ViewModel
      priority: P0

    - id: TC-GD-006
      scenario: "isCorpusInsufficient false when corpus balance meets threshold"
      type: ViewModel
      priority: P0

    - id: TC-GD-007
      scenario: "Start Meeting button navigates to meeting-calendar"
      type: Screen
      priority: P0

    - id: TC-GD-008
      scenario: "View Members button navigates to member-list with correct groupId param"
      type: Screen
      priority: P0

    - id: TC-GD-009
      scenario: "View Loans button navigates to loan-list with correct groupId param"
      type: Screen
      priority: P0

    - id: TC-GD-010
      scenario: "Share Out button navigates to share-out-preview only when isCycleEnd = true"
      type: ViewModel
      priority: P1

    - id: TC-GD-011
      scenario: "Share Out button shows snackbar 'share_out_not_available' when isCycleEnd = false"
      type: ViewModel
      priority: P1

    - id: TC-GD-012
      scenario: "Activity feed renders last 5 ActivityItems with correct type icons and amounts"
      type: Screen
      priority: P1

    - id: TC-GD-013
      scenario: "404 from get_group shows group-not-found error state"
      type: ViewModel
      priority: P0
      given: "get_group companion call returns 404"
      when: "On mount"
      then: "Error state shown with 'Group not found' message; other 3 calls cancelled"

    - id: TC-GD-014
      scenario: "When offline with cached data, corpus and group info render with offline banner"
      type: ViewModel
      priority: P1

    - id: TC-GD-015
      scenario: "Pull-to-refresh invalidates all four companion caches and re-fetches in parallel"
      type: ViewModel
      priority: P1

    - id: TC-GD-016
      scenario: "GroupCorpusRepository uses network_first strategy with TTL 60s for get_group_corpus"
      type: Repository
      priority: P1

    - id: TC-GD-017
      scenario: "group_type_config_cache stale_while_revalidate 300s; subsequent mount does not refetch within TTL"
      type: Repository
      priority: P2

    - id: TC-GD-018
      scenario: "overdueLoansCount > 0 shows alert chip on loans tile"
      type: Screen
      priority: P1

    - id: TC-GD-019
      scenario: "Group name from get_group GroupSummary displays in screen header / AppBar"
      type: Screen
      priority: P0
      given: "get_group returns GroupSummary with name='Mwangaza Women’s Group'"
      when: "Content state rendered"
      then: "AppBar title shows 'Mwangaza Women’s Group'"

    - id: TC-GD-020
      scenario: "ACCUMULATING pool_model renders shareOutProjection card, not rotation card"
      type: Screen
      priority: P0
      given: "typeConfig.pool_model=ACCUMULATING, shareOutProjection from corpus"
      when: "Content state rendered"
      then: "ShareOutProjection card visible; RotationPosition card NOT visible"

    - id: TC-GD-021
      scenario: "ROTATING_PAYOUT pool_model renders rotationPosition + nextRecipientName card"
      type: Screen
      priority: P0
      given: "typeConfig.pool_model=ROTATING_PAYOUT, rotationPosition=3, nextRecipientName='Grace Wairimu'"
      when: "Content state rendered"
      then: "RotationPosition card visible showing position 3 and 'Grace Wairimu'; ShareOutProjection card NOT visible"

    - id: TC-GD-022
      scenario: "viewerRole=ORGANIZER shows admin action buttons (Disburse, Schedule Meeting)"
      type: Screen
      priority: P1
      given: "get_viewer_role returns viewerRole=ORGANIZER"
      when: "Content state rendered"
      then: "Disburse and Schedule Meeting buttons visible"

    - id: TC-GD-023
      scenario: "viewerRole=MEMBER hides organizer-only action buttons"
      type: Screen
      priority: P1
      given: "get_viewer_role returns viewerRole=MEMBER"
      when: "Content state rendered"
      then: "Disburse and Schedule Meeting buttons NOT visible"
