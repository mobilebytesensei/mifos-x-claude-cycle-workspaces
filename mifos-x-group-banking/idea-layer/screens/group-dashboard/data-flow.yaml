sibling: data-flow
schema_version: "2.1.0"
feature_id: group-dashboard

entries:
  - screen_id: groupDashboardScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_center, transport: rest, method: get }
      - { api_id: get_center_accounts, transport: rest, method: get }
      - { api_id: get_group_corpus, transport: rest, method: get }
      - { api_id: get_group_config, transport: rest, method: get }
    tables: []
    dtos:
      - { name: Group, role: response, api_id: get_center }
      - { name: GroupAccounts, role: response, api_id: get_center_accounts }
      - { name: GroupCorpus, role: response, api_id: get_group_corpus }
      - { name: GroupConfig, role: response, api_id: get_group_config }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 180
      key_template: "group_dashboard:{groupId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: show_error, message_key: error_group_not_found }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      All four calls fire in parallel on mount. After success, derived state is computed:
      isCorpusInsufficient = corpus.currentBalance < config.minimumDisbursementThreshold,
      isCycleEnd = group.cycleWeek == group.cycleLengthWeeks.
      GroupCorpus uses network-first (TTL 60s) — balances change frequently.
      GroupConfig uses stale-while-revalidate (TTL 600s) — rules rarely change.

  - screen_id: groupDashboardScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_center, transport: rest, method: get }
      - { api_id: get_center_accounts, transport: rest, method: get }
      - { api_id: get_group_corpus, transport: rest, method: get }
      - { api_id: get_group_config, transport: rest, method: get }
    tables: []
    dtos:
      - { name: Group, role: response, api_id: get_center }
      - { name: GroupCorpus, role: response, api_id: get_group_corpus }
      - { name: GroupAccounts, role: response, api_id: get_center_accounts }
      - { name: GroupConfig, role: response, api_id: get_group_config }
    produces_state: Content
    auth_required: true
    cache:
      strategy: network_first
      ttl_seconds: 180
      key_template: "group_dashboard:{groupId}"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
    notes: Pull-to-refresh invalidates all caches and re-fetches all four endpoints in parallel.
