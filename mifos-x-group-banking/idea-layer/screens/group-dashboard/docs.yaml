id: group-dashboard
name: Group Dashboard
description: >
  Central hub for a single savings group under the unified-identity / per-group-role model. Entry from group-list with
  viewerRole resolved from dt_member_role. Header shows group name + GROUP-TYPE badge (VSLA/ROSCA/etc.) + viewer role
  chip. Metric cards are TYPE-AWARE: ACCUMULATING types (VSLA/SILC/ASCA/SHG) show corpus card with shareout projection;
  ROTATING_PAYOUT types (ROSCA) show rotation card with viewer's position + next-recipient chip. Quick actions are
  ROLE-GATED: organizer/chairperson/treasurer see management actions (Start Meeting, Members, Loans, Share-Out); member
  sees read-only view (My Savings, My Loans, Meetings, Members). All data sourced from companion API (COMP-GRP-001 read
  path for group + typeConfig + corpus; /my-role for role resolution). Covers FR-018, FR-021, FR-023 (per-group role
  display).
feature: group-management
flow: group-management-flow
version: 2.0.0
tags:
  - group-management
  - corpus-tracking
  - role-gated
  - group-type-aware
  - dashboard
  - offline-first
  - companion-api
  - FR-018
  - FR-021
  - FR-023
