sibling: docs
schema_version: "4.0"
feature_id: group-dashboard
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - has_offline_cache

id: group-dashboard
name: Group Dashboard
description: >
  Central hub for a single savings group. Displays group identity, corpus fund balance (FR-018),
  savings summary, member/loan stats, and quick-action buttons. Corpus card blocks loan
  disbursement when the fund balance is insufficient. Includes a recent activity feed and
  navigation to meeting calendar, member list, loan list, and share-out preview.
feature: group-management
flow: group-management-flow
version: "1.0.0"
tags:
  - group-management
  - corpus-tracking
  - admin
  - dashboard
  - offline-first
  - FR-018

status: designed
quality_score: 90
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system
  - status: designed
    at: "2026-05-08T23:00:00Z"
    by: /idea export

entry_point: false
bottom_nav:
  visible: true
  selected_tab: groups

legacy_metadata:
  analytics:
    screen_view: group_dashboard_viewed
    events:
      - trigger: start meeting tap
        name: meeting_started
        params: { group_id: String }
      - trigger: view members tap
        name: member_list_opened
        params: { group_id: String }
      - trigger: view loans tap
        name: loan_list_opened
        params: { group_id: String }
      - trigger: share-out tap
        name: share_out_initiated
        params: { group_id: String, cycle_end: Boolean }
      - trigger: corpus block banner shown
        name: corpus_block_triggered
        params: { group_id: String, balance: Double }
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/group-management/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/group-management/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/group-management/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/group-management/"
