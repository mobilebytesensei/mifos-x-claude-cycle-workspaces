# ─────────────────────────────────────────────────────────────────────────────
# E2E — full READ journey against LIVE mifos-bank-2: login → organizer-dashboard
#        → group-list → group-dashboard → member-list (3 real members)
# ─────────────────────────────────────────────────────────────────────────────
# Every screen renders real mifos-bank-2 data via the mcp-mifosx Go companion:
#   login (userId 56) → organizer-dashboard (/companion/organizer/dashboard) →
#   group-list (/companion/groups/mine → Mwangaza) → group-dashboard
#   (/companion/groups/1/dashboard) → View Members → member-list
#   (/companion/groups/1/members → Amina/Grace/Joseph, real clients 35/36/37).
# Prereq: Go companion :8090 + adb reverse tcp:8080 tcp:8090.
appId: org.mifos.groupbanking
name: e2e — full read journey to member-list (live mifos-bank-2)
tags:
  - e2e
  - group-banking
  - member-list
  - real-network
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: "mifos"
- tapOn:
    id: "login_signup_field_password"
- inputText: "password"
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000
- tapOn: "All Groups"
- extendedWaitUntil:
    visible: { id: "group_list_screen" }
    timeout: 15000
- tapOn: "Mwangaza Women's Group"
- extendedWaitUntil:
    visible: { id: "group_dashboard_screen" }
    timeout: 20000

# --- drill into members: real 3-member roster from mifos-bank-2 ---
- tapOn:
    id: "group_dashboard_view_members_button"
- extendedWaitUntil:
    visible: { id: "member_list_screen" }
    timeout: 20000
# a REAL member (Fineract client 35/36/37) rendered from mifos-bank-2
- assertVisible: "Grace Wanjiru"
