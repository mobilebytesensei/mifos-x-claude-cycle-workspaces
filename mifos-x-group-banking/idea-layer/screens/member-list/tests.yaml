sibling: tests
schema_version: "4.0"
feature_id: member-list

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-ML-001
      scenario: "Members load on mount — list renders 5 member rows with correct roles"
      type: ViewModel
      priority: P0
      given: "groupId='42', API returns 5 members"
      when: "Screen mounts"
      then: "state transitions Loading → Content, members list has 5 items with displayName, role, savingsBalance, loanStatus"

    - id: TC-ML-002
      scenario: "Each member row shows correct role chip color — TREASURER=secondary, CHAIRPERSON=primary"
      type: Screen
      priority: P0
      given: "Content state with 5 members"
      when: "Screen renders"
      then: "role_chip for Amina shows secondaryContainer background, Joseph shows primaryContainer"

    - id: TC-ML-003
      scenario: "OVERDUE loan status badge renders in red on Peter Otieno's row"
      type: Screen
      priority: P0
      given: "Content state, Peter Otieno loanStatus=OVERDUE"
      when: "Screen renders"
      then: "loan_status_badge for Peter has background='#FFCDD2' and text_color='#B71C1C'"

    - id: TC-ML-004
      scenario: "Tap member row navigates to member-profile with correct memberId"
      type: ViewModel
      priority: P0
      given: "Content state, members loaded"
      when: "OnMemberClick dispatched with memberId='client_002'"
      then: "NavigateToMemberProfile event emitted with memberId='client_002' and groupId='42'"

    - id: TC-ML-005
      scenario: "Swipe action navigates to member-profile (same as tap)"
      type: Screen
      priority: P1
      given: "Content state"
      when: "User swipes member_list_item start-to-end"
      then: "OnMemberClick action dispatched, navigate to member-profile"

    - id: TC-ML-006
      scenario: "FAB always visible in content state and navigates to member-add"
      type: Screen
      priority: P0
      given: "Content state with members"
      when: "User taps add_member_fab"
      then: "OnAddMember dispatched, NavigateToAddMember event with groupId='42'"

    - id: TC-ML-007
      scenario: "Empty state shown when group has no members, FAB still visible"
      type: Screen
      priority: P0
      given: "API returns empty pageItems array"
      when: "Screen renders"
      then: "empty_state visible with group_add icon, 'No members yet' title, add_member_fab visible"

    - id: TC-ML-008
      scenario: "Pull-to-refresh reloads members bypassing cache"
      type: ViewModel
      priority: P1
      given: "Content state with cached data"
      when: "OnRefresh dispatched"
      then: "isRefreshing=true, API called with offset=0 bypassing cache, isRefreshing=false after response"

    - id: TC-ML-009
      scenario: "Scroll to end triggers load-more, appends next page"
      type: ViewModel
      priority: P1
      given: "hasMorePages=true, currentOffset=0, 20 members loaded"
      when: "OnLoadMore dispatched"
      then: "isLoadingMore=true, API called with offset=20, results appended to members list"

    - id: TC-ML-010
      scenario: "Network error shows error state with retry button"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, no cache available"
      when: "Screen mounts"
      then: "MemberListError.Network set, error_state visible with cloud_off icon and retry CTA"

    - id: TC-ML-011
      scenario: "Offline with cache shows cached data with offline banner"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false, valid cache exists for member_list:42"
      when: "Screen mounts"
      then: "Content state shown from cache, ShowSnackbar with error_offline message"

    - id: TC-ML-012
      scenario: "Auth 401 navigates to login"
      type: ViewModel
      priority: P0
      given: "API returns 401"
      when: "Screen mounts"
      then: "MemberListError.Auth set, NavigateToLogin event emitted"

    - id: TC-ML-013
      scenario: "Shimmer shows during initial loading"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "Screen renders"
      then: "shimmer_list visible with 6 placeholder rows, member_list_item not visible"

    - id: TC-ML-014
      scenario: "Top bar subtitle shows group name after data loads"
      type: Screen
      priority: P1
      given: "Content state, groupName='Mwangaza Women\\'s Group'"
      when: "Screen renders"
      then: "top_bar subtitle displays 'Mwangaza Women\\'s Group'"
