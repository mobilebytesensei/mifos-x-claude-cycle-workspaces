sibling: tests
schema_version: "4.0"
feature_id: member-list
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-ML-001
      scenario: "On mount, members load for groupId with offset pagination"
      type: ViewModel
      priority: P0
      given: "groupId=1; network online"
      when: "MemberListScreen enters composition"
      then: "MemberRepository.getMembers(groupId=1, offset=0) called; first page loaded; MemberListScreenState=Content"

    - id: TC-ML-002
      scenario: "Member row shows avatar, name, role badge, and savings balance"
      type: Screen
      priority: P0
      given: "Content state; member={name:'Ali Hassan', role:CHAIRPERSON, savingsBalance:5000.0}"
      when: "MemberRow renders"
      then: "avatar with initials 'AH'; name 'Ali Hassan'; CHAIRPERSON role badge; KES 5,000 balance"

    - id: TC-ML-003
      scenario: "Tapping member row navigates to member-profile with memberId and groupId"
      type: Screen
      priority: P0
      given: "Content state; member.id=3"
      when: "OnMemberClick(3) fires"
      then: "NavigateToMemberProfile emitted with memberId=3 and groupId=1"

    - id: TC-ML-004
      scenario: "Scroll to end triggers OnLoadNextPage and appends next page"
      type: ViewModel
      priority: P1
      given: "hasNextPage=true; 20 members loaded"
      when: "OnLoadNextPage fires"
      then: "MemberRepository.getMembers(offset=20) called; page 2 appended; currentOffset=20"

    - id: TC-ML-005
      scenario: "hasNextPage=false prevents further pagination"
      type: ViewModel
      priority: P1
      given: "all members loaded; hasNextPage=false"
      when: "OnLoadNextPage fires"
      then: "no API call made; end-of-list indicator shown"

    - id: TC-ML-006
      scenario: "Empty state shown when group has no members"
      type: Screen
      priority: P1
      given: "load succeeds; members.isEmpty()"
      when: "Content evaluation runs"
      then: "MemberListScreenState=Empty; empty state message and add-member CTA shown"

    - id: TC-ML-007
      scenario: "Pull-to-refresh resets offset and reloads from page 0"
      type: ViewModel
      priority: P1
      given: "Content state; user scrolled to page 3"
      when: "OnRefresh fires"
      then: "isRefreshing=true; MemberRepository.getMembers(offset=0) called; list reset; isRefreshing=false"

    - id: TC-ML-008
      scenario: "Error state shows retry on network failure"
      type: Screen
      priority: P1
      given: "MemberRepository.getMembers returns network error"
      when: "load completes"
      then: "MemberListScreenState=Error; retry CTA visible"

    - id: TC-ML-009
      scenario: "Auth 401 redirects to login-signup"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "MemberRepository.getMembers returns 401"
      then: "MemberListError type=Auth; NavigateToLoginSignup emitted"
