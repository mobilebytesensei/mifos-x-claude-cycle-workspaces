sibling: tests
schema_version: "4.0"
feature_id: member-list

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-ML-001
      scenario: "Members load on mount — Loading to Content, 5 rows with role and loan status"
      type: ViewModel
      priority: P0
      given: "groupId='42', get_group_members GET /groups/42/clients returns 5 members"
      when: "Screen mounts"
      then: "MemberListScreenState Loading → Content; members has 5 items each with displayName, role, savingsBalance, loanStatus"

    - id: TC-ML-002
      scenario: "Each member row shows role-specific chip color"
      type: Screen
      priority: P0
      given: "Content state with Amina=TREASURER, Joseph=CHAIRPERSON, Grace=SECRETARY, Peter=MEMBER"
      when: "Screen renders member_list_item rows"
      then: "role_chip: Amina secondaryContainer, Joseph primaryContainer, Grace tertiaryContainer, Peter surfaceVariant"

    - id: TC-ML-003
      scenario: "OVERDUE loan badge renders in red on Peter Otieno's row"
      type: Screen
      priority: P0
      given: "Content state, Peter Otieno loanStatus=OVERDUE"
      when: "Screen renders"
      then: "loan_status_badge for Peter has background='#FFCDD2' and text_color='#B71C1C'; NONE rows use surfaceVariant"

    - id: TC-ML-004
      scenario: "Member row supporting line shows KES savings balance"
      type: Screen
      priority: P1
      given: "Content state, Joseph Kamau savingsBalance=4200.00"
      when: "Screen renders"
      then: "member_list_item supporting text='Savings: KES 4,200'"

    - id: TC-ML-005
      scenario: "OnMemberClick (tap) navigates to member-profile with memberId + groupId"
      type: ViewModel
      priority: P0
      given: "Content state, members loaded, groupId='42'"
      when: "OnMemberClick(memberId='client_002') dispatched"
      then: "NavigateToMemberProfile event emitted with memberId='client_002' and groupId='42'"

    - id: TC-ML-006
      scenario: "Swipe start-to-end navigates to member-profile (same as tap)"
      type: Screen
      priority: P1
      given: "Content state"
      when: "user swipes member_list_item start_to_end (View Profile action)"
      then: "OnMemberClick dispatched with member.id; navigate to member-profile, identical destination to tap"

    - id: TC-ML-007
      scenario: "FAB always visible in content and navigates to member-add"
      type: Screen
      priority: P0
      given: "Content state with members, groupId='42'"
      when: "user taps add_member_fab (OnAddMember)"
      then: "NavigateToAddMember event with groupId='42'; navigate to member-add pre-scoped to group"

    - id: TC-ML-008
      scenario: "Empty state shown when group has no members, FAB and CTA both navigate to member-add"
      type: Screen
      priority: P0
      given: "get_group_members returns empty pageItems (Empty screen state)"
      when: "Screen renders and user taps empty_state CTA"
      then: "empty_state visible with group_add icon and 'No members yet'; both add_member_fab and empty CTA dispatch OnAddMember → NavigateToAddMember(groupId='42')"

    - id: TC-ML-009
      scenario: "Pull-to-refresh reloads members bypassing cache from offset 0"
      type: ViewModel
      priority: P1
      given: "Content state with cached data, currentOffset advanced"
      when: "OnRefresh dispatched"
      then: "isRefreshing=true; get_group_members called with offset=0 bypassing stale-while-revalidate cache; isRefreshing=false after response"

    - id: TC-ML-010
      scenario: "Scroll to end triggers OnLoadMore, appends next offset page"
      type: ViewModel
      priority: P1
      given: "hasMorePages=true, currentOffset=0, 20 members loaded"
      when: "OnLoadMore dispatched"
      then: "isLoadingMore=true; get_group_members called with offset=20 (page_size 20); results appended to members list; load_more_indicator visible while loading"

    - id: TC-ML-011
      scenario: "Network error with no cache shows error state with retry"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, no cache available"
      when: "Screen mounts"
      then: "MemberListError.Network set; error_state visible with cloud_off icon and Retry CTA"

    - id: TC-ML-012
      scenario: "Retry CTA re-issues get_group_members via cmp-network-monitor, resets pagination"
      type: ViewModel
      priority: P1
      given: "Error state after a failed load"
      when: "Retry dispatched (tap error_state CTA)"
      then: "cmp-network-monitor connectivity checked; get_group_members GET /groups/42/clients re-issued at offset 0; error cleared; state reloads"

    - id: TC-ML-013
      scenario: "Offline with valid cache shows cached data with offline snackbar"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false, valid stale-while-revalidate cache exists for group 42"
      when: "Screen mounts"
      then: "Content state served from SQLDelight cache; ShowSnackbar with offline message; background revalidate deferred until online"

    - id: TC-ML-014
      scenario: "Auth 401 surfaces auth error and redirects to login"
      type: ViewModel
      priority: P0
      given: "get_group_members returns 401"
      when: "Screen mounts"
      then: "MemberListError.Auth set (retry=false, redirect=login); navigate to login"

    - id: TC-ML-015
      scenario: "Shimmer shown during initial loading"
      type: Screen
      priority: P1
      given: "isLoading=true (Loading screen state)"
      when: "Screen renders"
      then: "shimmer_list visible with 6 placeholder rows; member_list_item not visible"

    - id: TC-ML-016
      scenario: "Top bar subtitle shows group name after data loads"
      type: Screen
      priority: P1
      given: "Content state, groupName=\"Mwangaza Women's Group\""
      when: "Screen renders"
      then: "top_bar subtitle displays \"Mwangaza Women's Group\""

    - id: TC-ML-017
      scenario: "MemberRepository.getGroupMembers maps paginated response to Flow<PaginatedResult<Member>>"
      type: Repository
      priority: P0
      given: "mock get_group_members returns totalFilteredRecords=25, 20 pageItems with savingsAccountBalance and loanStatus"
      when: "getGroupMembers(groupId='42', limit=20, offset=0) collected"
      then: "each Member has id, displayName, role, savingsBalance, loanStatus mapped; hasMorePages derived from totalFilteredRecords; SQLDelight members table upserted"
