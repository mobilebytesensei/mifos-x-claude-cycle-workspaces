id: member-list
name: Member List
description: >
  Paginated list of members belonging to a savings group. Each row shows the member's
  photo, name, role badge (chairperson/treasurer/secretary/member), savings balance,
  and loan status (active/none/overdue). Supports swipe-to-view-profile and FAB to
  add a new member. Covers FR-002.
