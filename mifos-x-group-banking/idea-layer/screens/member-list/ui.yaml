requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: member-list

business_logic:
  kind: crud
  description: "Fetches a paginated list of group members from the Fineract companion API (/groups/{groupId}/clients), appending pages via offset pagination; cmp-network-monitor detects offline state and serves cached SQLDelight rows while revalidating in the background. Each member row carries role badge and loan status resolved from the server response."
  library_refs:
    - cmp-network-monitor
  external_library_refs: [Store5, SQLDelight]
  description_hash: "a3f8c2d1e9b74561f0ae3827c6d9450b1e2f873a6c94d5b0e1f28370c4a956d"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

route: /groups/{groupId}/members
entry_points:
  - source: group-dashboard
    trigger: view_members_button
    params: { groupId: String }
nav_params:
  groupId: { type: String, required: true }

screens:
  - id: member-list-screen
    title: "{strings.screen_title}"
    type: list
    description: Scrollable paginated list of group members with role badges and loan status  # i18n: skip

state_model:
  MemberListViewModel:
    state:
      name: MemberListState
      fields:
        isLoading: { type: Boolean, default: "true" }
        members: { type: "List<Member>", default: "emptyList()" }
        groupId: { type: String, default: '""' }
        groupName: { type: String, default: '""' }
        isLoadingMore: { type: Boolean, default: "false" }
        hasMorePages: { type: Boolean, default: "true" }
        currentOffset: { type: Int, default: "0" }
        error: { type: "MemberListError?", default: "null" }
        isRefreshing: { type: Boolean, default: "false" }
    screen_state:
      name: MemberListScreenState
      members: [Loading, Content, Error, Empty]
    errors:
      name: MemberListError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: MemberListEvent
      members:
        - { name: NavigateToMemberProfile, params: { memberId: String, groupId: String } }
        - { name: NavigateToAddMember, params: { groupId: String } }
        - { name: NavigateToMemberInvite, params: { groupId: String } }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: MemberListAction
      members:
        - { name: OnMemberClick, params: { memberId: String }, trigger: "Tap member row or swipe action" }
        - { name: OnAddMember, trigger: "Tap FAB" }
        - { name: OnInviteMember, trigger: "Tap invite top-bar action" }
        - { name: OnLoadMore, trigger: "Scroll to end of list" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
        - { name: Retry, trigger: "Tap retry on error" }
        - { name: OnBack, trigger: "Tap back" }
    di:
      - MemberRepository
      - GroupRepository
      - NetworkMonitor

components:
  - id: top_bar
    type: top-bar
    title: "{strings.screen_title}"
    subtitle: "{{groupName}}"  # i18n: skip (dynamic runtime value)
    style: { background: primary, text_color: onPrimary }
    navigation_icon: arrow_back
    accessibility_label: "{strings.a11y_back}"
    on_navigation_click:
      action: OnBack
      action_contract:
        effect: navigate
        description: "Pops the member-list via NavController back to the group-dashboard; read-only roster screen so no persistence or roster mutation runs on back navigation. Any in-flight pagination fetch is cancelled."
        action_contract_hash: "a1c7d0e63b95f24870d1e5a9c8b4f30726d5a1e8f4c93b607d2a5f81c6b3049e"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"
    actions:
      - id: invite_action
        icon: person_add_alt
        label: "{strings.invite_action_label}"
        accessibility_label: "{strings.a11y_invite_member}"
        on_click:
          action: OnInviteMember
          target: member-invite
          action_contract:
            effect: navigate
            description: "Navigates to the member-invite screen (organizer generates a single-use invite link/code), passing groupId as a route param. Declared edge: member-onboarding-flow invite path + member-invite/ui.yaml entry_points[0] (source: member-list). Pure navigation — no persistence or roster mutation."
            action_contract_hash: "b9f3a7c1e2d84560f7a913c8b5e24d071c6a8f39e4b70d25c1e9a683f4d27b51"
            action_contract_author: "claude-via-idea-sync"
            action_contract_authored_at: "2026-07-31T00:00:00Z"

  - id: member_list_item
    type: list-item
    accessibility_label: "{strings.a11y_member_row}"
    style:
      min_touch_target: 72dp
      divider: true
      swipe_action:
        direction: start_to_end
        label: "{strings.swipe_label}"
        icon: person
        background: primaryContainer
    content:
      leading:
        id: member_avatar
        type: avatar
        image_url: "{{member.photoUri}}"
        fallback_initials: "{{member.displayName | initials}}"
        size: 48dp
        style: { background: secondaryContainer, text_color: onSecondaryContainer }
      headline:
        type: text
        style: { text_style: bodyLarge, color: onSurface }
        value: "{{member.displayName}}"  # i18n: skip (dynamic runtime value)
      supporting:
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "{strings.savings_label}"
      trailing:
        type: column
        children:
          - id: role_chip
            type: chip
            label: "{{member.role}}"  # i18n: skip (data-driven enum; resolved via role_* strings map)
            style:
              CHAIRPERSON: { background: primaryContainer, text_color: onPrimaryContainer }
              TREASURER: { background: secondaryContainer, text_color: onSecondaryContainer }
              SECRETARY: { background: tertiaryContainer, text_color: onTertiaryContainer }
              MEMBER: { background: surfaceVariant, text_color: onSurfaceVariant }
          - id: loan_status_badge
            type: badge
            label: "{{member.loanStatus}}"  # i18n: skip (data-driven enum; resolved via loan_* strings map)
            style:
              ACTIVE: { background: "#C8E6C9", text_color: "#1B5E20" }
              NONE: { background: surfaceVariant, text_color: onSurfaceVariant }
              OVERDUE: { background: "#FFCDD2", text_color: "#B71C1C" }
    on_click:
      action: OnMemberClick
      params: { memberId: "{{member.id}}" }
      target: member-profile
      action_contract:
        effect: navigate
        description: "Navigates to the member-profile screen, passing memberId and groupId as route params to display the selected member's full profile, savings history, and loan details."
        action_contract_hash: "b7e1f4a29c3d85670e2a914f8c3b2d561a7e4f09c85d30b2e6f17a493c8d254"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"
    on_swipe:
      action: OnMemberClick
      params: { memberId: "{{member.id}}" }
      target: member-profile
      action_contract:
        effect: navigate
        description: "Swipe gesture shortcut that navigates to member-profile screen with memberId and groupId params, identical destination to the tap action on the member row."
        action_contract_hash: "c2d9e5b3a8f16074d3b025e9a7c4f182b3e6d8a1f5c29070e4b3816d9a72c5e"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: add_member_fab
    type: fab
    icon: person_add
    label: "{strings.fab_label}"
    accessibility_label: "{strings.a11y_add_member}"
    style: { background: primary, icon_color: onPrimary, min_touch_target: 56dp, position: bottom_end }
    on_click:
      action: OnAddMember
      target: member-add
      action_contract:
        effect: navigate
        description: "Navigates to the member-add screen, passing groupId as a route param so the add-member form is pre-scoped to this group."
        action_contract_hash: "d4e8c1a7f3b29065e1c743a8d5b2f096c4a17e38f2d65b091c7e4a83b5d29f1"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: load_more_indicator
    type: loading-indicator
    variant: linear
    visible: "{{isLoadingMore}}"
    style: { color: primary }

  - id: shimmer_list
    type: shimmer
    count: 6
    style: { height: 72dp, corner_radius: 4dp, background: surfaceVariant }

  - id: empty_state
    type: empty-state
    icon: group_add
    title: "{strings.empty_title}"
    body: "{strings.empty_body}"
    cta_label: "{strings.empty_cta}"
    accessibility_label: "{strings.a11y_add_member}"
    on_click:
      action: OnAddMember
      target: member-add
      action_contract:
        effect: navigate
        description: "Navigates to the member-add screen from the empty state CTA, passing groupId so the add-member form is pre-scoped to the current group with no members."
        action_contract_hash: "e5f9d2b8a4c37016f2d854b9e6c3a107d5b28f49a3e76c102d8f5b94c6e30a2"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "{strings.error_title}"
    body: "{{error.message}}"  # i18n: skip (dynamic error message resolved via error_network/error_server/error_auth keys)
    cta_label: "{strings.retry}"
    accessibility_label: "{strings.a11y_retry}"
    on_click:
      action: Retry
      state: reload
      action_contract:
        effect: call_api
        library_refs:
          - cmp-network-monitor
        description: "Checks connectivity via cmp-network-monitor then re-issues the GET /groups/{groupId}/clients API call, resetting pagination to offset 0 and clearing any cached error state to reload the member list."
        action_contract_hash: "f6a0e3c9b5d48127a3e965c0f7d4b218e6c39a50b4f87d213e9a6c05d7f41b3"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_list]
    description: "Fetching first page of members"
  content:
    components: [top_bar, member_list_item, load_more_indicator, add_member_fab]
    description: "Paginated list visible; FAB always visible"
    demo_data:
      groupName: "Mwangaza Women's Group"
      members:
        - displayName: "Amina Wanjiru"
          role: TREASURER
          savingsBalance: 3500.00
          loanStatus: NONE
        - displayName: "Joseph Kamau"
          role: CHAIRPERSON
          savingsBalance: 4200.00
          loanStatus: ACTIVE
        - displayName: "Grace Achieng"
          role: SECRETARY
          savingsBalance: 2800.00
          loanStatus: NONE
        - displayName: "Peter Otieno"
          role: MEMBER
          savingsBalance: 1500.00
          loanStatus: OVERDUE
        - displayName: "Mary Njeri"
          role: MEMBER
          savingsBalance: 2000.00
          loanStatus: NONE
        - displayName: "Samuel Mwangi"
          role: MEMBER
          savingsBalance: 2650.00
          loanStatus: ACTIVE
        - displayName: "Esther Nyambura"
          role: MEMBER
          savingsBalance: 1200.00
          loanStatus: NONE
  empty:
    components: [top_bar, empty_state, add_member_fab]
    description: "No members; prompt to add"
  error:
    components: [top_bar, error_state]
    description: "API error with retry"

i18n:
  en:
    screen_title: "Members"
    savings_label: "Savings: KES {{amount}}"
    role_chairperson: "Chairperson"
    role_treasurer: "Treasurer"
    role_secretary: "Secretary"
    role_member: "Member"
    loan_active: "Active"
    loan_none: "No Loan"
    loan_overdue: "Overdue"
    fab_label: "Add Member"
    invite_action_label: "Invite"
    swipe_label: "View Profile"
    empty_title: "No members yet"
    empty_body: "Add the first member to this group."
    empty_cta: "Add Member"
    error_title: "Could not load members"
    error_network: "No internet. Showing cached members."
    error_server: "Server error. Please retry."
    error_auth: "Session expired."
    retry: "Retry"
    a11y_back: "Back to group dashboard"
    a11y_member_row: "Member details, tap to view profile"
    a11y_add_member: "Add member to group"
    a11y_invite_member: "Invite a member via link or code"
    a11y_retry: "Retry loading members"
