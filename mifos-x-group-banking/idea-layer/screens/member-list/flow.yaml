sibling: flow
schema_version: "4.0"
feature_id: member-list

navigates_to:
  - member-profile
  - member-add

flow_logic:
  on_load:
    - action: load_members
      api: get_group_members
      params: { groupId: nav_params.groupId, limit: 20, offset: 0 }
      on_success: show_content
      on_empty: show_empty
      on_error: show_error
  on_load_more:
    - condition: "hasMorePages && !isLoadingMore"
      action: load_members
      api: get_group_members
      params: { groupId: nav_params.groupId, limit: 20, offset: currentOffset }
      append: true
  on_member_click:
    - navigate: member-profile
      params: { memberId: "{member.id}", groupId: "{groupId}" }
  on_add_member:
    - navigate: member-add
      params: { groupId: "{groupId}" }
  on_refresh:
    - action: load_members
      invalidate_cache: true
      reset_pagination: true
