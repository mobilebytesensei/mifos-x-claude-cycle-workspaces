sibling: api
schema_version: "4.0"
feature_id: member-list

api:
  - id: get_group_members
    function: get_group_members
    method: get
    endpoint: "/groups/{groupId}/clients"
    description: Fetch paginated list of clients (members) belonging to the group
    params:
      groupId: { type: Long, required: true, source: nav_params }
      limit: { type: Int, default: 20 }
      offset: { type: Int, default: 0 }
    response:
      type: object
      fields:
        totalFilteredRecords: Int
        pageItems:
          type: array
          items:
            id: Long
            displayName: String
            status: { id: Int, value: String }
            mobileNo: String
            imagePresent: Boolean
            savingsAccountBalance: Double
            loanStatus: String
    errors:
      401: Unauthorized
      403: Forbidden
      404: Group not found
      500: Server error
    cache:
      ttl: 120
      strategy: stale-while-revalidate
      offline: show_cached
    pagination:
      type: offset
      page_size: 20

dtos:
  Member:
    id: String
    fineractClientId: Long
    displayName: String
    photoUri: "String?"
    role: MemberRole
    savingsBalance: Double
    loanStatus: LoanStatus

  MemberRole:
    values: [CHAIRPERSON, TREASURER, SECRETARY, MEMBER]

  LoanStatus:
    values: [ACTIVE, NONE, OVERDUE]

cache_strategy:
  ttl: 120
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: MemberRepository
      methods:
        - "getGroupMembers(groupId: String, limit: Int, offset: Int): Flow<PaginatedResult<Member>>"
    - name: GroupRepository
      methods:
        - "getGroupName(groupId: String): Flow<String>"
  services:
    - NetworkMonitor
  local_db:
    - table: members
      schema: SQLDelight Member entity
