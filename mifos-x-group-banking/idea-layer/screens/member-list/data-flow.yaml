sibling: data-flow
schema_version: "2.1.0"
feature_id: member-list

entries:
  - screen_id: memberListScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_group_members, transport: rest, method: get }
    dtos:
      - { name: Member, role: response, api_id: get_group_members }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 120
      key_template: "member_list:{groupId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "403", behavior: snackbar, message_key: error_server }
      - { error_code: "404", behavior: error_state, message_key: error_server }
      - { error_code: "500", behavior: error_state, message_key: error_server }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }

  - screen_id: memberListScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_group_members, transport: rest, method: get }
    dtos:
      - { name: Member, role: response, api_id: get_group_members }
    auth_required: true
    cache:
      strategy: bypass_and_refresh
      key_template: "member_list:{groupId}"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: snackbar, message_key: error_server }

  - screen_id: memberListScreen
    trigger: on_interact
    interaction: scroll_to_end
    endpoints:
      - { api_id: get_group_members, transport: rest, method: get }
    params_override:
      offset: "{{currentOffset + pageSize}}"
    dtos:
      - { name: Member, role: response, api_id: get_group_members }
    auth_required: true
    cache:
      strategy: append_to_existing
      key_template: "member_list:{groupId}:offset:{offset}"
    error_paths:
      - { error_code: "network.offline", behavior: snackbar, message_key: error_offline }
      - { error_code: "500", behavior: snackbar, message_key: error_server }
