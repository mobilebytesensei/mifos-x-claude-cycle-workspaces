schema_version: "3.1"
id: admin-dashboard
name: Admin Dashboard
description: >
  Hub screen for admin/staff users after login. Displays a personalised welcome header,
  four KPI summary cards (total groups, total members, overdue loans, meetings today),
  a "Today's Schedule" section listing groups with meetings due today, a recent-activity
  feed (transactions, new members, loans), and quick-navigation to Group List and the
  Field-Officer Dashboard (v1.1). Bottom nav is visible with the Home tab selected.
feature: authentication
flow: admin-auth
version: "1.0.0"
tags:
  - admin
  - dashboard
  - authentication
  - kpi
  - offline-first

# Lifecycle
status: enriched
quality_score: 89
status_history:
  - status: draft
    date: "2026-05-07"
    author: system
  - status: enriched
    date: "2026-05-07"
    author: system

# Navigation
entry_point: true
bottom_nav:
  visible: true
  selected_tab: home
navigates_to:
  - group-list
  - field-officer-dashboard
route: /admin/dashboard
entry_points:
  - source: login
    condition: admin_login_success
  - source: app_launch
    condition: user_authenticated && role == admin
nav_params: {}

screens:
  - id: admin-dashboard-screen
    title: "Dashboard"
    type: dashboard
    description: >
      Scrollable admin dashboard with welcome header, KPI row, today's schedule,
      quick-nav cards, and a recent-activity feed.

state_model:
  AdminDashboardViewModel:
    state:
      name: AdminDashboardState
      fields:
        isLoading: { type: Boolean, default: "true" }
        staffName: { type: String, default: '""' }
        staffId: { type: Long, default: "0L" }
        totalGroups: { type: Int, default: "0" }
        totalMembers: { type: Int, default: "0" }
        overdueLoansCount: { type: Int, default: "0" }
        meetingsTodayCount: { type: Int, default: "0" }
        todaySchedule: { type: "List<ScheduledMeeting>", default: "emptyList()" }
        recentActivity: { type: "List<ActivityItem>", default: "emptyList()" }
        error: { type: "AdminDashboardError?", default: "null" }
        isRefreshing: { type: Boolean, default: "false" }
    screen_state:
      name: AdminDashboardScreenState
      members: [Loading, Content, Error, Empty]
    errors:
      name: AdminDashboardError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: AdminDashboardEvent
      members:
        - { name: NavigateToGroupList }
        - { name: NavigateToFieldOfficerDashboard }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: AdminDashboardAction
      members:
        - { name: OnViewAllGroups, trigger: "Tap Groups KPI card or 'View All Groups' quick-nav" }
        - { name: OnViewFieldOfficer, trigger: "Tap Field Officer quick-nav card" }
        - { name: OnMeetingGroupClick, params: { groupId: String }, trigger: "Tap a meeting row in Today's Schedule" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
        - { name: Retry, trigger: "Tap retry button on error state" }
    di:
      - AdminRepository
      - GroupRepository
      - SessionManager
      - NetworkMonitor

flow_logic:
  on_load:
    - action: fetch_all_parallel
      calls:
        - api: get_staff_summary
        - api: get_todays_schedule
        - api: get_recent_activity
      on_all_success: show_content
      on_error: show_error
  on_view_all_groups:
    - navigate: group-list
  on_view_field_officer:
    - navigate: field-officer-dashboard
  on_meeting_group_click:
    - navigate: group-list
      params: { groupId: "{groupId}" }
  on_refresh:
    - action: fetch_all_parallel
      invalidate_cache: true

dependencies:
  repositories:
    - name: AdminRepository
      methods:
        - getStaffSummary(staffId: Long): Flow<StaffSummary>
        - getRecentActivity(staffId: Long, limit: Int): Flow<List<ActivityItem>>
    - name: GroupRepository
      methods:
        - getTodaysSchedule(staffId: Long): Flow<List<ScheduledMeeting>>
  services:
    - SessionManager
    - NetworkMonitor
  local_db:
    - table: staff_summary
      schema: SQLDelight StaffSummary entity
    - table: scheduled_meetings
      schema: SQLDelight ScheduledMeeting entity
    - table: activity_items
      schema: SQLDelight ActivityItem entity

api:
  - id: get_staff_summary
    function: get_staff_summary
    method: get
    endpoint: "/staff/{staffId}/summary"
    description: >
      Fetch aggregated KPI data for the logged-in staff member — total groups managed,
      total members across those groups, overdue loan count, and meetings scheduled today.
    params:
      staffId: { type: Long, required: true, source: session }
    response:
      type: object
      fields:
        staffId: Long
        staffName: String
        totalGroups: Int
        totalMembers: Int
        overdueLoansCount: Int
        meetingsTodayCount: Int
    errors:
      401: Unauthorized — redirect to login
      403: Forbidden — insufficient permissions
      404: Staff record not found
      500: Server error — show retry
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_todays_schedule
    function: get_todays_schedule
    method: get
    endpoint: "/centers"
    description: >
      Fetch groups (Fineract Centers) assigned to the staff member that have a meeting
      scheduled for today. Filtered client-side by meeting date == today.
    params:
      staffId: { type: Long, required: false, source: session }
      meetingDate: { type: String, required: false, source: computed, value: today_iso }
      paged: { type: Boolean, default: true }
      limit: { type: Int, default: 50 }
      offset: { type: Int, default: 0 }
    response:
      type: object
      fields:
        totalFilteredRecords: Int
        pageItems:
          type: array
          items:
            id: Long
            name: String
            meetingSchedule: String
            meetingTime: String
            memberCount: Int
            staffId: Long
    errors:
      401: Unauthorized
      500: Server error
    cache:
      ttl: 180
      strategy: network-first
      offline: show_cached

  - id: get_recent_activity
    function: get_recent_activity
    method: get
    endpoint: "/journal-entries"
    description: >
      Fetch the 10 most recent journal entries (transactions) across all groups managed
      by the staff member, used to populate the recent-activity feed.
    params:
      staffId: { type: Long, required: false, source: session }
      limit: { type: Int, default: 10 }
      offset: { type: Int, default: 0 }
    response:
      type: object
      fields:
        totalFilteredRecords: Int
        pageItems:
          type: array
          items:
            id: Long
            transactionDate: List<Int>
            amount: Double
            glAccountName: String
            entryType: { id: Int, value: String }
            clientName: String?
            centerName: String?
    errors:
      401: Unauthorized
      500: Server error
    cache:
      ttl: 120
      strategy: network-first
      offline: show_cached

dtos:
  StaffSummary:
    staffId: Long
    staffName: String
    totalGroups: Int
    totalMembers: Int
    overdueLoansCount: Int
    meetingsTodayCount: Int

  ScheduledMeeting:
    groupId: String
    groupName: String
    meetingTime: String
    memberCount: Int
    location: String?

  ActivityItem:
    id: String
    type: String          # MEETING | DEPOSIT | LOAN | PENALTY | SHARE_OUT | NEW_MEMBER
    description: String
    amount: Double?
    date: String
    memberName: String?
    groupName: String?

components:
  - id: top_bar
    type: top-bar
    title: "Dashboard"
    style:
      background: primary
      text_color: onPrimary
    actions:
      - icon: notifications
        content_description: "Notifications"
        on_click: { action: OnOpenNotifications, target: notifications }  # v1.1 deferred
    test_context:
      purpose: "Main app bar for admin dashboard; static title with notification icon"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: welcome_header
    type: card
    style:
      background: primaryContainer
      elevation: 0dp
      corner_radius: 0dp
      padding: "16dp 16dp 12dp 16dp"
    content:
      - id: welcome_greeting_text
        type: text
        style: { text_style: headlineSmall, color: onPrimaryContainer }
        value: "Welcome back, {{staffName}}"
      - id: welcome_subtitle_text
        type: text
        style: { text_style: bodyMedium, color: onPrimaryContainer }
        value: "Here's your overview for today"
    test_context:
      purpose: "Personalised greeting shown after admin login; staffName injected from session"
      interaction_type: static
      data_driven: true
      required_fields: [staffName]

  - id: kpi_summary_row
    type: row
    style:
      padding: "12dp 16dp"
      gap: 12dp
    content:
      - id: kpi_total_groups
        type: card
        style:
          background: surface
          elevation: 2dp
          corner_radius: 12dp
          padding: 14dp
          flex: 1
        content:
          - id: kpi_groups_value
            type: text
            style: { text_style: headlineMedium, color: primary }
            value: "{{totalGroups}}"
          - id: kpi_groups_label
            type: text
            style: { text_style: labelSmall, color: onSurfaceVariant }
            value: "Total Groups"
        on_click: { action: OnViewAllGroups, target: group-list }
        test_context:
          purpose: "KPI card showing total groups managed; tapping navigates to group list"
          interaction_type: tap
          data_driven: true
          required_fields: [totalGroups]

      - id: kpi_total_members
        type: card
        style:
          background: surface
          elevation: 2dp
          corner_radius: 12dp
          padding: 14dp
          flex: 1
        content:
          - id: kpi_members_value
            type: text
            style: { text_style: headlineMedium, color: primary }
            value: "{{totalMembers}}"
          - id: kpi_members_label
            type: text
            style: { text_style: labelSmall, color: onSurfaceVariant }
            value: "Members"
        on_click: { action: OnViewAllGroups, target: group-list }
        test_context:
          purpose: "KPI card showing total member count across all managed groups"
          interaction_type: tap
          data_driven: true
          required_fields: [totalMembers]

      - id: kpi_overdue_loans
        type: card
        style:
          background: surface
          elevation: 2dp
          corner_radius: 12dp
          padding: 14dp
          flex: 1
          border_overdue:
            condition: "overdueLoansCount > 0"
            color: error
            width: 1dp
        content:
          - id: kpi_overdue_value
            type: text
            style:
              text_style: headlineMedium
              color_normal: primary
              color_nonzero: error
            value: "{{overdueLoansCount}}"
          - id: kpi_overdue_label
            type: text
            style: { text_style: labelSmall, color: onSurfaceVariant }
            value: "Overdue Loans"
        on_click: { action: OnViewAllGroups, target: group-list }
        test_context:
          purpose: "KPI card for overdue loans; card border turns error-red when count > 0"
          interaction_type: tap
          data_driven: true
          required_fields: [overdueLoansCount]

      - id: kpi_meetings_today
        type: card
        style:
          background: surface
          elevation: 2dp
          corner_radius: 12dp
          padding: 14dp
          flex: 1
        content:
          - id: kpi_meetings_value
            type: text
            style: { text_style: headlineMedium, color: secondary }
            value: "{{meetingsTodayCount}}"
          - id: kpi_meetings_label
            type: text
            style: { text_style: labelSmall, color: onSurfaceVariant }
            value: "Meetings Today"
        on_click: { action: OnViewAllGroups, target: group-list }
        test_context:
          purpose: "KPI card for meetings scheduled today; secondary colour highlights urgency"
          interaction_type: tap
          data_driven: true
          required_fields: [meetingsTodayCount]

  - id: quick_nav_section
    type: card
    style:
      background: surface
      elevation: 2dp
      corner_radius: 16dp
      padding: 16dp
      margin: "0dp 16dp 8dp 16dp"
    content:
      - id: quick_nav_label
        type: text
        style: { text_style: titleSmall, color: onSurfaceVariant }
        value: "Quick Navigation"
      - id: quick_nav_grid
        type: grid
        columns: 2
        gap: 12dp
        children:
          - id: nav_group_list_card
            type: card
            style:
              background: primaryContainer
              corner_radius: 12dp
              padding: 16dp
              elevation: 0dp
            content:
              - id: nav_group_icon
                type: icon
                icon: groups
                style: { tint: onPrimaryContainer, size: 28dp }
              - id: nav_group_label
                type: text
                style: { text_style: titleSmall, color: onPrimaryContainer }
                value: "All Groups"
              - id: nav_group_sublabel
                type: text
                style: { text_style: bodySmall, color: onPrimaryContainer }
                value: "{{totalGroups}} groups"
            on_click: { action: OnViewAllGroups, target: group-list }
            test_context:
              purpose: "Quick-nav tile to group list screen; shows live group count"
              interaction_type: tap
              data_driven: true
              required_fields: [totalGroups]

          - id: nav_field_officer_card
            type: card
            style:
              background: secondaryContainer
              corner_radius: 12dp
              padding: 16dp
              elevation: 0dp
              badge: { label: "v1.1", style: { background: secondary, text_color: onSecondary } }
            content:
              - id: nav_fo_icon
                type: icon
                icon: person_pin_circle
                style: { tint: onSecondaryContainer, size: 28dp }
              - id: nav_fo_label
                type: text
                style: { text_style: titleSmall, color: onSecondaryContainer }
                value: "Field Officers"
              - id: nav_fo_sublabel
                type: text
                style: { text_style: bodySmall, color: onSecondaryContainer }
                value: "Officer overview"
            on_click: { action: OnViewFieldOfficer, target: field-officer-dashboard }
            test_context:
              purpose: "Quick-nav tile to field-officer dashboard; v1.1 badge indicates upcoming feature"
              interaction_type: tap
              data_driven: false
              required_fields: []

  - id: todays_schedule_section
    type: card
    style:
      background: surface
      elevation: 2dp
      corner_radius: 16dp
      padding: 16dp
      margin: "0dp 16dp 8dp 16dp"
    content:
      - id: schedule_header_row
        type: row
        style: { justify: space-between, align: center }
        children:
          - id: schedule_label
            type: text
            style: { text_style: titleMedium, color: onSurface }
            value: "Today's Schedule"
          - id: schedule_count_chip
            type: chip
            label: "{{meetingsTodayCount}} meetings"
            style: { background: tertiaryContainer, text_color: onTertiaryContainer }
      - id: schedule_list_item
        type: list-item
        leading: calendar_today_icon
        headline: "{{meeting.groupName}}"
        supporting: "{{meeting.meetingTime}} • {{meeting.memberCount}} members"
        trailing_icon: arrow_forward_ios
        style: { min_touch_target: 56dp, divider: true }
        on_click: { action: OnMeetingGroupClick, params: { groupId: "{{meeting.groupId}}" }, target: group-list }
        test_context:
          purpose: "List row for a group with a meeting today; tap navigates to group list filtered by that group"
          interaction_type: tap
          data_driven: true
          required_fields: [meeting.groupName, meeting.meetingTime, meeting.memberCount, meeting.groupId]

      - id: schedule_empty_label
        type: text
        visible: "{{todaySchedule.isEmpty()}}"
        style: { text_style: bodyMedium, color: onSurfaceVariant, align: center, padding: "12dp 0dp" }
        value: "No meetings scheduled for today"

  - id: recent_activity_section
    type: card
    style:
      background: surface
      elevation: 2dp
      corner_radius: 16dp
      padding: 16dp
      margin: "0dp 16dp 16dp 16dp"
    content:
      - id: activity_label
        type: text
        style: { text_style: titleMedium, color: onSurface }
        value: "Recent Activity"
      - id: activity_list_item
        type: list-item
        leading: activity_type_icon
        headline: "{{activity.description}}"
        supporting: "{{activity.date}} • {{activity.groupName}}"
        trailing: "{{activity.amount | currency: KES}}"
        style: { min_touch_target: 56dp }
        test_context:
          purpose: "Recent transaction or event row across all groups"
          interaction_type: static
          data_driven: true
          required_fields: [activity.description, activity.date]

  - id: shimmer_dashboard
    type: shimmer
    count: 4
    style: { height: 100dp, corner_radius: 16dp, background: surfaceVariant }
    test_context:
      purpose: "Loading skeleton while parallel API calls complete"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: empty_state
    type: empty-state
    icon: dashboard_customize
    title: "No data yet"
    body: "Your groups and activity will appear here once set up."
    cta_label: "View Groups"
    on_click: { action: OnViewAllGroups, target: group-list }
    test_context:
      purpose: "Shown when staff has no groups assigned yet"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "Could not load dashboard"
    body: "{{error.message}}"
    cta_label: "Retry"
    on_click: { action: Retry, target: admin-dashboard }
    test_context:
      purpose: "Full-screen error with retry when API calls fail"
      interaction_type: tap
      data_driven: true
      required_fields: [error.message]

states:
  initial_state: loading
  loading:
    components: [top_bar, welcome_header, shimmer_dashboard]
    description: "Parallel API calls in-flight; shimmer shown below the welcome header"
  content:
    components: [top_bar, welcome_header, kpi_summary_row, quick_nav_section, todays_schedule_section, recent_activity_section]
    description: "All KPI and schedule data loaded; bottom nav visible with home tab selected"
    demo_data:
      staffName: "Jane Wanjiru"
      staffId: 1
      totalGroups: 12
      totalMembers: 87
      overdueLoansCount: 3
      meetingsTodayCount: 2
      todaySchedule:
        - groupId: "ctr-001"
          groupName: "Mwangaza Women's Group"
          meetingTime: "10:00 AM"
          memberCount: 5
          location: "Community Hall, Nairobi"
        - groupId: "ctr-002"
          groupName: "Tumaini Savings Circle"
          meetingTime: "2:00 PM"
          memberCount: 12
          location: "Kipande House, Nairobi"
      recentActivity:
        - id: "act-001"
          type: "DEPOSIT"
          description: "Contribution collected"
          amount: 500.00
          date: "2026-05-07"
          memberName: "Mary Achieng"
          groupName: "Mwangaza Women's Group"
        - id: "act-002"
          type: "LOAN"
          description: "Loan disbursed"
          amount: 3000.00
          date: "2026-05-06"
          memberName: "Peter Otieno"
          groupName: "Tumaini Savings Circle"
        - id: "act-003"
          type: "NEW_MEMBER"
          description: "New member joined"
          amount: null
          date: "2026-05-05"
          memberName: "Grace Njoki"
          groupName: "Mwangaza Women's Group"
  empty:
    components: [top_bar, welcome_header, empty_state]
    description: "Staff has no groups assigned; empty state with CTA to groups screen"
  error:
    components: [top_bar, error_state]
    description: "API failed; full-screen error with retry button"

i18n:
  en:
    screen_title: "Dashboard"
    welcome_greeting: "Welcome back, {{staffName}}"
    welcome_subtitle: "Here's your overview for today"
    kpi_total_groups: "Total Groups"
    kpi_members: "Members"
    kpi_overdue_loans: "Overdue Loans"
    kpi_meetings_today: "Meetings Today"
    quick_nav_label: "Quick Navigation"
    nav_all_groups: "All Groups"
    nav_all_groups_sub: "{{n}} groups"
    nav_field_officers: "Field Officers"
    nav_field_officers_sub: "Officer overview"
    todays_schedule_label: "Today's Schedule"
    schedule_count_chip: "{{n}} meetings"
    no_meetings_today: "No meetings scheduled for today"
    activity_label: "Recent Activity"
    empty_title: "No data yet"
    empty_body: "Your groups and activity will appear here once set up."
    empty_cta: "View Groups"
    error_network: "No internet connection. Showing cached data."
    error_server: "Server error. Please try again."
    error_auth: "Session expired. Please log in again."

analytics:
  screen_view: admin_dashboard_viewed
  events:
    - trigger: KPI groups card tap
      name: admin_kpi_groups_tapped
    - trigger: KPI members card tap
      name: admin_kpi_members_tapped
    - trigger: KPI overdue loans card tap
      name: admin_kpi_overdue_tapped
      params: { overdue_count: Int }
    - trigger: KPI meetings today card tap
      name: admin_kpi_meetings_tapped
      params: { meetings_count: Int }
    - trigger: All Groups quick-nav tap
      name: admin_nav_group_list_tapped
    - trigger: Field Officers quick-nav tap
      name: admin_nav_field_officer_tapped
    - trigger: Today's Schedule meeting row tap
      name: admin_schedule_group_tapped
      params: { group_id: String }
    - trigger: pull to refresh
      name: admin_dashboard_refreshed
    - trigger: error retry tap
      name: admin_dashboard_retry_tapped
