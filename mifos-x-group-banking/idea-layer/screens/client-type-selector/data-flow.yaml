sibling: data-flow
schema_version: "2.1.0"
feature_id: client-type-selector

entries:
  - screen_id: clientTypeSelectorScreen
    trigger: on_mount
    endpoints: []
    tables: []
    dtos: []
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    notes: >
      Pure local routing screen — no API calls. On mount the screen is immediately
      in Content state. Selection of a tile sets local selectedClientType and
      triggers navigation to login with client_type param. SessionPreferences may
      be read to check for a saved client_type preference, but no network call is made.

  - screen_id: clientTypeSelectorScreen
    trigger: on_interact
    endpoints: []
    tables: []
    dtos: []
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    notes: >
      Tile tap sets isNavigating = true, triggers ripple animation,
      then NavigationManager routes to login with client_type = admin | end_user.
      No network activity.
