sibling: ui
schema_version: "4.0"
feature_id: client-type-selector

route: /select-client-type
entry_points:
  - source: app_launch
    condition: no_saved_session
  - source: logout
    condition: user_logged_out
nav_params: {}

screens:
  - id: client_type_selector_screen
    name: ClientTypeSelectorScreen
    composable: ClientTypeSelectorScreen
    description: Full-screen welcome with two large selection tiles
    layout: Column (centered, full-screen)

state_model:
  ClientTypeSelectorViewModel:
    state:
      name: ClientTypeSelectorState
      fields:
        selectedClientType: { type: "ClientType?", default: "null" }
        isNavigating: { type: Boolean, default: "false" }
    screen_state:
      name: ClientTypeSelectorScreenState
      members: [Idle, Navigating]
    errors: {}
    events:
      name: ClientTypeSelectorEvent
      members:
        - { name: NavigateToAdminLogin }
        - { name: NavigateToEndUserLogin }
    actions:
      name: ClientTypeSelectorAction
      members:
        - { name: OnAdminSelected, trigger: "Tap I manage a group tile" }
        - { name: OnMemberSelected, trigger: "Tap I am a group member tile" }
    di:
      - NavigationManager
      - SessionPreferences

components:
  - id: app_logo
    type: image
    name: AppLogo
    description: CommonPurse app logo — leaf + coin SVG mark
    style:
      size: 80dp
      alignment: center
      margin_top: 64dp
    a11y:
      content_description: "CommonPurse logo"
    test_context:
      purpose: Brand presence on entry screen
      interaction_type: non_interactive
      data_driven: false
      required_fields: []
    on_click: {}

  - id: app_title
    type: text
    name: AppTitle
    description: App name in large bold text
    style:
      text: "CommonPurse"
      text_style: headlineLarge
      color: onSurface
      font: Noto Sans
      weight: bold
      alignment: center
      margin_top: 12dp
    a11y:
      content_description: "CommonPurse community banking"
    test_context:
      purpose: Confirm app title visible on launch
      interaction_type: non_interactive
      data_driven: false
      required_fields: []
    on_click: {}

  - id: app_subtitle
    type: text
    name: AppSubtitle
    description: Tagline in secondary text
    style:
      text_key: i18n.subtitle
      text_style: bodyLarge
      color: onSurfaceVariant
      alignment: center
      margin_top: 4dp
      margin_bottom: 48dp
    a11y:
      content_description: "Your community savings group"
    test_context:
      purpose: Verify subtitle renders below title
      interaction_type: non_interactive
      data_driven: false
      required_fields: []
    on_click: {}

  - id: admin_tile
    type: card
    name: AdminTile
    description: Large selectable tile for admin/staff path. Icon + label. Min 96dp height.
    style:
      background: primaryContainer
      cornerRadius: lg
      padding: 24dp
      min_height: 120dp
      elevation: 2dp
      margin_horizontal: 24dp
      margin_bottom: 16dp
    icon:
      name: FluentIcons.people_community_24_filled
      size: 48dp
      tint: onPrimaryContainer
    label:
      text_key: i18n.admin_tile_label
      text_style: titleLarge
      color: onPrimaryContainer
      font: Noto Sans
    sublabel:
      text_key: i18n.admin_tile_sublabel
      text_style: bodyMedium
      color: onPrimaryContainer
    a11y:
      content_description: "I manage a group — staff or treasurer login"
      role: button
      min_touch_target: 48dp
    test_context:
      purpose: Verify admin path tile is tappable and navigates to login with client_type=admin
      interaction_type: tap
      data_driven: false
      required_fields: []
    on_click:
      action: OnAdminSelected
      target: login
      params: { client_type: admin }

  - id: member_tile
    type: card
    name: MemberTile
    description: Large selectable tile for end-user/member path. Icon + label. Min 96dp height.
    style:
      background: secondaryContainer
      cornerRadius: lg
      padding: 24dp
      min_height: 120dp
      elevation: 2dp
      margin_horizontal: 24dp
      margin_bottom: 16dp
    icon:
      name: FluentIcons.person_circle_24_filled
      size: 48dp
      tint: onSecondaryContainer
    label:
      text_key: i18n.member_tile_label
      text_style: titleLarge
      color: onSecondaryContainer
      font: Noto Sans
    sublabel:
      text_key: i18n.member_tile_sublabel
      text_style: bodyMedium
      color: onSecondaryContainer
    a11y:
      content_description: "I am a group member — member login"
      role: button
      min_touch_target: 48dp
    test_context:
      purpose: Verify member path tile is tappable and navigates to login with client_type=end_user
      interaction_type: tap
      data_driven: false
      required_fields: []
    on_click:
      action: OnMemberSelected
      target: login
      params: { client_type: end_user }

  - id: version_label
    type: text
    name: VersionLabel
    description: App version shown at bottom for support reference
    style:
      text: "v1.0.0"
      text_style: labelSmall
      color: outline
      alignment: center
      margin_bottom: 24dp
    a11y:
      content_description: "App version 1.0.0"
    test_context:
      purpose: Version visible for support/debug
      interaction_type: non_interactive
      data_driven: false
      required_fields: []
    on_click: {}

states:
  initial_state: content
  content:
    description: Both tiles fully rendered, ready for tap
    components_visible: [app_logo, app_title, app_subtitle, admin_tile, member_tile, version_label]
  navigating:
    description: Brief ripple animation then navigate; tiles disabled
    components_visible: [app_logo, app_title, app_subtitle, admin_tile, member_tile]

i18n:
  subtitle: "Your community savings group"
  admin_tile_label: "I manage a group"
  admin_tile_sublabel: "Treasurer · Chairperson · Field Officer"
  member_tile_label: "I'm a group member"
  member_tile_sublabel: "Check savings · Request loans"
  version_prefix: "Version"
