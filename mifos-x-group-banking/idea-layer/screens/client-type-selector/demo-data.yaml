feature_id: client-type-selector

entries:
  - dto: ClientTypeOption
    count_hint: 2
    source_notes: >
      Two client type tiles presented to the user on app launch.
      Admin covers treasurer, chairperson, and field officer roles.
      EndUser covers group members doing self-service savings and loan requests.
      No network data — all values are static i18n + navigation targets.
    items:
      - clientType: "ADMIN"
        tileLabel: "I manage a group"
        tileSublabel: "Treasurer · Chairperson · Field Officer"
        iconName: "FluentIcons.people_community_24_filled"
        navTarget: "login"
        navParams:
          client_type: "admin"

      - clientType: "END_USER"
        tileLabel: "I'm a group member"
        tileSublabel: "Check savings · Request loans"
        iconName: "FluentIcons.person_circle_24_filled"
        navTarget: "login"
        navParams:
          client_type: "end_user"

