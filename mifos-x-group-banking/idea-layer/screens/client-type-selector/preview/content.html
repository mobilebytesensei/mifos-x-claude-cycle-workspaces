<!DOCTYPE html>
<html lang="en" data-feature="client-type-selector" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>client-type-selector · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="auth">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<main style="padding: var(--space-2xl) var(--space-lg);">
  <div class="brand-lockup" style="padding: 32px 0 24px;">
    <div class="mark" style="width:64px;height:64px;font-size:24px;">●</div>
    <h1 style="font-size:22px;">Who are you?</h1>
    <p>Pick the role that matches how you'll use CommonPurse</p>
  </div>
  <div data-component-type="card_group" data-component-id="c-tiles" style="display:flex;flex-direction:column;gap:var(--space-base);">
    <button class="card" data-component-type="card" data-component-id="c-admin-tile" data-nav-to="login" data-nav-params='{"role":"admin"}' style="border:1px solid var(--primary-100);text-align:left;cursor:pointer;padding:var(--space-lg);">
      <div style="display:flex;align-items:center;gap:var(--space-md);margin-bottom:8px;">
        <div style="width:48px;height:48px;border-radius:12px;background:var(--primary-100);color:var(--primary-700);display:inline-flex;align-items:center;justify-content:center;font-size:24px;">⎈</div>
        <h3 style="font-size:17px;margin:0;">Treasurer / Secretary</h3>
      </div>
      <p style="font-size:13px;color:var(--text-secondary);margin-left:60px;">Full access — record meetings, approve loans, run share-out</p>
    </button>
    <button class="card" data-component-type="card" data-component-id="c-member-tile" data-nav-to="login" data-nav-params='{"role":"member"}' style="border:1px solid var(--accent-100);text-align:left;cursor:pointer;padding:var(--space-lg);">
      <div style="display:flex;align-items:center;gap:var(--space-md);margin-bottom:8px;">
        <div style="width:48px;height:48px;border-radius:12px;background:var(--accent-100);color:#B45309;display:inline-flex;align-items:center;justify-content:center;font-size:24px;">◑</div>
        <h3 style="font-size:17px;margin:0;">Member</h3>
      </div>
      <p style="font-size:13px;color:var(--text-secondary);margin-left:60px;">View your savings, loans, and group activity</p>
    </button>
  </div>
  <p class="footnote" style="text-align:center;margin-top:24px;">CommonPurse v0.4.1 · Mifos Fineract</p>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
