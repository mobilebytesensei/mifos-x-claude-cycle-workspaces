sibling: flow
schema_version: "4.0"
feature_id: client-type-selector

navigates_to:
  - target: login
    condition: user_selects_admin
    params: { client_type: admin }
  - target: login
    condition: user_selects_end_user
    params: { client_type: end_user }

flow_logic:
  - decision: user_taps_tile
    branches:
      - condition: tile == admin
        action: emit NavigateToAdminLogin, pass client_type=admin to login screen
      - condition: tile == member
        action: emit NavigateToEndUserLogin, pass client_type=end_user to login screen

dependencies:
  tier: ui
  features: []
  services:
    - NavigationManager
    - SessionPreferences
  shared_entities:
    - ClientType (enum: ADMIN, END_USER)
