sibling: tests
schema_version: "4.0"
feature_id: client-type-selector

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-CTS-001
      scenario: "Screen renders in Content state immediately on mount with both tiles visible"
      type: Screen
      priority: P0

    - id: TC-CTS-002
      scenario: "Tapping admin tile sets selectedClientType = ADMIN and emits NavigateToAdminLogin event"
      type: ViewModel
      priority: P0

    - id: TC-CTS-003
      scenario: "Tapping member tile sets selectedClientType = END_USER and emits NavigateToEndUserLogin event"
      type: ViewModel
      priority: P0

    - id: TC-CTS-004
      scenario: "NavigateToAdminLogin event passes client_type = admin to login screen nav params"
      type: ViewModel
      priority: P0

    - id: TC-CTS-005
      scenario: "NavigateToEndUserLogin event passes client_type = end_user to login screen nav params"
      type: ViewModel
      priority: P0

    - id: TC-CTS-006
      scenario: "Admin tile has minimum touch target of 48dp and correct content description for accessibility"
      type: Screen
      priority: P1

    - id: TC-CTS-007
      scenario: "Member tile has minimum touch target of 48dp and correct content description for accessibility"
      type: Screen
      priority: P1

    - id: TC-CTS-008
      scenario: "When isNavigating = true, both tiles are disabled and ripple animation plays"
      type: Screen
      priority: P1

    - id: TC-CTS-009
      scenario: "App logo, title 'CommonPurse', and tagline are all visible on screen"
      type: Screen
      priority: P1

    - id: TC-CTS-010
      scenario: "Version label is visible at screen bottom with correct version text"
      type: Screen
      priority: P2

    - id: TC-CTS-011
      scenario: "Double-tap on admin tile does not trigger double navigation"
      type: ViewModel
      priority: P1

    - id: TC-CTS-012
      scenario: "Screen is accessible from app_launch when no saved session exists"
      type: UseCase
      priority: P0

    - id: TC-CTS-013
      scenario: "Screen is accessible after logout event clears session"
      type: UseCase
      priority: P1
