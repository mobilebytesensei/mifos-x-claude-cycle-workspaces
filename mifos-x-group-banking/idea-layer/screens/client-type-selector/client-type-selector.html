<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Type Selector — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { display: ['Noto Sans', 'system-ui', 'sans-serif'] },
      colors: {
        primary: '#2E7D32', 'on-primary': '#FFFFFF',
        'primary-container': '#C8E6C9', 'on-primary-container': '#1B5E20',
        secondary: '#FF8F00', 'on-secondary': '#FFFFFF',
        'secondary-container': '#FFE0B2', 'on-secondary-container': '#E65100',
        tertiary: '#1565C0', 'on-tertiary': '#FFFFFF',
        surface: '#FAFAFA', 'on-surface': '#1A1C19',
        'surface-variant': '#F1F4EF', 'on-surface-variant': '#42493F',
        error: '#D32F2F', 'error-container': '#FFDAD6',
        outline: '#72796F',
      }
    }
  }
};
</script>
<style>
:root {
  --primary: #2E7D32; --on-primary: #FFFFFF;
  --primary-container: #C8E6C9; --on-primary-container: #1B5E20;
  --secondary: #FF8F00; --secondary-container: #FFE0B2; --on-secondary-container: #E65100;
  --tertiary: #1565C0;
  --bg: #FAFAFA; --surface: #FAFAFA; --surface-variant: #F1F4EF;
  --text: #1A1C19; --text-secondary: #42493F; --text-tertiary: #72796F;
  --border: #C8D8C5; --error: #D32F2F;
}
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width: 393px; min-height: 852px; border-radius: 2.5rem; overflow: hidden; position: relative; background: #FAFAFA; }
body.embedded { background: var(--bg); margin: 0; padding: 0; min-height: 100vh; display: block; }
body.embedded #standalone-toolbar { display: none !important; }
body.embedded #phone-wrapper { display: none !important; }
body.embedded #embedded-content { display: flex !important; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; background: var(--bg); }
.tile-card { transition: transform 0.15s ease, box-shadow 0.15s ease; cursor: pointer; }
.tile-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(46,125,50,0.15); }
.tile-card:active { transform: scale(0.98); }
@keyframes ripple { 0% { transform: scale(0); opacity: 0.4; } 100% { transform: scale(4); opacity: 0; } }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<!-- Standalone Toolbar -->
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Client Type Selector — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="content">Content (Default)</option>
    <option value="navigating">Navigating</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<!-- Phone Frame -->
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone shadow-2xl border border-slate-200/20">
    <!-- Status Bar -->
    <div class="flex items-center justify-between px-6 py-2 bg-[#FAFAFA]">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-slate-900">wifi</span>
        <span class="material-symbols-outlined text-sm text-slate-900">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-[#FAFAFA]" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-[#FAFAFA]"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<!-- Embedded Content -->
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-[#FAFAFA] shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-slate-900">wifi</span>
      <span class="material-symbols-outlined text-sm text-slate-900">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-[#FAFAFA] flex-1"></div>
  <div class="flex justify-center py-2 bg-[#FAFAFA] shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>

<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) {
  document.body.classList.remove('bg-[#0F0F23]', 'min-h-screen', 'flex', 'flex-col');
  document.body.classList.add('embedded');
}

function getContentEl() {
  return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content');
}

var currentState = 'content';

function renderContent() {
  return `
  <div class="flex flex-col min-h-full bg-[#FAFAFA]">
    <!-- Logo + Branding -->
    <div class="flex flex-col items-center pt-16 pb-6 px-6">
      <!-- Logo mark: leaf + coin -->
      <div class="w-20 h-20 rounded-3xl flex items-center justify-center shadow-lg mb-4" style="background: linear-gradient(135deg, #2E7D32, #388E3C)">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="28" cy="28" r="14" fill="rgba(255,255,255,0.25)"/>
          <circle cx="28" cy="28" r="10" fill="rgba(255,255,255,0.4)"/>
          <text x="24" y="33" font-size="13" font-weight="bold" fill="white" text-anchor="middle">KES</text>
          <path d="M12 8 C12 8 20 10 22 20 C18 16 10 18 12 8Z" fill="rgba(255,255,255,0.8)"/>
          <path d="M16 6 C16 6 24 8 22 20 C18 14 12 16 16 6Z" fill="white"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-slate-900 mb-1">CommonPurse</h1>
      <p class="text-base text-[#42493F]">Your community savings group</p>
    </div>

    <!-- Spacer -->
    <div class="flex-1 flex flex-col justify-center px-6 gap-4 pb-8">
      <p class="text-sm font-semibold text-[#72796F] uppercase tracking-wider text-center mb-2">I am a...</p>

      <!-- Admin Tile -->
      <!-- tap: navigates to login with client_type=admin -->
      <div class="tile-card rounded-2xl p-6 shadow-sm border border-[#C8E6C9]"
           style="background: #E8F5E9;"
           onclick="navigateTo('login')">
        <div class="flex items-start gap-4">
          <div class="w-14 h-14 rounded-xl flex items-center justify-center shrink-0" style="background: #2E7D32;">
            <span class="material-symbols-outlined text-white text-3xl">groups</span>
          </div>
          <div class="flex-1">
            <div class="text-lg font-bold text-[#1B5E20] mb-0.5">I manage a group</div>
            <div class="text-sm text-[#2E7D32]">Treasurer · Chairperson · Field Officer</div>
          </div>
          <span class="material-symbols-outlined text-[#2E7D32] mt-1">chevron_right</span>
        </div>
      </div>

      <!-- Member Tile -->
      <!-- tap: navigates to login with client_type=end_user -->
      <div class="tile-card rounded-2xl p-6 shadow-sm border border-[#FFE0B2]"
           style="background: #FFF8E1;"
           onclick="navigateTo('login')">
        <div class="flex items-start gap-4">
          <div class="w-14 h-14 rounded-xl flex items-center justify-center shrink-0" style="background: #FF8F00;">
            <span class="material-symbols-outlined text-white text-3xl">person</span>
          </div>
          <div class="flex-1">
            <div class="text-lg font-bold text-[#E65100] mb-0.5">I'm a group member</div>
            <div class="text-sm text-[#FF8F00]">Check savings · Request loans</div>
          </div>
          <span class="material-symbols-outlined text-[#FF8F00] mt-1">chevron_right</span>
        </div>
      </div>
    </div>

    <!-- Version -->
    <div class="text-center pb-6">
      <span class="text-xs text-[#72796F]">v1.0.0</span>
    </div>
  </div>`;
}

function renderNavigating() {
  return `
  <div class="flex flex-col min-h-full bg-[#FAFAFA] items-center justify-center">
    <div class="w-12 h-12 border-4 border-[#C8E6C9] border-t-[#2E7D32] rounded-full animate-spin mb-4"></div>
    <p class="text-sm text-[#42493F]">Opening...</p>
  </div>`;
}

function switchState(stateId) {
  currentState = stateId || 'content';
  document.getElementById('statePicker').value = currentState;
  var html = currentState === 'navigating' ? renderNavigating() : renderContent();
  getContentEl().innerHTML = html;
}

function navigateTo(target) {
  if (window !== window.top) {
    window.parent.postMessage({ action: 'navigate', screenId: target }, '*');
  } else {
    showToast('Navigate to: ' + target);
  }
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function toggleDark() {
  var phone = document.querySelector('.phone') || document.getElementById('embedded-screen-content');
  if (phone) phone.classList.toggle('bg-slate-900');
}

window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.action === 'switchState') switchState(e.data.stateId || e.data.state || '');
  if (e.data.action === 'getInspectorData') notifyParent();
});

function notifyParent() {
  if (window === window.top) return;
  window.parent.postMessage({
    action: 'screenLoaded',
    screenId: 'client-type-selector',
    name: 'Client Type Selector',
    feature: 'authentication',
    status: 'enriched',
    componentCount: 5,
    states: [{ id: 'content', name: 'Content' }, { id: 'navigating', name: 'Navigating' }],
    inspectorData: {
      id: 'client-type-selector',
      name: 'Client Type Selector',
      feature: 'authentication',
      status: 'enriched',
      phase: '',
      components: [
        { type: 'image', label: 'AppLogo', tag: '', target: '' },
        { type: 'text', label: 'CommonPurse', tag: '', target: '' },
        { type: 'text', label: 'Your community savings group', tag: '', target: '' },
        { type: 'card', label: 'I manage a group', tag: '', target: 'login' },
        { type: 'card', label: "I'm a group member", tag: '', target: 'login' },
        { type: 'text', label: 'v1.0.0', tag: '', target: '' }
      ],
      states: { content: {}, navigating: {} },
      incoming_from: ['app_launch', 'logout']
    }
  }, '*');
}

// Init
switchState('content');
notifyParent();
</script>
</body>
</html>
