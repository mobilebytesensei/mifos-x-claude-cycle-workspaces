id: client-type-selector
name: Client Type Selector
description: >
  First screen users see on app launch. Presents two large icon-driven tiles to
  select authentication path — staff (admin/treasurer/FO) or member (self-service).
  No API call. Pure navigation decision with minimal text for low-literacy rural UX.
feature: authentication
flow: authentication-flow
version: "1.0.0"
tags: [auth, onboarding, client-type, both-clients, entry-point]

status: designed
quality_score: 88
