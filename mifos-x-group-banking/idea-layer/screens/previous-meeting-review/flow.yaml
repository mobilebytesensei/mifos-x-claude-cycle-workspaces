sibling: flow
schema_version: "4.0"
feature_id: previous-meeting-review

navigates_to:
  - target: meeting-conduct
    condition: user_taps_start_meeting_from_review
    params: { meeting_id: String, meeting_number: Int, group_id: Int }
  - target: meeting-calendar
    condition: user_taps_back

flow_logic:
  on_load:
    - decision: cache_check
      branches:
        - condition: cached_data_available
          action: render_cached_immediately_and_fetch_fresh_in_background
        - condition: no_cache
          action: show_loading_skeleton_and_fetch_from_api
    - decision: launched_from
      branches:
        - condition: "launchedFrom == 'conduct'"
          action: show_context_banner_conducting + show_start_meeting_cta
        - condition: "launchedFrom == 'calendar'"
          action: show_context_banner_completed + hide_start_meeting_cta
    - decision: unresolved_items
      branches:
        - condition: "unresolvedItems.isNotEmpty()"
          action: render_unresolved_alert_section
        - condition: "unresolvedItems.isEmpty()"
          action: hide_unresolved_alert_section
  on_start_meeting:
    - condition: "launchedFrom == 'conduct'"
      navigate: meeting-conduct
      params: { meeting_id: "{{nextMeetingId}}", meeting_number: "{{nextMeetingNumber}}", group_id: "{{groupId}}" }
