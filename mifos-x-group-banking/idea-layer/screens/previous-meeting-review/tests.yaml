sibling: tests
schema_version: "4.0"
feature_id: previous-meeting-review

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PMR-001
      scenario: "Screen loads complete meeting 15 data on mount from calendar entry point"
      type: ViewModel
      priority: P0
      given: "meetingId='meeting_015', meetingNumber=15, centerId=7, launchedFrom='calendar'"
      when: "LoadPreviousMeeting dispatched on composition"
      then: "MeetingRepository loads recap from LocalMeetingDao cache first then revalidates; state.meetingDetail populated; attendanceCount=4, totalMemberCount=5; screen_state=Content"

    - id: TC-PMR-002
      scenario: "Summary metrics card shows total collected and closing corpus"
      type: Screen
      priority: P0
      given: "Content state, totalSavingsCollected=2000, closingCorpus=43800, finesCollected=100, loansDisbursed=5000"
      when: "Screen renders summary_metrics_card"
      then: "Total Collected='KES 2000', Closing Corpus row='KES 43800', Fines Collected='KES 100', Loans Disbursed='KES 5000'"

    - id: TC-PMR-003
      scenario: "Attendance row for Peter Otieno shows LATE chip in warning color"
      type: Screen
      priority: P0
      given: "attendanceRecords has Peter with status='LATE', fineAmount=50"
      when: "Screen renders attendance_detail_row"
      then: "Peter's trailing chip label='LATE' with warningContainer background, supporting text 'Fine: KES 50' visible"

    - id: TC-PMR-004
      scenario: "Mary Njeri shows ABSENT chip in error color with fine displayed"
      type: Screen
      priority: P0
      given: "attendanceRecords has Mary with status='ABSENT', fineAmount=50"
      when: "Screen renders attendance_detail_row"
      then: "Mary's trailing chip label='ABSENT' with errorContainer background, avatar background errorContainer, supporting text 'Fine: KES 50' visible"

    - id: TC-PMR-005
      scenario: "Amina Wanjiru shows PRESENT chip in primary color with no fine"
      type: Screen
      priority: P1
      given: "attendanceRecords has Amina with status='PRESENT', fineAmount=0"
      when: "Screen renders attendance_detail_row"
      then: "Amina's trailing chip label='PRESENT' with primaryContainer background, supporting text not visible (fineAmount not > 0)"

    - id: TC-PMR-006
      scenario: "Savings breakdown shows per-member group + individual contributions"
      type: Screen
      priority: P1
      given: "savingsBreakdown: Amina groupSavings=300 individualSavings=200 totalSavings=500, Mary=0"
      when: "Screen renders member_savings_row"
      then: "Rows visible; Amina supporting text='Group: KES 300 · Individual: KES 200', trailing='KES 500'; Mary row shows KES 0 total"

    - id: TC-PMR-007
      scenario: "Unresolved items alert card shown when unresolvedItems is not empty"
      type: Screen
      priority: P0
      given: "unresolvedItems has 1 UNPAID_FINE for Mary Njeri"
      when: "Screen renders"
      then: "unresolved_alert_card visible with warning_24_filled icon, 'Unresolved Items' header, Mary's fine description row"

    - id: TC-PMR-008
      scenario: "Unresolved alert card hidden when all items resolved"
      type: Screen
      priority: P1
      given: "unresolvedItems=emptyList()"
      when: "Screen renders"
      then: "unresolved_alert_card not visible (visible_when 'unresolvedItems.isNotEmpty()' false)"

    - id: TC-PMR-009
      scenario: "Context banner shows conduct text when launchedFrom=conduct"
      type: Screen
      priority: P1
      given: "launchedFrom='conduct', nextMeetingNumber=16, meetingDetail.actualDate='2026-05-06'"
      when: "Screen renders context_banner"
      then: "context_conduct_text visible with 'Reviewing before Meeting #16 — 2026-05-06', context_calendar_text not visible"

    - id: TC-PMR-010
      scenario: "Context banner shows completed text when launchedFrom=calendar"
      type: Screen
      priority: P1
      given: "launchedFrom='calendar', meetingDetail.actualDate='2026-05-06'"
      when: "Screen renders context_banner"
      then: "context_calendar_text visible with 'Completed Meeting — 2026-05-06', context_conduct_text not visible"

    - id: TC-PMR-011
      scenario: "Loan activity row shows disbursed chip when amountDisbursed > 0"
      type: Screen
      priority: P1
      given: "loanItems has Joseph with amountDisbursed=5000, amountRepaid=0, outstandingAfter=5000"
      when: "Screen renders loan_activity_row"
      then: "Joseph's row shows trailing chip 'Disbursed KES 5000', supporting 'Repaid: KES 0 · Outstanding: KES 5000'"

    - id: TC-PMR-012
      scenario: "Loan activity row hides disbursed chip for pure repayment"
      type: Screen
      priority: P1
      given: "loanItems has Amina with amountRepaid=458, amountDisbursed=0, outstandingAfter=2792"
      when: "Screen renders loan_activity_row"
      then: "Amina's row supporting='Repaid: KES 458 · Outstanding: KES 2792', disbursed chip not visible (amountDisbursed not > 0)"

    - id: TC-PMR-013
      scenario: "Start Meeting CTA visible only when launchedFrom=conduct"
      type: Screen
      priority: P1
      given: "launchedFrom='conduct', nextMeetingNumber=16"
      when: "Screen renders Content state"
      then: "start_meeting_cta visible with label 'Start Meeting #16'; hidden when launchedFrom='calendar'"

    - id: TC-PMR-014
      scenario: "Start Meeting CTA tap navigates to meeting-conduct with next-meeting params"
      type: ViewModel
      priority: P0
      given: "launchedFrom='conduct', nextMeetingId='meeting_016', nextMeetingNumber=16, centerId=7"
      when: "StartNewMeeting dispatched from start_meeting_cta"
      then: "NavigateToConduct event emitted (navigate effect) with meeting_id='meeting_016', meeting_number=16, center_id=7; no data written"

    - id: TC-PMR-015
      scenario: "Loading state renders 5 shimmer skeleton rows"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "Loading state rendered"
      then: "loading_skeleton visible with count=5; top_app_bar shown; content sections hidden"

    - id: TC-PMR-016
      scenario: "Network error with no cache shows error state with LoadFailed message"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, no LocalMeetingDao cache for meetingId"
      when: "LoadPreviousMeeting dispatched"
      then: "state.error set, screen_state=Error, top_app_bar shown, LoadFailed message ('Could not load previous meeting data. Check connection and try again.') surfaced"

    - id: TC-PMR-017
      scenario: "Cached recap shown offline via stale-while-revalidate"
      type: Repository
      priority: P1
      given: "NetworkMonitor.isOnline=false, valid LocalMeetingDao cache for meetingId='meeting_015'"
      when: "MeetingRepository.loadPreviousMeeting('meeting_015') collected"
      then: "Content state served from SQLDelight cache, no HTTP refresh fired, previous-meeting immutable data rendered"

    - id: TC-PMR-018
      scenario: "Attendance chip row shows present/total summary chip"
      type: Screen
      priority: P1
      given: "attendanceCount=4, totalMemberCount=5"
      when: "Screen renders attendance_chip_row"
      then: "attendance_chip label='4/5 Present' with primaryContainer background"

    - id: TC-PMR-019
      scenario: "Back navigation works from calendar entry point"
      type: ViewModel
      priority: P2
      given: "launchedFrom='calendar'"
      when: "NavigateBack dispatched from top_app_bar navigation icon"
      then: "NavigateBack event emitted, previous-meeting-review popped, returns to meeting-calendar"

    - id: TC-PMR-020
      scenario: "Back navigation works from conduct entry point"
      type: ViewModel
      priority: P2
      given: "launchedFrom='conduct'"
      when: "NavigateBack dispatched"
      then: "NavigateBack event emitted, returns to meeting-conduct step 0"
