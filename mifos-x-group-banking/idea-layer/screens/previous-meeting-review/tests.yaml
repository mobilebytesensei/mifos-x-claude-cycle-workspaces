sibling: tests
schema_version: "4.0"
feature_id: previous-meeting-review
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PMR-001
      scenario: "On mount, previous meeting data loads from MeetingRepository with meetingId"
      type: ViewModel
      priority: P0
      given: "meetingId=4; groupId=1; network online"
      when: "PreviousMeetingReviewScreen enters composition"
      then: "MeetingRepository.getMeetingSummary(4) called; summary populated; PreviousMeetingReviewScreenState=Content"

    - id: TC-PMR-002
      scenario: "launchedFrom context adjusts header title and back navigation target"
      type: Screen
      priority: P1
      given: "nav_params: launchedFrom=MEETING_CONDUCT"
      when: "PreviousMeetingReviewScreen renders"
      then: "title shows 'Review Previous Meeting'; back → NavigateBack to meeting-conduct"

    - id: TC-PMR-003
      scenario: "launchedFrom=CALENDAR shows review header and back to meeting-calendar"
      type: Screen
      priority: P1
      given: "nav_params: launchedFrom=CALENDAR"
      when: "PreviousMeetingReviewScreen renders"
      then: "header title 'Previous Meeting'; back → NavigateBack to meeting-calendar"

    - id: TC-PMR-004
      scenario: "Unresolved items section shown with count badge when unresolvedItems > 0"
      type: Screen
      priority: P0
      given: "Content state; unresolvedItems=[{id:2, description:'Overdue loan follow-up'}]"
      when: "UnresolvedItemsSection renders"
      then: "1 unresolved item shown with amber badge; description 'Overdue loan follow-up' visible"

    - id: TC-PMR-005
      scenario: "No unresolved items section hides badge"
      type: Screen
      priority: P1
      given: "Content state; unresolvedItems=[]"
      when: "UnresolvedItemsSection renders"
      then: "section shows 'No unresolved items'; no badge"

    - id: TC-PMR-006
      scenario: "OnStartNextMeeting navigates to meeting-conduct with next meetingId"
      type: ViewModel
      priority: P0
      given: "Content state; nextMeeting.id=5"
      when: "OnStartNextMeeting fires"
      then: "NavigateToMeetingConduct emitted with meetingId=5 and groupId=1"

    - id: TC-PMR-007
      scenario: "Attendance and savings summary shown same as meeting-summary"
      type: Screen
      priority: P1
      given: "Content state; summary={attendees:7, totalSavings:3500.0}"
      when: "SummarySection renders"
      then: "7 attendees; KES 3,500 collections shown"

    - id: TC-PMR-008
      scenario: "Error state shows retry on load failure"
      type: Screen
      priority: P1
      given: "MeetingRepository.getMeetingSummary returns network error"
      when: "load completes"
      then: "PreviousMeetingReviewScreenState=Error; retry CTA shown"
