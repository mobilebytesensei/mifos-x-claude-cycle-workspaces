sibling: tests
schema_version: "4.0"
feature_id: previous-meeting-review

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-PMR-001
      scenario: "Screen loads complete meeting 15 data on mount from calendar entry point"
      type: ViewModel
      priority: P0
      given: "meetingId='meeting_015', meetingNumber=15, centerId=7, launchedFrom='calendar'"
      when: "LoadPreviousMeeting dispatched on composition"
      then: "get_meeting_record_detail + get_meeting_attendance + get_pending_loan_votes all called; state.meetingDetail populated; attendanceCount=4, totalMemberCount=5"

    - id: TC-PMR-002
      scenario: "Summary metrics card shows KES 2,000 collected and KES 43,800 closing corpus"
      type: Screen
      priority: P0
      given: "Content state, totalSavingsCollected=2000, closingCorpus=43800"
      when: "Screen renders summary_metrics_card"
      then: "total_collected_text='KES 2000', closing_corpus shows 'KES 43,800', fines_collected='KES 100', loans_disbursed='KES 5,000'"

    - id: TC-PMR-003
      scenario: "Attendance row for Peter Otieno shows LATE chip in warning color"
      type: Screen
      priority: P0
      given: "attendanceRecords has Peter with status='LATE', fineAmount=50"
      when: "Screen renders attendance_detail_row"
      then: "Peter's trailing chip label='LATE' with warningContainer background, supporting text 'Fine: KES 50' visible"

    - id: TC-PMR-004
      scenario: "Mary Njeri shows ABSENT chip in error color with fine displayed"
      type: Screen
      priority: P0
      given: "attendanceRecords has Mary with status='ABSENT', fineAmount=50"
      when: "Screen renders attendance_detail_row"
      then: "Mary's trailing chip label='ABSENT' with errorContainer background, supporting text 'Fine: KES 50' visible"

    - id: TC-PMR-005
      scenario: "Amina Wanjiru shows PRESENT chip in primary color with no fine"
      type: Screen
      priority: P1
      given: "attendanceRecords has Amina with status='PRESENT', fineAmount=0"
      when: "Screen renders attendance_detail_row"
      then: "Amina's trailing chip label='PRESENT' with primaryContainer background, supporting text not visible"

    - id: TC-PMR-006
      scenario: "Savings breakdown shows per-member contributions correctly"
      type: Screen
      priority: P1
      given: "savingsBreakdown: Amina=500, Joseph=600, Grace=400, Peter=500, Mary=0"
      when: "Screen renders member_savings_row"
      then: "5 rows visible; Mary row shows KES 0 with absent styling; totals sum to 2000"

    - id: TC-PMR-007
      scenario: "Unresolved items alert card shown when unresolvedItems is not empty"
      type: Screen
      priority: P0
      given: "unresolvedItems has 1 UNPAID_FINE for Mary Njeri"
      when: "Screen renders"
      then: "unresolved_alert_card visible with warning icon, 'Unresolved Items' header, Mary's fine description"

    - id: TC-PMR-008
      scenario: "Unresolved alert card hidden when all items resolved"
      type: Screen
      priority: P1
      given: "unresolvedItems=emptyList()"
      when: "Screen renders"
      then: "unresolved_alert_card not visible"

    - id: TC-PMR-009
      scenario: "Context banner shows 'Reviewing before Meeting #16' when launchedFrom=conduct"
      type: Screen
      priority: P1
      given: "launchedFrom='conduct', nextMeetingNumber=16, meetingDetail.actualDate='2026-05-06'"
      when: "Screen renders context_banner"
      then: "context_conduct_text visible with 'Reviewing before Meeting #16 — 2026-05-06'"

    - id: TC-PMR-010
      scenario: "Context banner shows 'Completed Meeting' when launchedFrom=calendar"
      type: Screen
      priority: P1
      given: "launchedFrom='calendar'"
      when: "Screen renders context_banner"
      then: "context_calendar_text visible with 'Completed Meeting — 2026-05-06', context_conduct_text not visible"

    - id: TC-PMR-011
      scenario: "Loan activity section shows Joseph Kamau disbursed KES 5,000"
      type: Screen
      priority: P1
      given: "loanItems has Joseph with amountDisbursed=5000"
      when: "Screen renders loan_items section"
      then: "Joseph's loan row shows 'Disbursed: KES 5,000' with outstandingAfter='KES 5,000'"

    - id: TC-PMR-012
      scenario: "Loan activity shows Amina repaid KES 458"
      type: Screen
      priority: P1
      given: "loanItems has Amina with amountRepaid=458, outstandingAfter=2792"
      when: "Screen renders loan_items section"
      then: "Amina's row shows 'Repaid: KES 458', outstanding='KES 2,792'"

    - id: TC-PMR-013
      scenario: "Network error shows error state with retry CTA"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, no cache for meetingId"
      when: "LoadPreviousMeeting dispatched"
      then: "error state visible with LoadFailed message and retry button"

    - id: TC-PMR-014
      scenario: "Cached data shown offline — stale banner displayed"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false, valid cache for meetingId='meeting_015'"
      when: "LoadPreviousMeeting dispatched"
      then: "Content state from cache, stale data banner or snackbar shown"

    - id: TC-PMR-015
      scenario: "Attendance chip row shows '4/5 Present' summary chip"
      type: Screen
      priority: P1
      given: "attendanceCount=4, totalMemberCount=5"
      when: "Screen renders attendance_chip_row"
      then: "attendance_chip label='4/5 Present' with primaryContainer background"

    - id: TC-PMR-016
      scenario: "Back navigation works from both calendar and conduct entry points"
      type: ViewModel
      priority: P2
      given: "launchedFrom='calendar'"
      when: "NavigateBack dispatched"
      then: "NavigateBack event emitted, returns to appropriate previous screen"
