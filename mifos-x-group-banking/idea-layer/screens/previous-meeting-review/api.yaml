sibling: api
schema_version: "4.0"
feature_id: previous-meeting-review

api:
  - id: get_meeting_record_detail
    function: get_meeting_record_detail
    method: get
    endpoint: "/fineract-provider/api/v1/datatables/dt_meeting_record/{centerId}"
    description: Fetch the specified meeting record including all sub-data
    params:
      centerId: { type: Int, required: true, source: nav_params }
      meetingNumber: { type: Int, required: true, source: nav_params }
    errors:
      404: Show error state
      5xx: Show cached data if available
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_meeting_attendance
    function: get_meeting_attendance
    method: get
    endpoint: "/fineract-provider/api/v1/datatables/dt_meeting_attendance/{meetingId}"
    description: Fetch attendance records for the previous meeting
    params:
      meetingId: { type: String, required: true, source: nav_params }
    errors:
      404: Empty attendance list
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_pending_loan_votes
    function: get_pending_loan_votes
    method: get
    endpoint: "/fineract-provider/api/v1/datatables/dt_loan_vote/{loanId}"
    description: Check for unresolved loan votes from previous meeting
    params:
      loanId: { type: String, required: true }
    errors:
      404: No pending votes

dtos:
  PreviousMeetingDetailResponse:
    meetingId: String
    meetingNumber: Int
    actualDate: String
    status: String
    attendanceCount: Int
    totalMemberCount: Int
    groupSavingsCollected: Long
    individualSavingsCollected: Long
    totalSavingsCollected: Long
    loansDisbursed: Long
    loansRepaid: Long
    finesCollected: Long
    openingCorpus: Long
    closingCorpus: Long
    savingsBreakdown: "List<MemberSavingsSummary>"
    attendanceRecords: "List<AttendanceRecord>"
    loanItems: "List<LoanActivityItem>"

  AttendanceRecord:
    memberId: String
    memberName: String
    status: { type: String, values: [PRESENT, LATE, ABSENT] }
    fineAmount: Long

  MemberSavingsSummary:
    memberId: String
    memberName: String
    groupSavings: Long
    individualSavings: Long
    totalSavings: Long

  LoanActivityItem:
    memberId: String
    memberName: String
    amountRepaid: Long
    amountDisbursed: Long
    outstandingAfter: Long

  LoanVoteRecord:
    loanId: String
    resolved: Boolean
    votesFor: Int
    votesAgainst: Int

  UnresolvedItem:
    type: { values: [UNPAID_FINE, PENDING_LOAN_VOTE, MISSED_ATTENDANCE] }
    description: String
    memberId: String

  PreviousMeetingDetail:
    summary: PreviousMeetingDetailResponse
    unresolvedItems: "List<UnresolvedItem>"

cache_strategy:
  ttl: 300
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: MeetingRepository
      methods:
        - "getPreviousMeetingDetail(centerId: Int, meetingNumber: Int): Flow<PreviousMeetingDetail>"
        - "getMeetingAttendance(meetingId: String): Flow<List<AttendanceRecord>>"
        - "getPendingLoanVotes(loanId: String): Flow<LoanVoteRecord?>"
  services:
    - NavigationManager
    - NetworkMonitor
  local_db:
    - table: meeting_records
      schema: SQLDelight LocalMeetingDao
