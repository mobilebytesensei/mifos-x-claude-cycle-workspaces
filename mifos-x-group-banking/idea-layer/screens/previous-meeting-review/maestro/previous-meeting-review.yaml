# ─────────────────────────────────────────────────────────────────────────────
# E2E — previous-meeting-review : calendar past-meeting row → read-only recap
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (GroupBankingNavHost §9e ← §9c meeting-calendar `onNavigateToReview`):
#   login(ORGANIZER) → group-dashboard → View Meetings → meeting-calendar →
#   tap a COMPLETED/MISSED past-meeting row (meeting_calendar_row_<id>) → this screen
#   (launchedFrom="calendar").
# Backend seed required: ORGANIZER account + group + a seeded COMPLETED past meeting so a
#   past-meeting row exists to tap.
# TestTags: PreviousMeetingReviewTestTags.kt (+ MeetingCalendar/GroupDashboard/GroupList/Organizer).
appId: org.mifos.groupbanking
name: e2e — previous-meeting-review (calendar-launched recap content)
tags:
  - e2e
  - group-banking
  - previous-meeting-review
env:
  ORGANIZER_USER: "organizer@demo.mifos"
  ORGANIZER_PASS: "Demo1234!"
---
# --- guaranteed prefix: fresh launch + login ---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: ${ORGANIZER_USER}
- tapOn:
    id: "login_signup_field_password"
- inputText: ${ORGANIZER_PASS}
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- nav to meeting-calendar ---
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "organizer_dashboard_nav_group_list_card"
- assertVisible:
    id: "group_list_screen"
- tapOn:
    id: "group_list_card_"
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "group_dashboard_view_meetings_button"
- extendedWaitUntil:
    visible:
      id: "meeting_calendar_screen"
    timeout: 20000

# --- tap a past-meeting row (OpenPastMeeting → NavigateToReview) ---
# row id = meeting_calendar_row_<meetingId>; substring taps the first seeded past meeting.
- tapOn:
    id: "meeting_calendar_row_"

# --- state: Loading → Content (read-only recap) ---
- extendedWaitUntil:
    visible:
      id: "previous_meeting_review_screen"
    timeout: 20000
- assertVisible:
    id: "previous_meeting_review_content_list"       # Content surface
- assertVisible:
    id: "previous_meeting_review_context_banner"     # Content: calendar-launched banner
- assertVisible:
    id: "previous_meeting_review_summary_metrics_card"

# --- primary interaction: back → returns to meeting-calendar (NavigateBack) ---
# calendar-launched hides the Start-Meeting CTA (visible_when launchedFrom==conduct),
# so the reachable primary interaction here is the top-bar back nav.
- back
- assertVisible:
    id: "meeting_calendar_screen"
