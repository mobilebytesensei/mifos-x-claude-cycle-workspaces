requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: previous-meeting-review

route: /meetings/{previousMeetingId}/review
entry_points:
  - source: meeting-conduct
    trigger: user_taps_view_full_report_on_step0
  - source: meeting-calendar
    trigger: user_taps_completed_meeting_card
nav_params:
  meeting_id: { type: String, required: true }
  meeting_number: { type: Int, required: true }
  group_id: { type: Int, required: true }
  launched_from: { type: String, required: true, values: ["conduct", "calendar"] }

screens:
  - id: previous-meeting-review-screen
    name: PreviousMeetingReviewScreen
    type: detail
    description: Full-screen read-only review with sections for summary, attendance, savings, loans, and unresolved items

state_model:
  PreviousMeetingReviewViewModel:
    state:
      name: PreviousMeetingReviewState
      fields:
        meetingDetail: { type: "PreviousMeetingDetail?", default: "null" }
        isLoading: { type: Boolean, default: "true" }
        error: { type: "String?", default: "null" }
        launchedFrom: { type: String, default: '"calendar"' }
        meetingId: { type: String, default: '""' }
        meetingNumber: { type: Int, default: "0" }
        groupId: { type: Int, default: "0" }
        nextMeetingId: { type: "String?", default: "null" }
        nextMeetingNumber: { type: "Int?", default: "null" }
        unresolvedItems: { type: "List<UnresolvedItem>", default: "emptyList()" }
    screen_state:
      name: PreviousMeetingReviewScreenState
      members: [Loading, Content, Error]
    errors:
      LoadFailed: "Could not load previous meeting data. Check connection and try again."
    events:
      name: PreviousMeetingReviewEvent
      members:
        - { name: NavigateBack }
        - { name: NavigateToConduct, params: "meetingId: String, meetingNumber: Int" }
    actions:
      name: PreviousMeetingReviewAction
      members:
        - { name: LoadPreviousMeeting, trigger: "Screen enters composition" }
        - { name: NavigateBack, trigger: "Back icon or system back press" }
        - { name: StartNewMeeting, trigger: "Tap Start Meeting button (only when launchedFrom==conduct)" }
    di:
      - MeetingRepository
      - NavigationManager
      - LocalMeetingDao

business_logic:
  kind: crud
  description: "Loads a read-only recap of the previous closed meeting (FR-019) — savings breakdown, loan activity, attendance, and unresolved items — from the SQLDelight LocalMeetingDao cache first (stale-while-revalidate), then refreshes via MeetingRepository; cmp-network-monitor gates the background refresh so the recap renders offline. No mutations; previous-meeting data is immutable after closing."
  library_refs: [cmp-network-monitor]
  external_library_refs: [SQLDelight, Store5]
  description_hash: "102851fd7e7a65c693b78e31cce1fc63ba4712ae7ede31352dacbe0000e6cb63"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_app_bar
    type: top-app-bar
    title: "{strings.top_app_bar_title}"
    subtitle: "{{meetingDetail.actualDate}}"
    style: { background: surface }
    navigation_icon: arrow_left_24_regular
    accessibility_label: "{strings.a11y_top_app_bar}"
    on_navigation_click:
      action: NavigateBack
      accessibility_label: "{strings.a11y_navigate_back}"
      action_contract:
        effect: navigate
        description: "Navigates back to the meeting-calendar (or conduct) via the NavigationManager NavController; the top-app-bar back affordance pops the previous-meeting-review off the stack. Read-only screen, no state persisted on exit."
        action_contract_hash: "5f43511731ab580ba965c6fa24a578fcb77c5d4b18ba67a0e98831a73da881bc"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: context_banner
    type: banner
    style: { background: primaryContainer, padding_horizontal: 16dp, padding_vertical: 10dp }
    content:
      - id: context_conduct_text
        type: text
        visible_when: "launchedFrom == 'conduct'"
        value: "{strings.context_conduct_full}"
        style: { text_style: bodyMedium, color: onPrimaryContainer }
      - id: context_calendar_text
        type: text
        visible_when: "launchedFrom == 'calendar'"
        value: "{strings.context_calendar_full}"
        style: { text_style: bodyMedium, color: onPrimaryContainer }

  - id: unresolved_alert_card
    type: card
    visible_when: "unresolvedItems.isNotEmpty()"
    style: { background: warningContainer, corner_radius: md, padding: 16dp, margin: 16dp }
    content:
      - id: unresolved_header
        type: row
        children:
          - { type: icon, icon: warning_24_filled, tint: warning, size: 20dp, accessibility_label: "{strings.a11y_warning_icon}" }
          - { type: text, value: "{strings.unresolved_header}", style: { text_style: titleSmall, color: onWarningContainer, margin_left: 8dp } }
      - id: unresolved_item_row
        type: list-item
        repeats_for: unresolvedItems
        content:
          leading: { type: icon, icon: "{{item.type | icon}}", tint: warning, size: 16dp }
          headline: { type: text, value: "{{item.description}}", style: { text_style: bodySmall, color: onWarningContainer } }

  - id: summary_metrics_card
    type: card
    style: { background: primaryContainer, corner_radius: lg, padding: 20dp, margin_horizontal: 16dp, margin_top: 8dp }
    content:
      - { type: text, value: "{strings.total_collected_label}", style: { text_style: labelLarge, color: onPrimaryContainer } }
      - { type: text, value: "{strings.currency_amount_total}", style: { text_style: headlineLarge, color: onPrimaryContainer, font_weight: bold } }
      - { type: divider, margin_vertical: 8dp }
      - { type: info_row, label: "{strings.closing_corpus_label}", value: "{strings.currency_amount_closing_corpus}" }
      - { type: info_row, label: "{strings.fines_label}", value: "{strings.currency_amount_fines}" }
      - { type: info_row, label: "{strings.loans_disbursed_label}", value: "{strings.currency_amount_loans_disbursed}" }

  - id: attendance_chip_row
    type: row
    style: { padding_horizontal: 16dp }
    children:
      - id: attendance_chip
        type: chip
        label: "{strings.attendance_chip_label}"
        style: { background: primaryContainer, text_color: onPrimaryContainer }
        accessibility_label: "{strings.a11y_attendance_chip}"

  - id: attendance_detail_row
    type: list-item
    repeats_for: meetingDetail.attendanceRecords
    style: { min_height: 56dp, divider: true }
    content:
      leading:
        type: avatar
        initials: "{{record.memberName | initials}}"
        size: 36dp
        background: "{{record.status == 'PRESENT' ? primaryContainer : record.status == 'LATE' ? warningContainer : errorContainer}}"
      headline: { type: text, value: "{{record.memberName}}", style: { text_style: bodyLarge } }
      supporting:
        type: text
        visible: "{{record.fineAmount > 0}}"
        value: "{strings.attendance_fine_line}"
        style: { text_style: bodySmall, color: error }
      trailing:
        type: chip
        label: "{{record.status}}"
        style:
          PRESENT: { background: primaryContainer, text_color: onPrimaryContainer }
          LATE: { background: warningContainer, text_color: onWarningContainer }
          ABSENT: { background: errorContainer, text_color: onErrorContainer }

  - id: member_savings_row
    type: list-item
    repeats_for: meetingDetail.savingsBreakdown
    style: { min_height: 56dp, divider: true }
    content:
      leading: { type: avatar, initials: "{{item.memberName | initials}}", size: 36dp, background: secondaryContainer }
      headline: { type: text, value: "{{item.memberName}}", style: { text_style: bodyLarge } }
      supporting:
        type: text
        value: "{strings.savings_supporting_line}"
        style: { text_style: bodySmall, color: onSurfaceVariant }
      trailing:
        type: text
        value: "{strings.savings_total_line}"
        style: { text_style: labelLarge, color: primary }

  - id: loan_activity_row
    type: list-item
    repeats_for: meetingDetail.loanItems
    style: { min_height: 56dp, divider: true }
    content:
      leading: { type: icon, icon: money_24_regular, tint: tertiary, size: 24dp }
      headline: { type: text, value: "{{item.memberName}}", style: { text_style: bodyLarge } }
      supporting:
        type: text
        value: "{strings.loan_supporting_line}"
        style: { text_style: bodySmall, color: onSurfaceVariant }
      trailing:
        type: chip
        visible: "{{item.amountDisbursed > 0}}"
        label: "{strings.loan_disbursed_chip}"
        style: { background: primaryContainer, text_color: onPrimaryContainer }

  - id: start_meeting_cta
    type: button
    variant: filled
    label: "{strings.start_meeting_btn}"
    visible_when: "launchedFrom == 'conduct'"
    style: { background: primary, text_color: onPrimary, min_height: 56dp, full_width: true, margin: 16dp }
    accessibility_label: "{strings.a11y_start_meeting_cta}"
    on_click:
      action: StartNewMeeting
      target: meeting-conduct
      params: { meeting_id: "{{nextMeetingId}}", meeting_number: "{{nextMeetingNumber}}", group_id: "{{groupId}}" }
      accessibility_label: "{strings.a11y_start_meeting_cta}"
      action_contract:
        effect: navigate
        description: "Navigates forward to meeting-conduct to start the next meeting via the NavigationManager NavController, passing nextMeetingId, nextMeetingNumber, and groupId; only shown when launchedFrom==conduct. Pure navigation, no data written."
        action_contract_hash: "62c269c5d2104e97f0f49cf34426b8d7d0be27bfa80ba923f7e167cbf0bcee15"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: loading_skeleton
    type: shimmer
    count: 5
    style: { height: 72dp, corner_radius: md, margin: 16dp }

states:
  initial_state: loading
  loading:
    components: [top_app_bar, loading_skeleton]
    description: "Fetching previous meeting data"
  content:
    components: [top_app_bar, context_banner, unresolved_alert_card, summary_metrics_card, attendance_chip_row, attendance_detail_row, member_savings_row, loan_activity_row, start_meeting_cta]
    description: "Full review rendered; unresolved_alert_card hidden if no items"
  error:
    components: [top_app_bar]
    description: "Could not load data"

i18n:
  en:
    screen_title: "Previous Meeting Review"
    top_app_bar_title: "Meeting #{{meetingNumber}}"
    context_conducting: "Reviewing before Meeting #{{nextMeetingNumber}}"
    context_calendar: "Completed Meeting"
    context_conduct_full: "Reviewing before Meeting #{{nextMeetingNumber}} — {{meetingDetail.actualDate}}"
    context_calendar_full: "Completed Meeting — {{meetingDetail.actualDate}}"
    unresolved_header: "Unresolved Items"
    attendance_section: "Attendance"
    attendance_chip_label: "{{meetingDetail.attendanceCount}}/{{meetingDetail.totalMemberCount}} Present"
    attendance_fine_line: "Fine: KES {{record.fineAmount}}"
    savings_section: "Savings Per Member"
    savings_supporting_line: "Group: KES {{item.groupSavings}} · Individual: KES {{item.individualSavings}}"
    savings_total_line: "KES {{item.totalSavings}}"
    loans_section: "Loan Activity"
    loan_supporting_line: "Repaid: KES {{item.amountRepaid}} · Outstanding: KES {{item.outstandingAfter}}"
    loan_disbursed_chip: "Disbursed KES {{item.amountDisbursed}}"
    start_meeting_btn: "Start Meeting #{{nextMeetingNumber}}"
    total_collected_label: "Total Collected"
    currency_amount_total: "KES {{meetingDetail.totalSavingsCollected}}"
    closing_corpus_label: "Closing Corpus"
    currency_amount_closing_corpus: "KES {{meetingDetail.closingCorpus}}"
    fines_label: "Fines Collected"
    currency_amount_fines: "KES {{meetingDetail.finesCollected}}"
    loans_disbursed_label: "Loans Disbursed"
    currency_amount_loans_disbursed: "KES {{meetingDetail.loansDisbursed}}"
    a11y_top_app_bar: "Previous meeting review header, meeting number {{meetingNumber}}"
    a11y_navigate_back: "Navigate back to previous screen"
    a11y_warning_icon: "Warning"
    a11y_attendance_chip: "Attendance: {{meetingDetail.attendanceCount}} of {{meetingDetail.totalMemberCount}} members present"
    a11y_start_meeting_cta: "Start next meeting number {{nextMeetingNumber}}"
