schema_version: "3.1"
id: loan-detail
name: Loan Detail
description: >
  Full detail view for a single loan. Displays member identity, disbursement info, interest rate,
  total outstanding, and overdue amount. Provides two tabs: Schedule (weekly repayment table) and
  Repayment History (recorded transactions). Treasurer may record a repayment; chairperson may
  mark the loan as defaulted. Loads from local cache then syncs from Fineract.
feature: loan-management
flow: loan-management-flow
version: "1.0.0"
tags:
  - loan-management
  - admin
  - detail
  - offline-first
  - FR-006

status: enriched
quality_score: 87
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system

entry_point: false
bottom_nav:
  visible: false
navigates_to:
  - loan-list
route: /loans/{loanId}
entry_points:
  - source: loan-list
    label: Loan card tap
nav_params:
  loanId: { type: Long, required: true }

screens:
  - id: loan-detail-screen
    title: Loan Detail
    type: detail
    description: Tabbed detail screen with schedule and repayment history

state_model:
  LoanDetailViewModel:
    state:
      name: LoanDetailState
      fields:
        isLoading: { type: Boolean, default: "true" }
        loan: { type: "LoanDetail?", default: "null" }
        repaymentSchedule: { type: "List<RepaymentScheduleRow>", default: "emptyList()" }
        repaymentHistory: { type: "List<RepaymentTransaction>", default: "emptyList()" }
        selectedTab: { type: LoanDetailTab, default: "LoanDetailTab.SCHEDULE" }
        error: { type: "LoanDetailError?", default: "null" }
        isRecordingRepayment: { type: Boolean, default: "false" }
        canRecordRepayment: { type: Boolean, default: "false" }
        canMarkDefaulted: { type: Boolean, default: "false" }
    screen_state:
      name: LoanDetailScreenState
      members: [Loading, Content, Error]
    errors:
      name: LoanDetailError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: NotFound, retry: false, message_key: error_not_found }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: LoanDetailEvent
      members:
        - { name: NavigateBack }
        - { name: ShowRepaymentDialog }
        - { name: ShowDefaultConfirmDialog }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: LoanDetailAction
      members:
        - { name: OnTabChange, params: { tab: LoanDetailTab }, trigger: "Tap tab" }
        - { name: OnRecordRepayment, trigger: "Tap Record Repayment button" }
        - { name: OnMarkDefaulted, trigger: "Tap Mark Defaulted button" }
        - { name: OnBack, trigger: "Tap back / nav icon" }
        - { name: Retry, trigger: "Tap retry button on error state" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
    di:
      - LoanRepository
      - NetworkMonitor
      - SessionManager

flow_logic:
  on_load:
    - action: fetch_loan_detail
      api: get_loan_detail
      on_success: show_content
      on_error: show_error
      offline: show_cached_data
  on_tab_change:
    - action: update_selected_tab
      description: Switch between Schedule and History tabs; data already loaded
  on_record_repayment:
    - action: show_repayment_dialog
      guard: "canRecordRepayment (treasurer role)"
  on_mark_defaulted:
    - action: show_confirm_dialog
      guard: "canMarkDefaulted (chairperson role)"
  on_refresh:
    - action: fetch_loan_detail
      api: get_loan_detail
      invalidate_cache: true

dependencies:
  repositories:
    - name: LoanRepository
      methods:
        - "getLoanDetail(loanId: Long): Flow<LoanDetail>"
        - "recordRepayment(loanId: Long, amount: Double, date: String): Flow<Unit>"
        - "markDefaulted(loanId: Long): Flow<Unit>"
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: loans
    - table: loan_repayments

api:
  - id: get_loan_detail
    function: get_loan
    method: get
    endpoint: "/loans/{loanId}"
    description: Fetch full loan detail with repayment schedule and transaction history
    params:
      loanId: { type: Long, required: true, source: nav_params }
      associations: { type: String, default: "repaymentSchedule,transactions" }
    response:
      type: object
      fields:
        id: Long
        clientId: Long
        clientName: String
        loanProductName: String
        principal: Double
        approvedPrincipal: Double
        disbursementDate: List<Int>
        interestRatePerPeriod: Double
        interestType: { id: Int, value: String }
        status: { id: Int, value: String }
        summary:
          principalDisbursed: Double
          principalPaid: Double
          principalOutstanding: Double
          interestCharged: Double
          interestPaid: Double
          interestOutstanding: Double
          totalExpectedRepayment: Double
          totalOutstanding: Double
          totalOverdue: Double
        repaymentSchedule:
          periods:
            type: array
            items:
              period: Int
              dueDate: List<Int>
              principalDue: Double
              interestDue: Double
              totalInstallmentAmountForPeriod: Double
              totalPaidForPeriod: Double
              totalOutstandingForPeriod: Double
              complete: Boolean
        transactions:
          type: array
          items:
            id: Long
            type: { id: Int, value: String }
            date: List<Int>
            amount: Double
    errors:
      401: Unauthorized
      404: Loan not found
      500: Server error
    cache:
      ttl: 120
      strategy: stale-while-revalidate
      offline: show_cached

dtos:
  LoanDetail:
    id: Long
    memberId: Long
    memberName: String
    loanProductName: String
    principalAmount: { type: Double, currency: KES }
    disbursedDate: String
    interestRatePercent: Double
    totalOutstanding: { type: Double, currency: KES }
    totalOverdue: { type: Double, currency: KES }
    status: LoanStatus
    fineractLoanId: Long

  RepaymentScheduleRow:
    weekNumber: Int
    dueDate: String
    dueAmount: { type: Double, currency: KES }
    paidAmount: { type: Double, currency: KES }
    balance: { type: Double, currency: KES }
    status: RepaymentRowStatus

  RepaymentRowStatus:
    values: [PAID, PARTIAL, UPCOMING, OVERDUE]

  RepaymentTransaction:
    id: Long
    type: String
    date: String
    amount: { type: Double, currency: KES }

  LoanDetailTab:
    values: [SCHEDULE, HISTORY]

components:
  - id: top_bar
    type: top-bar
    title: "Loan Detail"
    style:
      background: primary
      text_color: onPrimary
    navigation_icon: arrow_back
    on_nav_click: { action: OnBack }
    actions:
      - icon: refresh
        content_description: "Refresh loan data"
        on_click: { action: OnRefresh }
    test_context:
      purpose: "Screen header with back navigation and refresh"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: member_header_card
    type: card
    style:
      background: primaryContainer
      corner_radius: 12dp
      padding: 16dp
      elevation: 0dp
    content:
      - id: member_name_header
        type: text
        style: { text_style: headlineSmall, color: onPrimaryContainer }
        value: "{{loan.memberName}}"
      - id: loan_product_text
        type: text
        style: { text_style: bodyMedium, color: onPrimaryContainer }
        value: "{{loan.loanProductName}}"
      - id: principal_text
        type: text
        style: { text_style: bodyLarge, color: onPrimaryContainer }
        value: "Principal: KES {{loan.principalAmount | number}}"
      - id: disbursed_text
        type: text
        style: { text_style: bodySmall, color: onPrimaryContainer }
        value: "Disbursed: {{loan.disbursedDate}}"
      - id: interest_rate_text
        type: text
        style: { text_style: bodySmall, color: onPrimaryContainer }
        value: "Interest: {{loan.interestRatePercent}}% per week"
      - id: loan_status_badge
        type: badge
        style:
          ACTIVE: { background: "#C8E6C9", text_color: "#1B5E20" }
          OVERDUE: { background: "#FFCDD2", text_color: "#B71C1C" }
          CLOSED: { background: "#F5F5F5", text_color: "#757575" }
        value: "{{loan.status}}"
    test_context:
      purpose: "Prominent summary of loan key facts at the top"
      interaction_type: static
      data_driven: true
      required_fields: [loan.memberName, loan.principalAmount, loan.disbursedDate, loan.interestRatePercent]

  - id: outstanding_summary_row
    type: row
    style:
      padding: "8dp 16dp"
      background: surface
    content:
      - id: outstanding_amount_chip
        type: info-chip
        label: "Outstanding"
        value: "KES {{loan.totalOutstanding | number}}"
        style: { background: secondaryContainer, text_color: onSecondaryContainer }
      - id: overdue_amount_chip
        type: info-chip
        label: "Overdue"
        value: "KES {{loan.totalOverdue | number}}"
        style:
          background_when_zero: surfaceVariant
          background_when_positive: errorContainer
          text_color_when_positive: onErrorContainer
        visible_when: "loan.totalOverdue > 0"
    test_context:
      purpose: "Quick-glance row for outstanding and overdue totals"
      interaction_type: static
      data_driven: true
      required_fields: [loan.totalOutstanding, loan.totalOverdue]

  - id: detail_tabs
    type: tab-bar
    style:
      indicator_color: primary
      background: surface
    tabs:
      - id: tab_schedule
        label: "Schedule"
        on_click: { action: OnTabChange, params: { tab: SCHEDULE } }
      - id: tab_history
        label: "Repayment History"
        on_click: { action: OnTabChange, params: { tab: HISTORY } }
    selected_tab: "{{selectedTab}}"
    test_context:
      purpose: "Switch between repayment schedule table and transaction history"
      interaction_type: tap
      data_driven: false
      required_fields: [selectedTab]

  - id: schedule_table
    type: data-table
    visible_when: "selectedTab == SCHEDULE"
    headers:
      - { label: "Wk", width: 40dp }
      - { label: "Due Date", width: 96dp }
      - { label: "Due (KES)", width: 88dp }
      - { label: "Paid (KES)", width: 88dp }
      - { label: "Balance", width: 88dp }
      - { label: "Status", width: 72dp }
    rows_source: repaymentSchedule
    row_style:
      PAID: { background: "#F1F8E9", text_color: "#33691E" }
      PARTIAL: { background: "#FFF9C4", text_color: "#E65100" }
      OVERDUE: { background: "#FFCDD2", text_color: "#B71C1C" }
      UPCOMING: { background: surface, text_color: onSurface }
    test_context:
      purpose: "Weekly repayment schedule with color-coded row status"
      interaction_type: static
      data_driven: true
      required_fields: [repaymentSchedule]

  - id: history_list
    type: list
    visible_when: "selectedTab == HISTORY"
    item_type: transaction_row
    items_source: repaymentHistory
    empty_text: "No repayments recorded yet."
    test_context:
      purpose: "List of actual repayment transactions recorded by treasurer"
      interaction_type: static
      data_driven: true
      required_fields: [repaymentHistory]

  - id: transaction_row
    type: list-item
    content:
      - id: txn_type_text
        type: text
        style: { text_style: bodyMedium, color: onSurface }
        value: "{{txn.type}}"
      - id: txn_date_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "{{txn.date}}"
      - id: txn_amount_text
        type: text
        style: { text_style: bodyMedium, color: primary }
        value: "KES {{txn.amount | number}}"
    test_context:
      purpose: "Single row in repayment history list"
      interaction_type: static
      data_driven: true
      required_fields: [txn.type, txn.date, txn.amount]

  - id: action_buttons_row
    type: row
    style:
      padding: "16dp"
      gap: 12dp
    content:
      - id: record_repayment_button
        type: button
        label: "Record Repayment"
        style:
          background: primary
          text_color: onPrimary
          corner_radius: 24dp
          min_touch_target: 48dp
          weight: 1
        visible_when: "canRecordRepayment && loan.status == ACTIVE"
        on_click: { action: OnRecordRepayment }
        test_context:
          purpose: "Open repayment dialog; visible to treasurer only"
          interaction_type: tap
          data_driven: true
          required_fields: [canRecordRepayment]
      - id: mark_defaulted_button
        type: button
        label: "Mark Defaulted"
        style:
          background: error
          text_color: onError
          corner_radius: 24dp
          min_touch_target: 48dp
          weight: 1
        visible_when: "canMarkDefaulted && loan.status == OVERDUE"
        on_click: { action: OnMarkDefaulted }
        test_context:
          purpose: "Initiate default confirmation; visible to chairperson only"
          interaction_type: tap
          data_driven: true
          required_fields: [canMarkDefaulted]

  - id: shimmer_detail
    type: shimmer
    count: 3
    style: { height: 120dp, corner_radius: 12dp, background: surfaceVariant }
    test_context:
      purpose: "Loading skeleton for loan detail screen"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "Could not load loan"
    body: "{{error.message}}"
    cta_label: "Retry"
    on_click: { action: Retry }
    test_context:
      purpose: "Show API error with retry option"
      interaction_type: tap
      data_driven: true
      required_fields: [error.message]

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_detail]
    description: "Fetching loan detail from local cache then Fineract API"
  content:
    components:
      - top_bar
      - member_header_card
      - outstanding_summary_row
      - detail_tabs
      - schedule_table
      - history_list
      - action_buttons_row
    description: "Full detail with tabbed schedule and history; action buttons role-gated"
    demo_data:
      loan:
        memberName: "Peter Otieno"
        loanProductName: "Standard Group Loan"
        principalAmount: 1500
        disbursedDate: "2026-04-14"
        interestRatePercent: 5
        totalOutstanding: 1125
        totalOverdue: 0
        status: ACTIVE
      repaymentSchedule:
        - weekNumber: 1
          dueDate: "2026-04-21"
          dueAmount: 125
          paidAmount: 125
          balance: 0
          status: PAID
        - weekNumber: 2
          dueDate: "2026-04-28"
          dueAmount: 125
          paidAmount: 125
          balance: 0
          status: PAID
        - weekNumber: 3
          dueDate: "2026-05-05"
          dueAmount: 125
          paidAmount: 125
          balance: 0
          status: PAID
        - weekNumber: 4
          dueDate: "2026-05-12"
          dueAmount: 125
          paidAmount: 0
          balance: 125
          status: UPCOMING
  error:
    components: [top_bar, error_state]
    description: "API failed; error message with retry"

i18n:
  en:
    screen_title: "Loan Detail"
    tab_schedule: "Schedule"
    tab_history: "Repayment History"
    principal_label: "Principal: KES {{amount}}"
    disbursed_label: "Disbursed: {{date}}"
    interest_label: "Interest: {{rate}}% per week"
    outstanding_label: "Outstanding"
    overdue_label: "Overdue"
    record_repayment: "Record Repayment"
    mark_defaulted: "Mark Defaulted"
    error_not_found: "Loan not found."
    error_network: "No internet. Showing cached data."
    error_server: "Server error. Please try again."
    error_auth: "Session expired. Please log in again."
    status_paid: "Paid"
    status_partial: "Partial"
    status_upcoming: "Upcoming"
    status_overdue: "Overdue"
  sw:
    screen_title: "Maelezo ya Mkopo"
    tab_schedule: "Ratiba"
    tab_history: "Historia ya Malipo"
    record_repayment: "Rekodi Malipo"
    mark_defaulted: "Weka Kama Mkopo Mbaya"
  fr:
    screen_title: "Détail du Prêt"
    tab_schedule: "Calendrier"
    tab_history: "Historique de Remboursement"
    record_repayment: "Enregistrer un Remboursement"
    mark_defaulted: "Marquer comme Défaut"
  hi:
    screen_title: "ऋण विवरण"
    tab_schedule: "कार्यक्रम"
    tab_history: "पुनर्भुगतान इतिहास"
    record_repayment: "पुनर्भुगतान दर्ज करें"
    mark_defaulted: "डिफ़ॉल्ट के रूप में चिह्नित करें"

analytics:
  screen_view: loan_detail_viewed
  events:
    - trigger: tab changed
      name: loan_detail_tab_changed
      params: { tab: String }
    - trigger: record repayment tapped
      name: loan_repayment_initiated
      params: { loan_id: Long }
    - trigger: mark defaulted tapped
      name: loan_default_initiated
      params: { loan_id: Long }
    - trigger: refresh
      name: loan_detail_refreshed
      params: { loan_id: Long }
