<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Apply — CommonPurse (VSLA Group Banking)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans','system-ui','sans-serif']},colors:{primary:'#2E7D32','on-primary':'#FFFFFF',secondary:'#FF8F00',tertiary:'#1565C0',surface:'#FAFAFA','on-surface':'#1A1C19',error:'#D32F2F','primary-container':'#A6F1A6','secondary-container':'#FFDDB3'}}}};</script>
<style>
:root{--primary:#2E7D32;--on-primary:#FFFFFF;--secondary:#FF8F00;--surface:#FAFAFA;--on-surface:#1A1C19;--error:#D32F2F;--primary-container:#A6F1A6;--secondary-container:#FFDDB3;}
body{font-family:'Noto Sans',system-ui,sans-serif;background:#0F0F23;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;flex-shrink:0;}
body.embedded{background:#FAFAFA;margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;}
.field-group{padding:12px 16px;}
.field-label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px;letter-spacing:0.02em;}
.field-input{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;font-family:'Noto Sans',sans-serif;outline:none;background:white;color:#1A1C19;transition:border-color 0.15s;}
.field-input:focus{border-color:#2E7D32;box-shadow:0 0 0 3px rgba(46,125,50,0.1);}
.field-input.error{border-color:#D32F2F;background:#FFF8F8;}
.field-select{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;font-family:'Noto Sans',sans-serif;outline:none;background:white;color:#1A1C19;appearance:none;cursor:pointer;}
.field-select:focus{border-color:#2E7D32;box-shadow:0 0 0 3px rgba(46,125,50,0.1);}
.select-wrapper{position:relative;}
.select-wrapper::after{content:'expand_more';font-family:'Material Symbols Outlined';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#9E9E9E;pointer-events:none;font-size:20px;}
.banner{padding:12px 14px;border-radius:10px;margin:0 16px 4px;}
.banner-info{background:#A6F1A6;border:1px solid #81C784;}
.banner-warn{background:#FFF9C4;border:1px solid #F9A825;}
.banner-error{background:#FFCDD2;border:1px solid #EF9A9A;}
.primary-btn{width:100%;padding:16px;border-radius:9999px;font-weight:700;font-size:15px;color:white;background:#2E7D32;border:none;cursor:pointer;transition:opacity 0.15s,transform 0.1s;display:flex;align-items:center;justify-content:center;gap:10px;}
.primary-btn:hover{opacity:0.92;}
.primary-btn:active{transform:scale(0.98);}
.primary-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none;}
</style>
</head>
<body class="min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0 gap-2">
  <span class="text-sm font-semibold text-slate-200 flex-1">📝 Loan Apply — Mwangaza Women's Group</span>
  <select id="statePicker" onchange="switchState(this.value)" class="px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none cursor-pointer">
    <option value="loading">⏳ Loading</option>
    <option value="content" selected>✅ Content (Ready)</option>
    <option value="member_selected">👤 Member Selected</option>
    <option value="corpus_warning">⚠️ Corpus Warning</option>
    <option value="amount_error">❌ Amount Error</option>
    <option value="submitting">⏳ Submitting</option>
    <option value="error">❌ Submission Error</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 border border-white/10 rounded-md">🌙</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-start justify-center p-6" style="padding-top:32px">
  <div class="phone bg-[#FAFAFA] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-[#2E7D32]">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1.5">
        <span class="material-symbols-outlined text-white" style="font-size:16px">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-white" style="font-size:16px">wifi</span>
        <span class="material-symbols-outlined text-white" style="font-size:16px">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto" style="height:760px;background:#FAFAFA"></div>
    <div class="flex justify-center py-2 bg-[#FAFAFA]"><div class="w-32 h-1 rounded-full bg-slate-900/20"></div></div>
  </div>
</div>

<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-[#2E7D32] shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1.5">
      <span class="material-symbols-outlined text-white" style="font-size:16px">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-white" style="font-size:16px">wifi</span>
      <span class="material-symbols-outlined text-white" style="font-size:16px">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto flex-1" style="background:#FAFAFA"></div>
  <div class="flex justify-center py-2 bg-[#FAFAFA] shrink-0"><div class="w-32 h-1 rounded-full bg-slate-900/20"></div></div>
</div>
<div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none"></div>

<script>
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
if(isEmbedded){document.body.style.background='#FAFAFA';document.body.classList.add('embedded');}
function getEl(){return isEmbedded?document.getElementById('embedded-screen-content'):document.getElementById('screen-content');}

var MEMBERS=[
  {id:1,name:'Peter Otieno',  initials:'PO',savingsBalance:5000,eligible:15000},
  {id:2,name:'Mary Akinyi',   initials:'MA',savingsBalance:4600,eligible:13800},
  {id:3,name:'Grace Mwangi',  initials:'GM',savingsBalance:4940,eligible:14820},
  {id:4,name:'Amara Diallo',  initials:'AD',savingsBalance:4393,eligible:13180},
];
var LOAN_PRODUCTS=[
  {id:1,name:'Standard Group Loan',rate:10,minPrincipal:1000,maxPrincipal:20000},
  {id:2,name:'Emergency Micro-Loan',rate:8,minPrincipal:500,maxPrincipal:10000},
  {id:3,name:'Agricultural Loan',rate:9,minPrincipal:2000,maxPrincipal:30000},
];
var corpusBalance=48200;
var loanMultiplier=3.0;

function topBar(){
  return `<div class="flex items-center gap-3 px-4 py-3 bg-[#2E7D32]">
    <span class="material-symbols-outlined text-white cursor-pointer" onclick="showToast('Back to Loan List')">arrow_back</span>
    <span class="flex-1 text-lg font-semibold text-white">Apply for Loan</span>
  </div>`;
}

function memberSelector(selectedId){
  return `<div class="field-group">
    <label class="field-label">Select Member *</label>
    <div class="select-wrapper">
      <select class="field-select" onchange="onMemberChange(this.value)">
        <option value="">— Choose group member —</option>
        ${MEMBERS.map(m=>`<option value="${m.id}" ${selectedId===m.id?'selected':''}>${m.name}</option>`).join('')}
      </select>
    </div>
  </div>`;
}

function eligibilityBanner(member){
  if(!member)return '';
  return `<div class="banner banner-info mx-4 mb-3">
    <div class="flex items-start gap-2">
      <span class="material-symbols-outlined text-[#2E7D32] mt-0.5" style="font-size:18px">info</span>
      <div>
        <div class="text-xs text-[#1B5E20] font-semibold">Eligibility Check</div>
        <div class="text-xs text-[#2E7D32] mt-0.5">Savings balance: <strong>KES ${member.savingsBalance.toLocaleString()}</strong></div>
        <div class="text-xs text-[#2E7D32]">Max eligible: <strong>KES ${member.eligible.toLocaleString()}</strong> (${loanMultiplier}× savings)</div>
      </div>
    </div>
  </div>`;
}

function corpusWarningBanner(){
  return `<div class="banner banner-warn">
    <div class="flex items-start gap-2">
      <span class="material-symbols-outlined text-[#E65100] mt-0.5" style="font-size:18px">warning</span>
      <div class="text-xs text-[#E65100]">
        <strong>Warning:</strong> Disbursing this amount will reduce the group corpus below the 10% buffer threshold. Current balance: <strong>KES ${corpusBalance.toLocaleString()}</strong>.
        Disbursing KES 15,000 leaves only KES 33,200 ({{68.9%}} of corpus). Consider a smaller amount.
      </div>
    </div>
  </div>`;
}

function amountErrorBanner(){
  return `<div class="banner banner-error mx-4 mb-2">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-[#D32F2F]" style="font-size:18px">error</span>
      <div class="text-xs text-[#D32F2F] font-semibold">Amount exceeds eligible limit of KES 15,000</div>
    </div>
  </div>`;
}

function formFields(opts){
  opts = opts||{};
  return `
    ${memberSelector(opts.selectedMemberId||1)}
    ${opts.showEligibility ? eligibilityBanner(MEMBERS.find(m=>m.id===(opts.selectedMemberId||1))) : ''}
    ${opts.showCorpusWarn ? `<div class="px-4 mb-1">${corpusWarningBanner()}</div>` : ''}
    ${opts.showAmountError ? amountErrorBanner() : ''}
    <div class="field-group">
      <label class="field-label">Requested Amount (KES) *</label>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" style="font-size:18px">currency_exchange</span>
        <input type="number" class="field-input pl-10 ${opts.showAmountError?'error':''}" value="${opts.amount||'15000'}" placeholder="e.g. 5000" oninput="onAmountChange(this.value)"/>
      </div>
      ${opts.showAmountError?'<div class="text-xs text-[#D32F2F] mt-1 pl-1">Amount exceeds eligible limit of KES 15,000</div>':''}
    </div>
    <div class="field-group">
      <label class="field-label">Loan Duration *</label>
      <div class="select-wrapper">
        <select class="field-select">
          <option>4 weeks</option><option>8 weeks</option>
          <option selected>12 weeks</option><option>24 weeks</option>
          <option>52 weeks (1 year)</option>
        </select>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Loan Purpose *</label>
      <div class="select-wrapper">
        <select class="field-select">
          <option>Medical</option><option>Education</option>
          <option selected>Business</option><option>Emergency</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Loan Product *</label>
      <div class="select-wrapper">
        <select class="field-select">
          <option value="">Select product</option>
          ${LOAN_PRODUCTS.map(p=>`<option value="${p.id}" ${p.id===1?'selected':''}>${p.name} (${p.rate}% p.w.)</option>`).join('')}
        </select>
      </div>
      <div class="text-xs text-slate-400 mt-1 pl-1">Interest rate: 10% per week · Equal installments</div>
    </div>
    <div class="field-group">
      <label class="field-label">Repayment Summary</label>
      <div class="rounded-xl p-3 bg-[#E8F5E9] border border-[#A6F1A6]">
        <div class="grid grid-cols-3 gap-2 text-center">
          <div><div class="text-base font-bold text-[#1B5E20]">12</div><div class="text-xs text-[#2E7D32]">Weeks</div></div>
          <div><div class="text-base font-bold text-[#1B5E20]">KES 1,458</div><div class="text-xs text-[#2E7D32]">Per Week</div></div>
          <div><div class="text-base font-bold text-[#1B5E20]">KES 2,500</div><div class="text-xs text-[#2E7D32]">Total Interest</div></div>
        </div>
      </div>
    </div>`;
}

function switchState(s){
  var picker=document.getElementById('statePicker');
  if(picker)picker.value=s;
  var html=topBar();

  if(s==='loading'){
    html+=`<div class="px-4 py-3 flex flex-col gap-3 mt-2">${Array(6).fill('<div class="shimmer h-14 rounded-xl"></div>').join('')}</div>`;
  } else if(s==='content'){
    html+=formFields({showEligibility:false});
    html+=`<div class="px-4 py-3">
      <button disabled class="primary-btn" style="opacity:0.45;cursor:not-allowed">Submit Application</button>
      <div class="text-xs text-center text-slate-400 mt-2">Select member and fill all required fields to enable</div>
    </div><div class="h-6"></div>`;
  } else if(s==='member_selected'){
    html+=formFields({showEligibility:true,selectedMemberId:1});
    html+=`<div class="px-4 py-3">
      <button onclick="showToast('Submitting application...');switchState(\'submitting\')" class="primary-btn">Submit Application</button>
    </div><div class="h-6"></div>`;
  } else if(s==='corpus_warning'){
    html+=formFields({showEligibility:true,selectedMemberId:1,showCorpusWarn:true,amount:'15000'});
    html+=`<div class="px-4 py-3">
      <button onclick="showToast('Submitting despite warning...')" class="primary-btn">Submit Application</button>
      <div class="text-xs text-center text-[#E65100] mt-2">⚠ Corpus warning acknowledged — proceed with caution</div>
    </div><div class="h-6"></div>`;
  } else if(s==='amount_error'){
    html+=formFields({showEligibility:true,selectedMemberId:1,showAmountError:true,amount:'20000'});
    html+=`<div class="px-4 py-3">
      <button disabled class="primary-btn">Submit Application</button>
    </div><div class="h-6"></div>`;
  } else if(s==='submitting'){
    html+=formFields({showEligibility:true,selectedMemberId:1,amount:'15000'});
    html+=`<div class="px-4 py-3">
      <button disabled class="primary-btn"><div class="spinner"></div>Submitting Application…</button>
    </div><div class="h-6"></div>`;
    setTimeout(()=>{if(document.getElementById('statePicker').value==='submitting')switchState('member_selected');},3000);
  } else if(s==='error'){
    html+=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 32px;text-align:center">
      <span class="material-symbols-outlined" style="font-size:56px;color:#D32F2F;margin-bottom:12px">cloud_off</span>
      <p style="font-size:18px;font-weight:700;color:#1A1C19">Could not submit</p>
      <p style="font-size:13px;color:#757575;margin-top:6px;margin-bottom:20px">Server error. Please try again.<br/>Your inputs have been saved locally.</p>
      <button onclick="switchState('member_selected')" class="primary-btn" style="max-width:200px">Try Again</button>
    </div>`;
  }

  getEl().innerHTML=html;
  notifyParent();
}

function onMemberChange(id){ showToast('Member selected — loading eligibility...'); }
function onAmountChange(val){ /* live validation would go here */ }

function showToast(msg){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-xl pointer-events-auto';t.textContent=msg;var c=document.getElementById('toast-container');c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300);},2200);}
function toggleDark(){document.body.classList.toggle('dark');}

function notifyParent(){
  if(window===window.top)return;
  window.parent.postMessage({
    action:'screenLoaded',screenId:'loan-apply',name:'Loan Apply',feature:'loan-management',status:'enriched',tag:'VSLA',componentCount:9,
    states:[{id:'loading',name:'Loading'},{id:'content',name:'Content'},{id:'member_selected',name:'Member Selected'},{id:'corpus_warning',name:'Corpus Warning'},{id:'amount_error',name:'Amount Error'},{id:'submitting',name:'Submitting'},{id:'error',name:'Error'}],
    apiEndpoints:['/groups/{groupId}/loans/apply','/loanproducts','/loans/template','/clients/{clientId}/accounts','/datatables/dt_group_corpus/{groupId}'],
    inspectorData:{id:'loan-apply',name:'Loan Apply',feature:'loan-management',status:'enriched',phase:'design',
      components:[
        {type:'header',label:'Apply for Loan',tag:'top_bar'},
        {type:'input',label:'Select Member dropdown',tag:'member_selector'},
        {type:'section',label:'Eligibility banner',tag:'eligibility_banner'},
        {type:'input',label:'Requested Amount (KES)',tag:'amount_input'},
        {type:'section',label:'Corpus warning banner',tag:'corpus_warning_banner'},
        {type:'input',label:'Loan Duration dropdown',tag:'duration_dropdown'},
        {type:'input',label:'Loan Purpose dropdown',tag:'purpose_dropdown'},
        {type:'input',label:'Loan Product dropdown',tag:'product_dropdown'},
        {type:'button',label:'Submit Application',tag:'submit_button'},
      ],
      states:{initial_state:'content',loading:{},content:{},member_selected:{},corpus_warning:{},amount_error:{},submitting:{},error:{}},
    }
  },'*');
}
window.addEventListener('message',function(e){if(!e.data)return;if(e.data.action==='switchState')switchState(e.data.stateId||'content');if(e.data.action==='getInspectorData')notifyParent();});
switchState(new URLSearchParams(location.search).get('state')||'content');
</script>
</body>
</html>
