requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: loan-apply

route: /groups/{groupId}/loans/apply
entry_points:
  - source: loan-list
    label: Apply for Loan (FAB)
nav_params:
  groupId: { type: Long, required: true }

screens:
  - id: loan-apply-screen
    title: "{strings.screen_title}"
    type: form
    description: Multi-field application form with real-time eligibility and corpus checks  # i18n: skip

state_model:
  LoanApplyViewModel:
    state:
      name: LoanApplyState
      fields:
        selectedMember: { type: "GroupMember?", default: "null" }
        requestedAmount: { type: String, default: '""' }
        durationWeeks: { type: Int, default: "12" }
        purpose: { type: LoanPurpose, default: "LoanPurpose.BUSINESS" }
        selectedProduct: { type: "LoanProduct?", default: "null" }
        members: { type: "List<GroupMember>", default: "emptyList()" }
        loanProducts: { type: "List<LoanProduct>", default: "emptyList()" }
        memberSavingsBalance: { type: Double, default: "0.0" }
        loanMultiplier: { type: Double, default: "3.0" }
        eligibleAmount: { type: Double, default: "0.0" }
        corpusBalance: { type: Double, default: "0.0" }
        corpusWarning: { type: Boolean, default: "false" }
        isSubmitting: { type: Boolean, default: "false" }
        isLoadingTemplate: { type: Boolean, default: "false" }
        amountError: { type: "String?", default: "null" }
        error: { type: "LoanApplyError?", default: "null" }
        submitSuccess: { type: Boolean, default: "false" }
    screen_state:
      name: LoanApplyScreenState
      members: [Loading, Content, Submitting, Error, Success]
    errors:
      name: LoanApplyError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: AmountExceedsEligibility, retry: false, message_key: error_amount_exceeds }
        - { type: CorpusInsufficient, retry: false, message_key: error_corpus }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: LoanApplyEvent
      members:
        - { name: NavigateToMeetingConduct, params: { loanId: Long } }
        - { name: NavigateBack }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: LoanApplyAction
      members:
        - { name: OnMemberSelected, params: { member: GroupMember }, trigger: "Select from member dropdown" }
        - { name: OnAmountChanged, params: { amount: String }, trigger: "Type loan amount" }
        - { name: OnDurationChanged, params: { weeks: Int }, trigger: "Select duration" }
        - { name: OnPurposeChanged, params: { purpose: LoanPurpose }, trigger: "Select purpose" }
        - { name: OnProductSelected, params: { product: LoanProduct }, trigger: "Select loan product" }
        - { name: OnSubmit, trigger: "Tap Submit button" }
        - { name: OnBack, trigger: "Tap back / nav icon" }
    di:
      - LoanRepository
      - MemberRepository
      - GroupRepository
      - NetworkMonitor
      - SessionManager

business_logic:
  kind: composite
  description: "Loan application form: validates the requested amount against member savings x loanMultiplier eligibility and runs a client-side corpus buffer check, caches members/products/config offline via SQLDelight through Store5, then posts the LoanApplicationRequest to Fineract m_loan via LoanRepository, using cmp-network-monitor to block offline submits."
  library_refs: ["cmp-network-monitor"]
  external_library_refs: ["Store5", "SQLDelight", "Fineract m_loan"]
  description_hash: "a1f4c2e9b7d63508f2a1c9e4d0b7853f6a2e19c4b8d05f37a9e1c62d4b073e8f"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_bar
    type: top-bar
    title: "{strings.screen_title}"
    accessibility_label: "{strings.screen_title}"
    style:
      background: primary
      text_color: onPrimary
    navigation_icon: arrow_back
    navigation_icon_accessibility_label: "Back"  # i18n: skip
    on_nav_click:
      action: OnBack
      action_contract:
        effect: navigate
        description: "Pops the loan-apply form off the NavController back stack and returns to loan-list; no form data is persisted on back-navigation."
        action_contract_hash: "b2e05c7a3f9d1846c0e2a7b45d938f16c3a0e29b7d451f68a0c3e9d24b615f70"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: member_selector
    type: dropdown
    label: "{strings.member_label}"
    placeholder: "{strings.member_placeholder}"
    accessibility_label: "{strings.member_label}"
    icon: person
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    options_source: members
    option_label: "displayName"  # i18n: skip
    on_change:
      action: OnMemberSelected
      param: member
      action_contract:
        effect: call_api
        library_refs: ["cmp-network-monitor"]
        external_library_refs: ["Store5", "Fineract get_member_savings"]
        description: "On member selection, calls MemberRepository.getMemberSavingsBalance and get_loan_template through Store5; cmp-network-monitor gates the call and serves cached savings when offline so eligibility recomputes."
        action_contract_hash: "c3f16d8b4a0e2957d1f3b8c56e049a27d4b1f30c8e562a79b1d4f0e35c726a81"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: eligibility_banner
    type: info-banner
    style:
      background: primaryContainer
      text_color: onPrimaryContainer
      corner_radius: 8dp
      padding: 12dp
    content:
      - type: text
        style: { text_style: bodyMedium }
        value: "Savings balance: KES {{memberSavingsBalance | number}}"  # i18n: skip
      - type: text
        style: { text_style: titleSmall, color: primary }
        value: "Max eligible: KES {{eligibleAmount | number}} ({{loanMultiplier}}× savings)"  # i18n: skip
    visible_when: "selectedMember != null"

  - id: amount_input
    type: text-field
    label: "{strings.amount_label}"
    placeholder: "{strings.amount_placeholder_hint}"
    accessibility_label: "{strings.amount_label}"
    input_type: number
    keyboard: decimal
    leading_icon: currency_exchange
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    on_change:
      action: OnAmountChanged
      param: amount
      action_contract:
        effect: transform_state
        description: "Pure ViewModel transition: validates requestedAmount <= eligibleAmount (savings x loanMultiplier) and runs the corpus 10% buffer check, updating amountError and corpusWarning in LoanApplyState. No I/O."
        action_contract_hash: "d40725e9c1b3846af2e0d7b95c163a08e5c2a41d9f673b80c2e5f1a46d837b92"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"
    error_text: "{{amountError}}"  # i18n: skip

  - id: corpus_warning_banner
    type: warning-banner
    style:
      background: "#FFF9C4"
      text_color: "#E65100"
      corner_radius: 8dp
      padding: 12dp
    message: "Warning: Disbursing this amount will reduce the group corpus below 10% buffer. Current balance: KES {{corpusBalance | number}}."  # i18n: skip
    visible_when: "corpusWarning"

  - id: duration_dropdown
    type: dropdown
    label: "{strings.duration_label}"
    accessibility_label: "{strings.duration_label}"
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    options:
      - { label: "4 weeks", value: 4 }  # i18n: skip
      - { label: "8 weeks", value: 8 }  # i18n: skip
      - { label: "12 weeks", value: 12 }  # i18n: skip
      - { label: "24 weeks", value: 24 }  # i18n: skip
      - { label: "52 weeks (1 year)", value: 52 }  # i18n: skip
    selected_value: "{{durationWeeks}}"  # i18n: skip
    on_change:
      action: OnDurationChanged
      param: weeks
      action_contract:
        effect: transform_state
        description: "Pure ViewModel transition: writes the chosen durationWeeks into LoanApplyState, which feeds loanTermFrequency and numberOfRepayments on the eventual Fineract post_loan body. No I/O."
        action_contract_hash: "e51836f0d2c4957b03f1e8ca6d274b19f6d3b52e0a784c91d3f602b57e948c03"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: purpose_dropdown
    type: dropdown
    label: "{strings.purpose_label}"
    accessibility_label: "{strings.purpose_label}"
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    options:
      - { label: "Medical", value: MEDICAL }  # i18n: skip
      - { label: "Education", value: EDUCATION }  # i18n: skip
      - { label: "Business", value: BUSINESS }  # i18n: skip
      - { label: "Emergency", value: EMERGENCY }  # i18n: skip
      - { label: "Other", value: OTHER }  # i18n: skip
    selected_value: "{{purpose}}"  # i18n: skip
    on_change:
      action: OnPurposeChanged
      param: purpose
      action_contract:
        effect: transform_state
        description: "Pure ViewModel transition: stores the selected LoanPurpose enum into LoanApplyState, later mapped to loanPurposeId on the Fineract post_loan body. No I/O."
        action_contract_hash: "f6294a70e3d5068c14a2f9db7e385c20a7e4c63f1b895d02e4a713c68f059d14"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: product_dropdown
    type: dropdown
    label: "{strings.product_label}"
    placeholder: "{strings.product_placeholder}"
    accessibility_label: "{strings.product_label}"
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    options_source: loanProducts
    option_label: "name"  # i18n: skip
    on_change:
      action: OnProductSelected
      param: product
      action_contract:
        effect: call_api
        library_refs: ["cmp-network-monitor"]
        external_library_refs: ["Store5", "Fineract get_loan_template"]
        description: "On product selection, calls LoanRepository.getLoanTemplate via Store5 to pre-fill principal, repayments and interest; cmp-network-monitor serves the cached template when offline."
        action_contract_hash: "07385b81f4e6179c25b3a0ec8f496d31b8f5d74e2ca906e1f5b824d79a16ae25"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: submit_button
    type: button
    label: "{strings.submit_button}"
    accessibility_label: "{strings.submit_button}"
    style:
      background: primary
      text_color: onPrimary
      corner_radius: 24dp
      min_touch_target: 56dp
      width: fill
    loading_when: "isSubmitting"
    enabled_when: "selectedMember != null && requestedAmount.isNotBlank() && amountError == null && selectedProduct != null"
    on_click:
      action: OnSubmit
      target: meeting-conduct
      action_contract:
        effect: call_api
        library_refs: ["cmp-network-monitor"]
        external_library_refs: ["Fineract post_loan", "Fineract m_loan"]
        description: "Builds a LoanApplicationRequest and POSTs it via LoanRepository.submitLoanApplication to Fineract post_loan (creates m_loan pending approval); cmp-network-monitor blocks the submit while offline and surfaces the queued-offline error."
        action_contract_hash: "18496c92a5f728ad36c4b1fd8e5a7042c9a6e85f3db017f2a6c935e80b27bf36"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "{strings.error_submit_title}"
    body: "{{error.message}}"  # i18n: skip
    cta_label: "{strings.btn_retry}"
    accessibility_label: "{strings.btn_retry}"
    on_click:
      action: OnSubmit
      target: meeting-conduct
      action_contract:
        effect: call_api
        library_refs: ["cmp-network-monitor"]
        external_library_refs: ["Fineract post_loan", "Fineract m_loan"]
        description: "Retries the failed submission by re-invoking LoanRepository.submitLoanApplication to Fineract post_loan; cmp-network-monitor re-checks connectivity before re-attempting the m_loan create."
        action_contract_hash: "295a7db03f68139be47c52ae9f6b8153dab7f96e4ec128a3b7ca46f91c38ca47"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: content
  loading:
    components: [top_bar]
    description: "Loading members, products, and config in parallel before showing form"
  content:
    components:
      - top_bar
      - member_selector
      - eligibility_banner
      - amount_input
      - corpus_warning_banner
      - duration_dropdown
      - purpose_dropdown
      - product_dropdown
      - submit_button
    description: "Form ready for input; eligibility and corpus banners shown conditionally"
    demo_data:
      selectedMember: { id: 1, displayName: "Peter Otieno" }
      memberSavingsBalance: 5000
      loanMultiplier: 3.0
      eligibleAmount: 15000
      corpusBalance: 24000
      requestedAmount: "1500"
      durationWeeks: 12
      purpose: BUSINESS
  submitting:
    components:
      - top_bar
      - member_selector
      - eligibility_banner
      - amount_input
      - corpus_warning_banner
      - duration_dropdown
      - purpose_dropdown
      - product_dropdown
      - submit_button
    description: "Submit button shows loading indicator; form inputs disabled"
  error:
    components: [top_bar, error_state]
    description: "API submission failed; error shown with retry"

i18n:
  en:
    screen_title: "Apply for Loan"
    member_label: "Select Member"
    amount_label: "Requested Amount (KES)"
    duration_label: "Loan Duration"
    purpose_label: "Loan Purpose"
    product_label: "Loan Product"
    eligibility_savings: "Savings balance: KES {{amount}}"
    eligibility_max: "Max eligible: KES {{amount}} ({{multiplier}}× savings)"
    corpus_warning: "Warning: Disbursing this amount will reduce the group corpus below 10% buffer."
    submit_button: "Submit Application"
    error_amount_exceeds: "Amount exceeds eligible limit of KES {{limit}}"
    error_corpus: "Corpus balance too low to support this disbursement."
    error_network: "No internet. Application will be queued offline."
    error_server: "Server error. Please try again."
    error_auth: "Session expired. Please log in again."
  sw:
    screen_title: "Omba Mkopo"
    submit_button: "Wasilisha Ombi"
    corpus_warning: "Onyo: Kiasi hiki kitapunguza hazina ya kikundi chini ya 10%."
  fr:
    screen_title: "Demande de Prêt"
    submit_button: "Soumettre la Demande"
  hi:
    screen_title: "ऋण आवेदन"
    submit_button: "आवेदन जमा करें"
