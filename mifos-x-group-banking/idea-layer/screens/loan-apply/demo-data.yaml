      - id: 3
        displayName: "Grace Akinyi"
        imagePresent: true
        fineractClientId: 3

      - id: 4
        displayName: "Joseph Kamau"
        imagePresent: false
        fineractClientId: 4

      - id: 5
        displayName: "Mary Njeri"
        imagePresent: true
        fineractClientId: 5

  - dto: LoanProduct
    count_hint: 3
    source_notes: >
      Three Fineract loan products backing the product_dropdown. Group Solidarity Loan
      is the default product used by the content-state demo scenario (KES 1,500 requested
      out of KES 15,000 eligible).
    items:
      - id: 1
        name: "Group Solidarity Loan"
        shortName: "GSL"
        minPrincipal: 500.00
        maxPrincipal: 15000.00
        interestRatePerPeriod: 0.83

      - id: 2
        name: "Emergency Micro Loan"
        shortName: "EML"
        minPrincipal: 500.00
        maxPrincipal: 5000.00
        interestRatePerPeriod: 1.25

      - id: 3
        name: "Business Growth Loan"
        shortName: "BGL"
        minPrincipal: 2000.00
        maxPrincipal: 25000.00
        interestRatePerPeriod: 0.75

  - dto: LoanPurpose
    count_hint: 5
    source_notes: >
      All five LoanPurpose enum values that back the purpose_dropdown options
      (MEDICAL, EDUCATION, BUSINESS, EMERGENCY, OTHER). BUSINESS is the default
      selected in the content-state demo_data block.
    items:
      - value: MEDICAL
      - value: EDUCATION
      - value: BUSINESS
      - value: EMERGENCY
      - value: OTHER

  - dto: LoanApplicationRequest
    count_hint: 1
    source_notes: >
      Peter Otieno applies for KES 1,500 Group Solidarity Loan over 12 weeks for
      business capital. His savings balance is KES 5,000 so his ceiling is KES 15,000
      (3.0 multiplier). KES 1,500 is well within eligibility and leaves the corpus
      balance (KES 24,000) safely above the 10% buffer floor.
    items:
      - memberId: 1
        productId: 1
        amount: 1500.00
        durationWeeks: 12
        purpose: "BUSINESS"
        groupId: 201

  - dto: GroupConfig
    count_hint: 1
    source_notes: >
      Group policy from dt_group_config for Mwangaza Women's Group. loanMultiplier
      3.0 drives eligibleAmount = memberSavingsBalance x 3.0.
    items:
      - loanMultiplier: 3.0
        maxLoanAmount: 50000.00
        meeting_frequency: "WEEKLY"

  - dto: GroupCorpus
    count_hint: 1
    source_notes: >
      Current corpus balance for Mwangaza Women's Group (group 201). KES 24,000 in
      the fund; 10% buffer floor = KES 2,400. Disbursing KES 1,500 leaves KES 22,500 --
      well above buffer -- so the corpus_warning_banner stays hidden in this scenario.
      The banner only appears when (corpusBalance - requestedAmount) < 0.10 x corpusBalance.
    items:
      - corpus_balance: 24000.00
        last_updated: "2026-07-18T08:00:00Z"

  - dto: LoanTemplate
    count_hint: 1
    source_notes: >
      Fineract /loans/template response for Group Solidarity Loan (productId 1),
      clientId 1 (Peter Otieno). Pre-fills the form with 12 weekly repayments at
      0.83% per period (declining balance, approx 10% annual).
    items:
      - principal: 1500.00
        numberOfRepayments: 12
        repaymentEvery: 1
        interestRatePerPeriod: 0.83
        interestType: { id: 0, value: "Declining Balance" }
        amortizationType: { id: 1, value: "Equal installments" }

  - dto: MemberSavings
    count_hint: 1
    source_notes: >
      Peter Otieno's /clients/1/accounts response backing MemberRepository.getMemberSavingsBalance.
      Active savings account balance KES 5,000 -> eligibleAmount = 5000 x 3.0 = KES 15,000.
      Peter's KES 1,500 application is comfortably within the ceiling shown on the eligibility_banner.
    items:
      - savingsAccounts:
          - id: 5001
            accountBalance: 5000.00
            status: { value: "Active" }

  - dto: LoanApplicationResponse
    count_hint: 1
    source_notes: >
      Successful post_loan response for Peter Otieno's KES 1,500 application. loanId 4211
      is dispatched on the NavigateToMeetingConduct event so the group can start the
      loan-voting flow (Fineract m_loan created with status "submitted and pending approval").
    items:
      - officeId: 1
        clientId: 1
        loanId: 4211
        resourceId: 4211

  - dto: LoanApplyError
    count_hint: 5
    source_notes: >
      Backing content for the error_state component ({{error.message}}). Covers all
      five LoanApplyError variants declared in ui.yaml state_model.errors:
      Network (retry), Server (retry), AmountExceedsEligibility (no retry -- surfaces
      via amountError on amount_input), CorpusInsufficient (no retry -- surfaces on
      corpus_warning_banner), and Auth (redirect to login).
    items:
      - type: "Network"
        code: "network.offline"
        message: "No internet. Application will be queued offline."
        retry: true

      - type: "Server"
        code: "server.error"
        message: "Server error. Please try again."
        retry: true

      - type: "AmountExceedsEligibility"
        code: "amount.exceeds_eligibility"
        message: "Amount exceeds eligible limit of KES 15,000"
        retry: false

      - type: "CorpusInsufficient"
        code: "corpus.insufficient"
        message: "Corpus balance too low to support this disbursement."
        retry: false

      - type: "Auth"
        code: "auth.expired"
        message: "Session expired. Please log in again."
        retry: false
        redirect: "login"

