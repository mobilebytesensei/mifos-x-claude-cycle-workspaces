sibling: tests
schema_version: "4.0"
feature_id: loan-apply

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LA-001
      scenario: "On mount, group members, loan products, corpus, and config load in parallel"
      type: ViewModel
      priority: P0

    - id: TC-LA-002
      scenario: "Step 1 member selector shows all group members by displayName"
      type: Screen
      priority: P0

    - id: TC-LA-003
      scenario: "Step 1 loan product selector shows all products with name and principal range"
      type: Screen
      priority: P0

    - id: TC-LA-004
      scenario: "Selecting member + product triggers get_loan_template and get_member_savings"
      type: ViewModel
      priority: P0

    - id: TC-LA-005
      scenario: "Eligibility ceiling = savingsBalance * loanMultiplier and capped by corpus balance"
      type: ViewModel
      priority: P0

    - id: TC-LA-006
      scenario: "Loan amount exceeding eligibility ceiling shows validation error and disables submit"
      type: ViewModel
      priority: P0

    - id: TC-LA-007
      scenario: "Loan amount below LoanProduct.minPrincipal shows validation error"
      type: ViewModel
      priority: P0

    - id: TC-LA-008
      scenario: "Purpose dropdown shows all LoanPurpose values (MEDICAL, EDUCATION, BUSINESS, EMERGENCY, OTHER)"
      type: Screen
      priority: P1

    - id: TC-LA-009
      scenario: "Step progression requires member, product, and amount to be valid before advancing"
      type: ViewModel
      priority: P0

    - id: TC-LA-010
      scenario: "Review step shows member name, product, amount, duration, and purpose before submit"
      type: Screen
      priority: P1

    - id: TC-LA-011
      scenario: "Submit fires post_loan with correct LoanApplicationRequest body"
      type: ViewModel
      priority: P0

    - id: TC-LA-012
      scenario: "On successful post_loan, navigate back to group-dashboard with success snackbar"
      type: ViewModel
      priority: P0

    - id: TC-LA-013
      scenario: "400 error from post_loan shows field-level validation errors"
      type: ViewModel
      priority: P1

    - id: TC-LA-014
      scenario: "When offline, submit shows error message (loan submission requires network)"
      type: ViewModel
      priority: P1

    - id: TC-LA-015
      scenario: "LoanRepository.submitLoanApplication maps LoanApplicationRequest to correct Fineract POST body"
      type: Repository
      priority: P0

    - id: TC-LA-016
      scenario: "LoanRepository.getLoanProducts caches result for 3600 seconds"
      type: Repository
      priority: P1

    - id: TC-LA-017
      scenario: "MemberRepository.getGroupMembers caches result for 3600 seconds"
      type: Repository
      priority: P1

    - id: TC-LA-018
      scenario: "Loan template pre-fills interestRatePerPeriod and numberOfRepayments from product defaults"
      type: ViewModel
      priority: P1

    - id: TC-LA-019
      scenario: "403 error shows permission-denied error (role gate)"
      type: ViewModel
      priority: P1

    - id: TC-LA-020
      scenario: "Back navigation from Step 2 preserves member and product selection"
      type: ViewModel
      priority: P2
