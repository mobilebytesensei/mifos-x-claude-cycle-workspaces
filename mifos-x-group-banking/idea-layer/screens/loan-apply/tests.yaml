sibling: tests
schema_version: "4.0"
feature_id: loan-apply
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LA-001
      scenario: "On mount, members and loan products load; eligible amount computed from savings balance x multiplier"
      type: ViewModel
      priority: P0
      given: "groupId=1; memberSavingsBalance=10000.0; loanMultiplier=3.0"
      when: "LoanApplyScreen enters composition"
      then: "members list populated; loanProducts loaded; eligibleAmount=30000.0; LoanApplyScreenState=Content"

    - id: TC-LA-002
      scenario: "Requested amount exceeding eligibility sets amountError inline"
      type: ViewModel
      priority: P0
      given: "eligibleAmount=30000.0; selectedMember set"
      when: "OnAmountChange('35000')"
      then: "amountError shows error_amount_exceeds message; submit button disabled"

    - id: TC-LA-003
      scenario: "Requested amount within eligibility clears amountError and enables submit"
      type: ViewModel
      priority: P0
      given: "amountError was set; user reduces to 20000"
      when: "OnAmountChange('20000')"
      then: "amountError=null; submit enabled; requestedAmount='20000'"

    - id: TC-LA-004
      scenario: "Corpus warning banner appears when requestedAmount exceeds corpusBalance"
      type: Screen
      priority: P1
      given: "corpusBalance=15000.0; requestedAmount='20000'"
      when: "LoanApplyScreen renders"
      then: "corpusWarning=true; warning banner visible above submit button"

    - id: TC-LA-005
      scenario: "OnSubmit calls POST /companion/groups/{groupId}/loans and navigates to meeting on success"
      type: ViewModel
      priority: P0
      given: "all fields valid; network online; selectedMember, requestedAmount, durationWeeks, purpose all set"
      when: "OnSubmit fires"
      then: "isSubmitting=true; POST /companion/groups/1/loans called; on 200 NavigateToMeetingConduct emitted with new loanId; isSubmitting=false; submitSuccess=true"

    - id: TC-LA-006
      scenario: "Corpus insufficient error from server shows CorpusInsufficient error state"
      type: ViewModel
      priority: P1
      given: "network online; server returns corpus_insufficient error"
      when: "OnSubmit fires"
      then: "LoanApplyError type=CorpusInsufficient shown; isSubmitting=false"

    - id: TC-LA-007
      scenario: "Network error during submission shows Network error with retry"
      type: ViewModel
      priority: P1
      given: "network offline on submit"
      when: "OnSubmit fires"
      then: "LoanApplyError type=Network retry=true; ShowSnackbar emitted; isSubmitting=false"

    - id: TC-LA-008
      scenario: "Purpose dropdown renders all LoanPurpose enum values"
      type: Screen
      priority: P1
      given: "Content state"
      when: "purpose dropdown renders"
      then: "BUSINESS option preselected by default; all LoanPurpose values selectable"

    - id: TC-LA-009
      scenario: "Duration slider updates durationWeeks state and shows weeks label"
      type: Screen
      priority: P1
      given: "Content state; durationWeeks=12"
      when: "OnDurationChange(24)"
      then: "durationWeeks=24; label shows '24 weeks'"

    - id: TC-LA-010
      scenario: "Auth 401 redirects to login"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "members fetch or submit returns 401"
      then: "LoanApplyError type=Auth redirect=login; NavigateBack emitted"
