<!DOCTYPE html>
<html lang="en" data-feature="loan-apply" data-state="submitting" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-apply · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* loan-apply · submitting — form frozen while LoanRepository.submitLoanApplication posts to Fineract */
  main[data-inert] { opacity: 0.55; pointer-events: none; filter: saturate(0.85); }
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; gap: 16px;
  }
  .loading-title { font-size: 17px; font-weight: 600; color: var(--text-primary, #212121); }
  .loading-sub { font-size: 13px; color: var(--text-secondary, #616161); }
</style>
</head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" style="visibility:hidden;">‹</button>
    <h1>Apply for loan</h1>
  </header>
  <main data-inert>
    <!-- member_selector -->
    <div class="form-field">
      <label for="member">Select member</label>
      <select id="member" disabled><option selected>Grace Akinyi</option></select>
    </div>

    <!-- eligibility_banner -->
    <div class="card card-highlighted">
      <div class="kv-grid">
        <span class="k">Savings balance</span><span class="v">KES 3,200</span>
        <span class="k">Max eligible</span><span class="v" style="color:var(--success);">KES 9,600</span>
        <span class="k">Multiplier</span><span class="v">3.0× savings</span>
      </div>
    </div>

    <!-- amount_input -->
    <div class="form-field">
      <label for="amount">Requested amount (KES)</label>
      <input id="amount" type="number" value="8,000" class="amount-input" inputmode="decimal" disabled>
    </div>

    <!-- duration_dropdown -->
    <div class="form-field">
      <label for="duration">Loan duration</label>
      <select id="duration" disabled><option selected>8 weeks</option></select>
    </div>

    <!-- purpose_dropdown -->
    <div class="form-field">
      <label for="purpose">Loan purpose</label>
      <select id="purpose" disabled><option selected>Business</option></select>
    </div>

    <!-- product_dropdown -->
    <div class="form-field">
      <label for="product">Loan product</label>
      <select id="product" disabled><option selected>Group Solidarity Loan</option></select>
    </div>

    <!-- submit_button -->
    <button class="btn btn-primary btn-full" disabled>Submitting…</button>
  </main>

  <div class="loading-overlay">
    <div class="spinner"></div>
    <span class="loading-title">Submitting your application…</span>
    <span class="loading-sub">Sending to the group ledger…</span>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
