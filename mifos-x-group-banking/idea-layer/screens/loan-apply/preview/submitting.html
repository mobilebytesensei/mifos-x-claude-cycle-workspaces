<!DOCTYPE html>
<html lang="en" data-feature="loan-apply" data-state="submitting" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-apply · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* loan-apply · submitting — form frozen while LoanRepository.submitLoanApplication posts to Fineract */
  main[data-inert] { opacity: 0.55; pointer-events: none; filter: saturate(0.85); }
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(255,255,255,0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 100; gap: 16px;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border-default, #e0e0e0);
    border-top-color: var(--primary-700, #2E7D32);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 0s; } }
  .loading-title { font-size: 17px; font-weight: 600; color: var(--text-primary, #212121); }
  .loading-sub { font-size: 13px; color: var(--text-secondary, #616161); }
</style>
</head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" style="visibility:hidden;">‹</button>
    <h1 class="app-bar-title">Apply for loan</h1>
  </header>
  <main data-inert>
    <div class="card card-muted">
      <h3>You're eligible</h3>
      <div class="kv-grid">
        <span class="k">Group corpus</span><span class="v">KES 84,250</span>
        <span class="k">Your max loan</span><span class="v" style="color:var(--success);">KES 15,000</span>
        <span class="k">Current loan</span><span class="v">None</span>
      </div>
    </div>
    <div class="form-field"><label for="amt">Loan amount (KES)</label><input id="amt" type="number" value="8,000" class="amount-input" inputmode="numeric" disabled></div>
    <div class="form-field"><label for="purpose">Purpose</label>
      <select id="purpose" disabled><option selected>Business — restocking</option></select>
    </div>
    <div class="form-field"><label for="term">Repayment term</label>
      <select id="term" disabled><option selected>8 weeks</option></select>
    </div>
    <div class="card card-muted">
      <h3>Repayment preview</h3>
      <div class="kv-grid">
        <span class="k">Weekly</span><span class="v">KES 1,050</span>
        <span class="k">Interest (5%)</span><span class="v">KES 400</span>
        <span class="k">Total to repay</span><span class="v">KES 8,400</span>
      </div>
    </div>
    <button class="btn btn-primary btn-full" disabled>Submitting…</button>
  </main>

  <div class="loading-overlay">
    <div class="spinner"></div>
    <span class="loading-title">Submitting your application…</span>
    <span class="loading-sub">Sending to the group ledger…</span>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
