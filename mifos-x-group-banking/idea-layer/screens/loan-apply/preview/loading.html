<!DOCTYPE html>
<html lang="en" data-feature="loan-apply" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-apply · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* loan-apply · loading — parallel fetch of members, products, and group config */
  .shimmer-card {
    background: var(--bg-canvas, #fff);
    border: 1px solid var(--border-subtle, #eee);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .shimmer-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, #f0f0f0 25%, #e6e6e6 37%, #f0f0f0 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    margin-bottom: 10px;
  }
  .shimmer-line:last-child { margin-bottom: 0; }
  .shimmer-title { height: 16px; width: 55%; }
  .shimmer-meta { width: 80%; }
  .shimmer-meta.short { width: 45%; }
  .shimmer-field { height: 48px; border-radius: 8px; margin-bottom: 16px; }
  .shimmer-btn { height: 56px; border-radius: 24px; margin-top: 8px; }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .shimmer-line { animation: none; } }
</style>
</head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="loan-list">‹</button>
    <h1 class="app-bar-title">Apply for loan</h1>
  </header>
  <main>
    <!-- eligibility card placeholder -->
    <div class="shimmer-card">
      <div class="shimmer-line shimmer-title"></div>
      <div class="shimmer-line shimmer-meta"></div>
      <div class="shimmer-line shimmer-meta short"></div>
    </div>
    <!-- member selector placeholder -->
    <div class="shimmer-line shimmer-field"></div>
    <!-- amount input placeholder -->
    <div class="shimmer-line shimmer-field"></div>
    <!-- repayment preview card placeholder -->
    <div class="shimmer-card">
      <div class="shimmer-line shimmer-title"></div>
      <div class="shimmer-line shimmer-meta"></div>
      <div class="shimmer-line shimmer-meta short"></div>
    </div>
    <!-- duration + purpose + product dropdown placeholders -->
    <div class="shimmer-line shimmer-field"></div>
    <div class="shimmer-line shimmer-field"></div>
    <!-- submit button placeholder -->
    <div class="shimmer-line shimmer-btn"></div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
