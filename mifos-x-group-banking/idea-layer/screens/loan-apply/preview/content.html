<!DOCTYPE html>
<html lang="en" data-feature="loan-apply" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-apply · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="form">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar"><button class="back-btn" data-nav-to="loan-list">‹</button><h1>Apply for loan</h1></header>
<main>
  <div class="card card-muted">
    <h3>You're eligible</h3>
    <div class="kv-grid">
      <span class="k">Group corpus</span><span class="v">KES 84,250</span>
      <span class="k">Your max loan</span><span class="v" style="color:var(--success);">KES 15,000</span>
      <span class="k">Current loan</span><span class="v">None</span>
    </div>
  </div>
  <div class="form-field"><label for="amt">Loan amount (KES)</label><input id="amt" type="number" placeholder="5,000" class="amount-input" inputmode="numeric"></div>
  <div class="form-field"><label for="purpose">Purpose</label>
    <select id="purpose"><option>Business — restocking</option><option>School fees</option><option>Medical</option><option>Home improvement</option><option>Emergency</option><option>Other</option></select>
  </div>
  <div class="form-field"><label for="term">Repayment term</label>
    <select id="term"><option>4 weeks</option><option selected>8 weeks</option><option>12 weeks</option><option>16 weeks</option></select>
  </div>
  <div class="card card-muted">
    <h3>Repayment preview</h3>
    <div class="kv-grid">
      <span class="k">Weekly</span><span class="v">KES 660</span>
      <span class="k">Interest (5%)</span><span class="v">KES 250</span>
      <span class="k">Total to repay</span><span class="v">KES 5,250</span>
    </div>
  </div>
  <div class="form-field"><label for="guar">Guarantor (optional)</label>
    <select id="guar"><option>Select a member…</option><option>Wanjiru Kamau</option><option>Joseph Njoroge</option></select>
  </div>
  <button class="btn btn-primary btn-full" data-action="submit_application" data-nav-to="loan-list">Submit application</button>
  <p class="footnote" style="text-align:center;">Group will vote at next meeting (Sat 7 Jun)</p>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
