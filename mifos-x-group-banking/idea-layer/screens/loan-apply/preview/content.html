<!DOCTYPE html>
<html lang="en" data-feature="loan-apply" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-apply · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="loan-list">‹</button>
    <h1>Apply for loan</h1>
  </header>
  <main>
    <!-- member_selector -->
    <div class="form-field">
      <label for="member">Select member</label>
      <select id="member" data-action="OnMemberSelected">
        <option>Amina Wanjiru</option>
        <option>Joseph Kamau</option>
        <option selected>Grace Akinyi</option>
        <option>Peter Mwangi</option>
        <option>Mary Njeri</option>
      </select>
    </div>

    <!-- eligibility_banner -->
    <div class="card card-highlighted">
      <div class="kv-grid">
        <span class="k">Savings balance</span><span class="v">KES 3,200</span>
        <span class="k">Max eligible</span><span class="v" style="color:var(--success);">KES 9,600</span>
        <span class="k">Multiplier</span><span class="v">3.0× savings</span>
      </div>
    </div>

    <!-- amount_input -->
    <div class="form-field">
      <label for="amount">Requested amount (KES)</label>
      <input id="amount" type="number" value="8,000" class="amount-input" inputmode="decimal" data-action="OnAmountChanged">
      <p class="help">Within your eligible limit of KES 9,600</p>
    </div>

    <!-- duration_dropdown -->
    <div class="form-field">
      <label for="duration">Loan duration</label>
      <select id="duration" data-action="OnDurationChanged">
        <option value="4">4 weeks</option>
        <option value="8" selected>8 weeks</option>
        <option value="12">12 weeks</option>
        <option value="24">24 weeks</option>
        <option value="52">52 weeks (1 year)</option>
      </select>
    </div>

    <!-- purpose_dropdown -->
    <div class="form-field">
      <label for="purpose">Loan purpose</label>
      <select id="purpose" data-action="OnPurposeChanged">
        <option value="MEDICAL">Medical</option>
        <option value="EDUCATION">Education</option>
        <option value="BUSINESS" selected>Business</option>
        <option value="EMERGENCY">Emergency</option>
        <option value="OTHER">Other</option>
      </select>
    </div>

    <!-- product_dropdown -->
    <div class="form-field">
      <label for="product">Loan product</label>
      <select id="product" data-action="OnProductSelected">
        <option selected>Group Solidarity Loan</option>
        <option>Emergency Micro Loan</option>
      </select>
    </div>

    <!-- submit_button -->
    <button class="btn btn-primary btn-full" data-action="OnSubmit" data-state-to="submitting">Submit Application</button>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
