<!DOCTYPE html>
<html lang="en" data-feature="loan-apply" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-apply · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* loan-apply · error — LoanRepository.submitLoanApplication failed; retry re-posts to Fineract */
  .error-container {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 24px 32px; text-align: center; min-height: calc(100vh - 120px);
  }
  .empty-icon { font-size: 56px; line-height: 1; margin-bottom: 20px; color: var(--danger, #C62828); }
  .empty-title { font-size: 20px; font-weight: 700; color: var(--text-primary, #212121); margin: 0 0 10px; }
  .empty-body { font-size: 14px; color: var(--text-secondary, #616161); margin: 0 0 36px; line-height: 1.5; }
  .action-group { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="loan-list">‹</button>
    <h1 class="app-bar-title">Apply for loan</h1>
  </header>
  <main>
    <div class="error-container">
      <div class="empty-state">
        <div class="empty-icon">☁</div>
        <h2 class="empty-title">Could not submit</h2>
        <p class="empty-body">No internet. Your application will be queued offline and sent when you reconnect.</p>
        <div class="action-group">
          <button class="btn btn-primary btn-full" data-action="OnSubmit" data-state-to="submitting">Try Again</button>
          <button class="btn btn-secondary btn-full" data-nav-to="loan-list">Back to loans</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
