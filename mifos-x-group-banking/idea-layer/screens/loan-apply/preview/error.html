<!DOCTYPE html>
<html lang="en" data-feature="loan-apply" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-apply · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="loan-list">‹</button>
    <h1>Apply for loan</h1>
  </header>
  <main>
    <!-- error_state -->
    <div class="alert alert-danger">
      <div>
        <h3>Could not submit</h3>
        <p>No internet. Your application for KES 8,000 will be queued offline and sent when you reconnect.</p>
      </div>
    </div>
    <div class="empty-state">
      <div class="illus">☁</div>
      <h2>Submission failed</h2>
      <p>Check your connection and try again, or head back to your loans.</p>
      <button class="btn btn-primary btn-full" data-action="OnSubmit" data-state-to="submitting">Try Again</button>
      <div class="btn-group">
        <button class="btn btn-secondary btn-full" data-nav-to="loan-list">Back to loans</button>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
