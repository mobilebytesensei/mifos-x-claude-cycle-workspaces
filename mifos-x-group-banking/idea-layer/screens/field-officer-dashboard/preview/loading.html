<!DOCTYPE html>
<html lang="en" data-feature="field-officer-dashboard" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>field-officer-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .shimmer { background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-sm); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .shimmer { animation: none; } }

  /* KPI row skeleton — matches content KPI cards */
  .kpi-row { display: flex; gap: var(--space-md); overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-base); }
  .kpi-card-sk { min-width: 140px; flex-shrink: 0; border-radius: var(--radius-md); padding: var(--space-base); border: 1px solid var(--border-subtle); background: var(--bg-canvas); }

  /* Filter chip skeleton */
  .filter-row { display: flex; gap: var(--space-sm); padding: 0 0 var(--space-sm); }
  .chip-sk { height: 30px; width: 108px; border-radius: 9999px; flex-shrink: 0; }

  /* Groups list header skeleton */
  .groups-header-sk { height: 14px; width: 96px; margin: 4px 0 var(--space-sm); }

  /* Group health card skeleton — 6 rows per DashboardShimmer count:6 */
  .group-card-sk { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-base); margin-bottom: var(--space-sm); }
  .sk-line { height: 14px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1 class="app-bar-title">Field Officer Dashboard</h1>
    <button class="icon-btn" aria-label="Export" style="opacity:.4;">⬇</button>
  </header>
  <main>
    <!-- KPI row skeleton -->
    <div class="kpi-row">
      <div class="kpi-card-sk">
        <div class="shimmer" style="height:22px;width:40px;margin-bottom:8px;"></div>
        <div class="shimmer sk-line" style="width:80%;"></div>
      </div>
      <div class="kpi-card-sk">
        <div class="shimmer" style="height:22px;width:40px;margin-bottom:8px;"></div>
        <div class="shimmer sk-line" style="width:80%;"></div>
      </div>
      <div class="kpi-card-sk">
        <div class="shimmer" style="height:22px;width:64px;margin-bottom:8px;"></div>
        <div class="shimmer sk-line" style="width:90%;"></div>
      </div>
      <div class="kpi-card-sk">
        <div class="shimmer" style="height:22px;width:64px;margin-bottom:8px;"></div>
        <div class="shimmer sk-line" style="width:90%;"></div>
      </div>
    </div>

    <!-- Filter chip skeleton -->
    <div class="filter-row">
      <div class="shimmer chip-sk"></div>
      <div class="shimmer chip-sk"></div>
      <div class="shimmer chip-sk"></div>
    </div>

    <!-- Groups list header skeleton -->
    <div class="shimmer groups-header-sk"></div>

    <!-- 6 group card skeletons (DashboardShimmer count: 6) -->
    <div class="group-card-sk">
      <div class="shimmer sk-line" style="width:60%;"></div>
      <div class="shimmer sk-line" style="width:40%;"></div>
      <div class="shimmer" style="height:20px;width:64px;border-radius:9999px;margin-top:6px;"></div>
    </div>
    <div class="group-card-sk">
      <div class="shimmer sk-line" style="width:55%;"></div>
      <div class="shimmer sk-line" style="width:38%;"></div>
      <div class="shimmer" style="height:20px;width:64px;border-radius:9999px;margin-top:6px;"></div>
    </div>
    <div class="group-card-sk">
      <div class="shimmer sk-line" style="width:62%;"></div>
      <div class="shimmer sk-line" style="width:42%;"></div>
      <div class="shimmer" style="height:20px;width:64px;border-radius:9999px;margin-top:6px;"></div>
    </div>
    <div class="group-card-sk">
      <div class="shimmer sk-line" style="width:58%;"></div>
      <div class="shimmer sk-line" style="width:36%;"></div>
      <div class="shimmer" style="height:20px;width:64px;border-radius:9999px;margin-top:6px;"></div>
    </div>
    <div class="group-card-sk">
      <div class="shimmer sk-line" style="width:64%;"></div>
      <div class="shimmer sk-line" style="width:44%;"></div>
      <div class="shimmer" style="height:20px;width:64px;border-radius:9999px;margin-top:6px;"></div>
    </div>
    <div class="group-card-sk">
      <div class="shimmer sk-line" style="width:56%;"></div>
      <div class="shimmer sk-line" style="width:40%;"></div>
      <div class="shimmer" style="height:20px;width:64px;border-radius:9999px;margin-top:6px;"></div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
