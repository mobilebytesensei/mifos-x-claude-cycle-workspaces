<!DOCTYPE html>
<html lang="en" data-feature="field-officer-dashboard" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>field-officer-dashboard · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* skeleton primitive — mirrors content structure with canonical .summary-card / .list shells */
  .shimmer { background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-sm); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .shimmer { animation: none; } }
  .kpi-scroll { display: flex; gap: var(--space-sm); overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-base); }
  .kpi-scroll .summary-card { min-width: 148px; flex-shrink: 0; }
  .chip-row .chip-sk { height: 30px; width: 112px; border-radius: 9999px; flex-shrink: 0; }
  .groups-header-sk { height: 13px; width: 92px; margin: 0 0 var(--space-sm); }
  .list-item .avatar-sk { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .sk-line { height: 13px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1>Field Officer Dashboard</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" aria-label="Export" style="opacity:.4;">⬇</button>
    </div>
  </header>
  <main>
    <!-- shimmer_dashboard — KPI card skeletons mirroring the 4-card content row -->
    <div class="kpi-scroll" aria-busy="true" aria-label="Loading dashboard">
      <div class="summary-card">
        <div class="shimmer sk-line" style="width:70%;margin-bottom:8px;"></div>
        <div class="shimmer" style="height:22px;width:40%;"></div>
      </div>
      <div class="summary-card">
        <div class="shimmer sk-line" style="width:70%;margin-bottom:8px;"></div>
        <div class="shimmer" style="height:22px;width:40%;"></div>
      </div>
      <div class="summary-card">
        <div class="shimmer sk-line" style="width:80%;margin-bottom:8px;"></div>
        <div class="shimmer" style="height:22px;width:60%;"></div>
      </div>
      <div class="summary-card">
        <div class="shimmer sk-line" style="width:80%;margin-bottom:8px;"></div>
        <div class="shimmer" style="height:22px;width:60%;"></div>
      </div>
    </div>

    <!-- filter chip skeleton -->
    <div class="chip-row">
      <div class="shimmer chip-sk"></div>
      <div class="shimmer chip-sk"></div>
      <div class="shimmer chip-sk"></div>
    </div>

    <!-- groups list header skeleton -->
    <div class="shimmer groups-header-sk"></div>

    <!-- 6 group health card skeletons (DashboardShimmer count: 6) -->
    <div class="list">
      <div class="list-item">
        <span class="shimmer avatar-sk"></span>
        <div class="main">
          <div class="shimmer sk-line" style="width:60%;margin-bottom:8px;"></div>
          <div class="shimmer sk-line" style="width:40%;"></div>
        </div>
        <span class="shimmer" style="height:20px;width:60px;border-radius:9999px;"></span>
      </div>
      <div class="list-item">
        <span class="shimmer avatar-sk"></span>
        <div class="main">
          <div class="shimmer sk-line" style="width:55%;margin-bottom:8px;"></div>
          <div class="shimmer sk-line" style="width:38%;"></div>
        </div>
        <span class="shimmer" style="height:20px;width:60px;border-radius:9999px;"></span>
      </div>
      <div class="list-item">
        <span class="shimmer avatar-sk"></span>
        <div class="main">
          <div class="shimmer sk-line" style="width:62%;margin-bottom:8px;"></div>
          <div class="shimmer sk-line" style="width:42%;"></div>
        </div>
        <span class="shimmer" style="height:20px;width:60px;border-radius:9999px;"></span>
      </div>
      <div class="list-item">
        <span class="shimmer avatar-sk"></span>
        <div class="main">
          <div class="shimmer sk-line" style="width:58%;margin-bottom:8px;"></div>
          <div class="shimmer sk-line" style="width:36%;"></div>
        </div>
        <span class="shimmer" style="height:20px;width:60px;border-radius:9999px;"></span>
      </div>
      <div class="list-item">
        <span class="shimmer avatar-sk"></span>
        <div class="main">
          <div class="shimmer sk-line" style="width:64%;margin-bottom:8px;"></div>
          <div class="shimmer sk-line" style="width:44%;"></div>
        </div>
        <span class="shimmer" style="height:20px;width:60px;border-radius:9999px;"></span>
      </div>
      <div class="list-item">
        <span class="shimmer avatar-sk"></span>
        <div class="main">
          <div class="shimmer sk-line" style="width:56%;margin-bottom:8px;"></div>
          <div class="shimmer sk-line" style="width:40%;"></div>
        </div>
        <span class="shimmer" style="height:20px;width:60px;border-radius:9999px;"></span>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
