sibling: docs
schema_version: "4.0"
feature_id: field-officer-dashboard
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - has_offline_cache

id: field-officer-dashboard
name: Field Officer Dashboard
description: >
  Read-only cross-group monitoring screen for field officers (and program managers). Shows
  aggregated KPIs across all groups managed by the logged-in staff member: 4 KPI summary cards
  (total groups, total active members, total savings this month, total loans outstanding) —
  each using MD3 container tokens (primaryContainer, secondaryContainer, tertiaryContainer,
  errorContainer). Provides a filterable groups list with health indicators per group based on
  overdueRate. Supports 3 filter chips: region, group status (active/inactive/pending), and
  overdue rate threshold (none / <10% / >10%). Export Report button navigates to
  /runreports/FieldOfficerGroupReport. Role-gated: canExport only for FIELD_OFFICER and
  PROGRAM_MANAGER. All data aggregated client-side from Fineract API responses. Read-only
  — no mutation actions.
feature: field-officer-view
flow: field-officer-flow
version: "1.1.0"
tags:
  - field-officer-view
  - admin
  - dashboard
  - read-only
  - FR-009

status: designed
quality_score: 92
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system
  - status: designed
    at: "2026-05-08T23:00:00Z"
    by: /idea export
  - from: enriched
    to: enriched
    at: "2026-05-05"
    by: "/idea enrich --flow all (re-enrich pass)"

entry_point: false
bottom_nav:
  visible: true
  selected_tab: dashboard

legacy_metadata:
  analytics:
    screen_viewed:
      event: field_officer_dashboard_viewed
      params:
        staff_id: Long
        user_role: String
    events:
      - name: field_officer_dashboard_loaded
        trigger: LoadDashboard action completes successfully (ScreenState → Content)
        params:
          group_count: Int
          total_members: Int
          total_savings: Double
          staff_id: Long
      - name: field_officer_filter_applied
        trigger: Any filter chip selection changes filteredGroups
        params:
          filter_type: "{ region | status | overdue_rate }"
          filter_value: String
          result_count: Int
      - name: field_officer_group_tapped
        trigger: User taps a group health card
        params:
          group_id: Long
          health_indicator: "{ GREEN | AMBER | RED }"
          overdue_rate: Double
          office_name: String
      - name: field_officer_export_requested
        trigger: User taps Export Report (canExport == true)
        params:
          group_count: Int
          staff_id: Long
      - name: field_officer_dashboard_refreshed
        trigger: Pull-to-refresh gesture completes
        params:
          group_count: Int
          staff_id: Long
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/field-officer-view/"
