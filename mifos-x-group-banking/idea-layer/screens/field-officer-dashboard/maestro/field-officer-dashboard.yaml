# ─────────────────────────────────────────────────────────────────────────────
# E2E — field-officer-dashboard : organizer-landing → Field-Officer tile → Content
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (GroupBankingNavHost §6a/§6b): field-officer-dashboard is registered
# and reachable ONLY via organizer-dashboard's optional Field-Officers quick-nav tile
# (organizer_dashboard_nav_field_officer_card), which is `visible_when fieldOfficerEnabled`
# (default false). The current login shell has NO staff-role landing branch, so this
# tile is the sole in-app affordance.
# Backend seed required: ORGANIZER account + companion response fieldOfficerEnabled=true
# so the tile renders. Without the flag the tile is hidden and this flow halts at the
# tap (a legitimate device-test signal of the data gap, NOT a fake).
# TestTag constants: FieldOfficerDashboardTestTags.kt + OrganizerDashboardTestTags.kt.
appId: org.mifos.groupbanking
name: e2e — field-officer-dashboard (organizer tile → content → group drill-down)
tags:
  - e2e
  - group-banking
  - field-officer-dashboard
env:
  ORGANIZER_USER: "organizer@demo.mifos"
  ORGANIZER_PASS: "Demo1234!"
---
# --- guaranteed prefix: fresh launch + login ---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: ${ORGANIZER_USER}
- tapOn:
    id: "login_signup_field_password"
- inputText: ${ORGANIZER_PASS}
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- organizer-dashboard landing (login routes ORGANIZER here) ---
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000

# --- sole reachable edge: Field-Officers tile (requires fieldOfficerEnabled=true) ---
- tapOn:
    id: "organizer_dashboard_nav_field_officer_card"

# --- state: Loading → Content ---
- extendedWaitUntil:
    visible:
      id: "field_officer_dashboard_screen"
    timeout: 20000
- assertVisible:
    id: "field_officer_dashboard_kpi_row"       # Content: 4-card KPI row
- assertVisible:
    id: "field_officer_dashboard_filter_row"    # Content: filter chip row
- assertVisible:
    id: "field_officer_dashboard_group_list"    # Content: group-health card list

# --- primary on_click: tap a group-health card → group-dashboard (read-only) ---
# card id = field_officer_dashboard_card_<groupId>; substring match taps the first seeded card.
- tapOn:
    id: "field_officer_dashboard_card_"
- assertVisible:
    id: "group_dashboard_screen"
