entries:
  - dto: GroupHealthSummary
    count_hint: 5
    source_notes: >
      Five groups distributed across Kisumu West and Kisumu East offices. Health indicators
      follow the api.yaml HealthIndicator rules (GREEN < 0.05, AMBER 0.05-0.20, RED >= 0.20).
      Mix of healthy, at-risk and critical groups gives a realistic portfolio view for the
      Content state. KES balances are in the 1,000-50,000 range typical for a small rural
      VSLA after one or two savings cycles. All rows carry status ACTIVE so they satisfy the
      default ACTIVE filter path.
    items:
      - id: 1
        fineractGroupId: 201
        name: "Mwangaza Women's Group"
        officeName: "Kisumu West"
        status: "ACTIVE"
        activeClientCount: 12
        totalSavingsBalance: 48000.00
        totalLoansOutstanding: 32000.00
        overdueRate: 0.02
        healthIndicator: "GREEN"
        cycleNumber: 1

      - id: 2
        fineractGroupId: 202
        name: "Tumaini Savings Group"
        officeName: "Kisumu West"
        status: "ACTIVE"
        activeClientCount: 8
        totalSavingsBalance: 21600.00
        totalLoansOutstanding: 15000.00
        overdueRate: 0.08
        healthIndicator: "AMBER"
        cycleNumber: 2

      - id: 3
        fineractGroupId: 203
        name: "Baraka Chama"
        officeName: "Kisumu East"
        status: "ACTIVE"
        activeClientCount: 15
        totalSavingsBalance: 63000.00
        totalLoansOutstanding: 42000.00
        overdueRate: 0.00
        healthIndicator: "GREEN"
        cycleNumber: 3

      - id: 4
        fineractGroupId: 204
        name: "Imara Savings Circle"
        officeName: "Kisumu East"
        status: "ACTIVE"
        activeClientCount: 10
        totalSavingsBalance: 18500.00
        totalLoansOutstanding: 22000.00
        overdueRate: 0.25
        healthIndicator: "RED"
        cycleNumber: 1

      - id: 5
        fineractGroupId: 205
        name: "Upendo Women's Group"
        officeName: "Kisumu West"
        status: "ACTIVE"
        activeClientCount: 9
        totalSavingsBalance: 27000.00
        totalLoansOutstanding: 18000.00
        overdueRate: 0.04
        healthIndicator: "GREEN"
        cycleNumber: 2

  - dto: Staff
    count_hint: 1
    source_notes: >
      Field officer David Otieno manages all five demo groups across the Kisumu offices.
      The staffId matches the session-source value threaded through the on_mount
      get_centers_for_staff and get_groups_for_staff query parameters.
    items:
      - id: 1001
        displayName: "David Otieno"
        officeId: 10
        officeName: "Kisumu West"

  - dto: FieldOfficerDashboardKPIs
    count_hint: 1
    source_notes: >
      Aggregated KPI values derived client-side from the GroupHealthSummary list per the
      on_mount notes in data-flow.yaml. totalGroupsCount = 5 (all GroupHealthSummary items).
      totalActiveMembers = sum of activeClientCount (12 + 8 + 15 + 10 + 9 = 54).
      totalSavingsThisMonth = sum of totalSavingsBalance (48,000 + 21,600 + 63,000 + 18,500 +
      27,000 = 178,100 KES). totalLoansOutstanding = sum of totalLoansOutstanding (32,000 +
      15,000 + 42,000 + 22,000 + 18,000 = 129,000 KES). availableRegions is the distinct set
      of officeName values from the GroupHealthSummary list. canExport is true because
      userRole is FIELD_OFFICER. These back the four KPI cards and the export action in the
      Content state.
    items:
      - staffId: 1001
        userRole: "FIELD_OFFICER"
        canExport: true
        totalGroupsCount: 5
        totalActiveMembers: 54
        totalSavingsThisMonth: 178100.00
        totalLoansOutstanding: 129000.00
        availableRegions:
          - "Kisumu West"
          - "Kisumu East"
        selectedRegionFilter: null
        selectedStatusFilter: null
        selectedOverdueFilter: null
        isExporting: false
        isRefreshing: false

  - dto: FileResponse
    count_hint: 1
    source_notes: >
      Stub FileResponse representing the CSV export returned by the Fineract
      runreports FieldOfficerGroupReport endpoint (api.yaml api_id run_report). Used to
      verify the OnExportReport action triggers the OS share sheet with a CSV MIME type via
      the NavigateToExportReport one-shot event.
    items:
      - mimeType: "text/csv"
        filename: "FieldOfficerGroupReport_1001.csv"
        sizeBytes: 2048
        note: "content field is ByteArray; stub for demo purposes"

