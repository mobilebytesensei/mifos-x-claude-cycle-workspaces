sibling: tests
schema_version: "4.0"
feature_id: field-officer-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-FOD-001
      scenario: "On mount, LoadDashboard fires centers and groups Fineract calls in parallel and screen shows Content on success"
      type: ViewModel
      priority: P0
      given: "staffId=12 resolved from session; userRole=FIELD_OFFICER; network online"
      when: "FieldOfficerDashboardScreen enters composition and LoadDashboard dispatches"
      then: "GroupRepository.getGroupsForStaff(12) and StaffRepository center fetch run concurrently; isLoading flips false; FieldOfficerDashboardScreenState=Content with 8 groups aggregated"

    - id: TC-FOD-002
      scenario: "KPI cards aggregate totalGroupsCount, totalActiveMembers, totalSavingsThisMonth, totalLoansOutstanding client-side"
      type: ViewModel
      priority: P0
      given: "5 GroupHealthSummary rows loaded with activeClientCount and balances per demo_data"
      when: "aggregation completes after load"
      then: "totalGroupsCount=8, totalActiveMembers summed from activeClientCount, totalSavingsThisMonth=142000.0, totalLoansOutstanding=87500.0 exposed in state"

    - id: TC-FOD-003
      scenario: "Four KPI cards render with distinct MD3 container tokens and bound values"
      type: Screen
      priority: P0
      given: "Content state with the four KPI totals populated"
      when: "KPICardsRow renders"
      then: "KPITotalGroups uses primaryContainer, KPITotalMembers secondaryContainer, KPITotalSavings tertiaryContainer, KPILoansOutstanding errorContainer; each shows its bound headline value"

    - id: TC-FOD-004
      scenario: "Group health card renders name, officeName·cycle, and health badge with GREEN/AMBER/RED mapping"
      type: Screen
      priority: P0
      given: "filteredGroups includes GREEN (overdueRate 0.00), AMBER (0.12), RED (0.25) rows"
      when: "GroupHealthCard list renders"
      then: "GREEN badge shows 'Healthy' primaryContainer, AMBER 'At Risk' warningContainer, RED 'Critical' errorContainer; officeName and 'Cycle N' subtitle present per card"

    - id: TC-FOD-005
      scenario: "Tapping a group health card navigates to group-dashboard with the tapped groupId (read-only supervisory mode)"
      type: Screen
      priority: P0
      given: "group id=3 (Umoja Welfare Group) card rendered in Content"
      when: "OnGroupTapped fires from the card tap"
      then: "NavController navigates to group-dashboard with groupId=3; navigate effect asserted, no mutation on target"

    - id: TC-FOD-006
      scenario: "Region filter chip opens region picker and filters groups client-side by officeName without an API call"
      type: ViewModel
      priority: P1
      given: "8 groups across offices 'Nairobi East','Nairobi West','Nairobi North'"
      when: "ShowRegionPickerDialog then OnRegionFilterSelected('Nairobi East')"
      then: "filteredGroups contains only officeName=='Nairobi East' rows (ids 1,3); zero network calls; selectedRegionFilter=='Nairobi East'"

    - id: TC-FOD-007
      scenario: "Status filter chip filters groups by status without an API call"
      type: ViewModel
      priority: P1
      given: "groups all ACTIVE plus a PENDING row injected"
      when: "OnStatusFilterSelected(ACTIVE)"
      then: "filteredGroups contains only status=='ACTIVE' rows; selectedStatusFilter=ACTIVE; no network call"

    - id: TC-FOD-008
      scenario: "Overdue filter NONE shows only groups with overdueRate == 0.0"
      type: ViewModel
      priority: P1
      given: "groups with overdueRate 0.00, 0.12, 0.25, 0.03, 0.08"
      when: "OnOverdueFilterSelected(NONE)"
      then: "filteredGroups contains only the overdueRate==0.00 row (id 1); others excluded"

    - id: TC-FOD-009
      scenario: "Overdue filter GREATER_THAN_10 shows only groups with overdueRate >= 0.10"
      type: ViewModel
      priority: P1
      given: "groups with overdueRate 0.00, 0.12, 0.25, 0.03, 0.08"
      when: "OnOverdueFilterSelected(GREATER_THAN_10)"
      then: "filteredGroups contains only ids 2 (0.12) and 3 (0.25); LESS_THAN_10 rows excluded"

    - id: TC-FOD-010
      scenario: "Clear Filters chip resets all filter selections and restores the full group list"
      type: ViewModel
      priority: P1
      given: "selectedRegionFilter, selectedStatusFilter and selectedOverdueFilter all non-null with filteredGroups reduced"
      when: "OnClearFilters fires"
      then: "all three filter fields reset to null; filteredGroups equals full groups list (8 rows); transform_state effect, no network call"

    - id: TC-FOD-011
      scenario: "Clear Filters chip is visible only when at least one filter is active"
      type: Screen
      priority: P2
      given: "Content state"
      when: "no filter is selected vs one filter selected"
      then: "clear_filters_chip hidden when all filters null; visible when selectedRegionFilter||selectedStatusFilter||selectedOverdueFilter is non-null"

    - id: TC-FOD-012
      scenario: "Export action visible and enabled only for FIELD_OFFICER and PROGRAM_MANAGER (canExport gate)"
      type: Screen
      priority: P1
      given: "userRole=FIELD_OFFICER (canExport=true) vs an unauthorized role (canExport=false)"
      when: "FieldOfficerTopBar renders"
      then: "export_action visible when canExport==true; hidden when canExport==false"

    - id: TC-FOD-013
      scenario: "OnExportReport calls Fineract runreports FieldOfficerGroupReport and hands CSV to the OS share sheet"
      type: ViewModel
      priority: P1
      given: "canExport=true, staffId=12"
      when: "OnExportReport fires and runreports returns a CSV"
      then: "ReportRepository runreports FieldOfficerGroupReport called with staffId=12; call_api effect asserted; resulting CSV dispatched to system share sheet; isExporting toggles true then false"

    - id: TC-FOD-014
      scenario: "Export report surfaces a snackbar error on 403 or 500 response"
      type: ViewModel
      priority: P1
      given: "canExport=true"
      when: "OnExportReport and runreports returns 403 (or 500)"
      then: "ShowSnackbar emitted with export_error message; isExporting reset to false; no share sheet launched"

    - id: TC-FOD-015
      scenario: "Auth 401/expired session redirects to login"
      type: ViewModel
      priority: P0
      given: "session token expired"
      when: "LoadDashboard receives 401"
      then: "FieldOfficerDashboardError type=Auth (retry=false, redirect=login) set; navigation to login triggered"

    - id: TC-FOD-016
      scenario: "Error state renders with retry and OnRetry re-runs the parallel load invalidating cache"
      type: ViewModel
      priority: P1
      given: "network error on first LoadDashboard, error!=null, isLoading false"
      when: "DashboardErrorState shown and OnRetry fires"
      then: "SQLDelight cache invalidated; centers+groups Fineract calls re-dispatched over cmp-network-monitor; call_api effect asserted; on success Content restored"

    - id: TC-FOD-017
      scenario: "Offline with cached data shows cached groups with stale-while-revalidate banner"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor reports offline; SQLDelight cache holds groups within 300s TTL"
      when: "LoadDashboard runs"
      then: "cached GroupHealthSummary rows rendered; offline/stale banner shown; no hard error state"

    - id: TC-FOD-018
      scenario: "Loading state shows dashboard shimmer skeleton while parallel fetch is in flight"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "screen is in loading state"
      then: "DashboardShimmer (count 6) visible with top_bar; KPI cards and group list not yet rendered"

    - id: TC-FOD-019
      scenario: "Empty state renders when no groups are assigned to the field officer"
      type: Screen
      priority: P2
      given: "load succeeds with groups.isEmpty() and error==null"
      when: "Content evaluation runs"
      then: "NoGroupsEmptyState visible with 'No Groups Assigned' title; KPI row and card list hidden"

    - id: TC-FOD-020
      scenario: "Empty-filter state renders with Clear Filters CTA when groups exist but filteredGroups is empty"
      type: Screen
      priority: P2
      given: "groups non-empty but active filters exclude every row"
      when: "filteredGroups.isEmpty() while groups.isNotEmpty()"
      then: "NoFilterResultsState shown; tapping its Clear Filters CTA fires OnClearFilters (transform_state) restoring full list"

    - id: TC-FOD-021
      scenario: "Pull-to-refresh (OnRefresh) invalidates cache and re-aggregates KPIs without a full-screen shimmer"
      type: ViewModel
      priority: P1
      given: "Content state loaded, isRefreshing=false"
      when: "OnRefresh triggered by pull-to-refresh"
      then: "isRefreshing toggles true; SQLDelight cache invalidated; groups re-fetched and KPIs re-aggregated; isRefreshing back to false; Content preserved"

    - id: TC-FOD-022
      scenario: "GroupRepository.getGroupsForStaff serves the SQLDelight cache for 300 seconds"
      type: Repository
      priority: P1
      given: "getGroupsForStaff(12) called and response cached"
      when: "a second call within 300s TTL"
      then: "cached rows returned without a new Fineract HTTP call; a call after TTL expiry re-fetches"
