sibling: tests
schema_version: "4.0"
feature_id: field-officer-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-FOD-001
      scenario: "On mount, centers and groups APIs fire in parallel and screen shows Content state on success"
      type: ViewModel
      priority: P0

    - id: TC-FOD-002
      scenario: "KPI bar shows correct totalGroupsCount and totalActiveMembers aggregated from API response"
      type: ViewModel
      priority: P0

    - id: TC-FOD-003
      scenario: "Group cards render with correct name, officeName, activeClientCount, and healthIndicator badge"
      type: Screen
      priority: P0

    - id: TC-FOD-004
      scenario: "GREEN health indicator renders with green badge, AMBER with amber, RED with red"
      type: Screen
      priority: P0

    - id: TC-FOD-005
      scenario: "Tapping a group card navigates to group-dashboard with correct groupId"
      type: Screen
      priority: P0

    - id: TC-FOD-006
      scenario: "Region filter chip filters groups client-side by officeName without API call"
      type: ViewModel
      priority: P1

    - id: TC-FOD-007
      scenario: "Status filter chip filters groups by status value without API call"
      type: ViewModel
      priority: P1

    - id: TC-FOD-008
      scenario: "Overdue filter NONE shows only groups with overdueRate == 0.0"
      type: ViewModel
      priority: P1

    - id: TC-FOD-009
      scenario: "Clear filters resets all filter chips and shows full group list"
      type: ViewModel
      priority: P1

    - id: TC-FOD-010
      scenario: "Export report button is visible only for FIELD_OFFICER and PROGRAM_MANAGER roles"
      type: Screen
      priority: P1

    - id: TC-FOD-011
      scenario: "Export report calls run_report API and launches system share sheet on success"
      type: ViewModel
      priority: P1

    - id: TC-FOD-012
      scenario: "Export report shows snackbar with error message on 403 or 500 response"
      type: ViewModel
      priority: P1

    - id: TC-FOD-013
      scenario: "When 401, ViewModel navigates to login screen"
      type: ViewModel
      priority: P0

    - id: TC-FOD-014
      scenario: "When offline with cached data, screen shows cached groups with offline banner"
      type: ViewModel
      priority: P1

    - id: TC-FOD-015
      scenario: "Pull-to-refresh invalidates cache and re-aggregates KPIs"
      type: ViewModel
      priority: P1

    - id: TC-FOD-016
      scenario: "GroupRepository.getGroupsForStaff caches response for 300 seconds"
      type: Repository
      priority: P1

    - id: TC-FOD-017
      scenario: "Empty state renders when no groups are assigned to the staff member"
      type: Screen
      priority: P2

    - id: TC-FOD-018
      scenario: "overdueRate GREATER_THAN_10 filter shows only groups with overdueRate >= 0.10"
      type: ViewModel
      priority: P1
