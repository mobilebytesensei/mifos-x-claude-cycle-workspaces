requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: field-officer-dashboard

route: /field-officer/dashboard
entry_points:
  - source: app_launch
    condition: "userRole == FIELD_OFFICER"
  - source: app_launch
    condition: "userRole == PROGRAM_MANAGER"
  - source: bottom_nav
    condition: "userRole == FIELD_OFFICER || userRole == PROGRAM_MANAGER"
nav_params:
  staffId: { type: Long, required: false, source: session }

screens:
  - id: field_officer_dashboard_screen
    name: FieldOfficerDashboardScreen
    composable: FieldOfficerDashboardScreen
    description: >
      Scrollable LazyColumn with sticky top bar, pull-to-refresh. Top section:
      4-card KPI row (horizontal scroll). Second section: filter chip row (3 chips + clear).
      Body: group count header + group health card list. Empty state when no groups.
      Error state with retry on load failure. All interactions read-only.
    layout: >
      Scaffold (TopAppBar + LazyColumn(
        item: KPICardsRow,
        item: FilterChipRow,
        item: GroupsListHeader,
        items: GroupHealthCard per filteredGroups,
        item: EmptyState or ErrorState conditional
      ))

state_model:
  FieldOfficerDashboardViewModel:
    state:
      name: FieldOfficerDashboardState
      fields:
        isLoading: { type: Boolean, default: "true" }
        isRefreshing: { type: Boolean, default: "false" }
        staffId: { type: Long, default: "0L" }
        userRole: { type: String, default: '""' }
        canExport: { type: Boolean, default: "false", note: "true when userRole == FIELD_OFFICER || userRole == PROGRAM_MANAGER" }
        totalGroupsCount: { type: Int, default: "0" }
        totalActiveMembers: { type: Int, default: "0" }
        totalSavingsThisMonth: { type: Double, default: "0.0" }
        totalLoansOutstanding: { type: Double, default: "0.0" }
        groups: { type: "List<GroupHealthSummary>", default: "emptyList()" }
        filteredGroups: { type: "List<GroupHealthSummary>", default: "emptyList()" }
        availableRegions: { type: "List<String>", default: "emptyList()" }
        selectedRegionFilter: { type: "String?", default: "null" }
        selectedStatusFilter: { type: "GroupStatusFilter?", default: "null" }
        selectedOverdueFilter: { type: "OverdueRateFilter?", default: "null" }
        isExporting: { type: Boolean, default: "false" }
        error: { type: "FieldOfficerDashboardError?", default: "null" }
    screen_state:
      name: FieldOfficerDashboardScreenState
      members:
        - Loading: fetching and aggregating groups KPIs
        - Content: data loaded; KPI cards and group list shown
        - Empty: no groups assigned to this field officer
        - Error: API failure during load; retry available
    errors:
      name: FieldOfficerDashboardError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
        - { type: NoGroupsAssigned, retry: false, message_key: error_no_groups }
    events:
      name: FieldOfficerDashboardEvent
      members:
        - { name: NavigateToGroupDashboard, params: "groupId: Long" }
        - { name: NavigateToExportReport, params: "staffId: Long" }
        - { name: ShowSnackbar, params: "message: String" }
        - { name: ShowRegionPickerDialog }
        - { name: ShowStatusPickerDialog }
        - { name: ShowOverduePickerDialog }
    actions:
      name: FieldOfficerDashboardAction
      members:
        - { name: LoadDashboard, trigger: "Screen enters composition" }
        - { name: OnGroupTapped, params: "groupId: Long", trigger: "Tap group health card" }
        - { name: OnRegionFilterSelected, params: "region: String?", trigger: "Select region in picker dialog" }
        - { name: OnStatusFilterSelected, params: "status: GroupStatusFilter?", trigger: "Select status in picker dialog" }
        - { name: OnOverdueFilterSelected, params: "filter: OverdueRateFilter?", trigger: "Select overdue threshold in picker dialog" }
        - { name: OnClearFilters, trigger: "Tap Clear Filters chip" }
        - { name: OnExportReport, trigger: "Tap Export Report in top bar; canExport must be true" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
        - { name: OnRetry, trigger: "Tap retry button on error state" }
    di:
      - GroupRepository
      - StaffRepository
      - ReportRepository
      - NetworkMonitor
      - SessionManager

business_logic:
  kind: crud
  description: "Read-only cross-group monitoring dashboard for MFI field officers (FR-009). Fetches groups for the logged-in staff from the Fineract REST API, aggregates KPIs client-side (groups, members, savings, loans) and derives per-group overdueRate health indicators. Offline reads served by a SQLDelight cache (TTL 300s); cmp-network-monitor gates stale-while-revalidate banners."
  library_refs:
    - cmp-network-monitor
  external_library_refs:
    - Fineract REST API
    - SQLDelight
  description_hash: "ca93e9f889adbfdaf5401709da45fb113d2aa4e592784a66e188019a7bc5ba99"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_bar
    type: top-app-bar
    name: FieldOfficerTopBar
    description: >
      Top bar showing "Field Officer Dashboard" title. Export Report action in the overflow menu
      or toolbar (visible and enabled only when canExport == true). Export shows loading spinner
      while isExporting == true.
    style:
      title_text: "{strings.screen_title}"
      background: primary   # i18n: skip
      text_color: onPrimary   # i18n: skip
    actions:
      - id: export_action
        icon: FluentIcons.arrow_download_24_regular   # i18n: skip
        content_description: "{strings.content_desc_export}"
        visible_when: "canExport == true"   # i18n: skip
        loading_when: "isExporting"
        on_click:
          action: OnExportReport
          action_contract:
            effect: call_api
            library_refs: ["cmp-network-monitor"]
            external_library_refs: ["Fineract runreports API"]
            description: "Calls the Fineract runreports FieldOfficerGroupReport endpoint over cmp-network-monitor-gated HTTP to generate a CSV of all managed groups and KPIs; role-gated to FIELD_OFFICER and PROGRAM_MANAGER; result CSV is handed to the OS share sheet."
            action_contract_hash: "19aad56fcbd4aae02a367dc2775133fbf2c2c7629eaf735c8d610c77568aa556"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
    a11y:
      content_description: "Field Officer Dashboard — monitoring {{totalGroupsCount}} groups"   # i18n: skip (dynamic format string; localized via a11y layer)
      role: toolbar   # i18n: skip
    test_context:
      purpose: >
        Export button visible for FIELD_OFFICER and PROGRAM_MANAGER; hidden for other roles;
        shows loading spinner during report generation
      interaction_type: tap
      data_driven: true
      required_fields: [canExport, isExporting, totalGroupsCount]

  - id: kpi_cards_row
    type: row
    name: KPICardsRow
    description: >
      Horizontally scrollable row of 4 KPI summary cards. Each card uses a distinct
      MD3 container color token: primaryContainer, secondaryContainer, tertiaryContainer,
      errorContainer. Cards are non-interactive.
    style:
      scroll: horizontal
      padding: "16dp"
      gap: 12dp
    a11y:
      content_description: "KPI summary cards — {{totalGroupsCount}} groups, {{totalActiveMembers}} members, KES {{totalSavingsThisMonth}} savings, KES {{totalLoansOutstanding}} loans"   # i18n: skip (dynamic format string; localized via a11y layer)
    test_context:
      purpose: Four KPI cards visible; each uses correct MD3 container token; values update on load
      interaction_type: non_interactive
      data_driven: true
      required_fields: [totalGroupsCount, totalActiveMembers, totalSavingsThisMonth, totalLoansOutstanding]
    children:
      - id: kpi_total_groups
        type: kpi_card
        name: KPITotalGroups
        style:
          background: primaryContainer
          corner_radius: 12dp
          padding: 16dp
          min_width: 140dp
          min_height: 88dp
        content:
          - { id: kpi_groups_value, type: text, text: "{{totalGroupsCount}}", text_style: headlineMedium, color: onPrimaryContainer, font_weight: bold, i18n: skip }   # numeric interpolation only
          - { id: kpi_groups_label, type: text, text: "{strings.kpi_groups}", text_style: bodySmall, color: onPrimaryContainer, margin_top: 4dp }
          - { id: kpi_groups_icon, type: icon, icon: FluentIcons.people_24_regular, color: onPrimaryContainer, size: 20dp, i18n: skip }

      - id: kpi_total_members
        type: kpi_card
        name: KPITotalMembers
        style:
          background: secondaryContainer
          corner_radius: 12dp
          padding: 16dp
          min_width: 140dp
          min_height: 88dp
        content:
          - { id: kpi_members_value, type: text, text: "{{totalActiveMembers}}", text_style: headlineMedium, color: onSecondaryContainer, font_weight: bold, i18n: skip }   # numeric interpolation only
          - { id: kpi_members_label, type: text, text: "{strings.kpi_members}", text_style: bodySmall, color: onSecondaryContainer, margin_top: 4dp }
          - { id: kpi_members_icon, type: icon, icon: FluentIcons.person_24_regular, color: onSecondaryContainer, size: 20dp, i18n: skip }

      - id: kpi_total_savings
        type: kpi_card
        name: KPITotalSavings
        style:
          background: tertiaryContainer
          corner_radius: 12dp
          padding: 16dp
          min_width: 156dp
          min_height: 88dp
        content:
          - { id: kpi_savings_value, type: text, text: "KES {{totalSavingsThisMonth | compact}}", text_style: headlineMedium, color: onTertiaryContainer, font_weight: bold, i18n: skip }   # currency code + numeric format
          - { id: kpi_savings_label, type: text, text: "{strings.kpi_savings}", text_style: bodySmall, color: onTertiaryContainer, margin_top: 4dp }
          - { id: kpi_savings_icon, type: icon, icon: FluentIcons.piggy_bank_24_regular, color: onTertiaryContainer, size: 20dp, i18n: skip }

      - id: kpi_loans_outstanding
        type: kpi_card
        name: KPILoansOutstanding
        style:
          background: errorContainer
          corner_radius: 12dp
          padding: 16dp
          min_width: 156dp
          min_height: 88dp
        content:
          - { id: kpi_loans_value, type: text, text: "KES {{totalLoansOutstanding | compact}}", text_style: headlineMedium, color: onErrorContainer, font_weight: bold, i18n: skip }   # currency code + numeric format
          - { id: kpi_loans_label, type: text, text: "{strings.kpi_loans}", text_style: bodySmall, color: onErrorContainer, margin_top: 4dp }
          - { id: kpi_loans_icon, type: icon, icon: FluentIcons.money_24_regular, color: onErrorContainer, size: 20dp, i18n: skip }

  - id: filter_row
    type: row
    name: FilterChipRow
    style: { scroll: horizontal, padding: "0dp 16dp 8dp", gap: 8dp }
    children:
      - id: region_filter_chip
        type: filter_chip
        label: "{{selectedRegionFilter != null ? selectedRegionFilter : strings.filter_all_regions}}"
        icon: FluentIcons.location_24_regular   # i18n: skip
        selected_when: "selectedRegionFilter != null"   # i18n: skip
        on_click:
          action: ShowRegionPickerDialog
          action_contract:
            effect: emit_event
            description: "Emits a ShowRegionPickerDialog one-shot event so the UI opens a region picker built from the client-derived availableRegions list; pure read-only filter selection, no persistence or network call."
            action_contract_hash: "cea28eadb59b6b6ae0297d5e1cad8d2ea8680d600104b0a0f27d2b2356fcbf7e"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

      - id: status_filter_chip
        type: filter_chip
        label: "{{selectedStatusFilter != null ? selectedStatusFilter.name : strings.filter_all_statuses}}"
        icon: FluentIcons.filter_24_regular   # i18n: skip
        selected_when: "selectedStatusFilter != null"   # i18n: skip
        on_click:
          action: ShowStatusPickerDialog
          action_contract:
            effect: emit_event
            description: "Emits a ShowStatusPickerDialog one-shot event so the UI opens a group-status picker (ACTIVE, PENDING, CLOSED); pure read-only filter selection, no persistence or network call."
            action_contract_hash: "0712115ad07af4d2941ac61c49b2c732ed32fd4e7a158969e34dc56aa88c05f5"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

      - id: overdue_filter_chip
        type: filter_chip
        label: "{{selectedOverdueFilter != null ? strings.overdue_labels[selectedOverdueFilter] : strings.filter_overdue_any}}"
        icon: FluentIcons.warning_24_regular   # i18n: skip
        selected_when: "selectedOverdueFilter != null"   # i18n: skip
        on_click:
          action: ShowOverduePickerDialog
          action_contract:
            effect: emit_event
            description: "Emits a ShowOverduePickerDialog one-shot event so the UI opens an overdue-rate threshold picker (none, under 10 percent, over 10 percent); pure read-only filter selection, no network call."
            action_contract_hash: "dc8e56dacf1729f868ce73aeaa2a1acf54b6f838d1de87e4781dacfa2b048b8c"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

      - id: clear_filters_chip
        type: chip
        label: "{strings.filter_clear}"
        icon: FluentIcons.dismiss_16_regular   # i18n: skip
        visible_when: "selectedRegionFilter != null || selectedStatusFilter != null || selectedOverdueFilter != null"   # i18n: skip
        style: { background: errorContainer, text_color: onErrorContainer }   # i18n: skip
        on_click:
          action: OnClearFilters
          action_contract:
            effect: transform_state
            description: "Resets selectedRegionFilter, selectedStatusFilter and selectedOverdueFilter to null and restores filteredGroups to the full groups list; a pure ViewModel state transition with no persistence or network call."
            action_contract_hash: "6a52dd4221b65aeb82555d5430fcfdecdcafbe29e2010a84c78bf70a533d2c8e"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: groups_list_header
    type: row
    name: GroupsListHeader
    style: { padding: "0dp 16dp 4dp" }
    content:
      - id: group_count_text
        type: text
        text: "{strings.groups_count_label|filtered={{filteredGroups.size}},total={{groups.size}}}"
        text_style: titleSmall   # i18n: skip
        color: onSurfaceVariant   # i18n: skip

  - id: group_health_card
    type: card
    name: GroupHealthCard
    repeats_for: filteredGroups
    style:
      background: surface
      elevation: 2dp
      corner_radius: 12dp
      padding: 16dp
      min_touch_target: 72dp
      margin: "0dp 16dp 8dp"
    content:
      - { id: group_name_text, type: text, text: "{{group.name}}", text_style: titleMedium, color: onSurface, i18n: skip }   # dynamic API-sourced group name (localized upstream)
      - { id: group_office_text, type: text, text: "{{group.officeName}} · Cycle {{group.cycleNumber}}", text_style: bodySmall, color: onSurfaceVariant, margin_top: 2dp, i18n: skip }   # dynamic API-sourced office + numeric cycle
      - id: group_health_badge
        type: badge
        value: "{{group.healthIndicator}}"   # i18n: skip (enum value)
        style:
          GREEN: { background: primaryContainer, text_color: onPrimaryContainer, text: "{strings.health_green}" }
          AMBER: { background: warningContainer, text_color: onWarningContainer, text: "{strings.health_amber}" }
          RED: { background: errorContainer, text_color: onErrorContainer, text: "{strings.health_red}" }
        margin_top: 8dp   # i18n: skip
    on_click:
      action: OnGroupTapped
      params: { groupId: "{{group.id}}" }
      target: group-dashboard
      action_contract:
        effect: navigate
        description: "Navigates via NavController to the group-dashboard screen with the tapped groupId; the field officer opens the group in read-only supervisory mode and cannot perform mutations there."
        action_contract_hash: "018fe236d5034cb76f0ab22adf2817845fb26eb732d109609b435c237c70b84a"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: shimmer_dashboard
    type: shimmer
    name: DashboardShimmer
    visible_when: isLoading
    style: { count: 6, height: 100dp, corner_radius: 12dp, background: surfaceVariant, margin: "0dp 16dp 8dp" }

  - id: empty_state
    type: empty_state
    name: NoGroupsEmptyState
    visible_when: "!isLoading && groups.isEmpty() && error == null"   # i18n: skip
    style:
      icon: FluentIcons.people_24_regular   # i18n: skip
      title_text: "{strings.empty_title}"
      body_text: "{strings.empty_body}"

  - id: empty_filter_state
    type: empty_state
    name: NoFilterResultsState
    visible_when: "!isLoading && groups.isNotEmpty() && filteredGroups.isEmpty()"   # i18n: skip
    style:
      icon: FluentIcons.filter_dismiss_24_regular   # i18n: skip
      title_text: "{strings.empty_filter_title}"
      body_text: "{strings.empty_filter_body}"
      cta_text: "{strings.clear_filters}"
    on_click:
      action: OnClearFilters
      action_contract:
        effect: transform_state
        description: "Resets all active filter selections to null and restores filteredGroups to the full groups list from the empty-filter-results state; a pure ViewModel state transition with no network call."
        action_contract_hash: "1027605879c16a4bbe0275d630a81e0611a89051c2147a01ac388a92cc896914"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: error_state
    type: error_state
    name: DashboardErrorState
    visible_when: "error != null && !isLoading"   # i18n: skip
    style:
      icon: FluentIcons.wifi_off_24_regular   # i18n: skip
      title_text: "{strings.error_load_title}"
      body_text: "{{error.message}}"   # i18n: skip (dynamic — message resolved via error.message_key upstream)
      cta_text: "{strings.cta_retry}"
    on_click:
      action: OnRetry
      action_contract:
        effect: call_api
        library_refs: ["cmp-network-monitor"]
        external_library_refs: ["Fineract REST API"]
        description: "Re-runs the groups Fineract API load over cmp-network-monitor-observed HTTP, invalidating the SQLDelight cache and re-aggregating KPIs to recover from a load error."
        action_contract_hash: "e03f6ec386f60d65af01eb13ed66193a569133e6d7b6062e796bacf0274b369d"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: loading
  loading:
    description: Fetching groups from Fineract API. Shimmer skeleton shown.
    components_visible: [top_bar, shimmer_dashboard]

  content:
    description: Dashboard loaded. 4 KPI cards, 3 filter chips, and group health card list visible.
    components_visible: [top_bar, kpi_cards_row, filter_row, groups_list_header, group_health_card]
    demo_data:
      staffId: 12
      userRole: FIELD_OFFICER
      canExport: true
      totalGroupsCount: 8
      totalActiveMembers: 94
      totalSavingsThisMonth: 142000.0
      totalLoansOutstanding: 87500.0
      selectedRegionFilter: null
      selectedStatusFilter: null
      selectedOverdueFilter: null
      groups:
        - { id: 1, name: "Mwangaza Women's Group", officeName: "Nairobi East", status: "ACTIVE", activeClientCount: 12, totalSavingsBalance: 24000.0, totalLoansOutstanding: 9000.0, overdueRate: 0.00, healthIndicator: GREEN, cycleNumber: 1 }
        - { id: 2, name: "Tumaini Savings Circle", officeName: "Nairobi West", status: "ACTIVE", activeClientCount: 10, totalSavingsBalance: 18500.0, totalLoansOutstanding: 12000.0, overdueRate: 0.12, healthIndicator: AMBER, cycleNumber: 3 }
        - { id: 3, name: "Umoja Welfare Group", officeName: "Nairobi East", status: "ACTIVE", activeClientCount: 8, totalSavingsBalance: 11200.0, totalLoansOutstanding: 9800.0, overdueRate: 0.25, healthIndicator: RED, cycleNumber: 2 }
        - { id: 4, name: "Pamoja Savings Group", officeName: "Nairobi North", status: "ACTIVE", activeClientCount: 11, totalSavingsBalance: 19800.0, totalLoansOutstanding: 14500.0, overdueRate: 0.03, healthIndicator: GREEN, cycleNumber: 4 }
        - { id: 5, name: "Maisha Bora Circle", officeName: "Nairobi West", status: "ACTIVE", activeClientCount: 9, totalSavingsBalance: 15600.0, totalLoansOutstanding: 8200.0, overdueRate: 0.08, healthIndicator: AMBER, cycleNumber: 2 }

  empty:
    description: No groups assigned to this field officer. Empty state shown.
    components_visible: [top_bar, empty_state]

  error:
    description: API failed during load. Error state shown with retry CTA.
    components_visible: [top_bar, error_state]

