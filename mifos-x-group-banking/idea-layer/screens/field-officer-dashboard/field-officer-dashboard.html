<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Officer Dashboard — CommonPurse Prototype</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans','system-ui','sans-serif']}}}};</script>
<style>
body{font-family:'Noto Sans',system-ui,sans-serif;background:#0F0F23;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer-row{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
body.embedded{background:#FAFAFA;margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;}
.kpi-card{padding:16px;border-radius:12px;min-width:140px;flex-shrink:0;}
.health-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;}
</style>
</head>
<body class="min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Field Officer Dashboard — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="loading">Loading</option>
    <option value="content" selected>Content</option>
    <option value="filtered">Filtered (GREEN only)</option>
    <option value="empty">Empty</option>
    <option value="error">Error</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 border border-white/10 rounded-md">🌙</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-8">
  <div class="phone bg-[#FAFAFA] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-[#2E7D32]">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-sm text-white">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-[#FAFAFA]" style="height:720px"></div>
    <div id="bottom-nav" class="bg-white border-t border-slate-100"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<div id="embedded-content" style="display:none" class="flex flex-col h-full">
  <div class="flex items-center justify-between px-6 py-2 bg-[#2E7D32] shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-white">wifi</span>
      <span class="material-symbols-outlined text-sm text-white">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-[#FAFAFA] flex-1"></div>
  <div id="embedded-bottom-nav" class="bg-white border-t border-slate-100 shrink-0"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2"></div>

<script>
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
if(isEmbedded){document.body.style.background='#FAFAFA';document.body.classList.add('embedded');}
function getEl(){return isEmbedded?document.getElementById('embedded-screen-content'):document.getElementById('screen-content');}
function getNavEl(){return isEmbedded?document.getElementById('embedded-bottom-nav'):document.getElementById('bottom-nav');}

// CommonPurse real data: 4 groups assigned to field officer
var allGroups=[
  {
    id:1,name:"Mwangaza Women's Group",office:'Nairobi East',status:'ACTIVE',
    members:6,savings:52400,loans:15000,overdueRate:0.00,health:'GREEN',cycle:3
  },
  {
    id:2,name:"Umoja Savings Circle",office:'Nairobi West',status:'ACTIVE',
    members:8,savings:38600,loans:22000,overdueRate:0.12,health:'AMBER',cycle:2
  },
  {
    id:3,name:"Pamoja Women's Group",office:'Nairobi North',status:'ACTIVE',
    members:7,savings:29800,loans:11000,overdueRate:0.03,health:'GREEN',cycle:1
  },
  {
    id:4,name:"Kilimo Savings Group",office:'Nairobi South',status:'ACTIVE',
    members:5,savings:18200,loans:14500,overdueRate:0.26,health:'RED',cycle:4
  },
];

var kpis={
  groups:4,
  members:allGroups.reduce((a,g)=>a+g.members,0),
  savingsThisMonth:38600,
  overdueLoans:2,
  syncAlerts:1
};

function topBar(){
  return `<div class="flex items-center gap-3 px-4 py-3 bg-[#2E7D32]">
    <span class="flex-1 text-base font-bold text-white leading-tight">Field Officer Dashboard</span>
    <button onclick="showToast('Exporting report...')" class="flex items-center gap-1 px-3 py-1.5 rounded-full bg-white/20 text-white text-xs font-semibold">
      <span class="material-symbols-outlined text-base">download</span>Export
    </button>
  </div>`;
}

function kpiGrid(){
  return `<div class="grid grid-cols-2 gap-3 px-4 py-3">
    <div class="kpi-card" style="background:#A6F1A6">
      <div class="text-3xl font-black" style="color:#1B5E20">${kpis.groups}</div>
      <div class="text-xs font-semibold mt-1" style="color:#1B5E20">Total Groups</div>
      <span class="material-symbols-outlined text-lg mt-2" style="color:#2E7D32">group</span>
    </div>
    <div class="kpi-card" style="background:#FFDDB3">
      <div class="text-3xl font-black" style="color:#E65100">${kpis.members}</div>
      <div class="text-xs font-semibold mt-1" style="color:#E65100">Active Members</div>
      <span class="material-symbols-outlined text-lg mt-2" style="color:#FF8F00">person</span>
    </div>
    <div class="kpi-card" style="background:#FFCDD2">
      <div class="text-3xl font-black" style="color:#B71C1C">${kpis.overdueLoans}</div>
      <div class="text-xs font-semibold mt-1" style="color:#B71C1C">Overdue Loans</div>
      <span class="material-symbols-outlined text-lg mt-2" style="color:#D32F2F">warning</span>
    </div>
    <div class="kpi-card" style="background:#E1F5FE">
      <div class="text-3xl font-black" style="color:#0D47A1">${kpis.syncAlerts}</div>
      <div class="text-xs font-semibold mt-1" style="color:#0D47A1">Sync Alerts</div>
      <span class="material-symbols-outlined text-lg mt-2" style="color:#1565C0">sync_problem</span>
    </div>
  </div>`;
}

function filterRow(filtered){
  var chips=[
    {label:'All Regions',icon:'location_on',active:!filtered},
    {label:'All Statuses',icon:'filter_list',active:false},
    {label:'Any Overdue',icon:'warning',active:false},
    filtered?{label:'Clear Filters',icon:'close',active:true,clear:true}:null,
  ].filter(Boolean);
  return `<div class="flex gap-2 px-4 pb-2 overflow-x-auto">
    ${chips.map(c=>`<span class="flex items-center gap-1 px-3 py-1.5 rounded-full text-xs border whitespace-nowrap cursor-pointer ${c.clear?'bg-[#FFCDD2] border-[#D32F2F] text-[#B71C1C]':c.active?'bg-[#A6F1A6] border-[#2E7D32] text-[#1B5E20]':'border-slate-300 text-slate-600 hover:border-[#2E7D32]'}" onclick="${c.clear?'switchState(\'content\')':'showToast(\'Filter: '+c.label+'\')'}">
      <span class="material-symbols-outlined text-base">${c.icon}</span>${c.label}
    </span>`).join('')}
  </div>`;
}

var healthConfig={
  GREEN:{dot:'#2E7D32',badge:'bg-[#A6F1A6] text-[#1B5E20]',label:'Healthy'},
  AMBER:{dot:'#FF8F00',badge:'bg-[#FFF8E1] text-[#E65100]',label:'At Risk'},
  RED:{dot:'#D32F2F',badge:'bg-[#FFCDD2] text-[#B71C1C]',label:'Critical'},
};

function groupCard(g){
  var hc=healthConfig[g.health];
  var overduePct=Math.round(g.overdueRate*100);
  var overdueBg=g.overdueRate<0.05?'bg-slate-100 text-slate-500':g.overdueRate<0.20?'bg-[#FFF8E1] text-[#E65100]':'bg-[#FFCDD2] text-[#B71C1C]';
  return `<div class="mx-4 mb-3 bg-white rounded-xl shadow-sm border border-slate-100 p-4 cursor-pointer hover:shadow-md transition-shadow active:scale-[0.98]" onclick="showToast('Opening ${g.name}...')">
    <div class="flex items-start justify-between gap-2">
      <div class="flex items-center gap-2">
        <div class="health-dot" style="background:${hc.dot}"></div>
        <div>
          <div class="text-sm font-bold text-[#1A1C19] leading-tight">${g.name}</div>
          <div class="text-xs text-slate-400">${g.office} · Cycle ${g.cycle}</div>
        </div>
      </div>
      <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${hc.badge} shrink-0">${hc.label}</span>
    </div>
    <div class="flex flex-wrap gap-2 mt-3">
      <span class="flex items-center gap-1 px-2 py-1 rounded-full text-xs bg-slate-100 text-slate-600">
        <span class="material-symbols-outlined text-sm">group</span>${g.members} members
      </span>
      <span class="flex items-center gap-1 px-2 py-1 rounded-full text-xs bg-slate-100 text-slate-600">
        <span class="material-symbols-outlined text-sm">savings</span>KES ${(g.savings/1000).toFixed(0)}K
      </span>
      <span class="flex items-center gap-1 px-2 py-1 rounded-full text-xs ${overdueBg}">
        <span class="material-symbols-outlined text-sm">warning</span>${overduePct}% overdue
      </span>
    </div>
  </div>`;
}

function switchState(s){
  var picker=document.getElementById('statePicker');
  if(picker)picker.value=s;
  var html=topBar();
  if(s==='loading'){
    html+=kpiGrid();
    html+=`<div class="px-4 py-3 flex flex-col gap-3">${Array(4).fill('<div class="shimmer-row h-24 rounded-xl"></div>').join('')}</div>`;
  } else if(s==='content'){
    html+=kpiGrid();
    html+=filterRow(false);
    html+=`<div class="flex items-center justify-between px-4 pb-2">
      <span class="text-xs font-semibold text-slate-500">${allGroups.length} of ${allGroups.length} groups</span>
    </div>`;
    allGroups.forEach(g=>html+=groupCard(g));
    html+='<div class="h-4"></div>';
  } else if(s==='filtered'){
    var greenGroups=allGroups.filter(g=>g.health==='GREEN');
    html+=kpiGrid();
    html+=filterRow(true);
    html+=`<div class="flex items-center justify-between px-4 pb-2">
      <span class="text-xs font-semibold text-slate-500">${greenGroups.length} of ${allGroups.length} groups</span>
      <span class="text-xs text-[#2E7D32] font-semibold">Healthy only</span>
    </div>`;
    greenGroups.forEach(g=>html+=groupCard(g));
    html+='<div class="h-4"></div>';
  } else if(s==='empty'){
    html+=`<div class="flex flex-col items-center justify-center py-20 px-8 text-center">
      <span class="material-symbols-outlined text-6xl text-slate-300 mb-4">group_off</span>
      <p class="text-lg font-bold text-[#1A1C19]">No Groups Assigned</p>
      <p class="text-sm text-slate-500 mt-2">You don't have any groups assigned yet. Contact your office administrator.</p>
    </div>`;
  } else if(s==='error'){
    html+=kpiGrid();
    html+=`<div class="flex flex-col items-center justify-center py-12 px-8 text-center">
      <span class="material-symbols-outlined text-5xl text-[#D32F2F] mb-4">wifi_off</span>
      <p class="text-lg font-bold text-[#1A1C19]">Could not load dashboard</p>
      <p class="text-sm text-slate-500 mt-1">No internet connection. Showing cached data.</p>
      <button onclick="switchState('content')" class="mt-6 px-6 py-3 rounded-full font-semibold text-white text-sm" style="background:#2E7D32">Retry</button>
    </div>`;
  }
  getEl().innerHTML=html;
  renderBottomNav();
  notifyParent();
}

function renderBottomNav(){
  var tabs=[{id:'home',icon:'home',label:'Home'},{id:'savings',icon:'savings',label:'Savings'},{id:'loans',icon:'account_balance_wallet',label:'Loans'},{id:'sync',icon:'sync',label:'Sync'},{id:'settings',icon:'settings',label:'Settings'}];
  var html='<div class="flex items-center justify-around py-2 bg-white">';
  tabs.forEach(t=>{var active=t.id==='home';html+=`<div class="flex flex-col items-center gap-0.5 cursor-pointer ${active?'text-[#2E7D32]':'text-slate-400'}"><span class="material-symbols-outlined text-xl">${t.icon}</span><span class="text-[10px]">${t.label}</span></div>`;});
  html+='</div>';
  getNavEl().innerHTML=html;
}

function showToast(msg){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';t.textContent=msg;document.getElementById('toast-container').appendChild(t);setTimeout(()=>t.remove(),2000);}
function toggleDark(){document.body.classList.toggle('bg-slate-900');}
function notifyParent(){
  if(window===window.top)return;
  window.parent.postMessage({action:'screenLoaded',screenId:'field-officer-dashboard',name:'Field Officer Dashboard',feature:'field-officer-view',status:'enriched',
    states:[{id:'loading',name:'Loading'},{id:'content',name:'Content'},{id:'filtered',name:'Filtered'},{id:'empty',name:'Empty'},{id:'error',name:'Error'}],componentCount:8,
    inspectorData:{id:'field-officer-dashboard',name:'Field Officer Dashboard',feature:'field-officer-view',status:'enriched'}},'*');
}
window.addEventListener('message',function(e){if(!e.data)return;if(e.data.action==='switchState')switchState(e.data.stateId||'content');if(e.data.action==='getInspectorData')notifyParent();});
switchState(new URLSearchParams(location.search).get('state')||'content');
</script>
</body>
</html>
