sibling: api
schema_version: "4.0"
feature_id: field-officer-dashboard

api:
  - id: get_groups_for_staff
    method: GET
    path: /fineract-provider/api/v1/groups
    description: Fetch all groups assigned to this field officer staff member
    auth: BasicAuth
    query_params:
      staffId: { type: Long, required: true, source: session }
      paged: { type: Boolean, default: true }
      limit: { type: Int, default: 100 }
      offset: { type: Int, default: 0 }
    response_ref: PagedGroupsResponse
    error_handling:
      401: Redirect to login
      500: ScreenState → Error with retry
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached_with_banner

  - id: run_report
    method: GET
    path: /fineract-provider/api/v1/runreports/FieldOfficerGroupReport
    description: Generate a CSV report of all groups and KPIs for the field officer
    auth: BasicAuth
    query_params:
      R_staffId: { type: Long, required: true }
      output-type: { type: String, default: "CSV" }
    response_ref: FileResponse
    error_handling:
      403: Report not accessible — show snackbar
      500: Report generation failed — show snackbar

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached_with_banner

dtos:
  PagedAssignedGroupsResponse:
    fields:
      - { name: totalFilteredRecords, type: Int }
      - { name: pageItems, type: "List<AssignedGroupItem>" }
  AssignedGroupItem:
    fields:
      - { name: id, type: Long }
      - { name: name, type: String }
      - { name: status, type: "StatusInfo" }
      - { name: staffId, type: Long }
      - { name: officeId, type: Long }
      - { name: officeName, type: String }
  PagedGroupsResponse:
    fields:
      - { name: totalFilteredRecords, type: Int }
      - { name: pageItems, type: "List<GroupItem>" }
  GroupItem:
    fields:
      - { name: id, type: Long }
      - { name: name, type: String }
      - { name: status, type: "StatusInfo" }
      - { name: officeName, type: String }
      - { name: staffName, type: String }
      - { name: activeClientCount, type: Int }
  StatusInfo:
    fields:
      - { name: id, type: Int }
      - { name: value, type: String }
  FileResponse:
    fields:
      - { name: content, type: ByteArray }
      - { name: mimeType, type: String }
  GroupHealthSummary:
    fields:
      - { name: id, type: Long }
      - { name: fineractGroupId, type: Long }
      - { name: name, type: String }
      - { name: officeName, type: String }
      - { name: status, type: String }
      - { name: activeClientCount, type: Int }
      - { name: totalSavingsBalance, type: Double, currency: KES }
      - { name: totalLoansOutstanding, type: Double, currency: KES }
      - { name: overdueRate, type: Double, note: "0.0 to 1.0" }
      - { name: healthIndicator, type: HealthIndicator }
      - { name: cycleNumber, type: Int }
  HealthIndicator:
    values: [GREEN, AMBER, RED]
    rules:
      GREEN: "overdueRate < 0.05"
      AMBER: "overdueRate >= 0.05 && overdueRate < 0.20"
      RED: "overdueRate >= 0.20"
  GroupStatusFilter:
    values: [ACTIVE, PENDING, CLOSED]
  OverdueRateFilter:
    values: [NONE, LESS_THAN_10, GREATER_THAN_10]
    labels:
      NONE: "No Overdue"
      LESS_THAN_10: "Overdue < 10%"
      GREATER_THAN_10: "Overdue > 10%"
  Staff:
    fields:
      - { name: id, type: Long }
      - { name: displayName, type: String }
      - { name: officeId, type: Long }
      - { name: officeName, type: String }
