sibling: data-flow
schema_version: "2.1.0"
feature_id: field-officer-dashboard

entries:
  - screen_id: fieldOfficerDashboardScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_centers_for_staff, transport: rest, method: get }
      - { api_id: get_groups_for_staff, transport: rest, method: get }
    tables: []
    dtos:
      - { name: PagedCentersResponse, role: response, api_id: get_centers_for_staff }
      - { name: CenterItem, role: response, api_id: get_centers_for_staff }
      - { name: PagedGroupsResponse, role: response, api_id: get_groups_for_staff }
      - { name: GroupItem, role: response, api_id: get_groups_for_staff }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "field_officer:groups:{staffId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_banner }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      Both calls fire in parallel. After success, KPIs are aggregated client-side:
      totalGroupsCount, totalActiveMembers, availableRegions for filter chips.
      GroupHealthSummary is a client-side derived DTO combining GroupItem + computed overdueRate.

  - screen_id: fieldOfficerDashboardScreen
    trigger: on_interact
    endpoints:
      - { api_id: run_report, transport: rest, method: get }
    tables: []
    dtos:
      - { name: FileResponse, role: response, api_id: run_report }
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "403", behavior: show_snackbar, message_key: error_report_forbidden }
      - { error_code: "500", behavior: show_snackbar, message_key: error_report_failed }
    notes: >
      Export report is triggered by button tap (role-gated to FIELD_OFFICER / PROGRAM_MANAGER).
      On success, system share sheet is launched with the CSV file.

  - screen_id: fieldOfficerDashboardScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_centers_for_staff, transport: rest, method: get }
      - { api_id: get_groups_for_staff, transport: rest, method: get }
    tables: []
    dtos:
      - { name: PagedGroupsResponse, role: response, api_id: get_groups_for_staff }
      - { name: GroupItem, role: response, api_id: get_groups_for_staff }
    produces_state: Content
    auth_required: true
    cache:
      strategy: network_first
      ttl_seconds: 300
      key_template: "field_officer:groups:{staffId}"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_banner }
    notes: Pull-to-refresh re-fetches both endpoints, invalidates cache, and re-aggregates KPIs.
