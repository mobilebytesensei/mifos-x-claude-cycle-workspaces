sibling: tests
schema_version: "4.0"
feature_id: login

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LGN-001
      scenario: "Admin login with valid credentials navigates to admin-dashboard"
      type: ViewModel
      priority: P0
      given: "clientType=ADMIN, username='amina.treasurer', password='Pass123!'"
      when: "user taps Login button"
      then: "POST /authentication called; AdminAuthResponse parsed; navigate to admin-dashboard with userId=101"

    - id: TC-LGN-002
      scenario: "End-user login with valid credentials navigates to personal-dashboard"
      type: ViewModel
      priority: P0
      given: "clientType=END_USER, username='grace.secretary', password='pin1234'"
      when: "user taps Login button"
      then: "POST /self/authentication called; SelfAuthResponse parsed; navigate to personal-dashboard with clientId=1003"

    - id: TC-LGN-003
      scenario: "Invalid credentials shows inline error message"
      type: ViewModel
      priority: P0
      given: "username='amina.treasurer', password='wrong'"
      when: "server returns 401"
      then: "uiState.error = error_invalid_credentials; login button remains enabled; no navigation"

    - id: TC-LGN-004
      scenario: "Server unavailable shows server error and keeps form interactive"
      type: ViewModel
      priority: P1
      given: "server returns 503"
      when: "user taps Login"
      then: "uiState.error = error_server_unavailable; isLoading = false"

    - id: TC-LGN-005
      scenario: "PIN mode shows PIN pad, hides username/password fields"
      type: Screen
      priority: P1
      given: "isPinMode=true from saved preference"
      when: "screen mounts"
      then: "PIN pad visible; username/password fields gone; biometric button visible if available"

    - id: TC-LGN-006
      scenario: "Biometric success authenticates without credentials"
      type: ViewModel
      priority: P1
      given: "isBiometricAvailable=true, savedToken present"
      when: "biometric prompt succeeds"
      then: "token restored from secure storage; navigate to appropriate dashboard based on stored clientType"

    - id: TC-LGN-007
      scenario: "Offline with PIN fallback allows local authentication"
      type: ViewModel
      priority: P1
      given: "network.offline, savedPin='1234'"
      when: "user enters correct PIN"
      then: "local PIN validated; session restored from cache; navigate to dashboard"

    - id: TC-LGN-008
      scenario: "Empty username disables login button"
      type: Screen
      priority: P2
      given: "username field empty"
      when: "user clears username"
      then: "Login button disabled"

    - id: TC-LGN-009
      scenario: "AuthRepository.authenticateAdmin maps AdminAuthResponse to session"
      type: Repository
      priority: P0
      given: "mock POST /authentication returns AdminAuthResponse"
      when: "authenticateAdmin() called"
      then: "Session stored with userId, token, roles, officeName"

    - id: TC-LGN-010
      scenario: "AuthRepository.authenticateEndUser maps SelfAuthResponse to session"
      type: Repository
      priority: P0
      given: "mock POST /self/authentication returns SelfAuthResponse"
      when: "authenticateEndUser() called"
      then: "Session stored with clientId, clientName, self-service token"
