<!DOCTYPE html>
<html lang="en" data-feature="login" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>login · content · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell app-shell-auth" data-shell="auth">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <div class="brand-lockup" data-component-type="brand_lockup" data-component-id="c-brand" style="padding:32px 0 24px;">
    <div class="mark">●</div>
    <h1>CommonPurse</h1>
    <p>Save together. Lend together. Grow together.</p>
  </div>
  <div class="form-field" data-component-type="form_field" data-component-id="c-phone">
    <label for="phone">Phone number</label>
    <input id="phone" type="tel" placeholder="+254 700 000 000" value="+254 712 345 678">
  </div>
  <div class="form-field" data-component-type="form_field" data-component-id="c-pin">
    <label for="pin">PIN (4 digits)</label>
    <input id="pin" type="password" placeholder="● ● ● ●" value="●●●●" inputmode="numeric" maxlength="4" style="letter-spacing: 8px; text-align: center; font-size: 20px;">
  </div>
  <button class="btn btn-primary btn-full" data-component-type="button" data-component-id="c-signin" data-nav-to="personal-dashboard">Sign in</button>
  <button class="btn btn-text btn-full" data-component-type="button" data-component-id="c-biometric" data-action="biometric_unlock" style="margin-top:8px;">⚲ Unlock with fingerprint</button>
  <div style="text-align:center; margin-top:24px;">
    <button class="btn-text" data-action="forgot_pin" style="background:none;border:none;color:var(--primary-700);font-size:13px;cursor:pointer;">Forgot PIN?</button>
  </div>
  <p class="footnote" style="text-align:center; margin-top:32px;">Powered by Mifos Fineract · Works offline</p>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
