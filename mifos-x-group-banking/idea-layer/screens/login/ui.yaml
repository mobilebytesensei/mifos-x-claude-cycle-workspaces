sibling: ui
schema_version: "4.0"
feature_id: login

route: /login
entry_points:
  - source: client-type-selector
    condition: tile_selected
nav_params:
  client_type: { type: ClientType, required: true, values: [admin, end_user] }

screens:
  - id: login_screen
    name: LoginScreen
    composable: LoginScreen
    description: Auth form with contextual copy for admin vs end-user
    layout: Column (scrollable, centered)

state_model:
  LoginViewModel:
    state:
      name: LoginState
      fields:
        clientType: { type: ClientType, default: "ClientType.END_USER" }
        username: { type: String, default: '""' }
        password: { type: String, default: '""' }
        pin: { type: String, default: '""' }
        isPasswordVisible: { type: Boolean, default: "false" }
        isPinMode: { type: Boolean, default: "false" }
        isBiometricAvailable: { type: Boolean, default: "false" }
        isLoading: { type: Boolean, default: "false" }
        error: { type: "LoginError?", default: "null" }
    screen_state:
      name: LoginScreenState
      members: [Idle, Loading, Success, Error, BiometricPrompt]
    errors:
      name: LoginError
      types:
        - { type: InvalidCredentials, retry: true, message_key: error_invalid_credentials }
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: PinNotSet, retry: false, message_key: error_pin_not_set }
        - { type: BiometricFailed, retry: true, message_key: error_biometric_failed }
    events:
      name: LoginEvent
      members:
        - { name: NavigateToAdminDashboard, params: { userId: Long, roles: "List<String>" } }
        - { name: NavigateToEndUserDashboard, params: { clientId: Long, token: String } }
        - { name: ShowBiometricPrompt }
    actions:
      name: LoginAction
      members:
        - { name: OnUsernameChange, params: { value: String }, trigger: "Type username" }
        - { name: OnPasswordChange, params: { value: String }, trigger: "Type password" }
        - { name: OnTogglePasswordVisibility, trigger: "Tap eye icon" }
        - { name: OnLoginClick, trigger: "Tap Login button" }
        - { name: OnPinChange, params: { digit: String }, trigger: "Tap PIN digit" }
        - { name: OnTogglePinMode, trigger: "Tap Use PIN instead" }
        - { name: OnBiometricClick, trigger: "Tap fingerprint icon" }
        - { name: OnPinSubmit, trigger: "PIN 4th digit entered" }
    di:
      - AuthRepository
      - SessionManager
      - BiometricManager
      - PinManager
      - SyncQueueRepository

components:
  - id: top_bar
    type: top-bar
    title: ""
    style: { background: surface, elevation: 0dp }
    navigation_icon: arrow_back
    on_click: { action: NavigateBack, target: client-type-selector }

  - id: logo
    type: image
    style: { size: 64dp, alignment: center, margin_top: 24dp }
    a11y: { content_description: "CommonPurse logo" }

  - id: login_title
    type: text
    style:
      text_style: headlineMedium
      color: onSurface
      weight: bold
      alignment: center
      margin_top: 8dp
    value: "{{ clientType == ADMIN ? i18n.admin_login_title : i18n.member_login_title }}"

  - id: login_subtitle
    type: text
    style:
      text_style: bodyLarge
      color: primary
      alignment: center
      margin_bottom: 32dp
    value: "Mwangaza Women's Group"

  - id: username_field
    type: text-field
    label: "Username"
    placeholder: "Enter your username"
    leading_icon: person
    keyboard_type: text
    ime_action: next
    style:
      min_touch_target: 48dp
      margin_horizontal: 24dp
      margin_bottom: 12dp
      visible_when: "isPinMode == false"
    on_change: { action: OnUsernameChange, target: state.username }

  - id: password_field
    type: text-field
    label: "Password"
    placeholder: "Enter your password"
    leading_icon: lock_closed
    keyboard_type: password
    input_type: password
    ime_action: done
    style:
      min_touch_target: 48dp
      margin_horizontal: 24dp
      margin_bottom: 8dp
      visible_when: "isPinMode == false"
    on_change: { action: OnTogglePasswordVisibility, target: state.isPasswordVisible }

  - id: switch_to_pin_button
    type: button
    label: "{{ isPinMode ? i18n.use_password_instead : i18n.use_pin_instead }}"
    style:
      variant: text
      color: primary
      alignment: end
      margin_horizontal: 24dp
      margin_bottom: 16dp
      min_touch_target: 48dp
    on_click: { action: OnTogglePinMode, target: state.isPinMode }

  - id: pin_pad
    type: card
    style:
      visible_when: "isPinMode == true"
      background: surface
      corner_radius: md
      margin_horizontal: 24dp
      padding: 16dp
    pin_display: { dots: 4, filled_color: primary, empty_color: outlineVariant }
    grid: { columns: 3, digit_button_size: 72dp, digit_text_style: headlineSmall }
    on_click: { action: OnPinChange, target: state.pin }

  - id: biometric_button
    type: button
    style:
      variant: outlined
      icon: fingerprint
      min_touch_target: 56dp
      size: 64dp
      shape: circle
      border_color: primary
      tint: primary
      alignment: center
      margin_top: 8dp
      visible_when: "isBiometricAvailable == true"
    on_click: { action: OnBiometricClick, target: event.ShowBiometricPrompt }

  - id: login_button
    type: button
    label: "Login"
    style:
      variant: filled
      background: primary
      text_color: onPrimary
      corner_radius: full
      min_height: 56dp
      margin_horizontal: 24dp
      margin_top: 24dp
      enabled_when: "(username.isNotBlank() && password.isNotBlank()) || pin.length == 4"
    on_click: { action: OnLoginClick, target: "api.authenticate_admin or api.authenticate_end_user" }

  - id: loading_indicator
    type: shimmer
    style:
      visible_when: "isLoading == true"
      size: 32dp
      color: primary
      alignment: center

  - id: error_banner
    type: card
    style:
      visible_when: "error != null"
      background: errorContainer
      corner_radius: md
      padding: 12dp
      margin_horizontal: 24dp
      margin_top: 8dp
    icon: warning
    text: "{{error.message_key}}"

states:
  initial_state: loading
  loading:
    description: Brief splash while checking for existing session / biometric availability
    components: [logo, login_title]
  content:
    description: Form ready for input (password mode default)
    components: [top_bar, logo, login_title, login_subtitle, username_field, password_field, switch_to_pin_button, biometric_button, login_button]
    demo_data:
      clientType: END_USER
      isPinMode: false
      isBiometricAvailable: true
  pin_mode:
    description: PIN pad visible, username/password hidden
    components: [top_bar, logo, login_title, login_subtitle, pin_pad, switch_to_pin_button, biometric_button, login_button]
  loading_auth:
    description: Auth in progress — login button replaced by spinner
    components: [top_bar, logo, login_title, login_subtitle, username_field, password_field, switch_to_pin_button, loading_indicator]
  error:
    description: Auth failed — error banner visible, fields re-enabled
    components: [top_bar, logo, login_title, login_subtitle, username_field, password_field, switch_to_pin_button, biometric_button, login_button, error_banner]
  biometric_prompt:
    description: OS biometric dialog is showing
    components: [top_bar, logo, login_title, login_subtitle, biometric_button]

i18n:
  en:
    admin_login_title: "Staff Login"
    member_login_title: "Member Login"
    username_label: "Username"
    username_placeholder: "Enter your username"
    password_label: "Password"
    password_placeholder: "Enter your password"
    use_pin_instead: "Use PIN instead"
    use_password_instead: "Use password instead"
    login_button: "Login"
    error_invalid_credentials: "Incorrect username or password. Please try again."
    error_network: "No internet connection. Login with your PIN."
    error_server: "Server error. Please try again later."
    error_pin_not_set: "PIN not set up. Please login with your password first."
    error_biometric_failed: "Biometric not recognised. Try again or use your password."
