sibling: docs
schema_version: "4.0"
feature_id: login
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - is_auth_feature

id: login
name: Login
description: >
  Fineract authentication screen supporting both admin (staff auth) and end-user
  (self-service auth) paths. Shows logo, username + password fields, PIN-based
  offline login option, and biometric unlock. Covers FR-013 and FR-014.
feature: authentication
flow: authentication-flow
version: "1.0.0"
tags:
  - auth
  - login
  - pin
  - biometric
  - fineract
  - admin
  - end_user
  - FR-013
  - FR-014

status: designed
quality_score: 91
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: claude-product-cycle
  - status: designed
    at: "2026-05-08T23:00:00Z"
    by: /idea export

entry_point: false
bottom_nav: false

legacy_metadata:
  analytics:
    screen_viewed:
      event: screen_viewed
      params:
        screen_id: login
        flow: authentication-flow
    events:
      - name: login_attempted
        trigger: user taps Login button
        params: { client_type: "admin|end_user", mode: "password|pin|biometric" }
      - name: login_success
        trigger: auth API returns 200
        params: { client_type: "admin|end_user", mode: "password|pin|biometric" }
      - name: login_failed
        trigger: auth API returns error
        params: { client_type: "admin|end_user", error_type: "InvalidCredentials|Network|Server" }
      - name: biometric_triggered
        trigger: user taps biometric button
        params: { client_type: "admin|end_user" }
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/authentication/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/authentication/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/authentication/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/authentication/"
