sibling: data-flow
schema_version: "2.1.0"
feature_id: login

entries:
  - screen_id: loginScreen
    trigger: on_interact
    description: Admin login via Fineract staff credentials
    endpoints:
      - { api_id: authenticate_admin, transport: rest, method: post }
    dtos:
      - { name: AdminAuthResponse, role: response, api_id: authenticate_admin }
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "login:admin"
    error_paths:
      - { error_code: "401", behavior: show_error, message_key: error_invalid_credentials }
      - { error_code: "503", behavior: show_error, message_key: error_server_unavailable }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_use_pin }

  - screen_id: loginScreen
    trigger: on_interact
    description: End-user self-service login via member credentials
    endpoints:
      - { api_id: authenticate_end_user, transport: rest, method: post }
    dtos:
      - { name: SelfAuthResponse, role: response, api_id: authenticate_end_user }
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "login:end_user"
    error_paths:
      - { error_code: "401", behavior: show_error, message_key: error_invalid_credentials }
      - { error_code: "503", behavior: show_error, message_key: error_server_unavailable }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_use_pin }

  - screen_id: loginScreen
    trigger: on_mount
    description: Biometric / PIN fallback check on mount — no network call
    endpoints: []
    dtos: []
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "login:biometric_check"
    error_paths: []
