sibling: api
schema_version: "4.0"
feature_id: login

api:
  - id: authenticate_admin
    function: authenticate_admin
    method: post
    endpoint: "/authentication"
    description: Authenticate admin/staff via Fineract username+password
    params:
      username: { type: String, required: true, source: user_input }
      password: { type: String, required: true, source: user_input }
    response:
      type: object
      fields:
        userId: Long
        base64EncodedAuthenticationKey: String
        authenticated: Boolean
        username: String
        roles: "List<String>"
        officeId: Long
        officeName: String
    errors:
      401: Invalid credentials
      503: Server unavailable
    cache: { ttl: 0, strategy: no-cache, offline: use_local_pin }

  - id: authenticate_end_user
    function: authenticate_end_user
    method: post
    endpoint: "/self/authentication"
    description: Authenticate end user via Fineract self-service credentials
    params:
      username: { type: String, required: true, source: user_input }
      password: { type: String, required: true, source: user_input }
    response:
      type: object
      fields:
        userId: Long
        base64EncodedAuthenticationKey: String
        authenticated: Boolean
        username: String
        clientId: Long
        clientName: String
    errors:
      401: Invalid credentials
      503: Server unavailable
    cache: { ttl: 0, strategy: no-cache, offline: use_local_pin }

dtos:
  AdminAuthResponse:
    userId: Long
    base64EncodedAuthenticationKey: String
    authenticated: Boolean
    username: String
    roles: "List<String>"
    officeId: Long
    officeName: String

  SelfAuthResponse:
    userId: Long
    base64EncodedAuthenticationKey: String
    authenticated: Boolean
    username: String
    clientId: Long
    clientName: String

dependencies:
  tier: ui
  features: [authentication]
  services:
    - AuthRepository
    - SessionManager
    - BiometricManager
    - PinManager
    - SyncQueueRepository
  shared_entities:
    - Member
    - ClientType
    - SyncQueue
