<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { display: ['Noto Sans', 'system-ui', 'sans-serif'] },
      colors: {
        primary: '#2E7D32', 'on-primary': '#FFFFFF',
        'primary-container': '#C8E6C9', 'on-primary-container': '#1B5E20',
        secondary: '#FF8F00', tertiary: '#1565C0',
        surface: '#FAFAFA', 'on-surface': '#1A1C19',
        'error': '#D32F2F', 'error-container': '#FFDAD6',
        outline: '#72796F',
      }
    }
  }
};
</script>
<style>
:root {
  --primary: #2E7D32; --on-primary: #FFFFFF;
  --bg: #FAFAFA; --surface: #FAFAFA;
  --text: #1A1C19; --text-secondary: #42493F; --text-tertiary: #72796F;
  --border: #C8D8C5; --error: #D32F2F;
}
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width: 393px; min-height: 852px; border-radius: 2.5rem; overflow: hidden; position: relative; background: #FAFAFA; }
body.embedded { background: var(--bg); margin: 0; padding: 0; min-height: 100vh; display: block; }
body.embedded #standalone-toolbar { display: none !important; }
body.embedded #phone-wrapper { display: none !important; }
body.embedded #embedded-content { display: flex !important; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; background: var(--bg); }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #2E7D32; }
.pin-dot.filled { background: #2E7D32; }
.pin-btn { width: 68px; height: 68px; border-radius: 50%; background: #F1F4EF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: #1A1C19; cursor: pointer; transition: background 0.1s; border: none; }
.pin-btn:active { background: #C8E6C9; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<!-- Standalone Toolbar -->
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Login — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="content">Password Mode</option>
    <option value="pin_mode">PIN Mode</option>
    <option value="loading_auth">Authenticating</option>
    <option value="error">Error</option>
    <option value="biometric_prompt">Biometric</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<!-- Phone Frame -->
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-[#FAFAFA]">
      <span class="text-xs font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-slate-900">wifi</span>
        <span class="material-symbols-outlined text-sm text-slate-900">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-[#FAFAFA]" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-[#FAFAFA]"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<!-- Embedded Content -->
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-[#FAFAFA] shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-slate-900">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-slate-900">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-slate-900">wifi</span>
      <span class="material-symbols-outlined text-sm text-slate-900">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-[#FAFAFA] flex-1"></div>
  <div class="flex justify-center py-2 bg-[#FAFAFA] shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>

<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) {
  document.body.classList.remove('bg-[#0F0F23]', 'min-h-screen', 'flex', 'flex-col');
  document.body.classList.add('embedded');
}
function getContentEl() {
  return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content');
}
var currentState = 'content';
var pinDigits = 0;

function renderPasswordMode(showError) {
  return `
  <div class="flex flex-col bg-[#FAFAFA]">
    <!-- Top bar -->
    <div class="flex items-center px-4 py-3 bg-white border-b border-slate-100">
      <!-- back: navigates to client-type-selector -->
      <span class="material-symbols-outlined text-xl cursor-pointer text-[#1A1C19]" onclick="navigateTo('client-type-selector')">arrow_back</span>
      <span class="flex-1"></span>
    </div>

    <div class="flex flex-col items-center px-6 pt-6 pb-4">
      <!-- Logo -->
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-md mb-4" style="background: linear-gradient(135deg, #2E7D32, #388E3C)">
        <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1">eco</span>
      </div>
      <h2 class="text-2xl font-bold text-[#1A1C19] mb-1">Member Login</h2>
      <p class="text-base font-semibold" style="color: #2E7D32;">Mwangaza Women's Group</p>
    </div>

    <div class="px-6 flex flex-col gap-3 mt-2">
      <!-- Username field -->
      <div>
        <label class="block text-sm font-semibold text-[#42493F] mb-1.5">Username</label>
        <div class="flex items-center gap-2 px-4 py-3 rounded-xl border-2 border-[#C8D8C5] bg-white focus-within:border-[#2E7D32]">
          <span class="material-symbols-outlined text-[#72796F] text-xl">person</span>
          <input type="text" placeholder="Enter your username" class="flex-1 text-sm outline-none bg-transparent text-[#1A1C19]" value="grace.mwangi"/>
        </div>
      </div>

      <!-- Password field -->
      <div>
        <label class="block text-sm font-semibold text-[#42493F] mb-1.5">Password</label>
        <div class="flex items-center gap-2 px-4 py-3 rounded-xl border-2 border-[#C8D8C5] bg-white focus-within:border-[#2E7D32]">
          <span class="material-symbols-outlined text-[#72796F] text-xl">lock</span>
          <input type="password" placeholder="Enter your password" class="flex-1 text-sm outline-none bg-transparent text-[#1A1C19]" value="password123"/>
          <span class="material-symbols-outlined text-[#72796F] text-xl cursor-pointer">visibility_off</span>
        </div>
      </div>

      <!-- Switch to PIN -->
      <div class="flex justify-end">
        <button class="text-sm font-medium" style="color: #2E7D32;" onclick="switchState('pin_mode')">Use PIN instead</button>
      </div>

      ${showError ? `
      <!-- Error banner (visible in error state) -->
      <div class="flex items-center gap-3 p-3 rounded-xl" style="background: #FFDAD6;">
        <span class="material-symbols-outlined text-[#D32F2F]" style="font-variation-settings:'FILL' 1">warning</span>
        <span class="text-sm text-[#D32F2F] font-medium">Incorrect username or password. Please try again.</span>
      </div>` : ''}

      <!-- Login button -->
      <!-- tap: calls /self/authentication or /authentication, navigates to personal-dashboard or admin-dashboard -->
      <button class="w-full py-4 rounded-full text-white font-semibold text-base mt-2 shadow-sm" style="background: #2E7D32;" onclick="navigateTo('personal-dashboard')">
        Login
      </button>

      <!-- Biometric button -->
      <div class="flex justify-center mt-2">
        <button class="w-16 h-16 rounded-full flex items-center justify-center border-2 shadow-sm" style="border-color: #2E7D32; background: white;" onclick="switchState('biometric_prompt')">
          <span class="material-symbols-outlined text-3xl" style="color: #2E7D32; font-variation-settings:'FILL' 1">fingerprint</span>
        </button>
      </div>
      <p class="text-xs text-center text-[#72796F]">Login with fingerprint</p>
    </div>
  </div>`;
}

function renderPinMode() {
  return `
  <div class="flex flex-col bg-[#FAFAFA]">
    <div class="flex items-center px-4 py-3 bg-white border-b border-slate-100">
      <span class="material-symbols-outlined text-xl cursor-pointer text-[#1A1C19]" onclick="navigateTo('client-type-selector')">arrow_back</span>
    </div>
    <div class="flex flex-col items-center px-6 pt-6 pb-4">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-md mb-4" style="background: linear-gradient(135deg, #2E7D32, #388E3C)">
        <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1">eco</span>
      </div>
      <h2 class="text-2xl font-bold text-[#1A1C19] mb-1">Enter PIN</h2>
      <p class="text-base font-semibold mb-6" style="color: #2E7D32;">Mwangaza Women's Group</p>

      <!-- PIN dots -->
      <div class="flex gap-4 mb-8">
        <div class="pin-dot ${pinDigits >= 1 ? 'filled' : ''}"></div>
        <div class="pin-dot ${pinDigits >= 2 ? 'filled' : ''}"></div>
        <div class="pin-dot ${pinDigits >= 3 ? 'filled' : ''}"></div>
        <div class="pin-dot ${pinDigits >= 4 ? 'filled' : ''}"></div>
      </div>

      <!-- Numpad -->
      <div class="grid grid-cols-3 gap-4 w-full max-w-xs">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(d => `
          <button class="pin-btn mx-auto" onclick="pinTap('${d}')">${d}</button>
        `).join('')}
      </div>

      <button class="text-sm font-medium mt-6" style="color: #2E7D32;" onclick="switchState('content')">Use password instead</button>
    </div>
  </div>`;
}

function renderLoading() {
  return `
  <div class="flex flex-col items-center justify-center" style="height: 600px;">
    <div class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-md mb-6" style="background: linear-gradient(135deg, #2E7D32, #388E3C)">
      <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1">eco</span>
    </div>
    <div class="w-10 h-10 border-4 border-[#C8E6C9] border-t-[#2E7D32] rounded-full animate-spin mb-4"></div>
    <p class="text-sm text-[#42493F]">Verifying credentials...</p>
    <p class="text-xs text-[#72796F] mt-1">POST /self/authentication</p>
  </div>`;
}

function renderBiometric() {
  return `
  <div class="flex flex-col items-center justify-center bg-[#FAFAFA]" style="height: 600px;">
    <div class="w-24 h-24 rounded-full flex items-center justify-center shadow-xl mb-6" style="background: #E8F5E9; border: 3px solid #2E7D32;">
      <span class="material-symbols-outlined text-6xl" style="color: #2E7D32; font-variation-settings:'FILL' 1">fingerprint</span>
    </div>
    <h3 class="text-lg font-semibold text-[#1A1C19] mb-2">Touch sensor to login</h3>
    <p class="text-sm text-[#72796F] text-center px-8">Place your registered finger on the sensor to verify your identity</p>
    <button class="mt-6 text-sm font-medium" style="color: #2E7D32;" onclick="switchState('content')">Use password instead</button>
  </div>`;
}

function switchState(stateId) {
  currentState = stateId || 'content';
  document.getElementById('statePicker').value = currentState;
  pinDigits = 0;
  var html = '';
  if (currentState === 'pin_mode') html = renderPinMode();
  else if (currentState === 'loading_auth') html = renderLoading();
  else if (currentState === 'error') html = renderPasswordMode(true);
  else if (currentState === 'biometric_prompt') html = renderBiometric();
  else html = renderPasswordMode(false);
  getContentEl().innerHTML = html;
}

function pinTap(digit) {
  if (digit === '⌫') { if (pinDigits > 0) pinDigits--; }
  else if (digit !== '' && pinDigits < 4) { pinDigits++; }
  if (pinDigits >= 4) {
    setTimeout(() => navigateTo('personal-dashboard'), 300);
    return;
  }
  getContentEl().innerHTML = renderPinMode();
}

function navigateTo(target) {
  if (window !== window.top) {
    window.parent.postMessage({ action: 'navigate', screenId: target }, '*');
  } else {
    showToast('Navigate to: ' + target);
  }
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function toggleDark() {
  document.querySelector('.phone') && document.querySelector('.phone').classList.toggle('bg-slate-900');
}

window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.action === 'switchState') switchState(e.data.stateId || e.data.state || '');
  if (e.data.action === 'getInspectorData') notifyParent();
});

function notifyParent() {
  if (window === window.top) return;
  window.parent.postMessage({
    action: 'screenLoaded', screenId: 'login', name: 'Login',
    feature: 'authentication', status: 'enriched', componentCount: 8,
    states: [
      { id: 'content', name: 'Password Mode' }, { id: 'pin_mode', name: 'PIN Mode' },
      { id: 'loading_auth', name: 'Authenticating' }, { id: 'error', name: 'Error' },
      { id: 'biometric_prompt', name: 'Biometric' }
    ],
    inspectorData: {
      id: 'login', name: 'Login', feature: 'authentication', status: 'enriched',
      components: [
        { type: 'top-bar', label: 'Back to client-type-selector', target: 'client-type-selector' },
        { type: 'image', label: 'CommonPurse Logo', target: '' },
        { type: 'text', label: 'Member Login', target: '' },
        { type: 'text', label: "Mwangaza Women's Group", target: '' },
        { type: 'text-field', label: 'Username', target: '' },
        { type: 'text-field', label: 'Password', target: '' },
        { type: 'button', label: 'Login', target: 'personal-dashboard' },
        { type: 'button', label: 'Biometric', target: 'biometric_prompt' }
      ],
      states: {}, incoming_from: ['client-type-selector']
    }
  }, '*');
}

switchState('content');
notifyParent();
</script>
</body>
</html>
