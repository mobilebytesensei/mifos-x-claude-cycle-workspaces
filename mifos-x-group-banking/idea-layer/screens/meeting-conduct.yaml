schema_version: "3.1"

id: meeting-conduct
name: Meeting Conduct
description: >
  THE CORE SCREEN — multi-step wizard (7 steps, 0-indexed) for conducting a weekly
  group meeting. FR-003/FR-004/FR-006/FR-012/FR-017/FR-019/FR-020. Steps: Previous
  Meeting Review (0), Attendance (1), Opening Balance (2), Savings Collection (3),
  Loan Review (4), Loan Applications (5), Closing Balance (6). Full offline-first
  support via SyncQueue. All data queued when connectivity absent and synced on
  reconnect. Wizard state persisted to local DB on each step advance. Corpus gate
  blocks loan disbursement when closing corpus would go negative.
feature: meeting-lifecycle
flow: meeting-lifecycle-flow
version: "1.0.0"
tags: [meetings, wizard, admin, offline-first, attendance, savings, loans, core, meeting-lifecycle]

status: enriched
quality_score: 92
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: claude-product-cycle
  - from: enriched
    to: enriched
    at: "2026-05-05"
    by: "/idea enrich --flow all (re-enrich pass)"

entry_point: false
bottom_nav: false
navigates_to:
  - target: meeting-summary
    condition: wizard_submitted_successfully
    params: { meeting_id: String, meeting_number: Int, center_id: Int }
  - target: previous-meeting-review
    condition: user_taps_view_full_previous_meeting
    params: { meeting_id: String, meeting_number: Int, center_id: Int }
  - target: meeting-calendar
    condition: user_taps_back_or_cancel
    params: {}
route: /meetings/{meetingId}/conduct
entry_points:
  - source: meeting-calendar
    condition: user_taps_start_meeting_on_upcoming_card
nav_params:
  meetingId: { type: String, required: true }
  meetingNumber: { type: Int, required: true }
  centerId: { type: Int, required: true }

screens:
  - id: meeting_conduct_screen
    name: MeetingConductScreen
    composable: MeetingConductScreen
    description: >
      Full-screen wizard with sticky top stepper, back/next navigation footer,
      and step-specific content in the body. Corpus balance shown in persistent
      header band throughout steps 2-6. Step 0 is a read-only preview that
      auto-advances; steps 1-6 require explicit user input before advancing.
    layout: Column (TopAppBar + StepperHeader + CorpusBand(conditional) + StepContent + NavigationFooter)

state_model:
  MeetingConductViewModel:
    state:
      name: MeetingConductState
      fields:
        currentStep: { type: Int, default: "0" }
        totalSteps: { type: Int, default: "7" }
        meetingId: { type: String, default: '""' }
        meetingNumber: { type: Int, default: "0" }
        centerId: { type: Int, default: "0" }
        previousMeetingSummary: { type: "PreviousMeetingSummary?", default: "null" }
        groupMembers: { type: "List<GroupMember>", default: "emptyList()" }
        attendanceMap: { type: "Map<String, AttendanceStatus>", default: "emptyMap()" }
        lateFines: { type: "Map<String, Long>", default: "emptyMap()" }
        absentFines: { type: "Map<String, Long>", default: "emptyMap()" }
        openingCorpus: { type: Long, default: "0L" }
        cashOnHand: { type: Long, default: "0L" }
        savingsMap: { type: "Map<String, SavingsEntry>", default: "emptyMap()" }
        runningSavingsTotal: { type: Long, default: "0L" }
        activeLoans: { type: "List<LoanSummary>", default: "emptyList()" }
        loanRepayments: { type: "Map<String, Long>", default: "emptyMap()" }
        loanFines: { type: "Map<String, Long>", default: "emptyMap()" }
        pendingLoanApplications: { type: "List<LoanApplication>", default: "emptyList()" }
        loanVotes: { type: "Map<String, LoanVote>", default: "emptyMap()" }
        closingCorpus: { type: Long, default: "0L" }
        totalCashCollected: { type: Long, default: "0L" }
        totalLoansDisbursed: { type: Long, default: "0L" }
        totalRepayments: { type: Long, default: "0L" }
        totalFinesCollected: { type: Long, default: "0L" }
        isSubmitting: { type: Boolean, default: "false" }
        isOffline: { type: Boolean, default: "false" }
        submitError: { type: "String?", default: "null" }
        stepValidationError: { type: "String?", default: "null" }
        isSavingProgress: { type: Boolean, default: "false" }
    screen_state:
      name: MeetingConductScreenState
      members:
        - Loading: initial data fetch in progress
        - Content: wizard active, step content rendered per currentStep
        - Submitting: API calls in flight after Submit tapped (overlay shown)
        - SubmitSuccess: brief toast, then navigate to meeting-summary
        - SubmitError: error snackbar with offline queue fallback confirmation
    errors:
      CorpusInsufficient: "Corpus balance insufficient to disburse this loan. Current corpus: KES {{currentCorpus}}."
      AttendanceIncomplete: "Please record attendance for all {{totalMembers}} members before proceeding."
      SavingsValidation: "Savings amount cannot exceed KES 10,000 per member per meeting."
      SubmitFailed: "Meeting submission failed. Data saved offline and will sync when connected."
      MinContributionNotMet: "{{member_name}} has not met the minimum contribution of KES {{min_amount}}."
      RepaymentExceedsBalance: "Repayment amount exceeds outstanding balance for {{member_name}}."
    events:
      name: MeetingConductEvent
      members:
        - { name: NavigateToMeetingSummary, params: "meetingId: String, meetingNumber: Int, centerId: Int" }
        - { name: NavigateToPreviousMeetingReview, params: "meetingId: String, centerId: Int" }
        - { name: NavigateBack }
        - { name: ShowStepError, params: "message: String" }
        - { name: ShowSubmitSuccess }
        - { name: ShowSubmitError, params: "message: String" }
    actions:
      name: MeetingConductAction
      members:
        - { name: LoadMeetingData, trigger: "Screen enters composition" }
        - { name: NextStep, trigger: "Tap Next / Continue footer button" }
        - { name: PreviousStep, trigger: "Tap Back footer button" }
        - { name: SetAttendance, trigger: "Tap attendance toggle for member", params: "memberId: String, status: AttendanceStatus" }
        - { name: SetSavingsAmount, trigger: "Edit savings input for member", params: "memberId: String, amount: Long, type: SavingsType" }
        - { name: SetLoanRepayment, trigger: "Edit repayment input for loan", params: "loanId: String, amount: Long" }
        - { name: SetLoanFine, trigger: "Edit fine input for overdue loan", params: "loanId: String, fineAmount: Long" }
        - { name: CastLoanVote, trigger: "Tap For/Against on loan application", params: "loanId: String, vote: LoanVote" }
        - { name: ApproveLoanApplication, trigger: "Chairperson taps Approve", params: "loanId: String" }
        - { name: SubmitMeeting, trigger: "Tap Submit on Closing Balance step or Next footer on step 6" }
        - { name: ViewFullPreviousMeeting, trigger: "Tap 'View Full Report' on step 0" }
        - { name: SaveProgressLocally, trigger: "App background or step advance" }
        - { name: DismissError, trigger: "Snackbar auto-dismiss or user swipe" }
    di:
      - MeetingRepository
      - SavingsRepository
      - LoanRepository
      - CorpusRepository
      - SyncQueueRepository
      - NavigationManager
      - ConnectivityObserver
      - LocalMeetingDao

flow_logic:
  - decision: screen_init
    branches:
      - condition: always
        action: >
          Load previousMeetingSummary (GET /fineract-provider/api/v1/datatables/dt_meeting_record/{centerId}),
          groupMembers (GET /fineract-provider/api/v1/centers/{centerId}),
          openingCorpus (GET /fineract-provider/api/v1/datatables/dt_group_corpus/{centerId}),
          activeLoans (GET /fineract-provider/api/v1/loans?groupId=X&loanStatus=active),
          pendingLoanApplications (GET /fineract-provider/api/v1/datatables/dt_loan_vote/{loanId}).
          Emit analytics: meeting_started. Start at step 0 (ScreenState.Content).
      - condition: any_fetch_fails
        action: >
          Show ScreenState.SubmitError with relevant message. Block wizard until data loaded.

  - decision: step_advance (NextStep action)
    branches:
      - condition: currentStep == 0 (Previous Meeting Review)
        action: >
          No validation required — read-only step.
          Emit analytics: step_advanced(from=0, to=1).
          Advance to step 1.
      - condition: currentStep == 1 (Attendance)
        action: >
          Validate all groupMembers.size members have an AttendanceStatus set in attendanceMap.
          If any missing → emit AttendanceIncomplete error, remain on step 1.
          On valid: auto-calc lateFines (KES 50/LATE member) and absentFines (KES 100/ABSENT member)
          per FR-012. Update totalFinesCollected. Save progress locally.
          Emit analytics: step_advanced(from=1, to=2). Advance to step 2.
      - condition: currentStep == 2 (Opening Balance)
        action: >
          Display-only confirmation step. openingCorpus and cashOnHand already loaded.
          Save progress locally.
          Emit analytics: step_advanced(from=2, to=3). Advance to step 3.
      - condition: currentStep == 3 (Savings Collection)
        action: >
          Validate all group savings entries in savingsMap >= KES 200/member (FR-020).
          Emit MinContributionNotMet for any violating member; block advance.
          On valid: update runningSavingsTotal = sum(savingsMap.values.groupAmount + individualAmount).
          Save progress locally.
          Emit analytics: step_advanced(from=3, to=4). Advance to step 4.
      - condition: currentStep == 4 (Loan Review)
        action: >
          Validate all loanRepayments[loanId] <= activeLoans[loanId].outstandingBalance.
          Emit RepaymentExceedsBalance if violated; block advance.
          Compute totalRepayments = sum(loanRepayments.values).
          Save progress locally.
          Emit analytics: step_advanced(from=4, to=5). Advance to step 5.
      - condition: currentStep == 5 (Loan Applications)
        action: >
          For any approved loan application:
            prospectiveClosing = openingCorpus + runningSavingsTotal + totalRepayments
                                 + totalFinesCollected - totalLoansDisbursed - disbursementAmount
            If prospectiveClosing < 0 → emit CorpusInsufficient, block advance.
          On valid: compute totalLoansDisbursed = sum(approved application amounts).
          Save progress locally.
          Emit analytics: step_advanced(from=5, to=6). Advance to step 6.
      - condition: currentStep == 6 (Closing Balance)
        action: >
          Compute closingCorpus = openingCorpus + runningSavingsTotal + totalRepayments
                                  + totalFinesCollected - totalLoansDisbursed.
          Enable Submit button. This step triggers SubmitMeeting on Next/Submit tap.

  - decision: submit_meeting (SubmitMeeting action)
    branches:
      - condition: isOffline == false
        action: >
          ScreenState → Submitting.
          Sequential API calls:
            1. POST /fineract-provider/api/v1/datatables/dt_meeting_record (meeting record)
            2. POST /fineract-provider/api/v1/datatables/dt_meeting_attendance per member (attendance)
            3. POST /fineract-provider/api/v1/savingsaccounts/{savingsId}/transactions per member per savings type
            4. POST /fineract-provider/api/v1/loans/{loanId}/transactions per repaid loan
            5. POST /fineract-provider/api/v1/loans/{loanId}/transactions for each disbursed loan
            6. PUT /fineract-provider/api/v1/datatables/dt_group_corpus/{centerId} (corpus update)
          On all 2xx → emit meeting_submitted analytics, ScreenState → SubmitSuccess,
          navigate to meeting-summary with meetingId, meetingNumber, centerId.
          On any 5xx → fall through to offline path.
      - condition: isOffline == true
        action: >
          Enqueue all 6 payload groups to SyncQueueRepository with meeting_id key and ordered priority.
          ScreenState → SubmitSuccess (optimistic). Show offline_submit_toast.
          Navigate to meeting-summary with cached data.
          Emit meeting_submitted(is_offline=true) analytics.

dependencies:
  tier: feature
  features: [meeting-summary, previous-meeting-review, meeting-calendar]
  services:
    - MeetingRepository
    - SavingsRepository
    - LoanRepository
    - CorpusRepository
    - SyncQueueRepository
    - NavigationManager
    - ConnectivityObserver
    - LocalMeetingDao (SQLDelight)
    - SyncQueueDao (SQLDelight)
  shared_entities:
    - GroupMember (memberId, name, initials, role)
    - AttendanceStatus (enum: PRESENT, LATE, ABSENT)
    - SavingsEntry (memberId, groupAmount, individualAmount)
    - SavingsType (enum: GROUP_LINKED, INDIVIDUAL)
    - LoanSummary (loanId, memberId, memberName, memberInitials, principal, outstandingBalance, isOverdue, weekNumber, expectedWeeklyRepayment)
    - LoanApplication (id, memberId, memberName, requestedAmount, purpose)
    - LoanVote (enum: FOR, AGAINST, ABSTAIN)
    - PreviousMeetingSummary (meetingNumber, date, totalCollected, corpusAtClose, attendanceCount)
    - MeetingConductError

api:
  - id: get_previous_meeting_record
    method: GET
    path: /fineract-provider/api/v1/datatables/dt_meeting_record/{centerId}
    description: Fetch previous meeting summary for step 0 review
    auth: BasicAuth
    path_params:
      centerId: Int
    query_params:
      meetingNumber: "{{current - 1}}"
    response_ref: MeetingRecordDetail
    error_handling:
      404: Show "First meeting — no previous record" placeholder on step 0
      401: Redirect to login
      5xx: Show error, allow wizard to continue with empty step 0

  - id: get_group_members
    method: GET
    path: /fineract-provider/api/v1/centers/{centerId}
    description: Fetch center detail including group members list for attendance and savings steps
    auth: BasicAuth
    path_params:
      centerId: Int
    response_ref: CenterDetail
    error_handling:
      404: Show error banner, block wizard advance — members required
      401: Redirect to login

  - id: get_group_corpus
    method: GET
    path: /fineract-provider/api/v1/datatables/dt_group_corpus/{centerId}
    description: Fetch opening corpus balance for step 2 and corpus gate on step 5
    auth: BasicAuth
    path_params:
      centerId: Int
    response_ref: CorpusRecord
    error_handling:
      404: Default openingCorpus to 0, cashOnHand to 0
      5xx: Show warning chip on step 2

  - id: get_active_loans
    method: GET
    path: /fineract-provider/api/v1/loans
    description: Fetch active loans for group members for step 4 repayment entry
    auth: BasicAuth
    query_params:
      groupId: Int
      loanStatus: active
    response_ref: LoanListResponse
    error_handling:
      404: Show empty state on step 4 (no active loans)
      5xx: Show error chip on step 4

  - id: get_loan_votes
    method: GET
    path: /fineract-provider/api/v1/datatables/dt_loan_vote/{loanId}
    description: Fetch existing vote tally for each pending loan application (step 5)
    auth: BasicAuth
    path_params:
      loanId: String
    response_ref: LoanVoteRecord
    error_handling:
      404: Treat as no votes cast yet (votesFor=0, votesAgainst=0)

  - id: post_meeting_record
    method: POST
    path: /fineract-provider/api/v1/datatables/dt_meeting_record
    description: Create meeting record on submit — first in ordered submission sequence
    auth: BasicAuth
    body_ref: CreateMeetingRecordRequest
    response_ref: DataTableEntryResponse
    error_handling:
      400: Show validation error snackbar
      5xx: Queue entire meeting payload to SyncQueue

  - id: post_meeting_attendance
    method: POST
    path: /fineract-provider/api/v1/datatables/dt_meeting_attendance
    description: Record per-member attendance — one call per member on submit
    auth: BasicAuth
    body_ref: CreateAttendanceRequest
    response_ref: DataTableEntryResponse
    error_handling:
      5xx: Queue this member's attendance to SyncQueue

  - id: post_savings_transaction
    method: POST
    path: /fineract-provider/api/v1/savingsaccounts/{savingsId}/transactions
    description: Post savings deposit per member per savings type — one call per member per type
    auth: BasicAuth
    path_params:
      savingsId: String
    body_ref: SavingsTransactionRequest
    response_ref: SavingsTransactionResponse
    error_handling:
      5xx: Queue this transaction to SyncQueue

  - id: post_loan_repayment
    method: POST
    path: /fineract-provider/api/v1/loans/{loanId}/transactions
    description: Record loan repayment on submit — one call per repaid loan
    auth: BasicAuth
    path_params:
      loanId: String
    query_params:
      command: repayment
    body_ref: LoanRepaymentRequest
    response_ref: LoanTransactionResponse
    error_handling:
      5xx: Queue this repayment to SyncQueue

  - id: post_loan_disbursal
    method: POST
    path: /fineract-provider/api/v1/loans/{loanId}/transactions
    description: Disburse approved loan — one call per approved application on submit
    auth: BasicAuth
    path_params:
      loanId: String
    query_params:
      command: disburse
    body_ref: LoanDisbursalRequest
    response_ref: LoanTransactionResponse
    error_handling:
      400: Corpus gate should have blocked this — log and show error
      5xx: Queue to SyncQueue

  - id: patch_corpus
    method: PUT
    path: /fineract-provider/api/v1/datatables/dt_group_corpus/{centerId}
    description: Update corpus balance to closingCorpus after all transactions complete
    auth: BasicAuth
    path_params:
      centerId: Int
    body_ref: UpdateCorpusRequest
    response_ref: DataTableEntryResponse
    error_handling:
      5xx: Queue corpus update to SyncQueue (highest priority item)

dtos:
  MeetingRecordDetail:
    fields:
      - { name: meetingNumber, type: Int }
      - { name: actualDate, type: String }
      - { name: totalSavings, type: Long }
      - { name: totalRepayments, type: Long }
      - { name: totalLoansDisbursed, type: Long }
      - { name: totalFinesCollected, type: Long }
      - { name: closingCorpus, type: Long }
      - { name: attendanceCount, type: Int }
  CenterDetail:
    fields:
      - { name: id, type: Int }
      - { name: name, type: String }
      - { name: groups, type: "List<GroupSummary>" }
      - { name: activeClientMembers, type: "List<ClientMember>" }
  CorpusRecord:
    fields:
      - { name: centerId, type: Int }
      - { name: corpusBalance, type: Long }
      - { name: cashOnHand, type: Long }
      - { name: lastUpdatedMeeting, type: Int }
      - { name: lastUpdatedDate, type: String }
  LoanListResponse:
    fields:
      - { name: totalFilteredRecords, type: Int }
      - { name: pageItems, type: "List<LoanDetail>" }
  LoanDetail:
    fields:
      - { name: loanId, type: String }
      - { name: clientId, type: String }
      - { name: clientName, type: String }
      - { name: principal, type: Long }
      - { name: outstandingBalance, type: Long }
      - { name: isOverdue, type: Boolean }
      - { name: weekNumber, type: Int }
      - { name: numberOfRepayments, type: Int }
      - { name: expectedWeeklyRepayment, type: Long }
  LoanVoteRecord:
    fields:
      - { name: loanId, type: String }
      - { name: votesFor, type: Int }
      - { name: votesAgainst, type: Int }
      - { name: votesAbstain, type: Int }
  CreateMeetingRecordRequest:
    fields:
      - { name: centerId, type: Int }
      - { name: meetingNumber, type: Int }
      - { name: actualDate, type: String }
      - { name: openingCorpus, type: Long }
      - { name: closingCorpus, type: Long }
      - { name: totalSavingsCollected, type: Long }
      - { name: totalRepaymentsReceived, type: Long }
      - { name: totalLoansDisbursed, type: Long }
      - { name: totalFinesCollected, type: Long }
      - { name: attendanceCount, type: Int }
      - { name: locale, type: String, default: "en" }
      - { name: dateFormat, type: String, default: "dd MMMM yyyy" }
  CreateAttendanceRequest:
    fields:
      - { name: meetingId, type: String }
      - { name: memberId, type: String }
      - { name: status, type: String, values: [PRESENT, LATE, ABSENT] }
      - { name: fineAmount, type: Long }
      - { name: locale, type: String, default: "en" }
  SavingsTransactionRequest:
    fields:
      - { name: transactionDate, type: String }
      - { name: transactionAmount, type: Long }
      - { name: paymentTypeId, type: Int, note: "1=Cash" }
      - { name: locale, type: String, default: "en" }
      - { name: dateFormat, type: String, default: "dd MMMM yyyy" }
  SavingsTransactionResponse:
    fields:
      - { name: officeId, type: Int }
      - { name: savingsId, type: Long }
      - { name: resourceId, type: Long }
  LoanRepaymentRequest:
    fields:
      - { name: transactionDate, type: String }
      - { name: transactionAmount, type: Long }
      - { name: paymentTypeId, type: Int }
      - { name: locale, type: String, default: "en" }
      - { name: dateFormat, type: String, default: "dd MMMM yyyy" }
  LoanDisbursalRequest:
    fields:
      - { name: actualDisbursementDate, type: String }
      - { name: note, type: String }
      - { name: locale, type: String, default: "en" }
      - { name: dateFormat, type: String, default: "dd MMMM yyyy" }
  LoanTransactionResponse:
    fields:
      - { name: officeId, type: Int }
      - { name: loanId, type: Long }
      - { name: resourceId, type: Long }
  UpdateCorpusRequest:
    fields:
      - { name: corpusBalance, type: Long }
      - { name: lastUpdatedMeeting, type: Int }
      - { name: lastUpdatedDate, type: String }
      - { name: locale, type: String, default: "en" }
      - { name: dateFormat, type: String, default: "dd MMMM yyyy" }
  DataTableEntryResponse:
    fields:
      - { name: resourceId, type: Long }
      - { name: resourceIdentifier, type: String }

components:
  - id: top_app_bar
    type: top-app-bar
    name: MeetingConductTopBar
    description: Shows "Meeting #3" title, back/close icon, offline indicator badge
    style:
      title_text: "Meeting #{{meetingNumber}}"
      subtitle_text: "{{i18n['step' + currentStep + '_title']}} — Step {{currentStep + 1}} of 7"
      background: surface
    actions:
      - id: close_btn
        icon: FluentIcons.dismiss_24_regular
        content_description: "Close and return to calendar"
        on_click:
          action: NavigateBack
          target: meeting-calendar
      - id: offline_badge
        type: chip
        text: "Offline"
        visible_when: isOffline == true
        background: warningContainer
        text_color: onWarningContainer
    a11y:
      content_description: "Conducting Meeting #{{meetingNumber}}, step {{currentStep + 1}} of 7"
      role: toolbar
    test_context:
      purpose: Title shows correct meeting number; subtitle shows step name; offline badge visible when disconnected
      interaction_type: tap
      data_driven: true
      required_fields: [meetingNumber, currentStep, isOffline]
    on_click:
      action: NavigateBack
      target: meeting-calendar

  - id: step_stepper
    type: stepper
    name: MeetingWizardStepper
    description: Horizontal step indicator with 7 steps (0-indexed). Active step highlighted in primary green.
    style:
      orientation: horizontal
      active_color: primary
      completed_color: primaryContainer
      inactive_color: outlineVariant
      connector_color: outline
      step_size: 28dp
      margin_horizontal: 16dp
      margin_vertical: 8dp
    steps:
      - { index: 0, label: "Review", icon: FluentIcons.history_24_regular }
      - { index: 1, label: "Attendance", icon: FluentIcons.people_checkmark_24_regular }
      - { index: 2, label: "Balance", icon: FluentIcons.wallet_24_regular }
      - { index: 3, label: "Savings", icon: FluentIcons.piggy_bank_24_regular }
      - { index: 4, label: "Loans", icon: FluentIcons.money_24_regular }
      - { index: 5, label: "Apply", icon: FluentIcons.document_checkmark_24_regular }
      - { index: 6, label: "Close", icon: FluentIcons.checkmark_circle_24_regular }
    a11y:
      content_description: "Meeting wizard step {{currentStep + 1}} of 7: {{i18n['step' + currentStep + '_title']}}"
      role: progressbar
    test_context:
      purpose: Active step highlighted; completed steps show checkmark fill; tapping past steps does NOT navigate
      interaction_type: non_interactive
      data_driven: true
      required_fields: [currentStep]
    on_click: {}

  - id: corpus_band
    type: banner
    name: CorpusBand
    description: >
      Persistent horizontal band below stepper showing live corpus balance.
      Visible on steps 2-6. Updates in real-time as savings/repayments are entered.
      Shows warning color when corpus would go below zero on step 5.
    visible_when: currentStep >= 2
    style:
      background: tertiaryContainer
      padding_horizontal: 16dp
      padding_vertical: 8dp
    content:
      - { type: text, text: "Corpus: KES {{openingCorpus + runningSavingsTotal + totalRepayments - totalLoansDisbursed}}", text_style: labelLarge, color: onTertiaryContainer }
      - { type: text, text: "Cash on Hand: KES {{cashOnHand}}", text_style: labelMedium, color: onTertiaryContainer }
    a11y:
      content_description: "Group corpus fund KES {{openingCorpus + runningSavingsTotal + totalRepayments - totalLoansDisbursed}}, cash on hand KES {{cashOnHand}}"
    test_context:
      purpose: Corpus band visible on steps 2-6; updates live as savings/repayments entered; hidden on steps 0-1
      interaction_type: non_interactive
      data_driven: true
      required_fields: [openingCorpus, runningSavingsTotal, totalRepayments, totalLoansDisbursed, cashOnHand]
    on_click: {}

  # --- STEP 0: Previous Meeting Review ---
  - id: step0_previous_review
    type: step-content
    name: Step0PreviousMeetingReview
    step_index: 0
    description: Brief read-only summary of previous meeting. Link to full detail. Auto-advances on tap Next.
    visible_when: currentStep == 0
    layout: Column(padding=16dp)
    children:
      - id: prev_meeting_header
        type: text
        name: PrevMeetingHeader
        style:
          text: "Previous Meeting Summary"
          text_style: titleMedium
          color: onSurface
          margin_bottom: 12dp
        a11y: { content_description: "Previous meeting summary — Meeting #{{previousMeetingSummary.meetingNumber}}" }
        test_context:
          purpose: Header visible on step 0; shows meeting number from previousMeetingSummary
          interaction_type: non_interactive
          data_driven: true
          required_fields: [previousMeetingSummary]
        on_click: {}
      - id: prev_meeting_summary_card
        type: card
        name: PrevMeetingSummaryCard
        style:
          background: surfaceVariant
          corner_radius: md
          padding: 16dp
        content:
          - { type: info_row, label: "Meeting", value: "#{{previousMeetingSummary.meetingNumber}}" }
          - { type: info_row, label: "Date", value: "{{previousMeetingSummary.date}}" }
          - { type: info_row, label: "Total Collected", value: "KES {{previousMeetingSummary.totalCollected}}" }
          - { type: info_row, label: "Closing Corpus", value: "KES {{previousMeetingSummary.corpusAtClose}}" }
          - { type: info_row, label: "Attendance", value: "{{previousMeetingSummary.attendanceCount}}/{{groupMembers.size}}" }
        a11y:
          content_description: "Previous meeting #{{previousMeetingSummary.meetingNumber}}: KES {{previousMeetingSummary.totalCollected}} collected, corpus KES {{previousMeetingSummary.corpusAtClose}}"
        test_context:
          purpose: Demo — Meeting #3 data (KES 1,850 collected, corpus KES 12,400); 5/5 attendance
          interaction_type: non_interactive
          data_driven: true
          required_fields: [previousMeetingSummary, groupMembers]
        on_click: {}
      - id: no_prev_meeting_placeholder
        type: empty-state
        name: NoPreviousMeetingPlaceholder
        visible_when: previousMeetingSummary == null
        style:
          icon: FluentIcons.history_24_regular
          icon_tint: onSurfaceVariant
          title_text: "First Meeting"
          body_text: "No previous meeting data — this is the group's first meeting."
          padding: 24dp
        a11y: { content_description: "First meeting — no previous meeting record" }
        test_context:
          purpose: Empty state shown when no previous meeting exists (first meeting scenario)
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: view_full_previous_btn
        type: button
        name: ViewFullPreviousMeetingBtn
        visible_when: previousMeetingSummary != null
        style:
          type: OutlinedButton
          text_key: i18n.view_full_report
          min_height: 48dp
          margin_top: 12dp
        a11y:
          content_description: "View full previous meeting report for Meeting #{{previousMeetingSummary.meetingNumber}}"
          role: button
          min_touch_target: 48dp
        test_context:
          purpose: Tapping opens previous-meeting-review screen; hidden when no previous meeting
          interaction_type: tap
          data_driven: true
          required_fields: [previousMeetingSummary]
        on_click:
          action: ViewFullPreviousMeeting
          target: previous-meeting-review
          params: { meeting_id: "{{previousMeetingSummary.meetingNumber}}", center_id: "{{centerId}}" }

  # --- STEP 1: Attendance ---
  - id: step1_attendance
    type: step-content
    name: Step1Attendance
    step_index: 1
    description: Per-member attendance toggles (Present/Late/Absent) with auto-calculated fines
    visible_when: currentStep == 1
    layout: Column(padding=16dp)
    children:
      - id: attendance_header
        type: text
        name: AttendanceStepHeader
        style:
          text: "Record Attendance"
          text_style: titleMedium
          color: onSurface
          margin_bottom: 4dp
        a11y: { content_description: "Record attendance for all {{groupMembers.size}} members" }
        test_context:
          purpose: Attendance step header visible when currentStep == 1
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: fine_info_chip
        type: chip
        name: FineInfoChip
        style:
          text: "Late: KES 50 fine · Absent: KES 100 fine (FR-012)"
          background: warningContainer
          text_color: onWarningContainer
          margin_bottom: 12dp
        a11y: { content_description: "Fine policy: Late members are fined KES 50, Absent members KES 100" }
        test_context:
          purpose: Fine policy chip visible above member list; always shown on step 1
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: attendance_member_row
        type: list-item-input
        name: AttendanceMemberRow
        description: >
          Row per member in groupMembers: avatar + name + role pill on left,
          segmented toggle (Present/Late/Absent) on right.
          Fine chip auto-appears below toggle for Late/Absent with computed fine amount.
        repeats_for: groupMembers
        style:
          min_height: 64dp
          padding_horizontal: 0dp
          padding_vertical: 8dp
          divider: true
        leading:
          type: avatar
          initials: "{{member.initials}}"
          background: secondaryContainer
          size: 40dp
        content:
          - { type: text, text: "{{member.name}}", text_style: bodyLarge, color: onSurface }
          - { type: text, text: "{{member.role}}", text_style: labelSmall, color: primary }
        trailing:
          type: segmented_button
          segments:
            - { value: PRESENT, label: "Present", icon: FluentIcons.checkmark_16_filled }
            - { value: LATE, label: "Late", icon: FluentIcons.clock_16_regular }
            - { value: ABSENT, label: "Absent", icon: FluentIcons.dismiss_16_regular }
          selected: "{{attendanceMap[member.memberId]}}"
        fine_chip:
          visible_when: "attendanceMap[member.memberId] == LATE || attendanceMap[member.memberId] == ABSENT"
          text: "Fine: KES {{attendanceMap[member.memberId] == LATE ? lateFines[member.memberId] : absentFines[member.memberId]}}"
          background: errorContainer
          text_color: onErrorContainer
        a11y:
          content_description: "Attendance for {{member.name}} — currently {{attendanceMap[member.memberId] ?: 'not set'}}"
          role: group
          min_touch_target: 48dp
        test_context:
          purpose: >
            All 5 members shown; toggling LATE auto-shows KES 50 fine chip;
            toggling ABSENT shows KES 100 fine chip; PRESENT clears fine chip.
            All 5 must be set before Next advances.
          interaction_type: input
          data_driven: true
          required_fields: [groupMembers, attendanceMap]
        on_click:
          action: SetAttendance
          params: { member_id: "{{member.memberId}}", status: "{{selectedSegment}}" }
      - id: attendance_progress_chip
        type: chip
        name: AttendanceProgressChip
        style:
          text: "{{attendanceMap.size}}/{{groupMembers.size}} recorded"
          background: "{{attendanceMap.size == groupMembers.size ? primaryContainer : surfaceVariant}}"
          text_color: "{{attendanceMap.size == groupMembers.size ? onPrimaryContainer : onSurfaceVariant}}"
          margin_top: 12dp
        a11y: { content_description: "{{attendanceMap.size}} of {{groupMembers.size}} members attendance recorded" }
        test_context:
          purpose: Progress chip updates as attendance recorded; turns green when all recorded
          interaction_type: non_interactive
          data_driven: true
          required_fields: [attendanceMap, groupMembers]
        on_click: {}

  # --- STEP 2: Opening Balance ---
  - id: step2_opening_balance
    type: step-content
    name: Step2OpeningBalance
    step_index: 2
    description: Read-only display of corpus and cash on hand at meeting start. Confirmation step only.
    visible_when: currentStep == 2
    layout: Column(padding=16dp)
    children:
      - id: opening_balance_header
        type: text
        name: OpeningBalanceHeader
        style:
          text: "Opening Balance"
          text_style: titleMedium
          margin_bottom: 12dp
        a11y: { content_description: "Opening Balance at start of Meeting #{{meetingNumber}}" }
        test_context:
          purpose: Opening balance step header visible on step 2
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: corpus_balance_card
        type: card
        name: CorpusBalanceCard
        style:
          background: primaryContainer
          corner_radius: lg
          padding: 24dp
          margin_bottom: 12dp
        content:
          - { type: text, text: "Group Corpus Fund", text_style: labelLarge, color: onPrimaryContainer }
          - { type: text, text: "KES {{openingCorpus}}", text_style: displaySmall, color: onPrimaryContainer, font: "Noto Sans bold" }
          - { type: text, text: "At start of Meeting #{{meetingNumber}}", text_style: bodySmall, color: onPrimaryContainer }
        a11y: { content_description: "Group corpus fund KES {{openingCorpus}} at start of Meeting #{{meetingNumber}}" }
        test_context:
          purpose: Demo — corpus card shows KES 12,400; large display number; primaryContainer background
          interaction_type: non_interactive
          data_driven: true
          required_fields: [openingCorpus, meetingNumber]
        on_click: {}
      - id: cash_on_hand_card
        type: card
        name: CashOnHandCard
        style:
          background: surfaceVariant
          corner_radius: md
          padding: 16dp
        content:
          - { type: text, text: "Cash on Hand", text_style: labelLarge, color: onSurfaceVariant }
          - { type: text, text: "KES {{cashOnHand}}", text_style: headlineMedium, color: onSurface }
        a11y: { content_description: "Cash on hand KES {{cashOnHand}}" }
        test_context:
          purpose: Cash on hand card visible below corpus card; demo shows KES 2,000
          interaction_type: non_interactive
          data_driven: true
          required_fields: [cashOnHand]
        on_click: {}
      - id: opening_confirm_text
        type: text
        name: OpeningBalanceConfirmText
        style:
          text: "Confirm these balances are correct before proceeding. Tap Next to continue."
          text_style: bodySmall
          color: onSurfaceVariant
          margin_top: 12dp
          alignment: center
        a11y: { content_description: "Confirm balances are correct and tap Next to proceed to savings collection" }
        test_context:
          purpose: Helper text instructs user to confirm and tap Next
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}

  # --- STEP 3: Savings Collection ---
  - id: step3_savings_collection
    type: step-content
    name: Step3SavingsCollection
    step_index: 3
    description: Per-member savings input — mandatory group savings (min KES 200) + optional individual savings
    visible_when: currentStep == 3
    layout: Column(padding=16dp)
    children:
      - id: savings_header
        type: text
        name: SavingsStepHeader
        style:
          text: "Savings Collection"
          text_style: titleMedium
          margin_bottom: 4dp
        a11y: { content_description: "Record savings for each member" }
        test_context:
          purpose: Savings step header visible on step 3
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: min_contribution_chip
        type: chip
        name: MinContributionChip
        style:
          text: "Min. group savings: KES 200/member (FR-020)"
          background: secondaryContainer
          text_color: onSecondaryContainer
          margin_bottom: 12dp
        a11y: { content_description: "Minimum group savings is KES 200 per member per meeting" }
        test_context:
          purpose: Minimum contribution policy chip visible above member list
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: savings_member_row
        type: list-item-input
        name: SavingsMemberRow
        description: >
          Row per member: avatar + name, then two input fields:
          Group Savings (mandatory, min KES 200, max KES 10,000) and
          Individual Savings (optional). Running total banner updates on each input.
        repeats_for: groupMembers
        style:
          padding_vertical: 12dp
          divider: true
        leading:
          type: avatar
          initials: "{{member.initials}}"
          size: 40dp
          background: secondaryContainer
        content:
          - { type: text, text: "{{member.name}}", text_style: bodyLarge }
          - id: group_savings_input
            type: text_field
            label: "Group Savings (KES)"
            hint: "Min. 200"
            keyboard_type: number
            prefix: "KES"
            value: "{{savingsMap[member.memberId].groupAmount}}"
            error_text: "{{savingsMap[member.memberId].groupAmount < 200 && savingsMap[member.memberId].groupAmount > 0 ? i18n.min_contribution_error : null}}"
            style: { min_height: 48dp }
            a11y:
              content_description: "Group savings amount for {{member.name}}, minimum KES 200"
              min_touch_target: 48dp
            on_click:
              action: SetSavingsAmount
              params: { member_id: "{{member.memberId}}", type: GROUP_LINKED, amount: "{{inputValue}}" }
          - id: individual_savings_input
            type: text_field
            label: "Individual Savings (KES)"
            hint: "Optional"
            keyboard_type: number
            prefix: "KES"
            value: "{{savingsMap[member.memberId].individualAmount}}"
            style: { min_height: 48dp, margin_top: 8dp }
            a11y:
              content_description: "Individual savings amount for {{member.name}}, optional"
              min_touch_target: 48dp
            on_click:
              action: SetSavingsAmount
              params: { member_id: "{{member.memberId}}", type: INDIVIDUAL, amount: "{{inputValue}}" }
        a11y:
          content_description: "Savings entry for {{member.name}}"
          role: group
        test_context:
          purpose: >
            All 5 member rows; group savings < KES 200 shows error; savings > KES 10,000 shows error;
            running total banner updates in real-time as amounts entered
          interaction_type: input
          data_driven: true
          required_fields: [groupMembers, savingsMap]
        on_click: {}
      - id: running_total_band
        type: banner
        name: RunningTotalBand
        style:
          background: primaryContainer
          padding: 16dp
          margin_top: 8dp
        content:
          - { type: text, text: "Total Savings This Step:", text_style: labelMedium, color: onPrimaryContainer }
          - { type: text, text: "KES {{runningSavingsTotal}}", text_style: headlineSmall, color: onPrimaryContainer, font: "Noto Sans bold" }
        a11y: { content_description: "Running savings total for this meeting: KES {{runningSavingsTotal}}" }
        test_context:
          purpose: Running total updates in real-time as amounts entered; shows 0 when no amounts yet
          interaction_type: non_interactive
          data_driven: true
          required_fields: [runningSavingsTotal]
        on_click: {}

  # --- STEP 4: Loan Review ---
  - id: step4_loan_review
    type: step-content
    name: Step4LoanReview
    step_index: 4
    description: Active loans per member with repayment input and overdue flagging
    visible_when: currentStep == 4
    layout: Column(padding=16dp)
    children:
      - id: loan_review_header
        type: text
        name: LoanReviewHeader
        style:
          text: "Loan Review & Repayments"
          text_style: titleMedium
          margin_bottom: 12dp
        a11y: { content_description: "Review active loans and record repayments for each member" }
        test_context:
          purpose: Loan review step header visible on step 4
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: loan_review_row
        type: list-item-input
        name: LoanReviewRow
        description: >
          Row per active loan: member avatar, name, loan details (principal, outstanding, week),
          repayment input, penalty fine input for overdue loans.
          Overdue loans show red chip and fine input field.
        repeats_for: activeLoans
        style:
          padding_vertical: 12dp
          divider: true
        leading:
          type: avatar
          initials: "{{loan.memberInitials}}"
          size: 40dp
          background: "{{loan.isOverdue ? errorContainer : secondaryContainer}}"
        content:
          - { type: text, text: "{{loan.memberName}}", text_style: bodyLarge }
          - { type: text, text: "KES {{loan.principal}} loan · KES {{loan.outstandingBalance}} outstanding · Week {{loan.weekNumber}}/{{loan.numberOfRepayments}}", text_style: bodySmall, color: onSurfaceVariant }
          - id: overdue_chip
            type: chip
            text: "OVERDUE"
            background: errorContainer
            text_color: onErrorContainer
            visible_when: "loan.isOverdue == true"
          - id: repayment_input
            type: text_field
            label: "Repayment (KES)"
            hint: "Expected: KES {{loan.expectedWeeklyRepayment}}"
            keyboard_type: number
            prefix: "KES"
            value: "{{loanRepayments[loan.loanId]}}"
            error_text: "{{loanRepayments[loan.loanId] > loan.outstandingBalance ? i18n.repayment_exceeds_balance : null}}"
            style: { min_height: 48dp, margin_top: 8dp }
            a11y:
              content_description: "Loan repayment for {{loan.memberName}}, expected KES {{loan.expectedWeeklyRepayment}}"
              min_touch_target: 48dp
            on_click:
              action: SetLoanRepayment
              params: { loan_id: "{{loan.loanId}}", amount: "{{inputValue}}" }
          - id: fine_input
            type: text_field
            label: "Penalty Fine (KES)"
            hint: "0"
            keyboard_type: number
            prefix: "KES"
            value: "{{loanFines[loan.loanId]}}"
            visible_when: "loan.isOverdue == true"
            style: { min_height: 48dp, margin_top: 8dp }
            a11y:
              content_description: "Penalty fine for overdue loan — {{loan.memberName}}"
              min_touch_target: 48dp
            on_click:
              action: SetLoanFine
              params: { loan_id: "{{loan.loanId}}", fine_amount: "{{inputValue}}" }
        a11y:
          content_description: "Loan for {{loan.memberName}}: KES {{loan.outstandingBalance}} outstanding{{loan.isOverdue ? ', OVERDUE' : ''}}"
          role: group
        test_context:
          purpose: >
            Demo — Peter Otieno: KES 1,500 loan, KES 875 outstanding, week 4/12;
            overdue chip red if applicable; repayment > outstanding shows validation error;
            fine input appears only for overdue loans
          interaction_type: input
          data_driven: true
          required_fields: [activeLoans, loanRepayments, loanFines]
        on_click: {}
      - id: no_active_loans_placeholder
        type: empty-state
        name: NoActiveLoansPlaceholder
        visible_when: activeLoans.isEmpty()
        style:
          icon: FluentIcons.checkmark_circle_24_regular
          icon_tint: primary
          title_text: "No Active Loans"
          body_text: "No members currently have active loans. Tap Next to proceed."
          padding: 24dp
        a11y: { content_description: "No active loans for this group. Tap Next to proceed." }
        test_context:
          purpose: Empty state shown when no active loans; step still advances normally
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}

  # --- STEP 5: Loan Applications ---
  - id: step5_loan_applications
    type: step-content
    name: Step5LoanApplications
    step_index: 5
    description: Pending loan requests with group voting and chairperson approval. Corpus gate enforced.
    visible_when: currentStep == 5
    layout: Column(padding=16dp)
    children:
      - id: loan_app_header
        type: text
        name: LoanAppStepHeader
        style:
          text: "Loan Applications"
          text_style: titleMedium
          margin_bottom: 4dp
        a11y: { content_description: "Review and vote on pending loan applications" }
        test_context:
          purpose: Loan applications step header visible on step 5
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: corpus_gate_chip
        type: chip
        name: CorpusGateChip
        visible_when: totalLoansDisbursed > 0
        style:
          text: "Available to disburse: KES {{openingCorpus + runningSavingsTotal + totalRepayments + totalFinesCollected - totalLoansDisbursed}}"
          background: tertiaryContainer
          text_color: onTertiaryContainer
          margin_bottom: 12dp
        a11y: { content_description: "Available corpus for loan disbursement: KES {{openingCorpus + runningSavingsTotal + totalRepayments + totalFinesCollected - totalLoansDisbursed}}" }
        test_context:
          purpose: Corpus gate chip shows available balance when loans being approved; prevents over-disbursement
          interaction_type: non_interactive
          data_driven: true
          required_fields: [openingCorpus, runningSavingsTotal, totalRepayments, totalLoansDisbursed]
        on_click: {}
      - id: loan_application_card
        type: card
        name: LoanApplicationCard
        description: Card per pending application with vote buttons and chairperson approval action
        repeats_for: pendingLoanApplications
        style:
          background: surfaceVariant
          corner_radius: md
          padding: 16dp
          margin_bottom: 12dp
        content:
          - { type: text, text: "{{application.memberName}}", text_style: titleSmall, color: onSurface }
          - { type: text, text: "Requests KES {{application.requestedAmount}}", text_style: bodyLarge, color: onSurface }
          - { type: text, text: "Purpose: {{application.purpose}}", text_style: bodySmall, color: onSurfaceVariant }
          - id: vote_tally
            type: text
            text: "{{loanVotes[application.id].votesFor}} For · {{loanVotes[application.id].votesAgainst}} Against"
            text_style: labelMedium
            color: outline
            margin_top: 8dp
          - id: vote_row
            type: row
            children:
              - id: vote_for_btn
                type: button
                style:
                  type: OutlinedButton
                  text: "For"
                  icon: FluentIcons.thumbs_up_16_regular
                  selected_when: "loanVotes[application.id] == FOR"
                  selected_background: primaryContainer
                  min_height: 48dp
                a11y:
                  content_description: "Vote For loan application by {{application.memberName}} — KES {{application.requestedAmount}}"
                  min_touch_target: 48dp
                test_context:
                  purpose: For button updates vote tally; selected state shows primaryContainer background
                  interaction_type: tap
                  data_driven: true
                  required_fields: [loanVotes, pendingLoanApplications]
                on_click:
                  action: CastLoanVote
                  params: { loan_id: "{{application.id}}", vote: FOR }
              - id: vote_against_btn
                type: button
                style:
                  type: OutlinedButton
                  text: "Against"
                  icon: FluentIcons.thumbs_down_16_regular
                  selected_when: "loanVotes[application.id] == AGAINST"
                  selected_background: errorContainer
                  min_height: 48dp
                  margin_left: 8dp
                a11y:
                  content_description: "Vote Against loan application by {{application.memberName}}"
                  min_touch_target: 48dp
                test_context:
                  purpose: Against button updates vote tally; selected state shows errorContainer background
                  interaction_type: tap
                  data_driven: true
                  required_fields: [loanVotes]
                on_click:
                  action: CastLoanVote
                  params: { loan_id: "{{application.id}}", vote: AGAINST }
          - id: approve_btn
            type: button
            name: ApproveApplicationBtn
            style:
              type: FilledButton
              text: "Chairperson Approve"
              background: primary
              text_color: onPrimary
              min_height: 48dp
              full_width: true
              margin_top: 8dp
            enabled_when: "currentUserRole == CHAIRPERSON && loanVotes[application.id].votesFor > loanVotes[application.id].votesAgainst"
            a11y:
              content_description: "Approve loan application for {{application.memberName}} — KES {{application.requestedAmount}}. Requires chairperson role."
              role: button
              min_touch_target: 48dp
            test_context:
              purpose: >
                Approve button only enabled when currentUserRole == CHAIRPERSON and majority voted For;
                tapping checks corpus gate; disabled shows greyed state for non-chairpersons
              interaction_type: tap
              data_driven: true
              required_fields: [pendingLoanApplications, loanVotes, openingCorpus]
            on_click:
              action: ApproveLoanApplication
              params: { loan_id: "{{application.id}}" }
        a11y:
          content_description: "Loan application from {{application.memberName}} for KES {{application.requestedAmount}} — {{application.purpose}}"
          role: group
        test_context:
          purpose: Each pending application renders with vote tally and approve action; corpus gate chip updates
          interaction_type: tap
          data_driven: true
          required_fields: [pendingLoanApplications]
        on_click: {}
      - id: no_pending_loans_placeholder
        type: empty-state
        name: NoPendingLoansPlaceholder
        visible_when: pendingLoanApplications.isEmpty()
        style:
          icon: FluentIcons.document_checkmark_24_regular
          icon_tint: primary
          title_text: "No Pending Applications"
          body_text: "No loan applications to review this meeting. Tap Next to proceed."
          padding: 24dp
        a11y: { content_description: "No pending loan applications this meeting. Tap Next to proceed." }
        test_context:
          purpose: Empty state shown when no pending applications; step still advances normally
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}

  # --- STEP 6: Closing Balance ---
  - id: step6_closing_balance
    type: step-content
    name: Step6ClosingBalance
    step_index: 6
    description: Full meeting reconciliation summary and final submit button
    visible_when: currentStep == 6
    layout: Column(padding=16dp)
    children:
      - id: closing_header
        type: text
        name: ClosingBalanceHeader
        style:
          text: "Closing Balance & Reconciliation"
          text_style: titleMedium
          margin_bottom: 12dp
        a11y: { content_description: "Meeting reconciliation — closing balance for Meeting #{{meetingNumber}}" }
        test_context:
          purpose: Closing balance step header visible on step 6
          interaction_type: non_interactive
          data_driven: false
          required_fields: []
        on_click: {}
      - id: reconciliation_card
        type: card
        name: ReconciliationCard
        style:
          background: surfaceVariant
          corner_radius: md
          padding: 16dp
          margin_bottom: 16dp
        content:
          - { type: info_row, label: "Opening Corpus", value: "KES {{openingCorpus}}", value_style: bodyLarge }
          - { type: divider }
          - { type: info_row, label: "+ Group Savings", value: "KES {{runningSavingsTotal}}", value_color: primary }
          - { type: info_row, label: "+ Loan Repayments", value: "KES {{totalRepayments}}", value_color: primary }
          - { type: info_row, label: "+ Fines Collected", value: "KES {{totalFinesCollected}}", value_color: primary }
          - { type: info_row, label: "— Loans Disbursed", value: "KES {{totalLoansDisbursed}}", value_color: error }
          - { type: divider, weight: 2dp }
          - { type: info_row, label: "Closing Corpus", value: "KES {{closingCorpus}}", label_style: titleSmall, value_style: titleLarge, value_color: primary }
        a11y: { content_description: "Meeting reconciliation: opening KES {{openingCorpus}}, closing KES {{closingCorpus}}" }
        test_context:
          purpose: >
            All reconciliation rows shown with correct KES values;
            Demo: opening KES 12,400 + savings KES 1,000 + repayments KES 875 + fines KES 150 - loans KES 1,500 = closing KES 12,925
          interaction_type: non_interactive
          data_driven: true
          required_fields: [openingCorpus, runningSavingsTotal, totalRepayments, totalFinesCollected, totalLoansDisbursed, closingCorpus]
        on_click: {}
      - id: attendance_summary_chip_row
        type: row
        name: AttendanceSummaryRow
        style:
          margin_bottom: 12dp
          gap: 8dp
        children:
          - id: present_count_chip
            type: chip
            text: "{{attendanceMap.values.count { it == PRESENT }}}/{{groupMembers.size}} Present"
            background: primaryContainer
            text_color: onPrimaryContainer
            a11y: { content_description: "{{attendanceMap.values.count { it == PRESENT }}} of {{groupMembers.size}} members present" }
            test_context:
              purpose: Shows present count summary on closing step
              interaction_type: non_interactive
              data_driven: true
              required_fields: [attendanceMap, groupMembers]
            on_click: {}
          - id: fines_summary_chip
            type: chip
            text: "Fines: KES {{totalFinesCollected}}"
            background: warningContainer
            text_color: onWarningContainer
            a11y: { content_description: "Total fines collected KES {{totalFinesCollected}}" }
            test_context:
              purpose: Shows total fines collected on closing step
              interaction_type: non_interactive
              data_driven: true
              required_fields: [totalFinesCollected]
            on_click: {}
      - id: submit_meeting_btn
        type: button
        name: SubmitMeetingBtn
        style:
          type: FilledButton
          text_key: i18n.submit_meeting
          background: primary
          text_color: onPrimary
          min_height: 56dp
          full_width: true
          loading_when: isSubmitting
        enabled_when: "!isSubmitting"
        a11y:
          content_description: "Submit Meeting #{{meetingNumber}} — saves all attendance, savings, and loan data"
          role: button
          min_touch_target: 48dp
        test_context:
          purpose: >
            Submit button triggers all 6 API calls in sequence (or queues to SyncQueue if offline);
            shows loading spinner during isSubmitting;
            navigates to meeting-summary on 2xx
          interaction_type: tap
          data_driven: true
          required_fields: [closingCorpus, meetingNumber, isSubmitting]
        on_click:
          action: SubmitMeeting
          target: meeting-summary
          params: { meeting_id: "{{meetingId}}", meeting_number: "{{meetingNumber}}", center_id: "{{centerId}}" }
      - id: offline_submit_note
        type: text
        name: OfflineSubmitNote
        visible_when: isOffline == true
        style:
          text: "You're offline. Meeting data will be saved locally and synced when connected."
          text_style: bodySmall
          color: onSurfaceVariant
          margin_top: 8dp
          alignment: center
        a11y: { content_description: "Offline mode — meeting data will be queued and synced automatically when connected" }
        test_context:
          purpose: Offline note visible only when isOffline == true; reassures user data is safe
          interaction_type: non_interactive
          data_driven: true
          required_fields: [isOffline]
        on_click: {}

  # --- Navigation Footer ---
  - id: wizard_footer
    type: navigation-footer
    name: WizardNavigationFooter
    description: Sticky bottom bar with Back and Next/Submit buttons. Persists across all steps.
    style:
      background: surface
      elevation: 8dp
      padding: 16dp
      row_direction: true
    children:
      - id: back_footer_btn
        type: button
        name: BackFooterBtn
        style:
          type: OutlinedButton
          text: "Back"
          min_height: 48dp
          flex: 1
          visible_when: currentStep > 0
        a11y:
          content_description: "Go back to {{i18n['step' + (currentStep - 1) + '_title']}}"
          min_touch_target: 48dp
        test_context:
          purpose: Back button hidden on step 0; visible on steps 1-6; tapping decrements currentStep
          interaction_type: tap
          data_driven: true
          required_fields: [currentStep]
        on_click:
          action: PreviousStep
      - id: next_footer_btn
        type: button
        name: NextFooterBtn
        style:
          type: FilledButton
          text: "{{currentStep < 6 ? 'Next' : 'Submit Meeting'}}"
          background: primary
          text_color: onPrimary
          min_height: 48dp
          flex: 1
          margin_left: 8dp
          loading_when: isSubmitting
        a11y:
          content_description: "{{currentStep < 6 ? 'Next: ' + i18n['step' + (currentStep + 1) + '_title'] : 'Submit Meeting #' + meetingNumber}}"
          min_touch_target: 48dp
        test_context:
          purpose: >
            Next button advances step and runs validation; Submit text shown on step 6;
            triggers SubmitMeeting action on step 6; shows loading when isSubmitting
          interaction_type: tap
          data_driven: true
          required_fields: [currentStep, isSubmitting]
        on_click:
          action: "{{currentStep < 6 ? NextStep : SubmitMeeting}}"

  - id: step_validation_error_snackbar
    type: snackbar
    name: StepValidationErrorSnackbar
    description: Bottom snackbar for step validation failures (attendance incomplete, corpus insufficient, etc.)
    style:
      background: errorContainer
      text_color: onErrorContainer
      duration: 4000ms
    visible_when: stepValidationError != null
    content:
      text: "{{stepValidationError}}"
    a11y: { content_description: "Validation error: {{stepValidationError}}" }
    test_context:
      purpose: Snackbar appears for 4s on step validation failure; auto-dismisses; calls DismissError action
      interaction_type: non_interactive
      data_driven: true
      required_fields: [stepValidationError]
    on_click:
      action: DismissError

  - id: submit_error_snackbar
    type: snackbar
    name: SubmitErrorSnackbar
    description: Bottom snackbar shown when meeting submission fails (API error or timeout)
    style:
      background: errorContainer
      text_color: onErrorContainer
      duration: 6000ms
      action_text: "Retry"
      action_text_color: primary
    visible_when: submitError != null
    content:
      text: "{{submitError}}"
    a11y: { content_description: "Submission error: {{submitError}}. Tap Retry to try again." }
    test_context:
      purpose: Submit error snackbar has Retry action; retrying calls SubmitMeeting again
      interaction_type: tap
      data_driven: true
      required_fields: [submitError]
    on_click:
      action: SubmitMeeting

states:
  initial_state: loading
  loading:
    description: >
      Loading meeting data — all 5 API calls (previous meeting, members, corpus, loans, votes) in parallel.
      Skeleton shown on step content area.
    components_visible: [top_app_bar, step_stepper, loading_skeleton]
  content:
    description: >
      Wizard active — step content rendered per currentStep. corpus_band visible on steps 2-6.
      Navigation footer always visible.
    components_visible:
      - top_app_bar
      - step_stepper
      - corpus_band
      - step0_previous_review
      - step1_attendance
      - step2_opening_balance
      - step3_savings_collection
      - step4_loan_review
      - step5_loan_applications
      - step6_closing_balance
      - wizard_footer
    demo_data:
      meetingNumber: 4
      centerId: 7
      currentStep: 1
      openingCorpus: 12400
      cashOnHand: 2000
      groupMembers:
        - { memberId: "m1", name: "Amina Hassan", initials: "AH", role: "Chairperson" }
        - { memberId: "m2", name: "Peter Otieno", initials: "PO", role: "Treasurer" }
        - { memberId: "m3", name: "Grace Wanjiku", initials: "GW", role: "Secretary" }
        - { memberId: "m4", name: "John Mwangi", initials: "JM", role: "Member" }
        - { memberId: "m5", name: "Mary Akinyi", initials: "MA", role: "Member" }
      previousMeetingSummary:
        meetingNumber: 3
        date: "2026-04-28"
        totalCollected: 1850
        corpusAtClose: 12400
        attendanceCount: 5
  submitting:
    description: >
      API calls in flight after Submit tapped. Overlay with CircularProgressIndicator
      shown over step 6 content. Navigation footer buttons disabled.
    components_visible: [top_app_bar, step_stepper, corpus_band, step6_closing_balance, wizard_footer]
    overlay: CircularProgressIndicator centered with label "Submitting meeting..."
  submit_success:
    description: >
      Brief success toast then navigate to meeting-summary. No components rendered
      after navigation completes.
    components_visible: []
    toast: "Meeting #{{meetingNumber}} submitted successfully!"
    toast_duration: 2000ms
  submit_error:
    description: >
      API failure on submit — submitError snackbar shown with Retry action.
      If offline: optimistic success shown instead, data queued to SyncQueue.
    components_visible:
      - top_app_bar
      - step_stepper
      - step6_closing_balance
      - wizard_footer
      - submit_error_snackbar

i18n:
  step0_title: "Previous Meeting Review"
  step1_title: "Attendance"
  step2_title: "Opening Balance"
  step3_title: "Savings Collection"
  step4_title: "Loan Review"
  step5_title: "Loan Applications"
  step6_title: "Closing Balance"
  view_full_report: "View Full Report"
  submit_meeting: "Submit Meeting"
  next_btn: "Next"
  back_btn: "Back"
  fine_policy_label: "Late: KES 50 · Absent: KES 100"
  min_contribution_label: "Min. group savings: KES 200/member"
  min_contribution_error: "Below minimum KES 200 required"
  repayment_exceeds_balance: "Cannot exceed outstanding balance"
  offline_submit_note: "Offline — data queued for sync"
  corpus_label: "Corpus Fund"
  cash_on_hand_label: "Cash on Hand"
  reconciliation_title: "Reconciliation"
  closing_corpus_label: "Closing Corpus"
  submit_success_toast: "Meeting #{{meetingNumber}} submitted successfully!"
  submit_offline_toast: "Meeting saved offline — will sync when connected"
  attendance_incomplete: "Record attendance for all {{count}} members before proceeding"
  corpus_insufficient: "Corpus insufficient for this disbursement — available KES {{amount}}"

analytics:
  screen_viewed:
    event: screen_viewed
    params:
      screen_id: meeting-conduct
      flow: meeting-lifecycle-flow
  events:
    - name: meeting_started
      trigger: LoadMeetingData completes successfully
      params:
        meeting_number: Int
        center_id: Int
        member_count: Int
        opening_corpus: Long
    - name: step_advanced
      trigger: NextStep action completes validation and advances
      params:
        from_step: Int
        to_step: Int
        meeting_number: Int
        center_id: Int
    - name: attendance_recorded
      trigger: SetAttendance action called
      params:
        member_id: String
        status: "{ PRESENT | LATE | ABSENT }"
        meeting_number: Int
    - name: savings_recorded
      trigger: SetSavingsAmount action called with valid amount
      params:
        member_id: String
        type: "{ GROUP_LINKED | INDIVIDUAL }"
        amount: Long
        meeting_number: Int
    - name: loan_repayment_entered
      trigger: SetLoanRepayment action called
      params:
        loan_id: String
        amount: Long
        meeting_number: Int
    - name: loan_voted
      trigger: CastLoanVote action called
      params:
        loan_id: String
        vote: "{ FOR | AGAINST | ABSTAIN }"
        application_amount: Long
        meeting_number: Int
    - name: meeting_submitted
      trigger: SubmitMeeting action completes (online or offline)
      params:
        meeting_number: Int
        center_id: Int
        total_savings: Long
        total_repayments: Long
        total_fines: Long
        total_disbursed: Long
        closing_corpus: Long
        is_offline: Boolean
        member_count: Int
    - name: corpus_gate_triggered
      trigger: ApproveLoanApplication blocked by corpus insufficiency
      params:
        loan_id: String
        requested_amount: Long
        available_corpus: Long
        meeting_number: Int
