<!doctype html>
<!-- render-hash: r1-error-lrd-01 -->
<html lang="en" data-feature="loan-repayment-dialog" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-repayment-dialog · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dialog" style="background:rgba(0,0,0,.4);">
<main style="padding:0;display:flex;flex-direction:column;justify-content:flex-end;height:852px;">
  <div class="card" style="margin:0;border:none;border-radius:24px 24px 0 0;padding:24px 16px 32px;box-shadow:var(--shadow-base);">
    <div style="width:32px;height:4px;background:var(--border-default);border-radius:2px;margin:0 auto 16px;" aria-hidden="true"></div>
    <h2 style="font-size:18px;font-weight:600;color:var(--text-primary);margin-bottom:20px;">Record Repayment</h2>

    <div class="form-field">
      <label for="amt">Amount (KES)</label>
      <input id="amt" type="number" value="125.00" class="amount-input" inputmode="decimal" placeholder="0.00" data-action="OnAmountChanged" aria-invalid="true" style="border-color:var(--danger);">
    </div>

    <div class="form-field">
      <label>Payment Method</label>
      <div class="chip-row" role="radiogroup" aria-label="Payment Method">
        <button class="chip selected" role="radio" aria-checked="true" data-action="OnPaymentMethodSelected">M-Pesa</button>
        <button class="chip" role="radio" aria-checked="false" data-action="OnPaymentMethodSelected">Cash</button>
      </div>
    </div>

    <div class="form-field">
      <label for="ref">Reference Number (optional)</label>
      <input id="ref" type="text" placeholder="e.g. QJZ7X9A1BK" data-action="OnReferenceNumberChanged">
    </div>

    <div class="alert alert-danger" role="alert">
      <p style="color:var(--text-primary);">Could not record repayment. Please try again.</p>
    </div>

    <div class="btn-group" style="justify-content:flex-end;margin-top:8px;">
      <button class="btn btn-text" data-action="OnDismiss" data-nav-to="loan-detail" style="flex:0 0 auto;min-height:48px;">Cancel</button>
      <button class="btn btn-primary" data-action="OnSubmit" data-state-to="submitting" style="flex:0 0 auto;min-height:48px;border-radius:24px;">Record Repayment</button>
    </div>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
