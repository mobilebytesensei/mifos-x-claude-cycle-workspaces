<!doctype html>
<!-- render-hash: 9e45acf84b55 -->
<html lang="en" data-feature="loan-repayment-dialog" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-repayment-dialog · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dialog" style="background:rgba(0,0,0,.4);">
<main style="padding:0;display:flex;flex-direction:column;justify-content:flex-end;height:852px;">
  <div style="background:var(--bg-canvas);border-top-left-radius:24px;border-top-right-radius:24px;padding:24px 16px 32px;">
    <div style="width:32px;height:4px;background:var(--border-default);border-radius:2px;margin:0 auto 16px;"></div>
    <h2 style="font-size:18px;font-weight:600;margin-bottom:16px;">Record Repayment</h2>
    <div class="form-field"><label for="amt">Amount (KES)</label><input id="amt" type="number" value="125.00" class="amount-input" inputmode="decimal" placeholder="0.00"></div>
    <div class="form-field">
      <label>Payment Method</label>
      <div class="chip-row" role="radiogroup" aria-label="Payment Method">
        <button class="chip selected" role="radio" aria-checked="true" data-action="OnPaymentMethodSelected">M-Pesa</button>
        <button class="chip" role="radio" aria-checked="false" data-action="OnPaymentMethodSelected">Cash</button>
      </div>
    </div>
    <div class="form-field"><label for="ref">Reference Number (optional)</label><input id="ref" type="text" placeholder="e.g. QJZ7X9A1BK"></div>
    <p role="alert" style="color:var(--danger);font-size:12px;margin:0 0 12px;">Could not record repayment. Please try again.</p>
    <div class="btn-group" style="justify-content:flex-end;">
      <button class="btn btn-text" data-nav-to="loan-detail">Cancel</button>
      <button class="btn btn-primary" style="border-radius:9999px;" data-action="OnSubmit">Record Repayment</button>
    </div>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
