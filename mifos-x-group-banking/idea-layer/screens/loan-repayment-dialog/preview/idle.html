<!DOCTYPE html>
<html lang="en" data-feature="loan-repayment-dialog" data-state="idle" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-repayment-dialog · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dialog" style="background:rgba(0,0,0,.4);">
<main style="padding:0;display:flex;flex-direction:column;justify-content:flex-end;height:852px;">
  <div style="background:var(--bg-canvas);border-top-left-radius:24px;border-top-right-radius:24px;padding:24px 16px 32px;">
    <div style="width:32px;height:4px;background:var(--border-default);border-radius:2px;margin:0 auto 16px;"></div>
    <h2 style="font-size:18px;font-weight:600;margin-bottom:16px;">Record repayment</h2>
    <div class="card card-muted">
      <div class="kv-grid">
        <span class="k">Loan</span><span class="v text">Wanjiru Kamau · L-001</span>
        <span class="k">Outstanding</span><span class="v">KES 5,200</span>
        <span class="k">Due today</span><span class="v" style="color:var(--success);">KES 1,200</span>
      </div>
    </div>
    <div class="form-field"><label for="amt">Amount paid (KES)</label><input id="amt" type="number" value="1200" class="amount-input" inputmode="numeric"></div>
    <div class="form-field"><label for="method">Method</label>
      <select id="method"><option>Cash (at meeting)</option><option>M-Pesa</option><option>Bank transfer</option></select>
    </div>
    <div class="form-field"><label for="ref">Reference (optional)</label><input id="ref" type="text" placeholder="M-Pesa code, receipt #..."></div>
    <div class="btn-group">
      <button class="btn btn-secondary" data-action="cancel" data-nav-to="loan-detail">Cancel</button>
      <button class="btn btn-primary" data-action="confirm" data-nav-to="loan-detail">Record</button>
    </div>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
