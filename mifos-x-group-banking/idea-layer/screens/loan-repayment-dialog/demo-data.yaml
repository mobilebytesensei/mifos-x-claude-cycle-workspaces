sibling: demo-data
schema_version: "2.1.0"
feature_id: loan-repayment-dialog

entries:
  - dto: PaymentMethod
    count_hint: 2
    source_notes: >
      Payment methods available for loan repayments. M-Pesa is primary
      (paymentTypeId=1), cash is fallback (paymentTypeId=2). Rural
      offline-first — cash used when M-Pesa network unavailable. The chip
      group in ui.yaml is single-select, so exactly one of these two
      values is bound to LoanRepaymentDialogState.paymentMethod at any
      given moment; MPESA is the default.
    items:
      - values: [MPESA, CASH]
        labels:
          MPESA: "M-Pesa"
          CASH: "Cash"

  - dto: RepaymentTransactionRequest
    count_hint: 3
    source_notes: >
      Sample repayment request bodies for group-member weekly installments.
      Rural Kenya group-banking context — KES 500–1,200 per weekly installment
      based on principal and loan term. transactionDate uses Fineract's
      "dd MMMM yyyy" format; locale fixed to "en" per project convention.
      paymentTypeId 1 = MPESA (receiptNumber set to the M-Pesa receipt
      code), 2 = CASH (receiptNumber null). The first item matches the
      idle-state demo binding (amount 125.00 pre-filled from
      installmentAmount, but treasurer here records the full 700 KES
      installment).
    items:
      - transactionDate: "18 July 2026"
        transactionAmount: 700.0
        paymentTypeId: 1
        receiptNumber: "MPE2026071801"
        locale: "en"
        dateFormat: "dd MMMM yyyy"

      - transactionDate: "18 July 2026"
        transactionAmount: 1000.0
        paymentTypeId: 2
        receiptNumber: null
        locale: "en"
        dateFormat: "dd MMMM yyyy"

      - transactionDate: "18 July 2026"
        transactionAmount: 500.0
        paymentTypeId: 1
        receiptNumber: "MPE2026071802"
        locale: "en"
        dateFormat: "dd MMMM yyyy"

  - dto: RepaymentTransactionResponse
    count_hint: 1
    source_notes: >
      Successful repayment response for a group-member weekly installment
      (aligns with ui.yaml idle-state demo binding amount 125.00 → treasurer
      records a 700 KES M-Pesa repayment). Fineract returns officeId,
      clientId, loanId, resourceId per api.yaml response.fields shape.
      resourceId is the new transaction id the parent loan-detail screen
      uses to refresh the transaction history after RepaymentRecorded.
    items:
      - officeId: 1
        clientId: 1002
        loanId: 5002
        resourceId: 6002

