requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: loan-repayment-dialog

nav_params:
  loanId: { type: Long, required: true }
  memberId: { type: Long, required: true }
  installmentAmount: { type: Double, required: true }

state_model:
  LoanRepaymentDialogViewModel:
    state:
      name: LoanRepaymentDialogState
      fields:
        amount: { type: String, default: "\"\"", note: "Pre-filled from installmentAmount nav param" }
        paymentMethod: { type: PaymentMethod, default: "PaymentMethod.MPESA" }
        referenceNumber: { type: String, default: "\"\"" }
        isSubmitting: { type: Boolean, default: "false" }
        amountError: { type: "String?", default: "null" }
        submitError: { type: "String?", default: "null" }
    events:
      name: LoanRepaymentDialogEvent
      members:
        - { name: Dismiss }
        - { name: RepaymentRecorded, params: { loanId: Long } }
        - { name: ShowError, params: { message: String } }
    actions:
      name: LoanRepaymentDialogAction
      members:
        - { name: OnAmountChanged, params: { value: String }, trigger: "User edits amount field" }
        - { name: OnPaymentMethodSelected, params: { method: PaymentMethod }, trigger: "User selects payment method chip" }
        - { name: OnReferenceNumberChanged, params: { value: String }, trigger: "User edits reference number field" }
        - { name: OnSubmit, trigger: "Tap Record Repayment button" }
        - { name: OnDismiss, trigger: "Tap Cancel or outside dialog" }
    di:
      - LoanRepository
      - InputValidator

business_logic:
  kind: composite
  description: "Validates the treasurer-entered amount is a positive number within the outstanding balance, resolves paymentMethod to a Fineract paymentTypeId, then POSTs a repayment against m_loan via make_repayment; cmp-network-monitor gates submission offline, and the money move is idempotent so a retry after a timeout never double-posts."
  library_refs: [cmp-network-monitor]
  external_library_refs: [Store5, SQLDelight]
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: dialog_title
    type: text
    style: { text_style: titleLarge, color: onSurface }
    value: "{strings.dialog_title}"

  - id: amount_field
    type: text-field
    label: "{strings.amount_label}"
    placeholder: "{strings.amount_placeholder}"
    keyboard_type: number_decimal
    value: "{{amount}}"
    error: "{{amountError}}"
    accessibility_label: "{strings.amount_label}"
    on_change:
      action: OnAmountChanged
      action_contract:
        effect: transform_state
        description: "Updates the amount field in LoanRepaymentDialogState and clears amountError as the treasurer types; the InputValidator positive-number check runs here so an invalid entry surfaces inline before Record Repayment is enabled."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"
    style:
      corner_radius: 8dp
      min_touch_target: 48dp

  - id: payment_method_label
    type: text
    style: { text_style: labelMedium, color: onSurfaceVariant }
    value: "{strings.payment_method_label}"

  - id: payment_method_chips
    type: chip-group
    selection_mode: single
    accessibility_label: "{strings.payment_method_label}"
    chips:
      - id: chip_mpesa
        label: "{strings.mpesa_label}"
        value: MPESA  # i18n: skip
        selected_when: "paymentMethod == MPESA"
        accessibility_label: "{strings.mpesa_label}"
        on_click:
          action: OnPaymentMethodSelected
          params: { method: MPESA }
          state: selectedPaymentMethod
          action_contract:
            effect: transform_state
            description: "Sets paymentMethod to MPESA in LoanRepaymentDialogState so make_repayment later resolves paymentTypeId=1; pure in-VM selection with no network or persistence side-effect until the treasurer submits."
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: chip_cash
        label: "{strings.cash_label}"
        value: CASH  # i18n: skip
        selected_when: "paymentMethod == CASH"
        accessibility_label: "{strings.cash_label}"
        on_click:
          action: OnPaymentMethodSelected
          params: { method: CASH }
          state: selectedPaymentMethod
          action_contract:
            effect: transform_state
            description: "Sets paymentMethod to CASH in LoanRepaymentDialogState so make_repayment later resolves paymentTypeId=2; pure in-VM selection with no network or persistence side-effect until the treasurer submits."
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
    style:
      selected_background: primaryContainer
      selected_text_color: onPrimaryContainer
      unselected_background: surfaceVariant
      unselected_text_color: onSurfaceVariant
      gap: 8dp

  - id: reference_number_field
    type: text-field
    label: "{strings.reference_label}"
    placeholder: "{strings.reference_placeholder}"
    keyboard_type: text
    value: "{{referenceNumber}}"
    accessibility_label: "{strings.reference_label}"
    on_change:
      action: OnReferenceNumberChanged
      action_contract:
        effect: transform_state
        description: "Updates the optional referenceNumber in LoanRepaymentDialogState as the treasurer types the M-Pesa receipt code; carried verbatim into the make_repayment receiptNumber body field, no network call on change."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"
    style:
      corner_radius: 8dp
      min_touch_target: 48dp

  - id: submit_error_text
    type: text
    style: { text_style: bodySmall, color: error }
    value: "{{submitError}}"
    visible_when: "submitError != null"

  - id: dialog_actions_row
    type: row
    style:
      gap: 12dp
      padding: "8dp 0dp 0dp 0dp"
      arrangement: end
    content:
      - id: cancel_button
        type: button
        label: "{strings.cancel}"
        accessibility_label: "{strings.cancel}"
        style:
          type: text
          text_color: primary
          min_touch_target: 48dp
        on_click:
          action: OnDismiss
          action_contract:
            effect: navigate
            description: "Emits Dismiss and pops the repayment dialog back to the parent loan-detail screen without recording any transaction; discards the entered amount and reference number."
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: record_repayment_button
        type: button
        label: "{strings.submit}"
        loading_when: "isSubmitting"
        accessibility_label: "{strings.submit}"
        style:
          type: filled
          background: primary
          text_color: onPrimary
          corner_radius: 24dp
          min_touch_target: 48dp
        on_click:
          action: OnSubmit
          api: make_repayment
          action_contract:
            effect: call_api
            library_refs: [cmp-network-monitor]
            description: "Re-validates the amount then POSTs make_repayment (/loans/{loanId}/transactions?command=repayment) to record the payment against m_loan; cmp-network-monitor blocks submission when offline, and the idempotent money move guards against double-posting on retry, emitting RepaymentRecorded then dismissing on success."
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  idle:
    components:
      - dialog_title
      - amount_field
      - payment_method_label
      - payment_method_chips
      - reference_number_field
      - dialog_actions_row
    demo_data:
      amount: "125.00"
      paymentMethod: MPESA
      referenceNumber: ""
      isSubmitting: false
      amountError: null
      submitError: null
  submitting:
    components:
      - dialog_title
      - amount_field
      - payment_method_label
      - payment_method_chips
      - reference_number_field
      - dialog_actions_row
    description: "Record Repayment button shows loading indicator; inputs disabled"
  error:
    components:
      - dialog_title
      - amount_field
      - payment_method_label
      - payment_method_chips
      - reference_number_field
      - submit_error_text
      - dialog_actions_row
    description: "API or validation error displayed; user can correct and retry"

i18n:
  en:
    dialog_title: "Record Repayment"
    amount_label: "Amount (KES)"
    amount_placeholder: "0.00"
    payment_method_label: "Payment Method"
    mpesa_label: "M-Pesa"
    cash_label: "Cash"
    reference_label: "Reference Number (optional)"
    reference_placeholder: "e.g. QJZ7X9A1BK"
    cancel: "Cancel"
    submit: "Record Repayment"
    error_amount_required: "Please enter a repayment amount."
    error_amount_invalid: "Amount must be a valid positive number."
    error_amount_exceeds: "Amount cannot exceed the outstanding balance."
    error_server: "Could not record repayment. Please try again."
  sw:
    dialog_title: "Rekodi Malipo"
    amount_label: "Kiasi (KES)"
    payment_method_label: "Njia ya Malipo"
    mpesa_label: "M-Pesa"
    cash_label: "Taslimu"
    cancel: "Ghairi"
    submit: "Rekodi Malipo"
  fr:
    dialog_title: "Enregistrer un Remboursement"
    amount_label: "Montant (KES)"
    payment_method_label: "Mode de Paiement"
    cancel: "Annuler"
    submit: "Enregistrer"
  hi:
    dialog_title: "पुनर्भुगतान दर्ज करें"
    amount_label: "राशि (KES)"
    payment_method_label: "भुगतान विधि"
    cancel: "रद्द करें"
    submit: "दर्ज करें"
