sibling: tests
schema_version: "4.0"
feature_id: loan-repayment-dialog

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LRD-001
      scenario: "Valid M-Pesa repayment with receipt number posts successfully"
      type: ViewModel
      priority: P0
      given: "loanId=5001, amount=700.0, paymentMethod=MPESA, receiptNumber='MPE2026050901'"
      when: "user taps Confirm"
      then: "POST /loans/5001/transactions?command=repayment called with paymentTypeId=1; dialog dismisses; loan-list refreshes"

    - id: TC-LRD-002
      scenario: "Cash repayment without receipt number posts successfully"
      type: ViewModel
      priority: P0
      given: "loanId=5003, amount=500.0, paymentMethod=CASH, receiptNumber=null"
      when: "user taps Confirm"
      then: "POST called with paymentTypeId=2, receiptNumber=null; 200 response; success state"

    - id: TC-LRD-003
      scenario: "Amount exceeds outstanding balance shows validation error"
      type: ViewModel
      priority: P0
      given: "outstandingBalance=3000.0, amount=5000.0"
      when: "user enters amount > outstanding"
      then: "inline error shown: error_amount_exceeds_outstanding; Confirm disabled"

    - id: TC-LRD-004
      scenario: "Amount of 0 or empty disables Confirm button"
      type: Screen
      priority: P1
      given: "amount field empty or '0'"
      when: "user clears amount"
      then: "Confirm button disabled; no error snackbar"

    - id: TC-LRD-005
      scenario: "Payment method selector toggles between MPESA and CASH"
      type: Screen
      priority: P1
      given: "dialog open, default MPESA selected"
      when: "user taps CASH toggle"
      then: "paymentMethod=CASH; receipt number field hidden (not required for cash)"

    - id: TC-LRD-006
      scenario: "400 validation error from server shows specific error"
      type: ViewModel
      priority: P1
      given: "server returns 400 (amount exceeds principal)"
      when: "Confirm tapped"
      then: "error snackbar: error_amount_exceeds_outstanding; dialog stays open"

    - id: TC-LRD-007
      scenario: "Loading state disables Confirm while API in flight"
      type: Screen
      priority: P1
      given: "API call in progress"
      when: "Confirm tapped"
      then: "Confirm button disabled + spinner; Cancel still tappable"

    - id: TC-LRD-008
      scenario: "Offline prevents submission — shows no-queue message"
      type: ViewModel
      priority: P1
      given: "network.offline"
      when: "user taps Confirm"
      then: "error_offline_no_queue shown; no POST attempted"

    - id: TC-LRD-009
      scenario: "InputValidator rejects non-numeric amount input"
      type: UseCase
      priority: P2
      given: "amount='abc'"
      when: "InputValidator.validateAmount() called"
      then: "validation fails; Confirm disabled"

    - id: TC-LRD-010
      scenario: "LoanRepository.recordRepayment maps payload and calls Fineract correctly"
      type: Repository
      priority: P0
      given: "loanId=5001, memberId=1001, amount=700.0, paymentMethod='MPESA', referenceNumber='MPE001'"
      when: "recordRepayment() called"
      then: "POST body includes transactionAmount=700.0, paymentTypeId=1, receiptNumber='MPE001'"
