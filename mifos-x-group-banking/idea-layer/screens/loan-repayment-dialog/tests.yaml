sibling: tests
schema_version: "4.0"
feature_id: loan-repayment-dialog
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LRD-001
      scenario: "Dialog initialises with loanId and memberName from nav_params"
      type: ViewModel
      priority: P0
      given: "nav_params: loanId=10, memberName='Jane Wanjiru'"
      when: "LoanRepaymentDialog opens"
      then: "memberName='Jane Wanjiru' shown; repaymentAmount field empty; paymentMethod defaults to MPESA; isSubmitting=false"

    - id: TC-LRD-002
      scenario: "Amount field validates: non-numeric or zero shows inline error"
      type: ViewModel
      priority: P0
      given: "repaymentAmount field shown"
      when: "OnAmountChange('abc') then OnAmountChange('0')"
      then: "amountError set to non-zero message; submit button disabled in both cases"

    - id: TC-LRD-003
      scenario: "Valid amount clears amountError and enables submit"
      type: ViewModel
      priority: P0
      given: "amountError was set"
      when: "OnAmountChange('5000')"
      then: "amountError=null; repaymentAmount='5000'; submit button enabled"

    - id: TC-LRD-004
      scenario: "Payment method selector defaults to MPESA; user can switch to CASH"
      type: Screen
      priority: P1
      given: "dialog open"
      when: "OnPaymentMethodChange(PaymentMethod.CASH)"
      then: "selectedPaymentMethod=CASH; CASH option highlighted in selector"

    - id: TC-LRD-005
      scenario: "Reference number field appears when MPESA selected"
      type: Screen
      priority: P1
      given: "selectedPaymentMethod=MPESA"
      when: "dialog renders"
      then: "referenceNumber field visible and optional; hidden when CASH selected"

    - id: TC-LRD-006
      scenario: "OnConfirm calls POST /loans/{loanId}/transactions?command=repayment and emits RepaymentRecorded on success"
      type: ViewModel
      priority: P0
      given: "repaymentAmount='5000'; paymentMethod=MPESA; network online"
      when: "OnConfirm fires"
      then: "isSubmitting=true; POST /loans/10/transactions?command=repayment called with amount=5000; on 200 RepaymentRecorded emitted; Store5 loan cache refreshed; dialog closes"

    - id: TC-LRD-007
      scenario: "Server error on repayment POST shows submitError in dialog"
      type: ViewModel
      priority: P1
      given: "network online; server returns 500"
      when: "OnConfirm fires"
      then: "isSubmitting=false; submitError non-null; error message shown; dialog stays open"

    - id: TC-LRD-008
      scenario: "OnDismiss closes dialog without making any API call"
      type: ViewModel
      priority: P0
      given: "dialog open"
      when: "OnDismiss fires"
      then: "Dismiss event emitted; dialog closed; no API call made"

    - id: TC-LRD-009
      scenario: "Loading spinner shown on Confirm button while isSubmitting=true"
      type: Screen
      priority: P1
      given: "isSubmitting=true"
      when: "dialog renders"
      then: "Confirm button shows loading spinner; Cancel/Dismiss button disabled"
