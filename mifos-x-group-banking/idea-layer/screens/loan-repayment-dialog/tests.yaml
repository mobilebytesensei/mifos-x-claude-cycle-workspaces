sibling: tests
schema_version: "4.0"
feature_id: loan-repayment-dialog

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LRD-001
      scenario: "OnSubmit with M-Pesa and receipt number posts repayment, dismisses"
      type: ViewModel
      priority: P0
      given: "loanId=5001, amount='700.00', paymentMethod=MPESA, referenceNumber='MPE2026050901', online"
      when: "user taps Record Repayment (OnSubmit)"
      then: "POST /loans/5001/transactions?command=repayment fires with transactionAmount=700.0, paymentTypeId=1, receiptNumber='MPE2026050901'; RepaymentRecorded(5001) emitted; loan cache refreshed; dialog dismisses"

    - id: TC-LRD-002
      scenario: "Cash repayment with null reference posts with paymentTypeId=2"
      type: ViewModel
      priority: P0
      given: "loanId=5003, amount='500.00', paymentMethod=CASH, referenceNumber=''"
      when: "user taps Record Repayment (OnSubmit)"
      then: "POST fires with transactionAmount=500.0, paymentTypeId=2, receiptNumber=null; 200 response; RepaymentRecorded emitted"

    - id: TC-LRD-003
      scenario: "OnAmountChanged updates amount and clears amountError inline"
      type: ViewModel
      priority: P0
      given: "amountError='Amount must be a valid positive number.' present"
      when: "user types a valid amount (OnAmountChanged '250.00')"
      then: "state.amount='250.00'; amountError cleared; InputValidator positive-number check passes; no network call"

    - id: TC-LRD-004
      scenario: "Amount exceeding outstanding balance surfaces inline validation error"
      type: ViewModel
      priority: P0
      given: "outstandingBalance=3000.0, user enters amount='5000.00'"
      when: "OnAmountChanged fires validation"
      then: "amountError=error_amount_invalid/exceeds shown inline; record_repayment_button disabled"

    - id: TC-LRD-005
      scenario: "Blank or zero amount disables Record Repayment without a snackbar"
      type: Screen
      priority: P1
      given: "amount field cleared to '' or '0'"
      when: "user clears amount"
      then: "record_repayment_button disabled; no submit error snackbar; amount_field ready for re-entry"

    - id: TC-LRD-006
      scenario: "OnPaymentMethodSelected toggles MPESA and CASH chips"
      type: Screen
      priority: P1
      given: "dialog open, default paymentMethod=MPESA (chip_mpesa selected)"
      when: "user taps Cash chip (OnPaymentMethodSelected CASH)"
      then: "paymentMethod=CASH; chip_cash shows selected styling; chip_mpesa deselected; reference_number_field remains visible (optional)"

    - id: TC-LRD-007
      scenario: "OnReferenceNumberChanged updates optional receipt code in state"
      type: ViewModel
      priority: P2
      given: "referenceNumber='' , M-Pesa selected"
      when: "user types 'QJZ7X9A1BK' (OnReferenceNumberChanged)"
      then: "state.referenceNumber='QJZ7X9A1BK'; value carried verbatim into make_repayment receiptNumber body field; no network call on change"

    - id: TC-LRD-008
      scenario: "OnDismiss (Cancel) pops dialog discarding entered amount"
      type: ViewModel
      priority: P0
      given: "dialog open with amount='125.00' entered"
      when: "user taps Cancel (OnDismiss)"
      then: "Dismiss event emitted; navigates back to parent loan-detail; no repayment recorded; entered amount and reference discarded"

    - id: TC-LRD-009
      scenario: "400 validation error from server shows amount-exceeds error, dialog stays open"
      type: ViewModel
      priority: P1
      given: "server returns 400 (amount exceeds principal), OnSubmit fired"
      when: "response arrives"
      then: "submitError=error_amount_exceeds_outstanding shown in error state; dialog stays open for correction"

    - id: TC-LRD-010
      scenario: "404 Loan not found on submit shows specific error"
      type: ViewModel
      priority: P2
      given: "loanId references an unknown loan, OnSubmit fired"
      when: "server returns 404"
      then: "submitError=error_loan_not_found rendered; no RepaymentRecorded emitted"

    - id: TC-LRD-011
      scenario: "submitting state shows loading on Record Repayment, Cancel still tappable"
      type: Screen
      priority: P1
      given: "isSubmitting=true (repayment POST in flight)"
      when: "OnSubmit tapped and in progress"
      then: "record_repayment_button shows spinner and disabled; inputs disabled; cancel_button remains tappable"

    - id: TC-LRD-012
      scenario: "Offline blocks submission — cmp-network-monitor shows no-queue message"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor reports offline, form valid"
      when: "user taps Record Repayment (OnSubmit)"
      then: "submitError=error_offline_no_queue shown; no POST attempted; idempotent guard means a later retry never double-posts"

    - id: TC-LRD-013
      scenario: "InputValidator rejects non-numeric amount input"
      type: ViewModel
      priority: P2
      given: "amount='abc'"
      when: "InputValidator.validateAmount() runs on OnAmountChanged"
      then: "validation fails; amountError set; record_repayment_button stays disabled"

    - id: TC-LRD-014
      scenario: "LoanRepository.recordRepayment maps payload and resolves paymentTypeId"
      type: Repository
      priority: P0
      given: "loanId=5001, memberId=1001, amount=700.0, paymentMethod='MPESA', referenceNumber='MPE001'"
      when: "recordRepayment() called"
      then: "POST body includes transactionAmount=700.0, paymentTypeId=1, receiptNumber='MPE001', locale='en'; Flow emits Unit on 200"
