schema_version: "3.1"
id: member-list
name: Member List
description: >
  Paginated list of members belonging to a savings group. Each row shows the member's
  photo, name, role badge (chairperson/treasurer/secretary/member), savings balance,
  and loan status (active/none/overdue). Supports swipe-to-view-profile and FAB to
  add a new member. Covers FR-002.
feature: member-onboarding
flow: member-onboarding-flow
version: "1.0.0"
tags:
  - member-onboarding
  - admin
  - list
  - offline-first
  - FR-002

# Lifecycle
status: enriched
quality_score: 86
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system

# Navigation
entry_point: false
bottom_nav:
  visible: true
  selected_tab: groups
navigates_to:
  - member-profile
  - member-add
route: /groups/{groupId}/members
entry_points:
  - source: group-dashboard
    trigger: view_members_button
    params: { groupId: String }
nav_params:
  groupId: { type: String, required: true }

screens:
  - id: member-list-screen
    title: "Members"
    type: list
    description: Scrollable paginated list of group members with role badges and loan status

state_model:
  MemberListViewModel:
    state:
      name: MemberListState
      fields:
        isLoading: { type: Boolean, default: "true" }
        members: { type: "List<Member>", default: "emptyList()" }
        groupId: { type: String, default: '""' }
        groupName: { type: String, default: '""' }
        isLoadingMore: { type: Boolean, default: "false" }
        hasMorePages: { type: Boolean, default: "true" }
        currentOffset: { type: Int, default: "0" }
        error: { type: "MemberListError?", default: "null" }
        isRefreshing: { type: Boolean, default: "false" }
    screen_state:
      name: MemberListScreenState
      members: [Loading, Content, Error, Empty]
    errors:
      name: MemberListError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: MemberListEvent
      members:
        - { name: NavigateToMemberProfile, params: { memberId: String, groupId: String } }
        - { name: NavigateToAddMember, params: { groupId: String } }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: MemberListAction
      members:
        - { name: OnMemberClick, params: { memberId: String }, trigger: "Tap member row or swipe action" }
        - { name: OnAddMember, trigger: "Tap FAB" }
        - { name: OnLoadMore, trigger: "Scroll to end of list" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
        - { name: Retry, trigger: "Tap retry on error" }
        - { name: OnBack, trigger: "Tap back" }
    di:
      - MemberRepository
      - GroupRepository
      - NetworkMonitor

flow_logic:
  on_load:
    - action: load_members
      api: get_group_members
      params: { groupId: nav_params.groupId, limit: 20, offset: 0 }
      on_success: show_content
      on_empty: show_empty
      on_error: show_error
  on_load_more:
    - condition: "hasMorePages && !isLoadingMore"
      action: load_members
      api: get_group_members
      params: { groupId: nav_params.groupId, limit: 20, offset: currentOffset }
      append: true
  on_member_click:
    - navigate: member-profile
      params: { memberId: "{member.id}", groupId: "{groupId}" }
  on_add_member:
    - navigate: member-add
      params: { groupId: "{groupId}" }
  on_refresh:
    - action: load_members
      invalidate_cache: true
      reset_pagination: true

dependencies:
  repositories:
    - name: MemberRepository
      methods:
        - getGroupMembers(groupId: String, limit: Int, offset: Int): Flow<PaginatedResult<Member>>
    - name: GroupRepository
      methods:
        - getGroupName(groupId: String): Flow<String>
  services:
    - NetworkMonitor
  local_db:
    - table: members
      schema: SQLDelight Member entity

api:
  - id: get_group_members
    function: get_group_members
    method: get
    endpoint: "/groups/{groupId}/clients"
    description: Fetch paginated list of clients (members) belonging to the group
    params:
      groupId: { type: Long, required: true, source: nav_params }
      limit: { type: Int, default: 20 }
      offset: { type: Int, default: 0 }
    response:
      type: object
      fields:
        totalFilteredRecords: Int
        pageItems:
          type: array
          items:
            id: Long
            displayName: String
            status: { id: Int, value: String }
            mobileNo: String
            imagePresent: Boolean
            savingsAccountBalance: Double
            loanStatus: String    # ACTIVE | NONE | OVERDUE
    errors:
      401: Unauthorized
      403: Forbidden
      404: Group not found
      500: Server error
    cache:
      ttl: 120
      strategy: stale-while-revalidate
      offline: show_cached
    pagination:
      type: offset
      page_size: 20

dtos:
  Member:
    id: String
    fineractClientId: Long
    displayName: String
    photoUri: String?
    role: MemberRole       # CHAIRPERSON | TREASURER | SECRETARY | MEMBER
    savingsBalance: Double
    loanStatus: LoanStatus # ACTIVE | NONE | OVERDUE

  MemberRole:
    values: [CHAIRPERSON, TREASURER, SECRETARY, MEMBER]

  LoanStatus:
    values: [ACTIVE, NONE, OVERDUE]

components:
  - id: top_bar
    type: top-bar
    title: "Members"
    subtitle: "{{groupName}}"
    style:
      background: primary
      text_color: onPrimary
    navigation_icon: arrow_back
    on_navigation_click: { action: OnBack }
    test_context:
      purpose: "Show screen title and parent group name; back navigation"
      interaction_type: tap
      data_driven: true
      required_fields: [groupName]

  - id: member_list_item
    type: list-item
    style:
      min_touch_target: 72dp
      divider: true
      swipe_action:
        direction: start_to_end
        label: "View Profile"
        icon: person
        background: primaryContainer
    content:
      leading:
        id: member_avatar
        type: avatar
        image_url: "{{member.photoUri}}"
        fallback_initials: "{{member.displayName | initials}}"
        size: 48dp
        style: { background: secondaryContainer, text_color: onSecondaryContainer }
      headline:
        id: member_name_text
        type: text
        style: { text_style: bodyLarge, color: onSurface }
        value: "{{member.displayName}}"
      supporting:
        id: member_savings_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "Savings: KES {{member.savingsBalance | number}}"
      trailing:
        id: member_status_column
        type: column
        children:
          - id: role_chip
            type: chip
            label: "{{member.role}}"
            style:
              CHAIRPERSON: { background: primaryContainer, text_color: onPrimaryContainer }
              TREASURER: { background: secondaryContainer, text_color: onSecondaryContainer }
              SECRETARY: { background: tertiaryContainer, text_color: onTertiaryContainer }
              MEMBER: { background: surfaceVariant, text_color: onSurfaceVariant }
          - id: loan_status_badge
            type: badge
            label: "{{member.loanStatus}}"
            style:
              ACTIVE: { background: "#C8E6C9", text_color: "#1B5E20" }
              NONE: { background: surfaceVariant, text_color: onSurfaceVariant }
              OVERDUE: { background: "#FFCDD2", text_color: "#B71C1C" }
    on_click: { action: OnMemberClick, params: { memberId: "{{member.id}}" }, target: member-profile }
    on_swipe: { action: OnMemberClick, params: { memberId: "{{member.id}}" }, target: member-profile }
    test_context:
      purpose: "Display member summary; tap or swipe navigates to member profile"
      interaction_type: tap_and_swipe
      data_driven: true
      required_fields: [member.displayName, member.role, member.savingsBalance, member.loanStatus]

  - id: add_member_fab
    type: fab
    icon: person_add
    label: "Add Member"
    style:
      background: primary
      icon_color: onPrimary
      min_touch_target: 56dp
      position: bottom_end
    on_click: { action: OnAddMember, target: member-add }
    test_context:
      purpose: "Navigate to member add form"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: load_more_indicator
    type: loading-indicator
    variant: linear
    visible: "{{isLoadingMore}}"
    style: { color: primary }
    test_context:
      purpose: "Show progress while fetching next page of members"
      interaction_type: static
      data_driven: true
      required_fields: [isLoadingMore]

  - id: shimmer_list
    type: shimmer
    count: 6
    style: { height: 72dp, corner_radius: 4dp, background: surfaceVariant }
    test_context:
      purpose: "Loading skeleton while first page is fetched"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: empty_state
    type: empty-state
    icon: group_add
    title: "No members yet"
    body: "Add the first member to this group."
    cta_label: "Add Member"
    on_click: { action: OnAddMember, target: member-add }
    test_context:
      purpose: "Guide admin to add the first member"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "Could not load members"
    body: "{{error.message}}"
    cta_label: "Retry"
    on_click: { action: Retry, state: reload }
    test_context:
      purpose: "Show error and retry on API failure"
      interaction_type: tap
      data_driven: true
      required_fields: [error.message]

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_list]
    description: "Fetching first page of members"
  content:
    components: [top_bar, member_list_item, load_more_indicator, add_member_fab]
    description: "Paginated list visible; FAB always visible"
    demo_data:
      groupName: "Mwangaza Women's Group"
      members:
        - displayName: "Amina Wanjiru"
          photoUri: null
          role: TREASURER
          savingsBalance: 3500.00
          loanStatus: NONE
        - displayName: "Joseph Kamau"
          photoUri: null
          role: CHAIRPERSON
          savingsBalance: 4200.00
          loanStatus: ACTIVE
        - displayName: "Grace Achieng"
          photoUri: null
          role: SECRETARY
          savingsBalance: 2800.00
          loanStatus: NONE
        - displayName: "Peter Otieno"
          photoUri: null
          role: MEMBER
          savingsBalance: 1500.00
          loanStatus: OVERDUE
        - displayName: "Mary Njeri"
          photoUri: null
          role: MEMBER
          savingsBalance: 2000.00
          loanStatus: NONE
  empty:
    components: [top_bar, empty_state, add_member_fab]
    description: "No members; prompt to add"
  error:
    components: [top_bar, error_state]
    description: "API error with retry"

i18n:
  en:
    screen_title: "Members"
    savings_label: "Savings: KES {{amount}}"
    role_chairperson: "Chairperson"
    role_treasurer: "Treasurer"
    role_secretary: "Secretary"
    role_member: "Member"
    loan_active: "Active"
    loan_none: "No Loan"
    loan_overdue: "Overdue"
    fab_label: "Add Member"
    swipe_label: "View Profile"
    empty_title: "No members yet"
    empty_body: "Add the first member to this group."
    empty_cta: "Add Member"
    error_network: "No internet. Showing cached members."
    error_server: "Server error. Please retry."
    error_auth: "Session expired."

analytics:
  screen_view: member_list_viewed
  events:
    - trigger: member tap
      name: member_selected
      params: { member_id: String, role: String }
    - trigger: swipe action
      name: member_profile_swiped
      params: { member_id: String }
    - trigger: FAB tap
      name: add_member_initiated
      params: { group_id: String }
    - trigger: load more
      name: member_list_paginated
      params: { page: Int }
