sibling: tests
schema_version: "4.0"
feature_id: meeting-calendar

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MCL-001
      scenario: "LoadMeetings on mount fetches meetings and records, renders content"
      type: ViewModel
      priority: P0
      given: "centerId=1, network online"
      when: "screen enters composition (LoadMeetings)"
      then: "GET /centers/1/meetings and GET /datatables/dt_meeting_record/1 both called; MeetingListItem list populated; isLoading=false; content state"

    - id: TC-MCL-002
      scenario: "loading state shows skeleton shimmer while fetch in flight"
      type: Screen
      priority: P1
      given: "isLoading=true, no cached meetings yet"
      when: "screen mounts before API responds"
      then: "loading_skeleton (4 items) rendered under top_app_bar; no meeting cards yet"

    - id: TC-MCL-003
      scenario: "upcoming_meeting_card pinned at top with Start Meeting CTA"
      type: Screen
      priority: P0
      given: "content state with a MeetingListItem status=UPCOMING (meetingNumber=3, date='Wednesday, 7 May 2026')"
      when: "content renders"
      then: "upcoming_meeting_card pinned at top showing 'Meeting #3' and 'Upcoming' chip; start_meeting_btn enabled, primary background"

    - id: TC-MCL-004
      scenario: "StartMeeting navigates to meeting-conduct with meeting params"
      type: ViewModel
      priority: P0
      given: "upcoming meeting meetingId='mtg-003', meetingNumber=3, centerId=1"
      when: "user taps Start Meeting (StartMeeting)"
      then: "NavigateToConduct event drives navigation to meeting-conduct passing meeting_id='mtg-003', meeting_number=3, center_id=1; no Fineract mutation at tap"

    - id: TC-MCL-005
      scenario: "OpenPastMeeting on a completed row navigates to previous-meeting-review"
      type: ViewModel
      priority: P0
      given: "meeting_list_item status=COMPLETED, meetingId='mtg-002', meetingNumber=2, centerId=1"
      when: "user taps a past meeting row (OpenPastMeeting)"
      then: "NavigateToReview event drives navigation to previous-meeting-review with meeting_id, meeting_number, center_id; read-only drill-down, no write"

    - id: TC-MCL-006
      scenario: "ToggleViewMode flips LIST and CALENDAR without a network call"
      type: ViewModel
      priority: P1
      given: "content state, viewMode=ViewMode.LIST"
      when: "user taps toggle_view_btn (ToggleViewMode)"
      then: "viewMode=ViewMode.CALENDAR; same cached meetings re-render in calendar layout; no API call and no persistence"

    - id: TC-MCL-007
      scenario: "Completed meeting row shows attendance count and collected amount"
      type: Screen
      priority: P1
      given: "MeetingListItem meetingNumber=2, status=COMPLETED, attendanceCount=5, totalCollectedKES=1850"
      when: "past meeting row renders"
      then: "'5/5 present' and 'KES 1,850' shown; COMPLETED chip styled successContainer"

    - id: TC-MCL-008
      scenario: "MISSED meeting shows missed chip and no CTA"
      type: Screen
      priority: P1
      given: "MeetingListItem status=MISSED (meetingNumber=1), attendanceCount=null"
      when: "row renders"
      then: "MISSED chip styled errorContainer visible; no action button; null attendanceCount handled gracefully"

    - id: TC-MCL-009
      scenario: "404 from get_center_meetings shows empty state"
      type: Screen
      priority: P1
      given: "GET /centers/1/meetings returns 404, no cached data"
      when: "screen mounts"
      then: "empty state rendered — 'No Meetings Yet' with calendar_empty icon; no meeting cards"

    - id: TC-MCL-010
      scenario: "5xx with cache present shows content_with_error banner over cached data"
      type: ViewModel
      priority: P1
      given: "server returns 500, SQLDelight cache has previous meetings"
      when: "get_center_meetings fails"
      then: "cached meetings rendered; content_with_error state — error_banner 'Showing cached meetings' with Retry"

    - id: TC-MCL-011
      scenario: "Offline (cmp-network-monitor) serves cached meetings stale-while-revalidate"
      type: ViewModel
      priority: P1
      given: "network.offline, cached MeetingListItem list present"
      when: "screen mounts"
      then: "cached meetings rendered via stale-while-revalidate; error_banner shown; Start Meeting CTA still enabled for upcoming"

    - id: TC-MCL-012
      scenario: "RefreshMeetings Retry re-fetches network-first and replaces cache"
      type: ViewModel
      priority: P1
      given: "content_with_error state, error_banner visible, connectivity restored"
      when: "user taps Retry (RefreshMeetings)"
      then: "get_center_meetings re-fetched network-first gated by cmp-network-monitor; SQLDelight-cached list replaced; error_banner cleared; isRefreshing toggles"

    - id: TC-MCL-013
      scenario: "401 from get_center_meetings navigates to login"
      type: ViewModel
      priority: P2
      given: "expired session, on_mount fetch"
      when: "server returns 401"
      then: "navigate to login per data-flow error path; no meetings rendered"

    - id: TC-MCL-014
      scenario: "get_meeting_records_datatable 404 continues with empty records list"
      type: ViewModel
      priority: P2
      given: "centerId=1, meetings present but no completed records yet"
      when: "GET /datatables/dt_meeting_record/1 returns 404"
      then: "records treated as empty; upcoming meetings still render; no error surfaced"

    - id: TC-MCL-015
      scenario: "empty state shown when both meetings and records lists are empty"
      type: Screen
      priority: P1
      given: "get_center_meetings returns [] and get_meeting_records returns []"
      when: "content resolves"
      then: "empty_state rendered — 'No Meetings Yet' / 'Meetings will appear here once scheduled'"

    - id: TC-MCL-016
      scenario: "MeetingRepository merges meetings with records for enriched display"
      type: Repository
      priority: P0
      given: "5 MeetingListItems + 3 MeetingRecordItems for the center"
      when: "getEnrichedMeetings() called"
      then: "returns 5 items; completed ones have totalCollectedKES and attendanceCount populated from matching MeetingRecordItem by meetingNumber"
