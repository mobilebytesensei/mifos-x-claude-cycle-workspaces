sibling: tests
schema_version: "4.0"
feature_id: meeting-calendar

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MCL-001
      scenario: "On mount, fetches meetings and meeting records, renders content state"
      type: ViewModel
      priority: P0
      given: "centerId=1, network online"
      when: "screen mounts"
      then: "GET /centers/1/meetings and GET /datatables/dt_meeting_record/1 both called; MeetingListItem list populated"

    - id: TC-MCL-002
      scenario: "Upcoming meeting pinned at top with 'Start Meeting' CTA enabled"
      type: Screen
      priority: P0
      given: "MeetingListItem with status=UPCOMING (meetingNumber=5, date=2026-05-12)"
      when: "list renders"
      then: "upcoming card pinned at top; 'Start Meeting' button enabled and highlighted primary green"

    - id: TC-MCL-003
      scenario: "Tapping upcoming meeting card navigates to meeting-conduct"
      type: Screen
      priority: P0
      given: "status=UPCOMING, meetingId='MTG-2026-05-12', meetingNumber=5, centerId=1"
      when: "user taps upcoming meeting card"
      then: "navigate to meeting-conduct with meeting_id, meeting_number, center_id params"

    - id: TC-MCL-004
      scenario: "Tapping completed meeting card navigates to previous-meeting-review"
      type: Screen
      priority: P0
      given: "status=COMPLETED, meetingId='MTG-2026-05-05'"
      when: "user taps completed meeting card"
      then: "navigate to previous-meeting-review with meeting params"

    - id: TC-MCL-005
      scenario: "MISSED meeting shows missed indicator — no CTA"
      type: Screen
      priority: P1
      given: "MeetingListItem with status=MISSED (meetingNumber=3)"
      when: "card renders"
      then: "MISSED chip visible; no action button; attendanceCount null handled gracefully"

    - id: TC-MCL-006
      scenario: "Monthly navigation back/forward loads meetings for selected month"
      type: ViewModel
      priority: P1
      given: "current month = May 2026"
      when: "user taps previous month arrow"
      then: "GET /centers/{centerId}/meetings called with fromDate=2026-04-01, toDate=2026-04-30"

    - id: TC-MCL-007
      scenario: "Offline shows cached meetings with stale banner"
      type: ViewModel
      priority: P1
      given: "network.offline, cached MeetingListItem present"
      when: "screen mounts"
      then: "cached meetings rendered; offline banner shown; 'Start Meeting' CTA enabled for upcoming"

    - id: TC-MCL-008
      scenario: "No meetings scheduled shows empty state"
      type: Screen
      priority: P1
      given: "GET /centers/{centerId}/meetings returns 404"
      when: "screen mounts"
      then: "empty state: 'Next meeting not scheduled'; no meeting cards"

    - id: TC-MCL-009
      scenario: "Server 5xx uses cached data with error banner"
      type: ViewModel
      priority: P1
      given: "server returns 500, cache has previous meetings"
      when: "fetch fails"
      then: "cached data shown; error banner: error_server_use_cached"

    - id: TC-MCL-010
      scenario: "Completed meeting shows attendanceCount and totalCollectedKES"
      type: Screen
      priority: P1
      given: "MeetingRecordItem meetingNumber=4, attendanceCount=5, totalSavings=1500"
      when: "card renders"
      then: "attendance count badge and KES 1,500 collected both displayed"

    - id: TC-MCL-011
      scenario: "MeetingRepository merges meetings list with records for enriched display"
      type: Repository
      priority: P0
      given: "5 MeetingListItems + 3 MeetingRecordItems"
      when: "getEnrichedMeetings() called"
      then: "returns 5 items; completed ones have totalCollectedKES populated from records"
