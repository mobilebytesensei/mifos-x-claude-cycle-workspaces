sibling: tests
schema_version: "4.0"
feature_id: meeting-calendar
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MC-001
      scenario: "On mount, meetings load for groupId from MeetingRepository and populate calendar"
      type: ViewModel
      priority: P0
      given: "groupId=1; network online"
      when: "MeetingCalendarScreen enters composition"
      then: "MeetingRepository.getMeetings(groupId=1) called; meetings list populated; selectedView=CALENDAR; MeetingCalendarScreenState=Content"

    - id: TC-MC-002
      scenario: "Calendar view shows meeting dots on scheduled dates"
      type: Screen
      priority: P0
      given: "Content state; meetings=[{date:'2026-07-20'}, {date:'2026-07-27'}]"
      when: "CalendarView renders"
      then: "2026-07-20 and 2026-07-27 show meeting dot indicators; other dates empty"

    - id: TC-MC-003
      scenario: "OnViewChange to LIST shows chronological meetings list"
      type: Screen
      priority: P1
      given: "selectedView=CALENDAR"
      when: "OnViewChange(MeetingView.LIST) fires"
      then: "selectedView=LIST; meetings list visible sorted by date; CalendarView hidden"

    - id: TC-MC-004
      scenario: "Tapping a calendar date shows meetings for that date in bottom sheet"
      type: ViewModel
      priority: P0
      given: "Content state; 2026-07-20 has 1 meeting"
      when: "OnDateSelect('2026-07-20') fires"
      then: "selectedDate='2026-07-20'; day meetings bottom sheet shows 1 meeting row"

    - id: TC-MC-005
      scenario: "Start Meeting button visible on today's scheduled meeting row for ORGANIZER"
      type: Screen
      priority: P0
      given: "meeting.date=today; userRole=ORGANIZER"
      when: "meeting row renders"
      then: "Start Meeting button shown; non-ORGANIZER role sees View Only"

    - id: TC-MC-006
      scenario: "OnStartMeeting navigates to meeting-conduct with meetingId and groupId"
      type: ViewModel
      priority: P0
      given: "meeting.id=5; today's meeting; userRole=ORGANIZER"
      when: "OnStartMeeting(5) fires"
      then: "NavigateToMeetingConduct emitted with meetingId=5 and groupId=1"

    - id: TC-MC-007
      scenario: "OnViewPastMeeting navigates to previous-meeting-review with meetingId"
      type: ViewModel
      priority: P1
      given: "past meeting.id=3"
      when: "OnViewPastMeeting(3) fires"
      then: "NavigateToPreviousMeetingReview emitted with meetingId=3"

    - id: TC-MC-008
      scenario: "Error state shows retry on load failure"
      type: Screen
      priority: P1
      given: "MeetingRepository.getMeetings returns network error"
      when: "load completes"
      then: "MeetingCalendarScreenState=Error; retry CTA shown"

    - id: TC-MC-009
      scenario: "Pull-to-refresh reloads meetings from MeetingRepository"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh fires"
      then: "isRefreshing=true; MeetingRepository.getMeetings re-called; meetings updated; isRefreshing=false"
