sibling: ui
schema_version: "4.0"
feature_id: meeting-calendar

route: /meetings
entry_points:
  - source: home-dashboard
    condition: user_taps_meetings_nav
  - source: bottom_nav
    condition: meetings_tab_selected
nav_params:
  center_id: Int

screens:
  - id: meeting_calendar_screen
    name: MeetingCalendarScreen
    composable: MeetingCalendarScreen
    description: >
      Top toolbar with group name. Toggle between calendar view and list view.
      Upcoming meeting card pinned at top with green "Start Meeting" button.
      Scrollable list of past meetings below.
    layout: Column (TopAppBar + ViewToggle + PinnedUpcoming + LazyColumn)

state_model:
  MeetingCalendarViewModel:
    state:
      name: MeetingCalendarState
      fields:
        meetings: { type: "List<MeetingListItem>", default: "emptyList()" }
        isLoading: { type: Boolean, default: "true" }
        isRefreshing: { type: Boolean, default: "false" }
        viewMode: { type: ViewMode, default: "ViewMode.LIST" }
        error: { type: "String?", default: "null" }
        centerId: { type: Int, default: "0" }
    screen_state:
      name: MeetingCalendarScreenState
      members: [Loading, Content, Empty, Error]
    errors:
      NetworkError: "Could not load meetings. Showing cached data."
      EmptyState: "No meetings scheduled yet."
    events:
      name: MeetingCalendarEvent
      members:
        - { name: NavigateToConduct, params: "meetingId: String, meetingNumber: Int" }
        - { name: NavigateToReview, params: "meetingId: String, meetingNumber: Int" }
        - { name: ShowError, params: "message: String" }
    actions:
      name: MeetingCalendarAction
      members:
        - { name: LoadMeetings, trigger: "Screen enters composition" }
        - { name: RefreshMeetings, trigger: "Pull-to-refresh" }
        - { name: ToggleViewMode, trigger: "User taps calendar/list toggle" }
        - { name: StartMeeting, trigger: "Tap Start Meeting button on upcoming card", params: "meetingId: String, meetingNumber: Int" }
        - { name: OpenPastMeeting, trigger: "Tap completed meeting card", params: "meetingId: String, meetingNumber: Int" }
    di:
      - MeetingRepository
      - NavigationManager
      - ConnectivityObserver

components:
  - id: top_app_bar
    type: top-app-bar
    style:
      title_text: "Meetings"
      subtitle_text: "Mwangaza Women's Group"
      background: surface
    actions:
      - id: toggle_view_btn
        icon: calendar_list
        content_description: "Toggle calendar/list view"
        on_click: { action: ToggleViewMode }

  - id: upcoming_meeting_card
    type: card
    style:
      background: primaryContainer
      corner_radius: lg
      padding: 16dp
      margin: 16dp
      elevation: 4dp
    content:
      - { type: text, text: "Meeting #{{meeting.meetingNumber}}", text_style: headlineSmall, color: onPrimaryContainer }
      - { type: text, text: "{{meeting.meetingDate}}", text_style: bodyLarge, color: onPrimaryContainer }
      - { type: chip, text: "Upcoming", background: primary, text_color: onPrimary, corner: full }
    cta:
      id: start_meeting_btn
      type: button
      label: "Start Meeting"
      style: { background: primary, text_color: onPrimary, min_height: 48dp, full_width: true }
      on_click:
        action: StartMeeting
        target: meeting-conduct
        params: { meeting_id: "{{meeting.meetingId}}", meeting_number: "{{meeting.meetingNumber}}", center_id: "{{centerId}}" }

  - id: section_header_past
    type: text
    style: { text_style: titleSmall, color: onSurfaceVariant, padding_horizontal: 16dp }
    value: "Past Meetings"

  - id: meeting_list_item
    type: list-item
    style: { min_height: 72dp, padding_horizontal: 16dp, divider: true }
    leading:
      type: avatar
      text: "{{meeting_number}}"
      size: 40dp
    content:
      - { type: text, text: "Meeting #{{meeting_number}}", text_style: bodyLarge, color: onSurface }
      - { type: text, text: "{{meeting_date}} · {{attendance_count}}/5 present", text_style: bodySmall, color: onSurfaceVariant }
    trailing:
      - { type: text, text: "KES {{total_collected}}", text_style: labelLarge, color: primary }
      - { type: chip, text: "{{status}}", style_by_status: { completed: successContainer, missed: errorContainer } }
    on_click:
      action: OpenPastMeeting
      target: previous-meeting-review
      params: { meeting_id: "{{meeting.meetingId}}", meeting_number: "{{meeting.meetingNumber}}", center_id: "{{centerId}}" }

  - id: loading_skeleton
    type: skeleton
    style: { count: 4, item_height: 72dp, corner_radius: md, margin: 16dp }

  - id: error_banner
    type: banner
    style: { background: errorContainer, text_color: onErrorContainer, padding: 12dp }
    content: "Showing cached meetings — tap Retry to refresh"
    action: { text: "Retry", on_click: { action: RefreshMeetings } }

  - id: empty_state
    type: empty-state
    icon: calendar_empty
    title: "No Meetings Yet"
    body: "Meetings will appear here once scheduled"

states:
  initial_state: loading
  loading:
    description: Skeleton shimmer while API call in flight
    components: [top_app_bar, loading_skeleton]
  content:
    description: Upcoming card pinned + scrollable past meeting list
    components: [top_app_bar, upcoming_meeting_card, section_header_past, meeting_list_item]
    demo_data:
      meetings:
        - meetingId: "mtg-003"
          meetingNumber: 3
          meetingDate: "Wednesday, 7 May 2026"
          status: UPCOMING
        - meetingId: "mtg-002"
          meetingNumber: 2
          meetingDate: "30 Apr 2026"
          status: COMPLETED
          attendanceCount: 5
          totalCollectedKES: 1850
  content_with_error:
    description: Content visible but error banner shown for stale data
    components: [top_app_bar, error_banner, upcoming_meeting_card, section_header_past, meeting_list_item]
  empty:
    description: No meetings exist
    components: [top_app_bar, empty_state]
  error:
    description: Full-screen error with retry — no cached data available
    components: [top_app_bar, error_banner]

i18n:
  en:
    past_meetings_header: "Past Meetings"
    upcoming_section_header: "Next Meeting"
    start_meeting_btn: "Start Meeting"
    network_error: "Showing cached meetings — tap Retry to refresh"
    retry: "Retry"
    empty_title: "No Meetings Yet"
    empty_subtitle: "Meetings will appear here once scheduled"
    status_upcoming: "Upcoming"
    status_completed: "Completed"
    status_missed: "Missed"
    meeting_number_label: "Scheduled Meeting"
    collected_label: "Collected"
