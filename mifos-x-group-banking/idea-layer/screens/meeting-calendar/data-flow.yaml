sibling: data-flow
schema_version: "2.1.0"
feature_id: meeting-calendar

entries:
  - screen_id: meetingCalendarScreen
    trigger: on_mount
    description: Fetch scheduled meetings for the group — feeds LoadMeetings action into Content state
    endpoints:
      - { api_id: get_group_meetings, transport: rest, method: get }
    dtos:
      - { name: MeetingListItem, role: response, api_id: get_group_meetings }
      - { name: MeetingStatus, role: response, api_id: get_group_meetings }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "meeting_calendar:group:{groupId}:month:{yearMonth}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: show_empty, message_key: error_no_meetings_scheduled }
      - { error_code: "5xx", behavior: fallback_cache, message_key: error_server_use_cached }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_cached }

  - screen_id: meetingCalendarScreen
    trigger: on_mount
    description: Fetch completed meeting records from dt_meeting_record datatable to enrich past meeting rows (attendance + collected amounts)
    endpoints:
      - { api_id: get_meeting_records_datatable, transport: rest, method: get }
    dtos:
      - { name: MeetingRecordItem, role: response, api_id: get_meeting_records_datatable }
      - { name: MeetingRecordList, role: response, api_id: get_meeting_records_datatable }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "meeting_records:group:{groupId}"
    error_paths:
      - { error_code: "404", behavior: show_empty, message_key: error_no_records_yet }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_cached }

  - screen_id: meetingCalendarScreen
    trigger: on_refresh
    description: RefreshMeetings action — pull-to-refresh or Retry banner tap; network-first reload of the group meetings list
    endpoints:
      - { api_id: get_group_meetings, transport: rest, method: get }
    dtos:
      - { name: MeetingListItem, role: response, api_id: get_group_meetings }
    produces_state: Content
    auth_required: true
    cache:
      strategy: network_first
      ttl_seconds: 300
      key_template: "meeting_calendar:group:{groupId}:month:{yearMonth}"
    error_paths:
      - { error_code: "5xx", behavior: fallback_cache, message_key: error_server_use_cached }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_cached }

