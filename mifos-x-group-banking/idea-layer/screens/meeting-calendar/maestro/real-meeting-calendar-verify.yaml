# ─────────────────────────────────────────────────────────────────────────────
# E2E — REAL meeting-calendar against LIVE mifos-bank-2 (COMP-CAL)
# ─────────────────────────────────────────────────────────────────────────────
# login → organizer-dashboard → tap the Today's-Schedule row (Mwangaza) → G7
#   routes to meeting-calendar → GET /centers/1/meetings (facade resolves group 1
#   → its Fineract center 5) → real weekly schedule (meetings 5-1..5-13, past
#   COMPLETED/MISSED + upcoming) → the upcoming meeting card + Start Meeting render.
# The conduct WRITE (dt_meeting_record + attendance + corpus) is separately
# curl-proven on center 5. Prereq: Go companion :8090 + adb reverse tcp:8080 tcp:8090.
appId: org.mifos.groupbanking
name: e2e — real meeting-calendar (COMP-CAL, live mifos-bank-2)
tags:
  - e2e
  - group-banking
  - meeting-calendar
  - real-network
---
- launchApp:
    clearState: true
- assertVisible: { id: "login_signup_screen" }
- tapOn: { id: "login_signup_field_email_phone" }
- inputText: "mifos"
- tapOn: { id: "login_signup_field_password" }
- inputText: "password"
- hideKeyboard
- tapOn: { id: "login_signup_login_button" }
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 20000

# --- Today's-Schedule row (Mwangaza) → meeting-calendar (G7) ---
- tapOn: "Mwangaza Women's Group"
- extendedWaitUntil:
    visible: { id: "meeting_calendar_screen" }
    timeout: 20000
# real schedule from mifos-bank-2 (center 5) → the upcoming meeting card renders
- extendedWaitUntil:
    visible: { id: "meeting_calendar_start_meeting_button" }
    timeout: 15000
