# ─────────────────────────────────────────────────────────────────────────────
# E2E — meeting-calendar : login → group → group-dashboard → Meetings → calendar
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (GroupBankingNavHost §9c ← §7 group-dashboard `onNavigateToMeetingCalendar`):
#   login(ORGANIZER) → organizer-dashboard → All-Groups → group-list → tap a group
#   → group-dashboard → "View Meetings" → meeting-calendar.
# Backend seed required: ORGANIZER account, ≥1 group, and (for the Start-Meeting on_click)
#   an UPCOMING meeting on that center so the upcoming card + CTA render.
# TestTags: MeetingCalendarTestTags.kt (+ GroupList/GroupDashboard/Organizer TestTags).
appId: org.mifos.groupbanking
name: e2e — meeting-calendar (content list + start-meeting nav)
tags:
  - e2e
  - group-banking
  - meeting-calendar
env:
  ORGANIZER_USER: "organizer@demo.mifos"
  ORGANIZER_PASS: "Demo1234!"
---
# --- guaranteed prefix: fresh launch + login ---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: ${ORGANIZER_USER}
- tapOn:
    id: "login_signup_field_password"
- inputText: ${ORGANIZER_PASS}
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- nav path to a group-dashboard (real tags, seed-independent) ---
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "organizer_dashboard_nav_group_list_card"
- assertVisible:
    id: "group_list_screen"
- tapOn:
    id: "group_list_card_"                      # first seeded group card
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "group_dashboard_view_meetings_button"

# --- state: Loading → Content ---
- extendedWaitUntil:
    visible:
      id: "meeting_calendar_screen"
    timeout: 20000
- assertVisible:
    id: "meeting_calendar_lazy_column"          # Content: past-meeting list surface

# --- state: Content upcoming card (requires a seeded UPCOMING meeting) ---
- assertVisible:
    id: "meeting_calendar_upcoming_card"

# --- primary on_click: Start Meeting → meeting-conduct (StartMeeting action) ---
- tapOn:
    id: "meeting_calendar_start_meeting_button"
- assertVisible:
    id: "meeting_conduct_screen"
