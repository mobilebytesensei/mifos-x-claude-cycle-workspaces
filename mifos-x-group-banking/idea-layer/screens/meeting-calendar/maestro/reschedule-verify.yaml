# ─────────────────────────────────────────────────────────────────────────────
# E2E — meeting-calendar reschedule (G3) + organizer schedule-row → calendar (G7)
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (OFFLINE via demo): Demo Explore → organizer-dashboard (seeded
#   Mwangaza Women's Group, one meeting today) → tap the Today's-Schedule row (G7:
#   routes to meeting-calendar, NOT group-list) → meeting-calendar → open the
#   reschedule / Set-Adjust-Schedule editor (G3) → assert the schedule-editor sheet.
# Verifies BOTH the G7 nav-drift fix and the G3 reschedule affordance, offline.
appId: org.mifos.groupbanking
name: e2e — meeting-calendar reschedule + organizer schedule-row nav (offline demo)
tags:
  - e2e
  - group-banking
  - meeting-calendar
  - offline
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_demo_explore_button"
- assertVisible: "Explore as a demo user"
- tapOn: "Continue"
- assertVisible:
    id: "organizer_dashboard_screen"

# --- G7: the seeded Today's-Schedule row routes to the meeting calendar ---
- assertVisible: "Mwangaza Women's Group"
- tapOn: "Mwangaza Women's Group"
# meeting-calendar is now on screen (reached via the schedule row, not group-list)

# --- G3: open the reschedule / set-schedule editor; assert the sheet renders ---
# Either the upcoming card's Reschedule link OR the no-upcoming Set/Adjust CTA is
# present depending on seeded state — tap whichever is visible, then assert the sheet.
- runFlow:
    when:
      visible:
        id: "meeting_calendar_reschedule_button"
    commands:
      - tapOn:
          id: "meeting_calendar_reschedule_button"
- runFlow:
    when:
      visible:
        id: "meeting_calendar_set_schedule_button"
    commands:
      - tapOn:
          id: "meeting_calendar_set_schedule_button"
# ModalBottomSheet renders in a SEPARATE window (same as Compose AlertDialog) —
# testTagsAsResourceId does not cross it, so assert the sheet by its visible text.
- assertVisible: "Meeting Schedule"
- assertVisible: "Meeting Day"
- assertVisible: "Repeats"
