sibling: flow
schema_version: "4.0"
feature_id: meeting-calendar

navigates_to:
  - target: meeting-conduct
    condition: user_taps_start_meeting
    params: { meeting_id: String, meeting_number: Int, center_id: Int }
  - target: previous-meeting-review
    condition: user_taps_completed_meeting
    params: { meeting_id: String, meeting_number: Int, center_id: Int, launched_from: "calendar" }

flow_logic:
  - decision: screen_loads
    branches:
      - condition: cached_data_available
        action: render Content with stale data, then fetch fresh from API
      - condition: no_cache
        action: show Loading skeleton, fetch API
  - decision: upcoming_meeting_exists
    branches:
      - condition: true
        action: pin upcoming card at top with "Start Meeting" CTA + "Reschedule" affordance (hasUpcoming=true)
      - condition: false
        action: >
          show no_upcoming_schedule_card with "Set / Adjust Schedule" CTA (hasUpcoming=false) — replaces the
          former dead "Next meeting not scheduled" placeholder. Meetings auto-generate from the group's
          recurring Calendar; the CTA opens the schedule editor to set/adjust that recurrence (F6/G3).
  - decision: user_taps_meeting_card
    branches:
      - condition: status == upcoming
        action: emit NavigateToConduct with meeting params
      - condition: status == completed OR missed
        action: emit NavigateToReview with meeting params
  - decision: user_opens_schedule_editor   # Reschedule affordance OR Set/Adjust Schedule CTA
    branches:
      - condition: sheet_confirmed
        action: >
          RescheduleMeeting → PUT /centers/{centerId}/calendars/{calendarId}?command=updateCalendar
          (mirrored to dt_group_config schedule fields); on success re-run LoadMeetings so the shifted
          recurrence renders, emit ShowScheduleUpdated, dismiss the editor. Offline → queue PUT to sync_queue.
      - condition: sheet_cancelled
        action: DismissScheduleEditor — close sheet, discard draft
