sibling: api
schema_version: "4.0"
feature_id: meeting-calendar

api:
  - id: get_group_meetings
    method: get
    endpoint: "/fineract-provider/api/v1/datatables/dt_meeting_schedule/{groupId}"
    description: >
      Fetch the scheduled (forward) meetings for this group from the dt_meeting_schedule datatable
      (companion-served, AL-RULE — the native group calendar read is not reachable at the
      self-service level, so the schedule is modeled as a companion-served datatable).
    auth: BasicAuth
    query_params:
      fromDate: "YYYY-MM-DD"
      toDate: "YYYY-MM-DD"
    path_params:
      groupId: Int
    response_ref: MeetingListResponse
    error_handling:
      401: Redirect to login
      404: Show empty state
      5xx: Show error banner, use cached data

  - id: get_meeting_records_datatable
    method: get
    endpoint: "/fineract-provider/api/v1/datatables/dt_meeting_record/{groupId}"
    description: Fetch completed meeting records with collected amounts
    auth: BasicAuth
    path_params:
      groupId: Int
    response_ref: MeetingRecordList
    error_handling:
      404: No records yet, continue with empty list

  # F6/G3 (2026-08-01): RESCHEDULE write. Meetings auto-generate from the group's recurring
  # collection meeting Calendar (provisioned at group-create from meetingDay/meetingTime/frequency);
  # this adjusts that recurrence rather than creating an ad-hoc meeting. NOTE for R1/server: the
  # companion tool (companion_update_calendar / update_meeting_schedule) + its migration are NOT yet
  # in server/apis/*.yaml — this screen-scoped contract is the source; server must materialize the
  # companion tool + register it (flagged to R1).
  - id: reschedule_meeting
    method: put
    endpoint: "/fineract-provider/api/v1/groups/{groupId}/calendars/{calendarId}?command=updateCalendar"
    description: Reschedule / adjust the group's recurring collection meeting Calendar (moves the next occurrence and/or the recurring schedule)
    auth: BasicAuth
    path_params:
      groupId: Int
      calendarId: String
    request_body:
      startDate: { type: String, format: "YYYY-MM-DD", description: "next occurrence date" }
      typeId: { type: Int, value: 1, description: "1 = collection meeting calendar" }
      frequency: { type: Int, description: "1=weekly, 2=fortnightly, 3=monthly (maps MeetingFrequency)" }
      repeating: { type: Boolean, value: true }
      repeatsOnDay: { type: Int, description: "1=MON .. 7=SUN (maps scheduleDay)" }
      meetingTime: { type: String, format: "HH:mm" }
    mirror_write:
      endpoint: "/fineract-provider/api/v1/datatables/dt_group_config/{groupId}"
      method: put
      fields: [meetingDay, meetingTime, frequency]
      description: "keeps the dt_group_config schedule fields consistent with the Calendar recurrence"
    response_ref: RescheduleResponse
    error_handling:
      401: Redirect to login
      403: "Show 'Only the organizer can adjust the schedule' error"
      5xx: Show error banner, keep prior schedule
    offline_queue:
      table: sync_queue
      note: "PUT queued when offline; drained via Store5 on reconnect"

dtos:
  MeetingListResponse:
    meetingId: String
    meetingNumber: Int
    meetingDate: { type: String, format: "YYYY-MM-DD" }
    status: MeetingStatus
    attendanceCount: "Int?"
    totalCollectedKES: "Long?"

  MeetingRecordList:
    groupId: Int
    records: "List<MeetingRecordItem>"

  MeetingRecordItem:
    meetingNumber: Int
    actualDate: String
    totalSavings: Long
    totalRepayments: Long
    attendanceCount: Int
    closingCorpus: Long

  MeetingListItem:
    meetingId: String
    meetingNumber: Int
    meetingDate: String
    status: MeetingStatus
    attendanceCount: "Int?"
    totalCollectedKES: "Long?"

  MeetingStatus:
    values: [UPCOMING, COMPLETED, MISSED]

  ViewMode:
    values: [LIST, CALENDAR]

  MeetingFrequency:
    values: [WEEKLY, BIWEEKLY, MONTHLY]

  RescheduleResponse:
    calendarId: String
    groupId: Int
    nextOccurrenceDate: { type: String, format: "YYYY-MM-DD" }
    meetingDay: String
    meetingTime: { type: String, format: "HH:mm" }
    frequency: MeetingFrequency

cache_strategy:
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  tier: feature
  features: [meeting-conduct, previous-meeting-review]
  services:
    - MeetingRepository
    - NavigationManager
    - ConnectivityObserver
    - LocalMeetingDao
