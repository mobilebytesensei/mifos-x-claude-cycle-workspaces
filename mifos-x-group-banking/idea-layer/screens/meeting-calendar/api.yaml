sibling: api
schema_version: "4.0"
feature_id: meeting-calendar

api:
  - id: get_center_meetings
    method: get
    endpoint: "/fineract-provider/api/v1/centers/{centerId}/meetings"
    description: Fetch scheduled meetings for the group center
    auth: BasicAuth
    query_params:
      fromDate: "YYYY-MM-DD"
      toDate: "YYYY-MM-DD"
    path_params:
      centerId: Int
    response_ref: MeetingListResponse
    error_handling:
      401: Redirect to login
      404: Show empty state
      5xx: Show error banner, use cached data

  - id: get_meeting_records_datatable
    method: get
    endpoint: "/fineract-provider/api/v1/datatables/dt_meeting_record/{centerId}"
    description: Fetch completed meeting records with collected amounts
    auth: BasicAuth
    path_params:
      centerId: Int
    response_ref: MeetingRecordList
    error_handling:
      404: No records yet, continue with empty list

dtos:
  MeetingListResponse:
    meetingId: String
    meetingNumber: Int
    meetingDate: { type: String, format: "YYYY-MM-DD" }
    status: MeetingStatus
    attendanceCount: "Int?"
    totalCollectedKES: "Long?"

  MeetingRecordList:
    centerId: Int
    records: "List<MeetingRecordItem>"

  MeetingRecordItem:
    meetingNumber: Int
    actualDate: String
    totalSavings: Long
    totalRepayments: Long
    attendanceCount: Int
    closingCorpus: Long

  MeetingListItem:
    meetingId: String
    meetingNumber: Int
    meetingDate: String
    status: MeetingStatus
    attendanceCount: "Int?"
    totalCollectedKES: "Long?"

  MeetingStatus:
    values: [UPCOMING, COMPLETED, MISSED]

  ViewMode:
    values: [LIST, CALENDAR]

cache_strategy:
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  tier: feature
  features: [meeting-conduct, previous-meeting-review]
  services:
    - MeetingRepository
    - NavigationManager
    - ConnectivityObserver
    - LocalMeetingDao
