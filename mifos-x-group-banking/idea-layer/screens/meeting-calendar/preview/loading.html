<!DOCTYPE html>
<html lang="en" data-feature="meeting-calendar" data-state="loading" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meeting-calendar · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .view-toggle { display: flex; gap: 4px; padding: var(--space-sm) var(--space-base); background: var(--bg-canvas); border-bottom: 1px solid var(--border-subtle); }
  .view-toggle .seg { flex: 1; padding: 8px var(--space-md); font-size: 13px; font-weight: 500; color: var(--text-secondary); background: var(--bg-muted); border: none; border-radius: var(--radius-sm); cursor: pointer; text-align: center; }
  .view-toggle .seg.active { color: #fff; background: var(--primary-700); }
  .shimmer-card { background: var(--bg-muted); border-radius: var(--radius-md); animation: shimmer 1.4s ease-in-out infinite; }
  .shimmer-line { background: var(--bg-muted); border-radius: 4px; animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .shimmer-upcoming { height: 132px; border-radius: var(--radius-lg); margin-bottom: var(--space-lg); }
  .shimmer-section { width: 120px; height: 12px; margin-bottom: var(--space-sm); }
  .shimmer-row { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--border-subtle); min-height: 72px; }
  .shimmer-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .shimmer-body { flex: 1; }
  .shimmer-trail { width: 64px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1 class="app-bar-title">Meetings</h1>
    <button class="icon-btn" data-action="ToggleViewMode" aria-label="Toggle calendar/list view">🗓</button>
  </header>

  <div class="view-toggle">
    <button class="seg active">List</button>
    <button class="seg">Calendar</button>
  </div>

  <main>
    <div class="shimmer-card shimmer-upcoming"></div>

    <div class="shimmer-line shimmer-section"></div>

    <div class="list" style="border-radius:var(--radius-base);overflow:hidden;">
      <div class="shimmer-row">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:40%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:70%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:32px;"></div>
      </div>
      <div class="shimmer-row">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:38%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:78%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:32px;"></div>
      </div>
      <div class="shimmer-row">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:42%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:66%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:32px;"></div>
      </div>
      <div class="shimmer-row" style="border-bottom:none;">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:40%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:72%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:32px;"></div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
