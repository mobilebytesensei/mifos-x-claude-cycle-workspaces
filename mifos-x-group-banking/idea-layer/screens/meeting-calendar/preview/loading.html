<!DOCTYPE html>
<html lang="en" data-feature="meeting-calendar" data-state="loading" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meeting-calendar · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1>Meetings</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" aria-label="Toggle calendar/list view">🗓</button>
    </div>
  </header>

  <main>
    <!-- Skeleton: upcoming card shell -->
    <div class="card card-muted" style="height:148px;display:flex;flex-direction:column;gap:var(--space-sm);">
      <div style="width:45%;height:20px;border-radius:4px;background:var(--border-default);"></div>
      <div style="width:60%;height:13px;border-radius:4px;background:var(--border-subtle);"></div>
      <div style="width:80px;height:20px;border-radius:9999px;background:var(--border-subtle);"></div>
      <div style="margin-top:auto;width:100%;height:44px;border-radius:var(--radius-md);background:var(--border-default);"></div>
    </div>

    <!-- Skeleton: section label shell -->
    <div style="width:110px;height:12px;border-radius:4px;background:var(--border-subtle);margin-bottom:var(--space-sm);"></div>

    <!-- Skeleton: past-meeting list rows (4) -->
    <div class="list">
      <div class="list-item">
        <span class="avatar" style="background:var(--border-subtle);color:transparent;">·</span>
        <div class="main">
          <div style="width:42%;height:13px;border-radius:4px;background:var(--border-default);margin-bottom:6px;"></div>
          <div style="width:70%;height:11px;border-radius:4px;background:var(--border-subtle);"></div>
        </div>
        <div class="trail" style="gap:6px;">
          <div style="width:64px;height:13px;border-radius:4px;background:var(--border-default);"></div>
          <div style="width:56px;height:16px;border-radius:var(--radius-sm);background:var(--border-subtle);"></div>
        </div>
      </div>
      <div class="list-item">
        <span class="avatar" style="background:var(--border-subtle);color:transparent;">·</span>
        <div class="main">
          <div style="width:38%;height:13px;border-radius:4px;background:var(--border-default);margin-bottom:6px;"></div>
          <div style="width:78%;height:11px;border-radius:4px;background:var(--border-subtle);"></div>
        </div>
        <div class="trail" style="gap:6px;">
          <div style="width:64px;height:13px;border-radius:4px;background:var(--border-default);"></div>
          <div style="width:56px;height:16px;border-radius:var(--radius-sm);background:var(--border-subtle);"></div>
        </div>
      </div>
      <div class="list-item">
        <span class="avatar" style="background:var(--border-subtle);color:transparent;">·</span>
        <div class="main">
          <div style="width:44%;height:13px;border-radius:4px;background:var(--border-default);margin-bottom:6px;"></div>
          <div style="width:66%;height:11px;border-radius:4px;background:var(--border-subtle);"></div>
        </div>
        <div class="trail" style="gap:6px;">
          <div style="width:64px;height:13px;border-radius:4px;background:var(--border-default);"></div>
          <div style="width:56px;height:16px;border-radius:var(--radius-sm);background:var(--border-subtle);"></div>
        </div>
      </div>
      <div class="list-item">
        <span class="avatar" style="background:var(--border-subtle);color:transparent;">·</span>
        <div class="main">
          <div style="width:40%;height:13px;border-radius:4px;background:var(--border-default);margin-bottom:6px;"></div>
          <div style="width:72%;height:11px;border-radius:4px;background:var(--border-subtle);"></div>
        </div>
        <div class="trail" style="gap:6px;">
          <div style="width:64px;height:13px;border-radius:4px;background:var(--border-default);"></div>
          <div style="width:56px;height:16px;border-radius:var(--radius-sm);background:var(--border-subtle);"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
