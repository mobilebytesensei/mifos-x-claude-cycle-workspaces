<!DOCTYPE html>
<html lang="en" data-feature="meeting-calendar" data-state="empty" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meeting-calendar · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .view-toggle { display: flex; gap: 4px; padding: var(--space-sm) var(--space-base); background: var(--bg-canvas); border-bottom: 1px solid var(--border-subtle); }
  .view-toggle .seg { flex: 1; padding: 8px var(--space-md); font-size: 13px; font-weight: 500; color: var(--text-secondary); background: var(--bg-muted); border: none; border-radius: var(--radius-sm); cursor: pointer; text-align: center; }
  .view-toggle .seg.active { color: #fff; background: var(--primary-700); }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1 class="app-bar-title">Meetings</h1>
    <button class="icon-btn" data-action="ToggleViewMode" aria-label="Toggle calendar/list view">🗓</button>
  </header>

  <div class="view-toggle">
    <button class="seg active">List</button>
    <button class="seg" data-action="ToggleViewMode">Calendar</button>
  </div>

  <main>
    <div class="empty-state">
      <div class="illus">🗓</div>
      <h2>No Meetings Yet</h2>
      <p>Meetings will appear here once scheduled</p>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
