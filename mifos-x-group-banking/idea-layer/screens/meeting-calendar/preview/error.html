<!DOCTYPE html>
<html lang="en" data-feature="meeting-calendar" data-state="error" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meeting-calendar · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span><span class="sync-badge offline">⚠ Offline</span> ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1>Meetings</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" data-action="ToggleViewMode" aria-label="Toggle calendar/list view">🗓</button>
    </div>
  </header>

  <main>
    <div class="alert alert-danger">
      <div style="flex:1;">
        <h3>Could not load meetings</h3>
        <p>Check your connection and try again. No cached meetings are available.</p>
      </div>
    </div>
    <button class="btn btn-primary btn-full" data-action="RefreshMeetings">Retry</button>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
