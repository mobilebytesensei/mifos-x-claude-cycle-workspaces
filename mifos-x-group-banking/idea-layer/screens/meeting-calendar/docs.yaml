sibling: docs
schema_version: "4.0"
feature_id: meeting-calendar
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - has_offline_cache

id: meeting-calendar
name: Meeting Calendar
description: >
  Calendar and list view of all meetings for the Mwangaza Women's Group. Each meeting
  card shows meeting number, scheduled date, status (upcoming/completed/missed),
  attendance count, and total KES collected. Upcoming meetings surface a prominent
  "Start Meeting" CTA. Admin (treasurer/chairperson) can navigate to conduct a new
  meeting or review a past one.
feature: meeting-lifecycle
flow: meeting-lifecycle-flow
version: "1.0.0"
tags:
  - meetings
  - calendar
  - admin
  - meeting-lifecycle
  - offline-first

status: designed
quality_score: 87
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: claude-product-cycle
  - status: designed
    at: "2026-05-08T23:00:00Z"
    by: /idea export

entry_point: false
bottom_nav:
  visible: true
  selected_tab: meetings

legacy_metadata:
  analytics:
    screen_viewed:
      event: screen_viewed
      params: { screen_id: meeting-calendar, flow: meeting-lifecycle-flow }
    events:
      - name: start_meeting_tapped
        trigger: user taps Start Meeting on upcoming card
        params: { meeting_number: Int, center_id: Int }
      - name: past_meeting_opened
        trigger: user taps a past meeting row
        params: { meeting_number: Int, status: "completed|missed" }
      - name: view_mode_toggled
        trigger: user taps calendar/list toggle
        params: { new_mode: "LIST|CALENDAR" }
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/meeting-lifecycle/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/meeting-lifecycle/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/meeting-lifecycle/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/meeting-lifecycle/"
