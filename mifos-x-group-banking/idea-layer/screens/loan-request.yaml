schema_version: "3.1"

id: loan-request
name: Loan Request
description: >
  Form screen for end users to submit a loan application. Member selects amount
  (validated against savings × loan_multiplier), purpose, and duration. Submit
  creates a dt_loan_request datatable entry pending admin review at next meeting.
  Offline-capable via SyncQueue. Covers FR-016.
feature: end-user-dashboard
flow: end-user-dashboard-flow
version: "1.0.0"
tags: [loan-request, end_user, offline-first, sync-queue, datatable, FR-016]

status: enriched
quality_score: 90
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: claude-product-cycle

entry_point: false
bottom_nav: false
navigates_to:
  - target: personal-dashboard
    condition: submission_success
  - target: personal-loans
    condition: user_taps_back
route: /loan-request
entry_points:
  - source: personal-dashboard
    condition: user_taps_request_loan_cta
  - source: personal-loans
    condition: user_taps_fab
nav_params:
  clientId: { type: Long, required: true }
  savingsBalance: { type: Double, required: true }
  loanMultiplier: { type: Double, required: false, default: "3.0" }

screens:
  - id: loan_request_screen
    name: LoanRequestScreen
    composable: LoanRequestScreen
    description: Loan application form with inline validation and offline queue support
    layout: Scaffold (top-bar + Column scrollable + bottom submit bar)

state_model:
  LoanRequestViewModel:
    state:
      name: LoanRequestState
      fields:
        clientId: { type: Long, default: "0L" }
        savingsBalance: { type: Double, default: "0.0" }
        loanMultiplier: { type: Double, default: "3.0" }
        maxLoanAmount: { type: Double, default: "0.0" }
        requestedAmount: { type: String, default: '""' }
        requestedAmountError: { type: "String?", default: "null" }
        purpose: { type: "LoanPurpose?", default: "null" }
        purposeError: { type: "String?", default: "null" }
        durationWeeks: { type: Int, default: "12" }
        repaymentEstimate: { type: Double, default: "0.0" }
        isOfflineMode: { type: Boolean, default: "false" }
        isSubmitting: { type: Boolean, default: "false" }
        isFormValid: { type: Boolean, default: "false" }
        submitError: { type: "SubmitError?", default: "null" }
        successDialogVisible: { type: Boolean, default: "false" }
    screen_state:
      name: LoanRequestScreenState
      members: [Content, Submitting, SubmitSuccess, SubmitError, OfflineQueued]
    errors:
      name: SubmitError
      types:
        - { type: Network, retry: true, message_key: error_network_queued }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Validation, retry: false, message_key: error_validation }
        - { type: Unauthorized, retry: false, message_key: error_session_expired }
    events:
      name: LoanRequestEvent
      members:
        - { name: NavigateToDashboardAfterSuccess }
        - { name: NavigateBack }
        - { name: ShowOfflineQueuedConfirmation }
    actions:
      name: LoanRequestAction
      members:
        - { name: OnAmountChange, params: { value: String }, trigger: "Type in amount field" }
        - { name: OnPurposeSelected, params: { purpose: LoanPurpose }, trigger: "Select purpose from dropdown" }
        - { name: OnDurationChanged, params: { weeks: Int }, trigger: "Slide duration selector" }
        - { name: OnSubmitClick, trigger: "Tap Submit Application button" }
        - { name: OnSuccessDialogDismiss, trigger: "Tap OK on success dialog" }
        - { name: OnRetry, trigger: "Tap Retry on error snackbar" }
    di:
      - LoanRequestRepository
      - SyncQueueRepository
      - SessionManager
      - ConnectivityManager

flow_logic:
  - decision: amount_validation
    branches:
      - condition: "requestedAmount.toDouble() > maxLoanAmount"
        action: show requestedAmountError — max exceeded
      - condition: "requestedAmount.toDouble() <= 0"
        action: show requestedAmountError — must be positive
      - condition: valid
        action: clear error; recalculate repaymentEstimate
  - decision: connectivity_on_submit
    branches:
      - condition: online
        action: POST /datatables/dt_loan_request; navigate to dashboard on 200
      - condition: offline
        action: add to SyncQueue; show offline queued confirmation; navigate to dashboard
  - decision: form_validity
    branches:
      - condition: "requestedAmount valid && purpose selected && durationWeeks > 0"
        action: isFormValid = true; enable submit button
      - condition: any field invalid
        action: isFormValid = false; disable submit button

dependencies:
  tier: ui
  features: [end-user-dashboard]
  services:
    - LoanRequestRepository
    - SyncQueueRepository
    - SessionManager
    - ConnectivityManager
  shared_entities:
    - Loan
    - SyncQueue
    - Member

api:
  - id: submit_loan_request
    function: submit_loan_request
    method: post
    endpoint: "/datatables/dt_loan_request"
    description: >
      Create a dt_loan_request datatable entry for admin review at next group meeting.
      Offline-capable — falls back to SyncQueue when no connectivity.
    params:
      clientId: { type: Long, required: true, source: nav_params }
      requestedAmount: { type: Double, required: true, source: user_input }
      purpose: { type: String, required: true, source: user_input }
      durationWeeks: { type: Int, required: true, source: user_input }
      savingsBalance: { type: Double, required: true, source: session }
      submittedAt: { type: String, required: true, source: system, format: "ISO-8601" }
    request_body:
      type: object
      fields:
        clientId: Long
        requested_amount: Double
        purpose: String
        duration_weeks: Int
        savings_balance_at_request: Double
        submitted_at: String
        status: { type: String, default: "PENDING" }
    response:
      type: object
      fields:
        resourceId: Long
        officeId: Long
        clientId: Long
        resourceExternalId: String
    errors:
      400: Validation error — field missing or invalid
      401: Session expired
      409: Duplicate loan request pending
      503: Server unavailable — queue for sync
    cache: { ttl: 0, strategy: no-cache, offline: queue_to_syncqueue }

dtos:
  - name: LoanRequestPayload
    fields:
      clientId: Long
      requested_amount: Double
      purpose: String
      duration_weeks: Int
      savings_balance_at_request: Double
      submitted_at: String
      status: String

  - name: LoanRequestResponse
    fields:
      resourceId: Long
      officeId: Long
      clientId: Long
      resourceExternalId: String

  - name: SyncQueueEntry
    fields:
      id: Long
      entityType: String
      payload: String
      status: String
      createdAt: String
      retryCount: Int

components:
  - id: top_bar
    type: top-bar
    name: LoanRequestTopBar
    description: Top bar with back navigation and screen title
    style:
      background: primary
      elevation: 0dp
    navigation_icon:
      name: FluentIcons.arrow_left_24_regular
      tint: onPrimary
    title:
      text_key: i18n.screen_title
      text_style: titleLarge
      color: onPrimary
    a11y:
      content_description: "Loan Request — back to loans"
    test_context:
      purpose: Back navigation returns to personal-loans
      interaction_type: tap
      data_driven: false
      required_fields: []
    on_click:
      action: NavigateBack
      target: personal-loans

  - id: offline_mode_banner
    type: card
    name: OfflineModeBanner
    description: Warning banner when device is offline — submission will be queued
    style:
      background: secondaryContainer
      cornerRadius: sm
      padding: "8dp 16dp"
      margin_horizontal: 16dp
      margin_top: 8dp
      visible_when: isOfflineMode == true
    icon:
      name: FluentIcons.wifi_off_24_filled
      tint: onSecondaryContainer
      size: 20dp
    text:
      text_key: i18n.offline_banner
      text_style: bodySmall
      color: onSecondaryContainer
    a11y:
      content_description: "You are offline. Your request will be saved and submitted when you reconnect."
      live_region: polite
    test_context:
      purpose: Offline banner visible when no connectivity; hidden when online
      interaction_type: non_interactive
      data_driven: true
      required_fields: [isOfflineMode]
    on_click: {}

  - id: savings_limit_card
    type: card
    name: SavingsLimitCard
    description: Info card showing savings balance and max eligible loan amount
    style:
      background: tertiaryContainer
      cornerRadius: lg
      padding: 16dp
      margin_horizontal: 16dp
      margin_top: 12dp
      elevation: 0dp
    rows:
      - label_key: i18n.savings_balance_label
        value: "KES 12,450"
        icon: FluentIcons.savings_24_filled
        icon_tint: onTertiaryContainer
        text_style: bodyLarge
        color: onTertiaryContainer
      - label_key: i18n.max_loan_label
        value: "KES 37,350"
        hint_key: i18n.loan_multiplier_hint
        icon: FluentIcons.money_24_filled
        icon_tint: onTertiaryContainer
        text_style: titleMedium
        weight: bold
        color: onTertiaryContainer
    a11y:
      content_description: "Your savings: KES 12,450. Maximum loan: KES 37,350 (3× savings)"
    test_context:
      purpose: Savings balance and max loan calculated correctly from nav_params
      interaction_type: non_interactive
      data_driven: true
      required_fields: [savingsBalance, maxLoanAmount, loanMultiplier]
    on_click: {}

  - id: amount_field
    type: text-field
    name: LoanAmountField
    description: >
      Currency input for requested loan amount. Validates against maxLoanAmount.
      Inline error shown below field.
    style:
      label_key: i18n.amount_label
      placeholder: "0"
      leading_icon: FluentIcons.money_24_regular
      prefix: "KES"
      keyboard_type: number
      ime_action: next
      min_touch_target: 48dp
      margin_horizontal: 16dp
      margin_top: 16dp
      error_text: "{ requestedAmountError }"
      supporting_text_key: i18n.amount_supporting_text
    a11y:
      content_description: "Enter loan amount in Kenyan Shillings"
      role: text_field
    test_context:
      purpose: Amount validates against max; error shown inline; repayment estimate updates on change
      interaction_type: type
      data_driven: true
      required_fields: [requestedAmount, maxLoanAmount]
    on_click:
      action: OnAmountChange
      target: state.requestedAmount

  - id: purpose_dropdown
    type: text-field
    name: LoanPurposeDropdown
    description: >
      Exposed dropdown menu for loan purpose selection. Options localised.
      Error shown if submitted without selection.
    style:
      label_key: i18n.purpose_label
      dropdown: true
      leading_icon: FluentIcons.notepad_24_regular
      trailing_icon: FluentIcons.chevron_down_24_regular
      min_touch_target: 48dp
      margin_horizontal: 16dp
      margin_top: 12dp
      error_text: "{ purposeError }"
    options:
      - value: SCHOOL_FEES
        label_key: i18n.purpose_school_fees
      - value: MEDICAL
        label_key: i18n.purpose_medical
      - value: BUSINESS
        label_key: i18n.purpose_business
      - value: FARMING
        label_key: i18n.purpose_farming
      - value: HOME_IMPROVEMENT
        label_key: i18n.purpose_home_improvement
      - value: EMERGENCY
        label_key: i18n.purpose_emergency
      - value: OTHER
        label_key: i18n.purpose_other
    a11y:
      content_description: "Select loan purpose"
      role: dropdown
      min_touch_target: 48dp
    test_context:
      purpose: Dropdown shows all purpose options; selection updates state; error cleared after selection
      interaction_type: tap
      data_driven: false
      required_fields: [purpose]
    on_click:
      action: OnPurposeSelected
      target: state.purpose

  - id: duration_selector
    type: card
    name: DurationSelector
    description: >
      Slider-based duration picker in weeks. Range: 4–52 weeks with 4-week steps.
      Shows selected duration and calculated repayment per week.
    style:
      background: surface
      cornerRadius: md
      padding: 16dp
      margin_horizontal: 16dp
      margin_top: 12dp
      elevation: 1dp
    header:
      text_key: i18n.duration_label
      text_style: labelLarge
      color: onSurfaceVariant
    selected_duration:
      text: "12 weeks"
      text_style: titleLarge
      color: onSurface
      weight: bold
    slider:
      min: 4
      max: 52
      steps: 12
      value: 12
      active_color: primary
      inactive_color: primaryContainer
      thumb_color: primary
      min_touch_target: 48dp
    repayment_estimate_row:
      label_key: i18n.repayment_estimate_label
      amount: "KES 3,223"
      text_style: bodyLarge
      amount_color: tertiary
      weight: semibold
    a11y:
      content_description: "Loan duration: 12 weeks. Weekly repayment: KES 3,223"
      role: slider
      min_touch_target: 48dp
    test_context:
      purpose: Slider changes duration; repayment estimate recalculates correctly
      interaction_type: slide
      data_driven: true
      required_fields: [durationWeeks, requestedAmount]
    on_click:
      action: OnDurationChanged
      target: state.durationWeeks

  - id: repayment_summary_card
    type: card
    name: RepaymentSummaryCard
    description: Summary row showing principal + interest breakdown
    style:
      background: surfaceVariant
      cornerRadius: md
      padding: 16dp
      margin_horizontal: 16dp
      margin_top: 12dp
      elevation: 0dp
      visible_when: "requestedAmount.isNotBlank() && requestedAmountError == null"
    rows:
      - label_key: i18n.principal_label
        value: "KES 37,350"
        text_style: bodyLarge
        color: onSurfaceVariant
      - label_key: i18n.interest_label
        value: "KES 1,300"
        text_style: bodyLarge
        color: onSurfaceVariant
      - label_key: i18n.total_repayment_label
        value: "KES 38,650"
        text_style: titleMedium
        weight: bold
        color: onSurface
        divider_above: true
    a11y:
      content_description: "Repayment summary: principal KES 37,350, interest KES 1,300, total KES 38,650"
    test_context:
      purpose: Summary calculates correctly from amount + interest rate + duration
      interaction_type: non_interactive
      data_driven: true
      required_fields: [requestedAmount, durationWeeks]
    on_click: {}

  - id: submit_button
    type: button
    name: SubmitButton
    description: Primary submit CTA — disabled until form is valid
    style:
      variant: filled
      text_key: i18n.submit_button
      background: primary
      text_color: onPrimary
      cornerRadius: full
      min_height: 56dp
      margin_horizontal: 16dp
      margin_top: 24dp
      margin_bottom: 24dp
      enabled_when: "isFormValid && !isSubmitting"
    a11y:
      content_description: "Submit loan application"
      role: button
      min_touch_target: 56dp
    test_context:
      purpose: Button disabled until all fields valid; triggers API on tap; shows loading state
      interaction_type: tap
      data_driven: true
      required_fields: [isFormValid, requestedAmount, purpose, durationWeeks]
    on_click:
      action: OnSubmitClick
      target: api.submit_loan_request

  - id: submitting_indicator
    type: shimmer
    name: SubmittingIndicator
    description: Full-width loading indicator replacing submit button during submission
    style:
      visible_when: isSubmitting == true
      type: circular_progress
      size: 32dp
      color: primary
      alignment: center
      margin_top: 24dp
    a11y:
      content_description: "Submitting loan request, please wait"
    test_context:
      purpose: Loading indicator shown during API call; form fields disabled
      interaction_type: non_interactive
      data_driven: false
      required_fields: []
    on_click: {}

  - id: success_dialog
    type: dialog
    name: SubmitSuccessDialog
    description: >
      Modal dialog confirming submission. Online: "submitted for review at next meeting".
      Offline: "saved — will submit when you reconnect". OK navigates to dashboard.
    style:
      visible_when: successDialogVisible == true
      icon: FluentIcons.checkmark_circle_24_filled
      icon_tint: primary
      icon_size: 48dp
      cornerRadius: lg
      background: surface
    title:
      text_key: "{ i18n.success_online_title | i18n.success_offline_title }"
      text_style: titleLarge
      color: onSurface
    body:
      text_key: "{ i18n.success_online_body | i18n.success_offline_body }"
      text_style: bodyMedium
      color: onSurfaceVariant
    confirm_button:
      text_key: i18n.ok_button
      background: primary
      text_color: onPrimary
      cornerRadius: full
      min_touch_target: 48dp
    a11y:
      content_description: "Loan request submitted successfully"
      role: dialog
    test_context:
      purpose: Dialog shows correct copy for online vs offline mode; OK dismisses and navigates to dashboard
      interaction_type: tap
      data_driven: true
      required_fields: [isOfflineMode]
    on_click:
      action: OnSuccessDialogDismiss
      target: personal-dashboard

  - id: error_snackbar
    type: card
    name: SubmitErrorSnackbar
    description: Snackbar for submission errors with retry action
    style:
      visible_when: "submitError != null && !isSubmitting"
      background: errorContainer
      text_color: onErrorContainer
      action_text_key: i18n.retry_button
      action_color: tertiary
      duration: 5000
    a11y:
      content_description: "Submission failed. Tap retry."
      live_region: assertive
    test_context:
      purpose: Error snackbar shown on submit failure; retry re-attempts submission
      interaction_type: tap
      data_driven: true
      required_fields: [submitError]
    on_click:
      action: OnRetry
      target: api.submit_loan_request

states:
  initial_state: content
  content:
    description: Form ready — all fields enabled, submit button disabled until valid
    components_visible: [top_bar, offline_mode_banner, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submit_button]
  submitting:
    description: Submission in progress — fields disabled, spinner shown
    components_visible: [top_bar, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submitting_indicator]
  submit_success:
    description: Submission succeeded — success dialog shown
    components_visible: [top_bar, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submit_button, success_dialog]
  submit_error:
    description: Submission failed — error snackbar visible
    components_visible: [top_bar, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submit_button, error_snackbar]
  offline_queued:
    description: Offline — entry saved to SyncQueue; success dialog with offline copy
    components_visible: [top_bar, offline_mode_banner, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submit_button, success_dialog]

i18n:
  screen_title: "Request a Loan"
  offline_banner: "You are offline. Your request will be saved and sent when you reconnect."
  savings_balance_label: "Your savings balance"
  max_loan_label: "Maximum you can borrow"
  loan_multiplier_hint: "(3× your savings)"
  amount_label: "Loan Amount (KES)"
  amount_supporting_text: "Enter amount between KES 500 and your maximum"
  purpose_label: "Loan Purpose"
  purpose_school_fees: "School Fees"
  purpose_medical: "Medical Emergency"
  purpose_business: "Business"
  purpose_farming: "Farming / Agriculture"
  purpose_home_improvement: "Home Improvement"
  purpose_emergency: "Emergency"
  purpose_other: "Other"
  duration_label: "Repayment Duration"
  repayment_estimate_label: "Weekly repayment estimate"
  principal_label: "Principal"
  interest_label: "Interest (group rate)"
  total_repayment_label: "Total to repay"
  submit_button: "Submit Application"
  success_online_title: "Request Submitted!"
  success_online_body: "Your loan request has been submitted. It will be reviewed by the group at the next meeting."
  success_offline_title: "Request Saved!"
  success_offline_body: "You are offline. Your loan request has been saved and will be submitted automatically when you reconnect."
  ok_button: "OK"
  retry_button: "Retry"
  error_network_queued: "No internet. Your request has been saved for later."
  error_server: "Server error. Please try again."
  error_validation: "Please check all fields and try again."
  error_session_expired: "Session expired. Please login again."

analytics:
  screen_viewed:
    event: screen_viewed
    params:
      screen_id: loan-request
      flow: end-user-dashboard-flow
      client_id: "{ clientId }"
      is_offline: "{ isOfflineMode }"
  events:
    - name: loan_amount_entered
      trigger: user finishes typing amount
      params:
        amount: Double
        is_valid: Boolean
    - name: loan_purpose_selected
      trigger: user selects purpose from dropdown
      params:
        purpose: String
    - name: loan_duration_changed
      trigger: user moves duration slider
      params:
        duration_weeks: Int
    - name: loan_request_submitted
      trigger: user taps Submit
      params:
        amount: Double
        purpose: String
        duration_weeks: Int
        is_offline: Boolean
    - name: loan_request_success
      trigger: API returns 200 or offline queued
      params:
        mode: "{ online | offline_queued }"
        amount: Double
    - name: loan_request_failed
      trigger: API returns error
      params:
        error_type: "{ Network | Server | Validation }"
