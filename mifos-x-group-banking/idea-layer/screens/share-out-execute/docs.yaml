sibling: docs
schema_version: "4.0"
feature_id: share-out-execute
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - has_offline_cache
  - has_form_input

identity:
  name: Share-Out Execute
  description: >
    Final confirmation and execution screen for cycle-end share-out. Requires CHAIRPERSON role.
    Displays a read-only summary of the distribution carried over from share-out-preview.
    Double-confirmation gate: user must type "SHARE OUT" exactly (case-insensitive) OR pass
    biometric authentication. On confirm: records the share-out in dt_share_out datatable,
    then posts a savings withdrawal transaction for each member sequentially. Per-member
    execution status (PENDING / IN_PROGRESS / DONE / FAILED / QUEUED) shown in MemberPayoutRow
    list during execution. When offline, all operations are queued to SyncQueue.
    Partial failure state shows which members succeeded and which failed with retry.
  archetype: detail

lifecycle:
  status: designed
  quality_score: 92
  tags:
    - share-out
    - admin
    - execute
    - offline-first
    - FR-007
    - FR-008
  status_history:
    - status: draft
      date: "2026-05-05"
      author: system
    - status: enriched
      date: "2026-05-05"
      author: system
    - status: designed
      at: "2026-05-08T23:00:00Z"
      by: /idea export

feature_context:
  feature: share-out
  flow: share-out-flow

navigation:
  route: /groups/{groupId}/share-out/execute
  bottom_nav:
    visible: false
  entry_points:
    - source: share-out-preview
      condition: chairperson_taps_confirm_and_execute

legacy_metadata:
  analytics:
    screen_viewed:
      event: share_out_execute_viewed
      params:
        cycle_number: Int
        total_pool: Double
        member_count: Int
    events:
      - name: share_out_initiated
      - name: share_out_confirmed
      - name: share_out_execution_started
      - name: share_out_execution_completed
      - name: share_out_execution_partial_failure
      - name: share_out_queued_offline
      - name: share_out_failed
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/share-out/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/share-out/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/share-out/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/share-out/"
