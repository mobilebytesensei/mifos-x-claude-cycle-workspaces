identity:
  name: Share-Out Execute
  description: >
    Strategy-adaptive final execution screen for cycle-end distribution. Accessible to organizer, treasurer, and
    chairperson. Screen title and execute button label adapt to pool_model: ACCUMULATING types (VSLA/ASCA/SHG/SILC) →
    "Execute Share-Out" via COMP-DIST-001 (single-call orchestration records dt_share_out + executes per-member
    withdrawals via Fineract); ROTATING_PAYOUT types (ROSCA/chit) → "Execute Rotation Payout" via COMP-DIST-002 (updates
    rosca_rotation + single-recipient withdrawal). Double-confirmation gate retained. Offline queuing to SyncQueue
    retained for both paths. Partial failure state shows which members succeeded with retry via COMP-DIST-001 partial
    re-execute. Replaces raw Fineract: POST /datatables/dt_share_out/{centerId} + sequential POST
    /savingsaccounts/{id}/transactions.
  archetype: detail
  version: 2.0.0
