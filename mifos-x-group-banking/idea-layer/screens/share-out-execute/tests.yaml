sibling: tests
schema_version: "4.0"
feature_id: share-out-execute
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SOE-001
      scenario: "On mount, share-out plan loads from ShareOutRepository with groupId"
      type: ViewModel
      priority: P0
      given: "groupId=1; network online"
      when: "ShareOutExecuteScreen enters composition"
      then: "ShareOutRepository.getShareOutPlan(1) called; per-member distribution list populated; ShareOutExecuteScreenState=Content"

    - id: TC-SOE-002
      scenario: "ACCUMULATING pool uses COMP-DIST-001 and shows prorata per-member amounts"
      type: Screen
      priority: P0
      given: "Content state; poolModel=ACCUMULATING; members=[{name:'Ali', payout:8000}, {name:'Zara', payout:6500}]"
      when: "DistributionList renders"
      then: "COMP-DIST-001 strategy label shown; per-member rows with prorata KES amounts visible"

    - id: TC-SOE-003
      scenario: "ROTATING_PAYOUT pool uses COMP-DIST-002 and shows current beneficiary receiving full pool"
      type: Screen
      priority: P0
      given: "Content state; poolModel=ROTATING_PAYOUT; currentBeneficiary={name:'Peter', payout:50000}"
      when: "DistributionList renders"
      then: "COMP-DIST-002 strategy label shown; only 'Peter' shows KES 50,000 payout; others show KES 0"

    - id: TC-SOE-004
      scenario: "First confirm step requires explicit OnConfirmReview before OnExecute is available"
      type: Screen
      priority: P0
      given: "Content state; reviewConfirmed=false"
      when: "ShareOutExecuteScreen renders"
      then: "Execute button disabled until OnConfirmReview fires; double-confirm pattern enforced"

    - id: TC-SOE-005
      scenario: "OnConfirmReview enables Execute button and shows final confirmation dialog"
      type: ViewModel
      priority: P0
      given: "reviewConfirmed=false"
      when: "OnConfirmReview fires"
      then: "reviewConfirmed=true; ShowFinalConfirmDialog event emitted"

    - id: TC-SOE-006
      scenario: "OnExecuteShareOut calls COMP-DIST-001 POST and transitions to per-member execution status"
      type: ViewModel
      priority: P0
      given: "poolModel=ACCUMULATING; reviewConfirmed=true; network online"
      when: "OnExecuteShareOut fires"
      then: "isExecuting=true; POST /companion/groups/1/share-out/execute called; on success per-member executionStatus updated; NavigateToShareOutComplete emitted"

    - id: TC-SOE-007
      scenario: "Per-member execution status rows update in real time during execution"
      type: Screen
      priority: P1
      given: "isExecuting=true; members=[{id:1, status:PENDING}, {id:2, status:COMPLETED}]"
      when: "ExecutionStatusList renders"
      then: "member 1 shows PENDING spinner; member 2 shows COMPLETED checkmark"

    - id: TC-SOE-008
      scenario: "OnSubmit when offline queues entire share-out to sync_queue"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor offline; reviewConfirmed=true"
      when: "OnExecuteShareOut fires"
      then: "sync_queue share-out entry created; ShareOutExecuteScreenState=OfflineQueued; banner shown"

    - id: TC-SOE-009
      scenario: "Server error during execution shows partial-failure state with retry"
      type: ViewModel
      priority: P1
      given: "server returns 500 mid-execution"
      when: "OnExecuteShareOut fires"
      then: "isExecuting=false; failedMembers list populated; retry CTA shown"
