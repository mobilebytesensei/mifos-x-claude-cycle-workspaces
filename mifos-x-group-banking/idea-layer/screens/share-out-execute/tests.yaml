sibling: tests
schema_version: "4.0"
feature_id: share-out-execute

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    UseCase: "85%+"

  scenarios:
    - id: TC-SOE-001
      scenario: "On mount — nav params populated, content state shown with member payout list"
      type: ViewModel
      priority: P0
      given: "groupId=1, centerId=1, cycleNumber=1, totalPool=24000, 5 memberPayouts passed as nav args"
      when: "ShareOutExecuteScreen enters composition"
      then: "5 member rows visible, summary card shows 'KES 24,000', execute button disabled (not confirmed)"

    - id: TC-SOE-002
      scenario: "Execute button remains disabled until confirmation text matches exactly"
      type: ViewModel
      priority: P0
      given: "Content state, isConfirmed=false"
      when: "OnConfirmationTextChanged('SHARE')"
      then: "isConfirmed=false, execute_button disabled, error_text 'Must type exactly SHARE OUT'"

    - id: TC-SOE-003
      scenario: "Typing 'SHARE OUT' exactly enables execute button"
      type: ViewModel
      priority: P0
      given: "confirmationText=''"
      when: "OnConfirmationTextChanged('SHARE OUT')"
      then: "isConfirmed=true, execute_button enabled"

    - id: TC-SOE-004
      scenario: "Execute — transitions to Executing state, back button disabled"
      type: ViewModel
      priority: P0
      given: "isConfirmed=true"
      when: "OnExecute action"
      then: "isExecuting=true, post_share_out_record called, then post_member_payout called sequentially per member"

    - id: TC-SOE-005
      scenario: "Sequential execution — progress indicator advances per member"
      type: ViewModel
      priority: P0
      given: "Executing state, totalCount=5"
      when: "Each post_member_payout completes"
      then: "executedCount increments 0→1→2→3→4→5, progress_indicator.value matches ratio"

    - id: TC-SOE-006
      scenario: "All payouts succeed — completion banner shown, Done button visible"
      type: ViewModel
      priority: P0
      given: "Executing state, all 5 members"
      when: "All post_member_payout calls return 200"
      then: "isCompleted=true, failedPayouts.isEmpty(), completion_banner visible, done_button visible"

    - id: TC-SOE-007
      scenario: "Partial failure — partial_failure_banner and retry button shown"
      type: ViewModel
      priority: P0
      given: "Executing state, 5 members"
      when: "3 succeed, 2 fail (5xx)"
      then: "succeededCount=3, failedPayouts.size=2, partial_failure_banner visible, retry_failed_button visible"

    - id: TC-SOE-008
      scenario: "Offline — share-out queued, queued_offline_banner shown"
      type: ViewModel
      priority: P1
      given: "isOnline=false, isConfirmed=true"
      when: "OnExecute action"
      then: "queuedOffline=true, SyncQueueRepository.enqueue() called with priority=HIGH, queued_offline_banner visible"

    - id: TC-SOE-009
      scenario: "Retry failed payouts — only FAILED members re-attempted"
      type: ViewModel
      priority: P1
      given: "PartialFailure state, failedPayouts=[member104, member105]"
      when: "OnRetryFailed action"
      then: "post_member_payout called for member104 and member105 only, not successful members"

    - id: TC-SOE-010
      scenario: "Biometric auth — biometric prompt shown, on success isConfirmed=true"
      type: ViewModel
      priority: P1
      given: "Content state, isConfirmed=false"
      when: "OnBiometricSelected action"
      then: "ShowBiometricPrompt event emitted; on biometric success isConfirmed=true"

    - id: TC-SOE-011
      scenario: "401 during execution — navigate to login"
      type: ViewModel
      priority: P0
      given: "Executing state"
      when: "post_share_out_record returns 401"
      then: "isExecuting=false, NavigateToGroupDashboard NOT emitted, NavigateBack emitted with login redirect"

    - id: TC-SOE-012
      scenario: "Done button navigates to group-dashboard with groupId"
      type: Screen
      priority: P0
      given: "Success state"
      when: "Done button tapped"
      then: "OnDone action emitted, nav target is group-dashboard with groupId=1"

    - id: TC-SOE-013
      scenario: "MemberExecutionStatus badge shows correct icon per state"
      type: Screen
      priority: P1
      given: "Executing state with mixed member statuses"
      when: "Member row rendered for each status"
      then: "PENDING=circle icon, IN_PROGRESS=animated spinner, DONE=checkmark_circle green, FAILED=error_circle red"
