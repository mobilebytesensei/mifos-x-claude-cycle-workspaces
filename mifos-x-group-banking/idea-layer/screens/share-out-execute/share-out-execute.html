<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share-Out Execute — CommonPurse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --primary:#2E7D32;--primary-dark:#1B5E20;--primary-light:#4CAF50;
  --secondary:#FF8F00;--tertiary:#1565C0;
  --on-primary:#FFFFFF;--surface:#FAFAFA;--on-surface:#1A1C19;
  --error:#D32F2F;--primary-container:#A6F1A6;--secondary-container:#FFDDB3;
  --outline:#C8CAC4;--outline-variant:#E5E7E1;
  --surface-variant:#ECF3EC;--on-surface-variant:#43483E;
  font-family:'Noto Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;font-family:'Noto Sans',sans-serif;padding-top:56px}
body.embedded{background:transparent;display:block;min-height:unset;padding-top:0}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:200;background:#1e1e2e;border-bottom:1px solid #333;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;height:56px}
body.embedded #toolbar{display:none}
#toolbar .logo{font-size:13px;font-weight:700;color:#a6f1a6;margin-right:8px}
#toolbar select{background:#2a2a3e;color:#e0e0e0;border:1px solid #444;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
#toolbar button{background:#2E7D32;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
.tb-label{color:#888;font-size:11px}
#phone{width:390px;height:844px;background:var(--surface);border-radius:44px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.7)}
body.embedded #phone{width:100%;height:100vh;border-radius:0;box-shadow:none}
.screen-wrap{display:flex;flex-direction:column;height:100%}
.status-bar{height:44px;background:var(--primary);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
body.embedded .status-bar{display:none}
.status-bar .time{color:#fff;font-size:13px;font-weight:600}
.status-bar .icons{display:flex;gap:6px;align-items:center}
.status-bar .icons span{color:#fff;font-size:16px}
.app-bar{height:56px;background:var(--primary);display:flex;align-items:center;padding:0 4px;flex-shrink:0}
.app-bar .back-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:#fff}
.app-bar h1{flex:1;font-size:20px;font-weight:600;color:#fff}
.app-bar .action-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:#fff}
.scroll-content{flex:1;overflow-y:auto;background:var(--surface)}
.scroll-content::-webkit-scrollbar{display:none}
.bottom-nav{height:64px;background:#fff;border-top:1px solid var(--outline-variant);display:flex;align-items:center;justify-content:space-around;flex-shrink:0}
body.embedded .bottom-nav{display:none}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;cursor:pointer}
.nav-item.active .nav-icon-wrap{background:var(--primary-container)}
.nav-icon-wrap{border-radius:16px;padding:4px 8px;min-width:48px;display:flex;justify-content:center}
.nav-item .material-symbols-outlined{font-size:22px;color:var(--on-surface-variant)}
.nav-item.active .material-symbols-outlined{color:var(--primary)}
.nav-item span.label{font-size:10px;color:var(--on-surface-variant);font-weight:500}
.nav-item.active span.label{color:var(--primary);font-weight:700}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#e8e8e8 25%,#f5f5f5 50%,#e8e8e8 75%);background-size:800px 100%;animation:shimmer 1.4s infinite}
.skel-line{height:16px;border-radius:8px;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes successPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.success-icon{animation:successPop .5s cubic-bezier(.34,1.56,.64,1) both}
/* Cards */
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:16px;margin:0 16px 12px}
/* Section header */
.section-hdr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--on-surface-variant);padding:12px 16px 6px}
/* Summary banner */
.summary-banner{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);padding:16px 20px;color:#fff}
.summary-banner .title{font-size:16px;font-weight:700;margin-bottom:4px}
.summary-banner .subtitle{font-size:13px;opacity:.85}
/* Confirm input */
.confirm-box{background:#fff;border-radius:12px;margin:0 16px 12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.confirm-box .confirm-label{font-size:13px;color:var(--on-surface-variant);margin-bottom:10px;line-height:1.5}
.confirm-box input{width:100%;border:2px solid var(--outline);border-radius:8px;padding:12px 14px;font-size:15px;font-family:'Noto Sans',sans-serif;outline:none;transition:border-color .2s;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.confirm-box input:focus{border-color:var(--primary)}
.confirm-box input.valid{border-color:var(--primary);background:var(--primary-container)}
.confirm-box input.invalid{border-color:var(--error)}
/* Member row */
.member-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--outline-variant)}
.member-row:last-child{border-bottom:none}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.status-badge{font-size:11px;font-weight:700;border-radius:12px;padding:3px 8px;display:inline-flex;align-items:center;gap:3px}
.status-PENDING{background:#F5F5F5;color:#757575}
.status-IN_PROGRESS{background:#E3F2FD;color:var(--tertiary)}
.status-DONE{background:var(--primary-container);color:var(--primary-dark)}
.status-FAILED{background:#FFEBEE;color:var(--error)}
.status-QUEUED{background:var(--secondary-container);color:#E65100}
/* Progress bar */
.progress-wrap{background:var(--outline-variant);border-radius:4px;height:8px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
/* Buttons */
.btn-danger{background:var(--error);color:#fff;border:none;border-radius:100px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Noto Sans',sans-serif;width:100%;box-shadow:0 2px 8px rgba(211,47,47,.3);transition:opacity .2s}
.btn-danger:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;border:none;border-radius:100px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Noto Sans',sans-serif;width:100%;box-shadow:0 2px 8px rgba(46,125,50,.3);transition:background .2s}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:100px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Noto Sans',sans-serif;width:100%}
.btn-row{padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}
/* Warn */
.warn-chip{background:var(--secondary-container);border-radius:8px;padding:10px 14px;margin:0 16px 12px;display:flex;gap:8px;align-items:flex-start}
.warn-chip p{font-size:12px;color:#5D4037;line-height:1.5}
/* Success screen */
.success-screen{display:flex;flex-direction:column;align-items:center;padding:40px 24px;text-align:center}
.success-circle{width:100px;height:100px;border-radius:50%;background:var(--primary-container);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
</style>
</head>
<body>
<div id="toolbar">
  <span class="logo">CommonPurse</span>
  <span class="tb-label">Screen:</span>
  <span style="color:#a6f1a6;font-size:12px;font-weight:600">share-out-execute</span>
  <span class="tb-label" style="margin-left:8px">State:</span>
  <select id="stateSelect" onchange="switchState(this.value)">
    <option value="awaiting" selected>awaiting</option>
    <option value="confirmed">confirmed</option>
    <option value="executing">executing</option>
    <option value="success">success</option>
    <option value="partial_failure">partial_failure</option>
    <option value="offline_queued">offline_queued</option>
  </select>
  <button onclick="switchState(document.getElementById('stateSelect').value)">Reload</button>
</div>
<div id="phone">
  <div class="screen-wrap">
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <span class="material-symbols-outlined" style="font-size:16px">signal_cellular_alt</span>
        <span class="material-symbols-outlined" style="font-size:16px">wifi</span>
        <span class="material-symbols-outlined" style="font-size:16px">battery_full</span>
      </div>
    </div>
    <div class="app-bar">
      <div class="back-btn"><span class="material-symbols-outlined">arrow_back</span></div>
      <h1 id="appTitle">Execute Share-Out</h1>
      <div class="action-btn"><span class="material-symbols-outlined">more_vert</span></div>
    </div>
    <div class="scroll-content" id="mainContent"></div>
    <div class="bottom-nav">
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">home</span></div><span class="label">Home</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">group</span></div><span class="label">Group</span></div>
      <div class="nav-item active"><div class="nav-icon-wrap"><span class="material-symbols-outlined">savings</span></div><span class="label">Share-Out</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">sync</span></div><span class="label">Sync</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">settings</span></div><span class="label">Settings</span></div>
    </div>
  </div>
</div>
<script>
var EMBEDDED=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
if(EMBEDDED)document.body.classList.add('embedded');

var MEMBERS=[
  {id:'GM',name:'Grace Mwangi',initials:'GM',avatarBg:'#A6F1A6',avatarColor:'#1B5E20',role:'Chairperson',payout:14388,phone:'0712 345 678'},
  {id:'MA',name:'Mary Akinyi',initials:'MA',avatarBg:'#BBDEFB',avatarColor:'#0D47A1',role:'Secretary',payout:13981,phone:'0723 456 789'},
  {id:'JN',name:'Jane Njoroge',initials:'JN',avatarBg:'#E1BEE7',avatarColor:'#4A148C',role:'Member',payout:12544,phone:'0734 567 890'},
  {id:'AD',name:'Amara Diallo',initials:'AD',avatarBg:'#FFDDB3',avatarColor:'#E65100',role:'Treasurer',payout:12747,phone:'0745 678 901'},
  {id:'PO',name:'Peter Otieno',initials:'PO',avatarBg:'#F8BBD0',avatarColor:'#880E4F',role:'Member',payout:11950,phone:'0756 789 012'}
];
var TOTAL_POOL=MEMBERS.reduce(function(s,m){return s+m.payout},0);
function fmtKES(n){return'KES '+n.toLocaleString('en-KE')}
function icon(n,s){return'<span class="material-symbols-outlined" style="font-size:'+(s||20)+'px">'+n+'</span>'}

var statusOrder={PENDING:0,QUEUED:1,IN_PROGRESS:2,DONE:3,FAILED:4};
var statusIcon={PENDING:'radio_button_unchecked',QUEUED:'schedule',IN_PROGRESS:'sync',DONE:'check_circle',FAILED:'cancel'};
var statusLabel={PENDING:'Pending',QUEUED:'Queued',IN_PROGRESS:'Processing…',DONE:'Paid',FAILED:'Failed'};

function memberRows(statuses){
  var h='';
  MEMBERS.forEach(function(m,i){
    var st=statuses[i]||'PENDING';
    h+='<div class="member-row">';
    h+='<div class="avatar" style="background:'+m.avatarBg+';color:'+m.avatarColor+'">'+m.initials+'</div>';
    h+='<div style="flex:1">';
    h+='<div style="font-size:14px;font-weight:600">'+m.name+'</div>';
    h+='<div style="font-size:12px;color:#888">'+m.role+' &middot; '+m.phone+'</div>';
    h+='</div>';
    h+='<div style="text-align:right">';
    h+='<div style="font-size:14px;font-weight:700;color:var(--primary-dark)">'+fmtKES(m.payout)+'</div>';
    h+='<span class="status-badge status-'+st+'">'+icon(statusIcon[st],13)+' '+statusLabel[st]+'</span>';
    h+='</div></div>';
  });
  return h;
}

function summaryBanner(subtitle){
  return'<div class="summary-banner">'
    +'<div class="title">Mwangaza Women\'s Group — Cycle 3</div>'
    +'<div class="subtitle">'+subtitle+'</div>'
    +'</div>';
}

function renderAwaiting(){
  var h=summaryBanner('Total distribution: '+fmtKES(TOTAL_POOL)+' to '+MEMBERS.length+' members');
  h+='<div style="background:#fff2e0;border-radius:12px;margin:16px 16px 0;padding:14px 16px;border-left:4px solid var(--secondary)">';
  h+='<div style="font-size:13px;font-weight:700;color:#E65100;margin-bottom:6px">'+icon('warning',16)+' Irreversible Action</div>';
  h+='<div style="font-size:12px;color:#795548;line-height:1.5">Executing share-out will disburse funds to all members via M-Pesa. This action cannot be undone without admin intervention. Verify all amounts carefully before proceeding.</div>';
  h+='</div>';
  h+='<div class="section-hdr">Payout Summary</div>';
  h+='<div class="card">';
  h+=memberRows(['PENDING','PENDING','PENDING','PENDING','PENDING']);
  h+='</div>';
  h+='<div class="section-hdr">Confirmation Gate</div>';
  h+='<div class="confirm-box">';
  h+='<div class="confirm-label">To confirm this irreversible action, type <strong style="letter-spacing:2px;color:var(--primary-dark)">SHARE OUT</strong> exactly as shown in the field below:</div>';
  h+='<input type="text" id="confirmInput" placeholder="Type SHARE OUT" oninput="checkConfirm(this)">';
  h+='<div style="font-size:11px;color:#888;margin-top:8px">'+icon('fingerprint',14)+' Or use biometric authentication instead</div>';
  h+='</div>';
  h+='<div class="warn-chip">';
  h+=icon('info');
  h+='<p>M-Pesa transfers may take 1–5 minutes per member. Keep the app open during execution. If a transfer fails, you can retry individual members.</p>';
  h+='</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-danger" id="executeBtn" disabled onclick="switchState(\'executing\')">'+icon('payments',18)+'&nbsp;Execute Share-Out ('+fmtKES(TOTAL_POOL)+')</button>';
  h+='<button class="btn-outline" onclick="alert(\'Navigate back to preview\')">'+icon('arrow_back',16)+'&nbsp;Back to Preview</button>';
  h+='</div>';
  return h;
}

function renderConfirmed(){
  var h=summaryBanner('Confirmation received — ready to execute');
  h+='<div style="background:var(--primary-container);border-radius:12px;margin:16px 16px 0;padding:14px 16px;border-left:4px solid var(--primary);display:flex;gap:10px;align-items:flex-start">';
  h+='<span class="material-symbols-outlined" style="color:var(--primary);font-size:22px;flex-shrink:0">check_circle</span>';
  h+='<div><div style="font-size:13px;font-weight:700;color:var(--primary-dark);margin-bottom:4px">Confirmation Verified</div>';
  h+='<div style="font-size:12px;color:var(--primary-dark);line-height:1.5">You typed "SHARE OUT" correctly. Press Execute to begin disbursing funds to '+MEMBERS.length+' members.</div></div>';
  h+='</div>';
  h+='<div class="section-hdr">Ready to Disburse</div>';
  h+='<div class="card">'+memberRows(['PENDING','PENDING','PENDING','PENDING','PENDING'])+'</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-danger" onclick="switchState(\'executing\')">'+icon('payments',18)+'&nbsp;Execute Now — '+fmtKES(TOTAL_POOL)+'</button>';
  h+='<button class="btn-outline" onclick="switchState(\'awaiting\')">'+icon('arrow_back',16)+'&nbsp;Go Back</button>';
  h+='</div>';
  return h;
}

function renderExecuting(){
  var done=2,total=MEMBERS.length,pct=Math.round(done/total*100);
  var h=summaryBanner('Sending '+fmtKES(TOTAL_POOL)+' to '+total+' members…');
  h+='<div style="margin:16px 16px 0">';
  h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="font-weight:600;color:var(--on-surface)">Progress: '+done+' of '+total+' completed</span><span style="color:var(--primary);font-weight:700">'+pct+'%</span></div>';
  h+='<div class="progress-wrap"><div class="progress-fill" style="width:'+pct+'%;background:var(--primary)"></div></div>';
  h+='<div style="font-size:12px;color:#888;margin-top:6px">Estimated remaining: ~3 minutes</div>';
  h+='</div>';
  h+='<div class="section-hdr">Transfer Status</div>';
  h+='<div class="card">'+memberRows(['DONE','DONE','IN_PROGRESS','PENDING','PENDING'])+'</div>';
  h+='<div class="warn-chip">';
  h+=icon('info');
  h+='<p>Do not close the app. Transfers are in progress. Jane Njoroge\'s payment is being processed now.</p>';
  h+='</div>';
  h+='<div style="padding:12px 16px 24px">';
  h+='<button class="btn-outline" style="border-color:#888;color:#888;cursor:not-allowed" disabled>'+icon('cancel',16)+'&nbsp;Cancel (not available during execution)</button>';
  h+='</div>';
  return h;
}

function renderSuccess(){
  var h='<div class="success-screen">';
  h+='<div class="success-circle success-icon"><span class="material-symbols-outlined" style="font-size:56px;color:var(--primary)">check_circle</span></div>';
  h+='<div style="font-size:22px;font-weight:700;color:var(--on-surface);margin-bottom:8px">Share-Out Complete!</div>';
  h+='<div style="font-size:14px;color:#888;line-height:1.6;margin-bottom:8px">All 5 members have received their share-out payments via M-Pesa. Cycle 3 is now closed.</div>';
  h+='<div style="background:var(--primary-container);border-radius:12px;padding:12px 16px;margin:8px 0 20px;width:100%;text-align:left">';
  h+='<div style="font-size:13px;font-weight:700;color:var(--primary-dark);margin-bottom:8px">Distribution Summary</div>';
  MEMBERS.forEach(function(m){
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px">';
    h+='<div style="display:flex;align-items:center;gap:6px"><div style="width:24px;height:24px;border-radius:50%;background:'+m.avatarBg+';color:'+m.avatarColor+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">'+m.initials+'</div>'+m.name+'</div>';
    h+='<div style="font-weight:700;color:var(--primary-dark)">'+fmtKES(m.payout)+'</div>';
    h+='</div>';
  });
  h+='<div style="border-top:1px solid var(--primary-light);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--primary-dark)"><span>TOTAL DISBURSED</span><span>'+fmtKES(TOTAL_POOL)+'</span></div>';
  h+='</div>';
  h+='<div style="font-size:13px;color:#888;margin-bottom:20px">Cycle 3 closed: 2026-05-06 at 09:41 · By: Amara Diallo (Treasurer)</div>';
  h+='<button class="btn-primary" onclick="alert(\'Navigate to Group Dashboard\')">'+icon('home',18)+'&nbsp;Back to Dashboard</button>';
  h+='<button class="btn-outline" style="margin-top:10px" onclick="alert(\'Download receipt\')">'+icon('download',16)+'&nbsp;Download Receipt</button>';
  h+='</div>';
  return h;
}

function renderPartialFailure(){
  var h=summaryBanner('3 of 5 transfers completed — 2 failed');
  h+='<div style="background:#FFEBEE;border-radius:12px;margin:16px 16px 0;padding:14px 16px;border-left:4px solid var(--error);display:flex;gap:10px">';
  h+='<span class="material-symbols-outlined" style="color:var(--error);font-size:22px;flex-shrink:0">error</span>';
  h+='<div><div style="font-size:13px;font-weight:700;color:var(--error);margin-bottom:4px">Partial Failure — Action Required</div>';
  h+='<div style="font-size:12px;color:#C62828;line-height:1.5">2 M-Pesa transfers failed. The members listed below need to be retried manually or via alternative payment.</div></div>';
  h+='</div>';
  h+='<div class="section-hdr">Transfer Results</div>';
  h+='<div class="card">'+memberRows(['DONE','DONE','DONE','FAILED','FAILED'])+'</div>';
  h+='<div class="section-hdr">Failed Transfer Details</div>';
  h+='<div class="card">';
  var failed=[MEMBERS[3],MEMBERS[4]];
  var errors=['M-Pesa timeout after 3 retries — Recipient number invalid','Network error during disbursement — Please retry'];
  failed.forEach(function(m,i){
    h+='<div style="padding:12px 0;border-bottom:1px solid var(--outline-variant)">';
    h+='<div style="font-size:14px;font-weight:600;margin-bottom:4px">'+m.name+'</div>';
    h+='<div style="font-size:12px;color:var(--error);margin-bottom:6px">'+icon('error',13)+' '+errors[i]+'</div>';
    h+='<div style="font-size:12px;color:#888">Amount: '+fmtKES(m.payout)+' &middot; Phone: '+m.phone+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-danger" onclick="switchState(\'success\')">'+icon('refresh',18)+'&nbsp;Retry Failed Transfers</button>';
  h+='<button class="btn-outline" onclick="alert(\'Mark as paid manually\')">'+icon('check',16)+'&nbsp;Mark as Paid Manually</button>';
  h+='</div>';
  return h;
}

function renderOfflineQueued(){
  var h=summaryBanner('Offline — execution queued for '+fmtKES(TOTAL_POOL));
  h+='<div style="background:#E8EAF6;border-radius:12px;margin:16px 16px 0;padding:14px 16px;border-left:4px solid var(--tertiary);display:flex;gap:10px">';
  h+='<span class="material-symbols-outlined" style="color:var(--tertiary);font-size:22px;flex-shrink:0;'+'" class="pulse">wifi_off</span>';
  h+='<div><div style="font-size:13px;font-weight:700;color:var(--tertiary);margin-bottom:4px">Offline — Share-Out Queued</div>';
  h+='<div style="font-size:12px;color:#1A237E;line-height:1.5">You are currently offline. The share-out execution has been queued and will automatically proceed when connectivity is restored. Member statuses show QUEUED.</div></div>';
  h+='</div>';
  h+='<div class="section-hdr">Queued Payments</div>';
  h+='<div class="card">'+memberRows(['QUEUED','QUEUED','QUEUED','QUEUED','QUEUED'])+'</div>';
  h+='<div class="section-hdr">Queue Details</div>';
  h+='<div class="card">';
  h+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--outline-variant)"><span style="font-size:13px;color:#888">Queue ID</span><span style="font-size:13px;font-weight:600">SOE-2026-0506-003</span></div>';
  h+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--outline-variant)"><span style="font-size:13px;color:#888">Queued at</span><span style="font-size:13px;font-weight:600">09:41 local time</span></div>';
  h+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--outline-variant)"><span style="font-size:13px;color:#888">Total amount</span><span style="font-size:13px;font-weight:700;color:var(--primary-dark)">'+fmtKES(TOTAL_POOL)+'</span></div>';
  h+='<div style="display:flex;justify-content:space-between;padding:8px 0"><span style="font-size:13px;color:#888">Auto-execute on connect</span><span style="font-size:13px;font-weight:600;color:var(--primary)">Yes</span></div>';
  h+='</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-outline" onclick="alert(\'Cancelled queue\')">'+icon('cancel',16)+'&nbsp;Cancel Queued Execution</button>';
  h+='</div>';
  return h;
}

var STATES={
  awaiting:renderAwaiting,
  confirmed:renderConfirmed,
  executing:renderExecuting,
  success:renderSuccess,
  partial_failure:renderPartialFailure,
  offline_queued:renderOfflineQueued
};
var currentState='awaiting';

function checkConfirm(inp){
  var val=inp.value.trim().toUpperCase();
  var btn=document.getElementById('executeBtn');
  if(val==='SHARE OUT'){
    inp.classList.add('valid');
    inp.classList.remove('invalid');
    if(btn){btn.disabled=false;}
  } else {
    inp.classList.remove('valid');
    if(val.length>0)inp.classList.add('invalid');
    if(btn){btn.disabled=true;}
  }
}

function switchState(s){
  if(!STATES[s])return;
  currentState=s;
  document.getElementById('stateSelect').value=s;
  document.getElementById('mainContent').innerHTML=STATES[s]();
  notifyParent();
}
function notifyParent(){
  if(!EMBEDDED)return;
  window.parent.postMessage({type:'screenLoaded',screenId:'share-out-execute',state:currentState,
    inspectorData:{screen:'share-out-execute',title:'Execute Share-Out',state:currentState,
      components:['SummaryBanner','ConfirmationGate','MemberRows','ProgressBar','ActionButtons'],
      data:{group:'Mwangaza Women\'s Group',cycle:3,pool:TOTAL_POOL,members:MEMBERS.length}}},'*');
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='switchState')switchState(e.data.state);
  if(e.data&&e.data.type==='getInspectorData')notifyParent();
});
switchState('awaiting');
</script>
