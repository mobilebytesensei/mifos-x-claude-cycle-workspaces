      ACCUMULATING share-out payload. Sent as memberPayouts[] in the post_shareout_execute body.
      savingsAccountId removed — companion API resolves accounts server-side from memberId + groupId.
      KES amounts match the PRORATA_SAVINGS preview for Mwangaza Women's Group cycle 1.
    items:
      - memberId: "MBR-101"
        payoutAmount: 6792.00
        sharePercent: 28.3

      - memberId: "MBR-102"
        payoutAmount: 5208.00
        sharePercent: 21.7

