        sharePercent: 20.0

      - memberId: "MBR-104"
        payoutAmount: 4392.00
        sharePercent: 18.3

      - memberId: "MBR-105"
        payoutAmount: 2808.00
        sharePercent: 11.7

  - dto: MemberPayout
    count_hint: 5
    source_notes: >
      Full MemberPayout items for the per-member execution progress list. Shows memberInitials
      for avatar rendering and execution status (PENDING → IN_PROGRESS → DONE/FAILED).
    items:
      - memberId: "MBR-101"
        memberName: "Amina Wanjiru"
        memberInitials: "AW"
        sharesHeld: null
        totalSavings: 6000.00
        sharePercent: 28.3
        payoutAmount: 6792.00

      - memberId: "MBR-102"
        memberName: "Joseph Kamau"
        memberInitials: "JK"
        sharesHeld: null
        totalSavings: 4800.00
        sharePercent: 21.7
        payoutAmount: 5208.00

      - memberId: "MBR-103"
        memberName: "Grace Wanjiku"
        memberInitials: "GW"
        sharesHeld: null
        totalSavings: 3850.00
        sharePercent: 20.0
        payoutAmount: 4800.00

      - memberId: "MBR-104"
        memberName: "Peter Otieno"
        memberInitials: "PO"
        sharesHeld: null
        totalSavings: 3000.00
        sharePercent: 18.3
        payoutAmount: 4392.00

      - memberId: "MBR-105"
        memberName: "Mary Akinyi"
        memberInitials: "MA"
        sharesHeld: null
        totalSavings: 2250.00
        sharePercent: 11.7
        payoutAmount: 2808.00

  - dto: ShareOutExecuteResponse
    count_hint: 2
    source_notes: >
      Two variants: (1) full-success — all 5 payouts succeed; (2) partial-failure — 1 failed.
      Companion API returns aggregate counts + failedMemberIds list.
    items:
      - shareoutRecordId: "SOR-20260509-001"
        succeededCount: 5
        failedCount: 0
        failedMemberIds: []

      - shareoutRecordId: "SOR-20260509-002"
        succeededCount: 4
        failedCount: 1
        failedMemberIds: ["MBR-105"]

  - dto: RotationPayoutExecuteResponse
    count_hint: 1
    source_notes: >
      ROTATING_PAYOUT execution response for Tumaini ROSCA cycle 3. Grace Wairimu
      receives the full pool (KES 30,000). Rotation advances to position 4.
    items:
      - rotationRecordId: "RPR-20260509-003"
        newRotationPosition: 4
        nextRecipientId: "MBR-201"

  - dto: MemberExecutionStatus
    count_hint: 5
    source_notes: >
      Execution status values for per-member progress rows during execute animation.
      States cycle: PENDING → IN_PROGRESS → DONE | FAILED | QUEUED.
    items:
      - memberId: "MBR-101"
        status: "DONE"
      - memberId: "MBR-102"
        status: "DONE"
      - memberId: "MBR-103"
        status: "IN_PROGRESS"
      - memberId: "MBR-104"
        status: "PENDING"
      - memberId: "MBR-105"
        status: "PENDING"

  - dto: SyncQueueItem
    count_hint: 2
    source_notes: >
      Offline sync queue rows for the two entity_type payloads this feature enqueues
      when the operator taps Execute while offline. HIGH-priority rows drained on
      connectivity restoration by the background sync worker. payloadJson is the
      serialized post_shareout_execute or post_rotation_payout_execute request body.
    items:
      - id: 1042
        entityType: "SHARE_OUT_EXECUTE"
        operation: "POST"
        payloadJson: '{"groupId":"grp-mwangaza-001","cycleNumber":1,"totalPool":24000.00,"shareoutFormula":"PRORATA_SAVINGS","executedAt":"2026-05-09T10:15:00Z","memberPayouts":[{"memberId":"MBR-101","payoutAmount":6792.00,"sharePercent":28.3}]}'
        status: "PENDING"
        priority: 100

      - id: 1043
        entityType: "ROTATION_PAYOUT_EXECUTE"
        operation: "POST"
        payloadJson: '{"groupId":"grp-tumaini-002","recipientMemberId":"MBR-203","amount":30000.00,"payoutOrderMethod":"FIXED_ORDER","executedAt":"2026-05-09T10:22:00Z"}'
        status: "PENDING"
        priority: 100

  - dto: SyncStatus
    count_hint: 4
    source_notes: >
      Enum values for the sync_queue row status column. Rows start PENDING when
      enqueued offline, transition to IN_PROGRESS while the drain worker is
      posting, then land in SYNCED (200/201 from companion) or FAILED
      (persistent 4xx/5xx after retry budget).
    items:
      - status: "PENDING"
      - status: "IN_PROGRESS"
      - status: "SYNCED"
      - status: "FAILED"

  - dto: payout
    count_hint: 1
    source_notes: >
      Singular per-row binding target for member_payout_row ({{payout.*}}), the repeat
      variable over memberPayouts. A single PRORATA distribution row for the top-share member
      (Amina Wanjiru) in Mwangaza Women's Group cycle 1 — reflects the pro-rata share-out
      strategy (28.3% of the KES 24,000 pool).
    items:
      - memberId: "MBR-101"
        memberName: "Amina Wanjiru"
        memberInitials: "AW"
        sharesHeld: null
        totalSavings: 6000.00
        sharePercent: 0.283
        payoutAmount: 6792.00

