requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: share-out-execute

route: /groups/{groupId}/share-out/execute
entry_points:
  - source: share-out-preview
    condition: "viewerRole in [ORGANIZER, TREASURER, CHAIRPERSON] && taps_confirm"
nav_params:
  groupId: { type: String, required: true }
  typeConfig: { type: GroupTypeConfig, required: true }    # drives execution labels + COMP-DIST branch
  totalPool: { type: Double, required: true, currency: KES }
  memberPayouts: { type: "List<MemberPayout>", required: true }   # empty for ROTATING_PAYOUT

screens:
  - id: share-out-execute-screen
    name: ShareOutExecuteScreen
    composable: ShareOutExecuteScreen
    type: detail
    description: >
      Strategy-adaptive execution screen. Screen title and execute button label adapt to typeConfig.shareout_formula:
      PRORATA_SHARES/PRORATA_SAVINGS/EQUAL → "Execute Share-Out"; FIXED_ORDER/LOTTERY/AUCTION →
      "Execute Rotation Payout". For ROTATING_PAYOUT the payout list is replaced by a single
      next-recipient row. Calls COMP-DIST-001 for ACCUMULATING types; COMP-DIST-002 for
      ROTATING_PAYOUT (ROSCA-specific). Double-confirmation gate retained. Offline queuing retained.
    layout: Column (TopAppBar + ScrollableContent + StickyFooterButton)

state_model:
  ShareOutExecuteViewModel:
    state:
      name: ShareOutExecuteState
      fields:
        groupId: { type: String, default: '""' }
        typeConfig: { type: "GroupTypeConfig?", default: "null" }
        poolModel: { type: String, default: '""' }          # ACCUMULATING | ROTATING_PAYOUT
        shareoutFormula: { type: String, default: '""' }    # drives label + COMP-DIST branch
        confirmationText: { type: String, default: '""' }
        isConfirmed: { type: Boolean, default: "false" }
        isExecuting: { type: Boolean, default: "false" }
        executedCount: { type: Int, default: "0" }
        totalCount: { type: Int, default: "0" }
        memberPayouts: { type: "List<MemberPayout>", default: "emptyList()" }   # empty for ROTATING_PAYOUT
        memberExecutionStatus: { type: "Map<String, MemberExecutionStatus>", default: "emptyMap()" }
        totalPool: { type: Double, default: "0.0" }
        isOnline: { type: Boolean, default: "true" }
        isCompleted: { type: Boolean, default: "false" }
        queuedOffline: { type: Boolean, default: "false" }
        error: { type: "ShareOutError?", default: "null" }
        failedPayouts: { type: "List<MemberPayout>", default: "emptyList()" }
        succeededCount: { type: Int, default: "0" }
    screen_state:
      name: ShareOutExecuteScreenState
      members:
        - Content: "awaiting double-confirmation (role: organizer/treasurer/chairperson)"
        - Executing: "executing via COMP-DIST-001 or COMP-DIST-002; per-member status shown"
        - Success: "all payouts completed; completion banner shown"
        - PartialFailure: "some payouts failed; retry available for failed members"
        - Error: "full failure or fatal error; execute button re-enabled"
    errors:
      name: ShareOutError
      types:
        - { type: Network, retry: false, message_key: error_queued_offline }
        - { type: Server, retry: true, message_key: error_server }
        - { type: PartialFailure, retry: true, message_key: error_partial }
        - { type: Auth, retry: false, message_key: error_auth }
        - { type: ConfirmationRequired, retry: false, message_key: error_confirmation_required }
    events:
      name: ShareOutExecuteEvent
      members:
        - { name: NavigateToGroupDashboard, params: "groupId: String" }
        - { name: NavigateBack }
        - { name: ShowBiometricPrompt }
        - { name: ShowSnackbar, params: "message: String" }
    actions:
      name: ShareOutExecuteAction
      members:
        - { name: OnConfirmationTextChanged, params: "text: String", trigger: "Type in confirmation field" }
        - { name: OnBiometricSelected, trigger: "Tap Use Biometric Instead button" }
        - { name: OnExecute, trigger: "Tap Execute button (label is strategy-adaptive)" }
        - { name: OnRetryFailed, trigger: "Tap Retry Failed Payouts button on PartialFailure state" }
        - { name: OnBack, trigger: "Tap back navigation icon (only enabled before execution starts)" }
        - { name: OnDone, trigger: "Tap Done button after completion or offline queue" }
    di:
      - ShareOutRepository    # COMP-DIST-001 (accumulating) + COMP-DIST-002 (rotation)
      - SyncQueueRepository
      - BiometricManager
      - NetworkMonitor
      - SessionManager

components:
  - id: top_bar
    type: top-app-bar
    title: "{{shareoutFormula in ['FIXED_ORDER','LOTTERY','AUCTION'] ? '{strings.screen_title_rotation}' : '{strings.screen_title_shareout}'}}"
    style: { background: primary, text_color: onPrimary }
    navigation_icon: arrow_left_24_regular
    accessibility_label: "{strings.a11y_back}"
    nav_enabled_when: "!isExecuting && !isCompleted"
    on_navigation_click:
      action: OnBack
      action_contract:
        effect: navigate
        description: "Emit NavigateBack to return to share-out-preview, but only while the back icon is enabled (before execution starts and after completion it is disabled); a pure navigation event that abandons the un-executed distribution without touching corpus, payouts or the sync_queue."

  - id: summary_card
    type: card
    style: { background: primaryContainer, corner_radius: 12dp, padding: 16dp, elevation: 0dp, margin: "16dp 16dp 0dp" }
    content:
      - { type: text, value: "{strings.total_pool_label}", style: { text_style: labelMedium, color: onPrimaryContainer } }
      - { type: text, value: "KES {{totalPool | number}}", i18n: skip, style: { text_style: headlineSmall, color: onPrimaryContainer, font_weight: bold } }
      - { type: text, value: "{{poolModel == 'ROTATING_PAYOUT' ? '{strings.summary_one_recipient}' : totalCount + ' {strings.summary_members_to_receive}'}}", style: { text_style: bodyMedium, color: onPrimaryContainer, margin_top: 4dp } }

  - id: payout_list_header
    type: text
    value: "{{poolModel == 'ROTATING_PAYOUT' ? '{strings.header_rotation_payout}' : '{strings.header_member_payouts}'}}"
    style: { text_style: titleSmall, color: onSurfaceVariant, padding: "16dp 16dp 4dp" }

  - id: member_payout_row
    type: list-item
    visible: "{{poolModel != 'ROTATING_PAYOUT'}}"
    repeats_for: memberPayouts
    style: { padding_horizontal: 16dp, padding_vertical: 12dp, divider: true, min_height: 56dp }
    content:
      leading: { type: avatar, initials: "{{payout.memberInitials}}", size: 40dp, background: secondaryContainer }
      headline: { type: text, value: "{{payout.memberName}}", i18n: skip, style: { text_style: bodyLarge } }
      supporting: { type: text, value: "KES {{payout.payoutAmount | number}} ({{(payout.sharePercent * 100).toInt()}}%)", i18n: skip, style: { text_style: bodyMedium, color: primary } }
      trailing:
        type: icon_badge
        visible_when: "isExecuting || isCompleted || queuedOffline"
        value: "{{memberExecutionStatus[payout.memberId]}}"
        style:
          PENDING: { icon: circle_24_regular, color: onSurfaceVariant }
          IN_PROGRESS: { icon: spinner_ios_20_filled, color: secondary, animated: true }
          DONE: { icon: checkmark_circle_24_filled, color: primary }
          FAILED: { icon: error_circle_24_filled, color: error }
          QUEUED: { icon: cloud_arrow_up_24_regular, color: secondary }

  - id: offline_info_banner
    type: banner
    visible_when: "!isOnline"
    style: { background: warningContainer, padding: 12dp, margin: "12dp 16dp 0dp" }
    content: "{strings.offline_info_banner}"

  - id: double_confirmation_section
    type: card
    visible_when: "!isExecuting && !isCompleted && !queuedOffline"
    style: { background: surface, elevation: 2dp, corner_radius: 12dp, padding: 16dp, margin: "12dp 16dp 0dp" }
    content:
      - { type: text, value: "{strings.confirm_shareout_title}", style: { text_style: titleSmall, color: onSurface, margin_bottom: 4dp } }
      - { type: text, value: "{strings.confirm_shareout_body}", style: { text_style: bodySmall, color: onSurfaceVariant, margin_bottom: 12dp } }
      - id: confirmation_text_field
        type: text-field
        label: "{strings.confirmation_field_label}"
        placeholder: "{strings.confirmation_field_placeholder}"
        keyboard_type: text
        value: "{{confirmationText}}"
        error_text: '{{confirmationText.isNotBlank() && !isConfirmed ? "{strings.confirmation_field_error}" : null}}'
        accessibility_label: "{strings.a11y_confirmation_field}"
        style: { min_touch_target: 48dp, corner_radius: 8dp }
        on_change:
          action: OnConfirmationTextChanged
          params: { text: "{{inputValue}}" }
          action_contract:
            effect: transform_state
            description: "Update confirmationText in ShareOutExecuteState on each keystroke and set isConfirmed true only when the entry matches the exact phrase \"SHARE OUT\"; this is the gate that enables the Execute button. A pure ViewModel state transition — nothing is persisted or sent until the user taps Execute."
      - id: biometric_button
        type: button
        variant: outlined
        label: "{strings.biometric_button}"
        icon: fingerprint_24_regular
        accessibility_label: "{strings.a11y_biometric_button}"
        style: { corner_radius: 24dp, min_touch_target: 48dp, full_width: true, margin_top: 12dp }
        on_click:
          action: OnBiometricSelected
          action_contract:
            effect: transform_state
            description: "Emit ShowBiometricPrompt so BiometricManager presents the platform fingerprint/face prompt as an alternative to typing \"SHARE OUT\"; a successful authentication sets isConfirmed true, satisfying the double-confirmation gate. No persistence or network call — the biometric result only flips the local confirmation flag."

  # ROTATING_PAYOUT: single-recipient summary card instead of member list
  - id: rotation_execute_card
    type: card
    visible: "{{poolModel == 'ROTATING_PAYOUT'}}"
    style: { background: secondaryContainer, corner_radius: 12dp, elevation: 2dp, padding: 16dp, margin: "0dp 16dp 0dp" }
    content:
      - { type: text, value: "{strings.rotation_paying_out_to}", style: { text_style: labelLarge, color: onSecondaryContainer } }
      - { type: text, value: "{{memberPayouts[0].memberName}}", i18n: skip, style: { text_style: headlineMedium, color: onSecondaryContainer, font_weight: bold } }
      - { type: labeled-value, label: "{strings.rotation_amount_label}", value: "KES {{totalPool | number}}", i18n: skip, style: { text_style: titleLarge, color: onSecondaryContainer } }

  - id: execute_button
    type: button
    variant: filled
    label: "{{shareoutFormula in ['FIXED_ORDER','LOTTERY','AUCTION'] ? '{strings.execute_button_rotation}' : '{strings.execute_button_shareout}'}}"
    visible_when: "!isCompleted && !queuedOffline"
    enabled_when: "isConfirmed && !isExecuting"
    accessibility_label: "{strings.a11y_execute_button}"
    style: { background: error, text_color: onError, corner_radius: 24dp, min_touch_target: 56dp, full_width: true, margin: "12dp 16dp 0dp", loading_when: isExecuting }
    on_click:
      action: OnExecute
      action_contract:
        effect: call_api
        external_library_refs: [ktor-client]
        description: "Execute the irreversible share-out after double-confirmation: for ACCUMULATING types POST the memberPayouts[] to COMP-DIST-001 (/companion/groups/{groupId}/shareout/execute) which records dt_share_out and drains each member's savings withdrawal via Fineract; for ROTATING_PAYOUT types POST the single recipient to COMP-DIST-002 (/rotation/execute) which advances the rosca_rotation slot. Per-member status streams PENDING→IN_PROGRESS→DONE/FAILED; when offline the entire request is serialized to the HIGH-priority sync_queue for later drain."
        writes_to: [share_out_record, member_savings_accounts, sync_queue, shareout_execution_log]

  - id: progress_indicator
    type: linear-progress
    visible_when: isExecuting
    value: "{{executedCount.toFloat() / totalCount.toFloat()}}"
    label: "{{executedCount}} {strings.progress_of} {{totalCount}} {strings.progress_payouts_completed}"
    style: { color: primary, height: 8dp, corner_radius: 4dp, margin: "12dp 16dp 0dp" }

  - id: completion_banner
    type: banner
    visible_when: "isCompleted && failedPayouts.isEmpty()"
    style: { background: primaryContainer, corner_radius: 12dp, padding: 20dp, margin: "16dp 16dp 0dp" }
    content:
      - { type: icon, icon: checkmark_circle_24_filled, size: 48dp, color: primary }
      - { type: text, value: "{strings.success_title_shareout}", style: { text_style: titleLarge, color: onPrimaryContainer, margin_top: 8dp } }
      - { type: text, value: "KES {{totalPool | number}} {strings.success_distributed_to} {{succeededCount}} {strings.success_members_successfully}", style: { text_style: bodyMedium, color: onPrimaryContainer, margin_top: 4dp } }

  - id: partial_failure_banner
    type: banner
    visible_when: "isCompleted && failedPayouts.isNotEmpty()"
    style: { background: warningContainer, corner_radius: 12dp, padding: 16dp, margin: "16dp 16dp 0dp" }
    content:
      - { type: icon, icon: warning_24_filled, size: 32dp, color: onWarningContainer }
      - { type: text, value: "{strings.partial_title}", style: { text_style: titleMedium, color: onWarningContainer, margin_top: 4dp } }
      - { type: text, value: "{{succeededCount}} {strings.partial_of} {{totalCount}} {strings.partial_payouts_succeeded} {{failedPayouts.size}} {strings.partial_failed_tap_retry}", style: { text_style: bodySmall, color: onWarningContainer } }

  - id: queued_offline_banner
    type: banner
    visible_when: queuedOffline
    style: { background: secondaryContainer, corner_radius: 12dp, padding: 16dp, margin: "16dp 16dp 0dp" }
    content:
      - { type: text, value: "{strings.queued_title}", style: { text_style: titleSmall, color: onSecondaryContainer } }
      - { type: text, value: "{{totalCount}} {strings.queued_payouts_body}", style: { text_style: bodySmall, color: onSecondaryContainer } }

  - id: retry_failed_button
    type: button
    variant: filled
    label: "{strings.retry_button}"
    visible_when: "isCompleted && failedPayouts.isNotEmpty()"
    accessibility_label: "{strings.a11y_retry_button}"
    style: { background: secondary, text_color: onSecondary, min_touch_target: 48dp, full_width: true, margin: "12dp 16dp 0dp" }
    on_click:
      action: OnRetryFailed
      action_contract:
        effect: call_api
        external_library_refs: [ktor-client]
        description: "Re-submit only the failedPayouts subset to COMP-DIST-001 (/companion/groups/{groupId}/shareout/execute) so the members that errored on the first pass are re-attempted; the idempotency key on the sync_queue prevents double-paying members that already succeeded. On success those rows move FAILED→DONE and succeededCount increases."

  - id: done_button
    type: button
    variant: filled
    label: "{strings.done_button}"
    visible_when: "(isCompleted && failedPayouts.isEmpty()) || queuedOffline"
    accessibility_label: "{strings.a11y_done_button}"
    style: { background: primary, text_color: onPrimary, corner_radius: 24dp, min_touch_target: 56dp, full_width: true, margin: "12dp 16dp 16dp" }
    on_click:
      action: OnDone
      target: group-dashboard
      params: { groupId: "{{groupId}}" }
      action_contract:
        effect: navigate
        description: "Emit NavigateToGroupDashboard(groupId) to leave the completed (or offline-queued) execute screen and return to the group dashboard, which re-reads the advanced cycle/rotation state; a pure navigation event with no further API call — the distribution has already been executed or queued for sync."

states:
  initial_state: content
  content:
    components_visible: [top_bar, summary_card, payout_list_header, member_payout_row, rotation_execute_card, offline_info_banner, double_confirmation_section, execute_button]
    description: "Awaiting double-confirmation; VSLA shows member table; ROSCA shows single-recipient rotation card"
    demo_data:
      groupId: "grp-001"
      poolModel: "ACCUMULATING"
      shareoutFormula: "PRORATA_SHARES"
      totalPool: 24000.0
      totalCount: 5
      isOnline: true
      isConfirmed: false
      confirmationText: ""
      memberPayouts:
        - { memberId: "m-101", memberName: "Amina Hassan", memberInitials: "AH", sharesHeld: 20, sharePercent: 0.333, payoutAmount: 7992.0 }
        - { memberId: "m-102", memberName: "Peter Otieno", memberInitials: "PO", sharesHeld: 15, sharePercent: 0.25, payoutAmount: 6000.0 }
        - { memberId: "m-103", memberName: "Grace Wanjiku", memberInitials: "GW", sharesHeld: 12, sharePercent: 0.20, payoutAmount: 4800.0 }
        - { memberId: "m-104", memberName: "John Mwangi", memberInitials: "JM", sharesHeld: 8, sharePercent: 0.133, payoutAmount: 3192.0 }
        - { memberId: "m-105", memberName: "Mary Akinyi", memberInitials: "MA", sharesHeld: 5, sharePercent: 0.083, payoutAmount: 2016.0 }
  executing:
    components_visible: [top_bar, summary_card, payout_list_header, member_payout_row, rotation_execute_card, progress_indicator]
    description: "COMP-DIST-001/002 execution in progress; back navigation disabled"
  success:
    components_visible: [top_bar, summary_card, payout_list_header, member_payout_row, rotation_execute_card, completion_banner, done_button]
    description: "All payouts executed successfully via companion API"
  partial_failure:
    components_visible: [top_bar, summary_card, payout_list_header, member_payout_row, partial_failure_banner, retry_failed_button]
    description: "Some payouts failed; retry available"
  error:
    components_visible: [top_bar, summary_card, payout_list_header, member_payout_row, execute_button]
    description: "Fatal execution error; execute button re-enabled for retry"

