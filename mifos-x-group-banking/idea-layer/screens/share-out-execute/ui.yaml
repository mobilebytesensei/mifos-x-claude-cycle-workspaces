    partial_title: "Partial Completion"
    queued_title: "Queued for Sync"
    done_button: "Done"
    retry_button: "Retry Failed Payouts"
    biometric_button: "Use Biometric Instead"
    error_confirmation_required: 'Please type "SHARE OUT" or use biometric to confirm.'
    error_server: "Server error. Please try again."
    error_auth: "Session expired. Please log in again."
  sw:
