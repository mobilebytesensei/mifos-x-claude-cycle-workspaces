<!DOCTYPE html>
<html lang="en" data-feature="share-out-execute" data-state="executing" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>share-out-execute · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .page-content { padding: 16px; }
    .loading-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 32px;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--md-surface-variant, #e5e7eb);
      border-top-color: var(--md-primary, #2563eb);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .executing-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--md-on-surface, #1a1a1a);
      margin-bottom: 8px;
    }
    .executing-hint {
      font-size: 13px;
      color: var(--md-on-surface-variant, #6b7280);
      margin-bottom: 28px;
    }
    .card {
      background: var(--md-surface-container, #f8f9fa);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--md-outline-variant, #f0f0f0);
      font-size: 14px;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .name { color: var(--md-on-surface, #1a1a1a); font-weight: 500; }
    .list-item .meta { color: var(--md-on-surface-variant, #6b7280); font-size: 13px; }
    .success-row .name, .success-row .meta { color: #16a34a; }
    .check-mark { font-size: 14px; color: #16a34a; margin-left: 4px; }
    .progress-bar-wrap {
      background: var(--md-surface-variant, #e5e7eb);
      border-radius: 6px;
      height: 6px;
      margin: 12px 0 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--md-primary, #2563eb);
      height: 100%;
      width: 20%;
      border-radius: 6px;
    }
    .progress-label {
      font-size: 12px;
      color: var(--md-on-surface-variant, #6b7280);
      text-align: right;
    }
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--md-on-surface-variant, #6b7280);
      font-weight: 600;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● 5G ▮</span>
  </div>
  <header class="top-app-bar">
    <button class="back-btn" aria-label="Back" style="visibility:hidden;">‹</button>
    <h1 class="app-bar-title">Execute Share-Out</h1>
  </header>
  <main class="page-content">
    <div class="loading-overlay">
      <div class="spinner"></div>
      <div class="executing-title">Disbursing funds to 5 members…</div>
      <div class="executing-hint">Please do not close this screen.</div>
    </div>

    <!-- Transfer progress list -->
    <div class="card">
      <div class="section-label">Transfer Status</div>
      <div class="list-item success-row">
        <span class="name">Amina Hassan <span class="check-mark">✓</span></span>
        <span class="meta">KES 7,992</span>
      </div>
      <div class="list-item">
        <span class="name">Peter Otieno</span>
        <span class="meta">KES 6,000</span>
      </div>
      <div class="list-item">
        <span class="name">Grace Wanjiku</span>
        <span class="meta">KES 4,800</span>
      </div>
      <div class="list-item">
        <span class="name">John Mwangi</span>
        <span class="meta">KES 3,192</span>
      </div>
      <div class="list-item">
        <span class="name">Mary Akinyi</span>
        <span class="meta">KES 2,016</span>
      </div>

      <!-- Progress indicator -->
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="progress-label">1 of 5 transfers complete</div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
