<!DOCTYPE html>
<html lang="en" data-feature="share-out-execute" data-state="partial_failure" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>share-out-execute · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .page-content { padding: 16px; }
    .partial-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 24px 24px;
      text-align: center;
    }
    .partial-icon {
      font-size: 52px;
      margin-bottom: 14px;
    }
    .partial-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--md-on-surface, #1a1a1a);
      margin-bottom: 6px;
    }
    .partial-subtitle {
      font-size: 14px;
      color: var(--md-on-surface-variant, #6b7280);
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .card {
      background: var(--md-surface-container, #f8f9fa);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .section-label.success { color: #16a34a; }
    .section-label.failure { color: #dc2626; }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--md-outline-variant, #f0f0f0);
      font-size: 14px;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .name { font-weight: 500; }
    .list-item .meta { font-size: 13px; }
    .success-row .name { color: #16a34a; }
    .success-row .meta { color: #16a34a; }
    .success-row .check { color: #16a34a; margin-right: 4px; }
    .failure-row .name { color: #dc2626; }
    .failure-row .meta { color: #dc2626; font-size: 12px; }
    .failure-row .cross { color: #dc2626; margin-right: 4px; }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 10px;
      border: none;
    }
    .btn-primary {
      background: var(--md-primary, #2563eb);
      color: #fff;
    }
    .btn-outlined {
      background: transparent;
      color: var(--md-primary, #2563eb);
      border: 1.5px solid var(--md-primary, #2563eb);
    }
    .btn-full { width: 100%; }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● 5G ▮</span>
  </div>
  <header class="top-app-bar">
    <button class="back-btn" style="visibility:hidden;">‹</button>
    <h1 class="app-bar-title">Execute Share-Out</h1>
  </header>
  <main class="page-content">
    <div class="partial-header">
      <div class="partial-icon">⚠</div>
      <div class="partial-title">Partial Disbursement</div>
      <div class="partial-subtitle">3 of 5 transfers completed successfully.</div>
    </div>

    <!-- Successful transfers -->
    <div class="card">
      <div class="section-label success">Completed</div>
      <div class="list-item success-row">
        <span class="name"><span class="check">✓</span>Amina Hassan</span>
        <span class="meta">KES 7,992</span>
      </div>
      <div class="list-item success-row">
        <span class="name"><span class="check">✓</span>Peter Otieno</span>
        <span class="meta">KES 6,000</span>
      </div>
      <div class="list-item success-row">
        <span class="name"><span class="check">✓</span>Grace Wanjiku</span>
        <span class="meta">KES 4,800</span>
      </div>
    </div>

    <!-- Failed transfers -->
    <div class="card">
      <div class="section-label failure">Failed</div>
      <div class="list-item failure-row">
        <span class="name"><span class="cross">✗</span>John Mwangi</span>
        <span class="meta">Transfer failed</span>
      </div>
      <div class="list-item failure-row">
        <span class="name"><span class="cross">✗</span>Mary Akinyi</span>
        <span class="meta">Transfer failed</span>
      </div>
    </div>

    <!-- Actions -->
    <button class="btn btn-primary btn-full">
      Retry Failed
    </button>
    <button class="btn btn-outlined btn-full" data-nav-to="group-dashboard">
      Back to Group
    </button>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
