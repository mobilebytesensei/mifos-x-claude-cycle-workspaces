<!DOCTYPE html>
<html lang="en" data-feature="share-out-execute" data-state="success" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>share-out-execute · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .page-content { padding: 16px; }
    .success-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 40px;
      text-align: center;
    }
    .success-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .success-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--md-on-surface, #1a1a1a);
      margin-bottom: 10px;
    }
    .success-body {
      font-size: 15px;
      color: var(--md-on-surface-variant, #6b7280);
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .cycle-closed {
      font-size: 13px;
      color: #16a34a;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .btn {
      display: block;
      padding: 14px 16px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 10px;
    }
    .btn-primary {
      background: var(--md-primary, #2563eb);
      color: #fff;
    }
    .btn-full { width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● 5G ▮</span>
  </div>
  <header class="top-app-bar">
    <button class="back-btn" style="visibility:hidden;">‹</button>
    <h1 class="app-bar-title">Execute Share-Out</h1>
  </header>
  <main class="page-content">
    <div class="success-state">
      <div class="success-icon">✅</div>
      <div class="success-title">Share-Out Complete!</div>
      <div class="success-body">KES 24,000 disbursed to 5 members successfully.</div>
      <div class="cycle-closed">Cycle 1 is now closed.</div>
      <button class="btn btn-primary btn-full" data-nav-to="group-dashboard">
        Back to Group
      </button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
