<!DOCTYPE html>
<html lang="en" data-feature="share-out-execute" data-state="error" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>share-out-execute · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .page-content { padding: 16px; }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 40px;
      text-align: center;
    }
    .empty-icon {
      font-size: 52px;
      margin-bottom: 16px;
      color: var(--md-on-surface-variant, #9ca3af);
    }
    .empty-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--md-on-surface, #1a1a1a);
      margin-bottom: 10px;
    }
    .empty-body {
      font-size: 14px;
      color: var(--md-on-surface-variant, #6b7280);
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 290px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-bottom: 10px;
      border: none;
    }
    .btn-primary {
      background: var(--md-primary, #2563eb);
      color: #fff;
    }
    .btn-outlined {
      background: transparent;
      color: var(--md-primary, #2563eb);
      border: 1.5px solid var(--md-primary, #2563eb);
    }
    .btn-full { width: 100%; }
    .actions { width: 100%; padding: 0 24px; box-sizing: border-box; }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● 5G ▮</span>
  </div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="share-out-preview">‹</button>
    <h1 class="app-bar-title">Execute Share-Out</h1>
  </header>
  <main class="page-content">
    <div class="empty-state">
      <div class="empty-icon">☁</div>
      <div class="empty-title">Disbursement Failed</div>
      <div class="empty-body">
        No transfers were completed. Check your connection and try again.
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary btn-full" data-state-to="content">
        Retry
      </button>
      <button class="btn btn-outlined btn-full" data-nav-to="group-dashboard">
        Back to Group
      </button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
