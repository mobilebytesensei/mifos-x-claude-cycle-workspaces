sibling: api
schema_version: "4.0"
feature_id: share-out-execute

api:
  # ACCUMULATING types (VSLA/ASCA/SHG/SILC) — COMP-DIST-001
  - id: post_shareout_execute
    function: post_shareout_execute
    method: POST
    endpoint: "/companion/groups/{groupId}/shareout/execute"   # COMP-DIST-001
    description: >
      Execute share-out for ACCUMULATING types. The companion API records the dt_share_out entry
      and executes per-member savings withdrawals via Fineract in a single transaction.
      Replaces: POST /datatables/dt_share_out/{groupId} + sequential POST /savingsaccounts/{id}/transactions.
    params:
      groupId: { type: String, required: true, source: nav_params }
    body:
      cycleNumber: Int
      totalPool: { type: Double, currency: KES }
      memberPayouts: "List<MemberPayoutRequest>"
      shareoutFormula: String   # from typeConfig — sent for server-side audit
      executedAt: String        # ISO-8601
    response:
      type: object
      fields:
        shareoutRecordId: String
        succeededCount: Int
        failedCount: Int
        failedMemberIds: "List<String>"
    offline_queue:
      strategy: enqueue_to_sync_queue
      priority: HIGH
      entity_type: SHARE_OUT_EXECUTE
    errors:
      400: Validation error — show snackbar; remain in Executing state
      403: Forbidden — organizer/treasurer/chairperson role required
      409: Share-out already executed for this cycle
      500: Server error — queue offline if !isOnline

  # ROTATING_PAYOUT types (ROSCA/chit) — COMP-DIST-002
  - id: post_rotation_payout_execute
    function: post_rotation_payout_execute
    method: POST
    endpoint: "/companion/groups/{groupId}/rotation/execute"   # COMP-DIST-002
    description: >
      Execute rotation payout for ROTATING_PAYOUT types (ROSCA). Updates rosca_rotation datatable
      (marks current slot as paid, advances rotation position) and executes the single-recipient
      savings withdrawal via Fineract.
    params:
      groupId: { type: String, required: true, source: nav_params }
    body:
      recipientMemberId: String
      amount: { type: Double, currency: KES }
      payoutOrderMethod: String    # FIXED_ORDER | LOTTERY | AUCTION
      executedAt: String
    response:
      type: object
      fields:
        rotationRecordId: String
        newRotationPosition: Int
        nextRecipientId: "String?"
    offline_queue:
      strategy: enqueue_to_sync_queue
      priority: HIGH
      entity_type: ROTATION_PAYOUT_EXECUTE
    errors:
      403: Forbidden — organizer/treasurer/chairperson role required
      409: Rotation payout already executed for this round
      500: Server error

cache_strategy:
  default: no-cache   # execute endpoints are write-only; no caching

dtos:
  MemberPayoutRequest:
    memberId: String
    payoutAmount: { type: Double, currency: KES }
    sharePercent: Double

  MemberPayout:
    memberId: String
    memberName: String
    memberInitials: String
    sharesHeld: "Int?"           # PRORATA_SHARES
    totalSavings: "Double?"      # PRORATA_SAVINGS
    sharePercent: Double
    payoutAmount: { type: Double, currency: KES }

  MemberExecutionStatus:
    values: [PENDING, IN_PROGRESS, DONE, FAILED, QUEUED]
    descriptions:
      PENDING: Not yet started
      IN_PROGRESS: Companion API call in flight
      DONE: Payout succeeded
      FAILED: Payout failed — will appear in failedPayouts
      QUEUED: Enqueued to SyncQueue for offline execution

  ShareOutExecuteResponse:
    shareoutRecordId: String
    succeededCount: Int
    failedCount: Int
    failedMemberIds: "List<String>"

  RotationPayoutExecuteResponse:
    rotationRecordId: String
    newRotationPosition: Int
    nextRecipientId: "String?"

  SyncQueueItem:
    id: Long
    entityType: String
    operation: String
    payloadJson: String
    status: SyncStatus
    priority: Int

  SyncStatus:
    values: [PENDING, IN_PROGRESS, SYNCED, FAILED]

dependencies:
  repositories:
    - name: ShareOutRepository
      methods:
        - "executeShareOut(groupId: String, request: ShareOutExecuteRequest): Flow<ShareOutExecuteResponse>"   # COMP-DIST-001
        - "executeRotationPayout(groupId: String, request: RotationPayoutRequest): Flow<RotationPayoutExecuteResponse>"   # COMP-DIST-002
    - name: SyncQueueRepository
      methods:
        - "enqueue(entityType: String, operation: String, payloadJson: String, priority: Int): Flow<Unit>"
        - "getPendingByType(entityType: String): Flow<List<SyncQueueItem>>"
  services:
    - BiometricManager
    - NetworkMonitor
    - SessionManager
