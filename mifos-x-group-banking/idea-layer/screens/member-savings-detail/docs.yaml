id: member-savings-detail
name: Member Savings Detail
description: >
  Contribution-model-aware savings detail for a single group member. Header card adapts to
  GroupTypeConfig.contribution_model: SHARE_BASED_VARIABLE (VSLA/SILC) shows "X shares @ KES Y/share = KES Z total";
  FIXED_AMOUNT (ROSCA/SHG) shows KES balance with meeting context; FIXED_NEGOTIATED (JLG) shows negotiated contribution.
  Paginated transaction history with 6-month sparkline trend, filter chips (All/Deposits/Withdrawals), and running
  balance per transaction. Data from companion API (/companion/groups/{groupId}/members/{memberId}/savings) replacing
  raw Fineract GET /clients/{id} + GET /clients/{id}/accounts. Accessible from savings-dashboard and member-profile.
feature: member-onboarding
