sibling: docs
schema_version: "4.0"
feature_id: member-savings-detail
contract_version: "2.0.0"

capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_offline_cache

id: member-savings-detail
name: Member Savings Detail
description: >
  Paginated transaction history for a group member's savings account, with
  a 6-month sparkline trend chart, filter chips (All/Deposits/Withdrawals),
  and running balance per transaction. Accessible from member-profile.
feature: member-onboarding
flow: member-onboarding-flow
version: "1.0.0"
tags: [member, savings, transactions, sparkline, pagination]
status: designed
quality_score: 87
status_history:
  - status: draft
    at: "2026-05-01T00:00:00Z"
  - status: enriched
    at: "2026-05-06T00:00:00Z"
  - status: designed
    at: "2026-05-08T22:55:00Z"
entry_point: false
bottom_nav: false

legacy_metadata:
  analytics:
    screen_view: member_savings_detail_viewed
    events:
      - trigger: filter chip tap
        name: savings_filter_applied
        params: { filter: String, member_id: String }
      - trigger: pull to refresh
        name: savings_detail_refreshed
        params: { member_id: String }
      - trigger: scroll to end
        name: savings_transactions_next_page_loaded
        params: { member_id: String, page: Int }
      - trigger: screen view
        name: member_savings_detail_opened
        params: { member_id: String, group_id: String, balance: Double }
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/member-onboarding/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/member-onboarding/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/member-onboarding/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/member-onboarding/"
