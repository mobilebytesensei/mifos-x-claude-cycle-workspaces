  .skl { background: var(--bg-muted); border-radius: var(--radius-base); position: relative; overflow: hidden; }

  .skl-card { border-radius: var(--radius-base); margin-bottom: var(--space-base); padding: var(--space-base); }
  .skl-row { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--border-subtle); min-height: 56px; }
  .skl-row:last-child { border-bottom: none; }
  .skl-icon { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .skl-trail { width: 80px; height: 14px; border-radius: var(--radius-sm); flex-shrink: 0; }
