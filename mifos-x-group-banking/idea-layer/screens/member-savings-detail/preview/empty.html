<!doctype html>
<!-- render-hash: empty:member-savings-detail-r2 -->
<html lang="en" data-feature="member-savings-detail" data-state="empty" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>member-savings-detail · empty · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .app-bar-subtitle { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 1px; line-height: 1.2; }
  .metric { font-size: 26px; font-weight: 700; color: var(--primary-900); font-family: 'Roboto Mono', monospace; letter-spacing: -.01em; }
  .metric-sub { font-size: 14px; font-weight: 600; color: var(--primary-700); font-family: 'Roboto Mono', monospace; margin-top: 2px; }
  .spark { display: flex; align-items: flex-end; gap: var(--space-sm); height: 80px; padding-top: var(--space-sm); }
  .spark-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .spark-fill { width: 100%; background: var(--primary-100); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .spark-fill.is-latest { background: var(--primary-700); }
  .spark-x { font-size: 10px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="app-shell" data-shell="default">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

<!-- top_bar -->
<header class="top-app-bar" data-component-type="top-bar" data-component-id="top_bar">
  <button class="back-btn" data-action="OnBack" aria-label="Back">‹</button>
  <div style="flex:1;min-width:0;">
    <h1>Member Savings</h1>
    <div class="app-bar-subtitle">Amina Wanjiru</div>
  </div>
</header>

<main>
  <!-- member_header_card -->
  <div class="card card-highlighted" data-component-id="member_header_card" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--space-xs);">
    <div class="avatar" style="width:56px;height:56px;font-size:20px;background:var(--primary-700);color:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;">AW</div>
    <h3 style="margin:0;">Amina Wanjiru</h3>
    <div class="summary-card" style="border:none;background:transparent;padding:0;">
      <div class="label" style="text-transform:uppercase;letter-spacing:.04em;">Shares Held</div>
      <div class="metric">20 shares @ KES 1,000/share</div>
      <div class="metric-sub">= KES 20,000 total</div>
    </div>
    <div class="chip-static">Account: SA-00012345</div>
  </div>

  <!-- savings_sparkline_card -->
  <div class="card" data-component-id="savings_sparkline_card">
    <h3>6-Month Trend</h3>
    <div class="spark">
      <div class="spark-col"><div class="spark-fill" style="height:11%;"></div><div class="spark-x">Dec</div></div>
      <div class="spark-col"><div class="spark-fill" style="height:23%;"></div><div class="spark-x">Jan</div></div>
      <div class="spark-col"><div class="spark-fill" style="height:34%;"></div><div class="spark-x">Feb</div></div>
      <div class="spark-col"><div class="spark-fill" style="height:57%;"></div><div class="spark-x">Mar</div></div>
      <div class="spark-col"><div class="spark-fill" style="height:69%;"></div><div class="spark-x">Apr</div></div>
      <div class="spark-col"><div class="spark-fill is-latest" style="height:80%;"></div><div class="spark-x">May</div></div>
    </div>
  </div>

  <!-- filter_chips_row -->
  <div class="chip-row" data-component-id="filter_chips_row">
    <button class="chip selected" data-action="OnFilterSelected">All</button>
    <button class="chip" data-action="OnFilterSelected">Deposits</button>
    <button class="chip" data-action="OnFilterSelected">Withdrawals</button>
  </div>

  <!-- empty_state — no transactions match the active filter -->
  <div class="empty-state" data-component-id="empty_state">
    <div class="illus">👛</div>
    <h2>No transactions</h2>
    <p>No transactions match the selected filter.</p>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
