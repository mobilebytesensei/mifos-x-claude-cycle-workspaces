<!DOCTYPE html>
<html lang="en" data-feature="member-savings-detail" data-state="empty" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>member-savings-detail · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .app-bar-subtitle { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 1px; }
  /* Member header card */
  .member-header-card { background: var(--primary-100); border: 1px solid var(--primary-100); border-radius: var(--radius-base); padding: var(--space-base); margin-bottom: var(--space-base); display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-sm); }
  .member-avatar-lg { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-700); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
  .member-name { font-size: 16px; font-weight: 600; color: var(--primary-900); }
  .shares-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
  .shares-amount { font-size: 18px; font-weight: 700; color: var(--primary-700); font-family: 'Roboto Mono', monospace; }
  .shares-total { font-size: 14px; color: var(--primary-900); font-weight: 500; }
  .account-chip { font-size: 12px; color: var(--text-secondary); background: rgba(255,255,255,.7); border-radius: 9999px; padding: 3px var(--space-sm); }
  /* Sparkline card */
  .sparkline-card { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); padding: var(--space-base); margin-bottom: var(--space-base); }
  .sparkline-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-sm); }
  .sparkline-bars { display: flex; align-items: flex-end; gap: 8px; height: 48px; }
  .spark-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
  .spark-bar { background: var(--primary-100); border-radius: 2px 2px 0 0; width: 100%; }
  .spark-month { font-size: 9px; color: var(--text-secondary); }
  /* Filter chips */
  .chip-group { display: flex; gap: var(--space-xs); margin-bottom: var(--space-base); }
  .chip { padding: 6px var(--space-md); border-radius: 9999px; border: 1px solid var(--border-default); background: var(--bg-canvas); font-size: 13px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
  .chip-active { background: var(--primary-700); color: #fff; border-color: var(--primary-700); }
</style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar" style="background:var(--color-primary)">
    <button class="back-btn" data-nav-to="savings-dashboard">‹</button>
    <div>
      <h1 class="app-bar-title">Member Savings</h1>
      <div class="app-bar-subtitle">Amina Wanjiru</div>
    </div>
  </header>

  <main>
    <!-- Member header card (shown in empty state) -->
    <div class="member-header-card">
      <div class="member-avatar-lg" aria-label="AW">AW</div>
      <div class="member-name">Amina Wanjiru</div>
      <div class="shares-label">Shares Held</div>
      <div class="shares-amount">20 shares @ KES 1,000/share</div>
      <div class="shares-total">= KES 20,000 total</div>
      <div class="account-chip">Account: SA-00012345</div>
    </div>

    <!-- Sparkline card (no data, placeholders) -->
    <div class="sparkline-card">
      <div class="sparkline-label">6-Month Trend</div>
      <div class="sparkline-bars">
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:8px;"></div><div class="spark-month">Feb</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:8px;"></div><div class="spark-month">Mar</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:8px;"></div><div class="spark-month">Apr</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:8px;"></div><div class="spark-month">May</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:8px;"></div><div class="spark-month">Jun</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:8px;"></div><div class="spark-month">Jul</div></div>
      </div>
    </div>

    <!-- Filter chips (visible but disabled) -->
    <div class="chip-group">
      <button class="chip chip-active">All ✓</button>
      <button class="chip">Deposits</button>
      <button class="chip">Withdrawals</button>
    </div>

    <!-- Empty state -->
    <div class="empty-state">
      <div class="illus">💳</div>
      <h2>No transactions</h2>
      <p>No transactions match the selected filter.</p>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
