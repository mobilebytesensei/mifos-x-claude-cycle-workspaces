requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: member-savings-detail

route: /groups/{groupId}/members/{memberId}/savings
entry_points:
  - source: savings-dashboard
    trigger: tap_member_row
    params: { memberId: String, groupId: String, typeConfig: GroupTypeConfig }
  - source: member-profile
    trigger: view_full_history_button
    params: { memberId: String, groupId: String, typeConfig: GroupTypeConfig }
nav_params:
  memberId: { type: String, required: true }
  groupId: { type: String, required: true }
  typeConfig: { type: GroupTypeConfig, required: true }   # drives contribution-model display

screens:
  - id: member-savings-detail-screen
    title: "Member Savings"
    type: list
    description: >
      Contribution-model-aware member savings detail. For SHARE_BASED_VARIABLE (VSLA/SILC),
      header shows "X shares @ KES Y/share = KES Z total". For FIXED_AMOUNT (ROSCA/SHG),
      header shows fixed contribution context ("KES Z per meeting"). Paginated transaction
      history with 6-month sparkline trend and filter chips (All/Deposits/Withdrawals).
      Data from companion API.

state_model:
  MemberSavingsDetailViewModel:
    state:
      name: MemberSavingsDetailState
      fields:
        isLoading: { type: Boolean, default: "true" }
        member: { type: "Member?", default: "null" }
        groupId: { type: String, default: '""' }
        typeConfig: { type: "GroupTypeConfig?", default: "null" }
        contributionModel: { type: String, default: '""' }   # SHARE_BASED_VARIABLE | FIXED_AMOUNT | FIXED_NEGOTIATED
        sharesHeld: { type: "Int?", default: "null" }        # SHARE_BASED_VARIABLE only
        shareValue: { type: "Long?", default: "null" }       # KES value per share — SHARE_BASED_VARIABLE only
        savingsBalance: { type: Double, default: "0.0" }
        savingsAccountNo: { type: String, default: '""' }
        sparklineData: { type: "List<SavingsDataPoint>", default: "emptyList()" }
        transactions: { type: "List<SavingsTransaction>", default: "emptyList()" }
        selectedFilter: { type: TransactionFilter, default: "TransactionFilter.ALL" }
        isLoadingNextPage: { type: Boolean, default: "false" }
        hasNextPage: { type: Boolean, default: "true" }
        currentOffset: { type: Int, default: "0" }
        error: { type: "MemberSavingsError?", default: "null" }
        isRefreshing: { type: Boolean, default: "false" }
    screen_state:
      name: MemberSavingsDetailScreenState
      members: [Loading, Content, Empty, Error]
    errors:
      name: MemberSavingsError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: NotFound, retry: false, message_key: error_not_found }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: MemberSavingsDetailEvent
      members:
        - { name: NavigateBack }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: MemberSavingsDetailAction
      members:
        - { name: OnFilterSelected, params: { filter: TransactionFilter }, trigger: "Tap filter chip" }
        - { name: OnLoadMore, trigger: "Scroll to end of list" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
        - { name: Retry, trigger: "Tap Retry on error" }
        - { name: OnBack, trigger: "Tap back arrow" }
    di:
      - MemberRepository     # companion API /companion/groups/{groupId}/members/{memberId}/savings
      - NetworkMonitor

business_logic:
  kind: crud
  description: >
    Fetches contribution-model-aware member savings via the companion API
    (/companion/groups/{groupId}/members/{memberId}/savings), persists paginated
    SavingsTransaction rows in SQLDelight for offline-first access, monitors
    connectivity with cmp-network-monitor to surface cached data when offline,
    and filters transactions client-side by type without a server round-trip.
  library_refs:
    - cmp-network-monitor
  external_library_refs:
    - SQLDelight
  description_hash: "b2e4a1c7f83d0e5a9b6c2d4f71e8a3b0c5d9e2f4a7b1c3d6e8f0a2b4c7d9e1"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_bar
    type: top-bar
    title: "Member Savings"
    subtitle: "{{member.displayName}}"
    style: { background: primary, text_color: onPrimary }
    navigation_icon: arrow_back
    on_navigation_click:
      action: OnBack
      action_contract:
        effect: navigate
        description: "Dismisses the member savings detail screen and returns the user to the previous screen in the back stack."
        action_contract_hash: "a3f2c1d4e5b6a7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: member_header_card
    type: card
    style:
      background: primaryContainer
      elevation: 0dp
      corner_radius: 16dp
      padding: 16dp
    content:
      - id: member_avatar
        type: avatar
        image_url: "{{member.photoUri}}"
        fallback_initials: "{{member.displayName | initials}}"
        size: 48dp
        style: { background: primary, text_color: onPrimary }
      - id: member_name_text
        type: text
        style: { text_style: titleMedium, color: onPrimaryContainer }
        value: "{{member.displayName}}"
      # Contribution-model-adaptive balance display
      - id: savings_balance_label
        type: text
        style: { text_style: bodySmall, color: onPrimaryContainer }
        value: "{{contributionModel == 'SHARE_BASED_VARIABLE' ? 'Shares Held' : 'Savings Balance'}}"
      - id: savings_balance_amount
        type: text
        style: { text_style: displaySmall, color: onPrimaryContainer, font_weight: bold }
        # SHARE_BASED_VARIABLE: "20 shares @ KES 1000/share"
        # FIXED_AMOUNT / FIXED_NEGOTIATED: "KES 3500"
        value: "{{contributionModel == 'SHARE_BASED_VARIABLE' ? sharesHeld + ' shares @ KES ' + typeConfig.share_value + '/share' : 'KES ' + (savingsBalance | number)}}"
      - id: savings_balance_total
        type: text
        visible: "{{contributionModel == 'SHARE_BASED_VARIABLE'}}"
        style: { text_style: titleMedium, color: onPrimaryContainer }
        value: "= KES {{shareValue | number}} total"
      - id: account_no_text
        type: text
        style: { text_style: bodySmall, color: onPrimaryContainer }
        value: "Account: {{savingsAccountNo}}"

  - id: savings_sparkline_card
    type: card
    style:
      background: surface
      elevation: 2dp
      corner_radius: 16dp
      padding: 16dp
    content:
      - id: trend_label
        type: text
        style: { text_style: titleSmall, color: onSurfaceVariant }
        value: "6-Month Trend"
      - id: sparkline_chart
        type: sparkline-chart
        data: "{{sparklineData}}"
        x_key: date
        y_key: balance
        style:
          line_color: primary
          fill_color: primaryContainer
          height: 80dp

  - id: filter_chips_row
    type: chip-group
    selection: single
    chips:
      - id: chip_all
        label: "All"
        selected: "{{selectedFilter == ALL}}"
        on_click:
          action: OnFilterSelected
          params: { filter: ALL }
          action_contract:
            effect: transform_state
            description: "Sets selectedFilter to ALL in MemberSavingsDetailState so the transaction list renders every transaction type without a server round-trip."
            action_contract_hash: "c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: chip_deposits
        label: "Deposits"
        selected: "{{selectedFilter == DEPOSITS}}"
        on_click:
          action: OnFilterSelected
          params: { filter: DEPOSITS }
          action_contract:
            effect: transform_state
            description: "Sets selectedFilter to DEPOSITS in MemberSavingsDetailState, restricting the transaction list to deposit entries client-side without a network call."
            action_contract_hash: "d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: chip_withdrawals
        label: "Withdrawals"
        selected: "{{selectedFilter == WITHDRAWALS}}"
        on_click:
          action: OnFilterSelected
          params: { filter: WITHDRAWALS }
          action_contract:
            effect: transform_state
            description: "Sets selectedFilter to WITHDRAWALS in MemberSavingsDetailState, restricting the transaction list to withdrawal entries client-side without a network call."
            action_contract_hash: "e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
    style: { scroll_horizontal: true, padding_horizontal: 16dp }

  - id: transaction_card
    type: list-item
    style:
      min_touch_target: 72dp
      divider: true
    content:
      leading:
        id: transaction_type_icon
        type: icon
        icon:
          DEPOSIT: arrow_downward
          WITHDRAWAL: arrow_upward
          INTEREST_POSTING: trending_up
          FEE_DEDUCTION: remove_circle_outline
          TRANSFER: swap_horiz
          default: receipt
        style:
          DEPOSIT: { color: "#1B5E20" }
          WITHDRAWAL: { color: "#B71C1C" }
          default: { color: onSurfaceVariant }
      headline:
        type: text
        style: { text_style: bodyMedium, color: onSurface }
        value: "{{transaction.type | label}}"
      supporting:
        id: transaction_date_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "{{transaction.date | date}}"
      trailing:
        type: column
        children:
          - id: transaction_amount_text
            type: text
            style:
              text_style: bodyLarge
              color:
                DEPOSIT: "#1B5E20"
                WITHDRAWAL: "#B71C1C"
                default: onSurface
              font_weight: semibold
            value:
              DEPOSIT: "+ KES {{transaction.amount | number}}"
              WITHDRAWAL: "- KES {{transaction.amount | number}}"
              default: "KES {{transaction.amount | number}}"
          - id: running_balance_text
            type: text
            style: { text_style: bodySmall, color: onSurfaceVariant }
            value: "Balance: KES {{transaction.runningBalance | number}}"
          - id: reversed_badge
            type: badge
            visible_when: "transaction.reversed"
            label: "REVERSED"
            style: { background: surfaceVariant, text_color: onSurfaceVariant }

  - id: load_more_indicator
    type: circular-progress
    visible: "{{isLoadingNextPage}}"
    style:
      size: 32dp
      color: primary
      alignment: center
      padding: 16dp

  - id: shimmer_list
    type: shimmer
    count: 6
    style: { height: 72dp, corner_radius: 12dp, background: surfaceVariant }

  - id: empty_state
    type: empty-state
    icon: account_balance_wallet
    title: "No transactions"
    body: "No transactions match the selected filter."

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "Could not load savings"
    body: "{{error.message}}"
    cta_label: "Retry"
    on_click:
      action: Retry
      action_contract:
        effect: call_api
        library_refs:
          - cmp-network-monitor
        description: "Re-fetches member savings from the companion API after verifying connectivity via cmp-network-monitor; invalidates the SQLDelight savings_transactions cache and resets pagination offset to 0 before issuing GET /companion/groups/{groupId}/members/{memberId}/savings."
        action_contract_hash: "f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_list]
    description: "Parallel API calls in-flight for member profile and savings accounts"
  content:
    components: [top_bar, member_header_card, savings_sparkline_card, filter_chips_row, transaction_card, load_more_indicator]
    description: "All savings data loaded; transactions filterable client-side; pull-to-refresh enabled"
    demo_data:
      # VSLA (SHARE_BASED_VARIABLE) context
      groupId: "grp-001"
      contributionModel: "SHARE_BASED_VARIABLE"
      sharesHeld: 20
      shareValue: 20000    # KES (20 shares × KES 1000/share)
      typeConfig:
        contribution_model: SHARE_BASED_VARIABLE
        share_value: 1000   # KES per share
      member:
        displayName: "Amina Wanjiru"
        firstName: "Amina"
        lastName: "Wanjiru"
        photoUri: null
      savingsBalance: 20000.00    # equivalent KES for FIXED_AMOUNT fallback
      savingsAccountNo: "SA-00012345"
      sparklineData:
        - { date: "2025-12-01", balance: 500.00 }
        - { date: "2026-01-01", balance: 1000.00 }
        - { date: "2026-02-01", balance: 1500.00 }
        - { date: "2026-03-01", balance: 2500.00 }
        - { date: "2026-04-01", balance: 3000.00 }
        - { date: "2026-05-01", balance: 3500.00 }
      selectedFilter: ALL
      transactions:
        - id: 1
          date: "2026-05-05"
          type: DEPOSIT
          amount: 500.00
          runningBalance: 3500.00
          reversed: false
        - id: 2
          date: "2026-04-28"
          type: DEPOSIT
          amount: 500.00
          runningBalance: 3000.00
          reversed: false
        - id: 3
          date: "2026-04-14"
          type: WITHDRAWAL
          amount: 200.00
          runningBalance: 2500.00
          reversed: false
        - id: 4
          date: "2026-04-07"
          type: DEPOSIT
          amount: 700.00
          runningBalance: 2700.00
          reversed: false
  empty:
    components: [top_bar, member_header_card, savings_sparkline_card, filter_chips_row, empty_state]
    description: "No transactions match the active filter"
  error:
    components: [top_bar, error_state]
    description: "API error loading savings data; error message with retry"

i18n:
  en:
    screen_title: "Member Savings"
    balance_label_shares: "Shares Held"
    balance_label_savings: "Savings Balance"
    shares_at_label: "{{sharesHeld}} shares @ KES {{shareValue}}/share"
    shares_total_label: "= KES {{total}} total"
    account_no_label: "Account: {{accountNo}}"
    trend_label: "6-Month Trend"
    filter_all: "All"
    filter_deposits: "Deposits"
    filter_withdrawals: "Withdrawals"
    transaction_deposit: "Deposit"
    transaction_withdrawal: "Withdrawal"
    transaction_interest: "Interest Posting"
    transaction_fee: "Fee Deduction"
    transaction_transfer: "Transfer"
    running_balance_label: "Balance: KES {{amount}}"
    reversed_label: "REVERSED"
    empty_title: "No transactions"
    empty_body: "No transactions match the selected filter."
    error_network: "No internet. Showing cached savings data."
    error_server: "Server error. Please retry."
    error_not_found: "Savings account not found."
    error_auth: "Session expired. Please log in again."
