sibling: flow
schema_version: "4.0"
feature_id: member-savings-detail

navigates_to: []

flow_logic:
  on_load:
    - action: load_savings_detail
      parallel:
        - api: get_client
          params: { clientId: nav_params.memberId }
        - api: get_client_savings_accounts
          params: { clientId: nav_params.memberId, limit: 20, offset: 0 }
      on_all_success: show_content
      on_empty: show_empty
      on_any_error: show_error
  on_filter_selected:
    - action: filter_transactions_client_side
      params: { filter: params.filter }
      state: { selectedFilter: params.filter }
  on_load_more:
    - condition: "hasNextPage && !isLoadingNextPage"
      action: load_next_page
      api: get_client_savings_accounts
      params: { clientId: nav_params.memberId, limit: 20, offset: currentOffset }
      append: true
  on_refresh:
    - action: reload_savings
      invalidate_cache: true
      reset_pagination: true
