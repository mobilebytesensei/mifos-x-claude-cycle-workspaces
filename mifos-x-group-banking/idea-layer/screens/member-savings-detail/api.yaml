sibling: api
schema_version: "4.0"
feature_id: member-savings-detail

api:
  - id: get_member_savings_detail
    function: get_member_savings_detail
    method: GET
    endpoint: "/companion/groups/{groupId}/members/{memberId}/savings"   # companion API
    description: >
      Fetch member savings detail including contribution-model-aware fields.
      For SHARE_BASED_VARIABLE (VSLA/SILC): returns sharesHeld + shareValue (KES total).
      For FIXED_AMOUNT (ROSCA/SHG): returns savingsBalance + meetingsContributed.
      Also returns sparkline data and paginated transaction history.
      Replaces raw Fineract: GET /clients/{id} + GET /clients/{id}/accounts.
    params:
      groupId: { type: String, required: true, source: nav_params }
      memberId: { type: String, required: true, source: nav_params }
      limit: { type: Int, default: 20 }
      offset: { type: Int, default: 0 }
    response:
      type: object
      fields:
        member:
          type: object
          fields:
            memberId: String
            displayName: String
            photoUri: "String?"
        savingsAccountNo: String
        savingsBalance: Double       # KES — meaningful for FIXED_AMOUNT; shares-equivalent for SHARE_BASED_VARIABLE
        sharesHeld: "Int?"           # SHARE_BASED_VARIABLE only
        shareValue: "Long?"          # KES total value of shares — SHARE_BASED_VARIABLE only
        sparklineData: "List<SavingsDataPoint>"
        transactions: "List<SavingsTransaction>"
        totalTransactions: Int
        hasNextPage: Boolean
    errors:
      401: Unauthorized
      403: Forbidden
      404: Member or group not found
      500: Server error
    cache:
      ttl: 120
      strategy: stale-while-revalidate
      offline: show_cached
    pagination:
      type: offset
      page_size: 20

dtos:
  Member:
    memberId: String
    displayName: String
    photoUri: "String?"

  MemberSavingsDetailResponse:
    member: Member
    savingsAccountNo: String
    savingsBalance: Double
    sharesHeld: "Int?"      # SHARE_BASED_VARIABLE only
    shareValue: "Long?"     # KES total value — SHARE_BASED_VARIABLE only
    sparklineData: "List<SavingsDataPoint>"
    transactions: "List<SavingsTransaction>"
    totalTransactions: Int
    hasNextPage: Boolean

  SavingsTransaction:
    id: String
    date: String
    type: TransactionType
    amount: Double
    runningBalance: Double
    reversed: Boolean

  TransactionType:
    values: [DEPOSIT, WITHDRAWAL, INTEREST_POSTING, FEE_DEDUCTION, TRANSFER]

  TransactionFilter:
    values: [ALL, DEPOSITS, WITHDRAWALS]

  SavingsDataPoint:
    date: String
    balance: Double

cache_strategy:
  ttl: 120
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: MemberRepository    # companion API /companion/groups/{groupId}/members/{memberId}/savings
      methods:
        - "getMemberSavingsDetail(groupId: String, memberId: String, limit: Int, offset: Int): Flow<MemberSavingsDetailResponse>"
  services:
    - NetworkMonitor
  local_db:
    - table: savings_transactions
      schema: SQLDelight SavingsTransaction entity
