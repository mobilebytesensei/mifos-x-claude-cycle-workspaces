sibling: api
schema_version: "4.0"
feature_id: member-savings-detail

api:
  - id: get_client
    function: get_client
    method: get
    endpoint: "/clients/{clientId}"
    description: Fetch member name/photo for the profile header
    params:
      clientId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        id: Long
        displayName: String
        firstname: String
        lastname: String
        imagePresent: Boolean
    errors:
      401: Unauthorized
      403: Forbidden
      404: Client not found
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_client_savings_accounts
    function: get_client_savings_accounts
    method: get
    endpoint: "/clients/{clientId}/accounts"
    description: Fetch savings account with paginated transaction history
    params:
      clientId: { type: Long, required: true, source: nav_params }
      limit: { type: Int, default: 20 }
      offset: { type: Int, default: 0 }
    response:
      type: object
      fields:
        totalFilteredRecords: Int
        savingsAccounts:
          type: array
          items:
            id: Long
            accountNo: String
            balance: Double
            transactions:
              type: array
              items:
                id: Long
                date: String
                type: { id: Int, value: String }
                amount: Double
                runningBalance: Double
                reversed: Boolean
    errors:
      401: Unauthorized
      403: Forbidden
      404: Client not found
      500: Server error
    cache:
      ttl: 120
      strategy: stale-while-revalidate
      offline: show_cached
    pagination:
      type: offset
      page_size: 20

dtos:
  Member:
    id: String
    displayName: String
    photoUri: "String?"

  MemberSavingsAccounts:
    savingsAccountId: Long
    savingsAccountNo: String
    savingsBalance: Double
    sparklineData: "List<SavingsDataPoint>"
    transactions: "List<SavingsTransaction>"

  SavingsTransaction:
    id: Long
    date: String
    type: TransactionType
    amount: Double
    runningBalance: Double
    reversed: Boolean

  TransactionType:
    values: [DEPOSIT, WITHDRAWAL, INTEREST_POSTING, FEE_DEDUCTION, TRANSFER]

  TransactionFilter:
    values: [ALL, DEPOSITS, WITHDRAWALS]

  SavingsDataPoint:
    date: String
    balance: Double

cache_strategy:
  ttl: 120
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: MemberRepository
      methods:
        - "getMemberProfile(memberId: String): Flow<Member>"
        - "getMemberSavingsDetail(memberId: String, limit: Int, offset: Int): Flow<PaginatedResult<SavingsTransaction>>"
        - "getSavingsSparkline(memberId: String): Flow<List<SavingsDataPoint>>"
  services:
    - NetworkMonitor
  local_db:
    - table: savings_transactions
      schema: SQLDelight SavingsTransaction entity
