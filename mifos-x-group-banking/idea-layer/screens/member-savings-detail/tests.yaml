sibling: tests
schema_version: "4.0"
feature_id: member-savings-detail

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MSD-001
      scenario: "Screen loads member + transactions from single get_member_savings_detail companion call"
      type: ViewModel
      priority: P0
      given: "memberId='MBR-104', groupId='GRP-001', typeConfig from nav params (string IDs only)"
      when: "Screen mounts"
      then: "MemberRepository.getMemberSavingsDetail called once against /companion/groups/GRP-001/members/MBR-104/savings; state has member, savingsAccountNo, savingsBalance, sparklineData, transactions, hasNextPage"

    - id: TC-MSD-002
      scenario: "SHARE_BASED_VARIABLE member header shows shares held and total, not plain balance"
      type: Screen
      priority: P0
      given: "Content state, contributionModel='SHARE_BASED_VARIABLE', sharesHeld=20, typeConfig.share_value=1000, shareValue=20000"
      when: "member_header_card renders"
      then: "savings_balance_label='Shares Held'; savings_balance_amount='20 shares @ KES 1000/share'; savings_balance_total visible '= KES 20,000 total'"

    - id: TC-MSD-003
      scenario: "FIXED_AMOUNT member header shows plain KES savings balance, no shares total"
      type: Screen
      priority: P0
      given: "Content state, contributionModel='FIXED_AMOUNT', sharesHeld=null, savingsBalance=3500.00"
      when: "member_header_card renders"
      then: "savings_balance_label='Savings Balance'; savings_balance_amount='KES 3,500'; savings_balance_total NOT visible"

    - id: TC-MSD-004
      scenario: "Header card shows member name and account number"
      type: Screen
      priority: P1
      given: "Content state, member.displayName='Peter Otieno', savingsAccountNo='SA-00012345'"
      when: "Screen renders"
      then: "member_name_text='Peter Otieno'; account_no_text='Account: SA-00012345'"

    - id: TC-MSD-005
      scenario: "6-month sparkline renders ascending data points"
      type: Screen
      priority: P1
      given: "Content state, sparklineData has 6 monthly entries Dec-2025 to May-2026"
      when: "savings_sparkline_card renders"
      then: "trend_label='6-Month Trend'; sparkline_chart renders 6 points with line_color=primary, height=80dp"

    - id: TC-MSD-006
      scenario: "ALL filter shows every transaction type client-side, no API call"
      type: ViewModel
      priority: P0
      given: "selectedFilter=ALL, transactions loaded with mixed DEPOSIT/WITHDRAWAL/INTEREST_POSTING/FEE_DEDUCTION types"
      when: "Screen renders"
      then: "all transaction_card rows visible across all types; no network request issued"

    - id: TC-MSD-007
      scenario: "OnFilterSelected DEPOSITS filters to deposits client-side, no API call"
      type: ViewModel
      priority: P0
      given: "selectedFilter=ALL"
      when: "OnFilterSelected(filter=DEPOSITS) dispatched (tap chip_deposits)"
      then: "selectedFilter=DEPOSITS; only type=DEPOSIT rows visible; pure transform_state, no get_member_savings_detail call"

    - id: TC-MSD-008
      scenario: "OnFilterSelected WITHDRAWALS filters to withdrawals client-side"
      type: ViewModel
      priority: P1
      given: "selectedFilter=ALL"
      when: "OnFilterSelected(filter=WITHDRAWALS) dispatched (tap chip_withdrawals)"
      then: "selectedFilter=WITHDRAWALS; only type=WITHDRAWAL rows visible; no network call"

    - id: TC-MSD-009
      scenario: "DEPOSIT transaction card shows down-arrow icon and green positive amount"
      type: Screen
      priority: P1
      given: "transaction.type=DEPOSIT, amount=500.00, runningBalance=3500.00"
      when: "Screen renders transaction_card"
      then: "transaction_type_icon=arrow_downward color '#1B5E20'; amount='+ KES 500.00'; running_balance_text='Balance: KES 3,500.00'"

    - id: TC-MSD-010
      scenario: "WITHDRAWAL transaction card shows up-arrow icon and red negative amount"
      type: Screen
      priority: P1
      given: "transaction.type=WITHDRAWAL, amount=200.00"
      when: "Screen renders transaction_card"
      then: "transaction_type_icon=arrow_upward color '#B71C1C'; amount='- KES 200.00'"

    - id: TC-MSD-011
      scenario: "OnLoadMore appends next offset page of transactions"
      type: ViewModel
      priority: P1
      given: "hasNextPage=true, currentOffset=0, first page of 20 transactions loaded"
      when: "OnLoadMore dispatched (scroll to end)"
      then: "isLoadingNextPage=true; get_member_savings_detail called with offset=20 (page_size 20); new transactions appended to existing list; load_more_indicator visible while loading"

    - id: TC-MSD-012
      scenario: "OnRefresh reloads from offset 0 bypassing cache"
      type: ViewModel
      priority: P1
      given: "Content state with cached transactions"
      when: "OnRefresh dispatched (pull to refresh)"
      then: "isRefreshing=true; get_member_savings_detail re-fetched with cache bypass; offset reset to 0; transactions replaced; isRefreshing=false"

    - id: TC-MSD-013
      scenario: "Empty state shown when active filter matches no transactions"
      type: Screen
      priority: P1
      given: "selectedFilter=WITHDRAWALS but transactions contain only DEPOSITs (Empty screen state)"
      when: "Screen renders"
      then: "empty_state visible with account_balance_wallet icon and 'No transactions match the selected filter.'; header + sparkline + filter chips still shown"

    - id: TC-MSD-014
      scenario: "Network error with no cache shows error state with retry"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, savings_transactions cache empty"
      when: "Screen mounts"
      then: "MemberSavingsError.Network set; error_state visible with 'Could not load savings' and Retry CTA"

    - id: TC-MSD-015
      scenario: "Retry re-fetches via cmp-network-monitor, invalidates cache, resets offset"
      type: ViewModel
      priority: P1
      given: "Error state after a failed load"
      when: "Retry dispatched (tap error_state CTA)"
      then: "cmp-network-monitor connectivity checked; SQLDelight savings_transactions cache invalidated; offset reset to 0; GET /companion/groups/GRP-001/members/MBR-104/savings re-issued"

    - id: TC-MSD-016
      scenario: "OnBack dismisses the screen to the previous back-stack entry"
      type: ViewModel
      priority: P2
      given: "Content state entered from member-profile"
      when: "OnBack dispatched (tap top_bar arrow_back)"
      then: "NavigateBack event emitted; returns to the previous screen (member-profile or savings-dashboard)"

    - id: TC-MSD-017
      scenario: "member savings cache keyed by groupId:memberId (not numeric fineract IDs)"
      type: Repository
      priority: P0
      given: "Two calls with groupId='GRP-001', memberId='MBR-104' within TTL 120s"
      when: "second call within TTL"
      then: "cache hit; no second network request; cache key is 'GRP-001:MBR-104'"

    - id: TC-MSD-018
      scenario: "Reversed transaction shown with REVERSED badge"
      type: Screen
      priority: P2
      given: "SavingsTransaction with reversed=true"
      when: "Screen renders transaction_card"
      then: "reversed_badge visible with 'REVERSED' label and surfaceVariant styling"
