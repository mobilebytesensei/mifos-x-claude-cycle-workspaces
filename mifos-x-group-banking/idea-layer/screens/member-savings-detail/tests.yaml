sibling: tests
schema_version: "4.0"
feature_id: member-savings-detail
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MSD-001
      scenario: "On mount, savings account and transaction history load from SavingsRepository"
      type: ViewModel
      priority: P0
      given: "memberId=3; groupId=1; network online"
      when: "MemberSavingsDetailScreen enters composition"
      then: "SavingsRepository.getSavingsAccount(memberId=3, groupId=1) called; transactions loaded; MemberSavingsDetailScreenState=Content"

    - id: TC-MSD-002
      scenario: "SHARE_BASED_VARIABLE account shows shares count and share value"
      type: Screen
      priority: P0
      given: "Content state; savingsAccount.model=SHARE_BASED_VARIABLE; shares=12; shareValue=500.0"
      when: "AccountHeader renders"
      then: "12 shares shown; KES 500 per share; total KES 6,000 displayed"

    - id: TC-MSD-003
      scenario: "FIXED_AMOUNT account shows fixed contribution and total balance"
      type: Screen
      priority: P0
      given: "Content state; savingsAccount.model=FIXED_AMOUNT; fixedAmount=1000.0; cycleBalance=8000.0"
      when: "AccountHeader renders"
      then: "Fixed KES 1,000/meeting label; total KES 8,000 cycle balance; no share count"

    - id: TC-MSD-004
      scenario: "Transaction list renders deposits and withdrawals with date and type chip"
      type: Screen
      priority: P0
      given: "transactions=[{type:DEPOSIT, amount:500.0, date:'2026-07-15'}, {type:WITHDRAWAL, amount:200.0, date:'2026-07-08'}]"
      when: "TransactionList renders"
      then: "2 rows; DEPOSIT green chip; WITHDRAWAL red chip; amounts and dates correct"

    - id: TC-MSD-005
      scenario: "TransactionFilter chips filter by ALL / DEPOSIT / WITHDRAWAL"
      type: ViewModel
      priority: P1
      given: "selectedFilter=ALL; transactions=[2 deposits, 1 withdrawal]"
      when: "OnFilterChange(TransactionFilter.DEPOSIT) fires"
      then: "only 2 deposit rows shown; WITHDRAWAL row hidden; selectedFilter=DEPOSIT"

    - id: TC-MSD-006
      scenario: "Sparkline chart renders 300s SWR-cached weekly contribution trend"
      type: Screen
      priority: P1
      given: "weeklyTrend=[500, 500, 1000, 500, 500, 500, 500]; cached within 300s"
      when: "SparklineChart renders"
      then: "7-week trend line rendered; 300s SWR cache serves data without network call"

    - id: TC-MSD-007
      scenario: "Pull-to-refresh reloads savings account from network (bypasses SWR)"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh fires"
      then: "isRefreshing=true; SWR invalidated; SavingsRepository.getSavingsAccount re-fetched; isRefreshing=false"

    - id: TC-MSD-008
      scenario: "Error state shows retry on load failure"
      type: Screen
      priority: P1
      given: "SavingsRepository.getSavingsAccount returns network error"
      when: "load completes"
      then: "MemberSavingsDetailScreenState=Error; retry CTA visible"
