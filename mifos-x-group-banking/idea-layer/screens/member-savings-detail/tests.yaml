sibling: tests
schema_version: "4.0"
feature_id: member-savings-detail

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MSD-001
      scenario: "Screen loads member info and transactions from single get_member_savings_detail call"
      type: ViewModel
      priority: P0
      given: "memberId='MBR-104', groupId='GRP-001' from nav params (string IDs, no numeric fineract IDs)"
      when: "Screen mounts"
      then: "MemberSavingsRepository.getMemberSavingsDetail called once; state has member=Peter Otieno, savingsBalance=1500.00, 12 transactions"

    - id: TC-MSD-002
      scenario: "Header card shows member name, account number, and KES balance from MemberSavingsDetailResponse"
      type: Screen
      priority: P0
      given: "Content state, Peter Otieno, savingsBalance=1500.00, savingsAccountNo='SAV-104-2026'"
      when: "Screen renders"
      then: "member_name_text='Peter Otieno', savings_balance_amount='KES 1,500.00', account_no_text='Account: SAV-104-2026'"

    - id: TC-MSD-003
      scenario: "Sparkline renders with 7 monthly data points in ascending order"
      type: Screen
      priority: P1
      given: "sparklineData has 7 entries from Nov-2025 to May-2026"
      when: "Screen renders savings_sparkline_card"
      then: "sparkline_chart renders 7 points with line_color=primary, height=80dp"

    - id: TC-MSD-004
      scenario: "SHARE_BASED_VARIABLE member shows sharesHeld and shareValue instead of plain balance"
      type: Screen
      priority: P0
      given: "Amina Wanjiru with sharesHeld=20, shareValue=6000, contribution_model=SHARE_BASED_VARIABLE"
      when: "Header card rendered"
      then: "shares_card shows '20 shares @ KES 300 = KES 6,000'; plain balance NOT the primary metric"

    - id: TC-MSD-005
      scenario: "FIXED_AMOUNT member shows null sharesHeld — no shares card rendered"
      type: Screen
      priority: P0
      given: "Peter Otieno with sharesHeld=null"
      when: "Header card rendered"
      then: "shares_card NOT rendered; savingsBalance is primary balance shown"

    - id: TC-MSD-006
      scenario: "ALL filter shows all transactions (deposits, interest, fees) without API call"
      type: ViewModel
      priority: P0
      given: "selectedFilter=ALL, transactions loaded with mixed types"
      when: "Screen renders"
      then: "All transaction_card rows visible including DEPOSIT, INTEREST_POSTING, FEE_DEDUCTION types"

    - id: TC-MSD-007
      scenario: "DEPOSITS filter shows only deposit transactions (client-side, no API call)"
      type: ViewModel
      priority: P0
      given: "selectedFilter=ALL"
      when: "OnFilterChipTap dispatched with filter=DEPOSITS"
      then: "selectedFilter=DEPOSITS, only transactions with type=DEPOSIT visible, no API call made"

    - id: TC-MSD-008
      scenario: "DEPOSIT transaction card shows green up-arrow icon"
      type: Screen
      priority: P1
      given: "Transaction type=DEPOSIT, amount=400.00"
      when: "Screen renders transaction_card"
      then: "icon shows arrow_upward with primary color, amount='+ KES 400.00'"

    - id: TC-MSD-009
      scenario: "FEE_DEDUCTION transaction card shows red down-arrow with negative amount"
      type: Screen
      priority: P1
      given: "Transaction type=FEE_DEDUCTION, amount=50.00"
      when: "Screen renders transaction_card"
      then: "icon tint=error, amount displayed as '- KES 50.00'"

    - id: TC-MSD-010
      scenario: "OnScrollToEnd loads next page and appends transactions (append_to_existing)"
      type: ViewModel
      priority: P1
      given: "hasNextPage=true, currentOffset=0, totalTransactions=12"
      when: "OnScrollToEnd dispatched"
      then: "isLoadingNextPage=true; API called with offset=20; new transactions appended to existing list"

    - id: TC-MSD-011
      scenario: "Pull-to-refresh fires bypass_and_refresh — reloads member detail from offset 0"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefreshTap dispatched"
      then: "isRefreshing=true; get_member_savings_detail re-fetched with cache bypass; offset reset to 0; transactions replaced"

    - id: TC-MSD-012
      scenario: "Network error with no cache shows error state with retry CTA"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, member_savings_cache empty"
      when: "Screen mounts"
      then: "Error state visible with 'Could not load member savings', Retry CTA"

    - id: TC-MSD-013
      scenario: "member_savings_cache keyed by groupId:memberId (not numeric fineract IDs)"
      type: Repository
      priority: P0
      given: "Two calls with same groupId='GRP-001':memberId='MBR-104' within TTL 120s"
      when: "Second call within TTL"
      then: "Cache hit; no second network request; cache key is 'GRP-001:MBR-104'"

    - id: TC-MSD-014
      scenario: "Top bar subtitle shows member displayName"
      type: Screen
      priority: P2
      given: "member.displayName='Peter Otieno'"
      when: "Screen renders"
      then: "top_bar subtitle='Peter Otieno'"

    - id: TC-MSD-015
      scenario: "Reversed transaction shown with strikethrough amount"
      type: Screen
      priority: P2
      given: "SavingsTransaction with reversed=true"
      when: "Screen renders transaction_card"
      then: "Amount text has strikethrough style and onSurfaceVariant color"
