sibling: tests
schema_version: "4.0"
feature_id: member-savings-detail

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-MSD-001
      scenario: "Screen loads member info and 12 transactions on mount"
      type: ViewModel
      priority: P0
      given: "memberId='client_004', groupId='42'"
      when: "Screen mounts"
      then: "get_client and get_client_savings_accounts called; state has member=Peter Otieno, 12 transactions, savingsBalance=1500.00"

    - id: TC-MSD-002
      scenario: "Header card shows member name, account number, and KES balance"
      type: Screen
      priority: P0
      given: "Content state, Peter Otieno, savingsBalance=1500.00, savingsAccountNo='SAV-004-2025'"
      when: "Screen renders"
      then: "member_name_text='Peter Otieno', savings_balance_amount='KES 1,500.00', account_no_text='Account: SAV-004-2025'"

    - id: TC-MSD-003
      scenario: "Sparkline renders with 7 monthly data points in ascending order"
      type: Screen
      priority: P1
      given: "sparklineData has 7 entries from Nov-2025 to May-2026"
      when: "Screen renders savings_sparkline_card"
      then: "sparkline_chart renders 7 points with line_color=primary, height=80dp"

    - id: TC-MSD-004
      scenario: "ALL filter shows all 12 transactions (deposits, interest, fees)"
      type: ViewModel
      priority: P0
      given: "selectedFilter=ALL, 12 transactions loaded"
      when: "Screen renders"
      then: "12 transaction_card rows visible, including DEPOSIT, INTEREST_POSTING, FEE_DEDUCTION types"

    - id: TC-MSD-005
      scenario: "DEPOSITS filter shows only deposit transactions (client-side, no API call)"
      type: ViewModel
      priority: P0
      given: "selectedFilter=ALL"
      when: "OnFilterSelected dispatched with filter=DEPOSITS"
      then: "selectedFilter=DEPOSITS, only transactions with type=DEPOSIT visible, no API call made"

    - id: TC-MSD-006
      scenario: "WITHDRAWALS filter shows empty state when no withdrawals exist"
      type: Screen
      priority: P1
      given: "No WITHDRAWAL transactions in list"
      when: "OnFilterSelected dispatched with filter=WITHDRAWALS"
      then: "empty_state visible indicating no withdrawals"

    - id: TC-MSD-007
      scenario: "DEPOSIT transaction card shows green up-arrow icon"
      type: Screen
      priority: P1
      given: "Transaction of type DEPOSIT with amount=400.00"
      when: "Screen renders transaction_card"
      then: "icon shows arrow_upward with primary color, amount='+ KES 400.00'"

    - id: TC-MSD-008
      scenario: "FEE_DEDUCTION transaction card shows red down-arrow with negative amount"
      type: Screen
      priority: P1
      given: "Transaction of type FEE_DEDUCTION with amount=50.00"
      when: "Screen renders transaction_card"
      then: "icon tint=error, amount displayed as '- KES 50.00'"

    - id: TC-MSD-009
      scenario: "Scroll to end loads next page and appends transactions"
      type: ViewModel
      priority: P1
      given: "hasNextPage=true, currentOffset=0, 12 transactions"
      when: "OnLoadMore dispatched"
      then: "isLoadingNextPage=true, API called with offset=20, new transactions appended"

    - id: TC-MSD-010
      scenario: "Pull-to-refresh reloads all transactions from offset 0"
      type: ViewModel
      priority: P1
      given: "Content state with cached transactions"
      when: "OnRefresh dispatched"
      then: "isRefreshing=true, API called bypassing cache with offset=0, transactions replaced"

    - id: TC-MSD-011
      scenario: "Network error shows error state with retry CTA"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, no cache"
      when: "Screen mounts"
      then: "MemberSavingsError.Network set, error_state visible"

    - id: TC-MSD-012
      scenario: "Top bar subtitle shows member display name"
      type: Screen
      priority: P2
      given: "member.displayName='Peter Otieno'"
      when: "Screen renders"
      then: "top_bar subtitle='Peter Otieno'"

    - id: TC-MSD-013
      scenario: "Reversed transaction shown with strikethrough amount"
      type: Screen
      priority: P2
      given: "Transaction with reversed=true"
      when: "Screen renders transaction_card"
      then: "Amount text has strikethrough style and onSurfaceVariant color"
