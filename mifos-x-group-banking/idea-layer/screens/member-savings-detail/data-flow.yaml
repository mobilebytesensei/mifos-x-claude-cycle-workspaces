sibling: data-flow
schema_version: "2.1.0"
feature_id: member-savings-detail

entries:
  - screen_id: memberSavingsDetailScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_client, transport: rest, method: get }
      - { api_id: get_client_savings_accounts, transport: rest, method: get }
    dtos:
      - { name: Member, role: response, api_id: get_client }
      - { name: MemberSavingsAccounts, role: response, api_id: get_client_savings_accounts }
      - { name: SavingsTransaction, role: response, api_id: get_client_savings_accounts }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 120
      key_template: "member_savings:{memberId}:page:0"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: error_state, message_key: error_not_found }
      - { error_code: "500", behavior: error_state, message_key: error_server }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_network }

  - screen_id: memberSavingsDetailScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_client_savings_accounts, transport: rest, method: get }
    dtos:
      - { name: SavingsTransaction, role: response, api_id: get_client_savings_accounts }
    auth_required: true
    cache:
      strategy: bypass_and_refresh
      key_template: "member_savings:{memberId}"
    error_paths:
      - { error_code: "network.offline", behavior: snackbar, message_key: error_network }
      - { error_code: "500", behavior: snackbar, message_key: error_server }

  - screen_id: memberSavingsDetailScreen
    trigger: on_interact
    interaction: scroll_to_end
    endpoints:
      - { api_id: get_client_savings_accounts, transport: rest, method: get }
    params_override:
      offset: "{{currentOffset + pageSize}}"
    dtos:
      - { name: SavingsTransaction, role: response, api_id: get_client_savings_accounts }
    auth_required: true
    cache:
      strategy: append_to_existing
      key_template: "member_savings:{memberId}:page:{page}"
    error_paths:
      - { error_code: "network.offline", behavior: snackbar, message_key: error_network }

  - screen_id: memberSavingsDetailScreen
    trigger: on_interact
    interaction: filter_chip_tap
    endpoints: []
    dtos: []
    auth_required: false
    cache:
      strategy: none
    notes: "Client-side filtering only — no additional API call"
    error_paths: []
