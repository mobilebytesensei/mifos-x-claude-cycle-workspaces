sibling: tests
schema_version: "4.0"
feature_id: loan-mark-defaulted-dialog

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LMD-001
      scenario: "Chairperson confirms write-off — POST write-off succeeds"
      type: ViewModel
      priority: P0
      given: "loanId=5002 (Joseph's overdue loan), chairperson role"
      when: "user taps Confirm in dialog"
      then: "POST /loans/5002/transactions?command=writeoff called with today's date; dialog dismisses; loan-list refreshed"

    - id: TC-LMD-002
      scenario: "Dialog shows loan member name and outstanding amount before confirm"
      type: Screen
      priority: P0
      given: "loanId=5002, memberName='Joseph Otieno', outstandingBalance=9600 KES"
      when: "dialog opens"
      then: "member name and balance prominently displayed; destructive warning visible"

    - id: TC-LMD-003
      scenario: "Cancel button dismisses dialog without API call"
      type: Screen
      priority: P0
      given: "dialog open"
      when: "user taps Cancel"
      then: "dialog dismissed; no POST call made; loan-list unchanged"

    - id: TC-LMD-004
      scenario: "403 Forbidden shows permission error — only chairperson can write off"
      type: ViewModel
      priority: P0
      given: "user role = TREASURER (not CHAIRPERSON)"
      when: "server returns 403"
      then: "error snackbar: error_chairperson_role_required; dialog stays open"

    - id: TC-LMD-005
      scenario: "409 Conflict — loan not in eligible state shows specific error"
      type: ViewModel
      priority: P1
      given: "loan already closed or written off"
      when: "server returns 409"
      then: "error snackbar: error_loan_ineligible_state; dialog dismisses"

    - id: TC-LMD-006
      scenario: "Loading indicator shown while write-off API call in progress"
      type: Screen
      priority: P1
      given: "API call in flight"
      when: "user tapped Confirm"
      then: "Confirm button disabled; spinner shown; Cancel still tappable"

    - id: TC-LMD-007
      scenario: "Offline state prevents write-off — shows no-queue error"
      type: ViewModel
      priority: P1
      given: "network.offline"
      when: "user taps Confirm"
      then: "error: error_offline_no_queue shown; no API call; dialog stays open"

    - id: TC-LMD-008
      scenario: "LoanRepository.markDefaulted calls correct endpoint and returns"
      type: Repository
      priority: P0
      given: "mock POST /loans/5002/transactions?command=writeoff returns 200"
      when: "markDefaulted(5002) called"
      then: "Flow emits Unit; no error"
