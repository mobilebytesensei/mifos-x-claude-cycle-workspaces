sibling: tests
schema_version: "4.0"
feature_id: loan-mark-defaulted-dialog
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LMD-001
      scenario: "Dialog initialises with memberName and loanAmountKes from nav_params"
      type: ViewModel
      priority: P0
      given: "nav_params: loanId=10, memberName='John Doe', loanAmountKes=15000.0"
      when: "LoanMarkDefaultedDialog opens"
      then: "memberName='John Doe' and loanAmountKes=15000.0 displayed in warning body; isSubmitting=false"

    - id: TC-LMD-002
      scenario: "Warning icon and confirmation message visible in Idle state"
      type: Screen
      priority: P0
      given: "dialog open; isSubmitting=false"
      when: "dialog renders"
      then: "warning_icon (color error) visible; warning body text referencing memberName and KES amount shown; Mark Defaulted and Cancel buttons present"

    - id: TC-LMD-003
      scenario: "OnConfirm calls Fineract POST /loans/10/transactions?command=writeoff and emits LoanMarkedDefaulted on success"
      type: ViewModel
      priority: P0
      given: "isSubmitting=false; network online (cmp-network-monitor)"
      when: "OnConfirm fires"
      then: "isSubmitting=true; POST /loans/10/transactions?command=writeoff called; on 200 LoanMarkedDefaulted event emitted with loanId=10; Store5/SQLDelight loan cache refreshed; isSubmitting=false"

    - id: TC-LMD-004
      scenario: "Offline check blocks submit and shows no-offline-queue message (irreversible action)"
      type: ViewModel
      priority: P0
      given: "cmp-network-monitor reports offline"
      when: "OnConfirm fires"
      then: "submit blocked; offline warning snackbar shown; isSubmitting stays false; no offline queue created"

    - id: TC-LMD-005
      scenario: "Server error on writeoff shows submitError message in dialog"
      type: ViewModel
      priority: P1
      given: "network online; server returns 500"
      when: "OnConfirm fires"
      then: "isSubmitting=false; submitError non-null; error message shown in dialog; dialog remains open for retry"

    - id: TC-LMD-006
      scenario: "OnDismiss fires Dismiss event and closes dialog"
      type: ViewModel
      priority: P0
      given: "dialog open"
      when: "OnDismiss fires (Cancel button or outside tap)"
      then: "Dismiss event emitted; dialog closed; no API call made"

    - id: TC-LMD-007
      scenario: "Loading indicator shown on Mark Defaulted button while isSubmitting=true"
      type: Screen
      priority: P1
      given: "OnConfirm fired; isSubmitting=true"
      when: "dialog renders"
      then: "Mark Defaulted button shows loading spinner; Cancel button disabled to prevent double-fire"
