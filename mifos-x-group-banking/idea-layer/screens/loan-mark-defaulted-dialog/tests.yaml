sibling: tests
schema_version: "4.0"
feature_id: loan-mark-defaulted-dialog

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LMD-001
      scenario: "OnConfirm posts write-off, emits LoanMarkedDefaulted, dismisses dialog"
      type: ViewModel
      priority: P0
      given: "loanId=5002 (Peter Otieno's overdue loan), online, chairperson role"
      when: "user taps Mark Defaulted (OnConfirm)"
      then: "LoanRepository.markDefaulted(5002) fires POST /loans/5002/transactions?command=writeoff with today's date; LoanMarkedDefaulted(5002) emitted; Store5/SQLDelight loan cache refreshed; dialog dismisses"

    - id: TC-LMD-002
      scenario: "idle state renders member name and outstanding amount with destructive warning"
      type: Screen
      priority: P0
      given: "memberName='Peter Otieno', loanAmountKes=1500, isSubmitting=false, submitError=null"
      when: "dialog opens in idle state"
      then: "dialog_title 'Mark Loan as Defaulted', warning_icon, and warning_body_text showing 'Peter Otieno' and 'KES 1,500' rendered; submit_error_text hidden"

    - id: TC-LMD-003
      scenario: "OnDismiss (Cancel) emits Dismiss with no write and no API call"
      type: ViewModel
      priority: P0
      given: "dialog open in idle state"
      when: "user taps Cancel (OnDismiss)"
      then: "Dismiss event emitted; no LoanRepository call; m_loan record unchanged; no cache write"

    - id: TC-LMD-004
      scenario: "403 Forbidden — non-chairperson blocked, dialog stays open"
      type: ViewModel
      priority: P0
      given: "user role = TREASURER (not chairperson), OnConfirm submitted"
      when: "server returns 403"
      then: "submitError set to error_chairperson_role_required; dialog remains open (error state); no LoanMarkedDefaulted emitted"

    - id: TC-LMD-005
      scenario: "404 Loan not found shows specific error"
      type: ViewModel
      priority: P1
      given: "loanId references a deleted or unknown loan, OnConfirm submitted"
      when: "server returns 404"
      then: "submitError set to error_loan_not_found; error state rendered; no cache refresh"

    - id: TC-LMD-006
      scenario: "409 Conflict — loan ineligible for write-off shows state error"
      type: ViewModel
      priority: P1
      given: "loan already closed or already written off"
      when: "server returns 409"
      then: "submitError set to error_loan_ineligible_state; error state rendered; dialog stays open for user to cancel"

    - id: TC-LMD-007
      scenario: "submitting state disables buttons and shows loading on Mark Defaulted"
      type: Screen
      priority: P1
      given: "isSubmitting=true (write-off API call in flight)"
      when: "OnConfirm has been tapped and is in progress"
      then: "confirm_defaulted_button shows spinner and is disabled; cancel_button disabled; warning_body_text still visible"

    - id: TC-LMD-008
      scenario: "Offline blocks write-off — cmp-network-monitor gate shows no-queue error"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor reports offline, dialog open"
      when: "user taps Mark Defaulted (OnConfirm)"
      then: "submitError set to error_offline_no_queue; no POST attempted (no offline queue for destructive action); dialog stays open"

    - id: TC-LMD-009
      scenario: "500 Server error surfaces retryable error, dialog stays open"
      type: ViewModel
      priority: P2
      given: "OnConfirm submitted, backend degraded"
      when: "server returns 500"
      then: "submitError set to error_server; error state rendered; user can retry OnConfirm"

    - id: TC-LMD-010
      scenario: "LoanRepository.markDefaulted calls write-off endpoint and emits Unit"
      type: Repository
      priority: P0
      given: "mock POST /loans/5002/transactions?command=writeoff returns 200 with resourceId"
      when: "markDefaulted(5002) called"
      then: "Flow emits Unit exactly once; request body carries transactionDate formatted 'dd MMMM yyyy', locale='en'; no error surfaced"
