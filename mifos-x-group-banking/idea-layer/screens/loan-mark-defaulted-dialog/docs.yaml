id: loan-mark-defaulted-dialog
name: Mark Loan Defaulted Dialog
description: >
  Destructive confirmation dialog shown to the chairperson when they tap
  "Mark Defaulted" on the loan-detail screen. Displays a non-reversible
  warning including the member name and loan amount. Two actions: Cancel
  (dismiss) and Mark Defaulted (red, calls Fineract write-off endpoint).
  On success, dismisses and emits a refresh event to loan-detail.
feature: loan-management
version: "1.0.0"
tags:
  - loan-management
  - dialog
  - chairperson
  - destructive
  - confirm

status: designed
quality_score: 85
