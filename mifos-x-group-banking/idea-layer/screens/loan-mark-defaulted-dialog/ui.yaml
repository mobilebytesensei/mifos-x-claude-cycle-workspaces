requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: loan-mark-defaulted-dialog

nav_params:
  loanId: { type: Long, required: true }
  memberName: { type: String, required: true }
  loanAmountKes: { type: Double, required: true }

state_model:
  LoanMarkDefaultedDialogViewModel:
    state:
      name: LoanMarkDefaultedDialogState
      fields:
        isSubmitting: { type: Boolean, default: "false" }
        submitError: { type: "String?", default: "null" }
        memberName: { type: String, default: "\"\"", note: "Resolved from nav_params on init" }
        loanAmountKes: { type: Double, default: "0.0", note: "Resolved from nav_params on init" }
    events:
      name: LoanMarkDefaultedDialogEvent
      members:
        - { name: Dismiss }
        - { name: LoanMarkedDefaulted, params: { loanId: Long } }
        - { name: ShowError, params: { message: String } }
    actions:
      name: LoanMarkDefaultedDialogAction
      members:
        - { name: OnConfirm, trigger: "Tap Mark Defaulted button" }
        - { name: OnDismiss, trigger: "Tap Cancel or outside dialog" }
    di:
      - LoanRepository

business_logic:
  kind: crud
  description: "Marks a member loan as defaulted by POSTing a Fineract write-off transaction (POST /loans/{loanId}/transactions?command=writeoff) via LoanRepository; an irreversible state change on the m_loan record. Checks connectivity with cmp-network-monitor first (no offline queue for this destructive action) and refreshes the Store5/SQLDelight loan cache on success."
  library_refs:
    - cmp-network-monitor
  external_library_refs:
    - Store5
    - SQLDelight
  description_hash: "59ab7c26e200056b70fe5df3805f88aa5071b21a07131a032c3f31ee0aa6e31c"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: dialog_title
    type: text
    style: { text_style: titleLarge, color: onSurface }
    value: "Mark Loan as Defaulted"

  - id: warning_icon
    type: icon
    icon: warning_amber
    style:
      size: 48dp
      color: error
      alignment: center

  - id: warning_body_text
    type: text
    style:
      text_style: bodyMedium
      color: onSurface
      alignment: center
    value: "This action cannot be undone. Member {{memberName}}'s loan of KES {{loanAmountKes | number}} will be marked as defaulted."

  - id: submit_error_text
    type: text
    style: { text_style: bodySmall, color: error, alignment: center }
    value: "{{submitError}}"
    visible_when: "submitError != null"

  - id: dialog_actions_row
    type: row
    style:
      gap: 12dp
      padding: "16dp 0dp 0dp 0dp"
      arrangement: end
    content:
      - id: cancel_button
        type: button
        label: "Cancel"
        style:
          type: outlined
          border_color: outline
          text_color: onSurface
          min_touch_target: 48dp
        on_click:
          action: OnDismiss
          action_contract:
            effect: none
            description: "Dismisses the confirmation dialog without any write, emitting the Dismiss event to the parent loan-detail screen. Pure UI state transition — no persistence, no API call, no side effect on the m_loan record."
            action_contract_hash: "fd659e9aca6d585c397814d2b13ea655e45d80682b478cb056a5122ab8c2abe2"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: confirm_defaulted_button
        type: button
        label: "Mark Defaulted"
        loading_when: "isSubmitting"
        style:
          type: filled
          background: error
          text_color: onError
          corner_radius: 24dp
          min_touch_target: 48dp
        on_click:
          action: OnConfirm
          api: write_off_loan
          action_contract:
            effect: call_api
            library_refs:
              - cmp-network-monitor
            description: "Submits the irreversible loan write-off to Fineract via LoanRepository.markDefaulted(loanId), calling POST /loans/{loanId}/transactions?command=writeoff. Guards with a cmp-network-monitor connectivity check before firing (no offline queue for this destructive action); on success emits LoanMarkedDefaulted, on error sets submitError."
            action_contract_hash: "54caee28228a3333dbb6b0bc5aefd5f115054bc040e21898b03969fc8a7781fc"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  idle:
    components:
      - dialog_title
      - warning_icon
      - warning_body_text
      - dialog_actions_row
    demo_data:
      memberName: "Peter Otieno"
      loanAmountKes: 1500
      isSubmitting: false
      submitError: null
  submitting:
    components:
      - dialog_title
      - warning_icon
      - warning_body_text
      - dialog_actions_row
    description: "Mark Defaulted button shows loading indicator; both buttons disabled"
  error:
    components:
      - dialog_title
      - warning_icon
      - warning_body_text
      - submit_error_text
      - dialog_actions_row
    description: "API error displayed between body and action buttons"

i18n:
  en:
    dialog_title: "Mark Loan as Defaulted"
    warning_body: "This action cannot be undone. Member {{memberName}}'s loan of KES {{amount}} will be marked as defaulted."
    cancel: "Cancel"
    confirm: "Mark Defaulted"
    error_server: "Could not mark loan as defaulted. Please try again."
    error_forbidden: "You do not have permission to perform this action."
    error_ineligible: "This loan cannot be defaulted in its current state."
  sw:
    dialog_title: "Weka Mkopo Kama Mbaya"
    warning_body: "Hatua hii haiwezi kutenduliwa. Mkopo wa {{memberName}} wa KES {{amount}} utawekwa kama mkopo mbaya."
    cancel: "Ghairi"
    confirm: "Weka Kama Mkopo Mbaya"
  fr:
    dialog_title: "Marquer comme Défaut"
    warning_body: "Cette action est irréversible. Le prêt de {{memberName}} d'un montant de KES {{amount}} sera marqué comme défaut."
    cancel: "Annuler"
    confirm: "Marquer Défaut"
  hi:
    dialog_title: "ऋण डिफ़ॉल्ट के रूप में चिह्नित करें"
    warning_body: "यह क्रिया पूर्ववत नहीं की जा सकती। {{memberName}} का KES {{amount}} का ऋण डिफ़ॉल्ट के रूप में चिह्नित किया जाएगा।"
    cancel: "रद्द करें"
    confirm: "डिफ़ॉल्ट चिह्नित करें"
