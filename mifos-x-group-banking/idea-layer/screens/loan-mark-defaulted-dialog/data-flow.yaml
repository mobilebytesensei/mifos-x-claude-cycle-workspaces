sibling: data-flow
schema_version: "2.1.0"
feature_id: loan-mark-defaulted-dialog

entries:
  - screen_id: loanMarkDefaultedDialogScreen
    trigger: on_interact
    description: >
      Chairperson taps "Mark Defaulted" (OnConfirm action) to confirm the
      irreversible write-off. Flow guards with cmp-network-monitor before
      firing (no offline queue for this destructive action per business_logic),
      then POSTs to the Fineract write-off endpoint via
      LoanRepository.markDefaulted(loanId), which mutates the m_loan row on
      success and invalidates the Store5/SQLDelight loan cache so parent
      loan-detail + group-loan-portfolio screens re-fetch fresh state.
    endpoints:
      - { api_id: mark_loan_defaulted, transport: rest, method: post }
    dtos:
      - { name: WriteOffTransactionRequest, role: request, api_id: mark_loan_defaulted }
      - { name: WriteOffResponse, role: response, api_id: mark_loan_defaulted }
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "loan_defaulted:{loanId}"
      invalidates:
        - "loan:{loanId}"
        - "group_loan_portfolio:*"
      notes: >
        Destructive m_loan mutation — Store5 write-side must invalidate the
        cached loan detail and any group-loan-portfolio list stream so the
        chairperson sees the defaulted state without a manual pull-to-refresh.
    connectivity:
      required: true
      provider: cmp-network-monitor
      offline_behavior: block_and_show_error
      offline_message_key: error_offline_no_queue
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "403", behavior: show_error, message_key: error_forbidden }
      - { error_code: "404", behavior: show_error, message_key: error_loan_not_found }
      - { error_code: "409", behavior: show_error, message_key: error_ineligible }
      - { error_code: "500", behavior: show_error, message_key: error_server }
      - { error_code: "network.offline", behavior: show_error, message_key: error_offline_no_queue }

