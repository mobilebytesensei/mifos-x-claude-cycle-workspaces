sibling: demo-data
schema_version: "2.1.0"
feature_id: loan-mark-defaulted-dialog

entries:
  - dto: WriteOffTransactionRequest
    count_hint: 2
    source_notes: >
      Sample write-off request bodies for chairperson-initiated loan default
      marks in the rural Kenya group-banking context. Irreversible action on
      the m_loan record after 3+ consecutive missed weekly payments.
      transactionDate uses Fineract's "dd MMMM yyyy" format; locale fixed to
      "en" per project convention. Aligns with ui.yaml OnConfirm action
      contract (call_api effect via LoanRepository.markDefaulted, guarded by
      cmp-network-monitor). Dates chosen to match the idle-state binding for
      Peter Otieno's overdue 1,500 KES loan.
    items:
      - transactionDate: "09 May 2026"
        locale: "en"
        dateFormat: "dd MMMM yyyy"
      - transactionDate: "16 May 2026"
        locale: "en"
        dateFormat: "dd MMMM yyyy"

  - dto: WriteOffResponse
    count_hint: 1
    source_notes: >
      Write-off response for Peter Otieno's overdue 1,500 KES loan (aligns
      verbatim with ui.yaml idle-state demo_data binding memberName="Peter
      Otieno" + loanAmountKes=1500). Chairperson confirms default after 3
      consecutive missed payments. Fineract returns officeId, clientId,
      loanId, resourceId per api.yaml response.fields shape — the resourceId
      is the write-off transaction id created on the m_loan_transaction row.
    items:
      - officeId: 1
        clientId: 1002
        loanId: 5002
        resourceId: 5002

state_bindings:
  idle:
    memberName: "Peter Otieno"
    loanAmountKes: 1500
    isSubmitting: false
    submitError: null
    notes: >
      Mirrors the ui.yaml states.idle.demo_data block verbatim so preview
      renders and Compose Preview stay in sync with the same chairperson
      scenario.
  submitting:
    memberName: "Peter Otieno"
    loanAmountKes: 1500
    isSubmitting: true
    submitError: null
    notes: >
      Both buttons disabled, confirm button shows CircularProgressIndicator
      per ui.yaml components.confirm_defaulted_button.loading_when.
  error:
    memberName: "Peter Otieno"
    loanAmountKes: 1500
    isSubmitting: false
    submitError: "Could not mark loan as defaulted. Please try again."
    notes: >
      Renders submit_error_text between warning_body_text and
      dialog_actions_row per ui.yaml states.error.components ordering.

