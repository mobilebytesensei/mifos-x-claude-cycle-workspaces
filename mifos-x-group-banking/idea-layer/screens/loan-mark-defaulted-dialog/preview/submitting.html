<!DOCTYPE html>
<html lang="en" data-feature="loan-mark-defaulted-dialog" data-state="submitting" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-mark-defaulted-dialog · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dialog" style="background:rgba(0,0,0,.4);">
<main style="padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:852px;">
  <div style="background:var(--bg-canvas);border-radius:16px;padding:24px;width:340px;box-shadow:var(--shadow-lg);">
    <div style="text-align:center;margin-bottom:16px;">
      <div style="width:56px;height:56px;border-radius:50%;background:#FFEBEE;color:var(--danger);display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px;" aria-hidden="true">⚠</div>
      <h2 style="font-size:17px;font-weight:600;color:var(--text-primary);">Mark Loan as Defaulted</h2>
    </div>
    <p style="font-size:14px;line-height:20px;color:var(--text-primary);text-align:center;margin:0;">This action cannot be undone. Member <strong>Peter Otieno</strong>'s loan of <strong style="font-family:'Roboto Mono',monospace;">KES 1,500</strong> will be marked as defaulted.</p>
    <div class="btn-group" style="justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-secondary" style="flex:0 0 auto;min-height:48px;" disabled>Cancel</button>
      <button class="btn btn-danger" style="flex:0 0 auto;min-height:48px;border-radius:24px;background:var(--text-disabled);cursor:not-allowed;" disabled aria-busy="true">
        <span style="width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .8s linear infinite;"></span>
        <span style="margin-left:8px;">Marking…</span>
      </button>
    </div>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
