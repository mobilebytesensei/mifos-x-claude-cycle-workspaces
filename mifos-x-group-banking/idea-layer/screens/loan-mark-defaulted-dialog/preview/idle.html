<!DOCTYPE html>
<html lang="en" data-feature="loan-mark-defaulted-dialog" data-state="idle" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-mark-defaulted-dialog · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dialog" style="background:rgba(0,0,0,.4);">
<main style="padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;height:852px;">
  <div style="background:var(--bg-canvas);border-radius:16px;padding:24px;width:340px;">
    <div style="text-align:center;margin-bottom:16px;">
      <div style="width:56px;height:56px;border-radius:50%;background:#FFEBEE;color:var(--danger);display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px;">⚠</div>
      <h2 style="font-size:17px;font-weight:600;">Mark loan as defaulted?</h2>
    </div>
    <div class="alert alert-danger" style="font-size:13px;">
      <div>This action requires a group vote and writes a default to the member's profile. It cannot be undone — only group consensus at a future meeting can reactivate.</div>
    </div>
    <div class="kv-grid" style="margin-top:12px;">
      <span class="k">Loan</span><span class="v text">Amina Otieno · L-002</span>
      <span class="k">Outstanding</span><span class="v">KES 3,800</span>
      <span class="k">Overdue since</span><span class="v text">14 May 2026 (14 days)</span>
    </div>
    <div class="form-field" style="margin-top:16px;"><label>Reason</label>
      <textarea rows="2" placeholder="e.g. member moved away, sustained inability to pay…"></textarea>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" data-action="cancel" data-nav-to="loan-detail">Cancel</button>
      <button class="btn btn-danger" data-action="confirm_default" data-nav-to="loan-list">Mark defaulted</button>
    </div>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
