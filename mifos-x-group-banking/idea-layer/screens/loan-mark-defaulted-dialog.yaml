schema_version: "3.1"
id: loan-mark-defaulted-dialog
name: Mark Loan Defaulted Dialog
description: >
  Destructive confirmation dialog shown to the chairperson when they tap
  "Mark Defaulted" on the loan-detail screen. Displays a non-reversible
  warning including the member name and loan amount. Two actions: Cancel
  (dismiss) and Mark Defaulted (red, calls Fineract write-off endpoint).
  On success, dismisses and emits a refresh event to loan-detail.
feature: loan-management
version: "1.0.0"
tags:
  - loan-management
  - dialog
  - chairperson
  - destructive
  - confirm

status: enriched
quality_score: 85
status_history:
  - status: draft
    date: "2026-05-07"
    author: system
  - status: enriched
    date: "2026-05-07"
    author: system

archetype: dialog
entry_point: false
navigates_to: []
parent_screen: loan-detail

nav_params:
  loanId: { type: Long, required: true }
  memberName: { type: String, required: true }
  loanAmountKes: { type: Double, required: true }

state_model:
  LoanMarkDefaultedDialogViewModel:
    state:
      name: LoanMarkDefaultedDialogState
      fields:
        isSubmitting: { type: Boolean, default: "false" }
        submitError: { type: "String?", default: "null" }
        memberName: { type: String, default: "\"\"", note: "Resolved from nav_params on init" }
        loanAmountKes: { type: Double, default: "0.0", note: "Resolved from nav_params on init" }
    events:
      name: LoanMarkDefaultedDialogEvent
      members:
        - { name: Dismiss }
        - { name: LoanMarkedDefaulted, params: { loanId: Long } }
        - { name: ShowError, params: { message: String } }
    actions:
      name: LoanMarkDefaultedDialogAction
      members:
        - { name: OnConfirm, trigger: "Tap Mark Defaulted button" }
        - { name: OnDismiss, trigger: "Tap Cancel or outside dialog" }
    di:
      - LoanRepository

flow_logic:
  on_confirm:
    - action: mark_defaulted
      api: mark_loan_defaulted
      on_success: emit_LoanMarkedDefaulted_then_dismiss
      on_error: set_submitError
  on_dismiss:
    - action: emit_Dismiss

dependencies:
  repositories:
    - name: LoanRepository
      methods:
        - "markDefaulted(loanId: Long): Flow<Unit>"

api:
  - id: mark_loan_defaulted
    function: write_off_loan
    method: post
    endpoint: "/loans/{loanId}/transactions?command=writeoff"
    description: Write off (default) the loan in Fineract; irreversible
    params:
      loanId: { type: Long, required: true, source: nav_params }
    body:
      transactionDate: { type: String, note: "Today's date formatted as dd MMMM yyyy" }
      locale: { type: String, default: "en" }
      dateFormat: { type: String, default: "dd MMMM yyyy" }
    response:
      type: object
      fields:
        officeId: Int
        clientId: Long
        loanId: Long
        resourceId: Long
    errors:
      401: Unauthorized
      403: Forbidden (chairperson role required)
      404: Loan not found
      409: Loan is not in an eligible state for write-off
      500: Server error

components:
  - id: dialog_title
    type: text
    style: { text_style: titleLarge, color: onSurface }
    value: "Mark Loan as Defaulted"
    test_context:
      purpose: "Dialog header — identifies the destructive action"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: warning_icon
    type: icon
    icon: warning_amber
    style:
      size: 48dp
      color: error
      alignment: center
    test_context:
      purpose: "Visual cue that this is a destructive, irreversible action"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: warning_body_text
    type: text
    style:
      text_style: bodyMedium
      color: onSurface
      alignment: center
    value: "This action cannot be undone. Member {{memberName}}'s loan of KES {{loanAmountKes | number}} will be marked as defaulted."
    test_context:
      purpose: "Warning message showing member name and loan amount so chairperson can verify before confirming"
      interaction_type: static
      data_driven: true
      required_fields: [memberName, loanAmountKes]

  - id: submit_error_text
    type: text
    style: { text_style: bodySmall, color: error, alignment: center }
    value: "{{submitError}}"
    visible_when: "submitError != null"
    test_context:
      purpose: "Inline API error shown if the write-off call fails"
      interaction_type: static
      data_driven: true
      required_fields: [submitError]

  - id: dialog_actions_row
    type: row
    style:
      gap: 12dp
      padding: "16dp 0dp 0dp 0dp"
      arrangement: end
    content:
      - id: cancel_button
        type: button
        label: "Cancel"
        style:
          type: outlined
          border_color: outline
          text_color: onSurface
          min_touch_target: 48dp
        on_click: { action: OnDismiss }
        test_context:
          purpose: "Safe exit — dismiss without taking any action"
          interaction_type: tap
          data_driven: false
          required_fields: []
      - id: confirm_defaulted_button
        type: button
        label: "Mark Defaulted"
        loading_when: "isSubmitting"
        style:
          type: filled
          background: error
          text_color: onError
          corner_radius: 24dp
          min_touch_target: 48dp
        on_click: { action: OnConfirm, api: write_off_loan }
        test_context:
          purpose: "Destructive CTA — red filled button; shows spinner while posting write-off"
          interaction_type: tap
          data_driven: true
          required_fields: [isSubmitting]

states:
  idle:
    components:
      - dialog_title
      - warning_icon
      - warning_body_text
      - dialog_actions_row
    demo_data:
      memberName: "Peter Otieno"
      loanAmountKes: 1500
      isSubmitting: false
      submitError: null
  submitting:
    components:
      - dialog_title
      - warning_icon
      - warning_body_text
      - dialog_actions_row
    description: "Mark Defaulted button shows loading indicator; both buttons disabled"
  error:
    components:
      - dialog_title
      - warning_icon
      - warning_body_text
      - submit_error_text
      - dialog_actions_row
    description: "API error displayed between body and action buttons"

i18n:
  en:
    dialog_title: "Mark Loan as Defaulted"
    warning_body: "This action cannot be undone. Member {{memberName}}'s loan of KES {{amount}} will be marked as defaulted."
    cancel: "Cancel"
    confirm: "Mark Defaulted"
    error_server: "Could not mark loan as defaulted. Please try again."
    error_forbidden: "You do not have permission to perform this action."
    error_ineligible: "This loan cannot be defaulted in its current state."
  sw:
    dialog_title: "Weka Mkopo Kama Mbaya"
    warning_body: "Hatua hii haiwezi kutenduliwa. Mkopo wa {{memberName}} wa KES {{amount}} utawekwa kama mkopo mbaya."
    cancel: "Ghairi"
    confirm: "Weka Kama Mkopo Mbaya"
  fr:
    dialog_title: "Marquer comme Défaut"
    warning_body: "Cette action est irréversible. Le prêt de {{memberName}} d'un montant de KES {{amount}} sera marqué comme défaut."
    cancel: "Annuler"
    confirm: "Marquer Défaut"
  hi:
    dialog_title: "ऋण डिफ़ॉल्ट के रूप में चिह्नित करें"
    warning_body: "यह क्रिया पूर्ववत नहीं की जा सकती। {{memberName}} का KES {{amount}} का ऋण डिफ़ॉल्ट के रूप में चिह्नित किया जाएगा।"
    cancel: "रद्द करें"
    confirm: "डिफ़ॉल्ट चिह्नित करें"

analytics:
  events:
    - trigger: dialog opened
      name: loan_default_dialog_opened
      params: { loan_id: Long, member_name: String }
    - trigger: confirm tapped
      name: loan_default_confirmed
      params: { loan_id: Long }
    - trigger: default succeeded
      name: loan_default_success
      params: { loan_id: Long }
    - trigger: default failed
      name: loan_default_error
      params: { loan_id: Long, error: String }
    - trigger: dialog dismissed
      name: loan_default_dialog_dismissed
      params: { loan_id: Long }
