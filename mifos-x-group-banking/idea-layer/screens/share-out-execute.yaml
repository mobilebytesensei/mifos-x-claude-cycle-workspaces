analytics:
  screen_viewed:
    event: share_out_execute_viewed
    params:
      cycle_number: Int
      total_pool: Double
      member_count: Int
  events:
    - name: share_out_initiated
      trigger: Screen loads with nav_params populated
      params:
        cycle_number: Int
        total_pool: Double
        member_count: Int
        group_id: Long
    - name: share_out_confirmed
      trigger: isConfirmed becomes true (text match or biometric)
      params:
        method: "{ text | biometric }"
        cycle_number: Int
    - name: share_out_execution_started
      trigger: OnExecute called with isConfirmed == true
      params:
        total_pool: Double
        member_count: Int
        cycle_number: Int
        is_online: Boolean
    - name: share_out_execution_completed
      trigger: All payouts succeed with failedPayouts.isEmpty
      params:
        total_pool: Double
        success_count: Int
        cycle_number: Int
        group_id: Long
    - name: share_out_execution_partial_failure
      trigger: Some payouts failed after sequential execution
      params:
        success_count: Int
        fail_count: Int
        total_count: Int
        cycle_number: Int
    - name: share_out_queued_offline
      trigger: isConfirmed == true but isOnline == false; all queued to SyncQueue
      params:
        queued_count: Int
        cycle_number: Int
        total_pool: Double
    - name: share_out_failed
      trigger: Fatal error before any payouts (dt_share_out POST fails)
      params:
        error_type: String
        cycle_number: Int
