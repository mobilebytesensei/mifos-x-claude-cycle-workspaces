    section_create_invite: "Send Invite"
    section_pending_invites: "Pending Invites"
    field_email_phone: "Phone or Email"
    placeholder_email_phone: "e.g. +254712345678 or name@email.com"
    field_role: "Role"
    role_member: "Member"
    role_treasurer: "Treasurer"
    role_secretary: "Secretary"
    role_chairperson: "Chairperson"
    btn_generate: "Generate Code"
    btn_copy_code: "Copy Code"
    btn_copy_link: "Copy Link"
    btn_share: "Share"
