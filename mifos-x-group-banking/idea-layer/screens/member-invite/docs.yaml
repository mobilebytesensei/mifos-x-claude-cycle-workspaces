id: member-invite
name: Member Invite
description: >
  Screen for group organizers to invite new members remotely via phone number or email. The organizer enters a contact,
  optionally pre-assigns a role (member/treasurer/ secretary/chairperson), and taps Generate Code. A 6-character
  alphanumeric one-time stewardship code and a deep-link URL are returned by COMP-DT-002 and displayed on a card with
  Copy Code, Copy Link, and Share (native OS share sheet) actions. The bottom panel lists all pending (unaccepted)
  invites fetched via COMP-DT-003, each showing the contact, role, and expiry with a Revoke button that calls
  COMP-DT-005. Replaces the member-add screen for the remote-recruit path; member-add stays for in-meeting walk-up adds.
  Covers FR-024 and FR-002.
