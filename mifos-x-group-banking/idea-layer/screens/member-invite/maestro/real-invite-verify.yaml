# ─────────────────────────────────────────────────────────────────────────────
# E2E — REAL member-invite (WRITE) against LIVE mifos-bank-2: generate an invite
#        code that persists in the dt_companion_invitations datatable
# ─────────────────────────────────────────────────────────────────────────────
# login → organizer-dashboard → group-list → group-dashboard → View Members →
#   member-list → Invite (top-bar) → member-invite → Generate → POST
#   /companion/datatables/invitations/{groupId} → real invite row on mifos-bank-2
#   → generated card with the invite code shown. Prereq: Go companion :8090 +
#   adb reverse tcp:8080 tcp:8090.
appId: org.mifos.groupbanking
name: e2e — real member-invite generate (write, live mifos-bank-2)
tags:
  - e2e
  - group-banking
  - member-invite
  - real-network
  - write
---
- launchApp:
    clearState: true
- assertVisible: { id: "login_signup_screen" }
- tapOn: { id: "login_signup_field_email_phone" }
- inputText: "mifos"
- tapOn: { id: "login_signup_field_password" }
- inputText: "password"
- hideKeyboard
- tapOn: { id: "login_signup_login_button" }
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 20000
- tapOn: "All Groups"
- extendedWaitUntil:
    visible: { id: "group_list_screen" }
    timeout: 15000
- tapOn: "Mwangaza Women's Group"
- extendedWaitUntil:
    visible: { id: "group_dashboard_screen" }
    timeout: 20000
- tapOn: { id: "group_dashboard_view_members_button" }
- extendedWaitUntil:
    visible: { id: "member_list_screen" }
    timeout: 20000

# --- Invite action (top-bar TopAppBarAction, top-right) → member-invite ---
- tapOn:
    point: "92%,9%"
- extendedWaitUntil:
    visible: { id: "member_invite_screen" }
    timeout: 10000

# --- fill the recipient, then Generate → POST /companion/datatables/invitations/1
#     → real invite row on mifos-bank-2 → generated card with the code ---
- tapOn: { id: "member_invite_field_email_phone" }
- inputText: "newmember@example.com"
- hideKeyboard
- tapOn: { id: "member_invite_generate_button" }
- extendedWaitUntil:
    visible: { id: "member_invite_generated_card" }
    timeout: 20000
