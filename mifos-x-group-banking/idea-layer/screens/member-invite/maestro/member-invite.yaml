# ─────────────────────────────────────────────────────────────────────────────
# E2E — member-invite : group-dashboard → Members → Invite → generate code
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (GroupBankingNavHost §11c ← §11 member-list `onInviteMember`):
#   login(ORGANIZER) → group-dashboard → "View Members" → member-list →
#   "Invite Member" top-bar action (member_list_invite_action) → member-invite.
# Backend seed required: ORGANIZER account + group + members. The Generate-Code on_click
#   POSTs to the Fineract companion invitations datatable (COMP-DT-002) — needs connectivity
#   + backend to reach the Generated state.
# TestTags: MemberInviteTestTags.kt (+ MemberList/GroupDashboard/GroupList/Organizer).
appId: org.mifos.groupbanking
name: e2e — member-invite (content form → generate → generated card)
tags:
  - e2e
  - group-banking
  - member-invite
env:
  ORGANIZER_USER: "organizer@demo.mifos"
  ORGANIZER_PASS: "Demo1234!"
---
# --- guaranteed prefix: fresh launch + login ---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: ${ORGANIZER_USER}
- tapOn:
    id: "login_signup_field_password"
- inputText: ${ORGANIZER_PASS}
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- nav to member-list → Invite Member ---
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "organizer_dashboard_nav_group_list_card"
- assertVisible:
    id: "group_list_screen"
- tapOn:
    id: "group_list_card_"
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "group_dashboard_view_members_button"
- extendedWaitUntil:
    visible:
      id: "member_list_screen"
    timeout: 20000
- tapOn:
    id: "member_list_invite_action"

# --- state: Loading (pending invites) → Content (create-invite form) ---
- extendedWaitUntil:
    visible:
      id: "member_invite_screen"
    timeout: 20000
- assertVisible:
    id: "member_invite_field_email_phone"       # Content: contact input
- assertVisible:
    id: "member_invite_generate_button"         # Content: primary CTA

# --- primary on_click: enter contact + Generate → Generated state ---
- tapOn:
    id: "member_invite_field_email_phone"
- inputText: "+254712345678"
- hideKeyboard
- tapOn:
    id: "member_invite_generate_button"
# transient Generating state (member_invite_generating_indicator) → Generated card
- extendedWaitUntil:
    visible:
      id: "member_invite_generated_card"
    timeout: 20000
- assertVisible:
    id: "member_invite_copy_code_button"
- assertVisible:
    id: "member_invite_share_button"
