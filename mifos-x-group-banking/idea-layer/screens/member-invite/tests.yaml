sibling: tests
schema_version: "4.0"
feature_id: member-invite

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MI-001
      scenario: "On mount, list_pending_invites fires for the groupId nav param and populates pendingInvites list in content state"
      type: ViewModel
      priority: P0

    - id: TC-MI-002
      scenario: "Screen in content state renders Create Invite section (email_phone_field, role_dropdown, generate_button) and Pending Invites section"
      type: Screen
      priority: P0

    - id: TC-MI-003
      scenario: "Tapping Generate Code with blank email/phone shows validation error and does not call create_invite API"
      type: ViewModel
      priority: P0

    - id: TC-MI-004
      scenario: "Entering a valid E.164 phone number (+254712345678) passes validation and allows Generate Code to proceed"
      type: ViewModel
      priority: P0

    - id: TC-MI-005
      scenario: "Entering a valid email address (amina@email.com) passes validation and allows Generate Code to proceed"
      type: ViewModel
      priority: P0

    - id: TC-MI-006
      scenario: "Invalid format (just letters, no @ or country code) fails validation with error_validation message"
      type: ViewModel
      priority: P0

    - id: TC-MI-007
      scenario: "Successful create_invite response sets generatedCode and generatedLink and transitions to generated state showing the code card"
      type: ViewModel
      priority: P0

    - id: TC-MI-008
      scenario: "In generated state, generated_code_card is visible with the 6-char code, invite link, Copy Code, Copy Link, and Share buttons"
      type: Screen
      priority: P0

    - id: TC-MI-009
      scenario: "Tapping Copy Code calls ClipboardManager with generatedCode value and emits ShowSnackbar event"
      type: ViewModel
      priority: P0

    - id: TC-MI-010
      scenario: "Tapping Copy Link calls ClipboardManager with generatedLink value and emits ShowSnackbar event"
      type: ViewModel
      priority: P1

    - id: TC-MI-011
      scenario: "Tapping Share opens the native share sheet (emits ShowShareSheet event) with both the code and link as content"
      type: ViewModel
      priority: P1

    - id: TC-MI-012
      scenario: "Pre-assigning role 'treasurer' from dropdown sends role_to_assign=treasurer in the create_invite request body"
      type: ViewModel
      priority: P0

    - id: TC-MI-013
      scenario: "Default role is 'member' when no role is explicitly selected before tapping Generate Code"
      type: ViewModel
      priority: P1

    - id: TC-MI-014
      scenario: "Successful generate also triggers a reload of list_pending_invites so the new pending invite appears in the list"
      type: ViewModel
      priority: P1

    - id: TC-MI-015
      scenario: "Tapping Revoke on a pending invite row immediately removes it from the list (optimistic) and calls revoke_invite API"
      type: ViewModel
      priority: P0

    - id: TC-MI-016
      scenario: "If revoke_invite API returns 404 or 500, the optimistic removal is undone and the row reappears with an error banner"
      type: ViewModel
      priority: P1

    - id: TC-MI-017
      scenario: "Pending invite row shows invitedEmailPhone, roleToAssign chip, and expiry date correctly"
      type: Screen
      priority: P1

    - id: TC-MI-018
      scenario: "Empty pending invites list shows the empty_pending_invites placeholder text (not a loading indicator)"
      type: Screen
      priority: P1

    - id: TC-MI-019
      scenario: "Network error during create_invite shows error_network banner; Generate Code button returns to non-loading state"
      type: ViewModel
      priority: P1

    - id: TC-MI-020
      scenario: "409 Conflict response from create_invite shows specific error that an active invite for this contact already exists"
      type: ViewModel
      priority: P1

    - id: TC-MI-021
      scenario: "Network error during list_pending_invites on load shows error state with Retry button"
      type: ViewModel
      priority: P1

    - id: TC-MI-022
      scenario: "Tapping Retry on error state re-fetches list_pending_invites and returns to content state on success"
      type: ViewModel
      priority: P1

    - id: TC-MI-023
      scenario: "An invite row where expiresAt is in the past is still displayed in the pending list (server filters accepted_at, not expiry)"
      type: ViewModel
      priority: P2

    - id: TC-MI-024
      scenario: "InvitationRepository.createInvite correctly maps CreateInviteRequest to the COMP-DT-002 POST body including expires_at 7 days from now"
      type: Repository
      priority: P0

    - id: TC-MI-025
      scenario: "InvitationRepository.revokeInvite correctly calls DELETE /companion/datatables/invitations/{groupId}/{rowId}"
      type: Repository
      priority: P0

    - id: TC-MI-026
      scenario: "Tapping Back emits NavigateBack event without making any API call"
      type: ViewModel
      priority: P2
