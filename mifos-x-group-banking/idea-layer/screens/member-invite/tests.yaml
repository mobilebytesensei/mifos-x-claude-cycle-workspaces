sibling: tests
schema_version: "4.0"
feature_id: member-invite
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MI-001
      scenario: "On mount, both pending invites and invite code load from InviteRepository"
      type: ViewModel
      priority: P0
      given: "groupId=1; network online"
      when: "MemberInviteScreen enters composition"
      then: "InviteRepository.getPendingInvites(1) called; InviteRepository.getInviteCode(1) called; both panels populated; MemberInviteScreenState=Content"

    - id: TC-MI-002
      scenario: "Invite code panel shows current code with deep-link URL and share CTA"
      type: Screen
      priority: P0
      given: "Content state; inviteCode='XYZ789'"
      when: "InviteCodePanel renders"
      then: "code 'XYZ789' visible; deep-link URL shown; Share button present; Copy button present"

    - id: TC-MI-003
      scenario: "OnGenerateCode calls POST to generate new invite code and updates panel"
      type: ViewModel
      priority: P0
      given: "current inviteCode='OLD123'; network online"
      when: "OnGenerateCode fires"
      then: "isGenerating=true; POST /companion/groups/1/invite-code called; on 200 inviteCode updated to new value; isGenerating=false"

    - id: TC-MI-004
      scenario: "OnCopyCode triggers system clipboard copy and shows Copied snackbar"
      type: ViewModel
      priority: P1
      given: "inviteCode='XYZ789'"
      when: "OnCopyCode fires"
      then: "inviteCode copied to clipboard; ShowSnackbar('Copied') emitted"

    - id: TC-MI-005
      scenario: "Pending invites panel shows invited member with phone, expiry, and status"
      type: Screen
      priority: P0
      given: "pendingInvites=[{phone:'+254700123456', expiresAt:'2026-07-25', status:PENDING}]"
      when: "PendingInvitesPanel renders"
      then: "1 invite row shows phone, expiry date, PENDING status chip; Revoke button present"

    - id: TC-MI-006
      scenario: "OnRevokeInvite calls DELETE and removes invite from list"
      type: ViewModel
      priority: P1
      given: "invite.id=7; network online"
      when: "OnRevokeInvite(7) fires"
      then: "DELETE /companion/groups/1/invites/7 called; invite.id=7 removed from pendingInvites list"

    - id: TC-MI-007
      scenario: "Empty pending invites panel shows no-pending-invites message"
      type: Screen
      priority: P2
      given: "pendingInvites=[]"
      when: "PendingInvitesPanel renders"
      then: "empty state message shown; no invite rows"

    - id: TC-MI-008
      scenario: "Error state shown when either load fails"
      type: Screen
      priority: P1
      given: "InviteRepository.getPendingInvites returns network error"
      when: "load completes"
      then: "MemberInviteScreenState=Error; retry CTA shown"
