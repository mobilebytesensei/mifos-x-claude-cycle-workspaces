sibling: api
schema_version: "4.0"
feature_id: member-invite

api:
  - id: create_invite
    function: create_invite
    method: post
    endpoint: "/companion/datatables/invitations/{groupId}"
    description: >
      Create a new invite token row in the invitations datatable for the given group.
      Returns a 6-character alphanumeric token and a deep-link URL the organizer shares
      with the prospective member. Corresponds to COMP-DT-002.
    params:
      groupId: { type: Long, required: true, source: nav_params }
    body:
      invited_email_phone: { type: String, required: true }
      role_to_assign: { type: String, required: true, default: "member", enum: ["member", "treasurer", "secretary", "chairperson"] }
      expires_at: { type: String, required: true, format: "ISO-8601 datetime, 7 days from now" }
    response:
      type: object
      fields:
        token: { type: String, description: "6-character alphanumeric invite code" }
        invite_link: { type: String, description: "Deep-link URL the recipient uses to join the group" }
        row_id: { type: Long, description: "Primary key of the created invitations datatable row" }
    errors:
      400: "Validation error — missing or invalid fields"
      401: Unauthorized
      403: "Forbidden — caller is not the group organizer"
      409: "Conflict — an active invite for this contact already exists"
      500: Server error
    writable: true

  - id: list_pending_invites
    function: list_pending_invites
    method: get
    endpoint: "/companion/datatables/invitations/{groupId}"
    description: >
      Fetch all pending (unaccepted) invites for the group. The companion API filters
      to rows where accepted_at IS NULL. Corresponds to COMP-DT-003.
    params:
      groupId: { type: Long, required: true, source: nav_params }
    response:
      type: array
      shape: list
      pagination:
        style: offset
        default_limit: 50
        max_limit: 200
      items:
        row_id: { type: Long }
        token: { type: String }
        invited_email_phone: { type: String }
        role_to_assign: { type: String }
        expires_at: { type: String }
        accepted_at: { type: "String?", nullable: true }
    errors:
      401: Unauthorized
      403: Forbidden
      500: Server error
    cache:
      ttl: 60
      strategy: stale-while-revalidate
      offline: show_cached

  - id: revoke_invite
    function: revoke_invite
    method: delete
    endpoint: "/companion/datatables/invitations/{groupId}/{rowId}"
    description: >
      Revoke a pending invite by deleting its datatable row. Only callable by the group
      organizer. Corresponds to COMP-DT-005.
    params:
      groupId: { type: Long, required: true, source: nav_params }
      rowId: { type: Long, required: true, source: action_param }
    response:
      type: object
      fields:
        resourceId: { type: Long }
    errors:
      401: Unauthorized
      403: "Forbidden — caller is not the group organizer"
      404: "Not found — invite row does not exist or was already accepted/expired"
      500: Server error
    writable: true

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached

dtos:
  PendingInvite:
    rowId: Long
    token: String
    invitedEmailPhone: String
    roleToAssign: String
    expiresAt: String
    acceptedAt: "String?"

  CreateInviteRequest:
    groupId: Long
    invitedEmailPhone: String
    roleToAssign: String
    expiresAt: String

  GeneratedInvite:
    token: String
    inviteLink: String
    rowId: Long
