<!DOCTYPE html>

<html lang="en" data-feature="member-invite" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>member-invite · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="default">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar">
  <button class="back-btn" data-nav-to="group-dashboard" aria-label="Back">‹</button>
  <h1>Invite Member</h1>
</header>
<main>
  <h3 style="color:var(--primary-700);font-size:13px;font-weight:600;padding-top:4px;padding-bottom:var(--space-sm)">Send Invite</h3>

  <div class="form-field">
    <label for="email_phone_field">Phone or Email</label>
    <input id="email_phone_field" type="text" inputmode="email" placeholder="e.g. +254712345678 or name@email.com" data-action="OnEmailPhoneChange">
  </div>

  <div class="form-field">
    <label for="role_dropdown">Role</label>
    <select id="role_dropdown" data-action="OnRoleSelect">
      <option value="member" selected>Member</option>
      <option value="treasurer">Treasurer</option>
      <option value="secretary">Secretary</option>
      <option value="chairperson">Chairperson</option>
    </select>
  </div>

  <button class="btn btn-primary btn-full" disabled data-action="OnGenerateInvite">Generate Code</button>

  <div class="divider"></div>

  <h3 style="color:var(--primary-700);font-size:13px;font-weight:600;padding-bottom:var(--space-sm)">Pending Invites</h3>
  <div class="spinner" role="status" aria-label="Loading pending invites"></div>
</main>
</div>
