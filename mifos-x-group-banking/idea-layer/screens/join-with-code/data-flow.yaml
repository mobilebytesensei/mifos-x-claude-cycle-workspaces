sibling: data-flow
schema_version: "2.1.0"
feature_id: join-with-code

entries:
  - screen_id: joinWithCodeScreen
    trigger: on_mount
    description: >
      Screen mounts with optional deep-link inviteCode nav param. If inviteCode
      is present (from a shared link), pre-fill the code field and automatically
      trigger OnValidateCode so the user lands directly on the preview card.
      If no nav param, show empty input in Initial state.
    endpoints: []
    tables: []
    dtos: []
    produces_state: Initial
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    on_error:
      nav_target: null
    notes: >
      No API call on mount. When nav_params.inviteCode is non-null AND matches
      ^[A-Z0-9]{6}$, ViewModel init block pre-fills inviteCode and dispatches
      OnValidateCode automatically (see flow.yaml#flow_logic.on_mount). Empty
      mount produces Initial screen state with the code field unfocused and
      validate_button disabled until the user types 6 chars.

  - screen_id: joinWithCodeScreen
    trigger: on_action
    action: OnCodeChange
    description: >
      Local UI mutation only — user typed or pasted a character into the invite
      code field. State transformer uppercases the input and truncates to 6 chars,
      then clears any prior inviteStatus/error so the validate_button re-enables
      as soon as the field holds exactly 6 valid chars. No API call, no
      persistence. Matches ui.yaml action_contract effect=transform_state on
      invite_code_field.
    endpoints: []
    tables: []
    dtos: []
    produces_state: Initial
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    notes: >
      Writes to JoinWithCodeState.inviteCode / inviteStatus / error per the
      ui.yaml action_contract writes_to declaration. Never re-hits the network.

  - screen_id: joinWithCodeScreen
    trigger: on_action
    action: OnValidateCode
    description: >
      User taps Validate Code (or code was auto-submitted from deep-link nav arg).
      Step 1: GET invitation row from dt_companion_invitations datatable using the
      6-char token as the entityId key. Client validates expires_at and accepted_at
      in-band. Step 2: if valid, GET group preview using group_id from the row.
      Transitions to Preview screen state on success.
    endpoints:
      - { api_id: validate_invite_token, transport: rest, method: get }
      - { api_id: get_group_preview, transport: rest, method: get }
    tables:
      - name: pending_invite_cache
        persistence_contract: sqldelight_entity
        mutation: write
    dtos:
      - { name: InvitationDto, role: response, api_id: validate_invite_token }
      - { name: GroupDto, role: response, api_id: get_group_preview }
    produces_state: Preview
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "404", behavior: show_error, produces_state: ErrorInvalidCode, message_key: error_invalid_code }
      - { error_code: "network.offline", behavior: show_error, produces_state: ErrorNetwork, message_key: error_network }
      - { error_code: "401", behavior: navigate, nav_target: login-signup, message_key: error_auth }
      - { error_code: "500", behavior: show_error, produces_state: ErrorNetwork, message_key: error_network }
    client_validation:
      - condition: "invitationRow.expires_at < now()"
        error_state: ErrorExpired
        message_key: error_expired
      - condition: "invitationRow.accepted_at != null"
        error_state: ErrorAlreadyMember
        message_key: error_already_member
    notes: >
      validate_invite_token fires first (no-cache — tokens must be checked fresh
      per api.yaml#validate_invite_token cache.strategy=no-cache). Client evaluates
      expires_at and accepted_at BEFORE calling get_group_preview. get_group_preview
      uses invitationRow.group_id as its groupId param (stale-while-revalidate cache
      per api.yaml, ttl 60s). Validated InvitationRow is written to
      pending_invite_cache so a subsequent auth redirect can resume the join without
      re-validating. Screen state transitions Initial → Validating → Preview.

  - screen_id: joinWithCodeScreen
    trigger: on_action
    action: OnConfirmJoin
    description: >
      Authenticated user confirms joining the previewed group. Sets isJoining=true
      (Joining screen state). Calls associate_client_to_group to link the
      authenticated clientId to the group with the role from the invitation row.
      On success, calls mark_invitation_accepted (best-effort, non-blocking) then
      deletes pending_invite_cache and upserts group_memberships_cache before
      emitting NavigateToGroupDashboard. Transitions to Success (transient) state
      on navigation.
    endpoints:
      - { api_id: associate_client_to_group, transport: rest, method: post }
      - { api_id: mark_invitation_accepted, transport: rest, method: put }
    tables:
      - name: pending_invite_cache
        persistence_contract: sqldelight_entity
        mutation: delete
      - name: group_memberships_cache
        persistence_contract: sqldelight_entity
        mutation: upsert
    dtos:
      - { name: AssociateClientsRequest, role: request, api_id: associate_client_to_group }
      - { name: AssociateClientsResponse, role: response, api_id: associate_client_to_group }
      - { name: MarkAcceptedRequest, role: request, api_id: mark_invitation_accepted }
      - { name: MarkAcceptedResponse, role: response, api_id: mark_invitation_accepted }
    produces_state: Success
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "400", behavior: show_error, produces_state: ErrorAlreadyMember, message_key: error_already_member }
      - { error_code: "401", behavior: navigate, nav_target: login-signup, params: [pendingInviteCode], message_key: error_auth }
      - { error_code: "403", behavior: show_error, produces_state: ErrorInvalidCode, message_key: error_expired }
      - { error_code: "network.offline", behavior: show_error, produces_state: ErrorNetwork, message_key: error_network }
      - { error_code: "500", behavior: show_error, produces_state: ErrorNetwork, message_key: error_network }
    navigation:
      - { condition: "associateSuccess", nav_target: group-dashboard, params: [groupId] }
    notes: >
      associate_client_to_group MUST succeed before navigating.
      mark_invitation_accepted is a best-effort cleanup call — navigation is not
      blocked if it fails (flow.yaml#on_confirm_join documents this: non-fatal
      cleanup, still emit NavigateToGroupDashboard on partial success). A 401
      during join swaps to the unauthenticated path via NavigateToLoginSignup with
      the pendingInviteCode nav arg preserved. 403 is treated as
      "group closed / role forbidden" and maps to the InvalidCode error card.

  - screen_id: joinWithCodeScreen
    trigger: on_action
    action: OnConfirmJoin_Unauthenticated
    description: >
      User taps Join Group but is not yet authenticated (isAuthenticated() == false).
      Persists the validated invite token and preview to pending_invite_cache, then
      emits NavigateToLoginSignup with the pendingInviteCode param so the join flow
      auto-resumes from the OnValidateCode entry after the user registers or logs in.
    endpoints: []
    tables:
      - name: pending_invite_cache
        persistence_contract: sqldelight_entity
        mutation: write
    dtos: []
    produces_state: Initial
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    navigation:
      - { condition: "!isAuthenticated", nav_target: login-signup, params: [pendingInviteCode] }
    notes: >
      Branch selected by flow.yaml#on_confirm_join.check_auth.unauthenticated.
      The pending_invite_cache write MUST land before navigation so a hostile
      logout on the login-signup screen still leaves a resumable pending join.

  - screen_id: joinWithCodeScreen
    trigger: on_action
    action: OnRetry
    description: >
      User taps Retry after a Network error card. Clears JoinWithCodeState.error
      and re-dispatches OnValidateCode with the existing inviteCode value so the
      user does not need to re-type. Transitions Screen state back to Validating.
    endpoints:
      - { api_id: validate_invite_token, transport: rest, method: get }
      - { api_id: get_group_preview, transport: rest, method: get }
    tables: []
    dtos:
      - { name: InvitationDto, role: response, api_id: validate_invite_token }
      - { name: GroupDto, role: response, api_id: get_group_preview }
    produces_state: Preview
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "404", behavior: show_error, produces_state: ErrorInvalidCode, message_key: error_invalid_code }
      - { error_code: "network.offline", behavior: show_error, produces_state: ErrorNetwork, message_key: error_network }
      - { error_code: "401", behavior: navigate, nav_target: login-signup, message_key: error_auth }
      - { error_code: "500", behavior: show_error, produces_state: ErrorNetwork, message_key: error_network }
    notes: >
      Retry is only offered when JoinError.retry==true (Network + InvalidCode
      per ui.yaml state_model.errors). Never offered for ExpiredCode / AlreadyMember
      / Auth — those require the user to obtain a new code or log in.

  - screen_id: joinWithCodeScreen
    trigger: on_action
    action: OnBack
    description: >
      User taps system back or the top-bar back arrow. Emits NavigateBack event.
      No API calls; no state mutation beyond screen dismissal. Matches ui.yaml
      action_contract effect=navigate on top_bar.on_navigation_click.
    endpoints: []
    tables: []
    dtos: []
    produces_state: Initial
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    navigation:
      - { condition: "always", nav_target: personal-dashboard }

tables:
  - name: pending_invite_cache
    description: >
      Session-scoped SQLDelight store for a validated InvitationRow + its
      resolved GroupPreview. Written on successful OnValidateCode, read on
      Auth-redirect resume + on OnConfirmJoin (unauthenticated path), deleted
      after successful OnConfirmJoin (authenticated path). Ensures the app can
      resume a pending join across a login-signup detour without re-validating
      the token (which is single-use once accepted_at is set).
    persistence_contract: sqldelight_entity
    primary_key: "token"
    mutations: [write, delete, read]
    offline_strategy: session_only
    source_datatable: dt_companion_invitations

  - name: group_memberships_cache
    description: >
      Shared cache of GroupMembership rows keyed by groupId. Upserted after a
      successful OnConfirmJoin so the personal-dashboard reflects the new group
      immediately without waiting for a background sync. Read cross-feature by
      group-list / group-dashboard.
    persistence_contract: sqldelight_entity
    primary_key: "groupId"
    mutations: [upsert, read]
    offline_strategy: serve_stale

cache:
  strategy: no_cache
  notes: >
    All validation and write endpoints bypass cache — token freshness is critical
    (a stale-cached "valid" verdict would let an already-accepted or newly-revoked
    code succeed client-side and then fail server-side). get_group_preview is the
    ONLY read that opts into stale-while-revalidate (60s TTL, api.yaml owns the
    strategy). group_memberships_cache is written directly for immediate UI
    reflection. Single source of truth for cache shape — no legacy api.yaml#cache.

sync_queue:
  entries: []
  notes: >
    Join-with-code REQUIRES connectivity — tokens MUST be validated server-side
    (client validation is pattern-only). No offline enqueue: OnValidateCode
    dispatches on network.offline route to ErrorNetwork with the Retry button.
    OnConfirmJoin on network.offline routes the same way — better to fail loudly
    than enqueue an association that could race a mark_invitation_accepted from
    a parallel device.
