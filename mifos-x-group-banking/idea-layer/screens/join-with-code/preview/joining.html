<!DOCTYPE html>
<html lang="en" data-feature="join-with-code" data-state="joining" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>join-with-code · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .join-hero { text-align: center; padding: var(--space-md) 0 var(--space-base); }
  .join-hero .hero-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--primary-100); color: var(--primary-700); display: inline-flex; align-items: center; justify-content: center; font-size: 30px; }
  .code-field input { font-family: 'Roboto Mono', monospace; font-size: 22px; font-weight: 600; letter-spacing: 8px; text-align: center; text-transform: uppercase; padding: 12px var(--space-md); }
  .preview-eyebrow { font-size: 13px; color: var(--text-secondary); margin-bottom: var(--space-xs); }
  .preview-name { font-size: 20px; font-weight: 700; color: var(--primary-700); margin-bottom: var(--space-md); }
  .role-line { display: flex; align-items: center; gap: var(--space-sm); margin-top: var(--space-md); font-size: 13px; color: var(--text-secondary); }
  .btn-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0; }
</style></head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="personal-dashboard" data-nav-type="pop" data-action-id="OnBack" aria-label="Dismiss the join screen">‹</button>
    <h1>Join a Group</h1>
  </header>
  <main>
    <div class="join-hero">
      <div class="hero-icon" role="img" aria-label="Join a group illustration">👥＋</div>
    </div>
    <div class="form-field code-field">
      <label for="invite-code">Invite Code</label>
      <input id="invite-code" type="text" maxlength="6" value="MWG7X2" readonly aria-label="Invite code text field, 6 characters">
    </div>
    <div class="card card-highlighted" aria-label="Group preview details">
      <p class="preview-eyebrow">You're invited to join</p>
      <p class="preview-name">Mwangaza Women's Group</p>
      <div class="kv-grid">
        <span class="k">Type</span><span class="v text">Savings &amp; Credit</span>
        <span class="k">Organiser</span><span class="v text">Jane Otieno</span>
        <span class="k">Members</span><span class="v">14 members</span>
      </div>
      <div class="role-line">
        Your role:
        <span class="chip-static success" aria-label="Your role in the group">Member</span>
      </div>
    </div>
    <button class="btn btn-primary btn-full" disabled aria-busy="true" aria-label="Joining the group">
      <span class="btn-spinner"></span> Joining…
    </button>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
