<!DOCTYPE html>
<html lang="en" data-feature="join-with-code" data-state="success" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>join-with-code · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .success-block { text-align: center; padding: var(--space-2xl) var(--space-base); display: flex; flex-direction: column; align-items: center; gap: var(--space-base); }
  .success-block .check { width: 88px; height: 88px; border-radius: 50%; background: var(--primary-100); color: var(--primary-700); display: inline-flex; align-items: center; justify-content: center; font-size: 44px; }
  .success-block h2 { font-size: 20px; font-weight: 700; color: var(--text-primary); }
  .success-block .redirect { font-size: 13px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: var(--space-sm); }
  .success-block .redirect .spinner { width: 16px; height: 16px; border-width: 2px; margin: 0; }
</style></head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1>Join a Group</h1>
  </header>
  <main>
    <div class="alert alert-success" role="status" aria-live="polite">
      <div>
        <h3>Joined successfully</h3>
        <p>You are now a member of Mwangaza Women's Group.</p>
      </div>
    </div>
    <div class="success-block">
      <div class="check" role="img" aria-label="Success">✓</div>
      <h2>Welcome aboard!</h2>
      <p class="redirect"><span class="spinner"></span> Taking you to your group…</p>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
