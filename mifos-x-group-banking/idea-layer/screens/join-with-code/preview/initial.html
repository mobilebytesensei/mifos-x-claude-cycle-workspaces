<!DOCTYPE html>
<html lang="en" data-feature="join-with-code" data-state="initial" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>join-with-code · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .join-hero { text-align: center; padding: var(--space-lg) 0 var(--space-base); }
  .join-hero .hero-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--primary-100); color: var(--primary-700); display: inline-flex; align-items: center; justify-content: center; font-size: 34px; margin-bottom: var(--space-md); }
  .join-hero .hero-caption { font-size: 14px; color: var(--text-secondary); max-width: 260px; margin: 0 auto; }
  .code-field input { font-family: 'Roboto Mono', monospace; font-size: 26px; font-weight: 600; letter-spacing: 10px; text-align: center; text-transform: uppercase; padding: 14px var(--space-md); }
  .code-field input::placeholder { letter-spacing: 6px; font-weight: 400; color: var(--text-disabled); }
</style></head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="personal-dashboard" data-nav-type="pop" data-action-id="OnBack" aria-label="Dismiss the join screen">‹</button>
    <h1>Join a Group</h1>
  </header>
  <main>
    <div class="join-hero">
      <div class="hero-icon" role="img" aria-label="Join a group illustration">👥＋</div>
      <p class="hero-caption">Enter the 6-character invite code shared by your group organiser.</p>
    </div>
    <div class="form-field code-field">
      <label for="invite-code">Invite Code</label>
      <input id="invite-code" type="text" maxlength="6" placeholder="e.g. MWG7X2" value="" autocomplete="off" spellcheck="false"
             data-action="OnCodeChange" aria-label="Invite code text field, 6 characters">
    </div>
    <button class="btn btn-primary btn-full" disabled
            data-state-to="validating" data-action-id="OnValidateCode" aria-label="Validate the entered invite code">Validate Code</button>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
