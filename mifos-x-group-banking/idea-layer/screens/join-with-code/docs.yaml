id: join-with-code
name: Join With Code
description: >
  Single-screen flow that lets an invitee enter (or deep-link with) a 6-character alphanumeric invite code to join a
  savings group. Validates the token against the companion invitations datatable, shows a group preview card (name,
  type, organiser, member count, assigned role) before confirmation, and handles expiry, already-member, and network
  error states. If the user is not yet authenticated the flow redirects to login-signup preserving the invite code in
  nav params so the join auto-resumes after registration. On confirmation, calls COMP-GRP-003 to associate the invitee
  as a member then calls COMP-DT-004 to mark the invitation as accepted. Covers FR-024 and FR-013.
