sibling: demo-data
schema_version: "2.1.0"
feature_id: join-with-code

entries:
  - dto: InvitationRow
    count_hint: 4
    source_notes: >
      Four invite rows covering the main UI states: one valid unused token,
      one expired token, one already-accepted token, and one that does not exist
      (mapped by ID absence). Tokens are realistic 6-char uppercase alphanumeric
      codes. expires_at uses ISO-8601 dates; accepted_at is null unless consumed.
    items:
      - token: "MWG7X2"
        group_id: 301
        inviter_client_id: 10042
        invited_email_phone: "+254712345678"
        role_to_assign: "Member"
        expires_at: "2026-08-15"
        accepted_at: null

      - token: "EXP001"
        group_id: 302
        inviter_client_id: 10043
        invited_email_phone: "+254798765432"
        role_to_assign: "Member"
        expires_at: "2026-06-01"
        accepted_at: null

      - token: "USED88"
        group_id: 301
        inviter_client_id: 10042
        invited_email_phone: "+254700111222"
        role_to_assign: "Member"
        expires_at: "2026-08-15"
        accepted_at: "2026-07-10T09:14:00Z"

      - token: "SAVK4P"
        group_id: 303
        inviter_client_id: 10101
        invited_email_phone: "+254733556677"
        role_to_assign: "Treasurer"
        expires_at: "2026-09-01"
        accepted_at: null

  - dto: GroupPreview
    count_hint: 3
    source_notes: >
      Group previews for the three valid invite tokens. Mwangaza Women's Group is the
      primary demo group shown in the preview card. Amani Youth Savings covers the
      Treasurer role scenario. Jua Kali Savings is a third group for variety.
    items:
      - groupId: 301
        groupName: "Mwangaza Women's Group"
        groupType: "Savings & Credit"
        organizerName: "Jane Otieno"
        memberCount: 14
        officeId: 10
        roleToAssign: "Member"

      - groupId: 303
        groupName: "Amani Youth Savings"
        groupType: "Savings & Credit"
        organizerName: "David Kamau"
        memberCount: 8
        officeId: 11
        roleToAssign: "Treasurer"

      - groupId: 302
        groupName: "Kisumu East Women Circle"
        groupType: "Credit Only"
        organizerName: "Grace Auma"
        memberCount: 22
        officeId: 11
        roleToAssign: "Member"

  - dto: AssociateClientsRequest
    count_hint: 1
    source_notes: >
      Demo request payload sent when the authenticated user (clientId 20055)
      confirms joining Mwangaza Women's Group with the MWG7X2 token.
    items:
      - clientIds: [20055]
        roleToAssign: "Member"

  - dto: AssociateClientsResponse
    count_hint: 1
    source_notes: >
      Expected server response after successfully associating client 20055 to group 301.
    items:
      - resourceId: 50012
        groupId: 301
        clientIds: [20055]

  - dto: MarkAcceptedRequest
    count_hint: 1
    source_notes: >
      Datatable update payload that marks token MWG7X2 as consumed after the
      association succeeds. accepted_at set to the moment of joining.
    items:
      - accepted_at: "2026-07-17T10:30:00Z"

