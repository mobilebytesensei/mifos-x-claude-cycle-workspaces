sibling: demo-data
schema_version: "2.1.0"
feature_id: join-with-code

entries:
  - dto: InvitationRow
    count_hint: 4
    source_notes: >
      Four invite rows covering the main UI states: one valid unused token
      (MWG7X2 → Preview flow), one expired token (EXP001 → error_expired),
      one already-accepted token (USED88 → error_already_member), and a
      second valid unused token (SAVK4P) for the Treasurer role scenario.
      Tokens are realistic 6-char uppercase alphanumeric codes matching the
      ui.yaml validation pattern ^[A-Z0-9]{6}$. expires_at uses ISO-8601
      dates; accepted_at is null unless the token has been consumed.
      DTO shape mirrors api.yaml#dtos.InvitationRow (snake_case fields as
      returned by the datatable endpoint), not the registry InvitationDto
      (which uses camelCase; see shared_registry_deltas in the caller).
    items:
      - token: "MWG7X2"
        group_id: 301
        inviter_client_id: 10042
        invited_email_phone: "+254712345678"
        role_to_assign: "Member"
        expires_at: "2026-08-15"
        accepted_at: null

      - token: "EXP001"
        group_id: 302
        inviter_client_id: 10043
        invited_email_phone: "+254798765432"
        role_to_assign: "Member"
        expires_at: "2026-06-01"
        accepted_at: null

      - token: "USED88"
        group_id: 301
        inviter_client_id: 10042
        invited_email_phone: "+254700111222"
        role_to_assign: "Member"
        expires_at: "2026-08-15"
        accepted_at: "2026-07-10T09:14:00Z"

      - token: "SAVK4P"
        group_id: 303
        inviter_client_id: 10101
        invited_email_phone: "+254733556677"
        role_to_assign: "Treasurer"
        expires_at: "2026-09-01"
        accepted_at: null

  - dto: GroupPreview
    count_hint: 3
    source_notes: >
      Group previews for the three distinct group IDs referenced by the
      invitation rows above. Group 301 (Mwangaza Women's Group) is the
      canonical demo used across every ui.yaml#states[preview,joining,error_already_member]
      block. Group 303 (Amani Youth Savings) covers the Treasurer role scenario.
      Group 302 (Kisumu East Women Circle) is the expired-token target and
      appears only in state=error_expired preview data. Field shape matches
      api.yaml#dtos.GroupPreview (groupId, groupName, groupType, organizerName,
      memberCount, officeId, roleToAssign). roleToAssign is denormalized from
      the invitation row for convenience — the client uses the invitation's
      role_to_assign at OnConfirmJoin time, not this cached copy.
    items:
      - groupId: 301
        groupName: "Mwangaza Women's Group"
        groupType: "Savings & Credit"
        organizerName: "Jane Otieno"
        memberCount: 14
        officeId: 10
        roleToAssign: "Member"

      - groupId: 303
        groupName: "Amani Youth Savings"
        groupType: "Savings & Credit"
        organizerName: "David Kamau"
        memberCount: 8
        officeId: 11
        roleToAssign: "Treasurer"

      - groupId: 302
        groupName: "Kisumu East Women Circle"
        groupType: "Credit Only"
        organizerName: "Grace Auma"
        memberCount: 22
        officeId: 11
        roleToAssign: "Member"

  - dto: AssociateClientsRequest
    count_hint: 1
    source_notes: >
      Demo request payload sent when the authenticated user (clientId 20055)
      confirms joining Mwangaza Women's Group (groupId 301) with the MWG7X2
      token. clientIds is a single-element list because self-signup only ever
      associates the current user. roleToAssign echoes the invitation row so
      the server enforces the pre-assigned role.
    items:
      - clientIds: [20055]
        roleToAssign: "Member"

  - dto: AssociateClientsResponse
    count_hint: 1
    source_notes: >
      Expected server response after successfully associating client 20055
      to group 301. resourceId is the m_group_client association row id;
      groupId + clientIds echo the request so the client can reconcile.
    items:
      - resourceId: 50012
        groupId: 301
        clientIds: [20055]

  - dto: MarkAcceptedRequest
    count_hint: 1
    source_notes: >
      Datatable update payload that marks token MWG7X2 as consumed after
      the association succeeds. accepted_at is the ISO-8601 timestamp of
      the join moment (client sets via now_iso8601() in flow.yaml).
    items:
      - accepted_at: "2026-07-18T10:30:00Z"

  - dto: MarkAcceptedResponse
    count_hint: 1
    source_notes: >
      Server confirmation that the invitations datatable row was updated.
      resourceId references the datatable row id; changes.accepted_at echoes
      the timestamp written. Used for audit/logging only — UX does not depend
      on this response (flow.yaml treats mark_invitation_accepted failure as
      non-fatal and still navigates).
    items:
      - resourceId: 88301
        changes:
          accepted_at: "2026-07-18T10:30:00Z"

