sibling: tests
schema_version: "4.0"
feature_id: join-with-code
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-JWC-001
      scenario: "Deep-link pre-fills inviteCode field and auto-validates on mount"
      type: ViewModel
      priority: P0
      given: "inviteCode='ABC123' passed via nav_params deep-link"
      when: "JoinWithCodeScreen enters composition"
      then: "inviteCode field shows 'ABC123'; OnValidateCode fires automatically; InviteStatus=Validating"

    - id: TC-JWC-002
      scenario: "Valid invite code transitions to Preview state showing group details"
      type: ViewModel
      priority: P0
      given: "inviteCode='ABC123'; POST /companion/groups/validate returns groupPreview"
      when: "OnValidateCode fires"
      then: "InviteStatus=Preview; groupPreview.name, type, and member count shown; Join Group button enabled"

    - id: TC-JWC-003
      scenario: "OnJoinGroup POSTs join request and navigates to personal-dashboard on success (F5 landing)"
      type: ViewModel
      priority: P0
      given: "InviteStatus=Preview; groupId='g5' in preview"
      when: "OnJoinGroup fires"
      then: "isJoining=true; POST /companion/groups/join called with inviteCode; on 200 NavigateToPersonalDashboard emitted (member lands on own dashboard; identity + joined group resolve from auth token); isJoining=false"

    - id: TC-JWC-004
      scenario: "Invalid invite code shows ErrorInvalidCode state with user-facing message"
      type: ViewModel
      priority: P0
      given: "inviteCode='XXXXXX'; validation returns 404 or invalid-code error"
      when: "OnValidateCode fires"
      then: "JoinWithCodeScreenState=ErrorInvalidCode; error_invalid_code message shown; user can try again"

    - id: TC-JWC-005
      scenario: "Expired invite code shows ErrorExpired state (no retry)"
      type: ViewModel
      priority: P1
      given: "inviteCode='EXP999'; validation returns expired error"
      when: "OnValidateCode fires"
      then: "JoinWithCodeScreenState=ErrorExpired; error_expired message shown; retry NOT available"

    - id: TC-JWC-006
      scenario: "Already-member error shows ErrorAlreadyMember state (no retry)"
      type: ViewModel
      priority: P1
      given: "inviteCode='GRP01'; user already a member of that group"
      when: "OnValidateCode fires"
      then: "JoinWithCodeScreenState=ErrorAlreadyMember; error_already_member message shown"

    - id: TC-JWC-007
      scenario: "Network error shows ErrorNetwork state with retry"
      type: Screen
      priority: P1
      given: "network offline when OnValidateCode fires"
      when: "validation call fails with network error"
      then: "JoinWithCodeScreenState=ErrorNetwork; retry CTA visible"

    - id: TC-JWC-008
      scenario: "Unauthenticated user is redirected to login-signup with pending invite code preserved"
      type: ViewModel
      priority: P0
      given: "user not logged in; inviteCode='ABC123'"
      when: "OnJoinGroup fires and auth check fails"
      then: "NavigateToLoginSignup emitted with pendingInviteCode='ABC123'"

    - id: TC-JWC-009
      scenario: "Preview group card shows group name, type chip, and member count"
      type: Screen
      priority: P1
      given: "InviteStatus=Preview; groupPreview={name:'Mwangaza', type:'VSLA', memberCount:8}"
      when: "GroupPreviewCard renders"
      then: "group name 'Mwangaza', type chip 'VSLA', and '8 members' displayed"
