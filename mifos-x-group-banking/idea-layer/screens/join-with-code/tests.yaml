sibling: tests
schema_version: "4.0"
feature_id: join-with-code

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-JWC-001
      scenario: "On mount without nav params, screen shows initial state with empty code field and disabled validate button"
      type: Screen
      priority: P0

    - id: TC-JWC-002
      scenario: "On mount with deep-link nav param inviteCode='MWG7X2', field is pre-filled and validate_invite_token API fires automatically"
      type: ViewModel
      priority: P0

    - id: TC-JWC-003
      scenario: "Typing fewer than 6 characters keeps validate button disabled; reaching 6 chars enables it"
      type: Screen
      priority: P0

    - id: TC-JWC-004
      scenario: "Tapping Validate Code with a valid non-expired token transitions state to VALIDATING then to VALID and shows group preview card"
      type: ViewModel
      priority: P0

    - id: TC-JWC-005
      scenario: "Group preview card shows correct groupName, groupType, organizerName, memberCount, and roleToAssign from API response"
      type: Screen
      priority: P0

    - id: TC-JWC-006
      scenario: "Validate with a 404 response sets error type InvalidCode and shows error card with correct message"
      type: ViewModel
      priority: P0

    - id: TC-JWC-007
      scenario: "Validate with a token where expires_at is in the past sets error type ExpiredCode and shows 'Ask organiser for a new code' hint"
      type: ViewModel
      priority: P0

    - id: TC-JWC-008
      scenario: "Validate with a token where accepted_at is non-null sets error type AlreadyMember"
      type: ViewModel
      priority: P1

    - id: TC-JWC-009
      scenario: "Network error during validation sets error type Network and shows Retry button; tapping Retry clears error and re-submits"
      type: ViewModel
      priority: P0

    - id: TC-JWC-010
      scenario: "Tapping Join Group when authenticated calls associate_client_to_group with correct groupId and clientId"
      type: ViewModel
      priority: P0

    - id: TC-JWC-011
      scenario: "Successful associate_client_to_group triggers mark_invitation_accepted then emits NavigateToGroupDashboard with correct groupId"
      type: ViewModel
      priority: P0

    - id: TC-JWC-012
      scenario: "If mark_invitation_accepted fails after a successful association, ViewModel still navigates to group-dashboard (non-fatal path)"
      type: ViewModel
      priority: P1

    - id: TC-JWC-013
      scenario: "Tapping Join Group when unauthenticated emits NavigateToLoginSignup with pendingInviteCode equal to the current code"
      type: ViewModel
      priority: P0

    - id: TC-JWC-014
      scenario: "associate_client_to_group returns 400 with already-member payload; error type set to AlreadyMember"
      type: ViewModel
      priority: P1

    - id: TC-JWC-015
      scenario: "OnBack action emits NavigateBack event; screen does not navigate to any group"
      type: ViewModel
      priority: P1

    - id: TC-JWC-016
      scenario: "Validate button is disabled when code field contains non-alphanumeric characters; auto-uppercase applied on input"
      type: Screen
      priority: P1

    - id: TC-JWC-017
      scenario: "InvitationRepository.validateToken correctly maps a 404 HTTP response to Result.Failure(JoinError.InvalidCode)"
      type: Repository
      priority: P0

    - id: TC-JWC-018
      scenario: "InvitationRepository.markAccepted sends accepted_at as ISO-8601 and maps the response resourceId correctly"
      type: Repository
      priority: P1

    - id: TC-JWC-019
      scenario: "GroupRepository.getGroupPreview maps companion API response to GroupPreview DTO with all required fields"
      type: Repository
      priority: P0

    - id: TC-JWC-020
      scenario: "During joining state, confirm_join_button shows loading indicator and is non-interactive"
      type: Screen
      priority: P1
