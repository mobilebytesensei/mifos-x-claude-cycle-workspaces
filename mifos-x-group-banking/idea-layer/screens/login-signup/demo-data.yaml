feature_id: login-signup

entries:
  - dto: LoginRequest
    count_hint: 2
    source_notes: >
      Two realistic login credential sets. Grace Wanjiku is a returning group treasurer
      logging in from a low-bandwidth rural area. Samuel Odhiambo is a field officer
      who manages multiple groups across two branches.
    items:
      - emailPhone: "grace.wanjiku@example.com"
        password: "Savings2026!"

      - emailPhone: "+254712345678"
        password: "Mifos@Secure1"

  - dto: SelfRegisterRequest
    count_hint: 1
    source_notes: >
      New organizer signing up to create the first savings group for the Kisumu West
      community. Phone-number registration path used because email is not common in
      the target demographic.
    items:
      - name: "Amina Otieno"
        emailPhone: "+254798765432"
        password: "Salama2026#"

  - dto: AuthResponse
    count_hint: 2
    source_notes: >
      Successful login response for Grace (existing groups) and Amina (new registration,
      empty group list). groupMemberships drives the routing decision in LoginSignupViewModel.
    items:
      - userId: "usr_01J5KT2N8XQWRP7M3B4C6DE9FA"
        sessionToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.grace"
        tokenExpiresAt: "2026-07-18T08:00:00Z"
        groupMemberships:
          - groupId: "grp_kisumu_west_001"
            groupName: "Mwangaza Women's Group"
            role: TREASURER
            joinedAt: "2026-03-01T10:00:00Z"
          - groupId: "grp_kisumu_east_012"
            groupName: "Jua Kali Savings Circle"
            role: MEMBER
            joinedAt: "2026-05-15T09:30:00Z"

      - userId: "usr_02P8MT3Q9YRVST8N4C5D7EF0GB"
        sessionToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.amina"
        tokenExpiresAt: "2026-07-18T08:05:00Z"
        groupMemberships: []

  - dto: UserProfile
    count_hint: 1
    source_notes: >
      Profile returned by GET /companion/auth/me after biometric re-authentication
      for Grace. Includes her two group memberships and reflects her current treasurer
      role in Mwangaza Women's Group.
    items:
      - userId: "usr_01J5KT2N8XQWRP7M3B4C6DE9FA"
        name: "Grace Wanjiku"
        emailPhone: "grace.wanjiku@example.com"
        groupMemberships:
          - groupId: "grp_kisumu_west_001"
            groupName: "Mwangaza Women's Group"
            role: TREASURER
            joinedAt: "2026-03-01T10:00:00Z"
          - groupId: "grp_kisumu_east_012"
            groupName: "Jua Kali Savings Circle"
            role: MEMBER
            joinedAt: "2026-05-15T09:30:00Z"

  - dto: GroupMembership
    count_hint: 3
    source_notes: >
      Standalone GroupMembership entries covering three roles. Used in repository and
      ViewModel unit tests to exercise the ZeroGroups vs non-ZeroGroups routing branch
      and role-based capability resolution downstream.
    items:
      - groupId: "grp_kisumu_west_001"
        groupName: "Mwangaza Women's Group"
        role: TREASURER
        joinedAt: "2026-03-01T10:00:00Z"

      - groupId: "grp_nairobi_central_007"
        groupName: "Harambee Savings Group"
        role: ORGANIZER
        joinedAt: "2026-01-10T08:00:00Z"

      - groupId: "grp_mombasa_south_022"
        groupName: "Pwani Community Fund"
        role: MEMBER
        joinedAt: "2026-06-20T14:00:00Z"

  - dto: LoginSignupError
    count_hint: 2
    source_notes: >
      Auth error objects surfaced in error_banner via {{error.localizedMessage}}.
      InvalidCredentials is the most common failure for returning users on the login
      path; Network covers the low-bandwidth rural retry case. localizedMessage is the
      resolved i18n string shown inline; retry drives whether the form re-enables.
    items:
      - type: InvalidCredentials
        code: "AUTH_401"
        localizedMessage: "Incorrect email or password. Please try again."
        retry: true

      - type: Network
        code: "NET_OFFLINE"
        localizedMessage: "No internet connection. Please try again."
        retry: true

