    per-endpoint cache strategy, and error paths. Added OnCreateGroupTap and
    OnJoinWithCodeTap navigation-only entries mirroring ui.yaml action_contract
    effect:navigate. OnBiometricUnlock action name aligned with ui.yaml state_model.
