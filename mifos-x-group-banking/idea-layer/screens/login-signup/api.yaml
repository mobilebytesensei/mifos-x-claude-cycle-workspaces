sibling: api
schema_version: "4.0"
feature_id: login-signup

api:
  - id: companion_self_register
    function: companion_self_register
    method: post
    endpoint: "/companion/auth/self-register"
    requires_auth: false
    description: Self-registration bridge that creates a companion user account and a linked Fineract client in one atomic request. No authentication token required.
    body:
      name: String
      emailPhone: String    # accepts email or E.164 phone
      password: String
    response:
      type: object
      fields:
        userId: String
        sessionToken: String
        tokenExpiresAt: String    # ISO-8601
        groupMemberships: "List<GroupMembership>"    # empty for new users
    errors:
      400: Validation error — missing or malformed fields
      409: Account with this email or phone already exists
      500: Server error
    contract_ref: COMP-AUTH-001

  - id: companion_login
    function: companion_login
    method: post
    endpoint: "/companion/auth/login"
    requires_auth: false
    description: Per-user authentication that validates credentials and returns a session token plus full group membership list with role per group.
    body:
      emailPhone: String
      password: String
    response:
      type: object
      fields:
        userId: String
        sessionToken: String
        tokenExpiresAt: String
        groupMemberships: "List<GroupMembership>"
    errors:
      401: Invalid credentials
      429: Too many failed attempts — rate limited
      500: Server error
    contract_ref: COMP-AUTH-002

  - id: companion_me
    function: companion_me
    method: get
    endpoint: "/companion/auth/me"
    requires_auth: true
    requires_permission: []
    description: Fetch the authenticated user profile and all group memberships with role per group. Called after biometric unlock to refresh the session.
    response:
      type: object
      fields:
        userId: String
        name: String
        emailPhone: String
        groupMemberships: "List<GroupMembership>"
    errors:
      401: Session token invalid or expired
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached
    contract_ref: COMP-AUTH-003

cache_strategy:
  default: network-first
  offline: show_cached

dtos:
  SelfRegisterRequest:
    name: String
    emailPhone: String
    password: String

  LoginRequest:
    emailPhone: String
    password: String

  AuthResponse:
    userId: String
    sessionToken: String
    tokenExpiresAt: String
    groupMemberships: "List<GroupMembership>"

  GroupMembership:
    groupId: String
    groupName: String
    role: GroupRole      # ORGANIZER | MEMBER | TREASURER | SECRETARY
    joinedAt: String     # ISO-8601

  UserProfile:
    userId: String
    name: String
    emailPhone: String
    groupMemberships: "List<GroupMembership>"
