requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: login-signup

route: /auth
entry_points:
  - source: app_launch
    trigger: unauthenticated_start
  - source: any_screen
    trigger: session_expired
nav_params: {}

screens:
  - id: login-signup-screen
    title: "{strings.screen_title}"
    type: tab-form
    description: Unified authentication screen with LOGIN and SIGNUP tab toggle. Handles self-registration, credential login, biometric re-auth, and zero-group onboarding state.

state_model:
  LoginSignupViewModel:
    state:
      name: LoginSignupState
      fields:
        mode: { type: AuthMode, default: "AuthMode.Login" }
        name: { type: String, default: '""' }
        emailPhone: { type: String, default: '""' }
        password: { type: String, default: '""' }
        pin: { type: String, default: '""' }
        isSubmitting: { type: Boolean, default: "false" }
        validationErrors: { type: "Map<String, String>", default: "emptyMap()" }
        error: { type: "LoginSignupError?", default: "null" }
        isBiometricAvailable: { type: Boolean, default: "false" }
        sessionToken: { type: "String?", default: "null" }
        groupMemberships: { type: "List<GroupMembership>", default: "emptyList()" }
    screen_state:
      name: LoginSignupScreenState
      members: [Content, Loading, Error, ZeroGroups]
    errors:
      name: LoginSignupError
      types:
        - { type: InvalidCredentials, retry: true, message_key: error_invalid_credentials }
        - { type: AccountExists, retry: false, message_key: error_account_exists }
        - { type: WeakPassword, retry: false, message_key: error_weak_password }
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: BiometricFailed, retry: true, message_key: error_biometric_failed }
    events:
      name: LoginSignupEvent
      members:
        - { name: NavigateToPersonalDashboard }
        - { name: NavigateToGroupList }
        - { name: NavigateToGroupTypePicker }
        - { name: NavigateToJoinWithCode }
        - { name: ShowSnackbar, params: { message: String } }
        - { name: PromptBiometric }
    actions:
      name: LoginSignupAction
      members:
        - { name: OnModeToggle, params: { mode: AuthMode }, trigger: "Tap Login or Signup tab" }
        - { name: OnNameChange, params: { value: String }, trigger: "Type full name in signup form" }
        - { name: OnEmailPhoneChange, params: { value: String }, trigger: "Type email or phone in auth form" }
        - { name: OnPasswordChange, params: { value: String }, trigger: "Type password in auth form" }
        - { name: OnPinChange, params: { value: String }, trigger: "Type PIN digits for offline re-auth" }
        - { name: OnLoginTap, trigger: "Tap Sign In button" }
        - { name: OnSignupTap, trigger: "Tap Create Account button" }
        - { name: OnBiometricUnlock, trigger: "Tap biometric unlock icon" }
        - { name: OnCreateGroupTap, trigger: "Tap Create Group button in zero-group state" }
        - { name: OnJoinWithCodeTap, trigger: "Tap Join with Invite Code button in zero-group state" }
        - { name: OnForgotPassword, trigger: "Tap Forgot Password link" }
    di:
      - AuthRepository
      - BiometricManager
      - SessionStore
      - NetworkMonitor

business_logic:
  kind: processor
  description: >
    Dual-path authentication processor. On SIGNUP mode: validates name, email/phone,
    password strength then calls companion self-registration bridge to create a user
    account and linked Fineract client in one step; returns a session token with an
    empty group list, routing to the zero-groups state. On LOGIN mode: validates
    credentials then calls the login endpoint; on success inspects the group membership
    list — non-empty list routes to personal-dashboard or group-list, empty list routes
    to zero-groups state. Biometric check runs on mount if a stored session token exists
    and hardware is available.
  library_refs:
    - core/biometric
    - core/network
    - core/session

forms:
  login_form:
    mode: login
    fields:
      - { id: login_email_phone_field, type: text-field, label: "{strings.field_identifier}", placeholder: "{strings.placeholder_identifier}", required: true, keyboard: text, max_length: 100, accepts: [email, phone, username], note: "Sign-in identifier accepts email, E.164 phone, OR username (3-30 chars); signup still requires email/phone" }
      - { id: login_password_field, type: text-field, variant: password, label: "{strings.field_password}", placeholder: "{strings.placeholder_password}", required: true, max_length: 64 }

  signup_form:
    mode: signup
    fields:
      - { id: signup_name_field, type: text-field, label: "{strings.field_name}", placeholder: "{strings.placeholder_name}", required: true, max_length: 80 }
      - { id: signup_email_phone_field, type: text-field, label: "{strings.field_email_phone}", placeholder: "{strings.placeholder_email_phone}", required: true, keyboard: email, max_length: 100 }
      - { id: signup_password_field, type: text-field, variant: password, label: "{strings.field_password}", placeholder: "{strings.placeholder_password_signup}", required: true, max_length: 64 }

components:
  - id: auth_header_logo
    type: image
    asset: ic_mifos_logo
    style: { width: 72dp, height: 72dp, alignment: center, top_padding: 32dp }
    accessibility_label: "{strings.logo_a11y}"

  - id: auth_title
    type: text
    value: "{strings.screen_title}"
    style: { text_style: headlineMedium, color: onSurface, alignment: center, top_padding: 16dp }

  - id: mode_toggle_tabs
    type: tab-row
    tabs:
      - { id: tab_login, label: "{strings.tab_login}" }
      - { id: tab_signup, label: "{strings.tab_signup}" }
    selected: "{{mode}}"
    style: { indicator_color: primary, label_color_selected: primary, label_color_unselected: onSurfaceVariant }
    accessibility_label: "{strings.mode_toggle_tabs_a11y}"
    on_click:
      action: OnModeToggle
      target: login-signup
      action_contract:
        effect: transform_state
        description: "Flips LoginSignupState.mode between AuthMode.Login and AuthMode.Signup, resetting name/emailPhone/password fields and clearing validationErrors + error so the newly-shown tab renders clean; pure in-ViewModel state transition with no network or persistence."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: signup_name_field
    type: text-field
    label: "{strings.field_name}"
    placeholder: "{strings.placeholder_name}"
    value: "{{name}}"
    visible: "{{mode == AuthMode.Signup}}"
    keyboard: text
    max_length: 80
    validation: { min_length: 2, required: true, error_key: error_name_required }
    style: { top_padding: 16dp }
    accessibility_label: "{strings.signup_name_field_a11y}"
    on_click:
      action: OnNameChange
      target: login-signup
      action_contract:
        effect: transform_state
        description: "Updates LoginSignupState.name from the signup Full Name field and clears its validationErrors entry; on focus-out runs the min-length-2 required check so an empty or too-short name surfaces error_name_required before Create Account is enabled. No I/O."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: email_phone_field
    type: text-field
    label: "{strings.field_email_phone}"
    placeholder: "{strings.placeholder_email_phone}"
    value: "{{emailPhone}}"
    keyboard: email
    max_length: 100
    validation: { required: true, pattern: "{{mode == AuthMode.Login ? email_phone_or_username : email_or_e164_phone}}", error_key: "{{mode == AuthMode.Login ? error_identifier_invalid : error_email_phone_invalid}}" }
    style: { top_padding: 8dp }
    accessibility_label: "{strings.email_phone_field_a11y}"
    on_click:
      action: OnEmailPhoneChange
      target: login-signup
      action_contract:
        effect: transform_state
        description: "Updates LoginSignupState.emailPhone as the user types their identifier. Shared across the login and signup forms but validation is MODE-DEPENDENT: on LOGIN it accepts an email, an E.164 phone, OR a username (3-30 chars, starts alphanumeric) → error_identifier_invalid; on SIGNUP it still requires email or E.164 phone (account contact) → error_email_phone_invalid. Label/placeholder/keyboard also switch by mode (login shows the username-inclusive label + text keyboard). No network call."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: password_field
    type: text-field
    variant: password
    label: "{strings.field_password}"
    placeholder: "{{mode == AuthMode.Signup ? strings.placeholder_password_signup : strings.placeholder_password}}"
    value: "{{password}}"
    max_length: 64
    validation: { required: true, min_length: 8, error_key: error_password_weak }
    style: { top_padding: 8dp }
    accessibility_label: "{strings.password_field_a11y}"
    on_click:
      action: OnPasswordChange
      target: login-signup
      action_contract:
        effect: transform_state
        description: "Updates LoginSignupState.password from the masked field and clears its validationErrors entry; in signup mode a min-8-character strength check runs on focus-out raising error_password_weak. The value is held only in memory and never logged or cached — no persistence at edit time."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: forgot_password_link
    type: text-button
    label: "{strings.link_forgot_password}"
    visible: "{{mode == AuthMode.Login}}"
    style: { alignment: end, text_color: primary, text_style: labelMedium, top_padding: 4dp }
    accessibility_label: "{strings.forgot_password_link_a11y}"
    on_click:
      action: OnForgotPassword
      target: login-signup
      action_contract:
        effect: emit_event
        description: "Emits a ShowSnackbar event guiding the user to reset their password via the web portal or their group organizer; in the MVP there is no in-app reset endpoint, so this is a pure event with no network call or state mutation beyond surfacing the snackbar message."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: login_button
    type: button
    variant: filled
    label: "{strings.btn_sign_in}"
    visible: "{{mode == AuthMode.Login}}"
    loading: "{{isSubmitting}}"
    style: { background: primary, text_color: onPrimary, min_touch_target: 56dp, full_width: true, top_padding: 24dp }
    accessibility_label: "{strings.login_button_a11y}"
    on_click:
      action: OnLoginTap
      target: personal-dashboard
      action_contract:
        effect: call_api
        library_refs: ["core/network", "core/session"]
        description: "Validates the login form then POSTs companion_login (/companion/auth/login) via core/network; on success persists sessionToken to the encrypted core/session SessionStore and hydrates the group_memberships cache. Routes on groupMemberships: non-empty → personal-dashboard/group-list, empty → ZeroGroups. Auth failures set LoginSignupState.error inline."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: signup_button
    type: button
    variant: filled
    label: "{strings.btn_create_account}"
    visible: "{{mode == AuthMode.Signup}}"
    loading: "{{isSubmitting}}"
    style: { background: primary, text_color: onPrimary, min_touch_target: 56dp, full_width: true, top_padding: 24dp }
    accessibility_label: "{strings.signup_button_a11y}"
    on_click:
      action: OnSignupTap
      target: personal-dashboard
      action_contract:
        effect: call_api
        library_refs: ["core/network", "core/session"]
        description: "Validates name/emailPhone/password then POSTs companion_self_register (/companion/auth/self-register) via core/network, atomically creating a companion user plus a linked Fineract client. On success persists the returned sessionToken to core/session; the empty groupMemberships always routes the new user to the ZeroGroups onboarding state. 409 surfaces error_account_exists."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: biometric_unlock_button
    type: icon-button
    icon: fingerprint
    label: "{strings.btn_biometric}"
    visible: "{{isBiometricAvailable && mode == AuthMode.Login}}"
    style: { icon_size: 48dp, icon_tint: primary, alignment: center, top_padding: 12dp }
    accessibility_label: "{strings.biometric_unlock_button_a11y}"
    on_click:
      action: OnBiometricUnlock
      target: personal-dashboard
      action_contract:
        effect: call_api
        library_refs: ["core/biometric", "core/network", "core/session"]
        description: "Invokes the platform biometric prompt via core/biometric to unlock the returning user against the stored core/session token; on hardware success calls companion_me (/companion/auth/me) via core/network to refresh the profile and group memberships, then routes on membership count (non-empty → personal-dashboard, empty → ZeroGroups). Offline biometric surfaces error_offline_biometric."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: error_banner
    type: banner
    visible: "{{error != null}}"
    icon: error_outline
    message: "{{error.localizedMessage}}"
    style: { background: errorContainer, text_color: onErrorContainer, corner_radius: 8dp, padding: 12dp, top_padding: 16dp }

  - id: divider_or
    type: divider-labeled
    label: "{strings.divider_or}"
    visible: "{{isBiometricAvailable && mode == AuthMode.Login}}"
    style: { top_padding: 16dp, text_color: onSurfaceVariant }

  # --- Zero-groups state components ---
  - id: zero_groups_illustration
    type: image
    asset: ic_empty_groups
    style: { width: 120dp, height: 120dp, alignment: center, top_padding: 48dp }
    accessibility_label: "{strings.zero_groups_illustration_a11y}"

  - id: zero_groups_title
    type: text
    value: "{strings.zero_groups_title}"
    style: { text_style: headlineSmall, color: onSurface, alignment: center, top_padding: 16dp }

  - id: zero_groups_body
    type: text
    value: "{strings.zero_groups_body}"
    style: { text_style: bodyMedium, color: onSurfaceVariant, alignment: center, top_padding: 8dp, horizontal_padding: 24dp }

  - id: create_group_button
    type: button
    variant: filled
    label: "{strings.btn_create_group}"
    style: { background: primary, text_color: onPrimary, min_touch_target: 56dp, full_width: true, top_padding: 32dp }
    accessibility_label: "{strings.create_group_button_a11y}"
    on_click:
      action: OnCreateGroupTap
      target: group-type-picker
      action_contract:
        effect: navigate
        description: "Navigates via NavController to the group-type-picker destination so the newly-registered user in the ZeroGroups state can choose a config-driven group_type (e.g. VSLA, table-banking, chama) for their first savings group; pure navigation carrying the session identity, no write at tap time."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

  - id: join_with_code_button
    type: button
    variant: outlined
    label: "{strings.btn_join_with_code}"
    style: { border_color: primary, text_color: primary, min_touch_target: 56dp, full_width: true, top_padding: 12dp }
    accessibility_label: "{strings.join_with_code_button_a11y}"
    on_click:
      action: OnJoinWithCodeTap
      target: join-with-code
      action_contract:
        effect: navigate
        description: "Navigates via NavController to the join-with-code destination so the user in the ZeroGroups state can enter an organizer-issued invite code and be added to an existing savings group with a per-group role; pure navigation, the membership write happens on that screen's submit, not here."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-18T00:00:00Z"

states:
  initial_state: content
  content:
    description: "Login or signup form visible depending on mode toggle"
    components:
      login_mode: [auth_header_logo, auth_title, mode_toggle_tabs, email_phone_field, password_field, forgot_password_link, login_button, divider_or, biometric_unlock_button, error_banner]
      signup_mode: [auth_header_logo, auth_title, mode_toggle_tabs, signup_name_field, email_phone_field, password_field, signup_button, error_banner]
    demo_data:
      mode: AuthMode.Login
      emailPhone: "grace.wanjiku@example.com"
      password: ""
      isBiometricAvailable: true
      error: null

  loading:
    description: "Active login or signup API call in-flight; buttons in loading state, form fields disabled"
    components: [auth_header_logo, auth_title, mode_toggle_tabs, email_phone_field, password_field, login_button, signup_button]

  error:
    description: "API returned an error; error_banner visible with localised message, form re-enabled for retry"
    components:
      login_mode: [auth_header_logo, auth_title, mode_toggle_tabs, email_phone_field, password_field, forgot_password_link, login_button, divider_or, biometric_unlock_button, error_banner]
      signup_mode: [auth_header_logo, auth_title, mode_toggle_tabs, signup_name_field, email_phone_field, password_field, signup_button, error_banner]
    demo_data:
      error: { type: InvalidCredentials, message: "Incorrect email or password. Please try again." }

  zero_groups:
    description: "Login or signup succeeded but the user has no group memberships yet. Shows zero-state illustration with action buttons."
    components: [auth_title, zero_groups_illustration, zero_groups_title, zero_groups_body, create_group_button, join_with_code_button]
    demo_data:
      sessionToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.demo"
      groupMemberships: []

