    field_email_phone: "Email or Phone"
    field_identifier: "Email, Phone or Username"
    field_password: "Password"
    placeholder_name: "e.g. Grace Wanjiku"
    placeholder_email_phone: "email@example.com or +254700000000"
    placeholder_identifier: "username, email or +254700000000"
    placeholder_password: "Your password"
    placeholder_password_signup: "Minimum 8 characters"
    link_forgot_password: "Forgot password?"
    btn_sign_in: "Sign In"
    btn_create_account: "Create Account"
    btn_biometric: "Sign in with biometrics"
    divider_or: "or"
    divider_alt_actions: "New here?"
    btn_accept_invitation: "Accept an Invitation"
    btn_demo_explore: "Demo Explore"
    accept_invitation_button_a11y: "Accept a group invitation using an invite code"
    demo_explore_button_a11y: "Explore the app as a demo user without an account"
    demo_dialog_title: "Explore as a demo user"
