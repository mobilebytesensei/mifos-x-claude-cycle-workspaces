<!DOCTYPE html>
<html lang="en" data-feature="login-signup" data-state="zero_groups" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>login-signup · zero_groups · MifosSave</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <!-- render-hash: login-signup:zero_groups:ui-v4.0:2026-07-31 -->
</head>
<body>
<div class="app-shell app-shell-auth" data-shell="auth">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- Post-auth empty state: sessionToken persisted, groupMemberships=[] → onboarding CTAs. -->
  <section class="auth-card" data-component-type="zero_groups_welcome" data-component-id="c-zero-groups-card">

    <h1 class="brand-lockup" style="padding:0 0 var(--space-base);font-size:22px;color:var(--primary-700);text-align:center;" data-component-type="text" data-component-id="auth_title">Welcome to MifosX</h1>

    <div class="empty-state">
      <div class="illus" data-component-type="image" data-component-id="zero_groups_illustration" role="img" aria-label="Empty groups illustration">👥</div>
      <h2 data-component-type="text" data-component-id="zero_groups_title">You're all set!</h2>
      <p data-component-type="text" data-component-id="zero_groups_body">You don't belong to any savings group yet. Create your first group or join one with an invite code.</p>
    </div>

    <div class="btn-stack">
      <button class="btn btn-primary btn-full" data-component-type="primary_button" data-component-id="create_group_button" data-nav-to="group-type-picker" data-action-id="OnCreateGroupTap">Create Your First Group</button>
      <button class="btn btn-secondary btn-full" data-component-type="secondary_button" data-component-id="join_with_code_button" data-nav-to="join-with-code" data-action-id="OnJoinWithCodeTap">Join with Invite Code</button>
    </div>
  </section>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
