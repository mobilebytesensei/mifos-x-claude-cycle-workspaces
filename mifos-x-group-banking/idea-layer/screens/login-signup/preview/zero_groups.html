<!DOCTYPE html>
<html lang="en" data-feature="login-signup" data-state="zero_groups" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>login-signup · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="auth">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<main>
  <div class="auth-header" data-component-type="logo_lockup" data-component-id="c-logo">
    <div class="app-logo">CP</div>
    <h1 class="app-name">CommonPurse</h1>
    <p class="app-tagline">Community savings, simplified</p>
  </div>
  <div class="card" data-component-type="zero_groups_welcome" data-component-id="c-zero-groups-card">
    <div class="empty-state" data-component-id="c-welcome-message">
      <p class="empty-state-icon">🎉</p>
      <h2 class="empty-state-title">Welcome, Grace!</h2>
      <p class="empty-state-body">You're all set! Create your first group or join an existing one.</p>
    </div>
    <button class="btn btn-full" data-component-type="create_group_button" data-component-id="c-create-group-btn" data-nav-to="group-type-picker">＋ Create a Group</button>
    <button class="btn btn-secondary btn-full" data-component-type="join_group_button" data-component-id="c-join-group-btn" data-nav-to="join-with-code"># Join with Code</button>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
