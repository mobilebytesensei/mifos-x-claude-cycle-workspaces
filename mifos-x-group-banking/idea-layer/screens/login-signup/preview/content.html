<!DOCTYPE html>
<html lang="en" data-feature="login-signup" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>login-signup · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="auth">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<main>
  <div class="auth-header" data-component-type="logo_lockup" data-component-id="c-logo">
    <div class="app-logo">CP</div>
    <h1 class="app-name">CommonPurse</h1>
    <p class="app-tagline">Community savings, simplified</p>
  </div>
  <div class="card" data-component-type="login_form" data-component-id="c-login-form">
    <div class="tab-row" data-component-type="tab_row" data-component-id="c-auth-tabs">
      <button class="tab active" data-action="switch-tab" aria-label="Login tab">Login</button>
      <button class="tab" data-action="switch-tab" aria-label="Sign Up tab">Sign Up</button>
    </div>
    <div class="input-group" data-component-type="text_field" data-component-id="c-email-field">
      <label>Email or Phone</label>
      <input type="email" placeholder="grace.wanjiku@example.com" value="grace.wanjiku@example.com">
    </div>
    <div class="input-group" data-component-type="text_field" data-component-id="c-password-field">
      <label>Password</label>
      <input type="password" placeholder="Enter your password">
    </div>
    <button class="btn btn-full" data-component-type="primary_button" data-component-id="c-login-btn" data-nav-to="personal-dashboard">Log In</button>
    <button class="btn btn-secondary btn-full" data-component-type="secondary_button" data-component-id="c-signup-btn" data-nav-to="personal-dashboard">Create Account</button>
    <button class="btn btn-secondary btn-full" data-component-type="biometric_unlock_button" data-component-id="c-biometric-btn" data-action="biometric_unlock" data-nav-to="personal-dashboard">🔒 Use Biometrics</button>
  </div>
  <div class="divider-label" data-component-id="c-divider">— or —</div>
  <div class="card" data-component-type="group_actions" data-component-id="c-group-actions">
    <p class="card-section-label">Group banking</p>
    <button class="btn btn-secondary btn-full" data-component-type="create_group_button" data-component-id="c-create-group-btn" data-nav-to="group-type-picker">＋ Create a Group</button>
    <button class="btn btn-secondary btn-full" data-component-type="join_group_button" data-component-id="c-join-group-btn" data-nav-to="join-with-code"># Join with Code</button>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
