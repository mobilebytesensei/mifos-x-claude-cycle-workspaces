<!DOCTYPE html>
<html lang="en" data-feature="login-signup" data-state="content" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>login-signup · content · MifosSave</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <!-- render-hash: login-signup:content:ui-v4.0:2026-07-31 -->
</head>
<body>
<div class="app-shell app-shell-auth" data-shell="auth">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- Brand lockup: MifosX product mark + tagline (login-signup logo + title) -->
  <header class="brand-lockup" data-component-type="logo_lockup" data-component-id="auth_header_logo">
    <div class="mark" role="img" aria-label="Mifos X logo">MX</div>
    <h1 data-component-id="auth_title">Welcome to MifosX</h1>
    <p>Save together. Lend together. Grow together.</p>
  </header>

  <!-- Auth card: LOGIN mode (initial state per ui.yaml states.content.demo_data.mode=AuthMode.Login) -->
  <section class="auth-card" data-component-type="login_form" data-component-id="c-login-form">

    <div class="mode-toggle" role="tablist" data-component-type="tab_row" data-component-id="mode_toggle_tabs">
      <button class="active" role="tab" aria-selected="true" data-action="OnModeToggle" data-action-params='{"mode":"Login"}' data-state-to="login-signup:content">Sign In</button>
      <button role="tab" aria-selected="false" data-action="OnModeToggle" data-action-params='{"mode":"Signup"}' data-state-to="login-signup:content">Sign Up</button>
    </div>

    <!-- LOGIN mode: unified identifier accepts email, E.164 phone, OR username -->
    <div class="form-field" data-component-type="text_field" data-component-id="email_phone_field">
      <label for="f-email">Email, Phone or Username</label>
      <input id="f-email" type="text" inputmode="text" placeholder="username, email or +254700000000" value="grace.wanjiku@example.com" data-action="OnEmailPhoneChange">
    </div>

    <div class="form-field" data-component-type="text_field" data-component-id="password_field">
      <label for="f-pass">Password</label>
      <input id="f-pass" type="password" placeholder="Your password" value="" data-action="OnPasswordChange">
    </div>

    <a class="link link-right" data-component-type="text_button" data-component-id="forgot_password_link" data-action="OnForgotPassword" href="#">Forgot password?</a>

    <div class="btn-stack">
      <button class="btn btn-primary btn-full" data-component-type="primary_button" data-component-id="login_button" data-nav-to="personal-dashboard" data-action-id="OnLoginTap">Sign In</button>

      <div class="divider-or" data-component-type="divider_labeled" data-component-id="divider_or">or</div>

      <button class="btn btn-secondary btn-full" data-component-type="secondary_button" data-component-id="biometric_unlock_button" data-nav-to="personal-dashboard" data-action-id="OnBiometricUnlock">🔒 Sign in with biometrics</button>
    </div>
  </section>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
