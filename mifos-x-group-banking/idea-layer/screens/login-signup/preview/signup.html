<!DOCTYPE html>
<html lang="en" data-feature="login-signup" data-state="content" data-mode="signup" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>login-signup · signup · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell app-shell-auth" data-shell="auth">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <header class="brand-lockup" data-component-type="logo_lockup" data-component-id="auth_header_logo">
    <div class="mark">CP</div>
    <h1 data-component-id="auth_title">Welcome to MifosX</h1>
    <p>Save together. Lend together. Grow together.</p>
  </header>

  <!-- Auth card: SIGNUP form only -->
  <section class="auth-card" data-component-type="signup_form" data-component-id="c-signup-form">

    <div class="mode-toggle" role="tablist" data-component-type="tab_row" data-component-id="mode_toggle_tabs">
      <button role="tab" aria-selected="false" data-action="OnModeToggle" data-action-params='{"mode":"Login"}'>Sign In</button>
      <button class="active" role="tab" aria-selected="true" data-action="OnModeToggle" data-action-params='{"mode":"Signup"}'>Sign Up</button>
    </div>

    <div class="form-field" data-component-type="text_field" data-component-id="signup_name_field">
      <label for="f-name">Full Name</label>
      <input id="f-name" type="text" placeholder="e.g. Grace Wanjiku" value="Amina Otieno">
    </div>

    <div class="form-field" data-component-type="text_field" data-component-id="email_phone_field">
      <label for="f-email">Email or Phone</label>
      <input id="f-email" type="email" inputmode="email" placeholder="email@example.com or +254700000000" value="+254798765432">
    </div>

    <div class="form-field" data-component-type="text_field" data-component-id="password_field">
      <label for="f-pass">Password</label>
      <input id="f-pass" type="password" placeholder="Minimum 8 characters" value="">
    </div>

    <div class="btn-stack">
      <button class="btn btn-primary btn-full" data-component-type="primary_button" data-component-id="signup_button" data-nav-to="personal-dashboard" data-action-id="OnSignupTap">Create Account</button>
    </div>
  </section>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
