# ─────────────────────────────────────────────────────────────────────────────
# E2E — demo-explore : auth screen → Demo Explore → confirm dialog → offline
#        organizer-dashboard (FR-027, no backend required)
# ─────────────────────────────────────────────────────────────────────────────
# Reachability: cold launch lands on login-signup (start destination). The
#   "Demo Explore" text button on the auth content state opens a confirm dialog
#   ("This is a demo user logging in to explore the application."); Continue seeds
#   the offline PROJECT_DEMO_DATA fixture into the local cache via DemoSessionManager
#   (100% offline — NO network, NO backend seed) then lands on organizer-dashboard.
# This flow is the device-truth proof for the demo-explore capability and must pass
#   with airplane-mode / no companion server (offline-by-design).
# TestTags: LoginSignupTestTags.kt (DEMO_EXPLORE_BUTTON / DEMO_CONFIRM_DIALOG /
#   DEMO_CONFIRM_BUTTON) + OrganizerDashboardTestTags.SCREEN.
appId: org.mifos.groupbanking
name: e2e — demo-explore (auth → demo dialog → offline organizer-dashboard)
tags:
  - e2e
  - group-banking
  - login-signup
  - demo-explore
  - offline
---
# --- fresh launch: cold start lands on the auth screen ---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"

# --- the Demo Explore affordance is present on the auth content state ---
- assertVisible:
    id: "login_signup_demo_explore_button"
- tapOn:
    id: "login_signup_demo_explore_button"

# --- confirm dialog with the demo copy appears ---
# NOTE: Compose AlertDialog renders in a SEPARATE window, so its Modifier.testTag
# is not surfaced as a UiAutomator resource-id (testTagsAsResourceId at the root
# Box does not cross the dialog window). Select the dialog by its visible text,
# which Maestro reads via accessibility.
- assertVisible: "Explore as a demo user"
- assertVisible: "This is a demo user logging in to explore the application."
- tapOn: "Continue"

# --- offline seed completes → lands on the organizer dashboard (no network) ---
- assertVisible:
    id: "organizer_dashboard_screen"
