# ─────────────────────────────────────────────────────────────────────────────
# E2E — professional green+amber auth redesign renders + behaves on-device
# ─────────────────────────────────────────────────────────────────────────────
# Rendered proof (RULE IA3-9) for the auth enrich: brand mark + serif wordmark
# (two color-split nodes Common|Purse), serif "Welcome back" headline, tagline,
# pill segmented tabs, password-requirement chips (advisory; light up as Fineract
# policy rules are met), restyled Demo Explore dialog, trust footer. Then real login.
#
# clearState resets any persisted session so the login UI is always shown (an
# already-logged-in user would otherwise auto-navigate to the dashboard). Works on
# the emulator E2E lane; on an OEM device that blocks `pm clear` (OPPO), replace
# with bare `launchApp` after logging out first.
appId: org.mifos.groupbanking
name: e2e — auth redesign (brand, tabs, password chips, demo dialog)
tags:
  - e2e
  - group-banking
  - login-signup
  - auth-redesign
---
- launchApp:
    clearState: true
- assertVisible: { id: "login_signup_screen" }
# absorb the biometric-prompt → login-screen transition before asserting the brand block
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 12000

# --- brand header: mark + serif wordmark (Common|Purse) + tagline + headline/subtitle ---
- assertVisible: "Common"
- assertVisible: "Purse"
- assertVisible:
    text: ".*Save together.*"
- assertVisible: "Welcome back"
- assertVisible: "Sign in to your savings group"

# --- pill segmented tabs; switch to Sign up ---
- assertVisible: { id: "login_signup_tab_login" }
- assertVisible: { id: "login_signup_tab_signup" }
- tapOn: { id: "login_signup_tab_signup" }
- assertVisible: { id: "login_signup_field_name" }

# --- password-requirement chips render + are advisory (weak pw → all 5 chips shown) ---
- tapOn: { id: "login_signup_field_password" }
- inputText: "abc"
- hideKeyboard
- scrollUntilVisible:
    element: { id: "login_signup_password_rule_len" }
    direction: DOWN
    timeout: 8000
- assertVisible: { id: "login_signup_password_rule_len" }
- assertVisible: { id: "login_signup_password_rule_case" }
- assertVisible: { id: "login_signup_password_rule_digit" }
- assertVisible: { id: "login_signup_password_rule_symbol" }
- assertVisible: { id: "login_signup_password_rule_norepeat" }
# strengthen to a Fineract-valid password — chips remain (now in satisfied state)
- tapOn: { id: "login_signup_field_password" }
- inputText: "Mifos2026Grow#"
- hideKeyboard
- assertVisible: { id: "login_signup_password_rule_symbol" }

# --- trust footer renders (scroll to it) ---
- scrollUntilVisible:
    element:
      text: ".*Secured on Fineract.*"
    direction: DOWN
    timeout: 8000

# --- restyled Demo Explore dialog (back to Sign in, open dialog) ---
# AlertDialog renders in a SEPARATE window — container testTag not surfaced to
# uiautomator, so assert the dialog by its TEXT (documented device lesson).
- tapOn: { id: "login_signup_tab_login" }
- tapOn: { id: "login_signup_demo_explore_button" }
- assertVisible: "Explore as a demo user"
- assertVisible: "This is a demo user logging in to explore the application."
- tapOn: "Not now"

# --- real login still works end-to-end against the live server ---
- tapOn: { id: "login_signup_field_email_phone" }
- inputText: "mifos"
- tapOn: { id: "login_signup_field_password" }
- inputText: "password"
- hideKeyboard
- tapOn: { id: "login_signup_login_button" }
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 20000
