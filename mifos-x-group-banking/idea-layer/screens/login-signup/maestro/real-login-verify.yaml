# ─────────────────────────────────────────────────────────────────────────────
# E2E — REAL login against LIVE Fineract (mifos-bank-2, via the mcp-mifosx Go
#        companion server on host :8090, adb-reverse from device :8080)
# ─────────────────────────────────────────────────────────────────────────────
# NOT the offline demo — this drives the real login form. The app POSTs
#   localhost:8080/companion/auth/login → adb reverse → host Go companion
#   (/companion/auth/login) → Fineract POST /authentication on mifos-bank-2.
#   mifos/password authenticates as real Fineract userId 56 (no group memberships)
#   → the app's empty-memberships branch → ZeroGroups state. This proves the whole
#   app→companion→live-Fineract auth round-trip on device.
# Prereq: Go companion running (PORT=8090 go run .) + adb reverse tcp:8080 tcp:8090.
appId: org.mifos.groupbanking
name: e2e — real login (app → Go companion → live mifos-bank-2)
tags:
  - e2e
  - group-banking
  - login-signup
  - real-network
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"

# --- enter real mifos-bank-2 credentials into the login form ---
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: "mifos"
- tapOn:
    id: "login_signup_field_password"
- inputText: "password"
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- real auth succeeds against mifos-bank-2 → userId 56, no groups → ZeroGroups.
# Reaching ZeroGroups proves login POSTed to the companion, got a real 200 from
# Fineract, and navigated past the login form (a 401 would keep us on the form
# with an error banner). ---
- extendedWaitUntil:
    visible:
      id: "login_signup_create_group_button"
    timeout: 15000
