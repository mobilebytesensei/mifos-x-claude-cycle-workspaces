# ─────────────────────────────────────────────────────────────────────────────
# E2E — REAL login → REAL organizer dashboard with LIVE mifos-bank-2 data
# ─────────────────────────────────────────────────────────────────────────────
# The full network stack on device: login form (mifos/password) → companion
#   /companion/auth/login → Fineract mifos-bank-2 → real userId 56 + the real
#   "Mwangaza Women's Group" (ORGANIZER) membership → app routes to
#   organizer-dashboard → GET /companion/organizer/dashboard aggregates the LIVE
#   group (myGroupCount 1, totalMembers 3, Grace's loan) → the dashboard renders
#   the REAL group name + member data pulled from mifos-bank-2.
# Prereq: Go companion on host :8090 (PORT=8090) + adb reverse tcp:8080 tcp:8090.
appId: org.mifos.groupbanking
name: e2e — real login → real organizer dashboard (live mifos-bank-2)
tags:
  - e2e
  - group-banking
  - login-signup
  - organizer-dashboard
  - real-network
---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"

# --- real mifos-bank-2 credentials ---
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: "mifos"
- tapOn:
    id: "login_signup_field_password"
- inputText: "password"
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- real auth + real group membership → organizer-dashboard renders live data ---
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000
# the REAL group pulled from mifos-bank-2 appears on the dashboard
- assertVisible: "Mwangaza Women's Group"
