sibling: flow
schema_version: "4.0"
feature_id: login-signup

navigates_to:
  - personal-dashboard
  - group-list
  - group-create
  - group-type-picker
  - join-with-code
  - organizer-dashboard   # demo-explore landing (F1/B1) — seeded demo user is the group organizer

flow_logic:
  on_load:
    - action: check_biometric_availability
      check: BiometricManager.isAvailable()
      on_available:
        - action: set_state
          field: isBiometricAvailable
          value: true
        - action: check_stored_session
          check: SessionStore.hasValidToken()
          on_valid:
            - action: prompt_biometric
              emit: PromptBiometric
          on_invalid:
            - action: noop
              comment: "Show standard login form"

  on_login:
    - action: validate_login_form
      fields: [emailPhone, password]
      on_invalid: show_validation_errors
      on_valid:
        - action: set_state
          field: isSubmitting
          value: true
        - api: companion_login
          on_success:
            - action: store_session
              store: SessionStore.saveToken(response.sessionToken, response.tokenExpiresAt)
            - action: resume_pending_invite
              comment: "F3/F4 — invite resume handoff (satisfies TC-LS-010)"
              check: "navParams.pendingInviteCode != null && navParams.pendingInviteCode.length == 6"
              on_match:
                - emit: NavigateToJoinWithCode
                  params:
                    inviteCode: "{{navParams.pendingInviteCode}}"
              on_no_match:
                - action: inspect_group_memberships
                  check: "response.groupMemberships.isNotEmpty()"
                  non_empty:
                    - emit: NavigateToPersonalDashboard
                  empty:
                    - action: set_screen_state
                      state: ZeroGroups
          on_error:
            - action: set_error
              field: error
              value: LoginSignupError.from(httpError)
            - action: set_state
              field: isSubmitting
              value: false

  on_signup:
    - action: validate_signup_form
      fields: [name, emailPhone, password]
      on_invalid: show_validation_errors
      on_valid:
        - action: set_state
          field: isSubmitting
          value: true
        - api: companion_self_register
          on_success:
            - action: store_session
              store: SessionStore.saveToken(response.sessionToken, response.tokenExpiresAt)
            - action: resume_pending_invite
              comment: "F3/F4 — a self-registering invitee resumes the join instead of landing in ZeroGroups (satisfies TC-LS-010)"
              check: "navParams.pendingInviteCode != null && navParams.pendingInviteCode.length == 6"
              on_match:
                - emit: NavigateToJoinWithCode
                  params:
                    inviteCode: "{{navParams.pendingInviteCode}}"
              on_no_match:
                - action: set_screen_state
                  state: ZeroGroups
                  comment: "New registrations with no pending invite always have empty group list"
          on_error:
            - action: set_error
              field: error
              value: LoginSignupError.from(httpError)
            - action: set_state
              field: isSubmitting
              value: false

  on_biometric_unlock:
    - action: invoke_biometric_prompt
      on_success:
        - api: companion_me
          on_success:
            - action: store_session
              store: SessionStore.refreshFromProfile(response)
            - action: inspect_group_memberships
              check: "response.groupMemberships.isNotEmpty()"
              non_empty:
                - emit: NavigateToPersonalDashboard
              empty:
                - action: set_screen_state
                  state: ZeroGroups
          on_error:
            - action: set_error
              field: error
              value: LoginSignupError.BiometricFailed
      on_failure:
        - action: set_error
          field: error
          value: LoginSignupError.BiometricFailed

  on_create_group_tap:
    - emit: NavigateToGroupTypePicker

  on_join_with_code_tap:
    - emit: NavigateToJoinWithCode

  on_accept_invitation_tap:
    # F2/B4/G2 — first-class PRE-AUTH accept-invitation entry on the content state (both modes).
    # Navigates to join-with-code with NO pre-filled code; the invitee types the code there and
    # join-with-code routes back with pendingInviteCode, which on_login/on_signup resumes.
    - emit: NavigateToJoinWithCode
      params:
        inviteCode: null

  on_demo_explore:
    # F1/B1/G1 — open the Demo Explore confirm dialog (pure state; no seeding yet).
    - action: set_state
      field: showDemoDialog
      value: true

  on_demo_cancel:
    - action: set_state
      field: showDemoDialog
      value: false

  on_demo_confirm:
    # F1/B1/G1 — enter the offline guest demo session, 100% offline (no companion API / Fineract).
    - action: set_state
      field: showDemoDialog
      value: false
    - action: set_state
      field: isSeedingDemo
      value: true
    - action: seed_demo_session
      description: >
        DemoSessionManager hydrates the bundled PROJECT_DEMO_DATA fixture (Mwangaza Women's Group
        VSLA: members, savings, meetings, corpus, active loan, live invite code DEMO24) into the
        local SQLDelight cache under a synthetic demo session token, and resolves the demo user
        (Amina, treasurer/organizer of demo-group-001). No network call.
      manager: DemoSessionManager.startDemoSession()
      on_success:
        - action: set_state
          field: isSeedingDemo
          value: false
        - emit: NavigateToOrganizerDashboard   # land on the organizer dashboard for the seeded demo group

  on_forgot_password:
    - emit: ShowSnackbar
      message_key: forgot_password_snackbar

  validation_rules:
    name: { min_length: 2, max_length: 80, required: true, mode: signup }
    emailPhone: { required: true, pattern: email_or_e164_phone }
    password: { required: true, min_length: 8, max_length: 64 }

dependencies:
  repositories:
    - name: AuthRepository
      methods:
        - "login(request: LoginRequest): Result<AuthResponse>"
        - "selfRegister(request: SelfRegisterRequest): Result<AuthResponse>"
        - "fetchMe(): Result<UserProfile>"
  services:
    - name: BiometricManager
      methods:
        - "isAvailable(): Boolean"
        - "authenticate(): Flow<BiometricResult>"
    - name: SessionStore
      methods:
        - "hasValidToken(): Boolean"
        - "saveToken(token: String, expiresAt: String): Unit"
        - "refreshFromProfile(profile: UserProfile): Unit"
    - name: DemoSessionManager
      methods:
        # Hydrates the bundled PROJECT_DEMO_DATA fixture into the local SQLDelight cache under a
        # synthetic demo session token and resolves the demo user as the organizer of demo-group-001.
        # Fully offline — no companion API / Fineract calls; writes inside demo mode are local no-ops.
        - "startDemoSession(): Result<DemoSession>"
        - "isDemoSession(): Boolean"
        - "clearDemoSession(): Unit"
    - NetworkMonitor
