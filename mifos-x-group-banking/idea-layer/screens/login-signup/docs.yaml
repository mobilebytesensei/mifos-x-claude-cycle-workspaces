id: login-signup
name: Login & Signup
description: >
  Unified authentication entry screen that handles both new user self-registration and returning user login from a
  single tab-toggle interface. On signup, invokes the companion self-registration bridge (COMP-AUTH-001) to create a
  user account and a linked Fineract client in one atomic step, then routes to the zero-groups onboarding state. On
  login, authenticates via COMP-AUTH-002 and inspects the returned group membership list — users with existing groups
  navigate to personal-dashboard; users with no groups navigate to the zero-groups state offering group creation or
  invite-code join. Biometric re-authentication uses a stored session token confirmed via COMP-AUTH-003. Covers FR-013
  (user authentication), FR-014 (self-registration), and FR-021 (biometric offline re-auth).
