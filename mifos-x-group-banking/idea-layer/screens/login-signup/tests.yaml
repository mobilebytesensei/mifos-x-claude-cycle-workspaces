sibling: tests
schema_version: "4.0"
feature_id: login-signup
generated_at: "2026-07-31T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LS-001
      scenario: "Default tab is LOGIN; switching to SIGNUP tab updates selectedTab"
      type: Screen
      priority: P0
      given: "LoginSignupScreen opens; selectedTab=LOGIN"
      when: "user taps SIGNUP tab"
      then: "selectedTab=SIGNUP; signup form fields visible; login form hidden"

    - id: TC-LS-002
      scenario: "OnLogin with valid credentials calls AuthRepository.login and emits NavigateToPersonalDashboard"
      type: ViewModel
      priority: P0
      given: "username='user@test.com'; password='secret123'; network online"
      when: "OnLogin fires"
      then: "isLoggingIn=true; AuthRepository.login called; on success session stored; NavigateToPersonalDashboard emitted"

    - id: TC-LS-003
      scenario: "Invalid credentials show loginError inline"
      type: ViewModel
      priority: P0
      given: "wrong password"
      when: "OnLogin fires and returns 401"
      then: "isLoggingIn=false; loginError=error_invalid_credentials; form stays on LOGIN tab"

    - id: TC-LS-004
      scenario: "OnSignup creates account and navigates to group list or group type picker for new users"
      type: ViewModel
      priority: P0
      given: "all signup fields valid; network online"
      when: "OnSignup fires"
      then: "isSigningUp=true; AuthRepository.register called; on 201 session stored; user has no groups → NavigateToGroupTypePicker emitted"

    - id: TC-LS-005
      scenario: "Existing user with groups navigates to GroupList after login"
      type: ViewModel
      priority: P1
      given: "login success; user.groupCount > 0"
      when: "OnLogin completes"
      then: "NavigateToGroupList emitted; PersonalDashboard not yet shown (user goes to group list first)"

    - id: TC-LS-006
      scenario: "New user with ZeroGroups state shows onboarding prompt after login"
      type: Screen
      priority: P1
      given: "login success; user.groupCount=0"
      when: "LoginSignupScreenState=ZeroGroups renders"
      then: "welcome message with Create Group and Join Group CTAs shown"

    - id: TC-LS-007
      scenario: "Biometric login triggers system prompt and on success navigates to PersonalDashboard"
      type: ViewModel
      priority: P1
      given: "biometric enrolled; BiometricAuthManager available"
      when: "OnBiometricLogin fires"
      then: "system biometric prompt shown; on success session refreshed; NavigateToPersonalDashboard emitted"

    - id: TC-LS-008
      scenario: "Network error during login shows error snackbar with retry"
      type: Screen
      priority: P1
      given: "network offline when OnLogin fires"
      when: "login call fails"
      then: "LoginSignupError type=Network; ShowSnackbar emitted; isLoggingIn=false"

    - id: TC-LS-009
      scenario: "Password field toggles visibility via eye icon"
      type: Screen
      priority: P2
      given: "password field shown; isPasswordVisible=false"
      when: "user taps visibility toggle"
      then: "isPasswordVisible=true; characters revealed in password field"

    - id: TC-LS-010
      scenario: "Deep-link with pendingInviteCode resumes join-with-code flow after successful login"
      type: ViewModel
      priority: P1
      given: "login success; pendingInviteCode='ABC123' present in nav_params"
      when: "OnLogin completes"
      then: "NavigateToJoinWithCode emitted with inviteCode='ABC123' pre-filled"

    - id: TC-LS-011
      scenario: "Login accepts a bare username via the unified identifier field"
      type: ViewModel
      priority: P0
      given: "mode=LOGIN; emailPhone='grace_w' (username, no @ or +); password='secret123'"
      when: "OnEmailPhoneChange then OnLoginTap fires"
      then: "identifier passes the LOGIN pattern (email OR E.164 phone OR username 3-30 chars); AuthRepository.login called with identifier='grace_w'; no error_identifier_invalid raised"

    - id: TC-LS-012
      scenario: "Identifier validation is mode-dependent — SIGNUP rejects a username"
      type: Screen
      priority: P1
      given: "mode=SIGNUP; emailPhone='grace_w' (username without email/phone)"
      when: "focus leaves the identifier field"
      then: "error_email_phone_invalid surfaced (signup still requires email or E.164 phone); Create Account disabled. In LOGIN mode the same value clears the error and the field label/placeholder switch to field_identifier/placeholder_identifier"
