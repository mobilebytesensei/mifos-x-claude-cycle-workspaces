sibling: tests
schema_version: "4.0"
feature_id: login-signup

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LS-001
      scenario: "On mount with biometric available and valid stored token, ViewModel sets isBiometricAvailable=true and emits PromptBiometric event"
      type: ViewModel
      priority: P0

    - id: TC-LS-002
      scenario: "On mount with no stored token, ViewModel shows login form in Content state without prompting biometric"
      type: ViewModel
      priority: P0

    - id: TC-LS-003
      scenario: "Mode toggle from LOGIN to SIGNUP shows signup_name_field and hides forgot_password_link and biometric_unlock_button"
      type: Screen
      priority: P0

    - id: TC-LS-004
      scenario: "Mode toggle clears existing validation errors from the previous mode"
      type: ViewModel
      priority: P1

    - id: TC-LS-005
      scenario: "OnLoginTap with blank emailPhone field sets validationErrors[emailPhone] and does not call AuthRepository"
      type: ViewModel
      priority: P0

    - id: TC-LS-006
      scenario: "OnLoginTap with invalid email format (no @) sets validationErrors[emailPhone] with email_phone_invalid key"
      type: ViewModel
      priority: P0

    - id: TC-LS-007
      scenario: "OnLoginTap with password shorter than 8 characters sets validationErrors[password] with error_password_weak key"
      type: ViewModel
      priority: P0

    - id: TC-LS-008
      scenario: "OnSignupTap with blank name field sets validationErrors[name] with error_name_required key"
      type: ViewModel
      priority: P0

    - id: TC-LS-009
      scenario: "Valid login form submission calls AuthRepository.login and sets isSubmitting=true during the call"
      type: ViewModel
      priority: P0

    - id: TC-LS-010
      scenario: "Successful login with non-empty groupMemberships list emits NavigateToPersonalDashboard event"
      type: ViewModel
      priority: P0

    - id: TC-LS-011
      scenario: "Successful login with empty groupMemberships list sets screen state to ZeroGroups without navigating away"
      type: ViewModel
      priority: P0

    - id: TC-LS-012
      scenario: "401 response from companion_login sets error to LoginSignupError.InvalidCredentials and re-enables the form"
      type: ViewModel
      priority: P0

    - id: TC-LS-013
      scenario: "Valid signup form submission calls AuthRepository.selfRegister and sets screen state to ZeroGroups on success"
      type: ViewModel
      priority: P0

    - id: TC-LS-014
      scenario: "409 response from companion_self_register sets error to LoginSignupError.AccountExists with correct message key"
      type: ViewModel
      priority: P1

    - id: TC-LS-015
      scenario: "Biometric unlock success fetches /companion/auth/me; non-empty groups emits NavigateToPersonalDashboard"
      type: ViewModel
      priority: P0

    - id: TC-LS-016
      scenario: "Biometric hardware failure sets error to LoginSignupError.BiometricFailed and form remains enabled"
      type: ViewModel
      priority: P1

    - id: TC-LS-017
      scenario: "In ZeroGroups state, OnCreateGroupTap emits NavigateToGroupTypePicker event"
      type: ViewModel
      priority: P0

    - id: TC-LS-018
      scenario: "In ZeroGroups state, OnJoinWithCodeTap emits NavigateToJoinWithCode event"
      type: ViewModel
      priority: P0

    - id: TC-LS-019
      scenario: "ZeroGroups state renders zero_groups_illustration, zero_groups_title, create_group_button, and join_with_code_button"
      type: Screen
      priority: P0

    - id: TC-LS-020
      scenario: "error_banner is hidden when error is null and visible when error is non-null"
      type: Screen
      priority: P1

    - id: TC-LS-021
      scenario: "AuthRepository.login correctly maps LoginRequest body to companion_login POST and deserialises AuthResponse"
      type: Repository
      priority: P0

    - id: TC-LS-022
      scenario: "AuthRepository.selfRegister maps SelfRegisterRequest to companion_self_register POST and deserialises AuthResponse"
      type: Repository
      priority: P0

    - id: TC-LS-023
      scenario: "SessionStore.saveToken persists sessionToken and tokenExpiresAt; hasValidToken returns false after expiry"
      type: Repository
      priority: P1

    - id: TC-LS-024
      scenario: "companion_me response is cached with 300s TTL; biometric re-auth within TTL does not re-fetch from network"
      type: Repository
      priority: P2
