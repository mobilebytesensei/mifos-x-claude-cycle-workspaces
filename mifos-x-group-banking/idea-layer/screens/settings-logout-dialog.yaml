schema_version: "3.1"
id: settings-logout-dialog
name: Logout Confirmation Dialog
description: >
  Simple confirmation dialog triggered from the settings screen when the user
  taps "Log Out". Asks the user to confirm logout intent. Cancel dismisses
  without action; Logout clears the session, removes stored credentials, and
  navigates the full back-stack to client-type-selector.
feature: authentication
version: "1.0.0"
tags:
  - authentication
  - settings
  - dialog
  - session

status: enriched
quality_score: 85
status_history:
  - status: draft
    date: "2026-05-07"
    author: system
  - status: enriched
    date: "2026-05-07"
    author: system

archetype: dialog
entry_point: false
navigates_to:
  - client-type-selector
parent_screen: settings

state_model:
  SettingsLogoutDialogViewModel:
    state:
      name: SettingsLogoutDialogState
      fields:
        isLoggingOut: { type: Boolean, default: "false" }
        logoutError: { type: "String?", default: "null" }
    events:
      name: SettingsLogoutDialogEvent
      members:
        - { name: Dismiss }
        - { name: NavigateToClientTypeSelector }
    actions:
      name: SettingsLogoutDialogAction
      members:
        - { name: OnConfirmLogout, trigger: "Tap Logout button" }
        - { name: OnDismiss, trigger: "Tap Cancel or outside dialog" }
    di:
      - SessionManager
      - AuthRepository

flow_logic:
  on_confirm_logout:
    - action: clear_session
      description: "Clear auth token, refresh token, and cached user data from secure storage"
    - action: navigate_to_client_type_selector
      description: "Pop entire back-stack and navigate to client-type-selector as new root"
      on_error: set_logoutError
  on_dismiss:
    - action: emit_Dismiss

dependencies:
  repositories:
    - name: AuthRepository
      methods:
        - "logout(): Flow<Unit>"
  services:
    - name: SessionManager
      methods:
        - "clearSession(): Unit"

components:
  - id: dialog_title
    type: text
    style: { text_style: titleLarge, color: onSurface }
    value: "Log Out"
    test_context:
      purpose: "Dialog header identifying the action"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: logout_body_text
    type: text
    style:
      text_style: bodyMedium
      color: onSurfaceVariant
    value: "Are you sure you want to log out?"
    test_context:
      purpose: "Confirmation prompt to prevent accidental logout"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: logout_error_text
    type: text
    style: { text_style: bodySmall, color: error }
    value: "{{logoutError}}"
    visible_when: "logoutError != null"
    test_context:
      purpose: "Rare error case if session clear fails (e.g. secure storage error)"
      interaction_type: static
      data_driven: true
      required_fields: [logoutError]

  - id: dialog_actions_row
    type: row
    style:
      gap: 12dp
      padding: "16dp 0dp 0dp 0dp"
      arrangement: end
    content:
      - id: cancel_button
        type: button
        label: "Cancel"
        style:
          type: text
          text_color: primary
          min_touch_target: 48dp
        on_click: { action: OnDismiss }
        test_context:
          purpose: "Dismiss dialog — user stays logged in"
          interaction_type: tap
          data_driven: false
          required_fields: []
      - id: logout_button
        type: button
        label: "Log Out"
        loading_when: "isLoggingOut"
        style:
          type: filled
          background: error
          text_color: onError
          corner_radius: 24dp
          min_touch_target: 48dp
        on_click: { action: OnConfirmLogout, target: client-type-selector }
        test_context:
          purpose: "Confirm logout; shows spinner while clearing session; navigates to client-type-selector on success"
          interaction_type: tap
          data_driven: true
          required_fields: [isLoggingOut]

states:
  idle:
    components:
      - dialog_title
      - logout_body_text
      - dialog_actions_row
    demo_data:
      isLoggingOut: false
      logoutError: null
  logging_out:
    components:
      - dialog_title
      - logout_body_text
      - dialog_actions_row
    description: "Logout button shows loading indicator while session is being cleared"
  error:
    components:
      - dialog_title
      - logout_body_text
      - logout_error_text
      - dialog_actions_row
    description: "Error text shown if session clear fails; user can retry"

i18n:
  en:
    dialog_title: "Log Out"
    body: "Are you sure you want to log out?"
    cancel: "Cancel"
    confirm: "Log Out"
    error_logout_failed: "Could not log out. Please try again."
  sw:
    dialog_title: "Toka"
    body: "Je, una uhakika unataka kutoka?"
    cancel: "Ghairi"
    confirm: "Toka"
  fr:
    dialog_title: "Se Déconnecter"
    body: "Êtes-vous sûr de vouloir vous déconnecter ?"
    cancel: "Annuler"
    confirm: "Se Déconnecter"
  hi:
    dialog_title: "लॉग आउट"
    body: "क्या आप वाकई लॉग आउट करना चाहते हैं?"
    cancel: "रद्द करें"
    confirm: "लॉग आउट"

analytics:
  events:
    - trigger: dialog opened
      name: logout_dialog_opened
    - trigger: logout confirmed
      name: logout_confirmed
    - trigger: logout succeeded
      name: logout_success
    - trigger: logout failed
      name: logout_error
      params: { error: String }
    - trigger: dialog dismissed
      name: logout_dialog_dismissed
