schema_version: "3.1"
id: member-add
name: Member Add
description: >
  Form screen to onboard a new member into a savings group. Fields: name (required),
  phone number (required, validated), photo (camera or gallery picker), and role
  assignment dropdown (chairperson/treasurer/secretary/member). Creates a Fineract
  Client via POST /clients and writes the role to dt_member_role datatable.
  Supports offline queueing via SyncQueue. Covers FR-002.
feature: member-onboarding
flow: member-onboarding-flow
version: "1.0.0"
tags:
  - member-onboarding
  - admin
  - form
  - offline-capable
  - FR-002

# Lifecycle
status: enriched
quality_score: 87
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system

# Navigation
entry_point: false
bottom_nav:
  visible: false
navigates_to:
  - member-list
  - member-profile
route: /groups/{groupId}/members/add
entry_points:
  - source: member-list
    trigger: fab_tap
    params: { groupId: String }
nav_params:
  groupId: { type: String, required: true }

screens:
  - id: member-add-screen
    title: "Add Member"
    type: form
    description: Single-page form to create a new group member with photo capture

state_model:
  MemberAddViewModel:
    state:
      name: MemberAddState
      fields:
        firstName: { type: String, default: '""' }
        lastName: { type: String, default: '""' }
        phone: { type: String, default: '""' }
        photoUri: { type: "String?", default: "null" }
        selectedRole: { type: "MemberRole", default: "MemberRole.MEMBER" }
        validationErrors: { type: "Map<String, String>", default: "emptyMap()" }
        isSubmitting: { type: Boolean, default: "false" }
        isSubmitSuccess: { type: Boolean, default: "false" }
        isOffline: { type: Boolean, default: "false" }
        error: { type: "MemberAddError?", default: "null" }
        showPhotoPicker: { type: Boolean, default: "false" }
        groupId: { type: String, default: '""' }
    screen_state:
      name: MemberAddScreenState
      members: [Content, Submitting, Success, Error]
    errors:
      name: MemberAddError
      types:
        - { type: Validation, retry: false, message_key: error_validation }
        - { type: Network, retry: true, message_key: error_network, fallback: queue_offline }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
        - { type: PhoneAlreadyExists, retry: false, message_key: error_phone_exists }
    events:
      name: MemberAddEvent
      members:
        - { name: NavigateToMemberProfile, params: { memberId: String, groupId: String } }
        - { name: NavigateBack }
        - { name: ShowPhotoPicker }
        - { name: ShowOfflineSyncDialog }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: MemberAddAction
      members:
        - { name: OnFirstNameChange, params: { value: String }, trigger: "Type first name" }
        - { name: OnLastNameChange, params: { value: String }, trigger: "Type last name" }
        - { name: OnPhoneChange, params: { value: String }, trigger: "Type phone number" }
        - { name: OnPhotoPickerOpen, trigger: "Tap photo area or camera icon" }
        - { name: OnPhotoCaptured, params: { uri: String }, trigger: "Camera capture complete" }
        - { name: OnPhotoSelected, params: { uri: String }, trigger: "Gallery image selected" }
        - { name: OnPhotoRemoved, trigger: "Tap remove photo" }
        - { name: OnRoleSelected, params: { role: MemberRole }, trigger: "Select role from dropdown" }
        - { name: OnSubmit, trigger: "Tap Save Member button" }
        - { name: OnBack, trigger: "Tap back or close" }
    di:
      - MemberRepository
      - SyncQueueRepository
      - ImagePickerHelper
      - NetworkMonitor
      - SessionManager

flow_logic:
  on_submit:
    - action: validate_all
      fields:
        firstName: { min_length: 2, required: true }
        lastName: { min_length: 2, required: true }
        phone: { format: E164_KE, required: true }
        selectedRole: { required: true }
      on_valid:
        - check: network_available
          online:
            - api: create_client
              on_success:
                - api: assign_member_role
                  on_success:
                    - api: upload_photo
                      condition: photoUri != null
                    - emit NavigateToMemberProfile
          offline:
            - action: queue_to_sync_queue
              emit: ShowOfflineSyncDialog
      on_invalid: show_validation_errors
  on_photo_picker_open:
    - show: bottom_sheet_photo_source
  phone_validation:
    rule: "^(\\+254|0)[7][0-9]{8}$"
    error_key: error_phone_format

dependencies:
  repositories:
    - name: MemberRepository
      methods:
        - createMember(request: CreateMemberRequest): Result<Member>
        - assignRole(memberId: String, role: MemberRole): Result<Unit>
        - uploadPhoto(memberId: String, uri: String): Result<Unit>
    - name: SyncQueueRepository
      methods:
        - enqueue(item: SyncQueueItem): Unit
  services:
    - NetworkMonitor
    - SessionManager
    - ImagePickerHelper

api:
  - id: create_client
    function: create_client
    method: post
    endpoint: "/clients"
    description: Create a new Fineract client (group member)
    body:
      firstname: String
      lastname: String
      mobileNo: String
      active: Boolean
      activationDate: String      # dd MMMM yyyy
      officeId: Long              # from group's officeId
      groupId: Long               # Fineract group ID (not Center)
      locale: String
      dateFormat: String
    response:
      type: object
      fields:
        resourceId: Long
        clientId: Long
    errors:
      400: Validation error — invalid fields or duplicate phone
      401: Unauthorized
      403: Forbidden
      500: Server error
    offline_queue:
      table: sync_queue
      operation: CREATE_MEMBER

  - id: assign_member_role
    function: assign_member_role
    method: post
    endpoint: "/datatables/dt_member_role/{clientId}"
    description: Write member's role to custom datatable
    params:
      clientId: { type: Long, required: true, source: create_client_response }
    body:
      role: String      # CHAIRPERSON | TREASURER | SECRETARY | MEMBER
      groupId: Long
      assignedDate: String
    response:
      type: object
      fields:
        resourceId: Long
    errors:
      400: Invalid role
      401: Unauthorized
      500: Server error
    offline_queue:
      table: sync_queue
      operation: ASSIGN_MEMBER_ROLE

  - id: upload_photo
    function: upload_photo
    method: post
    endpoint: "/clients/{clientId}/images"
    description: Upload member profile photo
    params:
      clientId: { type: Long, required: true, source: create_client_response }
    body_type: multipart/form-data
    body:
      file: File
    response:
      type: object
      fields:
        resourceId: Long
    errors:
      400: File too large (max 2MB)
      401: Unauthorized
      500: Server error
    offline_queue:
      table: sync_queue
      operation: UPLOAD_MEMBER_PHOTO

dtos:
  CreateMemberRequest:
    firstName: String
    lastName: String
    phone: String
    photoUri: String?
    role: MemberRole
    groupId: String
    officeId: Long
    activationDate: String

  MemberRole:
    values: [CHAIRPERSON, TREASURER, SECRETARY, MEMBER]

components:
  - id: top_bar
    type: top-bar
    title: "Add Member"
    style:
      background: primary
      text_color: onPrimary
    navigation_icon: close
    on_navigation_click: { action: OnBack }
    test_context:
      purpose: "Form top bar; close discards and returns to member list"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: photo_picker_area
    type: card
    style:
      background: surfaceVariant
      corner_radius: 60dp    # circular feel
      width: 120dp
      height: 120dp
      elevation: 0dp
      alignment: center
      min_touch_target: 120dp
    content:
      - id: photo_preview
        type: image
        visible: "{{photoUri != null}}"
        src: "{{photoUri}}"
        style: { fill: true, corner_radius: 60dp }
      - id: photo_placeholder_icon
        type: icon
        visible: "{{photoUri == null}}"
        icon: add_a_photo
        style: { color: onSurfaceVariant, size: 40dp }
      - id: photo_remove_button
        type: icon-button
        visible: "{{photoUri != null}}"
        icon: cancel
        style: { color: error, size: 24dp, position: top_end }
        on_click: { action: OnPhotoRemoved }
    on_click: { action: OnPhotoPickerOpen }
    test_context:
      purpose: "Circular photo tap area; shows preview when photo selected"
      interaction_type: tap
      data_driven: true
      required_fields: [photoUri]

  - id: photo_source_bottom_sheet
    type: bottom-sheet
    visible: "{{showPhotoPicker}}"
    title: "Add Photo"
    content:
      - id: camera_option
        type: list-item
        leading_icon: camera_alt
        headline: "Take Photo"
        on_click: { action: OnPhotoCaptured, trigger: "system camera intent" }
        style: { min_touch_target: 56dp }
      - id: gallery_option
        type: list-item
        leading_icon: photo_library
        headline: "Choose from Gallery"
        on_click: { action: OnPhotoSelected, trigger: "system gallery picker" }
        style: { min_touch_target: 56dp }
    test_context:
      purpose: "Photo source selection sheet (camera vs gallery)"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: first_name_field
    type: text-field
    label: "First Name"
    placeholder: "e.g. Amina"
    required: true
    max_length: 50
    keyboard: name
    style: { min_touch_target: 56dp }
    on_change: { action: OnFirstNameChange, param: value }
    error_text: "{{validationErrors.firstName}}"
    test_context:
      purpose: "Capture member's first name"
      interaction_type: text_input
      data_driven: false
      required_fields: [firstName]

  - id: last_name_field
    type: text-field
    label: "Last Name"
    placeholder: "e.g. Wanjiru"
    required: true
    max_length: 50
    keyboard: name
    style: { min_touch_target: 56dp }
    on_change: { action: OnLastNameChange, param: value }
    error_text: "{{validationErrors.lastName}}"
    test_context:
      purpose: "Capture member's last name"
      interaction_type: text_input
      data_driven: false
      required_fields: [lastName]

  - id: phone_field
    type: text-field
    label: "Phone Number"
    placeholder: "+254712345678"
    helper: "Kenyan number: +254 or 07XXXXXXXX"
    required: true
    keyboard: phone
    max_length: 13
    prefix: "+254"
    style: { min_touch_target: 56dp }
    on_change: { action: OnPhoneChange, param: value }
    error_text: "{{validationErrors.phone}}"
    test_context:
      purpose: "Capture and validate Kenyan phone number"
      interaction_type: text_input
      data_driven: false
      required_fields: [phone]

  - id: role_dropdown
    type: text-field
    variant: dropdown
    label: "Role"
    required: true
    options:
      - { label: "Chairperson", value: CHAIRPERSON }
      - { label: "Treasurer", value: TREASURER }
      - { label: "Secretary", value: SECRETARY }
      - { label: "Member", value: MEMBER }
    default: MEMBER
    style: { min_touch_target: 56dp }
    on_change: { action: OnRoleSelected, param: role }
    error_text: "{{validationErrors.selectedRole}}"
    test_context:
      purpose: "Assign role to the new member"
      interaction_type: dropdown_select
      data_driven: false
      required_fields: [selectedRole]

  - id: offline_banner
    type: banner
    visible: "{{isOffline}}"
    icon: wifi_off
    message: "You are offline. This member will be added when you reconnect."
    style: { background: tertiaryContainer, text_color: onTertiaryContainer }
    test_context:
      purpose: "Inform admin that submission will be queued for offline sync"
      interaction_type: static
      data_driven: true
      required_fields: [isOffline]

  - id: save_button
    type: button
    variant: filled
    label: "Save Member"
    loading: "{{isSubmitting}}"
    style: { background: primary, text_color: onPrimary, min_touch_target: 56dp, full_width: true }
    on_click: { action: OnSubmit }
    test_context:
      purpose: "Submit form; shows loading while API call in-flight"
      interaction_type: tap
      data_driven: true
      required_fields: [isSubmitting]

states:
  initial_state: content
  content:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, offline_banner, save_button]
    description: "Form ready for input; offline banner conditionally visible"
    demo_data:
      firstName: "Grace"
      lastName: "Achieng"
      phone: "+254723456789"
      selectedRole: SECRETARY
      photoUri: null
      isOffline: false
  submitting:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, save_button]
    description: "Save button shows loading; all fields disabled"
  success:
    description: "Navigated to member-profile"
  error:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, save_button]
    description: "Inline error shown below save button"

i18n:
  en:
    screen_title: "Add Member"
    field_first_name: "First Name"
    field_last_name: "Last Name"
    field_phone: "Phone Number"
    field_phone_helper: "Kenyan number: +254 or 07XXXXXXXX"
    field_role: "Role"
    photo_add: "Add Photo"
    photo_camera: "Take Photo"
    photo_gallery: "Choose from Gallery"
    role_chairperson: "Chairperson"
    role_treasurer: "Treasurer"
    role_secretary: "Secretary"
    role_member: "Member"
    btn_save: "Save Member"
    offline_notice: "You are offline. This member will be added when you reconnect."
    error_validation: "Please fix the highlighted fields."
    error_phone_format: "Enter a valid Kenyan phone number."
    error_phone_exists: "A member with this phone number already exists."
    error_network: "No internet. Member queued for sync."
    error_server: "Server error. Please retry."
    error_auth: "Session expired."

analytics:
  screen_view: member_add_viewed
  events:
    - trigger: photo tap
      name: member_photo_picker_opened
    - trigger: camera capture
      name: member_photo_captured
    - trigger: gallery select
      name: member_photo_from_gallery
    - trigger: submit tap
      name: member_add_submitted
      params: { role: String, has_photo: Boolean, is_offline: Boolean }
    - trigger: offline queue
      name: member_add_queued_offline
    - trigger: success
      name: member_added
      params: { member_id: String, role: String, group_id: String }
