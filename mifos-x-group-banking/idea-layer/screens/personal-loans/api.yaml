sibling: api
schema_version: "4.0"
feature_id: personal-loans

api:
  - id: get_self_loans
    function: get_self_loans
    method: get
    endpoint: "/self/loans"
    description: Get all loans for the authenticated self-service client
    params:
      associations: { type: String, required: false, default: "repaymentSchedule" }
    response:
      type: array
      items:
        id: Long
        accountNo: String
        productName: String
        loanProductId: Long
        status: { id: Int, code: String, value: String, active: Boolean, closed: Boolean }
        principal: Double
        interestRatePerPeriod: Double
        termFrequency: Int
        repaymentSchedule:
          totalPrincipalExpected: Double
          totalInterestCharged: Double
          totalRepaymentExpected: Double
          periods:
            - period: Int
              dueDate: "List<Int>"
              principalDue: Double
              interestDue: Double
              totalDueForPeriod: Double
              totalPaidForPeriod: Double
              complete: Boolean
        summary:
          principalDisbursed: Double
          principalOutstanding: Double
          totalOutstanding: Double
          totalRepayment: Double
    errors:
      401: Session expired
      503: Server unavailable
    cache: { ttl: 180, strategy: stale-while-revalidate, offline: use_sqldelight }

dtos:
  LoanDto:
    id: Long
    accountNo: String
    productName: String
    loanProductId: Long
    status: LoanStatusDto
    principal: Double
    interestRatePerPeriod: Double
    termFrequency: Int
    repaymentSchedule: RepaymentScheduleDto
    summary: LoanSummaryDto
    isOverdue: Boolean

  LoanStatusDto:
    id: Int
    code: String
    value: String
    active: Boolean
    closed: Boolean

  RepaymentScheduleDto:
    totalPrincipalExpected: Double
    totalInterestCharged: Double
    totalRepaymentExpected: Double
    periods: "List<RepaymentPeriodDto>"

  RepaymentPeriodDto:
    period: Int
    dueDate: "List<Int>"
    principalDue: Double
    interestDue: Double
    totalDueForPeriod: Double
    totalPaidForPeriod: Double
    complete: Boolean

  LoanSummaryDto:
    principalDisbursed: Double
    principalOutstanding: Double
    totalOutstanding: Double
    totalRepayment: Double

  LoanStatusFilter:
    values: [ALL, ACTIVE, CLOSED]

cache_strategy:
  ttl: 180
  strategy: stale-while-revalidate
  offline: use_sqldelight

dependencies:
  repositories:
    - name: LoanRepository
      methods:
        - "getSelfLoans(associations: String): Flow<List<LoanDto>>"
  services:
    - SessionManager
    - NetworkMonitor
  local_db:
    - table: loans
      schema: SQLDelight Loan entity
