sibling: data-flow
schema_version: "2.1.0"
feature_id: personal-loans

entries:
  - screen_id: personalLoansScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_self_loans, transport: rest, method: get }
    dtos:
      - { name: LoanDto, role: response, api_id: get_self_loans }
      - { name: LoanStatusDto, role: response, api_id: get_self_loans }
      - { name: RepaymentScheduleDto, role: response, api_id: get_self_loans }
      - { name: LoanSummaryDto, role: response, api_id: get_self_loans }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 180
      key_template: "personal_loans:{clientId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "503", behavior: fallback_cache, message_key: error_network }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_network }

  - screen_id: personalLoansScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_self_loans, transport: rest, method: get }
    dtos:
      - { name: LoanDto, role: response, api_id: get_self_loans }
    auth_required: true
    cache:
      strategy: bypass_and_refresh
      key_template: "personal_loans:{clientId}"
    error_paths:
      - { error_code: "network.offline", behavior: snackbar, message_key: error_network }
      - { error_code: "401", behavior: navigate, nav_target: login }

  - screen_id: personalLoansScreen
    trigger: on_interact
    interaction: filter_chip_tap
    endpoints: []
    dtos: []
    auth_required: false
    cache:
      strategy: none
    notes: "Client-side filtering by LoanStatusFilter — no API call"
    error_paths: []

  - screen_id: personalLoansScreen
    trigger: on_interact
    interaction: loan_card_expand
    endpoints: []
    dtos: []
    auth_required: false
    cache:
      strategy: none
    notes: "Repayment schedule is pre-fetched on mount via associations=repaymentSchedule — no additional call"
    error_paths: []
