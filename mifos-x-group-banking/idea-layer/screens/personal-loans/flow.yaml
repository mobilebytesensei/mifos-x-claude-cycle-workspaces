sibling: flow
schema_version: "4.0"
feature_id: personal-loans

navigates_to:
  - target: loan-request
    condition: user_taps_fab or user_taps_request_loan_empty
  - target: personal-dashboard
    condition: user_taps_back

flow_logic:
  on_load:
    - api: get_self_loans
      params: { associations: "repaymentSchedule" }
      on_success:
        - decision: loans_available
          branches:
            - condition: "loans.isNotEmpty()"
              action: show_content
            - condition: "loans.isEmpty()"
              action: show_empty
      on_error: show_error
  on_loan_expand:
    - state: { selectedLoanId: "params.loanId == selectedLoanId ? null : params.loanId" }
  on_filter_change:
    - state: { filterStatus: params.status }
    - action: filter_loans_client_side
  on_request_loan_click:
    - navigate: loan-request
      params: { clientId: "{clientId}" }
  on_refresh:
    - action: reload_loans
      invalidate_cache: true
