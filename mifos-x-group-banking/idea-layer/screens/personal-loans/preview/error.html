<!doctype html>
<!-- render-hash: error:personal-loans-v3-error -->
<html lang="en" data-feature="personal-loans" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>personal-loans · error · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●○○ ⚠ ▮</span></div>

<!-- top_bar — primary fill, back arrow (NavigateBack → personal-dashboard, pop) -->
<header class="top-app-bar" data-component-id="top_bar">
  <button class="back-btn" data-nav-to="personal-dashboard" data-nav-type="pop" aria-label="Back to dashboard">←</button>
  <h1>My Loans</h1>
  <span class="sync-badge offline">⚠ Offline</span>
</header>

<main>
  <!-- filter_chips_row — present but disabled while load failed -->
  <div class="chip-row" aria-hidden="true" data-component-id="filter_chips_row">
    <button class="chip selected" disabled>All</button>
    <button class="chip" disabled>Active</button>
    <button class="chip" disabled>Closed</button>
  </div>

  <!-- error_state — danger alert + illustration + single Retry (OnRetry, call_api → data-action) -->
  <div data-component-id="error_state">
    <div class="alert alert-danger" role="alert">
      <div>
        <h3>Could not load loans</h3>
        <p>Check your internet connection and try again.</p>
      </div>
    </div>
    <div class="empty-state">
      <div class="illus" aria-hidden="true">📡</div>
      <button class="btn btn-primary" data-action="OnRetry">Try Again</button>
    </div>
  </div>
</main>

<!-- app-shell chrome — bottom nav (docs.yaml#bottom_nav:true), consistent across all states -->
<nav class="bottom-nav">
  <button class="nav-item" data-nav-to="personal-dashboard"><span class="nav-icon">⌂</span>Home</button>
  <button class="nav-item" data-nav-to="personal-savings"><span class="nav-icon">⌬</span>Savings</button>
  <button class="nav-item active"><span class="nav-icon">⊜</span>Loans</button>
  <button class="nav-item" data-nav-to="sync-status"><span class="nav-icon">⟳</span>Sync</button>
</nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
