<!doctype html>
<!-- render-hash: loading:personal-loans-v3-loading -->
<html lang="en" data-feature="personal-loans" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>personal-loans · loading · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

<!-- top_bar — primary fill, back arrow (NavigateBack → personal-dashboard, pop) -->
<header class="top-app-bar" data-component-id="top_bar">
  <button class="back-btn" data-nav-to="personal-dashboard" data-nav-type="pop" aria-label="Back to dashboard">←</button>
  <h1>My Loans</h1>
  <span class="sync-badge">⟳ Syncing…</span>
</header>

<main aria-busy="true" aria-label="Loading loans">
  <!-- filter_chips_row — skeleton chips (static, disabled) built from DS .chip -->
  <div class="chip-row" aria-hidden="true" data-component-id="filter_chips_row">
    <button class="chip" disabled>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</button>
    <button class="chip" disabled>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</button>
    <button class="chip" disabled>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</button>
  </div>

  <!-- shimmer_loading (count: 3) — skeleton loan cards from DS .card.card-muted -->
  <div data-component-id="shimmer_loading">
    <div class="card card-muted" style="height:120px;" aria-hidden="true"></div>
    <div class="card card-muted" style="height:120px;" aria-hidden="true"></div>
    <div class="card card-muted" style="height:120px;" aria-hidden="true"></div>
  </div>
  <div class="spinner" role="status" aria-label="Loading"></div>
</main>

<!-- app-shell chrome — bottom nav (docs.yaml#bottom_nav:true), consistent across all states -->
<nav class="bottom-nav">
  <button class="nav-item" data-nav-to="personal-dashboard"><span class="nav-icon">⌂</span>Home</button>
  <button class="nav-item" data-nav-to="personal-savings"><span class="nav-icon">⌬</span>Savings</button>
  <button class="nav-item active"><span class="nav-icon">⊜</span>Loans</button>
  <button class="nav-item" data-nav-to="sync-status"><span class="nav-icon">⟳</span>Sync</button>
</nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
