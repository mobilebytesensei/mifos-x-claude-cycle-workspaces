<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Loans — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { darkMode:'class', theme:{extend:{fontFamily:{display:['Noto Sans','system-ui','sans-serif']}}} };
</script>
<style>
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width:393px; min-height:852px; border-radius:2.5rem; overflow:hidden; position:relative; }
body.embedded { background:#F1F4EF; margin:0; padding:0; min-height:100vh; display:block; }
body.embedded #standalone-toolbar { display:none !important; }
body.embedded #phone-wrapper { display:none !important; }
body.embedded #embedded-content { display:flex !important; flex-direction:column; width:100%; height:100vh; overflow:hidden; background:#F1F4EF; }
.card { background:white; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.chip { display:inline-flex; align-items:center; padding:4px 12px; border-radius:9999px; font-size:12px; font-weight:600; cursor:pointer; }
.chip-active-sel { background:#C8E6C9; color:#1B5E20; }
.chip-inactive { background:white; color:#42493F; border:1px solid #C8D8C5; }
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.shimmer { background:linear-gradient(90deg,#e8f0e7 25%,#d4e8d2 50%,#e8f0e7 75%); background-size:800px 100%; animation:shimmer 1.5s infinite; border-radius:12px; }
.expand-row { cursor:pointer; transition:background 0.1s; }
.expand-row:hover { background:#F1F4EF; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Personal Loans — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="content">Loans List</option>
    <option value="expanded">Loan Expanded</option>
    <option value="loading">Loading</option>
    <option value="empty">Empty</option>
    <option value="error">Error</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-[#F1F4EF] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2" style="background:#2E7D32">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-sm text-white">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto" style="height:732px; background:#F1F4EF"></div>
    <div id="bottom-nav"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 shrink-0" style="background:#2E7D32; padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-white">wifi</span>
      <span class="material-symbols-outlined text-sm text-white">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto flex-1" style="background:#F1F4EF"></div>
  <div id="embedded-bottom-nav"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) { document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col'); document.body.classList.add('embedded'); }
function getContentEl() { return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content'); }
function getNavEl() { return isEmbedded ? document.getElementById('embedded-bottom-nav') : document.getElementById('bottom-nav'); }

var loans = [
  {
    id: 1, product: 'VSLA Group Loan', acctNo: 'LP-2026-001', status: 'Active',
    statusBg: '#C8E6C9', statusColor: '#1B5E20',
    outstanding: 'KES 15,000', principal: 'KES 15,000', interest: '10%',
    nextAmt: 'KES 1,500', nextDate: '15 May 2026', isOverdue: false,
    schedule: [
      { num: 1, date: '15 Apr 2026', amt: 'KES 1,500', paid: true },
      { num: 2, date: '15 May 2026', amt: 'KES 1,500', paid: false },
      { num: 3, date: '15 Jun 2026', amt: 'KES 1,500', paid: false },
      { num: 4, date: '15 Jul 2026', amt: 'KES 1,500', paid: false },
    ]
  },
  {
    id: 2, product: 'Emergency Loan', acctNo: 'LP-2025-008', status: 'Closed',
    statusBg: '#E7E0EC', statusColor: '#42493F',
    outstanding: 'KES 0', principal: 'KES 8,000', interest: '10%',
    nextAmt: null, nextDate: null, isOverdue: false,
    schedule: [
      { num: 1, date: '10 Oct 2025', amt: 'KES 2,667', paid: true },
      { num: 2, date: '10 Nov 2025', amt: 'KES 2,667', paid: true },
      { num: 3, date: '10 Dec 2025', amt: 'KES 2,666', paid: true },
    ]
  }
];

function renderTopBar() {
  return `<div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
    <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('personal-dashboard')">arrow_back</span>
    <span class="text-lg font-bold text-white flex-1">My Loans</span>
  </div>`;
}

function renderFilterChips(activeFilter) {
  return `<div class="flex gap-2 px-4 py-3" style="background:#F1F4EF;">
    ${['All','Active','Closed'].map(f => `
      <div class="chip ${f===activeFilter?'chip-active-sel':'chip-inactive'}" onclick="switchState('content')">${f}</div>
    `).join('')}
  </div>`;
}

function renderLoanCard(loan, expanded) {
  return `
  <div class="card mx-4 mb-3">
    <div class="p-4">
      <div class="flex items-start justify-between mb-2">
        <div>
          <div class="text-base font-bold text-[#1A1C19]">${loan.product}</div>
          <div class="text-xs text-[#72796F]">${loan.acctNo}</div>
        </div>
        <span class="chip" style="background:${loan.statusBg}; color:${loan.statusColor};">${loan.status}</span>
      </div>
      <div class="mb-2">
        <div class="text-xs text-[#72796F]">Outstanding</div>
        <div class="text-2xl font-bold text-[#1A1C19]">${loan.outstanding}</div>
      </div>
      ${loan.nextAmt ? `
      <div class="flex items-center gap-2 p-2 rounded-lg mb-2" style="background:#E8F5E9;">
        <span class="material-symbols-outlined text-sm" style="color:#2E7D32">event</span>
        <span class="text-sm text-[#42493F]">Next: <strong>${loan.nextAmt}</strong> on ${loan.nextDate}</span>
      </div>` : ''}
      <!-- tap to expand repayment schedule -->
      <div class="expand-row flex items-center gap-2 p-2 rounded-lg" onclick="toggleExpand(${loan.id})">
        <span class="text-xs font-semibold text-[#2E7D32]">Repayment Schedule</span>
        <div class="flex-1"></div>
        <span class="material-symbols-outlined text-[#2E7D32] text-sm">${expanded?'expand_less':'expand_more'}</span>
      </div>
    </div>
    ${expanded ? `
    <div class="border-t border-slate-100">
      ${loan.schedule.map(p => `
        <div class="flex items-center px-4 py-3 gap-3 border-b border-slate-50 last:border-0">
          <span class="material-symbols-outlined text-lg ${p.paid ? 'text-[#2E7D32]' : 'text-[#72796F]'}" style="font-variation-settings:'FILL' ${p.paid?1:0}">${p.paid?'check_circle':'radio_button_unchecked'}</span>
          <div class="flex-1">
            <div class="text-xs text-[#72796F]">Instalment #${p.num}</div>
            <div class="text-xs text-[#42493F]">${p.date}</div>
          </div>
          <div class="text-sm font-semibold ${p.paid?'text-[#2E7D32]':'text-[#1A1C19]'}">${p.amt}</div>
        </div>
      `).join('')}
    </div>` : ''}
  </div>`;
}

var expandedId = null;
function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  renderLoansContent(false, true);
}

function renderLoansContent(expanded, keepState) {
  var html = renderTopBar() + renderFilterChips('All') + '<div class="pb-4 pt-2">';
  loans.forEach(l => { html += renderLoanCard(l, expandedId === l.id); });
  html += '</div>';
  getContentEl().innerHTML = html;
  renderBottomNav();
  renderFab();
}

function renderFab() {
  // FAB: tap navigates to loan-request
  var existing = document.getElementById('loans-fab');
  if (existing) existing.remove();
  var fab = document.createElement('button');
  fab.id = 'loans-fab';
  fab.className = 'fixed z-40 flex items-center gap-2 px-4 py-3 rounded-full text-white font-semibold shadow-lg';
  fab.style = 'bottom: 80px; right: 16px; background: #FF8F00;';
  fab.innerHTML = '<span class="material-symbols-outlined text-xl" style="font-variation-settings:\'FILL\' 1">add</span> Request Loan';
  fab.onclick = function() { navigateTo('loan-request'); };
  document.body.appendChild(fab);
}

function renderBottomNav() {
  var items = [
    { id: 'personal-dashboard', icon: 'home', label: 'Home' },
    { id: 'personal-savings', icon: 'savings', label: 'Savings' },
    { id: 'personal-loans', icon: 'account_balance', label: 'Loans' },
    { id: 'settings', icon: 'settings', label: 'Settings' },
  ];
  getNavEl().innerHTML = '<div class="flex items-center justify-around py-2 bg-white border-t border-slate-100">' +
    items.map(n => `<div class="flex flex-col items-center gap-0.5 cursor-pointer ${n.id==='personal-loans'?'text-[#2E7D32]':'text-slate-400'}" onclick="navigateTo('${n.id}')">
      <span class="material-symbols-outlined text-xl" ${n.id==='personal-loans'?'style="font-variation-settings:\'FILL\' 1"':''}>${n.icon}</span>
      <span class="text-[10px]">${n.label}</span>
    </div>`).join('') + '</div>';
}

var currentState = 'content';
function switchState(s) {
  currentState = s || 'content';
  document.getElementById('statePicker').value = currentState;
  var existing = document.getElementById('loans-fab'); if(existing) existing.remove();
  if (s === 'loading') {
    getContentEl().innerHTML = renderTopBar() + `<div class="px-4 flex flex-col gap-3 pt-4">${[120,120,120].map(h=>`<div class="shimmer" style="height:${h}px;"></div>`).join('')}</div>`;
    renderBottomNav();
  } else if (s === 'empty') {
    getContentEl().innerHTML = renderTopBar() + `<div class="flex flex-col items-center py-16 px-6 text-center">
      <span class="material-symbols-outlined text-5xl text-[#72796F] mb-4">account_balance</span>
      <p class="text-lg font-semibold text-[#1A1C19] mb-2">No loans yet</p>
      <p class="text-sm text-[#72796F] mb-6">Apply for a loan of up to 3× your savings balance.</p>
      <button class="px-6 py-3 rounded-full text-white font-semibold" style="background:#2E7D32;" onclick="navigateTo('loan-request')">Request a Loan</button>
    </div>`;
    renderBottomNav();
  } else if (s === 'error') {
    getContentEl().innerHTML = renderTopBar() + `<div class="flex flex-col items-center py-16 px-6 text-center">
      <span class="material-symbols-outlined text-5xl text-[#72796F] mb-4">wifi_off</span>
      <p class="text-lg font-semibold text-[#1A1C19] mb-2">Could not load loans</p>
      <p class="text-sm text-[#72796F] mb-6">Check your internet connection and try again.</p>
      <button class="px-6 py-3 rounded-full text-white font-semibold" style="background:#2E7D32;" onclick="switchState('content')">Try Again</button>
    </div>`;
    renderBottomNav();
  } else if (s === 'expanded') {
    expandedId = 1; renderLoansContent(true, false);
  } else {
    expandedId = null; renderLoansContent(false, false);
  }
}

function navigateTo(t) {
  if (window !== window.top) window.parent.postMessage({action:'navigate',screenId:t},'*');
  else showToast('Navigate to: '+t);
}
function showToast(msg) {
  var t = document.createElement('div'); t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg'; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),2000);
}
function toggleDark() { document.querySelector('.phone')&&document.querySelector('.phone').classList.toggle('bg-slate-900'); }
window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state||'');
  if(e.data.action==='getInspectorData')notifyParent();
});
function notifyParent() {
  if(window===window.top)return;
  window.parent.postMessage({
    action:'screenLoaded',screenId:'personal-loans',name:'Personal Loans',
    feature:'end-user-dashboard',status:'enriched',componentCount:6,
    states:[{id:'content',name:'Loans List'},{id:'expanded',name:'Loan Expanded'},{id:'loading',name:'Loading'},{id:'empty',name:'Empty'},{id:'error',name:'Error'}],
    inspectorData:{id:'personal-loans',name:'Personal Loans',feature:'end-user-dashboard',status:'enriched',
      components:[
        {type:'top-bar',label:'My Loans',target:'personal-dashboard'},
        {type:'chip',label:'Filter: All / Active / Closed',target:''},
        {type:'card',label:'VSLA Group Loan — KES 15,000',target:''},
        {type:'card',label:'Emergency Loan — Closed',target:''},
        {type:'fab',label:'Request Loan',target:'loan-request'},
        {type:'bottom-nav',label:'Navigation',target:''}
      ],states:{},incoming_from:['personal-dashboard']}
  },'*');
}
switchState('content');
notifyParent();
</script>
</body>
</html>
