requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: personal-loans

route: /loans
entry_points:
  - source: personal-dashboard
    trigger: user_taps_loan_card
    params: { clientId: Long }
nav_params:
  clientId: { type: Long, required: true }

screens:
  - id: personal-loans-screen
    name: PersonalLoansScreen
    type: list
    description: Loan list with status chips, expandable repayment cards, and FAB

state_model:
  PersonalLoansViewModel:
    state:
      name: PersonalLoansState
      fields:
        clientId: { type: Long, default: "0L" }
        loans: { type: "List<LoanDto>", default: "emptyList()" }
        selectedLoanId: { type: "Long?", default: "null" }
        filterStatus: { type: LoanStatusFilter, default: "LoanStatusFilter.ALL" }
        isLoading: { type: Boolean, default: "true" }
        isRefreshing: { type: Boolean, default: "false" }
        error: { type: "LoanError?", default: "null" }
    screen_state:
      name: PersonalLoansScreenState
      members: [Loading, Content, Empty, Error]
    errors:
      name: LoanError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Unauthorized, retry: false, message_key: error_session_expired }
    events:
      name: PersonalLoansEvent
      members:
        - { name: NavigateToLoanRequest }
        - { name: NavigateBack }
    actions:
      name: PersonalLoansAction
      members:
        - { name: OnRefresh, trigger: "Pull-to-refresh" }
        - { name: OnRetry, trigger: "Tap Retry button" }
        - { name: OnLoanExpand, params: { loanId: Long }, trigger: "Tap loan card" }
        - { name: OnFilterChange, params: { status: LoanStatusFilter }, trigger: "Tap filter chip" }
        - { name: OnRequestLoanClick, trigger: "Tap FAB or empty state CTA" }
    di:
      - LoanRepository
      - SessionManager

business_logic:
  kind: crud
  description: "Loads the signed-in members own loans (active, pending, closed) from Fineract /self/loans scoped to their clientId. Reads offline-first: SQLDelight cache served stale-while-revalidate with a 180s TTL, revalidated over the Fineract REST client when cmp-network-monitor reports connectivity. Client-side filtering by LoanStatusFilter and local expand of each loans repayment schedule; no writes."
  description_hash: "c523799fad7a09ffc421a8306959dd7f41feb0e2447322dd626a540f15319f35"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"
  library_refs: ["cmp-network-monitor"]
  external_library_refs: ["ktor-client", "sqldelight", "store5"]
  required_modules: ["core/network", "core/database", "core/store", "core/data"]

components:
  - id: top_bar
    type: top-bar
    title: "{strings.screen_title}"
    accessibility_label: "{strings.a11y_top_bar}"
    style: { background: primary, elevation: 0dp, text_color: onPrimary }
    navigation_icon: arrow_left_24_regular
    navigation_icon_accessibility_label: "{strings.a11y_back}"
    on_navigation_click: { action: NavigateBack, target: personal-dashboard }
    action_contract:
      effect: navigate
      description: "Navigates back to the personal-dashboard screen via the NavController, popping the loans destination off the back stack. No data mutation."
      action_contract_hash: "0dac3afc997fdf9ba47f788c4cb7c6e09f4dcf1de6a99d925aa8eb531f3a1a98"
      action_contract_author: "claude-via-idea-enrich"
      action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: filter_chips_row
    type: chip-group
    selection: single
    accessibility_label: "{strings.a11y_filter_chips}"
    chips:
      - { label: "{strings.filter_all}", value: ALL }
      - { label: "{strings.filter_active}", value: ACTIVE }
      - { label: "{strings.filter_closed}", value: CLOSED }
    style: { scroll_horizontal: true, margin_horizontal: 16dp, padding: "6dp 14dp" }
    on_click: { action: OnFilterChange, target: state.filterStatus }
    action_contract:
      effect: transform_state
      description: "Applies client-side filtering of the already-loaded loans list by the tapped LoanStatusFilter value (ALL, ACTIVE, CLOSED); pure in-memory state transition, no Fineract call."
      action_contract_hash: "862ed6a734259babdc04c94dfc93cc8a3e1088653450436df36c56916a105673"
      action_contract_author: "claude-via-idea-enrich"
      action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: loan_card
    type: card
    accessibility_label: "{strings.a11y_loan_card}"
    style:
      background: surface
      corner_radius: lg
      elevation: 2dp
      padding: 16dp
      margin_horizontal: 16dp
      margin_bottom: 12dp
    content:
      - id: loan_header_row
        type: row
        children:
          - id: product_name_text
            type: text
            value: "{{loan.productName}}"
            i18n: skip
            style: { text_style: titleMedium, color: onSurface, font_weight: semibold }
          - id: status_chip
            type: chip
            label: "{{loan.status.value}}"
            i18n: skip
            accessibility_label: "{strings.a11y_status_chip}"
            style:
              active: { background: primaryContainer, text_color: onPrimaryContainer }
              pending_approval: { background: secondaryContainer, text_color: onSecondaryContainer }
              closed: { background: surfaceVariant, text_color: onSurfaceVariant }
              overdue: { background: errorContainer, text_color: onErrorContainer }
      - id: outstanding_amount
        type: text
        value: "{strings.outstanding_amount_format}"
        i18n_params: { amount: "{{loan.summary.principalOutstanding | number}}" }
        style: { text_style: headlineSmall, color: onSurface, font_weight: bold }
      - id: next_repayment_row
        type: row
        visible: "{{loan.status.active}}"
        children:
          - id: next_repayment_text
            type: text
            value: "{strings.next_repayment_format}"
            i18n_params: { amount: "{{loan.nextRepaymentAmount | number}}", date: "{{loan.nextRepaymentDate}}" }
            style: { text_style: bodySmall, color: "{{loan.isOverdue ? error : onSurfaceVariant}}" }
          - id: overdue_icon
            type: icon
            icon: warning_24_filled
            tint: error
            accessibility_label: "{strings.a11y_overdue_icon}"
            visible: "{{loan.isOverdue}}"
      - id: expand_icon
        type: icon
        icon: "{{selectedLoanId == loan.id ? chevron_up_24_regular : chevron_down_24_regular}}"
        tint: onSurfaceVariant
        accessibility_label: "{strings.a11y_expand_icon}"
      - id: repayment_schedule_section
        type: column
        visible_when: "selectedLoanId == loan.id"
        children:
          - id: schedule_header
            type: text
            value: "{strings.repayment_schedule_label}"
            style: { text_style: labelLarge, color: onSurfaceVariant, margin_top: 12dp }
          - id: period_row
            type: list-item
            repeats_for: loan.repaymentSchedule.periods
            accessibility_label: "{strings.a11y_period_row}"
            content:
              leading:
                type: icon
                icon: "{{period.complete ? checkmark_circle_24_filled : circle_24_regular}}"
                tint: "{{period.complete ? primary : onSurfaceVariant}}"
                accessibility_label: "{strings.a11y_period_status}"
              headline:
                type: text
                value: "{strings.period_row_format}"
                i18n_params: { number: "{{period.period}}", date: "{{period.dueDate | date}}" }
              trailing:
                type: text
                value: "{strings.period_amount_format}"
                i18n_params: { amount: "{{period.totalDueForPeriod | number}}" }
                style: { color: "{{period.complete ? primary : onSurface}}" }
    on_click: { action: OnLoanExpand, params: { loanId: "{{loan.id}}" } }
    action_contract:
      effect: transform_state
      description: "Toggles the expanded repayment-schedule panel for the tapped loan by setting selectedLoanId; the repaymentSchedule is pre-fetched on mount so this is a pure state transition with no network call."
      action_contract_hash: "3553817b00b93e1851d2b7099d526fca92ada03065e0e42046b064e2a74d43b7"
      action_contract_author: "claude-via-idea-enrich"
      action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: request_loan_fab
    type: fab
    icon: add_24_filled
    label: "{strings.request_loan_fab}"
    accessibility_label: "{strings.a11y_request_loan_fab}"
    visible: "{{loans.isNotEmpty()}}"
    style: { background: secondary, icon_color: onSecondary, extended: true, corner_radius: full, min_touch_target: 56dp, position: bottom_end }
    on_click: { action: OnRequestLoanClick, target: loan-request }
    action_contract:
      effect: navigate
      description: "Navigates to the loan-request screen via the NavController, forwarding the current clientId nav param so the member can apply for a new loan."
      action_contract_hash: "c15c00d082ade653f39f9c610386d884aa57b2194e8cde4b0641908e8d1d718e"
      action_contract_author: "claude-via-idea-enrich"
      action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: empty_state
    type: empty-state
    icon: money_24_regular
    title: "{strings.empty_title}"
    body: "{strings.empty_subtitle}"
    cta_label: "{strings.request_loan_button}"
    accessibility_label: "{strings.a11y_empty_state}"
    visible: "{{loans.isEmpty() && !isLoading && error == null}}"
    on_click: { action: OnRequestLoanClick, target: loan-request }
    action_contract:
      effect: navigate
      description: "Navigates to the loan-request screen via the NavController when the member has no loans yet, forwarding clientId so they can apply for their first loan."
      action_contract_hash: "fe1208a91bbe4fcc54e309543285550e9d3df1911e7b9435c86da6bf948e83c4"
      action_contract_author: "claude-via-idea-enrich"
      action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: shimmer_loading
    type: shimmer
    count: 3
    accessibility_label: "{strings.a11y_shimmer_loading}"
    visible: "{{isLoading}}"
    style: { height: 120dp, corner_radius: lg, margin_horizontal: 16dp }

  - id: error_state
    type: error-state
    icon: wifi_off_24_filled
    title: "{strings.error_title}"
    body: "{strings.error_subtitle}"
    cta_label: "{strings.retry_button}"
    accessibility_label: "{strings.a11y_error_state}"
    on_click: { action: OnRetry }
    action_contract:
      effect: call_api
      library_refs: ["cmp-network-monitor"]
      external_library_refs: ["ktor-client", "sqldelight"]
      description: "Retries loading the members loans by invalidating the SQLDelight cache and re-fetching Fineract /self/loans over the network; cmp-network-monitor gates the retry so it only fires when connectivity is available."
      action_contract_hash: "26d340d9a5825df34e216e2d60c5443408e78d762918676928f2b9fb976753af"
      action_contract_author: "claude-via-idea-enrich"
      action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: loading
  loading:
    components: [top_bar, filter_chips_row, shimmer_loading]
    description: "Fetching loans"
  content:
    components: [top_bar, filter_chips_row, loan_card, request_loan_fab]
    description: "Loans listed with filter and FAB"
  empty:
    components: [top_bar, empty_state]
    description: "No loans — empty state with CTA"
  error:
    components: [top_bar, filter_chips_row, error_state]
    description: "Load failure"

i18n:
  en:
    screen_title: "My Loans"
    filter_all: "All"
    filter_active: "Active"
    filter_closed: "Closed"
    outstanding_label: "Outstanding"
    outstanding_amount_format: "KES {amount}"
    next_repayment_label: "Next repayment"
    next_repayment_format: "Next: KES {amount} due {date}"
    repayment_schedule_label: "Repayment Schedule"
    period_row_format: "Period #{number} — {date}"
    period_amount_format: "KES {amount}"
    request_loan_fab: "Request Loan"
    request_loan_button: "Request a Loan"
    empty_title: "No loans yet"
    empty_subtitle: "Apply for a loan of up to 3× your savings balance."
    error_title: "Could not load loans"
    error_subtitle: "Check your internet connection and try again."
    retry_button: "Try Again"
    a11y_top_bar: "My loans screen header"
    a11y_back: "Back to personal dashboard"
    a11y_filter_chips: "Filter loans by status"
    a11y_loan_card: "Loan details card, tap to expand repayment schedule"
    a11y_status_chip: "Loan status"
    a11y_overdue_icon: "Overdue warning"
    a11y_expand_icon: "Expand or collapse repayment schedule"
    a11y_period_row: "Repayment period entry"
    a11y_period_status: "Repayment period status"
    a11y_request_loan_fab: "Request a new loan"
    a11y_empty_state: "No loans available, tap to request a loan"
    a11y_shimmer_loading: "Loading loans"
    a11y_error_state: "Failed to load loans, tap Try Again to retry"
