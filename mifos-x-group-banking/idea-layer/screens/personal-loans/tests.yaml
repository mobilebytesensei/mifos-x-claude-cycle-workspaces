sibling: tests
schema_version: "4.0"
feature_id: personal-loans

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-PL-001
      scenario: "Loans list loads on mount — 2 loans shown (1 active, 1 closed)"
      type: ViewModel
      priority: P0
      given: "clientId=101, self-service auth token set"
      when: "Screen mounts"
      then: "get_self_loans called with associations=repaymentSchedule; loans list has 2 items; LON-2025-001 active, LON-2024-007 closed"

    - id: TC-PL-002
      scenario: "Active loan card shows outstanding balance and next repayment row"
      type: Screen
      priority: P0
      given: "Loan LON-2025-001, principalOutstanding=3250.00, nextRepaymentDate='2026-05-20'"
      when: "Screen renders loan_card for active loan"
      then: "outstanding_amount='KES 3,250.00', next_repayment_row visible with due date"

    - id: TC-PL-003
      scenario: "Closed loan card shows Closed chip and hides next repayment row"
      type: Screen
      priority: P0
      given: "Loan LON-2024-007, status.closed=true"
      when: "Screen renders loan_card for closed loan"
      then: "status_chip label='Closed' with surfaceVariant background, next_repayment_row not visible"

    - id: TC-PL-004
      scenario: "Tap active loan card expands repayment schedule with period rows"
      type: ViewModel
      priority: P1
      given: "selectedLoanId=null, loan 5001 in content state"
      when: "OnLoanExpand dispatched with loanId=5001"
      then: "selectedLoanId=5001, repayment_schedule_section visible with 6 period rows"

    - id: TC-PL-005
      scenario: "Completed periods show filled checkmark icon, incomplete periods show empty circle"
      type: Screen
      priority: P1
      given: "Loan 5001 expanded, periods 1-4 complete=true, 5-6 complete=false"
      when: "Screen renders repayment_schedule_section"
      then: "Period 1-4 show checkmark_circle_24_filled with primary tint; periods 5-6 show circle_24_regular with onSurfaceVariant"

    - id: TC-PL-006
      scenario: "Tap expanded loan card again collapses the repayment schedule"
      type: ViewModel
      priority: P1
      given: "selectedLoanId=5001"
      when: "OnLoanExpand dispatched with loanId=5001"
      then: "selectedLoanId=null, repayment_schedule_section hidden"

    - id: TC-PL-007
      scenario: "ACTIVE filter shows only 1 active loan"
      type: ViewModel
      priority: P1
      given: "filterStatus=ALL, 2 loans loaded"
      when: "OnFilterChange dispatched with status=ACTIVE"
      then: "filterStatus=ACTIVE, 1 loan visible (LON-2025-001), no API call"

    - id: TC-PL-008
      scenario: "CLOSED filter shows only 1 closed loan"
      type: ViewModel
      priority: P1
      given: "filterStatus=ALL"
      when: "OnFilterChange dispatched with status=CLOSED"
      then: "filterStatus=CLOSED, 1 loan visible (LON-2024-007)"

    - id: TC-PL-009
      scenario: "FAB visible when loans exist, hidden in empty state"
      type: Screen
      priority: P1
      given: "Content state with 2 loans"
      when: "Screen renders"
      then: "request_loan_fab visible with 'Request Loan' label"

    - id: TC-PL-010
      scenario: "FAB tap navigates to loan-request screen"
      type: ViewModel
      priority: P0
      given: "Content state"
      when: "OnRequestLoanClick dispatched"
      then: "NavigateToLoanRequest event emitted"

    - id: TC-PL-011
      scenario: "Empty state shown with CTA when no loans at all"
      type: Screen
      priority: P1
      given: "loans=emptyList()"
      when: "Screen renders"
      then: "empty_state visible with 'No loans yet' message and 'Request Loan' CTA"

    - id: TC-PL-012
      scenario: "Overdue loan shows warning icon and error color on next repayment text"
      type: Screen
      priority: P0
      given: "Loan with isOverdue=true"
      when: "Screen renders loan_card"
      then: "overdue_icon visible with error tint, next_repayment_text color=error"

    - id: TC-PL-013
      scenario: "Pull-to-refresh reloads loan list bypassing cache"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh dispatched"
      then: "isRefreshing=true, API called bypassing 180s cache, loans replaced"

    - id: TC-PL-014
      scenario: "Unauthorized 401 navigates to login"
      type: ViewModel
      priority: P0
      given: "Self-service token expired"
      when: "Screen mounts"
      then: "LoanError.Unauthorized set, navigate to login"
