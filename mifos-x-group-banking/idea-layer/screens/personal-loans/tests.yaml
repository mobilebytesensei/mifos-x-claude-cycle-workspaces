sibling: tests
schema_version: "4.0"
feature_id: personal-loans

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PL-001
      scenario: "Loans list loads on mount — 2 loans shown (1 active, 1 closed)"
      type: ViewModel
      priority: P0
      given: "clientId=101, self-service auth token set, cache empty"
      when: "Screen mounts and get_self_loans resolves"
      then: "get_self_loans called with associations=repaymentSchedule; loans list has 2 items; LON-2025-001 active, LON-2024-007 closed; screen_state=Content"

    - id: TC-PL-002
      scenario: "Active loan card shows outstanding balance and next repayment row"
      type: Screen
      priority: P0
      given: "Loan LON-2025-001, summary.principalOutstanding=3250.00, nextRepaymentDate='2026-05-20'"
      when: "Screen renders loan_card for active loan"
      then: "outstanding_amount='KES 3,250.00', next_repayment_row visible showing 'Next: KES ... due 2026-05-20'"

    - id: TC-PL-003
      scenario: "Closed loan card shows Closed chip and hides next repayment row"
      type: Screen
      priority: P0
      given: "Loan LON-2024-007, status.closed=true, status.active=false"
      when: "Screen renders loan_card for closed loan"
      then: "status_chip label='Closed' with surfaceVariant background, next_repayment_row not visible (visible bound to loan.status.active)"

    - id: TC-PL-004
      scenario: "Tap active loan card expands repayment schedule with period rows"
      type: ViewModel
      priority: P1
      given: "selectedLoanId=null, loan 5001 in Content state"
      when: "OnLoanExpand dispatched with loanId=5001"
      then: "state.selectedLoanId=5001; no get_self_loans call fired (transform_state effect); repayment_schedule_section becomes visible with its period rows"

    - id: TC-PL-005
      scenario: "Completed periods show filled checkmark icon, incomplete periods show empty circle"
      type: Screen
      priority: P1
      given: "Loan 5001 expanded, periods 1-4 complete=true, 5-6 complete=false"
      when: "Screen renders repayment_schedule_section period_row list"
      then: "Periods 1-4 render checkmark_circle_24_filled with primary tint; periods 5-6 render circle_24_regular with onSurfaceVariant tint"

    - id: TC-PL-006
      scenario: "Tap expanded loan card again collapses the repayment schedule"
      type: ViewModel
      priority: P1
      given: "state.selectedLoanId=5001"
      when: "OnLoanExpand dispatched with loanId=5001"
      then: "state.selectedLoanId=null, repayment_schedule_section hidden, no network call"

    - id: TC-PL-007
      scenario: "ACTIVE filter shows only the 1 active loan client-side"
      type: ViewModel
      priority: P1
      given: "state.filterStatus=ALL, 2 loans loaded (1 active, 1 closed)"
      when: "OnFilterChange dispatched with status=ACTIVE"
      then: "state.filterStatus=ACTIVE, 1 loan visible (LON-2025-001), zero get_self_loans calls (pure transform_state)"

    - id: TC-PL-008
      scenario: "CLOSED filter shows only the 1 closed loan client-side"
      type: ViewModel
      priority: P1
      given: "state.filterStatus=ALL"
      when: "OnFilterChange dispatched with status=CLOSED"
      then: "state.filterStatus=CLOSED, 1 loan visible (LON-2024-007), no network call"

    - id: TC-PL-009
      scenario: "FAB visible when loans exist, hidden in empty state"
      type: Screen
      priority: P1
      given: "Content state with 2 loans (loans.isNotEmpty())"
      when: "Screen renders"
      then: "request_loan_fab visible with 'Request Loan' extended label; hidden when loans.isEmpty()"

    - id: TC-PL-010
      scenario: "FAB tap emits navigation to loan-request forwarding clientId"
      type: ViewModel
      priority: P0
      given: "Content state, clientId=101"
      when: "OnRequestLoanClick dispatched"
      then: "NavigateToLoanRequest event emitted (navigate effect), clientId=101 forwarded as nav param"

    - id: TC-PL-011
      scenario: "Empty state shown with CTA when member has no loans"
      type: Screen
      priority: P1
      given: "loans=emptyList(), isLoading=false, error=null"
      when: "Screen renders"
      then: "empty_state visible with 'No loans yet' title and 'Request a Loan' CTA; loan_card and FAB not shown"

    - id: TC-PL-012
      scenario: "Empty-state CTA tap navigates to loan-request"
      type: ViewModel
      priority: P1
      given: "Empty state (loans=emptyList())"
      when: "OnRequestLoanClick dispatched from empty_state CTA"
      then: "NavigateToLoanRequest event emitted with clientId forwarded"

    - id: TC-PL-013
      scenario: "Overdue loan shows warning icon and error color on next repayment text"
      type: Screen
      priority: P0
      given: "Loan with isOverdue=true, status.active=true"
      when: "Screen renders loan_card"
      then: "overdue_icon (warning_24_filled) visible with error tint, next_repayment_text color=error"

    - id: TC-PL-014
      scenario: "Loading state renders 3 shimmer cards while fetching"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "Loading state rendered"
      then: "shimmer_loading visible with count=3; top_bar and filter_chips_row shown; loan_card hidden"

    - id: TC-PL-015
      scenario: "Pull-to-refresh reloads loan list bypassing the 180s cache"
      type: ViewModel
      priority: P1
      given: "Content state, cached loans within TTL"
      when: "OnRefresh dispatched"
      then: "isRefreshing=true, get_self_loans re-fetched bypassing 180s cache, loans replaced, isRefreshing=false"

    - id: TC-PL-016
      scenario: "Server 503 with no cache surfaces retryable error state"
      type: ViewModel
      priority: P0
      given: "get_self_loans returns 503, SQLDelight cache empty"
      when: "Screen mounts"
      then: "state.error=LoanError.Server(retry=true), screen_state=Error, error_state visible with 'Try Again' CTA"

    - id: TC-PL-017
      scenario: "Error-state retry re-fetches loans over the network"
      type: ViewModel
      priority: P1
      given: "screen_state=Error, NetworkMonitor.isOnline=true"
      when: "OnRetry dispatched from error_state"
      then: "SQLDelight cache invalidated, get_self_loans re-fetched (call_api effect gated by cmp-network-monitor), Content state restored on success"

    - id: TC-PL-018
      scenario: "Offline mount serves stale cached loans (503 fallback_cache)"
      type: Repository
      priority: P1
      given: "NetworkMonitor.isOnline=false, valid SQLDelight cache for clientId=101 keyed 'personal_loans:101'"
      when: "getSelfLoans(associations='repaymentSchedule') invoked"
      then: "Flow emits cached loans stale-while-revalidate, no HTTP call, Content state rendered from cache"

    - id: TC-PL-019
      scenario: "Repository stale-while-revalidate emits cache then network refresh"
      type: Repository
      priority: P1
      given: "Cached loans older than nothing but within revalidate window, NetworkMonitor online"
      when: "getSelfLoans() collected"
      then: "First emission from SQLDelight cache, second emission after Fineract /self/loans refresh with associations=repaymentSchedule"

    - id: TC-PL-020
      scenario: "Unauthorized 401 sets non-retryable error and navigates to login"
      type: ViewModel
      priority: P0
      given: "Self-service token expired"
      when: "Screen mounts and get_self_loans returns 401"
      then: "state.error=LoanError.Unauthorized(retry=false), navigate to login (data-flow 401 -> nav_target=login)"

    - id: TC-PL-021
      scenario: "Back navigation returns to personal-dashboard"
      type: ViewModel
      priority: P2
      given: "Content state"
      when: "NavigateBack dispatched from top_bar navigation icon"
      then: "NavigateBack event emitted, loans destination popped off back stack, returns to personal-dashboard"
