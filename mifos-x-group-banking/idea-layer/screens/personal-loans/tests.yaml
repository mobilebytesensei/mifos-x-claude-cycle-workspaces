sibling: tests
schema_version: "4.0"
feature_id: personal-loans
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PL-001
      scenario: "On mount, personal loans load from LoanRepository with clientId nav_param"
      type: ViewModel
      priority: P0
      given: "nav_params: clientId=5; network online"
      when: "PersonalLoansScreen enters composition"
      then: "LoanRepository.getPersonalLoans(clientId=5) called; loans list populated; PersonalLoansScreenState=Content"

    - id: TC-PL-002
      scenario: "Status filter ALL shows all loans; ACTIVE filter shows only active"
      type: ViewModel
      priority: P0
      given: "loans=[ACTIVE x2, OVERDUE x1, COMPLETED x3]"
      when: "OnFilterChange(LoanStatusFilter.ACTIVE) fires"
      then: "filteredLoans contains 2 ACTIVE loans; selectedFilter=ACTIVE; no network call"

    - id: TC-PL-003
      scenario: "Expandable loan card shows summary; tap expands to show schedule preview"
      type: Screen
      priority: P1
      given: "Content state; loan={id:10, status:ACTIVE, balance:12000.0}"
      when: "OnLoanExpand(10) fires"
      then: "expanded=true; next repayment row shown; full repayment schedule preview visible"

    - id: TC-PL-004
      scenario: "Tapping View Full Schedule navigates to loan-detail with loanId"
      type: Screen
      priority: P1
      given: "loan card expanded; loan.id=10"
      when: "OnViewLoanDetail(10) fires"
      then: "NavigateToLoanDetail emitted with loanId=10"

    - id: TC-PL-005
      scenario: "FAB NavigateToLoanRequest visible when canApplyNewLoan=true"
      type: Screen
      priority: P0
      given: "canApplyNewLoan=true"
      when: "PersonalLoansScreen renders"
      then: "FAB visible; OnApplyLoan → NavigateToLoanRequest with clientId=5"

    - id: TC-PL-006
      scenario: "FAB hidden when canApplyNewLoan=false (e.g. active loan exists)"
      type: Screen
      priority: P1
      given: "canApplyNewLoan=false"
      when: "PersonalLoansScreen renders"
      then: "FAB not visible"

    - id: TC-PL-007
      scenario: "Empty state shown when no loans"
      type: Screen
      priority: P1
      given: "load success; loans.isEmpty()"
      when: "Content evaluation"
      then: "PersonalLoansScreenState=Empty; no loans message; FAB still visible if eligible"

    - id: TC-PL-008
      scenario: "Error state shows retry on network failure"
      type: Screen
      priority: P1
      given: "LoanRepository.getPersonalLoans returns network error"
      when: "load completes"
      then: "PersonalLoansScreenState=Error; retry CTA visible"
