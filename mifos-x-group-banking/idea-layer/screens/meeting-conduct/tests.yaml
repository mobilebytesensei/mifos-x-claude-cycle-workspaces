sibling: tests
schema_version: "4.0"
feature_id: meeting-conduct

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MCN-001
      scenario: "Step 0 loads previous meeting record for review"
      type: ViewModel
      priority: P0
      given: "centerId=1, meetingNumber=5 (current), so fetch meetingNumber=4"
      when: "wizard mounts at step 0"
      then: "GET dt_meeting_record/1?meetingNumber=4 called; MeetingRecordDetail loaded; step 0 renders previous summary"

    - id: TC-MCN-002
      scenario: "Step 0 on first meeting shows placeholder instead of previous record"
      type: Screen
      priority: P1
      given: "GET dt_meeting_record returns 404 (first meeting)"
      when: "step 0 loads"
      then: "'First meeting — no previous record' placeholder shown; wizard can still advance"

    - id: TC-MCN-003
      scenario: "Step 1 loads all 5 group members for attendance checklist"
      type: ViewModel
      priority: P0
      given: "centerId=1"
      when: "wizard advances to step 1"
      then: "GET /centers/1 called; CenterDetail loaded; 5 members (Amina, Joseph, Grace, Peter, Mary) shown"

    - id: TC-MCN-004
      scenario: "All members marked present by default — user can toggle absent"
      type: Screen
      priority: P1
      given: "5 members loaded"
      when: "step 1 renders"
      then: "all 5 attendance toggles show PRESENT; tapping toggles to ABSENT"

    - id: TC-MCN-005
      scenario: "Step 2 shows opening corpus and cash-on-hand from CorpusRecord"
      type: Screen
      priority: P1
      given: "CorpusRecord: corpusBalance=51750, cashOnHand=3500"
      when: "step 2 renders"
      then: "KES 51,750 opening corpus and KES 3,500 cash on hand displayed"

    - id: TC-MCN-006
      scenario: "Step 3 savings entry — per-member savings input with running total"
      type: ViewModel
      priority: P0
      given: "5 members each with default savings of KES 300"
      when: "user enters savings per member"
      then: "running total updates; totalSavingsCollected = sum of all inputs"

    - id: TC-MCN-007
      scenario: "Step 4 shows active loans for repayment with expected weekly amount"
      type: Screen
      priority: P0
      given: "3 active LoanDetails for Amina (700), Joseph (600), Grace (500)"
      when: "step 4 renders"
      then: "each member's expected repayment pre-filled; editable; overdue indicator on Joseph's"

    - id: TC-MCN-008
      scenario: "Step 5 loan voting — vote For/Against/Abstain recorded per member"
      type: ViewModel
      priority: P1
      given: "pending loan application for Peter (8,000 KES); LoanVoteRecord: votesFor=0"
      when: "user votes FOR Peter's loan"
      then: "votesFor incremented locally; majority check runs; approve button enabled if quorum met"

    - id: TC-MCN-009
      scenario: "Submit sequence: record → attendance → savings → repayments → disbursals → corpus"
      type: ViewModel
      priority: P0
      given: "all wizard steps complete, network online"
      when: "user taps Submit"
      then: "API calls made in priority order 1-6; all succeed; navigate to meeting-summary"

    - id: TC-MCN-010
      scenario: "Offline submit queues entire meeting payload to SyncQueue"
      type: ViewModel
      priority: P0
      given: "network.offline, wizard complete"
      when: "user taps Submit"
      then: "SyncQueueEntry created for each operation (CREATE_MEETING_RECORD, CREATE_MEETING_ATTENDANCE, etc.); success message shown; navigate to meeting-summary with in-memory data"

    - id: TC-MCN-011
      scenario: "Corpus gate blocks loan disbursal if closing corpus would go negative"
      type: ViewModel
      priority: P0
      given: "openingCorpus=51750, proposedDisbursal=60000 (exceeds corpus)"
      when: "corpus gate check runs before disbursal"
      then: "error: error_corpus_gate_violation; disbursal blocked; wizard shows warning on step 5"

    - id: TC-MCN-012
      scenario: "Partial failure queues failed calls while succeeding ones commit"
      type: ViewModel
      priority: P1
      given: "network drops mid-submission after meeting_record posted"
      when: "attendance POST fails with 5xx"
      then: "remaining calls queued to SyncQueue with correct priorities; partial state tracked"

    - id: TC-MCN-013
      scenario: "Wizard step guard — cannot advance past step 1 without members loaded"
      type: Screen
      priority: P1
      given: "GET /centers/{centerId} returns 404"
      when: "user tries to advance from step 1"
      then: "error banner shown; Next button disabled"

    - id: TC-MCN-014
      scenario: "MeetingRepository.postMeetingRecord serializes CreateMeetingRecordRequest"
      type: Repository
      priority: P0
      given: "all meeting data collected from wizard"
      when: "postMeetingRecord() called"
      then: "POST body includes centerId, meetingNumber, actualDate, totalSavings, attendanceCount"
