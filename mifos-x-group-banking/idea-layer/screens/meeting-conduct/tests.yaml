sibling: tests
schema_version: "4.0"
feature_id: meeting-conduct
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MCO-001
      scenario: "On mount, meeting data loads and wizard starts at step 1 (attendance)"
      type: ViewModel
      priority: P0
      given: "meetingId=5; groupId=1; network online"
      when: "MeetingConductScreen enters composition"
      then: "MeetingRepository.getMeeting(5) called; members list loaded; currentStep=ATTENDANCE; MeetingConductScreenState=Content"

    - id: TC-MCO-002
      scenario: "Attendance step marks member present/absent via OnToggleAttendance"
      type: ViewModel
      priority: P0
      given: "currentStep=ATTENDANCE; member.id=3; member.isPresent=false"
      when: "OnToggleAttendance(memberId=3) fires"
      then: "member.id=3 isPresent=true; attendanceCount incremented"

    - id: TC-MCO-003
      scenario: "OnNextStep advances wizard from ATTENDANCE to SAVINGS_COLLECTION"
      type: ViewModel
      priority: P0
      given: "currentStep=ATTENDANCE; ≥1 member marked present"
      when: "OnNextStep fires"
      then: "currentStep=SAVINGS_COLLECTION; step progress indicator at step 2"

    - id: TC-MCO-004
      scenario: "Savings step records collection amount per member"
      type: ViewModel
      priority: P0
      given: "currentStep=SAVINGS_COLLECTION; member.id=3"
      when: "OnSavingsEntryChange(memberId=3, amount='500') fires"
      then: "member.id=3 savingsAmount='500'; total savings sum updated"

    - id: TC-MCO-005
      scenario: "Loans step records loan disbursement for approved loans"
      type: ViewModel
      priority: P1
      given: "currentStep=LOAN_DISBURSEMENT; pendingLoan.loanId=10"
      when: "OnDisburseLoan(loanId=10) fires"
      then: "loan.id=10 marked disbursed; disbursedLoans list updated"

    - id: TC-MCO-006
      scenario: "Votes step records resolution outcome"
      type: ViewModel
      priority: P1
      given: "currentStep=VOTES; resolution.id=2"
      when: "OnVoteRecord(resolutionId=2, outcome=PASSED) fires"
      then: "resolution.id=2 outcome=PASSED; votes tally updated"

    - id: TC-MCO-007
      scenario: "OnSubmit when offline queues meeting data to sync_queue"
      type: ViewModel
      priority: P0
      given: "all steps complete; cmp-network-monitor reports offline"
      when: "OnSubmit fires"
      then: "sync_queue meeting entry created; MeetingConductScreenState=OfflineQueued; success banner shown"

    - id: TC-MCO-008
      scenario: "OnSubmit when online POSTs meeting outcomes to companion API and emits MeetingCompleted"
      type: ViewModel
      priority: P0
      given: "all steps complete; network online"
      when: "OnSubmit fires"
      then: "isSubmitting=true; POST /companion/groups/{groupId}/meetings/{meetingId}/complete called; on 200 MeetingCompleted event emitted; NavigateToMeetingSummary with meetingId"

    - id: TC-MCO-009
      scenario: "Back from first step shows abort confirmation dialog"
      type: Screen
      priority: P1
      given: "currentStep=ATTENDANCE"
      when: "system back pressed"
      then: "AbortMeetingConfirmDialog shown; OnAbort → NavigateBack; OnContinue → stays on ATTENDANCE"

    - id: TC-MCO-010
      scenario: "OnPreviousStep moves wizard one step back"
      type: ViewModel
      priority: P1
      given: "currentStep=SAVINGS_COLLECTION"
      when: "OnPreviousStep fires"
      then: "currentStep=ATTENDANCE"

    - id: TC-MCO-011
      scenario: "Error state shows retry on meeting load failure"
      type: Screen
      priority: P1
      given: "MeetingRepository.getMeeting returns network error"
      when: "load completes"
      then: "MeetingConductScreenState=Error; retry CTA visible"

    - id: TC-MCO-012
      scenario: "Step progress indicator shows correct step number out of 7"
      type: Screen
      priority: P2
      given: "currentStep=LOAN_DISBURSEMENT (step 3 of 7)"
      when: "wizard renders"
      then: "step indicator shows 3/7; steps 1-2 complete; steps 4-7 pending"
