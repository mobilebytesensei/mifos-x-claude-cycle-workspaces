sibling: data-flow
schema_version: "2.1.0"
feature_id: meeting-conduct

entries:
  - screen_id: meetingConductScreen
    trigger: on_mount
    description: Step 0 — load previous meeting record for read-only summary review card (PreviousMeetingSummary drives step0_previous_review)
    endpoints:
      - { api_id: get_previous_meeting_record, transport: rest, method: get }
    dtos:
      - { name: MeetingRecordDetail, role: response, api_id: get_previous_meeting_record }
      - { name: PreviousMeetingSummary, role: projection, api_id: get_previous_meeting_record }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 600
      key_template: "meeting_conduct:prev_record:group:{groupId}"
    error_paths:
      - { error_code: "404", behavior: show_empty, message_key: error_first_meeting_no_previous }
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "5xx", behavior: show_warning, message_key: error_server_continue_anyway }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline_cached }

  - screen_id: meetingConductScreen
    trigger: on_mount
    description: Load group members for attendance (step 1) + savings (step 3) repeater rows — groupMembers state field drives attendance_member_row and savings_member_row
    endpoints:
      - { api_id: get_group_members, transport: rest, method: get }
    dtos:
      - { name: GroupDetail, role: response, api_id: get_group_members }
      - { name: GroupMember, role: projection, api_id: get_group_members }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 600
      key_template: "meeting_conduct:members:group:{groupId}"
    error_paths:
      - { error_code: "404", behavior: show_error, message_key: error_group_members_required }
      - { error_code: "401", behavior: navigate, nav_target: login }

  - screen_id: meetingConductScreen
    trigger: on_mount
    description: Load opening corpus balance for step 2 financial summary card and persistent corpus_band (steps 2-6)
    endpoints:
      - { api_id: get_group_corpus, transport: rest, method: get }
    dtos:
      - { name: CorpusRecord, role: response, api_id: get_group_corpus }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "meeting_conduct:corpus:group:{groupId}"
    error_paths:
      - { error_code: "404", behavior: fallback_default, message_key: error_corpus_default_zero }
      - { error_code: "5xx", behavior: show_warning, message_key: error_corpus_warning }

  - screen_id: meetingConductScreen
    trigger: on_mount
    description: Load active loans for step 4 repayment entry — LoanDetail response projected to LoanSummary for the activeLoans state field driving loan_review_row
    endpoints:
      - { api_id: get_active_loans, transport: rest, method: get }
    dtos:
      - { name: LoanListResponse, role: response, api_id: get_active_loans }
      - { name: LoanDetail, role: response, api_id: get_active_loans }
      - { name: LoanSummary, role: projection, api_id: get_active_loans }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 180
      key_template: "meeting_conduct:active_loans:group:{groupId}"
    error_paths:
      - { error_code: "404", behavior: show_empty, message_key: error_no_active_loans }
      - { error_code: "5xx", behavior: show_error, message_key: error_server }

  - screen_id: meetingConductScreen
    trigger: on_interact
    description: Step 5 — fetch vote tally per pending loan application for vote_tally chip + chairperson approve gate
    endpoints:
      - { api_id: get_loan_votes, transport: rest, method: get }
    dtos:
      - { name: LoanVoteRecord, role: response, api_id: get_loan_votes }
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "meeting_conduct:loan_votes:{loanId}"
    error_paths:
      - { error_code: "404", behavior: fallback_default, message_key: error_no_votes_yet }

  - screen_id: meetingConductScreen
    trigger: on_interact
    description: Submit wizard — POST meeting record (priority 1, first in ordered SubmitMeeting action_contract sequence)
    endpoints:
      - { api_id: post_meeting_record, transport: rest, method: post }
    dtos:
      - { name: CreateMeetingRecordRequest, role: request, api_id: post_meeting_record }
      - { name: DataTableEntryResponse, role: response, api_id: post_meeting_record }
    produces_state: Submitting
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "meeting_conduct:submit:group:{groupId}"
    error_paths:
      - { error_code: "400", behavior: show_error, message_key: error_validation }
      - { error_code: "5xx", behavior: queue_sync, message_key: error_offline_queued }
      - { error_code: "network.offline", behavior: queue_sync, message_key: error_offline_queued }

  - screen_id: meetingConductScreen
    trigger: on_interact
    description: Submit wizard — POST per-member attendance records (priority 2, one call per member)
    endpoints:
      - { api_id: post_meeting_attendance, transport: rest, method: post }
    dtos:
      - { name: CreateAttendanceRequest, role: request, api_id: post_meeting_attendance }
      - { name: DataTableEntryResponse, role: response, api_id: post_meeting_attendance }
    produces_state: Submitting
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "meeting_conduct:attendance:{memberId}"
    error_paths:
      - { error_code: "5xx", behavior: queue_sync, message_key: error_queued_attendance }

  - screen_id: meetingConductScreen
    trigger: on_interact
    description: Submit wizard — POST savings deposits per member per SavingsType (priority 3, one call per savings entry)
    endpoints:
      - { api_id: post_savings_transaction, transport: rest, method: post }
    dtos:
      - { name: SavingsTransactionRequest, role: request, api_id: post_savings_transaction }
    produces_state: Submitting
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "meeting_conduct:savings:{savingsId}"
    error_paths:
      - { error_code: "5xx", behavior: queue_sync, message_key: error_queued_savings }

  - screen_id: meetingConductScreen
    trigger: on_interact
    description: Submit wizard — POST loan repayments (priority 4, one call per non-zero loanRepayments entry)
    endpoints:
      - { api_id: post_loan_repayment, transport: rest, method: post }
    dtos:
      - { name: LoanRepaymentRequest, role: request, api_id: post_loan_repayment }
    produces_state: Submitting
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "meeting_conduct:repayment:{loanId}"
    error_paths:
      - { error_code: "5xx", behavior: queue_sync, message_key: error_queued_repayment }

  - screen_id: meetingConductScreen
    trigger: on_interact
    description: Submit wizard — POST loan disbursals for chairperson-approved applications (priority 5, corpus-gated)
    endpoints:
      - { api_id: post_loan_disbursal, transport: rest, method: post }
    dtos:
      - { name: LoanDisbursalRequest, role: request, api_id: post_loan_disbursal }
    produces_state: Submitting
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "meeting_conduct:disbursal:{loanId}"
    error_paths:
      - { error_code: "400", behavior: show_error, message_key: error_corpus_gate_violation }
      - { error_code: "5xx", behavior: queue_sync, message_key: error_queued_disbursal }

  - screen_id: meetingConductScreen
    trigger: on_interact
    description: Submit wizard — PATCH corpus balance to closingCorpus after all transactions complete (priority 6, terminal step of SubmitMeeting sequence)
    endpoints:
      - { api_id: patch_corpus, transport: rest, method: put }
    dtos:
      - { name: UpdateCorpusRequest, role: request, api_id: patch_corpus }
    produces_state: SubmitSuccess
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "meeting_conduct:corpus_update:group:{groupId}"
    error_paths:
      - { error_code: "5xx", behavior: queue_sync, message_key: error_queued_corpus_update }

