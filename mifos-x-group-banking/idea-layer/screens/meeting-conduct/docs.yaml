  - has_offline_cache
  - has_form_input

id: meeting-conduct
name: Meeting Conduct
description: >
  THE CORE SCREEN — multi-step wizard (7 steps, 0-indexed) for conducting a weekly
  group meeting. FR-003/FR-004/FR-006/FR-012/FR-017/FR-019/FR-020. Steps: Previous
  Meeting Review (0), Attendance (1), Opening Balance (2), Savings Collection (3),
  Loan Review (4), Loan Applications (5), Closing Balance (6). Full offline-first
  support via SyncQueue. All data queued when connectivity absent and synced on
  reconnect. Wizard state persisted to local DB on each step advance. Corpus gate
  blocks loan disbursement when closing corpus would go negative.
feature: meeting-lifecycle
flow: meeting-lifecycle-flow
version: "1.0.0"
tags: [meetings, wizard, admin, offline-first, attendance, savings, loans, core, meeting-lifecycle]
status: designed
quality_score: 92
status_history:
  - status: draft
    at: "2026-05-05T00:00:00Z"
  - status: enriched
    at: "2026-05-05T00:00:00Z"
  - status: designed
    at: "2026-05-08T23:00:00Z"
entry_point: false
bottom_nav: false

legacy_metadata:
  analytics:
    screen_viewed:
      event: screen_viewed
      params:
        screen_id: meeting-conduct
        flow: meeting-lifecycle-flow
    events:
      - name: meeting_started
        params: { meeting_number: Int, center_id: Int, member_count: Int, opening_corpus: Long }
      - name: step_advanced
        params: { from_step: Int, to_step: Int, meeting_number: Int, center_id: Int }
      - name: attendance_recorded
        params: { member_id: String, status: String, meeting_number: Int }
      - name: savings_recorded
        params: { member_id: String, type: String, amount: Long, meeting_number: Int }
      - name: loan_repayment_entered
        params: { loan_id: String, amount: Long, meeting_number: Int }
      - name: loan_voted
        params: { loan_id: String, vote: String, application_amount: Long, meeting_number: Int }
      - name: meeting_submitted
        params: { meeting_number: Int, center_id: Int, total_savings: Long, total_repayments: Long, total_fines: Long, total_disbursed: Long, closing_corpus: Long, is_offline: Boolean, member_count: Int }
      - name: corpus_gate_triggered
        params: { loan_id: String, requested_amount: Long, available_corpus: Long, meeting_number: Int }
