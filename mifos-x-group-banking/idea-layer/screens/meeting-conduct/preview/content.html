<!doctype html>
<html lang="en" data-feature="meeting-conduct" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>meeting-conduct · content · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .mc-stepper { display:flex; align-items:center; gap:0; padding:10px 8px; overflow-x:auto; background:var(--bg-canvas); border-bottom:1px solid var(--border-subtle); }
  .mc-step { display:flex; flex-direction:column; align-items:center; gap:4px; flex:0 0 auto; min-width:48px; }
  .mc-step .node { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; background:var(--bg-muted); color:var(--text-secondary); }
  .mc-step.done .node { background:var(--primary-100); color:var(--primary-900); }
  .mc-step.current .node { background:var(--primary-700); color:#fff; }
  .mc-step .lbl { font-size:10px; color:var(--text-secondary); white-space:nowrap; }
  .mc-step.current .lbl { color:var(--text-primary); font-weight:600; }
  .mc-connector { flex:1 1 auto; height:2px; min-width:8px; background:var(--border-default); align-self:flex-start; margin-top:13px; }
  .mc-connector.done { background:var(--primary-100); }
  .review .kv-grid { grid-template-columns: 1fr auto; }
  .mc-footer { position:sticky; bottom:0; display:flex; gap:12px; padding:12px 16px; background:var(--bg-canvas); border-top:1px solid var(--border-subtle); box-shadow:0 -1px 3px rgba(0,0,0,.06); }
</style>
</head>
<body>
<div class="app-shell" data-shell="wizard">
  <div class="status-bar"><span>9:41</span><span>●● 3G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="meeting-calendar" data-action-id="NavigateBack" aria-label="Close wizard">✕</button>
    <h1>Meeting #4 — Review · Step 1 of 7</h1>
    <span class="sync-badge">✓ Online</span>
  </header>

  <nav class="mc-stepper" aria-label="Wizard steps">
    <div class="mc-step current"><span class="node">1</span><span class="lbl">Review</span></div>
    <div class="mc-connector"></div>
    <div class="mc-step"><span class="node">2</span><span class="lbl">Attendance</span></div>
    <div class="mc-connector"></div>
    <div class="mc-step"><span class="node">3</span><span class="lbl">Balance</span></div>
    <div class="mc-connector"></div>
    <div class="mc-step"><span class="node">4</span><span class="lbl">Savings</span></div>
    <div class="mc-connector"></div>
    <div class="mc-step"><span class="node">5</span><span class="lbl">Loans</span></div>
    <div class="mc-connector"></div>
    <div class="mc-step"><span class="node">6</span><span class="lbl">Apply</span></div>
    <div class="mc-connector"></div>
    <div class="mc-step"><span class="node">7</span><span class="lbl">Close</span></div>
  </nav>

  <main>
    <p class="footnote" style="margin-bottom:12px;">Review the last meeting's record before starting Meeting&nbsp;#4.</p>

    <div class="card review">
      <h3>Previous Meeting</h3>
      <div class="kv-grid">
        <span class="k">Meeting</span><span class="v">#3</span>
        <span class="k">Date</span><span class="v text">28 Apr 2026</span>
        <span class="k">Total Collected</span><span class="v">KES 1,850</span>
        <span class="k">Closing Corpus</span><span class="v">KES 12,400</span>
        <span class="k">Attendance</span><span class="v">5 / 5</span>
      </div>
    </div>

    <button class="btn btn-secondary btn-full" data-action="ViewFullPreviousMeeting" data-nav-to="previous-meeting-review" data-nav-params='{"meeting_id":3,"group_id":7}'>View Full Report</button>
  </main>

  <div class="mc-footer">
    <button class="btn btn-primary btn-full" data-state-to="step_2_attendance" data-action-id="NextStep">Next</button>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
