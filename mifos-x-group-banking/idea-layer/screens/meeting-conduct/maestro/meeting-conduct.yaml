# ─────────────────────────────────────────────────────────────────────────────
# E2E — meeting-conduct : calendar Start-Meeting → 7-step wizard (Content step 0→1)
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (GroupBankingNavHost §9d ← §9c meeting-calendar `onNavigateToConduct`):
#   login(ORGANIZER) → group-dashboard → View Meetings → meeting-calendar → Start Meeting.
# Backend seed required: ORGANIZER account, a group, and an UPCOMING meeting (Start-Meeting
#   CTA). Full submit → meeting-summary needs per-member attendance/savings/loan data that
#   is seed-specific; this flow exercises the reachable wizard prefix (step 0 → step 1) and
#   documents the submit tail in the sibling .assertions.md (no faked submit).
# TestTags: MeetingConductTestTags.kt (+ MeetingCalendar/GroupDashboard/GroupList/Organizer).
appId: org.mifos.groupbanking
name: e2e — meeting-conduct (wizard content + step advance)
tags:
  - e2e
  - group-banking
  - meeting-conduct
env:
  ORGANIZER_USER: "organizer@demo.mifos"
  ORGANIZER_PASS: "Demo1234!"
---
# --- guaranteed prefix: fresh launch + login ---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: ${ORGANIZER_USER}
- tapOn:
    id: "login_signup_field_password"
- inputText: ${ORGANIZER_PASS}
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- nav to meeting-calendar → Start Meeting ---
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "organizer_dashboard_nav_group_list_card"
- assertVisible:
    id: "group_list_screen"
- tapOn:
    id: "group_list_card_"
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "group_dashboard_view_meetings_button"
- extendedWaitUntil:
    visible:
      id: "meeting_calendar_screen"
    timeout: 20000
- tapOn:
    id: "meeting_calendar_start_meeting_button"    # requires seeded UPCOMING meeting

# --- state: Loading → Content (wizard step 0 = Previous-Meeting Review) ---
- extendedWaitUntil:
    visible:
      id: "meeting_conduct_screen"
    timeout: 20000
- assertVisible:
    id: "meeting_conduct_stepper"                  # Content: sticky 7-step stepper
- assertVisible:
    id: "meeting_conduct_step0_previous_review"    # Content: step-0 body

# --- primary on_click: Next footer → advance to step 1 (Attendance) ---
# step 0 has no validation gate, so Next always advances to step 1.
- tapOn:
    id: "meeting_conduct_next_footer_button"
- assertVisible:
    id: "meeting_conduct_step1_attendance"         # step-1 body rendered
