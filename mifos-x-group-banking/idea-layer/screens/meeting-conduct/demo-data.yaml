sibling: demo-data
schema_version: "2.1.0"
feature_id: meeting-conduct

entries:
  - dto: MeetingRecordDetail
    count_hint: 1
    source_notes: >
      Previous meeting REST record (Meeting #4, 05 May 2026) returned by
      get_previous_meeting_record. Read-only, projected into PreviousMeetingSummary
      for the step0_previous_review card. 5 members attended, totals reflect a
      typical prior meeting closing the cycle before the #5 wizard now in progress.
    items:
      - meetingNumber: 4
        actualDate: "05 May 2026"
        totalSavings: 1500
        totalRepayments: 1000
        totalLoansDisbursed: 8000
        totalFinesCollected: 0
        closingCorpus: 51750
        attendanceCount: 5

  - dto: GroupDetail
    count_hint: 1
    source_notes: >
      Group detail for Mwangaza Women's Group (groupId=1) returned by
      get_group_members. Includes all 5 active client members. Projected into the
      GroupMember list that backs the attendance_member_row (step 1) and
      savings_member_row (step 3) repeaters.
    items:
      - id: 1
        name: "Mwangaza Women's Group"
        groups:
          - id: 10
            name: "Mwangaza Core"
        activeClientMembers:
          - clientId: 1001
            clientName: "Amina Wangari"
            mobileNo: "+254700000001"
            savingsAccountId: "SAV-1001-GRP"
          - clientId: 1002
            clientName: "Joseph Otieno"
            mobileNo: "+254700000002"
            savingsAccountId: "SAV-1002-GRP"
          - clientId: 1003
            clientName: "Grace Wanjiku"
            mobileNo: "+254700000003"
            savingsAccountId: "SAV-1003-GRP"
          - clientId: 1004
            clientName: "Peter Kamau"
            mobileNo: "+254700000004"
            savingsAccountId: "SAV-1004-GRP"
          - clientId: 1005
            clientName: "Mary Achieng"
            mobileNo: "+254700000005"
            savingsAccountId: "SAV-1005-GRP"

  - dto: CorpusRecord
    count_hint: 1
    source_notes: >
      Opening corpus for Meeting #5 returned by get_group_corpus. Accumulated from
      4 previous meetings. corpusBalance drives openingCorpus / the persistent
      corpus_band on steps 2-6, cashOnHand renders the cash_on_hand_card on step 2
      and gates disbursement on step 5.
    items:
      - groupId: 1
        corpusBalance: 51750
        cashOnHand: 3500
        lastUpdatedMeeting: 4
        lastUpdatedDate: "2026-05-05"

  - dto: LoanDetail
    count_hint: 3
    source_notes: >
      Active loans returned by get_active_loans (raw REST response DTO). Weekly
      installments based on principal / number of repayments. KES 500–1,200 expected
      per member per week. Includes one overdue loan (5002, Joseph Otieno) which
      surfaces the overdue_chip + fine_input on the step 4 loan_review_row.
    items:
      - loanId: "5001"
        clientId: "1001"
        clientName: "Amina Wangari"
        principal: 8000
        outstandingBalance: 5600
        isOverdue: false
        weekNumber: 4
        numberOfRepayments: 16
        expectedWeeklyRepayment: 700

      - loanId: "5002"
        clientId: "1002"
        clientName: "Joseph Otieno"
        principal: 12000
        outstandingBalance: 9600
        isOverdue: true
        weekNumber: 4
        numberOfRepayments: 20
        expectedWeeklyRepayment: 600

      - loanId: "5003"
        clientId: "1003"
        clientName: "Grace Wanjiku"
        principal: 5000
        outstandingBalance: 3000
        isOverdue: false
        weekNumber: 4
        numberOfRepayments: 10
        expectedWeeklyRepayment: 500

  - dto: LoanApplication
    count_hint: 2
    source_notes: >
      Pending loan applications rendered as vote cards in Step 5 via
      `pendingLoanApplications: List<LoanApplication>`. Backs the
      `{{application.memberName}} / {{application.requestedAmount}} /
      {{application.purpose}}` template bindings and the vote / approve on_click
      params keyed on `{{application.id}}` (loan_id). Two applications for the
      current meeting: Peter Kamau's KES 8,000 school-fees ask and Mary Njeri's
      KES 4,500 stock-purchase ask.
    items:
      - id: "PENDING-5004-NEW"
        memberId: "1004"
        memberName: "Peter Kamau"
        requestedAmount: 8000
        purpose: "School fees for two children — Term 3"
      - id: "PENDING-5005-NEW"
        memberId: "1005"
        memberName: "Mary Njeri"
        requestedAmount: 4500
        purpose: "Restock produce stall ahead of harvest week"

  - dto: LoanVoteRecord
    count_hint: 2
    source_notes: >
      Vote tally per pending loan application, keyed by application.id. Backs
      `{{loanVotes[application.id].votesFor}} / .votesAgainst / .votesAbstain`
      in Step 5 and the CHAIRPERSON approve gate
      `enabled_when: currentUserRole == CHAIRPERSON && loanVotes[application.id].votesFor > loanVotes[application.id].votesAgainst`.
    items:
      - loanId: "PENDING-5004-NEW"
        votesFor: 4
        votesAgainst: 0
        votesAbstain: 1
      - loanId: "PENDING-5005-NEW"
        votesFor: 3
        votesAgainst: 1
        votesAbstain: 1

  - dto: PreviousMeetingSummary
    count_hint: 1
    source_notes: >
      Read-only prior-meeting recap rendered on Step 0 (step0_previous_review) via the
      previousMeetingSummary state field: {{previousMeetingSummary.meetingNumber/date/
      totalCollected/corpusAtClose/attendanceCount}}. Reflects Meeting #4 (05 May 2026)
      closing the cycle before the #5 wizard now in progress; corpusAtClose becomes the
      openingCorpus of the current meeting.
    items:
      - meetingId: "mtg-004"
        meetingNumber: 4
        date: "05 May 2026"
        totalCollected: 2500
        corpusAtClose: 51750
        attendanceCount: 5

  - dto: GroupMember
    count_hint: 5
    source_notes: >
      Per-member rows backing the attendance + savings-collection lists in Steps 1 and 3
      via `groupMembers: List<GroupMember>` in state_model. Fields ({{member.name}},
      {{member.initials}}, {{member.role}}, {{member.memberId}}) are consumed by
      attendance_member_row + savings_member_row repeaters. Mirrors GroupDetail's
      activeClientMembers count (5) so member.memberId ↔ savingsAccountId alignment holds.
    items:
      - memberId: "m-101"
        name: "Amina Wanjiru"
        initials: "AW"
        role: "TREASURER"
      - memberId: "m-102"
        name: "Peter Otieno"
        initials: "PO"
        role: "MEMBER"
      - memberId: "m-103"
        name: "Grace Achieng"
        initials: "GA"
        role: "SECRETARY"
      - memberId: "m-104"
        name: "John Kamau"
        initials: "JK"
        role: "CHAIRPERSON"
      - memberId: "m-105"
        name: "Mary Njeri"
        initials: "MN"
        role: "MEMBER"

  - dto: LoanSummary
    count_hint: 3
    source_notes: >
      Active loans rendered in Step 4 (loan_review_row) via `activeLoans: List<LoanSummary>`
      in state_model. Distinct from LoanDetail (which is the REST response DTO) — LoanSummary
      is the view-model projection with pre-computed memberInitials for the row avatar.
      Three loans matching the LoanDetail count and clientId/loanId alignment (5001/5002/5003).
    items:
      - loanId: "5001"
        memberId: "1001"
        memberName: "Amina Wangari"
        memberInitials: "AW"
        principal: 8000
        outstandingBalance: 5600
        isOverdue: false
        weekNumber: 4
        expectedWeeklyRepayment: 700
      - loanId: "5002"
        memberId: "1002"
        memberName: "Joseph Otieno"
        memberInitials: "JO"
        principal: 12000
        outstandingBalance: 9600
        isOverdue: true
        weekNumber: 4
        expectedWeeklyRepayment: 600
      - loanId: "5003"
        memberId: "1003"
        memberName: "Grace Wanjiku"
        memberInitials: "GW"
        principal: 5000
        outstandingBalance: 3000
        isOverdue: false
        weekNumber: 4
        expectedWeeklyRepayment: 500

  - dto: SavingsEntry
    count_hint: 5
    source_notes: >
      Per-member savings amounts entered in Step 3 (savings_member_row), backing the
      `savingsMap: Map<String, SavingsEntry>` state field. groupAmount reflects the FR-020
      KES 200 minimum contribution; individualAmount is optional voluntary savings.
      One entry per GroupMember (5 total) demonstrating a mixed set — a couple of members
      at the KES 200 floor, others contributing above with optional individual amounts.
    items:
      - memberId: "m-101"
        groupAmount: 300
        individualAmount: 200
      - memberId: "m-102"
        groupAmount: 200
        individualAmount: 0
      - memberId: "m-103"
        groupAmount: 250
        individualAmount: 100
      - memberId: "m-104"
        groupAmount: 400
        individualAmount: 500
      - memberId: "m-105"
        groupAmount: 200
        individualAmount: 0

