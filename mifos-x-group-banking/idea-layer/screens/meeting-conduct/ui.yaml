requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: meeting-conduct

route: /meetings/{meetingId}/conduct
entry_points:
  - source: meeting-calendar
    trigger: user_taps_start_meeting_on_upcoming_card
nav_params:
  meetingId: { type: String, required: true }
  meetingNumber: { type: Int, required: true }
  groupId: { type: Int, required: true }

screens:
  - id: meeting-conduct-screen
    name: MeetingConductScreen
    type: wizard
    description: >
      Full-screen wizard with sticky top stepper, back/next navigation footer,
      and step-specific content in the body. Corpus balance shown in persistent
      header band throughout steps 2-6. Step 0 is a read-only preview;
      steps 1-6 require explicit user input before advancing.
    layout: "Column (TopAppBar + StepperHeader + CorpusBand(conditional) + StepContent + NavigationFooter)"

business_logic:
  kind: composite
  description: "Stateful 7-step meeting wizard: loads members, corpus and active loans via Fineract REST, then records attendance, savings, loan repayments, votes and disbursements in local state. On submit it sequences POSTs through the Fineract collection-sheet backend; when offline it persists the payload to a SQLDelight sync_queue and drains it via Store5 on reconnect."
  library_refs: [cmp-network-monitor]
  external_library_refs: [fineract-rest, sqldelight, store5]
  description_hash: "413a5d47e53974752b6bea089629690bf2c0861508b802ef0b233be6df8b8f79"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

state_model:
  MeetingConductViewModel:
    state:
      name: MeetingConductState
      fields:
        currentStep: { type: Int, default: "0" }
        totalSteps: { type: Int, default: "7" }
        meetingId: { type: String, default: '""' }
        meetingNumber: { type: Int, default: "0" }
        groupId: { type: Int, default: "0" }
        previousMeetingSummary: { type: "PreviousMeetingSummary?", default: "null" }
        groupMembers: { type: "List<GroupMember>", default: "emptyList()" }
        attendanceMap: { type: "Map<String, AttendanceStatus>", default: "emptyMap()" }
        lateFines: { type: "Map<String, Long>", default: "emptyMap()" }
        absentFines: { type: "Map<String, Long>", default: "emptyMap()" }
        openingCorpus: { type: Long, default: "0L" }
        cashOnHand: { type: Long, default: "0L" }
        savingsMap: { type: "Map<String, SavingsEntry>", default: "emptyMap()" }
        runningSavingsTotal: { type: Long, default: "0L" }
        activeLoans: { type: "List<LoanSummary>", default: "emptyList()" }
        loanRepayments: { type: "Map<String, Long>", default: "emptyMap()" }
        loanFines: { type: "Map<String, Long>", default: "emptyMap()" }
        pendingLoanApplications: { type: "List<LoanApplication>", default: "emptyList()" }
        loanVotes: { type: "Map<String, LoanVote>", default: "emptyMap()" }
        closingCorpus: { type: Long, default: "0L" }
        totalCashCollected: { type: Long, default: "0L" }
        totalLoansDisbursed: { type: Long, default: "0L" }
        totalRepayments: { type: Long, default: "0L" }
        totalFinesCollected: { type: Long, default: "0L" }
        isSubmitting: { type: Boolean, default: "false" }
        isOffline: { type: Boolean, default: "false" }
        submitError: { type: "String?", default: "null" }
        stepValidationError: { type: "String?", default: "null" }
        isSavingProgress: { type: Boolean, default: "false" }
    screen_state:
      name: MeetingConductScreenState
      members:
        - Loading: initial data fetch in progress
        - Content: wizard active, step content rendered per currentStep
        - Submitting: API calls in flight after Submit tapped (overlay shown)
        - SubmitSuccess: brief toast then navigate to meeting-summary
        - SubmitError: error snackbar with offline queue fallback confirmation
    errors:
      CorpusInsufficient: "Corpus balance insufficient to disburse this loan. Current corpus: KES {{currentCorpus}}."
      AttendanceIncomplete: "Please record attendance for all {{totalMembers}} members before proceeding."
      SavingsValidation: "Savings amount cannot exceed KES 10,000 per member per meeting."
      SubmitFailed: "Meeting submission failed. Data saved offline and will sync when connected."
      MinContributionNotMet: "{{member_name}} has not met the minimum contribution of KES {{min_amount}}."
      RepaymentExceedsBalance: "Repayment amount exceeds outstanding balance for {{member_name}}."
    events:
      name: MeetingConductEvent
      members:
        - { name: NavigateToMeetingSummary, params: "meetingId: String, meetingNumber: Int, groupId: Int" }
        - { name: NavigateToPreviousMeetingReview, params: "meetingId: String, meetingNumber: Int, groupId: Int, launchedFrom: String" }
        - { name: NavigateBack }
        - { name: ShowStepError, params: "message: String" }
        - { name: ShowSubmitSuccess }
        - { name: ShowSubmitError, params: "message: String" }
    actions:
      name: MeetingConductAction
      members:
        - { name: LoadMeetingData, trigger: "Screen enters composition" }
        - { name: NextStep, trigger: "Tap Next / Continue footer button" }
        - { name: PreviousStep, trigger: "Tap Back footer button" }
        - { name: SetAttendance, params: "memberId: String, status: AttendanceStatus", trigger: "Tap attendance toggle" }
        - { name: SetSavingsAmount, params: "memberId: String, amount: Long, type: SavingsType", trigger: "Edit savings input" }
        - { name: SetLoanRepayment, params: "loanId: String, amount: Long", trigger: "Edit repayment input" }
        - { name: SetLoanFine, params: "loanId: String, fineAmount: Long", trigger: "Edit fine input" }
        - { name: CastLoanVote, params: "loanId: String, vote: LoanVote", trigger: "Tap For/Against" }
        - { name: ApproveLoanApplication, params: "loanId: String", trigger: "Chairperson taps Approve" }
        - { name: SubmitMeeting, trigger: "Tap Submit on step 6" }
        - { name: ViewFullPreviousMeeting, trigger: "Tap View Full Report on step 0" }
        - { name: SaveProgressLocally, trigger: "App background or step advance" }
        - { name: DismissError, trigger: "Snackbar auto-dismiss or user swipe" }
    di:
      - MeetingRepository
      - SavingsRepository
      - LoanRepository
      - CorpusRepository
      - SyncQueueRepository
      - NavigationManager
      - ConnectivityObserver
      - LocalMeetingDao

components:
  - id: top_app_bar
    type: top-app-bar
    title: "{strings.meeting_title}"
    subtitle: "{strings.step_subtitle}"
    style: { background: surface }
    actions:
      - id: close_btn
        icon: dismiss_24_regular
        accessibility_label: "{strings.a11y_close_meeting}"
        on_click:
          action: NavigateBack
          target: meeting-calendar
          action_contract:
            effect: navigate
            description: "Navigates back to meeting-calendar, discarding the in-progress wizard via NavController without persisting the current step."
            action_contract_hash: "612be2a41b73daa19cb8a47df3526552ae953210b5d68ff15bd28ea8cd759a07"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: offline_badge
        type: chip
        label: "{strings.offline_chip}"
        accessibility_label: "{strings.a11y_offline_badge}"
        visible_when: "isOffline == true"
        style: { background: warningContainer, text_color: onWarningContainer }

  - id: step_stepper
    type: stepper
    orientation: horizontal
    accessibility_label: "{strings.a11y_stepper}"
    style:
      active_color: primary
      completed_color: primaryContainer
      inactive_color: outlineVariant
      connector_color: outline
      step_size: 28dp
    steps:
      - { index: 0, label: "{strings.stepper_step_review}", icon: history_24_regular }
      - { index: 1, label: "{strings.stepper_step_attendance}", icon: people_checkmark_24_regular }
      - { index: 2, label: "{strings.stepper_step_balance}", icon: wallet_24_regular }
      - { index: 3, label: "{strings.stepper_step_savings}", icon: piggy_bank_24_regular }
      - { index: 4, label: "{strings.stepper_step_loans}", icon: money_24_regular }
      - { index: 5, label: "{strings.stepper_step_apply}", icon: document_checkmark_24_regular }
      - { index: 6, label: "{strings.stepper_step_close}", icon: checkmark_circle_24_regular }

  - id: corpus_band
    type: banner
    accessibility_label: "{strings.a11y_corpus_band}"
    visible_when: "currentStep >= 2"
    style: { background: tertiaryContainer, padding_horizontal: 16dp, padding_vertical: 8dp }
    content:
      - { type: text, value: "{strings.corpus_band_corpus}", style: { text_style: labelLarge, color: onTertiaryContainer } }
      - { type: text, value: "{strings.corpus_band_cash}", style: { text_style: labelMedium, color: onTertiaryContainer } }

  - id: step0_previous_review
    type: step-content
    step_index: 0
    visible_when: "currentStep == 0"
    children:
      - id: prev_meeting_summary_card
        type: card
        accessibility_label: "{strings.a11y_prev_meeting_summary}"
        style: { background: surfaceVariant, corner_radius: md, padding: 16dp }
        content:
          - { type: info_row, label: "{strings.info_row_meeting}", value: "#{{previousMeetingSummary.meetingNumber}}" }
          - { type: info_row, label: "{strings.info_row_date}", value: "{{previousMeetingSummary.date}}" }
          - { type: info_row, label: "{strings.info_row_total_collected}", value: "KES {{previousMeetingSummary.totalCollected}}" }
          - { type: info_row, label: "{strings.info_row_closing_corpus}", value: "KES {{previousMeetingSummary.corpusAtClose}}" }
          - { type: info_row, label: "{strings.info_row_attendance}", value: "{{previousMeetingSummary.attendanceCount}}/{{groupMembers.size}}" }
      - id: no_prev_meeting_placeholder
        type: empty-state
        visible_when: "previousMeetingSummary == null"
        icon: history_24_regular
        title: "{strings.empty_state_first_meeting_title}"
        body: "{strings.empty_state_first_meeting_body}"
      - id: view_full_previous_btn
        type: button
        variant: outlined
        label: "{strings.view_full_report}"
        accessibility_label: "{strings.a11y_view_full_previous}"
        visible: "{{previousMeetingSummary != null}}"
        on_click:
          action: ViewFullPreviousMeeting
          target: previous-meeting-review
          params: { meeting_id: "{{previousMeetingSummary.meetingId}}", meeting_number: "{{previousMeetingSummary.meetingNumber}}", group_id: "{{groupId}}", launched_from: "conduct" }
          action_contract:
            effect: navigate
            description: "Navigates to previous-meeting-review passing the real prior meeting_id (String, previousMeetingSummary.meetingId — NOT the meeting number), meeting_number (Int), group_id (Int), and launched_from='conduct' so the review renders in group-context (shows the 'Start Meeting #N' CTA) rather than falling back to the calendar default. Read-only drill-down into the prior collection-sheet record; no data written."
            action_contract_hash: "recompute-mc-viewfullprev-idfix-launchedfrom-20260801"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: step1_attendance
    type: step-content
    step_index: 1
    visible_when: "currentStep == 1"
    children:
      - id: fine_info_chip
        type: chip
        label: "{strings.attendance_fine_info_label}"
        accessibility_label: "{strings.a11y_fine_info_chip}"
        style: { background: warningContainer, text_color: onWarningContainer }
      - id: attendance_member_row
        type: list-item-input
        repeats_for: groupMembers
        accessibility_label: "{strings.a11y_attendance_row}"
        style: { min_height: 64dp, divider: true }
        leading: { type: avatar, initials: "{{member.initials}}", size: 40dp }
        content:
          - { type: text, value: "{{member.name}}", style: { text_style: bodyLarge }, i18n: skip }
          - { type: text, value: "{{member.role}}", style: { text_style: labelSmall, color: primary }, i18n: skip }
        trailing:
          type: segmented-button
          accessibility_label: "{strings.a11y_attendance_segmented}"
          segments:
            - { value: PRESENT, label: "{strings.attendance_present}" }
            - { value: LATE, label: "{strings.attendance_late}" }
            - { value: ABSENT, label: "{strings.attendance_absent}" }
          selected: "{{attendanceMap[member.memberId]}}"
        fine_chip:
          visible_when: "attendanceMap[member.memberId] == LATE || attendanceMap[member.memberId] == ABSENT"
          label: "{strings.attendance_fine_chip}"
          accessibility_label: "{strings.a11y_attendance_fine_chip}"
          style: { background: errorContainer, text_color: onErrorContainer }
        on_click:
          action: SetAttendance
          params: { member_id: "{{member.memberId}}", status: "{{selectedSegment}}" }
          action_contract:
            effect: transform_state
            description: "Sets the selected member's PRESENT/LATE/ABSENT status in attendanceMap and auto-derives the KES 50 late / KES 100 absent fine in totalFinesCollected as a pure ViewModel state transition (no I/O until submit)."
            action_contract_hash: "6af43be95dcb8f1c6fda104804a44a89a31d2e31ff3b2d1ea4cede6687c329ba"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: attendance_progress_chip
        type: chip
        label: "{strings.attendance_progress_chip}"
        accessibility_label: "{strings.a11y_attendance_progress}"
        style:
          background: "{{attendanceMap.size == groupMembers.size ? primaryContainer : surfaceVariant}}"
          text_color: "{{attendanceMap.size == groupMembers.size ? onPrimaryContainer : onSurfaceVariant}}"

  - id: step2_opening_balance
    type: step-content
    step_index: 2
    visible_when: "currentStep == 2"
    children:
      - id: corpus_balance_card
        type: card
        accessibility_label: "{strings.a11y_corpus_balance_card}"
        style: { background: primaryContainer, corner_radius: lg, padding: 24dp }
        content:
          - { type: text, value: "{strings.corpus_group_fund}", style: { text_style: labelLarge, color: onPrimaryContainer } }
          - { type: text, value: "{strings.corpus_kes_amount}", style: { text_style: displaySmall, color: onPrimaryContainer, font_weight: bold } }
          - { type: text, value: "{strings.corpus_at_start}", style: { text_style: bodySmall, color: onPrimaryContainer } }
      - id: cash_on_hand_card
        type: card
        accessibility_label: "{strings.a11y_cash_on_hand_card}"
        style: { background: surfaceVariant, corner_radius: md, padding: 16dp }
        content:
          - { type: text, value: "{strings.cash_on_hand_label}", style: { text_style: labelLarge, color: onSurfaceVariant } }
          - { type: text, value: "{strings.corpus_kes_amount}", style: { text_style: headlineMedium, color: onSurface } }

  - id: step3_savings_collection
    type: step-content
    step_index: 3
    visible_when: "currentStep == 3"
    children:
      - id: min_contribution_chip
        type: chip
        label: "{strings.savings_min_contribution_chip}"
        accessibility_label: "{strings.a11y_min_contribution_chip}"
        style: { background: secondaryContainer, text_color: onSecondaryContainer }
      - id: savings_member_row
        type: list-item-input
        repeats_for: groupMembers
        style: { padding_vertical: 12dp, divider: true }
        leading: { type: avatar, initials: "{{member.initials}}", size: 40dp }
        content:
          - { type: text, value: "{{member.name}}", style: { text_style: bodyLarge }, i18n: skip }
          - id: group_savings_input
            type: text-field
            label: "{strings.savings_group_input_label}"
            hint: "{strings.savings_group_input_hint}"
            accessibility_label: "{strings.a11y_group_savings_input}"
            keyboard_type: number
            prefix: "{strings.savings_currency_prefix}"
            value: "{{savingsMap[member.memberId].groupAmount}}"
            on_change:
              action: SetSavingsAmount
              params: { member_id: "{{member.memberId}}", type: GROUP_LINKED, amount: "{{inputValue}}" }
              action_contract:
                effect: transform_state
                description: "Updates the member's GROUP_LINKED savings amount in savingsMap and recomputes runningSavingsTotal as a pure ViewModel state transition; validated against the KES 200 minimum before step advance."
                action_contract_hash: "fe16e8bee377da547d3a6c3114945c56fa194d9ca0ecd58217d13b1da64de48c"
                action_contract_author: "claude-via-idea-enrich"
                action_contract_authored_at: "2026-07-17T00:00:00Z"
          - id: individual_savings_input
            type: text-field
            label: "{strings.savings_individual_input_label}"
            hint: "{strings.savings_individual_input_hint}"
            accessibility_label: "{strings.a11y_individual_savings_input}"
            keyboard_type: number
            prefix: "{strings.savings_currency_prefix}"
            value: "{{savingsMap[member.memberId].individualAmount}}"
            on_change:
              action: SetSavingsAmount
              params: { member_id: "{{member.memberId}}", type: INDIVIDUAL, amount: "{{inputValue}}" }
              action_contract:
                effect: transform_state
                description: "Updates the member's INDIVIDUAL voluntary savings amount in savingsMap and recomputes runningSavingsTotal as a pure ViewModel state transition; persisted to the backend only on final submit."
                action_contract_hash: "233933c164a19f39e0d8bdbaf15f2b90f91e1e4a28860fd243138f7c2f2afdf9"
                action_contract_author: "claude-via-idea-enrich"
                action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: running_total_band
        type: banner
        accessibility_label: "{strings.a11y_running_total}"
        style: { background: primaryContainer, padding: 16dp }
        content:
          - { type: text, value: "{strings.savings_running_total_label}", style: { text_style: labelMedium, color: onPrimaryContainer } }
          - { type: text, value: "{strings.savings_running_total_value}", style: { text_style: headlineSmall, color: onPrimaryContainer, font_weight: bold } }

  - id: step4_loan_review
    type: step-content
    step_index: 4
    visible_when: "currentStep == 4"
    children:
      - id: loan_review_row
        type: list-item-input
        repeats_for: activeLoans
        accessibility_label: "{strings.a11y_loan_review_row}"
        style: { padding_vertical: 12dp, divider: true }
        leading: { type: avatar, initials: "{{loan.memberInitials}}", size: 40dp, background: "{{loan.isOverdue ? errorContainer : secondaryContainer}}" }
        content:
          - { type: text, value: "{{loan.memberName}}", style: { text_style: bodyLarge }, i18n: skip }
          - { type: text, value: "KES {{loan.principal}} loan · KES {{loan.outstandingBalance}} outstanding · Week {{loan.weekNumber}}/{{loan.numberOfRepayments}}", style: { text_style: bodySmall, color: onSurfaceVariant }, i18n: skip }
          - id: overdue_chip
            type: chip
            label: "{strings.loan_overdue_chip}"
            accessibility_label: "{strings.a11y_loan_overdue_chip}"
            visible_when: "loan.isOverdue == true"
            style: { background: errorContainer, text_color: onErrorContainer }
          - id: repayment_input
            type: text-field
            label: "{strings.loan_repayment_input_label}"
            hint: "{strings.loan_repayment_input_hint}"
            accessibility_label: "{strings.a11y_loan_repayment_input}"
            keyboard_type: number
            value: "{{loanRepayments[loan.loanId]}}"
            on_change:
              action: SetLoanRepayment
              params: { loan_id: "{{loan.loanId}}", amount: "{{inputValue}}" }
              action_contract:
                effect: transform_state
                description: "Records the loan repayment amount in loanRepayments and updates totalRepayments as a pure ViewModel state transition; validated to not exceed the loan outstandingBalance before step advance."
                action_contract_hash: "8d50c71f1a1d4fe309b7f17148164d0ee4b38ea0d46c85d32810701501078e82"
                action_contract_author: "claude-via-idea-enrich"
                action_contract_authored_at: "2026-07-17T00:00:00Z"
          - id: fine_input
            type: text-field
            label: "{strings.loan_fine_input_label}"
            hint: "{strings.loan_fine_input_hint}"
            accessibility_label: "{strings.a11y_loan_fine_input}"
            keyboard_type: number
            value: "{{loanFines[loan.loanId]}}"
            visible_when: "loan.isOverdue == true"
            on_change:
              action: SetLoanFine
              params: { loan_id: "{{loan.loanId}}", fine_amount: "{{inputValue}}" }
              action_contract:
                effect: transform_state
                description: "Records the overdue-loan penalty fine in loanFines and folds it into totalFinesCollected as a pure ViewModel state transition, applied only to loans flagged isOverdue."
                action_contract_hash: "a40b1ea23c52a2c003916d81293af6555cc39847f764b59ee53344ccdb810eeb"
                action_contract_author: "claude-via-idea-enrich"
                action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: no_active_loans_placeholder
        type: empty-state
        visible_when: "activeLoans.isEmpty()"
        icon: checkmark_circle_24_regular
        title: "{strings.empty_state_no_active_loans_title}"
        body: "{strings.empty_state_no_active_loans_body}"

  - id: step5_loan_applications
    type: step-content
    step_index: 5
    visible_when: "currentStep == 5"
    children:
      - id: corpus_gate_chip
        type: chip
        visible_when: "totalLoansDisbursed > 0"
        label: "{strings.corpus_gate_chip}"
        accessibility_label: "{strings.a11y_corpus_gate_chip}"
        style: { background: tertiaryContainer, text_color: onTertiaryContainer }
      - id: loan_application_card
        type: card
        repeats_for: pendingLoanApplications
        accessibility_label: "{strings.a11y_loan_app_card}"
        style: { background: surfaceVariant, corner_radius: md, padding: 16dp, margin_bottom: 12dp }
        content:
          - { type: text, value: "{{application.memberName}}", style: { text_style: titleSmall }, i18n: skip }
          - { type: text, value: "{strings.loan_app_requests}", style: { text_style: bodyLarge } }
          - { type: text, value: "{strings.loan_app_purpose}", style: { text_style: bodySmall, color: onSurfaceVariant } }
          - id: vote_tally
            type: text
            value: "{strings.loan_vote_tally}"
            style: { text_style: labelMedium, color: outline }
          - id: vote_for_btn
            type: button
            variant: outlined
            label: "{strings.loan_vote_for}"
            accessibility_label: "{strings.a11y_vote_for_btn}"
            selected_when: "loanVotes[application.id] == FOR"
            style: { selected_background: primaryContainer }
            on_click:
              action: CastLoanVote
              params: { loan_id: "{{application.id}}", vote: FOR }
              action_contract:
                effect: transform_state
                description: "Casts a FOR vote for the loan application in loanVotes and updates the local vote tally as a pure ViewModel state transition; the aggregate vote is posted to the dt_loan_vote datatable on submit."
                action_contract_hash: "370beef8e6ac12728a2b26c1116a8eb5507e33fe13e87b03d5b2bf95b96b7504"
                action_contract_author: "claude-via-idea-enrich"
                action_contract_authored_at: "2026-07-17T00:00:00Z"
          - id: vote_against_btn
            type: button
            variant: outlined
            label: "{strings.loan_vote_against}"
            accessibility_label: "{strings.a11y_vote_against_btn}"
            selected_when: "loanVotes[application.id] == AGAINST"
            style: { selected_background: errorContainer }
            on_click:
              action: CastLoanVote
              params: { loan_id: "{{application.id}}", vote: AGAINST }
              action_contract:
                effect: transform_state
                description: "Casts an AGAINST vote for the loan application in loanVotes and updates the local vote tally as a pure ViewModel state transition; the aggregate vote is posted to the dt_loan_vote datatable on submit."
                action_contract_hash: "14c6e23ce41dc08097beb7f70cec2e4ce4e6e35114fd63e58cff8761b9435ae2"
                action_contract_author: "claude-via-idea-enrich"
                action_contract_authored_at: "2026-07-17T00:00:00Z"
          - id: approve_btn
            type: button
            variant: filled
            label: "{strings.loan_chairperson_approve}"
            accessibility_label: "{strings.a11y_approve_btn}"
            enabled_when: "currentUserRole == CHAIRPERSON && loanVotes[application.id].votesFor > loanVotes[application.id].votesAgainst"
            style: { background: primary, text_color: onPrimary, full_width: true }
            on_click:
              action: ApproveLoanApplication
              params: { loan_id: "{{application.id}}" }
              action_contract:
                effect: transform_state
                description: "Marks the loan application approved in local state (chairperson-only, enabled when votesFor exceeds votesAgainst) as a pure ViewModel state transition; queues the disbursal for the submit sequence guarded by the corpus gate."
                action_contract_hash: "2a2073290a9da38525268649579b0c9adcd4fcf22bf5b1f63cfc63a7ce659cac"
                action_contract_author: "claude-via-idea-enrich"
                action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: no_pending_loans_placeholder
        type: empty-state
        visible_when: "pendingLoanApplications.isEmpty()"
        icon: document_checkmark_24_regular
        title: "{strings.empty_state_no_pending_loans_title}"
        body: "{strings.empty_state_no_pending_loans_body}"

  - id: step6_closing_balance
    type: step-content
    step_index: 6
    visible_when: "currentStep == 6"
    children:
      - id: reconciliation_card
        type: card
        accessibility_label: "{strings.a11y_reconciliation_card}"
        style: { background: surfaceVariant, corner_radius: md, padding: 16dp }
        content:
          - { type: info_row, label: "{strings.info_row_opening_corpus}", value: "KES {{openingCorpus}}" }
          - { type: divider }
          - { type: info_row, label: "{strings.info_row_group_savings}", value: "KES {{runningSavingsTotal}}", value_color: primary }
          - { type: info_row, label: "{strings.info_row_loan_repayments}", value: "KES {{totalRepayments}}", value_color: primary }
          - { type: info_row, label: "{strings.info_row_fines_collected}", value: "KES {{totalFinesCollected}}", value_color: primary }
          - { type: info_row, label: "{strings.info_row_loans_disbursed}", value: "KES {{totalLoansDisbursed}}", value_color: error }
          - { type: divider, weight: 2dp }
          - { type: info_row, label: "{strings.info_row_closing_corpus}", value: "KES {{closingCorpus}}", label_style: titleSmall, value_style: titleLarge, value_color: primary }
      - id: submit_meeting_btn
        type: button
        variant: filled
        label: "{strings.submit_meeting}"
        accessibility_label: "{strings.a11y_submit_meeting_btn}"
        loading: "{{isSubmitting}}"
        enabled_when: "!isSubmitting"
        style: { background: primary, text_color: onPrimary, min_height: 56dp, full_width: true }
        on_click:
          action: SubmitMeeting
          target: meeting-summary
          action_contract:
            effect: call_api
            external_library_refs: [fineract-rest, sqldelight]
            writes_to: "POST /datatables/dt_meeting_record/{groupId} (record-meeting) · POST /datatables/dt_meeting_attendance/{clientId} (record-attendance) · POST /savingsaccounts/{savingsId}/transactions · POST /loans/{loanId}/transactions (repayments + disbursals) · POST /datatables/dt_loan_vote · PUT /datatables/dt_group_corpus/{groupId} (closing corpus)"
            description: "Runs the ordered submit sequence (record, attendance, savings, repayment, disbursal, corpus PUT) against the Fineract collection-sheet backend via the companion API, then emits NavigateToMeetingSummary; on any 5xx or offline it enqueues the full payload to the SQLDelight sync_queue for later Store5-backed drain."
            action_contract_hash: "recompute-mc-submitmeeting-writesto-20260801"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: offline_submit_note
        type: text
        accessibility_label: "{strings.a11y_offline_submit_note}"
        visible_when: "isOffline == true"
        value: "{strings.offline_submit_note_full}"
        style: { text_style: bodySmall, color: onSurfaceVariant, alignment: center }

  - id: wizard_footer
    type: navigation-footer
    style: { background: surface, elevation: 8dp, padding: 16dp }
    children:
      - id: back_footer_btn
        type: button
        variant: outlined
        label: "{strings.back_btn}"
        accessibility_label: "{strings.a11y_back_footer_btn}"
        visible_when: "currentStep > 0"
        on_click:
          action: PreviousStep
          action_contract:
            effect: transform_state
            description: "Decrements currentStep to return to the previous wizard step as a pure ViewModel state transition, preserving all entered attendance, savings and loan data."
            action_contract_hash: "66cfa4e38a62b4da86cf1d192224dfa103e2f58679d1260b5d08b4ff582247db"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: next_footer_btn
        type: button
        variant: filled
        label: "{{currentStep < 6 ? strings.next_btn : strings.submit_meeting}}"
        accessibility_label: "{strings.a11y_next_footer_btn}"
        loading: "{{isSubmitting}}"
        style: { background: primary, text_color: onPrimary }
        on_click:
          action: "{{currentStep < 6 ? NextStep : SubmitMeeting}}"
          action_contract:
            effect: transform_state
            delegates_to: SubmitMeeting   # on the final step (currentStep == 6) this button fires SubmitMeeting, whose own call_api contract governs the network write
            description: "Conditional footer action. For steps 0-5 it validates the current step then advances currentStep and saves wizard progress to the local SQLDelight meeting_wizard_state — a pure transform_state ViewModel transition (no network). On the final step (currentStep == 6) the label switches to Submit and the button DELEGATES to the SubmitMeeting action; the collection-sheet POST sequence is not performed here but by SubmitMeeting's own call_api contract, so this contract stays a transform_state advance and defers the network effect to its delegate (consistent with the co-located submit_meeting_btn which invokes the same SubmitMeeting action)."
            action_contract_hash: "recompute-mc-nextfooter-delegates-submitmeeting-20260801"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: step_validation_error_snackbar
    type: snackbar
    accessibility_label: "{strings.a11y_validation_snackbar}"
    visible_when: "stepValidationError != null"
    content: "{{stepValidationError}}"
    style: { background: errorContainer, text_color: onErrorContainer, duration: 4000ms }
    on_dismiss:
      action: DismissError
      action_contract:
        effect: emit_event
        description: "Clears stepValidationError to dismiss the validation snackbar as a one-shot emit_event, restoring the wizard to its editable Content state."
        action_contract_hash: "db323ccb76686d19b87b132f64a23a14b45c1c9dc0e50ccf7c92f0871a01130a"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: submit_error_snackbar
    type: snackbar
    accessibility_label: "{strings.a11y_submit_error_snackbar}"
    visible_when: "submitError != null"
    content: "{{submitError}}"
    style: { background: errorContainer, text_color: onErrorContainer, duration: 6000ms, action_text: "{strings.submit_error_retry}" }
    on_action:
      action: SubmitMeeting
      action_contract:
        effect: call_api
        external_library_refs: [fineract-rest, sqldelight]
        writes_to: "same ordered collection-sheet sequence as submit_meeting_btn — record-meeting · record-attendance · savings/loan transactions · dt_loan_vote · dt_group_corpus PUT"
        description: "Retries the ordered submit sequence against the Fineract collection-sheet backend via the companion API from the error snackbar; falls back to enqueuing the payload to the SQLDelight sync_queue if the retry also fails."
        action_contract_hash: "recompute-mc-submitmeeting-retry-writesto-20260801"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: loading
  loading:
    components: [top_app_bar, step_stepper]
    description: "Loading meeting data — 5 parallel API calls; skeleton on step content"
  content:
    components: [top_app_bar, step_stepper, corpus_band, step0_previous_review, step1_attendance, step2_opening_balance, step3_savings_collection, step4_loan_review, step5_loan_applications, step6_closing_balance, wizard_footer]
    description: "Wizard active; step content rendered per currentStep; corpus_band on steps 2-6"
    demo_data:
      meetingNumber: 4
      groupId: 7
      currentStep: 1
      openingCorpus: 12400
      cashOnHand: 2000
      groupMembers:
        - { memberId: "m1", name: "Amina Hassan", initials: "AH", role: "Chairperson" }
        - { memberId: "m2", name: "Peter Otieno", initials: "PO", role: "Treasurer" }
        - { memberId: "m3", name: "Grace Wanjiku", initials: "GW", role: "Secretary" }
        - { memberId: "m4", name: "John Mwangi", initials: "JM", role: "Member" }
        - { memberId: "m5", name: "Mary Akinyi", initials: "MA", role: "Member" }
      previousMeetingSummary:
        meetingNumber: 3
        date: "2026-04-28"
        totalCollected: 1850
        corpusAtClose: 12400
        attendanceCount: 5
  submitting:
    components: [top_app_bar, step_stepper, corpus_band, step6_closing_balance, wizard_footer]
    description: "API calls in flight; overlay CircularProgressIndicator; footer buttons disabled"
    overlay: "CircularProgressIndicator centered — Submitting meeting..."
  submit_success:
    components: []
    description: "Brief toast then navigate to meeting-summary"
    toast: "Meeting #{{meetingNumber}} submitted successfully!"
    toast_duration: 2000ms
  submit_error:
    components: [top_app_bar, step_stepper, step6_closing_balance, wizard_footer, submit_error_snackbar]
    description: "Submit failure — snackbar with Retry; offline goes to optimistic success path"

