# ─────────────────────────────────────────────────────────────────────────────
# E2E — REAL group CREATE (WRITE) against LIVE mifos-bank-2: the create-group
#        wizard → POST /companion/groups → new Fineract group persisted
# ─────────────────────────────────────────────────────────────────────────────
# login → organizer-dashboard → All Groups → group-list → create FAB →
#   group-type-picker → VSLA → group-create wizard (name + prefilled VSLA rules)
#   → Next through steps → Submit → POST /companion/groups → real new group on
#   mifos-bank-2 → invite code shown. Prereq: Go companion :8090 + adb reverse.
appId: org.mifos.groupbanking
name: e2e — real group create (write, live mifos-bank-2)
tags:
  - e2e
  - group-banking
  - group-create
  - real-network
  - write
---
- launchApp:
    clearState: true
- assertVisible: { id: "login_signup_screen" }
- tapOn: { id: "login_signup_field_email_phone" }
- inputText: "mifos"
- tapOn: { id: "login_signup_field_password" }
- inputText: "password"
- hideKeyboard
- tapOn: { id: "login_signup_login_button" }
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 20000
- tapOn: "All Groups"
- extendedWaitUntil:
    visible: { id: "group_list_screen" }
    timeout: 15000

# --- create → group-type-picker → VSLA → group-create wizard ---
- tapOn: "Create Group"
- extendedWaitUntil:
    visible: { id: "group_type_picker_screen" }
    timeout: 10000
- tapOn: { id: "group_type_picker_card_vsla" }
- extendedWaitUntil:
    visible: { id: "group_create_screen" }
    timeout: 10000

# --- Step 1 (Identity): name + Office + Meeting Day + Meeting Time (Currency=KES default) ---
- tapOn: { id: "group_create_field_group_name" }
- inputText: "Nairobi Test VSLA"
- hideKeyboard
# Office dropdown (ExposedDropdownMenu → options in a popup, select by text)
- tapOn: { id: "group_create_dropdown_office" }
- tapOn: "Head Office"
# Meeting Day dropdown
- tapOn: { id: "group_create_dropdown_meeting_day" }
- tapOn: "Monday"
# Meeting Time field
- tapOn: { id: "group_create_field_meeting_time" }
- inputText: "14:00"
- hideKeyboard
# advance Identity → Rules
- tapOn: { id: "group_create_next_button" }
- extendedWaitUntil:
    visible: "Rules"
    timeout: 8000
# Step 2 (Rules): fill EVERY required numeric field with a valid value.
- tapOn: { id: "group_create_field_share_value" }
- eraseText
- inputText: "100"
- hideKeyboard
- tapOn: { id: "group_create_field_share_min" }
- eraseText
- inputText: "1"
- hideKeyboard
- tapOn: { id: "group_create_field_share_max" }
- eraseText
- inputText: "10"
- hideKeyboard
- scrollUntilVisible:
    element: { id: "group_create_field_fine_amount" }
    direction: DOWN
- tapOn: { id: "group_create_field_cycle_length" }
- eraseText
- inputText: "12"
- hideKeyboard
- tapOn: { id: "group_create_field_fine_amount" }
- eraseText
- inputText: "50"
- hideKeyboard
- scrollUntilVisible:
    element: { id: "group_create_next_button" }
    direction: DOWN
- tapOn: { id: "group_create_next_button" }
- extendedWaitUntil:
    visible: "Members"
    timeout: 8000
- tapOn: { id: "group_create_next_button" }
- extendedWaitUntil:
    visible: "Review"
    timeout: 8000
# --- Submit → POST /companion/groups → real new group on mifos-bank-2 ---
- tapOn: { id: "group_create_submit_button" }
# On success the app POSTs /companion/groups (real Fineract group created +
# activated + typeConfig datatable row) and navigates to the NEW group's
# dashboard. Verified device-truth: "Nairobi Test VSLA" is created on
# mifos-bank-2 (GET /api/list_groups shows it) and the group-dashboard renders
# the newly-created group name.
- extendedWaitUntil:
    visible: "Nairobi Test VSLA"
    timeout: 25000
- assertVisible: { id: "group_dashboard_screen" }
