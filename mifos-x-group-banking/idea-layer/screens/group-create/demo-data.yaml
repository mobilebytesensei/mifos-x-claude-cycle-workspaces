entries:
  - dto: Office
    count_hint: 3
    source_notes: >
      Three Fineract offices covering the Kisumu / Kakamega region — matches
      the mifos-x-group-banking IDEA.md rural-savings vision. Field officers
      select the office their new group operates under; the office short-codes
      (KWB / KEB / KCB) map to Fineract externalId used for downstream
      analytics + centre-code stamping. nameDecorated mirrors the indented
      display Fineract uses to convey office hierarchy in the office_dropdown
      component (labeled via ui.yaml accessibility_label "Office selector,
      choose the office this group belongs to").
    items:
      - id: 10
        name: "Kisumu West Branch"
        nameDecorated: "  Kisumu West Branch"
        externalId: "KWB-001"

      - id: 11
        name: "Kisumu East Branch"
        nameDecorated: "  Kisumu East Branch"
        externalId: "KEB-001"

      - id: 12
        name: "Kisumu Central Branch"
        nameDecorated: "  Kisumu Central Branch"
        externalId: "KCB-001"

  - dto: GroupTypeConfig
    count_hint: 2
    source_notes: >
      Two canonical GroupTypeConfig shapes forwarded from group-type-picker
      as a nav_arg. VSLA — the flagship savings-group model — is
      ACCUMULATING pool + SHARE_BASED_VARIABLE contributions + PRORATA_SHARES
      shareout at cycle end, with an opt-in social/welfare fund at 5% of
      corpus. ROSCA — the classic merry-go-round — is ROTATING_PAYOUT pool
      + FIXED_AMOUNT contributions + LOTTERY payout order and no social
      fund. These drive the Step 2 field visibility rules in ui.yaml
      (share_value_field / share_min_field / share_max_field vs
      contribution_amount_field; payout_order_dropdown only for
      ROTATING_PAYOUT) and the review_card conditional rows on Step 4.
    items:
      - id: "vsla_default"
        group_type: "VSLA"
        pool_model: "ACCUMULATING"
        contribution_model: "SHARE_BASED_VARIABLE"
        shareout_formula: "PRORATA_SHARES"
        payout_order_method: "NA"
        share_value: 200.0
        contribution_amount: 0.0
        social_fund_enabled: true
        social_fund_percent: 5.0
        cycle_length_months: 12
        loan_multiplier: 3.0
        interest_rate: 10.0
        fine_amount: 50.0
        max_members: 20

      - id: "rosca_default"
        group_type: "ROSCA"
        pool_model: "ROTATING_PAYOUT"
        contribution_model: "FIXED_AMOUNT"
        shareout_formula: "NONE"
        payout_order_method: "LOTTERY"
        share_value: 0.0
        contribution_amount: 500.0
        social_fund_enabled: false
        social_fund_percent: 0.0
        cycle_length_months: 10
        loan_multiplier: 2.0
        interest_rate: 0.0
        fine_amount: 100.0
        max_members: 10

  - dto: CreateGroupOrchestrationRequest
    count_hint: 2
    source_notes: >
      Two demo COMP-GRP-001 requests exercising both group-type shapes.
      (1) Mwangaza Women's Group — VSLA / SHARE_BASED_VARIABLE at KES 200
      per share, 1–5 shares per meeting, 10% flat interest, 12-month annual
      cycle, social fund enabled at 5% of corpus, meets Monday 09:00,
      20-member cap. (2) Kilimani Merry-Go-Round — ROSCA / FIXED_AMOUNT
      KES 500 per meeting, LOTTERY payout order, 10-month cycle, no social
      fund, meets Friday 18:00, 10-member cap. Both requests embed the full
      typeConfig from the group-type-picker nav_arg and are handled
      atomically by COMP-GRP-001 (createCenter + activate + associateClients
      + assignRole ORGANIZER + provision dt_group_type_config).
    items:
      - name: "Mwangaza Women's Group"
        officeId: 10
        userId: 1001
        currency: "KES"
        meetingDay: "MONDAY"
        meetingTime: "09:00"
        typeConfig:
          group_type: "VSLA"
          pool_model: "ACCUMULATING"
          contribution_model: "SHARE_BASED_VARIABLE"
          shareout_formula: "PRORATA_SHARES"
          payout_order_method: "NA"
          share_value: 200.0
          contribution_amount: 0.0
          social_fund_enabled: true
          social_fund_percent: 5.0
          cycle_length_months: 12
          loan_multiplier: 3.0
          interest_rate: 10.0
          fine_amount: 50.0
          max_members: 20

      - name: "Kilimani Merry-Go-Round"
        officeId: 11
        userId: 1002
        currency: "KES"
        meetingDay: "FRIDAY"
        meetingTime: "18:00"
        typeConfig:
          group_type: "ROSCA"
          pool_model: "ROTATING_PAYOUT"
          contribution_model: "FIXED_AMOUNT"
          shareout_formula: "NONE"
          payout_order_method: "LOTTERY"
          share_value: 0.0
          contribution_amount: 500.0
          social_fund_enabled: false
          social_fund_percent: 0.0
          cycle_length_months: 10
          loan_multiplier: 2.0
          interest_rate: 0.0
          fine_amount: 100.0
          max_members: 10

  - dto: CreateGroupOrchestrationResponse
    count_hint: 2
    source_notes: >
      Successful creation responses from COMP-GRP-001. groupId is the
      companion-assigned deterministic ID (GRP-{YYYYMMDD}-{seq});
      fineractCenterId is the Fineract centre record backing the group and
      is stamped on all downstream loan / savings postings; inviteCode is a
      6-character alphanumeric code the ORGANIZER shares so members can
      self-join from the join-with-code screen.
    items:
      - groupId: "GRP-20260718-001"
        fineractCenterId: 201
        inviteCode: "MWG001"

      - groupId: "GRP-20260718-002"
        fineractCenterId: 202
        inviteCode: "KMR002"

