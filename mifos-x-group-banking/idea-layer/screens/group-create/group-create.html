<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Create — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { darkMode:'class', theme:{extend:{fontFamily:{display:['Noto Sans','system-ui','sans-serif']}}} };
</script>
<style>
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width:393px; min-height:852px; border-radius:2.5rem; overflow:hidden; position:relative; }
body.embedded { background:#FAFAFA; margin:0; padding:0; min-height:100vh; display:block; }
body.embedded #standalone-toolbar { display:none !important; }
body.embedded #phone-wrapper { display:none !important; }
body.embedded #embedded-content { display:flex !important; flex-direction:column; width:100%; height:100vh; overflow:hidden; background:#FAFAFA; }
.card { background:white; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.field-wrapper { display:flex; flex-direction:column; gap:6px; }
.field-label { font-size:14px; font-weight:600; color:#42493F; }
.field-input { width:100%; padding:12px 16px; border-radius:12px; border:2px solid #C8D8C5; background:white; font-size:14px; color:#1A1C19; outline:none; transition:border-color 0.2s; font-family:'Noto Sans',sans-serif; }
.field-input:focus { border-color:#2E7D32; }
.step-dot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
.step-active { background:#2E7D32; color:white; }
.step-done { background:#C8E6C9; color:#1B5E20; }
.step-inactive { background:#E7E0EC; color:#72796F; }
.step-line { flex:1; height:2px; background:#E7E0EC; }
.step-line-done { background:#2E7D32; }
.review-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #F1F4EF; }
.review-row:last-child { border-bottom:none; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { background:white; border-radius:24px; padding:24px; max-width:320px; width:100%; text-align:center; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Group Create — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="step1">Step 1: Identity</option>
    <option value="step2">Step 2: Rules</option>
    <option value="step3">Step 3: Review</option>
    <option value="step3_offline">Step 3: Review (Offline)</option>
    <option value="submitting">Submitting</option>
    <option value="success">Success</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-[#FAFAFA] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2" style="background:#2E7D32">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-sm text-white">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-[#FAFAFA]" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 shrink-0" style="background:#2E7D32; padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-white">wifi</span>
      <span class="material-symbols-outlined text-sm text-white">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-[#FAFAFA] flex-1"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) { document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col'); document.body.classList.add('embedded'); }
function getContentEl() { return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content'); }

// Demo data (pre-filled for prototype)
var demo = {
  groupName: "Mwangaza Women's Group",
  officeName: 'Nairobi Head Office',
  currency: 'KES',
  meetingDay: 'Monday',
  meetingTime: '09:00',
  contribMin: '100',
  contribMax: '500',
  multiplier: '3',
  interest: '10',
  cycleMonths: '12',
  fine: '50'
};

function renderTopBar() {
  return `<div class="flex items-center px-4 py-3 gap-2" style="background:#2E7D32">
    <!-- close: navigates back to group-list, discards draft -->
    <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('group-list')">close</span>
    <span class="text-lg font-bold text-white flex-1">New Group</span>
  </div>`;
}

function renderStepIndicator(current) {
  var steps = ['Identity', 'Rules', 'Review'];
  return `<div class="flex items-center px-6 py-4 bg-white border-b border-slate-100">
    ${steps.map((s, i) => {
      var n = i + 1;
      var dotCls = n < current ? 'step-done' : n === current ? 'step-active' : 'step-inactive';
      var lineCls = n < current ? 'step-line-done' : '';
      return (i > 0 ? `<div class="step-line ${lineCls}"></div>` : '') +
        `<div class="flex flex-col items-center gap-1">
          <div class="step-dot ${dotCls}">${n < current ? '<span class="material-symbols-outlined text-sm">check</span>' : n}</div>
          <div class="text-xs ${n === current ? 'font-bold text-[#2E7D32]' : n < current ? 'text-[#2E7D32]' : 'text-[#72796F]'}">${s}</div>
        </div>`;
    }).join('')}
  </div>`;
}

function renderTextField(label, value, placeholder, helper, type) {
  return `<div class="field-wrapper">
    <label class="field-label">${label}</label>
    <input type="${type||'text'}" class="field-input" value="${value||''}" placeholder="${placeholder||''}"/>
    ${helper ? `<p class="text-xs text-[#72796F]">${helper}</p>` : ''}
  </div>`;
}

function renderDropdown(label, value, options) {
  return `<div class="field-wrapper">
    <label class="field-label">${label}</label>
    <div class="relative">
      <select class="field-input appearance-none pr-10">
        ${options.map(o => `<option ${o===value?'selected':''}>${o}</option>`).join('')}
      </select>
      <span class="material-symbols-outlined absolute right-3 top-3 text-[#72796F] pointer-events-none">expand_more</span>
    </div>
  </div>`;
}

function renderStep1() {
  return `
  <div class="flex flex-col bg-[#FAFAFA]">
    ${renderTopBar()}
    ${renderStepIndicator(1)}
    <div class="px-4 flex flex-col gap-4 pt-4 pb-28">
      <!-- GET /offices to populate dropdown -->
      ${renderTextField('Group Name', demo.groupName, 'e.g. Mwangaza Women\'s Group', '3–60 characters')}
      ${renderDropdown('Office', demo.officeName, ['Nairobi Head Office', 'Kisumu Branch', 'Mombasa Branch', 'Nakuru Branch'])}
      ${renderDropdown('Currency', demo.currency, ['KES', 'USD', 'UGX', 'TZS'])}
      ${renderDropdown('Meeting Day', demo.meetingDay, ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'])}
      ${renderTextField('Meeting Time', demo.meetingTime, 'HH:MM', '', 'time')}
    </div>
    <div class="fixed bottom-0 left-0 right-0 px-4 pb-4 pt-3 bg-[#FAFAFA] border-t border-slate-100" style="max-width:393px; margin:auto;">
      <!-- tap: validates step 1 fields, advances to step 2 -->
      <button class="w-full py-4 rounded-full text-white font-bold text-base" style="background:#2E7D32;" onclick="switchState('step2')">Next</button>
    </div>
  </div>`;
}

function renderStep2() {
  return `
  <div class="flex flex-col bg-[#FAFAFA]">
    ${renderTopBar()}
    ${renderStepIndicator(2)}
    <div class="px-4 flex flex-col gap-4 pt-4 pb-32">
      ${renderTextField('Min Contribution (KES)', demo.contribMin, 'e.g. 100', 'FR-020: penalty applies below this')}
      ${renderTextField('Max Contribution (KES)', demo.contribMax, 'e.g. 500')}
      ${renderTextField('Loan Multiplier (×savings)', demo.multiplier, 'e.g. 3', 'Member can borrow up to X times their savings')}
      ${renderTextField('Interest Rate (%)', demo.interest, 'e.g. 10', 'Flat interest rate per loan cycle')}
      ${renderTextField('Cycle Length (months)', demo.cycleMonths, 'e.g. 12')}
      ${renderTextField('Late Penalty / Fine (KES)', demo.fine, 'e.g. 50', 'Fine for missing minimum contribution — FR-020')}
    </div>
    <div class="fixed bottom-0 left-0 right-0 px-4 pb-4 pt-3 bg-[#FAFAFA] border-t border-slate-100 flex gap-3" style="max-width:393px; margin:auto;">
      <!-- tap: returns to step 1 -->
      <button class="py-3 px-5 rounded-full font-semibold text-[#2E7D32] border-2 border-[#2E7D32]" onclick="switchState('step1')">Back</button>
      <!-- tap: validates step 2, advances to step 3 -->
      <button class="flex-1 py-4 rounded-full text-white font-bold text-base" style="background:#2E7D32;" onclick="switchState('step3')">Next</button>
    </div>
  </div>`;
}

function renderStep3(isOffline) {
  var sections = [
    { title: 'Identity', rows: [
      ['Name', demo.groupName], ['Office', demo.officeName],
      ['Currency', demo.currency], ['Meeting', `${demo.meetingDay} at ${demo.meetingTime}`]
    ]},
    { title: 'Rules', rows: [
      ['Contribution', `KES ${demo.contribMin} – KES ${demo.contribMax}`],
      ['Loan Multiplier', `${demo.multiplier}× savings`],
      ['Interest Rate', `${demo.interest}% flat`],
      ['Cycle Length', `${demo.cycleMonths} months`],
      ['Late Fine', `KES ${demo.fine}`]
    ]}
  ];
  return `
  <div class="flex flex-col bg-[#FAFAFA]">
    ${renderTopBar()}
    ${renderStepIndicator(3)}
    ${isOffline ? `
    <div class="flex items-center gap-2 mx-4 mt-3 p-3 rounded-xl" style="background:#E3F2FD;">
      <span class="material-symbols-outlined text-[#1565C0]">wifi_off</span>
      <span class="text-sm text-[#1565C0]">You are offline. This group will be created when you reconnect.</span>
    </div>` : ''}
    <div class="px-4 pt-3 pb-32">
      <div class="card p-5">
        <div class="text-lg font-bold text-[#1A1C19] mb-4">Review Group Details</div>
        ${sections.map(sec => `
          <div class="mb-4">
            <div class="text-xs font-bold text-[#2E7D32] uppercase tracking-wider mb-2">${sec.title}</div>
            ${sec.rows.map(([l,v]) => `
              <div class="review-row">
                <span class="text-sm text-[#72796F]">${l}</span>
                <span class="text-sm font-semibold text-[#1A1C19]">${v}</span>
              </div>`).join('')}
          </div>
        `).join('')}
      </div>
    </div>
    <div class="fixed bottom-0 left-0 right-0 px-4 pb-4 pt-3 bg-[#FAFAFA] border-t border-slate-100 flex gap-3" style="max-width:393px; margin:auto;">
      <!-- tap: returns to step 2 -->
      <button class="py-3 px-5 rounded-full font-semibold text-[#2E7D32] border-2 border-[#2E7D32]" onclick="switchState('step2')">Back</button>
      <!-- tap: POST /centers then POST /datatables/dt_group_config; navigates to group-dashboard on success -->
      <button class="flex-1 py-4 rounded-full text-white font-bold text-base" style="background:#2E7D32;" onclick="switchState('submitting')">Create Group</button>
    </div>
  </div>`;
}

function renderSubmitting() {
  return `<div class="flex flex-col bg-[#FAFAFA]">
    ${renderTopBar()}
    ${renderStepIndicator(3)}
    <div class="flex flex-col items-center justify-center" style="height:550px;">
      <div class="w-14 h-14 border-4 border-[#C8E6C9] border-t-[#2E7D32] rounded-full animate-spin mb-4"></div>
      <p class="text-sm text-[#42493F] font-medium">Creating group...</p>
      <p class="text-xs text-[#72796F] mt-1">POST /centers</p>
      <p class="text-xs text-[#72796F]">POST /datatables/dt_group_config</p>
    </div>
  </div>`;
}

function renderSuccess() {
  return `<div class="flex flex-col bg-[#FAFAFA]">
    ${renderTopBar()}
    <div class="modal-overlay">
      <div class="modal">
        <span class="material-symbols-outlined text-5xl mb-3" style="color:#2E7D32; font-variation-settings:'FILL' 1">check_circle</span>
        <h3 class="text-xl font-bold text-[#1A1C19] mb-2">Group Created!</h3>
        <p class="text-base font-semibold text-[#2E7D32] mb-2">${demo.groupName}</p>
        <p class="text-sm text-[#42493F] mb-6">Your savings group has been created successfully. Members can now be added and meetings can begin.</p>
        <!-- tap: navigates to group-dashboard -->
        <button class="w-full py-3 rounded-full text-white font-bold" style="background:#2E7D32;" onclick="navigateTo('group-dashboard')">View Group Dashboard</button>
      </div>
    </div>
  </div>`;
}

var currentState = 'step1';
function switchState(s) {
  currentState = s || 'step1';
  document.getElementById('statePicker').value = currentState;
  var html = '';
  if (s === 'step2') html = renderStep2();
  else if (s === 'step3') html = renderStep3(false);
  else if (s === 'step3_offline') html = renderStep3(true);
  else if (s === 'submitting') { html = renderSubmitting(); setTimeout(() => switchState('success'), 2000); }
  else if (s === 'success') html = renderSuccess();
  else html = renderStep1();
  getContentEl().innerHTML = html;
}

function navigateTo(t) {
  if (window !== window.top) window.parent.postMessage({action:'navigate',screenId:t},'*');
  else showToast('Navigate to: '+t);
}
function showToast(msg) {
  var t = document.createElement('div'); t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg'; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),2000);
}
function toggleDark() { document.querySelector('.phone')&&document.querySelector('.phone').classList.toggle('bg-slate-900'); }
window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state||'');
  if(e.data.action==='getInspectorData')notifyParent();
});
function notifyParent() {
  if(window===window.top)return;
  window.parent.postMessage({
    action:'screenLoaded',screenId:'group-create',name:'Group Create',
    feature:'group-management',status:'enriched',componentCount:12,
    states:[
      {id:'step1',name:'Step 1: Identity'},{id:'step2',name:'Step 2: Rules'},
      {id:'step3',name:'Step 3: Review'},{id:'step3_offline',name:'Review Offline'},
      {id:'submitting',name:'Submitting'},{id:'success',name:'Success'}
    ],
    inspectorData:{id:'group-create',name:'Group Create',feature:'group-management',status:'enriched',
      components:[
        {type:'top-bar',label:'New Group — close',target:'group-list'},
        {type:'step-indicator',label:'Steps 1-2-3',target:''},
        {type:'text-field',label:'Group Name',target:''},
        {type:'text-field',label:'Office Dropdown',target:''},
        {type:'text-field',label:'Currency',target:''},
        {type:'text-field',label:'Meeting Day',target:''},
        {type:'text-field',label:'Min/Max Contribution',target:''},
        {type:'text-field',label:'Loan Multiplier',target:''},
        {type:'text-field',label:'Interest Rate',target:''},
        {type:'card',label:'Review Summary',target:''},
        {type:'button',label:'Next/Back',target:''},
        {type:'button',label:'Create Group',target:'group-dashboard'}
      ],states:{},incoming_from:['group-list']}
  },'*');
}
switchState('step1');
notifyParent();
</script>
</body>
</html>
