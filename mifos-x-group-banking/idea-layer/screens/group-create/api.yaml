sibling: api
schema_version: "4.0"
feature_id: group-create

api:
  - id: get_offices
    function: get_offices
    method: get
    endpoint: "/offices"
    description: Fetch list of offices for the office dropdown
    params:
      orderBy: { type: String, default: "name" }
    response:
      type: array
      items:
        id: Long
        name: String
        nameDecorated: String
        externalId: String
    errors:
      401: Unauthorized
      500: Server error
    cache:
      ttl: 3600
      strategy: stale-while-revalidate
      offline: show_cached

  - id: create_center
    function: create_center
    method: post
    endpoint: "/centers"
    description: Create a new Fineract Center (group)
    body:
      name: String
      officeId: Long
      staffId: Long
      active: Boolean
      activationDate: String   # dd MMMM yyyy
      locale: String
      dateFormat: String
      meetingFrequency: String
      meetingDay: String
    response:
      type: object
      fields:
        resourceId: Long
        groupId: Long
    errors:
      400: Validation error — invalid fields
      401: Unauthorized
      403: Forbidden
      500: Server error
    offline_queue:
      table: sync_queue
      operation: CREATE_GROUP

  - id: create_group_config
    function: create_group_config
    method: post
    endpoint: "/datatables/dt_group_config/{centerId}"
    description: Write group rules to the dt_group_config custom datatable
    params:
      centerId: { type: Long, required: true, source: create_center_response }
    body:
      contribution_min: Double
      contribution_max: Double
      loan_multiplier: Double
      interest_rate: Double
      cycle_length_months: Int
      fine_amount: Double
    response:
      type: object
      fields:
        resourceId: Long
    errors:
      400: Validation error
      401: Unauthorized
      500: Server error
    offline_queue:
      table: sync_queue
      operation: CREATE_GROUP_CONFIG

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached

dtos:
  CreateGroupRequest:
    name: String
    officeId: Long
    staffId: Long
    active: Boolean
    activationDate: String
    meetingDay: String
    meetingTime: String
    contributionMin: Double
    contributionMax: Double
    loanMultiplier: Double
    interestRate: Double
    cycleLengthMonths: Int
    fineAmount: Double
    currency: String

  Office:
    id: Long
    name: String
    nameDecorated: String
