sibling: api
schema_version: "4.0"
feature_id: group-create

api:
  - id: get_offices
    function: get_offices
    method: get
    endpoint: "/offices"
    description: Fetch list of offices for the office dropdown
    params:
      orderBy: { type: String, default: "name" }
    response:
      type: array
      items:
        id: Long
        name: String
        nameDecorated: String
        externalId: String
    errors:
      401: Unauthorized
      500: Server error
    cache:
      ttl: 3600
      strategy: stale-while-revalidate
      offline: show_cached

  - id: create_group_orchestrate
    function: create_group_orchestrate
    method: post
    endpoint: "/companion/groups"    # COMP-GRP-001 — companion API orchestration endpoint
    description: >
      Single companion-API call that orchestrates: (1) createGroup in Fineract, (2) activate group,
      (3) associateClients, (4) assignRole (organizer for creator), (5) provision group_type_config
      datatable row with the typeConfig payload from group-type-picker. Replaces the previous
      raw Fineract /groups + /datatables/dt_group_config two-step.
    body:
      name: String
      officeId: Long
      userId: Long          # from SessionManager — self-signup creator becomes organizer
      currency: String
      meetingDay: String
      meetingTime: String
      typeConfig:           # full GroupTypeConfig forwarded from nav-arg
        group_type: String  # VSLA | ROSCA | ASCA | SILC | SHG | SACCO | CBO | BURIAL | JLG
        pool_model: String
        contribution_model: String
        shareout_formula: String
        payout_order_method: String
        share_value: Double
        contribution_amount: Double
        social_fund_enabled: Boolean
        social_fund_percent: Double
        cycle_length_months: Int
        loan_multiplier: Double
        interest_rate: Double
        fine_amount: Double
        max_members: Int
    response:
      type: object
      fields:
        groupId: String
        fineractGroupId: Long
        inviteCode: String       # shareable join code for new members
    errors:
      400: Validation error — invalid typeConfig or missing fields
      401: Unauthorized — session expired
      403: Forbidden
      409: Conflict — group name already exists in this office
      500: Server error
    offline_queue:
      table: sync_queue
      operation: CREATE_GROUP_ORCHESTRATE

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached

dtos:
  GroupTypeConfig:
    group_type: String        # VSLA | ROSCA | ASCA | SILC | SHG | SACCO | CBO | BURIAL | JLG
    pool_model: String        # ROTATING_PAYOUT | ACCUMULATING | NONE
    contribution_model: String # FIXED_AMOUNT | SHARE_BASED_VARIABLE | FIXED_NEGOTIATED
    shareout_formula: String  # NONE | PRORATA_SHARES | PRORATA_SAVINGS | EQUAL | INVESTMENT_PROPORTIONAL
    payout_order_method: String # FIXED_ORDER | LOTTERY | AUCTION | NEED_BASED | NA
    share_value: Double
    contribution_amount: Double
    social_fund_enabled: Boolean
    social_fund_percent: Double
    cycle_length_months: Int
    loan_multiplier: Double
    interest_rate: Double
    fine_amount: Double
    max_members: Int

  CreateGroupOrchestrationRequest:
    name: String
    officeId: Long
    userId: Long
    currency: String
    meetingDay: String
    meetingTime: String
    typeConfig: GroupTypeConfig

  CreateGroupOrchestrationResponse:
    groupId: String
    fineractGroupId: Long
    inviteCode: String

  Office:
    id: Long
    name: String
    nameDecorated: String
