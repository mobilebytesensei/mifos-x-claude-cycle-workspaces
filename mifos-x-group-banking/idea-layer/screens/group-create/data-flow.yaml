sibling: data-flow
schema_version: "2.1.0"
feature_id: group-create
last_generate:
  timestamp: "2026-07-21T16:00:00Z"
  generator: idea-data-flow
  regenerated_from: [ui.yaml, api.yaml]
  note: "Re-derived after ui.yaml i18n-tokenization cascade; on_click action_contracts (OnSubmit/OnNextStep/OnPreviousStep/OnBack) + api operations unchanged — trigger→endpoint→table→DTO chains re-verified faithful to current source."

entries:
  - screen_id: groupCreateScreen
    trigger: on_mount
    description: >
      Bootstrap the 4-step wizard. The GroupTypeConfig arrives as a nav_arg
      from group-type-picker (pool_model, contribution_model, shareout_formula,
      payout_order_method, share_value, contribution_amount,
      social_fund_enabled, cycle_model) — no API call is needed to obtain it.
      In parallel, the office dropdown is populated from a companion-hosted
      office list fetched from /offices (stale-while-revalidate, TTL 1h) and
      cached in offices_cache so the wizard renders offline. The first office
      alphabetically is pre-selected as a sensible default. groupTypeName is
      derived from typeConfig.group_type and used to render the top-bar title
      and group_type_banner chip (a11y-labeled via ui.yaml accessibility_label
      strings).
    endpoints:
      - { api_id: get_offices, transport: rest, method: get }
    tables:
      - name: offices_cache
        persistence_contract: sqldelight_entity
        mutation: upsert
    dtos:
      - { name: Office, role: response, api_id: get_offices }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 3600
      key_template: "offices"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login-signup }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      typeConfig arrives from group-type-picker nav_arg — no separate API call.
      Offices are fetched once (TTL 1h) since they rarely change. Cached offline
      via offices_cache. The wizard is fully renderable from local cache when
      offline; only the final OnSubmit needs connectivity (or offline enqueue).

  - screen_id: groupCreateScreen
    trigger: on_action
    action: OnSubmit
    description: >
      User taps "Create Group" on Step 4 (review + submit). A single COMP-GRP-001
      companion API call (POST /companion/groups) atomically orchestrates:
      (1) create the group in Fineract, (2) activate the group, (3) associateClients
      (creator becomes a member), (4) assignRole ORGANIZER to the creator, and
      (5) provision the dt_group_type_config datatable row with the full
      GroupTypeConfig from the nav_arg (pool_model, contribution_model,
      shareout_formula, share_value / contribution_amount, payout_order_method,
      social_fund_enabled, social_fund_percent, loan_multiplier, interest_rate,
      fine_amount, cycle_length_months, max_members). userId is supplied by
      SessionManager. Response: new groupId + auto-generated 6-character inviteCode. On success both groups_cache and
      group_type_config_cache rows are written so group-dashboard can render
      offline; NavigateToGroupDashboard(groupId) is emitted. If offline, the
      full request is serialised into sync_queue with entity_type
      CREATE_GROUP_ORCHESTRATE and a name+officeId+userId idempotency key, and
      the offline_notice_banner is shown on Step 4.
    endpoints:
      - { api_id: create_group_orchestrate, transport: rest, method: post }
    tables:
      - name: groups_cache
        persistence_contract: sqldelight_entity
        mutation: write
      - name: group_type_config_cache
        persistence_contract: sqldelight_entity
        mutation: write
      - name: sync_queue
        persistence_contract: sqldelight_entity
        mutation: write
    dtos:
      - { name: CreateGroupOrchestrationRequest, role: request, api_id: create_group_orchestrate }
      - { name: CreateGroupOrchestrationResponse, role: response, api_id: create_group_orchestrate }
    produces_state: Success
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "400", behavior: show_field_errors, message_key: error_validation }
      - { error_code: "401", behavior: navigate, nav_target: login-signup }
      - { error_code: "403", behavior: show_error, message_key: error_forbidden }
      - { error_code: "409", behavior: show_error, message_key: error_group_name_taken }
      - { error_code: "network.offline", behavior: enqueue_sync, message_key: offline_queued }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    offline_behavior:
      strategy: enqueue_to_sync_queue
      priority: NORMAL
      entity_type: CREATE_GROUP_ORCHESTRATE
      show_state: Queued
    navigation:
      - { condition: "createSuccess", nav_target: group-dashboard, params: [groupId] }
    notes: >
      Aligned with ui.yaml submit_button.on_click.action = OnSubmit and its
      action_contract (effect: call_api). Uses a single companion
      orchestration endpoint (COMP-GRP-001). typeConfig from nav_arg is embedded
      in the request body. Both groups_cache and group_type_config_cache are
      written on success so group-dashboard renders offline immediately. 409
      surfaces error_group_name_taken snackbar; 400 populates validationErrors
      per-field; 5xx is retry-able via error state. All user-visible strings
      (errors, banner messages) resolve via the {strings.*} keys declared in
      ui.yaml i18n.en so the wizard is fully translatable.

  - screen_id: groupCreateScreen
    trigger: on_action
    action: OnNextStep
    description: >
      Client-side validation gate advancing the wizard. Step 1 validates
      groupName (non-empty, ≤60 chars), officeId (required), meetingDay
      (required), and meetingTime (required). Step 2 validates contribution
      fields gated by typeConfig.contribution_model — share_value / shareMin /
      shareMax for SHARE_BASED_VARIABLE (VSLA, ASCA, SILC); contributionAmount
      for FIXED_AMOUNT / FIXED_NEGOTIATED (ROSCA, SHG, JLG, Burial); plus
      payoutOrderMethod when typeConfig.pool_model == ROTATING_PAYOUT (ROSCA).
      Shared rules (loanMultiplier, interestRate, cycleLengthMonths,
      fineAmount) are required on Step 2. Step 3 validates maxMembers
      (integer ≥2). On pass: increments currentStep to reveal the next
      step's form. On fail: populates validationErrors map (keyed by form
      field id, e.g. "group_name_field", "share_value_field") and shows
      inline field-level error messages without any API call. Each field's
      accessibility_label from ui.yaml is announced by screen readers when
      focus moves to the error.
    endpoints: []
    tables: []
    dtos: []
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "validation.step_incomplete", behavior: show_field_errors, message_key: error_validation }
    notes: >
      Pure client-side validation — no network call. Mirrors ui.yaml
      next_button.on_click.action_contract (effect: transform_state; writes_to
      [currentStep, validationErrors]; reads_from [typeConfig, groupName,
      officeId, meetingDay, meetingTime, shareValue, shareMin, shareMax,
      contributionAmount, payoutOrderMethod, maxMembers]).

  - screen_id: groupCreateScreen
    trigger: on_action
    action: OnPreviousStep
    description: >
      Decrements currentStep by 1, returning to the previous wizard step.
      No validation is performed on back-navigation and no field values are
      cleared — all GroupCreateState fields retain their current values so
      the user can review and modify prior input without loss.
    endpoints: []
    tables: []
    dtos: []
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    notes: >
      State-only transition. currentStep floor is 1; ui.yaml gates
      back_step_button on `visible: "{{currentStep > 1}}"` so Step 1 has no
      back button.

  - screen_id: groupCreateScreen
    trigger: on_action
    action: OnBack
    description: >
      User taps top-bar close icon (navigation_icon on top_bar) or system back.
      Dismisses the wizard and pops the back stack via NavigateBack event.
      No data is persisted — any partially entered wizard state is discarded.
      Mirrors ui.yaml top_bar.on_navigation_click.action_contract
      (effect: navigate).
    endpoints: []
    tables: []
    dtos: []
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    notes: >
      Pure navigation. Emits NavigateBack. Consumers of this screen
      (group-type-picker, group-list) handle the returned focus.

tables:
  - name: offices_cache
    description: >
      SQLDelight cache of Fineract Office rows returned by GET /offices. Keyed
      by id. Served offline from cache (TTL 1h). Updated by the on_mount
      entry via stale-while-revalidate.
    persistence_contract: sqldelight_entity
    primary_key: "id"
    mutations: [upsert, read]
    offline_strategy: serve_stale

  - name: groups_cache
    description: >
      Local record of created group metadata (groupId, name, officeId,
      inviteCode, meetingDay, meetingTime, currency).
      Written immediately after create_group_orchestrate succeeds so the new
      group appears in group-list offline without needing a re-fetch and
      group-dashboard renders from local cache.
    persistence_contract: sqldelight_entity
    primary_key: "groupId"
    mutations: [write, read]
    offline_strategy: serve_stale

  - name: group_type_config_cache
    description: >
      Per-group copy of the GroupTypeConfig used at creation, stored locally
      in the dt_group_type_config datatable shape (pool_model,
      contribution_model, shareout_formula, payout_order_method, share_value,
      contribution_amount, social_fund_enabled, social_fund_percent,
      cycle_length_months, loan_multiplier, interest_rate, fine_amount,
      max_members). Populated from nav_arg after creation success. Drives
      metric card selection on group-dashboard when offline.
    persistence_contract: sqldelight_entity
    primary_key: "groupId"
    mutations: [write, read]
    offline_strategy: serve_stale
    source_datatable: dt_group_type_config

  - name: sync_queue
    description: >
      Offline sync queue table (Store5 / Bookkeeper pattern). Accepts
      CREATE_GROUP_ORCHESTRATE payloads with an idempotency key when the
      device is offline. Drained by the background sync worker when
      connectivity is restored; the companion API's idempotency guard
      prevents duplicate group creation on repeated drain attempts.
    persistence_contract: sqldelight_entity
    primary_key: "id"
    mutations: [write, read, delete]
    offline_strategy: drain_on_connect

cache:
  strategy: no_cache
  notes: >
    Group creation is a write/mutation endpoint — no response caching. The
    offices_cache uses stale_while_revalidate (TTL 3600s) declared in the
    on_mount entry. No legacy api.yaml#cache. Single source: this data-flow
    file.

sync_queue:
  entries:
    - entity_type: CREATE_GROUP_ORCHESTRATE
      table: sync_queue
      priority: NORMAL
      idempotency_key: "name:{name}:officeId:{officeId}:userId:{userId}"
      notes: >
        Queued when the device is offline at Step 4 submit. The COMP-GRP-001
        companion API uses the idempotency key server-side to prevent
        duplicate group creation if the sync worker drains multiple times.
