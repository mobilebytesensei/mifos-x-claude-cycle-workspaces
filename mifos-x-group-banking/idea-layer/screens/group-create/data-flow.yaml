sibling: data-flow
schema_version: "2.1.0"
feature_id: group-create

entries:
  - screen_id: groupCreateScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_offices, transport: rest, method: get }
    tables: []
    dtos:
      - { name: Office, role: response, api_id: get_offices }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 3600
      key_template: "group_create:offices"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      Load offices list to populate the office dropdown in Step 1.
      Cached aggressively (1h) since offices rarely change.

  - screen_id: groupCreateScreen
    trigger: on_interact
    endpoints:
      - { api_id: create_center, transport: rest, method: post }
      - { api_id: create_group_config, transport: rest, method: post }
    tables: []
    dtos:
      - { name: CreateGroupRequest, role: request, api_id: create_center }
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "400", behavior: show_field_errors, message_key: error_validation }
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "403", behavior: show_error, message_key: error_forbidden }
      - { error_code: "network.offline", behavior: enqueue_sync, message_key: offline_queued }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      On submit: create_center fires first. On success, resourceId is used as centerId
      for create_group_config. Both must succeed before navigating to group-dashboard.
      If offline, both are enqueued to sync_queue (operation: CREATE_GROUP + CREATE_GROUP_CONFIG).
