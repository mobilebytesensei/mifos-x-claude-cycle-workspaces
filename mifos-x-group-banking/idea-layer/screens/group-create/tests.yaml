sibling: tests
schema_version: "4.0"
feature_id: group-create

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GC-001
      scenario: "On mount, get_offices API loads office list and populates dropdown in Step 1"
      type: ViewModel
      priority: P0

    - id: TC-GC-002
      scenario: "Step 1 shows groupName, officeId, meetingDay, meetingTime fields with correct labels"
      type: Screen
      priority: P0

    - id: TC-GC-003
      scenario: "Step 2 shows GroupTypeConfig summary card from nav_arg (typeSlug, pool_model, contribution_model)"
      type: Screen
      priority: P0

    - id: TC-GC-004
      scenario: "Tapping Next on Step 1 with blank groupName shows validation error and does not advance"
      type: ViewModel
      priority: P0

    - id: TC-GC-005
      scenario: "groupName shorter than 3 characters fails validation with min_length error"
      type: ViewModel
      priority: P0

    - id: TC-GC-006
      scenario: "meetingDay not selected fails Step 1 validation and blocks Next"
      type: ViewModel
      priority: P0

    - id: TC-GC-007
      scenario: "officeId not selected fails Step 1 validation and blocks Next"
      type: ViewModel
      priority: P1

    - id: TC-GC-008
      scenario: "Valid Step 1 advances to Step 2; Step 2 shows typeConfig details and Submit button"
      type: ViewModel
      priority: P0

    - id: TC-GC-009
      scenario: "Back on Step 2 returns to Step 1 preserving entered values"
      type: ViewModel
      priority: P1

    - id: TC-GC-010
      scenario: "On submit with network available, create_group_orchestrate fires with typeConfig from nav_arg embedded in request body"
      type: ViewModel
      priority: P0
      given: "groupName='Mwangaza Women', officeId=10, typeConfig=VSLA from nav_arg"
      when: "OnCreateGroupTap action"
      then: "GroupRepository.createGroup called with CreateGroupOrchestrationRequest; typeConfig fields present in request body"

    - id: TC-GC-011
      scenario: "On create_group_orchestrate success, ViewModel navigates to group-dashboard with returned groupId"
      type: ViewModel
      priority: P0
      given: "create_group_orchestrate returns CreateGroupOrchestrationResponse with groupId='GRP-001'"
      when: "Repository emits success"
      then: "NavigateToGroupDashboard emitted with groupId='GRP-001'"

    - id: TC-GC-012
      scenario: "409 conflict from create_group_orchestrate (name taken) shows error snackbar, does not navigate"
      type: ViewModel
      priority: P1
      given: "create_group_orchestrate returns 409"
      when: "OnCreateGroupTap action"
      then: "error_group_name_taken message shown, navigation NOT fired"

    - id: TC-GC-013
      scenario: "When offline, submit enqueues CREATE_GROUP_ORCHESTRATE to sync_queue and shows offline queued state"
      type: ViewModel
      priority: P1
      given: "isOnline=false"
      when: "OnCreateGroupTap action"
      then: "SyncQueueRepository.enqueue called with entityType=CREATE_GROUP_ORCHESTRATE, priority=NORMAL; Queued state shown"

    - id: TC-GC-014
      scenario: "400 validation error from create_group_orchestrate shows field-level error messages"
      type: ViewModel
      priority: P1

    - id: TC-GC-015
      scenario: "Office dropdown displays all offices from get_offices response"
      type: Screen
      priority: P1

    - id: TC-GC-016
      scenario: "GroupRepository.createGroup maps CreateGroupOrchestrationRequest to companion API POST /companion/groups body correctly"
      type: Repository
      priority: P0

    - id: TC-GC-017
      scenario: "Progress indicator shows current step (1 of 2) correctly"
      type: Screen
      priority: P2

    - id: TC-GC-018
      scenario: "Offices cache is used on re-entry without firing API again (TTL 3600s)"
      type: Repository
      priority: P2

    - id: TC-GC-019
      scenario: "groups_cache and group_type_config_cache are written after successful orchestration"
      type: Repository
      priority: P1
      given: "create_group_orchestrate succeeds"
      when: "Repository processes response"
      then: "groups_cache upserted with new groupId; group_type_config_cache written with typeConfig from nav_arg"
