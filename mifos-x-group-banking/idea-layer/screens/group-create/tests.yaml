sibling: tests
schema_version: "4.0"
feature_id: group-create
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GC-001
      scenario: "On mount, GroupTypeConfig loaded from nav_params and group form initialises"
      type: ViewModel
      priority: P0
      given: "nav_params: groupTypeConfig={id:'vsla', poolModel:ACCUMULATING, contributionModel:FIXED_AMOUNT}"
      when: "GroupCreateScreen enters composition"
      then: "groupTypeConfig stored; form fields empty; isSubmitting=false; GroupCreateScreenState=Content"

    - id: TC-GC-002
      scenario: "Empty group name shows nameError on submit attempt"
      type: ViewModel
      priority: P0
      given: "groupName empty"
      when: "OnSubmit fires"
      then: "nameError=error_name_required; submit blocked; no API call"

    - id: TC-GC-003
      scenario: "Meeting day and frequency required fields show errors when empty"
      type: ViewModel
      priority: P0
      given: "meetingDay not selected; meetingFrequency not selected"
      when: "OnSubmit fires"
      then: "meetingDayError set; meetingFrequencyError set; submit blocked"

    - id: TC-GC-004
      scenario: "FIXED_AMOUNT contribution model shows fixed amount field"
      type: Screen
      priority: P0
      given: "groupTypeConfig.contributionModel=FIXED_AMOUNT"
      when: "GroupCreateForm renders"
      then: "fixedContributionAmount field visible; share-based fields hidden"

    - id: TC-GC-005
      scenario: "SHARE_BASED_VARIABLE contribution model shows share value field"
      type: Screen
      priority: P0
      given: "groupTypeConfig.contributionModel=SHARE_BASED_VARIABLE"
      when: "GroupCreateForm renders"
      then: "shareValue field visible; fixedContributionAmount field hidden"

    - id: TC-GC-006
      scenario: "OnSubmit when online POSTs to companion API and navigates to group-dashboard"
      type: ViewModel
      priority: P0
      given: "all required fields valid; network online"
      when: "OnSubmit fires"
      then: "isSubmitting=true; POST /companion/groups called with form data + groupTypeConfig; on 201 GroupCreated event emitted with new groupId; NavigateToGroupDashboard emitted"

    - id: TC-GC-007
      scenario: "Group name already taken error shown inline on groupName field"
      type: ViewModel
      priority: P1
      given: "server returns name_already_taken error"
      when: "OnSubmit fires"
      then: "nameError=error_name_taken; isSubmitting=false; form stays open"

    - id: TC-GC-008
      scenario: "Network error shows error snackbar and allows retry"
      type: ViewModel
      priority: P1
      given: "network offline when OnSubmit fires"
      when: "OnSubmit fires"
      then: "ShowSnackbar('No network') emitted; isSubmitting=false"

    - id: TC-GC-009
      scenario: "ROTATING_PAYOUT pool shows payout order configuration section"
      type: Screen
      priority: P1
      given: "groupTypeConfig.poolModel=ROTATING_PAYOUT"
      when: "GroupCreateForm renders"
      then: "payout order section visible; initial beneficiary order UI shown"

    - id: TC-GC-010
      scenario: "Form header shows selected group type name and description"
      type: Screen
      priority: P1
      given: "groupTypeConfig.name='VSLA'; groupTypeConfig.tagline='Village savings and loans'"
      when: "GroupCreateScreen renders"
      then: "type name 'VSLA' and tagline shown in form header chip"

    - id: TC-GC-011
      scenario: "Auth 401 redirects to login-signup"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "OnSubmit returns 401"
      then: "GroupCreateError type=Auth; NavigateToLoginSignup emitted"

    - id: TC-GC-012
      scenario: "Loading indicator shown on Create Group button while isSubmitting=true"
      type: Screen
      priority: P1
      given: "isSubmitting=true"
      when: "GroupCreateScreen renders"
      then: "Create Group button shows loading spinner; all form fields disabled"
