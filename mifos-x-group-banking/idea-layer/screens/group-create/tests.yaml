sibling: tests
schema_version: "4.0"
feature_id: group-create

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GC-001
      scenario: "On mount, get_offices API loads office list and populates dropdown in Step 1"
      type: ViewModel
      priority: P0

    - id: TC-GC-002
      scenario: "Step 1 shows groupName, officeId, meetingDay, meetingTime fields with correct labels"
      type: Screen
      priority: P0

    - id: TC-GC-003
      scenario: "Step 2 shows contributionMin, contributionMax, loanMultiplier, interestRate, cycleLengthMonths, fineAmount fields"
      type: Screen
      priority: P0

    - id: TC-GC-004
      scenario: "Tapping Next on Step 1 with blank groupName shows validation error and does not advance"
      type: ViewModel
      priority: P0

    - id: TC-GC-005
      scenario: "groupName shorter than 3 characters fails validation with min_length error"
      type: ViewModel
      priority: P0

    - id: TC-GC-006
      scenario: "contributionMax less than contributionMin fails validation"
      type: ViewModel
      priority: P0

    - id: TC-GC-007
      scenario: "loanMultiplier outside 1–10 range fails validation"
      type: ViewModel
      priority: P1

    - id: TC-GC-008
      scenario: "Valid Step 1 advances to Step 2; valid Step 2 enables Submit button"
      type: ViewModel
      priority: P0

    - id: TC-GC-009
      scenario: "Back on Step 2 returns to Step 1 preserving entered values"
      type: ViewModel
      priority: P1

    - id: TC-GC-010
      scenario: "On submit with network available, create_center fires then create_group_config uses returned resourceId"
      type: ViewModel
      priority: P0

    - id: TC-GC-011
      scenario: "On success of both API calls, ViewModel navigates to group-dashboard"
      type: ViewModel
      priority: P0

    - id: TC-GC-012
      scenario: "create_group_config failure after create_center success shows error and does not navigate"
      type: ViewModel
      priority: P1

    - id: TC-GC-013
      scenario: "When offline, submit enqueues to sync_queue and shows offline sync dialog"
      type: ViewModel
      priority: P1

    - id: TC-GC-014
      scenario: "400 validation error from create_center shows field-level error messages"
      type: ViewModel
      priority: P1

    - id: TC-GC-015
      scenario: "Office dropdown displays all offices from get_offices response"
      type: Screen
      priority: P1

    - id: TC-GC-016
      scenario: "GroupRepository.createGroup correctly maps CreateGroupRequest to Fineract POST body"
      type: Repository
      priority: P0

    - id: TC-GC-017
      scenario: "Progress indicator shows current step (1 of 2) correctly"
      type: Screen
      priority: P2

    - id: TC-GC-018
      scenario: "Offices cache is used on re-entry without firing API again (TTL 3600s)"
      type: Repository
      priority: P2
