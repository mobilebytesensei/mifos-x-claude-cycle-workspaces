id: group-create
name: Group Create
description: >
  Four-step wizard to create a new savings group under the unified-identity / per-group-role model. The wizard is
  GROUP-TYPE-DRIVEN: it receives a GroupTypeConfig nav-arg from group-type-picker and adapts Step 2 fields accordingly —
  share_value/shareMin/shareMax for VSLA (SHARE_BASED_VARIABLE), contribution_amount for ROSCA/SHG (FIXED_AMOUNT),
  payoutOrderMethod for ROTATING_PAYOUT types, and a social_fund toggle for all. Step 1 = Identity (name, office,
  currency, meeting schedule). Step 2 = Type-adaptive Rules. Step 3 = Members (maxMembers cap). Step 4 = Review +
  submit. Submission calls COMP-GRP-001 companion API which orchestrates group creation, activate, associateClients,
  assignRole (organizer for creator), and group_type_config datatable provisioning in a single back-end transaction.
  Supports offline queueing via SyncQueue. Covers FR-001, FR-021 (self-signup group creation), FR-022 (config-driven
  group type). No raw Fineract endpoints remain in this screen.
