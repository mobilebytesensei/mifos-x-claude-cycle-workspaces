id: group-create
name: Group Create
description: >
  Three-step wizard to create a new savings group. Step 1 captures group identity
  (name, office, currency, meeting schedule). Step 2 captures group rules (contribution
  limits, loan multiplier, interest rate, cycle length, fines). Step 3 shows a review
  summary before submission. Creates a Fineract Center and writes a dt_group_config
  datatable entry. Supports offline queueing via SyncQueue. Covers FR-001.
feature: group-management
flow: group-management-flow
version: "1.0.0"
tags:
  - group-management
  - admin
  - form
  - wizard
  - offline-capable
  - FR-001

