<!DOCTYPE html>
<html lang="en" data-feature="group-create" data-state="success" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-create · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .success-container {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 24px 32px; text-align: center; min-height: calc(100vh - 120px);
  }
  .success-icon { font-size: 64px; line-height: 1; margin-bottom: 20px; }
  .success-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin: 0 0 10px; }
  .success-body { font-size: 15px; color: #555; margin: 0 0 8px; line-height: 1.5; }
  .success-hint { font-size: 14px; color: #888; margin: 0 0 36px; }
  .action-group { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" style="visibility:hidden;">‹</button>
    <h1 class="app-bar-title">Create Group</h1>
  </header>
  <main>
    <div class="success-container">
      <div class="empty-state">
        <div class="empty-icon">✅</div>
        <h2 class="empty-title">Group Created!</h2>
        <p class="empty-body">Mwangaza Women&#39;s Group has been set up successfully.</p>
        <p class="success-hint">Invite your first members to get started.</p>
        <div class="action-group">
          <button class="btn btn-full" data-nav-to="group-dashboard">Go to Group</button>
          <button class="btn btn-secondary btn-full" data-nav-to="member-invite">Invite Members</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
