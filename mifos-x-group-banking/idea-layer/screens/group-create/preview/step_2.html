<!DOCTYPE html>
<!-- render-hash: group-create-step2-v2-shared-ds -->
<html lang="en" data-feature="group-create" data-state="step_2" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>group-create · step 2 rules · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* group-create local — step indicator + adaptive-type chip (uses shared tokens only) */
  .gc-chip-row { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-md) var(--space-base) 0; }
  .gc-type-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px var(--space-md); border-radius: 9999px; background: var(--accent-100); color: #B45309; font-size: 13px; font-weight: 600; }
  .gc-type-chip .ico { font-size: 15px; }
  .gc-type-sub { font-size: 12px; color: var(--text-secondary); }
  .gc-fieldset-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .6px; margin: var(--space-sm) 0 var(--space-md); }
  .gc-field-row { display: flex; gap: var(--space-md); }
  .gc-field-row .form-field { flex: 1; }
  .gc-switch-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
  .gc-switch-row label { margin: 0; }
  .gc-switch { width: 44px; height: 26px; border-radius: 9999px; background: var(--primary-700); position: relative; flex-shrink: 0; }
  .gc-switch::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
</style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <button class="back-btn" aria-label="Close" data-nav-to="group-list">✕</button>
    <h1>New VSLA Group</h1>
  </header>

  <main>
    <!-- group_type_banner (chip) -->
    <div class="gc-chip-row">
      <span class="gc-type-chip"><span class="ico">🏷️</span> VSLA</span>
      <span class="gc-type-sub">Share-based · Accumulating</span>
    </div>

    <!-- step_indicator (step 2 Rules current; step 1 done) -->
    <div class="stepper" style="margin-top: var(--space-base);">
      <div class="step"><span class="dot">✓</span> Identity</div>
      <span class="step-sep">›</span>
      <div class="step current"><span class="dot">2</span> Rules</div>
      <span class="step-sep">›</span>
      <div class="step"><span class="dot">3</span> Members</div>
      <span class="step-sep">›</span>
      <div class="step"><span class="dot">4</span> Review</div>
    </div>

    <div class="card">
      <!-- SHARE_BASED_VARIABLE (VSLA) fields -->
      <div class="gc-fieldset-label">Share Contributions</div>

      <!-- share_value_field -->
      <div class="form-field">
        <label for="gc-share-value">Share Value (KES per share)</label>
        <input id="gc-share-value" type="text" inputmode="numeric" class="amount-input" value="200">
      </div>

      <!-- share_min_field + share_max_field -->
      <div class="gc-field-row">
        <div class="form-field">
          <label for="gc-share-min">Min Shares / Meeting</label>
          <input id="gc-share-min" type="text" inputmode="numeric" value="1">
        </div>
        <div class="form-field">
          <label for="gc-share-max">Max Shares / Meeting</label>
          <input id="gc-share-max" type="text" inputmode="numeric" value="5">
        </div>
      </div>

      <div class="divider"></div>
      <div class="gc-fieldset-label">Loan &amp; Cycle Rules</div>

      <!-- loan_multiplier_field -->
      <div class="form-field">
        <label for="gc-loan-mult">Loan Multiplier (×savings)</label>
        <input id="gc-loan-mult" type="text" inputmode="numeric" value="3">
      </div>

      <!-- interest_rate_field -->
      <div class="form-field">
        <label for="gc-interest">Interest Rate (%)</label>
        <input id="gc-interest" type="text" inputmode="numeric" value="10">
      </div>

      <!-- cycle_length_field -->
      <div class="form-field">
        <label for="gc-cycle">Cycle Length (months)</label>
        <input id="gc-cycle" type="text" inputmode="numeric" value="12">
      </div>

      <!-- fine_amount_field -->
      <div class="form-field" style="margin-bottom: 0;">
        <label for="gc-fine">Late Penalty / Fine (KES)</label>
        <input id="gc-fine" type="text" inputmode="numeric" value="50">
      </div>
    </div>

    <div class="card">
      <!-- social_fund_toggle -->
      <div class="gc-switch-row">
        <label for="gc-social-fund">Enable Social / Welfare Fund</label>
        <span class="gc-switch" role="switch" aria-checked="true" id="gc-social-fund" data-action="OnSocialFundToggle"></span>
      </div>

      <div class="divider"></div>

      <!-- social_fund_percent_field (visible when toggle on) -->
      <div class="form-field" style="margin-bottom: 0;">
        <label for="gc-social-pct">Social Fund % of Corpus</label>
        <input id="gc-social-pct" type="text" inputmode="numeric" value="5">
        <span class="help">A slice of every share-out held back for member emergencies.</span>
      </div>
    </div>

    <!-- footer: back_step_button + next_button -->
    <div class="btn-stack">
      <button class="btn btn-primary btn-full" data-state-to="step_3" data-action-id="OnNextStep">Next</button>
      <button class="btn btn-secondary btn-full" data-state-to="content" data-action-id="OnPreviousStep">Back</button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
