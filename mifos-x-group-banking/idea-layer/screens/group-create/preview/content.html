<!DOCTYPE html>
<html lang="en" data-feature="group-create" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-create · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .step-indicator { padding: 12px 16px 0; }
  .step-label { font-size: 12px; color: #666; display: block; margin-bottom: 6px; }
  .step-bar { height: 4px; background: #e0e0e0; border-radius: 2px; }
  .step-fill { height: 4px; background: #1565c0; border-radius: 2px; }
  .section-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.8px; margin: 0 0 8px; }
  .contribution-card { background: #f5f7fa; border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
  .contribution-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .contribution-row:last-child { margin-bottom: 0; }
  .contribution-label { font-size: 13px; color: #555; }
  .contribution-value { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .form-footer { padding: 16px; padding-bottom: 32px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-type-picker">‹</button>
    <h1 class="app-bar-title">Create Group</h1>
  </header>
  <main>
    <div class="step-indicator">
      <span class="step-label">Step 1 of 4</span>
      <div class="step-bar"><div class="step-fill" style="width:25%"></div></div>
    </div>

    <div style="padding: 12px 16px 0;">
      <div class="banner banner-info">
        <span class="chip">VSLA</span> Village Savings &amp; Loan Association
      </div>
    </div>

    <div style="padding: 16px;">
      <p class="section-label">Group Details</p>

      <div class="input-group">
        <label>Group Name</label>
        <input type="text" value="Mwangaza Women&#39;s Group">
      </div>

      <div class="input-group">
        <label>Description (optional)</label>
        <textarea placeholder="What is this group for?"></textarea>
      </div>

      <div class="contribution-card">
        <p class="section-label" style="margin-bottom:10px;">Contribution Model</p>
        <div class="contribution-row">
          <span class="contribution-label">Type</span>
          <span class="contribution-value">Share-based variable</span>
        </div>
        <div class="contribution-row">
          <span class="contribution-label">Share value</span>
          <span class="contribution-value">KES 200</span>
        </div>
        <div class="contribution-row">
          <span class="contribution-label">Max shares / member</span>
          <span class="contribution-value">20</span>
        </div>
      </div>
    </div>
  </main>

  <div class="form-footer">
    <button class="btn btn-full">Next</button>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
