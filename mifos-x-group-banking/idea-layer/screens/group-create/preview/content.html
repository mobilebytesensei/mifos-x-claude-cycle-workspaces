<!DOCTYPE html>
<!-- render-hash: group-create/content ui=39482da74ab2 demo=5357b9e5f791 prompt=f8fb6c47b720 v3 -->
<html lang="en" data-feature="group-create" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>group-create · content · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* group-create local — step indicator + adaptive-type chip (shared tokens only) */
  .gc-chip-row { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-md) var(--space-base) 0; }
  .gc-type-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px var(--space-md); border-radius: 9999px; background: var(--accent-100); color: #B45309; font-size: 13px; font-weight: 600; }
  .gc-type-chip .ico { font-size: 15px; }
  .gc-type-sub { font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar (from ui.yaml components[0]; on_navigation_click -> OnBack -> group-type-picker) -->
  <header class="top-app-bar">
    <button class="back-btn" aria-label="Close" data-nav-to="group-type-picker" data-action-id="OnBack">✕</button>
    <h1>New VSLA Group</h1>
  </header>

  <main>
    <!-- group_type_banner (chip) — groupTypeName from demo-data typeConfig -->
    <div class="gc-chip-row">
      <span class="gc-type-chip"><span class="ico">🏷️</span> VSLA</span>
      <span class="gc-type-sub">Village Savings &amp; Loan Association</span>
    </div>

    <!-- step_indicator (currentStep = 1 -> Identity active) -->
    <div class="stepper" style="margin-top: var(--space-base);">
      <div class="step current"><span class="dot">1</span> Identity</div>
      <span class="step-sep">›</span>
      <div class="step"><span class="dot">2</span> Rules</div>
      <span class="step-sep">›</span>
      <div class="step"><span class="dot">3</span> Members</div>
      <span class="step-sep">›</span>
      <div class="step"><span class="dot">4</span> Review</div>
    </div>

    <div class="card">
      <!-- group_name_field -->
      <div class="form-field">
        <label for="gc-name">Group Name</label>
        <input id="gc-name" type="text" value="Mwangaza Women's Group">
      </div>

      <!-- office_dropdown — options from demo-data Office collection -->
      <div class="form-field">
        <label for="gc-office">Office</label>
        <select id="gc-office">
          <option selected>Kisumu West Branch</option>
          <option>Kisumu East Branch</option>
          <option>Kisumu Central Branch</option>
        </select>
      </div>

      <!-- currency_dropdown -->
      <div class="form-field">
        <label for="gc-currency">Currency</label>
        <select id="gc-currency">
          <option selected>KES</option>
          <option>USD</option>
          <option>UGX</option>
          <option>TZS</option>
        </select>
      </div>

      <!-- meeting_day_dropdown -->
      <div class="form-field">
        <label for="gc-day">Meeting Day</label>
        <select id="gc-day">
          <option selected>Monday</option>
          <option>Tuesday</option>
          <option>Wednesday</option>
          <option>Thursday</option>
          <option>Friday</option>
          <option>Saturday</option>
          <option>Sunday</option>
        </select>
      </div>

      <!-- meeting_time_picker -->
      <div class="form-field" style="margin-bottom: 0;">
        <label for="gc-time">Meeting Time</label>
        <input id="gc-time" type="time" value="09:00">
      </div>
    </div>

    <!-- next_button (visible: currentStep < 4; action: OnNextStep, transform_state currentStep) -->
    <button class="btn btn-primary btn-full" data-state-to="step_2" data-action-id="OnNextStep">Next</button>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
