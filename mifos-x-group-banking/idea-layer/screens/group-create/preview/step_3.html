<!DOCTYPE html>
<!-- render-hash: group-create-step3-v2-shared-ds -->
<html lang="en" data-feature="group-create" data-state="step_3" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>group-create · step 3 members · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* group-create local — step indicator + adaptive-type chip (uses shared tokens only) */
  .gc-chip-row { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-md) var(--space-base) 0; }
  .gc-type-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px var(--space-md); border-radius: 9999px; background: var(--accent-100); color: #B45309; font-size: 13px; font-weight: 600; }
  .gc-type-chip .ico { font-size: 15px; }
  .gc-type-sub { font-size: 12px; color: var(--text-secondary); }
</style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <button class="back-btn" aria-label="Close" data-nav-to="group-list">✕</button>
    <h1>New VSLA Group</h1>
  </header>

  <main>
    <!-- group_type_banner (chip) -->
    <div class="gc-chip-row">
      <span class="gc-type-chip"><span class="ico">🏷️</span> VSLA</span>
      <span class="gc-type-sub">Village Savings &amp; Loan Association</span>
    </div>

    <!-- step_indicator (step 3 Members current; steps 1-2 done) -->
    <div class="stepper" style="margin-top: var(--space-base);">
      <div class="step"><span class="dot">✓</span> Identity</div>
      <span class="step-sep">›</span>
      <div class="step"><span class="dot">✓</span> Rules</div>
      <span class="step-sep">›</span>
      <div class="step current"><span class="dot">3</span> Members</div>
      <span class="step-sep">›</span>
      <div class="step"><span class="dot">4</span> Review</div>
    </div>

    <div class="card">
      <!-- max_members_field -->
      <div class="form-field" style="margin-bottom: 0;">
        <label for="gc-max-members">Max Members</label>
        <input id="gc-max-members" type="text" inputmode="numeric" value="20">
        <span class="help">Cap on how many members can join this group. Members are added after the group is created.</span>
      </div>
    </div>

    <!-- footer: back_step_button + next_button -->
    <div class="btn-stack">
      <button class="btn btn-primary btn-full" data-state-to="step_4" data-action-id="OnNextStep">Next</button>
      <button class="btn btn-secondary btn-full" data-state-to="step_2" data-action-id="OnPreviousStep">Back</button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
