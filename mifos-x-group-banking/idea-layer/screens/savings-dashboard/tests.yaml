sibling: tests
schema_version: "4.0"
feature_id: savings-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SD-001
      scenario: "On mount — LoadDashboard fetches group and individual summaries; Content on success"
      type: ViewModel
      priority: P0
      given: "groupId='grp-001' and typeConfig from nav params, cache empty"
      when: "SavingsDashboardScreen enters composition (LoadDashboard)"
      then: "isLoading true then false; groupSavingsSummary and individualSavingsSummary populated from companion API; selectedTab=GROUP; group tab shows member rows; screen_state=Content"

    - id: TC-SD-002
      scenario: "Tab switch to Individual updates selectedTab without a network call"
      type: ViewModel
      priority: P0
      given: "Content state on GROUP tab, both summaries already loaded"
      when: "SelectTab(INDIVIDUAL) dispatched"
      then: "state.selectedTab=INDIVIDUAL (pure transform_state, no companion fetch); individual_savings_content pane visible, group_savings_content hidden"

    - id: TC-SD-003
      scenario: "Cycle progress card computes percentage client-side"
      type: Screen
      priority: P0
      given: "cycleCollected=24000, cycleTarget=30000, contributionModel=FIXED_AMOUNT"
      when: "Content state rendered in GROUP tab"
      then: "cycle_progress_bar value=0.80, text='KES 24000 of KES 30000', '80% of cycle target'"

    - id: TC-SD-004
      scenario: "SHARE_BASED_VARIABLE cycle progress shows shares wording not KES"
      type: Screen
      priority: P0
      given: "contributionModel=SHARE_BASED_VARIABLE, cycleCollected=120, cycleTarget=200"
      when: "Content state rendered in GROUP tab"
      then: "Progress text='120 shares of 200 target' (the SHARE_BASED_VARIABLE branch), KES-worded branch hidden, cycle_progress_bar value=0.60"

    - id: TC-SD-005
      scenario: "Pull-to-refresh re-fetches both summaries via connectivity gate"
      type: ViewModel
      priority: P1
      given: "Content state, cached within TTL"
      when: "RefreshDashboard dispatched"
      then: "isRefreshing=true during fetch; cmp-network-monitor checked; group + individual summaries re-fetched from companion API; lastSyncAt updated; isRefreshing=false"

    - id: TC-SD-006
      scenario: "Tapping a group member row navigates to member-savings-detail"
      type: ViewModel
      priority: P0
      given: "GROUP tab content with member m-101 (Amina Hassan)"
      when: "OpenMemberDetail(memberId='m-101') dispatched"
      then: "NavigateToMemberDetail event emitted (navigate effect) with memberId='m-101', groupId='grp-001', typeConfig forwarded"

    - id: TC-SD-007
      scenario: "Tapping an individual member row navigates with savings_type=INDIVIDUAL"
      type: ViewModel
      priority: P1
      given: "INDIVIDUAL tab content with member row"
      when: "OpenMemberDetail(memberId='m-101', savings_type=INDIVIDUAL) dispatched"
      then: "NavigateToMemberDetail event emitted forwarding memberId, groupId, typeConfig and savings_type=INDIVIDUAL"

    - id: TC-SD-008
      scenario: "SHARE_BASED_VARIABLE member row shows shares @ share-value supporting text"
      type: Screen
      priority: P0
      given: "contributionModel=SHARE_BASED_VARIABLE, typeConfig.share_value=1000, member Amina sharesHeld=20 shareValue=20000"
      when: "GROUP tab content rendered"
      then: "member row supporting='20 shares @ KES 1000/share', trailing='KES 20000' with 'share value' caption"

    - id: TC-SD-009
      scenario: "FIXED_AMOUNT member row shows meetings + total-contributed columns"
      type: Screen
      priority: P0
      given: "contributionModel=FIXED_AMOUNT, member Peter meetingsContributed=8 totalContributed=15000 lastContribution=1875"
      when: "GROUP tab content rendered"
      then: "member row supporting='8 meetings · Last: KES 1875', trailing='KES 15000' with 'total' caption; shares wording NOT rendered"

    - id: TC-SD-010
      scenario: "Group total chip shows aggregate collected sum"
      type: Screen
      priority: P1
      given: "groupSavingsSummary.totalCollected=120000"
      when: "Content state in GROUP tab"
      then: "group_savings_total_chip label='Group total: KES 120000'"

    - id: TC-SD-011
      scenario: "Individual total card shows summed member balances"
      type: Screen
      priority: P1
      given: "selectedTab=INDIVIDUAL, individualSavingsSummary.totalBalance=8400"
      when: "INDIVIDUAL tab content rendered"
      then: "individual_total_card shows 'Total Individual Balances' label and 'KES 8400'"

    - id: TC-SD-012
      scenario: "Loading skeleton shown during initial fetch"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "Loading state rendered"
      then: "loading_skeleton (shimmer count=6) visible; tab_row visible; savings content hidden"

    - id: TC-SD-013
      scenario: "Offline fallback shows cached data with sync band and error banner"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false, cached data in LocalSavingsDao, lastSyncAt set"
      when: "LoadDashboard dispatched"
      then: "screen_state=content_with_error; error_banner shown with network_error message; sync_band shows 'Last synced: {lastSyncAt}'"

    - id: TC-SD-014
      scenario: "Error banner retry re-fetches via connectivity gate"
      type: ViewModel
      priority: P1
      given: "content_with_error state, NetworkMonitor.isOnline=true"
      when: "RefreshDashboard dispatched from error_banner Retry action"
      then: "cmp-network-monitor confirms online, group + individual summaries re-fetched, lastSyncAt updated, error cleared, Content restored"

    - id: TC-SD-015
      scenario: "No cached data and offline shows full error state"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false, LocalSavingsDao empty"
      when: "LoadDashboard dispatched"
      then: "screen_state=Error; top_app_bar and error_banner shown; group/individual content hidden"

    - id: TC-SD-016
      scenario: "Empty state shown when companion API returns no savings data"
      type: Screen
      priority: P1
      given: "groupSavingsSummary and individualSavingsSummary both empty, no error"
      when: "Content resolves to empty"
      then: "screen_state=Empty; top_app_bar and tab_row shown; member rows and totals absent"

    - id: TC-SD-017
      scenario: "Store5 cache keyed by groupId serves within TTL 300s"
      type: Repository
      priority: P0
      given: "Two loadDashboard calls with same groupId='grp-001' within 300s TTL"
      when: "Second call within TTL"
      then: "Cache hit returned from LocalSavingsDao; no second companion-API request; cache key contains groupId (not centerId)"

    - id: TC-SD-018
      scenario: "Weekly trend chart binds group amounts on GROUP tab"
      type: Screen
      priority: P2
      given: "weeklyTrend points W48..W3 with groupAmount values"
      when: "GROUP tab content rendered"
      then: "weekly_trend_chart_group bar chart plots groupAmount by weekLabel (W48=1000 .. W3=1850)"

    - id: TC-SD-019
      scenario: "Session expiry (401) redirects to login"
      type: ViewModel
      priority: P0
      given: "companion-API token expired"
      when: "get group savings summary returns 401"
      then: "ShowError not swallowed; user redirected to login on 401"
