sibling: tests
schema_version: "4.0"
feature_id: savings-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SD-001
      scenario: "On mount — get_group_savings_summary and get_individual_savings_summary fire in parallel; Content state on success"
      type: ViewModel
      priority: P0
      given: "groupId='GRP-001' from nav param (no centerId)"
      when: "SavingsDashboardScreen enters composition"
      then: "isLoading=true → false; GroupSavingsSummary and IndividualSavingsSummary populated; group tab shows 5 member rows"

    - id: TC-SD-002
      scenario: "Tab switch — selecting Individual tab shows individual savings content"
      type: ViewModel
      priority: P0
      given: "Content state on GROUP tab"
      when: "SelectTab(INDIVIDUAL) action"
      then: "selectedTab == INDIVIDUAL; individualSavingsSummary rows rendered"

    - id: TC-SD-003
      scenario: "Cycle progress card shows correct percentage calculation"
      type: Screen
      priority: P0
      given: "cycleCollected=24000, cycleTarget=30000"
      when: "Content state rendered"
      then: "Progress bar value = 0.80, text shows 'KES 24,000 of KES 30,000', '80% of cycle target'"

    - id: TC-SD-004
      scenario: "Pull to refresh — bypass_and_refresh strategy fires both summary endpoints again"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefreshTap action"
      then: "isRefreshing=true during fetch; both get_group_savings_summary + get_individual_savings_summary re-fetched; false on completion"

    - id: TC-SD-005
      scenario: "Tapping member row navigates to member-savings-detail with groupId + memberId"
      type: ViewModel
      priority: P0
      given: "Group tab content with member rows"
      when: "OnMemberRowTap(memberId='MBR-101')"
      then: "NavigateToMemberSavingsDetail emitted with groupId='GRP-001', memberId='MBR-101'"

    - id: TC-SD-006
      scenario: "Offline fallback — cached data displayed with sync band and error banner"
      type: ViewModel
      priority: P1
      given: "Network unavailable, cached data exists in group_savings_cache and individual_savings_cache"
      when: "LoadDashboard action"
      then: "State is content_with_error, error_banner shown, sync_band shows lastSyncAt timestamp"

    - id: TC-SD-007
      scenario: "Error state — no cached data shows full error screen"
      type: ViewModel
      priority: P1
      given: "Network unavailable, no cached data"
      when: "LoadDashboard action"
      then: "Error state shown with retry CTA"

    - id: TC-SD-008
      scenario: "Loading skeleton shown during initial fetch"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "Loading state rendered"
      then: "shimmer component visible; tab_row visible; savings content hidden"

    - id: TC-SD-009
      scenario: "Group total chip shows correct aggregate sum from GroupSavingsSummary"
      type: Screen
      priority: P1
      given: "groupSavingsSummary.totalCollected=24000"
      when: "Content state in GROUP tab"
      then: "Chip label shows 'Group total: KES 24,000'"

    - id: TC-SD-010
      scenario: "SHARE_BASED_VARIABLE members show sharesHeld + shareValue columns, not totalSavings"
      type: Screen
      priority: P0
      given: "contribution_model=SHARE_BASED_VARIABLE in typeConfig; member Amina has sharesHeld=20, shareValue=6000"
      when: "GROUP tab content rendered"
      then: "Column headers show 'Shares' and 'Value'; member row shows '20 shares @ KES 300'"

    - id: TC-SD-011
      scenario: "FIXED_AMOUNT members show totalContributed + meetingsContributed columns"
      type: Screen
      priority: P0
      given: "contribution_model=FIXED_AMOUNT in typeConfig; member Peter has totalContributed=1500, meetingsContributed=5"
      when: "GROUP tab content rendered"
      then: "Column headers show 'Contributed' and 'Meetings'; sharesHeld column NOT rendered"

    - id: TC-SD-012
      scenario: "Session expiry (401) navigates to login"
      type: ViewModel
      priority: P0
      given: "Token expired"
      when: "get_group_savings_summary returns 401"
      then: "NavigateBack emitted, user redirected to login"

    - id: TC-SD-013
      scenario: "group_savings_cache and individual_savings_cache keyed by groupId, not centerId"
      type: Repository
      priority: P0
      given: "Two calls with same groupId='GRP-001' within TTL 300s"
      when: "Second call within TTL"
      then: "Cache hit returned; no second API request; cache key contains groupId not centerId"

    - id: TC-SD-014
      scenario: "Individual member balance sorted by highest balance first in Individual tab"
      type: Repository
      priority: P2
      given: "5 members with different balances from IndividualSavingsSummary"
      when: "Individual tab rendered"
      then: "memberRows ordered descending by savingsBalance"
