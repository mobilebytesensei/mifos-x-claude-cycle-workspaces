sibling: tests
schema_version: "4.0"
feature_id: savings-dashboard
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SD-001
      scenario: "On mount, savings data loads from SavingsRepository for groupId"
      type: ViewModel
      priority: P0
      given: "groupId=1; network online"
      when: "SavingsDashboardScreen enters composition"
      then: "SavingsRepository.getGroupSavings(groupId=1) called; savings data populated; SavingsDashboardScreenState=Content"

    - id: TC-SD-002
      scenario: "ACCUMULATING pool shows corpus balance and cycle target progress bar"
      type: Screen
      priority: P0
      given: "Content state; poolModel=ACCUMULATING; corpusBalance=45000.0; cycleTarget=60000.0"
      when: "PoolSummaryCard renders"
      then: "KES 45,000 balance; 75% progress bar; cycle target KES 60,000 shown; no payout schedule"

    - id: TC-SD-003
      scenario: "ROTATING_PAYOUT pool shows weekly trend sparkline and current beneficiary"
      type: Screen
      priority: P0
      given: "Content state; poolModel=ROTATING_PAYOUT; weeklyTrend=[1000,1000,1500,1000]"
      when: "PoolSummaryCard renders"
      then: "sparkline chart renders 4-week trend; current beneficiary name shown; no corpus bar"

    - id: TC-SD-004
      scenario: "Member savings list shows individual balances and contribution model"
      type: Screen
      priority: P1
      given: "Content state; members=[{name:'Ali', model:SHARE_BASED_VARIABLE, shares:5}, {name:'Zara', model:FIXED_AMOUNT, balance:3000}]"
      when: "MemberSavingsList renders"
      then: "Ali: 5 shares shown; Zara: KES 3,000 shown; model label adjacent to each"

    - id: TC-SD-005
      scenario: "Tapping member savings row navigates to member-savings-detail"
      type: Screen
      priority: P1
      given: "Content state; member.id=3"
      when: "OnMemberSavingsClick(3) fires"
      then: "NavigateToMemberSavingsDetail emitted with memberId=3 and groupId=1"

    - id: TC-SD-006
      scenario: "Pull-to-refresh reloads savings data"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh fires"
      then: "isRefreshing=true; SavingsRepository.getGroupSavings re-called; isRefreshing=false"

    - id: TC-SD-007
      scenario: "Error state shows retry on network failure"
      type: Screen
      priority: P1
      given: "SavingsRepository.getGroupSavings returns network error"
      when: "load completes"
      then: "SavingsDashboardScreenState=Error; retry CTA visible"

    - id: TC-SD-008
      scenario: "Auth 401 redirects to login-signup"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "savings load returns 401"
      then: "SavingsDashboardError type=Auth; NavigateToLoginSignup emitted"
