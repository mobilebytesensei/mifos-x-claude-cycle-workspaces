sibling: tests
schema_version: "4.0"
feature_id: savings-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    UseCase: "85%+"

  scenarios:
    - id: TC-SD-001
      scenario: "On mount — loading state shown, then group savings data displayed in Group tab"
      type: ViewModel
      priority: P0
      given: "centerId=1 passed as nav param"
      when: "LoadDashboard action dispatched"
      then: "isLoading transitions false → content, groupSavingsSummary populated with 5 members, weekly trend chart has 6 data points"

    - id: TC-SD-002
      scenario: "Tab switch — selecting Individual tab shows individual savings content"
      type: ViewModel
      priority: P0
      given: "Content state on GROUP tab"
      when: "SelectTab(INDIVIDUAL) action"
      then: "selectedTab == INDIVIDUAL, individualSavingsSummary.totalBalance == 37400, individual member rows rendered"

    - id: TC-SD-003
      scenario: "Cycle progress card shows correct percentage calculation"
      type: Screen
      priority: P0
      given: "cycleCollected=24000, cycleTarget=30000"
      when: "Content state rendered"
      then: "Progress bar value = 0.80, text shows 'KES 24000 of KES 30000', '80% of cycle target'"

    - id: TC-SD-004
      scenario: "Pull to refresh — triggers fresh API calls, isRefreshing shown"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "RefreshDashboard action"
      then: "isRefreshing=true during fetch, false on completion, data updated"

    - id: TC-SD-005
      scenario: "Tapping member row emits NavigateToMemberDetail event with correct params"
      type: ViewModel
      priority: P0
      given: "Group tab content with member rows"
      when: "OpenMemberDetail(memberId='101', savingsType=GROUP_LINKED)"
      then: "NavigateToMemberDetail event emitted with memberId='101' and savingsType=GROUP_LINKED"

    - id: TC-SD-006
      scenario: "Offline fallback — cached data displayed with sync band and error banner"
      type: ViewModel
      priority: P1
      given: "Network unavailable, cached data exists"
      when: "LoadDashboard action"
      then: "State is content_with_error, error_banner shown, sync_band shows lastSyncAt timestamp"

    - id: TC-SD-007
      scenario: "Error state — no cached data shows full error screen"
      type: ViewModel
      priority: P1
      given: "Network unavailable, no cached data"
      when: "LoadDashboard action"
      then: "State is error, error_banner shown with retry CTA"

    - id: TC-SD-008
      scenario: "Loading skeleton shown during initial fetch"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "Loading state rendered"
      then: "shimmer component visible with count=6, tab_row visible, savings content hidden"

    - id: TC-SD-009
      scenario: "Group total chip shows correct aggregate sum"
      type: Screen
      priority: P1
      given: "groupSavingsSummary.totalCollected=24000"
      when: "Content state in GROUP tab"
      then: "Chip label shows 'Group total: KES 24,000'"

    - id: TC-SD-010
      scenario: "Individual member balance sorted by highest balance first"
      type: UseCase
      priority: P2
      given: "5 members with different balances"
      when: "IndividualSavingsSummary computed"
      then: "memberRows ordered descending by currentBalance"

    - id: TC-SD-011
      scenario: "Bar chart renders with primary color for group tab"
      type: Screen
      priority: P2
      given: "weeklyTrend has 6 data points"
      when: "Group tab content rendered"
      then: "weekly_trend_chart_group visible with bar_color=primary, 6 bars rendered"

    - id: TC-SD-012
      scenario: "Session expiry (401) navigates to login"
      type: ViewModel
      priority: P0
      given: "Token expired"
      when: "API returns 401"
      then: "ShowError event emitted, NavigateToMemberDetail redirected to login"
