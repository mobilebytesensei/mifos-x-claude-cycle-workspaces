id: savings-dashboard
name: Savings Dashboard
description: >
  Contribution-model-aware group savings dashboard scoped to a single group (not cross-group). Display adapts to
  GroupTypeConfig.contribution_model: SHARE_BASED_VARIABLE (VSLA/SILC) shows "X shares @ KES Y/share" per member and
  shares-based cycle progress; FIXED_AMOUNT (ROSCA/SHG) shows "KES Z per meeting" and meeting-count progress;
  FIXED_NEGOTIATED (JLG) shows negotiated amounts. Data from companion API (/companion/groups/{groupId}/savings)
  replacing raw Fineract /savingsaccounts endpoints. Two tabs: Group Savings (mandatory contributions, cycle progress,
  per-member rows) and Individual Savings (voluntary per-member balances). Accessible to all group members; all roles
  see full contribution data. Offline-first — cached data with last-sync timestamp.
feature: savings-collection
flow: group-linked-savings-flow
version: 2.0.0
tags:
  - savings
  - dashboard
  - contribution-model-aware
  - companion-api
  - group-type-aware
  - dual-savings
  - charts
  - offline-first
