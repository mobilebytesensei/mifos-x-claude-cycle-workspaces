requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: savings-dashboard

route: /groups/{groupId}/savings
entry_points:
  - source: group-dashboard
    trigger: "OnViewSavings (all roles)"
nav_params:
  groupId: { type: String, required: true }
  typeConfig: { type: GroupTypeConfig, required: true }   # drives contribution model display

screens:
  - id: savings-dashboard-screen
    name: SavingsDashboardScreen
    type: dashboard
    description: >
      Contribution-model-aware savings dashboard scoped to a single group. Display adapts to
      GroupTypeConfig.contribution_model: SHARE_BASED_VARIABLE (VSLA/SILC) shows "X shares @
      KES Y/share" per member and cycle shares target; FIXED_AMOUNT (ROSCA/SHG) shows
      "KES Z per meeting" and cycle meeting progress; FIXED_NEGOTIATED (JLG) shows negotiated
      amounts. Cycle progress bar adapts to model. Data from companion API.

state_model:
  SavingsDashboardViewModel:
    state:
      name: SavingsDashboardState
      fields:
        selectedTab: { type: SavingsTab, default: "SavingsTab.GROUP" }
        groupId: { type: String, default: '""' }
        typeConfig: { type: "GroupTypeConfig?", default: "null" }
        contributionModel: { type: String, default: '""' }   # SHARE_BASED_VARIABLE | FIXED_AMOUNT | FIXED_NEGOTIATED
        groupSavingsSummary: { type: "GroupSavingsSummary?", default: "null" }
        individualSavingsSummary: { type: "IndividualSavingsSummary?", default: "null" }
        weeklyTrend: { type: "List<WeeklyContributionPoint>", default: "emptyList()" }
        isLoading: { type: Boolean, default: "true" }
        isRefreshing: { type: Boolean, default: "false" }
        error: { type: "String?", default: "null" }
        lastSyncAt: { type: "String?", default: "null" }
        cycleTarget: { type: Long, default: "0L" }
        cycleCollected: { type: Long, default: "0L" }
    screen_state:
      name: SavingsDashboardScreenState
      members: [Loading, Content, Empty, Error]
    errors:
      NetworkError: "Showing cached data. Pull to refresh when connected."
    events:
      name: SavingsDashboardEvent
      members:
        - { name: NavigateToMemberDetail, params: "memberId: String, groupId: String, typeConfig: GroupTypeConfig" }
        - { name: ShowError, params: "message: String" }
    actions:
      name: SavingsDashboardAction
      members:
        - { name: LoadDashboard, trigger: "Screen enters composition" }
        - { name: RefreshDashboard, trigger: "Pull-to-refresh" }
        - { name: SelectTab, params: { tab: SavingsTab }, trigger: "Tap tab" }
        - { name: OpenMemberDetail, params: { memberId: String }, trigger: "Tap member row" }
    di:
      - SavingsRepository    # companion API /companion/groups/{groupId}/savings
      - NavigationManager
      - ConnectivityObserver
      - LocalSavingsDao

business_logic:
  kind: composite
  description: >
    Fetches group and individual savings summaries from the companion API (/companion/groups/{groupId}/savings)
    via Store5 stale-while-revalidate; adapts per-member display to GroupTypeConfig.contribution_model —
    SHARE_BASED_VARIABLE (VSLA/SILC) renders sharesHeld × share_value, FIXED_AMOUNT/FIXED_NEGOTIATED renders
    totalContributed + meetingsContributed; cycle progress is computed client-side as cycleCollected/cycleTarget.
    Offline reads are served from SQLDelight LocalSavingsDao; cmp-network-monitor drives the connectivity
    gate for pull-to-refresh.
  library_refs:
    - cmp-network-monitor
  external_library_refs:
    - Store5
    - SQLDelight
  description_hash: "b3c2a1f4e5d6c7b8a9f0e1d2c3b4a5f6e7d8c9b0a1f2e3d4c5b6a7f8e9d0c1"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_app_bar
    type: top-app-bar
    title: "{strings.screen_title}"
    subtitle: "{strings.group_subtitle}"
    style: { background: surface }

  - id: sync_band
    type: banner
    visible_when: "lastSyncAt != null"
    style: { background: surfaceVariant, padding_horizontal: 16dp, padding_vertical: 4dp }
    content:
      - { type: text, value: "{strings.last_synced_prefix} {{lastSyncAt}}", style: { text_style: labelSmall, color: onSurfaceVariant } }

  - id: tab_row
    type: tab-row
    style:
      tabs:
        - { id: GROUP, label: "{strings.group_tab_label}", icon: people_money_24_regular }
        - { id: INDIVIDUAL, label: "{strings.individual_tab_label}", icon: person_money_24_regular }
      indicator_color: primary
      selected_label_color: primary
      unselected_label_color: onSurfaceVariant
    on_click:
      action: SelectTab
      params: { tab: "{{tappedTabId}}" }
      action_contract:
        effect: transform_state
        library_refs: []
        description: >
          Updates selectedTab in SavingsDashboardState to the tapped tab id (GROUP or INDIVIDUAL),
          switching the visible tab-content pane without a network call; no library needed.
        action_contract_hash: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: group_savings_content
    type: tab-content
    tab_id: GROUP
    visible_when: "selectedTab == GROUP"
    children:
      - id: weekly_trend_chart_group
        type: chart
        style:
          type: bar
          bar_color: primary
          height: 180dp
          margin_horizontal: 16dp
        data_source: weeklyTrend
        x_field: weekLabel
        y_field: groupAmount
        demo_data:
          - { weekLabel: "W48", groupAmount: 1000 }
          - { weekLabel: "W49", groupAmount: 1200 }
          - { weekLabel: "W50", groupAmount: 850 }
          - { weekLabel: "W51", groupAmount: 1500 }
          - { weekLabel: "W52", groupAmount: 1200 }
          - { weekLabel: "W3", groupAmount: 1850 }
      - id: cycle_progress_card
        type: card
        style: { background: primaryContainer, corner_radius: md, padding: 16dp, margin_horizontal: 16dp }
        content:
          - { type: text, value: "{strings.cycle_progress_label}", style: { text_style: labelLarge, color: onPrimaryContainer } }
          - id: cycle_progress_bar
            type: linear-progress
            value: "{{cycleCollected / cycleTarget}}"
            style: { track_color: primary, track_alpha: 0.3, indicator_color: primary, height: 8dp }
          # Contribution-model-adaptive progress text
          - { type: text, visible: "{{contributionModel == 'SHARE_BASED_VARIABLE'}}", value: "{strings.cycle_progress_shares_format}", style: { text_style: bodyMedium, color: onPrimaryContainer } }
          - { type: text, visible: "{{contributionModel != 'SHARE_BASED_VARIABLE'}}", value: "{strings.cycle_progress_amount_format}", style: { text_style: bodyMedium, color: onPrimaryContainer } }
          - { type: text, value: "{strings.cycle_progress_percent_format}", style: { text_style: labelSmall, color: onPrimaryContainer } }
      - id: group_savings_total_chip
        type: chip
        label: "{strings.group_total_chip_format}"
        style: { background: primaryContainer, text_color: onPrimaryContainer, margin_horizontal: 16dp }
      - id: group_member_savings_row
        type: list-item
        repeats_for: groupSavingsSummary.memberRows
        style: { min_height: 72dp, divider: true }
        content:
          leading: { type: avatar, initials: "{{member.name | initials}}", size: 40dp, background: secondaryContainer }
          headline: { type: text, value: "{{member.name}}", style: { text_style: bodyLarge } }
          supporting:
            type: text
            # Contribution-model-adaptive supporting text
            value: "{{contributionModel == 'SHARE_BASED_VARIABLE' ? member.sharesHeld + ' shares @ KES ' + typeConfig.share_value + '/share' : member.meetingsContributed + ' meetings · Last: KES ' + member.lastContribution}}"
            style: { text_style: bodySmall, color: onSurfaceVariant }
          trailing:
            type: column
            children:
              - { type: text, value: "{strings.member_trailing_amount_format}", style: { text_style: labelLarge, color: primary } }
              - { type: text, value: "{strings.member_trailing_label_format}", style: { text_style: labelSmall, color: onSurfaceVariant } }
        on_click:
          action: OpenMemberDetail
          params: { memberId: "{{member.memberId}}", groupId: "{groupId}", typeConfig: "{typeConfig}" }
          target: member-savings-detail
          action_contract:
            effect: navigate
            description: >
              Navigates to the member-savings-detail screen, forwarding memberId (tapped row),
              groupId, and typeConfig (from state) — all three member-savings-detail required
              nav_params — so the detail screen can load contribution-model-aware savings history.
              G11: typeConfig was previously dropped; G18: keys normalized to camelCase.
            action_contract_hash: "c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c201"
            action_contract_author: "claude-via-idea-evolve"
            action_contract_authored_at: "2026-08-01T00:00:00Z"

  - id: individual_savings_content
    type: tab-content
    tab_id: INDIVIDUAL
    visible_when: "selectedTab == INDIVIDUAL"
    children:
      - id: weekly_trend_chart_individual
        type: chart
        style:
          type: line
          line_color: secondary
          line_width: 2dp
          height: 180dp
          margin_horizontal: 16dp
          fill_below: true
          fill_alpha: 0.12
        data_source: weeklyTrend
        x_field: weekLabel
        y_field: individualAmount
        demo_data:
          - { weekLabel: "W48", individualAmount: 300 }
          - { weekLabel: "W49", individualAmount: 500 }
          - { weekLabel: "W50", individualAmount: 200 }
          - { weekLabel: "W51", individualAmount: 700 }
          - { weekLabel: "W52", individualAmount: 400 }
          - { weekLabel: "W3", individualAmount: 650 }
      - id: individual_total_card
        type: card
        style: { background: secondaryContainer, corner_radius: md, padding: 16dp, margin_horizontal: 16dp }
        content:
          - { type: text, value: "{strings.total_individual_label}", style: { text_style: labelLarge, color: onSecondaryContainer } }
          - { type: text, value: "{strings.individual_total_amount_format}", style: { text_style: headlineMedium, color: onSecondaryContainer, font_weight: bold } }
      - id: individual_member_row
        type: list-item
        repeats_for: individualSavingsSummary.memberRows
        style: { min_height: 72dp, divider: true }
        content:
          leading: { type: avatar, initials: "{{member.name | initials}}", size: 40dp, background: tertiaryContainer }
          headline: { type: text, value: "{{member.name}}", style: { text_style: bodyLarge } }
          supporting:
            type: chip
            visible: "{{member.lastTransaction != null}}"
            label: "{strings.individual_last_transaction_format}"
            style: { background: primaryContainer, text_color: onPrimaryContainer }
          trailing:
            type: column
            children:
              - { type: text, value: "{strings.individual_balance_amount_format}", style: { text_style: labelLarge, color: secondary } }
              - { type: text, value: "{strings.individual_balance_label}", style: { text_style: labelSmall, color: onSurfaceVariant } }
        on_click:
          action: OpenMemberDetail
          params: { memberId: "{{member.memberId}}", groupId: "{groupId}", typeConfig: "{typeConfig}" }
          target: member-savings-detail
          action_contract:
            effect: navigate
            description: >
              Navigates to the member-savings-detail screen, forwarding memberId (tapped row),
              groupId, and typeConfig (from state) — the three required member-savings-detail
              nav_params — so the detail screen loads the member's savings history. G11: typeConfig
              was dropped before; G18: keys normalized to camelCase (the undeclared savings_type=INDIVIDUAL,
              which member-savings-detail does not accept as a nav_param, is removed).
            action_contract_hash: "d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d301"
            action_contract_author: "claude-via-idea-evolve"
            action_contract_authored_at: "2026-08-01T00:00:00Z"

  - id: loading_skeleton
    type: shimmer
    count: 6
    style: { height: 72dp, corner_radius: md, margin: 16dp }

  - id: error_banner
    type: banner
    style: { background: errorContainer, padding: 12dp }
    content: "{strings.network_error}"
    action:
      label: "{strings.retry_button}"
      on_click:
        action: RefreshDashboard
        action_contract:
          effect: call_api
          library_refs:
            - cmp-network-monitor
          description: >
            Checks connectivity via cmp-network-monitor before re-fetching group and individual
            savings summaries from the companion API; updates lastSyncAt on success and clears
            the error state, or shows an offline snackbar when the device has no connection.
          action_contract_hash: "e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4"
          action_contract_author: "claude-via-idea-enrich"
          action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: loading
  loading:
    components: [top_app_bar, tab_row, loading_skeleton]
    description: "Fetching savings data from companion API"
  content_group:
    components: [top_app_bar, sync_band, tab_row, group_savings_content]
    description: "Group tab selected; contribution model drives per-member row display"
    demo_data:
      groupId: "grp-001"
      contributionModel: "SHARE_BASED_VARIABLE"
      cycleTarget: 200     # total shares target for VSLA
      cycleCollected: 120  # shares collected so far
      groupSavingsSummary:
        totalCollected: 120000    # KES equivalent (120 shares × KES 1000)
        memberRows:
          - { memberId: "m-101", name: "Amina Hassan", sharesHeld: 20, shareValue: 20000, meetingsContributed: 8, lastContribution: 2500 }
          - { memberId: "m-102", name: "Peter Otieno", sharesHeld: 15, shareValue: 15000, meetingsContributed: 8, lastContribution: 1875 }
          - { memberId: "m-103", name: "Grace Wanjiku", sharesHeld: 12, shareValue: 12000, meetingsContributed: 7, lastContribution: 1500 }
  content_individual:
    components: [top_app_bar, sync_band, tab_row, individual_savings_content]
    description: "Individual tab selected"
  content_with_error:
    components: [top_app_bar, sync_band, error_banner, tab_row, group_savings_content]
    description: "Cached data with error banner"
  empty:
    components: [top_app_bar, tab_row]
    description: "No savings data"
  error:
    components: [top_app_bar, error_banner]
    description: "No cached data — full error"

i18n:
  en:
    screen_title: "Savings"
    group_subtitle: "Mwangaza Women's Group"
    group_tab_label: "Group Savings"
    individual_tab_label: "Individual"
    cycle_progress_label: "Cycle Progress"
    cycle_progress_shares_format: "{{cycleCollected}} shares of {{cycleTarget}} target"
    cycle_progress_amount_format: "KES {{cycleCollected}} of KES {{cycleTarget}}"
    cycle_progress_percent_format: "{{(cycleCollected * 100 / cycleTarget)}}% of cycle target"
    per_member_header: "Per-Member Contributions"
    member_balances_header: "Member Balances"
    total_group_label: "Group total"
    group_total_chip_format: "Group total: KES {{groupSavingsSummary.totalCollected}}"
    member_trailing_amount_format: "{{contributionModel == 'SHARE_BASED_VARIABLE' ? 'KES ' + member.shareValue : 'KES ' + member.totalContributed}}"
    member_trailing_label_format: "{{contributionModel == 'SHARE_BASED_VARIABLE' ? 'share value' : 'total'}}"
    total_individual_label: "Total Individual Balances"
    individual_total_amount_format: "KES {{individualSavingsSummary.totalBalance}}"
    individual_last_transaction_format: "KES {{member.lastTransaction}} on {{member.lastTransactionDate}}"
    individual_balance_amount_format: "KES {{member.currentBalance}}"
    individual_balance_label: "balance"
    network_error: "Showing cached savings — pull down to retry"
    retry_button: "Retry"
    last_synced_prefix: "Last synced:"
    empty_title: "No Savings Data"
    empty_subtitle: "Savings will appear after the first meeting is conducted"
