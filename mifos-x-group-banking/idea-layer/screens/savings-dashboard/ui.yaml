requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: savings-dashboard

route: /savings
entry_points:
  - source: home-dashboard
    trigger: user_taps_savings_nav
  - source: bottom_nav
    trigger: savings_tab_selected
nav_params:
  center_id: { type: Int, required: true }

screens:
  - id: savings-dashboard-screen
    name: SavingsDashboardScreen
    type: dashboard
    description: Tabbed savings dashboard with charts, cycle progress, and per-member lists

state_model:
  SavingsDashboardViewModel:
    state:
      name: SavingsDashboardState
      fields:
        selectedTab: { type: SavingsTab, default: "SavingsTab.GROUP" }
        groupSavingsSummary: { type: "GroupSavingsSummary?", default: "null" }
        individualSavingsSummary: { type: "IndividualSavingsSummary?", default: "null" }
        weeklyTrend: { type: "List<WeeklyContributionPoint>", default: "emptyList()" }
        isLoading: { type: Boolean, default: "true" }
        isRefreshing: { type: Boolean, default: "false" }
        error: { type: "String?", default: "null" }
        lastSyncAt: { type: "String?", default: "null" }
        centerId: { type: Int, default: "0" }
        cycleTarget: { type: Long, default: "0L" }
        cycleCollected: { type: Long, default: "0L" }
    screen_state:
      name: SavingsDashboardScreenState
      members: [Loading, Content, Empty, Error]
    errors:
      NetworkError: "Showing cached data. Pull to refresh when connected."
    events:
      name: SavingsDashboardEvent
      members:
        - { name: NavigateToMemberDetail, params: "memberId: String, savingsType: SavingsType" }
        - { name: ShowError, params: "message: String" }
    actions:
      name: SavingsDashboardAction
      members:
        - { name: LoadDashboard, trigger: "Screen enters composition" }
        - { name: RefreshDashboard, trigger: "Pull-to-refresh" }
        - { name: SelectTab, params: { tab: SavingsTab }, trigger: "Tap tab" }
        - { name: OpenMemberDetail, params: { memberId: String, savingsType: SavingsType }, trigger: "Tap member row" }
    di:
      - SavingsRepository
      - NavigationManager
      - ConnectivityObserver
      - LocalSavingsDao

components:
  - id: top_app_bar
    type: top-app-bar
    title: "Savings"
    subtitle: "Mwangaza Women's Group"
    style: { background: surface }

  - id: sync_band
    type: banner
    visible_when: "lastSyncAt != null"
    style: { background: surfaceVariant, padding_horizontal: 16dp, padding_vertical: 4dp }
    content:
      - { type: text, value: "Last synced: {{lastSyncAt}}", style: { text_style: labelSmall, color: onSurfaceVariant } }

  - id: tab_row
    type: tab-row
    style:
      tabs:
        - { id: GROUP, label: "Group Savings", icon: people_money_24_regular }
        - { id: INDIVIDUAL, label: "Individual", icon: person_money_24_regular }
      indicator_color: primary
      selected_label_color: primary
      unselected_label_color: onSurfaceVariant
    on_click: { action: SelectTab, params: { tab: "{{tappedTabId}}" } }

  - id: group_savings_content
    type: tab-content
    tab_id: GROUP
    visible_when: "selectedTab == GROUP"
    children:
      - id: weekly_trend_chart_group
        type: chart
        style:
          type: bar
          bar_color: primary
          height: 180dp
          margin_horizontal: 16dp
        data_source: weeklyTrend
        x_field: weekLabel
        y_field: groupAmount
        demo_data:
          - { weekLabel: "W48", groupAmount: 1000 }
          - { weekLabel: "W49", groupAmount: 1200 }
          - { weekLabel: "W50", groupAmount: 850 }
          - { weekLabel: "W51", groupAmount: 1500 }
          - { weekLabel: "W52", groupAmount: 1200 }
          - { weekLabel: "W3", groupAmount: 1850 }
      - id: cycle_progress_card
        type: card
        style: { background: primaryContainer, corner_radius: md, padding: 16dp, margin_horizontal: 16dp }
        content:
          - { type: text, value: "Cycle Progress", style: { text_style: labelLarge, color: onPrimaryContainer } }
          - id: cycle_progress_bar
            type: linear-progress
            value: "{{cycleCollected / cycleTarget}}"
            style: { track_color: primary, track_alpha: 0.3, indicator_color: primary, height: 8dp }
          - { type: text, value: "KES {{cycleCollected}} of KES {{cycleTarget}}", style: { text_style: bodyMedium, color: onPrimaryContainer } }
          - { type: text, value: "{{(cycleCollected * 100 / cycleTarget)}}% of cycle target", style: { text_style: labelSmall, color: onPrimaryContainer } }
      - id: group_savings_total_chip
        type: chip
        label: "Group total: KES {{groupSavingsSummary.totalCollected}}"
        style: { background: primaryContainer, text_color: onPrimaryContainer, margin_horizontal: 16dp }
      - id: group_member_savings_row
        type: list-item
        repeats_for: groupSavingsSummary.memberRows
        style: { min_height: 72dp, divider: true }
        content:
          leading: { type: avatar, initials: "{{member.name | initials}}", size: 40dp, background: secondaryContainer }
          headline: { type: text, value: "{{member.name}}", style: { text_style: bodyLarge } }
          supporting:
            type: text
            value: "{{member.meetingsContributed}} meetings · Last: KES {{member.lastContribution}}"
            style: { text_style: bodySmall, color: onSurfaceVariant }
          trailing:
            type: column
            children:
              - { type: text, value: "KES {{member.totalContributed}}", style: { text_style: labelLarge, color: primary } }
              - { type: text, value: "total", style: { text_style: labelSmall, color: onSurfaceVariant } }
        on_click: { action: OpenMemberDetail, params: { member_id: "{{member.memberId}}", savings_type: GROUP_LINKED }, target: member-savings-detail }

  - id: individual_savings_content
    type: tab-content
    tab_id: INDIVIDUAL
    visible_when: "selectedTab == INDIVIDUAL"
    children:
      - id: weekly_trend_chart_individual
        type: chart
        style:
          type: line
          line_color: secondary
          line_width: 2dp
          height: 180dp
          margin_horizontal: 16dp
          fill_below: true
          fill_alpha: 0.12
        data_source: weeklyTrend
        x_field: weekLabel
        y_field: individualAmount
        demo_data:
          - { weekLabel: "W48", individualAmount: 300 }
          - { weekLabel: "W49", individualAmount: 500 }
          - { weekLabel: "W50", individualAmount: 200 }
          - { weekLabel: "W51", individualAmount: 700 }
          - { weekLabel: "W52", individualAmount: 400 }
          - { weekLabel: "W3", individualAmount: 650 }
      - id: individual_total_card
        type: card
        style: { background: secondaryContainer, corner_radius: md, padding: 16dp, margin_horizontal: 16dp }
        content:
          - { type: text, value: "Total Individual Balances", style: { text_style: labelLarge, color: onSecondaryContainer } }
          - { type: text, value: "KES {{individualSavingsSummary.totalBalance}}", style: { text_style: headlineMedium, color: onSecondaryContainer, font_weight: bold } }
      - id: individual_member_row
        type: list-item
        repeats_for: individualSavingsSummary.memberRows
        style: { min_height: 72dp, divider: true }
        content:
          leading: { type: avatar, initials: "{{member.name | initials}}", size: 40dp, background: tertiaryContainer }
          headline: { type: text, value: "{{member.name}}", style: { text_style: bodyLarge } }
          supporting:
            type: chip
            visible: "{{member.lastTransaction != null}}"
            label: "KES {{member.lastTransaction}} on {{member.lastTransactionDate}}"
            style: { background: primaryContainer, text_color: onPrimaryContainer }
          trailing:
            type: column
            children:
              - { type: text, value: "KES {{member.currentBalance}}", style: { text_style: labelLarge, color: secondary } }
              - { type: text, value: "balance", style: { text_style: labelSmall, color: onSurfaceVariant } }
        on_click: { action: OpenMemberDetail, params: { member_id: "{{member.memberId}}", savings_type: INDIVIDUAL }, target: member-savings-detail }

  - id: loading_skeleton
    type: shimmer
    count: 6
    style: { height: 72dp, corner_radius: md, margin: 16dp }

  - id: error_banner
    type: banner
    style: { background: errorContainer, padding: 12dp }
    content: "{{i18n.network_error}}"
    action: { label: "Retry", on_click: { action: RefreshDashboard } }

states:
  initial_state: loading
  loading:
    components: [top_app_bar, tab_row, loading_skeleton]
    description: "Fetching savings data"
  content_group:
    components: [top_app_bar, sync_band, tab_row, group_savings_content]
    description: "Group tab selected"
  content_individual:
    components: [top_app_bar, sync_band, tab_row, individual_savings_content]
    description: "Individual tab selected"
  content_with_error:
    components: [top_app_bar, sync_band, error_banner, tab_row, group_savings_content]
    description: "Cached data with error banner"
  empty:
    components: [top_app_bar, tab_row]
    description: "No savings data"
  error:
    components: [top_app_bar, error_banner]
    description: "No cached data — full error"

i18n:
  en:
    screen_title: "Savings"
    group_tab_label: "Group Savings"
    individual_tab_label: "Individual"
    cycle_progress_label: "Cycle Progress"
    per_member_header: "Per-Member Contributions"
    member_balances_header: "Member Balances"
    total_group_label: "Group total"
    total_individual_label: "Total Individual Balances"
    network_error: "Showing cached savings — pull down to retry"
    last_synced_prefix: "Last synced:"
    empty_title: "No Savings Data"
    empty_subtitle: "Savings will appear after the first meeting is conducted"
