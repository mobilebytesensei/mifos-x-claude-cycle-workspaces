  - dto: GroupSavingsSummary
    count_hint: 1
    source_notes: >
      Returned by get_group_savings_summary for Mwangaza Women's Group, a FIXED_AMOUNT
      contribution-model group (fixed KES per meeting; sharesHeld/shareValue null for every
      member — the SHARE_BASED_VARIABLE columns stay hidden in this variant).
      The companion API resolves the group by groupId from auth-token context.
      Member IDs use the "MBR-" prefix matching the pivot companion DTOs. meetingsContributed
      reflects 12 meetings over one 12-month cycle (weekly). A SHARE_BASED_VARIABLE (VSLA/SILC)
      variant with populated sharesHeld/shareValue is covered by content_group demo_data in
      ui.yaml. Extra keys (contribution_model, role) are contextual — not part of the api.yaml
      DTO closure but preserved for downstream mockup/prototype fidelity.
    items:
      - groupId: "GRP-20260509-001"
        groupName: "Mwangaza Women's Group"
        contribution_model: "FIXED_AMOUNT"
        cycleTarget: 30000
        cycleCollected: 24000
        totalCollected: 24000
        weeklyTrend:
          - { weekLabel: "W48", groupAmount: 1000, individualAmount: 300 }
          - { weekLabel: "W49", groupAmount: 1200, individualAmount: 500 }
          - { weekLabel: "W50", groupAmount: 850,  individualAmount: 200 }
          - { weekLabel: "W51", groupAmount: 1500, individualAmount: 700 }
          - { weekLabel: "W52", groupAmount: 1200, individualAmount: 400 }
          - { weekLabel: "W3",  groupAmount: 1850, individualAmount: 650 }
