sibling: flow
schema_version: "4.0"
feature_id: savings-dashboard

navigates_to:
  - target: member-savings-detail
    condition: user_taps_member_row
    params: { member_id: String, savings_type: SavingsType }

flow_logic:
  on_load:
    - decision: cache_check
      branches:
        - condition: cached_data_available
          action: render_content_with_cached_data
          side_effect: fetch_fresh_in_background
          state: { lastSyncAt: cached_timestamp }
        - condition: no_cache
          action: show_loading_skeleton
          api_calls: [get_group_savings_transactions, get_client_savings_accounts, get_individual_savings_transactions]
  on_tab_selected:
    - state: { selectedTab: params.tab }
    - decision: tab_content
      branches:
        - condition: "selectedTab == GROUP"
          action: show_group_savings_chart_cycle_progress_member_list
        - condition: "selectedTab == INDIVIDUAL"
          action: show_individual_savings_chart_total_card_member_list
  on_refresh:
    - decision: connectivity
      branches:
        - condition: online
          action: refetch_all_savings_data_and_update_lastSyncAt
        - condition: offline
          action: show_snackbar
          message: "Cannot refresh — you're offline"
  on_member_tap:
    - navigate: member-savings-detail
      params: { memberId: "{{params.memberId}}", groupId: "{{centerId}}", savingsType: "{{params.savingsType}}" }
