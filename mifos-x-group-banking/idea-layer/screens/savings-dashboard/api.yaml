sibling: api
schema_version: "4.0"
feature_id: savings-dashboard

api:
  - id: get_group_savings_transactions
    function: get_group_savings_transactions
    method: get
    endpoint: "/fineract-provider/api/v1/savingsaccounts/{groupSavingsId}/transactions"
    description: Fetch group (mandatory) savings transactions to compute per-member contributions
    params:
      groupSavingsId: { type: String, required: true }
      limit: { type: Int, default: 50 }
    errors:
      401: Redirect to login
      404: Show empty group savings state
      5xx: Show cached data
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_client_savings_accounts
    function: get_client_savings_accounts
    method: get
    endpoint: "/fineract-provider/api/v1/clients/{clientId}/accounts"
    description: Fetch individual savings account per member for individual savings tab
    params:
      clientId: { type: String, required: true }
    errors:
      404: Member has no individual savings account yet

  - id: get_individual_savings_transactions
    function: get_individual_savings_transactions
    method: get
    endpoint: "/fineract-provider/api/v1/savingsaccounts/{individualSavingsId}/transactions"
    description: Fetch individual savings transactions per member
    params:
      individualSavingsId: { type: String, required: true }
      limit: { type: Int, default: 20 }
    errors:
      404: No individual transactions yet
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

dtos:
  SavingsTransactionListResponse:
    pageItems: "List<SavingsTransaction>"
    totalFilteredRecords: Int

  SavingsTransaction:
    id: String
    transactionType: { type: String, values: [DEPOSIT, WITHDRAWAL] }
    date: "List<Int>"
    amount: Double
    runningBalance: Double
    note: "String?"

  ClientAccountsResponse:
    savingsAccounts: "List<SavingsAccountSummary>"

  SavingsAccountSummary:
    id: String
    productId: String
    productName: String
    status: String
    accountBalance: Double

  GroupSavingsSummary:
    totalCollected: Long
    cycleTarget: Long
    cycleProgress: Double
    memberRows: "List<MemberGroupSavingsRow>"

  IndividualSavingsSummary:
    totalBalance: Long
    memberRows: "List<MemberIndividualSavingsRow>"

  MemberGroupSavingsRow:
    memberId: String
    name: String
    totalContributed: Long
    lastContribution: Long
    meetingsContributed: Int

  MemberIndividualSavingsRow:
    memberId: String
    name: String
    currentBalance: Long
    lastTransaction: Long
    lastTransactionDate: String

  WeeklyContributionPoint:
    weekLabel: String
    groupAmount: Long
    individualAmount: Long

  SavingsTab:
    values: [GROUP, INDIVIDUAL]

cache_strategy:
  ttl: 300
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: SavingsRepository
      methods:
        - "getGroupSavingsTransactions(savingsId: String, limit: Int): Flow<List<SavingsTransaction>>"
        - "getIndividualSavingsTransactions(savingsId: String, limit: Int): Flow<List<SavingsTransaction>>"
        - "getMemberSavingsAccounts(clientId: String): Flow<List<SavingsAccountSummary>>"
  services:
    - ConnectivityObserver
    - NavigationManager
  local_db:
    - table: savings_transactions
      schema: SQLDelight LocalSavingsDao
