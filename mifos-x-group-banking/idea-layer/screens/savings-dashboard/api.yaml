sibling: api
schema_version: "4.0"
feature_id: savings-dashboard

api:
  - id: get_group_savings_summary
    function: get_group_savings_summary
    method: GET
    endpoint: "/companion/groups/{groupId}/savings"   # companion API — group savings summary
    description: >
      Fetch group savings summary including contribution-model-aware per-member rows.
      Returns sharesHeld + shareValue for SHARE_BASED_VARIABLE (VSLA/SILC);
      totalContributed + meetingsContributed for FIXED_AMOUNT (ROSCA/SHG).
      Replaces raw /savingsaccounts/{id}/transactions (Fineract).
    params:
      groupId: { type: String, required: true, source: nav_params }
    response:
      type: object
      fields:
        cycleTarget: Long
        cycleCollected: Long
        totalCollected: Long
        weeklyTrend: "List<WeeklyContributionPoint>"
        memberRows: "List<MemberGroupSavingsRow>"
    errors:
      401: Unauthorized
      404: Group not found
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_individual_savings_summary
    function: get_individual_savings_summary
    method: GET
    endpoint: "/companion/groups/{groupId}/savings/individual"
    description: "Fetch individual voluntary savings per member for the Individual tab"
    params:
      groupId: { type: String, required: true, source: nav_params }
    response:
      type: object
      fields:
        totalBalance: Long
        memberRows: "List<MemberIndividualSavingsRow>"
        weeklyTrend: "List<WeeklyContributionPoint>"
    errors:
      401: Unauthorized
      404: Group not found
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

dtos:
  GroupSavingsSummary:
    cycleTarget: Long
    cycleCollected: Long
    totalCollected: Long
    weeklyTrend: "List<WeeklyContributionPoint>"
    memberRows: "List<MemberGroupSavingsRow>"

  MemberGroupSavingsRow:
    memberId: String
    name: String
    totalContributed: Long
    lastContribution: Long
    meetingsContributed: Int
    sharesHeld: "Int?"       # SHARE_BASED_VARIABLE (VSLA/SILC) only
    shareValue: "Long?"      # KES value of member's shares — SHARE_BASED_VARIABLE only

  IndividualSavingsSummary:
    totalBalance: Long
    weeklyTrend: "List<WeeklyContributionPoint>"
    memberRows: "List<MemberIndividualSavingsRow>"

  MemberIndividualSavingsRow:
    memberId: String
    name: String
    currentBalance: Long
    lastTransaction: "Long?"
    lastTransactionDate: "String?"

  WeeklyContributionPoint:
    weekLabel: String
    groupAmount: Long
    individualAmount: Long

  SavingsTab:
    values: [GROUP, INDIVIDUAL]

cache_strategy:
  ttl: 300
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: SavingsRepository     # companion API /companion/groups/{groupId}/savings
      methods:
        - "getGroupSavingsSummary(groupId: String): Flow<GroupSavingsSummary>"
        - "getIndividualSavingsSummary(groupId: String): Flow<IndividualSavingsSummary>"
  services:
    - ConnectivityObserver
    - NavigationManager
  local_db:
    - table: savings_transactions
      schema: SQLDelight LocalSavingsDao
