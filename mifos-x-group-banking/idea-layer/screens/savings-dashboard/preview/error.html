<!DOCTYPE html>
<html lang="en" data-feature="savings-dashboard" data-state="error" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>savings-dashboard · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<render-hash content="error-v2-savings-dashboard">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>5G&nbsp;&nbsp;&#9835;&nbsp;&#9852;</span></div>

  <!-- #top_app_bar -->
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard" data-nav-type="pop" aria-label="Back">&#8249;</button>
    <h1>Savings</h1>
    <button class="icon-btn" data-action="RefreshDashboard" aria-label="Refresh">&#8635;</button>
  </header>

  <main>
    <!-- #error_banner (no cached data — full error) -->
    <div class="alert alert-danger">
      <div style="flex:1;">
        <h3>Couldn't load savings</h3>
        <p>Showing cached savings — pull down to retry. Check your connection and try again.</p>
        <button class="btn btn-primary btn-full" data-action="RefreshDashboard" style="margin-top:var(--space-md);">Retry</button>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
