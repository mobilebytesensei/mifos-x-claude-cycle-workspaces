<!DOCTYPE html>
<html lang="en" data-feature="savings-dashboard" data-state="empty" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>savings-dashboard · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<render-hash content="empty-v2-savings-dashboard">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>5G&nbsp;&nbsp;&#9835;&nbsp;&#9852;</span></div>

  <!-- #top_app_bar -->
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard" data-nav-type="pop" aria-label="Back">&#8249;</button>
    <h1>Savings</h1>
    <button class="icon-btn" data-action="RefreshDashboard" aria-label="Refresh">&#8635;</button>
  </header>

  <!-- #tab_row -->
  <div class="tab-bar">
    <button class="tab current">Group Savings</button>
    <button class="tab" data-state-to="content_individual">Individual</button>
  </div>

  <main>
    <!-- empty content per state description "No savings data" -->
    <div class="empty-state">
      <div class="illus">&#128176;</div>
      <h2>No Savings Data</h2>
      <p>Savings will appear after the first meeting is conducted for Mwangaza Women's Group.</p>
      <button class="btn btn-primary btn-full" data-action="RefreshDashboard">Refresh</button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
