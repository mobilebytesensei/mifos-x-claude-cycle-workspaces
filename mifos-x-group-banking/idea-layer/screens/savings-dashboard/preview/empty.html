<!DOCTYPE html>
<html lang="en" data-feature="savings-dashboard" data-state="empty" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>savings-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .tab-row { display: flex; border-bottom: 1px solid var(--border-subtle); background: var(--bg-canvas); }
  .tab-row .tab { flex: 1; padding: var(--space-md) var(--space-base); font-size: 13px; font-weight: 500; color: var(--text-secondary); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; text-align: center; }
  .tab-row .tab.active { color: var(--primary-700); border-bottom-color: var(--primary-700); }
  .empty-icon { font-size: 40px; display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: var(--bg-muted); border-radius: 50%; margin: 0 auto var(--space-base); }
  .empty-title { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-sm); }
  .empty-body { font-size: 14px; color: var(--text-secondary); line-height: 1.5; max-width: 260px; margin: 0 auto; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1 class="app-bar-title">Savings</h1>
  </header>

  <div class="tab-row">
    <button class="tab active">Group Savings</button>
    <button class="tab">Individual</button>
  </div>

  <main>
    <div class="empty-state">
      <div class="illus">🏦</div>
      <h2>No Savings Data</h2>
      <p>Savings will appear after the first meeting is conducted</p>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
