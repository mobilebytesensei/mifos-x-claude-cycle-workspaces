<!DOCTYPE html>
<html lang="en" data-feature="savings-dashboard" data-state="content_individual" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>savings-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .tab-row { display: flex; border-bottom: 1px solid var(--border-subtle); background: var(--bg-canvas); }
  .tab-row .tab { flex: 1; padding: var(--space-md) var(--space-base); font-size: 13px; font-weight: 500; color: var(--text-secondary); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; text-align: center; }
  .tab-row .tab.active { color: var(--primary-700); border-bottom-color: var(--primary-700); }
  .sync-band { padding: var(--space-xs) var(--space-base); font-size: 11px; color: var(--text-secondary); background: var(--bg-subtle); border-bottom: 1px solid var(--border-subtle); text-align: right; }
  .line-chart { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); padding: var(--space-base); margin-bottom: var(--space-base); height: 100px; display: flex; align-items: flex-end; gap: 4px; }
  .line-segment { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .line-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary-700); flex-shrink: 0; }
  .line-stem { flex: 1; width: 2px; background: var(--primary-100); }
  .line-week { font-size: 10px; color: var(--text-secondary); }
  .card-secondary-container { background: #E8F5E9; border: 1px solid var(--primary-100); border-radius: var(--radius-base); padding: var(--space-base); margin-bottom: var(--space-base); }
  .card-label { font-size: 12px; font-weight: 600; color: var(--primary-900); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-xs); }
  .card-metric { font-size: 22px; font-weight: 700; color: var(--primary-700); font-family: 'Roboto Mono', monospace; }
  .member-list { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); overflow: hidden; }
  .member-row { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--border-subtle); cursor: pointer; transition: background var(--motion-base); }
  .member-row:last-child { border-bottom: none; }
  .member-row:hover { background: var(--bg-subtle); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-100); color: var(--primary-700); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  .content { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .trail { text-align: right; flex-shrink: 0; }
  .amount { font-size: 14px; font-weight: 600; color: var(--text-primary); font-family: 'Roboto Mono', monospace; }
  .amount-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .last-txn-chip { display: inline-block; padding: 2px var(--space-sm); border-radius: 4px; background: var(--bg-muted); color: var(--text-secondary); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1 class="app-bar-title">Savings</h1>
  </header>

  <div class="tab-row">
    <button class="tab" data-state-to="content_group">Group Savings</button>
    <button class="tab active">Individual ▼</button>
  </div>

  <div class="sync-band">Last synced: Today 09:38</div>

  <main>
    <!-- Line chart placeholder -->
    <div class="line-chart">
      <div class="line-segment">
        <div class="line-dot"></div>
        <div class="line-stem" style="height:20px;"></div>
        <div class="line-week">W48</div>
      </div>
      <div class="line-segment">
        <div class="line-dot"></div>
        <div class="line-stem" style="height:32px;"></div>
        <div class="line-week">W49</div>
      </div>
      <div class="line-segment">
        <div class="line-dot"></div>
        <div class="line-stem" style="height:24px;"></div>
        <div class="line-week">W50</div>
      </div>
      <div class="line-segment">
        <div class="line-dot"></div>
        <div class="line-stem" style="height:44px;"></div>
        <div class="line-week">W51</div>
      </div>
      <div class="line-segment">
        <div class="line-dot"></div>
        <div class="line-stem" style="height:38px;"></div>
        <div class="line-week">W52</div>
      </div>
      <div class="line-segment">
        <div class="line-dot" style="background:var(--accent-700);"></div>
        <div class="line-stem" style="height:56px;"></div>
        <div class="line-week">W3</div>
      </div>
    </div>

    <!-- Individual total card -->
    <div class="card-secondary-container">
      <div class="card-label">Total Individual Balances</div>
      <div class="card-metric">KES 45,000</div>
    </div>

    <!-- Member rows -->
    <div class="member-list">
      <div class="member-row" data-nav-to="member-savings-detail">
        <div class="avatar" aria-label="AH">AH</div>
        <div class="content">
          <div class="name">Amina Hassan</div>
          <span class="last-txn-chip">KES 2,500 on 2026-07-05</span>
        </div>
        <div class="trail">
          <div class="amount">KES 8,500</div>
          <div class="amount-label">balance</div>
        </div>
      </div>
      <div class="member-row" data-nav-to="member-savings-detail">
        <div class="avatar" aria-label="PO">PO</div>
        <div class="content">
          <div class="name">Peter Otieno</div>
          <span class="last-txn-chip">KES 1,875 on 2026-06-28</span>
        </div>
        <div class="trail">
          <div class="amount">KES 6,200</div>
          <div class="amount-label">balance</div>
        </div>
      </div>
      <div class="member-row" data-nav-to="member-savings-detail">
        <div class="avatar" aria-label="GW">GW</div>
        <div class="content">
          <div class="name">Grace Wanjiku</div>
          <span class="last-txn-chip">KES 1,500 on 2026-07-01</span>
        </div>
        <div class="trail">
          <div class="amount">KES 5,100</div>
          <div class="amount-label">balance</div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
