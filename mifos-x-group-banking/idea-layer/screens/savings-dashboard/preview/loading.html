<!DOCTYPE html>
<html lang="en" data-feature="savings-dashboard" data-state="loading" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>savings-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .tab-row { display: flex; border-bottom: 1px solid var(--border-subtle); background: var(--bg-canvas); }
  .tab-row .tab { flex: 1; padding: var(--space-md) var(--space-base); font-size: 13px; font-weight: 500; color: var(--text-secondary); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; text-align: center; }
  .tab-row .tab.active { color: var(--primary-700); border-bottom-color: var(--primary-700); }
  .shimmer-card { background: var(--bg-muted); border-radius: var(--radius-md); margin-bottom: var(--space-sm); animation: shimmer 1.4s ease-in-out infinite; }
  .shimmer-line { background: var(--bg-muted); border-radius: 4px; animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .shimmer-row { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--border-subtle); }
  .shimmer-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .shimmer-body { flex: 1; }
  .shimmer-trail { width: 56px; }
  .shimmer-chart { height: 100px; border-radius: var(--radius-md); margin-bottom: var(--space-base); }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1 class="app-bar-title">Savings</h1>
  </header>

  <div class="tab-row">
    <button class="tab active">Group Savings</button>
    <button class="tab">Individual</button>
  </div>

  <main>
    <div class="shimmer-card shimmer-chart"></div>
    <div class="shimmer-card" style="height:72px;"></div>

    <div class="list" style="border-radius:var(--radius-base);overflow:hidden;margin-bottom:var(--space-base);">
      <div class="shimmer-row">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:55%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:75%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:28px;"></div>
      </div>
      <div class="shimmer-row">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:45%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:68%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:28px;"></div>
      </div>
      <div class="shimmer-row">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:60%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:72%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:28px;"></div>
      </div>
      <div class="shimmer-row">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:50%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:65%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:28px;"></div>
      </div>
      <div class="shimmer-row">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:58%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:70%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:28px;"></div>
      </div>
      <div class="shimmer-row" style="border-bottom:none;">
        <div class="shimmer-card shimmer-avatar"></div>
        <div class="shimmer-body">
          <div class="shimmer-line" style="width:42%;height:13px;margin-bottom:6px;"></div>
          <div class="shimmer-line" style="width:60%;height:11px;"></div>
        </div>
        <div class="shimmer-card shimmer-trail" style="height:28px;"></div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
