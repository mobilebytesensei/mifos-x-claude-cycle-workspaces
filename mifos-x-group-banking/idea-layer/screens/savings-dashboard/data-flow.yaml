sibling: data-flow
schema_version: "2.1.0"
feature_id: savings-dashboard

entries:
  - screen_id: savingsDashboardScreen
    trigger: on_mount
    description: Load group and individual savings data for the center
    endpoints:
      - { api_id: get_group_savings_transactions, transport: rest, method: get }
      - { api_id: get_client_savings_accounts, transport: rest, method: get }
      - { api_id: get_individual_savings_transactions, transport: rest, method: get }
    dtos:
      - { name: SavingsTransactionListResponse, role: response, api_id: get_group_savings_transactions }
      - { name: SavingsTransaction, role: response, api_id: get_group_savings_transactions }
      - { name: ClientAccountsResponse, role: response, api_id: get_client_savings_accounts }
      - { name: SavingsTransactionListResponse, role: response, api_id: get_individual_savings_transactions }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "savings:center:{centerId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: show_empty_state, message_key: error_not_found }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "5xx", behavior: fallback_cache, message_key: error_server_unavailable }

  - screen_id: savingsDashboardScreen
    trigger: on_refresh
    description: Pull-to-refresh — re-fetches all savings data fresh
    endpoints:
      - { api_id: get_group_savings_transactions, transport: rest, method: get }
      - { api_id: get_client_savings_accounts, transport: rest, method: get }
      - { api_id: get_individual_savings_transactions, transport: rest, method: get }
    dtos:
      - { name: SavingsTransactionListResponse, role: response, api_id: get_group_savings_transactions }
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "savings:center:{centerId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "network.offline", behavior: show_snackbar, message_key: error_offline }

  - screen_id: savingsDashboardScreen
    trigger: on_interact
    description: User taps member row — navigate to member savings detail
    endpoints: []
    dtos: []
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    navigation:
      - { condition: "memberRowTapped", nav_target: member-savings-detail, params: [memberId, savingsType] }
