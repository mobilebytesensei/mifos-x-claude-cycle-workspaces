schema_version: "3.1"
id: member-profile
name: Member Profile
description: >
  Detailed profile page for a single group member. Displays photo, name, phone number,
  role badge, join date, a sparkline savings history chart, active loan summary, and
  attendance rate (meetings attended / total meetings). Chairperson can change the
  member's role via an edit button. APIs: GET /clients/{id}, GET /clients/{id}/accounts,
  GET /datatables/dt_member_role/{id}. Covers FR-002.
feature: member-onboarding
flow: member-onboarding-flow
version: "1.0.0"
tags:
  - member-onboarding
  - admin
  - detail
  - offline-first
  - FR-002

# Lifecycle
status: enriched
quality_score: 89
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system

# Navigation
entry_point: false
bottom_nav:
  visible: false
navigates_to:
  - member-list
  - member-savings-detail
  - member-edit-role   # inline sheet / dialog
route: /groups/{groupId}/members/{memberId}
entry_points:
  - source: member-list
    trigger: row_tap_or_swipe
    params: { memberId: String, groupId: String }
nav_params:
  memberId: { type: String, required: true }
  groupId: { type: String, required: true }

screens:
  - id: member-profile-screen
    title: "Member Profile"
    type: detail
    description: Scrollable member detail page with stats, sparkline chart, and role editing

state_model:
  MemberProfileViewModel:
    state:
      name: MemberProfileState
      fields:
        isLoading: { type: Boolean, default: "true" }
        member: { type: "Member?", default: "null" }
        accounts: { type: "MemberAccounts?", default: "null" }
        role: { type: "MemberRole?", default: "null" }
        savingsHistory: { type: "List<SavingsDataPoint>", default: "emptyList()" }
        attendanceRate: { type: Float, default: "0f" }
        meetingsAttended: { type: Int, default: "0" }
        totalMeetings: { type: Int, default: "0" }
        isCurrentUserChairperson: { type: Boolean, default: "false" }
        isEditingRole: { type: Boolean, default: "false" }
        selectedRole: { type: "MemberRole?", default: "null" }
        isUpdatingRole: { type: Boolean, default: "false" }
        error: { type: "MemberProfileError?", default: "null" }
    screen_state:
      name: MemberProfileScreenState
      members: [Loading, Content, Error]
    errors:
      name: MemberProfileError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: NotFound, retry: false, message_key: error_not_found }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
        - { type: RoleUpdateFailed, retry: true, message_key: error_role_update }
    events:
      name: MemberProfileEvent
      members:
        - { name: NavigateBack }
        - { name: ShowRoleEditSheet }
        - { name: DismissRoleEditSheet }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: MemberProfileAction
      members:
        - { name: OnEditRole, trigger: "Tap Edit Role button (chairperson only)" }
        - { name: OnRoleSelected, params: { role: MemberRole }, trigger: "Select role in sheet" }
        - { name: OnConfirmRoleChange, trigger: "Tap Confirm in role edit sheet" }
        - { name: OnDismissRoleEdit, trigger: "Dismiss sheet" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
        - { name: Retry, trigger: "Tap retry on error" }
        - { name: OnBack, trigger: "Tap back arrow" }
    di:
      - MemberRepository
      - AttendanceRepository
      - NetworkMonitor
      - SessionManager

flow_logic:
  on_load:
    - action: fetch_all_parallel
      calls:
        - api: get_client
        - api: get_client_accounts
        - api: get_member_role
      on_all_success:
        - compute: attendance_rate = meetingsAttended / max(totalMeetings, 1)
        - compute: isCurrentUserChairperson from SessionManager role
        - show_content
      on_error: show_error
  on_edit_role:
    - condition: isCurrentUserChairperson
      true: emit ShowRoleEditSheet
      false: no_op
  on_confirm_role_change:
    - api: update_member_role
      on_success:
        - update_state: role = selectedRole
        - emit ShowSnackbar message_key=role_updated
        - emit DismissRoleEditSheet
      on_error: show_inline_error
  on_refresh:
    - action: fetch_all_parallel
      invalidate_cache: true

dependencies:
  repositories:
    - name: MemberRepository
      methods:
        - getMember(memberId: String): Flow<Member>
        - getMemberAccounts(memberId: String): Flow<MemberAccounts>
        - getMemberRole(memberId: String): Flow<MemberRole>
        - updateMemberRole(memberId: String, role: MemberRole): Result<Unit>
    - name: AttendanceRepository
      methods:
        - getMemberAttendance(memberId: String, groupId: String): Flow<AttendanceSummary>
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: members
    - table: savings_history
    - table: attendance_records

api:
  - id: get_client
    function: get_client
    method: get
    endpoint: "/clients/{clientId}"
    description: Fetch full client (member) profile from Fineract
    params:
      clientId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        id: Long
        displayName: String
        firstname: String
        lastname: String
        mobileNo: String
        emailAddress: String?
        activationDate: List<Int>
        imagePresent: Boolean
        officeId: Long
        status: { id: Int, value: String }
    errors:
      401: Unauthorized
      404: Client not found
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_client_accounts
    function: get_client_accounts
    method: get
    endpoint: "/clients/{clientId}/accounts"
    description: Fetch savings and loan accounts for the member
    params:
      clientId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        savingsAccounts:
          type: array
          items:
            id: Long
            productName: String
            accountBalance: Double
            accountNo: String
            status: { id: Int, value: String }
        loanAccounts:
          type: array
          items:
            id: Long
            productName: String
            loanBalance: Double
            accountNo: String
            status: { id: Int, value: String }
            inArrears: Boolean
    errors:
      401: Unauthorized
      404: Client not found
      500: Server error
    cache:
      ttl: 120
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_member_role
    function: get_member_role
    method: get
    endpoint: "/datatables/dt_member_role/{clientId}"
    description: Fetch member's assigned role from custom datatable
    params:
      clientId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        role: String     # CHAIRPERSON | TREASURER | SECRETARY | MEMBER
        assignedDate: String
    errors:
      401: Unauthorized
      404: Role not set — default to MEMBER
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: update_member_role
    function: update_member_role
    method: put
    endpoint: "/datatables/dt_member_role/{clientId}"
    description: Update member's role in the dt_member_role datatable
    params:
      clientId: { type: Long, required: true, source: nav_params }
    body:
      role: String
    response:
      type: object
      fields:
        resourceId: Long
    errors:
      400: Invalid role value
      401: Unauthorized
      403: Forbidden — not chairperson
      500: Server error

dtos:
  Member:
    id: String
    fineractClientId: Long
    displayName: String
    firstName: String
    lastName: String
    phone: String
    photoUri: String?
    joinDate: String
    status: String

  MemberAccounts:
    savingsBalance: Double
    savingsAccountNo: String
    savingsHistory: List<SavingsDataPoint>
    activeLoan: ActiveLoanSummary?

  ActiveLoanSummary:
    loanId: Long
    productName: String
    principalAmount: Double
    outstandingBalance: Double
    inArrears: Boolean
    dueDate: String

  SavingsDataPoint:
    date: String
    balance: Double

  AttendanceSummary:
    meetingsAttended: Int
    totalMeetings: Int
    attendanceRate: Float

  MemberRole:
    values: [CHAIRPERSON, TREASURER, SECRETARY, MEMBER]

components:
  - id: top_bar
    type: top-bar
    title: "Member Profile"
    style:
      background: primary
      text_color: onPrimary
    navigation_icon: arrow_back
    on_navigation_click: { action: OnBack }
    test_context:
      purpose: "Navigation back to member list"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: member_header_card
    type: card
    style:
      background: primaryContainer
      elevation: 0dp
      corner_radius: 0dp
      padding: 20dp
    content:
      - id: member_avatar_large
        type: avatar
        image_url: "{{member.photoUri}}"
        fallback_initials: "{{member.displayName | initials}}"
        size: 80dp
        style: { background: secondaryContainer, text_color: onSecondaryContainer }
      - id: member_name_text
        type: text
        style: { text_style: headlineSmall, color: onPrimaryContainer }
        value: "{{member.displayName}}"
      - id: member_role_chip
        type: chip
        label: "{{role}}"
        style:
          CHAIRPERSON: { background: primary, text_color: onPrimary }
          TREASURER: { background: secondary, text_color: onSecondary }
          SECRETARY: { background: tertiary, text_color: onTertiary }
          MEMBER: { background: surfaceVariant, text_color: onSurfaceVariant }
      - id: member_phone_text
        type: text
        style: { text_style: bodyMedium, color: onPrimaryContainer }
        value: "{{member.phone}}"
        icon: phone
      - id: member_join_date_text
        type: text
        style: { text_style: bodySmall, color: onPrimaryContainer }
        value: "Member since {{member.joinDate}}"
      - id: edit_role_button
        type: button
        variant: outlined
        label: "Edit Role"
        icon: edit
        visible: "{{isCurrentUserChairperson}}"
        style: { border_color: onPrimaryContainer, text_color: onPrimaryContainer, min_touch_target: 48dp }
        on_click: { action: OnEditRole, state: role_edit_mode }
    test_context:
      purpose: "Member identity section; Edit Role only visible to chairperson"
      interaction_type: conditional_tap
      data_driven: true
      required_fields: [member.displayName, member.phone, member.joinDate, role, isCurrentUserChairperson]

  - id: savings_history_card
    type: card
    style:
      background: surface
      elevation: 2dp
      corner_radius: 16dp
      padding: 16dp
    content:
      - id: savings_history_label
        type: text
        style: { text_style: titleMedium, color: onSurface }
        value: "Savings History"
      - id: current_balance_text
        type: text
        style: { text_style: headlineMedium, color: primary }
        value: "KES {{accounts.savingsBalance | number}}"
      - id: savings_sparkline
        type: chart
        chart_type: sparkline
        data: "{{accounts.savingsHistory}}"
        x_key: date
        y_key: balance
        style:
          line_color: primary
          fill_color: primaryContainer
          height: 80dp
        test_context:
          purpose: "Visual trend of member savings over time"
          interaction_type: static
          data_driven: true
          required_fields: [accounts.savingsHistory]
    on_click: { action: OnViewSavingsDetail, target: member-savings-detail }
    test_context:
      purpose: "Show savings balance and sparkline; tap navigates to full savings transaction history"
      interaction_type: tap
      data_driven: true
      required_fields: [accounts.savingsBalance, accounts.savingsHistory]

  - id: active_loan_card
    type: card
    visible: "{{accounts.activeLoan != null}}"
    style:
      background: surface
      elevation: 2dp
      corner_radius: 16dp
      padding: 16dp
      border:
        arrears: { color: error, width: 2dp }
        current: { color: transparent, width: 0dp }
    content:
      - id: loan_card_label
        type: text
        style: { text_style: titleMedium, color: onSurface }
        value: "Active Loan"
      - id: loan_product_text
        type: text
        style: { text_style: bodyMedium, color: onSurfaceVariant }
        value: "{{accounts.activeLoan.productName}}"
      - id: loan_outstanding_text
        type: text
        style: { text_style: titleLarge, color: onSurface }
        value: "KES {{accounts.activeLoan.outstandingBalance | number}} outstanding"
      - id: loan_arrears_banner
        type: banner
        visible: "{{accounts.activeLoan.inArrears}}"
        icon: warning
        message: "This loan is in arrears. Due: {{accounts.activeLoan.dueDate}}"
        style: { background: errorContainer, text_color: onErrorContainer }
    test_context:
      purpose: "Show active loan summary; arrears banner when overdue"
      interaction_type: static
      data_driven: true
      required_fields: [accounts.activeLoan]

  - id: attendance_card
    type: card
    style:
      background: surface
      elevation: 2dp
      corner_radius: 16dp
      padding: 16dp
    content:
      - id: attendance_label
        type: text
        style: { text_style: titleMedium, color: onSurface }
        value: "Meeting Attendance"
      - id: attendance_fraction_text
        type: text
        style: { text_style: headlineMedium, color: tertiary }
        value: "{{meetingsAttended}} / {{totalMeetings}}"
      - id: attendance_rate_text
        type: text
        style: { text_style: bodyMedium, color: onSurfaceVariant }
        value: "{{attendanceRate | percent}} attendance rate"
      - id: attendance_progress_bar
        type: linear-progress
        value: "{{attendanceRate}}"
        style:
          track_color: surfaceVariant
          indicator_color:
            gte_80: tertiary
            gte_60: secondary
            lt_60: error
    test_context:
      purpose: "Show meeting attendance fraction and visual progress bar"
      interaction_type: static
      data_driven: true
      required_fields: [meetingsAttended, totalMeetings, attendanceRate]

  - id: role_edit_bottom_sheet
    type: bottom-sheet
    visible: "{{isEditingRole}}"
    title: "Change Member Role"
    content:
      - id: role_option_chairperson
        type: list-item
        headline: "Chairperson"
        trailing: radio_button
        selected: "{{selectedRole == CHAIRPERSON}}"
        on_click: { action: OnRoleSelected, params: { role: CHAIRPERSON }, state: selectedRole }
        style: { min_touch_target: 56dp }
      - id: role_option_treasurer
        type: list-item
        headline: "Treasurer"
        trailing: radio_button
        selected: "{{selectedRole == TREASURER}}"
        on_click: { action: OnRoleSelected, params: { role: TREASURER }, state: selectedRole }
        style: { min_touch_target: 56dp }
      - id: role_option_secretary
        type: list-item
        headline: "Secretary"
        trailing: radio_button
        selected: "{{selectedRole == SECRETARY}}"
        on_click: { action: OnRoleSelected, params: { role: SECRETARY }, state: selectedRole }
        style: { min_touch_target: 56dp }
      - id: role_option_member
        type: list-item
        headline: "Member"
        trailing: radio_button
        selected: "{{selectedRole == MEMBER}}"
        on_click: { action: OnRoleSelected, params: { role: MEMBER }, state: selectedRole }
        style: { min_touch_target: 56dp }
      - id: confirm_role_button
        type: button
        variant: filled
        label: "Confirm"
        loading: "{{isUpdatingRole}}"
        style: { background: primary, text_color: onPrimary, min_touch_target: 56dp, full_width: true }
        on_click: { action: OnConfirmRoleChange, api: update_member_role }
    on_dismiss: { action: OnDismissRoleEdit }
    test_context:
      purpose: "Role selection sheet; only available to chairperson"
      interaction_type: radio_select_and_confirm
      data_driven: true
      required_fields: [selectedRole, isUpdatingRole]

  - id: shimmer_profile
    type: shimmer
    count: 4
    style: { height: 100dp, corner_radius: 16dp, background: surfaceVariant }
    test_context:
      purpose: "Loading skeleton for parallel API calls"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "Could not load profile"
    body: "{{error.message}}"
    cta_label: "Retry"
    on_click: { action: Retry, state: reload }
    test_context:
      purpose: "Error state with retry"
      interaction_type: tap
      data_driven: true
      required_fields: [error.message]

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_profile]
    description: "Parallel API calls in-flight"
  content:
    components: [top_bar, member_header_card, savings_history_card, active_loan_card, attendance_card]
    description: "All member data loaded; role edit sheet overlays on demand"
    demo_data:
      member:
        displayName: "Amina Wanjiru"
        firstName: "Amina"
        lastName: "Wanjiru"
        phone: "+254712345678"
        photoUri: null
        joinDate: "2026-01-15"
        status: "Active"
      role: TREASURER
      isCurrentUserChairperson: true
      accounts:
        savingsBalance: 3500.00
        savingsHistory:
          - { date: "2026-01-20", balance: 500.00 }
          - { date: "2026-01-27", balance: 1000.00 }
          - { date: "2026-02-03", balance: 1500.00 }
          - { date: "2026-02-10", balance: 2000.00 }
          - { date: "2026-02-17", balance: 2500.00 }
          - { date: "2026-02-24", balance: 3000.00 }
          - { date: "2026-03-03", balance: 3500.00 }
        activeLoan: null
      meetingsAttended: 14
      totalMeetings: 15
      attendanceRate: 0.93
  error:
    components: [top_bar, error_state]
    description: "API error"

i18n:
  en:
    screen_title: "Member Profile"
    member_since: "Member since {{date}}"
    edit_role: "Edit Role"
    savings_label: "Savings History"
    loan_label: "Active Loan"
    loan_arrears: "This loan is in arrears. Due: {{date}}"
    attendance_label: "Meeting Attendance"
    attendance_fraction: "{{attended}} / {{total}}"
    attendance_rate: "{{rate}} attendance rate"
    change_role_title: "Change Member Role"
    role_updated: "Role updated successfully."
    error_network: "No internet. Showing cached profile."
    error_server: "Server error. Please retry."
    error_not_found: "Member not found."
    error_auth: "Session expired."
    error_role_update: "Could not update role. Please retry."

analytics:
  screen_view: member_profile_viewed
  events:
    - trigger: edit role tap
      name: role_edit_opened
      params: { member_id: String, current_role: String }
    - trigger: role confirmed
      name: member_role_updated
      params: { member_id: String, old_role: String, new_role: String }
    - trigger: loan arrears visible
      name: member_loan_arrears_shown
      params: { member_id: String, outstanding: Double }
