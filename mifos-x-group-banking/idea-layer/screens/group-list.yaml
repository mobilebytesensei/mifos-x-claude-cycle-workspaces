schema_version: "3.1"
id: group-list
name: Group List
description: >
  Lists all savings groups (Fineract Centers) managed by the logged-in field officer or treasurer.
  Each card shows group name, cycle, member count, last meeting date, and health indicator
  based on overdue loan rate. Supports search and FAB to create a new group.
feature: group-management
flow: group-management-flow
version: "1.0.0"
tags:
  - group-management
  - admin
  - list
  - offline-first

# Lifecycle
status: enriched
quality_score: 88
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system

# Navigation
entry_point: true
bottom_nav:
  visible: true
  selected_tab: groups
navigates_to:
  - group-dashboard
  - group-create
route: /groups
entry_points:
  - source: bottom_nav
    label: Groups
  - source: app_launch
    condition: user_authenticated
nav_params: {}

screens:
  - id: group-list-screen
    title: My Groups
    type: list
    description: Scrollable list of groups with search bar and FAB

state_model:
  GroupListViewModel:
    state:
      name: GroupListState
      fields:
        isLoading: { type: Boolean, default: "true" }
        groups: { type: "List<Group>", default: "emptyList()" }
        searchQuery: { type: String, default: '""' }
        filteredGroups: { type: "List<Group>", default: "emptyList()" }
        error: { type: "GroupListError?", default: "null" }
        isRefreshing: { type: Boolean, default: "false" }
    screen_state:
      name: GroupListScreenState
      members: [Loading, Content, Error, Empty]
    errors:
      name: GroupListError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: GroupListEvent
      members:
        - { name: NavigateToGroupDashboard, params: { groupId: String } }
        - { name: NavigateToCreateGroup }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: GroupListAction
      members:
        - { name: OnGroupClick, params: { groupId: String }, trigger: "Tap group card" }
        - { name: OnSearch, params: { query: String }, trigger: "Type in search bar" }
        - { name: OnClearSearch, trigger: "Tap clear icon in search bar" }
        - { name: OnCreateGroup, trigger: "Tap FAB" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
        - { name: Retry, trigger: "Tap retry button on error state" }
    di:
      - GroupRepository
      - NetworkMonitor
      - SessionManager

flow_logic:
  on_load:
    - action: fetch_groups
      api: get_centers
      on_success: show_content
      on_empty: show_empty
      on_error: show_error
  on_search:
    - action: filter_groups_locally
      description: Client-side filter on group name; no extra API call
  on_refresh:
    - action: fetch_groups
      api: get_centers
      invalidate_cache: true
  on_group_click:
    - navigate: group-dashboard
      params: { groupId: "{group.id}" }
  on_create_group:
    - navigate: group-create

dependencies:
  repositories:
    - name: GroupRepository
      methods:
        - getGroups(staffId: Long, limit: Int, offset: Int): Flow<List<Group>>
        - searchGroups(query: String): Flow<List<Group>>
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: groups
      schema: SQLDelight Group entity

api:
  - id: get_centers
    function: get_centers
    method: get
    endpoint: "/centers"
    description: Fetch all groups (Fineract Centers) managed by the logged-in staff member
    params:
      staffId: { type: Long, required: false, source: session }
      paged: { type: Boolean, default: true }
      limit: { type: Int, default: 20 }
      offset: { type: Int, default: 0 }
    response:
      type: object
      fields:
        totalFilteredRecords: Int
        pageItems:
          type: array
          items:
            id: Long
            name: String
            status: { id: Int, value: String }
            activationDate: List<Int>
            meetingSchedule: String
            staffId: Long
            officeId: Long
    errors:
      401: Unauthorized — redirect to login
      403: Forbidden — insufficient permissions
      500: Server error — show retry
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached
    pagination:
      type: offset
      page_size: 20

dtos:
  Group:
    id: Long
    name: String
    cycleNumber: Int
    memberCount: Int
    lastMeetingDate: String
    healthIndicator: HealthIndicator  # GREEN | AMBER | RED
    overdueRate: Double
    status: String
    fineractCenterId: Long

  HealthIndicator:
    values: [GREEN, AMBER, RED]
    rules:
      GREEN: overdueRate < 0.05
      AMBER: overdueRate >= 0.05 && overdueRate < 0.20
      RED: overdueRate >= 0.20

components:
  - id: top_bar
    type: top-bar
    title: "My Groups"
    style:
      background: primary
      text_color: onPrimary
    actions:
      - icon: notifications
        content_description: "Notifications"
        on_click: { action: OnOpenNotifications, target: notifications }  # v1.1 deferred
    test_context:
      purpose: "Main app bar showing current section title"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: search_bar
    type: search-bar
    placeholder: "Search groups…"
    style:
      background: surface
      corner_radius: 28dp
      elevation: 2dp
      min_touch_target: 48dp
    on_change: { action: OnSearch, param: query }
    clear_icon: true
    on_clear: { action: OnClearSearch }
    test_context:
      purpose: "Filter group list by name locally"
      interaction_type: text_input
      data_driven: false
      required_fields: [query]

  - id: group_card
    type: card
    style:
      background: surface
      elevation: 2dp
      corner_radius: 12dp
      padding: 16dp
      min_touch_target: 72dp
    content:
      - id: group_name_text
        type: text
        style: { text_style: titleMedium, color: onSurface }
        value: "{{group.name}}"
      - id: cycle_chip
        type: chip
        style: { background: secondaryContainer, text_color: onSecondaryContainer }
        label: "Cycle {{group.cycleNumber}}"
      - id: member_count_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "{{group.memberCount}} members"
      - id: last_meeting_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "Last met: {{group.lastMeetingDate}}"
      - id: health_indicator_badge
        type: badge
        style:
          GREEN: { background: "#C8E6C9", text_color: "#1B5E20" }
          AMBER: { background: "#FFF9C4", text_color: "#E65100" }
          RED: { background: "#FFCDD2", text_color: "#B71C1C" }
        value: "{{group.healthIndicator}}"
    on_click: { action: OnGroupClick, params: { groupId: "{{group.id}}" }, target: group-dashboard }
    test_context:
      purpose: "Displays summary info for a single group; tap navigates to dashboard"
      interaction_type: tap
      data_driven: true
      required_fields: [group.name, group.cycleNumber, group.memberCount, group.healthIndicator]

  - id: create_group_fab
    type: fab
    icon: add
    label: "New Group"
    style:
      background: primary
      icon_color: onPrimary
      min_touch_target: 56dp
      position: bottom_end
    on_click: { action: OnCreateGroup, target: group-create }
    test_context:
      purpose: "Navigate to group creation wizard"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: shimmer_list
    type: shimmer
    count: 5
    style: { height: 88dp, corner_radius: 12dp, background: surfaceVariant }
    test_context:
      purpose: "Shown while groups are loading from API"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: empty_state
    type: empty-state
    icon: group_off
    title: "No groups yet"
    body: "Create your first savings group to get started."
    cta_label: "Create Group"
    on_click: { action: OnCreateGroup, target: group-create }
    test_context:
      purpose: "Guide user to create a group when none exist"
      interaction_type: tap
      data_driven: false
      required_fields: []

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "Could not load groups"
    body: "{{error.message}}"
    cta_label: "Retry"
    on_click: { action: Retry, state: reload }
    test_context:
      purpose: "Show error and retry when API fails"
      interaction_type: tap
      data_driven: true
      required_fields: [error.message]

states:
  initial_state: loading
  loading:
    components: [top_bar, search_bar, shimmer_list]
    description: "Fetching groups from Fineract; shimmer cards displayed"
  content:
    components: [top_bar, search_bar, group_card, create_group_fab]
    description: "Groups loaded; list is scrollable; FAB visible"
    demo_data:
      groups:
        - name: "Mwangaza Women's Group"
          cycleNumber: 1
          memberCount: 5
          lastMeetingDate: "2026-04-28"
          healthIndicator: GREEN
          overdueRate: 0.00
        - name: "Tumaini Savings Circle"
          cycleNumber: 3
          memberCount: 12
          lastMeetingDate: "2026-04-25"
          healthIndicator: AMBER
          overdueRate: 0.12
  empty:
    components: [top_bar, search_bar, empty_state, create_group_fab]
    description: "No groups found; prompt to create first group"
  error:
    components: [top_bar, error_state]
    description: "API failed; error message with retry"

i18n:
  en:
    screen_title: "My Groups"
    search_placeholder: "Search groups…"
    cycle_label: "Cycle {{n}}"
    members_label: "{{n}} members"
    last_met_label: "Last met: {{date}}"
    fab_label: "New Group"
    empty_title: "No groups yet"
    empty_body: "Create your first savings group to get started."
    empty_cta: "Create Group"
    error_network: "No internet connection. Showing cached data."
    error_server: "Server error. Please try again."
    error_auth: "Session expired. Please log in again."
    health_green: "Healthy"
    health_amber: "At Risk"
    health_red: "Critical"

analytics:
  screen_view: group_list_viewed
  events:
    - trigger: group card tap
      name: group_selected
      params: { group_id: String, health_status: String }
    - trigger: FAB tap
      name: create_group_initiated
    - trigger: search input
      name: group_search_performed
      params: { query_length: Int }
    - trigger: pull to refresh
      name: group_list_refreshed
