sibling: api
schema_version: "4.0"
feature_id: member-profile

api:
  - id: get_client
    function: get_client
    method: get
    endpoint: "/clients/{clientId}"
    description: Fetch full client (member) profile from Fineract
    params:
      clientId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        id: Long
        displayName: String
        firstname: String
        lastname: String
        mobileNo: String
        imagePresent: Boolean
        status: { id: Int, value: String }
        activationDate: String
        officeId: Long
    errors:
      401: Unauthorized
      403: Forbidden
      404: Client not found
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_client_accounts
    function: get_client_accounts
    method: get
    endpoint: "/clients/{clientId}/accounts"
    description: Fetch savings and loan accounts for the client
    params:
      clientId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        savingsAccounts:
          type: array
          items:
            id: Long
            productName: String
            accountNo: String
            balance: Double
            status: { id: Int, value: String }
        loanAccounts:
          type: array
          items:
            id: Long
            productName: String
            accountNo: String
            status: { id: Int, value: String }
            summary:
              principalDisbursed: Double
              principalOutstanding: Double
              totalOverdue: Double
    errors:
      401: Unauthorized
      403: Forbidden
      404: Client not found
      500: Server error
    cache:
      ttl: 120
      strategy: stale-while-revalidate
      offline: show_cached

  - id: get_member_role
    function: get_member_role
    method: get
    endpoint: "/datatables/dt_member_role/{clientId}"
    description: Fetch member's role from custom datatable
    params:
      clientId: { type: Long, required: true, source: nav_params }
    response:
      type: array
      items:
        role: String
        groupId: Long
        assignedDate: String
    errors:
      401: Unauthorized
      403: Forbidden
      404: Role record not found
      500: Server error
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached

  - id: update_member_role
    function: update_member_role
    method: put
    endpoint: "/datatables/dt_member_role/{clientId}"
    description: Update member's role in custom datatable
    params:
      clientId: { type: Long, required: true, source: nav_params }
    body:
      role: String
      groupId: Long
      assignedDate: String
    response:
      type: object
      fields:
        resourceId: Long
    errors:
      400: Invalid role value
      401: Unauthorized
      403: Forbidden — caller is not chairperson
      500: Server error

dtos:
  Member:
    id: String
    fineractClientId: Long
    displayName: String
    firstName: String
    lastName: String
    phone: String
    photoUri: "String?"
    joinDate: String
    status: String

  MemberAccounts:
    savingsBalance: Double
    savingsHistory: "List<SavingsDataPoint>"
    activeLoan: "ActiveLoanSummary?"

  ActiveLoanSummary:
    id: Long
    productName: String
    outstandingBalance: Double
    inArrears: Boolean
    dueDate: "String?"

  SavingsDataPoint:
    date: String
    balance: Double

  AttendanceSummary:
    meetingsAttended: Int
    totalMeetings: Int
    attendanceRate: Double

  MemberRole:
    values: [CHAIRPERSON, TREASURER, SECRETARY, MEMBER]

cache_strategy:
  ttl: 300
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: MemberRepository
      methods:
        - "getMemberProfile(memberId: String): Flow<Member>"
        - "getMemberAccounts(memberId: String): Flow<MemberAccounts>"
        - "getMemberRole(memberId: String): Flow<MemberRole>"
        - "updateMemberRole(memberId: String, role: MemberRole): Result<Unit>"
    - name: GroupRepository
      methods:
        - "isCurrentUserChairperson(groupId: String): Flow<Boolean>"
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: members
      schema: SQLDelight Member entity
    - table: member_accounts
      schema: SQLDelight MemberAccounts entity
