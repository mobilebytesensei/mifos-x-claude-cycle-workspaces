sibling: flow
schema_version: "4.0"
feature_id: member-profile

navigates_to:
  - member-list
  - member-savings-detail
  - member-edit-role

flow_logic:
  on_load:
    - action: load_member_profile
      parallel:
        - api: get_client
          params: { clientId: nav_params.memberId }
        - api: get_client_accounts
          params: { clientId: nav_params.memberId }
        - api: get_member_role
          params: { clientId: nav_params.memberId }
      on_all_success: show_content
      on_any_error: show_error
  on_edit_role_tap:
    - condition: "isCurrentUserChairperson"
      action: show_role_edit_sheet
      state: { isEditingRole: true, selectedRole: currentRole }
  on_role_selected:
    - state: { selectedRole: params.role }
  on_confirm_role_change:
    - action: validate
      condition: "selectedRole != null && selectedRole != currentRole"
      on_valid:
        - api: update_member_role
          params: { clientId: nav_params.memberId, role: selectedRole }
          on_success:
            - state: { role: selectedRole, isEditingRole: false }
            - emit: ShowSnackbar
              params: { message: "Role updated successfully." }
          on_error:
            - emit: ShowSnackbar
              params: { message: "{error_role_update}" }
  on_dismiss_role_edit:
    - state: { isEditingRole: false, selectedRole: null }
  on_view_savings:
    - navigate: member-savings-detail
      params: { memberId: "{nav_params.memberId}", groupId: "{nav_params.groupId}" }
  on_back:
    - navigate: member-list
      params: { groupId: "{nav_params.groupId}" }
