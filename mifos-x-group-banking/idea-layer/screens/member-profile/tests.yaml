sibling: tests
schema_version: "4.0"
feature_id: member-profile
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MP-001
      scenario: "On mount, 3 parallel reads load member info, savings, and loans"
      type: ViewModel
      priority: P0
      given: "memberId=3; groupId=1; network online"
      when: "MemberProfileScreen enters composition"
      then: "MemberRepository.getMember(3, 1) + SavingsRepository.getMemberSavings(3, 1) + LoanRepository.getMemberLoans(3, 1) all called in parallel; MemberProfileScreenState=Content on all success"

    - id: TC-MP-002
      scenario: "Attendance rate computed from attendedCount / totalMeetings locally"
      type: ViewModel
      priority: P0
      given: "member={attendedMeetings:8, totalMeetings:10}"
      when: "profile loaded"
      then: "attendanceRate=80%; rendered as '8/10 meetings' with progress bar at 80%"

    - id: TC-MP-003
      scenario: "Role shown with correct badge per CHAIRPERSON / TREASURER / SECRETARY / MEMBER"
      type: Screen
      priority: P0
      given: "Content state; member.role=TREASURER"
      when: "MemberProfileHeader renders"
      then: "TREASURER badge shown; color distinct from MEMBER/CHAIRPERSON badges"

    - id: TC-MP-004
      scenario: "ORGANIZER can edit member role via OnEditRole"
      type: ViewModel
      priority: P1
      given: "currentUserRole=CHAIRPERSON (ORGANIZER privilege); member.id=3"
      when: "OnEditRole fires"
      then: "ShowRoleEditDialog event emitted; role picker dialog shown"

    - id: TC-MP-005
      scenario: "Non-ORGANIZER user cannot see edit role option"
      type: Screen
      priority: P1
      given: "currentUserRole=MEMBER"
      when: "MemberProfileHeader renders"
      then: "edit role button not visible"

    - id: TC-MP-006
      scenario: "OnSaveRole calls PATCH /companion/groups/{groupId}/members/{memberId}/role and updates profile"
      type: ViewModel
      priority: P1
      given: "network online; new role=SECRETARY"
      when: "OnSaveRole(SECRETARY) fires"
      then: "PATCH /companion/groups/1/members/3/role called with role=SECRETARY; on 200 member.role updated; ShowSnackbar('Role updated') emitted"

    - id: TC-MP-007
      scenario: "Savings section shows balance and link to member-savings-detail"
      type: Screen
      priority: P1
      given: "Content state; savings.balance=6500.0"
      when: "SavingsSummarySection renders"
      then: "KES 6,500 balance shown; View Details link navigates to member-savings-detail"

    - id: TC-MP-008
      scenario: "Error on any parallel load shows error state with retry"
      type: Screen
      priority: P1
      given: "one of the 3 parallel calls returns network error"
      when: "load completes"
      then: "MemberProfileScreenState=Error; retry loads all 3 in parallel again"
