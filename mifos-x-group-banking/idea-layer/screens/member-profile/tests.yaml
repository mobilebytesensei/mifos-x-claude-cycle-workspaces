sibling: tests
schema_version: "4.0"
feature_id: member-profile

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-MP-001
      scenario: "Profile loads on mount — header, savings card, and attendance rate shown"
      type: ViewModel
      priority: P0
      given: "memberId='client_001', groupId='42'"
      when: "Screen mounts"
      then: "get_client + get_client_accounts + get_member_role all called; state.member populated; attendanceRate=0.875"

    - id: TC-MP-002
      scenario: "Member header card shows name, join date, phone, and role chip"
      type: Screen
      priority: P0
      given: "Content state, member=Amina Wanjiru, role=TREASURER"
      when: "Screen renders"
      then: "member_name_text='Amina Wanjiru', role_chip label='TREASURER' with secondary background"

    - id: TC-MP-003
      scenario: "Savings sparkline renders with 7 data points in correct ascending order"
      type: Screen
      priority: P1
      given: "Content state, savingsHistory has 7 monthly entries from Nov-2025 to May-2026"
      when: "Screen renders"
      then: "savings_sparkline visible with 7 points, latest balance='KES 3,500.00'"

    - id: TC-MP-004
      scenario: "View Full History button navigates to member-savings-detail"
      type: ViewModel
      priority: P0
      given: "Content state"
      when: "OnViewSavings dispatched"
      then: "NavigateToSavingsDetail event emitted with memberId='client_001' and groupId='42'"

    - id: TC-MP-005
      scenario: "Edit Role button only visible for chairperson user"
      type: Screen
      priority: P0
      given: "isCurrentUserChairperson=true"
      when: "Screen renders"
      then: "edit_role_button visible"

    - id: TC-MP-006
      scenario: "Edit Role button hidden for non-chairperson users"
      type: Screen
      priority: P0
      given: "isCurrentUserChairperson=false"
      when: "Screen renders"
      then: "edit_role_button not visible"

    - id: TC-MP-007
      scenario: "Tap Edit Role opens role selection bottom sheet"
      type: ViewModel
      priority: P1
      given: "isCurrentUserChairperson=true, isEditingRole=false"
      when: "OnEditRoleTap dispatched"
      then: "isEditingRole=true, role bottom sheet visible with CHAIRPERSON, TREASURER, SECRETARY, MEMBER options"

    - id: TC-MP-008
      scenario: "Chairperson selects new role and confirms — API called with new role"
      type: ViewModel
      priority: P1
      given: "isEditingRole=true, selectedRole=SECRETARY"
      when: "OnConfirmRoleChange dispatched"
      then: "isUpdatingRole=true, update_member_role API called, role updated to SECRETARY, isEditingRole=false"

    - id: TC-MP-009
      scenario: "Role update failure shows error snackbar and keeps original role"
      type: ViewModel
      priority: P1
      given: "isEditingRole=true, API returns 500"
      when: "OnConfirmRoleChange dispatched"
      then: "MemberProfileError.RoleUpdateFailed set, ShowSnackbar with error_role_update, role unchanged"

    - id: TC-MP-010
      scenario: "Attendance rate card shows 14/16 meetings (87.5%)"
      type: Screen
      priority: P1
      given: "meetingsAttended=14, totalMeetings=16"
      when: "Screen renders"
      then: "attendance section shows '14/16' and '87.5%' rate"

    - id: TC-MP-011
      scenario: "Network error on mount shows error state with retry"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, no cache"
      when: "Screen mounts"
      then: "MemberProfileError.Network set, error_state visible with retry CTA"

    - id: TC-MP-012
      scenario: "Member not found (404) shows not-found error state"
      type: ViewModel
      priority: P1
      given: "API returns 404 for clientId"
      when: "Screen mounts"
      then: "MemberProfileError.NotFound set, error state with error_not_found message"

    - id: TC-MP-013
      scenario: "Back tap navigates back to member-list"
      type: ViewModel
      priority: P2
      given: "Content state"
      when: "OnBack dispatched"
      then: "NavigateToMemberList event emitted with groupId='42'"

    - id: TC-MP-014
      scenario: "Dismiss role edit bottom sheet resets isEditingRole without API call"
      type: ViewModel
      priority: P2
      given: "isEditingRole=true, selectedRole=SECRETARY"
      when: "OnDismissRoleEdit dispatched"
      then: "isEditingRole=false, selectedRole=null, no API call made"
