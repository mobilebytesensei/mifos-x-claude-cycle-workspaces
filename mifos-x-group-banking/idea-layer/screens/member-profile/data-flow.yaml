sibling: data-flow
schema_version: "2.1.0"
feature_id: member-profile

entries:
  - screen_id: memberProfileScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_client, transport: rest, method: get }
      - { api_id: get_client_accounts, transport: rest, method: get }
      - { api_id: get_member_role, transport: rest, method: get }
    dtos:
      - { name: Member, role: response, api_id: get_client }
      - { name: MemberAccounts, role: response, api_id: get_client_accounts }
      - { name: MemberRole, role: response, api_id: get_member_role }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "member_profile:{memberId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "403", behavior: error_state, message_key: error_server }
      - { error_code: "404", behavior: error_state, message_key: error_not_found }
      - { error_code: "500", behavior: error_state, message_key: error_server }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_network }

  - screen_id: memberProfileScreen
    trigger: on_interact
    interaction: confirm_role_change
    endpoints:
      - { api_id: update_member_role, transport: rest, method: put }
    dtos:
      - { name: MemberRole, role: request, api_id: update_member_role }
    auth_required: true
    cache:
      strategy: invalidate
      key_template: "member_profile:{memberId}"
    error_paths:
      - { error_code: "400", behavior: snackbar, message_key: error_role_update }
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "500", behavior: snackbar, message_key: error_role_update }
      - { error_code: "network.offline", behavior: snackbar, message_key: error_network }
