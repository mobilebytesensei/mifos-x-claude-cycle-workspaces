<!DOCTYPE html>
<!-- render-hash: content:24f9ccd65a71 -->
<html lang="en" data-feature="member-profile" data-state="content" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>member-profile · content · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* member_header_card — primaryContainer, avatar + name + since + phone + role chip + edit button */
  .member-header-card { background: var(--primary-100); border-radius: var(--radius-base); padding: var(--space-base); margin-bottom: var(--space-base); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
  .member-avatar-lg { width: 72px; height: 72px; border-radius: 50%; background: var(--primary-700); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; flex-shrink: 0; }
  .member-name { font-size: 20px; font-weight: 700; color: var(--primary-900); }
  .member-since { font-size: 12px; color: var(--primary-900); opacity: .8; }
  .member-phone { font-size: 14px; color: var(--primary-900); font-family: 'Roboto Mono', monospace; }
  .role-chip { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: .03em; padding: 4px var(--space-md); border-radius: 9999px; background: var(--accent-100); color: var(--primary-900); }
  .edit-role-btn { margin-top: var(--space-sm); background: transparent; border: 1px solid var(--primary-700); color: var(--primary-700); font-size: 14px; font-weight: 600; padding: 8px var(--space-base); border-radius: var(--radius-md); min-height: 40px; cursor: pointer; }
  /* generic detail card */
  .p-card { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); padding: var(--space-base); margin-bottom: var(--space-base); }
  .p-card h3 { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 var(--space-sm); }
  .savings-balance { font-size: 28px; font-weight: 700; color: var(--primary-700); font-family: 'Roboto Mono', monospace; margin-bottom: var(--space-sm); }
  /* sparkline */
  .sparkline-bars { display: flex; align-items: flex-end; gap: 6px; height: 80px; margin-bottom: var(--space-sm); }
  .spark-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
  .spark-bar { background: var(--primary-100); border-radius: 2px 2px 0 0; width: 100%; }
  .spark-bar.latest { background: var(--primary-700); }
  .spark-month { font-size: 9px; color: var(--text-secondary); }
  .view-history-btn { background: transparent; border: none; color: var(--primary-700); font-size: 14px; font-weight: 600; padding: 6px 0; cursor: pointer; }
  /* attendance */
  .attendance-fraction { font-size: 24px; font-weight: 700; color: var(--accent-700); font-family: 'Roboto Mono', monospace; }
  .attendance-rate { font-size: 13px; color: var(--text-secondary); margin: 2px 0 var(--space-sm); }
  .progress-track { height: 8px; border-radius: 9999px; background: var(--bg-muted); overflow: hidden; }
  .progress-indicator { height: 100%; border-radius: 9999px; }
  .no-loan { font-size: 13px; color: var(--text-secondary); font-style: italic; }
</style>
</head>
<body>
<div class="app-shell" data-shell="detail">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <!-- top_bar — OnBack navigates to member-list -->
  <header class="top-app-bar" data-component-type="top_bar" data-component-id="top_bar">
    <button class="back-btn" data-nav-to="member-list" data-nav-params='{"groupId":"grp_001"}' aria-label="Back">‹</button>
    <h1 class="app-bar-title">Member Profile</h1>
  </header>

  <main>
    <!-- member_header_card — primaryContainer background; edit role visible for chairperson -->
    <div class="member-header-card" data-component-type="card" data-component-id="member_header_card">
      <div class="member-avatar-lg" aria-label="Amina Wanjiru avatar">AW</div>
      <div class="member-name" data-component-id="member_name_text">Amina Wanjiru</div>
      <div class="member-since" data-component-id="member_since_text">Member since 10 Jan 2025</div>
      <div class="member-phone" data-component-id="member_phone_text">+254 700 000 001</div>
      <span class="role-chip" data-component-id="role_chip">TREASURER</span>
      <!-- edit_role_button — visible only when isCurrentUserChairperson; OnEditRoleTap opens role bottom sheet -->
      <button class="edit-role-btn" data-action="OnEditRoleTap" data-component-id="edit_role_button">Edit Role</button>
    </div>

    <!-- savings_history_card — balance + sparkline + view full history -->
    <div class="p-card" data-component-type="card" data-component-id="savings_history_card">
      <h3 data-component-id="savings_label">Savings History</h3>
      <div class="savings-balance" data-component-id="savings_balance_text">KES 3,500</div>
      <div class="sparkline-bars" data-component-id="savings_sparkline" aria-label="Savings balance trend">
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:11px;"></div><div class="spark-month">Nov</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:23px;"></div><div class="spark-month">Dec</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:34px;"></div><div class="spark-month">Jan</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:48px;"></div><div class="spark-month">Feb</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:62px;"></div><div class="spark-month">Mar</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar" style="height:73px;"></div><div class="spark-month">Apr</div></div>
        <div class="spark-bar-wrap"><div class="spark-bar latest" style="height:80px;"></div><div class="spark-month">May</div></div>
      </div>
      <!-- view_full_history_button — OnViewSavings navigates to member-savings-detail -->
      <button class="view-history-btn" data-nav-to="member-savings-detail" data-nav-params='{"memberId":"client_001","groupId":"grp_001"}' data-component-id="view_full_history_button">View Full History ›</button>
    </div>

    <!-- active_loan_card — hidden when accounts.activeLoan == null (demo: no active loan) -->
    <div class="p-card" data-component-type="card" data-component-id="active_loan_card">
      <h3 data-component-id="loan_card_label">Active Loan</h3>
      <p class="no-loan">No active loan.</p>
    </div>

    <!-- attendance_card — fraction + rate + progress bar (0.875 → gte_80 tertiary/accent) -->
    <div class="p-card" data-component-type="card" data-component-id="attendance_card">
      <h3 data-component-id="attendance_label">Meeting Attendance</h3>
      <div class="attendance-fraction" data-component-id="attendance_fraction_text">14 / 16</div>
      <div class="attendance-rate" data-component-id="attendance_rate_text">88% attendance rate</div>
      <div class="progress-track" data-component-id="attendance_progress_bar">
        <div class="progress-indicator" style="width:88%;background:var(--accent-700);"></div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
