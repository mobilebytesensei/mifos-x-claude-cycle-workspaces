<!DOCTYPE html>
<!-- render-hash: content:prod-b7a673 -->
<html lang="en" data-feature="member-profile" data-state="content" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>member-profile · content · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* Layout-only helpers — all component semantics use shared DS classes.
     Header (member_header_card): .card .card-highlighted with a large .avatar. */
  .profile-header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-xs); }
  .profile-header .avatar { width: 72px; height: 72px; font-size: 26px; }
  .profile-header .member-name { font-size: 20px; font-weight: 700; color: var(--primary-900); }
  .profile-header .member-since { font-size: 12px; color: var(--text-secondary); }
  .profile-header .member-phone { font-size: 14px; color: var(--text-secondary); font-family: 'Roboto Mono', monospace; }
  /* Savings sparkline — bars only; colours from primary tokens. */
  .savings-balance { font-size: 28px; font-weight: 700; color: var(--primary-700); font-family: 'Roboto Mono', monospace; margin: var(--space-xs) 0 var(--space-md); }
  .sparkline { display: flex; align-items: flex-end; gap: 6px; height: 80px; margin-bottom: var(--space-sm); }
  .sparkline .bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .sparkline .bar { background: var(--primary-100); border-radius: 3px 3px 0 0; width: 100%; }
  .sparkline .bar.latest { background: var(--primary-700); }
  .sparkline .bar-label { font-size: 9px; color: var(--text-secondary); }
  /* Attendance progress track — DS has no dedicated linear-progress class. */
  .progress-track { height: 8px; border-radius: 9999px; background: var(--bg-muted); overflow: hidden; margin-top: var(--space-sm); }
  .progress-track .indicator { height: 100%; border-radius: 9999px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="detail">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar — OnBack (effect: navigate) → member-list, passes groupId -->
  <header class="top-app-bar" data-component-type="top-bar" data-component-id="top_bar">
    <button class="back-btn" data-nav-to="member-list" data-nav-type="pop" data-nav-params='{"groupId":"grp_001"}' data-action-id="OnBack" aria-label="Back to member list">‹</button>
    <h1>Member Profile</h1>
  </header>

  <main>
    <!-- member_header_card — primaryContainer highlighted card; avatar + name + since + phone + role chip + chairperson-only Edit Role -->
    <section class="card card-highlighted profile-header" data-component-type="card" data-component-id="member_header_card">
      <div class="avatar" aria-label="Amina Wanjiru avatar">AW</div>
      <div class="member-name" data-component-id="member_name_text">Amina Wanjiru</div>
      <div class="member-since" data-component-id="member_since_text">Member since 15 Jan 2026</div>
      <div class="member-phone" data-component-id="member_phone_text">+254 712 345 678</div>
      <span class="chip-static warning" data-component-id="role_chip">TREASURER</span>
      <!-- edit_role_button — visible only when isCurrentUserChairperson (demo: true); OnEditRoleTap (effect: transform_state) opens role sheet in-screen -->
      <button class="btn btn-secondary" data-action="OnEditRoleTap" data-action-params='{"effect":"transform_state"}' data-component-id="edit_role_button" style="margin-top:var(--space-sm);">Edit Role</button>
    </section>

    <!-- savings_history_card — balance + sparkline + View Full History (OnViewSavings → member-savings-detail) -->
    <section class="card" data-component-type="card" data-component-id="savings_history_card">
      <h3 data-component-id="savings_label">Savings History</h3>
      <div class="savings-balance" data-component-id="savings_balance_text">KES 3,500</div>
      <div class="sparkline" data-component-id="savings_sparkline" role="img" aria-label="Savings balance rising KES 500 to KES 3,500 over seven weeks">
        <div class="bar-wrap"><div class="bar" style="height:14%;"></div><div class="bar-label">Jan 20</div></div>
        <div class="bar-wrap"><div class="bar" style="height:29%;"></div><div class="bar-label">Jan 27</div></div>
        <div class="bar-wrap"><div class="bar" style="height:43%;"></div><div class="bar-label">Feb 3</div></div>
        <div class="bar-wrap"><div class="bar" style="height:57%;"></div><div class="bar-label">Feb 10</div></div>
        <div class="bar-wrap"><div class="bar" style="height:71%;"></div><div class="bar-label">Feb 17</div></div>
        <div class="bar-wrap"><div class="bar" style="height:86%;"></div><div class="bar-label">Feb 24</div></div>
        <div class="bar-wrap"><div class="bar latest" style="height:100%;"></div><div class="bar-label">Mar 3</div></div>
      </div>
      <!-- view_full_history_button — OnViewSavings (effect: navigate) → member-savings-detail -->
      <button class="btn btn-text" data-nav-to="member-savings-detail" data-nav-params='{"memberId":"client_001","groupId":"grp_001"}' data-action-id="OnViewSavings" data-component-id="view_full_history_button">View Full History ›</button>
    </section>

    <!-- active_loan_card — visible only when accounts.activeLoan != null; demo activeLoan is null → not rendered per conditional visibility -->

    <!-- attendance_card — fraction + rate + progress bar. 14/15 = 93% ≥ 80 → tertiary (accent) indicator -->
    <section class="card" data-component-type="card" data-component-id="attendance_card">
      <h3 data-component-id="attendance_label">Meeting Attendance</h3>
      <div class="card-group">
        <div class="summary-card" data-component-id="attendance_fraction_text">
          <div class="label">Meetings attended</div>
          <div class="metric">14 / 15</div>
          <div class="delta">Since 15 Jan 2026</div>
        </div>
        <div class="summary-card" data-component-id="attendance_rate_text">
          <div class="label">Attendance rate</div>
          <div class="metric">93%</div>
          <div class="delta">On track</div>
        </div>
      </div>
      <div class="progress-track" data-component-id="attendance_progress_bar" role="progressbar" aria-valuenow="93" aria-valuemin="0" aria-valuemax="100" aria-label="93% attendance rate">
        <div class="indicator" style="width:93%;background:var(--accent-700);"></div>
      </div>
    </section>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
