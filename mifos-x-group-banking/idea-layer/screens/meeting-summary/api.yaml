sibling: api
schema_version: "4.0"
feature_id: meeting-summary

api:
  - id: get_meeting_record
    method: get
    endpoint: "/fineract-provider/api/v1/datatables/dt_meeting_record/{groupId}"
    description: Fetch completed meeting record by meeting number
    auth: BasicAuth
    path_params:
      groupId: Int
    query_params:
      meetingNumber: Int
    response_ref: MeetingRecordDetail
    error_handling:
      404: Show cached data or error state
      5xx: Show error banner

dtos:
  MeetingRecordDetail:
    meetingId: String
    meetingNumber: Int
    actualDate: { type: String, format: "dd MMMM yyyy" }
    attendanceCount: Int
    totalMemberCount: Int
    groupSavingsCollected: Long
    individualSavingsCollected: Long
    totalSavingsCollected: Long
    loansDisbursed: Long
    loansRepaid: Long
    finesCollected: Long
    openingCorpus: Long
    closingCorpus: Long
    savingsBreakdown: "List<SavingsBreakdownItem>"
    loanItems: "List<LoanSummaryItem>"

  SavingsBreakdownItem:
    memberId: String
    memberName: String
    groupSavings: Long
    individualSavings: Long

  LoanSummaryItem:
    memberId: String
    memberName: String
    amountDisbursed: Long
    amountRepaid: Long
    outstandingAfter: Long

dependencies:
  tier: feature
  features: [meeting-conduct, meeting-calendar]
  services:
    - MeetingRepository
    - ShareManager
    - NavigationManager
    - LocalMeetingDao
  shared_entities:
    - MeetingSummaryData
    - SavingsBreakdownItem
    - LoanSummaryItem
