# ─────────────────────────────────────────────────────────────────────────────
# E2E — meeting-summary : REACHABLE-PREFIX flow (post-submit-only target)
# ─────────────────────────────────────────────────────────────────────────────
# Reachability (GroupBankingNavHost §9b ← §9d meeting-conduct `onNavigateToMeetingSummary`):
#   meeting-summary is reached ONLY after a SUCCESSFUL full 7-step meeting-conduct submit
#   (submit_meeting → NavigateToMeetingSummary). NavHost wires meeting-calendar past-meeting
#   rows to previous-meeting-review (NOT summary), so there is NO tap-only path to summary.
#   Driving the submit needs per-member attendance + savings (≥KES 200) + loan data whose
#   member ids are seed-specific — NOT deterministically scriptable in static authoring.
# This flow therefore drives the reachable PREFIX (up to the meeting-conduct wizard) and
# documents the summary target assertions in the sibling .assertions.md (no faked submit).
# TestTags: MeetingSummaryTestTags.kt (target) + MeetingConduct/MeetingCalendar/etc (prefix).
appId: org.mifos.groupbanking
name: e2e — meeting-summary (reachable prefix to meeting-conduct; summary is post-submit)
tags:
  - e2e
  - group-banking
  - meeting-summary
env:
  ORGANIZER_USER: "organizer@demo.mifos"
  ORGANIZER_PASS: "Demo1234!"
---
# --- guaranteed prefix: fresh launch + login ---
- launchApp:
    clearState: true
- assertVisible:
    id: "login_signup_screen"
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: ${ORGANIZER_USER}
- tapOn:
    id: "login_signup_field_password"
- inputText: ${ORGANIZER_PASS}
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"

# --- nav to the meeting-conduct wizard (the screen that submits INTO meeting-summary) ---
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "organizer_dashboard_nav_group_list_card"
- assertVisible:
    id: "group_list_screen"
- tapOn:
    id: "group_list_card_"
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 20000
- tapOn:
    id: "group_dashboard_view_meetings_button"
- extendedWaitUntil:
    visible:
      id: "meeting_calendar_screen"
    timeout: 20000
- tapOn:
    id: "meeting_calendar_start_meeting_button"      # requires seeded UPCOMING meeting
- extendedWaitUntil:
    visible:
      id: "meeting_conduct_screen"
    timeout: 20000
- assertVisible:
    id: "meeting_conduct_stepper"                    # prefix reached: wizard that feeds summary

# ─────────────────────────────────────────────────────────────────────────────
# GAP: meeting-summary is reached only after completing + submitting the wizard.
# Intended target assertions (NOT executed — require seed-specific per-member data):
#   - extendedWaitUntil: { visible: { id: "meeting_summary_screen" }, timeout: 20000 }
#   - assertVisible: { id: "meeting_summary_content_list" }   # Content state
#   - assertVisible: { id: "meeting_summary_hero_card" }
#   - assertVisible: { id: "meeting_summary_metric_grid" }
#   - assertVisible: { id: "meeting_summary_done_button" }
#   - tapOn: { id: "meeting_summary_done_button" }            # NavigateDone → meeting-calendar
#   - assertVisible: { id: "meeting_calendar_screen" }
# See meeting-summary.assertions.md for the full state→tag map.
# ─────────────────────────────────────────────────────────────────────────────
