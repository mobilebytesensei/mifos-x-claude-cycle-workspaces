sibling: tests
schema_version: "4.0"
feature_id: meeting-summary

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MSM-001
      scenario: "In-memory path: renders content immediately from meeting-conduct wizard state, no loading state"
      type: Screen
      priority: P0
      given: "MeetingRecordDetail passed via navigation from meeting-conduct (wizard_submitted_successfully); centerId=1, meetingNumber=2"
      when: "MeetingSummaryScreen enters composition"
      then: "content state rendered instantly (hero_card + metric_grid + savings_breakdown_section + corpus_reconciliation_section + done_button); no loading skeleton shown; background get_meeting_record verify runs silently"

    - id: TC-MSM-002
      scenario: "Deep-link path: LoadSummary shows loading then fetches meeting record over Store5 cache"
      type: ViewModel
      priority: P0
      given: "no in-memory MeetingRecordDetail; deep link with centerId=1, meetingNumber=2; cache empty"
      when: "LoadSummary action fires on composition"
      then: "MeetingSummaryScreenState=Loading with loading_skeleton; get_meeting_record GET /datatables/dt_meeting_record/1?meetingNumber=2 called via MeetingRepository; state transitions to Content on success"

    - id: TC-MSM-003
      scenario: "Hero card shows total collected, meeting number, date, and closing-corpus chip"
      type: Screen
      priority: P0
      given: "Content state, totalSavingsCollected=1850, closingCorpus=48250, meetingNumber=2, actualDate='30 Apr 2026'"
      when: "hero_card renders"
      then: "'Total Collected' label + 'KES 1850' displaySmall shown; 'Meeting #2 · 30 Apr 2026' subtitle; corpus_hero_chip shows 'Corpus: KES 48250'"

    - id: TC-MSM-004
      scenario: "Metric grid renders all six metric cards with group/individual savings split"
      type: Screen
      priority: P0
      given: "Content state, groupSavingsCollected=1250, individualSavingsCollected=600, loansRepaid=375, finesCollected=0, loansDisbursed=0, attendanceCount=5, totalMemberCount=5"
      when: "metric_grid renders"
      then: "attendance_metric='5/5', group_savings_metric='KES 1250', individual_savings_metric='KES 600', repayments_metric='KES 375', fines_metric='KES 0', loans_disbursed_metric='KES 0' — all six cards present"

    - id: TC-MSM-005
      scenario: "Savings breakdown lists per-member group + individual savings with per-row total"
      type: Screen
      priority: P0
      given: "Content state, savingsBreakdown for members: Amina group=300/individual=120, Grace group=250/individual=100"
      when: "savings_breakdown_section renders"
      then: "one savings_breakdown_row per member with avatar initials; supporting line 'Group: KES 300 · Individual: KES 120'; trailing shows per-member total 'KES 420'"

    - id: TC-MSM-006
      scenario: "Corpus reconciliation shows opening, closing, and net change"
      type: Screen
      priority: P0
      given: "Content state, openingCorpus=47500, closingCorpus=48250"
      when: "corpus_reconciliation_section renders"
      then: "Opening row='KES 47500', Closing row='KES 48250' (titleMedium), Net Change row='KES 750' in primary color"

    - id: TC-MSM-007
      scenario: "ShareMeetingReport generates report and opens OS share sheet, toggling isSharing"
      type: ViewModel
      priority: P1
      given: "Content state with loaded MeetingRecordDetail"
      when: "ShareMeetingReport action dispatched (tap share_btn)"
      then: "isSharing=true while composing; text/PDF report generated via kmpToolkit ShareSheet with totals + savings breakdown + opening/closing corpus; ShareSummary event emitted; isSharing=false after dismissal; no cash movement"

    - id: TC-MSM-008
      scenario: "NavigateDone from Done button navigates to meeting-calendar with no persistence"
      type: ViewModel
      priority: P1
      given: "Content state on meeting-summary"
      when: "NavigateDone action dispatched (tap done_button)"
      then: "NavigateToCalendar event emitted; NavController pops to meeting-calendar; read-only screen so no save or corpus reconciliation runs"

    - id: TC-MSM-009
      scenario: "NavigateDone from top-bar back navigates to meeting-calendar"
      type: Screen
      priority: P2
      given: "Content state, top_app_bar arrow_back visible"
      when: "user taps top_app_bar navigation icon"
      then: "NavigateDone action dispatched; navigate to meeting-calendar; identical to Done button destination"

    - id: TC-MSM-010
      scenario: "Deep-link 404 with cached data shows cached content and LoadFailed banner"
      type: ViewModel
      priority: P1
      given: "get_meeting_record GET returns 404; Store5 cache holds previous meeting record"
      when: "LoadSummary fires on deep link"
      then: "cached content rendered; error='Could not load meeting summary. Showing cached data.'; no crash"

    - id: TC-MSM-011
      scenario: "Deep-link 5xx with empty cache shows error state"
      type: ViewModel
      priority: P1
      given: "get_meeting_record GET returns 500; no cached data"
      when: "LoadSummary fires"
      then: "MeetingSummaryScreenState=Error; error state (top_app_bar + error_banner) shown; no partial content rendered"

    - id: TC-MSM-012
      scenario: "MeetingRepository.getMeetingRecord maps full MeetingRecordDetail including breakdown lists"
      type: Repository
      priority: P0
      given: "mock GET /datatables/dt_meeting_record/1?meetingNumber=2 returns full JSON"
      when: "getMeetingRecord(centerId=1, meetingNumber=2) called"
      then: "MeetingRecordDetail populated with savingsBreakdown (List<SavingsBreakdownItem>) and loanItems (List<LoanSummaryItem>), openingCorpus and closingCorpus set; SQLDelight cache upserted keyed by center/meeting"

    - id: TC-MSM-013
      scenario: "Screen is read-only — only Share and Done are interactive"
      type: Screen
      priority: P2
      given: "meeting-summary Content state open"
      when: "user inspects all UI elements"
      then: "no editable fields; no action buttons except share_btn and done_button; all metric/breakdown/corpus rows are display-only"
