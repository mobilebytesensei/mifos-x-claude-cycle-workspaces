sibling: tests
schema_version: "4.0"
feature_id: meeting-summary

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MSM-001
      scenario: "In-memory path: renders immediately from meeting-conduct wizard state"
      type: Screen
      priority: P0
      given: "MeetingRecordDetail passed via navigation from meeting-conduct"
      when: "screen mounts"
      then: "summary rendered instantly; no loading state; API fetch runs silently in background to verify"

    - id: TC-MSM-002
      scenario: "Deep-link path: shows loading then fetches meeting record from API"
      type: ViewModel
      priority: P0
      given: "no in-memory state; centerId=1, meetingNumber=5"
      when: "screen mounts via deep link"
      then: "Loading state shown; GET /datatables/dt_meeting_record/1?meetingNumber=5 called; content rendered on success"

    - id: TC-MSM-003
      scenario: "All 5 members attendance section shows correct present/absent status"
      type: Screen
      priority: P0
      given: "MeetingRecordDetail: attendanceCount=5, totalMemberCount=5"
      when: "summary renders"
      then: "5/5 present indicator; all member names visible in attendance list"

    - id: TC-MSM-004
      scenario: "Savings breakdown shows per-member group + individual savings"
      type: Screen
      priority: P0
      given: "savingsBreakdown for 5 members, groupSavings=300 each, totalSavingsCollected=1750"
      when: "savings section renders"
      then: "each member row shows groupSavings and individualSavings; total row shows KES 1,750"

    - id: TC-MSM-005
      scenario: "Loan items section shows disbursed, repaid, outstanding per member"
      type: Screen
      priority: P0
      given: "loanItems: Peter disbursed KES 8,000; Amina repaid KES 700"
      when: "loans section renders"
      then: "Peter row: disbursed=8,000 highlighted; Amina row: repaid=700; outstanding shown per member"

    - id: TC-MSM-006
      scenario: "Corpus summary shows opening, transactions, closing corpus"
      type: Screen
      priority: P0
      given: "openingCorpus=51750, totalSavingsCollected=1750, loansRepaid=2500, loansDisbursed=8000, finesCollected=100, closingCorpus=48100"
      when: "corpus section renders"
      then: "math displayed: 51750 + 1750 + 2500 + 100 - 8000 = 48100; closing corpus prominent"

    - id: TC-MSM-007
      scenario: "Share button generates text report and opens Android share sheet"
      type: Screen
      priority: P1
      given: "share button tapped"
      when: "user taps share icon"
      then: "meeting summary text/PDF generated with all fields; Android share sheet opens"

    - id: TC-MSM-008
      scenario: "Done/Back button navigates to meeting-calendar"
      type: Screen
      priority: P1
      given: "user on meeting-summary"
      when: "user taps Done or back"
      then: "navigate to meeting-calendar"

    - id: TC-MSM-009
      scenario: "API 404 on deep link falls back to cached data or shows error"
      type: ViewModel
      priority: P1
      given: "GET /datatables/dt_meeting_record/1 returns 404, cache has previous data"
      when: "screen mounts"
      then: "cached data shown; error_meeting_record_not_found banner; no crash"

    - id: TC-MSM-010
      scenario: "MeetingRepository.getMeetingRecord maps full MeetingRecordDetail"
      type: Repository
      priority: P0
      given: "mock GET returns full meeting record JSON"
      when: "getMeetingRecord(centerId=1, meetingNumber=5) called"
      then: "MeetingRecordDetail populated with savingsBreakdown and loanItems lists"

    - id: TC-MSM-011
      scenario: "Screen is read-only — no edit actions available"
      type: Screen
      priority: P2
      given: "meeting-summary screen open"
      when: "user inspects all UI elements"
      then: "no editable fields; no action buttons except Share and Done"
