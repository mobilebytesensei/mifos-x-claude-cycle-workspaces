sibling: tests
schema_version: "4.0"
feature_id: meeting-summary
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MS-001
      scenario: "On mount, meeting summary loads from MeetingRepository with meetingId"
      type: ViewModel
      priority: P0
      given: "meetingId=5; groupId=1; network online"
      when: "MeetingSummaryScreen enters composition"
      then: "MeetingRepository.getMeetingSummary(5) called; summary populated; MeetingSummaryScreenState=Content"

    - id: TC-MS-002
      scenario: "Summary displays attendance count, total savings collected, and loans disbursed"
      type: Screen
      priority: P0
      given: "Content state; summary={attendees:8, totalSavings:4000.0, loansCount:2}"
      when: "SummaryView renders"
      then: "attendance=8, KES 4,000 savings, 2 loans disbursed visible in summary cards"

    - id: TC-MS-003
      scenario: "Resolutions list renders with pass/fail outcomes"
      type: Screen
      priority: P1
      given: "Content state; resolutions=[{text:'Approve fee waiver', outcome:PASSED}, {text:'Reject new rule', outcome:FAILED}]"
      when: "ResolutionsList renders"
      then: "2 resolution rows; PASSED shown in green chip; FAILED in red chip"

    - id: TC-MS-004
      scenario: "OnShareMeetingReport triggers ShareSheet with meeting summary PDF/text"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnShareMeetingReport fires"
      then: "ShareMeetingReport event emitted; platform ShareSheet opened with meeting summary content"

    - id: TC-MS-005
      scenario: "OnNavigateDone emits NavigateDone event back to meeting-calendar"
      type: ViewModel
      priority: P0
      given: "Content state"
      when: "OnNavigateDone fires"
      then: "NavigateDone event emitted; navigation stack cleared to group-dashboard or meeting-calendar"

    - id: TC-MS-006
      scenario: "Error state shows retry on load failure"
      type: Screen
      priority: P1
      given: "MeetingRepository.getMeetingSummary returns network error"
      when: "load completes"
      then: "MeetingSummaryScreenState=Error; retry CTA shown"

    - id: TC-MS-007
      scenario: "Absent members list rendered below attendance count"
      type: Screen
      priority: P2
      given: "Content state; absentMembers=['Alice', 'Bob']"
      when: "SummaryView renders"
      then: "absent members section shows 'Alice, Bob' with absent chip"
