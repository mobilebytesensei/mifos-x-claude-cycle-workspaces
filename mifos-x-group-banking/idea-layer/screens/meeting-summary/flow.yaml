sibling: flow
schema_version: "4.0"
feature_id: meeting-summary

navigates_to:
  - target: meeting-calendar
    condition: user_taps_done_or_back

flow_logic:
  - decision: screen_init
    branches:
      - condition: data_passed_from_conduct_wizard
        action: Render from in-memory state immediately, then verify with API
      - condition: deep_link_entry
        action: Show loading, fetch from dt_meeting_record API
  - decision: share_tapped
    branches:
      - condition: always
        action: Generate text/PDF report with all fields; open Android share sheet
