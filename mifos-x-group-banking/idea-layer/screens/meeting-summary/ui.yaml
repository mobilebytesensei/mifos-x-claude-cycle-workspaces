requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: meeting-summary

route: /meetings/{meetingId}/summary
entry_points:
  - source: meeting-conduct
    condition: wizard_submitted_successfully
  - source: meeting-calendar
    condition: user_taps_completed_meeting_summary_deep_link
nav_params:
  meeting_id: String
  meeting_number: Int
  group_id: Int

screens:
  - id: meeting_summary_screen
    name: MeetingSummaryScreen
    composable: MeetingSummaryScreen
    description: >
      Full-screen read-only summary. Top AppBar with share icon. Scrollable body
      with hero KES-collected card, metric grid, savings breakdown, loans section,
      attendance strip, and Done CTA at bottom.
    layout: Column (TopAppBar + LazyColumn[HeroCard + MetricGrid + SavingsBreakdown + LoanSection + AttendanceStrip + DoneBtn])

state_model:
  MeetingSummaryViewModel:
    state:
      name: MeetingSummaryState
      fields:
        meetingSummary: { type: "MeetingSummaryData?", default: "null" }
        isLoading: { type: Boolean, default: "true" }
        error: { type: "String?", default: "null" }
        isSharing: { type: Boolean, default: "false" }
        meetingId: { type: String, default: '""' }
        meetingNumber: { type: Int, default: "0" }
        groupId: { type: Int, default: "0" }
    screen_state:
      name: MeetingSummaryScreenState
      members: [Loading, Content, Error]
    errors:
      LoadFailed: "Could not load meeting summary. Showing cached data."
    events:
      name: MeetingSummaryEvent
      members:
        - { name: NavigateToCalendar }
        - { name: ShareSummary }
    actions:
      name: MeetingSummaryAction
      members:
        - { name: LoadSummary, trigger: "Screen enters composition" }
        - { name: ShareMeetingReport, trigger: "Tap share icon" }
        - { name: NavigateDone, trigger: "Tap Done button" }
    di:
      - MeetingRepository
      - ShareManager
      - NavigationManager

business_logic:
  kind: crud
  description: "Read-only post-meeting summary. On entry, render MeetingRecordDetail from in-memory meeting-conduct wizard state, else fetch dt_meeting_record over REST gated by cmp-network-monitor with a Store5 stale-while-revalidate cache (SQLDelight) keyed by group/meeting. Shows persisted totals and opening/closing corpus reconciled at close by the COMP-CAL save-collection-sheet companion; no money movement."
  library_refs: [cmp-network-monitor]
  external_library_refs: [Store5, SQLDelight]
  description_hash: "b5ac36d6e32eb39bb78e94b40560f38bb2076c1b89985b55da7680284db10907"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T10:18:25Z"

components:
  - id: top_app_bar
    type: top-app-bar
    accessibility_label: "{strings.top_app_bar_a11y}"
    style:
      title: "{strings.screen_title_format}"
      subtitle: "{{meetingSummary.actualDate}}"
      background: surface
    navigation_icon: arrow_back
    on_click:
      action: NavigateDone
      target: meeting-calendar
      accessibility_label: "{strings.back_a11y}"
      action_contract:
        effect: navigate
        description: "Pops the summary via NavController back to meeting-calendar; read-only screen so no persistence or corpus reconciliation runs on back navigation."
        action_contract_hash: "209de8ef5802f7108f432aed818cc9f256c96eed728d04ef457bdc39da307103"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T10:18:25Z"
    actions:
      - id: share_btn
        icon: share
        accessibility_label: "{strings.share_btn_description}"
        content_description: "{strings.share_btn_description}"
        loading_when: isSharing
        on_click:
          action: ShareMeetingReport
          accessibility_label: "{strings.share_btn_description}"
          action_contract:
            effect: share_external
            external_library_refs: [kmpToolkit, FileKit]
            description: "Generates a text/PDF meeting report from the loaded MeetingRecordDetail (totals, savings breakdown, opening/closing corpus) and opens the OS share-sheet via kmpToolkit ShareSheet; toggles isSharing while composing. No cash-in/cash-out and no copy retained after dismissal."
            action_contract_hash: "42c6e0b71459f4ffc5f8140a0fc617e37e34f83a56560b40ec3b02fec9bae532"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T10:18:25Z"

  - id: hero_card
    type: card
    style:
      background: primary
      corner_radius: xl
      padding: 24dp
      margin: 16dp
      elevation: 4dp
    content:
      - { type: text, text: "{strings.total_collected_label}", text_style: labelLarge, color: onPrimary }
      - { type: text, text: "{strings.kes_amount_format}", text_style: displaySmall, color: onPrimary, font: bold }
      - { type: text, text: "{strings.meeting_date_format}", text_style: bodyMedium, color: onPrimary }
      - id: corpus_hero_chip
        type: chip
        text: "{strings.corpus_chip_format}"
        background: primaryContainer
        text_color: onPrimaryContainer
        margin_top: 12dp

  - id: metric_grid
    type: grid
    style: { columns: 2, gap: 12dp, margin_horizontal: 16dp }
    children:
      - { id: attendance_metric, type: metric_card, label: "{strings.attendance_label}", value: "{strings.attendance_value_format}", icon: people_checkmark, background: primaryContainer }
      - { id: group_savings_metric, type: metric_card, label: "{strings.group_savings_label}", value: "{strings.group_savings_value_format}", icon: people_money, background: primaryContainer }
      - { id: individual_savings_metric, type: metric_card, label: "{strings.individual_savings_label}", value: "{strings.individual_savings_value_format}", icon: person_money, background: secondaryContainer }
      - { id: repayments_metric, type: metric_card, label: "{strings.repayments_label}", value: "{strings.repayments_value_format}", icon: arrow_circle_down, background: tertiaryContainer }
      - { id: fines_metric, type: metric_card, label: "{strings.fines_label}", value: "{strings.fines_value_format}", icon: warning, background: warningContainer }
      - { id: loans_disbursed_metric, type: metric_card, label: "{strings.loans_disbursed_label}", value: "{strings.loans_disbursed_value_format}", icon: arrow_circle_up, background: errorContainer }

  - id: savings_breakdown_section
    type: section
    style: { margin_horizontal: 16dp }
    children:
      - id: savings_breakdown_header
        type: text
        style: { text_style: titleSmall, color: onSurfaceVariant, margin_bottom: 8dp }
        value: "{strings.savings_breakdown_header}"
      - id: savings_breakdown_row
        type: list-item
        repeats_for: meetingSummary.savingsBreakdown
        style: { min_height: 56dp, divider: true }
        leading: { type: avatar, initials: "{{item.memberName | initials}}", size: 36dp, background: secondaryContainer, i18n: skip }
        content:
          - { type: text, text: "{{item.memberName}}", text_style: bodyLarge, i18n: skip }
          - { type: text, text: "{strings.member_savings_row_format}", text_style: bodySmall, color: onSurfaceVariant }
        trailing: { type: text, text: "{strings.member_savings_total_format}", text_style: labelLarge, color: primary }

  - id: corpus_reconciliation_section
    type: card
    style: { background: tertiaryContainer, corner_radius: md, padding: 16dp, margin_horizontal: 16dp }
    content:
      - { type: text, text: "{strings.corpus_reconciliation_header}", text_style: titleSmall, color: onTertiaryContainer }
      - { type: info_row, label: "{strings.opening_corpus_label}", value: "{strings.opening_corpus_value_format}" }
      - { type: info_row, label: "{strings.closing_corpus_label}", value: "{strings.closing_corpus_value_format}", value_style: titleMedium }
      - { type: info_row, label: "{strings.net_change_label}", value: "{strings.net_change_value_format}", value_color: primary }

  - id: done_button
    type: button
    label: "{strings.done_btn}"
    accessibility_label: "{strings.done_btn_a11y}"
    style:
      background: primary
      text_color: onPrimary
      min_height: 56dp
      full_width: true
      margin_horizontal: 16dp
      margin_bottom: 24dp
    on_click:
      action: NavigateDone
      target: meeting-calendar
      accessibility_label: "{strings.done_btn_a11y}"
      action_contract:
        effect: navigate
        description: "Confirms review complete and navigates via NavController to meeting-calendar; read-only screen so no save or corpus reconciliation runs on the Done tap."
        action_contract_hash: "4ac17c128911189b6a4e784f814bc250c496f2e42c12076d6af1a924c3075aa1"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T10:18:25Z"

  - id: loading_skeleton
    type: skeleton
    style: { count: 5, item_height: 80dp, corner_radius: lg, margin: 16dp }

states:
  initial_state: loading
  loading:
    description: Fetching meeting record from API or reading from in-memory wizard state
    components: [top_app_bar, loading_skeleton]
  content:
    description: Full summary rendered with all metrics
    components: [top_app_bar, hero_card, metric_grid, savings_breakdown_section, corpus_reconciliation_section, done_button]
    demo_data:
      meetingNumber: 2
      meetingSummary:
        actualDate: "30 Apr 2026"
        totalSavingsCollected: 1850
        closingCorpus: 48250
        openingCorpus: 47500
        attendanceCount: 5
        totalMemberCount: 5
        groupSavingsCollected: 1250
        individualSavingsCollected: 600
        loansRepaid: 375
        finesCollected: 0
        loansDisbursed: 0
  error:
    description: API failed and no cached data available
    components: [top_app_bar, error_banner]

i18n:
  en:
    screen_title: "Meeting Summary"
    screen_title_format: "Meeting #{{meetingNumber}} Summary"
    total_collected_label: "Total Collected"
    attendance_label: "Attendance"
    attendance_value_format: "{{meetingSummary.attendanceCount}}/{{meetingSummary.totalMemberCount}}"
    group_savings_label: "Group Savings"
    group_savings_value_format: "KES {{meetingSummary.groupSavingsCollected}}"
    individual_savings_label: "Individual Savings"
    individual_savings_value_format: "KES {{meetingSummary.individualSavingsCollected}}"
    repayments_label: "Loan Repayments"
    repayments_value_format: "KES {{meetingSummary.loansRepaid}}"
    fines_label: "Fines Collected"
    fines_value_format: "KES {{meetingSummary.finesCollected}}"
    loans_disbursed_label: "Loans Disbursed"
    loans_disbursed_value_format: "KES {{meetingSummary.loansDisbursed}}"
    savings_breakdown_header: "Savings Breakdown"
    corpus_reconciliation_header: "Corpus Reconciliation"
    opening_corpus_label: "Opening"
    opening_corpus_value_format: "KES {{meetingSummary.openingCorpus}}"
    closing_corpus_label: "Closing"
    closing_corpus_value_format: "KES {{meetingSummary.closingCorpus}}"
    net_change_label: "Net Change"
    net_change_value_format: "KES {{meetingSummary.closingCorpus - meetingSummary.openingCorpus}}"
    done_btn: "Done"
    done_btn_a11y: "Done, return to meeting calendar"
    share_btn_description: "Share meeting report"
    load_error: "Could not load meeting summary"
    top_app_bar_a11y: "Meeting summary top app bar"
    back_a11y: "Back to meeting calendar"
    kes_amount_format: "KES {{meetingSummary.totalSavingsCollected}}"
    meeting_date_format: "Meeting #{{meetingNumber}} · {{meetingSummary.actualDate}}"
    corpus_chip_format: "Corpus: KES {{meetingSummary.closingCorpus}}"
    member_savings_row_format: "Group: KES {{item.groupSavings}} · Individual: KES {{item.individualSavings}}"
    member_savings_total_format: "KES {{item.groupSavings + item.individualSavings}}"
