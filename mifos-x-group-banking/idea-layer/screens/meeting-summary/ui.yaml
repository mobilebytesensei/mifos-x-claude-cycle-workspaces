requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: meeting-summary

route: /meetings/{meetingId}/summary
entry_points:
  - source: meeting-conduct
    condition: wizard_submitted_successfully
  - source: meeting-calendar
    condition: user_taps_completed_meeting_summary_deep_link
nav_params:
  meeting_id: String
  meeting_number: Int
  center_id: Int

screens:
  - id: meeting_summary_screen
    name: MeetingSummaryScreen
    composable: MeetingSummaryScreen
    description: >
      Full-screen read-only summary. Top AppBar with share icon. Scrollable body
      with hero KES-collected card, metric grid, savings breakdown, loans section,
      attendance strip, and Done CTA at bottom.
    layout: Column (TopAppBar + LazyColumn[HeroCard + MetricGrid + SavingsBreakdown + LoanSection + AttendanceStrip + DoneBtn])

state_model:
  MeetingSummaryViewModel:
    state:
      name: MeetingSummaryState
      fields:
        meetingSummary: { type: "MeetingSummaryData?", default: "null" }
        isLoading: { type: Boolean, default: "true" }
        error: { type: "String?", default: "null" }
        isSharing: { type: Boolean, default: "false" }
        meetingId: { type: String, default: '""' }
        meetingNumber: { type: Int, default: "0" }
        centerId: { type: Int, default: "0" }
    screen_state:
      name: MeetingSummaryScreenState
      members: [Loading, Content, Error]
    errors:
      LoadFailed: "Could not load meeting summary. Showing cached data."
    events:
      name: MeetingSummaryEvent
      members:
        - { name: NavigateToCalendar }
        - { name: ShareSummary }
    actions:
      name: MeetingSummaryAction
      members:
        - { name: LoadSummary, trigger: "Screen enters composition" }
        - { name: ShareMeetingReport, trigger: "Tap share icon" }
        - { name: NavigateDone, trigger: "Tap Done button" }
    di:
      - MeetingRepository
      - ShareManager
      - NavigationManager

components:
  - id: top_app_bar
    type: top-app-bar
    style:
      title: "Meeting #{{meetingNumber}} Summary"
      subtitle: "{{meetingSummary.actualDate}}"
      background: surface
    navigation_icon: arrow_back
    on_click: { action: NavigateDone, target: meeting-calendar }
    actions:
      - id: share_btn
        icon: share
        content_description: "Share meeting report"
        loading_when: isSharing
        on_click: { action: ShareMeetingReport }

  - id: hero_card
    type: card
    style:
      background: primary
      corner_radius: xl
      padding: 24dp
      margin: 16dp
      elevation: 4dp
    content:
      - { type: text, text: "Total Collected", text_style: labelLarge, color: onPrimary }
      - { type: text, text: "KES {{meetingSummary.totalSavingsCollected}}", text_style: displaySmall, color: onPrimary, font: bold }
      - { type: text, text: "Meeting #{{meetingNumber}} · {{meetingSummary.actualDate}}", text_style: bodyMedium, color: onPrimary }
      - id: corpus_hero_chip
        type: chip
        text: "Corpus: KES {{meetingSummary.closingCorpus}}"
        background: primaryContainer
        text_color: onPrimaryContainer
        margin_top: 12dp

  - id: metric_grid
    type: grid
    style: { columns: 2, gap: 12dp, margin_horizontal: 16dp }
    children:
      - { id: attendance_metric, type: metric_card, label: "Attendance", value: "{{meetingSummary.attendanceCount}}/{{meetingSummary.totalMemberCount}}", icon: people_checkmark, background: primaryContainer }
      - { id: group_savings_metric, type: metric_card, label: "Group Savings", value: "KES {{meetingSummary.groupSavingsCollected}}", icon: people_money, background: primaryContainer }
      - { id: individual_savings_metric, type: metric_card, label: "Individual Savings", value: "KES {{meetingSummary.individualSavingsCollected}}", icon: person_money, background: secondaryContainer }
      - { id: repayments_metric, type: metric_card, label: "Loan Repayments", value: "KES {{meetingSummary.loansRepaid}}", icon: arrow_circle_down, background: tertiaryContainer }
      - { id: fines_metric, type: metric_card, label: "Fines Collected", value: "KES {{meetingSummary.finesCollected}}", icon: warning, background: warningContainer }
      - { id: loans_disbursed_metric, type: metric_card, label: "Loans Disbursed", value: "KES {{meetingSummary.loansDisbursed}}", icon: arrow_circle_up, background: errorContainer }

  - id: savings_breakdown_section
    type: section
    style: { margin_horizontal: 16dp }
    children:
      - id: savings_breakdown_header
        type: text
        style: { text_style: titleSmall, color: onSurfaceVariant, margin_bottom: 8dp }
        value: "Savings Breakdown"
      - id: savings_breakdown_row
        type: list-item
        repeats_for: meetingSummary.savingsBreakdown
        style: { min_height: 56dp, divider: true }
        leading: { type: avatar, initials: "{{item.memberName | initials}}", size: 36dp, background: secondaryContainer }
        content:
          - { type: text, text: "{{item.memberName}}", text_style: bodyLarge }
          - { type: text, text: "Group: KES {{item.groupSavings}} · Individual: KES {{item.individualSavings}}", text_style: bodySmall, color: onSurfaceVariant }
        trailing: { type: text, text: "KES {{item.groupSavings + item.individualSavings}}", text_style: labelLarge, color: primary }

  - id: corpus_reconciliation_section
    type: card
    style: { background: tertiaryContainer, corner_radius: md, padding: 16dp, margin_horizontal: 16dp }
    content:
      - { type: text, text: "Corpus Reconciliation", text_style: titleSmall, color: onTertiaryContainer }
      - { type: info_row, label: "Opening", value: "KES {{meetingSummary.openingCorpus}}" }
      - { type: info_row, label: "Closing", value: "KES {{meetingSummary.closingCorpus}}", value_style: titleMedium }
      - { type: info_row, label: "Net Change", value: "KES {{meetingSummary.closingCorpus - meetingSummary.openingCorpus}}", value_color: primary }

  - id: done_button
    type: button
    label: "Done"
    style:
      background: primary
      text_color: onPrimary
      min_height: 56dp
      full_width: true
      margin_horizontal: 16dp
      margin_bottom: 24dp
    on_click: { action: NavigateDone, target: meeting-calendar }

  - id: loading_skeleton
    type: skeleton
    style: { count: 5, item_height: 80dp, corner_radius: lg, margin: 16dp }

states:
  initial_state: loading
  loading:
    description: Fetching meeting record from API or reading from in-memory wizard state
    components: [top_app_bar, loading_skeleton]
  content:
    description: Full summary rendered with all metrics
    components: [top_app_bar, hero_card, metric_grid, savings_breakdown_section, corpus_reconciliation_section, done_button]
    demo_data:
      meetingNumber: 2
      meetingSummary:
        actualDate: "30 Apr 2026"
        totalSavingsCollected: 1850
        closingCorpus: 48250
        openingCorpus: 47500
        attendanceCount: 5
        totalMemberCount: 5
        groupSavingsCollected: 1250
        individualSavingsCollected: 600
        loansRepaid: 375
        finesCollected: 0
        loansDisbursed: 0
  error:
    description: API failed and no cached data available
    components: [top_app_bar, error_banner]

i18n:
  en:
    screen_title: "Meeting Summary"
    total_collected_label: "Total Collected"
    attendance_label: "Attendance"
    group_savings_label: "Group Savings"
    individual_savings_label: "Individual Savings"
    repayments_label: "Loan Repayments"
    fines_label: "Fines Collected"
    loans_disbursed_label: "Loans Disbursed"
    savings_breakdown_header: "Savings Breakdown"
    corpus_reconciliation_header: "Corpus Reconciliation"
    opening_corpus_label: "Opening"
    closing_corpus_label: "Closing"
    net_change_label: "Net Change"
    done_btn: "Done"
    share_btn_description: "Share meeting report"
    load_error: "Could not load meeting summary"
