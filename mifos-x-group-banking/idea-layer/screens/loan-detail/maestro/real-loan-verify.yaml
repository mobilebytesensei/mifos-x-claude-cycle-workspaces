# ─────────────────────────────────────────────────────────────────────────────
# E2E — REAL loan read path against LIVE mifos-bank-2: group → Loans →
#        loan-list → loan-detail (Grace's real Fineract loan 13)
# ─────────────────────────────────────────────────────────────────────────────
# login → organizer-dashboard → group-list → group-dashboard → View Loans →
#   loan-list (GET /groups/1/loans → Grace's loan) → tap → loan-detail
#   (GET /loans/13 → outstanding 6289, 24-row schedule). Real mifos-bank-2 data.
#   (The repayment WRITE is separately curl-proven: repaying 100 reduced Grace's
#   outstanding 6289→6189 on live Fineract, then reversed to pristine.)
# Prereq: Go companion :8090 + adb reverse tcp:8080 tcp:8090.
appId: org.mifos.groupbanking
name: e2e — real loan read (group → loans → loan-detail, live mifos-bank-2)
tags:
  - e2e
  - group-banking
  - loan-detail
  - real-network
---
- launchApp:
    clearState: true
- assertVisible: { id: "login_signup_screen" }
- tapOn: { id: "login_signup_field_email_phone" }
- inputText: "mifos"
- tapOn: { id: "login_signup_field_password" }
- inputText: "password"
- hideKeyboard
- tapOn: { id: "login_signup_login_button" }
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 20000
- tapOn: "All Groups"
- extendedWaitUntil:
    visible: { id: "group_list_screen" }
    timeout: 15000
- tapOn: "Mwangaza Women's Group"
- extendedWaitUntil:
    visible: { id: "group_dashboard_screen" }
    timeout: 20000

# --- group-dashboard → View Loans → loan-list (Grace's real loan) ---
- tapOn: { id: "group_dashboard_view_loans_button" }
- extendedWaitUntil:
    visible: { id: "loan_list_screen" }
    timeout: 20000
- assertVisible: "Grace Wanjiru"
- tapOn: "Grace Wanjiru"

# --- loan-detail: real Fineract loan 13 (outstanding + schedule) ---
- extendedWaitUntil:
    visible: { id: "loan_detail_screen" }
    timeout: 20000
