sibling: data-flow
schema_version: "2.1.0"
feature_id: loan-detail

entries:
  - screen_id: loanDetailScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_loan_detail, transport: rest, method: get }
    tables: []
    dtos:
      - { name: LoanDetail, role: response, api_id: get_loan_detail }
      - { name: RepaymentScheduleRow, role: response, api_id: get_loan_detail }
      - { name: RepaymentTransaction, role: response, api_id: get_loan_detail }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 120
      key_template: "loan_detail:{loanId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: show_error, message_key: error_loan_not_found }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      Single call with associations=repaymentSchedule,transactions. Response is split into
      LoanDetail (header + summary), RepaymentScheduleRow array (SCHEDULE tab),
      and RepaymentTransaction array (HISTORY tab). Short TTL (120s) as loan balances
      change frequently after repayments.

  - screen_id: loanDetailScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_loan_detail, transport: rest, method: get }
    tables: []
    dtos:
      - { name: LoanDetail, role: response, api_id: get_loan_detail }
      - { name: RepaymentScheduleRow, role: response, api_id: get_loan_detail }
      - { name: RepaymentTransaction, role: response, api_id: get_loan_detail }
    produces_state: Content
    auth_required: true
    cache:
      strategy: network_first
      ttl_seconds: 120
      key_template: "loan_detail:{loanId}"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
    notes: >
      Pull-to-refresh (or post-repayment back-navigation) triggers a fresh fetch to
      reflect updated outstanding balance and schedule.
