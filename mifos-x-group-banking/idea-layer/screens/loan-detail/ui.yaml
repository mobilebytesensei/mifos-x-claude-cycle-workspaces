requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: loan-detail

route: /loans/{loanId}
entry_points:
  - source: loan-list
    label: Loan card tap
nav_params:
  loanId: { type: Long, required: true }

screens:
  - id: loan-detail-screen
    title: "{strings.screen_title}"
    type: detail
    description: Tabbed detail screen with schedule and repayment history

state_model:
  LoanDetailViewModel:
    state:
      name: LoanDetailState
      fields:
        isLoading: { type: Boolean, default: "true" }
        loan: { type: "LoanDetail?", default: "null" }
        repaymentSchedule: { type: "List<RepaymentScheduleRow>", default: "emptyList()" }
        repaymentHistory: { type: "List<RepaymentTransaction>", default: "emptyList()" }
        selectedTab: { type: LoanDetailTab, default: "LoanDetailTab.SCHEDULE" }
        error: { type: "LoanDetailError?", default: "null" }
        isRecordingRepayment: { type: Boolean, default: "false" }
        canRecordRepayment: { type: Boolean, default: "false" }
        canMarkDefaulted: { type: Boolean, default: "false" }
    screen_state:
      name: LoanDetailScreenState
      members: [Loading, Content, Error]
    errors:
      name: LoanDetailError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: NotFound, retry: false, message_key: error_not_found }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: LoanDetailEvent
      members:
        - { name: NavigateBack }
        - { name: ShowRepaymentDialog }
        - { name: ShowDefaultConfirmDialog }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: LoanDetailAction
      members:
        - { name: OnTabChange, params: { tab: LoanDetailTab }, trigger: "Tap tab" }
        - { name: OnRecordRepayment, trigger: "Tap Record Repayment button" }
        - { name: OnMarkDefaulted, trigger: "Tap Mark Defaulted button" }
        - { name: OnBack, trigger: "Tap back / nav icon" }
        - { name: Retry, trigger: "Tap retry button on error state" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
    di:
      - LoanRepository
      - NetworkMonitor
      - SessionManager

business_logic:
  kind: crud
  description: "Loads a single loan via LoanRepository.getLoanDetail from local SQLDelight cache (stale-while-revalidate) then refreshes from the Fineract m_loan endpoint through the companion API; cmp-network-monitor gates offline fallback. Splits the response into header summary, weekly RepaymentScheduleRow rows, and RepaymentTransaction history, re-cached via Store5."
  description_hash: "156680a8d462a85204eef05a03afdb302684c3240aadb7b3998069ff2c8874dd"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"
  library_refs: ["cmp-network-monitor"]
  external_library_refs: ["SQLDelight", "Store5"]

components:
  - id: top_bar
    type: top-bar
    title: "{strings.screen_title}"
    style:
      background: primary
      text_color: onPrimary
    navigation_icon: arrow_back
    on_nav_click:
      action: OnBack
      action_contract:
        effect: navigate
        description: "Pops the current loan-detail destination off the NavController back stack and returns to the loan list; pure navigation with no side effect on the loan record."
        action_contract_hash: "e4dad9be16e95018b236607757f22a2ad54754039026db0f64c1685798623eaf"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"
    actions:
      - icon: refresh
        content_description: "Refresh loan data"  # i18n: skip
        on_click:
          action: OnRefresh
          state: reload
          action_contract:
            effect: call_api
            library_refs: ["cmp-network-monitor"]
            external_library_refs: ["Store5"]
            description: "Re-fetches the loan via LoanRepository.getLoanDetail with a network-first strategy through the companion API, using cmp-network-monitor to surface offline state; the refreshed LoanDetail, schedule, and history are re-cached via Store5 and re-emitted to LoanDetailState."
            action_contract_hash: "b108623af16b11bf179ac806929dc4d97d2f6be177aae163d9640cede8483ae6"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: member_header_card
    type: card
    style:
      background: primaryContainer
      corner_radius: 12dp
      padding: 16dp
      elevation: 0dp
    content:
      - id: member_name_header
        type: text
        style: { text_style: headlineSmall, color: onPrimaryContainer }
        value: "{{loan.memberName}}"  # i18n: skip
      - id: loan_product_text
        type: text
        style: { text_style: bodyMedium, color: onPrimaryContainer }
        value: "{{loan.loanProductName}}"  # i18n: skip
      - id: principal_text
        type: text
        style: { text_style: bodyLarge, color: onPrimaryContainer }
        value: "Principal: KES {{loan.principalAmount | number}}"  # i18n: skip
      - id: disbursed_text
        type: text
        style: { text_style: bodySmall, color: onPrimaryContainer }
        value: "Disbursed: {{loan.disbursedDate}}"  # i18n: skip
      - id: interest_rate_text
        type: text
        style: { text_style: bodySmall, color: onPrimaryContainer }
        value: "Interest: {{loan.interestRatePercent}}% per week"  # i18n: skip
      - id: loan_status_badge
        type: badge
        style:
          ACTIVE: { background: "#C8E6C9", text_color: "#1B5E20" }
          OVERDUE: { background: "#FFCDD2", text_color: "#B71C1C" }
          CLOSED: { background: "#F5F5F5", text_color: "#757575" }
        value: "{{loan.status}}"  # i18n: skip

  - id: outstanding_summary_row
    type: row
    style:
      padding: "8dp 16dp"
      background: surface
    content:
      - id: outstanding_amount_chip
        type: info-chip
        label: "Outstanding"  # i18n: skip
        value: "KES {{loan.totalOutstanding | number}}"  # i18n: skip
        style: { background: secondaryContainer, text_color: onSecondaryContainer }
      - id: overdue_amount_chip
        type: info-chip
        label: "Overdue"  # i18n: skip
        value: "KES {{loan.totalOverdue | number}}"  # i18n: skip
        style:
          background_when_zero: surfaceVariant
          background_when_positive: errorContainer
          text_color_when_positive: onErrorContainer
        visible_when: "loan.totalOverdue > 0"

  - id: detail_tabs
    type: tab-bar
    style:
      indicator_color: primary
      background: surface
    tabs:
      - id: tab_schedule
        label: "Schedule"  # i18n: skip
        on_click:
          action: OnTabChange
          params: { tab: SCHEDULE }
          state: selectedTab
          action_contract:
            effect: transform_state
            description: "Switches the visible tab between Schedule and Repayment History as a pure in-ViewModel state transition (selectedTab); no network or persistence — the schedule and history data are already loaded via LoanRepository into LoanDetailState."
            action_contract_hash: "a83eaa0e6f7a1a5a2a0ab02a2f5d39cba4ec7d1f2be203a91a19134ab9299538"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: tab_history
        label: "Repayment History"  # i18n: skip
        on_click:
          action: OnTabChange
          params: { tab: HISTORY }
          state: selectedTab
          action_contract:
            effect: transform_state
            description: "Switches the visible tab between Schedule and Repayment History as a pure in-ViewModel state transition (selectedTab); no network or persistence — the schedule and history data are already loaded via LoanRepository into LoanDetailState."
            action_contract_hash: "a83eaa0e6f7a1a5a2a0ab02a2f5d39cba4ec7d1f2be203a91a19134ab9299538"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
    selected_tab: "{{selectedTab}}"

  - id: schedule_table
    type: data-table
    visible_when: "selectedTab == SCHEDULE"
    headers:
      - { label: "Wk", width: 40dp }  # i18n: skip
      - { label: "Due Date", width: 96dp }  # i18n: skip
      - { label: "Due (KES)", width: 88dp }  # i18n: skip
      - { label: "Paid (KES)", width: 88dp }  # i18n: skip
      - { label: "Balance", width: 88dp }  # i18n: skip
      - { label: "Status", width: 72dp }  # i18n: skip
    rows_source: repaymentSchedule
    row_style:
      PAID: { background: "#F1F8E9", text_color: "#33691E" }
      PARTIAL: { background: "#FFF9C4", text_color: "#E65100" }
      OVERDUE: { background: "#FFCDD2", text_color: "#B71C1C" }
      UPCOMING: { background: surface, text_color: onSurface }

  - id: history_list
    type: list
    visible_when: "selectedTab == HISTORY"
    item_type: transaction_row
    items_source: repaymentHistory
    empty_text: "No repayments recorded yet."  # i18n: skip

  - id: transaction_row
    type: list-item
    content:
      - id: txn_type_text
        type: text
        style: { text_style: bodyMedium, color: onSurface }
        value: "{{txn.type}}"  # i18n: skip
      - id: txn_date_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "{{txn.date}}"  # i18n: skip
      - id: txn_amount_text
        type: text
        style: { text_style: bodyMedium, color: primary }
        value: "KES {{txn.amount | number}}"  # i18n: skip

  - id: action_buttons_row
    type: row
    style:
      padding: "16dp"
      gap: 12dp
    content:
      - id: record_repayment_button
        type: button
        label: "Record Repayment"  # i18n: skip
        style:
          background: primary
          text_color: onPrimary
          corner_radius: 24dp
          min_touch_target: 48dp
          weight: 1
        visible_when: "canRecordRepayment && loan.status == ACTIVE"
        on_click:
          action: OnRecordRepayment
          dialog: loan-repayment-dialog
          action_contract:
            effect: call_api
            library_refs: ["cmp-network-monitor"]
            external_library_refs: ["Store5"]
            description: "Opens the repayment dialog then calls LoanRepository.recordRepayment which posts a repayment against the Fineract m_loan account via the companion API over Store5; the money move carries an idempotent externalId and the fresh balance is re-cached and re-emitted to the schedule."
            action_contract_hash: "7a8b1752a775690be27405522f9460c3e751dfe3ea2ff3de2b768b8df0f8d5a6"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      - id: mark_defaulted_button
        type: button
        label: "Mark Defaulted"  # i18n: skip
        style:
          background: error
          text_color: onError
          corner_radius: 24dp
          min_touch_target: 48dp
          weight: 1
        visible_when: "canMarkDefaulted && loan.status == OVERDUE"
        on_click:
          action: OnMarkDefaulted
          dialog: loan-mark-defaulted-dialog
          action_contract:
            effect: call_api
            library_refs: ["cmp-network-monitor"]
            external_library_refs: ["Store5"]
            description: "Confirms then calls LoanRepository.markDefaulted which updates the Fineract m_loan status to defaulted through the companion API over Store5; an idempotent externalId guards the state change and the loan row is re-cached so the badge and action gating refresh."
            action_contract_hash: "3d64e3b673a7fcc2b3760bd2433c66fe6f92ef4545eca7c201490ac845a6ece6"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: shimmer_detail
    type: shimmer
    count: 3
    style: { height: 120dp, corner_radius: 12dp, background: surfaceVariant }

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "{strings.error_load_loan_title}"
    body: "{{error.message}}"  # i18n: skip
    cta_label: "Retry"  # i18n: skip
    on_click:
      action: Retry
      state: reload
      action_contract:
        effect: call_api
        library_refs: ["cmp-network-monitor"]
        external_library_refs: ["Store5"]
        description: "Re-invokes LoanRepository.getLoanDetail after a load error, forcing a fresh fetch from the Fineract m_loan endpoint via the companion API; cmp-network-monitor distinguishes offline from server failure so the ViewModel can restore Content or re-surface the error state."
        action_contract_hash: "e91d506376aaf20690bab55d110a2779d869f8d8756b11e07dded4dcc98dfb20"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_detail]
    description: "Fetching loan detail from local cache then Fineract API"
  content:
    components:
      - top_bar
      - member_header_card
      - outstanding_summary_row
      - detail_tabs
      - schedule_table
      - history_list
      - action_buttons_row
    description: "Full detail with tabbed schedule and history; action buttons role-gated"
    demo_data:
      loan:
        memberName: "Peter Otieno"
        loanProductName: "Standard Group Loan"
        principalAmount: 1500
        disbursedDate: "2026-04-14"
        interestRatePercent: 5
        totalOutstanding: 1125
        totalOverdue: 0
        status: ACTIVE
      repaymentSchedule:
        - weekNumber: 1
          dueDate: "2026-04-21"
          dueAmount: 125
          paidAmount: 125
          balance: 0
          status: PAID
        - weekNumber: 2
          dueDate: "2026-04-28"
          dueAmount: 125
          paidAmount: 125
          balance: 0
          status: PAID
        - weekNumber: 3
          dueDate: "2026-05-05"
          dueAmount: 125
          paidAmount: 125
          balance: 0
          status: PAID
        - weekNumber: 4
          dueDate: "2026-05-12"
          dueAmount: 125
          paidAmount: 0
          balance: 125
          status: UPCOMING
  error:
    components: [top_bar, error_state]
    description: "API failed; error message with retry"

i18n:
  en:
    screen_title: "Loan Detail"
    tab_schedule: "Schedule"
    tab_history: "Repayment History"
    principal_label: "Principal: KES {{amount}}"
    disbursed_label: "Disbursed: {{date}}"
    interest_label: "Interest: {{rate}}% per week"
    outstanding_label: "Outstanding"
    overdue_label: "Overdue"
    record_repayment: "Record Repayment"
    mark_defaulted: "Mark Defaulted"
    error_not_found: "Loan not found."
    error_network: "No internet. Showing cached data."
    error_server: "Server error. Please try again."
    error_auth: "Session expired. Please log in again."
    status_paid: "Paid"
    status_partial: "Partial"
    status_upcoming: "Upcoming"
    status_overdue: "Overdue"
  sw:
    screen_title: "Maelezo ya Mkopo"
    tab_schedule: "Ratiba"
    tab_history: "Historia ya Malipo"
    record_repayment: "Rekodi Malipo"
    mark_defaulted: "Weka Kama Mkopo Mbaya"
  fr:
    screen_title: "Détail du Prêt"
    tab_schedule: "Calendrier"
    tab_history: "Historique de Remboursement"
    record_repayment: "Enregistrer un Remboursement"
    mark_defaulted: "Marquer comme Défaut"
  hi:
    screen_title: "ऋण विवरण"
    tab_schedule: "कार्यक्रम"
    tab_history: "पुनर्भुगतान इतिहास"
    record_repayment: "पुनर्भुगतान दर्ज करें"
    mark_defaulted: "डिफ़ॉल्ट के रूप में चिह्नित करें"
