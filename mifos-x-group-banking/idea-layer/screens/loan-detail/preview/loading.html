<!DOCTYPE html>
<html lang="en" data-feature="loan-detail" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-detail · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .skeleton { background: var(--bg-muted); border-radius: var(--radius-md); position: relative; overflow: hidden; }
  .skeleton::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { .skeleton::after { animation: none; } }
  .skeleton-block { height: 120px; margin-bottom: var(--space-base); }
  .skeleton-line { height: 14px; margin-bottom: var(--space-sm); }
  .skeleton-line.short { width: 45%; }
  .skeleton-line.mid { width: 70%; }
</style></head>
<body>
<div class="app-shell" data-shell="detail">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar"><button class="back-btn" data-nav-to="loan-list">‹</button><h1>Loan Detail</h1><button class="icon-btn" data-action="OnRefresh" data-state-to="reload" aria-label="Refresh loan data">↻</button></header>
<main aria-busy="true" aria-label="Loading loan detail">
  <div class="card skeleton skeleton-block" aria-hidden="true">
    <div class="skeleton-line" style="width:60%;background:rgba(0,0,0,.06);border-radius:6px;"></div>
    <div class="skeleton-line mid" style="background:rgba(0,0,0,.06);border-radius:6px;"></div>
    <div class="skeleton-line short" style="background:rgba(0,0,0,.06);border-radius:6px;"></div>
  </div>
  <div class="card skeleton skeleton-block" aria-hidden="true">
    <div class="skeleton-line mid" style="background:rgba(0,0,0,.06);border-radius:6px;"></div>
    <div class="skeleton-line short" style="background:rgba(0,0,0,.06);border-radius:6px;"></div>
  </div>
  <div class="card skeleton skeleton-block" aria-hidden="true">
    <div class="skeleton-line" style="width:80%;background:rgba(0,0,0,.06);border-radius:6px;"></div>
    <div class="skeleton-line mid" style="background:rgba(0,0,0,.06);border-radius:6px;"></div>
  </div>
  <div class="spinner" role="status" aria-label="Fetching loan detail"></div>
  <p class="footnote" style="text-align:center;">Fetching loan detail…</p>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
