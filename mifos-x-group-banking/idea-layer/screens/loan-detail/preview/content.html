<!DOCTYPE html>
<html lang="en" data-feature="loan-detail" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-detail · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="detail">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar"><button class="back-btn" data-nav-to="loan-list" aria-label="Back to loans">‹</button><h1>Loan Detail</h1><div class="top-app-bar-actions"><button class="icon-btn" data-action="OnRefresh" data-state-to="reload" aria-label="Refresh loan data">↻</button></div></header>
<main>
  <div class="card card-highlighted">
    <h3>Peter Otieno</h3>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">Standard Group Loan</p>
    <div class="kv-grid">
      <span class="k">Principal</span><span class="v">KES 1,500</span>
      <span class="k">Disbursed</span><span class="v text">14 Apr 2026</span>
      <span class="k">Interest</span><span class="v text">5% per week</span>
    </div>
    <div style="margin-top:12px;"><span class="chip-static success">ACTIVE</span></div>
  </div>

  <div class="card-group">
    <div class="summary-card">
      <div class="label">Outstanding</div>
      <div class="metric">KES 1,125</div>
    </div>
    <div class="summary-card">
      <div class="label">Overdue</div>
      <div class="metric" style="color:var(--text-secondary);">KES 0</div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab current" data-state-to="selectedTab">Schedule</button>
    <button class="tab" data-state-to="selectedTab">Repayment History</button>
  </div>

  <table class="amount-table" style="margin-top:16px;">
    <thead><tr><th>Wk</th><th>Due Date</th><th style="text-align:right">Due</th><th style="text-align:right">Paid</th><th style="text-align:right">Balance</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>21 Apr</td><td class="amount">125</td><td class="amount">125</td><td class="amount">0</td></tr>
      <tr><td>2</td><td>28 Apr</td><td class="amount">125</td><td class="amount">125</td><td class="amount">0</td></tr>
      <tr><td>3</td><td>5 May</td><td class="amount">125</td><td class="amount">125</td><td class="amount">0</td></tr>
      <tr><td>4</td><td>12 May</td><td class="amount">125</td><td class="amount">0</td><td class="amount">125</td></tr>
      <tr class="total"><td colspan="2">Total</td><td class="amount">500</td><td class="amount">375</td><td class="amount">125</td></tr>
    </tbody>
  </table>

  <div style="margin-top:16px;">
    <button class="btn btn-primary btn-full" data-nav-to="loan-repayment-dialog" data-action-id="OnRecordRepayment">Record Repayment</button>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
