sibling: api
schema_version: "4.0"
feature_id: loan-detail

api:
  - id: get_loan_detail
    function: get_loan
    method: get
    endpoint: "/loans/{loanId}"
    description: Fetch full loan detail with repayment schedule and transaction history
    params:
      loanId: { type: Long, required: true, source: nav_params }
      associations: { type: String, default: "repaymentSchedule,transactions" }
    response:
      type: object
      fields:
        id: Long
        clientId: Long
        clientName: String
        loanProductName: String
        principal: Double
        approvedPrincipal: Double
        disbursementDate: List<Int>
        interestRatePerPeriod: Double
        interestType: { id: Int, value: String }
        status: { id: Int, value: String }
        summary:
          principalDisbursed: Double
          principalPaid: Double
          principalOutstanding: Double
          interestCharged: Double
          interestPaid: Double
          interestOutstanding: Double
          totalExpectedRepayment: Double
          totalOutstanding: Double
          totalOverdue: Double
        repaymentSchedule:
          periods:
            type: array
            items:
              period: Int
              dueDate: List<Int>
              principalDue: Double
              interestDue: Double
              totalInstallmentAmountForPeriod: Double
              totalPaidForPeriod: Double
              totalOutstandingForPeriod: Double
              complete: Boolean
        transactions:
          type: array
          items:
            id: Long
            type: { id: Int, value: String }
            date: List<Int>
            amount: Double
    errors:
      401: Unauthorized
      404: Loan not found
      500: Server error
    cache:
      ttl: 120
      strategy: stale-while-revalidate
      offline: show_cached

dtos:
  LoanDetail:
    id: Long
    memberId: Long
    memberName: String
    loanProductName: String
    principalAmount: { type: Double, currency: KES }
    disbursedDate: String
    interestRatePercent: Double
    totalOutstanding: { type: Double, currency: KES }
    totalOverdue: { type: Double, currency: KES }
    status: LoanStatus
    fineractLoanId: Long

  RepaymentScheduleRow:
    weekNumber: Int
    dueDate: String
    dueAmount: { type: Double, currency: KES }
    paidAmount: { type: Double, currency: KES }
    balance: { type: Double, currency: KES }
    status: RepaymentRowStatus

  RepaymentRowStatus:
    values: [PAID, PARTIAL, UPCOMING, OVERDUE]

  RepaymentTransaction:
    id: Long
    type: String
    date: String
    amount: { type: Double, currency: KES }

  LoanDetailTab:
    values: [SCHEDULE, HISTORY]

cache_strategy:
  ttl: 120
  strategy: stale-while-revalidate
  offline: show_cached_data

dependencies:
  repositories:
    - name: LoanRepository
      methods:
        - "getLoanDetail(loanId: Long): Flow<LoanDetail>"
        - "recordRepayment(loanId: Long, amount: Double, date: String): Flow<Unit>"
        - "markDefaulted(loanId: Long): Flow<Unit>"
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: loans
    - table: loan_repayments
