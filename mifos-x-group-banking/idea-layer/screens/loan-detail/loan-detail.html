<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Detail — CommonPurse (VSLA Group Banking)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Noto Sans','system-ui','sans-serif']}}}};</script>
<style>
:root{--primary:#2E7D32;--on-primary:#FFFFFF;--secondary:#FF8F00;--error:#D32F2F;--primary-container:#A6F1A6;}
body{font-family:'Noto Sans',system-ui,sans-serif;background:#0F0F23;}
.phone{width:393px;min-height:852px;border-radius:2.5rem;overflow:hidden;position:relative;}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:8px;}
body.embedded{background:#FAFAFA;margin:0;padding:0;min-height:100vh;display:block;}
body.embedded #standalone-toolbar{display:none!important;}
body.embedded #phone-wrapper{display:none!important;}
body.embedded #embedded-content{display:flex!important;flex-direction:column;width:100%;height:100vh;overflow:hidden;}
.tab-bar{display:flex;border-bottom:1px solid #E0E0E0;background:white;}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;cursor:pointer;font-weight:500;transition:color 0.15s;}
.tab.active{color:#2E7D32;border-bottom:2.5px solid #2E7D32;font-weight:700;margin-bottom:-1px;}
.tab.inactive{color:#9E9E9E;}
.schedule-header{display:grid;grid-template-columns:28px 72px 64px 64px 52px 52px;gap:4px;padding:8px 12px;background:#E8F5E9;font-size:10px;font-weight:700;color:#1B5E20;}
.schedule-row{display:grid;grid-template-columns:28px 72px 64px 64px 52px 52px;gap:4px;padding:8px 12px;border-bottom:1px solid #F5F5F5;font-size:11px;}
.row-paid{background:#F1F8E9;color:#33691E;}
.row-partial{background:#FFF9C4;color:#E65100;}
.row-overdue{background:#FFCDD2;color:#B71C1C;}
.row-upcoming{background:white;color:#1A1C19;}
.txn-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #F5F5F5;}
.action-btn{flex:1;padding:14px 12px;border-radius:9999px;font-weight:700;font-size:14px;color:white;cursor:pointer;border:none;text-align:center;transition:opacity 0.15s;}
.btn-primary{background:#2E7D32;}
.btn-error{background:#D32F2F;}
</style>
</head>
<body class="min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0 gap-2">
  <span class="text-sm font-semibold text-slate-200 flex-1">🏦 Loan Detail — Peter Otieno · KES 15,000</span>
  <select id="statePicker" onchange="switchState(this.value)" class="px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="loading">⏳ Loading</option>
    <option value="content_schedule" selected>📅 Schedule Tab</option>
    <option value="content_history">📋 History Tab</option>
    <option value="overdue_schedule">🔴 Overdue (Schedule)</option>
    <option value="overdue_history">🔴 Overdue (History)</option>
    <option value="closed">✅ Closed Loan</option>
    <option value="error">❌ Error</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 border border-white/10 rounded-md">🌙</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-start justify-center p-6" style="padding-top:32px">
  <div class="phone bg-[#FAFAFA] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2 bg-[#2E7D32]">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1.5">
        <span class="material-symbols-outlined text-white" style="font-size:16px">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-white" style="font-size:16px">wifi</span>
        <span class="material-symbols-outlined text-white" style="font-size:16px">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto" style="height:760px;background:#FAFAFA"></div>
    <div class="flex justify-center py-2 bg-[#FAFAFA]"><div class="w-32 h-1 rounded-full bg-slate-900/20"></div></div>
  </div>
</div>

<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 bg-[#2E7D32] shrink-0" style="padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1.5">
      <span class="material-symbols-outlined text-white" style="font-size:16px">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-white" style="font-size:16px">wifi</span>
      <span class="material-symbols-outlined text-white" style="font-size:16px">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto flex-1" style="background:#FAFAFA"></div>
  <div class="flex justify-center py-2 bg-[#FAFAFA] shrink-0"><div class="w-32 h-1 rounded-full bg-slate-900/20"></div></div>
</div>
<div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center pointer-events-none"></div>

<script>
var isEmbedded=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
if(isEmbedded){document.body.style.background='#FAFAFA';document.body.classList.add('embedded');}
function getEl(){return isEmbedded?document.getElementById('embedded-screen-content'):document.getElementById('screen-content');}

// CommonPurse: Peter Otieno's active loan — KES 15,000 / 12 weeks / 10% / 3 repayments done
var ACTIVE_LOAN={
  name:'Peter Otieno',initials:'PO',avatarBg:'#FFDDB3',avatarColor:'#E65100',
  product:'Standard Group Loan',principal:15000,disbursed:'2026-04-14',
  interestRate:10,weeks:12,repaidWeeks:3,status:'ACTIVE',
  totalOutstanding:11250,totalOverdue:0,weeklyInstallment:1458,
};
var OVERDUE_LOAN={
  name:'Mary Akinyi',initials:'MA',avatarBg:'#E1F5FE',avatarColor:'#0D47A1',
  product:'Standard Group Loan',principal:8000,disbursed:'2026-03-10',
  interestRate:10,weeks:12,repaidWeeks:0,status:'OVERDUE',
  totalOutstanding:8000,totalOverdue:2500,weeklyInstallment:917,
};
var CLOSED_LOAN={
  name:'Amara Diallo',initials:'AD',avatarBg:'#E8F5E9',avatarColor:'#1B5E20',
  product:'Standard Group Loan',principal:5000,disbursed:'2025-11-01',
  interestRate:10,weeks:8,repaidWeeks:8,status:'CLOSED',
  totalOutstanding:0,totalOverdue:0,weeklyInstallment:719,
};

var SCHEDULE_ACTIVE=[
  {wk:1,due:'2026-04-21',dueAmt:1458,paid:1458,balance:0,status:'PAID'},
  {wk:2,due:'2026-04-28',dueAmt:1458,paid:1458,balance:0,status:'PAID'},
  {wk:3,due:'2026-05-05',dueAmt:1458,paid:1458,balance:0,status:'PAID'},
  {wk:4,due:'2026-05-12',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
  {wk:5,due:'2026-05-19',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
  {wk:6,due:'2026-05-26',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
  {wk:7,due:'2026-06-02',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
  {wk:8,due:'2026-06-09',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
  {wk:9,due:'2026-06-16',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
  {wk:10,due:'2026-06-23',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
  {wk:11,due:'2026-06-30',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
  {wk:12,due:'2026-07-07',dueAmt:1458,paid:0,balance:1458,status:'UPCOMING'},
];
var SCHEDULE_OVERDUE=[
  {wk:1,due:'2026-03-17',dueAmt:917,paid:0,balance:917,status:'OVERDUE'},
  {wk:2,due:'2026-03-24',dueAmt:917,paid:0,balance:917,status:'OVERDUE'},
  {wk:3,due:'2026-03-31',dueAmt:917,paid:0,balance:917,status:'OVERDUE'},
  {wk:4,due:'2026-04-07',dueAmt:917,paid:0,balance:917,status:'UPCOMING'},
  {wk:5,due:'2026-04-14',dueAmt:917,paid:0,balance:917,status:'UPCOMING'},
  {wk:6,due:'2026-04-21',dueAmt:917,paid:0,balance:917,status:'UPCOMING'},
];
var HISTORY_ACTIVE=[
  {type:'Repayment',date:'2026-05-05',amount:1458,icon:'arrow_upward',bg:'#E8F5E9',color:'#2E7D32'},
  {type:'Repayment',date:'2026-04-28',amount:1458,icon:'arrow_upward',bg:'#E8F5E9',color:'#2E7D32'},
  {type:'Repayment',date:'2026-04-21',amount:1458,icon:'arrow_upward',bg:'#E8F5E9',color:'#2E7D32'},
  {type:'Disbursement',date:'2026-04-14',amount:15000,icon:'arrow_downward',bg:'#FFDDB3',color:'#FF8F00'},
];

function topBar(){
  return `<div class="flex items-center gap-3 px-4 py-3 bg-[#2E7D32]">
    <span class="material-symbols-outlined text-white cursor-pointer" onclick="showToast('Back to Loan List')">arrow_back</span>
    <span class="flex-1 text-lg font-semibold text-white">Loan Detail</span>
    <span class="material-symbols-outlined text-white cursor-pointer" onclick="showToast('Refreshing...')">refresh</span>
  </div>`;
}

function memberHeaderCard(loan){
  var statusCfg={ACTIVE:{bg:'#C8E6C9',color:'#1B5E20'},OVERDUE:{bg:'#FFCDD2',color:'#B71C1C'},CLOSED:{bg:'#F5F5F5',color:'#757575'}};
  var sc=statusCfg[loan.status]||statusCfg.ACTIVE;
  var progressPct=Math.round((loan.repaidWeeks/loan.weeks)*100);
  return `<div style="background:#A6F1A6;margin:12px 16px;padding:16px;border-radius:12px;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:44px;height:44px;border-radius:22px;background:${loan.avatarBg};color:${loan.avatarColor};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;">${loan.initials}</div>
        <div>
          <div style="font-size:18px;font-weight:800;color:#1B5E20;">${loan.name}</div>
          <div style="font-size:12px;color:#2E7D32;margin-top:1px;">${loan.product}</div>
        </div>
      </div>
      <span style="padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;background:${sc.bg};color:${sc.color}">${loan.status}</span>
    </div>
    <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><div style="font-size:11px;color:#2E7D32;">Principal</div><div style="font-size:15px;font-weight:700;color:#1B5E20;">KES ${loan.principal.toLocaleString()}</div></div>
      <div><div style="font-size:11px;color:#2E7D32;">Disbursed</div><div style="font-size:14px;font-weight:600;color:#1B5E20;">${loan.disbursed}</div></div>
      <div><div style="font-size:11px;color:#2E7D32;">Interest Rate</div><div style="font-size:14px;font-weight:600;color:#1B5E20;">${loan.interestRate}% per week</div></div>
      <div><div style="font-size:11px;color:#2E7D32;">Weekly Installment</div><div style="font-size:14px;font-weight:600;color:#1B5E20;">KES ${loan.weeklyInstallment.toLocaleString()}</div></div>
    </div>
    ${loan.status!=='PENDING'?`<div style="margin-top:10px;"><div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span style="font-size:11px;color:#2E7D32;">Progress</span><span style="font-size:11px;font-weight:600;color:#1B5E20;">${loan.repaidWeeks}/${loan.weeks} weeks (${progressPct}%)</span></div><div style="height:6px;background:rgba(0,0,0,0.1);border-radius:3px;overflow:hidden;"><div style="height:6px;background:#2E7D32;border-radius:3px;width:${progressPct}%"></div></div></div>`:''}
  </div>`;
}

function outstandingRow(loan){
  if(loan.totalOutstanding===0&&loan.status==='CLOSED'){
    return `<div style="margin:0 16px 8px;padding:10px 14px;border-radius:10px;background:#E8F5E9;display:flex;align-items:center;gap:8px;">
      <span class="material-symbols-outlined" style="color:#2E7D32;font-size:20px;font-variation-settings:'FILL' 1">check_circle</span>
      <span style="font-size:13px;font-weight:600;color:#1B5E20;">Loan fully repaid · KES 0 outstanding</span>
    </div>`;
  }
  return `<div style="display:flex;gap:10px;margin:0 16px 8px;">
    <div style="flex:1;padding:10px 12px;border-radius:10px;background:#FFDDB3;text-align:center;">
      <div style="font-size:11px;color:#E65100;font-weight:600;">Outstanding</div>
      <div style="font-size:16px;font-weight:800;color:#E65100;">KES ${loan.totalOutstanding.toLocaleString()}</div>
    </div>
    ${loan.totalOverdue>0?`<div style="flex:1;padding:10px 12px;border-radius:10px;background:#FFCDD2;text-align:center;">
      <div style="font-size:11px;color:#B71C1C;font-weight:600;">Overdue</div>
      <div style="font-size:16px;font-weight:800;color:#B71C1C;">KES ${loan.totalOverdue.toLocaleString()}</div>
    </div>`:''}
  </div>`;
}

function tabBar(activeTab){
  return `<div class="tab-bar">
    <div class="tab ${activeTab==='schedule'?'active':'inactive'}" onclick="switchState('${currentLoanKey}_schedule')">Schedule</div>
    <div class="tab ${activeTab==='history'?'active':'inactive'}" onclick="switchState('${currentLoanKey}_history')">Repayment History</div>
  </div>`;
}

function scheduleTable(rows){
  var rowCls={PAID:'row-paid',PARTIAL:'row-partial',OVERDUE:'row-overdue',UPCOMING:'row-upcoming'};
  var statusLabel={PAID:'✓ Paid',PARTIAL:'Partial',OVERDUE:'LATE',UPCOMING:'Upcoming'};
  return `<div style="overflow-x:auto;margin:8px 0;">
    <div class="schedule-header"><span>Wk</span><span>Due Date</span><span style="text-align:right">Due</span><span style="text-align:right">Paid</span><span style="text-align:right">Bal</span><span>Status</span></div>
    ${rows.map(r=>`<div class="schedule-row ${rowCls[r.status]}">
      <span>${r.wk}</span><span>${r.due}</span>
      <span style="text-align:right">${r.dueAmt.toLocaleString()}</span>
      <span style="text-align:right">${r.paid.toLocaleString()}</span>
      <span style="text-align:right">${r.balance.toLocaleString()}</span>
      <span style="font-size:10px">${statusLabel[r.status]}</span>
    </div>`).join('')}
  </div>`;
}

function historyList(txns){
  if(!txns||txns.length===0) return `<div style="padding:32px;text-align:center;color:#9E9E9E;font-size:13px;">No repayments recorded yet.</div>`;
  return txns.map(t=>`<div class="txn-row">
    <div style="width:38px;height:38px;border-radius:19px;background:${t.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span class="material-symbols-outlined" style="color:${t.color};font-size:18px">${t.icon}</span>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:13px;font-weight:600;color:#1A1C19;">${t.type}</div>
      <div style="font-size:11px;color:#9E9E9E;">${t.date}</div>
    </div>
    <div style="font-size:14px;font-weight:700;color:${t.color};">KES ${t.amount.toLocaleString()}</div>
  </div>`).join('');
}

function actionButtons(canRepay,canDefault){
  if(!canRepay&&!canDefault)return '';
  return `<div style="display:flex;gap:10px;padding:14px 16px;">
    ${canRepay?`<button onclick="showToast('Record Repayment dialog opened')" class="action-btn btn-primary">
      <span style="display:flex;align-items:center;justify-content:center;gap:6px;">
        <span class="material-symbols-outlined" style="font-size:18px">receipt</span>Record Repayment
      </span>
    </button>`:''}
    ${canDefault?`<button onclick="showToast('Mark as Defaulted — confirmation dialog')" class="action-btn btn-error">
      <span style="display:flex;align-items:center;justify-content:center;gap:6px;">
        <span class="material-symbols-outlined" style="font-size:18px">gavel</span>Mark Defaulted
      </span>
    </button>`:''}
  </div>`;
}

var currentLoanKey='content';
function switchState(s){
  var picker=document.getElementById('statePicker');
  if(picker)picker.value=s;

  var loan,schedule,history,tab,canRepay,canDefault;
  if(s.startsWith('overdue')){currentLoanKey='overdue';} else if(s.startsWith('closed')){currentLoanKey='closed';} else {currentLoanKey='content';}
  tab=s.endsWith('history')?'history':'schedule';

  if(s==='loading'){
    getEl().innerHTML=topBar()+`<div style="padding:12px 16px;display:flex;flex-direction:column;gap:12px;">${Array(4).fill('<div class="shimmer" style="height:100px"></div>').join('')}</div>`;
    notifyParent();return;
  } else if(s==='error'){
    getEl().innerHTML=topBar()+`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 32px;text-align:center;">
      <span class="material-symbols-outlined" style="font-size:56px;color:#D32F2F;margin-bottom:12px">cloud_off</span>
      <p style="font-size:18px;font-weight:700">Could not load loan</p>
      <p style="font-size:13px;color:#757575;margin-top:6px;margin-bottom:20px">Loan not found or server error.</p>
      <button onclick="switchState('content_schedule')" style="padding:12px 24px;border-radius:9999px;background:#2E7D32;color:white;font-weight:700;border:none;cursor:pointer;">Retry</button>
    </div>`;
    notifyParent();return;
  }

  if(currentLoanKey==='overdue'){loan=OVERDUE_LOAN;schedule=SCHEDULE_OVERDUE;history=[];canRepay=false;canDefault=true;}
  else if(currentLoanKey==='closed'){loan=CLOSED_LOAN;schedule=SCHEDULE_ACTIVE;history=HISTORY_ACTIVE;canRepay=false;canDefault=false;}
  else{loan=ACTIVE_LOAN;schedule=SCHEDULE_ACTIVE;history=HISTORY_ACTIVE;canRepay=true;canDefault=false;}

  var html=topBar()+memberHeaderCard(loan)+outstandingRow(loan)+tabBar(tab);
  if(tab==='schedule') html+=scheduleTable(schedule);
  else html+=historyList(history);
  html+=actionButtons(canRepay,canDefault);
  html+='<div style="height:20px"></div>';
  getEl().innerHTML=html;
  notifyParent();
}

function showToast(msg){var t=document.createElement('div');t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-xl pointer-events-auto';t.textContent=msg;var c=document.getElementById('toast-container');c.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(()=>t.remove(),300);},2200);}
function toggleDark(){document.body.classList.toggle('dark');}

function notifyParent(){
  if(window===window.top)return;
  window.parent.postMessage({
    action:'screenLoaded',screenId:'loan-detail',name:'Loan Detail',feature:'loan-management',status:'enriched',tag:'VSLA',componentCount:10,
    states:[{id:'loading',name:'Loading'},{id:'content_schedule',name:'Schedule Tab'},{id:'content_history',name:'History Tab'},{id:'overdue_schedule',name:'Overdue Schedule'},{id:'overdue_history',name:'Overdue History'},{id:'closed',name:'Closed'},{id:'error',name:'Error'}],
    apiEndpoints:['/loans/{loanId}?associations=repaymentSchedule,transactions'],
    inspectorData:{id:'loan-detail',name:'Loan Detail',feature:'loan-management',status:'enriched',phase:'design',
      components:[
        {type:'header',label:'Loan Detail',tag:'top_bar'},
        {type:'card',label:'Member header card',tag:'member_header_card'},
        {type:'section',label:'Outstanding summary row',tag:'outstanding_summary_row'},
        {type:'tab_bar',label:'Schedule / Repayment History tabs',tag:'detail_tabs'},
        {type:'list',label:'Repayment schedule table',tag:'schedule_table'},
        {type:'list',label:'Repayment history list',tag:'history_list'},
        {type:'button',label:'Record Repayment',tag:'record_repayment_button'},
        {type:'button',label:'Mark Defaulted',tag:'mark_defaulted_button'},
      ],
      states:{initial_state:'loading',loading:{},content_schedule:{},content_history:{},overdue_schedule:{},overdue_history:{},closed:{},error:{}},
    }
  },'*');
}
window.addEventListener('message',function(e){if(!e.data)return;if(e.data.action==='switchState')switchState(e.data.stateId||'content_schedule');if(e.data.action==='getInspectorData')notifyParent();});
switchState(new URLSearchParams(location.search).get('state')||'content_schedule');
</script>
</body>
</html>
