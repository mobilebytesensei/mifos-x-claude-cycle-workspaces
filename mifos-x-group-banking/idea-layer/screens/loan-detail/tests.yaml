sibling: tests
schema_version: "4.0"
feature_id: loan-detail

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LD-001
      scenario: "On mount, get_loan_detail fires with associations=repaymentSchedule,transactions and shows Content state"
      type: ViewModel
      priority: P0

    - id: TC-LD-002
      scenario: "Header shows memberName, loanProductName, principalAmount, and disbursedDate formatted as dd MMM yyyy"
      type: Screen
      priority: P0

    - id: TC-LD-003
      scenario: "Summary tiles show totalOutstanding and totalOverdue formatted as KES amounts"
      type: Screen
      priority: P0

    - id: TC-LD-004
      scenario: "SCHEDULE tab shows all RepaymentScheduleRows with weekNumber, dueDate, dueAmount, paidAmount, balance"
      type: Screen
      priority: P0

    - id: TC-LD-005
      scenario: "PAID rows render with green check icon, UPCOMING with clock icon, OVERDUE with red alert icon"
      type: Screen
      priority: P0

    - id: TC-LD-006
      scenario: "HISTORY tab shows all RepaymentTransactions with type, date, and amount"
      type: Screen
      priority: P1

    - id: TC-LD-007
      scenario: "Tab switch between SCHEDULE and HISTORY preserves scroll position of each tab"
      type: Screen
      priority: P2

    - id: TC-LD-008
      scenario: "totalOverdue > 0 shows an overdue alert banner at top of screen"
      type: Screen
      priority: P0

    - id: TC-LD-009
      scenario: "Record Repayment button (if present) navigates to loan-repayment-dialog with correct loanId"
      type: Screen
      priority: P1

    - id: TC-LD-010
      scenario: "Mark Defaulted button (role-gated) appears for authorized roles only"
      type: Screen
      priority: P1

    - id: TC-LD-011
      scenario: "404 error from get_loan_detail shows loan-not-found error state"
      type: ViewModel
      priority: P0

    - id: TC-LD-012
      scenario: "401 error navigates to login screen"
      type: ViewModel
      priority: P0

    - id: TC-LD-013
      scenario: "Offline with cached data shows loan detail with offline banner (TTL 120s)"
      type: ViewModel
      priority: P1

    - id: TC-LD-014
      scenario: "Pull-to-refresh invalidates cache and re-fetches loan detail"
      type: ViewModel
      priority: P1

    - id: TC-LD-015
      scenario: "LoanRepository.getLoanDetail sends correct loanId and associations query param"
      type: Repository
      priority: P0

    - id: TC-LD-016
      scenario: "RepaymentScheduleRow status PARTIAL renders correctly with partial fill indicator"
      type: Screen
      priority: P2

    - id: TC-LD-017
      scenario: "DISBURSEMENT transaction in history tab renders with positive amount and distinct icon"
      type: Screen
      priority: P2

    - id: TC-LD-018
      scenario: "Loan status badge (ACTIVE, CLOSED, WRITTEN_OFF) renders correctly in header"
      type: Screen
      priority: P1
