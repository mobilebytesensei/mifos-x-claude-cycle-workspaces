sibling: tests
schema_version: "4.0"
feature_id: loan-detail

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LD-001
      scenario: "On mount, getLoanDetail fires (stale-while-revalidate) and Content renders header, schedule and history"
      type: ViewModel
      priority: P0
      given: "loanId from nav arg; SQLDelight cache present"
      when: "LoanDetailScreen enters composition"
      then: "LoanRepository.getLoanDetail emits cached loan first then refreshes from Fineract m_loan via companion API over Store5; loan, repaymentSchedule, repaymentHistory populated; Content state shown"

    - id: TC-LD-002
      scenario: "Member header card shows memberName, product, principal, disbursed date and interest"
      type: Screen
      priority: P0
      given: "loan Peter Otieno, Standard Group Loan, principal 1500, disbursed 2026-04-14, interest 5%"
      when: "member_header_card renders"
      then: "shows 'Peter Otieno', 'Standard Group Loan', 'Principal: KES 1,500', 'Disbursed: 2026-04-14', 'Interest: 5% per week'"

    - id: TC-LD-003
      scenario: "Loan status badge maps ACTIVE/OVERDUE/CLOSED colors in the header"
      type: Screen
      priority: P1
      given: "loan.status=ACTIVE (then OVERDUE, CLOSED)"
      when: "loan_status_badge renders"
      then: "ACTIVE #C8E6C9/#1B5E20, OVERDUE #FFCDD2/#B71C1C, CLOSED #F5F5F5/#757575"

    - id: TC-LD-004
      scenario: "Outstanding summary shows totalOutstanding; overdue chip visible only when totalOverdue > 0"
      type: Screen
      priority: P0
      given: "totalOutstanding=1125, totalOverdue=0 vs totalOverdue=375"
      when: "outstanding_summary_row renders"
      then: "outstanding_amount_chip shows 'KES 1,125'; overdue_amount_chip hidden when totalOverdue==0; visible in errorContainer when totalOverdue>0"

    - id: TC-LD-005
      scenario: "SCHEDULE tab renders all RepaymentScheduleRows with week, due date, due, paid, balance and status"
      type: Screen
      priority: P0
      given: "selectedTab=SCHEDULE, repaymentSchedule has 4 weeks (3 PAID, 1 UPCOMING)"
      when: "schedule_table renders"
      then: "one row per week with weekNumber, dueDate, dueAmount, paidAmount, balance and status columns bound"

    - id: TC-LD-006
      scenario: "Schedule rows styled by status: PAID green, PARTIAL amber, OVERDUE red, UPCOMING surface"
      type: Screen
      priority: P0
      given: "rows with status PAID, PARTIAL, OVERDUE, UPCOMING"
      when: "schedule_table renders"
      then: "PAID #F1F8E9/#33691E, PARTIAL #FFF9C4/#E65100, OVERDUE #FFCDD2/#B71C1C, UPCOMING surface/onSurface"

    - id: TC-LD-007
      scenario: "OnTabChange to HISTORY switches to the repayment history list (pure state transition)"
      type: ViewModel
      priority: P0
      given: "selectedTab=SCHEDULE; schedule and history already loaded"
      when: "tab_history OnTabChange(HISTORY) fires"
      then: "selectedTab=HISTORY; transform_state only, no network call; history_list becomes visible, schedule_table hidden"

    - id: TC-LD-008
      scenario: "HISTORY tab renders RepaymentTransaction rows with type, date and amount"
      type: Screen
      priority: P1
      given: "selectedTab=HISTORY, repaymentHistory has REPAYMENT and DISBURSEMENT transactions"
      when: "history_list renders"
      then: "each transaction_row shows txn.type, txn.date and 'KES {amount}'"

    - id: TC-LD-009
      scenario: "Empty history shows the 'No repayments recorded yet.' empty text"
      type: Screen
      priority: P2
      given: "selectedTab=HISTORY, repaymentHistory empty"
      when: "history_list renders"
      then: "empty_text 'No repayments recorded yet.' displayed; no transaction rows"

    - id: TC-LD-010
      scenario: "Record Repayment button visible only when canRecordRepayment and loan.status==ACTIVE"
      type: Screen
      priority: P1
      given: "canRecordRepayment=true, loan.status=ACTIVE (then status=CLOSED)"
      when: "action_buttons_row renders"
      then: "record_repayment_button visible for ACTIVE; hidden when status!=ACTIVE or canRecordRepayment=false"

    - id: TC-LD-011
      scenario: "OnRecordRepayment opens the repayment dialog and posts a repayment against m_loan with idempotent externalId"
      type: ViewModel
      priority: P1
      given: "canRecordRepayment=true, loan ACTIVE"
      when: "record_repayment_button OnRecordRepayment fires and the dialog confirms"
      then: "loan-repayment-dialog opened; LoanRepository.recordRepayment posts to Fineract m_loan via companion API over Store5 with idempotent externalId; call_api effect asserted; fresh balance re-cached and schedule re-emitted"

    - id: TC-LD-012
      scenario: "Mark Defaulted button visible only when canMarkDefaulted and loan.status==OVERDUE"
      type: Screen
      priority: P1
      given: "canMarkDefaulted=true, loan.status=OVERDUE"
      when: "action_buttons_row renders"
      then: "mark_defaulted_button visible; hidden when status!=OVERDUE or canMarkDefaulted=false"

    - id: TC-LD-013
      scenario: "OnMarkDefaulted confirms then updates the m_loan status to defaulted and refreshes gating"
      type: ViewModel
      priority: P1
      given: "canMarkDefaulted=true, loan OVERDUE"
      when: "mark_defaulted_button OnMarkDefaulted confirmed"
      then: "LoanRepository.markDefaulted updates Fineract m_loan status via companion API over Store5 with idempotent externalId; call_api effect asserted; loan row re-cached so badge and action gating refresh"

    - id: TC-LD-014
      scenario: "OnRefresh action re-fetches the loan network-first and re-caches schedule and history"
      type: ViewModel
      priority: P1
      given: "Content state loaded"
      when: "top-bar refresh OnRefresh fires"
      then: "LoanRepository.getLoanDetail network-first via companion API over Store5; call_api effect asserted; refreshed LoanDetail, schedule and history re-cached and re-emitted"

    - id: TC-LD-015
      scenario: "404 from getLoanDetail shows the loan-not-found error state"
      type: ViewModel
      priority: P0
      given: "getLoanDetail returns 404"
      when: "on mount"
      then: "LoanDetailError type=NotFound; error_state 'Loan not found.' shown; retry=false"

    - id: TC-LD-016
      scenario: "Auth 401 sets Auth error and redirects to login"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "getLoanDetail returns 401"
      then: "LoanDetailError type=Auth (redirect=login); navigation to login triggered"

    - id: TC-LD-017
      scenario: "Retry re-invokes getLoanDetail after a load error and distinguishes offline from server failure"
      type: ViewModel
      priority: P1
      given: "error!=null after a Network failure"
      when: "error_state Retry fires"
      then: "cmp-network-monitor distinguishes offline vs server; LoanRepository.getLoanDetail re-fetched from Fineract m_loan; call_api effect asserted; Content restored or error re-surfaced"

    - id: TC-LD-018
      scenario: "Offline with cached data renders loan detail with offline banner"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor offline; SQLDelight cache holds the loan"
      when: "on mount"
      then: "cached loan, schedule and history rendered; offline banner shown; no hard error state"

    - id: TC-LD-019
      scenario: "OnBack pops the loan-detail destination returning to the loan list"
      type: Screen
      priority: P2
      given: "Content state entered from loan-list"
      when: "top-bar navigation OnBack fires"
      then: "navigate effect pops back stack to loan-list; no side effect on the loan record"

    - id: TC-LD-020
      scenario: "Loading state shows the detail shimmer while cache-then-network fetch runs"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "loading state rendered"
      then: "shimmer_detail (count 3) shown with top_bar; header, tabs and action row not yet rendered"

    - id: TC-LD-021
      scenario: "LoanRepository.getLoanDetail sends correct loanId and associations query param"
      type: Repository
      priority: P0
      given: "loanId=5001"
      when: "getLoanDetail(5001) called"
      then: "companion request carries loanId=5001 and associations=repaymentSchedule,transactions; response split into header, schedule rows and history"
