sibling: tests
schema_version: "4.0"
feature_id: loan-detail
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LD-001
      scenario: "On mount, loan detail, repayment schedule and history load from LoanRepository"
      type: ViewModel
      priority: P0
      given: "loanId=42; network online"
      when: "LoanDetailScreen enters composition"
      then: "LoanRepository.getLoan(42) called; repaymentSchedule and repaymentHistory populated; isLoading=false; LoanDetailScreenState=Content"

    - id: TC-LD-002
      scenario: "Default tab is SCHEDULE; tapping HISTORY tab switches selectedTab"
      type: Screen
      priority: P0
      given: "Content state; selectedTab=SCHEDULE"
      when: "OnTabChange(LoanDetailTab.HISTORY) fires"
      then: "selectedTab=HISTORY; repaymentHistory list rendered; schedule list hidden"

    - id: TC-LD-003
      scenario: "Record Repayment button visible and enabled only when canRecordRepayment=true"
      type: Screen
      priority: P0
      given: "Content state"
      when: "canRecordRepayment=true vs false"
      then: "button visible when true; hidden when false"

    - id: TC-LD-004
      scenario: "OnRecordRepayment emits ShowRepaymentDialog event"
      type: ViewModel
      priority: P0
      given: "canRecordRepayment=true"
      when: "OnRecordRepayment fires"
      then: "ShowRepaymentDialog event emitted; isRecordingRepayment=true"

    - id: TC-LD-005
      scenario: "Mark Defaulted button visible and enabled only when canMarkDefaulted=true"
      type: Screen
      priority: P1
      given: "Content state"
      when: "canMarkDefaulted=true vs false"
      then: "Mark Defaulted button visible when true; hidden when false"

    - id: TC-LD-006
      scenario: "OnMarkDefaulted emits ShowDefaultConfirmDialog event"
      type: ViewModel
      priority: P1
      given: "canMarkDefaulted=true"
      when: "OnMarkDefaulted fires"
      then: "ShowDefaultConfirmDialog event emitted"

    - id: TC-LD-007
      scenario: "Repayment schedule shows installment rows with due date, amount, and status"
      type: Screen
      priority: P0
      given: "Content state; selectedTab=SCHEDULE; repaymentSchedule=[3 rows]"
      when: "ScheduleTab renders"
      then: "3 RepaymentScheduleRow items visible each with dueDate, amount, and paid/overdue/upcoming status"

    - id: TC-LD-008
      scenario: "Error state shows retry on network or server failure"
      type: Screen
      priority: P1
      given: "LoanRepository.getLoan returns network error"
      when: "load completes"
      then: "LoanDetailScreenState=Error; retry CTA visible"

    - id: TC-LD-009
      scenario: "OnRetry re-fetches loan detail from LoanRepository"
      type: ViewModel
      priority: P1
      given: "error state active"
      when: "Retry fires"
      then: "isLoading=true; LoanRepository.getLoan called again; on success Content restored"

    - id: TC-LD-010
      scenario: "Pull-to-refresh reloads loan detail and history without full-screen shimmer"
      type: ViewModel
      priority: P1
      given: "Content state; isLoading=false"
      when: "OnRefresh fires"
      then: "LoanRepository.getLoan re-fetched; schedule and history updated; no full-screen loading shimmer"

    - id: TC-LD-011
      scenario: "404 not-found transitions to NotFound error (no retry)"
      type: ViewModel
      priority: P1
      given: "GET loan returns 404"
      when: "load completes"
      then: "LoanDetailError type=NotFound retry=false; no retry CTA"

    - id: TC-LD-012
      scenario: "Auth 401 redirects to login"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "LoanRepository.getLoan returns 401"
      then: "LoanDetailError type=Auth redirect=login"
