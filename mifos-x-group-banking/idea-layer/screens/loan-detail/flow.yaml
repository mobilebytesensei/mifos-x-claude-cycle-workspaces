sibling: flow
schema_version: "4.0"
feature_id: loan-detail

navigates_to:
  - loan-list

flow_logic:
  on_load:
    - action: fetch_loan_detail
      api: get_loan_detail
      on_success: show_content
      on_error: show_error
      offline: show_cached_data
  on_tab_change:
    - action: update_selected_tab
      description: Switch between Schedule and History tabs; data already loaded
  on_record_repayment:
    - action: show_repayment_dialog
      guard: "canRecordRepayment (treasurer role)"
  on_mark_defaulted:
    - action: show_confirm_dialog
      guard: "canMarkDefaulted (chairperson role)"
  on_refresh:
    - action: fetch_loan_detail
      api: get_loan_detail
      invalidate_cache: true
