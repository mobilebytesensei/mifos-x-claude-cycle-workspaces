capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - has_offline_cache

id: loan-detail
name: Loan Detail
description: >
  Full detail view for a single loan. Displays member identity, disbursement info, interest rate,
  total outstanding, and overdue amount. Provides two tabs: Schedule (weekly repayment table) and
  Repayment History (recorded transactions). Treasurer may record a repayment; chairperson may
  mark the loan as defaulted. Loads from local cache then syncs from Fineract.
feature: loan-management
flow: loan-management-flow
version: "1.0.0"
tags:
  - loan-management
  - admin
  - detail
  - offline-first
  - FR-006

status: designed
quality_score: 87
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system
  - status: designed
    at: "2026-05-08T23:00:00Z"
