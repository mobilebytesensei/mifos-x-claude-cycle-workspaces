legacy_metadata:
  analytics:
    screen_view: loan_detail_viewed
    events:
      - trigger: tab changed
        name: loan_detail_tab_changed
        params: { tab: String }
      - trigger: record repayment tapped
        name: loan_repayment_initiated
        params: { loan_id: Long }
      - trigger: mark defaulted tapped
        name: loan_default_initiated
        params: { loan_id: Long }
      - trigger: refresh
        name: loan_detail_refreshed
        params: { loan_id: Long }
