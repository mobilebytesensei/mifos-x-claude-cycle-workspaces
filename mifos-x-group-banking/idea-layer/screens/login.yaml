schema_version: "3.1"

id: login
name: Login
description: >
  Fineract authentication screen supporting both admin (staff auth) and end-user
  (self-service auth) paths. Shows logo, username + password fields, PIN-based
  offline login option, and biometric unlock. Covers FR-013 and FR-014.
feature: authentication
flow: authentication-flow
version: "1.0.0"
tags: [auth, login, pin, biometric, fineract, admin, end_user, FR-013, FR-014]

status: enriched
quality_score: 91
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: claude-product-cycle

entry_point: false
bottom_nav: false
navigates_to:
  - target: admin-dashboard
    condition: admin_login_success
    params: { userId: Long, roles: "List<String>" }
  - target: personal-dashboard
    condition: end_user_login_success
    params: { clientId: Long, selfServiceToken: String }
  - target: client-type-selector
    condition: user_taps_back
route: /login
entry_points:
  - source: client-type-selector
    condition: tile_selected
nav_params:
  client_type: { type: "ClientType", required: true, values: [admin, end_user] }

screens:
  - id: login_screen
    name: LoginScreen
    composable: LoginScreen
    description: Auth form with contextual copy for admin vs end-user
    layout: Column (scrollable, centered)

state_model:
  LoginViewModel:
    state:
      name: LoginState
      fields:
        clientType: { type: ClientType, default: "ClientType.END_USER" }
        username: { type: String, default: '""' }
        password: { type: String, default: '""' }
        pin: { type: String, default: '""' }
        isPasswordVisible: { type: Boolean, default: "false" }
        isPinMode: { type: Boolean, default: "false" }
        isBiometricAvailable: { type: Boolean, default: "false" }
        isLoading: { type: Boolean, default: "false" }
        error: { type: "LoginError?", default: "null" }
    screen_state:
      name: LoginScreenState
      members: [Idle, Loading, Success, Error, BiometricPrompt]
    errors:
      name: LoginError
      types:
        - { type: InvalidCredentials, retry: true, message_key: error_invalid_credentials }
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: PinNotSet, retry: false, message_key: error_pin_not_set }
        - { type: BiometricFailed, retry: true, message_key: error_biometric_failed }
    events:
      name: LoginEvent
      members:
        - { name: NavigateToAdminDashboard, params: { userId: Long, roles: "List<String>" } }
        - { name: NavigateToEndUserDashboard, params: { clientId: Long, token: String } }
        - { name: ShowBiometricPrompt }
    actions:
      name: LoginAction
      members:
        - { name: OnUsernameChange, params: { value: String }, trigger: "Type username" }
        - { name: OnPasswordChange, params: { value: String }, trigger: "Type password" }
        - { name: OnTogglePasswordVisibility, trigger: "Tap eye icon" }
        - { name: OnLoginClick, trigger: "Tap Login button" }
        - { name: OnPinChange, params: { digit: String }, trigger: "Tap PIN digit" }
        - { name: OnTogglePinMode, trigger: "Tap Use PIN instead" }
        - { name: OnBiometricClick, trigger: "Tap fingerprint icon" }
        - { name: OnPinSubmit, trigger: "PIN 4th digit entered" }
    di:
      - AuthRepository
      - SessionManager
      - BiometricManager
      - PinManager
      - SyncQueueRepository

flow_logic:
  - decision: client_type_check
    branches:
      - condition: clientType == ADMIN
        action: use POST /authentication endpoint, navigate to admin-dashboard on success
      - condition: clientType == END_USER
        action: use POST /self/authentication endpoint, navigate to personal-dashboard on success
  - decision: login_mode
    branches:
      - condition: isPinMode == false
        action: show username/password fields
      - condition: isPinMode == true
        action: show PIN pad, hide username/password
  - decision: biometric_available
    branches:
      - condition: isBiometricAvailable == true
        action: show biometric button
      - condition: isBiometricAvailable == false
        action: hide biometric button

dependencies:
  tier: ui
  features: [authentication]
  services:
    - AuthRepository
    - SessionManager
    - BiometricManager
    - PinManager
    - SyncQueueRepository
  shared_entities:
    - Member
    - ClientType
    - SyncQueue

api:
  - id: authenticate_admin
    function: authenticate_admin
    method: post
    endpoint: "/authentication"
    description: Authenticate admin/staff via Fineract username+password
    params:
      username: { type: String, required: true, source: user_input }
      password: { type: String, required: true, source: user_input }
    response:
      type: object
      fields:
        userId: Long
        base64EncodedAuthenticationKey: String
        authenticated: Boolean
        username: String
        roles: "List<String>"
        officeId: Long
        officeName: String
    errors:
      401: Invalid credentials
      503: Server unavailable
    cache: { ttl: 0, strategy: no-cache, offline: use_local_pin }

  - id: authenticate_end_user
    function: authenticate_end_user
    method: post
    endpoint: "/self/authentication"
    description: Authenticate end user via Fineract self-service credentials
    params:
      username: { type: String, required: true, source: user_input }
      password: { type: String, required: true, source: user_input }
    response:
      type: object
      fields:
        userId: Long
        base64EncodedAuthenticationKey: String
        authenticated: Boolean
        username: String
        clientId: Long
        clientName: String
    errors:
      401: Invalid credentials
      503: Server unavailable
    cache: { ttl: 0, strategy: no-cache, offline: use_local_pin }

dtos:
  - name: AdminAuthResponse
    fields:
      userId: Long
      base64EncodedAuthenticationKey: String
      authenticated: Boolean
      username: String
      roles: "List<String>"
      officeId: Long
      officeName: String

  - name: SelfAuthResponse
    fields:
      userId: Long
      base64EncodedAuthenticationKey: String
      authenticated: Boolean
      username: String
      clientId: Long
      clientName: String

components:
  - id: top_bar
    type: top-bar
    name: LoginTopBar
    description: Minimal top bar with back arrow to return to client-type-selector
    style:
      background: surface
      elevation: 0dp
    navigation_icon:
      name: FluentIcons.arrow_left_24_regular
      tint: onSurface
    title: ""
    a11y:
      content_description: "Back to client type selection"
    test_context:
      purpose: Verify back navigation returns to client-type-selector
      interaction_type: tap
      data_driven: false
      required_fields: []
    on_click:
      action: NavigateBack
      target: client-type-selector

  - id: logo
    type: image
    name: LoginLogo
    description: CommonPurse logo centered above title
    style:
      size: 64dp
      alignment: center
      margin_top: 24dp
    a11y:
      content_description: "CommonPurse logo"
    test_context:
      purpose: Confirm logo visible on login screen
      interaction_type: non_interactive
      data_driven: false
      required_fields: []
    on_click: {}

  - id: login_title
    type: text
    name: LoginTitle
    description: Screen title — changes based on client_type
    style:
      text_key: "{ i18n.admin_login_title | i18n.member_login_title }"
      text_style: headlineMedium
      color: onSurface
      font: Noto Sans
      weight: bold
      alignment: center
      margin_top: 8dp
    a11y:
      content_description: "Login to CommonPurse"
    test_context:
      purpose: Title shows correct copy for each client type
      interaction_type: non_interactive
      data_driven: true
      required_fields: [client_type]
    on_click: {}

  - id: login_subtitle
    type: text
    name: LoginSubtitle
    description: Contextual subtitle — "Mwangaza Women's Group" from session context
    style:
      text: "Mwangaza Women's Group"
      text_style: bodyLarge
      color: primary
      alignment: center
      margin_bottom: 32dp
    a11y:
      content_description: "Mwangaza Women's Group"
    test_context:
      purpose: Group name shown for context
      interaction_type: non_interactive
      data_driven: true
      required_fields: [group_name]
    on_click: {}

  - id: username_field
    type: text-field
    name: UsernameField
    description: Username input — hidden in PIN mode
    style:
      label_key: i18n.username_label
      placeholder_key: i18n.username_placeholder
      leading_icon: FluentIcons.person_24_regular
      keyboard_type: text
      ime_action: next
      min_touch_target: 48dp
      margin_horizontal: 24dp
      margin_bottom: 12dp
      visible_when: isPinMode == false
    a11y:
      content_description: "Enter your username"
      role: text_field
    test_context:
      purpose: Username input updates state and enables login button when non-empty
      interaction_type: type
      data_driven: false
      required_fields: [username]
    on_click:
      action: OnUsernameChange
      target: state.username

  - id: password_field
    type: text-field
    name: PasswordField
    description: Password input with visibility toggle — hidden in PIN mode
    style:
      label_key: i18n.password_label
      placeholder_key: i18n.password_placeholder
      leading_icon: FluentIcons.lock_closed_24_regular
      trailing_icon: "{ FluentIcons.eye_24_regular | FluentIcons.eye_off_24_regular }"
      keyboard_type: password
      input_type: password
      ime_action: done
      min_touch_target: 48dp
      margin_horizontal: 24dp
      margin_bottom: 8dp
      visible_when: isPinMode == false
    a11y:
      content_description: "Enter your password"
      role: text_field
    test_context:
      purpose: Password field masks input; toggle reveals/hides password
      interaction_type: type
      data_driven: false
      required_fields: [password]
    on_click:
      action: OnTogglePasswordVisibility
      target: state.isPasswordVisible

  - id: switch_to_pin_button
    type: button
    name: SwitchToPinButton
    description: Text button to toggle between password and PIN entry modes
    style:
      variant: text
      text_key: "{ i18n.use_pin_instead | i18n.use_password_instead }"
      color: primary
      alignment: end
      margin_horizontal: 24dp
      margin_bottom: 16dp
    a11y:
      content_description: "Switch login mode"
      role: button
      min_touch_target: 48dp
    test_context:
      purpose: Toggle switches between password and PIN mode; correct text shown for each state
      interaction_type: tap
      data_driven: false
      required_fields: []
    on_click:
      action: OnTogglePinMode
      target: state.isPinMode

  - id: pin_pad
    type: card
    name: PinPad
    description: 4-digit PIN entry grid (3x4 numpad). Visible only in PIN mode.
    style:
      visible_when: isPinMode == true
      background: surface
      cornerRadius: md
      margin_horizontal: 24dp
      padding: 16dp
    pin_display:
      dots: 4
      filled_color: primary
      empty_color: outlineVariant
    grid:
      columns: 3
      digit_button_size: 72dp
      digit_text_style: headlineSmall
    a11y:
      content_description: "Enter your 4-digit PIN"
    test_context:
      purpose: PIN pad entry triggers OnPinChange; 4th digit auto-submits
      interaction_type: tap
      data_driven: false
      required_fields: [pin]
    on_click:
      action: OnPinChange
      target: state.pin

  - id: biometric_button
    type: button
    name: BiometricButton
    description: Fingerprint/face icon button for biometric unlock. Visible when available.
    style:
      variant: outlined
      icon: FluentIcons.fingerprint_24_filled
      icon_size: 32dp
      min_touch_target: 56dp
      size: 64dp
      shape: circle
      border_color: primary
      tint: primary
      alignment: center
      margin_top: 8dp
      visible_when: isBiometricAvailable == true
    a11y:
      content_description: "Login with fingerprint or face"
      role: button
      min_touch_target: 56dp
    test_context:
      purpose: Biometric button triggers system biometric prompt; hidden when unavailable
      interaction_type: tap
      data_driven: false
      required_fields: []
    on_click:
      action: OnBiometricClick
      target: event.ShowBiometricPrompt

  - id: login_button
    type: button
    name: LoginButton
    description: Primary CTA — disabled until username+password (or PIN) are non-empty
    style:
      variant: filled
      text_key: i18n.login_button
      background: primary
      text_color: onPrimary
      cornerRadius: full
      min_height: 56dp
      margin_horizontal: 24dp
      margin_top: 24dp
      enabled_when: "(username.isNotBlank() && password.isNotBlank()) || pin.length == 4"
    a11y:
      content_description: "Login to CommonPurse"
      role: button
      min_touch_target: 56dp
    test_context:
      purpose: Login button triggers auth; disabled when fields empty; shows loading state
      interaction_type: tap
      data_driven: false
      required_fields: [username, password]
    on_click:
      action: OnLoginClick
      target: api.authenticate_admin or api.authenticate_end_user

  - id: loading_indicator
    type: shimmer
    name: LoginLoadingIndicator
    description: Circular progress centered over login button during auth
    style:
      visible_when: isLoading == true
      size: 32dp
      color: primary
      alignment: center
    a11y:
      content_description: "Logging in, please wait"
    test_context:
      purpose: Loading indicator shown during API call; hidden on success/error
      interaction_type: non_interactive
      data_driven: false
      required_fields: []
    on_click: {}

  - id: error_banner
    type: card
    name: ErrorBanner
    description: Inline error message below login button — visible on auth failure
    style:
      visible_when: error != null
      background: errorContainer
      cornerRadius: md
      padding: 12dp
      margin_horizontal: 24dp
      margin_top: 8dp
    icon:
      name: FluentIcons.warning_24_filled
      tint: onErrorContainer
      size: 20dp
    text:
      text_key: "error.message_key"
      text_style: bodyMedium
      color: onErrorContainer
    a11y:
      content_description: "Login error message"
      live_region: polite
    test_context:
      purpose: Error message shown for each error type; disappears when user types again
      interaction_type: non_interactive
      data_driven: true
      required_fields: [error]
    on_click: {}

states:
  initial_state: loading
  loading:
    description: Brief splash while checking for existing session / biometric availability
    components_visible: [logo, login_title]
  content:
    description: Form ready for input (password mode default)
    components_visible: [top_bar, logo, login_title, login_subtitle, username_field, password_field, switch_to_pin_button, biometric_button, login_button]
  pin_mode:
    description: PIN pad visible, username/password hidden
    components_visible: [top_bar, logo, login_title, login_subtitle, pin_pad, switch_to_pin_button, biometric_button, login_button]
  loading_auth:
    description: Auth in progress — login button replaced by spinner
    components_visible: [top_bar, logo, login_title, login_subtitle, username_field, password_field, switch_to_pin_button, loading_indicator]
  error:
    description: Auth failed — error banner visible, fields re-enabled
    components_visible: [top_bar, logo, login_title, login_subtitle, username_field, password_field, switch_to_pin_button, biometric_button, login_button, error_banner]
  biometric_prompt:
    description: OS biometric dialog is showing
    components_visible: [top_bar, logo, login_title, login_subtitle, biometric_button]

i18n:
  admin_login_title: "Staff Login"
  member_login_title: "Member Login"
  username_label: "Username"
  username_placeholder: "Enter your username"
  password_label: "Password"
  password_placeholder: "Enter your password"
  use_pin_instead: "Use PIN instead"
  use_password_instead: "Use password instead"
  login_button: "Login"
  error_invalid_credentials: "Incorrect username or password. Please try again."
  error_network: "No internet connection. Login with your PIN."
  error_server: "Server error. Please try again later."
  error_pin_not_set: "PIN not set up. Please login with your password first."
  error_biometric_failed: "Biometric not recognised. Try again or use your password."

analytics:
  screen_viewed:
    event: screen_viewed
    params:
      screen_id: login
      flow: authentication-flow
      client_type: "{ admin | end_user }"
  events:
    - name: login_attempted
      trigger: user taps Login button
      params:
        client_type: "{ admin | end_user }"
        mode: "{ password | pin | biometric }"
    - name: login_success
      trigger: auth API returns 200
      params:
        client_type: "{ admin | end_user }"
        mode: "{ password | pin | biometric }"
    - name: login_failed
      trigger: auth API returns error
      params:
        client_type: "{ admin | end_user }"
        error_type: "{ InvalidCredentials | Network | Server }"
    - name: biometric_triggered
      trigger: user taps biometric button
      params:
        client_type: "{ admin | end_user }"
