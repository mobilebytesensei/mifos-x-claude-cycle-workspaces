schema_version: "3.1"
id: sync-status
name: Sync Status
description: >
  Offline sync dashboard showing the current synchronisation state for both admin and
  member client types. Reads exclusively from the local SQLDelight SyncQueue table — no
  network call is made on load. Displays an overall status indicator (green/amber/red),
  pending and failed operation counts by entity type, the last successful sync timestamp,
  a manual Sync Now button (disabled when offline), a failed-operations list with per-item
  retry, and a conflict counter. Terminal screen — navigates nowhere.
feature: offline-sync
flow: offline-sync-flow
version: "1.0.0"
tags:
  - sync
  - offline-first
  - both
  - FR-008

status: enriched
quality_score: 86
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system

entry_point: false
bottom_nav:
  visible: true
  selected_tab: sync
navigates_to: []
route: /sync-status
entry_points:
  - source: bottom_nav
    label: Sync
  - source: sync_indicator_tap
    condition: pending_or_failed_ops_exist
nav_params: {}

screens:
  - id: sync-status-screen
    title: Sync Status
    type: detail
    description: Read-only sync dashboard; terminal screen with no outbound navigation

state_model:
  SyncStatusViewModel:
    state:
      name: SyncStatusState
      fields:
        isOnline: { type: Boolean, default: "false" }
        pendingCount: { type: Int, default: "0" }
        failedCount: { type: Int, default: "0" }
        lastSyncAt: { type: "Instant?", default: "null" }
        isSyncing: { type: Boolean, default: "false" }
        pendingByType: { type: "Map<EntityType, Int>", default: "emptyMap()" }
        failedOperations: { type: "List<SyncQueueItem>", default: "emptyList()" }
        conflictCount: { type: Int, default: "0" }
        overallStatus: { type: SyncOverallStatus, default: "SyncOverallStatus.SYNCED" }
        isLoading: { type: Boolean, default: "true" }
    screen_state:
      name: SyncStatusScreenState
      members: [Loading, Content, Error]
    errors:
      name: SyncStatusError
      types:
        - { type: DbRead, retry: true, message_key: error_db }
        - { type: SyncFailed, retry: true, message_key: error_sync_failed }
    events:
      name: SyncStatusEvent
      members:
        - { name: ShowSnackbar, params: { message: String } }
        - { name: SyncCompleted }
    actions:
      name: SyncStatusAction
      members:
        - { name: OnSyncNow, trigger: "Tap Sync Now button" }
        - { name: OnRetryOperation, params: { itemId: Long }, trigger: "Tap retry on failed item" }
        - { name: OnRefresh, trigger: "Pull to refresh (re-reads local DB)" }
    di:
      - SyncQueueRepository
      - SyncManager
      - NetworkMonitor

flow_logic:
  on_load:
    - action: observe_sync_queue
      source: local_db
      description: >
        Subscribe to SyncQueue table via SQLDelight Flow.
        Compute pendingCount, failedCount, pendingByType, failedOperations, conflictCount.
        Compute overallStatus:
          SYNCED if pendingCount == 0 && failedCount == 0
          PENDING if pendingCount > 0
          FAILED if failedCount > 0
    - action: observe_network
      source: NetworkMonitor
    - action: load_last_sync_timestamp
      source: local_db
      description: Read last_synced_at from local settings table
  on_sync_now:
    - guard: "isOnline"
    - action: trigger_sync
      api: batch_sync
      on_success: update_status
      on_error: show_snackbar
  on_retry_operation:
    - action: retry_single_item
      api: batch_sync
      params: { itemId: "{itemId}" }
  on_refresh:
    - action: observe_sync_queue
      source: local_db

dependencies:
  repositories:
    - name: SyncQueueRepository
      methods:
        - "observeSyncQueue(): Flow<List<SyncQueueItem>>"
        - "getPendingByType(): Flow<Map<EntityType, Int>>"
        - "getFailedOperations(): Flow<List<SyncQueueItem>>"
        - "getConflictCount(): Flow<Int>"
        - "retryItem(itemId: Long): Flow<Unit>"
    - name: SyncManager
      methods:
        - "triggerSync(): Flow<SyncResult>"
        - "getLastSyncAt(): Flow<Instant?>"
  services:
    - NetworkMonitor
  local_db:
    - table: sync_queue
      schema: "id, entity_type, operation, payload_json, status (pending/in_progress/synced/failed), created_at, retried_at"
    - table: app_settings
      columns: [last_synced_at]

api:
  - id: batch_sync
    function: send_batch
    method: post
    endpoint: "/batches"
    description: >
      Sends all pending SyncQueue items as a Fineract batch request.
      Used only when online and triggered manually or by SyncManager background job.
    body:
      requests:
        type: array
        items:
          requestId: Int
          relativeUrl: String
          method: String
          body: "String (JSON)"
    response:
      type: array
      items:
        requestId: Int
        statusCode: Int
        body: String
    errors:
      400: Batch validation error
      401: Unauthorized
      500: Server error

dtos:
  SyncQueueItem:
    id: Long
    entityType: EntityType
    operation: SyncOperation
    payloadJson: String
    status: SyncStatus
    createdAt: String
    retriedAt: "String?"
    errorMessage: "String?"

  EntityType:
    values: [MEETING, LOAN, SAVINGS, ATTENDANCE, SHARE_OUT, MEMBER]

  SyncOperation:
    values: [CREATE, UPDATE, DELETE]

  SyncStatus:
    values: [PENDING, IN_PROGRESS, SYNCED, FAILED]

  SyncOverallStatus:
    values: [SYNCED, PENDING, FAILED]

  SyncResult:
    successCount: Int
    failedCount: Int
    conflictCount: Int

components:
  - id: top_bar
    type: top-bar
    title: "Sync Status"
    style:
      background: primary
      text_color: onPrimary
    test_context:
      purpose: "Screen title; no back navigation — accessed via bottom nav"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: overall_status_card
    type: card
    style:
      corner_radius: 16dp
      padding: 20dp
      elevation: 2dp
    style_by_status:
      SYNCED: { background: "#C8E6C9" }
      PENDING: { background: "#FFF9C4" }
      FAILED: { background: "#FFCDD2" }
    content:
      - id: status_icon
        type: icon
        size: 48dp
        style:
          SYNCED: { icon: cloud_done, color: "#2E7D32" }
          PENDING: { icon: cloud_sync, color: "#E65100" }
          FAILED: { icon: cloud_off, color: "#B71C1C" }
        value: "{{overallStatus}}"
      - id: status_label
        type: text
        style: { text_style: titleLarge, font_weight: bold }
        style_by_status:
          SYNCED: { color: "#1B5E20" }
          PENDING: { color: "#E65100" }
          FAILED: { color: "#B71C1C" }
        value_by_status:
          SYNCED: "All Synced"
          PENDING: "Sync Pending"
          FAILED: "Sync Failed"
      - id: last_sync_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "Last synced: {{lastSyncAt | timeAgo}}"
        fallback_when_null: "Never synced"
    test_context:
      purpose: "Overall status indicator — green/amber/red with icon and label"
      interaction_type: static
      data_driven: true
      required_fields: [overallStatus, lastSyncAt]

  - id: pending_breakdown_card
    type: card
    style:
      background: surface
      elevation: 2dp
      corner_radius: 12dp
      padding: 16dp
    content:
      - id: pending_section_title
        type: text
        style: { text_style: titleSmall, color: onSurface }
        value: "Pending Operations ({{pendingCount}})"
      - id: entity_breakdown_rows
        type: list
        items_source: pendingByType
        item_type: entity_count_row
    visible_when: "pendingCount > 0"
    test_context:
      purpose: "Shows pending operation count broken down by entity type"
      interaction_type: static
      data_driven: true
      required_fields: [pendingCount, pendingByType]

  - id: entity_count_row
    type: list-item
    content:
      - id: entity_type_label
        type: text
        style: { text_style: bodyMedium, color: onSurface }
        value: "{{entityType | humanize}}"
      - id: entity_count_badge
        type: badge
        style: { background: secondaryContainer, text_color: onSecondaryContainer }
        value: "{{count}}"
    test_context:
      purpose: "Single row showing entity type and pending count"
      interaction_type: static
      data_driven: true
      required_fields: [entityType, count]

  - id: sync_now_button
    type: button
    label: "Sync Now"
    icon: sync
    style:
      background: primary
      text_color: onPrimary
      corner_radius: 24dp
      min_touch_target: 56dp
      width: fill
    enabled_when: "isOnline && !isSyncing"
    loading_when: "isSyncing"
    disabled_label_when_offline: "Offline — Connect to sync"
    on_click: { action: OnSyncNow, api: trigger_sync }
    test_context:
      purpose: "Trigger manual sync; disabled when offline or already syncing"
      interaction_type: tap
      data_driven: true
      required_fields: [isOnline, isSyncing]

  - id: failed_operations_section
    type: card
    style:
      background: errorContainer
      corner_radius: 12dp
      padding: 16dp
    content:
      - id: failed_section_title
        type: text
        style: { text_style: titleSmall, color: onErrorContainer }
        value: "Failed Operations ({{failedCount}})"
      - id: failed_ops_list
        type: list
        items_source: failedOperations
        item_type: failed_op_row
    visible_when: "failedCount > 0"
    test_context:
      purpose: "Shows failed operations; each has a retry button"
      interaction_type: mixed
      data_driven: true
      required_fields: [failedCount, failedOperations]

  - id: failed_op_row
    type: list-item
    style: { padding: "8dp 0dp" }
    content:
      - id: failed_entity_type
        type: text
        style: { text_style: bodyMedium, color: onErrorContainer }
        value: "{{item.entityType | humanize}} — {{item.operation}}"
      - id: failed_error_text
        type: text
        style: { text_style: bodySmall, color: onErrorContainer }
        value: "{{item.errorMessage}}"
      - id: retry_button
        type: button
        label: "Retry"
        style:
          variant: outlined
          corner_radius: 16dp
          min_touch_target: 40dp
          border_color: onErrorContainer
          text_color: onErrorContainer
        on_click: { action: OnRetryOperation, params: { itemId: "{{item.id}}" }, api: retry_sync_item }
    test_context:
      purpose: "Single failed operation row with inline retry button"
      interaction_type: tap
      data_driven: true
      required_fields: [item.entityType, item.operation, item.errorMessage]

  - id: conflict_chip
    type: info-chip
    visible_when: "conflictCount > 0"
    style:
      background: tertiaryContainer
      text_color: onTertiaryContainer
      corner_radius: 16dp
    label: "{{conflictCount}} conflict(s) detected — review before syncing"
    test_context:
      purpose: "Alert about data conflicts requiring manual resolution"
      interaction_type: static
      data_driven: true
      required_fields: [conflictCount]

  - id: all_synced_empty
    type: empty-state
    icon: cloud_done
    title: "All caught up!"
    body: "No pending or failed operations."
    visible_when: "pendingCount == 0 && failedCount == 0"
    test_context:
      purpose: "Empty state shown when everything is synced"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: shimmer_status
    type: shimmer
    count: 3
    style: { height: 80dp, corner_radius: 12dp, background: surfaceVariant }
    test_context:
      purpose: "Loading skeleton while reading from local DB"
      interaction_type: static
      data_driven: false
      required_fields: []

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_status]
    description: "Reading SyncQueue from local SQLDelight DB"
  content:
    components:
      - top_bar
      - overall_status_card
      - conflict_chip
      - pending_breakdown_card
      - sync_now_button
      - failed_operations_section
      - all_synced_empty
    description: "Dashboard showing full sync state; Sync Now button enabled only when online"
    demo_data:
      isOnline: true
      overallStatus: PENDING
      pendingCount: 3
      failedCount: 0
      conflictCount: 0
      lastSyncAt: "2026-05-05T08:30:00Z"
      pendingByType:
        MEETING: 1
        SAVINGS: 2
      failedOperations: []
  error:
    components: [top_bar, overall_status_card]
    description: "Local DB read error"

i18n:
  en:
    screen_title: "Sync Status"
    status_synced: "All Synced"
    status_pending: "Sync Pending"
    status_failed: "Sync Failed"
    last_sync_label: "Last synced: {{time}}"
    never_synced: "Never synced"
    pending_title: "Pending Operations ({{count}})"
    failed_title: "Failed Operations ({{count}})"
    conflict_label: "{{count}} conflict(s) detected — review before syncing"
    sync_now: "Sync Now"
    sync_now_offline: "Offline — Connect to sync"
    all_synced_title: "All caught up!"
    all_synced_body: "No pending or failed operations."
    retry: "Retry"
    error_db: "Could not read sync queue from local database."
    error_sync_failed: "Sync failed. Check your connection and try again."
    entity_meeting: "Meeting Records"
    entity_loan: "Loan Operations"
    entity_savings: "Savings Transactions"
    entity_attendance: "Attendance Records"
    entity_share_out: "Share-Out Records"
    entity_member: "Member Updates"
  sw:
    screen_title: "Hali ya Usawazishaji"
    status_synced: "Imesawazishwa"
    status_pending: "Inasubiri Usawazishaji"
    status_failed: "Usawazishaji Umeshindwa"
    sync_now: "Sawazisha Sasa"
    all_synced_title: "Kila kitu kimekamilika!"
  fr:
    screen_title: "État de Synchronisation"
    status_synced: "Tout Synchronisé"
    status_pending: "Synchronisation en Attente"
    status_failed: "Synchronisation Échouée"
    sync_now: "Synchroniser Maintenant"
