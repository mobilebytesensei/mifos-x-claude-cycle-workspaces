sibling: tests
schema_version: "4.0"
feature_id: group-list

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GL-001
      scenario: "On mount, get_centers fires with staffId from session and screen shows Content state on success"
      type: ViewModel
      priority: P0

    - id: TC-GL-002
      scenario: "Group list renders all groups from response with correct name, memberCount, and cycleNumber"
      type: Screen
      priority: P0

    - id: TC-GL-003
      scenario: "GREEN health indicator badge renders on groups with overdueRate < 0.05"
      type: Screen
      priority: P0

    - id: TC-GL-004
      scenario: "AMBER health indicator badge renders on groups with 0.05 <= overdueRate < 0.20"
      type: Screen
      priority: P0

    - id: TC-GL-005
      scenario: "RED health indicator badge renders on groups with overdueRate >= 0.20"
      type: Screen
      priority: P0

    - id: TC-GL-006
      scenario: "Tapping a group card navigates to group-dashboard with the correct groupId"
      type: Screen
      priority: P0

    - id: TC-GL-007
      scenario: "Create Group FAB or button navigates to group-create screen"
      type: Screen
      priority: P0

    - id: TC-GL-008
      scenario: "Empty state is shown when pageItems is empty"
      type: Screen
      priority: P1

    - id: TC-GL-009
      scenario: "Search filters group list client-side by group name without API call"
      type: ViewModel
      priority: P1

    - id: TC-GL-010
      scenario: "Search with no matches shows empty filtered state with clear search hint"
      type: Screen
      priority: P1

    - id: TC-GL-011
      scenario: "Pull-to-refresh resets to page 0 and re-fetches groups"
      type: ViewModel
      priority: P1

    - id: TC-GL-012
      scenario: "401 response navigates to login screen"
      type: ViewModel
      priority: P0

    - id: TC-GL-013
      scenario: "Offline with cached data shows groups with offline banner"
      type: ViewModel
      priority: P1

    - id: TC-GL-014
      scenario: "Offline with no cache shows Error state with retry button"
      type: ViewModel
      priority: P1

    - id: TC-GL-015
      scenario: "GroupRepository.getGroups sends correct staffId, limit=20, offset=0 on first load"
      type: Repository
      priority: P0

    - id: TC-GL-016
      scenario: "lastMeetingDate is displayed in a human-readable format (dd MMM yyyy)"
      type: Screen
      priority: P2

    - id: TC-GL-017
      scenario: "500 server error shows retry state with error message"
      type: ViewModel
      priority: P1
