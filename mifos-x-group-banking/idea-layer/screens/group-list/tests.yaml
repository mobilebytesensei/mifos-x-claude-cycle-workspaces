sibling: tests
schema_version: "4.0"
feature_id: group-list
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GL-001
      scenario: "On mount, LoadGroups calls /companion/groups/mine and populates group list"
      type: ViewModel
      priority: P0
      given: "user authenticated; network online"
      when: "GroupListScreen enters composition"
      then: "GET /companion/groups/mine called; groups populated; isLoading flips false; GroupListScreenState=Content"

    - id: TC-GL-002
      scenario: "Each group card renders group_type chip (VSLA/ROSCA/SHG) and viewer role badge"
      type: Screen
      priority: P0
      given: "Content state with 3 groups: VSLA (ORGANIZER), ROSCA (MEMBER), SHG (TREASURER)"
      when: "GroupCard list renders"
      then: "each card shows the correct group_type chip and role badge from API response"

    - id: TC-GL-003
      scenario: "Search query filters groups client-side by name without an API call"
      type: ViewModel
      priority: P0
      given: "groups=['Mwangaza', 'Tumaini', 'Umoja'] loaded"
      when: "OnSearchQueryChange('mwa')"
      then: "filteredGroups contains only 'Mwangaza'; no network call; searchQuery='mwa'"

    - id: TC-GL-004
      scenario: "Tapping a group card navigates to group-dashboard with groupId and viewerRole"
      type: Screen
      priority: P0
      given: "Content state; group id='g2' with viewerRole=ORGANIZER"
      when: "group card tapped"
      then: "NavigateToGroupDashboard emitted with groupId='g2', viewerRole=ORGANIZER"

    - id: TC-GL-005
      scenario: "Empty state shows create and join-with-code CTAs when user has no groups"
      type: Screen
      priority: P0
      given: "load succeeds with groups.isEmpty()"
      when: "Content evaluation runs"
      then: "GroupListScreenState=Empty; Create Group and Join with Code buttons visible"

    - id: TC-GL-006
      scenario: "FAB navigates to group-type-picker to begin group creation"
      type: Screen
      priority: P1
      given: "Content state"
      when: "FAB tapped (OnCreateGroup)"
      then: "NavigateToCreateGroup event emitted; navigation to group-type-picker"

    - id: TC-GL-007
      scenario: "Join group CTA navigates to join-with-code screen"
      type: Screen
      priority: P1
      given: "Content state"
      when: "OnJoinGroup fires"
      then: "NavigateToJoinGroup event emitted"

    - id: TC-GL-008
      scenario: "Pull-to-refresh re-fetches groups from companion API"
      type: ViewModel
      priority: P1
      given: "Content state; isRefreshing=false"
      when: "OnRefresh fires"
      then: "isRefreshing=true; GET /companion/groups/mine re-called; on success isRefreshing=false and Content updated"

    - id: TC-GL-009
      scenario: "Network error shows error state with retry"
      type: Screen
      priority: P1
      given: "GET /companion/groups/mine returns network error"
      when: "load completes"
      then: "GroupListScreenState=Error; retry CTA shown"

    - id: TC-GL-010
      scenario: "Auth 401 redirects to login"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "GET /companion/groups/mine returns 401"
      then: "GroupListError type=Auth redirect=login; NavigateToLogin event emitted"

    - id: TC-GL-011
      scenario: "Shimmer loading skeleton shown while groups are fetching"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "GroupListScreen renders"
      then: "GroupListScreenState=Loading; shimmer placeholders visible; group cards not rendered"

    - id: TC-GL-012
      scenario: "Search returns no results shows empty-search state (not full empty state)"
      type: Screen
      priority: P2
      given: "groups non-empty; searchQuery='zzz' matches nothing"
      when: "filteredGroups.isEmpty() with groups.isNotEmpty()"
      then: "no-results message shown; FAB still visible; full empty state (with join CTA) NOT shown"
