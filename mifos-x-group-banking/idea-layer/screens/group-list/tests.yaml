sibling: tests
schema_version: "4.0"
feature_id: group-list

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GL-001
      scenario: "On mount, getMyGroups fires (userId from auth token, no staffId) and Content renders on success"
      type: ViewModel
      priority: P0
      given: "Auth token present; unified identity resolves userId; no staffId param"
      when: "GroupListScreen enters composition"
      then: "GroupRepository.getMyGroups (/companion/groups/mine) called; isLoading=false; group cards rendered with name, groupType, viewerRole"

    - id: TC-GL-002
      scenario: "Group card renders name, group-type chip, viewer role badge, cycle, member count and last meeting"
      type: Screen
      priority: P0
      given: "Content demo_data: Mwangaza Women's Group VSLA ORGANIZER cycle 1, 20 members, last met 2026-07-14"
      when: "group_card renders"
      then: "group_name_text='Mwangaza Women's Group'; group_type_chip='VSLA'; viewer_role_chip='organizer'; cycle_chip='Cycle 1'; member_count_text='20 members'; last_meeting_text='Last met: 2026-07-14'"

    - id: TC-GL-003
      scenario: "group_type chip renders correct type label per group (VSLA, ROSCA, SHG)"
      type: Screen
      priority: P1
      given: "three groups with groupType VSLA, ROSCA, SHG"
      when: "list renders"
      then: "each group_type_chip shows its groupType value in tertiaryContainer style"

    - id: TC-GL-004
      scenario: "viewer role badge styling differs for ORGANIZER vs member/treasurer"
      type: Screen
      priority: P1
      given: "group-1 viewerRole=ORGANIZER, group-2 viewerRole=MEMBER, group-3 viewerRole=TREASURER"
      when: "Content state rendered"
      then: "ORGANIZER chip uses primaryContainer/onPrimaryContainer; MEMBER and TREASURER chips use default surfaceVariant; labels lowercased"

    - id: TC-GL-005
      scenario: "Health indicator badge maps GREEN/AMBER/RED by overdueRate thresholds"
      type: Screen
      priority: P0
      given: "groups with overdueRate 0.00 (GREEN), 0.12 (AMBER), 0.02 (GREEN)"
      when: "health_indicator_badge renders"
      then: "GREEN badge #C8E6C9/#1B5E20 for overdueRate<0.05; AMBER #FFF9C4/#E65100 for 0.05<=rate<0.20; RED #FFCDD2/#B71C1C for rate>=0.20"

    - id: TC-GL-006
      scenario: "Tapping a group card navigates to group-dashboard passing groupId and viewerRole"
      type: Screen
      priority: P0
      given: "group card with id and viewerRole='ORGANIZER' rendered"
      when: "OnGroupClick fires"
      then: "navigate effect to group-dashboard with groupId and viewerRole so the dashboard resolves organizer vs member surfaces"

    - id: TC-GL-007
      scenario: "Search filters the group list client-side by name without an API call"
      type: ViewModel
      priority: P1
      given: "3 groups loaded; searchQuery entered as 'ROSCA'"
      when: "OnSearch('ROSCA') fires"
      then: "filteredGroups contains only groups whose name matches 'ROSCA' (Jiunge ROSCA Circle); transform_state only, zero network calls"

    - id: TC-GL-008
      scenario: "Clearing search restores the full unfiltered groups list"
      type: ViewModel
      priority: P1
      given: "active searchQuery reduced filteredGroups"
      when: "OnClearSearch fires"
      then: "searchQuery reset to empty; filteredGroups equals full groups list; transform_state only"

    - id: TC-GL-009
      scenario: "Search with no matches shows empty filtered result with clear-search hint"
      type: Screen
      priority: P1
      given: "searchQuery='xyz' matches no group name"
      when: "list re-renders"
      then: "no group cards shown; empty filtered hint prompting to clear the search"

    - id: TC-GL-010
      scenario: "Create Group FAB navigates to group-type-picker (then group-create wizard)"
      type: Screen
      priority: P0
      given: "Content state"
      when: "create_group_fab OnCreateGroup fires"
      then: "navigate effect to group-type-picker so the user selects VSLA/ROSCA/SHG before the create wizard"

    - id: TC-GL-011
      scenario: "Empty state offers both Create Group and Join with Code CTAs under unified identity"
      type: Screen
      priority: P1
      given: "getMyGroups returns an empty list"
      when: "empty state renders"
      then: "empty_state visible with create_group_cta (→ group-type-picker) and join_group_cta (→ join-with-code FR-024)"

    - id: TC-GL-012
      scenario: "Join with Code CTA navigates to join-with-code invite-accept flow"
      type: Screen
      priority: P1
      given: "empty state shown"
      when: "join_group_cta OnJoinGroup fires"
      then: "navigate effect to join-with-code screen for invite-code entry (FR-024)"

    - id: TC-GL-013
      scenario: "Loading state shows shimmer list while groups load from companion API"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "loading state rendered"
      then: "shimmer_list (count 5) shown with top_bar and search_bar; group cards and FAB not yet rendered"

    - id: TC-GL-014
      scenario: "401 response sets Auth error and redirects to login"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "getMyGroups returns 401"
      then: "GroupListError type=Auth (redirect=login); navigation to login triggered"

    - id: TC-GL-015
      scenario: "500 server error shows error state with retry; Retry re-calls getMyGroups"
      type: ViewModel
      priority: P1
      given: "getMyGroups returns 500"
      when: "error_state Retry fires"
      then: "GroupListError type=Server set; error_state shown; Retry re-triggers /companion/groups/mine via GroupRepository; call_api effect asserted"

    - id: TC-GL-016
      scenario: "Offline with cached data shows groups with offline banner"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor offline; cache holds groups"
      when: "on mount"
      then: "cached groups rendered; offline banner shown; no hard error state"

    - id: TC-GL-017
      scenario: "Pull-to-refresh re-fetches groups via getMyGroups"
      type: ViewModel
      priority: P1
      given: "Content state, isRefreshing=false"
      when: "OnRefresh triggered by pull-to-refresh"
      then: "isRefreshing toggles true; getMyGroups re-called; list updated; isRefreshing back to false"

    - id: TC-GL-018
      scenario: "Notifications action emits a deferred-feature snackbar (no navigation)"
      type: ViewModel
      priority: P2
      given: "Content state; notifications centre deferred per release_plan.deferred[]"
      when: "top-bar notifications OnOpenNotifications fires"
      then: "ShowSnackbar informing the member the notifications centre arrives in a later release; no navigation; emit_event effect asserted"

    - id: TC-GL-019
      scenario: "GroupRepository.getMyGroups is userId-scoped, not staffId-scoped"
      type: Repository
      priority: P0
      given: "userId resolved from auth token (self-signup unified identity)"
      when: "getMyGroups called"
      then: "GET /companion/groups/mine; cache key is userId-scoped; no staffId parameter present in request or cache key"
