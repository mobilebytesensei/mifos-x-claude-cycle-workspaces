sibling: tests
schema_version: "4.0"
feature_id: group-list

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GL-001
      scenario: "On mount, get_my_groups fires (auth token resolves userId, no staffId param) and screen shows Content state on success"
      type: ViewModel
      priority: P0
      given: "Auth token present; no staffId required"
      when: "GroupListScreen enters composition"
      then: "GroupRepository.getMyGroups called; isLoading=false; group cards rendered with name, groupType, viewerRole"

    - id: TC-GL-002
      scenario: "Group list renders groups with correct name, memberCount, groupType, and viewerRole from GroupSummaryItem"
      type: Screen
      priority: P0

    - id: TC-GL-003
      scenario: "GREEN health indicator badge renders on groups with overdueRate < 0.05"
      type: Screen
      priority: P0

    - id: TC-GL-004
      scenario: "AMBER health indicator badge renders on groups with 0.05 <= overdueRate < 0.20"
      type: Screen
      priority: P0

    - id: TC-GL-005
      scenario: "RED health indicator badge renders on groups with overdueRate >= 0.20"
      type: Screen
      priority: P0

    - id: TC-GL-006
      scenario: "Tapping a group card navigates to group-dashboard with the correct groupId"
      type: Screen
      priority: P0

    - id: TC-GL-007
      scenario: "Create Group FAB navigates to group-type-picker (then group-create)"
      type: Screen
      priority: P0

    - id: TC-GL-008
      scenario: "Empty state is shown when pageItems is empty"
      type: Screen
      priority: P1

    - id: TC-GL-009
      scenario: "Search filters group list client-side by group name without API call"
      type: ViewModel
      priority: P1

    - id: TC-GL-010
      scenario: "Search with no matches shows empty filtered state with clear search hint"
      type: Screen
      priority: P1

    - id: TC-GL-011
      scenario: "Pull-to-refresh resets offset=0 and re-fetches groups via get_my_groups"
      type: ViewModel
      priority: P1

    - id: TC-GL-012
      scenario: "401 response navigates to login screen"
      type: ViewModel
      priority: P0

    - id: TC-GL-013
      scenario: "Offline with cached data shows groups with offline banner"
      type: ViewModel
      priority: P1

    - id: TC-GL-014
      scenario: "Offline with no cache shows Error state with retry button"
      type: ViewModel
      priority: P1

    - id: TC-GL-015
      scenario: "GroupRepository.getMyGroups uses cache key 'group_list:{userId}:page:0' and sends limit=20, offset=0"
      type: Repository
      priority: P0
      given: "userId resolved from auth token"
      when: "getMyGroups called"
      then: "GET /companion/groups/mine?limit=20&offset=0; cache key is userId-scoped, NOT staffId-scoped"

    - id: TC-GL-016
      scenario: "lastMeetingDate is displayed in a human-readable format (dd MMM yyyy)"
      type: Screen
      priority: P2

    - id: TC-GL-017
      scenario: "500 server error shows retry state with error message"
      type: ViewModel
      priority: P1

    - id: TC-GL-018
      scenario: "Load more (OnLoadMoreTap) appends next page to existing list without clearing current items"
      type: ViewModel
      priority: P1
      given: "Content state, hasNextPage=true, offset=0"
      when: "OnLoadMoreTap action"
      then: "get_my_groups called with offset=20; new items appended to existing list (append_to_existing)"

    - id: TC-GL-019
      scenario: "groupType chip/badge renders correct type label (VSLA, ROSCA, SHG, etc.) from GroupSummaryItem"
      type: Screen
      priority: P1

    - id: TC-GL-020
      scenario: "Organizer groups show ORGANIZER badge; Member groups show MEMBER badge"
      type: Screen
      priority: P1
      given: "viewerRole=ORGANIZER for group-1, viewerRole=MEMBER for group-2"
      when: "Content state rendered"
      then: "group-1 card shows 'Organizer' badge; group-2 card shows 'Member' badge"
