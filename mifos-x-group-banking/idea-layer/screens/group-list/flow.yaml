sibling: flow
schema_version: "4.0"
feature_id: group-list

navigates_to:
  - group-dashboard
  - group-type-picker   # G12 — FAB + empty-state Create CTA go to type-picker first (was stale group-create)
  - join-with-code      # G12 — empty-state Join with Code CTA (FR-024 invite-accept)

flow_logic:
  on_load:
    - action: fetch_groups
      api: get_groups
      on_success: show_content
      on_empty: show_empty
      on_error: show_error
  on_search:
    - action: filter_groups_locally
      description: Client-side filter on group name; no extra API call
  on_refresh:
    - action: fetch_groups
      api: get_groups
      invalidate_cache: true
  on_group_click:
    # G12 — forward viewerRole (group-dashboard requires groupId + viewerRole; was groupId only)
    - navigate: group-dashboard
      params: { groupId: "{group.id}", viewerRole: "{group.viewerRole}" }
  on_create_group:
    # G12 — FAB/Create CTA → group-type-picker (select VSLA/ROSCA/etc.) → then group-create wizard
    - navigate: group-type-picker
  on_join_group:
    # G12 — empty-state Join with Code → invite-code entry (FR-024)
    - navigate: join-with-code
  on_open_notifications:
    # G15 — deferred notifications (no screen yet)
    - emit: NotificationsDeferred
      snackbar_message_key: notifications_deferred

dependencies:
  repositories:
    - name: GroupRepository
      methods:
        - "getGroups(staffId: Long, limit: Int, offset: Int): Flow<List<Group>>"
        - "searchGroups(query: String): Flow<List<Group>>"
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: groups
      schema: SQLDelight Group entity
