<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group List — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { darkMode:'class', theme:{extend:{fontFamily:{display:['Noto Sans','system-ui','sans-serif']}}} };
</script>
<style>
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width:393px; min-height:852px; border-radius:2.5rem; overflow:hidden; position:relative; }
body.embedded { background:#F1F4EF; margin:0; padding:0; min-height:100vh; display:block; }
body.embedded #standalone-toolbar { display:none !important; }
body.embedded #phone-wrapper { display:none !important; }
body.embedded #embedded-content { display:flex !important; flex-direction:column; width:100%; height:100vh; overflow:hidden; background:#F1F4EF; }
.card { background:white; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.group-card { cursor:pointer; transition:transform 0.1s, box-shadow 0.1s; }
.group-card:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(46,125,50,0.12); }
.group-card:active { transform:scale(0.99); }
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.shimmer { background:linear-gradient(90deg,#e8f0e7 25%,#d4e8d2 50%,#e8f0e7 75%); background-size:800px 100%; animation:shimmer 1.5s infinite; border-radius:12px; }
.badge-green { background:#C8E6C9; color:#1B5E20; }
.badge-amber { background:#FFF9C4; color:#E65100; }
.badge-red { background:#FFCDD2; color:#B71C1C; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Group List — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="content">Groups List</option>
    <option value="loading">Loading</option>
    <option value="empty">Empty</option>
    <option value="error">Error</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-[#F1F4EF] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2" style="background:#2E7D32">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-sm text-white">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto" style="height:732px; background:#F1F4EF"></div>
    <div id="bottom-nav"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 shrink-0" style="background:#2E7D32; padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-white">wifi</span>
      <span class="material-symbols-outlined text-sm text-white">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto flex-1" style="background:#F1F4EF"></div>
  <div id="embedded-bottom-nav"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) { document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col'); document.body.classList.add('embedded'); }
function getContentEl() { return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content'); }
function getNavEl() { return isEmbedded ? document.getElementById('embedded-bottom-nav') : document.getElementById('bottom-nav'); }

var groups = [
  { id: '1', name: "Mwangaza Women's Group", cycle: 1, members: 5, lastMet: '28 Apr 2026', health: 'GREEN', overdueRate: '0%', officeName: 'Nairobi HQ' },
  { id: '2', name: 'Tumaini Savings Circle', cycle: 3, members: 12, lastMet: '25 Apr 2026', health: 'AMBER', overdueRate: '12%', officeName: 'Kisumu Branch' },
  { id: '3', name: 'Hazina Women Group', cycle: 2, members: 8, lastMet: '22 Apr 2026', health: 'GREEN', overdueRate: '0%', officeName: 'Nairobi HQ' },
  { id: '4', name: 'Umoja Pamoja VSLA', cycle: 1, members: 6, lastMet: '20 Apr 2026', health: 'RED', overdueRate: '25%', officeName: 'Mombasa Branch' },
  { id: '5', name: 'Tuweze Savings Group', cycle: 4, members: 15, lastMet: '18 Apr 2026', health: 'AMBER', overdueRate: '8%', officeName: 'Nakuru Branch' },
];

function healthBadge(h) {
  var cls = h === 'GREEN' ? 'badge-green' : h === 'AMBER' ? 'badge-amber' : 'badge-red';
  var label = h === 'GREEN' ? 'Healthy' : h === 'AMBER' ? 'At Risk' : 'Critical';
  var icon = h === 'GREEN' ? 'check_circle' : h === 'AMBER' ? 'warning' : 'cancel';
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold ${cls}">
    <span class="material-symbols-outlined text-xs" style="font-variation-settings:'FILL' 1">${icon}</span>${label}
  </span>`;
}

function renderGroupCard(g) {
  // tap: navigates to group-dashboard with groupId
  return `
  <div class="card group-card p-4 mx-4 mb-3" onclick="navigateTo('group-dashboard')">
    <div class="flex items-start justify-between mb-2">
      <div class="flex-1 min-w-0 mr-3">
        <div class="text-base font-bold text-[#1A1C19] truncate">${g.name}</div>
        <div class="text-xs text-[#72796F]">${g.officeName}</div>
      </div>
      ${healthBadge(g.health)}
    </div>
    <div class="flex items-center gap-3 flex-wrap">
      <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold" style="background:#FFE0B2; color:#E65100;">
        Cycle ${g.cycle}
      </span>
      <div class="flex items-center gap-1 text-xs text-[#42493F]">
        <span class="material-symbols-outlined text-sm text-[#2E7D32]">group</span>
        ${g.members} members
      </div>
      <div class="flex items-center gap-1 text-xs text-[#42493F]">
        <span class="material-symbols-outlined text-sm text-[#72796F]">calendar_today</span>
        Last met: ${g.lastMet}
      </div>
    </div>
  </div>`;
}

function renderTopBar() {
  return `<div class="flex items-center px-4 py-3" style="background:#2E7D32">
    <span class="text-lg font-bold text-white flex-1">My Groups</span>
    <span class="material-symbols-outlined text-white cursor-pointer" onclick="showToast('Notifications')">notifications</span>
  </div>`;
}

function renderSearch() {
  return `<div class="px-4 py-3" style="background:#F1F4EF;">
    <div class="flex items-center gap-3 px-4 py-2.5 rounded-2xl bg-white shadow-sm border border-[#C8D8C5]">
      <span class="material-symbols-outlined text-[#72796F]">search</span>
      <input type="text" placeholder="Search groups…" class="flex-1 text-sm outline-none bg-transparent text-[#1A1C19]"
        oninput="filterGroups(this.value)"/>
      <span class="material-symbols-outlined text-[#72796F] cursor-pointer text-sm">close</span>
    </div>
  </div>`;
}

var filteredGroups = groups;
function filterGroups(q) {
  var lower = q.toLowerCase();
  filteredGroups = q ? groups.filter(g => g.name.toLowerCase().includes(lower)) : groups;
  renderGroupsOnly();
}

function renderGroupsOnly() {
  var list = document.getElementById('groups-list');
  if (list) list.innerHTML = filteredGroups.map(renderGroupCard).join('');
}

function renderContent() {
  return `<div>
    ${renderTopBar()}
    ${renderSearch()}
    <div id="groups-list" class="pt-2 pb-24">
      ${groups.map(renderGroupCard).join('')}
    </div>
  </div>`;
}

function renderLoading() {
  return `<div>
    ${renderTopBar()}
    ${renderSearch()}
    <div class="px-4 flex flex-col gap-3 pt-3">
      ${[88,88,88,88,88].map(h=>`<div class="shimmer" style="height:${h}px;"></div>`).join('')}
    </div>
  </div>`;
}

function renderEmpty() {
  return `<div>
    ${renderTopBar()}
    ${renderSearch()}
    <div class="flex flex-col items-center py-16 px-6 text-center">
      <span class="material-symbols-outlined text-5xl text-[#C8E6C9] mb-4">group_off</span>
      <p class="text-lg font-semibold text-[#1A1C19] mb-2">No groups yet</p>
      <p class="text-sm text-[#72796F] mb-6">Create your first savings group to get started.</p>
      <!-- tap: navigates to group-create -->
      <button class="px-6 py-3 rounded-full text-white font-semibold" style="background:#2E7D32;" onclick="navigateTo('group-create')">Create Group</button>
    </div>
  </div>`;
}

function renderError() {
  return `<div>
    ${renderTopBar()}
    <div class="flex flex-col items-center py-16 px-6 text-center">
      <span class="material-symbols-outlined text-5xl text-[#72796F] mb-4">cloud_off</span>
      <p class="text-lg font-semibold text-[#1A1C19] mb-2">Could not load groups</p>
      <p class="text-sm text-[#72796F] mb-6">No internet connection. Showing cached data.</p>
      <button class="px-6 py-3 rounded-full text-white font-semibold" style="background:#2E7D32;" onclick="switchState('content')">Retry</button>
    </div>
  </div>`;
}

function renderBottomNav() {
  var items = [
    { id: 'group-dashboard', icon: 'home', label: 'Dashboard' },
    { id: 'group-list', icon: 'group', label: 'Groups' },
    { id: 'meeting-calendar', icon: 'calendar_month', label: 'Meetings' },
    { id: 'settings', icon: 'settings', label: 'Settings' },
  ];
  getNavEl().innerHTML = '<div class="flex items-center justify-around py-2 bg-white border-t border-slate-100">' +
    items.map(n => `<div class="flex flex-col items-center gap-0.5 cursor-pointer ${n.id==='group-list'?'text-[#2E7D32]':'text-slate-400'}" onclick="navigateTo('${n.id}')">
      <span class="material-symbols-outlined text-xl" ${n.id==='group-list'?'style="font-variation-settings:\'FILL\' 1"':''}>${n.icon}</span>
      <span class="text-[10px]">${n.label}</span>
    </div>`).join('') + '</div>';
}

function renderFab() {
  var existing = document.getElementById('groups-fab'); if(existing) existing.remove();
  var fab = document.createElement('button');
  fab.id='groups-fab';
  fab.className='fixed z-40 flex items-center gap-2 px-5 py-3 rounded-full text-white font-semibold shadow-xl';
  fab.style='bottom:80px;right:16px;background:#2E7D32;';
  fab.innerHTML='<span class="material-symbols-outlined text-xl" style="font-variation-settings:\'FILL\' 1">add</span> New Group';
  // tap: navigates to group-create
  fab.onclick = function() { navigateTo('group-create'); };
  document.body.appendChild(fab);
}

var currentState = 'content';
function switchState(s) {
  currentState = s || 'content';
  document.getElementById('statePicker').value = currentState;
  var existing = document.getElementById('groups-fab'); if(existing) existing.remove();
  var html = '';
  if (s === 'loading') html = renderLoading();
  else if (s === 'empty') html = renderEmpty();
  else if (s === 'error') html = renderError();
  else { html = renderContent(); }
  getContentEl().innerHTML = html;
  renderBottomNav();
  if (s === 'content' || !s) renderFab();
}

function navigateTo(t) {
  if (window !== window.top) window.parent.postMessage({action:'navigate',screenId:t},'*');
  else showToast('Navigate to: '+t);
}
function showToast(msg) {
  var t = document.createElement('div'); t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg'; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),2000);
}
function toggleDark() { document.querySelector('.phone')&&document.querySelector('.phone').classList.toggle('bg-slate-900'); }
window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state||'');
  if(e.data.action==='getInspectorData')notifyParent();
});
function notifyParent() {
  if(window===window.top)return;
  window.parent.postMessage({
    action:'screenLoaded',screenId:'group-list',name:'Group List',
    feature:'group-management',status:'enriched',componentCount:6,
    states:[{id:'content',name:'Groups List'},{id:'loading',name:'Loading'},{id:'empty',name:'Empty'},{id:'error',name:'Error'}],
    inspectorData:{id:'group-list',name:'Group List',feature:'group-management',status:'enriched',
      components:[
        {type:'top-bar',label:'My Groups',target:''},
        {type:'search-bar',label:'Search groups…',target:''},
        {type:'card',label:"Mwangaza Women's Group — Healthy",target:'group-dashboard'},
        {type:'card',label:'Tumaini Savings Circle — At Risk',target:'group-dashboard'},
        {type:'fab',label:'New Group',target:'group-create'},
        {type:'bottom-nav',label:'Admin Navigation',target:''}
      ],states:{},incoming_from:['login','bottom_nav']}
  },'*');
}
switchState('content');
notifyParent();
</script>
</body>
</html>
