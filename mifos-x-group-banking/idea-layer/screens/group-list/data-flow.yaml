sibling: data-flow
schema_version: "2.1.0"
feature_id: group-list

entries:
  - screen_id: groupListScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_centers, transport: rest, method: get }
    tables: []
    dtos:
      - { name: Group, role: response, api_id: get_centers }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "group_list:{staffId}:page:{offset}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "403", behavior: show_error, message_key: error_forbidden }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      Paginated load (page_size=20, offset=0). Empty page items produces Empty state.
      HealthIndicator is derived client-side from overdueRate.
      Search is client-side filter on cached group name — no additional API call.

  - screen_id: groupListScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_centers, transport: rest, method: get }
    tables: []
    dtos:
      - { name: Group, role: response, api_id: get_centers }
    produces_state: Content
    auth_required: true
    cache:
      strategy: network_first
      ttl_seconds: 300
      key_template: "group_list:{staffId}:page:0"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
    notes: >
      Pull-to-refresh resets offset to 0 and invalidates all paginated caches.

  - screen_id: groupListScreen
    trigger: on_background_sync
    endpoints:
      - { api_id: get_centers, transport: rest, method: get }
    tables: []
    dtos:
      - { name: Group, role: response, api_id: get_centers }
    produces_state: Content
    auth_required: true
    cache:
      strategy: network_first
      ttl_seconds: 300
      key_template: "group_list:{staffId}:page:0"
    error_paths: []
    notes: Background sync when app resumes from offline — silently refreshes first page.
