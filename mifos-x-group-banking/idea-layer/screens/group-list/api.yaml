sibling: api
schema_version: "4.0"
feature_id: group-list

api:
  - id: get_my_groups
    function: get_my_groups
    method: get
    endpoint: "/companion/groups/mine"    # COMP-GRP-001 read path — returns all groups for authenticated user including group_type and viewer role per group
    description: >
      Fetch all groups the authenticated user belongs to across all roles (organizer, member, treasurer etc.).
      Response includes group_type and the viewer's role per group from dt_member_role. Replaces raw
      /centers?staffId= Fineract endpoint which was staff-only.
    params:
      paged: { type: Boolean, default: true }
      limit: { type: Int, default: 20 }
      offset: { type: Int, default: 0 }
    response:
      type: object
      fields:
        totalFilteredRecords: Int
        pageItems:
          type: array
          items:
            id: String
            name: String
            groupType: String    # VSLA | ROSCA | ASCA | SILC | SHG | SACCO | CBO | BURIAL | JLG
            viewerRole: String   # ORGANIZER | MEMBER | TREASURER | CHAIRPERSON | SECRETARY
            cycleNumber: Int
            memberCount: Int
            lastMeetingDate: String
            healthIndicator: String   # GREEN | AMBER | RED
            overdueRate: Double
            status: String
    errors:
      401: Unauthorized — session expired
      500: Server error — show retry
    cache:
      ttl: 300
      strategy: stale-while-revalidate
      offline: show_cached
    pagination:
      type: offset
      page_size: 20

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached

dtos:
  Group:
    id: String
    name: String
    groupType: String      # VSLA | ROSCA | ASCA | SILC | SHG | SACCO | CBO | BURIAL | JLG
    viewerRole: String     # ORGANIZER | MEMBER | TREASURER | CHAIRPERSON | SECRETARY
    cycleNumber: Int
    memberCount: Int
    lastMeetingDate: String
    healthIndicator: HealthIndicator  # GREEN | AMBER | RED
    overdueRate: Double
    status: String
    fineractCenterId: Long

  HealthIndicator:
    values: [GREEN, AMBER, RED]
    rules:
      GREEN: overdueRate < 0.05
      AMBER: overdueRate >= 0.05 && overdueRate < 0.20
      RED: overdueRate >= 0.20
