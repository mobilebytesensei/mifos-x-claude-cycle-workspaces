id: group-list
name: Group List
description: >
  Lists ALL groups the authenticated user belongs to across any role (organizer, member, treasurer etc.) under the
  unified-identity model. Each card shows group name + GROUP-TYPE chip (VSLA/ROSCA/etc.) + viewer role badge
  (organizer/member/treasurer) + cycle + member count + health indicator. FAB navigates to group-type-picker (not
  directly to group-create). Empty state offers two CTAs: Create Group (→ type-picker) AND Join with Code (→
  group-join). Data sourced from /companion/groups/mine companion API, which returns group_type and dt_member_role per
  group. Covers FR-021 (self-signup membership), FR-023 (per-group role display).
feature: group-management
