sibling: docs
schema_version: "4.0"
feature_id: group-list
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - has_offline_cache

id: group-list
name: Group List
description: >
  Lists all savings groups (Fineract Centers) managed by the logged-in field officer or treasurer.
  Each card shows group name, cycle, member count, last meeting date, and health indicator
  based on overdue loan rate. Supports search and FAB to create a new group.
feature: group-management
flow: group-management-flow
version: "1.0.0"
tags:
  - group-management
  - admin
  - list
  - offline-first

status: designed
quality_score: 88
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system
  - status: designed
    at: "2026-05-08T23:00:00Z"
    by: /idea export

entry_point: true
bottom_nav:
  visible: true
  selected_tab: groups

legacy_metadata:
  analytics:
    screen_view: group_list_viewed
    events:
      - trigger: group card tap
        name: group_selected
        params: { group_id: String, health_status: String }
      - trigger: FAB tap
        name: create_group_initiated
      - trigger: search input
        name: group_search_performed
        params: { query_length: Int }
      - trigger: pull to refresh
        name: group_list_refreshed
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/group-management/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/group-management/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/group-management/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/group-management/"
