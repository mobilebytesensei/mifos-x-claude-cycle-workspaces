<!DOCTYPE html>
<html lang="en" data-feature="group-list" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-list · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1 class="app-bar-title">My Groups</h1>
    <button class="icon-btn" aria-label="Notifications">🔔</button>
  </header>
  <main>
    <div class="search-bar">
      <input type="search" placeholder="Search groups…">
    </div>

    <div class="card list-item" data-nav-to="group-dashboard">
      <div class="content">
        <div class="name">Mwangaza Women's Group</div>
        <div class="badges-row">
          <span class="chip chip-tertiary">VSLA</span>
          <span class="chip chip-primary">organizer</span>
          <span class="chip chip-secondary">Cycle 1</span>
        </div>
        <div class="meta">20 members · Last met: 14 Jul 2026</div>
      </div>
      <span class="health-dot green" title="Healthy">●</span>
    </div>

    <div class="card list-item" data-nav-to="group-dashboard">
      <div class="content">
        <div class="name">Jiunge ROSCA Circle</div>
        <div class="badges-row">
          <span class="chip chip-tertiary">ROSCA</span>
          <span class="chip chip-primary">member</span>
          <span class="chip chip-secondary">Cycle 3</span>
        </div>
        <div class="meta">10 members · Last met: 10 Jul 2026</div>
      </div>
      <span class="health-dot amber" title="Needs attention">●</span>
    </div>

    <div class="card list-item" data-nav-to="group-dashboard">
      <div class="content">
        <div class="name">Pamoja SHG</div>
        <div class="badges-row">
          <span class="chip chip-tertiary">SHG</span>
          <span class="chip chip-primary">treasurer</span>
          <span class="chip chip-secondary">Cycle 2</span>
        </div>
        <div class="meta">15 members · Last met: 8 Jul 2026</div>
      </div>
      <span class="health-dot green" title="Healthy">●</span>
    </div>
  </main>
  <button class="fab extended" data-nav-to="group-type-picker">＋ New Group</button>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
