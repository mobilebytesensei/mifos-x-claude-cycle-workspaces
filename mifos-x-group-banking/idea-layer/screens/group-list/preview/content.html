<!DOCTYPE html>
<html lang="en" data-feature="group-list" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-list · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1>My Groups</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" aria-label="Notifications" data-action="OnOpenNotifications">🔔</button>
    </div>
  </header>
  <main>
    <div class="form-field">
      <input type="search" placeholder="Search groups…" aria-label="Search groups">
    </div>

    <div class="list">
      <div class="list-item" data-nav-to="group-dashboard" data-nav-params='{"groupId":"grp-mwangaza","viewerRole":"ORGANIZER"}' role="button" tabindex="0" aria-label="Mwangaza Women's Group">
        <div class="avatar">MW</div>
        <div class="main">
          <div class="name">Mwangaza Women's Group</div>
          <div class="meta">
            <span class="chip-static info">VSLA</span>
            <span class="chip-static success">organizer</span>
            <span class="chip-static">Cycle 1</span>
          </div>
          <div class="meta">20 members · Last met: 14 Jul 2026</div>
        </div>
        <span class="chip-static success trail">Healthy</span>
      </div>

      <div class="list-item" data-nav-to="group-dashboard" data-nav-params='{"groupId":"grp-jiunge","viewerRole":"MEMBER"}' role="button" tabindex="0" aria-label="Jiunge ROSCA Circle">
        <div class="avatar">JR</div>
        <div class="main">
          <div class="name">Jiunge ROSCA Circle</div>
          <div class="meta">
            <span class="chip-static info">ROSCA</span>
            <span class="chip-static">member</span>
            <span class="chip-static">Cycle 3</span>
          </div>
          <div class="meta">10 members · Last met: 10 Jul 2026</div>
        </div>
        <span class="chip-static warning trail">At Risk</span>
      </div>

      <div class="list-item" data-nav-to="group-dashboard" data-nav-params='{"groupId":"grp-pamoja","viewerRole":"TREASURER"}' role="button" tabindex="0" aria-label="Pamoja SHG">
        <div class="avatar">PS</div>
        <div class="main">
          <div class="name">Pamoja SHG</div>
          <div class="meta">
            <span class="chip-static info">SHG</span>
            <span class="chip-static">treasurer</span>
            <span class="chip-static">Cycle 2</span>
          </div>
          <div class="meta">15 members · Last met: 8 Jul 2026</div>
        </div>
        <span class="chip-static success trail">Healthy</span>
      </div>
    </div>
  </main>
  <button class="fab extended" data-nav-to="group-type-picker" aria-label="New Group">＋ New Group</button>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
