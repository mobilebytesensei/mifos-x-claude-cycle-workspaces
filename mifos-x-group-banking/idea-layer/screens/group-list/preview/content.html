<!DOCTYPE html>
<html lang="en" data-feature="group-list" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-list · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar"><h1>Groups</h1><button class="icon-btn" data-action="search" aria-label="Search">⌕</button></header>
<main>
  <div class="chip-row" data-component-type="filter_chip_row" data-component-id="c-filters">
    <button class="chip selected">All (3)</button>
    <button class="chip">VSLA</button>
    <button class="chip">ROSCA</button>
    <button class="chip">SHG</button>
    <button class="chip">ASCA</button>
  </div>
  <div class="list" data-component-type="list" data-component-id="c-groups">
    <div class="list-item" data-nav-to="group-dashboard" data-nav-params='{"group_id":"g-001"}'><div class="avatar">M</div><div class="main"><div class="name">Mwangaza VSLA</div><div class="meta">Kibera · 28 members · Cycle 4 wk 14</div></div><div class="trail">KES 84,250</div></div>
    <div class="list-item" data-nav-to="group-dashboard" data-nav-params='{"group_id":"g-002"}'><div class="avatar">T</div><div class="main"><div class="name">Twiga ROSCA</div><div class="meta">Kawangware · 24 members · Cycle 3 wk 22</div></div><div class="trail">KES 62,800</div></div>
    <div class="list-item" data-nav-to="group-dashboard" data-nav-params='{"group_id":"g-003"}'><div class="avatar">I</div><div class="main"><div class="name">Imani SHG</div><div class="meta">Mathare · 18 members · Cycle 2 wk 8</div></div><div class="trail">KES 28,400</div></div>
  </div>
</main>
<button class="fab" data-component-type="fab" data-component-id="c-fab" data-nav-to="group-create" aria-label="Create group">+</button>
<nav class="bottom-nav">
  <button class="nav-item" data-nav-to="admin-dashboard"><span class="nav-icon">⌂</span>Home</button>
  <button class="nav-item active"><span class="nav-icon">⌘</span>Groups</button>
  <button class="nav-item" data-nav-to="loan-list"><span class="nav-icon">⊜</span>Loans</button>
  <button class="nav-item" data-nav-to="meeting-calendar"><span class="nav-icon">▤</span>Meetings</button>
  <button class="nav-item" data-nav-to="sync-status"><span class="nav-icon">⟳</span>Sync</button>
</nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
