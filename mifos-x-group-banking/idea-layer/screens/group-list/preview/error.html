<!DOCTYPE html>
<html lang="en" data-feature="group-list" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-list · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1>My Groups</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" aria-label="Notifications" data-action="OnOpenNotifications">🔔</button>
    </div>
  </header>
  <main>
    <div class="alert alert-danger" role="alert">
      <div>
        <h3>Could not load groups</h3>
        <p>No internet connection. Showing cached data.</p>
      </div>
    </div>
    <div class="empty-state">
      <div class="illus">☁</div>
      <h2>Could not load groups</h2>
      <p>Check your connection and try again.</p>
      <button class="btn btn-primary" data-action="Retry" aria-label="Retry loading groups">↻ Retry</button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
