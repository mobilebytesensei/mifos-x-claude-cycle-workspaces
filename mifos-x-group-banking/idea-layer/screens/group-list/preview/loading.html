<!DOCTYPE html>
<html lang="en" data-feature="group-list" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-list · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* Skeleton shimmer — dimension-only inline shims (attribute-scoped, introduces NO new class into the DS). */
  [data-sk] { background: var(--bg-muted); border-radius: var(--radius-sm); display: block; position: relative; overflow: hidden; }
  [data-sk]::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
    animation: sk-sweep 1.2s infinite; }
  @keyframes sk-sweep { to { transform: translateX(100%); } }
</style>
</head>
