<!DOCTYPE html>
<html lang="en" data-feature="group-list" data-state="empty" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-list · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1>My Groups</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" aria-label="Notifications" data-action="OnOpenNotifications">🔔</button>
    </div>
  </header>
  <main>
    <div class="form-field">
      <input type="search" placeholder="Search groups…" aria-label="Search groups">
    </div>

    <div class="empty-state">
      <div class="illus">👥</div>
      <h2>No groups yet</h2>
      <p>Create a new savings group or join an existing one with an invite code.</p>
      <div class="btn-stack">
        <button class="btn btn-primary btn-full" data-nav-to="group-type-picker">Create Group</button>
        <button class="btn btn-secondary btn-full" data-nav-to="join-with-code">Join with Code</button>
      </div>
    </div>
  </main>
  <button class="fab extended" data-nav-to="group-type-picker" aria-label="New Group">＋ New Group</button>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
