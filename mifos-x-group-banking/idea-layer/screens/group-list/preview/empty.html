<!DOCTYPE html>
<html lang="en" data-feature="group-list" data-state="empty" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>group-list · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1 class="app-bar-title">My Groups</h1>
    <button class="icon-btn" aria-label="Notifications">🔔</button>
  </header>
  <main>
    <div class="empty-state">
      <div class="empty-icon">👥</div>
      <div class="empty-title">No groups yet</div>
      <div class="empty-body">Create a new savings group or join an existing one with an invite code.</div>
      <button class="btn btn-full" data-nav-to="group-type-picker">Create Group</button>
      <button class="btn btn-secondary btn-full" data-nav-to="join-with-code">Join with Code</button>
    </div>
  </main>
  <button class="fab extended" data-nav-to="group-type-picker">＋ New Group</button>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
