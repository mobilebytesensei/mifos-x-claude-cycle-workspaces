<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Savings — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { fontFamily: { display: ['Noto Sans', 'system-ui', 'sans-serif'] } } }
};
</script>
<style>
:root { --primary: #2E7D32; --bg: #F1F4EF; }
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width: 393px; min-height: 852px; border-radius: 2.5rem; overflow: hidden; position: relative; }
body.embedded { background: #F1F4EF; margin: 0; padding: 0; min-height: 100vh; display: block; }
body.embedded #standalone-toolbar { display: none !important; }
body.embedded #phone-wrapper { display: none !important; }
body.embedded #embedded-content { display: flex !important; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; background: #F1F4EF; }
.card { background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.shimmer { background: linear-gradient(90deg,#e8f0e7 25%,#d4e8d2 50%,#e8f0e7 75%); background-size:800px 100%; animation:shimmer 1.5s infinite; border-radius:12px; }
.tab-item { cursor: pointer; padding: 10px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; transition: all 0.2s; }
.tab-active { background: #2E7D32; color: white; }
.tab-inactive { color: #2E7D32; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<!-- Standalone Toolbar -->
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Personal Savings — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="content_group">Group-linked Tab</option>
    <option value="content_individual">Individual Tab</option>
    <option value="loading">Loading</option>
    <option value="error">Error</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<!-- Phone Frame -->
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-[#F1F4EF] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2" style="background:#2E7D32">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-sm text-white">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto" style="height:732px; background:#F1F4EF"></div>
    <div id="bottom-nav"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<!-- Embedded Content -->
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 shrink-0" style="background:#2E7D32; padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-white">wifi</span>
      <span class="material-symbols-outlined text-sm text-white">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto flex-1" style="background:#F1F4EF"></div>
  <div id="embedded-bottom-nav"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) { document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col'); document.body.classList.add('embedded'); }
function getContentEl() { return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content'); }
function getNavEl() { return isEmbedded ? document.getElementById('embedded-bottom-nav') : document.getElementById('bottom-nav'); }

var groupTxns = [
  { label: 'Meeting contribution', date: '28 Apr 2026', amount: '+KES 500', bal: 'KES 9,600', type: 'deposit' },
  { label: 'Meeting contribution', date: '21 Apr 2026', amount: '+KES 500', bal: 'KES 9,100', type: 'deposit' },
  { label: 'Meeting contribution', date: '14 Apr 2026', amount: '+KES 500', bal: 'KES 8,600', type: 'deposit' },
  { label: 'Meeting contribution', date: '7 Apr 2026', amount: '+KES 500', bal: 'KES 8,100', type: 'deposit' },
  { label: 'Meeting contribution', date: '31 Mar 2026', amount: '+KES 500', bal: 'KES 7,600', type: 'deposit' },
  { label: 'Meeting contribution', date: '24 Mar 2026', amount: '+KES 500', bal: 'KES 7,100', type: 'deposit' },
];

var indTxns = [
  { label: 'Individual deposit', date: '25 Apr 2026', amount: '+KES 1,000', bal: 'KES 2,850', type: 'deposit' },
  { label: 'Individual deposit', date: '10 Apr 2026', amount: '+KES 1,000', bal: 'KES 1,850', type: 'deposit' },
  { label: 'Individual deposit', date: '15 Mar 2026', amount: '+KES 850', bal: 'KES 850', type: 'deposit' },
];

function renderTxRow(tx) {
  var isDeposit = tx.type === 'deposit';
  var color = isDeposit ? '#2E7D32' : '#D32F2F';
  var icon = isDeposit ? 'trending_up' : 'trending_down';
  return `<div class="card flex items-center gap-3 p-4">
    <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style="background:${color}15">
      <span class="material-symbols-outlined text-xl" style="color:${color}; font-variation-settings:'FILL' 1">${icon}</span>
    </div>
    <div class="flex-1 min-w-0">
      <div class="text-sm font-semibold text-[#1A1C19]">${tx.label}</div>
      <div class="text-xs text-[#72796F]">${tx.date}</div>
    </div>
    <div class="text-right">
      <div class="text-sm font-bold" style="color:${color}">${tx.amount}</div>
      <div class="text-xs text-[#72796F]">Bal: ${tx.bal}</div>
    </div>
  </div>`;
}

function renderGroupLinked() {
  return `
  <div>
    <!-- Top bar -->
    <div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('personal-dashboard')">arrow_back</span>
      <span class="text-lg font-bold text-white flex-1">My Savings</span>
    </div>
    <!-- Tabs -->
    <div class="flex gap-2 px-4 py-3" style="background:#2E7D32">
      <div class="tab-item tab-active" onclick="switchState('content_group')">
        <span class="material-symbols-outlined text-sm align-middle" style="font-variation-settings:'FILL' 1">groups</span> Group-linked
      </div>
      <div class="tab-item tab-inactive" onclick="switchState('content_individual')">
        <span class="material-symbols-outlined text-sm align-middle">person</span> Individual
      </div>
    </div>
    <!-- Balance hero -->
    <div class="px-4 pb-4 pt-0" style="background:#2E7D32">
      <div class="text-xs text-white/70 mb-1">Group-Linked Savings</div>
      <div class="text-3xl font-bold text-white">KES 9,600</div>
      <div class="text-xs text-white/60 mt-1">Acc: 000100012345</div>
    </div>

    <div class="px-4 flex flex-col gap-3 pb-4 pt-3">
      <!-- Contribution Progress -->
      <div class="card p-4">
        <div class="flex items-center gap-2 mb-3">
          <span class="material-symbols-outlined text-xl" style="color:#2E7D32; font-variation-settings:'FILL' 1">calendar_month</span>
          <span class="text-sm font-semibold text-[#42493F]">Contribution Progress</span>
        </div>
        <div class="flex justify-between text-xs text-[#72796F] mb-1">
          <span>18 / 24 meetings attended</span>
          <span>75%</span>
        </div>
        <div class="w-full h-2 bg-[#C8E6C9] rounded-full mb-3">
          <div class="h-2 rounded-full" style="width:75%; background:#2E7D32;"></div>
        </div>
        <div class="flex justify-between text-xs text-[#72796F]">
          <span>KES 100 min</span>
          <span class="font-semibold text-[#2E7D32]">This cycle: KES 9,600</span>
          <span>KES 500 max</span>
        </div>
      </div>

      <!-- Transactions header -->
      <div class="text-base font-semibold text-[#1A1C19] mt-1">Transaction History</div>
      <!-- GET /self/savingsaccounts/{savingsId}/transactions -->
      ${groupTxns.map(renderTxRow).join('')}
    </div>
  </div>`;
}

function renderIndividual() {
  return `
  <div>
    <div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('personal-dashboard')">arrow_back</span>
      <span class="text-lg font-bold text-white flex-1">My Savings</span>
    </div>
    <div class="flex gap-2 px-4 py-3" style="background:#2E7D32">
      <div class="tab-item tab-inactive" onclick="switchState('content_group')">
        <span class="material-symbols-outlined text-sm align-middle" style="font-variation-settings:'FILL' 1">groups</span> Group-linked
      </div>
      <div class="tab-item tab-active" onclick="switchState('content_individual')">
        <span class="material-symbols-outlined text-sm align-middle">person</span> Individual
      </div>
    </div>
    <div class="px-4 pb-4 pt-0" style="background:#FF8F00">
      <div class="text-xs text-white/70 mb-1">Individual Savings</div>
      <div class="text-3xl font-bold text-white">KES 2,850</div>
      <div class="text-xs text-white/60 mt-1">Acc: 000200098765</div>
    </div>
    <div class="px-4 flex flex-col gap-3 pb-4 pt-3">
      <div class="text-base font-semibold text-[#1A1C19] mt-1">Transaction History</div>
      ${indTxns.map(renderTxRow).join('')}
    </div>
  </div>`;
}

function renderLoading() {
  return `<div>
    <div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('personal-dashboard')">arrow_back</span>
      <span class="text-lg font-bold text-white flex-1">My Savings</span>
    </div>
    <div class="px-4 flex flex-col gap-3 pt-4">
      ${[80,60,56,56,56,56].map(h=>`<div class="shimmer" style="height:${h}px;"></div>`).join('')}
    </div>
  </div>`;
}

function renderError() {
  return `<div>
    <div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('personal-dashboard')">arrow_back</span>
      <span class="text-lg font-bold text-white flex-1">My Savings</span>
    </div>
    <div class="flex flex-col items-center py-16 px-6 text-center">
      <span class="material-symbols-outlined text-5xl text-[#72796F] mb-4">wifi_off</span>
      <p class="text-lg font-semibold text-[#1A1C19] mb-2">Could not load savings</p>
      <p class="text-sm text-[#72796F] mb-6">Check your internet connection and try again.</p>
      <button class="px-6 py-3 rounded-full text-white font-semibold" style="background:#2E7D32;" onclick="switchState('content_group')">Try Again</button>
    </div>
  </div>`;
}

function renderBottomNav() {
  var items = [
    { id: 'personal-dashboard', icon: 'home', label: 'Home' },
    { id: 'personal-savings', icon: 'savings', label: 'Savings' },
    { id: 'personal-loans', icon: 'account_balance', label: 'Loans' },
    { id: 'settings', icon: 'settings', label: 'Settings' },
  ];
  getNavEl().innerHTML = '<div class="flex items-center justify-around py-2 bg-white border-t border-slate-100">' +
    items.map(n => `<div class="flex flex-col items-center gap-0.5 cursor-pointer ${n.id==='personal-savings'?'text-[#2E7D32]':'text-slate-400'}" onclick="navigateTo('${n.id}')">
      <span class="material-symbols-outlined text-xl" ${n.id==='personal-savings'?'style="font-variation-settings:\'FILL\' 1"':''}>${n.icon}</span>
      <span class="text-[10px]">${n.label}</span>
    </div>`).join('') + '</div>';
}

var currentState = 'content_group';
function switchState(s) {
  currentState = s || 'content_group';
  document.getElementById('statePicker').value = currentState;
  var html = '';
  if (s === 'loading') html = renderLoading();
  else if (s === 'error') html = renderError();
  else if (s === 'content_individual') html = renderIndividual();
  else html = renderGroupLinked();
  getContentEl().innerHTML = html;
  renderBottomNav();
}
function navigateTo(t) {
  if (window !== window.top) window.parent.postMessage({action:'navigate',screenId:t},'*');
  else showToast('Navigate to: '+t);
}
function showToast(msg) {
  var t = document.createElement('div'); t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg'; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),2000);
}
function toggleDark() { document.querySelector('.phone')&&document.querySelector('.phone').classList.toggle('bg-slate-900'); }
window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state||'');
  if(e.data.action==='getInspectorData')notifyParent();
});
function notifyParent() {
  if(window===window.top)return;
  window.parent.postMessage({
    action:'screenLoaded',screenId:'personal-savings',name:'Personal Savings',
    feature:'end-user-dashboard',status:'enriched',componentCount:7,
    states:[{id:'content_group',name:'Group-linked'},{id:'content_individual',name:'Individual'},{id:'loading',name:'Loading'},{id:'error',name:'Error'}],
    inspectorData:{id:'personal-savings',name:'Personal Savings',feature:'end-user-dashboard',status:'enriched',
      components:[
        {type:'top-bar',label:'My Savings',target:'personal-dashboard'},
        {type:'chip',label:'Tabs: Group-linked / Individual',target:''},
        {type:'card',label:'Balance KES 9,600',target:''},
        {type:'card',label:'Contribution Progress 75%',target:''},
        {type:'list',label:'Transaction History',target:''}
      ],states:{},incoming_from:['personal-dashboard']}
  },'*');
}
switchState('content_group');
notifyParent();
</script>
</body>
</html>
