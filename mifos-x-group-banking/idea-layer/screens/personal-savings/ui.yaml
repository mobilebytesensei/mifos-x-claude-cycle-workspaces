sibling: ui
schema_version: "4.0"
feature_id: personal-savings

route: /savings
entry_points:
  - source: personal-dashboard
    trigger: user_taps_savings_card
nav_params:
  clientId: { type: Long, required: true }
  groupLinkedSavingsId: { type: Long, required: true }
  individualSavingsId: { type: "Long?", required: false }

screens:
  - id: personal-savings-screen
    name: PersonalSavingsScreen
    type: list
    description: Tabbed savings detail with group-linked and individual accounts

state_model:
  PersonalSavingsViewModel:
    state:
      name: PersonalSavingsState
      fields:
        clientId: { type: Long, default: "0L" }
        groupLinkedSavingsId: { type: Long, default: "0L" }
        individualSavingsId: { type: "Long?", default: "null" }
        selectedTab: { type: SavingsTab, default: "SavingsTab.GROUP_LINKED" }
        groupLinkedBalance: { type: Double, default: "0.0" }
        individualBalance: { type: Double, default: "0.0" }
        groupLinkedTransactions: { type: "List<SavingsTransactionDto>", default: "emptyList()" }
        individualTransactions: { type: "List<SavingsTransactionDto>", default: "emptyList()" }
        contributionTarget: { type: Double, default: "500.0" }
        meetingsAttended: { type: Int, default: "0" }
        totalMeetings: { type: Int, default: "0" }
        isLoading: { type: Boolean, default: "true" }
        isRefreshing: { type: Boolean, default: "false" }
        error: { type: "SavingsError?", default: "null" }
    screen_state:
      name: PersonalSavingsScreenState
      members: [Loading, Content, Error]
    errors:
      name: SavingsError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Unauthorized, retry: false, message_key: error_session_expired }
    events:
      name: PersonalSavingsEvent
      members:
        - { name: NavigateBack }
    actions:
      name: PersonalSavingsAction
      members:
        - { name: OnTabSelected, params: { tab: SavingsTab }, trigger: "Tap tab" }
        - { name: OnRefresh, trigger: "Pull-to-refresh" }
        - { name: OnRetry, trigger: "Tap Retry button" }
    di:
      - SavingsRepository
      - SessionManager

components:
  - id: top_bar
    type: top-bar
    title: "My Savings"
    style: { background: primary, elevation: 0dp, text_color: onPrimary }
    navigation_icon: arrow_left_24_regular
    on_navigation_click: { action: NavigateBack, target: personal-dashboard }

  - id: savings_tab_row
    type: chip-group
    selection: single
    chips:
      - { id: group_linked_tab, label: "Group-linked", value: GROUP_LINKED }
      - { id: individual_tab, label: "Individual", value: INDIVIDUAL, visible_when: "individualSavingsId != null" }
    style:
      background: primaryContainer
      selected_background: primary
      selected_text_color: onPrimary
      unselected_text_color: onPrimaryContainer
      corner_radius: full
      margin_horizontal: 16dp
    on_click: { action: OnTabSelected, target: state.selectedTab }

  - id: balance_hero_card
    type: card
    style:
      background: primary
      corner_radius: lg
      padding: 24dp
      margin_horizontal: 16dp
      elevation: 0dp
    content:
      - id: balance_label
        type: text
        style: { text_style: labelLarge, color: onPrimary, opacity: 0.8 }
        value: "{{selectedTab == GROUP_LINKED ? 'Group-Linked Savings' : 'Individual Savings'}}"
      - id: balance_amount
        type: text
        style: { text_style: displaySmall, color: onPrimary, font_weight: bold }
        value: "KES {{selectedTab == GROUP_LINKED ? groupLinkedBalance : individualBalance | number}}"
      - id: account_number_text
        type: text
        style: { text_style: labelMedium, color: onPrimary, opacity: 0.7 }
        value: "Acc: {{selectedTab == GROUP_LINKED ? groupLinkedSavingsId : individualSavingsId}}"

  - id: contribution_progress_card
    type: card
    visible_when: "selectedTab == GROUP_LINKED"
    style:
      background: surface
      corner_radius: lg
      elevation: 2dp
      padding: 16dp
      margin_horizontal: 16dp
      margin_bottom: 12dp
    content:
      - id: progress_icon
        type: icon
        icon: calendar_checkmark_24_filled
        tint: primary
      - id: progress_label
        type: text
        style: { text_style: labelLarge, color: onSurfaceVariant }
        value: "Contribution Progress"
      - id: meetings_progress_text
        type: text
        style: { text_style: bodyMedium, color: onSurface }
        value: "{{meetingsAttended}} / {{totalMeetings}} meetings"
      - id: meetings_progress_bar
        type: linear-progress
        value: "{{meetingsAttended / totalMeetings}}"
        style: { track_color: primaryContainer, indicator_color: primary, height: 8dp, corner_radius: full }
      - id: contribution_range_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "This cycle: KES {{groupLinkedBalance | number}}"

  - id: transactions_header
    type: text
    style: { text_style: titleMedium, color: onSurface, font_weight: semibold, margin_horizontal: 16dp, margin_top: 8dp }
    value: "Transaction History"

  - id: transaction_list_item
    type: list-item
    style: { min_touch_target: 48dp, divider: true }
    content:
      leading:
        id: txn_icon
        type: icon-container
        icon:
          deposit: arrow_trending_up_24_filled
          withdrawal: arrow_trending_down_24_filled
        tint:
          deposit: primary
          withdrawal: error
        style: { background: surfaceVariant, shape: circle, size: 40dp }
      headline:
        type: text
        style: { text_style: bodyLarge, color: onSurface }
        value: "{{transaction.transactionType.description}}"
      supporting:
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "{{transaction.date | date}}"
      trailing:
        type: column
        children:
          - id: txn_amount
            type: text
            style:
              text_style: bodyLarge
              color:
                deposit: primary
                withdrawal: error
              font_weight: semibold
            value:
              deposit: "+KES {{transaction.amount | number}}"
              withdrawal: "-KES {{transaction.amount | number}}"
          - id: running_balance
            type: text
            style: { text_style: labelSmall, color: outline }
            value: "Balance: KES {{transaction.runningBalance | number}}"

  - id: empty_individual_promo
    type: empty-state
    icon: piggy_bank_24_filled
    title: "No individual savings yet"
    body: "Speak to your group treasurer to open an individual savings account."
    visible_when: "selectedTab == INDIVIDUAL && individualSavingsId == null"
    style: { background: secondaryContainer, corner_radius: lg, padding: 24dp, margin_horizontal: 16dp }

  - id: shimmer_loading
    type: shimmer
    count: 6
    visible: "{{isLoading}}"
    style: { height: 56dp, corner_radius: md, margin_horizontal: 16dp }

  - id: error_state
    type: error-state
    icon: wifi_off_24_filled
    title: "Could not load savings"
    body: "Check your internet connection and try again."
    cta_label: "Try Again"
    on_click: { action: OnRetry }

states:
  initial_state: loading
  loading:
    components: [top_bar, savings_tab_row, shimmer_loading]
    description: "Fetching savings account data"
  content:
    components: [top_bar, savings_tab_row, balance_hero_card, contribution_progress_card, transactions_header, transaction_list_item]
    description: "Data loaded — balance card, progress, transactions shown"
  error:
    components: [top_bar, savings_tab_row, error_state]
    description: "Load failed"

i18n:
  en:
    screen_title: "My Savings"
    group_linked_tab: "Group-linked"
    individual_tab: "Individual"
    group_linked_balance_label: "Group-Linked Savings"
    individual_balance_label: "Individual Savings"
    contribution_progress_label: "Contribution Progress"
    transaction_history_label: "Transaction History"
    no_individual_savings_title: "No individual savings yet"
    no_individual_savings_subtitle: "Speak to your group treasurer to open an individual savings account."
    error_title: "Could not load savings"
    error_subtitle: "Check your internet connection and try again."
    retry_button: "Try Again"
