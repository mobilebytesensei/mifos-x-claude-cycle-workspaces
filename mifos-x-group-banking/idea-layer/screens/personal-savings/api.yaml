sibling: api
schema_version: "4.0"
feature_id: personal-savings

api:
  - id: get_group_linked_transactions
    function: get_savings_transactions
    method: get
    endpoint: "/self/savingsaccounts/{savingsId}/transactions"
    description: Get transaction history for the group-linked savings account
    params:
      savingsId: { type: Long, required: true, source: nav_params.groupLinkedSavingsId }
      limit: { type: Int, required: false, default: 50 }
      offset: { type: Int, required: false, default: 0 }
    response:
      type: array
      items:
        id: Long
        transactionType: { value: Int, code: String, description: String }
        date: "List<Int>"
        amount: Double
        runningBalance: Double
        currency: { code: String, displaySymbol: String }
    errors:
      401: Session expired
      404: Account not found
      503: Server unavailable
    cache: { ttl: 300, strategy: stale-while-revalidate, offline: use_sqldelight }

  - id: get_individual_transactions
    function: get_individual_savings_transactions
    method: get
    endpoint: "/self/savingsaccounts/{savingsId}/transactions"
    description: Get transaction history for the individual voluntary savings account
    params:
      savingsId: { type: Long, required: true, source: nav_params.individualSavingsId }
      limit: { type: Int, required: false, default: 50 }
      offset: { type: Int, required: false, default: 0 }
    response:
      type: array
      items:
        id: Long
        transactionType: { value: Int, code: String, description: String }
        date: "List<Int>"
        amount: Double
        runningBalance: Double
        currency: { code: String, displaySymbol: String }
    errors:
      401: Session expired
      404: Account not found
      503: Server unavailable
    cache: { ttl: 300, strategy: stale-while-revalidate, offline: use_sqldelight }

dtos:
  SavingsTransactionDto:
    id: Long
    transactionType: TransactionTypeDto
    date: "List<Int>"
    amount: Double
    runningBalance: Double
    currency: CurrencyDto

  TransactionTypeDto:
    value: Int
    code: String
    description: String

  CurrencyDto:
    code: String
    displaySymbol: String

  SavingsTab:
    values: [GROUP_LINKED, INDIVIDUAL]

cache_strategy:
  ttl: 300
  strategy: stale-while-revalidate
  offline: use_sqldelight

dependencies:
  repositories:
    - name: SavingsRepository
      methods:
        - "getSavingsTransactions(savingsId: Long, limit: Int, offset: Int): Flow<List<SavingsTransactionDto>>"
  services:
    - SessionManager
    - NetworkMonitor
  local_db:
    - table: savings_transactions
      schema: SQLDelight SavingsTransaction entity
