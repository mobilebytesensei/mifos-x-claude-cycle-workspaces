sibling: tests
schema_version: "4.0"
feature_id: personal-savings

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-PS-001
      scenario: "Screen loads group-linked tab by default with transactions"
      type: ViewModel
      priority: P0
      given: "clientId=101, groupLinkedSavingsId=2001, individualSavingsId=2050"
      when: "Screen mounts"
      then: "get_group_linked_transactions called with savingsId=2001; selectedTab=GROUP_LINKED; groupLinkedBalance=3500.00; 8 transactions loaded"

    - id: TC-PS-002
      scenario: "Balance hero card shows correct label and amount for group-linked tab"
      type: Screen
      priority: P0
      given: "selectedTab=GROUP_LINKED, groupLinkedBalance=3500.00"
      when: "Screen renders balance_hero_card"
      then: "balance_label='Group-Linked Savings', balance_amount='KES 3,500.00'"

    - id: TC-PS-003
      scenario: "Switching to Individual tab loads individual transactions (single API call)"
      type: ViewModel
      priority: P0
      given: "selectedTab=GROUP_LINKED, individualSavingsId=2050, individualTransactions not yet fetched"
      when: "OnTabSelected dispatched with tab=INDIVIDUAL"
      then: "selectedTab=INDIVIDUAL, get_individual_transactions called with savingsId=2050, 3 transactions loaded"

    - id: TC-PS-004
      scenario: "Switching back to Group-Linked tab does not re-fetch (cached)"
      type: ViewModel
      priority: P1
      given: "Both tabs previously loaded, selectedTab=INDIVIDUAL"
      when: "OnTabSelected dispatched with tab=GROUP_LINKED"
      then: "selectedTab=GROUP_LINKED, no additional API call, groupLinkedTransactions shown from memory"

    - id: TC-PS-005
      scenario: "Individual tab hidden when individualSavingsId is null"
      type: Screen
      priority: P1
      given: "individualSavingsId=null"
      when: "Screen renders savings_tab_row"
      then: "individual_tab chip not visible"

    - id: TC-PS-006
      scenario: "Contribution progress card shows 14/16 meetings with progress bar"
      type: Screen
      priority: P1
      given: "selectedTab=GROUP_LINKED, meetingsAttended=14, totalMeetings=16"
      when: "Screen renders contribution_progress_card"
      then: "meetings_progress_text='14 / 16 meetings', meetings_progress_bar value=0.875"

    - id: TC-PS-007
      scenario: "Contribution progress card hidden on Individual tab"
      type: Screen
      priority: P1
      given: "selectedTab=INDIVIDUAL"
      when: "Screen renders"
      then: "contribution_progress_card not visible"

    - id: TC-PS-008
      scenario: "Transaction list shows DEPOSIT type with correct icon and amount"
      type: Screen
      priority: P0
      given: "Transaction with transactionType.code='savingsTransactionType.deposit', amount=500.00"
      when: "Screen renders transaction_list_item"
      then: "txn_icon shows arrow_upward with primary tint, amount='+ KES 500.00'"

    - id: TC-PS-009
      scenario: "Interest posting transaction shows bank icon with secondary tint"
      type: Screen
      priority: P2
      given: "Transaction with transactionType.code='savingsTransactionType.interestPosting', amount=12.50"
      when: "Screen renders transaction_list_item"
      then: "txn_icon shows account_balance with secondary tint, amount='+ KES 12.50'"

    - id: TC-PS-010
      scenario: "Pull-to-refresh reloads active tab transactions bypassing cache"
      type: ViewModel
      priority: P1
      given: "selectedTab=GROUP_LINKED"
      when: "OnRefresh dispatched"
      then: "isRefreshing=true, get_group_linked_transactions called bypassing 300s cache, isRefreshing=false"

    - id: TC-PS-011
      scenario: "Network error shows error state with retry"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, no cache"
      when: "Screen mounts"
      then: "SavingsError.Network set, error_state visible with retry CTA"

    - id: TC-PS-012
      scenario: "Offline shows cached transactions with informational snackbar"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false, valid SQLDelight cache for groupLinkedSavingsId=2001"
      when: "Screen mounts"
      then: "Content state from cache, ShowSnackbar with error_network message"

    - id: TC-PS-013
      scenario: "Back tap navigates to personal-dashboard"
      type: ViewModel
      priority: P2
      given: "Content state"
      when: "NavigateBack dispatched"
      then: "NavigateBack event emitted, returns to personal-dashboard"
