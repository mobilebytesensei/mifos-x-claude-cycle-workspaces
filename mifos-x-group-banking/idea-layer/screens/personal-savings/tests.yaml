sibling: tests
schema_version: "4.0"
feature_id: personal-savings

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PS-001
      scenario: "Screen loads group-linked tab by default with transactions"
      type: ViewModel
      priority: P0
      given: "clientId=101, groupLinkedSavingsId=2001, individualSavingsId=2050, cache empty"
      when: "Screen mounts"
      then: "get_group_linked_transactions called with savingsId=2001; selectedTab=GROUP_LINKED; groupLinkedBalance=3500.00; 8 transactions loaded; screen_state=Content"

    - id: TC-PS-002
      scenario: "Balance hero card shows correct label and amount for group-linked tab"
      type: Screen
      priority: P0
      given: "selectedTab=GROUP_LINKED, groupLinkedBalance=3500.00, groupLinkedSavingsId=2001"
      when: "Screen renders balance_hero_card"
      then: "balance_label='Group-Linked Savings', balance_amount='KES 3,500.00', account_number_text='Acc: 2001'"

    - id: TC-PS-003
      scenario: "Switching to Individual tab lazily loads individual transactions (single API call)"
      type: ViewModel
      priority: P0
      given: "selectedTab=GROUP_LINKED, individualSavingsId=2050, individualTransactions=emptyList()"
      when: "OnTabSelected dispatched with tab=INDIVIDUAL"
      then: "selectedTab=INDIVIDUAL, get_individual_transactions called with savingsId=2050, 3 transactions loaded"

    - id: TC-PS-004
      scenario: "Switching back to Group-Linked tab does not re-fetch (cached in memory)"
      type: ViewModel
      priority: P1
      given: "Both tabs previously loaded, selectedTab=INDIVIDUAL"
      when: "OnTabSelected dispatched with tab=GROUP_LINKED"
      then: "selectedTab=GROUP_LINKED, zero additional API calls, groupLinkedTransactions rebound from memory (pure transform_state)"

    - id: TC-PS-005
      scenario: "Individual tab chip hidden when individualSavingsId is null"
      type: Screen
      priority: P1
      given: "individualSavingsId=null"
      when: "Screen renders savings_tab_row"
      then: "individual_tab chip not visible (visible_when 'individualSavingsId != null' false)"

    - id: TC-PS-006
      scenario: "Empty individual promo shown when Individual tab selected but no account exists"
      type: Screen
      priority: P1
      given: "selectedTab=INDIVIDUAL, individualSavingsId=null"
      when: "Screen renders"
      then: "empty_individual_promo visible with 'No individual savings yet' title and treasurer guidance body"

    - id: TC-PS-007
      scenario: "Contribution progress card shows 14/16 meetings with progress bar on group tab"
      type: Screen
      priority: P1
      given: "selectedTab=GROUP_LINKED, meetingsAttended=14, totalMeetings=16"
      when: "Screen renders contribution_progress_card"
      then: "meetings_progress_text='14 / 16 meetings', meetings_progress_bar value=0.875"

    - id: TC-PS-008
      scenario: "Contribution progress card hidden on Individual tab"
      type: Screen
      priority: P1
      given: "selectedTab=INDIVIDUAL"
      when: "Screen renders"
      then: "contribution_progress_card not visible (visible_when 'selectedTab == GROUP_LINKED' false)"

    - id: TC-PS-009
      scenario: "Deposit transaction shows up-trend icon in primary tint with +amount"
      type: Screen
      priority: P0
      given: "Transaction with transactionType deposit, amount=500.00, runningBalance=3500.00"
      when: "Screen renders transaction_list_item"
      then: "txn_icon=arrow_trending_up_24_filled with primary tint, txn_amount='+KES 500.00', running_balance='Balance: KES 3,500.00'"

    - id: TC-PS-010
      scenario: "Withdrawal transaction shows down-trend icon in error tint with -amount"
      type: Screen
      priority: P0
      given: "Transaction with transactionType withdrawal, amount=200.00, runningBalance=3300.00"
      when: "Screen renders transaction_list_item"
      then: "txn_icon=arrow_trending_down_24_filled with error tint, txn_amount='-KES 200.00'"

    - id: TC-PS-011
      scenario: "Loading state renders 6 shimmer rows while fetching"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "Loading state rendered"
      then: "shimmer_loading visible with count=6; top_bar and savings_tab_row shown; transactions hidden"

    - id: TC-PS-012
      scenario: "Pull-to-refresh reloads active tab transactions bypassing 300s cache"
      type: ViewModel
      priority: P1
      given: "selectedTab=GROUP_LINKED, cached within TTL"
      when: "OnRefresh dispatched"
      then: "isRefreshing=true, get_group_linked_transactions re-fetched bypassing 300s cache, isRefreshing=false"

    - id: TC-PS-013
      scenario: "Network error with no cache shows error state with retry"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, no SQLDelight cache for savingsId=2001"
      when: "Screen mounts"
      then: "state.error=SavingsError.Network(retry=true), screen_state=Error, error_state visible with 'Try Again' CTA"

    - id: TC-PS-014
      scenario: "Error-state retry re-fetches active tab via Store5 cache bypass"
      type: ViewModel
      priority: P1
      given: "screen_state=Error, NetworkMonitor.isOnline=true, selectedTab=GROUP_LINKED"
      when: "OnRetry dispatched from error_state"
      then: "get_group_linked_transactions re-fetched through Store5 (call_api effect gated by cmp-network-monitor), Content state restored on success"

    - id: TC-PS-015
      scenario: "Offline mount serves cached transactions (stale-while-revalidate)"
      type: Repository
      priority: P1
      given: "NetworkMonitor.isOnline=false, valid SQLDelight cache for groupLinkedSavingsId=2001"
      when: "getSavingsTransactions(savingsId=2001, limit=50, offset=0) collected"
      then: "Flow emits cached transactions offline (fallback), no HTTP call, Content state rendered from cache"

    - id: TC-PS-016
      scenario: "Server 503 falls back to cache with informational snackbar"
      type: ViewModel
      priority: P1
      given: "get_group_linked_transactions returns 503, valid cache present"
      when: "Screen mounts"
      then: "Content state served from cache, informational snackbar shown with error_network message"

    - id: TC-PS-017
      scenario: "Unauthorized 401 sets non-retryable error and navigates to login"
      type: ViewModel
      priority: P0
      given: "Self-service token expired"
      when: "get_group_linked_transactions returns 401"
      then: "state.error=SavingsError.Unauthorized(retry=false), navigate to login"

    - id: TC-PS-018
      scenario: "Back tap navigates to personal-dashboard"
      type: ViewModel
      priority: P2
      given: "Content state"
      when: "NavigateBack dispatched from top_bar navigation icon"
      then: "NavigateBack event emitted, returns to personal-dashboard, no state persisted"
