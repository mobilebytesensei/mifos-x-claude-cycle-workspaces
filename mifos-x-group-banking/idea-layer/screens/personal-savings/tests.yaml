sibling: tests
schema_version: "4.0"
feature_id: personal-savings
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PS-001
      scenario: "On mount, savings accounts load with 300s SWR cache from SavingsRepository"
      type: ViewModel
      priority: P0
      given: "authenticated user; network online; no cached data"
      when: "PersonalSavingsScreen enters composition"
      then: "SavingsRepository.getPersonalSavingsAccounts called; cache set with 300s TTL; PersonalSavingsScreenState=Content"

    - id: TC-PS-002
      scenario: "Cached data served within 300s without network call"
      type: ViewModel
      priority: P1
      given: "cache fresher than 300s"
      when: "PersonalSavingsScreen enters composition"
      then: "no new network call; stale-while-revalidate serves cached savings data"

    - id: TC-PS-003
      scenario: "GROUP_LINKED tab shows savings linked to group memberships"
      type: Screen
      priority: P0
      given: "Content state; selectedTab=GROUP_LINKED; accounts=[{groupName:'Amani VSLA', balance:6000}]"
      when: "GroupLinkedTab renders"
      then: "group savings account row shows 'Amani VSLA' and KES 6,000"

    - id: TC-PS-004
      scenario: "INDIVIDUAL tab shows non-group savings accounts"
      type: Screen
      priority: P0
      given: "Content state"
      when: "OnTabChange(SavingsTab.INDIVIDUAL) fires"
      then: "selectedTab=INDIVIDUAL; individual savings accounts shown; group-linked accounts hidden"

    - id: TC-PS-005
      scenario: "No money-moves actions available (read-only screen)"
      type: Screen
      priority: P0
      given: "Content state"
      when: "PersonalSavingsScreen renders"
      then: "no Deposit/Withdraw/Transfer buttons; all actions are navigation-only (View Details)"

    - id: TC-PS-006
      scenario: "Tapping account row navigates to member-savings-detail"
      type: Screen
      priority: P1
      given: "Content state; account.id=7"
      when: "OnViewSavingsDetail(7) fires"
      then: "NavigateToMemberSavingsDetail emitted with savingsAccountId=7"

    - id: TC-PS-007
      scenario: "Pull-to-refresh forces fresh network fetch bypassing SWR cache"
      type: ViewModel
      priority: P1
      given: "Content state; cache fresh"
      when: "OnRefresh fires"
      then: "isRefreshing=true; SWR cache invalidated; SavingsRepository.getPersonalSavingsAccounts re-fetched from network; isRefreshing=false"

    - id: TC-PS-008
      scenario: "Error state shows retry on network failure"
      type: Screen
      priority: P1
      given: "SavingsRepository.getPersonalSavingsAccounts returns network error"
      when: "load completes"
      then: "PersonalSavingsScreenState=Error; retry CTA shown"
