<!DOCTYPE html>
<html lang="en" data-feature="personal-savings" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>personal-savings · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .top-app-bar-primary { background: var(--primary-700); }
  .top-app-bar-primary .app-bar-title { font-size: 15px; color: #fff; }
  .top-app-bar-primary .icon-btn { color: #fff; }

  main { padding: 0 0 24px; }

  .savings-tab-row { background: var(--primary-700); padding: 0 var(--space-base) var(--space-base); display: flex; gap: var(--space-sm); }
  .savings-tab { flex: 1; text-align: center; padding: 8px 0; border-radius: 9999px; font-size: 13px; font-weight: 600; border: none; }
  .savings-tab.active { background: #fff; color: var(--primary-700); }
  .savings-tab.inactive { background: rgba(255,255,255,.18); color: #fff; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar top-app-bar-primary">
    <button class="icon-btn back-btn" aria-label="Back" data-nav-to="personal-dashboard">‹</button>
    <h1 class="app-bar-title">My Savings</h1>
  </header>
  <div class="savings-tab-row">
    <button class="savings-tab active">Group-linked</button>
    <button class="savings-tab inactive">Individual</button>
  </div>
  <main>
    <div class="empty-state">
      <div class="illus">📡</div>
      <h2>Could not load savings</h2>
      <p>Check your internet connection and try again.</p>
      <button class="btn btn-primary btn-full" data-state-to="loading">Try Again</button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
