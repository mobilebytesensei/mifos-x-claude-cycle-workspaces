<!DOCTYPE html>
<html lang="en" data-feature="personal-savings" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>personal-savings · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .top-app-bar-primary { background: var(--primary-700); }
  .top-app-bar-primary .app-bar-title { font-size: 15px; color: #fff; }
  .top-app-bar-primary .icon-btn { color: #fff; }

  main { padding: 0 0 24px; }

  .savings-tab-row { background: var(--primary-700); padding: 0 var(--space-base) var(--space-xl); display: flex; gap: var(--space-sm); }
  .savings-tab { flex: 1; text-align: center; padding: 8px 0; border-radius: 9999px; font-size: 13px; font-weight: 600; border: none; }
  .savings-tab.active { background: #fff; color: var(--primary-700); }
  .savings-tab.inactive { background: rgba(255,255,255,.18); color: #fff; }

  /* Shimmer */
  .shimmer { background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-sm); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Balance hero skeleton — overlaps tab row */
  .balance-hero-skel { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-lg); margin: calc(-1 * var(--space-lg)) var(--space-base) var(--space-base); box-shadow: 0 2px 8px rgba(0,0,0,.12); }

  .txn-skel-list { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); overflow: hidden; margin: var(--space-md) var(--space-base) 0; }
  .txn-skel-row { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--border-subtle); min-height: 56px; }
  .txn-skel-row:last-child { border-bottom: none; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar top-app-bar-primary">
    <button class="icon-btn back-btn" aria-label="Back" data-nav-to="personal-dashboard">‹</button>
    <h1 class="app-bar-title">My Savings</h1>
  </header>
  <div class="savings-tab-row">
    <button class="savings-tab active">Group-linked</button>
    <button class="savings-tab inactive">Individual</button>
  </div>
  <main>
    <!-- Balance hero skeleton -->
    <div class="balance-hero-skel">
      <div class="shimmer" style="height:12px;width:45%;margin-bottom:var(--space-sm);"></div>
      <div class="shimmer" style="height:30px;width:55%;margin-bottom:var(--space-sm);"></div>
      <div class="shimmer" style="height:11px;width:30%;"></div>
    </div>

    <!-- Transaction list skeleton — 6 shimmer rows -->
    <div class="txn-skel-list">
      <div class="txn-skel-row"><div class="shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;"></div><div style="flex:1;"><div class="shimmer" style="height:14px;width:55%;margin-bottom:6px;"></div><div class="shimmer" style="height:11px;width:35%;"></div></div><div class="shimmer" style="width:60px;height:14px;"></div></div>
      <div class="txn-skel-row"><div class="shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;"></div><div style="flex:1;"><div class="shimmer" style="height:14px;width:55%;margin-bottom:6px;"></div><div class="shimmer" style="height:11px;width:35%;"></div></div><div class="shimmer" style="width:60px;height:14px;"></div></div>
      <div class="txn-skel-row"><div class="shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;"></div><div style="flex:1;"><div class="shimmer" style="height:14px;width:55%;margin-bottom:6px;"></div><div class="shimmer" style="height:11px;width:35%;"></div></div><div class="shimmer" style="width:60px;height:14px;"></div></div>
      <div class="txn-skel-row"><div class="shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;"></div><div style="flex:1;"><div class="shimmer" style="height:14px;width:55%;margin-bottom:6px;"></div><div class="shimmer" style="height:11px;width:35%;"></div></div><div class="shimmer" style="width:60px;height:14px;"></div></div>
      <div class="txn-skel-row"><div class="shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;"></div><div style="flex:1;"><div class="shimmer" style="height:14px;width:55%;margin-bottom:6px;"></div><div class="shimmer" style="height:11px;width:35%;"></div></div><div class="shimmer" style="width:60px;height:14px;"></div></div>
      <div class="txn-skel-row"><div class="shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;"></div><div style="flex:1;"><div class="shimmer" style="height:14px;width:55%;margin-bottom:6px;"></div><div class="shimmer" style="height:11px;width:35%;"></div></div><div class="shimmer" style="width:60px;height:14px;"></div></div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
