sibling: flow
schema_version: "4.0"
feature_id: personal-savings

navigates_to:
  - target: personal-dashboard
    condition: user_taps_back

flow_logic:
  on_load:
    - action: parallel_fetch
      apis:
        - get_group_linked_transactions
        - get_individual_transactions (if individualSavingsId != null)
      on_success: show_content
      on_error: show_error
  on_tab_selected:
    - state: { selectedTab: params.tab }
    - decision: individual_account_exists
      branches:
        - condition: "selectedTab == INDIVIDUAL && individualSavingsId == null"
          action: show_empty_individual_promo
        - condition: "selectedTab == INDIVIDUAL && individualSavingsId != null"
          action: show_individual_transactions
        - condition: "selectedTab == GROUP_LINKED"
          action: show_group_linked_transactions
  on_refresh:
    - action: reload_both_accounts
      invalidate_cache: true
