sibling: data-flow
schema_version: "2.1.0"
feature_id: personal-savings

entries:
  - screen_id: personalSavingsScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_group_linked_transactions, transport: rest, method: get }
    dtos:
      - { name: SavingsTransactionDto, role: response, api_id: get_group_linked_transactions }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "savings_transactions:{groupLinkedSavingsId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: error_state, message_key: error_server }
      - { error_code: "503", behavior: fallback_cache, message_key: error_network }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_network }

  - screen_id: personalSavingsScreen
    trigger: on_interact
    interaction: tab_switch_to_individual
    endpoints:
      - { api_id: get_individual_transactions, transport: rest, method: get }
    dtos:
      - { name: SavingsTransactionDto, role: response, api_id: get_individual_transactions }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "savings_transactions:{individualSavingsId}"
    notes: "Only called if individualSavingsId is not null and not yet loaded"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: error_state, message_key: error_server }
      - { error_code: "network.offline", behavior: snackbar, message_key: error_network }

  - screen_id: personalSavingsScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_group_linked_transactions, transport: rest, method: get }
    dtos:
      - { name: SavingsTransactionDto, role: response, api_id: get_group_linked_transactions }
    auth_required: true
    cache:
      strategy: bypass_and_refresh
      key_template: "savings_transactions:{activeTabSavingsId}"
    error_paths:
      - { error_code: "network.offline", behavior: snackbar, message_key: error_network }
