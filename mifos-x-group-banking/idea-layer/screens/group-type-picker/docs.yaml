id: group-type-picker
name: Group Type Picker
description: >
  Step 1a of the group-create wizard. Presents all 9 seeded group type cards (VSLA, ROSCA, ASCA, SILC, SHG,
  SACCO/Credit-Union, CBO/Village-Banking, Burial/Welfare-Society, JLG). Each card shows the type name, a one-line
  tagline, and key distinguishing feature chips. Tapping a card loads the corresponding GroupTypeConfig via COMP-DT-003
  and navigates to the group-create wizard, passing the selected config so downstream steps can adapt (contribution
  modes, lending fields, welfare-only toggles, etc.). Covers FR-022.
feature: group-type-config
