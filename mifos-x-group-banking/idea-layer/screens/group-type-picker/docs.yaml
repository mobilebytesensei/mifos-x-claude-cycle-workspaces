sibling: docs
schema_version: "4.0"
feature_id: group-type-picker
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_api
  - has_flow

id: group-type-picker
name: Group Type Picker
description: >
  Step 1a of the group-create wizard. Presents all 9 seeded group type cards (VSLA, ROSCA,
  ASCA, SILC, SHG, SACCO/Credit-Union, CBO/Village-Banking, Burial/Welfare-Society, JLG).
  Each card shows the type name, a one-line tagline, and key distinguishing feature chips.
  Tapping a card loads the corresponding GroupTypeConfig via COMP-DT-003 and navigates to
  the group-create wizard, passing the selected config so downstream steps can adapt
  (contribution modes, lending fields, welfare-only toggles, etc.). Covers FR-022.
feature: group-type-config
flow: group-management-flow
version: "1.0.0"
tags:
  - group-management
  - group-type-config
  - admin
  - selection
  - wizard-step
  - FR-022

requires:
  - group-create
  - group-type-config

status: enriched
quality_score: 92
status_history:
  - status: draft
    date: "2026-07-17"
    author: system
  - status: enriched
    date: "2026-07-17"
    author: system

entry_point: true
bottom_nav:
  visible: false

legacy_metadata:
  analytics:
    screen_view: group_type_picker_viewed
    events:
      - trigger: type card tap
        name: group_type_selected
        params: { type_slug: String }
      - trigger: back tap
        name: group_type_picker_dismissed
  exports:
    spec_md:
      at: null
      source: "idea-layer/exports/group-type-config/"
    api_md:
      at: null
      source: "idea-layer/exports/group-type-config/"
