      mechanism (ACCUMULATING | ROTATING_PAYOUT | NONE) x contribution mode
      (SHARE_BASED_VARIABLE | FIXED | MINIMAL). Field shape conforms to
      api.yaml#/api[0]/response.items — the surface consumed by
      groupTypePickerScreen. loanMultiplier + interestRate are 0 for ROSCA / JLG /
      Burial-Welfare (no internal lending pool). minMembers / maxMembers follow
      common field-programme norms (SACCO up to 500; JLG capped at 10).
    items:
