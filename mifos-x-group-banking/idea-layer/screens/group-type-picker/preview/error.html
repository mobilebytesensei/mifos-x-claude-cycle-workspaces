<!doctype html>
<!-- render-hash: gtp-error0002 -->
<html lang="en" data-feature="group-type-picker" data-state="error" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>group-type-picker · MifosSave</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .error-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; }
    .error-wrap .empty-state { padding-top: var(--space-lg); }
    .error-wrap .empty-state .illus { background: #FFEBEE; color: var(--danger); }
    .error-wrap .alert-danger { width: 100%; text-align: left; }
    .error-cta { width: 100%; margin-top: var(--space-lg); }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-list" aria-label="Back to groups">‹</button>
    <h1>Choose Group Type</h1>
  </header>
  <main>
    <div class="error-wrap">
      <div class="empty-state">
        <div class="illus" aria-hidden="true">⚠️</div>
        <h2>Could not load group types</h2>
        <p>Check your connection and retry. If the problem persists, the server may be temporarily unavailable.</p>
      </div>
      <div class="alert alert-danger" role="alert">
        <span aria-hidden="true">⚠️</span>
        <div>
          <h3>Network error</h3>
          <p>Could not load group types. Check your connection and retry.</p>
        </div>
      </div>
      <div class="error-cta">
        <button class="btn btn-primary btn-full" data-action="OnRetry" aria-label="Retry">↻ Retry</button>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
