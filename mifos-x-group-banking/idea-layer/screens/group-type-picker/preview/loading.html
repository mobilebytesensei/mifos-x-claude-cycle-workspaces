<!doctype html>
<!-- render-hash: gtp-loading02 -->
<html lang="en" data-feature="group-type-picker" data-state="loading" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>group-type-picker · MifosSave</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    main .lede { font-size: 13px; color: var(--text-secondary); margin: 2px 0 var(--space-base); }
    .sk-card { margin-bottom: var(--space-md); }
    .sk-row { display: flex; align-items: flex-start; gap: var(--space-md); }
    .sk { background: var(--bg-muted); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
    .sk::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: sk-shimmer 1.2s infinite; }
    @keyframes sk-shimmer { 100% { transform: translateX(100%); } }
    .sk-avatar { width: 44px; height: 44px; border-radius: var(--radius-md); flex-shrink: 0; }
    .sk-main { flex: 1; min-width: 0; }
    .sk-line { height: 12px; margin-bottom: var(--space-sm); }
    .sk-line.title { width: 40%; height: 14px; }
    .sk-line.wide { width: 92%; }
    .sk-line.med { width: 70%; margin-bottom: 0; }
    .sk-chips { display: flex; gap: var(--space-xs); margin-top: var(--space-sm); padding-left: calc(44px + var(--space-md)); }
    .sk-chip { width: 78px; height: 18px; border-radius: var(--radius-sm); }
    .loading-caption { text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: var(--space-md); }
    @media (prefers-reduced-motion: reduce) { .sk::after { animation: none; } }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-list" aria-label="Back to groups">‹</button>
    <h1>Choose Group Type</h1>
  </header>
  <main aria-busy="true" aria-label="Loading group types…">
    <p class="lede">Pick the model your group runs on. You can fine-tune the rules next.</p>

    <div class="card sk-card">
      <div class="sk-row">
        <div class="sk sk-avatar"></div>
        <div class="sk-main">
          <div class="sk sk-line title"></div>
          <div class="sk sk-line wide"></div>
          <div class="sk sk-line med"></div>
        </div>
      </div>
      <div class="sk-chips"><div class="sk sk-chip"></div><div class="sk sk-chip"></div><div class="sk sk-chip"></div></div>
    </div>

    <div class="card sk-card">
      <div class="sk-row">
        <div class="sk sk-avatar"></div>
        <div class="sk-main">
          <div class="sk sk-line title"></div>
          <div class="sk sk-line wide"></div>
          <div class="sk sk-line med"></div>
        </div>
      </div>
      <div class="sk-chips"><div class="sk sk-chip"></div><div class="sk sk-chip"></div></div>
    </div>

    <div class="card sk-card">
      <div class="sk-row">
        <div class="sk sk-avatar"></div>
        <div class="sk-main">
          <div class="sk sk-line title"></div>
          <div class="sk sk-line wide"></div>
          <div class="sk sk-line med"></div>
        </div>
      </div>
      <div class="sk-chips"><div class="sk sk-chip"></div><div class="sk sk-chip"></div><div class="sk sk-chip"></div></div>
    </div>

    <div class="card sk-card">
      <div class="sk-row">
        <div class="sk sk-avatar"></div>
        <div class="sk-main">
          <div class="sk sk-line title"></div>
          <div class="sk sk-line wide"></div>
          <div class="sk sk-line med"></div>
        </div>
      </div>
      <div class="sk-chips"><div class="sk sk-chip"></div><div class="sk sk-chip"></div><div class="sk sk-chip"></div></div>
    </div>

    <div class="spinner" role="progressbar" aria-label="Loading group types…"></div>
    <p class="loading-caption">Loading group types…</p>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
