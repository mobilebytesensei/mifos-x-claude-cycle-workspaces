sibling: flow
schema_version: "4.0"
feature_id: group-type-picker

navigates_to:
  - group-create
  - group-list

flow_logic:
  on_load:
    - action: fetch_type_configs
      api: get_group_type_configs
      params: { entityId: 0 }
      on_success:
        - action: populate_type_cards
          produces_state: content
      on_error:
        - action: show_error_state
          produces_state: error

  on_type_card_tap:
    - action: store_selected_type
      description: >
        Store the tapped GroupTypeConfig in ViewModel state (selectedType field),
        then emit NavigateToGroupCreate event carrying the full GroupTypeConfig object
        as a navigation argument. The group-create wizard reads this to adapt its steps.
      on_success:
        - emit: NavigateToGroupCreate
          nav_args: { typeConfig: "{{selectedType}}" }
          nav_target: group-create

  on_back:
    - action: emit_navigate_back
      emit: NavigateBack
      nav_target: group-list

  on_retry:
    - action: fetch_type_configs
      api: get_group_type_configs
      params: { entityId: 0 }
      on_success:
        - action: populate_type_cards
          produces_state: content
      on_error:
        - action: show_error_state
          produces_state: error

dependencies:
  repositories:
    - name: GroupTypeConfigRepository
      methods:
        - "getGroupTypeConfigs(): Flow<List<GroupTypeConfig>>"
