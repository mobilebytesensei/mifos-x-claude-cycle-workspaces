sibling: tests
schema_version: "4.0"
feature_id: group-type-picker
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "80%+"

  scenarios:
    - id: TC-GTP-001
      scenario: "On mount, 9 seeded group type configs load and render as cards"
      type: ViewModel
      priority: P0
      given: "user authenticated; network online"
      when: "GroupTypePickerScreen enters composition"
      then: "typeConfigs populated with 9 entries (VSLA, ROSCA, ASCA, SILC, SHG, SACCO, CBO, Burial, JLG); isLoading flips false; GroupTypePickerScreenState=Content"

    - id: TC-GTP-002
      scenario: "Each type card shows name, tagline, and distinguishing features"
      type: Screen
      priority: P0
      given: "Content state with 9 typeConfigs"
      when: "GroupTypeCard list renders"
      then: "VSLA card shows 'VSLA' name, one-line tagline, and pool_model=ACCUMULATING indicator; all 9 cards present"

    - id: TC-GTP-003
      scenario: "Tapping a type card loads GroupTypeConfig and navigates to group-create"
      type: ViewModel
      priority: P0
      given: "Content state; typeSlug='VSLA' card tapped"
      when: "OnTypeCardTap(typeSlug='VSLA') fires"
      then: "selectedType set to VSLA GroupTypeConfig; NavigateToGroupCreate emitted with that GroupTypeConfig"

    - id: TC-GTP-004
      scenario: "Network error on type config fetch shows error state with retry"
      type: Screen
      priority: P1
      given: "GET /companion/group-types returns 500"
      when: "load completes"
      then: "GroupTypePickerScreenState=Error; error card with retry CTA shown"

    - id: TC-GTP-005
      scenario: "Auth 401 redirects to login"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "typeConfigs fetch returns 401"
      then: "GroupTypePickerError type=Auth redirect=login; NavigateBack event emitted"

    - id: TC-GTP-006
      scenario: "Loading shimmer shown while type configs are fetching"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "GroupTypePickerScreen renders"
      then: "shimmer placeholders for 9 cards visible; actual type cards not rendered"

    - id: TC-GTP-007
      scenario: "ROSCA card shows payout_order_method indicator distinguishing it from VSLA"
      type: Screen
      priority: P1
      given: "Content state with ROSCA type config"
      when: "GroupTypeCard for ROSCA renders"
      then: "card shows pool_model=ROTATING_PAYOUT and payout_order_method hint; distinct from VSLA ACCUMULATING card"
