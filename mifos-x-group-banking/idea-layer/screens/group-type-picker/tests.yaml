sibling: tests
schema_version: "4.0"
feature_id: group-type-picker

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-GTP-001
      scenario: "On mount, get_group_type_configs fires against COMP-DT-003 with entityId=0 and produces isLoading=true then content state"
      type: ViewModel
      priority: P0

    - id: TC-GTP-002
      scenario: "Content state renders exactly 9 type cards, one per group type slug"
      type: Screen
      priority: P0

    - id: TC-GTP-003
      scenario: "VSLA card displays displayName 'VSLA', tagline about share-based saving, and 3 feature chips"
      type: Screen
      priority: P0

    - id: TC-GTP-004
      scenario: "ROSCA card displays displayName 'ROSCA', rotating-payout tagline, and 2 feature chips"
      type: Screen
      priority: P1

    - id: TC-GTP-005
      scenario: "JLG card displays displayName 'JLG', joint-guarantee tagline, and 3 feature chips including 'No savings pool'"
      type: Screen
      priority: P1

    - id: TC-GTP-006
      scenario: "Tapping the VSLA card dispatches OnTypeCardTap(typeSlug='VSLA') and emits NavigateToGroupCreate with the VSLA GroupTypeConfig"
      type: ViewModel
      priority: P0

    - id: TC-GTP-007
      scenario: "Tapping any type card sets selectedType to the corresponding GroupTypeConfig before emitting NavigateToGroupCreate"
      type: ViewModel
      priority: P0

    - id: TC-GTP-008
      scenario: "NavigateToGroupCreate event carries the full GroupTypeConfig object including lendingEnabled, contributionMode, defaultLoanMultiplier"
      type: ViewModel
      priority: P0

    - id: TC-GTP-009
      scenario: "Network error from get_group_type_configs transitions to error state and shows error banner with Retry button"
      type: ViewModel
      priority: P0

    - id: TC-GTP-010
      scenario: "Server 500 error from COMP-DT-003 shows error state with error_server message key"
      type: ViewModel
      priority: P1

    - id: TC-GTP-011
      scenario: "Tapping Retry re-fires get_group_type_configs and transitions back to loading then content on success"
      type: ViewModel
      priority: P1

    - id: TC-GTP-012
      scenario: "OnBack dispatches NavigateBack event; no type is selected"
      type: ViewModel
      priority: P1

    - id: TC-GTP-013
      scenario: "GroupTypeConfigRepository.getGroupTypeConfigs caches result for 86400s and returns cached value offline"
      type: Repository
      priority: P1

    - id: TC-GTP-014
      scenario: "401 from COMP-DT-003 transitions to error state with error_auth message key"
      type: ViewModel
      priority: P2
