sibling: api
schema_version: "4.0"
feature_id: group-type-picker

api:
  - id: get_group_type_configs
    function: get_group_type_configs
    method: get
    endpoint: "/companion/datatables/group_type_config/{entityId}"
    description: >
      COMP-DT-003. Fetch all seeded GroupTypeConfig rows from the Companion API.
      entityId is passed as 0 to retrieve the global seeded catalogue (not per-group).
    params:
      entityId: { type: Long, default: "0", description: "0 = seed catalogue query" }
    response:
      type: array
      items:
        typeSlug: String           # VSLA | ROSCA | ASCA | SILC | SHG | SACCO | CBO_VILLAGE_BANK | BURIAL_WELFARE | JLG
        displayName: String
        tagline: String
        savingsMechanism: String   # ACCUMULATING | ROTATING_PAYOUT | NONE
        contributionMode: String   # SHARE_BASED_VARIABLE | FIXED | MINIMAL
        lendingEnabled: Boolean
        hasSocialFund: Boolean
        hasBankLinkage: Boolean
        welfareOnlyMode: Boolean
        formallyRegistered: Boolean
        defaultLoanMultiplier: Double
        defaultInterestRatePct: Double
        defaultCycleLengthMonths: Int
        maxMembers: Int
        minMembers: Int
    errors:
      401: Unauthorized — redirect to login
      404: Seed catalogue not found on this Companion instance
      500: Server error — show retry
    cache:
      ttl: 86400
      strategy: stale-while-revalidate
      offline: show_cached
    requires_permission: []
    writable: false
    pagination: null

cache_strategy:
  default: stale-while-revalidate
  offline: show_cached

dtos:
  GroupTypeConfig:
    typeSlug: String
    displayName: String
    tagline: String
    savingsMechanism: String
    contributionMode: String
    lendingEnabled: Boolean
    hasSocialFund: Boolean
    hasBankLinkage: Boolean
    welfareOnlyMode: Boolean
    formallyRegistered: Boolean
    defaultLoanMultiplier: Double
    defaultInterestRatePct: Double
    defaultCycleLengthMonths: Int
    maxMembers: Int
    minMembers: Int
