sibling: data-flow
schema_version: "2.1.0"
feature_id: group-type-picker

entries:
  - screen_id: groupTypePickerScreen
    trigger: on_mount
    description: >
      Load all 9 seeded GroupTypeConfig rows from the companion API seed catalogue
      (entityId=0). Cached aggressively — catalogue changes only on server updates.
      Offline: serve cached catalogue if available.
    endpoints:
      - { api_id: get_group_type_configs, transport: rest, method: get }
    tables:
      - name: group_type_config_cache
        persistence_contract: sqldelight_entity
        mutation: upsert
    dtos:
      - { name: GroupTypeConfig, role: response, api_id: get_group_type_configs }
    produces_state: Content
    auth_required: false
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 86400
      key_template: "group_type_configs:catalogue"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login-signup }
      - { error_code: "404", behavior: show_error, message_key: error_catalogue_unavailable }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      Returns the global seed catalogue (9 types). entityId=0 is a sentinel used
      to query the seed rows — not a per-group datatable read.
      Cache TTL 24h because the catalogue changes only via server deployments.
      On cache hit, serve immediately; background-revalidate if older than TTL.

  - screen_id: groupTypePickerScreen
    trigger: on_action
    action: OnTypeCardTap
    description: >
      User taps a group-type card. No API call — passes the selected GroupTypeConfig
      as a nav argument to group-create.
    endpoints: []
    tables: []
    dtos:
      - { name: GroupTypeConfig, role: request, api_id: nav_params }
    produces_state: Content
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    navigation:
      - { condition: "typeSelected", nav_target: group-create, params: [typeConfig] }
    notes: >
      GroupTypeConfig object forwarded to group-create as nav_arg.
      group-create embeds it in the create_group_orchestrate request body.

tables:
  - name: group_type_config_cache
    description: >
      SQLDelight cache for the 9 seeded GroupTypeConfig rows. Populated on first
      successful catalogue fetch; served as offline fallback. Keyed by typeSlug.
      Corresponds to dt_group_type_config datatable on the companion API.
    persistence_contract: sqldelight_entity
    primary_key: "typeSlug"
    mutations: [upsert, read]
    offline_strategy: serve_stale
    source_datatable: dt_group_type_config

cache:
  strategy: stale_while_revalidate
  ttl_seconds: 86400
  notes: >
    Catalogue is functionally immutable between releases. Single-source: only the
    companion API /companion/datatables/group_type_config/{entityId} endpoint writes
    this table. No legacy api.yaml#cache — cache declared here in data-flow exclusively.

sync_queue:
  entries: []
  notes: >
    Group-type picker is read-only. No mutations; no sync-queue entries needed.
