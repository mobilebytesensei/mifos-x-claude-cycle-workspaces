<!DOCTYPE html>
<html lang="en" data-feature="loan-request" data-state="submitting" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>loan-request · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .lr-row { display: flex; align-items: center; gap: var(--space-md); }
  .lr-row + .lr-row { margin-top: var(--space-md); }
  .lr-row .lr-ico { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; }
  .lr-row .lr-label { flex: 1; font-size: 13px; color: var(--text-secondary); line-height: 1.3; }
  .lr-row .lr-hint { display: block; font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
  .lr-row .lr-value { font-family: 'Roboto Mono', monospace; font-weight: 600; font-size: 14px; color: var(--text-primary); }
  .lr-row .lr-value.max { font-size: 18px; color: var(--primary-700); }
  .prefix-input { display: flex; align-items: center; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-muted); overflow: hidden; }
  .prefix-input .prefix { padding: 0 var(--space-md); font-size: 14px; color: var(--text-disabled); background: var(--bg-muted); align-self: stretch; display: flex; align-items: center; border-right: 1px solid var(--border-default); }
  .prefix-input input { border: none; border-radius: 0; background: var(--bg-muted); color: var(--text-disabled); }
  .dur-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--space-md); }
  .dur-head h3 { font-size: 14px; font-weight: 600; }
  .dur-weeks { font-family: 'Roboto Mono', monospace; font-weight: 600; color: var(--primary-700); font-size: 15px; }
  .slider { width: 100%; accent-color: var(--text-disabled); height: 4px; }
  .slider-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-disabled); margin-top: 4px; }
  .sum-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: var(--space-sm); }
  .sum-row:last-child { margin-bottom: 0; }
  .sum-row .amt { font-family: 'Roboto Mono', monospace; }
  .sum-row.grand { padding-top: var(--space-sm); margin-top: var(--space-sm); font-weight: 600; }
  .sum-row.grand .amt { color: var(--primary-700); font-size: 16px; }
  main.disabled { opacity: .55; pointer-events: none; }
  .form-field select:disabled, .form-field input:disabled { color: var(--text-disabled); background: var(--bg-muted); }
  .form-footer { padding: var(--space-base); padding-bottom: var(--space-lg); text-align: center; }
  .submit-caption { font-size: 13px; color: var(--text-secondary); margin-top: calc(var(--space-md) * -1); }
</style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" style="visibility:hidden;">‹</button>
    <h1>Request a Loan</h1>
  </header>

  <main class="disabled">
    <!-- savings_limit_card -->
    <div class="card card-highlighted">
      <div class="lr-row">
        <span class="lr-ico">🐖</span>
        <span class="lr-label">Your savings balance</span>
        <span class="lr-value">KES 1,200</span>
      </div>
      <div class="lr-row">
        <span class="lr-ico">💵</span>
        <span class="lr-label">Maximum you can borrow<span class="lr-hint">(3× your savings)</span></span>
        <span class="lr-value max">KES 3,600</span>
      </div>
    </div>

    <!-- amount_field (disabled) -->
    <div class="form-field">
      <label>Loan Amount (KES)</label>
      <div class="prefix-input">
        <span class="prefix">KES</span>
        <input type="text" class="amount-input" value="3,000" disabled>
      </div>
    </div>

    <!-- purpose_dropdown (disabled) -->
    <div class="form-field">
      <label>Loan Purpose</label>
      <select disabled><option>School Fees</option></select>
    </div>

    <!-- duration_selector (disabled) -->
    <div class="card">
      <div class="dur-head">
        <h3>Repayment Duration</h3>
        <span class="dur-weeks">6 weeks</span>
      </div>
      <input type="range" class="slider" min="4" max="52" value="6" disabled>
      <div class="slider-scale"><span>4w</span><span>52w</span></div>
    </div>

    <!-- repayment_summary_card -->
    <div class="card card-muted">
      <div class="sum-row"><span>Principal</span><span class="amt">KES 3,000</span></div>
      <div class="sum-row"><span>Interest (group rate)</span><span class="amt">KES 180</span></div>
      <div class="divider"></div>
      <div class="sum-row grand"><span>Total to repay</span><span class="amt">KES 3,180</span></div>
    </div>
  </main>

  <!-- submitting_indicator -->
  <div class="form-footer">
    <div class="spinner"></div>
    <p class="submit-caption">Submitting your application…</p>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
