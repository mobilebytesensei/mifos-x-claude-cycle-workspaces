sibling: tests
schema_version: "4.0"
feature_id: loan-request

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LRQ-001
      scenario: "Valid loan request submits online and navigates to personal-dashboard"
      type: ViewModel
      priority: P0
      given: "clientId=1003, amount=5000.0, purpose='Maize seeds', durationWeeks=10, online"
      when: "user taps Submit"
      then: "POST /datatables/dt_loan_request called; LoanRequestResponse received; navigate to personal-dashboard"

    - id: TC-LRQ-002
      scenario: "Offline submission queues to SyncQueue and shows confirmation"
      type: ViewModel
      priority: P0
      given: "network.offline, form valid"
      when: "user taps Submit"
      then: "SyncQueueEntry created with entityType=LOAN_REQUEST; success message: error_offline_queued; navigate to personal-dashboard"

    - id: TC-LRQ-003
      scenario: "Amount above max loan ceiling shows error"
      type: ViewModel
      priority: P0
      given: "requestedAmount=50000.0 (exceeds maxLoanAmount=15000)"
      when: "user types amount"
      then: "requestedAmountError=error_max_exceeded; Submit disabled"

    - id: TC-LRQ-004
      scenario: "Zero or negative amount shows validation error"
      type: ViewModel
      priority: P0
      given: "requestedAmount=0"
      when: "user enters 0"
      then: "requestedAmountError=error_must_be_positive; Submit disabled"

    - id: TC-LRQ-005
      scenario: "Purpose field required — empty purpose disables Submit"
      type: Screen
      priority: P1
      given: "amount=5000, duration=10, purpose=''"
      when: "purpose field empty"
      then: "Submit button disabled; no inline error until first submit attempt"

    - id: TC-LRQ-006
      scenario: "Duration weeks > 0 required"
      type: ViewModel
      priority: P1
      given: "durationWeeks=0"
      when: "form validates"
      then: "isFormValid=false; Submit disabled"

    - id: TC-LRQ-007
      scenario: "409 Duplicate pending request shows specific error"
      type: ViewModel
      priority: P1
      given: "client already has PENDING loan request"
      when: "server returns 409"
      then: "error: error_duplicate_request_pending; navigation blocked"

    - id: TC-LRQ-008
      scenario: "Savings balance displayed from session — read-only info field"
      type: Screen
      priority: P1
      given: "savingsBalance=1200.0 in session"
      when: "screen mounts"
      then: "KES 1,200 shown in savings balance info field; field not editable"

    - id: TC-LRQ-009
      scenario: "Repayment estimate recalculates when amount or duration changes"
      type: ViewModel
      priority: P2
      given: "amount=5000, durationWeeks=10"
      when: "either field changes"
      then: "repaymentEstimate = KES 500/week displayed"

    - id: TC-LRQ-010
      scenario: "LoanRequestRepository.submitLoanRequest serializes payload correctly"
      type: Repository
      priority: P0
      given: "LoanRequestPayload with all fields"
      when: "submitLoanRequest() called"
      then: "JSON body matches dt_loan_request schema; status='PENDING' set automatically"

    - id: TC-LRQ-011
      scenario: "SyncQueueRepository.enqueue stores entry for offline submission"
      type: Repository
      priority: P0
      given: "network.offline, LoanRequestPayload ready"
      when: "enqueue() called"
      then: "SyncQueueEntry persisted to local DB with retryCount=0, status=PENDING"
