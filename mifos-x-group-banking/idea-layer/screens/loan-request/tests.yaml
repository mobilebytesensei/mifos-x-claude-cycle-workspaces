sibling: tests
schema_version: "4.0"
feature_id: loan-request
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-LRQ-001
      scenario: "On mount, eligible amount computed from savingsBalance x loanMultiplier passed via nav_params"
      type: ViewModel
      priority: P0
      given: "nav_params: clientId=5, groupId=1, savingsBalance=8000.0, loanMultiplier=3.0"
      when: "LoanRequestScreen enters composition"
      then: "eligibleAmount=24000.0 displayed; LoanRequestScreenState=Content; purpose preselected to BUSINESS"

    - id: TC-LRQ-002
      scenario: "Amount exceeding eligibility disables submit and shows inline error"
      type: ViewModel
      priority: P0
      given: "eligibleAmount=24000.0"
      when: "OnAmountChange('30000')"
      then: "amountError=error_amount_exceeds; submit disabled"

    - id: TC-LRQ-003
      scenario: "OnSubmit when online POSTs to COMP-GRP-001 and emits SubmitSuccess"
      type: ViewModel
      priority: P0
      given: "all fields valid; network online"
      when: "OnSubmit fires"
      then: "isSubmitting=true; POST /companion/groups/{groupId}/loans called; on 200 LoanRequestScreenState=SubmitSuccess; NavigateDone emitted"

    - id: TC-LRQ-004
      scenario: "OnSubmit when offline enqueues to offline sync_queue and transitions to OfflineQueued"
      type: ViewModel
      priority: P0
      given: "all fields valid; cmp-network-monitor reports offline"
      when: "OnSubmit fires"
      then: "sync_queue entry created; LoanRequestScreenState=OfflineQueued; offline banner shown"

    - id: TC-LRQ-005
      scenario: "OfflineQueued state shows pending message and navigates on dismiss"
      type: Screen
      priority: P1
      given: "LoanRequestScreenState=OfflineQueued"
      when: "user taps OK/Done"
      then: "NavigateBack emitted; sync_queue entry remains until network available"

    - id: TC-LRQ-006
      scenario: "Server-side SubmitError shows error message and allows retry"
      type: ViewModel
      priority: P1
      given: "network online; server returns 422 validation error"
      when: "OnSubmit fires"
      then: "LoanRequestScreenState=SubmitError; isSubmitting=false; error detail shown; retry available"

    - id: TC-LRQ-007
      scenario: "Duration slider range enforced by loan product rules"
      type: Screen
      priority: P1
      given: "loanProduct.minDurationWeeks=4, maxDurationWeeks=52"
      when: "duration slider renders"
      then: "slider range clamped to 4-52; default=12 weeks"

    - id: TC-LRQ-008
      scenario: "Auth 401 redirects to login-signup"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "submit or mount returns 401"
      then: "LoanRequestError type=Auth; NavigateToLoginSignup emitted with redirect context"
