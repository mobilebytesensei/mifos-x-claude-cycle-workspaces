sibling: demo-data
schema_version: "2.1.0"
feature_id: loan-request

entries:
  - dto: LoanRequestPayload
    count_hint: 4
    source_notes: >
      End-user loan request submissions from group members. Amounts in KES
      rural microfinance range: 1,000-15,000 KES. `purpose` is stored as a
      String on the dt_loan_request datatable (per api.yaml), but the
      on-device dropdown constrains the user to one of the 7 canonical
      LoanPurpose enum values declared in ui.yaml (SCHOOL_FEES, MEDICAL,
      BUSINESS, FARMING, HOME_IMPROVEMENT, EMERGENCY, OTHER). Below we send
      the concatenated form "ENUM_VALUE: descriptive detail" so the
      organizer sees both the category and the narrative context at the
      next meeting — the descriptive tail is captured as a supplementary
      note on the enum. duration_weeks stays within the slider bounds
      declared in ui.yaml (4..52). savings_balance_at_request reflects
      weekly savings accumulated at the moment of submit; status is always
      "PENDING" per the api.yaml default (organizer approves at the next
      meeting).
    items:
      - clientId: 1003
        requested_amount: 5000.0
        purpose: "FARMING: Purchase maize seeds and fertilizer for planting season"
        duration_weeks: 10
        savings_balance_at_request: 1200.0
        submitted_at: "2026-07-11T08:30:00Z"
        status: "PENDING"

      - clientId: 1004
        requested_amount: 8000.0
        purpose: "BUSINESS: Buy stock for small grocery kiosk"
        duration_weeks: 16
        savings_balance_at_request: 950.0
        submitted_at: "2026-07-11T09:15:00Z"
        status: "PENDING"

      - clientId: 1005
        requested_amount: 3000.0
        purpose: "SCHOOL_FEES: Term-2 school fees for secondary school daughter"
        duration_weeks: 6
        savings_balance_at_request: 750.0
        submitted_at: "2026-07-11T10:00:00Z"
        status: "PENDING"

      - clientId: 1006
        requested_amount: 2500.0
        purpose: "MEDICAL: Antenatal clinic visit and prescribed supplements"
        duration_weeks: 8
        savings_balance_at_request: 640.0
        submitted_at: "2026-07-11T10:42:00Z"
        status: "PENDING"

  - dto: LoanRequestResponse
    count_hint: 2
    source_notes: >
      Successful datatable entry creation responses from Fineract POST
      /datatables/dt_loan_request. resourceId is the new dt_loan_request
      row id, officeId is the branch office the client belongs to (KWB-001
      / KEB-001 / KCB-001 map to ids 10/11/12 per group-create demo-data),
      clientId echoes the request, and resourceExternalId follows the
      LR-YYYY-MMDD-NNN pattern the Fineract admin dashboard renders in the
      pending queue.
    items:
      - resourceId: 3301
        officeId: 10
        clientId: 1003
        resourceExternalId: "LR-2026-0711-001"

      - resourceId: 3302
        officeId: 10
        clientId: 1004
        resourceExternalId: "LR-2026-0711-002"

  - dto: SyncQueueEntry
    count_hint: 2
    source_notes: >
      Offline sync queue entries produced when a group member submits a
      loan request without connectivity (network.offline) or when the
      server returns 503. `entityType` is "LOAN_REQUEST" per the
      sync_queue block in data-flow.yaml. `payload` is the JSON-serialised
      LoanRequestPayload exactly as it would have gone over the wire — the
      background sync worker rehydrates it verbatim on drain. `status` is
      "PENDING" while queued and flips to "SYNCED" or "FAILED" post-drain.
      retryCount starts at 0 and increments with exponential backoff.
    items:
      - id: 9001
        entityType: "LOAN_REQUEST"
        payload: '{"clientId":1003,"requested_amount":5000.0,"purpose":"FARMING: Purchase maize seeds and fertilizer for planting season","duration_weeks":10,"savings_balance_at_request":1200.0,"submitted_at":"2026-07-11T08:30:00Z","status":"PENDING"}'
        status: "PENDING"
        createdAt: "2026-07-11T08:30:00Z"
        retryCount: 0

      - id: 9002
        entityType: "LOAN_REQUEST"
        payload: '{"clientId":1004,"requested_amount":8000.0,"purpose":"BUSINESS: Buy stock for small grocery kiosk","duration_weeks":16,"savings_balance_at_request":950.0,"submitted_at":"2026-07-11T09:15:00Z","status":"PENDING"}'
        status: "PENDING"
        createdAt: "2026-07-11T09:15:00Z"
        retryCount: 1

