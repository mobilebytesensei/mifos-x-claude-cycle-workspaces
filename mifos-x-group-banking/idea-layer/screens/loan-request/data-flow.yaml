sibling: data-flow
schema_version: "2.1.0"
feature_id: loan-request

entries:
  - screen_id: loanRequestScreen
    trigger: on_mount
    description: Mount — load session data (savingsBalance, clientId) from SessionManager, no API call
    endpoints: []
    dtos: []
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "loan_request:session"
    error_paths:
      - { error_code: "session.expired", behavior: navigate, nav_target: login }

  - screen_id: loanRequestScreen
    trigger: on_interact
    description: Online submission — POST loan request to dt_loan_request datatable
    endpoints:
      - { api_id: submit_loan_request, transport: rest, method: post }
    dtos:
      - { name: LoanRequestPayload, role: request, api_id: submit_loan_request }
      - { name: LoanRequestResponse, role: response, api_id: submit_loan_request }
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "loan_request:submit:{clientId}"
    error_paths:
      - { error_code: "400", behavior: show_error, message_key: error_validation }
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "409", behavior: show_error, message_key: error_duplicate_request_pending }
      - { error_code: "503", behavior: queue_sync, message_key: error_offline_queued }
      - { error_code: "network.offline", behavior: queue_sync, message_key: error_offline_queued }

  - screen_id: loanRequestScreen
    trigger: on_background_sync
    description: Offline mode — enqueue LoanRequestPayload to SyncQueue for later submission
    endpoints: []
    dtos:
      - { name: SyncQueueEntry, role: request, api_id: submit_loan_request }
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: "loan_request:sync_queue"
    error_paths: []
