id: loan-request
name: Loan Request
description: >
  Form screen for members (member role, per-group) to submit a loan application. Member selects amount
  (validated against savings × loan_multiplier), purpose, and duration. Submit
  creates a dt_loan_request datatable entry pending organizer review at next meeting.
  Offline-capable via SyncQueue. Covers FR-016.
feature: end-user-dashboard
flow: end-user-dashboard-flow
version: "1.0.0"
tags:
  - loan-request
  - member-role
  - offline-first
  - sync-queue
  - datatable
  - FR-016

