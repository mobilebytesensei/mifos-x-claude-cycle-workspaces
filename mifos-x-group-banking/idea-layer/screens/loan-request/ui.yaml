sibling: ui
schema_version: "4.0"
feature_id: loan-request

route: /loan-request
entry_points:
  - source: personal-dashboard
    condition: user_taps_request_loan_cta
  - source: personal-loans
    condition: user_taps_fab
nav_params:
  clientId: { type: Long, required: true }
  savingsBalance: { type: Double, required: true }
  loanMultiplier: { type: Double, required: false, default: "3.0" }

screens:
  - id: loan_request_screen
    name: LoanRequestScreen
    composable: LoanRequestScreen
    description: Loan application form with inline validation and offline queue support
    layout: Scaffold (top-bar + Column scrollable + bottom submit bar)

state_model:
  LoanRequestViewModel:
    state:
      name: LoanRequestState
      fields:
        clientId: { type: Long, default: "0L" }
        savingsBalance: { type: Double, default: "0.0" }
        loanMultiplier: { type: Double, default: "3.0" }
        maxLoanAmount: { type: Double, default: "0.0" }
        requestedAmount: { type: String, default: '""' }
        requestedAmountError: { type: "String?", default: "null" }
        purpose: { type: "LoanPurpose?", default: "null" }
        purposeError: { type: "String?", default: "null" }
        durationWeeks: { type: Int, default: "12" }
        repaymentEstimate: { type: Double, default: "0.0" }
        isOfflineMode: { type: Boolean, default: "false" }
        isSubmitting: { type: Boolean, default: "false" }
        isFormValid: { type: Boolean, default: "false" }
        submitError: { type: "SubmitError?", default: "null" }
        successDialogVisible: { type: Boolean, default: "false" }
    screen_state:
      name: LoanRequestScreenState
      members: [Content, Submitting, SubmitSuccess, SubmitError, OfflineQueued]
    errors:
      name: SubmitError
      types:
        - { type: Network, retry: true, message_key: error_network_queued }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Validation, retry: false, message_key: error_validation }
        - { type: Unauthorized, retry: false, message_key: error_session_expired }
    events:
      name: LoanRequestEvent
      members:
        - { name: NavigateToDashboardAfterSuccess }
        - { name: NavigateBack }
        - { name: ShowOfflineQueuedConfirmation }
    actions:
      name: LoanRequestAction
      members:
        - { name: OnAmountChange, params: { value: String }, trigger: "Type in amount field" }
        - { name: OnPurposeSelected, params: { purpose: LoanPurpose }, trigger: "Select purpose from dropdown" }
        - { name: OnDurationChanged, params: { weeks: Int }, trigger: "Slide duration selector" }
        - { name: OnSubmitClick, trigger: "Tap Submit Application button" }
        - { name: OnSuccessDialogDismiss, trigger: "Tap OK on success dialog" }
        - { name: OnRetry, trigger: "Tap Retry on error snackbar" }
    di:
      - LoanRequestRepository
      - SyncQueueRepository
      - SessionManager
      - ConnectivityManager

components:
  - id: top_bar
    type: top-bar
    title: "Request a Loan"
    style: { background: primary, elevation: 0dp }
    navigation_icon: arrow_back
    on_click: { action: NavigateBack, target: personal-loans }

  - id: offline_mode_banner
    type: card
    style:
      background: secondaryContainer
      corner_radius: sm
      padding: "8dp 16dp"
      margin_horizontal: 16dp
      margin_top: 8dp
      visible_when: "isOfflineMode == true"
    icon: wifi_off
    text: "You are offline. Your request will be saved and submitted when you reconnect."

  - id: savings_limit_card
    type: card
    style:
      background: tertiaryContainer
      corner_radius: lg
      padding: 16dp
      margin_horizontal: 16dp
      margin_top: 12dp
      elevation: 0dp
    rows:
      - label: "Your savings balance"
        value: "KES {{savingsBalance | number}}"
        icon: savings
        text_style: bodyLarge
      - label: "Maximum you can borrow"
        value: "KES {{maxLoanAmount | number}}"
        hint: "({{loanMultiplier}}× your savings)"
        icon: money
        text_style: titleMedium
        weight: bold

  - id: amount_field
    type: text-field
    label: "Loan Amount (KES)"
    placeholder: "0"
    leading_icon: currency_exchange
    prefix: "KES"
    keyboard_type: number
    ime_action: next
    style: { min_touch_target: 48dp, margin_horizontal: 16dp, margin_top: 16dp }
    error_text: "{{requestedAmountError}}"
    supporting_text: "Enter amount between KES 500 and your maximum"
    on_change: { action: OnAmountChange, target: state.requestedAmount }

  - id: purpose_dropdown
    type: dropdown
    label: "Loan Purpose"
    leading_icon: notepad
    style: { min_touch_target: 48dp, margin_horizontal: 16dp, margin_top: 12dp }
    options:
      - { value: SCHOOL_FEES, label: "School Fees" }
      - { value: MEDICAL, label: "Medical Emergency" }
      - { value: BUSINESS, label: "Business" }
      - { value: FARMING, label: "Farming / Agriculture" }
      - { value: HOME_IMPROVEMENT, label: "Home Improvement" }
      - { value: EMERGENCY, label: "Emergency" }
      - { value: OTHER, label: "Other" }
    error_text: "{{purposeError}}"
    on_change: { action: OnPurposeSelected, target: state.purpose }

  - id: duration_selector
    type: card
    style:
      background: surface
      corner_radius: md
      padding: 16dp
      margin_horizontal: 16dp
      margin_top: 12dp
      elevation: 1dp
    header: "Repayment Duration"
    slider:
      min: 4
      max: 52
      steps: 12
      value: "{{durationWeeks}}"
      active_color: primary
      inactive_color: primaryContainer
      min_touch_target: 48dp
    on_change: { action: OnDurationChanged, target: state.durationWeeks }

  - id: repayment_summary_card
    type: card
    style:
      background: surfaceVariant
      corner_radius: md
      padding: 16dp
      margin_horizontal: 16dp
      margin_top: 12dp
      visible_when: "requestedAmount.isNotBlank() && requestedAmountError == null"
    rows:
      - label: "Principal"
        value: "KES {{requestedAmount | number}}"
      - label: "Interest (group rate)"
        value: "KES {{repaymentEstimate * durationWeeks - requestedAmount | number}}"
      - label: "Total to repay"
        value: "KES {{repaymentEstimate * durationWeeks | number}}"
        text_style: titleMedium
        weight: bold
        divider_above: true

  - id: submit_button
    type: button
    label: "Submit Application"
    style:
      variant: filled
      background: primary
      text_color: onPrimary
      corner_radius: full
      min_height: 56dp
      margin_horizontal: 16dp
      margin_top: 24dp
      margin_bottom: 24dp
      enabled_when: "isFormValid && !isSubmitting"
    on_click: { action: OnSubmitClick, target: api.submit_loan_request }

  - id: submitting_indicator
    type: shimmer
    style:
      visible_when: "isSubmitting == true"
      type: circular_progress
      size: 32dp
      color: primary
      alignment: center
      margin_top: 24dp

  - id: success_dialog
    type: dialog
    style:
      visible_when: "successDialogVisible == true"
      icon: checkmark_circle
      icon_tint: primary
      icon_size: 48dp
    title: "Request Submitted!"
    body: "Your loan request has been submitted. It will be reviewed by the group at the next meeting."
    confirm_button:
      label: "OK"
      background: primary
      min_touch_target: 48dp
    on_click: { action: OnSuccessDialogDismiss, target: personal-dashboard }

  - id: error_snackbar
    type: card
    style:
      visible_when: "submitError != null && !isSubmitting"
      background: errorContainer
      text_color: onErrorContainer
      duration: 5000
    action_label: "Retry"
    on_click: { action: OnRetry, target: api.submit_loan_request }

states:
  initial_state: content
  content:
    description: Form ready — all fields enabled, submit button disabled until valid
    components: [top_bar, offline_mode_banner, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submit_button]
  submitting:
    description: Submission in progress — fields disabled, spinner shown
    components: [top_bar, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submitting_indicator]
  submit_success:
    description: Submission succeeded — success dialog shown
    components: [top_bar, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submit_button, success_dialog]
  submit_error:
    description: Submission failed — error snackbar visible
    components: [top_bar, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submit_button, error_snackbar]
  offline_queued:
    description: Offline — entry saved to SyncQueue; success dialog with offline copy
    components: [top_bar, offline_mode_banner, savings_limit_card, amount_field, purpose_dropdown, duration_selector, repayment_summary_card, submit_button, success_dialog]

i18n:
  en:
    screen_title: "Request a Loan"
    offline_banner: "You are offline. Your request will be saved and sent when you reconnect."
    savings_balance_label: "Your savings balance"
    max_loan_label: "Maximum you can borrow"
    loan_multiplier_hint: "(3× your savings)"
    amount_label: "Loan Amount (KES)"
    amount_supporting_text: "Enter amount between KES 500 and your maximum"
    purpose_label: "Loan Purpose"
    purpose_school_fees: "School Fees"
    purpose_medical: "Medical Emergency"
    purpose_business: "Business"
    purpose_farming: "Farming / Agriculture"
    purpose_home_improvement: "Home Improvement"
    purpose_emergency: "Emergency"
    purpose_other: "Other"
    duration_label: "Repayment Duration"
    repayment_estimate_label: "Weekly repayment estimate"
    principal_label: "Principal"
    interest_label: "Interest (group rate)"
    total_repayment_label: "Total to repay"
    submit_button: "Submit Application"
    success_online_title: "Request Submitted!"
    success_online_body: "Your loan request has been submitted. It will be reviewed by the group at the next meeting."
    success_offline_title: "Request Saved!"
    success_offline_body: "You are offline. Your loan request has been saved and will be submitted automatically when you reconnect."
    ok_button: "OK"
    retry_button: "Retry"
    error_network_queued: "No internet. Your request has been saved for later."
    error_server: "Server error. Please try again."
    error_validation: "Please check all fields and try again."
    error_session_expired: "Session expired. Please login again."
