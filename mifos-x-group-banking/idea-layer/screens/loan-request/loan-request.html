<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Request — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = { darkMode:'class', theme:{extend:{fontFamily:{display:['Noto Sans','system-ui','sans-serif']}}} };
</script>
<style>
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width:393px; min-height:852px; border-radius:2.5rem; overflow:hidden; position:relative; }
body.embedded { background:#FAFAFA; margin:0; padding:0; min-height:100vh; display:block; }
body.embedded #standalone-toolbar { display:none !important; }
body.embedded #phone-wrapper { display:none !important; }
body.embedded #embedded-content { display:flex !important; flex-direction:column; width:100%; height:100vh; overflow:hidden; background:#FAFAFA; }
.card { background:white; border-radius:16px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
input[type=range] { -webkit-appearance:none; width:100%; height:6px; border-radius:3px; background:linear-gradient(to right, #2E7D32 0%, #2E7D32 50%, #C8E6C9 50%, #C8E6C9 100%); outline:none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; background:#2E7D32; border-radius:50%; border:2px solid white; box-shadow:0 2px 6px rgba(0,0,0,0.2); cursor:pointer; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; }
.modal { background:white; border-radius:24px; padding:24px; max-width:320px; width:100%; text-align:center; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Loan Request — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="content">Form (Online)</option>
    <option value="offline">Form (Offline)</option>
    <option value="submitting">Submitting</option>
    <option value="submit_success">Success</option>
    <option value="submit_error">Error</option>
    <option value="offline_queued">Offline Queued</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone bg-[#FAFAFA] shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2" style="background:#2E7D32">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-sm text-white">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto bg-[#FAFAFA]" style="height:760px"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 shrink-0" style="background:#2E7D32; padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-white">wifi</span>
      <span class="material-symbols-outlined text-sm text-white">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto bg-[#FAFAFA] flex-1"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>
<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) { document.body.classList.remove('bg-[#0F0F23]','min-h-screen','flex','flex-col'); document.body.classList.add('embedded'); }
function getContentEl() { return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content'); }

var loanAmount = 15000;
var durationWeeks = 12;
var selectedPurpose = 'Business';
var maxLoan = 37350;
var savingsBalance = 12450;

function calcRepayment(amt, weeks) {
  var interest = amt * 0.10;
  var total = amt + interest;
  return Math.round(total / weeks);
}

function updateSlider(val) {
  durationWeeks = parseInt(val);
  var pct = ((durationWeeks - 4) / (52 - 4)) * 100;
  var slider = document.getElementById('dur-slider');
  if (slider) {
    slider.style.background = `linear-gradient(to right, #2E7D32 0%, #2E7D32 ${pct}%, #C8E6C9 ${pct}%, #C8E6C9 100%)`;
  }
  var durLabel = document.getElementById('dur-label');
  if (durLabel) durLabel.textContent = durationWeeks + ' weeks';
  var est = document.getElementById('repayment-est');
  if (est) est.textContent = 'KES ' + calcRepayment(loanAmount, durationWeeks).toLocaleString();
}

function renderForm(isOffline) {
  var repaymentWeekly = calcRepayment(loanAmount, durationWeeks);
  var interest = Math.round(loanAmount * 0.10);
  var total = loanAmount + interest;
  return `
  <div class="flex flex-col bg-[#FAFAFA]">
    <!-- Top bar -->
    <div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
      <!-- back: navigates to personal-loans -->
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('personal-loans')">arrow_back</span>
      <span class="text-lg font-bold text-white flex-1">Request a Loan</span>
    </div>

    ${isOffline ? `
    <!-- Offline banner (visible when isOfflineMode == true) -->
    <div class="flex items-center gap-2 mx-4 mt-3 p-3 rounded-xl" style="background:#FFF8E1;">
      <span class="material-symbols-outlined text-[#E65100]">wifi_off</span>
      <span class="text-sm text-[#E65100]">You are offline. Your request will be saved and sent when you reconnect.</span>
    </div>` : ''}

    <div class="px-4 flex flex-col gap-3 pb-24 pt-3">
      <!-- Savings limit card (tertiaryContainer) -->
      <div class="card p-4" style="background:#E3F2FD;">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-xl" style="color:#1565C0; font-variation-settings:'FILL' 1">savings</span>
          <span class="text-sm font-semibold text-[#0D47A1]">Your borrowing capacity</span>
        </div>
        <div class="flex justify-between">
          <div>
            <div class="text-xs text-[#1565C0]">Your savings</div>
            <div class="text-base font-bold text-[#0D47A1]">KES 12,450</div>
          </div>
          <div class="text-right">
            <div class="text-xs text-[#1565C0]">Max you can borrow</div>
            <div class="text-lg font-bold text-[#0D47A1]">KES 37,350</div>
            <div class="text-xs text-[#1565C0]">(3× your savings)</div>
          </div>
        </div>
      </div>

      <!-- Amount field -->
      <!-- POST /datatables/dt_loan_request on submit -->
      <div>
        <label class="block text-sm font-semibold text-[#42493F] mb-1.5">Loan Amount (KES)</label>
        <div class="flex items-center gap-2 px-4 py-3 rounded-xl border-2 border-[#C8D8C5] bg-white focus-within:border-[#2E7D32]">
          <span class="text-sm font-semibold text-[#72796F]">KES</span>
          <input type="number" id="loan-amount" class="flex-1 text-base font-bold outline-none bg-transparent text-[#1A1C19]"
            value="${loanAmount}" min="500" max="${maxLoan}"
            oninput="loanAmount=parseInt(this.value)||0; updateSlider(durationWeeks)"/>
        </div>
        <p class="text-xs text-[#72796F] mt-1">Enter amount between KES 500 and your maximum</p>
      </div>

      <!-- Purpose dropdown -->
      <div>
        <label class="block text-sm font-semibold text-[#42493F] mb-1.5">Loan Purpose</label>
        <div class="relative">
          <select id="purpose-sel" class="w-full px-4 py-3 rounded-xl border-2 border-[#C8D8C5] bg-white text-[#1A1C19] text-sm font-medium outline-none focus:border-[#2E7D32] appearance-none"
            onchange="selectedPurpose=this.value">
            <option value="School Fees">School Fees</option>
            <option value="Medical Emergency">Medical Emergency</option>
            <option value="Business" selected>Business</option>
            <option value="Farming / Agriculture">Farming / Agriculture</option>
            <option value="Home Improvement">Home Improvement</option>
            <option value="Emergency">Emergency</option>
            <option value="Other">Other</option>
          </select>
          <span class="material-symbols-outlined absolute right-3 top-3 text-[#72796F] pointer-events-none">expand_more</span>
        </div>
      </div>

      <!-- Duration selector -->
      <div class="card p-4">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm font-semibold text-[#42493F]">Repayment Duration</span>
          <span id="dur-label" class="text-lg font-bold text-[#1A1C19]">${durationWeeks} weeks</span>
        </div>
        <input type="range" id="dur-slider" min="4" max="52" step="4" value="${durationWeeks}"
          oninput="updateSlider(this.value)" class="w-full mb-2"/>
        <div class="flex justify-between text-xs text-[#72796F]">
          <span>4 weeks</span>
          <div class="text-center">
            <div class="text-xs text-[#42493F]">Weekly repayment estimate</div>
            <div id="repayment-est" class="text-base font-bold" style="color:#1565C0">KES ${repaymentWeekly.toLocaleString()}</div>
          </div>
          <span>52 weeks</span>
        </div>
      </div>

      <!-- Repayment summary -->
      <div class="card p-4" style="background:#F1F4EF;">
        <div class="text-sm font-semibold text-[#42493F] mb-3">Repayment Summary</div>
        <div class="flex justify-between py-1.5">
          <span class="text-sm text-[#72796F]">Principal</span>
          <span class="text-sm font-semibold text-[#1A1C19]">KES ${loanAmount.toLocaleString()}</span>
        </div>
        <div class="flex justify-between py-1.5">
          <span class="text-sm text-[#72796F]">Interest (group rate, 10%)</span>
          <span class="text-sm font-semibold text-[#1A1C19]">KES ${interest.toLocaleString()}</span>
        </div>
        <div class="h-px bg-[#C8D8C5] my-1"></div>
        <div class="flex justify-between py-1.5">
          <span class="text-sm font-bold text-[#1A1C19]">Total to repay</span>
          <span class="text-base font-bold" style="color:#2E7D32">KES ${total.toLocaleString()}</span>
        </div>
      </div>
    </div>

    <!-- Submit button (bottom fixed) -->
    <!-- tap: POST /datatables/dt_loan_request → success navigates to personal-dashboard -->
    <div class="fixed bottom-0 left-0 right-0 px-4 pb-4 pt-3 bg-[#FAFAFA] border-t border-slate-100" style="max-width:393px; margin:auto;">
      <button class="w-full py-4 rounded-full text-white font-bold text-base shadow-md" style="background:#2E7D32;"
        onclick="switchState('submit_success')">Submit Application</button>
    </div>
  </div>`;
}

function renderSubmitting() {
  return `<div class="flex flex-col bg-[#FAFAFA]">
    <div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
      <span class="text-lg font-bold text-white flex-1">Request a Loan</span>
    </div>
    <div class="flex flex-col items-center justify-center" style="height:600px;">
      <div class="w-14 h-14 border-4 border-[#C8E6C9] border-t-[#2E7D32] rounded-full animate-spin mb-4"></div>
      <p class="text-sm text-[#42493F]">Submitting your request...</p>
      <p class="text-xs text-[#72796F] mt-1">POST /datatables/dt_loan_request</p>
    </div>
  </div>`;
}

function renderSuccess(isOffline) {
  return `<div class="flex flex-col bg-[#FAFAFA]">
    <div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
      <span class="text-lg font-bold text-white flex-1">Request a Loan</span>
    </div>
    <!-- Success dialog overlay -->
    <div class="modal-overlay">
      <div class="modal">
        <span class="material-symbols-outlined text-5xl mb-3" style="color:#2E7D32; font-variation-settings:'FILL' 1">${isOffline ? 'cloud_off' : 'check_circle'}</span>
        <h3 class="text-xl font-bold text-[#1A1C19] mb-2">${isOffline ? 'Request Saved!' : 'Request Submitted!'}</h3>
        <p class="text-sm text-[#42493F] mb-6">${isOffline
          ? 'You are offline. Your loan request has been saved and will be submitted automatically when you reconnect.'
          : 'Your loan request has been submitted. It will be reviewed by the group at the next meeting.'}</p>
        <!-- tap: navigates to personal-dashboard -->
        <button class="w-full py-3 rounded-full text-white font-bold" style="background:#2E7D32;" onclick="navigateTo('personal-dashboard')">OK</button>
      </div>
    </div>
  </div>`;
}

function renderError() {
  return `<div class="flex flex-col bg-[#FAFAFA]">
    <div class="flex items-center px-4 py-3 gap-3" style="background:#2E7D32">
      <span class="material-symbols-outlined text-white text-xl cursor-pointer" onclick="navigateTo('personal-loans')">arrow_back</span>
      <span class="text-lg font-bold text-white flex-1">Request a Loan</span>
    </div>
    ${renderForm(false).replace('<div class="flex flex-col bg-[#FAFAFA]">','')}
    <!-- Error snackbar -->
    <div class="fixed bottom-20 left-4 right-4 p-4 rounded-xl flex items-center gap-3" style="background:#FFDAD6;">
      <span class="material-symbols-outlined text-[#D32F2F]">error</span>
      <div class="flex-1">
        <div class="text-sm font-semibold text-[#D32F2F]">Server error. Please try again.</div>
      </div>
      <button class="text-sm font-bold" style="color:#1565C0" onclick="switchState('submitting')">Retry</button>
    </div>`;
}

var currentState = 'content';
function switchState(s) {
  currentState = s || 'content';
  document.getElementById('statePicker').value = currentState;
  var html = '';
  if (s === 'offline') html = renderForm(true);
  else if (s === 'submitting') html = renderSubmitting();
  else if (s === 'submit_success') html = renderSuccess(false);
  else if (s === 'offline_queued') html = renderSuccess(true);
  else if (s === 'submit_error') html = renderError();
  else html = renderForm(false);
  getContentEl().innerHTML = html;
  // Re-init slider
  var slider = document.getElementById('dur-slider');
  if (slider) updateSlider(slider.value);
}

function navigateTo(t) {
  if (window !== window.top) window.parent.postMessage({action:'navigate',screenId:t},'*');
  else showToast('Navigate to: '+t);
}
function showToast(msg) {
  var t = document.createElement('div'); t.className='px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg'; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),2000);
}
function toggleDark() { document.querySelector('.phone')&&document.querySelector('.phone').classList.toggle('bg-slate-900'); }
window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object')return;
  if(e.data.action==='switchState')switchState(e.data.stateId||e.data.state||'');
  if(e.data.action==='getInspectorData')notifyParent();
});
function notifyParent() {
  if(window===window.top)return;
  window.parent.postMessage({
    action:'screenLoaded',screenId:'loan-request',name:'Loan Request',
    feature:'end-user-dashboard',status:'enriched',componentCount:8,
    states:[
      {id:'content',name:'Form Online'},{id:'offline',name:'Form Offline'},
      {id:'submitting',name:'Submitting'},{id:'submit_success',name:'Success'},
      {id:'submit_error',name:'Error'},{id:'offline_queued',name:'Offline Queued'}
    ],
    inspectorData:{id:'loan-request',name:'Loan Request',feature:'end-user-dashboard',status:'enriched',
      components:[
        {type:'top-bar',label:'Request a Loan',target:'personal-loans'},
        {type:'card',label:'Savings Limit KES 37,350',target:''},
        {type:'text-field',label:'Loan Amount (KES)',target:''},
        {type:'text-field',label:'Loan Purpose',target:''},
        {type:'card',label:'Duration Selector 12 weeks',target:''},
        {type:'card',label:'Repayment Summary',target:''},
        {type:'button',label:'Submit Application',target:'api.submit_loan_request'},
        {type:'dialog',label:'Success Dialog',target:'personal-dashboard'}
      ],states:{},incoming_from:['personal-dashboard','personal-loans']}
  },'*');
}
switchState('content');
notifyParent();
</script>
</body>
</html>
