schema_version: "3.1"
id: loan-apply
name: Loan Apply
description: >
  Loan application form filled by chairperson or treasurer on behalf of a group member.
  Validates that the requested amount does not exceed member savings × loan_multiplier from
  dt_group_config. Performs a corpus balance check client-side and warns if disbursement would
  deplete the group fund. Submits a Fineract loan application with status "submitted and
  pending approval"; navigates to meeting-conduct for democratic vote.
feature: loan-management
flow: loan-management-flow
version: "1.0.0"
tags:
  - loan-management
  - admin
  - form
  - offline-first
  - FR-005
  - FR-018

status: enriched
quality_score: 85
status_history:
  - status: draft
    date: "2026-05-05"
    author: system
  - status: enriched
    date: "2026-05-05"
    author: system

entry_point: false
bottom_nav:
  visible: false
navigates_to:
  - meeting-conduct
  - loan-list
route: /groups/{groupId}/loans/apply
entry_points:
  - source: loan-list
    label: Apply for Loan (FAB)
nav_params:
  groupId: { type: Long, required: true }

screens:
  - id: loan-apply-screen
    title: Apply for Loan
    type: form
    description: Multi-field application form with real-time eligibility and corpus checks

state_model:
  LoanApplyViewModel:
    state:
      name: LoanApplyState
      fields:
        selectedMember: { type: "GroupMember?", default: "null" }
        requestedAmount: { type: String, default: '""' }
        durationWeeks: { type: Int, default: "12" }
        purpose: { type: LoanPurpose, default: "LoanPurpose.BUSINESS" }
        selectedProduct: { type: "LoanProduct?", default: "null" }
        members: { type: "List<GroupMember>", default: "emptyList()" }
        loanProducts: { type: "List<LoanProduct>", default: "emptyList()" }
        memberSavingsBalance: { type: Double, default: "0.0" }
        loanMultiplier: { type: Double, default: "3.0" }
        eligibleAmount: { type: Double, default: "0.0" }
        corpusBalance: { type: Double, default: "0.0" }
        corpusWarning: { type: Boolean, default: "false" }
        isSubmitting: { type: Boolean, default: "false" }
        isLoadingTemplate: { type: Boolean, default: "false" }
        amountError: { type: "String?", default: "null" }
        error: { type: "LoanApplyError?", default: "null" }
        submitSuccess: { type: Boolean, default: "false" }
    screen_state:
      name: LoanApplyScreenState
      members: [Loading, Content, Submitting, Error, Success]
    errors:
      name: LoanApplyError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: AmountExceedsEligibility, retry: false, message_key: error_amount_exceeds }
        - { type: CorpusInsufficient, retry: false, message_key: error_corpus }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: LoanApplyEvent
      members:
        - { name: NavigateToMeetingConduct, params: { loanId: Long } }
        - { name: NavigateBack }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: LoanApplyAction
      members:
        - { name: OnMemberSelected, params: { member: GroupMember }, trigger: "Select from member dropdown" }
        - { name: OnAmountChanged, params: { amount: String }, trigger: "Type loan amount" }
        - { name: OnDurationChanged, params: { weeks: Int }, trigger: "Select duration" }
        - { name: OnPurposeChanged, params: { purpose: LoanPurpose }, trigger: "Select purpose" }
        - { name: OnProductSelected, params: { product: LoanProduct }, trigger: "Select loan product" }
        - { name: OnSubmit, trigger: "Tap Submit button" }
        - { name: OnBack, trigger: "Tap back / nav icon" }
    di:
      - LoanRepository
      - MemberRepository
      - GroupRepository
      - NetworkMonitor
      - SessionManager

flow_logic:
  on_load:
    - action: load_members
      api: get_group_members
    - action: load_loan_products
      api: get_loan_products
    - action: load_corpus
      api: get_group_corpus
    - action: load_group_config
      api: get_group_config
  on_member_selected:
    - action: fetch_member_savings
      api: get_member_savings
    - action: compute_eligible_amount
      formula: "memberSavingsBalance * loanMultiplier"
    - action: load_loan_template
      api: get_loan_template
  on_amount_changed:
    - action: validate_amount
      rule: "requestedAmount <= eligibleAmount"
      on_fail: set_amount_error
    - action: check_corpus
      rule: "corpusBalance - requestedAmount >= corpusBalance * 0.10"
      on_fail: set_corpus_warning
  on_submit:
    - action: validate_form
    - action: submit_loan_application
      api: post_loan
      on_success: navigate_to_meeting_conduct
      on_error: show_error

dependencies:
  repositories:
    - name: LoanRepository
      methods:
        - "submitLoanApplication(request: LoanApplicationRequest): Flow<Long>"
        - "getLoanProducts(): Flow<List<LoanProduct>>"
        - "getLoanTemplate(clientId: Long, productId: Long): Flow<LoanTemplate>"
    - name: MemberRepository
      methods:
        - "getGroupMembers(groupId: Long): Flow<List<GroupMember>>"
        - "getMemberSavingsBalance(memberId: Long): Flow<Double>"
    - name: GroupRepository
      methods:
        - "getGroupCorpus(groupId: Long): Flow<Double>"
        - "getGroupConfig(groupId: Long): Flow<GroupConfig>"
  services:
    - NetworkMonitor
    - SessionManager
  local_db:
    - table: group_members
    - table: loan_products
    - table: dt_group_config

api:
  - id: get_group_members
    function: get_group_members
    method: get
    endpoint: "/groups/{groupId}?associations=clientMembers"
    description: Fetch all group members for the member selector
    params:
      groupId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        clientMembers:
          type: array
          items:
            id: Long
            displayName: String
            imagePresent: Boolean
    errors:
      404: Group not found
      500: Server error

  - id: get_loan_products
    function: list_available_loan_products
    method: get
    endpoint: "/loanproducts"
    description: List available loan products from Fineract
    params: {}
    response:
      type: array
      items:
        id: Long
        name: String
        shortName: String
        principal: Double
        minPrincipal: Double
        maxPrincipal: Double
        numberOfRepayments: Int
        interestRatePerPeriod: Double
    cache:
      ttl: 3600
      strategy: cache-first

  - id: get_loan_template
    function: get_loan_app_template
    method: get
    endpoint: "/loans/template"
    description: Load loan template for selected client and product (pre-fills defaults)
    params:
      clientId: { type: Long, required: true }
      productId: { type: Long, required: true }
      templateType: { type: String, default: "individual" }
    response:
      type: object
      fields:
        principal: Double
        numberOfRepayments: Int
        interestRatePerPeriod: Double
        interestType: { id: Int, value: String }
        amortizationType: { id: Int, value: String }
        repaymentEvery: Int

  - id: get_member_savings
    function: get_savings
    method: get
    endpoint: "/clients/{clientId}/accounts"
    description: Get savings account balance for eligibility computation
    params:
      clientId: { type: Long, required: true }
    response:
      type: object
      fields:
        savingsAccounts:
          type: array
          items:
            id: Long
            accountBalance: Double
            status: { value: String }

  - id: get_group_corpus
    function: get_group_corpus
    method: get
    endpoint: "/datatables/dt_group_corpus/{groupId}"
    description: Get current group fund balance for corpus check
    params:
      groupId: { type: Long, required: true }
    response:
      type: object
      fields:
        corpus_balance: Double
        last_updated: String

  - id: get_group_config
    function: get_group_config
    method: get
    endpoint: "/datatables/dt_group_config/{groupId}"
    description: Fetch loan_multiplier and other group policy settings
    params:
      groupId: { type: Long, required: true }
    response:
      type: object
      fields:
        loan_multiplier: Double
        max_loan_amount: Double
        meeting_frequency: String

  - id: post_loan
    function: create_new_loan
    method: post
    endpoint: "/loans"
    description: Submit loan application; Fineract creates it with status "submitted and pending approval"
    body:
      clientId: Long
      productId: Long
      principal: Double
      loanTermFrequency: Int
      loanTermFrequencyType: { id: 1, value: "Weeks" }
      numberOfRepayments: Int
      repaymentEvery: 1
      repaymentFrequencyType: { id: 1, value: "Weeks" }
      interestRatePerPeriod: Double
      amortizationType: { id: 1, value: "Equal installments" }
      interestType: { id: 0, value: "Declining Balance" }
      interestCalculationPeriodType: { id: 1, value: "Same as repayment period" }
      transactionProcessingStrategyId: 1
      expectedDisbursementDate: String
      submittedOnDate: String
      loanPurposeId: Int
    response:
      type: object
      fields:
        officeId: Long
        clientId: Long
        loanId: Long
        resourceId: Long
    errors:
      400: Validation error — show field errors
      403: Forbidden — insufficient role
      500: Server error

dtos:
  GroupMember:
    id: Long
    displayName: String
    imagePresent: Boolean
    fineractClientId: Long

  LoanProduct:
    id: Long
    name: String
    shortName: String
    minPrincipal: Double
    maxPrincipal: Double
    interestRatePerPeriod: Double

  LoanPurpose:
    values: [MEDICAL, EDUCATION, BUSINESS, EMERGENCY, OTHER]

  LoanApplicationRequest:
    memberId: Long
    productId: Long
    amount: Double
    durationWeeks: Int
    purpose: LoanPurpose
    groupId: Long

  GroupConfig:
    loanMultiplier: Double
    maxLoanAmount: Double

components:
  - id: top_bar
    type: top-bar
    title: "Apply for Loan"
    style:
      background: primary
      text_color: onPrimary
    navigation_icon: arrow_back
    on_nav_click: { action: OnBack }
    test_context:
      purpose: "Screen header with back navigation"
      interaction_type: static
      data_driven: false
      required_fields: []

  - id: member_selector
    type: dropdown
    label: "Select Member"
    placeholder: "Choose group member"
    icon: person
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    options_source: members
    option_label: "displayName"
    on_change: { action: OnMemberSelected, param: member }
    test_context:
      purpose: "Select the member who will receive the loan"
      interaction_type: dropdown_select
      data_driven: true
      required_fields: [members]

  - id: eligibility_banner
    type: info-banner
    style:
      background: primaryContainer
      text_color: onPrimaryContainer
      corner_radius: 8dp
      padding: 12dp
    content:
      - type: text
        style: { text_style: bodyMedium }
        value: "Savings balance: KES {{memberSavingsBalance | number}}"
      - type: text
        style: { text_style: titleSmall, color: primary }
        value: "Max eligible: KES {{eligibleAmount | number}} ({{loanMultiplier}}× savings)"
    visible_when: "selectedMember != null"
    test_context:
      purpose: "Shows eligibility cap once a member is selected"
      interaction_type: static
      data_driven: true
      required_fields: [memberSavingsBalance, eligibleAmount, loanMultiplier]

  - id: amount_input
    type: text-field
    label: "Requested Amount (KES)"
    placeholder: "e.g. 1500"
    input_type: number
    keyboard: decimal
    leading_icon: currency_exchange
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    on_change: { action: OnAmountChanged, param: amount }
    error_text: "{{amountError}}"
    test_context:
      purpose: "Loan amount entry; validates against eligibility cap"
      interaction_type: text_input
      data_driven: false
      required_fields: [requestedAmount]

  - id: corpus_warning_banner
    type: warning-banner
    style:
      background: "#FFF9C4"
      text_color: "#E65100"
      corner_radius: 8dp
      padding: 12dp
    message: "Warning: Disbursing this amount will reduce the group corpus below 10% buffer. Current balance: KES {{corpusBalance | number}}."
    visible_when: "corpusWarning"
    test_context:
      purpose: "Alerts treasurer/chairperson of corpus depletion risk (FR-018)"
      interaction_type: static
      data_driven: true
      required_fields: [corpusBalance]

  - id: duration_dropdown
    type: dropdown
    label: "Loan Duration"
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    options:
      - { label: "4 weeks", value: 4 }
      - { label: "8 weeks", value: 8 }
      - { label: "12 weeks", value: 12 }
      - { label: "24 weeks", value: 24 }
      - { label: "52 weeks (1 year)", value: 52 }
    selected_value: "{{durationWeeks}}"
    on_change: { action: OnDurationChanged, param: weeks }
    test_context:
      purpose: "Select repayment duration in weeks"
      interaction_type: dropdown_select
      data_driven: false
      required_fields: [durationWeeks]

  - id: purpose_dropdown
    type: dropdown
    label: "Loan Purpose"
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    options:
      - { label: "Medical", value: MEDICAL }
      - { label: "Education", value: EDUCATION }
      - { label: "Business", value: BUSINESS }
      - { label: "Emergency", value: EMERGENCY }
      - { label: "Other", value: OTHER }
    selected_value: "{{purpose}}"
    on_change: { action: OnPurposeChanged, param: purpose }
    test_context:
      purpose: "Categorize loan purpose for reporting"
      interaction_type: dropdown_select
      data_driven: false
      required_fields: [purpose]

  - id: product_dropdown
    type: dropdown
    label: "Loan Product"
    placeholder: "Select product"
    style:
      min_touch_target: 48dp
      corner_radius: 8dp
    options_source: loanProducts
    option_label: "name"
    on_change: { action: OnProductSelected, param: product }
    test_context:
      purpose: "Select the Fineract loan product; drives interest rate and schedule"
      interaction_type: dropdown_select
      data_driven: true
      required_fields: [loanProducts]

  - id: submit_button
    type: button
    label: "Submit Application"
    style:
      background: primary
      text_color: onPrimary
      corner_radius: 24dp
      min_touch_target: 56dp
      width: fill
    loading_when: "isSubmitting"
    enabled_when: "selectedMember != null && requestedAmount.isNotBlank() && amountError == null && selectedProduct != null"
    on_click: { action: OnSubmit, target: loan-list }
    test_context:
      purpose: "Submit loan application to Fineract; disabled until all required fields valid"
      interaction_type: tap
      data_driven: true
      required_fields: [selectedMember, requestedAmount, selectedProduct]

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "Could not submit"
    body: "{{error.message}}"
    cta_label: "Try Again"
    on_click: { action: OnSubmit, target: loan-list }
    test_context:
      purpose: "Show submission error with retry"
      interaction_type: tap
      data_driven: true
      required_fields: [error.message]

states:
  initial_state: content
  loading:
    components: [top_bar]
    description: "Loading members, products, and config in parallel before showing form"
  content:
    components:
      - top_bar
      - member_selector
      - eligibility_banner
      - amount_input
      - corpus_warning_banner
      - duration_dropdown
      - purpose_dropdown
      - product_dropdown
      - submit_button
    description: "Form ready for input; eligibility and corpus banners shown conditionally"
    demo_data:
      selectedMember: { id: 1, displayName: "Peter Otieno" }
      memberSavingsBalance: 5000
      loanMultiplier: 3.0
      eligibleAmount: 15000
      corpusBalance: 24000
      requestedAmount: "1500"
      durationWeeks: 12
      purpose: BUSINESS
  submitting:
    components:
      - top_bar
      - member_selector
      - eligibility_banner
      - amount_input
      - corpus_warning_banner
      - duration_dropdown
      - purpose_dropdown
      - product_dropdown
      - submit_button
    description: "Submit button shows loading indicator; form inputs disabled"
  error:
    components: [top_bar, error_state]
    description: "API submission failed; error shown with retry"

i18n:
  en:
    screen_title: "Apply for Loan"
    member_label: "Select Member"
    amount_label: "Requested Amount (KES)"
    duration_label: "Loan Duration"
    purpose_label: "Loan Purpose"
    product_label: "Loan Product"
    eligibility_savings: "Savings balance: KES {{amount}}"
    eligibility_max: "Max eligible: KES {{amount}} ({{multiplier}}× savings)"
    corpus_warning: "Warning: Disbursing this amount will reduce the group corpus below 10% buffer."
    submit_button: "Submit Application"
    error_amount_exceeds: "Amount exceeds eligible limit of KES {{limit}}"
    error_corpus: "Corpus balance too low to support this disbursement."
    error_network: "No internet. Application will be queued offline."
    error_server: "Server error. Please try again."
    error_auth: "Session expired. Please log in again."
  sw:
    screen_title: "Omba Mkopo"
    submit_button: "Wasilisha Ombi"
    corpus_warning: "Onyo: Kiasi hiki kitapunguza hazina ya kikundi chini ya 10%."
  fr:
    screen_title: "Demande de Prêt"
    submit_button: "Soumettre la Demande"
  hi:
    screen_title: "ऋण आवेदन"
    submit_button: "आवेदन जमा करें"

analytics:
  screen_view: loan_apply_viewed
  events:
    - trigger: member selected
      name: loan_apply_member_selected
      params: { member_id: Long }
    - trigger: amount entered
      name: loan_apply_amount_entered
      params: { amount: Double, eligible_amount: Double }
    - trigger: corpus warning shown
      name: loan_apply_corpus_warning_shown
      params: { corpus_balance: Double, requested_amount: Double }
    - trigger: submit tapped
      name: loan_apply_submitted
      params: { amount: Double, duration_weeks: Int, purpose: String }
    - trigger: submit success
      name: loan_apply_success
      params: { loan_id: Long }
    - trigger: submit error
      name: loan_apply_error
      params: { error_type: String }
