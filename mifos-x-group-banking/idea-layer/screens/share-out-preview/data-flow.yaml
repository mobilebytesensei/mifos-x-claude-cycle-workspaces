sibling: data-flow
schema_version: "2.1.0"
feature_id: share-out-preview

entries:
  - screen_id: shareOutPreviewScreen
    trigger: on_mount
    description: Fetch center accounts and share-out datatable to compute distribution
    endpoints:
      - { api_id: get_center_accounts, transport: rest, method: get }
      - { api_id: get_share_out_datatable, transport: rest, method: get }
    dtos:
      - { name: CenterAccountsResponse, role: response, api_id: get_center_accounts }
      - { name: ShareOutRecordList, role: response, api_id: get_share_out_datatable }
      - { name: MemberPayout, role: response, api_id: get_center_accounts }
      - { name: MemberSavingsSummary, role: response, api_id: get_center_accounts }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 60
      key_template: "share-out-preview:center:{centerId}:cycle:{cycleNumber}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: show_empty_state, message_key: error_not_found }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "5xx", behavior: show_error_state, message_key: error_server_unavailable }
      - { error_code: "insufficient_data", behavior: show_error_state, message_key: error_not_found }

  - screen_id: shareOutPreviewScreen
    trigger: on_refresh
    description: User pulls to refresh or taps refresh icon — re-fetches all data fresh
    endpoints:
      - { api_id: get_center_accounts, transport: rest, method: get }
      - { api_id: get_share_out_datatable, transport: rest, method: get }
    dtos:
      - { name: CenterAccountsResponse, role: response, api_id: get_center_accounts }
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "network.offline", behavior: show_snackbar, message_key: error_offline }

  - screen_id: shareOutPreviewScreen
    trigger: on_interact
    description: User confirms — passes computed payouts as nav args to share-out-execute
    endpoints: []
    dtos:
      - { name: MemberPayout, role: request, api_id: nav_params }
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    navigation:
      - { condition: "OnConfirm && memberPayouts.isNotEmpty()", nav_target: share-out-execute, params: [groupId, centerId, cycleNumber, totalPool, memberPayouts] }
