sibling: tests
schema_version: "4.0"
feature_id: share-out-preview
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SOP-001
      scenario: "On mount, share-out preview loads from ShareOutRepository for groupId"
      type: ViewModel
      priority: P0
      given: "groupId=1; network online"
      when: "ShareOutPreviewScreen enters composition"
      then: "ShareOutRepository.getShareOutPreview(1) called; distribution computed; ShareOutPreviewScreenState=Content"

    - id: TC-SOP-002
      scenario: "ACCUMULATING pool renders ContentAccumulating state with prorata distribution table"
      type: Screen
      priority: P0
      given: "Content state; poolModel=ACCUMULATING; distributionStrategy in {PRORATA_SHARES, PRORATA_SAVINGS, EQUAL}"
      when: "ShareOutPreviewScreen renders"
      then: "ContentAccumulating view shown; per-member prorata amounts in table; total corpus balance shown"

    - id: TC-SOP-003
      scenario: "ROTATING_PAYOUT pool renders ContentRotating state showing beneficiary order"
      type: Screen
      priority: P0
      given: "Content state; poolModel=ROTATING_PAYOUT; distributionStrategy in {FIXED_ORDER, LOTTERY, AUCTION}"
      when: "ShareOutPreviewScreen renders"
      then: "ContentRotating view shown; payout order list; current beneficiary highlighted; next payout amount"

    - id: TC-SOP-004
      scenario: "LOTTERY strategy renders randomized beneficiary order with shuffle indicator"
      type: Screen
      priority: P1
      given: "Content state; poolModel=ROTATING_PAYOUT; distributionStrategy=LOTTERY"
      when: "ContentRotating renders"
      then: "Lottery badge shown; beneficiary order randomized; re-shuffle CTA available for ORGANIZER"

    - id: TC-SOP-005
      scenario: "AUCTION strategy shows bid amounts per beneficiary slot"
      type: Screen
      priority: P1
      given: "Content state; poolModel=ROTATING_PAYOUT; distributionStrategy=AUCTION; bids=[{slot:1, memberId:3, amount:500}]"
      when: "ContentRotating renders"
      then: "Auction badge shown; bid amounts shown per slot; highest bidder gets first payout"

    - id: TC-SOP-006
      scenario: "OnProceedToExecute navigates to share-out-execute with groupId"
      type: ViewModel
      priority: P0
      given: "Content state; ORGANIZER role"
      when: "OnProceedToExecute fires"
      then: "NavigateToShareOutExecute emitted with groupId=1"

    - id: TC-SOP-007
      scenario: "Non-ORGANIZER role cannot see Proceed button"
      type: Screen
      priority: P1
      given: "userRole=MEMBER"
      when: "ShareOutPreviewScreen renders"
      then: "Proceed to Execute button not visible; read-only view only"

    - id: TC-SOP-008
      scenario: "Error state shows retry on load failure"
      type: Screen
      priority: P1
      given: "ShareOutRepository.getShareOutPreview returns network error"
      when: "load completes"
      then: "ShareOutPreviewScreenState=Error; retry CTA visible"
