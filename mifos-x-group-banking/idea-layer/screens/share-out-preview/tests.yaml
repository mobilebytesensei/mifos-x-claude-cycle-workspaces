sibling: tests
schema_version: "4.0"
feature_id: share-out-preview

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    UseCase: "85%+"

  scenarios:
    - id: TC-SOP-001
      scenario: "On mount — loading state shown, then corpus + profit + payouts computed"
      type: ViewModel
      priority: P0
      given: "groupId=1, centerId=1 from nav params"
      when: "ShareOutPreviewScreen enters composition"
      then: "isLoading=true → false, totalCorpus=20000, totalProfit=4000, totalPool=24000, 5 member rows"

    - id: TC-SOP-002
      scenario: "Pro-rata distribution sums to totalPool"
      type: UseCase
      priority: P0
      given: "5 members with savings: [6000, 4800, 3850, 3000, 2250], totalPool=24000"
      when: "Distribution computed"
      then: "Sum of all payoutAmounts == 24000 (within rounding tolerance of 1 KES)"

    - id: TC-SOP-003
      scenario: "Share percentage displayed to 1 decimal place"
      type: Screen
      priority: P1
      given: "memberPayouts with sharePercent=28.3333"
      when: "Content state rendered"
      then: "Table shows '28.3%' not '28.3333%'"

    - id: TC-SOP-004
      scenario: "Confirm button disabled when memberPayouts is empty"
      type: Screen
      priority: P0
      given: "memberPayouts=[]"
      when: "Content state rendered"
      then: "confirm_button enabled_when='memberPayouts.isNotEmpty()' evaluates false — disabled"

    - id: TC-SOP-005
      scenario: "Confirm tapped — navigates to share-out-execute with all computed data"
      type: ViewModel
      priority: P0
      given: "Content state, memberPayouts.isNotEmpty()"
      when: "OnConfirm action"
      then: "NavigateToShareOutExecute event emitted with groupId=1, centerId=1, totalPool=24000, memberPayouts(5 items)"

    - id: TC-SOP-006
      scenario: "Refresh icon — re-fetches data fresh, progress shown"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh action"
      then: "isLoading=true, API re-called with no_cache strategy, data updated on response"

    - id: TC-SOP-007
      scenario: "Network error — error state shown with retry"
      type: ViewModel
      priority: P1
      given: "Network unavailable, no cache"
      when: "On mount API call fails"
      then: "State is error, error_state component shown with 'Could not compute distribution', Retry CTA"

    - id: TC-SOP-008
      scenario: "Retry from error state re-triggers API call"
      type: ViewModel
      priority: P1
      given: "Error state"
      when: "Retry action"
      then: "isLoading=true, API re-called, transitions to Content on success"

    - id: TC-SOP-009
      scenario: "Highest payout member row highlighted in table"
      type: Screen
      priority: P2
      given: "Amina Hassan has highest payoutAmount=6792"
      when: "Content state table rendered"
      then: "Amina's row has highlight_max style: background='#E8F5E9', text_color='#1B5E20'"

    - id: TC-SOP-010
      scenario: "Fund summary card shows correct labeled values"
      type: Screen
      priority: P0
      given: "totalCorpus=20000, totalProfit=4000, totalPool=24000"
      when: "Content state rendered"
      then: "'Total Corpus (Fund): KES 20,000', 'Total Profit: KES 4,000', 'Total Distribution Pool: KES 24,000'"

    - id: TC-SOP-011
      scenario: "Cycle header shows correct cycle number from nav params"
      type: Screen
      priority: P1
      given: "cycleNumber=1"
      when: "Content state rendered"
      then: "cycle_info_banner shows 'Cycle 1 — Distribution Preview'"

    - id: TC-SOP-012
      scenario: "401 response — navigates to login"
      type: ViewModel
      priority: P0
      given: "Session expired"
      when: "API returns 401"
      then: "NavigateBack event emitted, user redirected to login screen"
