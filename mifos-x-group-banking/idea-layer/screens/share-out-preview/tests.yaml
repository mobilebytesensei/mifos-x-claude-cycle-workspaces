sibling: tests
schema_version: "4.0"
feature_id: share-out-preview

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SOP-001
      scenario: "On mount — get_shareout_preview fires, loading state shown, then Content state from ShareOutPreview DTO"
      type: ViewModel
      priority: P0
      given: "groupId='GRP-001', cycleNumber=1 from nav params"
      when: "ShareOutPreviewScreen enters composition"
      then: "isLoading=true → false; totalCorpus=20000, totalProfit=4000, totalPool=24000; 5 member rows for ACCUMULATING variant"

    - id: TC-SOP-002
      scenario: "Pro-rata distribution sums to totalPool"
      type: Repository
      priority: P0
      given: "5 members with savings: [6000, 4800, 3850, 3000, 2250], totalPool=24000"
      when: "ShareOutPreview received from companion API"
      then: "Sum of all memberPayouts[].payoutAmount == 24000 (within 1 KES rounding tolerance)"

    - id: TC-SOP-003
      scenario: "Share percentage displayed to 1 decimal place"
      type: Screen
      priority: P1
      given: "memberPayouts with sharePercent=28.3"
      when: "Content state rendered"
      then: "Table shows '28.3%' not raw float"

    - id: TC-SOP-004
      scenario: "Confirm button disabled when memberPayouts is empty (ACCUMULATING)"
      type: Screen
      priority: P0
      given: "poolModel=ACCUMULATING, memberPayouts=[]"
      when: "Content state rendered"
      then: "confirm_button evaluates memberPayouts.isNotEmpty() — disabled"

    - id: TC-SOP-005
      scenario: "ACCUMULATING Confirm tapped — navigates to share-out-execute with groupId, cycleNumber, poolModel, memberPayouts"
      type: ViewModel
      priority: P0
      given: "Content state, poolModel=ACCUMULATING, memberPayouts.isNotEmpty()"
      when: "OnConfirmTap action"
      then: "NavigateToShareOutExecute emitted with groupId, cycleNumber=1, poolModel=ACCUMULATING, memberPayouts[5]; no centerId param"

    - id: TC-SOP-006
      scenario: "ROTATING_PAYOUT content shows recipient card instead of member table"
      type: Screen
      priority: P0
      given: "get_shareout_preview returns ShareOutPreview with poolModel=ROTATING_PAYOUT, nextRecipientName='Grace Wairimu', nextRecipientAmount=30000"
      when: "Content state rendered"
      then: "RecipientCard shows 'Grace Wairimu' and 'KES 30,000'; member payout table NOT rendered"

    - id: TC-SOP-007
      scenario: "ROTATING_PAYOUT Confirm tapped — navigates to share-out-execute with recipientMemberId and amount"
      type: ViewModel
      priority: P0
      given: "Content state, poolModel=ROTATING_PAYOUT, rotationPosition=3, nextRecipientName='Grace Wairimu', nextRecipientAmount=30000"
      when: "OnConfirmTap action"
      then: "NavigateToShareOutExecute emitted with groupId, cycleNumber, poolModel=ROTATING_PAYOUT, recipientMemberId, amount=30000"

    - id: TC-SOP-008
      scenario: "Refresh icon — re-fetches get_shareout_preview with bypass_and_refresh strategy"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefreshTap action"
      then: "isLoading=true, cache bypassed, API re-called; data updated on response"

    - id: TC-SOP-009
      scenario: "Network error with no cache — error state shown with retry CTA"
      type: ViewModel
      priority: P1
      given: "Network unavailable, no cache"
      when: "On mount"
      then: "Error state shown with 'Could not load distribution preview', Retry CTA"

    - id: TC-SOP-010
      scenario: "409 CycleComplete — CycleComplete state shown (share-out already executed this cycle)"
      type: ViewModel
      priority: P0
      given: "get_shareout_preview returns 409"
      when: "On mount"
      then: "CycleComplete state rendered; Confirm button hidden; message 'Share-out already executed for this cycle'"

    - id: TC-SOP-011
      scenario: "Retry from error state re-triggers get_shareout_preview"
      type: ViewModel
      priority: P1
      given: "Error state"
      when: "OnRetryTap action"
      then: "isLoading=true, API re-called, transitions to Content on success"

    - id: TC-SOP-012
      scenario: "Highest payout member row highlighted in ACCUMULATING table"
      type: Screen
      priority: P2
      given: "Amina Wanjiru has highest payoutAmount=6792"
      when: "Content state table rendered"
      then: "Amina's row has highlight_max style"

    - id: TC-SOP-013
      scenario: "Fund summary card shows correctly labeled values"
      type: Screen
      priority: P0
      given: "totalCorpus=20000, totalProfit=4000, totalPool=24000"
      when: "Content state rendered"
      then: "'Total Corpus: KES 20,000', 'Total Profit: KES 4,000', 'Total Distribution Pool: KES 24,000'"

    - id: TC-SOP-014
      scenario: "Cycle header shows correct cycle number from nav param"
      type: Screen
      priority: P1
      given: "cycleNumber=1"
      when: "Content state rendered"
      then: "cycle_info_banner shows 'Cycle 1 — Distribution Preview'"

    - id: TC-SOP-015
      scenario: "401 response — navigates to login"
      type: ViewModel
      priority: P0
      given: "Session expired"
      when: "get_shareout_preview returns 401"
      then: "NavigateBack emitted, user redirected to login"

    - id: TC-SOP-016
      scenario: "shareout_preview_cache primary_key is groupId:cycleNumber"
      type: Repository
      priority: P1
      given: "get_shareout_preview called twice with same groupId:cycleNumber within TTL 60s"
      when: "Second call within TTL"
      then: "Cached response returned, no second network request fired"
