# ─────────────────────────────────────────────────────────────────────────────
# E2E — REAL share-out PREVIEW (non-destructive compute) against LIVE mifos-bank-2
# ─────────────────────────────────────────────────────────────────────────────
# login → organizer-dashboard → group-list → group-dashboard → Share Out →
#   share-out-preview (GET /companion/groups/1/shareout/preview → real corpus
#   15000 split pro-rata across the 3 real members: Amina/Grace/Joseph each 5000).
# STOPS at the preview — deliberately does NOT tap Confirm/Execute, so Mwangaza's
# corpus is never distributed. The share-out EXECUTE write is separately curl-proven
# on a throwaway group (corpus 900→0 via 3 real Fineract withdrawals).
# Prereq: Go companion :8090 + adb reverse tcp:8080 tcp:8090.
appId: org.mifos.groupbanking
name: e2e — real share-out preview (compute, live mifos-bank-2)
tags:
  - e2e
  - group-banking
  - share-out-preview
  - real-network
---
- launchApp:
    clearState: true
- assertVisible: { id: "login_signup_screen" }
- tapOn: { id: "login_signup_field_email_phone" }
- inputText: "mifos"
- tapOn: { id: "login_signup_field_password" }
- inputText: "password"
- hideKeyboard
- tapOn: { id: "login_signup_login_button" }
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 20000
- tapOn: "All Groups"
- extendedWaitUntil:
    visible: { id: "group_list_screen" }
    timeout: 15000
- tapOn: "Mwangaza Women's Group"
- extendedWaitUntil:
    visible: { id: "group_dashboard_screen" }
    timeout: 20000

# --- Share Out → share-out-preview (real pro-rata payouts, non-destructive) ---
- tapOn: { id: "group_dashboard_share_out_button" }
- extendedWaitUntil:
    visible: { id: "share_out_preview_screen" }
    timeout: 20000
# real members + computed payouts from the live corpus
- assertVisible: "Grace Wanjiru"
# STOP — do NOT tap share_out_preview_confirm_button (would run the destructive
# execute on the demo group). Preview compute is proven; execute is curl-proven
# on the throwaway group.
