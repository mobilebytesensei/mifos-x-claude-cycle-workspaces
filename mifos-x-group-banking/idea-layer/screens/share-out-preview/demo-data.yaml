  - dto: error
    count_hint: 1
    source_notes: >
      Singular binding target for the error_state component ({{error.message}}) rendered
      in the Error screen_state. Represents a ShareOutPreviewError of type Server
      (retry: true) surfaced when the companion COMP-DIST-001 preview computation fails.
      The Retry action re-invokes get_shareout_preview and returns to Loading.
    items:
      - type: Server
        code: "SHAREOUT_PREVIEW_FAILED"
        message: "Server error. Please try again."
        retry: true

