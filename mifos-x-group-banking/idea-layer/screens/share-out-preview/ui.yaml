sibling: ui
schema_version: "4.0"
feature_id: share-out-preview

route: /groups/{groupId}/share-out/preview
entry_points:
  - source: group-dashboard
    label: Share Out (cycle-end action)
nav_params:
  groupId: { type: Long, required: true }
  centerId: { type: Long, required: true }

screens:
  - id: share-out-preview-screen
    name: ShareOutPreviewScreen
    type: detail
    description: Read-only distribution summary with per-member payout table and confirm CTA

state_model:
  ShareOutPreviewViewModel:
    state:
      name: ShareOutPreviewState
      fields:
        isLoading: { type: Boolean, default: "true" }
        totalCorpus: { type: Double, default: "0.0" }
        totalProfit: { type: Double, default: "0.0" }
        totalPool: { type: Double, default: "0.0" }
        memberPayouts: { type: "List<MemberPayout>", default: "emptyList()" }
        error: { type: "ShareOutPreviewError?", default: "null" }
        cycleNumber: { type: Int, default: "0" }
        groupId: { type: Long, default: "0L" }
        centerId: { type: Long, default: "0L" }
    screen_state:
      name: ShareOutPreviewScreenState
      members: [Loading, Content, Error]
    errors:
      name: ShareOutPreviewError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: InsufficientData, retry: false, message_key: error_insufficient_data }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
    events:
      name: ShareOutPreviewEvent
      members:
        - { name: NavigateToShareOutExecute, params: "groupId: Long, centerId: Long, totalPool: Double, memberPayouts: List<MemberPayout>" }
        - { name: NavigateBack }
        - { name: ShowSnackbar, params: "message: String" }
    actions:
      name: ShareOutPreviewAction
      members:
        - { name: OnConfirm, trigger: "Tap Confirm & Proceed button" }
        - { name: OnBack, trigger: "Tap back / nav icon" }
        - { name: Retry, trigger: "Tap retry button on error state" }
        - { name: OnRefresh, trigger: "Pull to refresh" }
    di:
      - ShareOutRepository
      - SavingsRepository
      - NetworkMonitor
      - SessionManager

components:
  - id: top_bar
    type: top-app-bar
    title: "Share-Out Preview"
    style: { background: primary, text_color: onPrimary }
    navigation_icon: arrow_back
    on_navigation_click: { action: OnBack }
    actions:
      - { icon: refresh, content_description: "Refresh calculation", on_click: { action: OnRefresh } }

  - id: cycle_info_banner
    type: banner
    style: { background: primaryContainer, corner_radius: 12dp, padding: 16dp }
    content:
      - { type: text, value: "Cycle {{cycleNumber}} — Distribution Preview", style: { text_style: titleMedium, color: onPrimaryContainer } }
      - { type: text, value: "All calculations are preliminary. Confirm to proceed.", style: { text_style: bodySmall, color: onPrimaryContainer } }

  - id: fund_summary_card
    type: card
    style: { background: surface, elevation: 2dp, corner_radius: 12dp, padding: 16dp }
    content:
      - { type: labeled-value, label: "Total Corpus (Fund)", value: "KES {{totalCorpus | number}}", style: { text_style: bodyLarge } }
      - { type: labeled-value, label: "Total Profit (Interest Earned)", value: "KES {{totalProfit | number}}", style: { text_style: bodyLarge, color: primary } }
      - { type: divider, style: { margin: "8dp 0dp" } }
      - { type: labeled-value, label: "Total Distribution Pool", value: "KES {{totalPool | number}}", style: { text_style: titleLarge, color: primary, font_weight: bold } }

  - id: distribution_formula_chip
    type: chip
    label: "Formula: Pro-rata by savings contribution"
    style: { background: tertiaryContainer, text_color: onTertiaryContainer, corner_radius: 16dp, padding: "6dp 12dp" }

  - id: member_payout_table
    type: data-table
    headers:
      - { label: "Member", width: fill }
      - { label: "Total Savings", width: 104dp }
      - { label: "Share %", width: 64dp }
      - { label: "Payout (KES)", width: 104dp }
    rows_source: memberPayouts
    row_style:
      default: { background: surface, text_color: onSurface }
      highlight_max: { background: "#E8F5E9", text_color: "#1B5E20" }

  - id: confirm_button
    type: button
    variant: filled
    label: "Confirm & Proceed to Execute"
    enabled_when: "memberPayouts.isNotEmpty()"
    style: { background: primary, text_color: onPrimary, corner_radius: 24dp, min_touch_target: 56dp, full_width: true }
    on_click: { action: OnConfirm, target: share-out-execute }

  - id: shimmer_detail
    type: shimmer
    count: 4
    style: { height: 80dp, corner_radius: 12dp }

  - id: error_state
    type: error-state
    icon: cloud_off
    title: "Could not compute distribution"
    body: "{{error.message}}"
    cta_label: "Retry"
    on_click: { action: Retry }

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_detail]
    description: "Fetching corpus, profit, and member savings data; computing distribution"
  content:
    components: [top_bar, cycle_info_banner, fund_summary_card, distribution_formula_chip, member_payout_table, confirm_button]
    description: "Distribution computed; table shows per-member payouts"
    demo_data:
      cycleNumber: 1
      totalCorpus: 20000
      totalProfit: 4000
      totalPool: 24000
      memberPayouts:
        - { memberName: "Amina Hassan", totalSavings: 6800, sharePercent: 28.3, payoutAmount: 6792 }
        - { memberName: "Peter Otieno", totalSavings: 5200, sharePercent: 21.7, payoutAmount: 5208 }
        - { memberName: "Grace Wanjiku", totalSavings: 4800, sharePercent: 20.0, payoutAmount: 4800 }
        - { memberName: "John Mwangi", totalSavings: 4400, sharePercent: 18.3, payoutAmount: 4392 }
        - { memberName: "Mary Akinyi", totalSavings: 2800, sharePercent: 11.7, payoutAmount: 2808 }
  error:
    components: [top_bar, error_state]
    description: "API or computation failed; error shown with retry"

i18n:
  en:
    screen_title: "Share-Out Preview"
    cycle_label: "Cycle {{n}} — Distribution Preview"
    preview_disclaimer: "All calculations are preliminary. Confirm to proceed."
    total_corpus: "Total Corpus (Fund)"
    total_profit: "Total Profit (Interest Earned)"
    total_pool: "Total Distribution Pool"
    formula_label: "Formula: Pro-rata by savings contribution"
    col_member: "Member"
    col_savings: "Total Savings"
    col_share: "Share %"
    col_payout: "Payout (KES)"
    confirm_button: "Confirm & Proceed to Execute"
    error_network: "No internet. Showing cached data."
    error_server: "Server error. Please try again."
    error_insufficient_data: "Insufficient data to compute distribution."
    error_auth: "Session expired. Please log in again."
  sw:
    screen_title: "Muhtasari wa Mgawanyo"
    confirm_button: "Thibitisha na Endelea"
  fr:
    screen_title: "Aperçu du Partage"
    confirm_button: "Confirmer et Procéder"
  hi:
    screen_title: "शेयर-आउट पूर्वावलोकन"
    confirm_button: "पुष्टि करें और आगे बढ़ें"
