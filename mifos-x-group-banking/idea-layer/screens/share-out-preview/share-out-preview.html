<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share-Out Preview — CommonPurse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --primary:#2E7D32; --primary-dark:#1B5E20; --primary-light:#4CAF50;
  --secondary:#FF8F00; --tertiary:#1565C0;
  --on-primary:#FFFFFF; --surface:#FAFAFA; --on-surface:#1A1C19;
  --error:#D32F2F; --primary-container:#A6F1A6; --secondary-container:#FFDDB3;
  --outline:#C8CAC4; --outline-variant:#E5E7E1;
  --surface-variant:#ECF3EC; --on-surface-variant:#43483E;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px;
  font-family:'Noto Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;font-family:'Noto Sans',sans-serif;padding-top:56px}
body.embedded{background:transparent;display:block;min-height:unset;padding-top:0}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:200;background:#1e1e2e;border-bottom:1px solid #333;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;height:56px}
body.embedded #toolbar{display:none}
#toolbar .logo{font-size:13px;font-weight:700;color:#a6f1a6;letter-spacing:.5px;margin-right:8px}
#toolbar select{background:#2a2a3e;color:#e0e0e0;border:1px solid #444;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
#toolbar button{background:#2E7D32;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
.tb-label{color:#888;font-size:11px}
#phone{width:390px;height:844px;background:var(--surface);border-radius:44px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.7);position:relative}
body.embedded #phone{width:100%;height:100vh;border-radius:0;box-shadow:none}
.status-bar{height:44px;background:var(--primary);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
body.embedded .status-bar{display:none}
.status-bar .time{color:#fff;font-size:13px;font-weight:600}
.status-bar .icons{display:flex;gap:6px;align-items:center}
.status-bar .icons span{color:#fff;font-size:16px}
.app-bar{height:56px;background:var(--primary);display:flex;align-items:center;padding:0 4px;gap:0;flex-shrink:0}
.app-bar .back-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:#fff}
.app-bar h1{flex:1;font-size:20px;font-weight:600;color:#fff;letter-spacing:.15px}
.app-bar .action-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:#fff}
.scroll-content{flex:1;overflow-y:auto;background:var(--surface)}
.scroll-content::-webkit-scrollbar{display:none}
.screen-wrap{display:flex;flex-direction:column;height:100%}
.bottom-nav{height:64px;background:#fff;border-top:1px solid var(--outline-variant);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;padding:0 8px}
body.embedded .bottom-nav{display:none}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;border-radius:12px;cursor:pointer;min-width:48px}
.nav-item.active .nav-icon-wrap{background:var(--primary-container)}
.nav-icon-wrap{border-radius:16px;padding:4px 8px;min-width:48px;display:flex;justify-content:center}
.nav-item .material-symbols-outlined{font-size:22px;color:var(--on-surface-variant)}
.nav-item.active .material-symbols-outlined{color:var(--primary)}
.nav-item span.label{font-size:10px;color:var(--on-surface-variant);font-weight:500}
.nav-item.active span.label{color:var(--primary);font-weight:700}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#e8e8e8 25%,#f5f5f5 50%,#e8e8e8 75%);background-size:800px 100%;animation:shimmer 1.4s infinite}
.skel-line{height:16px;border-radius:8px;margin-bottom:8px}
.cycle-banner{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);padding:20px 20px 28px;color:#fff;position:relative;overflow:hidden}
.cycle-banner::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08)}
.cycle-banner::after{content:'';position:absolute;bottom:-30px;left:30px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.05)}
.cycle-banner .group-name{font-size:18px;font-weight:700;margin-bottom:6px}
.cycle-banner .cycle-tag{background:rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;display:inline-block;margin-bottom:12px}
.cycle-banner .date-range{font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.fund-summary{background:#fff;margin:0 16px;border-radius:var(--radius-md);box-shadow:0 2px 8px rgba(0,0,0,.1);padding:16px;margin-top:-16px;position:relative;z-index:2}
.fund-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--outline-variant)}
.fund-row:last-child{border-bottom:none}
.fund-row .label{font-size:13px;color:var(--on-surface-variant);display:flex;align-items:center;gap:6px}
.fund-row .value{font-size:14px;font-weight:600;color:var(--on-surface)}
.fund-row.total-row .label{font-size:14px;font-weight:700;color:var(--primary)}
.fund-row.total-row .value{font-size:16px;font-weight:700;color:var(--primary)}
.equals-line{border-top:2px solid var(--primary);margin:4px 0}
.formula-chip{background:var(--primary-container);border-radius:8px;padding:10px 14px;margin:12px 16px;display:flex;align-items:flex-start;gap:8px}
.formula-chip .material-symbols-outlined{font-size:18px;color:var(--primary);margin-top:1px;flex-shrink:0}
.formula-chip p{font-size:12px;color:var(--primary-dark);line-height:1.6}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.section-header h2{font-size:13px;font-weight:700;color:var(--on-surface);text-transform:uppercase;letter-spacing:.8px}
.section-header .count-chip{background:var(--surface-variant);border-radius:12px;padding:2px 8px;font-size:12px;color:var(--on-surface-variant);font-weight:600}
.table-wrap{background:#fff;margin:0 16px 12px;border-radius:var(--radius-md);box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden}
table.tbl{width:100%;border-collapse:collapse}
table.tbl thead{background:var(--surface-variant)}
table.tbl thead th{padding:10px 8px;text-align:left;font-size:11px;font-weight:700;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:.5px}
table.tbl thead th:not(:first-child){text-align:right}
table.tbl tbody td{padding:10px 8px;font-size:13px;color:var(--on-surface);border-top:1px solid var(--outline-variant)}
table.tbl tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
table.tbl tbody tr.highlight-row td{background:var(--primary-container)}
table.tbl tbody tr.highlight-row td:first-child{font-weight:600}
table.tbl tfoot td{padding:10px 8px;font-size:13px;font-weight:700;color:var(--primary);background:var(--surface-variant);border-top:2px solid var(--primary)}
table.tbl tfoot td:not(:first-child){text-align:right}
.member-cell{display:flex;align-items:center;gap:8px}
.avatar-sm{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.share-pct{color:var(--tertiary);font-weight:600}
.payout-amt{color:var(--primary-dark);font-weight:700}
.warn-banner{background:var(--secondary-container);border-radius:var(--radius-sm);padding:10px 14px;margin:0 16px 12px;display:flex;align-items:flex-start;gap:8px}
.warn-banner .material-symbols-outlined{font-size:20px;color:var(--secondary);flex-shrink:0;margin-top:1px}
.warn-banner p{font-size:12px;color:#5D4037;line-height:1.5}
.member-card{background:#fff;border-radius:var(--radius-md);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px 16px;margin:0 16px 8px}
.action-bar{padding:12px 16px 24px;display:flex;gap:10px}
.btn-primary{flex:1;background:var(--primary);color:#fff;border:none;border-radius:100px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Noto Sans',sans-serif;box-shadow:0 2px 8px rgba(46,125,50,.3);transition:background .2s}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{padding:14px 16px;background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:100px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans',sans-serif;display:flex;align-items:center;gap:6px;white-space:nowrap}
.progress-bar-wrap{background:var(--outline-variant);border-radius:4px;height:6px;overflow:hidden;margin-top:8px}
.progress-bar-fill{height:100%;border-radius:4px;background:var(--primary);transition:width .6s ease}
</style>
</head>
<body>
<div id="toolbar">
  <span class="logo">CommonPurse</span>
  <span class="tb-label">Screen:</span>
  <span style="color:#a6f1a6;font-size:12px;font-weight:600">share-out-preview</span>
  <span class="tb-label" style="margin-left:8px">State:</span>
  <select id="stateSelect" onchange="switchState(this.value)">
    <option value="loading">loading</option>
    <option value="content" selected>content</option>
    <option value="error">error</option>
  </select>
  <button onclick="switchState(document.getElementById('stateSelect').value)">Reload</button>
</div>
<div id="phone">
  <div class="screen-wrap">
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <span class="material-symbols-outlined" style="font-size:16px">signal_cellular_alt</span>
        <span class="material-symbols-outlined" style="font-size:16px">wifi</span>
        <span class="material-symbols-outlined" style="font-size:16px">battery_full</span>
      </div>
    </div>
    <div class="app-bar">
      <div class="back-btn"><span class="material-symbols-outlined">arrow_back</span></div>
      <h1>Share-Out Preview</h1>
      <div class="action-btn"><span class="material-symbols-outlined">more_vert</span></div>
    </div>
    <div class="scroll-content" id="mainContent"></div>
    <div class="bottom-nav">
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">home</span></div><span class="label">Home</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">group</span></div><span class="label">Group</span></div>
      <div class="nav-item active"><div class="nav-icon-wrap"><span class="material-symbols-outlined">savings</span></div><span class="label">Share-Out</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">sync</span></div><span class="label">Sync</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">settings</span></div><span class="label">Settings</span></div>
    </div>
  </div>
</div>
<script>
var EMBEDDED=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
if(EMBEDDED)document.body.classList.add('embedded');

var MEMBERS=[
  {id:'GM',name:'Grace Mwangi',initials:'GM',avatarBg:'#A6F1A6',avatarColor:'#1B5E20',role:'Chairperson',savings:14200,meetings:24,totalMeetings:24},
  {id:'MA',name:'Mary Akinyi',initials:'MA',avatarBg:'#BBDEFB',avatarColor:'#0D47A1',role:'Secretary',savings:13800,meetings:23,totalMeetings:24},
  {id:'JN',name:'Jane Njoroge',initials:'JN',avatarBg:'#E1BEE7',avatarColor:'#4A148C',role:'Member',savings:12380,meetings:23,totalMeetings:24},
  {id:'AD',name:'Amara Diallo',initials:'AD',avatarBg:'#FFDDB3',avatarColor:'#E65100',role:'Treasurer',savings:12600,meetings:22,totalMeetings:24},
  {id:'PO',name:'Peter Otieno',initials:'PO',avatarBg:'#F8BBD0',avatarColor:'#880E4F',role:'Member',savings:11800,meetings:21,totalMeetings:24}
];
var CORPUS=48200,PROFIT=4200,SOCIAL=3420;
var TOTAL_SAVINGS=MEMBERS.reduce(function(s,m){return s+m.savings},0);
var TOTAL_POOL=CORPUS+PROFIT;
MEMBERS.forEach(function(m){
  m.pct=(m.savings/TOTAL_SAVINGS*100).toFixed(2);
  m.payout=Math.round(m.savings/TOTAL_SAVINGS*TOTAL_POOL);
});
var maxPayout=Math.max.apply(null,MEMBERS.map(function(m){return m.payout}));

function fmtKES(n){return'KES '+n.toLocaleString('en-KE')}
function icon(n,s){return'<span class="material-symbols-outlined" style="font-size:'+(s||20)+'px">'+n+'</span>'}

function renderLoading(){
  var h='<div style="height:140px;background:linear-gradient(135deg,#2E7D32,#1B5E20)"></div>';
  h+='<div style="margin:0 16px;margin-top:-16px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)">';
  for(var i=0;i<4;i++)h+='<div class="skel-line shimmer" style="width:'+(95-i*12)+'%;margin-bottom:10px"></div>';
  h+='</div>';
  h+='<div style="margin:16px 16px 4px"><div class="skel-line shimmer" style="width:50%;height:12px"></div></div>';
  h+='<div style="background:#fff;margin:0 16px;border-radius:12px;overflow:hidden">';
  for(var j=0;j<6;j++)h+='<div class="shimmer" style="height:44px;margin-bottom:1px"></div>';
  h+='</div>';
  h+='<div style="margin:16px 16px 4px"><div class="skel-line shimmer" style="width:45%;height:12px"></div></div>';
  for(var k=0;k<3;k++)h+='<div style="background:#fff;margin:0 16px 8px;border-radius:12px;height:80px;overflow:hidden"><div class="shimmer" style="height:100%"></div></div>';
  return h;
}

function renderContent(){
  var h='';
  // Cycle Banner
  h+='<div class="cycle-banner">';
  h+='<div class="group-name">Mwangaza Women\'s Group</div>';
  h+='<div class="cycle-tag">Cycle 3 — Final</div>';
  h+='<div class="date-range">'+icon('calendar_month',16)+' 2025-11-01 &rarr; 2026-05-06</div>';
  h+='<div style="display:flex;gap:16px;margin-top:14px">';
  h+='<div style="background:rgba(255,255,255,.15);border-radius:8px;padding:8px 12px;flex:1;text-align:center">';
  h+='<div style="font-size:20px;font-weight:700">'+MEMBERS.length+'</div><div style="font-size:11px;opacity:.8">Members</div></div>';
  h+='<div style="background:rgba(255,255,255,.15);border-radius:8px;padding:8px 12px;flex:1;text-align:center">';
  h+='<div style="font-size:20px;font-weight:700">24</div><div style="font-size:11px;opacity:.8">Weeks Done</div></div>';
  h+='<div style="background:rgba(255,255,255,.15);border-radius:8px;padding:8px 12px;flex:1;text-align:center">';
  h+='<div style="font-size:20px;font-weight:700">100%</div><div style="font-size:11px;opacity:.8">Complete</div></div>';
  h+='</div></div>';
  // Fund Summary
  h+='<div class="fund-summary">';
  h+='<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--on-surface-variant);margin-bottom:8px">Distribution Pool Breakdown</div>';
  h+='<div class="fund-row"><span class="label">'+icon('account_balance',15)+'&nbsp;Group Corpus (Savings)</span><span class="value">'+fmtKES(CORPUS)+'</span></div>';
  h+='<div class="fund-row"><span class="label"><span style="color:var(--secondary);font-weight:700;font-size:16px">+</span>&nbsp;Cycle Interest Profit</span><span class="value" style="color:var(--secondary)">'+fmtKES(PROFIT)+'</span></div>';
  h+='<div class="equals-line"></div>';
  h+='<div class="fund-row total-row"><span class="label">'+icon('payments',16)+'&nbsp;Total Distribution Pool</span><span class="value">'+fmtKES(TOTAL_POOL)+'</span></div>';
  h+='<div style="background:var(--outline-variant);border-radius:6px;padding:8px 10px;margin-top:10px;display:flex;justify-content:space-between;align-items:center">';
  h+='<span style="font-size:12px;color:#888;display:flex;align-items:center;gap:4px">'+icon('volunteer_activism',14)+'&nbsp;Social Fund (retained)</span>';
  h+='<span style="font-size:12px;font-weight:600;color:#888">'+fmtKES(SOCIAL)+'</span></div>';
  h+='<div style="margin-top:8px;background:var(--surface-variant);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--on-surface-variant)">';
  h+='Total Member Savings: <strong>'+fmtKES(TOTAL_SAVINGS)+'</strong> &middot; Pool-to-Savings ratio: <strong>'+(TOTAL_POOL/TOTAL_SAVINGS*100).toFixed(1)+'%</strong></div>';
  h+='</div>';
  // Formula
  h+='<div class="formula-chip">';
  h+=icon('calculate');
  h+='<div><p style="font-size:12px;color:var(--primary-dark);line-height:1.6"><strong>Pro-rata calculation:</strong><br>';
  h+='Member Payout = (Member Savings &divide; Total Group Savings) &times; Distribution Pool<br>';
  h+='<span style="font-size:11px;opacity:.8">Total Savings: '+fmtKES(TOTAL_SAVINGS)+' &middot; Pool: '+fmtKES(TOTAL_POOL)+'</span></p></div>';
  h+='</div>';
  // Table
  h+='<div class="section-header"><h2>Payout Distribution</h2><span class="count-chip">'+MEMBERS.length+' members</span></div>';
  h+='<div class="table-wrap"><table class="tbl">';
  h+='<thead><tr><th>Member</th><th>Savings</th><th>Share%</th><th>Payout&nbsp;(KES)</th></tr></thead>';
  h+='<tbody>';
  MEMBERS.forEach(function(m){
    var isMax=m.payout===maxPayout;
    h+='<tr'+(isMax?' class="highlight-row"':'')+'>';
    h+='<td><div class="member-cell">';
    h+='<div class="avatar-sm" style="background:'+m.avatarBg+';color:'+m.avatarColor+'">'+m.initials+'</div>';
    h+='<div><div style="font-size:13px;font-weight:'+(isMax?700:400)+'">'+m.name+(isMax?' &#9733;':'')+'</div>';
    h+='<div style="font-size:10px;color:#888">'+m.role+'</div></div></div></td>';
    h+='<td>'+Number(m.savings).toLocaleString('en-KE')+'</td>';
    h+='<td><span class="share-pct">'+m.pct+'%</span></td>';
    h+='<td><span class="payout-amt">'+m.payout.toLocaleString('en-KE')+'</span></td>';
    h+='</tr>';
  });
  var totalPayout=MEMBERS.reduce(function(s,m){return s+m.payout},0);
  h+='</tbody><tfoot><tr><td style="font-weight:700">TOTAL</td><td>'+TOTAL_SAVINGS.toLocaleString('en-KE')+'</td><td>100%</td><td>'+totalPayout.toLocaleString('en-KE')+'</td></tr></tfoot>';
  h+='</table></div>';
  // Warning
  h+='<div class="warn-banner">';
  h+=icon('info');
  h+='<p>Savings balances are <strong>final as of today</strong>. Attendance bonuses and late-payment penalties have been applied. Once you proceed to Execute, this distribution cannot be reversed without admin approval.</p>';
  h+='</div>';
  // Per-member detail cards
  h+='<div class="section-header"><h2>Member Breakdowns</h2></div>';
  MEMBERS.forEach(function(m){
    var attendPct=Math.round(m.meetings/m.totalMeetings*100);
    h+='<div class="member-card">';
    h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">';
    h+='<div style="width:44px;height:44px;border-radius:50%;background:'+m.avatarBg+';color:'+m.avatarColor+';display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0">'+m.initials+'</div>';
    h+='<div style="flex:1"><div style="font-size:14px;font-weight:600">'+m.name+'</div><div style="font-size:12px;color:#888">'+m.role+' &middot; '+m.meetings+'/'+m.totalMeetings+' meetings ('+attendPct+'%)</div></div>';
    h+='<div style="text-align:right"><div style="font-size:15px;font-weight:700;color:var(--primary-dark)">'+fmtKES(m.payout)+'</div><div style="font-size:11px;color:var(--secondary)">'+m.pct+'% share</div></div>';
    h+='</div>';
    h+='<div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin-bottom:6px">';
    h+='<span>Savings: '+fmtKES(m.savings)+'</span><span>Share: '+m.pct+'%</span></div>';
    h+='<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:'+m.pct+'%"></div></div>';
    h+='</div>';
  });
  // Action
  h+='<div class="action-bar">';
  h+='<button class="btn-outline" onclick="alert(\'Cancelled\')" style="white-space:nowrap">'+icon('close',18)+'&nbsp;Cancel</button>';
  h+='<button class="btn-primary" onclick="alert(\'Navigate to share-out-execute\')">'+icon('arrow_forward',18)+'&nbsp;Confirm &amp; Execute</button>';
  h+='</div>';
  return h;
}

function renderError(){
  return'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center">'
    +icon('error_outline',64)
    +'<div style="font-size:18px;font-weight:700;margin:16px 0 8px;color:var(--on-surface)">Failed to Load Preview</div>'
    +'<div style="font-size:14px;color:#888;line-height:1.6;margin-bottom:24px">Unable to calculate share-out distribution. Check network connection and try again.</div>'
    +'<button class="btn-primary" onclick="switchState(\'content\')" style="padding:12px 24px;border-radius:100px;width:auto">'+icon('refresh',18)+'&nbsp;Retry</button>'
    +'</div>';
}

var STATES={loading:renderLoading,content:renderContent,error:renderError};
var currentState='content';
function switchState(s){
  if(!STATES[s])return;
  currentState=s;
  document.getElementById('stateSelect').value=s;
  document.getElementById('mainContent').innerHTML=STATES[s]();
  notifyParent();
}
function notifyParent(){
  if(!EMBEDDED)return;
  window.parent.postMessage({type:'screenLoaded',screenId:'share-out-preview',state:currentState,
    inspectorData:{screen:'share-out-preview',title:'Share-Out Preview',state:currentState,
      components:['CycleBanner','FundSummaryCard','FormulaChip','PayoutTable','MemberDetailCards','ActionBar'],
      data:{group:'Mwangaza Women\'s Group',cycle:3,corpus:CORPUS,profit:PROFIT,pool:TOTAL_POOL,members:MEMBERS.length}}},'*');
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='switchState')switchState(e.data.state);
  if(e.data&&e.data.type==='getInspectorData')notifyParent();
});
switchState('content');
</script>
</body>
