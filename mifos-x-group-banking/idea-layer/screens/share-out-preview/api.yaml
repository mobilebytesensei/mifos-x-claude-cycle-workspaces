sibling: api
schema_version: "4.0"
feature_id: share-out-preview

api:
  - id: get_shareout_preview
    function: get_shareout_preview
    method: GET
    endpoint: "/companion/groups/{groupId}/shareout/preview"   # COMP-DIST-001 preview path
    description: >
      Strategy-aware distribution preview computed by the companion API. Returns totalCorpus,
      totalProfit, totalPool, and strategy-specific payload: memberPayouts[] for ACCUMULATING
      types (VSLA/ASCA/SHG/SILC) OR rotationPosition + nextRecipientName + nextRecipientAmount
      for ROTATING_PAYOUT types (ROSCA/chit). Replaces raw /centers/{centerId}/accounts +
      dt_share_out datatable calls.
    params:
      groupId: { type: String, required: true, source: nav_params }
    response:
      type: object
      fields:
        cycleNumber: Int
        poolModel: String         # ACCUMULATING | ROTATING_PAYOUT
        shareoutFormula: String   # PRORATA_SHARES | PRORATA_SAVINGS | EQUAL | FIXED_ORDER | LOTTERY | AUCTION
        totalCorpus: Double
        totalProfit: Double
        totalPool: Double
        memberPayouts:
          type: "array | null"    # present for ACCUMULATING; null for ROTATING_PAYOUT
          items:
            memberId: String
            memberName: String
            sharesHeld: "Int?"       # PRORATA_SHARES only
            totalSavings: "Double?"  # PRORATA_SAVINGS only
            sharePercent: Double
            payoutAmount: Double
        rotationPosition: "Int?"          # ROTATING_PAYOUT: viewer's queue position
        nextRecipientName: "String?"      # ROTATING_PAYOUT: next to receive
        nextRecipientAmount: "Double?"    # ROTATING_PAYOUT: payout to next recipient
    errors:
      401: Unauthorized — session expired
      403: Forbidden — caller is not organizer/treasurer/chair
      404: Group not found
      409: Conflict — share-out already executed this cycle
      500: Server error
    cache:
      ttl: 60
      strategy: network-first
      offline: show_cached

cache_strategy:
  default: network-first
  offline: show_cached

dtos:
  MemberPayout:
    memberId: String
    memberName: String
    sharesHeld: "Int?"           # PRORATA_SHARES: shares × share_value contributed
    totalSavings: "Double?"      # PRORATA_SAVINGS: total savings in KES
    sharePercent: Double
    payoutAmount: { type: Double, currency: KES }

  ShareOutPreview:
    cycleNumber: Int
    poolModel: String
    shareoutFormula: String
    totalCorpus: { type: Double, currency: KES }
    totalProfit: { type: Double, currency: KES }
    totalPool: { type: Double, currency: KES }
    memberPayouts: "List<MemberPayout>?"
    rotationPosition: "Int?"
    nextRecipientName: "String?"
    nextRecipientAmount: "Double?"

  GroupTypeConfig:
    group_type: String
    pool_model: String
    contribution_model: String
    shareout_formula: String
    payout_order_method: String
    share_value: Double
    contribution_amount: Double
    social_fund_enabled: Boolean
    cycle_length_months: Int
    loan_multiplier: Double
    interest_rate: Double
    fine_amount: Double

dependencies:
  repositories:
    - name: ShareOutRepository
      methods:
        - "getShareOutPreview(groupId: String): Flow<ShareOutPreview>"   # COMP-DIST-001 read
  services:
    - NetworkMonitor
    - SessionManager
