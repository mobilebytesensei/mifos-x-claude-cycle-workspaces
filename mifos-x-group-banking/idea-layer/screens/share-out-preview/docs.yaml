identity:
  name: Share-Out Preview
  description: >
    Strategy-adaptive cycle-end distribution preview sourced from companion API (COMP-DIST-001). Formula and UI vary by
    GroupTypeConfig.shareout_formula passed as nav-arg: PRORATA_SHARES (VSLA/SILC) shows per-member shares-held
    breakdown; PRORATA_SAVINGS (ASCA/SHG) shows savings-contribution breakdown; EQUAL splits pool evenly;
    FIXED_ORDER/LOTTERY/AUCTION (ROSCA/chit) shows a rotation-position card with next-recipient name + payout amount
    instead of a per-member table. The strategy formula chip label adapts accordingly. Confirm navigates to
    share-out-execute passing typeConfig for COMP-DIST-001/002 execution routing. Replaces raw Fineract
    /groups/accounts + dt_share_out datatable calls. Role-gated: organizer, treasurer, chairperson only (guard in
    entry_point condition).
  archetype: detail
  version: 2.0.0
