<!DOCTYPE html>
<html lang="en" data-feature="share-out-preview" data-state="error" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>share-out-preview · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .page-content { padding: 16px; }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      text-align: center;
    }
    .empty-icon {
      font-size: 52px;
      margin-bottom: 16px;
      color: var(--md-on-surface-variant, #9ca3af);
    }
    .empty-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--md-on-surface, #1a1a1a);
      margin-bottom: 8px;
    }
    .empty-body {
      font-size: 14px;
      color: var(--md-on-surface-variant, #6b7280);
      line-height: 1.5;
      margin-bottom: 28px;
      max-width: 280px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary {
      background: var(--md-primary, #2563eb);
      color: #fff;
    }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● 5G ▮</span>
  </div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1 class="app-bar-title">Share-Out Preview</h1>
    <button class="icon-btn" aria-label="Refresh">↻</button>
  </header>
  <main class="page-content">
    <div class="empty-state">
      <div class="empty-icon">☁</div>
      <div class="empty-title">Could not compute distribution</div>
      <div class="empty-body">
        The share-out calculation could not be completed. Check your connection and try again.
      </div>
      <button class="btn btn-primary" data-state-to="loading">Retry</button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
