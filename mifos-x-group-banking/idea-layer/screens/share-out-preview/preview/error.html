<!DOCTYPE html>
<!-- render-hash: shareoutpreview-error-v3 -->
<html lang="en" data-feature="share-out-preview" data-state="error" data-aesthetic="minimalist-ui">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>share-out-preview · error · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="detail">
  <div class="status-bar"><span>9:41</span><span>✕ offline ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <button class="back-btn" data-action="OnBack" aria-label="Back to group dashboard">‹</button>
    <h1>Share-Out Preview</h1>
    <div class="top-app-bar-actions">
      <button class="icon-btn" data-action="OnRefresh" aria-label="Refresh calculation" disabled>↻</button>
    </div>
  </header>

  <!-- error_state -->
  <main aria-label="Share-out preview error">
    <div class="empty-state">
      <div class="illus" aria-hidden="true">☁</div>
      <h2>Could not compute distribution</h2>
      <p>Server error. Please try again.</p>
      <button class="btn btn-primary" data-action="Retry" data-state-to="loading">Retry</button>
    </div>
    <div class="alert alert-danger" role="alert" style="margin-top:var(--space-lg);">
      <span aria-hidden="true">⚠️</span>
      <div>
        <h3>Distribution unavailable</h3>
        <p>The companion service could not return a preview. Check your connection and retry.</p>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
