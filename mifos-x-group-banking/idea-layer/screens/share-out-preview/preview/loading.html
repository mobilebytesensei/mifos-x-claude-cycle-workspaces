<!DOCTYPE html>
<html lang="en" data-feature="share-out-preview" data-state="loading" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>share-out-preview · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .shimmer-card {
      background: var(--md-surface-container, #f3f3f3);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      overflow: hidden;
      position: relative;
    }
    .shimmer-line {
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
      height: 14px;
      margin-bottom: 10px;
    }
    .shimmer-line.short { width: 40%; }
    .shimmer-line.medium { width: 65%; }
    .shimmer-line.long { width: 90%; }
    .shimmer-line.full { width: 100%; }
    .shimmer-line.tall { height: 20px; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .page-content { padding: 16px; }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● 5G ▮</span>
  </div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1 class="app-bar-title">Share-Out Preview</h1>
    <button class="icon-btn" aria-label="Refresh">↻</button>
  </header>
  <main class="page-content">
    <!-- Shimmer card 1: banner placeholder -->
    <div class="shimmer-card">
      <div class="shimmer-line medium"></div>
      <div class="shimmer-line short"></div>
    </div>

    <!-- Shimmer card 2: fund summary placeholder -->
    <div class="shimmer-card">
      <div class="shimmer-line long"></div>
      <div class="shimmer-line medium"></div>
      <div class="shimmer-line medium"></div>
      <div class="shimmer-line tall long"></div>
    </div>

    <!-- Shimmer card 3: formula chip + table header placeholder -->
    <div class="shimmer-card">
      <div class="shimmer-line short"></div>
      <div class="shimmer-line full"></div>
      <div class="shimmer-line full"></div>
      <div class="shimmer-line full"></div>
    </div>

    <!-- Shimmer card 4: action button placeholder -->
    <div class="shimmer-card">
      <div class="shimmer-line tall full"></div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
