<!DOCTYPE html>
<html lang="en" data-feature="share-out-preview" data-state="content_rotating" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>share-out-preview · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .page-content { padding: 16px; }
    .banner {
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.5;
    }
    .banner-info {
      background: var(--md-secondary-container, #dbeafe);
      color: var(--md-on-secondary-container, #1e3a5f);
      border-left: 4px solid var(--md-primary, #2563eb);
    }
    .card {
      background: var(--md-surface-container, #f8f9fa);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .kv-grid { display: flex; flex-direction: column; gap: 8px; }
    .kv-row { display: flex; justify-content: space-between; align-items: center; }
    .kv-label { font-size: 13px; color: var(--md-on-surface-variant, #6b7280); }
    .kv-value { font-size: 14px; font-weight: 500; color: var(--md-on-surface, #1a1a1a); }
    .kv-value.bold { font-weight: 700; font-size: 16px; }
    .chip {
      display: inline-flex;
      align-items: center;
      background: var(--md-surface-variant, #e8eaf0);
      color: var(--md-on-surface-variant, #4b5563);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .rotation-card {
      background: var(--md-secondary-container, #e8edf7);
      border-radius: 12px;
      padding: 18px 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .rotation-card .next-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--md-on-surface-variant, #6b7280);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .rotation-card .recipient-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--md-on-secondary-container, #1e3a5f);
      margin-bottom: 4px;
    }
    .rotation-card .payout-amount {
      font-size: 15px;
      font-weight: 600;
      color: var(--md-primary, #2563eb);
      margin-bottom: 12px;
    }
    .rotation-divider {
      height: 1px;
      background: var(--md-outline-variant, #c9d2e8);
      margin: 8px 0 12px;
    }
    .rotation-card .your-position {
      font-size: 13px;
      color: var(--md-on-surface-variant, #6b7280);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-primary {
      background: var(--md-primary, #2563eb);
      color: #fff;
    }
    .btn-full { width: 100%; }
  </style>
</head>
<body>
<div class="app-shell" data-shell="default">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● 5G ▮</span>
  </div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="group-dashboard">‹</button>
    <h1 class="app-bar-title">Share-Out Preview</h1>
    <button class="icon-btn" aria-label="Refresh">↻</button>
  </header>
  <main class="page-content">
    <!-- Cycle info banner -->
    <div class="banner banner-info">
      <strong>Cycle 3 — Distribution Preview</strong><br>
      All calculations are preliminary. Confirm to proceed.
    </div>

    <!-- Fund summary card (ROSCA — no profit line) -->
    <div class="card summary-card">
      <div class="kv-grid">
        <div class="kv-row">
          <span class="kv-label">Total Pool</span>
          <span class="kv-value bold">KES 10,000</span>
        </div>
      </div>
    </div>

    <!-- Formula chip -->
    <div class="chip">Fixed rotation order</div>

    <!-- Rotation preview card -->
    <div class="rotation-card">
      <div class="next-label">Next Recipient</div>
      <div class="recipient-name">Grace Wanjiku</div>
      <div class="payout-amount">Payout Amount: KES 10,000</div>
      <div class="rotation-divider"></div>
      <div class="your-position">Your position: 5</div>
    </div>

    <!-- Primary action -->
    <button class="btn btn-primary btn-full" data-nav-to="share-out-execute">
      Confirm &amp; Proceed to Execute
    </button>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
