sibling: flow
schema_version: "4.0"
feature_id: share-out-preview

navigates_to:
  - target: share-out-execute
    condition: user_taps_confirm
    params: { groupId: String, typeConfig: GroupTypeConfig, totalPool: Double, memberPayouts: "List<MemberPayout>" }

flow_logic:
  on_load:
    - action: read_typeConfig_from_nav_arg
      description: "Load typeConfig from nav param to determine poolModel and shareoutFormula"
    - api_call: get_shareout_preview   # COMP-DIST-001 — companion returns strategy-aware preview
      on_complete:
        - action: route_by_pool_model
          when: "poolModel == 'ROTATING_PAYOUT'"
          then: show_content_rotating
          else: show_content_accumulating
      on_error: show_error

  on_confirm:
    - navigate: share-out-execute
      params:
        groupId: "{{groupId}}"
        typeConfig: "{{typeConfig}}"
        totalPool: "{{totalPool}}"
        memberPayouts: "{{memberPayouts}}"   # empty list for ROTATING_PAYOUT; companion uses typeConfig

  on_refresh:
    - api_call: get_shareout_preview
      invalidate_cache: true

  on_back:
    - navigate_back

validation_rules:
  on_confirm:
    - condition: "poolModel == 'ACCUMULATING' && memberPayouts.isEmpty()"
      error: error_insufficient_data
    - condition: "poolModel == 'ROTATING_PAYOUT' && nextRecipientName == null"
      error: error_insufficient_data
