sibling: flow
schema_version: "4.0"
feature_id: share-out-preview

navigates_to:
  - target: share-out-execute
    condition: user_taps_confirm
    params: { groupId: Long, centerId: Long, totalPool: Double, memberPayouts: "List<MemberPayout>" }

flow_logic:
  on_load:
    - api_call: get_center_accounts
    - api_call: get_share_out_datatable
    - action: compute_distribution
      description: >
        For each member compute:
        memberShare% = memberTotalSavings / totalGroupSavings
        memberPayout = memberShare% * totalPool
        where totalPool = totalCorpus + totalProfit
      on_complete: show_content
      on_error: show_error

  on_confirm:
    - navigate: share-out-execute
      params:
        groupId: "{{groupId}}"
        centerId: "{{centerId}}"
        totalPool: "{{totalPool}}"
        memberPayouts: "{{memberPayouts}}"

  on_refresh:
    - api_call: get_center_accounts
      invalidate_cache: true
    - action: compute_distribution

  on_back:
    - navigate_back
