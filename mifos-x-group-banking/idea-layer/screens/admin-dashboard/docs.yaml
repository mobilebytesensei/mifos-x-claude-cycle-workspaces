id: admin-dashboard
name: Organizer Dashboard
description: >
  Organizer-per-group hub surface for users holding organizer/treasurer/chairperson role in at least one group. There is
  NO admin client type — this screen is reached by the unified identity (single login) when the session user's
  dt_member_role resolves at least one group with an organizing role. KPIs are scoped to "my groups" (not all-branch):
  My Groups count, Members, Share-Outs Due, Meetings Today. Quick-nav to group-list. Field-Officer tile is an optional
  tier (visible only when fieldOfficerEnabled=true, v1.1). Data from single companion API call
  (/companion/organizer/dashboard) replacing 3 raw Fineract calls (/staff/{id}/summary + /centers + /journal-entries).
  Route: /dashboard/organizer.
feature: authentication
flow: admin-auth
version: 2.0.0
