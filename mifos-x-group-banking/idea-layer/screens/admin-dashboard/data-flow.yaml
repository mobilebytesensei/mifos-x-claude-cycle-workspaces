sibling: data-flow
schema_version: "2.1.0"
feature_id: admin-dashboard

entries:
  - screen_id: adminDashboardScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_staff_summary, transport: rest, method: get }
      - { api_id: get_todays_schedule, transport: rest, method: get }
      - { api_id: get_recent_activity, transport: rest, method: get }
    tables: []
    dtos:
      - { name: StaffSummary, role: response, api_id: get_staff_summary }
      - { name: ScheduledMeeting, role: response, api_id: get_todays_schedule }
      - { name: ActivityItem, role: response, api_id: get_recent_activity }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "admin:staff_summary:{staffId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "403", behavior: show_error, message_key: error_forbidden }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: All three calls are fired in parallel on mount; UI renders as each resolves.

  - screen_id: adminDashboardScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_staff_summary, transport: rest, method: get }
      - { api_id: get_todays_schedule, transport: rest, method: get }
      - { api_id: get_recent_activity, transport: rest, method: get }
    tables: []
    dtos:
      - { name: StaffSummary, role: response, api_id: get_staff_summary }
      - { name: ScheduledMeeting, role: response, api_id: get_todays_schedule }
      - { name: ActivityItem, role: response, api_id: get_recent_activity }
    produces_state: Content
    auth_required: true
    cache:
      strategy: network_first
      ttl_seconds: 300
      key_template: "admin:staff_summary:{staffId}"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
    notes: Pull-to-refresh invalidates all three caches and re-fetches in parallel.
