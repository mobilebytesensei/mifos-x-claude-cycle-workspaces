sibling: tests
schema_version: "4.0"
feature_id: admin-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-AD-001
      scenario: "On mount, all three APIs fire in parallel and screen shows Content state on success"
      type: ViewModel
      priority: P0

    - id: TC-AD-002
      scenario: "StaffSummary KPI tiles render correct totalGroups, totalMembers, overdueLoansCount, meetingsTodayCount"
      type: Screen
      priority: P0

    - id: TC-AD-003
      scenario: "Scheduled meetings list shows today's groups with correct time and member count"
      type: Screen
      priority: P0

    - id: TC-AD-004
      scenario: "Recent activity feed displays last 8 transactions with correct type icons and amounts in KES"
      type: Screen
      priority: P1

    - id: TC-AD-005
      scenario: "When get_staff_summary returns 401, ViewModel emits NavigateToLogin event"
      type: ViewModel
      priority: P0

    - id: TC-AD-006
      scenario: "When network is offline and cache exists, screen shows cached data with offline banner"
      type: ViewModel
      priority: P1

    - id: TC-AD-007
      scenario: "When network is offline and no cache, screen shows Error state with retry button"
      type: ViewModel
      priority: P1

    - id: TC-AD-008
      scenario: "Pull-to-refresh invalidates cache and re-fetches all three endpoints"
      type: ViewModel
      priority: P1

    - id: TC-AD-009
      scenario: "Tapping a scheduled meeting group card navigates to group-list with correct groupId param"
      type: Screen
      priority: P1

    - id: TC-AD-010
      scenario: "AdminRepository.getStaffSummary caches response for 300 seconds"
      type: Repository
      priority: P1

    - id: TC-AD-011
      scenario: "ActivityItem with null amount renders without amount chip"
      type: Screen
      priority: P2

    - id: TC-AD-012
      scenario: "When meetingsTodayCount is 0, meetings section shows empty state message"
      type: Screen
      priority: P2

    - id: TC-AD-013
      scenario: "500 error on get_recent_activity shows partial content — KPI and meetings still render"
      type: ViewModel
      priority: P1

    - id: TC-AD-014
      scenario: "overdueLoansCount badge turns amber when count > 0 and red when count >= 5"
      type: Screen
      priority: P2
