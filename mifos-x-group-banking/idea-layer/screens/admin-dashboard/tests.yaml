sibling: tests
schema_version: "4.0"
feature_id: admin-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-AD-001
      scenario: "On mount, single get_organizer_dashboard call fires; Content state on success"
      type: ViewModel
      priority: P0
      given: "auth token present; userId resolved server-side (no staffId param)"
      when: "AdminDashboardScreen enters composition"
      then: "OrganizerRepository.getDashboard called once; isLoading=false; OrganizerDashboardSummary fields populated"

    - id: TC-AD-002
      scenario: "OrganizerDashboardSummary KPI tiles render correct totalGroups, totalMembers, pendingLoanRequests, meetingsTodayCount"
      type: Screen
      priority: P0

    - id: TC-AD-003
      scenario: "todaySchedule list from OrganizerDashboardSummary shows today's groups with correct meetingTime and memberCount"
      type: Screen
      priority: P0

    - id: TC-AD-004
      scenario: "recentActivity feed displays ActivityItems with correct type icons and amounts in KES"
      type: Screen
      priority: P1

    - id: TC-AD-005
      scenario: "When get_organizer_dashboard returns 401, ViewModel emits NavigateToLogin event"
      type: ViewModel
      priority: P0
      given: "Token expired"
      when: "get_organizer_dashboard returns 401"
      then: "NavigateBack emitted, user redirected to login"

    - id: TC-AD-006
      scenario: "403 from get_organizer_dashboard means viewer is not organizer — navigate to personal-dashboard"
      type: ViewModel
      priority: P0
      given: "Viewer role is MEMBER, not ORGANIZER"
      when: "get_organizer_dashboard returns 403"
      then: "NavigateToPersonalDashboard emitted; error state NOT shown"

    - id: TC-AD-007
      scenario: "When network is offline and cache exists, screen shows cached OrganizerDashboardSummary with offline banner"
      type: ViewModel
      priority: P1
      given: "Network unavailable, organizer_dashboard_cache has entry for userId"
      when: "On mount"
      then: "Content state from cache; offline banner shown; sync_band shows lastSyncAt"

    - id: TC-AD-008
      scenario: "When network is offline and no cache, screen shows Error state with retry button"
      type: ViewModel
      priority: P1
      given: "Network unavailable, no cache"
      when: "On mount"
      then: "Error state shown with retry CTA"

    - id: TC-AD-009
      scenario: "Pull-to-refresh invalidates organizer_dashboard_cache and re-fetches single endpoint"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefreshTap action"
      then: "isRefreshing=true; bypass_and_refresh strategy; get_organizer_dashboard re-called; cache updated on success"

    - id: TC-AD-010
      scenario: "Tapping a scheduled meeting group card navigates to group-dashboard with correct groupId"
      type: Screen
      priority: P1

    - id: TC-AD-011
      scenario: "OrganizerRepository.getDashboard cache key is userId-scoped (userId from auth token)"
      type: Repository
      priority: P0
      given: "Two calls with same userId within TTL 300s"
      when: "Second call within TTL"
      then: "Cache hit returned; no second network request; cache key is 'organizer_dashboard:{userId}'"

    - id: TC-AD-012
      scenario: "fieldOfficerEnabled=false hides enterprise/field-officer tab in dashboard"
      type: Screen
      priority: P1
      given: "OrganizerDashboardSummary.fieldOfficerEnabled=false"
      when: "Content state rendered"
      then: "Enterprise tab NOT visible in tab row"

    - id: TC-AD-013
      scenario: "fieldOfficerEnabled=true shows enterprise tab"
      type: Screen
      priority: P1
      given: "OrganizerDashboardSummary.fieldOfficerEnabled=true"
      when: "Content state rendered"
      then: "Enterprise tab visible in tab row"

    - id: TC-AD-014
      scenario: "ActivityItem with type=SHARE_OUT shows correct icon (share_out_icon)"
      type: Screen
      priority: P2
      given: "ActivityItem with type=SHARE_OUT in recentActivity[]"
      when: "Activity feed rendered"
      then: "share_out_icon displayed on the activity row"

    - id: TC-AD-015
      scenario: "ActivityItem with null amount renders without amount chip"
      type: Screen
      priority: P2

    - id: TC-AD-016
      scenario: "When meetingsTodayCount is 0, meetings section shows empty state message"
      type: Screen
      priority: P2

    - id: TC-AD-017
      scenario: "overdueLoansCount badge turns amber when count > 0 and red when count >= 5"
      type: Screen
      priority: P2
