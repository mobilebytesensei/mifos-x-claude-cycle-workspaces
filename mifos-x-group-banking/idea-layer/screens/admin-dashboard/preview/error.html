<!DOCTYPE html>
<html lang="en" data-feature="admin-dashboard" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>admin-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">

</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
