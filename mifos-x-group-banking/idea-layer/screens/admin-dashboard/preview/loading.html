<!DOCTYPE html>
<html lang="en" data-feature="admin-dashboard" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>admin-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* Shimmer skeleton */
  .shimmer { background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-sm); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .shimmer-text { height: 14px; margin-bottom: 8px; }
  .shimmer-title { height: 20px; width: 60%; margin-bottom: 6px; }
  .shimmer-subtitle { height: 12px; width: 40%; }
  /* Welcome card shimmer */
  .banner-primary-container { background: var(--primary-100); border-color: var(--primary-100); }
  /* KPI row shimmer */
  .kpi-row { display: flex; gap: var(--space-sm); overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-base); }
  .kpi-card { min-width: 80px; flex: 1; background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-md); text-align: center; flex-shrink: 0; }
  /* Schedule shimmer rows */
  .shimmer-list-item { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) 0; border-bottom: 1px solid var(--border-subtle); }
  .shimmer-list-item:last-child { border-bottom: none; }
  .shimmer-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
  .shimmer-lines { flex: 1; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1 class="app-bar-title">Dashboard</h1>
    <button class="icon-btn" aria-label="Notifications">🔔</button>
  </header>
  <main>
    <!-- Welcome card skeleton -->
    <div class="card banner-primary-container" style="margin-bottom: var(--space-base);">
      <div class="shimmer shimmer-title" style="background: rgba(0,0,0,.08); border-radius: var(--radius-sm);"></div>
      <div class="shimmer shimmer-subtitle" style="background: rgba(0,0,0,.06); border-radius: var(--radius-sm);"></div>
    </div>

    <!-- KPI row skeleton -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="shimmer" style="height: 28px; width: 36px; margin: 0 auto var(--space-xs);"></div>
        <div class="shimmer shimmer-text" style="width: 100%;"></div>
      </div>
      <div class="kpi-card">
        <div class="shimmer" style="height: 28px; width: 36px; margin: 0 auto var(--space-xs);"></div>
        <div class="shimmer shimmer-text" style="width: 100%;"></div>
      </div>
      <div class="kpi-card">
        <div class="shimmer" style="height: 28px; width: 36px; margin: 0 auto var(--space-xs);"></div>
        <div class="shimmer shimmer-text" style="width: 100%;"></div>
      </div>
      <div class="kpi-card">
        <div class="shimmer" style="height: 28px; width: 36px; margin: 0 auto var(--space-xs);"></div>
        <div class="shimmer shimmer-text" style="width: 100%;"></div>
      </div>
    </div>

    <!-- Today's Schedule skeleton -->
    <div class="card">
      <div class="shimmer shimmer-title" style="margin-bottom: var(--space-md);"></div>
      <div class="shimmer-list-item">
        <div class="shimmer shimmer-avatar"></div>
        <div class="shimmer-lines">
          <div class="shimmer shimmer-text" style="width: 70%;"></div>
          <div class="shimmer shimmer-text" style="width: 50%;"></div>
        </div>
      </div>
      <div class="shimmer-list-item">
        <div class="shimmer shimmer-avatar"></div>
        <div class="shimmer-lines">
          <div class="shimmer shimmer-text" style="width: 65%;"></div>
          <div class="shimmer shimmer-text" style="width: 45%;"></div>
        </div>
      </div>
    </div>

    <!-- Recent Activity skeleton -->
    <div class="card">
      <div class="shimmer shimmer-title" style="margin-bottom: var(--space-md);"></div>
      <div class="shimmer-list-item">
        <div class="shimmer shimmer-avatar"></div>
        <div class="shimmer-lines">
          <div class="shimmer shimmer-text" style="width: 55%;"></div>
          <div class="shimmer shimmer-text" style="width: 40%;"></div>
        </div>
      </div>
      <div class="shimmer-list-item">
        <div class="shimmer shimmer-avatar"></div>
        <div class="shimmer-lines">
          <div class="shimmer shimmer-text" style="width: 60%;"></div>
          <div class="shimmer shimmer-text" style="width: 35%;"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
