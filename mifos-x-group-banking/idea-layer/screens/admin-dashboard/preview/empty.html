<!DOCTYPE html>
<html lang="en" data-feature="admin-dashboard" data-state="empty" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>admin-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .banner-primary-container { background: var(--primary-100); border-color: var(--primary-100); }
  .headline-small { font-size: 17px; font-weight: 600; color: var(--primary-900); margin-bottom: 4px; }
  .body-medium { font-size: 14px; color: var(--primary-700); }
  .empty-icon { font-size: 48px; margin-bottom: var(--space-base); }
  .empty-title { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-sm); }
  .empty-body { font-size: 14px; color: var(--text-secondary); margin-bottom: var(--space-lg); }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1 class="app-bar-title">Dashboard</h1>
    <button class="icon-btn" aria-label="Notifications">🔔</button>
  </header>
  <main>
    <!-- Welcome card -->
    <div class="card banner-primary-container">
      <h2 class="headline-small">Welcome back, Jane Wanjiru</h2>
      <p class="body-medium">Here's your overview for today</p>
    </div>

    <!-- Empty state -->
    <div class="empty-state">
      <div class="illus">📊</div>
      <h2>No data yet</h2>
      <p>Your groups and activity will appear here once set up.</p>
      <button class="btn btn-primary btn-full" data-nav-to="group-list">View Groups</button>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
