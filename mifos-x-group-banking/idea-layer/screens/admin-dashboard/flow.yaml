sibling: flow
schema_version: "4.0"
feature_id: admin-dashboard

navigates_to:
  - group-list
  - field-officer-dashboard

flow_logic:
  on_load:
    # Unified identity — no admin role check. Companion API resolves organizer groups from token.
    - api_call: get_organizer_dashboard   # single companion API call replaces 3 Fineract calls
      on_success: show_content
      on_error: show_error

  on_view_all_groups:
    - navigate: group-list

  on_view_field_officer:
    - guard: "fieldOfficerEnabled"
    - navigate: field-officer-dashboard

  on_meeting_group_click:
    - navigate: group-list
      params: { groupId: "{{groupId}}" }

  on_refresh:
    - api_call: get_organizer_dashboard
      invalidate_cache: true

dependencies:
  repositories:
    - name: OrganizerDashboardRepository    # companion API /companion/organizer/dashboard
      methods:
        - "getOrganizerDashboard(): Flow<OrganizerDashboardSummary>"
  services:
    - SessionManager
    - NetworkMonitor
  local_db:
    - table: organizer_dashboard_cache
      schema: SQLDelight OrganizerDashboardSummary entity
