testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PD-001
      scenario: "On mount, personal dashboard loads multi-group summary from companion API"
      type: ViewModel
      priority: P0
      given: "authenticated user; no clientId required (unified identity); network online"
      when: "PersonalDashboardScreen enters composition"
      then: "GET /companion/personal/dashboard called; groups list with per-group metrics populated; PersonalDashboardScreenState=Content"

    - id: TC-PD-002
      scenario: "ACCUMULATING group card shows corpus balance and cycle progress"
      type: Screen
      priority: P0
      given: "Content state; group={poolModel:ACCUMULATING, corpusBalance:85000.0, cycleTarget:100000.0}"
      when: "GroupCard renders"
      then: "KES 85,000 balance shown; 85% cycle progress bar; no payout order shown"

    - id: TC-PD-003
      scenario: "ROTATING_PAYOUT group card shows current beneficiary name and next payout"
      type: Screen
      priority: P0
      given: "Content state; group={poolModel:ROTATING_PAYOUT, currentBeneficiary:'Peter', nextPayoutKes:10000.0}"
      when: "GroupCard renders"
      then: "current beneficiary 'Peter' shown; KES 10,000 next payout; no corpus balance"

    - id: TC-PD-004
      scenario: "Tapping a group card navigates to group-dashboard with groupId"
      type: Screen
      priority: P0
      given: "Content state; group.id=2"
      when: "OnGroupTap(2) fires"
      then: "NavigateToGroupDashboard emitted with groupId=2"

    - id: TC-PD-005
      scenario: "Net savings across all groups aggregated and shown in header"
      type: Screen
      priority: P1
      given: "Content state; groups=[{savings:5000}, {savings:3000}]"
      when: "PersonalDashboardHeader renders"
      then: "Total Savings KES 8,000 displayed in header"

    - id: TC-PD-006
      scenario: "Pull-to-refresh reloads all group summaries"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh fires"
      then: "isRefreshing=true; GET /companion/personal/dashboard re-called; groups updated; isRefreshing=false"

    - id: TC-PD-007
      scenario: "Empty state shown when user has no group memberships"
      type: Screen
      priority: P1
      given: "load success; groups.isEmpty()"
      when: "Content evaluation runs"
      then: "PersonalDashboardScreenState=Empty; Create Group and Join Group CTAs shown"

    - id: TC-PD-008
      scenario: "Error state shows retry on network failure"
      type: Screen
      priority: P1
      given: "GET /companion/personal/dashboard returns network error"
      when: "load completes"
      then: "PersonalDashboardScreenState=Error; retry CTA visible"
