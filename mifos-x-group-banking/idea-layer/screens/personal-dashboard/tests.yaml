sibling: tests
schema_version: "4.0"
feature_id: personal-dashboard
generated_at: "2026-08-01T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PD-001
      scenario: "On mount, personal dashboard loads member summary from companion API (unified identity)"
      type: ViewModel
      priority: P0
      given: "authenticated member; no clientId nav-param (identity from auth token); network online"
      when: "PersonalDashboardScreen enters composition"
      then: "GET /companion/member/dashboard called with selectedGroupId=null; myGroups + selectedGroup + balance fields populated; PersonalDashboardScreenState=Content"

    - id: TC-PD-002
      scenario: "ACCUMULATING group shows Projected Share-Out amount, hides rotation row"
      type: Screen
      priority: P0
      given: "Content state; poolModel=ACCUMULATING; shareOutProjection=9200.0"
      when: "shareout_projection_card renders"
      then: "shareout_amount visible showing KES 9,200 with trophy icon; rotation_position_text + next_recipient_eta_text hidden"

    - id: TC-PD-003
      scenario: "ROTATING_PAYOUT group shows rotation position + ETA, hides share-out amount"
      type: Screen
      priority: P0
      given: "Content state; poolModel=ROTATING_PAYOUT; rotationPosition=3; nextRecipientEta='2026-06-15'"
      when: "shareout_projection_card renders"
      then: "rotation_position_text '#3 in queue' + next_recipient_eta_text 'Your turn: ~2026-06-15' visible with swap_horiz icon; shareout_amount hidden"

    - id: TC-PD-004
      scenario: "Total Savings card aggregates group-linked + individual balances"
      type: Screen
      priority: P1
      given: "Content state; groupLinkedSavingsBalance=3500.0; individualSavingsBalance=800.0"
      when: "savings_summary_card renders"
      then: "displaySmall total KES 4,300 shown; breakdown row shows Group-linked KES 3,500 and Individual KES 800"

    - id: TC-PD-005
      scenario: "Tapping savings summary card navigates to personal-savings with savings nav_params"
      type: Screen
      priority: P0
      given: "Content state; clientId=101, groupLinkedSavingsId=501, individualSavingsId=601"
      when: "OnSavingsCardClick fires"
      then: "NavigateToSavings consumed → navigate personal-savings with { clientId, groupLinkedSavingsId, individualSavingsId }; no API call"

    - id: TC-PD-006
      scenario: "Tapping the loan entry card navigates to personal-loans forwarding clientId"
      type: Screen
      priority: P0
      given: "Content state; clientId=101; loan_card visible"
      when: "OnLoansCardClick fires"
      then: "NavigateToLoans(clientId=101) emitted → navigate personal-loans; pure navigation, no API call, no cache write"

    - id: TC-PD-007
      scenario: "Selecting Settings from the profile overflow menu navigates to settings"
      type: Screen
      priority: P1
      given: "Content state; profile_overflow_menu open; menu_settings item"
      when: "OnSettingsClick fires"
      then: "NavigateToSettings emitted → NavController navigates to shared settings screen; no data mutation"

    - id: TC-PD-008
      scenario: "Selecting Sync Status from the profile overflow menu navigates to sync-status"
      type: Screen
      priority: P1
      given: "Content state; profile_overflow_menu open; menu_sync_status item"
      when: "OnSyncStatusClick fires"
      then: "NavigateToSyncStatus emitted → NavController navigates to shared sync-status screen; no data mutation"

    - id: TC-PD-009
      scenario: "Multi-group member sees the group selector chip row; single-group member does not"
      type: Screen
      priority: P1
      given: "Content state; case A myGroups.size=2, case B myGroups.size=1"
      when: "group_banner renders"
      then: "case A: group_selector_row visible with a chip per group, selected chip filled; case B: group_selector_row hidden"

    - id: TC-PD-010
      scenario: "Tapping a group chip re-fetches the dashboard for that group"
      type: ViewModel
      priority: P1
      given: "Content state; myGroups.size=2; tapped groupId='GRP-20260215-002'"
      when: "OnSelectGroup(groupId) fires"
      then: "GET /companion/member/dashboard called with selectedGroupId set; savings + pool-model cards recompute; cmp-network-monitor serves SQLDelight cache when offline"

    - id: TC-PD-011
      scenario: "Pull-to-refresh reloads the selected group with cache bypass"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh fires"
      then: "isRefreshing=true; GET /companion/member/dashboard re-called with selectedGroup.groupId and invalidate_cache=true; state transitions content→refreshing→content|error"

    - id: TC-PD-012
      scenario: "Empty state shown when member belongs to no groups"
      type: Screen
      priority: P1
      given: "load success; myGroups.isEmpty()"
      when: "Content evaluation runs"
      then: "PersonalDashboardScreenState=Empty; layout collapses to [top_bar, group_banner]; no savings/loan/share-out cards"

    - id: TC-PD-013
      scenario: "Error state shows retry on network failure with empty cache"
      type: Screen
      priority: P1
      given: "GET /companion/member/dashboard returns network error; no cached rows"
      when: "load completes"
      then: "PersonalDashboardScreenState=Error; error_state with wifi_off icon + Try Again CTA visible"

    - id: TC-PD-014
      scenario: "OnRetry re-hits the companion API and clears the error"
      type: ViewModel
      priority: P1
      given: "Error state"
      when: "OnRetry fires"
      then: "error cleared; re-enters loading; GET /companion/member/dashboard re-called via MemberDashboardRepository; cmp-network-monitor checks connectivity first"

    - id: TC-PD-015
      scenario: "Unauthorized (401) clears session without navigating (app-shell re-auth)"
      type: ViewModel
      priority: P2
      given: "GET /companion/member/dashboard returns 401"
      when: "load completes"
      then: "DashboardError.Unauthorized (retry:false); session cleared; no in-screen navigate to login (app shell handles re-auth)"

    - id: TC-PD-016
      scenario: "Offline serves cached dashboard rows and shows offline badge"
      type: ViewModel
      priority: P2
      given: "NetworkMonitor.isOffline=true; member_dashboard_cache has rows for selected group"
      when: "on_load runs"
      then: "cache rows rendered in content; offline badge/snackbar shown; screen stays in Content state"

    - id: TC-PD-017
      scenario: "Accessibility: overflow menu and loan card expose content descriptions"
      type: Screen
      priority: P2
      given: "Content state"
      when: "profile_overflow_menu and loan_card render"
      then: "overflow icon-button exposes 'More options' contentDescription; loan_card exposes a single semantic navigation action; touch targets >= 48dp"
