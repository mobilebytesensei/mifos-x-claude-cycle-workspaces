sibling: tests
schema_version: "4.0"
feature_id: personal-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-PD-001
      scenario: "Dashboard loads on mount — get_member_dashboard fires once, unified identity from auth token"
      type: ViewModel
      priority: P0
      given: "auth token present; no clientId or selfServiceToken nav-param; selectedGroupId=null (first group)"
      when: "Screen mounts"
      then: "MemberDashboardRepository.getMemberDashboard(null) called once against /companion/member/dashboard; memberName, myGroups, selectedGroup, poolModel, groupLinkedSavingsBalance, individualSavingsBalance, recentTransactions populated"

    - id: TC-PD-002
      scenario: "Top bar greeting varies by time of day and shows member name"
      type: Screen
      priority: P1
      given: "memberName='Amina Hassan', local time=09:00"
      when: "Screen renders top_bar"
      then: "title='Good morning, Amina Hassan'; notification_icon with unread badge visible"

    - id: TC-PD-003
      scenario: "Total savings card shows combined balance with group-linked + individual breakdown"
      type: Screen
      priority: P0
      given: "Content state, groupLinkedSavingsBalance=20000.0, individualSavingsBalance=5000.0"
      when: "savings_summary_card renders"
      then: "savings_balance_amount='KES 25,000'; group_linked_label='Group-linked: KES 20,000'; individual_label='Individual: KES 5,000'"

    - id: TC-PD-004
      scenario: "ACCUMULATING pool shows Projected Share-Out amount, rotation text hidden"
      type: Screen
      priority: P0
      given: "poolModel='ACCUMULATING', shareOutProjection=23500.0, rotationPosition=null"
      when: "shareout_projection_card renders"
      then: "shareout_label='Projected Share-Out'; shareout_amount='KES 23,500' visible; rotation_position_text and next_recipient_eta_text NOT visible; shareout_icon=trophy"

    - id: TC-PD-005
      scenario: "ROTATING_PAYOUT pool shows rotation position and ETA, share-out amount hidden"
      type: Screen
      priority: P0
      given: "poolModel='ROTATING_PAYOUT', rotationPosition=3, nextRecipientEta='2026-08-15', shareOutProjection=null"
      when: "shareout_projection_card renders"
      then: "shareout_label='Your Rotation Position'; rotation_position_text='#3 in queue'; next_recipient_eta_text='Your turn: ~2026-08-15'; shareout_amount NOT visible; shareout_icon=swap_horiz"

    - id: TC-PD-006
      scenario: "NONE pool shows only savings, no share-out or rotation card content"
      type: Screen
      priority: P1
      given: "poolModel='NONE' (ASCA/SHG/BURIAL_WELFARE group type)"
      when: "Content state rendered"
      then: "savings_summary_card visible; shareout_amount and rotation_position_text and next_recipient_eta_text all NOT visible"

    - id: TC-PD-007
      scenario: "Group selector hidden for single-group member"
      type: Screen
      priority: P1
      given: "Content state, myGroups.size=1"
      when: "group_banner renders"
      then: "group_selector_row NOT visible; group_name_text shows selectedGroup.name (Mwangaza VSLA)"

    - id: TC-PD-008
      scenario: "Group selector renders all chips when member is in 2+ groups, first selected"
      type: Screen
      priority: P0
      given: "myGroups has 2 groups: Mwangaza VSLA (ACCUMULATING) + Tumaini ROSCA (ROTATING_PAYOUT)"
      when: "group_banner renders"
      then: "group_selector_row visible with two chips; Mwangaza chip selected by default; balance and projection cards reflect the ACCUMULATING first group"

    - id: TC-PD-009
      scenario: "OnSelectGroup re-fetches dashboard with the tapped groupId and updates pool model"
      type: ViewModel
      priority: P0
      given: "selectedGroup.groupId='grp-001' (ACCUMULATING); Tumaini ROSCA chip tapped (groupId='grp-002', ROTATING_PAYOUT)"
      when: "OnSelectGroup(groupId='grp-002') dispatched"
      then: "getMemberDashboard('grp-002') called via cmp-network-monitor; poolModel updates to ROTATING_PAYOUT; savings + rotation fields refreshed; cache key updates to userId:grp-002"

    - id: TC-PD-010
      scenario: "OnSavingsCardClick navigates to personal-savings with group context"
      type: ViewModel
      priority: P0
      given: "Content state, selectedGroup.groupId='grp-001'"
      when: "OnSavingsCardClick dispatched (tap savings_summary_card)"
      then: "NavigateToSavings event emitted; navigate to personal-savings passing selectedGroup.groupId and typeConfig"

    - id: TC-PD-011
      scenario: "Recent activity list renders transactions with signed KES amounts"
      type: Screen
      priority: P1
      given: "recentTransactions has 2 DEPOSIT items (KES 2,500 each)"
      when: "recent_activity_list renders"
      then: "recent_activity_header='Recent Activity'; each row shows arrow_download icon, '+ KES 2,500' headline, and 'DEPOSIT · <date>' supporting line"

    - id: TC-PD-012
      scenario: "OnRefresh reloads dashboard for the selected group bypassing cache"
      type: ViewModel
      priority: P1
      given: "Content state, selectedGroup.groupId='grp-001'"
      when: "OnRefresh dispatched (pull-to-refresh)"
      then: "isRefreshing=true; cache bypassed; getMemberDashboard('grp-001') re-called; isRefreshing=false on completion"

    - id: TC-PD-013
      scenario: "Unauthorized 401 surfaces session-expired error"
      type: ViewModel
      priority: P0
      given: "get_member_dashboard returns 401"
      when: "Screen mounts"
      then: "DashboardError.Unauthorized set (retry=false); error_session_expired surfaced; user routed to login"

    - id: TC-PD-014
      scenario: "New member with no groups shows empty state"
      type: Screen
      priority: P1
      given: "get_member_dashboard returns myGroups=[] (Empty screen state)"
      when: "Screen renders"
      then: "empty state shown (top_bar + group_banner only); no savings or share-out cards; prompt to join a group"

    - id: TC-PD-015
      scenario: "Offline with cache hit shows cached data"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false; member_dashboard_cache has entry for userId:grp-001"
      when: "Screen mounts"
      then: "Content state served from SQLDelight cache; offline indication shown; revalidate deferred until online"

    - id: TC-PD-016
      scenario: "Offline with no cache shows error state with retry"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false; no cache entry"
      when: "Screen mounts"
      then: "DashboardError.Network set; error_state visible with wifi_off icon and 'Try Again' CTA"

    - id: TC-PD-017
      scenario: "OnRetry re-attempts the dashboard call via cmp-network-monitor"
      type: ViewModel
      priority: P1
      given: "Error state after a failed load"
      when: "OnRetry dispatched (tap error_state CTA)"
      then: "cmp-network-monitor connectivity checked; getMemberDashboard re-called; error cleared; screen re-enters Loading"

    - id: TC-PD-018
      scenario: "Loading shimmer shown while get_member_dashboard is in flight"
      type: Screen
      priority: P1
      given: "isLoading=true (Loading screen state)"
      when: "Screen renders"
      then: "shimmer_loading placeholders visible; savings and share-out cards not yet shown; group_banner + top_bar present"

    - id: TC-PD-019
      scenario: "Repository maps pool_model-discriminated response into MemberDashboardResponse"
      type: Repository
      priority: P0
      given: "get_member_dashboard returns an ACCUMULATING response for grp-001"
      when: "MemberDashboardRepository processes the response"
      then: "MemberDashboardResponse has shareOutProjection set, rotationPosition=null, poolModel='ACCUMULATING'; member_dashboard_cache keyed userId:grp-001 upserted"

    - id: TC-PD-020
      scenario: "Cache key is userId:groupId so switching groups never returns wrong group's data"
      type: Repository
      priority: P0
      given: "Two calls: userId='U1':groupId='grp-001' then userId='U1':groupId='grp-002'"
      when: "second call with different groupId"
      then: "cache miss on second call (distinct key); network request fires; each groupId cached independently"
