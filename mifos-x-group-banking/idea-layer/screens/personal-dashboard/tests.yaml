sibling: tests
schema_version: "4.0"
feature_id: personal-dashboard

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-PD-001
      scenario: "Dashboard loads on mount — savings and loan data populated"
      type: ViewModel
      priority: P0
      given: "clientId=101, selfServiceToken set"
      when: "Screen mounts"
      then: "get_client_accounts and get_savings_account called; groupLinkedSavingsBalance=3500.00, individualSavingsBalance=800.00, activeLoan populated"

    - id: TC-PD-002
      scenario: "Top bar greeting changes based on time of day"
      type: Screen
      priority: P1
      given: "memberName='Amina', local time=09:00"
      when: "Screen renders"
      then: "top_bar title='Good morning, Amina'"

    - id: TC-PD-003
      scenario: "Savings card shows combined total KES 4,300 with breakdown"
      type: Screen
      priority: P0
      given: "groupLinkedSavingsBalance=3500.00, individualSavingsBalance=800.00"
      when: "Screen renders savings_summary_card"
      then: "savings_balance_amount='KES 4,300.00', group_linked_label='Group-linked: KES 3,500.00', individual_label='Individual: KES 800.00'"

    - id: TC-PD-004
      scenario: "Savings card tap navigates to personal-savings"
      type: ViewModel
      priority: P0
      given: "Content state"
      when: "OnSavingsCardClick dispatched"
      then: "NavigateToSavings event emitted"

    - id: TC-PD-005
      scenario: "Active loan card visible when activeLoan is not null"
      type: Screen
      priority: P0
      given: "activeLoan.outstandingBalance=3250.00, nextRepaymentDate='2026-05-20'"
      when: "Screen renders"
      then: "loan_summary_card visible with outstanding='KES 3,250.00', next repayment shown"

    - id: TC-PD-006
      scenario: "Active loan card hidden when member has no loans"
      type: Screen
      priority: P0
      given: "activeLoan=null"
      when: "Screen renders"
      then: "loan_summary_card not visible, request_loan_cta shown instead"

    - id: TC-PD-007
      scenario: "Loan card tap navigates to personal-loans"
      type: ViewModel
      priority: P1
      given: "activeLoan present"
      when: "OnLoanCardClick dispatched"
      then: "NavigateToLoans event emitted"

    - id: TC-PD-008
      scenario: "Recent transactions section shows last 5 transactions"
      type: Screen
      priority: P1
      given: "recentTransactions has 5 items, latest DEPOSIT=400.00 on 2026-05-06"
      when: "Screen renders"
      then: "5 transaction_row items visible, top item shows '2026-05-06 · DEPOSIT · KES 400.00'"

    - id: TC-PD-009
      scenario: "Overdue loan shows warning indicator on loan card"
      type: Screen
      priority: P0
      given: "activeLoan.isOverdue=true"
      when: "Screen renders loan_summary_card"
      then: "overdue_icon visible with error tint, outstanding balance in error color"

    - id: TC-PD-010
      scenario: "Pull-to-refresh reloads all dashboard data"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh dispatched"
      then: "isRefreshing=true, both API endpoints called, data refreshed, isRefreshing=false"

    - id: TC-PD-011
      scenario: "Unauthorized 401 navigates to login screen"
      type: ViewModel
      priority: P0
      given: "API returns 401"
      when: "Screen mounts"
      then: "DashboardError.Unauthorized set, navigate to login"

    - id: TC-PD-012
      scenario: "Offline with cache shows cached data and offline snackbar"
      type: ViewModel
      priority: P1
      given: "NetworkMonitor.isOnline=false, SQLDelight cache valid"
      when: "Screen mounts"
      then: "Content state from cache, ShowSnackbar with error_network message"

    - id: TC-PD-013
      scenario: "Loading shimmer shown while data is being fetched"
      type: Screen
      priority: P1
      given: "isLoading=true"
      when: "Screen renders"
      then: "Shimmer placeholders visible for savings_summary_card and loan_summary_card"
