sibling: flow
schema_version: "4.0"
feature_id: personal-dashboard

navigates_to:
  - savings-dashboard
  - group-list

flow_logic:
  on_load:
    # Unified identity — no clientId or selfServiceToken params; resolved from auth token
    - decision: data_load
      branches:
        - condition: online
          api_call: get_member_dashboard   # single companion API call; selectedGroupId=null → first group
          on_success: show_content
          on_error: show_error
        - condition: offline
          action: serve_from_cache
          state: show_offline_badge
          on_cache_empty: show_error

  on_select_group:
    - api_call: get_member_dashboard
      params: { selectedGroupId: "{{groupId}}" }
      on_success: update_content

  on_savings_card_click:
    - navigate: savings-dashboard
      params: { groupId: "{{selectedGroup.groupId}}", typeConfig: "{{selectedGroup.typeConfig}}" }

  on_refresh:
    - api_call: get_member_dashboard
      params: { selectedGroupId: "{{selectedGroup.groupId}}" }
      invalidate_cache: true

  on_error:
    - decision: error_handling
      branches:
        - condition: "error == Unauthorized"
          action: clear_session
          # No navigate: login — app shell handles re-auth after token expiry
        - condition: "error == Network || error == Server"
          action: show_error_state
