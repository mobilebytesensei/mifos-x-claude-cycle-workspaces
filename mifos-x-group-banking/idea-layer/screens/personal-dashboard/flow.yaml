sibling: flow
schema_version: "4.0"
feature_id: personal-dashboard

navigates_to:
  - personal-savings
  - personal-loans
  - loan-request

flow_logic:
  on_load:
    - decision: data_load
      branches:
        - condition: online
          action: parallel_fetch
          apis:
            - get_client_accounts
            - get_savings_account
          on_success: show_content
          on_error: show_error
          cache: true
        - condition: offline
          action: serve_from_cache
          state: show_offline_badge
          on_cache_empty: show_error
  on_savings_card_click:
    - navigate: personal-savings
      params: { clientId: "{clientId}" }
  on_loan_card_click:
    - condition: "activeLoan != null"
      navigate: personal-loans
      params: { clientId: "{clientId}" }
  on_request_loan_click:
    - navigate: loan-request
      params: { clientId: "{clientId}" }
  on_refresh:
    - action: reload_data
      invalidate_cache: true
  on_error:
    - decision: error_handling
      branches:
        - condition: "error == Unauthorized"
          action: clear_session
          navigate: login
        - condition: "error == Network || error == Server"
          action: show_error_state
