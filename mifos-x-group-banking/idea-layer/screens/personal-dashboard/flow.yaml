sibling: flow
schema_version: "4.0"
feature_id: personal-dashboard

navigates_to:
  - personal-savings   # G10 — savings_summary_card (self savings ledger; was savings-dashboard mis-route, disagreeing with ui.yaml target)
  - group-list
  - personal-loans   # loan_card tap (un-deferred loan entry)
  - settings         # profile overflow menu
  - sync-status      # profile overflow menu

flow_logic:
  on_load:
    # Unified identity — no clientId or selfServiceToken params; resolved from auth token
    - decision: data_load
      branches:
        - condition: online
          api_call: get_member_dashboard   # single companion API call; selectedGroupId=null → first group
          on_success: show_content
          on_error: show_error
        - condition: offline
          action: serve_from_cache
          state: show_offline_badge
          on_cache_empty: show_error

  on_select_group:
    - api_call: get_member_dashboard
      params: { selectedGroupId: "{{groupId}}" }
      on_success: update_content

  on_savings_card_click:
    # G10 — reconciled to personal-savings (matches ui.yaml savings_summary_card target); forwards the
    # member's own clientId + savings-account ids that personal-savings requires as nav_params.
    - navigate: personal-savings
      params: { clientId: "{{clientId}}", groupLinkedSavingsId: "{{groupLinkedSavingsId}}", individualSavingsId: "{{individualSavingsId}}" }

  on_loans_card_click:
    - navigate: personal-loans
      params: { clientId: "{{clientId}}" }

  on_settings_click:
    - navigate: settings

  on_sync_status_click:
    - navigate: sync-status

  on_open_notifications:      # G14 — bell icon; deferred (no notifications screen yet)
    - emit: NotificationsDeferred
      snackbar_message_key: notifications_deferred

  on_refresh:
    - api_call: get_member_dashboard
      params: { selectedGroupId: "{{selectedGroup.groupId}}" }
      invalidate_cache: true

  on_error:
    - decision: error_handling
      branches:
        - condition: "error == Unauthorized"
          action: clear_session
          # No navigate: login — app shell handles re-auth after token expiry
        - condition: "error == Network || error == Server"
          action: show_error_state
