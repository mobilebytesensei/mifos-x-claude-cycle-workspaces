sibling: data-flow
schema_version: "2.1.0"
feature_id: personal-dashboard

entries:
  - screen_id: personalDashboardScreen
    trigger: on_mount
    description: >
      Load member dashboard via single companion API call.
      get_member_dashboard resolves identity from auth token (no clientId or selfServiceToken).
      Returns: myGroups[], selectedGroup summary, pool_model-discriminated balance fields,
      and recentTransactions[]. Replaces old SelfService 2-call: get_client_accounts + get_savings_account.
      selectedGroupId may be null on first load (companion defaults to first group).
    endpoints:
      - { api_id: get_member_dashboard, transport: rest, method: get }
    tables:
      - name: member_dashboard_cache
        persistence_contract: sqldelight_entity
        mutation: upsert
      - name: savings_transactions
        persistence_contract: sqldelight_entity
        mutation: upsert
    dtos:
      - { name: MemberDashboardResponse, role: response, api_id: get_member_dashboard }
      - { name: GroupSummary, role: response, api_id: get_member_dashboard }
      - { name: SavingsTransactionDto, role: response, api_id: get_member_dashboard }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "member_dashboard:{userId}:group:{selectedGroupId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login-signup }
      - { error_code: "404", behavior: show_error, message_key: error_not_in_group }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "500", behavior: show_retry, message_key: error_server }
    notes: >
      Response.poolModel (from selectedGroup.typeConfig) drives balance card display:
        ACCUMULATING: groupLinkedSavingsBalance + shareOutProjection card visible
        ROTATING_PAYOUT: groupLinkedSavingsBalance + rotationPosition + nextRecipientEta
        NONE: only individualSavingsBalance visible (no group pool card)
      myGroups[] populates the group selector chip row for group switching.
      First mount: selectedGroupId=null → companion returns first group alphabetically.
      Empty myGroups[] → ZeroGroups state (same as login-signup ZeroGroups).

  - screen_id: personalDashboardScreen
    trigger: on_action
    action: OnSelectGroup
    description: >
      User taps a different group chip (OnSelectGroup, params: { groupId }).
      Re-fetches member dashboard via MemberDashboardRepository for the tapped selectedGroupId,
      re-projecting the pool-model card (ACCUMULATING share-out vs ROTATING_PAYOUT rotation position).
      Replaces the member_dashboard_cache row for the user/group pair.
    endpoints:
      - { api_id: get_member_dashboard, transport: rest, method: get }
    tables:
      - name: member_dashboard_cache
        persistence_contract: sqldelight_entity
        mutation: upsert
      - name: savings_transactions
        persistence_contract: sqldelight_entity
        mutation: upsert
    dtos:
      - { name: MemberDashboardResponse, role: response, api_id: get_member_dashboard }
      - { name: SavingsTransactionDto, role: response, api_id: get_member_dashboard }
    produces_state: Content
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "member_dashboard:{userId}:group:{selectedGroupId}"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
    notes: >
      selectedGroupId nav state updates ViewModel; triggers new companion API call.
      Each group result cached separately by selectedGroupId in the key template.

  - screen_id: personalDashboardScreen
    trigger: on_refresh
    description: Pull-to-refresh — forces fresh member dashboard data for current group.
    endpoints:
      - { api_id: get_member_dashboard, transport: rest, method: get }
    tables:
      - name: member_dashboard_cache
        persistence_contract: sqldelight_entity
        mutation: upsert
      - name: savings_transactions
        persistence_contract: sqldelight_entity
        mutation: upsert
    dtos:
      - { name: MemberDashboardResponse, role: response, api_id: get_member_dashboard }
      - { name: SavingsTransactionDto, role: response, api_id: get_member_dashboard }
    produces_state: Content
    auth_required: true
    cache:
      strategy: bypass_and_refresh
      ttl_seconds: 300
      key_template: "member_dashboard:{userId}:group:{selectedGroupId}"
    error_paths:
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_offline }
      - { error_code: "401", behavior: navigate, nav_target: login-signup }
    notes: Bypasses stale_while_revalidate; replaces cache with fresh response for current group.

  - screen_id: personalDashboardScreen
    trigger: on_action
    action: OnSavingsCardClick
    description: >
      Tap the savings_summary_card to open the member's savings ledgers. Emits
      NavigateToSavings which the Route consumes to navigate to personal-savings,
      forwarding clientId, groupLinkedSavingsId, and the optional individualSavingsId
      (from the get_member_dashboard response) as the personal-savings nav_params.
      Pure navigation — no cache write, no network call.
    endpoints: []
    tables: []
    dtos: []
    produces_state: Content
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    navigation:
      - { condition: "always", nav_target: personal-savings, params: [clientId, groupLinkedSavingsId, individualSavingsId] }
    notes: >
      Aligned with ui.yaml savings_summary_card.on_click.action_contract
      (effect: navigate, target: personal-savings, params { clientId,
      groupLinkedSavingsId, individualSavingsId }). individualSavingsId is
      nullable — forwarded as null when the member has no voluntary individual
      savings account (matches source MemberDashboard.individualSavingsId: Long?).

tables:
  - name: member_dashboard_cache
    description: >
      SQLDelight cache of MemberDashboardResponse per (userId, selectedGroupId).
      Stores memberName, the clientId / groupLinkedSavingsId / individualSavingsId identity+savings
      ids (forwarded to the personal-savings nav_params on savings-card tap; individualSavingsId is
      nullable), selectedGroup summary, poolModel, balance fields, and pagination metadata.
      Keyed by (userId, selectedGroupId) — separate rows for each group chip selection.
    persistence_contract: sqldelight_entity
    primary_key: "userId:groupId"
    mutations: [upsert, read]
    offline_strategy: serve_stale

  - name: savings_transactions
    description: >
      Shared SQLDelight cache of SavingsTransactionDto rows for recent activity display.
      Shared across personal-dashboard, savings-dashboard, and member-savings-detail.
      Keyed by transactionId. Written on mount and group chip switch.
    persistence_contract: sqldelight_entity
    primary_key: "transactionId"
    mutations: [upsert, read]
    offline_strategy: serve_stale

cache:
  strategy: stale_while_revalidate
  ttl_seconds: 300
  notes: >
    Member dashboard cached 5 min per group (stale_while_revalidate).
    Group chip switch re-uses per-group cache or re-fetches if stale.
    Pull-to-refresh uses bypass_and_refresh. Served stale when offline (use_sqldelight).
    No legacy api.yaml#cache — single cache declaration in this data-flow file.

sync_queue:
  entries: []
  notes: >
    Personal dashboard is read-only. No write operations.
    Contribution recording is handled by group-specific child flows.

