sibling: data-flow
schema_version: "2.1.0"
feature_id: personal-dashboard

entries:
  - screen_id: personalDashboardScreen
    trigger: on_mount
    endpoints:
      - { api_id: get_client_accounts, transport: rest, method: get }
      - { api_id: get_savings_account, transport: rest, method: get }
    dtos:
      - { name: ClientAccountsResponse, role: response, api_id: get_client_accounts }
      - { name: SavingsAccountSummaryDto, role: response, api_id: get_client_accounts }
      - { name: LoanAccountSummaryDto, role: response, api_id: get_client_accounts }
      - { name: SavingsAccountDetailDto, role: response, api_id: get_savings_account }
      - { name: LoanSummary, role: response, api_id: get_client_accounts }
      - { name: SavingsTransactionDto, role: response, api_id: get_savings_account }
    auth_required: true
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 300
      key_template: "personal_dashboard:{clientId}"
    error_paths:
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: error_state, message_key: error_server }
      - { error_code: "503", behavior: fallback_cache, message_key: error_network }
      - { error_code: "network.offline", behavior: fallback_cache, message_key: error_network }

  - screen_id: personalDashboardScreen
    trigger: on_refresh
    endpoints:
      - { api_id: get_client_accounts, transport: rest, method: get }
      - { api_id: get_savings_account, transport: rest, method: get }
    dtos:
      - { name: ClientAccountsResponse, role: response, api_id: get_client_accounts }
      - { name: SavingsAccountDetailDto, role: response, api_id: get_savings_account }
    auth_required: true
    cache:
      strategy: bypass_and_refresh
      key_template: "personal_dashboard:{clientId}"
    error_paths:
      - { error_code: "network.offline", behavior: snackbar, message_key: error_network }
      - { error_code: "401", behavior: navigate, nav_target: login }
