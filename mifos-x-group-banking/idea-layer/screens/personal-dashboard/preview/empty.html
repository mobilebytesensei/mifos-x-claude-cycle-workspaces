<!DOCTYPE html>
<html lang="en" data-feature="personal-dashboard" data-state="empty" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>personal-dashboard · CommonPurse</title>
<!-- re-rendered 2026-08-01 (loan-card + overflow-menu ui.yaml revision — empty state collapses to top_bar + group_banner, no cards) -->
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .top-app-bar-primary { background: var(--primary-700); }
  .top-app-bar-primary h1 { font-size: 16px; }

  /* group_banner — zero-group form (no active group context yet) */
  .group-banner { background: var(--primary-700); padding: var(--space-base) var(--space-base) var(--space-lg); display: flex; align-items: center; gap: var(--space-sm); }
  .group-banner-name { font-size: 15px; font-weight: 600; color: rgba(255,255,255,.85); flex: 1; }
  .chip-inverse { padding: 2px 10px; border-radius: 9999px; background: rgba(255,255,255,.2); color: #fff; font-size: 12px; font-weight: 600; }

  main { padding: var(--space-base) var(--space-base) 88px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar top-app-bar-primary">
    <h1>Good morning, Amina Hassan</h1>
    <button class="icon-btn" aria-label="Notifications">🔔</button>
  </header>

  <!-- group_banner — new member, no group joined yet -->
  <div class="group-banner">
    <span class="group-banner-name">No group yet</span>
    <span class="chip-inverse">KES</span>
  </div>

  <!-- empty-state — zero groups → create/join affordance -->
  <main>
    <div class="empty-state">
      <div class="illus" aria-hidden="true">🌱</div>
      <h2>Welcome to CommonPurse!</h2>
      <p>You haven't joined a savings group yet. Join an existing group or start your own to begin saving together.</p>
      <div class="btn-stack">
        <button class="btn btn-primary btn-full" data-nav-to="group-list" aria-label="Browse groups to join">
          Browse Groups
        </button>
        <button class="btn btn-secondary btn-full" data-nav-to="group-create" aria-label="Create a new group">
          Create a Group
        </button>
      </div>
    </div>
  </main>

  <!-- bottom_nav — shell parity, Home active -->
  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-item active" aria-current="page"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-item" data-nav-to="group-list"><span class="nav-icon">👥</span>Groups</button>
    <button class="nav-item" data-nav-to="personal-savings"><span class="nav-icon">💰</span>Savings</button>
    <button class="nav-item" data-nav-to="profile"><span class="nav-icon">👤</span>Profile</button>
  </nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
