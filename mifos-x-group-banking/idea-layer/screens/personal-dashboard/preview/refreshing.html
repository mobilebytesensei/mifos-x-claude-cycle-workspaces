<!DOCTYPE html>
<html lang="en" data-feature="personal-dashboard" data-state="refreshing" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>personal-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .top-app-bar-primary { background: var(--primary-700); }
  .top-app-bar-primary .app-bar-title { font-size: 15px; }

  .group-banner { background: var(--primary-700); padding: var(--space-base) var(--space-base) var(--space-xl); display: flex; align-items: center; gap: var(--space-sm); }
  .group-banner-name { font-size: 15px; font-weight: 600; color: #fff; flex: 1; }
  .chip-inverse { padding: 2px 10px; border-radius: 9999px; background: rgba(255,255,255,.2); color: #fff; font-size: 12px; font-weight: 500; }

  /* Pull-to-refresh indicator — sits above the banner content */
  .ptr-indicator { display: flex; justify-content: center; align-items: center; padding: var(--space-sm) 0; background: var(--primary-700); }
  .ptr-spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 0 0 80px; }
  .main-padded { padding: 0 var(--space-base); }

  .savings-summary-card { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); padding: var(--space-base); margin: calc(-1 * var(--space-lg)) var(--space-base) var(--space-base); box-shadow: 0 2px 8px rgba(0,0,0,.12); cursor: pointer; }
  .savings-header { display: flex; align-items: center; gap: var(--space-sm); margin-bottom: var(--space-sm); }
  .savings-icon { font-size: 18px; }
  .savings-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; flex: 1; }
  .savings-chevron { font-size: 18px; color: var(--text-disabled); }
  .savings-amount { font-size: 28px; font-weight: 700; color: var(--text-primary); font-family: 'Roboto Mono', monospace; margin-bottom: var(--space-sm); }
  .savings-breakdown { display: flex; gap: var(--space-md); flex-wrap: wrap; }
  .breakdown-group { font-size: 12px; color: var(--primary-700); font-weight: 500; }
  .breakdown-individual { font-size: 12px; color: #7B1FA2; font-weight: 500; }

  .shareout-card { background: #F3E5F5; border-color: #CE93D8; display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); }
  .shareout-icon { font-size: 24px; flex-shrink: 0; }
  .shareout-label { font-size: 13px; color: #6A1B9A; font-weight: 500; margin-bottom: 2px; }
  .shareout-amount { font-size: 20px; font-weight: 700; color: #4A148C; font-family: 'Roboto Mono', monospace; }

  .section-heading { font-size: 14px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .5px; margin-bottom: var(--space-sm); }
  .txn-list { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); overflow: hidden; opacity: .6; }
  .list-item { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-base); border-bottom: 1px solid var(--border-subtle); min-height: 56px; }
  .list-item:last-child { border-bottom: none; }
  .txn-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
  .txn-icon.deposit { background: var(--primary-100); color: var(--primary-700); }
  .content { flex: 1; min-width: 0; }
  .content .name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
  .content .meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar top-app-bar-primary">
    <h1 class="app-bar-title">Good morning, Amina Hassan</h1>
    <button class="icon-btn" aria-label="Notifications">🔔</button>
  </header>
  <!-- Pull-to-refresh spinner above banner content -->
  <div class="ptr-indicator">
    <div class="ptr-spinner"></div>
  </div>
  <div class="group-banner">
    <div class="group-banner-name">Mwangaza VSLA</div>
    <span class="chip chip-inverse">KES</span>
  </div>
  <main>
    <!-- Savings summary — same data, slightly dimmed to indicate refreshing -->
    <div class="savings-summary-card" data-nav-to="personal-savings" style="opacity:.85;">
      <div class="savings-header">
        <span class="savings-icon">💰</span>
        <span class="savings-label">Total Savings</span>
        <span class="savings-chevron">›</span>
      </div>
      <div class="savings-amount">KES 25,000</div>
      <div class="savings-breakdown">
        <span class="breakdown-group">Group-linked: KES 20,000</span>
        <span class="breakdown-individual">Individual: KES 5,000</span>
      </div>
    </div>

    <div class="main-padded">
      <!-- Share-out projection -->
      <div class="card shareout-card" style="opacity:.85;">
        <div class="shareout-icon">🏆</div>
        <div>
          <div class="shareout-label">Projected Share-Out</div>
          <div class="shareout-amount">KES 23,500</div>
        </div>
      </div>

      <!-- Recent Activity — dimmed while refreshing -->
      <div class="section-heading">Recent Activity</div>
      <div class="txn-list">
        <div class="list-item">
          <div class="txn-icon deposit">↓</div>
          <div class="content">
            <div class="name">+ KES 2,500</div>
            <div class="meta">DEPOSIT · 10 Jul 2026</div>
          </div>
        </div>
        <div class="list-item">
          <div class="txn-icon deposit">↓</div>
          <div class="content">
            <div class="name">+ KES 2,500</div>
            <div class="meta">DEPOSIT · 26 Jun 2026</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
