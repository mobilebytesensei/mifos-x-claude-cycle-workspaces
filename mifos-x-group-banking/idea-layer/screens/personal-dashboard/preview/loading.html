<!DOCTYPE html>
<html lang="en" data-feature="personal-dashboard" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>personal-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .top-app-bar-primary { background: var(--primary-700); }
  .top-app-bar-primary h1 { font-size: 16px; }

  .group-banner { background: var(--primary-700); padding: var(--space-base) var(--space-base) var(--space-xl); display: flex; align-items: center; gap: var(--space-sm); }
  .group-banner-name { font-size: 15px; font-weight: 600; color: #fff; flex: 1; }
  .chip-inverse { padding: 2px 10px; border-radius: 9999px; background: rgba(255,255,255,.2); color: #fff; font-size: 12px; font-weight: 600; }

  main { padding: 0 0 88px; }
  .main-padded { padding: 0 var(--space-base); }

  /* Shimmer skeleton — mirrors the content cards */
  .shimmer { background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-sm); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Skeleton 1 — savings summary (overlaps banner) */
  .skel-savings { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); padding: var(--space-base); margin: calc(-1 * var(--space-lg)) var(--space-base) var(--space-base); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .skel-cardrow { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-sm); }
  .skel-summary { border: 1px solid var(--border-subtle); border-radius: var(--radius-base); padding: var(--space-md); }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar top-app-bar-primary">
    <h1>Good morning, Amina Hassan</h1>
    <button class="icon-btn" aria-label="Notifications">🔔</button>
  </header>

  <!-- group_banner -->
  <div class="group-banner">
    <span class="group-banner-name">Mwangaza VSLA</span>
    <span class="chip-inverse">KES</span>
  </div>

  <!-- shimmer_loading (count: 4) — mirrors savings, share-out, header, activity -->
  <main aria-busy="true" aria-label="Loading dashboard">
    <!-- 1. savings summary skeleton -->
    <div class="skel-savings">
      <div class="shimmer" style="height:14px;width:40%;margin-bottom:var(--space-md);"></div>
      <div class="shimmer" style="height:32px;width:55%;margin-bottom:var(--space-md);"></div>
      <div class="skel-cardrow">
        <div class="skel-summary">
          <div class="shimmer" style="height:11px;width:70%;margin-bottom:8px;"></div>
          <div class="shimmer" style="height:16px;width:85%;"></div>
        </div>
        <div class="skel-summary">
          <div class="shimmer" style="height:11px;width:60%;margin-bottom:8px;"></div>
          <div class="shimmer" style="height:16px;width:80%;"></div>
        </div>
      </div>
    </div>

    <div class="main-padded">
      <!-- 2. share-out projection skeleton -->
      <div class="card" style="background:var(--bg-muted);border-color:transparent;display:flex;gap:var(--space-md);align-items:center;">
        <div class="shimmer" style="width:32px;height:32px;border-radius:50%;flex-shrink:0;"></div>
        <div style="flex:1;">
          <div class="shimmer" style="height:12px;width:55%;margin-bottom:8px;"></div>
          <div class="shimmer" style="height:20px;width:40%;"></div>
        </div>
      </div>

      <!-- 3. section-heading skeleton -->
      <div class="shimmer" style="height:14px;width:40%;margin:var(--space-lg) 0 var(--space-sm);"></div>

      <!-- 4. activity list skeleton -->
      <div class="list">
        <div class="list-item">
          <div class="shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;"></div>
          <div class="main">
            <div class="shimmer" style="height:14px;width:55%;margin-bottom:8px;"></div>
            <div class="shimmer" style="height:11px;width:40%;"></div>
          </div>
        </div>
        <div class="list-item">
          <div class="shimmer" style="width:40px;height:40px;border-radius:50%;flex-shrink:0;"></div>
          <div class="main">
            <div class="shimmer" style="height:14px;width:50%;margin-bottom:8px;"></div>
            <div class="shimmer" style="height:11px;width:35%;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- bottom_nav — shell parity, Home active -->
  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-item active" aria-current="page"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-item"><span class="nav-icon">👥</span>Groups</button>
    <button class="nav-item"><span class="nav-icon">💰</span>Savings</button>
    <button class="nav-item"><span class="nav-icon">👤</span>Profile</button>
  </nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
