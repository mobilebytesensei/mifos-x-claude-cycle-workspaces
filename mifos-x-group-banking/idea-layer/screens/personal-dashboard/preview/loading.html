<!DOCTYPE html>
<html lang="en" data-feature="personal-dashboard" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>personal-dashboard · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  /* Group banner */
  .top-app-bar-primary { background: var(--primary-700); }
  .group-banner { background: var(--primary-700); padding: var(--space-base) var(--space-base) var(--space-xl); display: flex; align-items: center; gap: var(--space-sm); }
  .group-banner-name { font-size: 15px; font-weight: 600; color: #fff; flex: 1; }
  .chip-inverse { padding: 2px 10px; border-radius: 9999px; background: rgba(255,255,255,.2); color: #fff; font-size: 12px; font-weight: 500; }

  /* Shimmer */
  .shimmer { background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-sm); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Elevated savings card overlapping banner */
  .savings-summary-card { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-base); padding: var(--space-base); margin: calc(-1 * var(--space-lg)) var(--space-base) var(--space-base); box-shadow: 0 2px 8px rgba(0,0,0,.12); }

  main { padding: 0 0 80px; }
  .main-padded { padding: 0 var(--space-base); }

  .shimmer-text-md { height: 16px; margin-bottom: 8px; }
  .shimmer-text-sm { height: 12px; margin-bottom: 6px; }
  .shimmer-amount { height: 36px; width: 50%; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar top-app-bar-primary">
    <h1 class="app-bar-title">Good morning, Amina Hassan</h1>
    <button class="icon-btn" aria-label="Notifications">🔔</button>
  </header>
  <div class="group-banner">
    <div class="group-banner-name">Mwangaza VSLA</div>
    <span class="chip chip-inverse">KES</span>
  </div>
  <main>
    <!-- Savings summary skeleton — overlaps banner -->
    <div class="savings-summary-card">
      <div class="shimmer" style="height:14px;width:40%;margin-bottom:var(--space-sm);"></div>
      <div class="shimmer shimmer-amount"></div>
      <div style="display:flex;gap:var(--space-sm);">
        <div class="shimmer shimmer-text-sm" style="flex:1;"></div>
        <div class="shimmer shimmer-text-sm" style="flex:1;"></div>
      </div>
    </div>

    <div class="main-padded">
      <!-- Share-out projection skeleton -->
      <div class="card" style="background:var(--bg-muted);border-color:transparent;">
        <div class="shimmer" style="height:14px;width:55%;margin-bottom:var(--space-sm);"></div>
        <div class="shimmer" style="height:28px;width:45%;"></div>
      </div>

      <!-- Recent Activity header skeleton -->
      <div class="shimmer" style="height:16px;width:45%;margin-bottom:var(--space-base);"></div>

      <!-- Activity rows skeleton -->
      <div class="card" style="padding:0;">
        <div style="display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md) var(--space-base);border-bottom:1px solid var(--border-subtle);">
          <div class="shimmer" style="width:36px;height:36px;border-radius:50%;flex-shrink:0;"></div>
          <div style="flex:1;">
            <div class="shimmer shimmer-text-md" style="width:55%;"></div>
            <div class="shimmer shimmer-text-sm" style="width:40%;"></div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-md);padding:var(--space-md) var(--space-base);">
          <div class="shimmer" style="width:36px;height:36px;border-radius:50%;flex-shrink:0;"></div>
          <div style="flex:1;">
            <div class="shimmer shimmer-text-md" style="width:55%;"></div>
            <div class="shimmer shimmer-text-sm" style="width:40%;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
