sibling: api
schema_version: "4.0"
feature_id: personal-dashboard

api:
  - id: get_client_accounts
    function: get_client_accounts
    method: get
    endpoint: "/self/clients/{clientId}/accounts"
    description: Get all accounts (savings + loans) for the authenticated self-service client
    params:
      clientId: { type: Long, required: true, source: nav_params }
    response:
      type: object
      fields:
        savingsAccounts:
          type: array
          items:
            savingsProductId: Long
            savingsProductName: String
            id: Long
            accountNo: String
            status: object
            balance: Double
        loanAccounts:
          type: array
          items:
            loanProductId: Long
            loanProductName: String
            id: Long
            accountNo: String
            status: object
            loanBalance: Double
    errors:
      401: Session expired — navigate to login
      404: Client not found
      503: Server unavailable — use cache
    cache: { ttl: 300, strategy: stale-while-revalidate, offline: use_sqldelight }

  - id: get_savings_account
    function: get_savings_account
    method: get
    endpoint: "/self/savingsaccounts/{savingsId}"
    description: Get detailed savings account balance and summary for a specific account
    params:
      savingsId: { type: Long, required: true, source: api.get_client_accounts }
    response:
      type: object
      fields:
        id: Long
        accountNo: String
        savingsProductName: String
        currency:
          code: String
          displaySymbol: String
        summary:
          totalDeposits: Double
          totalWithdrawals: Double
          accountBalance: Double
          availableBalance: Double
        status:
          active: Boolean
    errors:
      401: Session expired
      404: Account not found
      503: Server unavailable — use cache
    cache: { ttl: 300, strategy: stale-while-revalidate, offline: use_sqldelight }

dtos:
  ClientAccountsResponse:
    savingsAccounts: "List<SavingsAccountSummaryDto>"
    loanAccounts: "List<LoanAccountSummaryDto>"

  SavingsAccountSummaryDto:
    id: Long
    accountNo: String
    savingsProductId: Long
    savingsProductName: String
    balance: Double
    status: AccountStatusDto

  LoanAccountSummaryDto:
    id: Long
    accountNo: String
    loanProductId: Long
    loanProductName: String
    loanBalance: Double
    status: AccountStatusDto

  SavingsAccountDetailDto:
    id: Long
    accountNo: String
    savingsProductName: String
    currency: CurrencyDto
    summary: SavingsSummaryDto
    status: AccountStatusDto

  LoanSummary:
    loanId: Long
    productName: String
    principalAmount: Double
    outstandingBalance: Double
    nextRepaymentDate: String
    nextRepaymentAmount: Double
    isOverdue: Boolean

  SavingsTransactionDto:
    id: Long
    date: String
    type: String
    amount: Double

cache_strategy:
  ttl: 300
  strategy: stale-while-revalidate
  offline: use_sqldelight

dependencies:
  repositories:
    - name: SelfServiceRepository
      methods:
        - "getClientAccounts(clientId: Long): Flow<ClientAccountsResponse>"
        - "getSavingsAccountDetail(savingsId: Long): Flow<SavingsAccountDetailDto>"
    - name: SavingsRepository
      methods:
        - "getRecentTransactions(savingsId: Long, limit: Int): Flow<List<SavingsTransactionDto>>"
    - name: LoanRepository
      methods:
        - "getActiveLoanSummary(clientId: Long): Flow<LoanSummary?>"
  services:
    - SessionManager
    - NetworkMonitor
  local_db:
    - table: client_accounts
      schema: SQLDelight client accounts entity
    - table: savings_transactions
      schema: SQLDelight savings transaction entity
