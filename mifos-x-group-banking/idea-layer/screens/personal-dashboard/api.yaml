sibling: api
schema_version: "4.0"
feature_id: personal-dashboard

api:
  - id: get_member_dashboard
    function: get_member_dashboard
    method: GET
    endpoint: "/companion/member/dashboard"    # companion API — unified identity, no clientId param
    description: >
      Fetch member dashboard data. Companion API resolves the user's groups from auth token
      via dt_member_role. Returns all groups the user belongs to, and per-selected-group:
      savings balances, share-out projection (ACCUMULATING) or rotation position (ROTATING_PAYOUT),
      and recent transactions. Replaces /self/clients/{id}/accounts + /self/savingsaccounts/{id}
      SelfService path. No clientId or selfServiceToken in params.
    params:
      selectedGroupId: { type: "String?", required: false, source: state }   # null = first group
    response:
      type: object
      fields:
        memberName: String
        myGroups: "List<GroupSummary>"
        selectedGroup: GroupSummary
        poolModel: String          # from selectedGroup.typeConfig
        groupLinkedSavingsBalance: Double
        individualSavingsBalance: Double
        shareOutProjection: "Double?"   # ACCUMULATING only
        rotationPosition: "Int?"        # ROTATING_PAYOUT only
        nextRecipientEta: "String?"     # ROTATING_PAYOUT only
        recentTransactions: "List<SavingsTransactionDto>"
    errors:
      401: Unauthorized — session expired
      404: Member not found in any group
      500: Server error
    cache: { ttl: 300, strategy: stale-while-revalidate, offline: use_sqldelight }

dtos:
  GroupSummary:
    groupId: String
    name: String
    poolModel: String     # ACCUMULATING | ROTATING_PAYOUT | NONE

  MemberDashboardResponse:
    memberName: String
    myGroups: "List<GroupSummary>"
    selectedGroup: GroupSummary
    poolModel: String
    groupLinkedSavingsBalance: Double
    individualSavingsBalance: Double
    shareOutProjection: "Double?"
    rotationPosition: "Int?"
    nextRecipientEta: "String?"
    recentTransactions: "List<SavingsTransactionDto>"

  SavingsTransactionDto:
    id: String
    date: String
    type: String          # DEPOSIT | WITHDRAWAL
    amount: Double

cache_strategy:
  ttl: 300
  strategy: stale-while-revalidate
  offline: use_sqldelight

dependencies:
  repositories:
    - name: MemberDashboardRepository    # companion API /companion/member/dashboard
      methods:
        - "getMemberDashboard(selectedGroupId: String?): Flow<MemberDashboardResponse>"
  services:
    - SessionManager
    - NetworkMonitor
  local_db:
    - table: member_dashboard_cache
      schema: SQLDelight MemberDashboardResponse entity
    - table: savings_transactions
      schema: SQLDelight SavingsTransaction entity
