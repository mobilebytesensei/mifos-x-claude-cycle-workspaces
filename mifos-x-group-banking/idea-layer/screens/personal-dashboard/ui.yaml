sibling: ui
schema_version: "4.0"
feature_id: personal-dashboard

route: /dashboard
entry_points:
  - source: login
    trigger: end_user_login_success
    params: { clientId: Long, selfServiceToken: String }
nav_params:
  clientId: { type: Long, required: true }
  selfServiceToken: { type: String, required: true }

screens:
  - id: personal-dashboard-screen
    name: PersonalDashboardScreen
    type: dashboard
    description: Home screen with summary cards and recent activity

state_model:
  PersonalDashboardViewModel:
    state:
      name: PersonalDashboardState
      fields:
        clientId: { type: Long, default: "0L" }
        memberName: { type: String, default: '""' }
        groupName: { type: String, default: '"Mwangaza Women\'s Group"' }
        groupLinkedSavingsBalance: { type: Double, default: "0.0" }
        individualSavingsBalance: { type: Double, default: "0.0" }
        activeLoan: { type: "LoanSummary?", default: "null" }
        shareOutProjection: { type: Double, default: "0.0" }
        recentTransactions: { type: "List<SavingsTransactionDto>", default: "emptyList()" }
        isRefreshing: { type: Boolean, default: "false" }
        isLoading: { type: Boolean, default: "true" }
        error: { type: "DashboardError?", default: "null" }
    screen_state:
      name: PersonalDashboardScreenState
      members: [Loading, Content, Error, Empty]
    errors:
      name: DashboardError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Unauthorized, retry: false, message_key: error_session_expired }
    events:
      name: PersonalDashboardEvent
      members:
        - { name: NavigateToSavings }
        - { name: NavigateToLoans }
        - { name: NavigateToLoanRequest }
    actions:
      name: PersonalDashboardAction
      members:
        - { name: OnRefresh, trigger: "Pull-to-refresh" }
        - { name: OnRetry, trigger: "Tap Retry button" }
        - { name: OnSavingsCardClick, trigger: "Tap savings summary card" }
        - { name: OnLoanCardClick, trigger: "Tap loan summary card" }
        - { name: OnRequestLoanClick, trigger: "Tap Request a Loan CTA" }
    di:
      - SelfServiceRepository
      - SavingsRepository
      - LoanRepository
      - SessionManager

components:
  - id: top_bar
    type: top-bar
    title: "{ i18n.good_morning | i18n.good_afternoon | i18n.good_evening }, {{memberName}}"
    style: { background: primary, elevation: 0dp }
    trailing:
      id: notification_icon
      type: icon-button
      icon: alert_24_regular
      tint: onPrimary
      badge: unread_count

  - id: group_banner
    type: card
    style:
      background: primary
      padding: "16dp 24dp 24dp"
      elevation: 0dp
    content:
      - id: group_name_text
        type: text
        value: "{{groupName}}"
        style: { text_style: bodyLarge, color: onPrimary, font_weight: semibold }
      - id: currency_chip
        type: chip
        label: "KES"
        style: { background: primaryContainer, text_color: onPrimaryContainer, corner_radius: full }

  - id: savings_summary_card
    type: card
    style:
      background: surface
      corner_radius: lg
      elevation: 2dp
      padding: 20dp
      margin_horizontal: 16dp
      margin_top: -20dp
    content:
      - id: savings_icon
        type: icon
        icon: savings_24_filled
        tint: primary
      - id: savings_label
        type: text
        style: { text_style: labelLarge, color: onSurfaceVariant }
        value: "Total Savings"
      - id: savings_balance_amount
        type: text
        style: { text_style: displaySmall, color: onSurface, font_weight: bold }
        value: "KES {{(groupLinkedSavingsBalance + individualSavingsBalance) | number}}"
      - id: savings_breakdown_row
        type: row
        children:
          - id: group_linked_label
            type: text
            style: { text_style: bodySmall, color: primary }
            value: "Group-linked: KES {{groupLinkedSavingsBalance | number}}"
          - id: individual_label
            type: text
            style: { text_style: bodySmall, color: secondary }
            value: "Individual: KES {{individualSavingsBalance | number}}"
      - id: savings_chevron
        type: icon
        icon: chevron_right_24_regular
        tint: onSurfaceVariant
    on_click: { action: OnSavingsCardClick, target: personal-savings }

  - id: loan_summary_card
    type: card
    visible: "{{activeLoan != null}}"
    style:
      background: surface
      corner_radius: lg
      elevation: 2dp
      padding: 20dp
      margin_horizontal: 16dp
      margin_top: 12dp
    content:
      - id: loan_icon
        type: icon
        icon: money_24_filled
        tint: tertiary
      - id: loan_label
        type: text
        style: { text_style: labelLarge, color: onSurfaceVariant }
        value: "Active Loan"
      - id: loan_outstanding_text
        type: text
        style: { text_style: headlineSmall, color: onSurface }
        value: "KES {{activeLoan.outstandingBalance | number}}"
      - id: next_repayment_text
        type: text
        style: { text_style: bodyMedium, color: onSurfaceVariant }
        value: "Next repayment: KES {{activeLoan.nextRepaymentAmount | number}} on {{activeLoan.nextRepaymentDate}}"
      - id: overdue_indicator
        type: chip
        visible: "{{activeLoan.isOverdue}}"
        label: "Overdue"
        icon: warning_24_filled
        style: { background: errorContainer, text_color: onErrorContainer }
    on_click: { action: OnLoanCardClick, target: personal-loans }

  - id: request_loan_cta
    type: card
    visible: "{{activeLoan == null}}"
    style:
      background: tertiaryContainer
      corner_radius: lg
      elevation: 0dp
      padding: 20dp
      margin_horizontal: 16dp
      margin_top: 12dp
    content:
      - id: request_loan_icon
        type: icon
        icon: add_circle_24_filled
        size: 40dp
        tint: onTertiaryContainer
      - id: request_loan_title
        type: text
        style: { text_style: titleMedium, color: onTertiaryContainer }
        value: "Need a loan?"
      - id: request_loan_subtitle
        type: text
        style: { text_style: bodyMedium, color: onTertiaryContainer }
        value: "Apply for up to KES 37,350 (3× your savings)"
    on_click: { action: OnRequestLoanClick, target: loan-request }

  - id: shareout_projection_card
    type: card
    style:
      background: secondaryContainer
      corner_radius: lg
      elevation: 0dp
      padding: 16dp
      margin_horizontal: 16dp
      margin_top: 12dp
    content:
      - id: shareout_icon
        type: icon
        icon: trophy_24_filled
        tint: onSecondaryContainer
      - id: shareout_label
        type: text
        style: { text_style: labelLarge, color: onSecondaryContainer }
        value: "Projected share-out"
      - id: shareout_amount
        type: text
        style: { text_style: headlineSmall, color: onSecondaryContainer, font_weight: bold }
        value: "KES {{shareOutProjection | number}}"

  - id: recent_activity_header
    type: text
    style: { text_style: titleMedium, color: onSurface, font_weight: semibold, margin_horizontal: 16dp, margin_top: 24dp }
    value: "Recent Activity"

  - id: recent_activity_list
    type: list-item
    style:
      min_touch_target: 48dp
      divider: true
    content:
      leading:
        id: activity_icon
        type: icon
        icon:
          DEPOSIT: arrow_download_24_filled
          WITHDRAWAL: arrow_upload_24_filled
        tint:
          DEPOSIT: primary
          WITHDRAWAL: error
      headline:
        type: text
        style: { text_style: bodyLarge, color: onSurface, font_weight: semibold }
        value:
          DEPOSIT: "+ KES {{transaction.amount | number}}"
          WITHDRAWAL: "- KES {{transaction.amount | number}}"
      supporting:
        type: text
        style: { text_style: bodyMedium, color: onSurfaceVariant }
        value: "{{transaction.type}} · {{transaction.date | date}}"

  - id: shimmer_loading
    type: shimmer
    count: 4
    style: { height: 100dp, corner_radius: lg, margin_horizontal: 16dp }

  - id: error_state
    type: error-state
    icon: wifi_off_24_filled
    title: "Could not load dashboard"
    body: "Check your internet connection and try again."
    cta_label: "Try Again"
    on_click: { action: OnRetry }

  - id: pull_to_refresh
    type: pull-to-refresh
    style: { color: primary }
    visible: "{{isRefreshing}}"

states:
  initial_state: loading
  loading:
    components: [top_bar, group_banner, shimmer_loading]
    description: "Initial data fetch — shimmer shown for all cards"
  content:
    components: [top_bar, group_banner, savings_summary_card, loan_summary_card, request_loan_cta, shareout_projection_card, recent_activity_header, recent_activity_list, pull_to_refresh]
    description: "All data loaded — cards and activity list visible"
  refreshing:
    components: [top_bar, group_banner, savings_summary_card, loan_summary_card, shareout_projection_card, recent_activity_header, recent_activity_list, pull_to_refresh]
    description: "Pull-to-refresh in progress"
  error:
    components: [top_bar, group_banner, error_state]
    description: "Network/server error — error state shown"
  empty:
    components: [top_bar, group_banner, request_loan_cta]
    description: "No accounts found (new member)"

i18n:
  en:
    good_morning: "Good morning"
    good_afternoon: "Good afternoon"
    good_evening: "Good evening"
    total_savings_label: "Total Savings"
    group_linked_label: "Group-linked"
    individual_label: "Individual"
    active_loan_label: "Active Loan"
    outstanding_balance_label: "Outstanding"
    next_repayment_label: "Next repayment"
    overdue_label: "Overdue"
    request_loan_title: "Need a loan?"
    request_loan_subtitle: "Apply for up to KES 37,350 (3× your savings)"
    shareout_projection_label: "Projected share-out"
    recent_activity_label: "Recent Activity"
    error_title: "Could not load dashboard"
    error_subtitle: "Check your internet connection and try again."
    retry_button: "Try Again"
