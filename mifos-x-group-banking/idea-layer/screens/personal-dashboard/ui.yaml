requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: personal-dashboard

business_logic:
  kind: crud
  description: >
    Fetches member dashboard data from the companion API (/companion/member/dashboard) via
    MemberDashboardRepository using Store5 stale-while-revalidate with SQLDelight offline cache.
    Resolves unified identity from auth token (no clientId nav-param), projects
    pool-model-adaptive financial summary (ACCUMULATING: share-out projection; ROTATING_PAYOUT:
    rotation position + ETA), and supports multi-group context via selectedGroupId re-fetch.
  library_refs: ["cmp-network-monitor"]
  external_library_refs: ["Store5", "SQLDelight", "MemberDashboardRepository"]
  description_hash: "b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

route: /dashboard/member
entry_points:
  - source: app_launch
    condition: "user_authenticated && !isOrganizerInAnyGroup"   # member-only entry
  - source: app_launch
    condition: "user_authenticated && isOrganizerInAnyGroup && sessionRoleHint == 'member'"
    description: "Organizers may switch to their member view via nav"
nav_params: {}   # no clientId or selfServiceToken — unified identity resolves from auth token

screens:
  - id: personal-dashboard-screen
    name: PersonalDashboardScreen
    type: dashboard
    description: >
      Member home screen. Unified identity — no selfServiceToken nav-param; identity
      resolved from auth token. Supports multi-group context (member in N groups);
      shows group selector if myGroups.size > 1. Group-type-aware shareout projection
      label: ACCUMULATING types show "Projected Share-Out"; ROTATING_PAYOUT types show
      "Your Rotation Position" with next-recipient ETA. Data from companion API
      (/companion/member/dashboard). Replaces /self/clients/{id}/accounts SelfService path.

state_model:
  PersonalDashboardViewModel:
    state:
      name: PersonalDashboardState
      fields:
        memberName: { type: String, default: '""' }     # from session.displayName (no clientId nav-param)
        clientId: { type: Long, default: "0L" }                  # from get_member_dashboard.clientId — forwarded to personal-savings
        groupLinkedSavingsId: { type: Long, default: "0L" }      # from get_member_dashboard.groupLinkedSavingsId — forwarded to personal-savings
        individualSavingsId: { type: "Long?", default: "null" }  # optional voluntary individual account id — forwarded to personal-savings
        myGroups: { type: "List<GroupSummary>", default: "emptyList()" }   # multi-group support
        selectedGroup: { type: "GroupSummary?", default: "null" }           # active group context
        poolModel: { type: String, default: '""' }      # ACCUMULATING | ROTATING_PAYOUT | NONE (from selectedGroup.typeConfig)
        groupLinkedSavingsBalance: { type: Double, default: "0.0" }
        individualSavingsBalance: { type: Double, default: "0.0" }
        shareOutProjection: { type: Double, default: "0.0" }      # ACCUMULATING types
        rotationPosition: { type: "Int?", default: "null" }        # ROTATING_PAYOUT types
        nextRecipientEta: { type: "String?", default: "null" }     # ROTATING_PAYOUT types
        recentTransactions: { type: "List<SavingsTransactionDto>", default: "emptyList()" }
        isRefreshing: { type: Boolean, default: "false" }
        isLoading: { type: Boolean, default: "true" }
        error: { type: "DashboardError?", default: "null" }
    screen_state:
      name: PersonalDashboardScreenState
      members: [Loading, Content, Error, Empty]
    errors:
      name: DashboardError
      types:
        - { type: Network, retry: true, message_key: error_network }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Unauthorized, retry: false, message_key: error_session_expired }
    events:
      name: PersonalDashboardEvent
      members:
        - { name: NavigateToSavings }
        - { name: NavigateToGroupList }
        - { name: NavigateToLoans, params: { clientId: Long } }   # loan_card tap → personal-loans
        - { name: NavigateToSettings }                            # overflow menu → settings
        - { name: NavigateToSyncStatus }                          # overflow menu → sync-status
    actions:
      name: PersonalDashboardAction
      members:
        - { name: OnRefresh, trigger: "Pull-to-refresh" }
        - { name: OnRetry, trigger: "Tap Retry button" }
        - { name: OnSavingsCardClick, trigger: "Tap savings summary card" }
        - { name: OnSelectGroup, params: { groupId: String }, trigger: "Tap group selector chip" }
        - { name: OnLoansCardClick, trigger: "Tap loan entry card" }
        - { name: OnSettingsClick, trigger: "Tap Settings in profile overflow menu" }
        - { name: OnSyncStatusClick, trigger: "Tap Sync Status in profile overflow menu" }
    di:
      - MemberDashboardRepository   # companion API /companion/member/dashboard (replaces SelfServiceRepository)
      - SessionManager

components:
  - id: top_bar
    type: top-bar
    title: "{ i18n.good_morning | i18n.good_afternoon | i18n.good_evening }, {{memberName}}"
    style: { background: primary, elevation: 0dp }
    trailing:
      id: notification_icon
      type: icon-button
      icon: alert_24_regular
      tint: onPrimary
      badge: unread_count
    # Profile / overflow menu (authenticated top-bar affordance) — the in-app entry point to the
    # shared Settings and Sync Status screens. Replaces the never-wired `bottom_nav` trigger the
    # settings/sync-status ui.yaml declared: personal-dashboard is the authenticated member home and
    # owns the top bar, so it hosts the overflow menu that reaches both shared screens.
    overflow_menu:
      id: profile_overflow_menu
      type: icon-button
      icon: more_vertical_24_regular
      tint: onPrimary
      accessibility_label: "{i18n.overflow_menu_cd}"
      menu_items:
        - id: menu_settings
          label: "{i18n.menu_settings}"
          icon: settings_24_regular
          on_click:
            action: OnSettingsClick
            target: settings
            action_contract:
              effect: navigate
              description: "Navigates to the shared settings screen via the NavController when the member selects Settings from the profile overflow menu; no data mutation."
              action_contract_author: "claude-via-idea-enrich"
              action_contract_authored_at: "2026-08-01T00:00:00Z"
        - id: menu_sync_status
          label: "{i18n.menu_sync_status}"
          icon: arrow_sync_24_regular
          on_click:
            action: OnSyncStatusClick
            target: sync-status
            action_contract:
              effect: navigate
              description: "Navigates to the shared sync-status offline-sync dashboard via the NavController when the member selects Sync Status from the profile overflow menu; no data mutation."
              action_contract_author: "claude-via-idea-enrich"
              action_contract_authored_at: "2026-08-01T00:00:00Z"

  - id: group_banner
    type: card
    style:
      background: primary
      padding: "16dp 24dp 24dp"
      elevation: 0dp
    content:
      - id: group_name_text
        type: text
        value: "{{selectedGroup.name}}"    # active group context; resolved from myGroups[0] if single
        style: { text_style: bodyLarge, color: onPrimary, font_weight: semibold }
      - id: currency_chip
        type: chip
        label: "{i18n.currency_kes}"
        style: { background: primaryContainer, text_color: onPrimaryContainer, corner_radius: full }
      # Multi-group selector — visible only when user is in 2+ groups
      - id: group_selector_row
        type: chip-group
        visible: "{{myGroups.size > 1}}"
        selection: single
        chips: "{{myGroups | map(g => { id: g.groupId, label: g.name, selected: g.groupId == selectedGroup.groupId })}}"
        on_click:
          action: OnSelectGroup
          params: { groupId: "{{tappedChipId}}" }
          action_contract:
            effect: call_api
            library_refs: ["cmp-network-monitor"]
            external_library_refs: ["MemberDashboardRepository"]
            description: "Re-fetches dashboard from companion API via MemberDashboardRepository with the tapped groupId as selectedGroupId; cmp-network-monitor guards the call and serves SQLDelight cache when offline; updates all savings and pool-model projection fields."
            action_contract_hash: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
        style: { scroll_horizontal: true, padding_vertical: 8dp }

  - id: savings_summary_card
    type: card
    style:
      background: surface
      corner_radius: lg
      elevation: 2dp
      padding: 20dp
      margin_horizontal: 16dp
      margin_top: -20dp
    content:
      - id: savings_icon
        type: icon
        icon: savings_24_filled
        tint: primary
      - id: savings_label
        type: text
        style: { text_style: labelLarge, color: onSurfaceVariant }
        value: "{i18n.total_savings_label}"
      - id: savings_balance_amount
        type: text
        style: { text_style: displaySmall, color: onSurface, font_weight: bold }
        value: "{i18n.currency_kes} {{(groupLinkedSavingsBalance + individualSavingsBalance) | number}}"
      - id: savings_breakdown_row
        type: row
        children:
          - id: group_linked_label
            type: text
            style: { text_style: bodySmall, color: primary }
            value: "{i18n.group_linked_label}: {i18n.currency_kes} {{groupLinkedSavingsBalance | number}}"
          - id: individual_label
            type: text
            style: { text_style: bodySmall, color: secondary }
            value: "{i18n.individual_label}: {i18n.currency_kes} {{individualSavingsBalance | number}}"
      - id: savings_chevron
        type: icon
        icon: chevron_right_24_regular
        tint: onSurfaceVariant
    on_click:
      action: OnSavingsCardClick
      target: personal-savings
      params: { clientId: "{clientId}", groupLinkedSavingsId: "{groupLinkedSavingsId}", individualSavingsId: "{individualSavingsId}" }
      action_contract:
        effect: navigate
        description: "Navigates to the personal-savings screen, forwarding the member's clientId, groupLinkedSavingsId, and (optional) individualSavingsId — the personal-savings nav_params — so the savings screen can load the member's own group-linked and individual savings ledgers."
        action_contract_hash: "c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  # Loan entry card — navigational tile into the member's own loan list (personal-loans). No
  # balance/summary data is projected here (MemberDashboard carries no loan fields); this is a pure
  # navigation affordance (icon + label + chevron), the member's gateway to view loans + request a
  # new loan. Un-defers the v1.1 loan-card placeholder now that personal-loans + loan-request ship.
  - id: loan_card
    type: card
    style:
      background: surface
      corner_radius: lg
      elevation: 2dp
      padding: 20dp
      margin_horizontal: 16dp
      margin_top: 12dp
    content:
      - id: loan_icon
        type: icon
        icon: wallet_credit_card_24_filled
        tint: tertiary
      - id: loan_label
        type: text
        style: { text_style: labelLarge, color: onSurface, font_weight: semibold }
        value: "{i18n.my_loans_label}"
      - id: loan_sublabel
        type: text
        style: { text_style: bodyMedium, color: onSurfaceVariant }
        value: "{i18n.my_loans_sublabel}"
      - id: loan_chevron
        type: icon
        icon: chevron_right_24_regular
        tint: onSurfaceVariant
    on_click:
      action: OnLoansCardClick
      target: personal-loans
      params: { clientId: "{clientId}" }
      action_contract:
        effect: navigate
        description: "Navigates to the personal-loans screen, forwarding the member's clientId (the personal-loans nav_param) so the loans list loads the signed-in member's own loans; the loans screen's FAB then reaches loan-request."
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-08-01T00:00:00Z"

  - id: shareout_projection_card
    type: card
    style:
      background: secondaryContainer
      corner_radius: lg
      elevation: 0dp
      padding: 16dp
      margin_horizontal: 16dp
      margin_top: 12dp
    content:
      - id: shareout_icon
        type: icon
        # Group-type-adaptive icon
        icon: "{{poolModel == 'ROTATING_PAYOUT' ? 'swap_horiz_24_filled' : 'trophy_24_filled'}}"
        tint: onSecondaryContainer
      - id: shareout_label
        type: text
        style: { text_style: labelLarge, color: onSecondaryContainer }
        # Group-type-adaptive label
        value: "{{poolModel == 'ROTATING_PAYOUT' ? '{i18n.rotation_position_label}' : '{i18n.shareout_projection_label}'}}"
      # ACCUMULATING types: show projected KES amount
      - id: shareout_amount
        type: text
        visible: "{{poolModel != 'ROTATING_PAYOUT'}}"
        style: { text_style: headlineSmall, color: onSecondaryContainer, font_weight: bold }
        value: "{i18n.currency_kes} {{shareOutProjection | number}}"
      # ROTATING_PAYOUT types: show rotation position and ETA
      - id: rotation_position_text
        type: text
        visible: "{{poolModel == 'ROTATING_PAYOUT'}}"
        style: { text_style: headlineSmall, color: onSecondaryContainer, font_weight: bold }
        value: "{i18n.next_in_queue_label}"
      - id: next_recipient_eta_text
        type: text
        visible: "{{poolModel == 'ROTATING_PAYOUT' && nextRecipientEta != null}}"
        style: { text_style: bodySmall, color: onSecondaryContainer }
        value: "{i18n.your_turn_eta_label}"

  - id: recent_activity_header
    type: text
    style: { text_style: titleMedium, color: onSurface, font_weight: semibold, margin_horizontal: 16dp, margin_top: 24dp }
    value: "{i18n.recent_activity_label}"

  - id: recent_activity_list
    type: list-item
    style:
      min_touch_target: 48dp
      divider: true
    content:
      leading:
        id: activity_icon
        type: icon
        icon:
          DEPOSIT: arrow_download_24_filled
          WITHDRAWAL: arrow_upload_24_filled
        tint:
          DEPOSIT: primary
          WITHDRAWAL: error
      headline:
        type: text
        style: { text_style: bodyLarge, color: onSurface, font_weight: semibold }
        value:
          DEPOSIT: "+ {i18n.currency_kes} {{transaction.amount | number}}"
          WITHDRAWAL: "- {i18n.currency_kes} {{transaction.amount | number}}"
      supporting:
        type: text
        style: { text_style: bodyMedium, color: onSurfaceVariant }
        value: "{{transaction.type}} · {{transaction.date | date}}"  # i18n: skip — dynamic transaction type + formatted date

  - id: shimmer_loading
    type: shimmer
    count: 4
    style: { height: 100dp, corner_radius: lg, margin_horizontal: 16dp }

  - id: error_state
    type: error-state
    icon: wifi_off_24_filled
    title: "{i18n.error_title}"
    body: "{i18n.error_subtitle}"
    cta_label: "{i18n.retry_button}"
    on_click:
      action: OnRetry
      action_contract:
        effect: call_api
        library_refs: ["cmp-network-monitor"]
        external_library_refs: ["MemberDashboardRepository"]
        description: "Retries the companion API call via MemberDashboardRepository; cmp-network-monitor checks connectivity before dispatch; clears error state and re-enters loading state on re-fetch."
        action_contract_hash: "d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: pull_to_refresh
    type: pull-to-refresh
    style: { color: primary }
    visible: "{{isRefreshing}}"

states:
  initial_state: loading
  loading:
    components: [top_bar, group_banner, shimmer_loading]
    description: "Initial data fetch — shimmer shown for all cards"
  content:
    components: [top_bar, group_banner, savings_summary_card, loan_card, shareout_projection_card, recent_activity_header, recent_activity_list, pull_to_refresh]
    description: "All data loaded — savings, loan entry, share-out projection, and activity visible; multi-group selector in banner if 2+ groups"
    demo_data:
      memberName: "Amina Hassan"
      myGroups:
        - { groupId: "grp-001", name: "Mwangaza VSLA", poolModel: "ACCUMULATING" }
      selectedGroup: { groupId: "grp-001", name: "Mwangaza VSLA", poolModel: "ACCUMULATING" }
      poolModel: "ACCUMULATING"
      groupLinkedSavingsBalance: 20000.0   # VSLA share value total
      individualSavingsBalance: 5000.0
      shareOutProjection: 23500.0
      rotationPosition: null
      nextRecipientEta: null
      recentTransactions:
        - { id: "t-1", date: "2026-07-10", type: "DEPOSIT", amount: 2500.0 }
        - { id: "t-2", date: "2026-06-26", type: "DEPOSIT", amount: 2500.0 }
  refreshing:
    components: [top_bar, group_banner, savings_summary_card, loan_card, shareout_projection_card, recent_activity_header, recent_activity_list, pull_to_refresh]
    description: "Pull-to-refresh in progress"
  error:
    components: [top_bar, group_banner, error_state]
    description: "Network/server error — error state shown"
  empty:
    components: [top_bar, group_banner]
    description: "New member — no groups joined yet"

i18n:
  en:
    good_morning: "Good morning"
    good_afternoon: "Good afternoon"
    good_evening: "Good evening"
    currency_kes: "KES"
    total_savings_label: "Total Savings"
    group_linked_label: "Group-linked"
    individual_label: "Individual"
    my_loans_label: "My Loans"
    my_loans_sublabel: "View your loans and request a new one"
    overflow_menu_cd: "More options"
    menu_settings: "Settings"
    menu_sync_status: "Sync Status"
    shareout_projection_label: "Projected Share-Out"   # ACCUMULATING types
    rotation_position_label: "Your Rotation Position"  # ROTATING_PAYOUT types
    next_in_queue_label: "#{{rotationPosition}} in queue"
    your_turn_eta_label: "Your turn: ~{{nextRecipientEta}}"
    recent_activity_label: "Recent Activity"
    error_title: "Could not load dashboard"
    error_subtitle: "Check your internet connection and try again."
    retry_button: "Try Again"
