<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Dashboard — CommonPurse</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { display: ['Noto Sans', 'system-ui', 'sans-serif'] },
      colors: {
        primary: '#2E7D32', secondary: '#FF8F00', tertiary: '#1565C0',
        surface: '#FAFAFA', 'on-surface': '#1A1C19', error: '#D32F2F',
      }
    }
  }
};
</script>
<style>
:root {
  --primary: #2E7D32; --on-primary: #FFFFFF; --secondary: #FF8F00;
  --tertiary: #1565C0; --bg: #FAFAFA; --text: #1A1C19;
}
body { font-family: 'Noto Sans', system-ui, sans-serif; }
.phone { width: 393px; min-height: 852px; border-radius: 2.5rem; overflow: hidden; position: relative; background: #F1F4EF; }
body.embedded { background: #F1F4EF; margin: 0; padding: 0; min-height: 100vh; display: block; }
body.embedded #standalone-toolbar { display: none !important; }
body.embedded #phone-wrapper { display: none !important; }
body.embedded #embedded-content { display: flex !important; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; background: #F1F4EF; }
.card { background: white; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.tap-card { cursor: pointer; transition: transform 0.1s; }
.tap-card:active { transform: scale(0.98); }
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.shimmer { background: linear-gradient(90deg, #e8f0e7 25%, #d4e8d2 50%, #e8f0e7 75%); background-size: 800px 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
</style>
</head>
<body class="bg-[#0F0F23] min-h-screen flex flex-col">

<!-- Standalone Toolbar -->
<div id="standalone-toolbar" class="flex items-center h-12 px-4 border-b border-white/5 bg-[#0F0F23] shrink-0">
  <span class="text-sm font-semibold text-slate-200 flex-1">Personal Dashboard — CommonPurse</span>
  <select id="statePicker" onchange="switchState(this.value)" class="mx-2 px-2 py-1 text-xs rounded-md border border-white/10 bg-white/5 text-slate-300 outline-none">
    <option value="content">Content</option>
    <option value="loading">Loading</option>
    <option value="refreshing">Refreshing</option>
    <option value="error">Error</option>
    <option value="empty">Empty (New Member)</option>
  </select>
  <button onclick="toggleDark()" class="px-2 py-1 text-xs text-slate-400 hover:text-slate-200 border border-white/10 rounded-md mx-1">🌙</button>
</div>

<!-- Phone Frame -->
<div id="phone-wrapper" class="flex-1 flex items-center justify-center p-4">
  <div class="phone shadow-2xl border border-slate-200/20">
    <div class="flex items-center justify-between px-6 py-2" style="background:#2E7D32">
      <span class="text-xs font-semibold text-white">9:41</span>
      <div class="flex gap-1">
        <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
        <span class="material-symbols-outlined text-sm text-white">wifi</span>
        <span class="material-symbols-outlined text-sm text-white">battery_full</span>
      </div>
    </div>
    <div id="screen-content" class="overflow-y-auto" style="height:732px; background:#F1F4EF"></div>
    <div id="bottom-nav"></div>
    <div class="flex justify-center py-2 bg-white"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
  </div>
</div>

<!-- Embedded Content -->
<div id="embedded-content" style="display:none">
  <div class="flex items-center justify-between px-6 py-2 shrink-0" style="background:#2E7D32; padding-top:48px">
    <span class="text-xs font-semibold text-white">9:41</span>
    <div class="flex gap-1">
      <span class="material-symbols-outlined text-sm text-white">signal_cellular_alt</span>
      <span class="material-symbols-outlined text-sm text-white">wifi</span>
      <span class="material-symbols-outlined text-sm text-white">battery_full</span>
    </div>
  </div>
  <div id="embedded-screen-content" class="overflow-y-auto flex-1" style="background:#F1F4EF"></div>
  <div id="embedded-bottom-nav"></div>
  <div class="flex justify-center py-2 bg-white shrink-0"><div class="w-32 h-1 bg-slate-900/20 rounded-full"></div></div>
</div>

<div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>

<script>
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
if (isEmbedded) {
  document.body.classList.remove('bg-[#0F0F23]', 'min-h-screen', 'flex', 'flex-col');
  document.body.classList.add('embedded');
}
function getContentEl() { return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content'); }
function getNavEl() { return isEmbedded ? document.getElementById('embedded-bottom-nav') : document.getElementById('bottom-nav'); }

function renderTopBar() {
  return `<div class="px-4 py-3 flex items-center justify-between" style="background:#2E7D32">
    <div>
      <div class="text-sm text-white/80">Good morning,</div>
      <div class="text-lg font-bold text-white">Grace Mwangi</div>
    </div>
    <div class="relative">
      <span class="material-symbols-outlined text-white text-2xl cursor-pointer" onclick="showToast('Notifications')">notifications</span>
      <span class="absolute -top-1 -right-1 w-4 h-4 bg-[#FF8F00] rounded-full text-white text-[9px] flex items-center justify-center font-bold">3</span>
    </div>
  </div>
  <div class="px-4 pb-6 pt-2 flex items-center gap-2" style="background:#2E7D32">
    <span class="text-base font-semibold text-white">Mwangaza Women's Group</span>
    <span class="px-3 py-0.5 rounded-full text-xs font-bold text-[#1B5E20]" style="background:#C8E6C9;">KES</span>
  </div>`;
}

function renderContent(showLoan) {
  return `
  <div>
    ${renderTopBar()}
    <div class="px-4 -mt-4 flex flex-col gap-3 pb-4">

      <!-- Savings Summary Card -->
      <!-- tap: navigates to personal-savings -->
      <div class="card p-5 tap-card" onclick="navigateTo('personal-savings')">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-xl" style="color:#2E7D32; font-variation-settings:'FILL' 1">savings</span>
          <span class="text-xs font-semibold uppercase tracking-wide text-[#42493F]">Total Savings</span>
          <div class="flex-1"></div>
          <span class="material-symbols-outlined text-[#72796F]">chevron_right</span>
        </div>
        <div class="text-3xl font-bold text-[#1A1C19] mb-2">KES 12,450</div>
        <div class="flex gap-6">
          <div>
            <div class="text-xs text-[#72796F]">Group-linked</div>
            <div class="text-sm font-semibold" style="color:#2E7D32;">KES 9,600</div>
          </div>
          <div>
            <div class="text-xs text-[#72796F]">Individual</div>
            <div class="text-sm font-semibold text-[#FF8F00]">KES 2,850</div>
          </div>
        </div>
      </div>

      ${showLoan ? `
      <!-- Active Loan Card -->
      <!-- tap: navigates to personal-loans -->
      <div class="card p-5 tap-card" onclick="navigateTo('personal-loans')">
        <div class="flex items-center gap-2 mb-2">
          <span class="material-symbols-outlined text-xl" style="color:#1565C0; font-variation-settings:'FILL' 1">payments</span>
          <span class="text-xs font-semibold uppercase tracking-wide text-[#42493F]">Active Loan</span>
          <div class="flex-1"></div>
          <span class="material-symbols-outlined text-[#72796F]">chevron_right</span>
        </div>
        <div class="text-2xl font-bold text-[#1A1C19] mb-1">KES 15,000 <span class="text-sm font-normal text-[#72796F]">outstanding</span></div>
        <div class="flex items-center gap-2 p-2 rounded-lg" style="background:#F1F4EF;">
          <span class="material-symbols-outlined text-sm" style="color:#2E7D32; font-variation-settings:'FILL' 1">event</span>
          <span class="text-sm text-[#42493F]">Next repayment <strong>KES 1,500</strong> on 15 May 2026</span>
        </div>
      </div>` : `
      <!-- Request Loan CTA -->
      <!-- tap: navigates to loan-request -->
      <div class="card p-5 tap-card" style="background:#E3F2FD;" onclick="navigateTo('loan-request')">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-3xl" style="color:#1565C0; font-variation-settings:'FILL' 1">add_circle</span>
          <div>
            <div class="text-base font-bold text-[#0D47A1]">Need a loan?</div>
            <div class="text-sm text-[#1565C0]">Apply for up to KES 37,350 (3× your savings)</div>
          </div>
        </div>
      </div>`}

      <!-- Share-Out Projection Card -->
      <div class="card p-4 flex items-center gap-3" style="background:#FFF8E1;">
        <span class="material-symbols-outlined text-2xl text-[#E65100]" style="font-variation-settings:'FILL' 1">emoji_events</span>
        <div>
          <div class="text-xs text-[#E65100] font-semibold uppercase tracking-wide">Projected share-out</div>
          <div class="text-xl font-bold text-[#1A1C19]">KES 38,250</div>
        </div>
        <div class="flex-1"></div>
        <div class="text-right">
          <div class="text-xs text-[#72796F]">Cycle ends</div>
          <div class="text-xs font-medium text-[#42493F]">Dec 2026</div>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="text-base font-semibold text-[#1A1C19] mt-2 mb-1">Recent Activity</div>

      <!-- Transaction rows -->
      ${[
        { type: 'deposit', icon: 'trending_up', label: 'Meeting contribution', date: '28 Apr 2026', amount: '+KES 500', color: '#2E7D32' },
        { type: 'deposit', icon: 'trending_up', label: 'Individual savings', date: '21 Apr 2026', amount: '+KES 1,000', color: '#2E7D32' },
        { type: 'loan', icon: 'account_balance', label: 'Loan repayment', date: '15 Apr 2026', amount: '-KES 1,500', color: '#D32F2F' },
        { type: 'deposit', icon: 'trending_up', label: 'Meeting contribution', date: '14 Apr 2026', amount: '+KES 500', color: '#2E7D32' },
      ].map(tx => `
        <div class="card flex items-center gap-3 p-4">
          <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background:${tx.color}20;">
            <span class="material-symbols-outlined text-xl" style="color:${tx.color}; font-variation-settings:'FILL' 1">${tx.icon}</span>
          </div>
          <div class="flex-1">
            <div class="text-sm font-semibold text-[#1A1C19]">${tx.label}</div>
            <div class="text-xs text-[#72796F]">${tx.date}</div>
          </div>
          <div class="text-sm font-bold" style="color:${tx.color}">${tx.amount}</div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function renderLoading() {
  return `<div>
    ${renderTopBar()}
    <div class="px-4 -mt-4 flex flex-col gap-3 pb-4">
      ${[100, 80, 100, 80].map(h => `<div class="shimmer" style="height:${h}px;"></div>`).join('')}
    </div>
  </div>`;
}

function renderError() {
  return `<div>
    ${renderTopBar()}
    <div class="flex flex-col items-center py-16 px-6 text-center">
      <span class="material-symbols-outlined text-5xl text-[#72796F] mb-4">wifi_off</span>
      <p class="text-lg font-semibold text-[#1A1C19] mb-2">Could not load dashboard</p>
      <p class="text-sm text-[#72796F] mb-6">Check your internet connection and try again.</p>
      <button class="px-6 py-3 rounded-full text-white font-semibold" style="background:#2E7D32;" onclick="switchState('content')">Try Again</button>
    </div>
  </div>`;
}

function renderEmpty() {
  return `<div>
    ${renderTopBar()}
    <div class="px-4 -mt-4 flex flex-col gap-3 pb-4">
      <div class="card p-5 flex items-center gap-3" style="background:#E3F2FD;">
        <span class="material-symbols-outlined text-3xl" style="color:#1565C0; font-variation-settings:'FILL' 1">add_circle</span>
        <div>
          <div class="text-base font-bold text-[#0D47A1]">Need a loan?</div>
          <div class="text-sm text-[#1565C0]">Apply for up to KES 37,350 (3× your savings)</div>
        </div>
      </div>
      <div class="flex flex-col items-center py-12 text-center">
        <span class="material-symbols-outlined text-5xl text-[#C8E6C9] mb-3">account_balance_wallet</span>
        <p class="text-base font-semibold text-[#42493F]">No accounts yet</p>
        <p class="text-sm text-[#72796F]">Speak to your treasurer to get started.</p>
      </div>
    </div>
  </div>`;
}

function renderBottomNav() {
  var items = [
    { id: 'personal-dashboard', icon: 'home', label: 'Home' },
    { id: 'personal-savings', icon: 'savings', label: 'Savings' },
    { id: 'personal-loans', icon: 'account_balance', label: 'Loans' },
    { id: 'settings', icon: 'settings', label: 'Settings' },
  ];
  var html = '<div class="flex items-center justify-around py-2 bg-white border-t border-slate-100">' +
    items.map(n => `<div class="flex flex-col items-center gap-0.5 cursor-pointer transition-colors ${n.id === 'personal-dashboard' ? 'text-[#2E7D32]' : 'text-slate-400'}" onclick="navigateTo('${n.id}')">
      <span class="material-symbols-outlined text-xl" ${n.id === 'personal-dashboard' ? 'style="font-variation-settings:\'FILL\' 1"' : ''}>${n.icon}</span>
      <span class="text-[10px]">${n.label}</span>
    </div>`).join('') + '</div>';
  getNavEl().innerHTML = html;
}

var currentState = 'content';
function switchState(stateId) {
  currentState = stateId || 'content';
  document.getElementById('statePicker').value = currentState;
  var html = '';
  if (currentState === 'loading') html = renderLoading();
  else if (currentState === 'refreshing') html = renderContent(true);
  else if (currentState === 'error') html = renderError();
  else if (currentState === 'empty') html = renderEmpty();
  else html = renderContent(true);
  getContentEl().innerHTML = html;
  renderBottomNav();
}

function navigateTo(target) {
  if (window !== window.top) window.parent.postMessage({ action: 'navigate', screenId: target }, '*');
  else showToast('Navigate to: ' + target);
}
function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'px-4 py-2 bg-slate-800 text-white text-sm rounded-lg shadow-lg';
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 2000);
}
function toggleDark() { document.querySelector('.phone') && document.querySelector('.phone').classList.toggle('bg-slate-900'); }
window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.action === 'switchState') switchState(e.data.stateId || e.data.state || '');
  if (e.data.action === 'getInspectorData') notifyParent();
});
function notifyParent() {
  if (window === window.top) return;
  window.parent.postMessage({
    action: 'screenLoaded', screenId: 'personal-dashboard', name: 'Personal Dashboard',
    feature: 'end-user-dashboard', status: 'enriched', componentCount: 9,
    states: [
      {id:'content',name:'Content'},{id:'loading',name:'Loading'},
      {id:'refreshing',name:'Refreshing'},{id:'error',name:'Error'},{id:'empty',name:'Empty'}
    ],
    inspectorData: {
      id: 'personal-dashboard', name: 'Personal Dashboard', feature: 'end-user-dashboard',
      status: 'enriched', components: [
        {type:'top-bar',label:'Dashboard Top Bar',target:''},
        {type:'card',label:'Savings Summary KES 12,450',target:'personal-savings'},
        {type:'card',label:'Active Loan KES 15,000',target:'personal-loans'},
        {type:'card',label:'Share-Out KES 38,250',target:''},
        {type:'list',label:'Recent Activity',target:''},
        {type:'bottom-nav',label:'Bottom Navigation',target:''}
      ],
      states: {}, incoming_from: ['login']
    }
  }, '*');
}
switchState('content');
notifyParent();
</script>
</body>
</html>
