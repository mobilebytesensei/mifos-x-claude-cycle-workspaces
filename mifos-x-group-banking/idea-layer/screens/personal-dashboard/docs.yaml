sibling: docs
schema_version: "4.0"
feature_id: personal-dashboard
contract_version: "2.0.0"

capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - has_offline_cache

id: personal-dashboard
name: Personal Dashboard
description: >
  End user's home screen. Shows group affiliation, own savings balance
  (group-linked + individual), active loan summary, share-out projection,
  and recent activity list. Pull-to-refresh. Covers FR-016, FR-017.
feature: end-user-dashboard
flow: end-user-dashboard-flow
version: "1.0.0"
tags: [dashboard, end_user, savings, loans, self-service, FR-016, FR-017]
status: designed
quality_score: 90
status_history:
  - status: draft
    at: "2026-05-05T00:00:00Z"
  - status: enriched
    at: "2026-05-05T00:00:00Z"
  - status: designed
    at: "2026-05-08T23:00:00Z"
entry_point: false
bottom_nav: true

legacy_metadata:
  analytics:
    screen_viewed:
      event: screen_viewed
      params:
        screen_id: personal-dashboard
        flow: end-user-dashboard-flow
        client_id: "{ clientId }"
    events:
      - name: savings_card_tapped
        trigger: user taps savings summary card
        params: { savings_balance: Double }
      - name: loan_card_tapped
        trigger: user taps loan summary card
        params: { loan_balance: Double }
      - name: request_loan_cta_tapped
        trigger: user taps Request a Loan CTA
        params: {}
      - name: dashboard_refreshed
        trigger: pull-to-refresh completed
        params: { success: Boolean }
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/end-user-dashboard/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/end-user-dashboard/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/end-user-dashboard/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/end-user-dashboard/"
