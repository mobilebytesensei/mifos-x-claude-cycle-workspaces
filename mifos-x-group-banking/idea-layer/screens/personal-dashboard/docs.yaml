id: personal-dashboard
name: Personal Dashboard
description: >
  Member home screen. Unified identity — no selfServiceToken nav-param or end_user_login_success entry; identity
  resolved from auth token, no clientId param. Supports multi-group context (member in N groups) with a group-selector
  chip row in the banner when myGroups.size > 1. Group-type-aware share-out projection card: ACCUMULATING types
  (VSLA/ASCA/SHG/SILC) show "Projected Share-Out KES X"; ROTATING_PAYOUT types (ROSCA/chit) show "Your Rotation Position
  #N in queue / Your turn: ~[date]". Data from single companion API call (/companion/member/dashboard) replacing
  /self/clients/{id}/accounts SelfService path. Loan summary deferred to v1.1 (SACCO/CBO lending contexts). Route:
  /dashboard/member.
feature: end-user-dashboard
