requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: member-add

route: /groups/{groupId}/members/add
entry_points:
  - source: member-list
    trigger: fab_tap
    params: { groupId: String }
nav_params:
  groupId: { type: String, required: true }

screens:
  - id: member-add-screen
    title: "Add Member"
    type: form
    description: Single-page form to create a new group member with photo capture

state_model:
  MemberAddViewModel:
    state:
      name: MemberAddState
      fields:
        firstName: { type: String, default: '""' }
        lastName: { type: String, default: '""' }
        phone: { type: String, default: '""' }
        photoUri: { type: "String?", default: "null" }
        selectedRole: { type: MemberRole, default: "MemberRole.MEMBER" }
        validationErrors: { type: "Map<String, String>", default: "emptyMap()" }
        isSubmitting: { type: Boolean, default: "false" }
        isSubmitSuccess: { type: Boolean, default: "false" }
        isOffline: { type: Boolean, default: "false" }
        error: { type: "MemberAddError?", default: "null" }
        showPhotoPicker: { type: Boolean, default: "false" }
        groupId: { type: String, default: '""' }
    screen_state:
      name: MemberAddScreenState
      members: [Content, Submitting, Success, Error]
    errors:
      name: MemberAddError
      types:
        - { type: Validation, retry: false, message_key: error_validation }
        - { type: Network, retry: true, message_key: error_network, fallback: queue_offline }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
        - { type: PhoneAlreadyExists, retry: false, message_key: error_phone_exists }
    events:
      name: MemberAddEvent
      members:
        - { name: NavigateToMemberProfile, params: { memberId: String, groupId: String } }
        - { name: NavigateBack }
        - { name: ShowPhotoPicker }
        - { name: ShowOfflineSyncDialog }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: MemberAddAction
      members:
        - { name: OnFirstNameChange, params: { value: String }, trigger: "Type first name" }
        - { name: OnLastNameChange, params: { value: String }, trigger: "Type last name" }
        - { name: OnPhoneChange, params: { value: String }, trigger: "Type phone number" }
        - { name: OnPhotoPickerOpen, trigger: "Tap photo area or camera icon" }
        - { name: OnPhotoCaptured, params: { uri: String }, trigger: "Camera capture complete" }
        - { name: OnPhotoSelected, params: { uri: String }, trigger: "Gallery image selected" }
        - { name: OnPhotoRemoved, trigger: "Tap remove photo" }
        - { name: OnRoleSelected, params: { role: MemberRole }, trigger: "Select role from dropdown" }
        - { name: OnSubmit, trigger: "Tap Save Member button" }
        - { name: OnBack, trigger: "Tap back or close" }
    di:
      - MemberRepository
      - SyncQueueRepository
      - ImagePickerHelper
      - NetworkMonitor
      - SessionManager

business_logic:
  kind: composite
  description: "Composite member-onboarding form: validates name and Kenyan E.164 phone, then on submit chains three Fineract REST calls — create_client (POST /clients), assign_member_role, and optional upload_photo. Reachability comes from cmp-network-monitor; when offline the request is enqueued to the SQLDelight sync_queue for Store5-backed drain. Photo capture uses filekit-core."
  required_modules:
    - core/network
    - core/database
    - core/store
  library_refs:
    - cmp-network-monitor
    - cmp-network-monitor-compose
  external_library_refs:
    - filekit-core
    - SQLDelight
    - Store5
    - Fineract REST /clients
  description_hash: "cd60ddb363306bf8b56c1fb2780fda2ab172937952acb38fa832ca71202a7da8"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_bar
    type: top-bar
    title: "Add Member"
    style: { background: primary, text_color: onPrimary }
    navigation_icon: close
    on_navigation_click:
      action: OnBack
      action_contract:
        effect: navigate
        description: "Navigates back to member-list via NavController, discarding the in-progress form; no member is created and no data is persisted."
        action_contract_hash: "771a735c2d08e06e629b894e53145079efa506260c6bd21acbf88546b8092e67"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: photo_picker_area
    type: card
    style:
      background: surfaceVariant
      corner_radius: 60dp
      width: 120dp
      height: 120dp
      elevation: 0dp
      alignment: center
      min_touch_target: 120dp
    content:
      - id: photo_preview
        type: image
        visible: "{{photoUri != null}}"
        src: "{{photoUri}}"
        style: { fill: true, corner_radius: 60dp }
      - id: photo_placeholder_icon
        type: icon
        visible: "{{photoUri == null}}"
        icon: add_a_photo
        style: { color: onSurfaceVariant, size: 40dp }
      - id: photo_remove_button
        type: icon-button
        visible: "{{photoUri != null}}"
        icon: cancel
        style: { color: error, size: 24dp, position: top_end }
        on_click:
          action: OnPhotoRemoved
          action_contract:
            effect: transform_state
            description: "Clears the currently selected member photoUri in VM state (photoUri=null); a pure in-memory transition that reverts the picker to its add-a-photo placeholder, no disk write."
            action_contract_hash: "22dac2550790ba39f4fd71d8343831f2debafbf8e31387d247a7bf963c906522"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
    on_click:
      action: OnPhotoPickerOpen
      action_contract:
        effect: transform_state
        description: "Toggles the photo-source bottom sheet visible via a pure VM state flip (showPhotoPicker=true); no I/O, no library — offers camera vs gallery choice for the member photo."
        action_contract_hash: "0fbf6c23905824376054b3ce777430bcd7036bef0f49c2187d810bda5e7ef1dc"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: photo_source_bottom_sheet
    type: bottom-sheet
    visible: "{{showPhotoPicker}}"
    title: "Add Photo"
    content:
      - id: camera_option
        type: list-item
        leading_icon: camera_alt
        headline: "Take Photo"
        on_click:
          action: OnPhotoCaptured
          system: camera
          action_contract:
            effect: record_media
            external_library_refs: [filekit-core]
            description: "Launches the device camera through filekit-core to capture a new member photo; on capture the returned image file path is written to VM photoUri for later multipart upload to /clients/{clientId}/images."
            action_contract_hash: "1d577225c3d51aa662b8c389a276637a2f22922b4121030e328de8901fc0d3ab"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
        style: { min_touch_target: 56dp }
      - id: gallery_option
        type: list-item
        leading_icon: photo_library
        headline: "Choose from Gallery"
        on_click:
          action: OnPhotoSelected
          system: gallery
          action_contract:
            effect: persist_file
            external_library_refs: [filekit-core]
            description: "Opens the gallery/document picker via filekit-core to select an existing image; the chosen PlatformFile path is stored to VM photoUri for later profile-photo upload."
            action_contract_hash: "41fd6e56480a617bd068b4cd89fa038db3cf2cbc062cfa3207e5d6fb060d5653"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
        style: { min_touch_target: 56dp }

  - id: first_name_field
    type: text-field
    label: "First Name"
    placeholder: "e.g. Amina"
    required: true
    max_length: 50
    keyboard: name
    style: { min_touch_target: 56dp }
    on_change:
      action: OnFirstNameChange
      param: value
      action_contract:
        effect: transform_state
        description: "Updates the firstName field in MemberAddState on each keystroke; a pure VM transform_state transition that also clears any prior firstName validation error."
        action_contract_hash: "bc890eaf705b3f4a995e1d8812d5792b80386812411d09b14be84287451bc760"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"
    error_text: "{{validationErrors.firstName}}"

  - id: last_name_field
    type: text-field
    label: "Last Name"
    placeholder: "e.g. Wanjiru"
    required: true
    max_length: 50
    keyboard: name
    style: { min_touch_target: 56dp }
    on_change:
      action: OnLastNameChange
      param: value
      action_contract:
        effect: transform_state
        description: "Updates the lastName field in MemberAddState on each keystroke; a pure VM transform_state transition that also clears any prior lastName validation error."
        action_contract_hash: "3e734f29ab6a6b701dce78f6b2c57416de6df23a176d7837b73801e9e8abccd8"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"
    error_text: "{{validationErrors.lastName}}"

  - id: phone_field
    type: text-field
    label: "Phone Number"
    placeholder: "+254712345678"
    helper: "Kenyan number: +254 or 07XXXXXXXX"
    required: true
    keyboard: phone
    max_length: 13
    prefix: "+254"
    style: { min_touch_target: 56dp }
    on_change:
      action: OnPhoneChange
      param: value
      action_contract:
        effect: transform_state
        description: "Updates the phone field in MemberAddState on each keystroke and re-runs the Kenyan E.164 phone-format check; a pure VM transform_state transition, no network call yet."
        action_contract_hash: "d6c75159d4d7444e0b7f96a91053b6e53bcb83d67162705192c38b895fd3f639"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"
    error_text: "{{validationErrors.phone}}"

  - id: role_dropdown
    type: text-field
    variant: dropdown
    label: "Role"
    required: true
    options:
      - { label: "Chairperson", value: CHAIRPERSON }
      - { label: "Treasurer", value: TREASURER }
      - { label: "Secretary", value: SECRETARY }
      - { label: "Member", value: MEMBER }
    default: MEMBER
    style: { min_touch_target: 56dp }
    on_change:
      action: OnRoleSelected
      param: role
      action_contract:
        effect: transform_state
        description: "Sets the selectedRole enum in MemberAddState from the dropdown selection (CHAIRPERSON/TREASURER/SECRETARY/MEMBER); a pure VM transform_state transition with no side effects."
        action_contract_hash: "f7beba4215c203eaff4b6489c5c9768c3b80f54e598a661a11de7a9c88e2bda8"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: offline_banner
    type: banner
    visible: "{{isOffline}}"
    icon: wifi_off
    message: "You are offline. This member will be added when you reconnect."
    style: { background: tertiaryContainer, text_color: onTertiaryContainer }

  - id: save_button
    type: button
    variant: filled
    label: "Save Member"
    loading: "{{isSubmitting}}"
    style: { background: primary, text_color: onPrimary, min_touch_target: 56dp, full_width: true }
    on_click:
      action: OnSubmit
      target: member-list
      action_contract:
        effect: call_api
        library_refs: [cmp-network-monitor]
        external_library_refs: [Fineract REST /clients, SQLDelight]
        description: "Submits the validated form: calls the Fineract create_client API (POST /clients) then assign_member_role and optional upload_photo; cmp-network-monitor gates online vs offline, and when offline the ops are queued to the SQLDelight sync_queue instead of navigating to member-list."
        action_contract_hash: "0c2545e03be182682763290f99f87a21c80964485fdb375b27dfb57d2a633125"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: content
  content:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, offline_banner, save_button]
    description: "Form ready for input; offline banner conditionally visible"
    demo_data:
      firstName: "Grace"
      lastName: "Achieng"
      phone: "+254723456789"
      selectedRole: SECRETARY
      photoUri: null
      isOffline: false
  submitting:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, save_button]
    description: "Save button shows loading; all fields disabled"
  success:
    description: "Navigated to member-profile"
  error:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, save_button]
    description: "Inline error shown below save button"

i18n:
  en:
    screen_title: "Add Member"
    field_first_name: "First Name"
    field_last_name: "Last Name"
    field_phone: "Phone Number"
    field_phone_helper: "Kenyan number: +254 or 07XXXXXXXX"
    field_role: "Role"
    photo_add: "Add Photo"
    photo_camera: "Take Photo"
    photo_gallery: "Choose from Gallery"
    role_chairperson: "Chairperson"
    role_treasurer: "Treasurer"
    role_secretary: "Secretary"
    role_member: "Member"
    btn_save: "Save Member"
    offline_notice: "You are offline. This member will be added when you reconnect."
    error_validation: "Please fix the highlighted fields."
    error_phone_format: "Enter a valid Kenyan phone number."
    error_phone_exists: "A member with this phone number already exists."
    error_network: "No internet. Member queued for sync."
    error_server: "Server error. Please retry."
    error_auth: "Session expired."
