sibling: ui
schema_version: "4.0"
feature_id: member-add

route: /groups/{groupId}/members/add
entry_points:
  - source: member-list
    trigger: fab_tap
    params: { groupId: String }
nav_params:
  groupId: { type: String, required: true }

screens:
  - id: member-add-screen
    title: "Add Member"
    type: form
    description: Single-page form to create a new group member with photo capture

state_model:
  MemberAddViewModel:
    state:
      name: MemberAddState
      fields:
        firstName: { type: String, default: '""' }
        lastName: { type: String, default: '""' }
        phone: { type: String, default: '""' }
        photoUri: { type: "String?", default: "null" }
        selectedRole: { type: MemberRole, default: "MemberRole.MEMBER" }
        validationErrors: { type: "Map<String, String>", default: "emptyMap()" }
        isSubmitting: { type: Boolean, default: "false" }
        isSubmitSuccess: { type: Boolean, default: "false" }
        isOffline: { type: Boolean, default: "false" }
        error: { type: "MemberAddError?", default: "null" }
        showPhotoPicker: { type: Boolean, default: "false" }
        groupId: { type: String, default: '""' }
    screen_state:
      name: MemberAddScreenState
      members: [Content, Submitting, Success, Error]
    errors:
      name: MemberAddError
      types:
        - { type: Validation, retry: false, message_key: error_validation }
        - { type: Network, retry: true, message_key: error_network, fallback: queue_offline }
        - { type: Server, retry: true, message_key: error_server }
        - { type: Auth, retry: false, message_key: error_auth, redirect: login }
        - { type: PhoneAlreadyExists, retry: false, message_key: error_phone_exists }
    events:
      name: MemberAddEvent
      members:
        - { name: NavigateToMemberProfile, params: { memberId: String, groupId: String } }
        - { name: NavigateBack }
        - { name: ShowPhotoPicker }
        - { name: ShowOfflineSyncDialog }
        - { name: ShowSnackbar, params: { message: String } }
    actions:
      name: MemberAddAction
      members:
        - { name: OnFirstNameChange, params: { value: String }, trigger: "Type first name" }
        - { name: OnLastNameChange, params: { value: String }, trigger: "Type last name" }
        - { name: OnPhoneChange, params: { value: String }, trigger: "Type phone number" }
        - { name: OnPhotoPickerOpen, trigger: "Tap photo area or camera icon" }
        - { name: OnPhotoCaptured, params: { uri: String }, trigger: "Camera capture complete" }
        - { name: OnPhotoSelected, params: { uri: String }, trigger: "Gallery image selected" }
        - { name: OnPhotoRemoved, trigger: "Tap remove photo" }
        - { name: OnRoleSelected, params: { role: MemberRole }, trigger: "Select role from dropdown" }
        - { name: OnSubmit, trigger: "Tap Save Member button" }
        - { name: OnBack, trigger: "Tap back or close" }
    di:
      - MemberRepository
      - SyncQueueRepository
      - ImagePickerHelper
      - NetworkMonitor
      - SessionManager

components:
  - id: top_bar
    type: top-bar
    title: "Add Member"
    style: { background: primary, text_color: onPrimary }
    navigation_icon: close
    on_navigation_click: { action: OnBack }

  - id: photo_picker_area
    type: card
    style:
      background: surfaceVariant
      corner_radius: 60dp
      width: 120dp
      height: 120dp
      elevation: 0dp
      alignment: center
      min_touch_target: 120dp
    content:
      - id: photo_preview
        type: image
        visible: "{{photoUri != null}}"
        src: "{{photoUri}}"
        style: { fill: true, corner_radius: 60dp }
      - id: photo_placeholder_icon
        type: icon
        visible: "{{photoUri == null}}"
        icon: add_a_photo
        style: { color: onSurfaceVariant, size: 40dp }
      - id: photo_remove_button
        type: icon-button
        visible: "{{photoUri != null}}"
        icon: cancel
        style: { color: error, size: 24dp, position: top_end }
        on_click: { action: OnPhotoRemoved }
    on_click: { action: OnPhotoPickerOpen }

  - id: photo_source_bottom_sheet
    type: bottom-sheet
    visible: "{{showPhotoPicker}}"
    title: "Add Photo"
    content:
      - id: camera_option
        type: list-item
        leading_icon: camera_alt
        headline: "Take Photo"
        on_click: { action: OnPhotoCaptured, system: camera }
        style: { min_touch_target: 56dp }
      - id: gallery_option
        type: list-item
        leading_icon: photo_library
        headline: "Choose from Gallery"
        on_click: { action: OnPhotoSelected, system: gallery }
        style: { min_touch_target: 56dp }

  - id: first_name_field
    type: text-field
    label: "First Name"
    placeholder: "e.g. Amina"
    required: true
    max_length: 50
    keyboard: name
    style: { min_touch_target: 56dp }
    on_change: { action: OnFirstNameChange, param: value }
    error_text: "{{validationErrors.firstName}}"

  - id: last_name_field
    type: text-field
    label: "Last Name"
    placeholder: "e.g. Wanjiru"
    required: true
    max_length: 50
    keyboard: name
    style: { min_touch_target: 56dp }
    on_change: { action: OnLastNameChange, param: value }
    error_text: "{{validationErrors.lastName}}"

  - id: phone_field
    type: text-field
    label: "Phone Number"
    placeholder: "+254712345678"
    helper: "Kenyan number: +254 or 07XXXXXXXX"
    required: true
    keyboard: phone
    max_length: 13
    prefix: "+254"
    style: { min_touch_target: 56dp }
    on_change: { action: OnPhoneChange, param: value }
    error_text: "{{validationErrors.phone}}"

  - id: role_dropdown
    type: text-field
    variant: dropdown
    label: "Role"
    required: true
    options:
      - { label: "Chairperson", value: CHAIRPERSON }
      - { label: "Treasurer", value: TREASURER }
      - { label: "Secretary", value: SECRETARY }
      - { label: "Member", value: MEMBER }
    default: MEMBER
    style: { min_touch_target: 56dp }
    on_change: { action: OnRoleSelected, param: role }

  - id: offline_banner
    type: banner
    visible: "{{isOffline}}"
    icon: wifi_off
    message: "You are offline. This member will be added when you reconnect."
    style: { background: tertiaryContainer, text_color: onTertiaryContainer }

  - id: save_button
    type: button
    variant: filled
    label: "Save Member"
    loading: "{{isSubmitting}}"
    style: { background: primary, text_color: onPrimary, min_touch_target: 56dp, full_width: true }
    on_click: { action: OnSubmit, target: member-list }

states:
  initial_state: content
  content:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, offline_banner, save_button]
    description: "Form ready for input; offline banner conditionally visible"
    demo_data:
      firstName: "Grace"
      lastName: "Achieng"
      phone: "+254723456789"
      selectedRole: SECRETARY
      photoUri: null
      isOffline: false
  submitting:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, save_button]
    description: "Save button shows loading; all fields disabled"
  success:
    description: "Navigated to member-profile"
  error:
    components: [top_bar, photo_picker_area, first_name_field, last_name_field, phone_field, role_dropdown, save_button]
    description: "Inline error shown below save button"

i18n:
  en:
    screen_title: "Add Member"
    field_first_name: "First Name"
    field_last_name: "Last Name"
    field_phone: "Phone Number"
    field_phone_helper: "Kenyan number: +254 or 07XXXXXXXX"
    field_role: "Role"
    photo_add: "Add Photo"
    photo_camera: "Take Photo"
    photo_gallery: "Choose from Gallery"
    role_chairperson: "Chairperson"
    role_treasurer: "Treasurer"
    role_secretary: "Secretary"
    role_member: "Member"
    btn_save: "Save Member"
    offline_notice: "You are offline. This member will be added when you reconnect."
    error_validation: "Please fix the highlighted fields."
    error_phone_format: "Enter a valid Kenyan phone number."
    error_phone_exists: "A member with this phone number already exists."
    error_network: "No internet. Member queued for sync."
    error_server: "Server error. Please retry."
    error_auth: "Session expired."
