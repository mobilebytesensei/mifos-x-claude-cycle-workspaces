sibling: api
schema_version: "4.0"
feature_id: member-add

api:
  - id: create_client
    function: create_client
    method: post
    endpoint: "/clients"
    description: Create a new Fineract client (group member)
    body:
      firstname: String
      lastname: String
      mobileNo: String
      active: Boolean
      activationDate: String
      officeId: Long
      groupId: Long
      locale: String
      dateFormat: String
    response:
      type: object
      fields:
        resourceId: Long
        clientId: Long
    errors:
      400: Validation error — invalid fields or duplicate phone
      401: Unauthorized
      403: Forbidden
      500: Server error
    offline_queue:
      table: sync_queue
      operation: CREATE_MEMBER

  - id: assign_member_role
    function: assign_member_role
    method: post
    endpoint: "/datatables/dt_member_role/{clientId}"
    description: Write member's role to custom datatable
    params:
      clientId: { type: Long, required: true, source: create_client_response }
    body:
      role: String
      groupId: Long
      assignedDate: String
    response:
      type: object
      fields:
        resourceId: Long
    errors:
      400: Invalid role
      401: Unauthorized
      500: Server error
    offline_queue:
      table: sync_queue
      operation: ASSIGN_MEMBER_ROLE

  - id: upload_photo
    function: upload_photo
    method: post
    endpoint: "/clients/{clientId}/images"
    description: Upload member profile photo
    params:
      clientId: { type: Long, required: true, source: create_client_response }
    body_type: multipart/form-data
    body:
      file: File
    response:
      type: object
      fields:
        resourceId: Long
    errors:
      400: File too large (max 2MB)
      401: Unauthorized
      500: Server error
    offline_queue:
      table: sync_queue
      operation: UPLOAD_MEMBER_PHOTO

dtos:
  CreateMemberRequest:
    firstName: String
    lastName: String
    phone: String
    photoUri: "String?"
    role: MemberRole
    groupId: String
    officeId: Long
    activationDate: String

  MemberRole:
    values: [CHAIRPERSON, TREASURER, SECRETARY, MEMBER]

dependencies:
  repositories:
    - name: MemberRepository
      methods:
        - "createMember(request: CreateMemberRequest): Result<Member>"
        - "assignRole(memberId: String, role: MemberRole): Result<Unit>"
        - "uploadPhoto(memberId: String, uri: String): Result<Unit>"
    - name: SyncQueueRepository
      methods:
        - "enqueue(item: SyncQueueItem): Unit"
  services:
    - NetworkMonitor
    - SessionManager
    - ImagePickerHelper
