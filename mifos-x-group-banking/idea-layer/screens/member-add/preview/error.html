<!doctype html>
<!-- render-hash: dc19bf1a4cc3 -->
<html lang="en" data-feature="member-add" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>member-add · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  .photo-picker { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 0 8px; }
  .photo-tile {
    width: 120px; height: 120px; border-radius: 60px;
    background: var(--primary-100); display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; border: none;
  }
  .photo-tile .photo-icon { font-size: 40px; color: var(--primary-700); }
  .photo-hint { font-size: 12px; color: var(--text-secondary, #6b6b6b); }
  .form-body { padding: 0 var(--space-base, 16px) var(--space-base, 16px); }
  .form-footer { padding: 4px var(--space-base, 16px) 28px; }
  .field-error { color: var(--danger); font-size: 12px; margin-top: 4px; display: block; }
  .form-field input.has-error { border-color: var(--danger); }
  .submit-alert {
    display: flex; align-items: flex-start; gap: 8px; margin: 0 var(--space-base, 16px) 10px;
    background: #fdecea; color: var(--danger); border-radius: 8px; padding: 10px 12px; font-size: 13px;
  }
</style>
</head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <button class="back-btn" data-nav-to="member-list" aria-label="Close">✕</button>
    <h1 class="app-bar-title">Add Member</h1>
  </header>
  <main>
    <div class="photo-picker">
      <button class="photo-tile" data-action="OnPhotoPickerOpen" aria-label="Add photo">
        <span class="photo-icon" aria-hidden="true">＋</span>
      </button>
      <span class="photo-hint">Add Photo</span>
    </div>

    <div class="form-body">
      <div class="form-field">
        <label for="first-name">First Name</label>
        <input id="first-name" type="text" value="" placeholder="e.g. Amina" class="has-error" aria-invalid="true">
        <span class="field-error">First name is required.</span>
      </div>
      <div class="form-field">
        <label for="last-name">Last Name</label>
        <input id="last-name" type="text" value="Wambui" placeholder="e.g. Wanjiru">
      </div>
      <div class="form-field">
        <label for="phone">Phone Number</label>
        <input id="phone" type="tel" value="0712" placeholder="+254712345678" class="has-error" aria-invalid="true" inputmode="tel">
        <span class="field-error">Enter a valid Kenyan phone number.</span>
      </div>
      <div class="form-field">
        <label for="role">Role</label>
        <select id="role">
          <option value="CHAIRPERSON">Chairperson</option>
          <option value="TREASURER">Treasurer</option>
          <option value="SECRETARY">Secretary</option>
          <option value="MEMBER" selected>Member</option>
        </select>
      </div>
    </div>
  </main>

  <div class="submit-alert" role="alert">
    <span aria-hidden="true">⚠</span>
    <span>Please fix the highlighted fields.</span>
  </div>
  <div class="form-footer">
    <button class="btn btn-primary btn-full" data-state-to="submitting">Save Member</button>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
