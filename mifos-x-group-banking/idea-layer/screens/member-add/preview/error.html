<!doctype html>
<!-- render-hash: member-add-error-v3-ds-only -->
<html lang="en" data-feature="member-add" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>member-add · error · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <button class="back-btn" aria-label="Close" data-nav-to="member-list">✕</button>
    <h1>Add Member</h1>
  </header>

  <main>
    <!-- photo_picker_area -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:var(--space-sm); margin-bottom:var(--space-lg);">
      <button data-action="OnPhotoPickerOpen" aria-label="Add member photo"
        style="width:120px; height:120px; border-radius:60px; background:var(--primary-100); color:var(--primary-700); border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:40px;">
        ＋
      </button>
      <span class="footnote">Add Photo</span>
    </div>

    <div class="card">
      <!-- first_name_field -->
      <div class="form-field">
        <label for="ma-first">First Name</label>
        <input id="ma-first" type="text" value="Grace" placeholder="e.g. Amina" maxlength="50">
      </div>

      <!-- last_name_field -->
      <div class="form-field">
        <label for="ma-last">Last Name</label>
        <input id="ma-last" type="text" value="Achieng" placeholder="e.g. Wanjiru" maxlength="50">
      </div>

      <!-- phone_field (invalid) -->
      <div class="form-field">
        <label for="ma-phone">Phone Number</label>
        <input id="ma-phone" type="tel" inputmode="tel" value="+254723456789" placeholder="+254712345678" maxlength="13" aria-invalid="true" style="border-color:var(--danger);">
        <span class="help" style="color:var(--danger);">A member with this phone number already exists.</span>
      </div>

      <!-- role_dropdown -->
      <div class="form-field">
        <label for="ma-role">Role</label>
        <select id="ma-role">
          <option value="CHAIRPERSON">Chairperson</option>
          <option value="TREASURER">Treasurer</option>
          <option value="SECRETARY" selected>Secretary</option>
          <option value="MEMBER">Member</option>
        </select>
      </div>
    </div>

    <!-- save_button -->
    <button class="btn btn-primary btn-full" data-state-to="submitting">Save Member</button>

    <!-- error alert + retry (below save button) -->
    <div class="alert alert-danger" role="alert" style="margin-top:var(--space-base);">
      <span aria-hidden="true">⚠</span>
      <div>
        <h3>Couldn't add member</h3>
        <p>A member with this phone number already exists. Update the number and try again.</p>
        <button class="btn btn-danger btn-full" data-state-to="submitting" style="margin-top:var(--space-sm);">Retry</button>
      </div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
