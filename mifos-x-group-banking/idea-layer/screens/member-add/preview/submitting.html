<!doctype html>
<!-- render-hash: member-add-submitting-v3-ds-only -->
<html lang="en" data-feature="member-add" data-state="submitting" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>member-add · submitting · MifosSave</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="form">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar (close disabled while submitting) -->
  <header class="top-app-bar">
    <button class="back-btn" style="visibility:hidden;" aria-hidden="true">✕</button>
    <h1>Add Member</h1>
  </header>

  <!-- frozen form with spinner overlay -->
  <main style="position:relative;">
    <div style="opacity:.5; pointer-events:none;">
      <!-- photo_picker_area (frozen) -->
      <div style="display:flex; flex-direction:column; align-items:center; gap:var(--space-sm); margin-bottom:var(--space-lg);">
        <div style="width:120px; height:120px; border-radius:60px; background:var(--primary-100); color:var(--primary-700); display:inline-flex; align-items:center; justify-content:center; font-size:40px;">
          ＋
        </div>
        <span class="footnote">Add Photo</span>
      </div>

      <div class="card">
        <!-- first_name_field -->
        <div class="form-field">
          <label for="ma-first">First Name</label>
          <input id="ma-first" type="text" value="Grace" disabled>
        </div>

        <!-- last_name_field -->
        <div class="form-field">
          <label for="ma-last">Last Name</label>
          <input id="ma-last" type="text" value="Achieng" disabled>
        </div>

        <!-- phone_field -->
        <div class="form-field">
          <label for="ma-phone">Phone Number</label>
          <input id="ma-phone" type="tel" value="+254723456789" disabled>
          <span class="help">Kenyan number: +254 or 07XXXXXXXX</span>
        </div>

        <!-- role_dropdown -->
        <div class="form-field">
          <label for="ma-role">Role</label>
          <select id="ma-role" disabled><option selected>Secretary</option></select>
        </div>
      </div>

      <!-- save_button (loading) -->
      <button class="btn btn-primary btn-full" disabled aria-busy="true">Saving…</button>
    </div>

    <!-- spinner overlay -->
    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
      <div class="spinner" role="status" aria-label="Saving member"></div>
    </div>
  </main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
