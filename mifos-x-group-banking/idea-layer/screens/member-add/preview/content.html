<!DOCTYPE html>
<html lang="en" data-feature="member-add" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>member-add · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="form">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar"><button class="back-btn" data-nav-to="member-list">‹</button><h1>Add member</h1></header>
<main>
  <div class="form-field"><label for="fn">Full name</label><input id="fn" type="text" placeholder="e.g. Wanjiru Kamau"></div>
  <div class="form-field"><label for="ph">Phone</label><input id="ph" type="tel" placeholder="+254 700 000 000"></div>
  <div class="form-field"><label for="id">National ID</label><input id="id" type="text" placeholder="ID number"></div>
  <div class="form-field"><label for="role">Role</label>
    <select id="role"><option>Member</option><option>Treasurer</option><option>Secretary</option><option>Chairperson</option></select>
  </div>
  <div class="form-field"><label for="contrib">Weekly contribution (KES)</label><input id="contrib" type="number" placeholder="400" inputmode="numeric" class="amount-input"></div>
  <div class="form-field"><label>Photo (optional)</label>
    <button class="btn btn-secondary btn-full" data-action="upload_photo">⊕ Take photo</button>
  </div>
  <button class="btn btn-primary btn-full" data-action="save_member" data-nav-to="member-list">Save member</button>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
