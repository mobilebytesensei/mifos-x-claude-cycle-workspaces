<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Member — CommonPurse VSLA Group Banking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: { display: ['Noto Sans', 'system-ui', 'sans-serif'] },
      colors: {
        primary: '#2E7D32', 'on-primary': '#FFFFFF',
        secondary: '#FF8F00', tertiary: '#1565C0',
        surface: '#FAFAFA', 'on-surface': '#1A1C19',
        error: '#D32F2F'
      }
    }
  }
};
</script>
<style>
:root {
  --primary: #2E7D32; --on-primary: #FFFFFF;
  --secondary: #FF8F00; --tertiary: #1565C0;
  --surface: #FAFAFA; --on-surface: #1A1C19;
  --error: #D32F2F; --bg: #FFFFFF;
  --primary-container: #C8E6C9;
  --on-primary-container: #1B5E20;
}
* { font-family: 'Noto Sans', system-ui, sans-serif; box-sizing: border-box; }
body { background: #1A1C1E; min-height: 100vh; display: flex; flex-direction: column; margin: 0; }
.phone { width: 393px; min-height: 852px; border-radius: 2.5rem; overflow: hidden; position: relative; background: #FAFAFA; }
body.embedded { background: #FAFAFA; margin: 0; padding: 0; min-height: 100vh; display: block; }
body.embedded #standalone-toolbar { display: none !important; }
body.embedded #phone-wrapper { display: none !important; }
body.embedded #embedded-content { display: flex !important; flex-direction: column; width: 100%; height: 100vh; overflow: hidden; background: #FAFAFA; }

/* Field Styles */
.field-group { margin: 0 16px 16px; }
.field-label { font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 6px; display: block; }
.field-required { color: #D32F2F; margin-left: 2px; }
.field-input {
  width: 100%; padding: 13px 14px; border: 1.5px solid #D1FAE5; border-radius: 12px;
  font-size: 14px; color: #1A1C19; background: #fff; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  font-family: 'Noto Sans', sans-serif;
}
.field-input:focus { border-color: #2E7D32; box-shadow: 0 0 0 3px rgba(46,125,50,0.12); }
.field-input.error { border-color: #D32F2F; }
.field-input.valid { border-color: #2E7D32; }
.field-helper { font-size: 11px; color: #6B7280; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
.field-error-msg { font-size: 11px; color: #D32F2F; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

/* Photo Area */
.photo-upload-area {
  width: 100px; height: 100px; border-radius: 50%; background: #F0FDF4;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  margin: 16px auto 6px; border: 2.5px dashed #A5D6A7;
  transition: background 0.2s, border-color 0.2s; position: relative;
}
.photo-upload-area:hover { background: #E8F5E9; border-color: #2E7D32; }
.photo-upload-area.has-photo { border-style: solid; border-color: #2E7D32; }

/* Role Selector */
.role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 16px 16px; }
.role-card {
  border: 1.5px solid #E8F5E9; border-radius: 12px; padding: 12px;
  cursor: pointer; transition: all 0.15s; background: #fff; text-align: center;
}
.role-card:hover { border-color: #A5D6A7; background: #F0FDF4; }
.role-card.selected { border-color: #2E7D32; background: #E8F5E9; }
.role-icon-circle {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 6px; font-size: 14px; font-weight: 800;
}

/* Submit Button */
.submit-btn {
  width: 100%; background: #2E7D32; color: #fff; border: none; border-radius: 14px;
  padding: 16px; font-size: 15px; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
  box-shadow: 0 4px 12px rgba(46,125,50,0.3);
  font-family: 'Noto Sans', sans-serif;
}
.submit-btn:hover { background: #1B5E20; box-shadow: 0 6px 16px rgba(46,125,50,0.4); }
.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { background: #A5D6A7; box-shadow: none; cursor: not-allowed; }

/* Info Banner */
.info-banner {
  margin: 0 16px 14px; border-radius: 12px; padding: 12px 14px;
  display: flex; align-items: flex-start; gap: 10px;
}

/* Validation Summary */
.validation-summary { margin: 0 16px 14px; background: #FFEBEE; border-radius: 12px; padding: 12px 14px; }

/* Offline Banner */
.offline-banner { margin: 0 16px 14px; background: #E3F2FD; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }

/* Bottom Sheet overlay */
.overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 20; display: none; }
.bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-radius: 20px 20px 0 0; padding: 8px 0 24px; z-index: 21; display: none; }
.sheet-handle { width: 40px; height: 4px; background: #E0E0E0; border-radius: 9999px; margin: 8px auto 12px; }
.sheet-title { font-size: 16px; font-weight: 800; color: #1A1C19; padding: 0 20px 8px; }
.sheet-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; transition: background 0.15s; }
.sheet-item:hover { background: #F0FDF4; }
.sheet-item-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }

/* Progress Bar */
.progress-step { display: flex; align-items: center; margin-bottom: 6px; }
.progress-dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }

/* Shimmer */
.shimmer { background: linear-gradient(90deg, #E8F5E9 25%, #C8E6C9 50%, #E8F5E9 75%); background-size: 400px 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
@keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.bottom-sheet.show { display: block; animation: slideUp 0.3s ease-out; }
.overlay.show { display: block; animation: fadeIn 0.2s ease-out; }

/* Phone prefix input group */
.phone-input-group { display: flex; gap: 8px; align-items: stretch; }
.phone-prefix { background: #E8F5E9; border: 1.5px solid #D1FAE5; border-radius: 12px; padding: 13px 12px; font-size: 14px; font-weight: 700; color: #2E7D32; white-space: nowrap; display: flex; align-items: center; gap: 4px; cursor: pointer; transition: background 0.15s; }
.phone-prefix:hover { background: #C8E6C9; }

/* Success State */
.success-checkmark { width: 80px; height: 80px; border-radius: 50%; background: #C8E6C9; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
</style>
</head>
<body>

<!-- Standalone Toolbar -->
<div id="standalone-toolbar" style="display:flex;align-items:center;height:48px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,0.06);background:#1A1C1E;flex-shrink:0;">
  <span style="color:#CBD5E1;font-size:13px;font-weight:600;flex:1;">Add Member — CommonPurse VSLA</span>
  <select id="statePicker" onchange="switchState(this.value)" style="margin:0 8px;padding:4px 8px;font-size:11px;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#CBD5E1;outline:none;">
    <option value="content">Content (default)</option>
    <option value="submitting">Submitting</option>
    <option value="offline">Offline Mode</option>
    <option value="error">Validation Error</option>
    <option value="success">Success</option>
    <option value="photo_picker">Photo Picker</option>
  </select>
  <button onclick="toggleDark()" style="padding:4px 8px;font-size:11px;color:#94A3B8;border:1px solid rgba(255,255,255,0.1);border-radius:6px;background:transparent;cursor:pointer;margin-left:6px;">🌙</button>
</div>

<!-- Phone Frame (standalone) -->
<div id="phone-wrapper" style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="phone shadow-2xl" id="phone-frame" style="border:1px solid rgba(255,255,255,0.08);">
    <!-- Status Bar -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px;background:#2E7D32;">
      <span style="font-size:12px;font-weight:700;color:#fff;">9:41</span>
      <div style="display:flex;gap:4px;">
        <span class="material-symbols-outlined" style="font-size:14px;color:#fff;">signal_cellular_alt</span>
        <span class="material-symbols-outlined" style="font-size:14px;color:#fff;">wifi</span>
        <span class="material-symbols-outlined" style="font-size:14px;color:#fff;">battery_full</span>
      </div>
    </div>
    <!-- Top App Bar -->
    <div style="background:#2E7D32;padding:8px 16px 16px;display:flex;align-items:center;gap:12px;">
      <span class="material-symbols-outlined" style="color:#fff;font-size:22px;cursor:pointer;" onclick="showToast('Discard changes?')">close</span>
      <div style="flex:1;">
        <div style="color:#fff;font-size:18px;font-weight:800;">Add Member</div>
        <div style="color:rgba(255,255,255,0.8);font-size:12px;">Mwangaza Women's Group</div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.15);border-radius:8px;padding:4px 10px;">
        <span class="material-symbols-outlined" style="color:#fff;font-size:14px;">group_add</span>
        <span style="color:#fff;font-size:11px;font-weight:600;">5 members</span>
      </div>
    </div>
    <!-- Screen Content -->
    <div id="screen-content" style="height:640px;overflow-y:auto;background:#FAFAFA;position:relative;"></div>
    <!-- Home indicator -->
    <div style="display:flex;justify-content:center;padding:8px;background:#FAFAFA;"><div style="width:120px;height:4px;background:#1A1C19;border-radius:9999px;opacity:0.15;"></div></div>
  </div>
</div>

<!-- Embedded Content Container -->
<div id="embedded-content" style="display:none;">
  <!-- Top bar embedded -->
  <div style="background:#2E7D32;padding:48px 16px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;">
    <span class="material-symbols-outlined" style="color:#fff;font-size:22px;cursor:pointer;" onclick="showToast('Discard changes?')">close</span>
    <div style="flex:1;">
      <div style="color:#fff;font-size:18px;font-weight:800;">Add Member</div>
      <div style="color:rgba(255,255,255,0.8);font-size:12px;">Mwangaza Women's Group</div>
    </div>
  </div>
  <div id="embedded-screen-content" style="flex:1;overflow-y:auto;background:#FAFAFA;position:relative;"></div>
</div>

<!-- Toast container -->
<div id="toast-container" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;pointer-events:none;"></div>

<script>
/* ═══ SETUP ═══ */
var isEmbedded = (window !== window.top) || new URLSearchParams(location.search).has('embedded');
var currentState = 'content';
var selectedRole = 'MEMBER';
var hasPhoto = false;
var formData = { firstName: 'Grace', lastName: 'Achieng', phone: '723456789', role: 'SECRETARY' };

if (isEmbedded) {
  document.body.style.cssText = 'background:#FAFAFA;margin:0;padding:0;display:block;';
  document.getElementById('standalone-toolbar').style.display = 'none';
  document.getElementById('phone-wrapper').style.display = 'none';
  document.getElementById('embedded-content').style.display = 'flex';
  document.getElementById('embedded-content').style.flexDirection = 'column';
  document.getElementById('embedded-content').style.width = '100%';
  document.getElementById('embedded-content').style.height = '100vh';
  document.getElementById('embedded-content').style.overflow = 'hidden';
}

function getContentEl() {
  return isEmbedded ? document.getElementById('embedded-screen-content') : document.getElementById('screen-content');
}

/* ═══ ROLE DATA ═══ */
var ROLES = [
  { id: 'CHAIRPERSON', label: 'Chairperson', icon: 'gavel', bg: '#C8E6C9', tc: '#1B5E20', desc: 'Leads meetings & approves loans' },
  { id: 'TREASURER', label: 'Treasurer', icon: 'account_balance_wallet', bg: '#FFF3E0', tc: '#E65100', desc: 'Manages group finances' },
  { id: 'SECRETARY', label: 'Secretary', icon: 'assignment', bg: '#E3F2FD', tc: '#0D47A1', desc: 'Keeps meeting records' },
  { id: 'MEMBER', label: 'Member', icon: 'person', bg: '#F3F4F6', tc: '#374151', desc: 'Regular group participant' }
];

/* ═══ RENDER STATES ═══ */
function renderContent() {
  var role = ROLES.find(function(r){ return r.id === selectedRole; }) || ROLES[3];
  var roleCards = ROLES.map(function(r) {
    var sel = (selectedRole === r.id);
    return '<div class="role-card ' + (sel?'selected':'') + '" onclick="selectRole(\'' + r.id + '\')">' +
      '<div class="role-icon-circle" style="background:' + r.bg + ';color:' + r.tc + ';">' +
        '<span class="material-symbols-outlined" style="font-size:18px;">' + r.icon + '</span>' +
      '</div>' +
      '<div style="font-size:12px;font-weight:' + (sel?'700':'600') + ';color:' + (sel?'#1B5E20':'#374151') + ';">' + r.label + '</div>' +
      '<div style="font-size:10px;color:#9CA3AF;margin-top:2px;">' + r.desc + '</div>' +
      (sel ? '<div style="margin-top:6px;"><span class="material-symbols-outlined" style="font-size:16px;color:#2E7D32;">check_circle</span></div>' : '') +
    '</div>';
  }).join('');

  var html = '<div style="padding-top:8px;">' +
    // Step indicator
    '<div style="display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px 14px;">' +
      '<div style="width:28px;height:28px;border-radius:50%;background:#2E7D32;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">1</div>' +
      '<div style="flex:1;height:2px;background:#C8E6C9;max-width:40px;"></div>' +
      '<div style="width:28px;height:28px;border-radius:50%;background:#2E7D32;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">2</div>' +
      '<div style="flex:1;height:2px;background:#C8E6C9;max-width:40px;"></div>' +
      '<div style="width:28px;height:28px;border-radius:50%;background:#E8F5E9;color:#9CA3AF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">3</div>' +
    '</div>' +

    // Photo upload area
    '<div style="text-align:center;margin-bottom:6px;">' +
      '<div class="photo-upload-area ' + (hasPhoto?'has-photo':'') + '" onclick="openPhotoPicker()" id="photoArea">' +
        (hasPhoto ?
          '<div style="position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#C8E6C9,#A5D6A7);display:flex;align-items:center;justify-content:center;">' +
          '<span style="font-size:32px;font-weight:900;color:#1B5E20;">GA</span>' +
          '<div style="position:absolute;bottom:0;right:0;width:26px;height:26px;background:#2E7D32;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;">' +
          '<span class="material-symbols-outlined" style="font-size:14px;color:#fff;">edit</span>' +
          '</div>' +
          '</div>' :
          '<div style="text-align:center;">' +
          '<span class="material-symbols-outlined" style="font-size:36px;color:#A5D6A7;display:block;">add_a_photo</span>' +
          '<span style="font-size:10px;color:#9CA3AF;font-weight:600;">Add Photo</span>' +
          '</div>'
        ) +
      '</div>' +
      '<div style="font-size:11px;color:#9CA3AF;margin-top:2px;">' + (hasPhoto?'Tap to change photo':'Optional — helps identify members') + '</div>' +
    '</div>' +

    // Name section header
    '<div style="padding:8px 16px 4px;"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#9CA3AF;">Member Details</div></div>' +

    // First Name
    '<div class="field-group">' +
      '<label class="field-label">First Name <span class="field-required">*</span></label>' +
      '<div style="position:relative;">' +
        '<input class="field-input valid" type="text" placeholder="e.g. Amara" value="Grace" id="firstNameInput" oninput="validateField(this)">' +
        '<span class="material-symbols-outlined" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;color:#2E7D32;">check_circle</span>' +
      '</div>' +
    '</div>' +

    // Last Name
    '<div class="field-group">' +
      '<label class="field-label">Last Name <span class="field-required">*</span></label>' +
      '<div style="position:relative;">' +
        '<input class="field-input valid" type="text" placeholder="e.g. Diallo" value="Achieng" id="lastNameInput" oninput="validateField(this)">' +
        '<span class="material-symbols-outlined" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;color:#2E7D32;">check_circle</span>' +
      '</div>' +
    '</div>' +

    // Phone Number
    '<div class="field-group">' +
      '<label class="field-label">Phone Number <span class="field-required">*</span></label>' +
      '<div class="phone-input-group">' +
        '<div class="phone-prefix" onclick="showToast(\'Calling code: +254 (Kenya)\')">' +
          '<span style="font-size:16px;">🇰🇪</span>' +
          '<span style="font-size:13px;font-weight:700;color:#2E7D32;">+254</span>' +
          '<span class="material-symbols-outlined" style="font-size:14px;color:#9CA3AF;">arrow_drop_down</span>' +
        '</div>' +
        '<input class="field-input valid" type="tel" placeholder="712 345 678" value="723 456 789" style="flex:1;" id="phoneInput" maxlength="12">' +
      '</div>' +
      '<div class="field-helper"><span class="material-symbols-outlined" style="font-size:14px;">info</span>Kenyan number: +254 or 07XXXXXXXX (10 digits)</div>' +
    '</div>' +

    // Role section header
    '<div style="padding:8px 16px 4px;display:flex;justify-content:space-between;align-items:center;">' +
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#9CA3AF;">Assign Role</div>' +
      '<span style="background:#E8F5E9;color:#1B5E20;font-size:10px;font-weight:700;padding:2px 10px;border-radius:9999px;">Required</span>' +
    '</div>' +
    '<div class="role-grid">' + roleCards + '</div>' +

    // Selected role preview
    '<div style="margin:0 16px 16px;background:' + role.bg + ';border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;">' +
      '<div style="width:36px;height:36px;border-radius:50%;background:' + role.tc.replace(/[0-9A-Fa-f]{6}$/, function(h){return h;}) + ';background:rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;">' +
        '<span class="material-symbols-outlined" style="font-size:18px;color:' + role.tc + ';">' + role.icon + '</span>' +
      '</div>' +
      '<div style="flex:1;">' +
        '<div style="font-size:13px;font-weight:700;color:' + role.tc + ';">' + role.label + ' selected</div>' +
        '<div style="font-size:11px;color:' + role.tc + ';opacity:0.8;">' + role.desc + '</div>' +
      '</div>' +
    '</div>' +

    // Divider
    '<div style="height:1px;background:#E8F5E9;margin:0 16px 16px;"></div>' +

    // Field audit summary
    '<div style="margin:0 16px 16px;background:#F0FDF4;border-radius:12px;padding:12px 14px;">' +
      '<div style="font-size:12px;font-weight:700;color:#1B5E20;margin-bottom:8px;display:flex;align-items:center;gap:6px;">' +
        '<span class="material-symbols-outlined" style="font-size:16px;">checklist</span>Form Summary' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">' +
        '<div style="display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:14px;color:#2E7D32;">check_circle</span><span style="font-size:11px;color:#374151;">First Name</span></div>' +
        '<div style="display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:14px;color:#2E7D32;">check_circle</span><span style="font-size:11px;color:#374151;">Last Name</span></div>' +
        '<div style="display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:14px;color:#2E7D32;">check_circle</span><span style="font-size:11px;color:#374151;">Phone Number</span></div>' +
        '<div style="display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:14px;color:#2E7D32;">check_circle</span><span style="font-size:11px;color:#374151;">Role Assigned</span></div>' +
        '<div style="display:flex;align-items:center;gap:6px;"><span class="material-symbols-outlined" style="font-size:14px;color:#9CA3AF;">radio_button_unchecked</span><span style="font-size:11px;color:#9CA3AF;">Photo (optional)</span></div>' +
      '</div>' +
    '</div>' +

    // Save Button
    '<div style="padding:0 16px 28px;">' +
      '<button class="submit-btn" onclick="handleSubmit()">' +
        '<span class="material-symbols-outlined" style="font-size:20px;">person_add</span>' +
        'Save Member' +
      '</button>' +
      '<div style="text-align:center;margin-top:8px;font-size:11px;color:#9CA3AF;">Grace Achieng will be added to Mwangaza Women\'s Group</div>' +
    '</div>' +
  '</div>';

  getContentEl().innerHTML = html;
}

function renderSubmitting() {
  getContentEl().innerHTML =
    '<div style="padding:32px 16px;text-align:center;">' +
    '<div style="width:64px;height:64px;border-radius:50%;background:#E8F5E9;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">' +
      '<div style="width:36px;height:36px;border:3px solid rgba(46,125,50,0.3);border-top:3px solid #2E7D32;border-radius:50%;animation:spin 0.8s linear infinite;"></div>' +
    '</div>' +
    '<div style="font-size:18px;font-weight:800;color:#1A1C19;margin-bottom:8px;">Saving Grace Achieng...</div>' +
    '<div style="font-size:13px;color:#6B7280;margin-bottom:24px;">Creating member profile in Mwangaza Women\'s Group</div>' +
    '</div>' +
    '<div style="margin:0 16px;">' +
    renderProgressStep('Creating member profile', 'done') +
    renderProgressStep('Assigning role (Secretary)', 'active') +
    renderProgressStep('Uploading photo', 'pending') +
    renderProgressStep('Syncing with group', 'pending') +
    '</div>';
}

function renderProgressStep(label, status) {
  var dotBg = status==='done'?'#2E7D32':status==='active'?'#FF8F00':'#E8F5E9';
  var dotColor = status==='done'||status==='active'?'#fff':'#9CA3AF';
  var icon = status==='done'?'check':status==='active'?'hourglass_empty':'radio_button_unchecked';
  return '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F0FDF4;">' +
    '<div style="width:28px;height:28px;border-radius:50%;background:' + dotBg + ';color:' + dotColor + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;">' +
      '<span class="material-symbols-outlined" style="font-size:14px;">' + icon + '</span>' +
    '</div>' +
    '<div style="flex:1;">' +
      '<div style="font-size:13px;font-weight:600;color:' + (status==='pending'?'#9CA3AF':'#1A1C19') + ';">' + label + '</div>' +
      (status==='active'?'<div style="font-size:11px;color:#FF8F00;">In progress...</div>':
       status==='done'?'<div style="font-size:11px;color:#2E7D32;">Complete</div>':'') +
    '</div>' +
  '</div>';
}

function renderOffline() {
  getContentEl().innerHTML =
    '<div style="background:#E3F2FD;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-shrink:0;">' +
      '<span class="material-symbols-outlined" style="font-size:20px;color:#0277BD;">wifi_off</span>' +
      '<div style="flex:1;"><div style="font-size:12px;font-weight:700;color:#01579B;">Offline Mode Active</div><div style="font-size:11px;color:#0277BD;">This member will be saved locally and synced when you reconnect.</div></div>' +
    '</div>' +
    '<div style="padding-top:8px;">' +
    renderFormFields({prefilledFirstName:'Grace',prefilledLastName:'Achieng',prefilledPhone:'723 456 789'}) +
    '<div style="padding:0 16px 24px;">' +
      '<button class="submit-btn" onclick="showToast(\'Member queued for sync!')" style="background:#0277BD;">' +
        '<span class="material-symbols-outlined" style="font-size:20px;">cloud_off</span>' +
        'Save & Queue for Sync' +
      '</button>' +
      '<div style="text-align:center;margin-top:8px;font-size:11px;color:#0277BD;">Will sync automatically when connected · Encrypted local storage</div>' +
    '</div>' +
    '</div>';
}

function renderFormFields(opts) {
  opts = opts || {};
  return '<div class="field-group"><label class="field-label">First Name <span class="field-required">*</span></label><input class="field-input valid" type="text" value="' + (opts.prefilledFirstName||'') + '"></div>' +
    '<div class="field-group"><label class="field-label">Last Name <span class="field-required">*</span></label><input class="field-input valid" type="text" value="' + (opts.prefilledLastName||'') + '"></div>' +
    '<div class="field-group"><label class="field-label">Phone Number <span class="field-required">*</span></label><div class="phone-input-group"><div class="phone-prefix"><span>🇰🇪</span><span style="font-size:13px;font-weight:700;color:#2E7D32;">+254</span></div><input class="field-input valid" type="tel" value="' + (opts.prefilledPhone||'') + '" style="flex:1;"></div></div>';
}

function renderError() {
  getContentEl().innerHTML =
    '<div style="background:#FFEBEE;margin:12px 16px;border-radius:12px;padding:12px 14px;">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
        '<span class="material-symbols-outlined" style="font-size:20px;color:#D32F2F;">error</span>' +
        '<span style="font-size:13px;font-weight:700;color:#C62828;">Please fix the highlighted fields</span>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:4px;">' +
        '<div style="font-size:12px;color:#D32F2F;">• First name is required (minimum 2 characters)</div>' +
        '<div style="font-size:12px;color:#D32F2F;">• Phone number format invalid — use +254 or 07XXXXXXXX</div>' +
      '</div>' +
    '</div>' +

    '<div style="padding-top:4px;">' +
    '<div class="field-group"><label class="field-label">First Name <span class="field-required">*</span></label>' +
    '<input class="field-input error" type="text" placeholder="e.g. Amara" value="A">' +
    '<div class="field-error-msg"><span class="material-symbols-outlined" style="font-size:14px;">error_outline</span>Minimum 2 characters required</div>' +
    '</div>' +

    '<div class="field-group"><label class="field-label">Last Name <span class="field-required">*</span></label>' +
    '<input class="field-input valid" type="text" value="Achieng">' +
    '</div>' +

    '<div class="field-group"><label class="field-label">Phone Number <span class="field-required">*</span></label>' +
    '<div class="phone-input-group"><div class="phone-prefix"><span>🇰🇪</span><span style="font-size:13px;font-weight:700;color:#2E7D32;">+254</span></div>' +
    '<input class="field-input error" type="tel" value="712abc" style="flex:1;"></div>' +
    '<div class="field-error-msg"><span class="material-symbols-outlined" style="font-size:14px;">error_outline</span>Enter a valid Kenyan phone number (10 digits)</div>' +
    '</div>' +

    '<div class="role-grid">' + ROLES.map(function(r){ return '<div class="role-card ' + (r.id==='MEMBER'?'selected':'') + '" onclick="selectRole(\'' + r.id + '\')"><div class="role-icon-circle" style="background:' + r.bg + ';color:' + r.tc + ';"><span class="material-symbols-outlined" style="font-size:18px;">' + r.icon + '</span></div><div style="font-size:12px;font-weight:600;color:#374151;">' + r.label + '</div></div>'; }).join('') + '</div>' +

    '<div style="padding:0 16px 24px;">' +
    '<button class="submit-btn" onclick="switchState(\'content\')" style="background:#D32F2F;">' +
      '<span class="material-symbols-outlined" style="font-size:20px;">refresh</span>Fix Errors & Retry' +
    '</button>' +
    '</div></div>';
}

function renderSuccess() {
  getContentEl().innerHTML =
    '<div style="display:flex;flex-direction:column;align-items:center;padding:40px 24px;text-align:center;">' +
    '<div class="success-checkmark">' +
      '<span class="material-symbols-outlined" style="font-size:40px;color:#2E7D32;font-variation-settings:\'FILL\' 1;">check_circle</span>' +
    '</div>' +
    '<div style="font-size:22px;font-weight:800;color:#1A1C19;margin-bottom:6px;">Member Added!</div>' +
    '<div style="font-size:14px;color:#6B7280;margin-bottom:4px;">Grace Achieng (Secretary)</div>' +
    '<div style="font-size:12px;color:#9CA3AF;margin-bottom:24px;">Joined Mwangaza Women\'s Group · 7 May 2026</div>' +

    '<div style="background:#E8F5E9;border-radius:14px;padding:16px;width:100%;text-align:left;margin-bottom:20px;">' +
      '<div style="font-size:12px;font-weight:700;color:#1B5E20;margin-bottom:10px;">Member Summary</div>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' +
        '<div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#C8E6C9,#A5D6A7);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#1B5E20;">GA</div>' +
        '<div><div style="font-size:14px;font-weight:700;color:#1A1C19;">Grace Achieng</div><div style="font-size:12px;color:#6B7280;">+254 723 456 789</div></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
        '<span style="background:#E3F2FD;color:#0D47A1;font-size:11px;font-weight:700;padding:3px 10px;border-radius:9999px;">Secretary</span>' +
        '<span style="background:#F3F4F6;color:#6B7280;font-size:11px;font-weight:600;padding:3px 10px;border-radius:9999px;">Member #6</span>' +
        '<span style="background:#E8F5E9;color:#2E7D32;font-size:11px;font-weight:600;padding:3px 10px;border-radius:9999px;">Active</span>' +
      '</div>' +
    '</div>' +

    '<div style="display:flex;flex-direction:column;gap:8px;width:100%;">' +
      '<button onclick="showToast(\'Viewing Grace Achieng profile\')" style="width:100%;background:#2E7D32;color:#fff;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">' +
        '<span class="material-symbols-outlined" style="font-size:18px;">person</span>View Profile' +
      '</button>' +
      '<button onclick="switchState(\'content\')" style="width:100%;background:transparent;color:#2E7D32;border:1.5px solid #2E7D32;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">' +
        '<span class="material-symbols-outlined" style="font-size:18px;">person_add</span>Add Another Member' +
      '</button>' +
    '</div>' +
    '</div>';
}

function renderPhotoPickerOverlay() {
  // Render current content with photo picker overlay
  renderContent();
  var overlay = document.createElement('div');
  overlay.className = 'overlay show';
  overlay.id = 'photoOverlay';
  overlay.onclick = function(e) { if (e.target === overlay) closePhotoPicker(); };

  var sheet = document.createElement('div');
  sheet.className = 'bottom-sheet show';
  sheet.innerHTML =
    '<div class="sheet-handle"></div>' +
    '<div class="sheet-title">Add Photo</div>' +
    '<div class="sheet-item" onclick="selectPhoto(\'camera\')">' +
      '<div class="sheet-item-icon" style="background:#E8F5E9;"><span class="material-symbols-outlined" style="font-size:22px;color:#2E7D32;">camera_alt</span></div>' +
      '<div><div style="font-size:14px;font-weight:600;color:#1A1C19;">Take Photo</div><div style="font-size:12px;color:#6B7280;">Use front or back camera</div></div>' +
    '</div>' +
    '<div class="sheet-item" onclick="selectPhoto(\'gallery\')">' +
      '<div class="sheet-item-icon" style="background:#E3F2FD;"><span class="material-symbols-outlined" style="font-size:22px;color:#1565C0;">photo_library</span></div>' +
      '<div><div style="font-size:14px;font-weight:600;color:#1A1C19;">Choose from Gallery</div><div style="font-size:12px;color:#6B7280;">Select an existing photo</div></div>' +
    '</div>' +
    '<div class="sheet-item" onclick="closePhotoPicker()" style="border-top:1px solid #F0FDF4;margin-top:8px;">' +
      '<div class="sheet-item-icon" style="background:#F5F5F5;"><span class="material-symbols-outlined" style="font-size:22px;color:#9CA3AF;">close</span></div>' +
      '<div><div style="font-size:14px;font-weight:600;color:#9CA3AF;">Cancel</div></div>' +
    '</div>';

  var container = getContentEl();
  container.style.position = 'relative';
  container.appendChild(overlay);
  container.appendChild(sheet);
}

function openPhotoPicker() { renderPhotoPickerOverlay(); }

function closePhotoPicker() {
  var overlay = document.getElementById('photoOverlay');
  var sheets = getContentEl().querySelectorAll('.bottom-sheet');
  if (overlay) overlay.remove();
  sheets.forEach(function(s) { s.remove(); });
}

function selectPhoto(source) {
  hasPhoto = true;
  closePhotoPicker();
  renderContent();
  showToast(source === 'camera' ? 'Photo taken — looking great!' : 'Photo selected from gallery');
}

function selectRole(r) {
  selectedRole = r;
  if (currentState === 'content') renderContent();
}

function validateField(input) {
  if (input.value.length >= 2) {
    input.className = 'field-input valid';
  } else {
    input.className = 'field-input';
  }
}

function handleSubmit() {
  switchState('submitting');
  setTimeout(function() {
    showToast('Grace Achieng added to Mwangaza Women\'s Group ✓');
    switchState('success');
  }, 2200);
}

function switchState(s) {
  currentState = s;
  var picker = document.getElementById('statePicker');
  if (picker) picker.value = s;
  if (s === 'content') renderContent();
  else if (s === 'submitting') renderSubmitting();
  else if (s === 'offline') renderOffline();
  else if (s === 'error') renderError();
  else if (s === 'success') renderSuccess();
  else if (s === 'photo_picker') renderPhotoPickerOverlay();
}

function toggleDark() {
  var frame = document.getElementById('phone-frame');
  if (frame) { frame.style.background = frame.style.background === 'rgb(15, 23, 42)' ? '' : 'rgb(15, 23, 42)'; }
}

function showToast(msg) {
  var t = document.createElement('div');
  t.style.cssText = 'padding:10px 18px;background:#1A1C19;color:#fff;font-size:13px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,0.4);margin-bottom:8px;pointer-events:auto;white-space:nowrap;';
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(function() { t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(function(){t.remove();},300); }, 2000);
}

/* ═══ PostMessage bridge for iframe dashboard ═══ */
window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.action === 'switchState') switchState(e.data.stateId || e.data.state || 'content');
  if (e.data.action === 'getInspectorData') notifyParent();
});

function notifyParent() {
  if (window === window.top) return;
  window.parent.postMessage({
    action: 'screenLoaded',
    screenId: 'member-add',
    name: 'Member Add',
    feature: 'member-onboarding',
    status: 'enriched',
    componentCount: 9,
    states: [
      { id: 'content', name: 'Content (default)' },
      { id: 'submitting', name: 'Submitting' },
      { id: 'offline', name: 'Offline Mode' },
      { id: 'error', name: 'Validation Error' },
      { id: 'success', name: 'Success' },
      { id: 'photo_picker', name: 'Photo Picker' }
    ],
    inspectorData: {
      id: 'member-add', name: 'Member Add', feature: 'member-onboarding',
      status: 'enriched', tag: 'FR-002', phase: 'design',
      components: [
        { type: 'top-bar', label: 'Add Member', tag: 'top_bar' },
        { type: 'image', label: 'Photo Upload', tag: 'photo_picker_area' },
        { type: 'text-field', label: 'First Name', tag: 'first_name_field' },
        { type: 'text-field', label: 'Last Name', tag: 'last_name_field' },
        { type: 'text-field', label: 'Phone Number', tag: 'phone_field' },
        { type: 'grid', label: 'Role Selection', tag: 'role_grid' },
        { type: 'banner', label: 'Offline Notice', tag: 'offline_banner' },
        { type: 'button', label: 'Save Member', tag: 'save_button' },
        { type: 'bottom-sheet', label: 'Photo Source Picker', tag: 'photo_source_sheet' }
      ],
      states: {}
    }
  }, '*');
}

/* ═══ BOOT ═══ */
switchState('content');
notifyParent();
</script>
