sibling: tests
schema_version: "4.0"
feature_id: member-add

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    UseCase: "85%+"

  scenarios:
    - id: TC-MA-001
      scenario: "Submit valid form online — client created, role assigned, navigates to member-profile"
      type: ViewModel
      priority: P0
      given: "All fields valid: firstName='Grace', lastName='Achieng', phone='+254723456789', role=SECRETARY, network=online"
      when: "OnSubmit dispatched"
      then: "create_client called → assign_member_role called → NavigateToMemberProfile event emitted with new memberId"

    - id: TC-MA-002
      scenario: "Submit with blank first name — inline validation error shown"
      type: ViewModel
      priority: P0
      given: "firstName is empty, lastName='Wambui', phone='+254745000001'"
      when: "OnSubmit dispatched"
      then: "validationErrors contains firstName='First name is required.', no API call made"

    - id: TC-MA-003
      scenario: "Submit with invalid Kenyan phone — inline error on phone field"
      type: ViewModel
      priority: P0
      given: "firstName='John', lastName='Doe', phone='0712' (too short)"
      when: "OnSubmit dispatched"
      then: "validationErrors contains phone='Enter a valid Kenyan phone number.'"

    - id: TC-MA-004
      scenario: "Submit offline — member queued to sync_queue, offline snackbar shown"
      type: ViewModel
      priority: P0
      given: "NetworkMonitor.isOnline=false, all fields valid"
      when: "OnSubmit dispatched"
      then: "SyncQueueRepository.enqueue called with CREATE_MEMBER, ShowOfflineSyncDialog event emitted"

    - id: TC-MA-005
      scenario: "Duplicate phone returns 400 — PhoneAlreadyExists error shown inline"
      type: ViewModel
      priority: P1
      given: "API returns 400 with error_phone_exists code"
      when: "OnSubmit dispatched"
      then: "MemberAddError.PhoneAlreadyExists set, no navigation"

    - id: TC-MA-006
      scenario: "Photo picker bottom sheet opens on photo area tap"
      type: Screen
      priority: P1
      given: "Screen in content state, photoUri=null"
      when: "User taps photo_picker_area"
      then: "photo_source_bottom_sheet visible, Camera and Gallery options shown"

    - id: TC-MA-007
      scenario: "Camera capture sets photoUri and shows preview image"
      type: ViewModel
      priority: P1
      given: "showPhotoPicker=true"
      when: "OnPhotoCaptured with uri='/tmp/photo_001.jpg'"
      then: "photoUri set, showPhotoPicker=false, photo_preview visible"

    - id: TC-MA-008
      scenario: "Photo removed resets photoUri to null"
      type: ViewModel
      priority: P2
      given: "photoUri='/tmp/photo_001.jpg'"
      when: "OnPhotoRemoved dispatched"
      then: "photoUri=null, photo_placeholder_icon visible"

    - id: TC-MA-009
      scenario: "Role dropdown defaults to MEMBER and can be changed to TREASURER"
      type: Screen
      priority: P1
      given: "Screen in content state"
      when: "User selects TREASURER from role_dropdown"
      then: "OnRoleSelected dispatched with role=TREASURER, selectedRole updated"

    - id: TC-MA-010
      scenario: "Save button shows loading state while submitting"
      type: Screen
      priority: P1
      given: "isSubmitting=true"
      when: "Screen renders"
      then: "save_button shows circular loading indicator, all fields not interactive"

    - id: TC-MA-011
      scenario: "Offline banner visible when isOffline=true"
      type: Screen
      priority: P1
      given: "isOffline=true"
      when: "Screen renders content state"
      then: "offline_banner is visible with wifi_off icon and sync message"

    - id: TC-MA-012
      scenario: "Server error 500 shows snackbar with retry option"
      type: ViewModel
      priority: P1
      given: "Network online, API returns 500"
      when: "OnSubmit dispatched"
      then: "MemberAddError.Server set, ShowSnackbar event with error_server message"

    - id: TC-MA-013
      scenario: "Session expired 401 navigates to login"
      type: ViewModel
      priority: P0
      given: "API returns 401"
      when: "OnSubmit dispatched"
      then: "MemberAddError.Auth set, NavigateBack event then redirect to login"

    - id: TC-MA-014
      scenario: "Back tap from form triggers NavigateBack event"
      type: Screen
      priority: P2
      given: "Screen in content state"
      when: "User taps close icon in top_bar"
      then: "OnBack action dispatched, NavigateBack event emitted"
