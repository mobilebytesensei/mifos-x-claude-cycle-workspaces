sibling: tests
schema_version: "4.0"
feature_id: member-add
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-MAD-001
      scenario: "On mount, form initialises empty and groupId is captured from nav_params"
      type: ViewModel
      priority: P0
      given: "nav_params: groupId=1"
      when: "MemberAddScreen enters composition"
      then: "firstName, lastName, phone fields empty; groupId=1 stored; isSubmitting=false"

    - id: TC-MAD-002
      scenario: "Empty required field shows inline validation error on submit attempt"
      type: ViewModel
      priority: P0
      given: "firstName empty; phone empty"
      when: "OnSubmit fires"
      then: "firstNameError set; phoneError set; submit blocked; no API call"

    - id: TC-MAD-003
      scenario: "Invalid phone format shows phoneError inline"
      type: ViewModel
      priority: P0
      given: "phone='+254not-a-number'"
      when: "OnPhoneChange('+254not-a-number') fires"
      then: "phoneError=error_invalid_phone; submit disabled"

    - id: TC-MAD-004
      scenario: "OnSubmit when online POSTs to MemberRepository and emits MemberAdded on success"
      type: ViewModel
      priority: P0
      given: "all fields valid; network online"
      when: "OnSubmit fires"
      then: "isSubmitting=true; POST /companion/groups/1/members called; on 201 MemberAdded event emitted; NavigateBack fires"

    - id: TC-MAD-005
      scenario: "PhoneAlreadyExists server error shown inline on phone field"
      type: ViewModel
      priority: P1
      given: "phone number already registered to another member"
      when: "OnSubmit fires and server returns phone_already_exists"
      then: "phoneError=error_phone_already_exists; isSubmitting=false; form stays open"

    - id: TC-MAD-006
      scenario: "OnSubmit when offline queues member to sync_queue and shows offline confirmation"
      type: ViewModel
      priority: P0
      given: "all fields valid; cmp-network-monitor reports offline"
      when: "OnSubmit fires"
      then: "sync_queue member entry created; MemberAddScreenState=OfflineQueued; success banner shown"

    - id: TC-MAD-007
      scenario: "Photo capture button opens camera and sets photoUri in ViewModel"
      type: Screen
      priority: P2
      given: "Content state; camera permission granted"
      when: "OnCapturePhoto fires"
      then: "camera intent launched; on capture photoUri stored; photo preview shown"

    - id: TC-MAD-008
      scenario: "Auth 401 redirects to login-signup"
      type: ViewModel
      priority: P0
      given: "session expired"
      when: "OnSubmit returns 401"
      then: "MemberAddError type=Auth; NavigateToLoginSignup emitted"
