sibling: data-flow
schema_version: "2.1.0"
feature_id: member-add

entries:
  - screen_id: memberAddScreen
    trigger: on_submit
    endpoints:
      - { api_id: create_client, transport: rest, method: post }
      - { api_id: assign_member_role, transport: rest, method: post }
      - { api_id: upload_photo, transport: rest, method: post }
    dtos:
      - { name: CreateMemberRequest, role: request, api_id: create_client }
      - { name: MemberRole, role: request, api_id: assign_member_role }
    auth_required: true
    cache:
      strategy: none
    offline_behavior:
      strategy: queue_for_sync
      queue_table: sync_queue
      operations:
        - CREATE_MEMBER
        - ASSIGN_MEMBER_ROLE
        - UPLOAD_MEMBER_PHOTO
    error_paths:
      - { error_code: "400", behavior: inline_error, message_key: error_validation }
      - { error_code: "400.phone_exists", behavior: inline_error, message_key: error_phone_exists }
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "404", behavior: snackbar, message_key: error_server }
      - { error_code: "500", behavior: snackbar, message_key: error_server }
      - { error_code: "network.offline", behavior: queue_offline, message_key: error_network }

  - screen_id: memberAddScreen
    trigger: on_mount
    endpoints: []
    dtos: []
    auth_required: true
    cache:
      strategy: none
    notes: "No data fetched on mount; groupId injected via nav_params"
    error_paths: []
