<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync Status — CommonPurse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --primary:#2E7D32;--primary-dark:#1B5E20;--primary-light:#4CAF50;
  --secondary:#FF8F00;--tertiary:#1565C0;
  --on-primary:#FFFFFF;--surface:#FAFAFA;--on-surface:#1A1C19;
  --error:#D32F2F;--primary-container:#A6F1A6;--secondary-container:#FFDDB3;
  --outline:#C8CAC4;--outline-variant:#E5E7E1;
  --surface-variant:#ECF3EC;--on-surface-variant:#43483E;
  font-family:'Noto Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;font-family:'Noto Sans',sans-serif;padding-top:56px}
body.embedded{background:transparent;display:block;min-height:unset;padding-top:0}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:200;background:#1e1e2e;border-bottom:1px solid #333;padding:8px 12px;display:flex;align-items:center;gap:8px;height:56px}
body.embedded #toolbar{display:none}
#toolbar .logo{font-size:13px;font-weight:700;color:#a6f1a6;margin-right:8px}
#toolbar select{background:#2a2a3e;color:#e0e0e0;border:1px solid #444;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
#toolbar button{background:#2E7D32;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
.tb-label{color:#888;font-size:11px}
#phone{width:390px;height:844px;background:var(--surface);border-radius:44px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.7)}
body.embedded #phone{width:100%;height:100vh;border-radius:0;box-shadow:none}
.screen-wrap{display:flex;flex-direction:column;height:100%}
.status-bar{height:44px;background:var(--primary);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
body.embedded .status-bar{display:none}
.status-bar .time{color:#fff;font-size:13px;font-weight:600}
.status-bar .icons{display:flex;gap:6px}
.status-bar .icons span{color:#fff;font-size:16px}
.app-bar{height:56px;background:var(--primary);display:flex;align-items:center;padding:0 4px;flex-shrink:0}
.app-bar .back-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:#fff}
.app-bar h1{flex:1;font-size:20px;font-weight:600;color:#fff}
.app-bar .action-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:#fff}
.scroll-content{flex:1;overflow-y:auto;background:var(--surface)}
.scroll-content::-webkit-scrollbar{display:none}
.bottom-nav{height:64px;background:#fff;border-top:1px solid var(--outline-variant);display:flex;align-items:center;justify-content:space-around;flex-shrink:0}
body.embedded .bottom-nav{display:none}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;cursor:pointer}
.nav-item.active .nav-icon-wrap{background:var(--primary-container)}
.nav-icon-wrap{border-radius:16px;padding:4px 8px;min-width:48px;display:flex;justify-content:center}
.nav-item .material-symbols-outlined{font-size:22px;color:var(--on-surface-variant)}
.nav-item.active .material-symbols-outlined{color:var(--primary)}
.nav-item span.label{font-size:10px;color:var(--on-surface-variant);font-weight:500}
.nav-item.active span.label{color:var(--primary);font-weight:700}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.shimmer{background:linear-gradient(90deg,#e8e8e8 25%,#f5f5f5 50%,#e8e8e8 75%);background-size:800px 100%;animation:shimmer 1.4s infinite}
.skel-line{height:16px;border-radius:8px;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes pulseRing{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.pulse-ring{position:absolute;border-radius:50%;animation:pulseRing 1.8s ease-out infinite}
/* Status card */
.status-hero{padding:20px 16px;text-align:center}
.status-icon-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;width:80px;height:80px;border-radius:50%;margin-bottom:12px}
.status-ring{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:50%}
/* Cards */
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:16px;margin:0 16px 12px}
.section-hdr{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--on-surface-variant);padding:12px 16px 6px}
/* Sync item row */
.sync-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--outline-variant)}
.sync-item:last-child{border-bottom:none}
.sync-item-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sync-type-chip{font-size:10px;font-weight:700;border-radius:8px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
/* Stats grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.stat-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat-card .stat-num{font-size:26px;font-weight:700;line-height:1}
.stat-card .stat-label{font-size:11px;color:#888;margin-top:4px}
/* Buttons */
.btn-primary{background:var(--primary);color:#fff;border:none;border-radius:100px;padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Noto Sans',sans-serif;width:100%;box-shadow:0 2px 8px rgba(46,125,50,.3);transition:background .2s}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);border-radius:100px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Noto Sans',sans-serif;width:100%}
.btn-row{padding:12px 16px 24px;display:flex;flex-direction:column;gap:10px}
.warn-chip{background:var(--secondary-container);border-radius:8px;padding:10px 14px;margin:0 16px 12px;display:flex;gap:8px;align-items:flex-start}
.warn-chip p{font-size:12px;color:#5D4037;line-height:1.5}
.progress-wrap{background:var(--outline-variant);border-radius:4px;height:8px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;border-radius:4px}
@keyframes progressSlide{from{width:0}to{width:65%}}
.progress-animated{animation:progressSlide 3s ease-out forwards}
</style>
</head>
<body>
<div id="toolbar">
  <span class="logo">CommonPurse</span>
  <span class="tb-label">Screen:</span>
  <span style="color:#a6f1a6;font-size:12px;font-weight:600">sync-status</span>
  <span class="tb-label" style="margin-left:8px">State:</span>
  <select id="stateSelect" onchange="switchState(this.value)">
    <option value="loading">loading</option>
    <option value="content_pending" selected>content_pending</option>
    <option value="content_synced">content_synced</option>
    <option value="content_failed">content_failed</option>
    <option value="syncing">syncing</option>
    <option value="offline">offline</option>
  </select>
  <button onclick="switchState(document.getElementById('stateSelect').value)">Reload</button>
</div>
<div id="phone">
  <div class="screen-wrap">
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <span class="material-symbols-outlined" style="font-size:16px">signal_cellular_alt</span>
        <span class="material-symbols-outlined" style="font-size:16px">wifi</span>
        <span class="material-symbols-outlined" style="font-size:16px">battery_full</span>
      </div>
    </div>
    <div class="app-bar">
      <div class="back-btn"><span class="material-symbols-outlined">arrow_back</span></div>
      <h1>Sync Status</h1>
      <div class="action-btn"><span class="material-symbols-outlined">more_vert</span></div>
    </div>
    <div class="scroll-content" id="mainContent"></div>
    <div class="bottom-nav">
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">home</span></div><span class="label">Home</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">group</span></div><span class="label">Group</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">savings</span></div><span class="label">Finance</span></div>
      <div class="nav-item active"><div class="nav-icon-wrap"><span class="material-symbols-outlined">sync</span></div><span class="label">Sync</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">settings</span></div><span class="label">Settings</span></div>
    </div>
  </div>
</div>
<script>
var EMBEDDED=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
if(EMBEDDED)document.body.classList.add('embedded');
function icon(n,s,c){return'<span class="material-symbols-outlined" style="font-size:'+(s||20)+'px'+(c?';color:'+c:'')+'">'+n+'</span>'}

var PENDING_ITEMS=[
  {id:'sync-001',type:'SAVINGS_DEPOSIT',label:'Savings deposit — Grace Mwangi',detail:'Week 24 contribution · KES 500',icon:'savings',iconBg:'#A6F1A6',iconColor:'#1B5E20',retries:0,size:'2.1 KB',createdAt:'2026-05-06 09:12'},
  {id:'sync-002',type:'SAVINGS_DEPOSIT',label:'Savings deposit — Mary Akinyi',detail:'Week 24 contribution · KES 500',icon:'savings',iconBg:'#BBDEFB',iconColor:'#0D47A1',retries:1,size:'2.1 KB',createdAt:'2026-05-06 09:14'},
  {id:'sync-003',type:'LOAN_REPAYMENT',label:'Loan repayment — Peter Otieno',detail:'Week 3 repayment · KES 1,458',icon:'credit_score',iconBg:'#FFDDB3',iconColor:'#E65100',retries:2,size:'3.4 KB',createdAt:'2026-05-06 09:18'}
];

var SYNCED_ITEMS=[
  {id:'sync-010',type:'MEETING_RECORD',label:'Meeting recorded — Week 24',detail:'Attendance: 5/5 members · 2026-05-06',icon:'event',iconBg:'#E1BEE7',iconColor:'#4A148C',syncedAt:'09:10 today'},
  {id:'sync-011',type:'SAVINGS_DEPOSIT',label:'Savings deposit — Amara Diallo',detail:'Week 24 contribution · KES 500',icon:'savings',iconBg:'#FFDDB3',iconColor:'#E65100',syncedAt:'09:08 today'},
  {id:'sync-012',type:'SAVINGS_DEPOSIT',label:'Savings deposit — Peter Otieno',detail:'Week 24 contribution · KES 500',icon:'savings',iconBg:'#F8BBD0',iconColor:'#880E4F',syncedAt:'09:06 today'},
  {id:'sync-013',type:'LOAN_APPLICATION',label:'Loan application submitted',detail:'Standard Loan · KES 15,000 · Jane Njoroge',icon:'request_page',iconBg:'#E8F5E9',iconColor:'#2E7D32',syncedAt:'Yesterday 16:30'}
];

var TYPE_COLORS={SAVINGS_DEPOSIT:{bg:'#E8F5E9',fg:'#2E7D32'},LOAN_REPAYMENT:{bg:'#FFF3E0',fg:'#E65100'},LOAN_APPLICATION:{bg:'#E3F2FD',fg:'#1565C0'},MEETING_RECORD:{bg:'#F3E5F5',fg:'#4A148C'}};

function pendingRow(item){
  var tc=TYPE_COLORS[item.type]||{bg:'#f5f5f5',fg:'#757575'};
  var h='<div class="sync-item">';
  h+='<div class="sync-item-icon" style="background:'+item.iconBg+'">'+icon(item.icon,20,item.iconColor)+'</div>';
  h+='<div style="flex:1">';
  h+='<div style="font-size:13px;font-weight:600;margin-bottom:2px">'+item.label+'</div>';
  h+='<div style="font-size:12px;color:#888;margin-bottom:4px">'+item.detail+'</div>';
  h+='<div style="display:flex;gap:8px;align-items:center">';
  h+='<span class="sync-type-chip" style="background:'+tc.bg+';color:'+tc.fg+'">'+item.type.replace(/_/g,' ')+'</span>';
  if(item.retries>0)h+='<span style="font-size:11px;color:var(--error)">'+icon('replay',12,'var(--error)')+' '+item.retries+' retr'+(item.retries===1?'y':'ies')+'</span>';
  h+='<span style="font-size:11px;color:#aaa">'+item.size+'</span>';
  h+='</div>';
  h+='</div>';
  h+='<div style="font-size:11px;color:#aaa;text-align:right;white-space:nowrap">';
  h+=item.createdAt.split(' ')[1]+'<br>';
  h+=icon('schedule',13,'#aaa');
  h+='</div>';
  h+='</div>';
  return h;
}

function syncedRow(item){
  var tc=TYPE_COLORS[item.type]||{bg:'#f5f5f5',fg:'#757575'};
  var h='<div class="sync-item">';
  h+='<div class="sync-item-icon" style="background:'+item.iconBg+'">'+icon(item.icon,20,item.iconColor)+'</div>';
  h+='<div style="flex:1">';
  h+='<div style="font-size:13px;font-weight:600;margin-bottom:2px">'+item.label+'</div>';
  h+='<div style="font-size:12px;color:#888;margin-bottom:4px">'+item.detail+'</div>';
  h+='<span class="sync-type-chip" style="background:'+tc.bg+';color:'+tc.fg+'">'+item.type.replace(/_/g,' ')+'</span>';
  h+='</div>';
  h+='<div style="text-align:right">';
  h+='<div>'+icon('check_circle',18,'var(--primary)')+'</div>';
  h+='<div style="font-size:11px;color:#aaa;white-space:nowrap">'+item.syncedAt+'</div>';
  h+='</div>';
  h+='</div>';
  return h;
}

function renderLoading(){
  var h='<div style="background:linear-gradient(135deg,#2E7D32,#1B5E20);padding:24px;text-align:center">';
  h+='<div class="shimmer" style="width:80px;height:80px;border-radius:50%;margin:0 auto 12px"></div>';
  h+='<div class="shimmer" style="width:60%;height:20px;border-radius:10px;margin:0 auto 8px"></div>';
  h+='<div class="shimmer" style="width:40%;height:14px;border-radius:8px;margin:0 auto"></div>';
  h+='</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 16px 0">';
  for(var i=0;i<4;i++)h+='<div class="shimmer" style="height:80px;border-radius:12px"></div>';
  h+='</div>';
  h+='<div style="margin:16px 16px 8px"><div class="skel-line shimmer" style="width:50%;height:12px"></div></div>';
  for(var j=0;j<3;j++)h+='<div class="shimmer" style="height:72px;margin:0 16px 8px;border-radius:12px"></div>';
  return h;
}

function renderPending(){
  var h='<div class="status-hero" style="background:linear-gradient(135deg,#FFF3E0,#FFE0B2)">';
  h+='<div class="status-icon-wrap" style="background:var(--secondary-container)">';
  h+='<div class="pulse-ring" style="background:rgba(255,143,0,.2)"></div>';
  h+=icon('pending',44,'var(--secondary)');
  h+='</div>';
  h+='<div style="font-size:18px;font-weight:700;color:#E65100">'+PENDING_ITEMS.length+' Pending</div>';
  h+='<div style="font-size:13px;color:#795548;margin-top:4px">Items waiting to sync to server</div>';
  h+='<div style="font-size:12px;color:#8D6E63;margin-top:4px">Last successful sync: Today 09:10</div>';
  h+='</div>';
  // Stats
  h+='<div class="stats-grid">';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--secondary)">'+PENDING_ITEMS.length+'</div><div class="stat-label">Items Pending</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--primary)">'+SYNCED_ITEMS.length+'</div><div class="stat-label">Synced Today</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--error)">1</div><div class="stat-label">Retries Needed</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--on-surface)">7.6</div><div class="stat-label">KB Queued</div></div>';
  h+='</div>';
  h+='<div class="warn-chip">';
  h+=icon('wifi',20,'var(--secondary)');
  h+='<p>You are connected but items haven\'t synced yet. This can happen if the server is temporarily unavailable. Tap <strong>Sync Now</strong> to retry immediately.</p>';
  h+='</div>';
  h+='<div class="section-hdr">Pending Items ('+PENDING_ITEMS.length+')</div>';
  h+='<div class="card">';
  PENDING_ITEMS.forEach(function(item){h+=pendingRow(item);});
  h+='</div>';
  h+='<div class="section-hdr">Recently Synced</div>';
  h+='<div class="card">';
  SYNCED_ITEMS.slice(0,3).forEach(function(item){h+=syncedRow(item);});
  h+='</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-primary" onclick="switchState(\'syncing\')">'+icon('sync',18)+'&nbsp;Sync Now</button>';
  h+='<button class="btn-outline" onclick="alert(\'Show full history\')">'+icon('history',16)+'&nbsp;View Sync History</button>';
  h+='</div>';
  return h;
}

function renderSynced(){
  var h='<div class="status-hero" style="background:linear-gradient(135deg,#E8F5E9,#C8E6C9)">';
  h+='<div class="status-icon-wrap" style="background:var(--primary-container)">';
  h+=icon('cloud_done',44,'var(--primary)');
  h+='</div>';
  h+='<div style="font-size:18px;font-weight:700;color:var(--primary-dark)">All Synced</div>';
  h+='<div style="font-size:13px;color:#558B2F;margin-top:4px">Everything is up to date</div>';
  h+='<div style="font-size:12px;color:#8D9B83;margin-top:4px">Last sync: Today at 09:41</div>';
  h+='</div>';
  h+='<div class="stats-grid">';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--primary)">0</div><div class="stat-label">Items Pending</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--primary)">'+SYNCED_ITEMS.length+'</div><div class="stat-label">Synced Today</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--primary)">0</div><div class="stat-label">Failed</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--on-surface)">24h</div><div class="stat-label">Since Last Error</div></div>';
  h+='</div>';
  h+='<div style="background:var(--primary-container);border-radius:8px;padding:10px 14px;margin:0 16px 12px;display:flex;gap:8px;align-items:center">';
  h+=icon('verified',20,'var(--primary)');
  h+='<p style="font-size:12px;color:var(--primary-dark)">Mwangaza Women\'s Group data is fully synchronized. All transactions, meetings, and member records are current.</p>';
  h+='</div>';
  h+='<div class="section-hdr">Recent Activity</div>';
  h+='<div class="card">';
  SYNCED_ITEMS.forEach(function(item){h+=syncedRow(item);});
  h+='</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-outline" onclick="switchState(\'content_pending\')">'+icon('sync',16)+'&nbsp;Refresh</button>';
  h+='</div>';
  return h;
}

function renderFailed(){
  var h='<div class="status-hero" style="background:linear-gradient(135deg,#FFEBEE,#FFCDD2)">';
  h+='<div class="status-icon-wrap" style="background:#FFCDD2">';
  h+=icon('sync_problem',44,'var(--error)');
  h+='</div>';
  h+='<div style="font-size:18px;font-weight:700;color:var(--error)">Sync Failed</div>';
  h+='<div style="font-size:13px;color:#C62828;margin-top:4px">'+PENDING_ITEMS.length+' items could not be synced</div>';
  h+='<div style="font-size:12px;color:#EF9A9A;margin-top:4px">Last attempt: Today 09:38 — Server timeout</div>';
  h+='</div>';
  h+='<div class="stats-grid">';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--error)">'+PENDING_ITEMS.length+'</div><div class="stat-label">Failed</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--secondary)">3</div><div class="stat-label">Total Retries</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--tertiary)">7.6</div><div class="stat-label">KB Blocked</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--on-surface)">29m</div><div class="stat-label">Since Last Sync</div></div>';
  h+='</div>';
  h+='<div style="background:#FFEBEE;border-radius:8px;padding:10px 14px;margin:0 16px 12px;display:flex;gap:8px;border-left:4px solid var(--error)">';
  h+=icon('error_outline',20,'var(--error)');
  h+='<p style="font-size:12px;color:#C62828;line-height:1.5">Error: Server connection timed out after 30 seconds. Your data is safely stored locally and will sync automatically when the server is available. No data has been lost.</p>';
  h+='</div>';
  h+='<div class="section-hdr">Failed Items</div>';
  h+='<div class="card">';
  PENDING_ITEMS.forEach(function(item){h+=pendingRow(item);});
  h+='</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-primary" onclick="switchState(\'syncing\')">'+icon('refresh',18)+'&nbsp;Retry Sync</button>';
  h+='<button class="btn-outline" onclick="alert(\'Contact support\')">'+icon('support',16)+'&nbsp;Contact Support</button>';
  h+='</div>';
  return h;
}

function renderSyncing(){
  var pct=65;
  var h='<div class="status-hero" style="background:linear-gradient(135deg,#E3F2FD,#BBDEFB)">';
  h+='<div class="status-icon-wrap" style="background:#BBDEFB">';
  h+='<span class="material-symbols-outlined spin" style="font-size:44px;color:var(--tertiary)">sync</span>';
  h+='</div>';
  h+='<div style="font-size:18px;font-weight:700;color:var(--tertiary)">Syncing…</div>';
  h+='<div style="font-size:13px;color:#1565C0;margin-top:4px">Uploading '+PENDING_ITEMS.length+' items to server</div>';
  h+='</div>';
  h+='<div style="margin:16px 16px 0">';
  h+='<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="font-weight:600">Progress</span><span style="color:var(--tertiary);font-weight:700">'+pct+'%</span></div>';
  h+='<div class="progress-wrap"><div class="progress-fill progress-animated" style="width:'+pct+'%;background:var(--tertiary)"></div></div>';
  h+='<div style="font-size:12px;color:#888;margin-top:6px">Processing: Savings deposit — Mary Akinyi</div>';
  h+='</div>';
  h+='<div class="section-hdr">Upload Queue</div>';
  h+='<div class="card">';
  var syncStates=['DONE','IN_PROGRESS','PENDING'];
  PENDING_ITEMS.forEach(function(item,i){
    var st=syncStates[i]||'PENDING';
    var stIcon={DONE:'check_circle',IN_PROGRESS:'sync',PENDING:'radio_button_unchecked'};
    var stColor={DONE:'var(--primary)',IN_PROGRESS:'var(--tertiary)',PENDING:'#aaa'};
    var h2='<div class="sync-item">';
    h2+='<div class="sync-item-icon" style="background:'+item.iconBg+'">'+icon(item.icon,20,item.iconColor)+'</div>';
    h2+='<div style="flex:1"><div style="font-size:13px;font-weight:600">'+item.label+'</div>';
    h2+='<div style="font-size:12px;color:#888">'+item.detail+'</div></div>';
    var spinClass=st==='IN_PROGRESS'?' spin':'';
    h2+='<div>'+icon(stIcon[st],22,''+stColor[st],spinClass)+'</div>';
    h2+='</div>';
    h+=h2;
  });
  h+='</div>';
  h+='<div style="padding:12px 16px 24px">';
  h+='<button class="btn-outline" style="border-color:#aaa;color:#aaa;cursor:not-allowed" disabled>'+icon('cancel',16)+'&nbsp;Cancel (syncing in progress)</button>';
  h+='</div>';
  // auto-transition to synced after demo
  h+='<script>setTimeout(function(){switchState("content_synced")},3500);<\/script>';
  return h;
}

function renderOffline(){
  var h='<div class="status-hero" style="background:linear-gradient(135deg,#ECEFF1,#CFD8DC)">';
  h+='<div class="status-icon-wrap" style="background:#CFD8DC">';
  h+=icon('wifi_off',44,'#607D8B');
  h+='</div>';
  h+='<div style="font-size:18px;font-weight:700;color:#455A64">Offline</div>';
  h+='<div style="font-size:13px;color:#607D8B;margin-top:4px">No internet connection</div>';
  h+='<div style="font-size:12px;color:#90A4AE;margin-top:4px">All changes saved locally</div>';
  h+='</div>';
  h+='<div style="background:#E8EAF6;border-radius:8px;padding:10px 14px;margin:16px 16px 0;display:flex;gap:8px;border-left:4px solid var(--tertiary)">';
  h+=icon('offline_bolt',20,'var(--tertiary)');
  h+='<p style="font-size:12px;color:#1A237E;line-height:1.5">CommonPurse works fully offline. You can continue recording meetings, deposits, and loans. All changes will sync automatically when connectivity is restored.</p>';
  h+='</div>';
  h+='<div class="stats-grid" style="margin-top:16px">';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--secondary)">'+PENDING_ITEMS.length+'</div><div class="stat-label">Awaiting Sync</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:#607D8B">N/A</div><div class="stat-label">Last Sync</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--on-surface)">24h</div><div class="stat-label">Offline Duration</div></div>';
  h+='<div class="stat-card"><div class="stat-num" style="color:var(--primary)">100%</div><div class="stat-label">Local Available</div></div>';
  h+='</div>';
  h+='<div class="section-hdr">Queued for Sync</div>';
  h+='<div class="card">';
  PENDING_ITEMS.forEach(function(item){h+=pendingRow(item);});
  h+='</div>';
  h+='<div class="btn-row">';
  h+='<button class="btn-outline" onclick="switchState(\'content_pending\')">'+icon('wifi',16)+'&nbsp;Check Connection</button>';
  h+='</div>';
  return h;
}

var STATES={
  loading:renderLoading,
  content_pending:renderPending,
  content_synced:renderSynced,
  content_failed:renderFailed,
  syncing:renderSyncing,
  offline:renderOffline
};
var currentState='content_pending';

function switchState(s){
  if(!STATES[s])return;
  currentState=s;
  document.getElementById('stateSelect').value=s;
  document.getElementById('mainContent').innerHTML=STATES[s]();
  notifyParent();
}
function notifyParent(){
  if(!EMBEDDED)return;
  window.parent.postMessage({type:'screenLoaded',screenId:'sync-status',state:currentState,
    inspectorData:{screen:'sync-status',title:'Sync Status',state:currentState,
      components:['StatusHero','StatsGrid','PendingItemsList','SyncedItemsList','ActionButtons'],
      data:{pending:PENDING_ITEMS.length,synced:SYNCED_ITEMS.length,group:'Mwangaza Women\'s Group'}}},'*');
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='switchState')switchState(e.data.state);
  if(e.data&&e.data.type==='getInspectorData')notifyParent();
});
switchState('content_pending');
</script>
</body>
</html>
