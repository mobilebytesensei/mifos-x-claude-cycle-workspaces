sibling: flow
schema_version: "4.0"
feature_id: sync-status

navigates_to: []

flow_logic:
  on_load:
    - action: observe_sync_queue
      source: local_db
      description: >
        Subscribe to SyncQueue table via SQLDelight Flow.
        Compute pendingCount, failedCount, pendingByType, failedOperations, conflictCount.
        Compute overallStatus:
          SYNCED if pendingCount == 0 && failedCount == 0
          PENDING if pendingCount > 0
          FAILED if failedCount > 0
    - action: observe_network
      source: NetworkMonitor
    - action: load_last_sync_timestamp
      source: local_db
      description: Read last_synced_at from local settings table

  on_sync_now:
    - guard: "isOnline"
      on_fail: show_snackbar("Offline — Connect to sync")
    - api_call: batch_sync
      on_success:
        - action: update_status_from_result
        - action: update_last_sync_timestamp
      on_error:
        - action: show_snackbar
          message: "{{i18n.error_sync_failed}}"

  on_retry_operation:
    - action: retry_single_item
      api: batch_sync
      params: { itemId: "{{params.itemId}}" }
      on_success:
        - action: mark_item_synced
      on_error:
        - action: show_snackbar
          message: "Retry failed. Item remains in failed queue."

  on_refresh:
    - action: observe_sync_queue
      source: local_db
