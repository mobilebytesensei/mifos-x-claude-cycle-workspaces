sibling: docs
schema_version: "4.0"
feature_id: sync-status
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_offline_cache

identity:
  name: Sync Status
  description: >
    Offline sync dashboard showing the current synchronisation state for both admin and
    member client types. Reads exclusively from the local SQLDelight SyncQueue table — no
    network call is made on load. Displays an overall status indicator (green/amber/red),
    pending and failed operation counts by entity type, the last successful sync timestamp,
    a manual Sync Now button (disabled when offline), a failed-operations list with per-item
    retry, and a conflict counter. Terminal screen — navigates nowhere.
  archetype: dashboard

lifecycle:
  status: designed
  quality_score: 86
  tags:
    - sync
    - offline-first
    - both
    - FR-008
  status_history:
    - status: draft
      date: "2026-05-05"
      author: system
    - status: enriched
      date: "2026-05-05"
      author: system
    - status: designed
      at: "2026-05-08T23:00:00Z"
      by: /idea export

feature_context:
  feature: offline-sync
  flow: offline-sync-flow

navigation:
  route: /sync-status
  bottom_nav:
    visible: true
    selected_tab: sync
  entry_points:
    - source: bottom_nav
      label: Sync
    - source: sync_indicator_tap
      condition: pending_or_failed_ops_exist

legacy_metadata:
  analytics:
    screen_view: sync_status_viewed
    events:
      - trigger: sync now tapped
        name: sync_now_triggered
        params: { pending_count: Int }
      - trigger: retry operation tapped
        name: sync_retry_operation
        params: { entity_type: String, operation: String }
      - trigger: sync completed
        name: sync_completed
        params: { success_count: Int, fail_count: Int }
      - trigger: conflict detected
        name: sync_conflict_detected
        params: { conflict_count: Int }
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/offline-sync/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/offline-sync/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/offline-sync/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/offline-sync/"
