<!DOCTYPE html>
<html lang="en" data-feature="sync-status" data-state="error" data-aesthetic="minimalist-ui">
<!-- re-rendered 2026-08-01 (ui.yaml entry_points now personal-dashboard overflow menu — screen internals unchanged) -->
<head><meta charset="UTF-8"><title>sync-status · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <h1>Sync Status</h1>
  </header>

  <main>
    <!-- overall_status_card — FAILED treatment (local DB read error) -->
    <div class="alert alert-danger" style="flex-direction:column;align-items:center;text-align:center;gap:var(--space-xs);padding:var(--space-lg);">
      <div aria-hidden="true" style="font-size:44px;line-height:1;color:var(--danger);">☁</div>
      <h3 style="font-size:20px;color:var(--danger);">Sync Failed</h3>
      <p>Could not read sync queue from local database.</p>
      <button class="btn btn-primary btn-full" data-state-to="loading" style="margin-top:var(--space-sm);">⟳ Try Again</button>
    </div>
  </main>

  <!-- bottom_nav (dashboard shell) — Sync active -->
  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-item" data-nav-to="personal-dashboard"><span class="nav-icon">⌂</span>Home</button>
    <button class="nav-item" data-nav-to="personal-savings"><span class="nav-icon">⌬</span>Savings</button>
    <button class="nav-item" data-nav-to="personal-loans"><span class="nav-icon">⊜</span>Loans</button>
    <button class="nav-item active" aria-current="page"><span class="nav-icon">⟳</span>Sync</button>
  </nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
