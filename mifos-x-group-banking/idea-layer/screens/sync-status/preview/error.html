<!DOCTYPE html>
<html lang="en" data-feature="sync-status" data-state="error" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>sync-status · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  main { padding: var(--space-base) var(--space-base) 80px; }

  /* Failed overall status card (DB read error) */
  .status-card { border-radius: var(--radius-base); padding: var(--space-lg); margin-bottom: var(--space-base); display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-sm); background: #FFCDD2; border: 1px solid #EF9A9A; }
  .status-card .status-icon { font-size: 44px; line-height: 1; color: #B71C1C; }
  .status-card .status-label { font-size: 20px; font-weight: 700; color: #B71C1C; }
  .status-card .status-sub { font-size: 13px; color: #7F1D1D; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1>Sync Status</h1>
  </header>
  <main>
    <!-- Overall status card in failed treatment (local DB read error) -->
    <div class="status-card">
      <div class="status-icon" aria-hidden="true">☁</div>
      <div class="status-label">Sync Failed</div>
      <div class="status-sub">Could not read sync queue from local database.</div>
    </div>

    <div class="empty-state">
      <div class="illus">⚠️</div>
      <h2>Couldn't read the sync queue</h2>
      <p>Something went wrong reading your offline data. Try again.</p>
      <button class="btn btn-primary btn-full" data-state-to="loading">Try Again</button>
    </div>
  </main>
  <nav class="bottom-nav">
    <button class="nav-item" data-nav-to="personal-dashboard"><span class="nav-icon">⌂</span>Home</button>
    <button class="nav-item" data-nav-to="personal-savings"><span class="nav-icon">⌬</span>Savings</button>
    <button class="nav-item" data-nav-to="personal-loans"><span class="nav-icon">⊜</span>Loans</button>
    <button class="nav-item active"><span class="nav-icon">⟳</span>Sync</button>
  </nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
