<!DOCTYPE html>
<html lang="en" data-feature="sync-status" data-state="loading" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>sync-status · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  main { padding: var(--space-base) var(--space-base) 80px; }

  /* Shimmer primitive */
  .shimmer { background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--radius-sm); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* Status-card skeleton */
  .skeleton-status-card { border-radius: var(--radius-base); padding: var(--space-lg); margin-bottom: var(--space-base); display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); background: var(--bg-muted); border: 1px solid var(--border-subtle); }

  /* Breakdown-card skeleton */
  .skeleton-card { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-base); margin-bottom: var(--space-base); }
  .skeleton-row { display: flex; align-items: center; justify-content: space-between; padding: var(--space-sm) 0; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1>Sync Status</h1>
  </header>
  <main>
    <!-- Skeleton 1: overall status card -->
    <div class="skeleton-status-card">
      <div class="shimmer" style="width:44px;height:44px;border-radius:50%;margin-bottom:var(--space-xs);"></div>
      <div class="shimmer" style="width:45%;height:20px;"></div>
      <div class="shimmer" style="width:60%;height:12px;"></div>
    </div>

    <!-- Skeleton 2: pending breakdown card -->
    <div class="skeleton-card">
      <div class="shimmer" style="width:55%;height:14px;margin-bottom:var(--space-base);"></div>
      <div class="skeleton-row">
        <div class="shimmer" style="width:45%;height:14px;"></div>
        <div class="shimmer" style="width:24px;height:24px;border-radius:50%;"></div>
      </div>
      <div class="skeleton-row">
        <div class="shimmer" style="width:50%;height:14px;"></div>
        <div class="shimmer" style="width:24px;height:24px;border-radius:50%;"></div>
      </div>
    </div>

    <!-- Skeleton 3: Sync Now button -->
    <div class="shimmer" style="width:100%;height:56px;border-radius:var(--radius-lg);"></div>
  </main>
  <nav class="bottom-nav">
    <button class="nav-item" data-nav-to="personal-dashboard"><span class="nav-icon">⌂</span>Home</button>
    <button class="nav-item" data-nav-to="personal-savings"><span class="nav-icon">⌬</span>Savings</button>
    <button class="nav-item" data-nav-to="personal-loans"><span class="nav-icon">⊜</span>Loans</button>
    <button class="nav-item active"><span class="nav-icon">⟳</span>Sync</button>
  </nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
