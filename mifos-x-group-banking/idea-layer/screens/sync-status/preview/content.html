<!DOCTYPE html>
<html lang="en" data-feature="sync-status" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>sync-status · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  main { padding: var(--space-base) var(--space-base) 80px; }

  /* Overall status card — color-coded by overallStatus */
  .status-card { border-radius: var(--radius-base); padding: var(--space-lg); margin-bottom: var(--space-base); display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-sm); border: 1px solid transparent; }
  .status-card.pending { background: #FFF9C4; border-color: #FFE082; }
  .status-card.synced  { background: #C8E6C9; border-color: #A5D6A7; }
  .status-card.failed  { background: #FFCDD2; border-color: #EF9A9A; }
  .status-card .status-icon { font-size: 44px; line-height: 1; }
  .status-card.pending .status-icon { color: #E65100; }
  .status-card.synced  .status-icon { color: #2E7D32; }
  .status-card.failed  .status-icon { color: #B71C1C; }
  .status-card .status-label { font-size: 20px; font-weight: 700; }
  .status-card.pending .status-label { color: #E65100; }
  .status-card.synced  .status-label { color: #1B5E20; }
  .status-card.failed  .status-label { color: #B71C1C; }
  .status-card .last-sync { font-size: 12px; color: var(--text-secondary); }

  /* Conflict chip */
  .conflict-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px var(--space-md); border-radius: 9999px; background: #F3E5F5; color: #6A1B9A; font-size: 12px; font-weight: 500; margin-bottom: var(--space-base); }

  /* Pending breakdown */
  .breakdown-card { background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-base); margin-bottom: var(--space-base); }
  .breakdown-card .section-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-sm); }
  .breakdown-row { display: flex; align-items: center; justify-content: space-between; padding: var(--space-sm) 0; border-bottom: 1px solid var(--border-subtle); }
  .breakdown-row:last-child { border-bottom: none; }
  .breakdown-row .entity { font-size: 14px; color: var(--text-primary); }
  .breakdown-row .badge { min-width: 24px; height: 24px; padding: 0 8px; border-radius: 9999px; background: var(--primary-100); color: var(--primary-900); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }

  /* Sync Now button — full width, filled */
  .sync-btn { width: 100%; min-height: 56px; border-radius: var(--radius-lg); font-size: 15px; font-weight: 600; }

  main > .footnote { text-align: center; }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <header class="top-app-bar">
    <h1>Sync Status</h1>
  </header>
  <main>
    <!-- Overall status card — PENDING (isOnline:true, pendingCount:3, failedCount:0) -->
    <div class="status-card pending">
      <div class="status-icon" aria-hidden="true">☁</div>
      <div class="status-label">Sync Pending</div>
      <div class="last-sync">Last synced: 5 May 2026, 08:30</div>
    </div>

    <!-- Pending breakdown by entity type -->
    <div class="breakdown-card">
      <div class="section-title">Pending Operations (3)</div>
      <div class="breakdown-row">
        <span class="entity">Meeting Records</span>
        <span class="badge">1</span>
      </div>
      <div class="breakdown-row">
        <span class="entity">Savings Transactions</span>
        <span class="badge">2</span>
      </div>
    </div>

    <!-- Sync Now — enabled (online) -->
    <button class="btn btn-primary sync-btn" data-action="OnSyncNow" aria-label="Sync now">⟳ Sync Now</button>

    <p class="footnote">CommonPurse is offline-first — your data is safe in the queue until you sync.</p>
  </main>
  <nav class="bottom-nav">
    <button class="nav-item" data-nav-to="personal-dashboard"><span class="nav-icon">⌂</span>Home</button>
    <button class="nav-item" data-nav-to="personal-savings"><span class="nav-icon">⌬</span>Savings</button>
    <button class="nav-item" data-nav-to="personal-loans"><span class="nav-icon">⊜</span>Loans</button>
    <button class="nav-item active"><span class="nav-icon">⟳</span>Sync</button>
  </nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
