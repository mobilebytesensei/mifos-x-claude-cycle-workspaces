<!DOCTYPE html>
<html lang="en" data-feature="sync-status" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>sync-status · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dashboard">
  <div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>

  <!-- top_bar -->
  <header class="top-app-bar">
    <h1>Sync Status</h1>
    <div class="top-app-bar-actions">
      <span class="sync-badge">● Online</span>
    </div>
  </header>

  <main>
    <!-- overall_status_card — PENDING (isOnline:true, pendingCount:3, failedCount:0) -->
    <div class="alert alert-warning" style="flex-direction:column;align-items:center;text-align:center;gap:var(--space-xs);padding:var(--space-lg);">
      <div aria-hidden="true" style="font-size:44px;line-height:1;color:var(--accent-700);">☁</div>
      <h3 style="font-size:20px;color:var(--accent-700);">Sync Pending</h3>
      <p style="color:var(--text-secondary);">Last synced: 5 May 2026, 08:30</p>
    </div>

    <!-- pending_breakdown_card — pendingByType (Meeting Records ×1, Savings Transactions ×2) -->
    <div class="card">
      <h3>Pending Operations (3)</h3>
      <div class="list">
        <div class="list-item">
          <div class="main"><div class="name">Meeting Records</div></div>
          <span class="chip-static success">1</span>
        </div>
        <div class="list-item">
          <div class="main"><div class="name">Savings Transactions</div></div>
          <span class="chip-static success">2</span>
        </div>
      </div>
    </div>

    <!-- sync_now_button — filled green, full width, enabled (online) -->
    <button class="btn btn-primary btn-full" data-action="OnSyncNow" aria-label="Sync now">⟳ Sync Now</button>

    <p class="footnote">CommonPurse is offline-first — your data is safe in the queue until you sync.</p>
  </main>

  <!-- bottom_nav (dashboard shell) — Sync active -->
  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-item" data-nav-to="personal-dashboard"><span class="nav-icon">⌂</span>Home</button>
    <button class="nav-item" data-nav-to="personal-savings"><span class="nav-icon">⌬</span>Savings</button>
    <button class="nav-item" data-nav-to="personal-loans"><span class="nav-icon">⊜</span>Loans</button>
    <button class="nav-item active" aria-current="page"><span class="nav-icon">⟳</span>Sync</button>
  </nav>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
