sibling: data-flow
schema_version: "2.1.0"
feature_id: sync-status

entries:
  - screen_id: syncStatusScreen
    trigger: on_mount
    description: Read SyncQueue from local SQLDelight DB — no network call
    endpoints: []
    dtos:
      - { name: SyncQueueItem, role: response, api_id: local_db }
      - { name: SyncQueueSummary, role: response, api_id: local_db }
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_sources:
      - { source: SyncQueueRepository, key: pending_operations, dto: SyncQueueItem }
      - { source: SyncQueueRepository, key: failed_operations, dto: SyncQueueItem }
      - { source: SyncQueueRepository, key: conflict_count, field: conflictCount }
      - { source: SyncManager, key: last_sync_at, field: lastSyncAt }
      - { source: NetworkMonitor, key: is_online, field: isOnline }
    error_paths:
      - { error_code: "local.db_read_failed", behavior: show_error_state, message_key: error_not_found }

  - screen_id: syncStatusScreen
    trigger: on_refresh
    description: Pull to refresh — re-reads local SyncQueue DB
    endpoints: []
    dtos:
      - { name: SyncQueueItem, role: response, api_id: local_db }
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_sources:
      - { source: SyncQueueRepository, key: all_operations, dto: SyncQueueItem }
    error_paths:
      - { error_code: "local.db_read_failed", behavior: show_snackbar, message_key: error_not_found }

  - screen_id: syncStatusScreen
    trigger: on_interact
    description: User taps Sync Now — triggers SyncManager to flush all pending operations online
    endpoints: []
    dtos:
      - { name: SyncQueueItem, role: request, api_id: sync_manager }
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_writes:
      - { target: SyncManager, key: trigger_sync, triggers: [OnSyncNow] }
    error_paths:
      - { error_code: "network.offline", behavior: show_snackbar, message_key: error_offline }
      - { error_code: "sync.conflict", behavior: show_dialog, message_key: error_sync_conflict }
      - { error_code: "401", behavior: navigate, nav_target: login }

  - screen_id: syncStatusScreen
    trigger: on_interact
    description: User taps Retry on individual failed operation
    endpoints: []
    dtos:
      - { name: SyncQueueItem, role: request, api_id: sync_manager }
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_writes:
      - { target: SyncManager, key: retry_operation, triggers: [OnRetryOperation], params: [itemId] }
    error_paths:
      - { error_code: "network.offline", behavior: show_snackbar, message_key: error_offline }
