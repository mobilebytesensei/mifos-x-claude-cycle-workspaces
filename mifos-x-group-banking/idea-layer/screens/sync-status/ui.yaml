requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: sync-status

route: /sync-status
entry_points:
  - source: personal-dashboard
    trigger: profile_overflow_menu_sync_status_selected   # profile/overflow menu on the authenticated member home
  - source: sync_indicator_tap
    condition: pending_or_failed_ops_exist
nav_params: {}

screens:
  - id: sync-status-screen
    name: SyncStatusScreen
    type: detail
    description: Read-only sync dashboard; terminal screen with no outbound navigation

state_model:
  SyncStatusViewModel:
    state:
      name: SyncStatusState
      fields:
        isOnline: { type: Boolean, default: "false" }
        pendingCount: { type: Int, default: "0" }
        failedCount: { type: Int, default: "0" }
        lastSyncAt: { type: "Instant?", default: "null" }
        isSyncing: { type: Boolean, default: "false" }
        pendingByType: { type: "Map<EntityType, Int>", default: "emptyMap()" }
        failedOperations: { type: "List<SyncQueueItem>", default: "emptyList()" }
        conflictCount: { type: Int, default: "0" }
        overallStatus: { type: SyncOverallStatus, default: "SyncOverallStatus.SYNCED" }
        isLoading: { type: Boolean, default: "true" }
    screen_state:
      name: SyncStatusScreenState
      members: [Loading, Content, Error]
    errors:
      name: SyncStatusError
      types:
        - { type: DbRead, retry: true, message_key: error_db }
        - { type: SyncFailed, retry: true, message_key: error_sync_failed }
    events:
      name: SyncStatusEvent
      members:
        - { name: ShowSnackbar, params: "message: String" }
        - { name: SyncCompleted }
    actions:
      name: SyncStatusAction
      members:
        - { name: OnSyncNow, trigger: "Tap Sync Now button" }
        - { name: OnRetryOperation, params: { itemId: Long }, trigger: "Tap retry on failed item" }
        - { name: OnRefresh, trigger: "Pull to refresh (re-reads local DB)" }
    di:
      - SyncQueueRepository
      - SyncManager
      - NetworkMonitor

business_logic:
  kind: processor
  description: "Drains the offline SyncQueue to Fineract on demand: reads pending SyncQueueItem rows from the local SQLDelight database, batches them into one Fineract /batches request, and applies the response to advance each item pending→in_progress→synced or failed. Online reachability comes from cmp-network-monitor; a Store5 MutableStore + Bookkeeper coordinate the drain so conflicts surface for review."
  library_refs:
    - cmp-network-monitor
  external_library_refs:
    - SQLDelight
    - Store5
    - "Fineract batch API"
  description_hash: "fc768525417de59d50c3039a5966cab08cacb890a7cf1b453c203b38cb1b6886"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_bar
    type: top-app-bar
    title: "{strings.screen_title}"
    accessibility_label: "{strings.a11y_top_bar}"
    style: { background: primary, text_color: onPrimary }

  - id: overall_status_card
    type: card
    style: { corner_radius: 16dp, padding: 20dp, elevation: 2dp }
    style_by_status:
      SYNCED: { background: "#C8E6C9" }
      PENDING: { background: "#FFF9C4" }
      FAILED: { background: "#FFCDD2" }
    content:
      - id: status_icon
        type: icon
        size: 48dp
        value: "{{overallStatus}}"
        accessibility_label: "{strings.a11y_status_icon}"
        style:
          SYNCED: { icon: cloud_done, color: "#2E7D32" }
          PENDING: { icon: cloud_sync, color: "#E65100" }
          FAILED: { icon: cloud_off, color: "#B71C1C" }
      - id: status_label
        type: text
        style: { text_style: titleLarge, font_weight: bold }
        style_by_status:
          SYNCED: { color: "#1B5E20" }
          PENDING: { color: "#E65100" }
          FAILED: { color: "#B71C1C" }
        value_by_status:
          SYNCED: "{strings.status_synced}"
          PENDING: "{strings.status_pending}"
          FAILED: "{strings.status_failed}"
      - id: last_sync_text
        type: text
        style: { text_style: bodySmall, color: onSurfaceVariant }
        value: "{strings.last_sync_label}"
        fallback_when_null: "{strings.never_synced}"

  - id: conflict_chip
    type: chip
    visible_when: "conflictCount > 0"
    label: "{strings.conflict_label}"
    accessibility_label: "{strings.a11y_conflict_chip}"
    style: { background: tertiaryContainer, text_color: onTertiaryContainer, corner_radius: 16dp }

  - id: pending_breakdown_card
    type: card
    visible_when: "pendingCount > 0"
    style: { background: surface, elevation: 2dp, corner_radius: 12dp, padding: 16dp }
    content:
      - { type: text, value: "{strings.pending_title}", style: { text_style: titleSmall, color: onSurface } }
      - id: entity_breakdown_rows
        type: list
        items_source: pendingByType
        item_template:
          type: list-item
          content:
            - { type: text, value: "{strings.entity_row_label}", style: { text_style: bodyMedium } }
            - type: badge
              value: "{{count}}"
              accessibility_label: "{strings.a11y_entity_count_badge}"
              style: { background: secondaryContainer, text_color: onSecondaryContainer }

  - id: sync_now_button
    type: button
    variant: filled
    label: "{strings.sync_now}"
    accessibility_label: "{strings.a11y_sync_now_button}"
    icon: sync
    enabled_when: "isOnline && !isSyncing"
    style: { background: primary, text_color: onPrimary, corner_radius: 24dp, min_touch_target: 56dp, full_width: true, loading_when: isSyncing }
    disabled_label_when: "!isOnline"
    disabled_label: "{strings.sync_now_offline}"
    on_click:
      action: OnSyncNow
      action_contract:
        effect: call_api
        library_refs:
          - cmp-network-monitor
        external_library_refs:
          - "Fineract batch API"
          - Store5
        description: "Flushes every pending SyncQueueItem to Fineract by POSTing the collected offline writes to the /batches endpoint; enabled only when cmp-network-monitor reports online. On success it advances queued rows to synced via the Store5 Bookkeeper and stamps last_synced_at; conflicts are surfaced for manual review."
        action_contract_hash: "d5ba67cd538e68c9bb3480edb8b5ef1283e269262f9918f6fdd5794569f534b9"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: failed_operations_section
    type: card
    visible_when: "failedCount > 0"
    style: { background: errorContainer, corner_radius: 12dp, padding: 16dp }
    content:
      - { type: text, value: "{strings.failed_title}", style: { text_style: titleSmall, color: onErrorContainer } }
      - id: failed_ops_list
        type: list
        items_source: failedOperations
        item_template:
          type: list-item
          style: { padding: "8dp 0dp" }
          content:
            - { type: text, value: "{strings.failed_item_title}", style: { text_style: bodyMedium, color: onErrorContainer } }
            - { type: text, value: "{strings.failed_item_error}", style: { text_style: bodySmall, color: onErrorContainer } }
            - id: retry_button
              type: button
              variant: outlined
              label: "{strings.retry}"
              accessibility_label: "{strings.a11y_retry_button}"
              style: { corner_radius: 16dp, min_touch_target: 40dp, border_color: onErrorContainer, text_color: onErrorContainer }
              on_click:
                action: OnRetryOperation
                params: { itemId: "{{item.id}}" }
                action_contract:
                  effect: call_api
                  library_refs:
                    - cmp-network-monitor
                  external_library_refs:
                    - "Fineract batch API"
                    - Store5
                  description: "Re-submits one previously failed SyncQueueItem (by itemId) to the Fineract /batches endpoint via the Store5 Bookkeeper drain; requires cmp-network-monitor online. On success the row moves failed→synced; on failure it stays in the failed queue with its error message intact."
                  action_contract_hash: "2632b46a8f182d7038674e2982378d38dc6b8d3e70d51a48b3901cb9ef4c28c9"
                  action_contract_author: "claude-via-idea-enrich"
                  action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: all_synced_empty
    type: empty-state
    icon: cloud_done
    title: "{strings.all_synced_title}"
    body: "{strings.all_synced_body}"
    visible_when: "pendingCount == 0 && failedCount == 0"

  - id: shimmer_status
    type: shimmer
    count: 3
    accessibility_label: "{strings.a11y_shimmer_status}"
    style: { height: 80dp, corner_radius: 12dp }

states:
  initial_state: loading
  loading:
    components: [top_bar, shimmer_status]
    description: "Reading SyncQueue from local SQLDelight DB"
  content:
    components: [top_bar, overall_status_card, conflict_chip, pending_breakdown_card, sync_now_button, failed_operations_section, all_synced_empty]
    description: "Dashboard showing full sync state; Sync Now button enabled only when online"
    demo_data:
      isOnline: true
      overallStatus: PENDING
      pendingCount: 3
      failedCount: 0
      conflictCount: 0
      lastSyncAt: "2026-05-05T08:30:00Z"
      pendingByType:
        MEETING: 1
        SAVINGS: 2
      failedOperations: []
  error:
    components: [top_bar, overall_status_card]
    description: "Local DB read error"

