sibling: tests
schema_version: "4.0"
feature_id: sync-status

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-SS-001
      scenario: "On mount — reads SyncQueue from local DB, shows PENDING status"
      type: ViewModel
      priority: P0
      given: "Local DB has 3 pending ops (1 MEETING, 2 SAVINGS), 1 FAILED ATTENDANCE op"
      when: "SyncStatusScreen enters composition"
      then: "overallStatus=PENDING, pendingCount=3, failedCount=1, pendingByType={MEETING:1, SAVINGS:2}"

    - id: TC-SS-002
      scenario: "SYNCED state — all_synced_empty shown when no pending or failed ops"
      type: Screen
      priority: P0
      given: "pendingCount=0, failedCount=0"
      when: "Content state rendered"
      then: "all_synced_empty visible, overall_status_card shows 'All Synced', SYNCED background color"

    - id: TC-SS-003
      scenario: "Overall status card color changes by status"
      type: Screen
      priority: P1
      given: "Three different status values"
      when: "Content state rendered for each"
      then: "SYNCED=background '#C8E6C9', PENDING='#FFF9C4', FAILED='#FFCDD2'"

    - id: TC-SS-004
      scenario: "Sync Now button disabled when offline"
      type: Screen
      priority: P0
      given: "isOnline=false"
      when: "Content state rendered"
      then: "sync_now_button disabled, disabled_label='Offline — Connect to sync'"

    - id: TC-SS-005
      scenario: "Sync Now button enabled when online and not syncing"
      type: Screen
      priority: P0
      given: "isOnline=true, isSyncing=false"
      when: "Content state rendered"
      then: "sync_now_button enabled, label='Sync Now'"

    - id: TC-SS-006
      scenario: "Sync Now tapped — isSyncing=true, button shows loading"
      type: ViewModel
      priority: P0
      given: "isOnline=true, isSyncing=false"
      when: "OnSyncNow action"
      then: "isSyncing=true, SyncManager.triggerSync() called, button loading_when=isSyncing triggered"

    - id: TC-SS-007
      scenario: "Sync completes — SyncCompleted event emitted, data refreshed from DB"
      type: ViewModel
      priority: P0
      given: "isSyncing=true"
      when: "SyncManager.triggerSync() completes successfully"
      then: "isSyncing=false, SyncCompleted event emitted, SyncQueue re-read from DB"

    - id: TC-SS-008
      scenario: "Failed operations section shown only when failedCount > 0"
      type: Screen
      priority: P0
      given: "failedCount=1, failedOperations=[ATTENDANCE op]"
      when: "Content state rendered"
      then: "failed_operations_section visible with errorContainer background, shows 'Failed Operations (1)'"

    - id: TC-SS-009
      scenario: "Retry individual failed operation"
      type: ViewModel
      priority: P1
      given: "failedOperations=[{id:4, entityType:ATTENDANCE, status:FAILED}]"
      when: "OnRetryOperation(itemId=4)"
      then: "SyncManager.retryOperation(4) called, item removed from failedOperations on success"

    - id: TC-SS-010
      scenario: "Conflict chip shown when conflictCount > 0"
      type: Screen
      priority: P1
      given: "conflictCount=2"
      when: "Content state rendered"
      then: "conflict_chip visible showing '2 conflict(s) detected — review before syncing'"

    - id: TC-SS-011
      scenario: "Pending breakdown card hidden when pendingCount=0"
      type: Screen
      priority: P1
      given: "pendingCount=0"
      when: "Content state rendered"
      then: "pending_breakdown_card visible_when='pendingCount > 0' evaluates false — not shown"

    - id: TC-SS-012
      scenario: "Pull to refresh re-reads local DB without network call"
      type: ViewModel
      priority: P1
      given: "Content state, no network change"
      when: "OnRefresh action"
      then: "SyncQueueRepository queried again, no HTTP calls made, data updated from local DB"

    - id: TC-SS-013
      scenario: "lastSyncAt displayed as relative time (timeAgo filter)"
      type: Screen
      priority: P2
      given: "lastSyncAt='2026-05-09T08:30:00Z', current time=08:45"
      when: "Content state rendered"
      then: "last_sync_text shows '15 minutes ago' (timeAgo applied)"

    - id: TC-SS-014
      scenario: "Never synced shown when lastSyncAt is null"
      type: Screen
      priority: P2
      given: "lastSyncAt=null"
      when: "Content state rendered"
      then: "last_sync_text shows fallback_when_null='Never synced'"
