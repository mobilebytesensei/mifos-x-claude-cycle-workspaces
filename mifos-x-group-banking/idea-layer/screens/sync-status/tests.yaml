sibling: tests
schema_version: "4.0"
feature_id: sync-status
generated_at: "2026-08-01T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SS-001
      scenario: "On mount, sync status loads pendingByType map from SyncRepository"
      type: ViewModel
      priority: P0
      given: "authenticated user; sync_queue has pending operations"
      when: "SyncStatusScreen enters composition"
      then: "SyncRepository.getSyncStatus called; pendingByType map populated; SyncStatusScreenState=Content"

    - id: TC-SS-002
      scenario: "pendingByType map shows count per operation type (LOAN, SAVINGS, MEETING)"
      type: Screen
      priority: P0
      given: "Content state; pendingByType={LOAN:2, SAVINGS:1, MEETING:0}"
      when: "PendingCountSection renders"
      then: "LOAN badge shows 2; SAVINGS badge shows 1; MEETING badge shows 0 (or hidden)"

    - id: TC-SS-003
      scenario: "failedOperations list renders with operation type, timestamp, and error message"
      type: Screen
      priority: P0
      given: "Content state; failedOperations=[{type:LOAN, ts:'2026-07-17T10:00', error:'Connection timeout'}]"
      when: "FailedOperationsList renders"
      then: "1 row: LOAN type, timestamp, 'Connection timeout' error detail"

    - id: TC-SS-004
      scenario: "conflictCount badge shows when merge conflicts detected"
      type: Screen
      priority: P1
      given: "Content state; conflictCount=2"
      when: "SyncStatusScreen renders"
      then: "Conflicts badge shows 2; amber color; Resolve Conflicts CTA visible"

    - id: TC-SS-005
      scenario: "conflictCount=0 hides conflicts section"
      type: Screen
      priority: P1
      given: "Content state; conflictCount=0"
      when: "SyncStatusScreen renders"
      then: "Conflicts section not rendered"

    - id: TC-SS-006
      scenario: "OnForceSyncNow triggers immediate sync of all pending operations"
      type: ViewModel
      priority: P0
      given: "pendingByType has items; network online"
      when: "OnForceSyncNow fires"
      then: "isSyncing=true; SyncRepository.forceSyncAll called; on complete pendingByType updated; isSyncing=false"

    - id: TC-SS-007
      scenario: "OnForceSyncNow blocked when offline"
      type: ViewModel
      priority: P1
      given: "cmp-network-monitor offline"
      when: "OnForceSyncNow fires"
      then: "ShowSnackbar('No network connection') emitted; isSyncing stays false"

    - id: TC-SS-008
      scenario: "OnRetryFailed retries all failedOperations"
      type: ViewModel
      priority: P1
      given: "failedOperations=[{id:3, type:SAVINGS}]; network online"
      when: "OnRetryFailed fires"
      then: "SyncRepository.retryFailed(ids=[3]) called; on success operation removed from failedOperations"

    - id: TC-SS-009
      scenario: "All cleared state shown when no pending or failed operations"
      type: Screen
      priority: P1
      given: "load success; pendingByType all 0; failedOperations.isEmpty(); conflictCount=0"
      when: "Content evaluation"
      then: "SyncStatusScreenState=AllSynced; green checkmark shown; 'All data synced' message"

    - id: TC-SS-010
      scenario: "Pull-to-refresh reloads sync status from SyncRepository"
      type: ViewModel
      priority: P1
      given: "Content state"
      when: "OnRefresh fires"
      then: "isRefreshing=true; SyncRepository.getSyncStatus re-called; counts updated; isRefreshing=false"
