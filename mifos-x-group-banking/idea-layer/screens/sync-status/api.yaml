sibling: api
schema_version: "4.0"
feature_id: sync-status

api:
  - id: batch_sync
    method: POST
    endpoint: "/fineract-provider/api/v1/batches"
    description: >
      Sends all pending SyncQueue items as a Fineract batch request.
      Used only when online and triggered manually (Sync Now) or by SyncManager background job.
    auth: BasicAuth
    body_ref: BatchSyncRequest
    response_ref: BatchSyncResponse
    errors:
      400: Batch validation error
      401: Unauthorized
      500: Server error

dtos:
  SyncQueueItem:
    id: Long
    entityType: EntityType
    operation: SyncOperation
    payloadJson: String
    status: SyncStatus
    createdAt: String
    retriedAt: "String?"
    errorMessage: "String?"

  EntityType:
    values: [MEETING, LOAN, SAVINGS, ATTENDANCE, SHARE_OUT, MEMBER]

  SyncOperation:
    values: [CREATE, UPDATE, DELETE]

  SyncStatus:
    values: [PENDING, IN_PROGRESS, SYNCED, FAILED]

  SyncOverallStatus:
    values: [SYNCED, PENDING, FAILED]

  SyncResult:
    successCount: Int
    failedCount: Int
    conflictCount: Int

  BatchSyncRequest:
    requests:
      type: array
      items:
        requestId: Int
        relativeUrl: String
        method: String
        body: "String (JSON)"

  BatchSyncResponse:
    type: array
    items:
      requestId: Int
      statusCode: Int
      body: String

dependencies:
  repositories:
    - name: SyncQueueRepository
      methods:
        - "observeSyncQueue(): Flow<List<SyncQueueItem>>"
        - "getPendingByType(): Flow<Map<EntityType, Int>>"
        - "getFailedOperations(): Flow<List<SyncQueueItem>>"
        - "getConflictCount(): Flow<Int>"
        - "retryItem(itemId: Long): Flow<Unit>"
    - name: SyncManager
      methods:
        - "triggerSync(): Flow<SyncResult>"
        - "getLastSyncAt(): Flow<Instant?>"
  services:
    - NetworkMonitor
  local_db:
    - table: sync_queue
      schema: "id, entity_type, operation, payload_json, status (pending/in_progress/synced/failed), created_at, retried_at"
    - table: app_settings
      columns: [last_synced_at]
