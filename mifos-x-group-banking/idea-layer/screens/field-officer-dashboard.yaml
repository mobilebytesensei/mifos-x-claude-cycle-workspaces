analytics:
  screen_viewed:
    event: field_officer_dashboard_viewed
    params:
      staff_id: Long
      user_role: String
  events:
    - name: field_officer_dashboard_loaded
      trigger: LoadDashboard action completes successfully (ScreenState → Content)
      params:
        group_count: Int
        total_members: Int
        total_savings: Double
        staff_id: Long
    - name: field_officer_filter_applied
      trigger: Any filter chip selection changes filteredGroups
      params:
        filter_type: "{ region | status | overdue_rate }"
        filter_value: String
        result_count: Int
    - name: field_officer_group_tapped
      trigger: User taps a group health card
      params:
        group_id: Long
        health_indicator: "{ GREEN | AMBER | RED }"
        overdue_rate: Double
        office_name: String
    - name: field_officer_export_requested
      trigger: User taps Export Report (canExport == true)
      params:
        group_count: Int
        staff_id: Long
    - name: field_officer_dashboard_refreshed
      trigger: Pull-to-refresh gesture completes
      params:
        group_count: Int
        staff_id: Long
