<!DOCTYPE html>
<html lang="en" data-feature="settings" data-state="content" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>settings · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar"><button class="back-btn" data-nav-to="personal-dashboard">‹</button><h1>Settings</h1></header>
<main>
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="avatar" style="width:48px;height:48px;font-size:16px;">WK</div>
      <div><div style="font-size:15px;font-weight:500;">Wanjiru Kamau</div><div style="font-size:12px;color:var(--text-secondary);">Treasurer · Mwangaza VSLA</div></div>
    </div>
  </div>
  <h3 style="font-size:12px;color:var(--text-secondary);margin:16px 8px 8px;text-transform:uppercase;letter-spacing:.04em;">Account</h3>
  <div class="list">
    <div class="list-item" data-action="change_pin"><div class="avatar">⚿</div><div class="main"><div class="name">Change PIN</div></div><div class="trail">›</div></div>
    <div class="list-item" data-action="biometric_toggle"><div class="avatar">⚲</div><div class="main"><div class="name">Fingerprint unlock</div><div class="meta">Enabled</div></div><div class="trail">●</div></div>
    <div class="list-item" data-action="language"><div class="avatar">⌖</div><div class="main"><div class="name">Language</div><div class="meta">English</div></div><div class="trail">›</div></div>
  </div>
  <h3 style="font-size:12px;color:var(--text-secondary);margin:16px 8px 8px;text-transform:uppercase;letter-spacing:.04em;">Sync</h3>
  <div class="list">
    <div class="list-item" data-nav-to="sync-status"><div class="avatar">⟳</div><div class="main"><div class="name">Sync status</div><div class="meta">8 events queued</div></div><div class="trail">›</div></div>
    <div class="list-item" data-action="data_usage"><div class="avatar">⌬</div><div class="main"><div class="name">Data usage</div><div class="meta">2.4 MB this month</div></div><div class="trail">›</div></div>
  </div>
  <h3 style="font-size:12px;color:var(--text-secondary);margin:16px 8px 8px;text-transform:uppercase;letter-spacing:.04em;">About</h3>
  <div class="list">
    <div class="list-item" data-action="help"><div class="avatar">?</div><div class="main"><div class="name">Help &amp; tutorials</div></div><div class="trail">›</div></div>
    <div class="list-item" data-action="about"><div class="avatar">ⓘ</div><div class="main"><div class="name">About CommonPurse</div><div class="meta">v0.4.1 · Mifos Fineract</div></div><div class="trail">›</div></div>
  </div>
  <div style="padding:24px 0;">
    <button class="btn btn-danger btn-full" data-action="logout" data-nav-to="settings-logout-dialog">Sign out</button>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
