<!doctype html>
<!-- render-hash: b4f0d8a6e3c1 -->
<html lang="en" data-feature="settings" data-state="logging_out" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>settings · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
<style>
  :root { --settings-fallback: 0; }
  [data-theme="dark"] { --bg-canvas: #1C1C1C; --bg-subtle: #121212; --bg-muted: #2A2A2A; --border-subtle: #333333; --border-default: #424242; --text-primary: #ECECEC; --text-secondary: #B0B0B0; }
  .logout-loading-btn { position: relative; min-height: 56px; width: 100%; border: 1px solid var(--danger); color: var(--danger); background: var(--bg-canvas); border-radius: var(--radius-md); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm); opacity: .7; cursor: progress; }
  .btn-spinner { width: 20px; height: 20px; border: 2px solid rgba(198,40,40,.25); border-top-color: var(--danger); border-radius: 50%; animation: spin .8s linear infinite; }
  .logout-scrim { position: absolute; inset: 0; background: rgba(255,255,255,.6); z-index: 90; }
  [data-theme="dark"] .logout-scrim { background: rgba(0,0,0,.5); }
</style>
</head>
<body>
<div class="app-shell" data-shell="dashboard">
<div class="status-bar"><span>9:41</span><span>●●● 5G ▮</span></div>
<header class="top-app-bar"><h1>Settings</h1></header>
<main style="position:relative;">
  <div class="logout-scrim" aria-hidden="true"></div>
  <div style="padding:24px 16px 32px;position:relative;z-index:95;">
    <button class="logout-loading-btn" disabled aria-busy="true" aria-label="Logging out, clearing session">
      <span class="btn-spinner" aria-hidden="true"></span>
      <span>Logging out…</span>
    </button>
    <p class="footnote" style="text-align:center;margin-top:12px;">Clearing your session…</p>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
