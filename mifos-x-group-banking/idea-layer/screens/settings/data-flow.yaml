sibling: data-flow
schema_version: "2.1.0"
feature_id: settings

entries:
  - screen_id: settingsScreen
    trigger: on_mount
    description: Load persisted settings from local DataStore — no network call required
    endpoints: []
    dtos:
      - { name: AppSettingsDto, role: response, api_id: local_datastore }
    auth_required: false
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 0
      key_template: "settings:local:{userId}"
    local_sources:
      - { source: DataStore, key: app_settings, dto: AppSettingsDto }
      - { source: BuildConfig, key: app_version, field: appVersion }
      - { source: BuildConfig, key: build_number, field: buildNumber }
      - { source: BiometricManager, key: is_biometric_available, field: isBiometricAvailable }
    error_paths:
      - { error_code: "local.read_failed", behavior: show_defaults, message_key: error_not_found }

  - screen_id: settingsScreen
    trigger: on_interact
    description: User changes language, theme, biometric toggle, or notifications toggle — writes to local DataStore
    endpoints: []
    dtos:
      - { name: AppSettingsDto, role: request, api_id: local_datastore }
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_writes:
      - { target: DataStore, key: app_settings, triggers: [OnLanguageSelected, OnThemeSelected, OnBiometricToggled, OnNotificationsToggled] }
    error_paths:
      - { error_code: "local.write_failed", behavior: show_snackbar, message_key: error_not_found }

  - screen_id: settingsScreen
    trigger: on_interact
    action: OnSubmitPinChange
    description: >
      User submits the PIN change from the dialog — the only network write on this screen.
      SettingsRepository.changePin PUTs to Fineract self/user/updatePassword (mapped as ChangePinRequest);
      on 200 the dialog closes with a success snackbar, on 400 an inline pinChangeError shows,
      on 401 the session is cleared and the app navigates to login.
    endpoints:
      - { api_id: change_pin, transport: rest, method: put }
    dtos:
      - { name: ChangePinRequest, role: request, api_id: change_pin }
      - { name: ChangePinResponse, role: response, api_id: change_pin }
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths:
      - { error_code: "400", behavior: show_inline_error, message_key: error_pin_change }
      - { error_code: "401", behavior: navigate, nav_target: login }
      - { error_code: "500", behavior: show_snackbar, message_key: error_server }

  - screen_id: settingsScreen
    trigger: on_interact
    action: OnLogoutTapped
    description: >
      User taps Logout — emits the ShowLogoutDialog one-shot event so the UI presents an in-screen
      confirmation dialog. No persistence or network call at this step. On confirmation the SessionManager
      clears the local session (token + cached credentials) and NavigateToLogin is emitted.
    endpoints: []
    dtos: []
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_writes:
      - { target: SessionManager, key: clear_session, triggers: [OnLogoutTapped], notes: "cleared only after dialog confirmation" }
    error_paths: []
    events_emitted:
      - { event: ShowLogoutDialog, on: OnLogoutTapped }
      - { event: NavigateToLogin, on: logout_confirmed }

last_generate:
  timestamp: "2026-08-01T00:00:01Z"
  generator: idea-data-flow
  framework_version: "2.86.0"
