sibling: data-flow
schema_version: "2.1.0"
feature_id: settings

entries:
  - screen_id: settingsScreen
    trigger: on_mount
    description: Load persisted settings from local DataStore — no network call required
    endpoints: []
    dtos:
      - { name: AppSettingsDto, role: response, api_id: local_datastore }
    auth_required: false
    cache:
      strategy: stale_while_revalidate
      ttl_seconds: 0
      key_template: "settings:local:{userId}"
    local_sources:
      - { source: DataStore, key: app_settings, dto: AppSettingsDto }
      - { source: BuildConfig, key: app_version, field: appVersion }
      - { source: BuildConfig, key: build_number, field: buildNumber }
      - { source: BiometricManager, key: is_biometric_available, field: isBiometricAvailable }
    error_paths:
      - { error_code: "local.read_failed", behavior: show_defaults, message_key: error_not_found }

  - screen_id: settingsScreen
    trigger: on_interact
    description: User changes language, theme, biometric toggle, or notifications toggle — writes to local DataStore
    endpoints: []
    dtos:
      - { name: AppSettingsDto, role: request, api_id: local_datastore }
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_writes:
      - { target: DataStore, key: app_settings, triggers: [OnLanguageSelected, OnThemeSelected, OnBiometricToggled, OnNotificationsToggled] }
    error_paths:
      - { error_code: "local.write_failed", behavior: show_snackbar, message_key: error_not_found }

  - screen_id: settingsScreen
    trigger: on_interact
    description: User submits PIN change — validates and updates via SettingsRepository
    endpoints: []
    dtos:
      - { name: PinChangeRequest, role: request, api_id: local_pin_store }
    auth_required: true
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_writes:
      - { target: EncryptedSharedPrefs, key: user_pin_hash, triggers: [OnSubmitPinChange] }
    error_paths:
      - { error_code: "pin.mismatch", behavior: show_inline_error, message_key: error_not_found }
      - { error_code: "401", behavior: navigate, nav_target: login }

  - screen_id: settingsScreen
    trigger: on_interact
    description: User taps Logout — shows settings-logout-dialog
    endpoints: []
    dtos: []
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    navigation:
      - { condition: "OnLogoutTapped", nav_target: settings-logout-dialog }
