sibling: tests
schema_version: "4.0"
feature_id: settings

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-ST-001
      scenario: "On mount — preferences loaded from multiplatform-settings with defaults"
      type: ViewModel
      priority: P0
      given: "multiplatform-settings has saved prefs for the signed-in member"
      when: "SettingsScreen enters composition"
      then: "selectedLanguage=ENGLISH, selectedTheme=SYSTEM, isBiometricEnabled=false, isNotificationsEnabled=true; screen_state=Content"

    - id: TC-ST-002
      scenario: "Language change to Kiswahili persisted and re-applied immediately"
      type: ViewModel
      priority: P0
      given: "selectedLanguage=ENGLISH"
      when: "OnLanguageSelected(SWAHILI) dispatched"
      then: "selectedLanguage=SWAHILI, persist_db write to multiplatform-settings, locale re-applied, UI re-rendered in Swahili (no network call)"

    - id: TC-ST-003
      scenario: "Language change to Français persisted"
      type: ViewModel
      priority: P1
      given: "selectedLanguage=ENGLISH"
      when: "OnLanguageSelected(FRENCH) dispatched"
      then: "selectedLanguage=FRENCH, multiplatform-settings key updated, French locale applied"

    - id: TC-ST-004
      scenario: "Language change to हिन्दी persisted"
      type: ViewModel
      priority: P1
      given: "selectedLanguage=ENGLISH"
      when: "OnLanguageSelected(HINDI) dispatched"
      then: "selectedLanguage=HINDI, multiplatform-settings key updated, Hindi locale applied"

    - id: TC-ST-005
      scenario: "Language radio group renders all four supported languages"
      type: Screen
      priority: P1
      given: "Content state"
      when: "Screen renders language_selector_group"
      then: "Four radio items visible: English, Kiswahili, Français, हिन्दी; selected item bound to selectedLanguage"

    - id: TC-ST-006
      scenario: "Theme change from System to Dark persisted"
      type: ViewModel
      priority: P1
      given: "selectedTheme=SYSTEM"
      when: "OnThemeSelected(DARK) dispatched"
      then: "selectedTheme=DARK, persist_db write to multiplatform-settings, Material theme re-applied immediately"

    - id: TC-ST-007
      scenario: "Biometric toggle disabled and shows unavailable text when hardware absent"
      type: Screen
      priority: P0
      given: "isBiometricAvailable=false"
      when: "Content state rendered"
      then: "biometric_toggle_row switch disabled, supporting text='Biometric hardware not available on this device'"

    - id: TC-ST-008
      scenario: "Biometric enable when available persists preference"
      type: ViewModel
      priority: P1
      given: "isBiometricAvailable=true, isBiometricEnabled=false"
      when: "OnBiometricToggled(enabled=true) dispatched"
      then: "isBiometricEnabled=true, persist_db write to multiplatform-settings"

    - id: TC-ST-009
      scenario: "Biometric toggle no-ops when hardware unavailable"
      type: ViewModel
      priority: P1
      given: "isBiometricAvailable=false"
      when: "biometric switch interaction attempted"
      then: "toggle disabled, no OnBiometricToggled dispatch, no multiplatform-settings write"

    - id: TC-ST-010
      scenario: "Notifications toggle persisted"
      type: ViewModel
      priority: P1
      given: "isNotificationsEnabled=true"
      when: "OnNotificationsToggled(enabled=false) dispatched"
      then: "isNotificationsEnabled=false, persist_db write to multiplatform-settings"

    - id: TC-ST-011
      scenario: "Change PIN dialog opens on row tap (pure state transition)"
      type: ViewModel
      priority: P0
      given: "Content state, isChangingPin=false"
      when: "OnChangePinTapped dispatched"
      then: "isChangingPin=true (transform_state, no persistence/network); screen_state=ChangingPin; change_pin_dialog visible"

    - id: TC-ST-012
      scenario: "PIN change success closes dialog and shows snackbar"
      type: ViewModel
      priority: P0
      given: "isChangingPin=true, currentPin='1234', newPin='5678', Fineract self/user/updatePassword returns 200"
      when: "OnSubmitPinChange(currentPin='1234', newPin='5678') dispatched"
      then: "call_api PUT via ktor-client succeeds; pinChangeSuccess=true, isChangingPin=false, ShowSnackbar success event emitted"

    - id: TC-ST-013
      scenario: "PIN change 400 shows inline error and keeps dialog open"
      type: ViewModel
      priority: P0
      given: "isChangingPin=true, wrong currentPin, updatePassword returns 400"
      when: "OnSubmitPinChange dispatched with wrong currentPin"
      then: "pinChangeError set (PinChangeFailed), pin_change_error_text visible, isChangingPin stays true"

    - id: TC-ST-014
      scenario: "PIN change 401 clears session and navigates to login"
      type: ViewModel
      priority: P0
      given: "isChangingPin=true, updatePassword returns 401"
      when: "OnSubmitPinChange dispatched"
      then: "SessionExpired surfaced, session cleared, NavigateToLogin event emitted"

    - id: TC-ST-015
      scenario: "PIN dialog cancel dismisses without changes"
      type: ViewModel
      priority: P1
      given: "isChangingPin=true, fields partially filled"
      when: "OnDismissPinDialog dispatched"
      then: "isChangingPin=false, pinChangeError=null, PIN input fields cleared, no multiplatform-settings/network write"

    - id: TC-ST-016
      scenario: "Logout button emits ShowLogoutDialog event"
      type: ViewModel
      priority: P0
      given: "Content state"
      when: "OnLogoutTapped dispatched"
      then: "ShowLogoutDialog one-shot event emitted (emit_event effect); no session clear until confirmation"

    - id: TC-ST-017
      scenario: "Logout button shows loading during session clear"
      type: Screen
      priority: P1
      given: "isLoggingOut=true"
      when: "logging_out state rendered"
      then: "logout_button shows loading (loading_when=isLoggingOut); top_bar visible"

    - id: TC-ST-018
      scenario: "App version row displays version and build from BuildConfig"
      type: Screen
      priority: P2
      given: "appVersion='1.0.0', buildNumber='42'"
      when: "Content state rendered"
      then: "app_version_row trailing shows '1.0.0 (42)'"

    - id: TC-ST-019
      scenario: "All settings sections render in Content state"
      type: Screen
      priority: P2
      given: "Content state"
      when: "Screen rendered"
      then: "Language, Appearance, Security, Notifications, About section headers all visible with their rows; logout_button at bottom"

    - id: TC-ST-020
      scenario: "SettingsRepository read/write round-trips through multiplatform-settings"
      type: Repository
      priority: P1
      given: "SettingsRepository backed by multiplatform-settings key-value store"
      when: "setLanguage(SWAHILI) then getLanguage() invoked"
      then: "getLanguage() returns SWAHILI durably from the key-value store, no network round-trip"
