sibling: tests
schema_version: "4.0"
feature_id: settings

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-ST-001
      scenario: "On mount — settings loaded from DataStore with correct default values"
      type: ViewModel
      priority: P0
      given: "DataStore has saved settings for userId=101"
      when: "SettingsScreen enters composition"
      then: "selectedLanguage=ENGLISH, selectedTheme=SYSTEM, isBiometricEnabled=false, isNotificationsEnabled=true"

    - id: TC-ST-002
      scenario: "Language change — persisted to DataStore immediately"
      type: ViewModel
      priority: P0
      given: "currentLanguage=ENGLISH"
      when: "OnLanguageSelected(SWAHILI)"
      then: "selectedLanguage=SWAHILI, DataStore.app_settings updated, UI re-rendered in Swahili"

    - id: TC-ST-003
      scenario: "Theme change — system default to dark persisted"
      type: ViewModel
      priority: P1
      given: "selectedTheme=SYSTEM"
      when: "OnThemeSelected(DARK)"
      then: "selectedTheme=DARK, persisted to DataStore, ShowSnackbar event emitted"

    - id: TC-ST-004
      scenario: "Biometric toggle disabled when hardware unavailable"
      type: Screen
      priority: P0
      given: "isBiometricAvailable=false"
      when: "Content state rendered"
      then: "biometric_toggle_row switch is disabled, supporting text shows unavailability message"

    - id: TC-ST-005
      scenario: "Biometric enable — toggling on when available saves preference"
      type: ViewModel
      priority: P1
      given: "isBiometricAvailable=true, isBiometricEnabled=false"
      when: "OnBiometricToggled(enabled=true)"
      then: "isBiometricEnabled=true, DataStore updated"

    - id: TC-ST-006
      scenario: "Change PIN dialog opens on row tap"
      type: Screen
      priority: P0
      given: "Content state"
      when: "OnChangePinTapped"
      then: "isChangingPin=true, change_pin_dialog visible, current_pin_field and new_pin_field shown"

    - id: TC-ST-007
      scenario: "PIN change success — dialog dismissed, snackbar shown"
      type: ViewModel
      priority: P0
      given: "isChangingPin=true, currentPin='1234', newPin='5678'"
      when: "OnSubmitPinChange(currentPin='1234', newPin='5678')"
      then: "pinChangeSuccess=true, isChangingPin=false, ShowSnackbar event emitted with success message"

    - id: TC-ST-008
      scenario: "PIN change failure — inline error shown, dialog stays open"
      type: ViewModel
      priority: P0
      given: "isChangingPin=true"
      when: "OnSubmitPinChange with wrong currentPin"
      then: "pinChangeError set, pin_change_error_text visible, isChangingPin=true (dialog stays)"

    - id: TC-ST-009
      scenario: "Logout button tap — emits ShowLogoutDialog event"
      type: ViewModel
      priority: P0
      given: "Content state"
      when: "OnLogoutTapped"
      then: "ShowLogoutDialog event emitted, settings-logout-dialog shown"

    - id: TC-ST-010
      scenario: "App version displayed correctly from BuildConfig"
      type: Screen
      priority: P2
      given: "appVersion='1.0.0', buildNumber='42'"
      when: "Content state rendered"
      then: "app_version_row trailing shows '1.0.0 (42)'"

    - id: TC-ST-011
      scenario: "Notifications toggle persisted"
      type: ViewModel
      priority: P1
      given: "isNotificationsEnabled=true"
      when: "OnNotificationsToggled(enabled=false)"
      then: "isNotificationsEnabled=false, DataStore updated"

    - id: TC-ST-012
      scenario: "PIN dialog cancel dismisses without changes"
      type: ViewModel
      priority: P1
      given: "isChangingPin=true"
      when: "OnDismissPinDialog"
      then: "isChangingPin=false, pinChangeError=null, no DataStore write"
