sibling: tests
schema_version: "4.0"
feature_id: settings
generated_at: "2026-08-01T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SET-001
      scenario: "On mount, current settings load from SettingsRepository"
      type: ViewModel
      priority: P0
      given: "authenticated user"
      when: "SettingsScreen enters composition"
      then: "SettingsRepository.getSettings called; language, theme, biometric, notifications values loaded; SettingsScreenState=Content"

    - id: TC-SET-002
      scenario: "Language selection persists via OnLanguageChange"
      type: ViewModel
      priority: P1
      given: "current language=ENGLISH"
      when: "OnLanguageChange(Language.SWAHILI) fires"
      then: "SettingsRepository.updateLanguage(SWAHILI) called; locale updated; UI language changes"

    - id: TC-SET-003
      scenario: "Theme toggle persists dark/light mode"
      type: ViewModel
      priority: P1
      given: "current theme=LIGHT"
      when: "OnThemeChange(Theme.DARK) fires"
      then: "SettingsRepository.updateTheme(DARK) called; app theme switches to dark; toggle updated"

    - id: TC-SET-004
      scenario: "Biometric toggle enables/disables biometric auth"
      type: ViewModel
      priority: P1
      given: "biometricEnabled=false; biometric hardware available"
      when: "OnBiometricToggle(true) fires"
      then: "SettingsRepository.setBiometricEnabled(true) called; biometricEnabled=true; toggle shows enabled"

    - id: TC-SET-005
      scenario: "Biometric toggle hidden when hardware not available"
      type: Screen
      priority: P1
      given: "biometricHardwareAvailable=false"
      when: "SettingsScreen renders"
      then: "biometric section not visible"

    - id: TC-SET-006
      scenario: "Notifications toggle persists push notification preference"
      type: ViewModel
      priority: P2
      given: "notificationsEnabled=true"
      when: "OnNotificationsToggle(false) fires"
      then: "SettingsRepository.setNotificationsEnabled(false) called; notificationsEnabled=false"

    - id: TC-SET-007
      scenario: "Change PIN row navigates to PIN change flow"
      type: Screen
      priority: P1
      given: "Content state"
      when: "OnChangePIN fires"
      then: "NavigateToPINChange emitted"

    - id: TC-SET-008
      scenario: "Logout row shows confirmation dialog before logging out"
      type: Screen
      priority: P0
      given: "Content state"
      when: "OnLogout fires"
      then: "ShowLogoutDialog event emitted; settings-logout-dialog opened"
