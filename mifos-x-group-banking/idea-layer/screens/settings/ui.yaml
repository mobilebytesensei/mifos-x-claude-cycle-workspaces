requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: settings

route: /settings
entry_points:
  - source: bottom_nav
    trigger: settings_tab_selected
nav_params: {}

screens:
  - id: settings-screen
    name: SettingsScreen
    type: settings
    description: Full-featured settings screen with language, theme, security, notifications, about, and logout sections

state_model:
  SettingsViewModel:
    state:
      name: SettingsState
      fields:
        selectedLanguage: { type: AppLanguage, default: "AppLanguage.ENGLISH" }
        selectedTheme: { type: AppTheme, default: "AppTheme.SYSTEM" }
        isBiometricEnabled: { type: Boolean, default: "false" }
        isNotificationsEnabled: { type: Boolean, default: "true" }
        isBiometricAvailable: { type: Boolean, default: "false" }
        appVersion: { type: String, default: '""' }
        buildNumber: { type: String, default: '""' }
        isChangingPin: { type: Boolean, default: "false" }
        pinChangeError: { type: "String?", default: "null" }
        pinChangeSuccess: { type: Boolean, default: "false" }
        isLoggingOut: { type: Boolean, default: "false" }
    screen_state:
      name: SettingsScreenState
      members: [Content, ChangingPin, LoggingOut]
    errors:
      PinChangeFailed: "PIN change failed. Check your current PIN and try again."
      SessionExpired: "Session expired. Please log in again."
    events:
      name: SettingsEvent
      members:
        - { name: ShowLogoutDialog }
        - { name: NavigateToLogin }
        - { name: ShowSnackbar, params: "message: String" }
    actions:
      name: SettingsAction
      members:
        - { name: OnLanguageSelected, params: { language: AppLanguage }, trigger: "Tap language radio" }
        - { name: OnThemeSelected, params: { theme: AppTheme }, trigger: "Tap theme radio" }
        - { name: OnBiometricToggled, params: { enabled: Boolean }, trigger: "Toggle biometric switch" }
        - { name: OnNotificationsToggled, params: { enabled: Boolean }, trigger: "Toggle notifications switch" }
        - { name: OnChangePinTapped, trigger: "Tap Change PIN row" }
        - { name: OnSubmitPinChange, params: { currentPin: String, newPin: String }, trigger: "Tap Update PIN in dialog" }
        - { name: OnDismissPinDialog, trigger: "Tap Cancel in PIN dialog" }
        - { name: OnLogoutTapped, trigger: "Tap Logout button" }
    di:
      - SettingsRepository
      - BiometricManager
      - NavigationManager
      - SessionManager

business_logic:
  kind: crud
  external_library_refs: [multiplatform-settings, ktor-client]
  description: "Read and write CommonPurse app preferences — language (English/Swahili/French/Hindi per FR-010), theme, biometric-unlock and notifications toggles — via multiplatform-settings key-value storage; PIN change is the only network write, hitting Fineract self/user/updatePassword through ktor-client."
  description_hash: "5e5fc6b6240f3bdd9cf05f362c6d56df9b68edb61774e5937c4e9a0c1a3a0456"
  description_author: "claude-via-idea-enrich"
  description_authored_at: "2026-07-17T00:00:00Z"

components:
  - id: top_bar
    type: top-app-bar
    title: "{strings.screen_title}"
    accessibility_label: "{strings.a11y_top_bar}"
    style: { background: surface }

  - id: language_section_header
    type: text
    value: "{strings.section_language}"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 4dp" }

  - id: language_selector_group
    type: radio-group
    accessibility_label: "{strings.a11y_language_group}"
    items:
      - { id: ENGLISH, label: "{strings.lang_english}", supporting: "{strings.lang_english}", icon: flag_gb, accessibility_label: "{strings.a11y_lang_english}" }
      - { id: SWAHILI, label: "{strings.lang_swahili}", supporting: "{strings.lang_swahili}", icon: flag_ke, accessibility_label: "{strings.a11y_lang_swahili}" }
      - { id: FRENCH, label: "{strings.lang_french}", supporting: "{strings.lang_french}", icon: flag_fr, accessibility_label: "{strings.a11y_lang_french}" }
      - { id: HINDI, label: "{strings.lang_hindi}", supporting: "{strings.lang_hindi}", icon: flag_in, accessibility_label: "{strings.a11y_lang_hindi}" }
    selected: "{{selectedLanguage}}"
    style: { min_touch_target: 48dp }
    on_click:
      action: OnLanguageSelected
      params: { language: "{{selectedId}}" }
      action_contract:
        effect: persist_db
        external_library_refs: [multiplatform-settings]
        description: "Persist the chosen AppLanguage to local multiplatform-settings storage and re-apply the locale (English/Swahili/French/Hindi) across the app; no network call, effect is a durable key-value write."
        action_contract_hash: "03decb1766395642037527c3f132a2368dfc24105af730ff96e908c53df0346d"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: appearance_section_header
    type: text
    value: "{strings.section_appearance}"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 4dp" }

  - id: theme_selector_group
    type: radio-group
    accessibility_label: "{strings.a11y_theme_group}"
    items:
      - { id: LIGHT, label: "{strings.theme_light}", accessibility_label: "{strings.a11y_theme_light}" }
      - { id: DARK, label: "{strings.theme_dark}", accessibility_label: "{strings.a11y_theme_dark}" }
      - { id: SYSTEM, label: "{strings.theme_system}", accessibility_label: "{strings.a11y_theme_system}" }
    selected: "{{selectedTheme}}"
    style: { min_touch_target: 48dp }
    on_click:
      action: OnThemeSelected
      params: { theme: "{{selectedId}}" }
      action_contract:
        effect: persist_db
        external_library_refs: [multiplatform-settings]
        description: "Persist the chosen AppTheme (Light/Dark/System) to local multiplatform-settings storage and re-apply the Material theme immediately; a durable local key-value write, no network round-trip."
        action_contract_hash: "776a3bb7b1a91e9b9d7ccc86c5d35067026ddee995e81a8dcb4e809bf0eb1f5e"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: security_section_header
    type: text
    value: "{strings.section_security}"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 4dp" }

  - id: biometric_toggle_row
    type: list-item
    accessibility_label: "{strings.a11y_biometric_row}"
    style: { min_height: 56dp }
    content:
      headline: { type: text, value: "{strings.biometric_label}", style: { text_style: bodyLarge } }
      supporting:
        type: text
        value: "{{isBiometricAvailable ? '{strings.biometric_sublabel}' : '{strings.biometric_unavailable}'}}"
        style: { text_style: bodySmall, color: onSurfaceVariant }
      trailing:
        type: switch
        accessibility_label: "{strings.a11y_biometric_switch}"
        checked: "{{isBiometricEnabled}}"
        enabled: "{{isBiometricAvailable}}"
        on_change:
          action: OnBiometricToggled
          params: { enabled: "{{newValue}}" }
          action_contract:
            effect: persist_db
            external_library_refs: [multiplatform-settings]
            description: "Persist the biometric-unlock preference to local multiplatform-settings storage when hardware is available; if unavailable the toggle is disabled and no write occurs. Durable local key-value write only."
            action_contract_hash: "e27494302f401c8270649b34afd9960d21c61de20ff62459b36bd983e0d6f10b"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: change_pin_row
    type: list-item
    accessibility_label: "{strings.a11y_change_pin_row}"
    style: { min_height: 56dp }
    content:
      headline: { type: text, value: "{strings.change_pin_label}", style: { text_style: bodyLarge } }
      supporting: { type: text, value: "{strings.change_pin_sublabel}", style: { text_style: bodySmall, color: onSurfaceVariant } }
      trailing: { type: icon, icon: chevron_right_24_regular, tint: onSurfaceVariant, accessibility_label: "{strings.a11y_chevron_right}" }
    on_click:
      action: OnChangePinTapped
      action_contract:
        effect: transform_state
        description: "Open the Change PIN dialog by flipping isChangingPin to true in SettingsState; a pure ViewModel state transition with no persistence or network side-effect until the user submits."
        action_contract_hash: "4fff9a860d52a2e5caa6d041e0f9c8a12feea144ad693b32ca1ff226cdb82b30"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: notifications_section_header
    type: text
    value: "{strings.section_notifications}"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 4dp" }

  - id: notifications_toggle_row
    type: list-item
    accessibility_label: "{strings.a11y_notifications_row}"
    style: { min_height: 56dp }
    content:
      headline: { type: text, value: "{strings.notifications_label}", style: { text_style: bodyLarge } }
      supporting: { type: text, value: "{strings.notifications_sublabel}", style: { text_style: bodySmall, color: onSurfaceVariant } }
      trailing:
        type: switch
        accessibility_label: "{strings.a11y_notifications_switch}"
        checked: "{{isNotificationsEnabled}}"
        on_change:
          action: OnNotificationsToggled
          params: { enabled: "{{newValue}}" }
          action_contract:
            effect: persist_db
            external_library_refs: [multiplatform-settings]
            description: "Persist the push-notifications preference to local multiplatform-settings storage; controls alerts for meetings, repayments and sync events. A durable local key-value write with no network call."
            action_contract_hash: "f325078122e117a805795fb9f101ad7cbb3fc228a48e66e104757cab400de3b4"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: about_section_header
    type: text
    value: "{strings.section_about}"
    style: { text_style: labelLarge, color: primary, padding: "16dp 16dp 4dp" }

  - id: app_version_row
    type: list-item
    style: { min_height: 48dp }
    content:
      headline: { type: text, value: "{strings.version_label}", style: { text_style: bodyLarge } }
      trailing: { type: text, value: "{{appVersion}} ({{buildNumber}})", i18n: skip, style: { text_style: bodyMedium, color: onSurfaceVariant } }

  - id: logout_button
    type: button
    variant: outlined
    label: "{strings.logout_button}"
    accessibility_label: "{strings.a11y_logout_button}"
    style: { border_color: error, text_color: error, min_height: 56dp, full_width: true, margin: 16dp, loading_when: isLoggingOut }
    on_click:
      action: OnLogoutTapped
      action_contract:
        effect: emit_event
        description: "Emit the ShowLogoutDialog one-shot SettingsEvent so the UI presents the logout confirmation dialog; a fire-and-forget event with no persistence, the actual session clear happens after confirmation."
        action_contract_hash: "a6bd77a1f12e6b533405fc18c397580241f831024beadbacfb56c1fa7a3aa085"
        action_contract_author: "claude-via-idea-enrich"
        action_contract_authored_at: "2026-07-17T00:00:00Z"

  - id: change_pin_dialog
    type: dialog
    visible_when: isChangingPin
    title: "{strings.dialog_title}"
    accessibility_label: "{strings.a11y_change_pin_dialog}"
    content:
      - id: current_pin_field
        type: text-field
        label: "{strings.current_pin}"
        accessibility_label: "{strings.a11y_current_pin_field}"
        input_type: password
        keyboard: number
        style: { min_touch_target: 48dp }
      - id: new_pin_field
        type: text-field
        label: "{strings.new_pin}"
        accessibility_label: "{strings.a11y_new_pin_field}"
        input_type: password
        keyboard: number
        style: { min_touch_target: 48dp }
      - id: pin_change_error_text
        type: text
        value: "{{pinChangeError}}"
        i18n: skip
        visible_when: "pinChangeError != null"
        style: { text_style: bodySmall, color: error }
    actions:
      cancel:
        label: "{strings.dialog_cancel}"
        accessibility_label: "{strings.a11y_dialog_cancel}"
        on_click:
          action: OnDismissPinDialog
          action_contract:
            effect: transform_state
            description: "Dismiss the Change PIN dialog by setting isChangingPin false and clearing the PIN input fields in SettingsState; a pure ViewModel state transition, nothing is persisted or sent."
            action_contract_hash: "d712a0542187d7b411132cde1b9046b5e178eb6b0aacb1795a42232baa0eb3e3"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"
      confirm:
        label: "{strings.dialog_confirm}"
        accessibility_label: "{strings.a11y_dialog_confirm}"
        on_click:
          action: OnSubmitPinChange
          action_contract:
            effect: call_api
            external_library_refs: [ktor-client]
            description: "Submit the PIN change via a PUT to Fineract self/user/updatePassword through ktor-client; on 200 close the dialog and snackbar success, on 400 show inline error, on 401 clear session and navigate to login."
            action_contract_hash: "16f5b0d4dc4d2dd8dc017b9db505c8ae779bf9d55aecb999a3ece986de3399bc"
            action_contract_author: "claude-via-idea-enrich"
            action_contract_authored_at: "2026-07-17T00:00:00Z"

states:
  initial_state: content
  content:
    components:
      - top_bar
      - language_section_header
      - language_selector_group
      - appearance_section_header
      - theme_selector_group
      - security_section_header
      - biometric_toggle_row
      - change_pin_row
      - notifications_section_header
      - notifications_toggle_row
      - about_section_header
      - app_version_row
      - logout_button
    description: "All settings sections visible; preferences loaded from DataStore"
    demo_data:
      selectedLanguage: ENGLISH
      selectedTheme: SYSTEM
      isBiometricEnabled: false
      isBiometricAvailable: true
      isNotificationsEnabled: true
      appVersion: "1.0.0"
      buildNumber: "42"
  changing_pin:
    components:
      - top_bar
      - language_section_header
      - language_selector_group
      - appearance_section_header
      - theme_selector_group
      - security_section_header
      - biometric_toggle_row
      - change_pin_row
      - notifications_section_header
      - notifications_toggle_row
      - about_section_header
      - app_version_row
      - logout_button
      - change_pin_dialog
    description: "PIN change dialog overlaid on settings"
  logging_out:
    components: [top_bar, logout_button]
    description: "Logout button shows loading; session being cleared"

