  - dto: ChangePinRequest
    count_hint: 1
    source_notes: >
      Fineract self/user/updatePassword body (mapped from the Change PIN dialog). password is the new
      4-digit PIN, repeatPassword its confirmation. No userId in body — Fineract resolves the caller from
      BasicAuth. Sent by SettingsRepository.changePin on OnSubmitPinChange.
    items:
      - password: "5678"
        repeatPassword: "5678"

  - dto: ChangePinResponse
    count_hint: 1
    source_notes: >
      200 response from self/user/updatePassword — resourceId is the Fineract user id whose password
      (PIN) was updated. Triggers dialog close + success snackbar.
    items:
      - resourceId: 101

