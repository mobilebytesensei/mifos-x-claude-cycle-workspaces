<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — CommonPurse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --primary:#2E7D32;--primary-dark:#1B5E20;--primary-light:#4CAF50;
  --secondary:#FF8F00;--tertiary:#1565C0;
  --on-primary:#FFFFFF;--surface:#FAFAFA;--on-surface:#1A1C19;
  --error:#D32F2F;--primary-container:#A6F1A6;--secondary-container:#FFDDB3;
  --outline:#C8CAC4;--outline-variant:#E5E7E1;
  --surface-variant:#ECF3EC;--on-surface-variant:#43483E;
  font-family:'Noto Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;font-family:'Noto Sans',sans-serif;padding-top:56px}
body.embedded{background:transparent;display:block;min-height:unset;padding-top:0}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:200;background:#1e1e2e;border-bottom:1px solid #333;padding:8px 12px;display:flex;align-items:center;gap:8px;height:56px}
body.embedded #toolbar{display:none}
#toolbar .logo{font-size:13px;font-weight:700;color:#a6f1a6;margin-right:8px}
#toolbar select{background:#2a2a3e;color:#e0e0e0;border:1px solid #444;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
#toolbar button{background:#2E7D32;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
.tb-label{color:#888;font-size:11px}
#phone{width:390px;height:844px;background:var(--surface);border-radius:44px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.7)}
body.embedded #phone{width:100%;height:100vh;border-radius:0;box-shadow:none}
.screen-wrap{display:flex;flex-direction:column;height:100%}
.status-bar{height:44px;background:var(--primary);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}
body.embedded .status-bar{display:none}
.status-bar .time{color:#fff;font-size:13px;font-weight:600}
.status-bar .icons{display:flex;gap:6px}
.status-bar .icons span{color:#fff;font-size:16px}
.app-bar{height:56px;background:var(--primary);display:flex;align-items:center;padding:0 4px;flex-shrink:0}
.app-bar .back-btn{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;color:#fff}
.app-bar h1{flex:1;font-size:20px;font-weight:600;color:#fff}
.scroll-content{flex:1;overflow-y:auto;background:var(--surface)}
.scroll-content::-webkit-scrollbar{display:none}
.bottom-nav{height:64px;background:#fff;border-top:1px solid var(--outline-variant);display:flex;align-items:center;justify-content:space-around;flex-shrink:0}
body.embedded .bottom-nav{display:none}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 16px;cursor:pointer}
.nav-item.active .nav-icon-wrap{background:var(--primary-container)}
.nav-icon-wrap{border-radius:16px;padding:4px 8px;min-width:48px;display:flex;justify-content:center}
.nav-item .material-symbols-outlined{font-size:22px;color:var(--on-surface-variant)}
.nav-item.active .material-symbols-outlined{color:var(--primary)}
.nav-item span.label{font-size:10px;color:var(--on-surface-variant);font-weight:500}
.nav-item.active span.label{color:var(--primary);font-weight:700}
/* Profile banner */
.profile-banner{background:linear-gradient(135deg,var(--primary),var(--primary-dark));padding:20px;display:flex;align-items:center;gap:14px;color:#fff}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:var(--primary-container);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--primary-dark);flex-shrink:0;border:3px solid rgba(255,255,255,.3)}
.profile-banner .name{font-size:17px;font-weight:700}
.profile-banner .role-chip{display:inline-block;background:rgba(255,255,255,.2);border-radius:12px;padding:2px 10px;font-size:11px;font-weight:600;margin-top:4px}
.profile-banner .phone{font-size:12px;opacity:.8;margin-top:4px}
/* Sections */
.settings-section{background:#fff;margin:12px 16px;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--on-surface-variant);padding:12px 16px 4px}
.settings-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--outline-variant);cursor:pointer;transition:background .15s}
.settings-row:last-child{border-bottom:none}
.settings-row:active{background:var(--surface-variant)}
.settings-row .row-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.settings-row .row-text{flex:1}
.settings-row .row-title{font-size:14px;font-weight:500;color:var(--on-surface)}
.settings-row .row-sub{font-size:12px;color:#888;margin-top:2px}
.settings-row .row-right{display:flex;align-items:center;gap:6px}
/* Toggle */
.toggle{width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--primary)}
.toggle.off{background:#C8CAC4}
.toggle-thumb{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .toggle-thumb{left:22px}
.toggle.off .toggle-thumb{left:2px}
/* Radio options */
.radio-opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--outline-variant);cursor:pointer}
.radio-opt:last-child{border-bottom:none}
.radio-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--outline);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.radio-dot.selected{border-color:var(--primary)}
.radio-dot.selected::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--primary)}
/* Lang options */
.lang-opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--outline-variant);cursor:pointer}
.lang-opt:last-child{border-bottom:none}
.lang-opt.selected{background:var(--primary-container)}
/* Dialog overlay */
.dialog-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end}
.dialog{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:70%}
.dialog h3{font-size:16px;font-weight:700;margin-bottom:4px;color:var(--on-surface)}
.dialog .sub{font-size:13px;color:#888;margin-bottom:16px}
.pin-input-row{display:flex;gap:12px;justify-content:center;margin:16px 0}
.pin-dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--outline);display:flex;align-items:center;justify-content:center;font-size:20px}
.pin-dot.filled{border-color:var(--primary);background:var(--primary);color:#fff}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.key{height:52px;background:var(--surface-variant);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;cursor:pointer;transition:background .15s}
.key:active{background:var(--primary-container)}
.key.del{font-size:14px;background:#fff}
/* Danger row */
.danger-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:background .15s}
.danger-row:active{background:#FFEBEE}
.danger-row .row-title{font-size:14px;font-weight:500;color:var(--error)}
/* Chip */
.value-chip{background:var(--surface-variant);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--on-surface-variant)}
.badge-chip{background:var(--primary-container);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;color:var(--primary-dark)}
/* Buttons */
.btn-primary{background:var(--primary);color:#fff;border:none;border-radius:100px;padding:13px 20px;font-size:14px;font-weight:600;cursor:pointer;flex:1;font-family:'Noto Sans',sans-serif;transition:background .2s}
.btn-outline{background:transparent;color:var(--on-surface);border:1.5px solid var(--outline);border-radius:100px;padding:13px 20px;font-size:14px;cursor:pointer;font-family:'Noto Sans',sans-serif;flex:1}
</style>
</head>
<body>
<div id="toolbar">
  <span class="logo">CommonPurse</span>
  <span class="tb-label">Screen:</span>
  <span style="color:#a6f1a6;font-size:12px;font-weight:600">settings</span>
  <span class="tb-label" style="margin-left:8px">State:</span>
  <select id="stateSelect" onchange="switchState(this.value)">
    <option value="content" selected>content</option>
    <option value="changing_pin">changing_pin</option>
    <option value="logging_out">logging_out</option>
  </select>
  <button onclick="switchState(document.getElementById('stateSelect').value)">Reload</button>
</div>
<div id="phone">
  <div class="screen-wrap">
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <span class="material-symbols-outlined" style="font-size:16px">signal_cellular_alt</span>
        <span class="material-symbols-outlined" style="font-size:16px">wifi</span>
        <span class="material-symbols-outlined" style="font-size:16px">battery_full</span>
      </div>
    </div>
    <div class="app-bar">
      <div class="back-btn"><span class="material-symbols-outlined">arrow_back</span></div>
      <h1>Settings</h1>
    </div>
    <div class="scroll-content" id="mainContent" style="position:relative"></div>
    <div class="bottom-nav">
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">home</span></div><span class="label">Home</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">group</span></div><span class="label">Group</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">savings</span></div><span class="label">Finance</span></div>
      <div class="nav-item"><div class="nav-icon-wrap"><span class="material-symbols-outlined">sync</span></div><span class="label">Sync</span></div>
      <div class="nav-item active"><div class="nav-icon-wrap"><span class="material-symbols-outlined">settings</span></div><span class="label">Settings</span></div>
    </div>
  </div>
</div>
<script>
var EMBEDDED=(window!==window.top)||new URLSearchParams(location.search).has('embedded');
if(EMBEDDED)document.body.classList.add('embedded');
function icon(n,s,c){return'<span class="material-symbols-outlined" style="font-size:'+(s||20)+'px'+(c?';color:'+c:'')+'">'+n+'</span>'}
function toggle(id,on,onToggle){
  return'<div class="toggle '+(on?'on':'off')+'" id="'+id+'" onclick="'+onToggle+'"><div class="toggle-thumb"></div></div>';
}
function chevron(){return'<span class="material-symbols-outlined" style="font-size:18px;color:#aaa">chevron_right</span>'}

var STATE={
  language:'en',
  appearance:'system',
  biometric:true,
  notifications:true,
  meetingAlerts:true,
  repaymentAlerts:true,
  syncAlerts:false
};

function renderContent(){
  var h='';
  // Profile banner
  h+='<div class="profile-banner">';
  h+='<div class="profile-avatar">AD</div>';
  h+='<div><div class="name">Amara Diallo</div>';
  h+='<div class="role-chip">Treasurer</div>';
  h+='<div class="phone">+254 745 678 901</div></div>';
  h+='<div style="margin-left:auto">'+icon('edit',20,'rgba(255,255,255,.7)')+'</div>';
  h+='</div>';

  // Language
  h+='<div class="section-title">Language</div>';
  h+='<div class="settings-section">';
  var langs=[{code:'en',name:'English',native:'English',flag:'🇬🇧'},{code:'sw',name:'Swahili',native:'Kiswahili',flag:'🇰🇪'},{code:'fr',name:'French',native:'Français',flag:'🇫🇷'},{code:'am',name:'Amharic',native:'አማርኛ',flag:'🇪🇹'}];
  langs.forEach(function(l){
    var sel=STATE.language===l.code;
    h+='<div class="lang-opt'+(sel?' selected':'')+'\" onclick=\"STATE.language=\''+l.code+'\';switchState(\'content\')">';
    h+='<span style="font-size:22px">'+l.flag+'</span>';
    h+='<div style="flex:1"><div style="font-size:14px;font-weight:'+(sel?700:400)+';color:var(--on-surface)">'+l.name+'</div>';
    h+='<div style="font-size:12px;color:#888">'+l.native+'</div></div>';
    if(sel)h+=icon('check_circle',20,'var(--primary)');
    h+='</div>';
  });
  h+='</div>';

  // Appearance
  h+='<div class="section-title">Appearance</div>';
  h+='<div class="settings-section">';
  var themes=[{id:'light',label:'Light',icon:'light_mode',sub:'Always use light theme'},{id:'dark',label:'Dark',icon:'dark_mode',sub:'Always use dark theme'},{id:'system',label:'System Default',icon:'brightness_auto',sub:'Follow device setting'}];
  themes.forEach(function(t){
    var sel=STATE.appearance===t.id;
    h+='<div class="radio-opt" onclick="STATE.appearance=\''+t.id+'\';switchState(\'content\')">';
    h+='<div style="width:36px;height:36px;border-radius:10px;background:var(--surface-variant);display:flex;align-items:center;justify-content:center">'+icon(t.icon,20,'var(--primary)')+'</div>';
    h+='<div style="flex:1"><div style="font-size:14px;font-weight:'+(sel?700:400)+';color:var(--on-surface)">'+t.label+'</div>';
    h+='<div style="font-size:12px;color:#888">'+t.sub+'</div></div>';
    h+='<div class="radio-dot'+(sel?' selected':'')+'"></div>';
    h+='</div>';
  });
  h+='</div>';

  // Security
  h+='<div class="section-title">Security</div>';
  h+='<div class="settings-section">';
  h+='<div class="settings-row" onclick="STATE.biometric=!STATE.biometric;switchState(\'content\')">';
  h+='<div class="row-icon" style="background:#E8F5E9">'+icon('fingerprint',20,'var(--primary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Biometric Login</div><div class="row-sub">Use fingerprint or face to unlock</div></div>';
  h+=toggle('bioToggle',STATE.biometric,'STATE.biometric=!STATE.biometric;switchState("content")');
  h+='</div>';
  h+='<div class="settings-row" onclick="switchState(\'changing_pin\')">';
  h+='<div class="row-icon" style="background:#FFF3E0">'+icon('lock',20,'var(--secondary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Change PIN</div><div class="row-sub">Update your 4-digit security PIN</div></div>';
  h+=chevron();
  h+='</div>';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#E3F2FD">'+icon('phonelink_lock',20,'var(--tertiary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Two-Factor Authentication</div><div class="row-sub">Extra security for your account</div></div>';
  h+='<span class="badge-chip">ON</span>';
  h+=chevron();
  h+='</div>';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#FCE4EC">'+icon('manage_history',20,'#E91E63')+'</div>';
  h+='<div class="row-text"><div class="row-title">Session Timeout</div><div class="row-sub">Automatically lock after inactivity</div></div>';
  h+='<span class="value-chip">5 min</span>';
  h+=chevron();
  h+='</div>';
  h+='</div>';

  // Notifications
  h+='<div class="section-title">Notifications</div>';
  h+='<div class="settings-section">';
  h+='<div class="settings-row" onclick="STATE.notifications=!STATE.notifications;switchState(\'content\')">';
  h+='<div class="row-icon" style="background:#F3E5F5">'+icon('notifications',20,'#7B1FA2')+'</div>';
  h+='<div class="row-text"><div class="row-title">Push Notifications</div><div class="row-sub">Receive alerts on this device</div></div>';
  h+=toggle('notifToggle',STATE.notifications,'STATE.notifications=!STATE.notifications;switchState("content")');
  h+='</div>';
  h+='<div class="settings-row" onclick="STATE.meetingAlerts=!STATE.meetingAlerts;switchState(\'content\')">';
  h+='<div class="row-icon" style="background:#E8F5E9">'+icon('event',20,'var(--primary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Meeting Reminders</div><div class="row-sub">1 day before scheduled meetings</div></div>';
  h+=toggle('meetingToggle',STATE.meetingAlerts,'STATE.meetingAlerts=!STATE.meetingAlerts;switchState("content")');
  h+='</div>';
  h+='<div class="settings-row" onclick="STATE.repaymentAlerts=!STATE.repaymentAlerts;switchState(\'content\')">';
  h+='<div class="row-icon" style="background:#FFF3E0">'+icon('credit_score',20,'var(--secondary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Loan Repayment Alerts</div><div class="row-sub">Remind members of upcoming dues</div></div>';
  h+=toggle('repayToggle',STATE.repaymentAlerts,'STATE.repaymentAlerts=!STATE.repaymentAlerts;switchState("content")');
  h+='</div>';
  h+='<div class="settings-row" onclick="STATE.syncAlerts=!STATE.syncAlerts;switchState(\'content\')">';
  h+='<div class="row-icon" style="background:#E3F2FD">'+icon('sync',20,'var(--tertiary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Sync Failure Alerts</div><div class="row-sub">Notify when data fails to sync</div></div>';
  h+=toggle('syncToggle',STATE.syncAlerts,'STATE.syncAlerts=!STATE.syncAlerts;switchState("content")');
  h+='</div>';
  h+='</div>';

  // Data & Storage
  h+='<div class="section-title">Data &amp; Storage</div>';
  h+='<div class="settings-section">';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#E8F5E9">'+icon('storage',20,'var(--primary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Local Storage Used</div><div class="row-sub">Cached data and offline records</div></div>';
  h+='<span class="value-chip">24.3 MB</span>';
  h+='</div>';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#FFF3E0">'+icon('cloud_sync',20,'var(--secondary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Auto-Sync Frequency</div><div class="row-sub">How often to push pending data</div></div>';
  h+='<span class="value-chip">15 min</span>';
  h+=chevron();
  h+='</div>';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#E3F2FD">'+icon('download',20,'var(--tertiary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Offline Data Range</div><div class="row-sub">Data kept available without network</div></div>';
  h+='<span class="value-chip">30 days</span>';
  h+=chevron();
  h+='</div>';
  h+='<div class="settings-row" onclick="alert(\'Clear cache?\')">';
  h+='<div class="row-icon" style="background:#FFEBEE">'+icon('delete_sweep',20,'var(--error)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Clear Cache</div><div class="row-sub">Free up space — synced data retained</div></div>';
  h+=chevron();
  h+='</div>';
  h+='</div>';

  // About
  h+='<div class="section-title">About</div>';
  h+='<div class="settings-section">';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#E8F5E9">'+icon('info',20,'var(--primary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">App Version</div><div class="row-sub">CommonPurse for Android</div></div>';
  h+='<span class="badge-chip">v1.0.0 (42)</span>';
  h+='</div>';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#FFF3E0">'+icon('policy',20,'var(--secondary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Privacy Policy</div><div class="row-sub">How we handle your data</div></div>';
  h+=chevron();
  h+='</div>';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#E3F2FD">'+icon('gavel',20,'var(--tertiary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Terms of Service</div><div class="row-sub">CommonPurse usage terms</div></div>';
  h+=chevron();
  h+='</div>';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#F3E5F5">'+icon('support_agent',20,'#7B1FA2')+'</div>';
  h+='<div class="row-text"><div class="row-title">Help &amp; Support</div><div class="row-sub">Contact support or view FAQs</div></div>';
  h+=chevron();
  h+='</div>';
  h+='<div class="settings-row">';
  h+='<div class="row-icon" style="background:#E8F5E9">'+icon('open_source',20,'var(--primary)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Open Source Licenses</div></div>';
  h+=chevron();
  h+='</div>';
  h+='</div>';

  // Logout
  h+='<div class="settings-section" style="margin-bottom:0">';
  h+='<div class="danger-row" onclick="switchState(\'logging_out\')">';
  h+='<div class="row-icon" style="background:#FFEBEE">'+icon('logout',20,'var(--error)')+'</div>';
  h+='<div class="row-text"><div class="row-title">Log Out</div></div>';
  h+=chevron();
  h+='</div>';
  h+='</div>';
  h+='<div style="height:24px"></div>';
  return h;
}

function renderChangingPin(){
  var h=renderContent();
  h+='<div class="dialog-overlay" onclick="if(event.target===this)switchState(\'content\')">';
  h+='<div class="dialog">';
  h+='<h3>Change PIN</h3>';
  h+='<div class="sub">Enter your current 4-digit PIN to proceed</div>';
  h+='<div class="pin-input-row">';
  h+='<div class="pin-dot filled">•</div>';
  h+='<div class="pin-dot filled">•</div>';
  h+='<div class="pin-dot filled">•</div>';
  h+='<div class="pin-dot"></div>';
  h+='</div>';
  h+='<div class="pin-keypad">';
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){
    if(k==='')h+='<div></div>';
    else h+='<div class="key'+(k==='⌫'?' del':'')+'">'+k+'</div>';
  });
  h+='</div>';
  h+='<div style="display:flex;gap:10px;margin-top:16px">';
  h+='<button class="btn-outline" onclick="switchState(\'content\')">Cancel</button>';
  h+='<button class="btn-primary" onclick="switchState(\'content\')">Confirm</button>';
  h+='</div>';
  h+='</div></div>';
  return h;
}

function renderLoggingOut(){
  var h=renderContent();
  h+='<div class="dialog-overlay">';
  h+='<div class="dialog">';
  h+='<div style="text-align:center;padding:8px 0 16px">';
  h+='<div style="width:64px;height:64px;border-radius:50%;background:#FFEBEE;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">'+icon('logout',32,'var(--error)')+'</div>';
  h+='<div style="font-size:16px;font-weight:700;margin-bottom:8px">Log Out?</div>';
  h+='<div style="font-size:13px;color:#888;line-height:1.5">You will be signed out of Amara Diallo\'s account. Unsynced data will be saved locally and synced on next login.</div>';
  h+='</div>';
  h+='<div style="display:flex;gap:10px;margin-top:4px">';
  h+='<button class="btn-outline" onclick="switchState(\'content\')">Cancel</button>';
  h+='<button class="btn-primary" style="background:var(--error);box-shadow:0 2px 8px rgba(211,47,47,.3)" onclick="alert(\'Logged out\')">Log Out</button>';
  h+='</div></div></div>';
  return h;
}

var STATES={content:renderContent,changing_pin:renderChangingPin,logging_out:renderLoggingOut};
var currentState='content';

function switchState(s){
  if(!STATES[s])return;
  currentState=s;
  document.getElementById('stateSelect').value=s;
  document.getElementById('mainContent').innerHTML=STATES[s]();
  notifyParent();
}
function notifyParent(){
  if(!EMBEDDED)return;
  window.parent.postMessage({type:'screenLoaded',screenId:'settings',state:currentState,
    inspectorData:{screen:'settings',title:'Settings',state:currentState,
      components:['ProfileBanner','LanguageSection','AppearanceSection','SecuritySection','NotificationsSection','DataSection','AboutSection','LogoutRow'],
      data:{user:'Amara Diallo',role:'Treasurer',version:'1.0.0',build:42}}},'*');
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='switchState')switchState(e.data.state);
  if(e.data&&e.data.type==='getInspectorData')notifyParent();
});
switchState('content');
</script>
</body>
