sibling: api
schema_version: "4.0"
feature_id: settings

api:
  - id: change_pin
    method: PUT
    endpoint: "/fineract-provider/api/v1/self/user/updatePassword"
    description: Change the user's PIN (mapped to Fineract self-service password update)
    auth: BasicAuth
    body_ref: ChangePinRequest
    response_ref: ChangePinResponse
    error_handling:
      400: Show pinChangeError — invalid current PIN or weak new PIN
      401: Session expired — navigate to login
      500: Show generic error snackbar

dtos:
  ChangePinRequest:
    password: String
    repeatPassword: String

  ChangePinResponse:
    resourceId: Long

  AppLanguage:
    values: [ENGLISH, SWAHILI, FRENCH, HINDI]
    locale:
      ENGLISH: en
      SWAHILI: sw
      FRENCH: fr
      HINDI: hi

  AppTheme:
    values: [LIGHT, DARK, SYSTEM]

dependencies:
  repositories:
    - name: SettingsRepository
      methods:
        - "changePin(currentPin: String, newPin: String): Flow<Unit>"
        - "getSelectedLanguage(): Flow<AppLanguage>"
        - "setSelectedLanguage(language: AppLanguage): Flow<Unit>"
        - "getSelectedTheme(): Flow<AppTheme>"
        - "setSelectedTheme(theme: AppTheme): Flow<Unit>"
        - "getBiometricEnabled(): Flow<Boolean>"
        - "setBiometricEnabled(enabled: Boolean): Flow<Unit>"
        - "getNotificationsEnabled(): Flow<Boolean>"
        - "setNotificationsEnabled(enabled: Boolean): Flow<Unit>"
  services:
    - BiometricManager
    - SessionManager
    - NavigationManager
  local_storage:
    - DataStore (preferences — language, theme, biometric, notifications)
