sibling: flow
schema_version: "4.0"
feature_id: settings

navigates_to: []

flow_logic:
  on_load:
    - action: load_preferences_from_datastore
      fields: [selectedLanguage, selectedTheme, isBiometricEnabled, isNotificationsEnabled, isBiometricAvailable, appVersion, buildNumber]

  on_language_selected:
    - action: persist_language_to_datastore
      params: { language: "{{params.language}}" }
    - action: apply_locale_to_app

  on_theme_selected:
    - action: persist_theme_to_datastore
      params: { theme: "{{params.theme}}" }
    - action: apply_theme_to_app

  on_biometric_toggled:
    - decision: biometric_available
      branches:
        - condition: "isBiometricAvailable"
          action: persist_biometric_preference
        - condition: "!isBiometricAvailable"
          action: show_snackbar
          message: "Biometric hardware not available on this device"

  on_notifications_toggled:
    - action: persist_notifications_preference
      params: { enabled: "{{params.enabled}}" }

  on_change_pin_tapped:
    - action: set_isChangingPin_true

  on_submit_pin_change:
    - action: validate_pin_inputs
    - api_call: change_pin
      on_success:
        - action: set_pinChangeSuccess_true
        - action: set_isChangingPin_false
        - action: show_snackbar
          message: "PIN updated successfully"
      on_error_400:
        - action: set_pinChangeError
          message: "PIN change failed. Check your current PIN and try again."
      on_error_401:
        - action: clear_session
        - navigate: login

  on_dismiss_pin_dialog:
    - action: set_isChangingPin_false
    - action: clear_pin_fields

  on_logout_tapped:
    - action: emit_event_ShowLogoutDialog
