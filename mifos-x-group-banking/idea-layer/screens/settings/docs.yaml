sibling: docs
schema_version: "4.0"
feature_id: settings
contract_version: "2.0.0"
capabilities:
  - has_ui
  - has_journey
  - has_api
  - has_flow
  - has_form_input
  - is_auth_feature

identity:
  name: Settings
  description: >
    Full-featured settings screen covering language selection (English/Swahili/French/Hindi),
    appearance theme (Light/Dark/System), biometric unlock toggle, PIN change dialog,
    push notifications toggle, app version display, and logout button.
    The only API call is change_pin (PUT /self/user/updatePassword).
    All other preferences are persisted locally via DataStore.
  archetype: settings

lifecycle:
  status: designed
  quality_score: 85
  status_history:
    - status: draft
      date: "2026-05-05"
      author: system
    - status: enriched
      date: "2026-05-05"
      author: system
    - status: designed
      at: "2026-05-08T22:55:00Z"
      by: /idea export

feature_context:
  feature: multi-language
  flow: settings-flow

navigation:
  route: /settings
  bottom_nav:
    visible: true
    selected_tab: settings
  entry_points:
    - source: bottom_nav
      trigger: settings_tab_selected

legacy_metadata:
  analytics:
    screen_view: settings_viewed
    events:
      - trigger: language changed
        name: settings_language_changed
        params: { from_language: String, to_language: String }
      - trigger: theme changed
        name: settings_theme_changed
        params: { theme: String }
      - trigger: biometric toggled
        name: settings_biometric_toggled
        params: { enabled: Boolean }
      - trigger: notifications toggled
        name: settings_notifications_toggled
        params: { enabled: Boolean }
      - trigger: change PIN submitted
        name: settings_pin_changed
      - trigger: logout confirmed
        name: settings_logout
  exports:
    spec_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/multi-language/"
    api_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/exports/multi-language/"
    mockup_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/multi-language/"
    prompts_stitch_md:
      at: "2026-05-08T22:55:00Z"
      source: "idea-layer/mockups/multi-language/"
