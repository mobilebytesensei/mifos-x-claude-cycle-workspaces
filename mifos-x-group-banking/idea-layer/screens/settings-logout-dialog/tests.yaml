sibling: tests
schema_version: "4.0"
feature_id: settings-logout-dialog

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"

  scenarios:
    - id: TC-SLD-001
      scenario: "Dialog shown — idle state with correct title, body, and two action buttons"
      type: Screen
      priority: P0
      given: "Dialog overlaid on settings, isLoggingOut=false"
      when: "Idle state rendered"
      then: "dialog_title='Log Out?', logout_body_text visible, cancel_button and logout_button both rendered"

    - id: TC-SLD-002
      scenario: "Cancel tap — dismisses dialog, navigates back to settings"
      type: ViewModel
      priority: P0
      given: "Idle state"
      when: "OnDismiss action"
      then: "NavigateToLogin NOT emitted, dialog dismissed (pop_dialog)"

    - id: TC-SLD-003
      scenario: "Confirm logout — isLoggingOut transitions to true, button shows loading"
      type: ViewModel
      priority: P0
      given: "Idle state, isLoggingOut=false"
      when: "OnConfirmLogout action"
      then: "isLoggingOut=true, logout_button shows loading indicator, cancel_button remains tappable"

    - id: TC-SLD-004
      scenario: "Successful logout — session cleared, navigates to login-signup"
      type: ViewModel
      priority: P0
      given: "isLoggingOut=true"
      when: "SessionManager.clearSession() succeeds"
      then: "NavigateToLogin event emitted, back stack cleared"

    - id: TC-SLD-005
      scenario: "Logout failure — error shown inline, retry available"
      type: ViewModel
      priority: P1
      given: "isLoggingOut=true"
      when: "SessionManager.clearSession() throws exception"
      then: "isLoggingOut=false, logoutError set, logout_error_text visible with error message"

    - id: TC-SLD-006
      scenario: "Pending sync ops flushed before logout when online"
      type: ViewModel
      priority: P1
      given: "SessionInfoDto.pendingSyncCount=2, isOnline=true"
      when: "OnConfirmLogout action"
      then: "SyncQueueRepository.flushPending() called before SessionManager.clearSession()"

    - id: TC-SLD-007
      scenario: "Offline logout — warns user about unsynced data, proceeds anyway"
      type: ViewModel
      priority: P1
      given: "SessionInfoDto.pendingSyncCount=2, network offline"
      when: "OnConfirmLogout action"
      then: "ShowSnackbar event with error_offline message, then session still cleared"

    - id: TC-SLD-008
      scenario: "Logout button disabled during isLoggingOut"
      type: Screen
      priority: P0
      given: "isLoggingOut=true"
      when: "LoggingOut state rendered"
      then: "logout_button enabled_when='!isLoggingOut' evaluates false — button not clickable"

    - id: TC-SLD-009
      scenario: "Dialog title and body render correct i18n strings in Swahili"
      type: Screen
      priority: P2
      given: "selectedLanguage=SWAHILI"
      when: "Idle state rendered"
      then: "dialog_title='Toka?', cancel='Ghairi', logout='Toka'"

    - id: TC-SLD-010
      scenario: "Error text hidden when logoutError is null"
      type: Screen
      priority: P1
      given: "logoutError=null"
      when: "Idle state rendered"
      then: "logout_error_text has visible_when='logoutError != null' — not shown"
