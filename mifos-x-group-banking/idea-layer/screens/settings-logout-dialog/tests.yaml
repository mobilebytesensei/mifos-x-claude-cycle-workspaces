sibling: tests
schema_version: "4.0"
feature_id: settings-logout-dialog
generated_at: "2026-07-18T00:00:00Z"

testing:
  coverage_targets:
    ViewModel: "90%+"
    Screen: "80%+"
    Repository: "85%+"

  scenarios:
    - id: TC-SLD-001
      scenario: "Dialog opens with unsyncedOperations count from sync_queue"
      type: ViewModel
      priority: P0
      given: "sync_queue has 3 pending operations"
      when: "SettingsLogoutDialog opens"
      then: "unsyncedWarning=true; unsyncedCount=3 shown in warning message; dialog visible"

    - id: TC-SLD-002
      scenario: "No unsync warning when sync_queue is empty"
      type: Screen
      priority: P1
      given: "sync_queue.isEmpty()"
      when: "SettingsLogoutDialog opens"
      then: "unsyncedWarning=false; no warning message; only standard logout confirmation text"

    - id: TC-SLD-003
      scenario: "OnConfirmLogout flushes unsynced ops then clears session"
      type: ViewModel
      priority: P0
      given: "unsyncedOperations=3; network online"
      when: "OnConfirmLogout fires"
      then: "isLoggingOut=true; SyncRepository.flushPendingOps called; on complete AuthRepository.logout called; session cleared; NavigateToLoginSignup emitted"

    - id: TC-SLD-004
      scenario: "OnConfirmLogout when offline clears session without flush (data may be lost)"
      type: ViewModel
      priority: P1
      given: "unsyncedOperations=2; cmp-network-monitor offline"
      when: "OnConfirmLogout fires"
      then: "isLoggingOut=true; flush skipped; AuthRepository.logout called; session cleared; NavigateToLoginSignup emitted"

    - id: TC-SLD-005
      scenario: "OnDismiss closes dialog without logging out"
      type: ViewModel
      priority: P0
      given: "dialog open"
      when: "OnDismiss fires"
      then: "Dismiss event emitted; dialog closed; session intact; no API calls"

    - id: TC-SLD-006
      scenario: "Loading state shown on Confirm Logout button while isLoggingOut=true"
      type: Screen
      priority: P1
      given: "isLoggingOut=true"
      when: "dialog renders"
      then: "Confirm Logout button shows spinner; Cancel/Dismiss disabled"

    - id: TC-SLD-007
      scenario: "Flush error during logout shows error snackbar but still clears session"
      type: ViewModel
      priority: P1
      given: "SyncRepository.flushPendingOps returns error"
      when: "OnConfirmLogout fires and flush fails"
      then: "ShowSnackbar('Some data may not be synced') emitted; session cleared anyway; NavigateToLoginSignup emitted"
