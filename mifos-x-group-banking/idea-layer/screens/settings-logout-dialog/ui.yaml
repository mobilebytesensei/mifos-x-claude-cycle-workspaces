requires_stitch: true   # opt-in backfilled (RULE-STITCH-OPTIN-CONSISTENCY-001)
sibling: ui
schema_version: "4.0"
feature_id: settings-logout-dialog

route: dialog (overlaid on settings)
entry_points:
  - source: settings
    trigger: user_taps_logout_button

screens:
  - id: settings-logout-dialog-screen
    name: SettingsLogoutDialog
    type: dialog
    description: Confirmation dialog before clearing session and logging out

state_model:
  SettingsLogoutDialogViewModel:
    state:
      name: SettingsLogoutDialogState
      fields:
        isLoggingOut: { type: Boolean, default: "false" }
        logoutError: { type: "String?", default: "null" }
    screen_state:
      name: SettingsLogoutDialogScreenState
      members: [Idle, LoggingOut, Error]
    errors:
      LogoutFailed: "Failed to log out. Please try again."
    events:
      name: SettingsLogoutDialogEvent
      members:
        - { name: Dismiss }
        - { name: NavigateToClientTypeSelector }
    actions:
      name: SettingsLogoutDialogAction
      members:
        - { name: OnConfirmLogout, trigger: "Tap Logout button" }
        - { name: OnDismiss, trigger: "Tap Cancel or outside dialog" }
    di:
      - SessionManager
      - NavigationManager

components:
  - id: dialog_title
    type: text
    value: "Log Out?"
    style: { text_style: titleLarge, color: onSurface }

  - id: logout_body_text
    type: text
    value: "You will be logged out of your account. Any unsynced changes will be lost."
    style: { text_style: bodyMedium, color: onSurfaceVariant }

  - id: logout_error_text
    type: text
    value: "{{logoutError}}"
    visible_when: "logoutError != null"
    style: { text_style: bodySmall, color: error }

  - id: dialog_actions_row
    type: row
    style: { justify: end, gap: 8dp }
    children:
      - id: cancel_button
        type: button
        variant: text
        label: "Cancel"
        on_click: { action: OnDismiss }
        style: { text_color: primary }
      - id: logout_button
        type: button
        variant: filled
        label: "Log Out"
        style: { background: error, text_color: onError, loading_when: isLoggingOut }
        enabled_when: "!isLoggingOut"
        on_click: { action: OnConfirmLogout }

states:
  initial_state: idle
  idle:
    components: [dialog_title, logout_body_text, dialog_actions_row]
    description: "Awaiting user confirmation"
  logging_out:
    components: [dialog_title, logout_body_text, dialog_actions_row]
    description: "Logout in progress — button shows loading"
  error:
    components: [dialog_title, logout_body_text, logout_error_text, dialog_actions_row]
    description: "Logout failed — error shown inline"

i18n:
  en:
    dialog_title: "Log Out?"
    body_text: "You will be logged out of your account. Any unsynced changes will be lost."
    cancel: "Cancel"
    logout: "Log Out"
    error_logout_failed: "Failed to log out. Please try again."
  sw:
    dialog_title: "Toka?"
    cancel: "Ghairi"
    logout: "Toka"
  fr:
    dialog_title: "Se Déconnecter?"
    cancel: "Annuler"
    logout: "Se Déconnecter"
  hi:
    dialog_title: "लॉग आउट?"
    cancel: "रद्द करें"
    logout: "लॉग आउट"
