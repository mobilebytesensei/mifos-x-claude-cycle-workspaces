sibling: data-flow
schema_version: "2.1.0"
feature_id: settings-logout-dialog

entries:
  - screen_id: settingsLogoutDialogScreen
    trigger: on_mount
    description: Dialog is shown — no API call; reads session info from local SessionManager
    endpoints: []
    dtos:
      - { name: SessionInfoDto, role: response, api_id: local_session }
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_sources:
      - { source: SessionManager, key: session_info, dto: SessionInfoDto }
    error_paths: []

  - screen_id: settingsLogoutDialogScreen
    trigger: on_interact
    description: User confirms logout — flushes pending sync ops, clears session, navigates to login
    endpoints: []
    dtos:
      - { name: SyncFlushResult, role: response, api_id: local_sync_queue }
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    local_writes:
      - { target: SyncQueueRepository, key: flush_pending, triggers: [OnConfirmLogout], note: "Attempt to sync any queued ops before clearing session" }
      - { target: SessionManager, key: clear_session, triggers: [OnConfirmLogout] }
      - { target: DataStore, key: clear_auth_tokens, triggers: [OnConfirmLogout] }
    error_paths:
      - { error_code: "local.flush_failed", behavior: show_snackbar, message_key: error_offline, note: "Warn user that unsynced data may be lost" }
      - { error_code: "local.clear_failed", behavior: show_inline_error, message_key: error_not_found }
    navigation:
      - { condition: "logout_success", nav_target: login-signup, clear_back_stack: true }

  - screen_id: settingsLogoutDialogScreen
    trigger: on_interact
    description: User cancels — dismiss dialog, return to settings
    endpoints: []
    dtos: []
    auth_required: false
    cache:
      strategy: no_cache
      ttl_seconds: 0
      key_template: ""
    error_paths: []
    navigation:
      - { condition: "OnDismiss", nav_target: settings, behavior: pop_dialog }
