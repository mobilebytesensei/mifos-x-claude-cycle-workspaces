sibling: flow
schema_version: "4.0"
feature_id: settings-logout-dialog

navigates_to:
  - target: client-type-selector
    condition: user_confirms_logout

flow_logic:
  on_confirm_logout:
    - action: set_isLoggingOut_true
    - action: clear_session_from_datastore
      on_success:
        - navigate: client-type-selector
      on_failure:
        - action: set_logoutError
          message: "Failed to log out. Please try again."
        - action: set_isLoggingOut_false

  on_dismiss:
    - action: emit_event_Dismiss
      description: "Dismiss dialog — no state change; returns to settings screen"
