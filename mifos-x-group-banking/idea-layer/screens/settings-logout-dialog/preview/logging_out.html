<!doctype html>
<!-- render-hash: slo-logout-01a -->
<html lang="en" data-feature="settings-logout-dialog" data-state="logging_out" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>settings-logout-dialog · logging_out · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: var(--space-lg); }
    .dialog { background: var(--bg-canvas); border-radius: var(--radius-lg); box-shadow: var(--shadow-base); width: 100%; max-width: 320px; padding: var(--space-lg); }
    .dialog .dialog-icon { width: 48px; height: 48px; border-radius: 50%; background: #FFEBEE; color: var(--danger); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: var(--space-md); }
    .dialog h2 { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-sm); }
    .dialog .body-text { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: var(--space-base); }
    .dialog .progress-row { display: flex; align-items: center; gap: var(--space-md); background: var(--bg-muted); border-radius: var(--radius-md); padding: var(--space-md); margin-top: var(--space-base); }
    .dialog .progress-row .mini-spinner { width: 20px; height: 20px; border: 2px solid var(--border-subtle); border-top-color: var(--primary-700); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
    .dialog .progress-row .progress-text { font-size: 13px; color: var(--text-secondary); }
    .dialog .actions-row { display: flex; justify-content: flex-end; gap: var(--space-sm); margin-top: var(--space-base); }
    .dialog .actions-row .btn { flex: 0 0 auto; min-width: 88px; }
    .btn-danger:disabled { background: var(--text-disabled); cursor: not-allowed; }
    .btn-danger .btn-spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  </style>
</head>
<body>
<div class="app-shell" data-shell="dialog">
  <div class="scrim">
    <div class="dialog" role="alertdialog" aria-labelledby="slo-title" aria-describedby="slo-body" aria-busy="true">
      <div class="dialog-icon" aria-hidden="true">⎋</div>
      <h2 id="slo-title">Log Out?</h2>
      <p id="slo-body" class="body-text">You will be logged out of your account. Any unsynced changes will be lost.</p>
      <div class="progress-row">
        <span class="mini-spinner" aria-hidden="true"></span>
        <span class="progress-text">Flushing 2 pending changes and clearing your session…</span>
      </div>
      <div class="actions-row">
        <button class="btn btn-text" disabled>Cancel</button>
        <button class="btn btn-danger" disabled aria-label="Logging out">
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
