<!DOCTYPE html>
<html lang="en" data-feature="settings-logout-dialog" data-state="idle" data-aesthetic="minimalist-ui">
<head><meta charset="UTF-8"><title>settings-logout-dialog · CommonPurse</title>
<link rel="stylesheet" href="../../../preview/_shared/preview-style.css"></head>
<body>
<div class="app-shell" data-shell="dialog" style="background:rgba(0,0,0,.4);">
<main style="padding:0;display:flex;flex-direction:column;justify-content:center;align-items:center;height:852px;">
  <div style="background:var(--bg-canvas);border-radius:16px;padding:24px;width:320px;">
    <div style="text-align:center;margin-bottom:8px;">
      <div style="width:56px;height:56px;border-radius:50%;background:var(--bg-muted);color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;">⎋</div>
      <h2 style="font-size:17px;font-weight:600;">Sign out?</h2>
      <p style="font-size:13px;color:var(--text-secondary);margin-top:4px;">Pending events will sync next time you sign back in.</p>
    </div>
    <div class="alert alert-warning" style="margin-top:16px;font-size:12px;">
      <div>8 events queued. They will not be lost — they live on this device until you sign back in.</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-secondary" data-action="cancel" data-nav-to="settings">Cancel</button>
      <button class="btn btn-danger" data-action="confirm_logout" data-nav-to="login">Sign out</button>
    </div>
  </div>
</main>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
