<!doctype html>
<!-- render-hash: slo-idle-02a -->
<html lang="en" data-feature="settings-logout-dialog" data-state="idle" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>settings-logout-dialog · idle · MifosSave</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
</head>
<body>
<div class="app-shell" data-shell="dialog" style="justify-content:center;align-items:center;background:rgba(0,0,0,.45);">
  <div class="card" role="alertdialog" aria-labelledby="slo-title" aria-describedby="slo-body" style="width:320px;margin:var(--space-lg);padding:var(--space-lg);border:none;box-shadow:var(--shadow-base);">
    <h2 id="slo-title" style="font-size:18px;">Log Out?</h2>
    <p id="slo-body" style="font-size:14px;color:var(--text-secondary);margin-bottom:var(--space-base);">You will be logged out of your account. Any unsynced changes will be lost.</p>
    <div class="alert alert-warning">
      <span aria-hidden="true">⚠</span>
      <div>
        <h3>2 unsynced changes will be lost</h3>
        <p>Amina Hassan · 2 pending sync operations are still queued on this device.</p>
      </div>
    </div>
    <button class="btn btn-danger btn-full" data-state-to="logging_out" data-action-id="OnConfirmLogout" style="margin-top:var(--space-sm);">Log Out</button>
    <button class="btn btn-text btn-full" data-nav-to="settings" data-nav-type="pop" data-action-id="OnDismiss" style="margin-top:var(--space-xs);">Cancel</button>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
