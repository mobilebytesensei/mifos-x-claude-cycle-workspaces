<!doctype html>
<!-- render-hash: slo-error-01a -->
<html lang="en" data-feature="settings-logout-dialog" data-state="error" data-aesthetic="minimalist-ui">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>settings-logout-dialog · error · CommonPurse</title>
  <link rel="stylesheet" href="../../../preview/_shared/preview-style.css">
  <style>
    .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: var(--space-lg); }
    .dialog { background: var(--bg-canvas); border-radius: var(--radius-lg); box-shadow: var(--shadow-base); width: 100%; max-width: 320px; padding: var(--space-lg); }
    .dialog .dialog-icon { width: 48px; height: 48px; border-radius: 50%; background: #FFEBEE; color: var(--danger); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: var(--space-md); }
    .dialog h2 { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-sm); }
    .dialog .body-text { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin-bottom: var(--space-base); }
    .dialog .error-text { font-size: 13px; color: var(--danger); font-weight: 500; margin-top: var(--space-sm); }
    .dialog .actions-row { display: flex; justify-content: flex-end; gap: var(--space-sm); margin-top: var(--space-base); }
    .dialog .actions-row .btn { flex: 0 0 auto; min-width: 88px; }
  </style>
</head>
<body>
<div class="app-shell" data-shell="dialog">
  <div class="scrim">
    <div class="dialog" role="alertdialog" aria-labelledby="slo-title" aria-describedby="slo-body">
      <div class="dialog-icon" aria-hidden="true">⎋</div>
      <h2 id="slo-title">Log Out?</h2>
      <p id="slo-body" class="body-text">You will be logged out of your account. Any unsynced changes will be lost.</p>
      <div class="alert alert-danger" style="font-size:13px;">
        <span aria-hidden="true">⚠</span>
        <div class="error-text" role="alert">Failed to log out. Please try again.</div>
      </div>
      <div class="actions-row">
        <button class="btn btn-text" data-nav-to="settings" data-nav-type="pop" data-action-id="OnDismiss">Cancel</button>
        <button class="btn btn-danger" data-state-to="logging_out" data-action-id="OnConfirmLogout">Log Out</button>
      </div>
    </div>
  </div>
</div>
<script src="../../../preview/_shared/preview-runtime.js"></script>
</body>
</html>
