<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CommonPurse — Screen Prototype Browser</title>
<style>
  :root {
    --primary: #1B5E20;
    --primary-light: #2E7D32;
    --primary-dark: #145214;
    --accent: #FFA000;
    --accent-light: #FFB300;
    --bg: #F5F5F5;
    --surface: #FFFFFF;
    --surface-2: #F8F8F8;
    --text-primary: #212121;
    --text-secondary: #616161;
    --text-on-primary: #FFFFFF;
    --border: #E0E0E0;
    --shadow: 0 2px 8px rgba(0,0,0,0.10);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.14);
    --radius: 8px;
    --radius-sm: 4px;
    --sidebar-width: 280px;
    --topbar-height: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Top Nav ──────────────────────────────────────────── */
  #topbar {
    height: var(--topbar-height);
    background: var(--primary);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    z-index: 100;
    flex-shrink: 0;
  }
  #topbar .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #topbar .logo-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700; color: var(--primary);
  }
  #topbar .logo-text {
    font-size: 18px; font-weight: 700; color: var(--text-on-primary);
    letter-spacing: 0.3px;
  }
  #topbar .version-badge {
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px;
  }
  #topbar .spacer { flex: 1; }
  #topbar .stat {
    color: rgba(255,255,255,0.8);
    font-size: 12px;
  }
  #topbar .stat strong { color: #fff; }

  /* ── Tab Bar ──────────────────────────────────────────── */
  #tabbar {
    display: flex;
    background: var(--primary-dark);
    border-bottom: 2px solid var(--primary-light);
    flex-shrink: 0;
  }
  .tab-btn {
    padding: 10px 24px;
    font-size: 13px; font-weight: 600;
    color: rgba(255,255,255,0.65);
    background: none; border: none;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
    letter-spacing: 0.3px;
  }
  .tab-btn:hover { color: #fff; }
  .tab-btn.active {
    color: var(--accent-light);
    border-bottom-color: var(--accent-light);
  }

  /* ── Layout ───────────────────────────────────────────── */
  #layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Sidebar ──────────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-width);
    background: var(--primary);
    color: var(--text-on-primary);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #sidebar-search {
    padding: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  #sidebar-search input {
    width: 100%;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    border: none;
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  #sidebar-search input::placeholder { color: rgba(255,255,255,0.55); }
  #sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 16px;
  }
  #sidebar-list::-webkit-scrollbar { width: 4px; }
  #sidebar-list::-webkit-scrollbar-track { background: transparent; }
  #sidebar-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 2px; }

  .feature-group { margin-bottom: 4px; }
  .feature-header {
    padding: 8px 14px 4px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: rgba(255,255,255,0.5);
    display: flex; align-items: center; gap: 6px;
  }
  .feature-header .count {
    background: rgba(255,255,255,0.15);
    padding: 1px 6px; border-radius: 8px;
    font-size: 10px; color: rgba(255,255,255,0.65);
  }

  .screen-item {
    display: flex;
    align-items: center;
    padding: 7px 14px 7px 18px;
    cursor: pointer;
    border-radius: 0;
    gap: 10px;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .screen-item:hover { background: rgba(255,255,255,0.10); }
  .screen-item.active {
    background: rgba(255,255,255,0.18);
    border-left-color: var(--accent);
  }
  .screen-item .screen-name {
    flex: 1;
    font-size: 13px;
    line-height: 1.3;
  }
  .q-badge {
    font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 8px;
    flex-shrink: 0;
  }
  .q-high { background: #2E7D32; color: #fff; }
  .q-mid  { background: #F57F17; color: #fff; }
  .q-low  { background: #BF360C; color: #fff; }

  /* ── Main Content ─────────────────────────────────────── */
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }
  #main::-webkit-scrollbar { width: 6px; }
  #main::-webkit-scrollbar-track { background: var(--bg); }
  #main::-webkit-scrollbar-thumb { background: #BDBDBD; border-radius: 3px; }

  /* ── Tabs: Screens ────────────────────────────────────── */
  #tab-screens { display: block; }
  #tab-flows   { display: none; }

  /* Screen Grid */
  #screen-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .screen-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    border: 2px solid transparent;
  }
  .screen-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .screen-card.selected {
    border-color: var(--primary);
  }
  .card-top {
    display: flex; align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .card-name {
    font-size: 14px; font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
  }
  .card-feature {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .card-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* Detail Panel */
  #detail-panel {
    display: none;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 28px;
    margin-bottom: 24px;
    border-left: 4px solid var(--primary);
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #detail-panel .dp-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 16px;
  }
  #detail-panel .dp-name {
    font-size: 22px; font-weight: 700; color: var(--text-primary);
  }
  #detail-panel .dp-close {
    margin-left: auto;
    background: none; border: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 20px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    transition: background 0.15s;
  }
  #detail-panel .dp-close:hover { background: var(--bg); }

  .dp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .dp-field {
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
  }
  .dp-field-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .dp-field-value {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
  }
  .dp-desc {
    font-size: 14px; color: var(--text-secondary);
    line-height: 1.6;
    padding: 12px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
  }

  /* Section header */
  .section-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 18px; font-weight: 700; color: var(--text-primary);
  }
  .section-badge {
    background: var(--primary);
    color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
  }

  /* Feature filter pills */
  #feature-filters {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 20px;
  }
  .filter-pill {
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    transition: all 0.15s;
  }
  .filter-pill:hover {
    border-color: var(--primary-light);
    color: var(--primary);
  }
  .filter-pill.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  /* ── Flows Tab ────────────────────────────────────────── */
  .flow-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
    margin-bottom: 16px;
    border-left: 4px solid var(--primary);
  }
  .flow-card.error { border-left-color: #C62828; }
  .flow-card-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .flow-name { font-size: 17px; font-weight: 700; }
  .flow-type-badge {
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
  }
  .ft-happy { background: #E8F5E9; color: #2E7D32; }
  .ft-error { background: #FFEBEE; color: #C62828; }
  .ft-edge  { background: #FFF3E0; color: #E65100; }
  .flow-client {
    font-size: 12px; color: var(--text-secondary);
    background: var(--surface-2);
    padding: 2px 8px; border-radius: 8px;
    margin-left: auto;
    font-weight: 600;
  }
  .flow-steps {
    list-style: none;
    counter-reset: step;
  }
  .flow-steps li {
    counter-increment: step;
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--text-secondary);
  }
  .flow-steps li:last-child { border-bottom: none; }
  .flow-steps li::before {
    content: counter(step);
    min-width: 22px; height: 22px;
    background: var(--primary);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .flow-card.error .flow-steps li::before { background: #C62828; }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 48px 24px;
    color: var(--text-secondary);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }
</style>
</head>
<body>

<!-- Top Nav -->
<div id="topbar">
  <div class="logo">
    <div class="logo-icon">CP</div>
    <span class="logo-text">CommonPurse</span>
    <span class="version-badge">v1.0.0</span>
  </div>
  <div class="spacer"></div>
  <div class="stat"><strong>25</strong> screens</div>
  <div class="stat" style="margin-left:16px"><strong>9</strong> flows</div>
  <div class="stat" style="margin-left:16px"><strong>15</strong> features</div>
</div>

<!-- Tab Bar -->
<div id="tabbar">
  <button class="tab-btn active" onclick="switchTab('screens')">Screens</button>
  <button class="tab-btn" onclick="switchTab('flows')">Flows</button>
</div>

<!-- Layout -->
<div id="layout">

  <!-- Sidebar -->
  <nav id="sidebar">
    <div id="sidebar-search">
      <input type="text" id="search-input" placeholder="Search screens..." oninput="filterScreens(this.value)">
    </div>
    <div id="sidebar-list"></div>
  </nav>

  <!-- Main -->
  <main id="main">

    <!-- Screens Tab -->
    <div id="tab-screens">
      <div id="detail-panel">
        <div class="dp-header">
          <div>
            <div class="dp-name" id="dp-name"></div>
          </div>
          <button class="dp-close" onclick="closeDetail()">&#x2715;</button>
        </div>
        <div class="dp-grid" id="dp-grid"></div>
        <div class="dp-desc" id="dp-desc"></div>
      </div>

      <div id="feature-filters"></div>

      <div class="section-header">
        <span class="section-title">All Screens</span>
        <span class="section-badge" id="screen-count">25</span>
      </div>

      <div id="screen-grid"></div>
    </div>

    <!-- Flows Tab -->
    <div id="tab-flows">
      <div class="section-header" style="margin-bottom:20px">
        <span class="section-title">User Flows</span>
        <span class="section-badge">9</span>
      </div>
      <div id="flows-list"></div>
    </div>

  </main>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────

const screens = [
  { id: "client-type-selector", name: "Client Type Selector", feature: "authentication", quality: 88, description: "Entry screen where user selects admin or end-user mode", route: "/" },
  { id: "login", name: "Login", feature: "authentication", quality: 91, description: "Credential login for both admin (staff) and end-user (client) with biometric option", route: "/login" },
  { id: "personal-dashboard", name: "Personal Dashboard", feature: "end-user-dashboard", quality: 90, description: "End user home: savings balance, active loan, group info, recent activity", route: "/dashboard" },
  { id: "personal-savings", name: "Personal Savings", feature: "end-user-dashboard", quality: 89, description: "Individual + group-linked savings breakdown with transaction history", route: "/savings" },
  { id: "personal-loans", name: "Personal Loans", feature: "end-user-dashboard", quality: 88, description: "Active loans list with repayment schedule and status badges", route: "/loans" },
  { id: "loan-request", name: "Loan Request", feature: "end-user-dashboard", quality: 90, description: "End-user loan request form with eligibility auto-calc", route: "/loan-request" },
  { id: "group-list", name: "Group List", feature: "group-management", quality: 88, description: "Admin group index with health indicators and FAB to create", route: "/groups" },
  { id: "group-dashboard", name: "Group Dashboard", feature: "group-management", quality: 90, description: "Central hub: corpus balance, members, loans, savings, quick actions", route: "/groups/:id" },
  { id: "group-create", name: "Group Create", feature: "group-management", quality: 87, description: "3-step wizard: name/cycle → meeting rules → loan policies", route: "/groups/create" },
  { id: "member-list", name: "Member List", feature: "member-onboarding", quality: 86, description: "Group member index with attendance fraction and savings bar", route: "/groups/:id/members" },
  { id: "member-profile", name: "Member Profile", feature: "member-onboarding", quality: 89, description: "Full member detail: savings sparkline, attendance chart, loans, role", route: "/members/:id" },
  { id: "member-add", name: "Member Add", feature: "member-onboarding", quality: 87, description: "New member form: photo, phone validation, Fineract client creation", route: "/members/add" },
  { id: "meeting-calendar", name: "Meeting Calendar", feature: "meeting-lifecycle", quality: 87, description: "Calendar view of scheduled meetings with status chips", route: "/meetings" },
  { id: "meeting-conduct", name: "Meeting Conduct", feature: "meeting-lifecycle", quality: 92, description: "7-step meeting wizard: attendance → savings → repayments → outflows → loans → notes → close", route: "/meetings/:id/conduct" },
  { id: "meeting-summary", name: "Meeting Summary", feature: "meeting-lifecycle", quality: 88, description: "Post-meeting summary: totals, attendance, corpus close balance", route: "/meetings/:id/summary" },
  { id: "previous-meeting-review", name: "Previous Meeting Review", feature: "meeting-lifecycle", quality: 87, description: "Step 0 review of last meeting before starting new one", route: "/meetings/:id/review" },
  { id: "savings-dashboard", name: "Savings Dashboard", feature: "savings-collection", quality: 86, description: "Dual-tab dashboard: group-linked savings vs individual savings", route: "/savings-dashboard" },
  { id: "loan-list", name: "Loan List", feature: "loan-management", quality: 88, description: "Group loan index with overdue indicators and quick repayment CTA", route: "/loans/admin" },
  { id: "loan-apply", name: "Loan Apply", feature: "loan-management", quality: 85, description: "Loan application with eligibility check and corpus warning", route: "/loans/apply" },
  { id: "loan-detail", name: "Loan Detail", feature: "loan-management", quality: 87, description: "Tabbed detail: repayment schedule, transaction history, guarantors", route: "/loans/:id" },
  { id: "share-out-preview", name: "Share-Out Preview", feature: "share-out", quality: 86, description: "Per-member distribution breakdown before execution", route: "/share-out/preview" },
  { id: "share-out-execute", name: "Share-Out Execute", feature: "share-out", quality: 92, description: "Final confirmation with double-confirm modal and biometric auth", route: "/share-out/execute" },
  { id: "sync-status", name: "Sync Status", feature: "offline-sync", quality: 86, description: "Offline sync monitor: queue status, conflict list, last sync time", route: "/sync" },
  { id: "settings", name: "Settings", feature: "multi-language", quality: 85, description: "Language selector (4 langs), PIN setup, biometric toggle, app version", route: "/settings" },
  { id: "field-officer-dashboard", name: "Field Officer Dashboard", feature: "field-officer-view", quality: 92, description: "Multi-group read-only overview for field officers (v1.1.0)", route: "/field-officer" },
];

const flows = [
  { id: "admin-auth-flow", name: "Admin Authentication", type: "happy", client: "admin", steps: ["App launch → client-type-selector", "Select 'I manage groups' → login", "Authenticate → cache token + admin role", "Read dt_member_role → route to group-list"] },
  { id: "end-user-auth-flow", name: "End-User Authentication", type: "happy", client: "end_user", steps: ["App launch → client-type-selector", "Select 'I am a member' → login", "Self-service authenticate → cache token", "Fetch client data → personal-dashboard"] },
  { id: "group-creation-flow", name: "Group Creation", type: "happy", client: "admin", steps: ["group-list → FAB", "group-create Step 1: name + cycle", "Step 2: meeting rules", "Step 3: loan policies", "Create → sync to Fineract → group-dashboard"] },
  { id: "meeting-flow", name: "Meeting Lifecycle", type: "happy", client: "admin", steps: ["group-dashboard → Start Meeting", "Step 0: previous-meeting-review", "Step 1: Attendance roll call", "Step 2: Savings collection", "Step 3: Loan repayments", "Step 4: Withdrawals/disbursements", "Step 5: New loan applications + voting", "Step 6: Notes", "Step 7: Close → meeting-summary"] },
  { id: "loan-lifecycle-flow", name: "Loan Lifecycle", type: "happy", client: "admin", steps: ["member-profile → Request Loan", "loan-apply: eligibility check", "Meeting: group votes → approve/reject", "Disbursement recorded", "Repayments collected at meetings", "Loan closed when fully repaid"] },
  { id: "share-out-flow", name: "Share-Out (End of Cycle)", type: "happy", client: "admin", steps: ["group-dashboard → Initiate Share-Out", "Compute profit + per-member share", "share-out-preview: review breakdown", "Group confirms", "share-out-execute: distribute + biometric", "Cycle closed → new cycle begins"] },
  { id: "end-user-loan-request-flow", name: "End-User Loan Request", type: "happy", client: "end_user", steps: ["personal-dashboard → Request Loan", "loan-request: amount + purpose", "Eligibility auto-calculated", "Submit → stored in dt_loan_request", "Status visible in personal-loans"] },
  { id: "corpus-outflow-blocked-flow", name: "Corpus Block", type: "error", client: "admin", steps: ["meeting-conduct Step 4 (outflows)", "System checks: corpus - outflow < 0?", "If yes → inline error shown", "Transaction blocked, user adjusts amount"] },
  { id: "offline-sync-flow", name: "Offline Sync", type: "happy", client: "both", steps: ["User works offline → ops queued in Room", "Connectivity restored → auto-sync", "Batch API sends queued items", "Conflicts → resolution UI", "sync-status updated"] },
];

// ── State ─────────────────────────────────────────────────────────────────────
let activeFeature = "all";
let activeScreenId = null;
let searchQuery = "";

// ── Feature metadata ──────────────────────────────────────────────────────────
const featureLabels = {
  "all": "All",
  "authentication": "Auth",
  "end-user-dashboard": "End User",
  "group-management": "Groups",
  "member-onboarding": "Members",
  "meeting-lifecycle": "Meetings",
  "savings-collection": "Savings",
  "loan-management": "Loans",
  "share-out": "Share-Out",
  "offline-sync": "Sync",
  "multi-language": "Language",
  "field-officer-view": "Field Officer",
};

const uniqueFeatures = ["all", ...new Set(screens.map(s => s.feature))];

// ── Quality badge ─────────────────────────────────────────────────────────────
function qualityClass(q) {
  if (q >= 90) return "q-high";
  if (q >= 85) return "q-mid";
  return "q-low";
}

// ── Render sidebar ────────────────────────────────────────────────────────────
function renderSidebar(filtered) {
  const grouped = {};
  filtered.forEach(s => {
    if (!grouped[s.feature]) grouped[s.feature] = [];
    grouped[s.feature].push(s);
  });

  const el = document.getElementById("sidebar-list");
  el.innerHTML = "";

  if (Object.keys(grouped).length === 0) {
    el.innerHTML = '<div style="padding:20px;color:rgba(255,255,255,0.5);font-size:13px;text-align:center">No screens found</div>';
    return;
  }

  Object.entries(grouped).forEach(([feature, items]) => {
    const label = featureLabels[feature] || feature;
    const groupEl = document.createElement("div");
    groupEl.className = "feature-group";
    groupEl.innerHTML = `<div class="feature-header">${label} <span class="count">${items.length}</span></div>`;
    items.forEach(s => {
      const item = document.createElement("div");
      item.className = "screen-item" + (s.id === activeScreenId ? " active" : "");
      item.dataset.id = s.id;
      item.innerHTML = `<span class="screen-name">${s.name}</span><span class="q-badge ${qualityClass(s.quality)}">${s.quality}</span>`;
      item.addEventListener("click", () => openDetail(s.id));
      groupEl.appendChild(item);
    });
    el.appendChild(groupEl);
  });
}

// ── Render filter pills ───────────────────────────────────────────────────────
function renderFilters() {
  const el = document.getElementById("feature-filters");
  uniqueFeatures.forEach(f => {
    const pill = document.createElement("button");
    pill.className = "filter-pill" + (f === activeFeature ? " active" : "");
    pill.textContent = featureLabels[f] || f;
    pill.addEventListener("click", () => {
      activeFeature = f;
      pill.parentNode.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      renderAll();
    });
    el.appendChild(pill);
  });
}

// ── Render screen grid ────────────────────────────────────────────────────────
function renderGrid(filtered) {
  const el = document.getElementById("screen-grid");
  el.innerHTML = "";
  document.getElementById("screen-count").textContent = filtered.length;

  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">&#128269;</div><p>No screens match your filter.</p></div>';
    return;
  }

  filtered.forEach(s => {
    const card = document.createElement("div");
    card.className = "screen-card" + (s.id === activeScreenId ? " selected" : "");
    card.dataset.id = s.id;
    card.innerHTML = `
      <div class="card-top">
        <div class="card-name">${s.name}</div>
        <span class="q-badge ${qualityClass(s.quality)}">${s.quality}%</span>
      </div>
      <div class="card-feature">${s.feature}</div>
      <div class="card-desc">${s.description}</div>
    `;
    card.addEventListener("click", () => openDetail(s.id));
    el.appendChild(card);
  });
}

// ── Open detail ───────────────────────────────────────────────────────────────
function openDetail(id) {
  const s = screens.find(x => x.id === id);
  if (!s) return;
  activeScreenId = id;

  document.getElementById("dp-name").textContent = s.name;
  document.getElementById("dp-desc").textContent = s.description;

  const grid = document.getElementById("dp-grid");
  grid.innerHTML = `
    <div class="dp-field">
      <div class="dp-field-label">Feature</div>
      <div class="dp-field-value">${s.feature}</div>
    </div>
    <div class="dp-field">
      <div class="dp-field-label">Quality Score</div>
      <div class="dp-field-value" style="color:${s.quality >= 90 ? '#2E7D32' : s.quality >= 85 ? '#F57F17' : '#BF360C'}">${s.quality}%</div>
    </div>
    <div class="dp-field">
      <div class="dp-field-label">Route</div>
      <div class="dp-field-value" style="font-family:monospace;font-size:12px">${s.route}</div>
    </div>
    <div class="dp-field">
      <div class="dp-field-label">Screen ID</div>
      <div class="dp-field-value" style="font-family:monospace;font-size:12px">${s.id}</div>
    </div>
  `;

  const panel = document.getElementById("detail-panel");
  panel.style.display = "block";
  panel.scrollIntoView({ behavior: "smooth", block: "nearest" });

  // Update highlights
  renderAll();
}

function closeDetail() {
  activeScreenId = null;
  document.getElementById("detail-panel").style.display = "none";
  renderAll();
}

// ── Filter logic ──────────────────────────────────────────────────────────────
function getFiltered() {
  return screens.filter(s => {
    const featureMatch = activeFeature === "all" || s.feature === activeFeature;
    const searchMatch = !searchQuery ||
      s.name.toLowerCase().includes(searchQuery) ||
      s.feature.toLowerCase().includes(searchQuery) ||
      s.description.toLowerCase().includes(searchQuery);
    return featureMatch && searchMatch;
  });
}

function filterScreens(val) {
  searchQuery = val.toLowerCase().trim();
  renderAll();
}

function renderAll() {
  const filtered = getFiltered();
  renderSidebar(filtered);
  renderGrid(filtered);
}

// ── Flows tab ─────────────────────────────────────────────────────────────────
function renderFlows() {
  const el = document.getElementById("flows-list");
  el.innerHTML = "";
  flows.forEach(f => {
    const card = document.createElement("div");
    card.className = "flow-card" + (f.type === "error" ? " error" : "");
    const clientLabel = { admin: "Admin", end_user: "End User", both: "Both" }[f.client] || f.client;
    const stepsHtml = f.steps.map(s => `<li>${s}</li>`).join("");
    card.innerHTML = `
      <div class="flow-card-header">
        <div class="flow-name">${f.name}</div>
        <span class="flow-type-badge ft-${f.type}">${f.type}</span>
        <span class="flow-client">${clientLabel}</span>
      </div>
      <ol class="flow-steps">${stepsHtml}</ol>
    `;
    el.appendChild(card);
  });
}

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById("tab-screens").style.display = tab === "screens" ? "block" : "none";
  document.getElementById("tab-flows").style.display   = tab === "flows"   ? "block" : "none";
  document.getElementById("sidebar").style.display     = tab === "screens" ? "flex"  : "none";
  document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
  event.currentTarget.classList.add("active");
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderFilters();
renderAll();
renderFlows();
</script>
</body>
</html>
