# Tier-3 Project Components — mifos-x-group-banking (MifosSave)
#
# Domain-specific components for the MifosSave community banking app.
# Each entry extends a framework primitive or pattern. Loaded after framework
# registry (primitives + registry/*.yaml) so these may override framework entries
# of the same name if needed.
#
# Design tokens: idea-layer/design-tokens.yaml
# Primary: #2E7D32 (green) | Secondary: #FF8F00 (amber) | Tertiary: #1565C0 (blue)
# Conforms to ../../templates/specialized/idea-layer/COMPONENT_REGISTRY.schema.yaml

components:

  # ────────────────────────────────────────────────────────────────
  # Corpus Balance Card — hero financial summary for group dashboard.
  # Blocks loan disbursement when corpus < requested loan amount.
  # ────────────────────────────────────────────────────────────────
  - type: corpus_balance_card
    tier: project
    extends: card
    category: surfaces
    description: >
      Displays the group corpus fund balance with inflow (deposits) and outflow
      (loans disbursed) breakdown. Shows a warning badge when corpus is below
      the minimum threshold. Blocks loan disbursement FAB when insufficient.
    a11y:
      role: region
      semantic_html: section
      label_source: "Corpus Fund Balance: {balance}"
      contrast_required: true
    default_style:
      background: primaryContainer
      corner_radius: radius.lg
      padding: spacing.md
      elevation: elevation.level2
    slots:
      required: [balance_amount]
      optional: [inflow_amount, outflow_amount, cycle_label, warning_badge, threshold_indicator]
    supported_states: [idle, insufficient, loading, syncing]
    state_styles:
      insufficient: { background: errorContainer, border: error, border_width: border.md }
      loading: { opacity: opacity.loading }
    properties_schema:
      type: object
      required: [corpusBalance, cycleNumber]
      properties:
        corpusBalance: { type: number }
        totalInflows: { type: number }
        totalOutflows: { type: number }
        cycleNumber: { type: integer }
        minimumThreshold: { type: number }
        isSufficient: { type: boolean }

  # ────────────────────────────────────────────────────────────────
  # Group Member Tile — list entry for member roster screens.
  # ────────────────────────────────────────────────────────────────
  - type: group_member_tile
    tier: project
    extends: list_tile
    category: lists
    description: >
      Member name + role badge (treasurer/chairperson/field-officer/member) +
      savings status indicator (active/defaulted/inactive). Used in member-list,
      meeting-conduct attendance, share-out preview.
    a11y:
      role: listitem
      label_source: "{memberName}, {role}, savings {savingsStatus}"
      contrast_required: true
    default_style:
      background: surface
      corner_radius: radius.none
      padding: spacing.sm
      elevation: elevation.level0
      min_height: 56dp
    slots:
      required: [member_name, role_badge]
      optional: [avatar, savings_status_indicator, trailing_action, savings_amount]
    supported_states: [idle, selected, pressed, disabled]
    state_styles:
      selected: { background: secondaryContainer }
      pressed: { background: surface_container }
    properties_schema:
      type: object
      required: [memberId, memberName, role]
      properties:
        memberId: { type: integer }
        memberName: { type: string }
        role: { type: string, enum: [treasurer, chairperson, field_officer, member] }
        savingsStatus: { type: string, enum: [active, defaulted, inactive] }
        savingsBalance: { type: number }
        imageId: { type: integer }

  # ────────────────────────────────────────────────────────────────
  # Loan Status Chip — lifecycle state with semantic color coding.
  # ────────────────────────────────────────────────────────────────
  - type: loan_status_chip
    tier: project
    extends: chip
    category: indicators
    description: >
      Compact chip showing loan lifecycle status. Color-coded: pending=amber,
      approved=blue, disbursed=green, repaid=surface, defaulted=error.
      Used on loan-list, loan-detail, member-savings-detail.
    a11y:
      role: status
      label_source: "Loan status: {status}"
      contrast_required: true
    default_style:
      corner_radius: radius.full
      padding: "4dp 10dp"
      elevation: elevation.level0
    slots:
      required: [status_label]
      optional: [status_icon]
    state_color_map:
      pending: { background: "#FFF3E0", text: "#E65100", icon: schedule }
      approved: { background: "#E3F2FD", text: "#0D47A1", icon: check_circle_outline }
      disbursed: { background: "#E8F5E9", text: "#1B5E20", icon: payments }
      repaid: { background: "#F5F5F5", text: "#424242", icon: done_all }
      defaulted: { background: "#FFEBEE", text: "#B71C1C", icon: warning }
    properties_schema:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, disbursed, repaid, defaulted] }
        loanId: { type: integer }

  # ────────────────────────────────────────────────────────────────
  # Meeting Attendance Row — per-member presence + fine input.
  # ────────────────────────────────────────────────────────────────
  - type: meeting_attendance_row
    tier: project
    extends: list_tile
    category: forms
    description: >
      Single row in meeting-conduct attendance table. Shows member name, role,
      present/late/absent toggle buttons, and optional fine amount input
      (shown when status=late). Designed for rapid serial data entry.
    a11y:
      role: row
      label_source: "{memberName} attendance"
      contrast_required: true
    default_style:
      background: surface
      corner_radius: radius.none
      padding: "8dp 16dp"
      elevation: elevation.level0
      min_height: 56dp
    slots:
      required: [member_name, attendance_toggle]
      optional: [role_badge, fine_amount_input, fine_amount_display]
    supported_states: [present, late, absent, loading]
    state_styles:
      present: { background: "#E8F5E9" }
      late: { background: "#FFF3E0" }
      absent: { background: "#FFEBEE" }
    properties_schema:
      type: object
      required: [memberId, memberName, attendanceStatus]
      properties:
        memberId: { type: integer }
        memberName: { type: string }
        attendanceStatus: { type: string, enum: [present, late, absent] }
        fineAmount: { type: number }
        isEditable: { type: boolean }

  # ────────────────────────────────────────────────────────────────
  # Savings Collection Input — paired member + currency amount entry.
  # ────────────────────────────────────────────────────────────────
  - type: savings_collection_input
    tier: project
    extends: text_field
    category: forms
    description: >
      Row-style input for savings collection during meetings. Left side shows
      member name + current balance (read-only). Right side is currency amount
      input field (numeric keypad). Used in meeting-conduct savings step.
    a11y:
      role: textbox
      label_source: "Deposit amount for {memberName}"
      contrast_required: true
    default_style:
      background: surface
      corner_radius: radius.sm
      padding: "8dp 16dp"
      elevation: elevation.level0
      min_height: 56dp
    slots:
      required: [member_name, amount_input]
      optional: [current_balance_label, currency_prefix, validation_error]
    supported_states: [idle, focused, filled, error]
    state_styles:
      focused: { border: primary, border_width: border.focus }
      error: { border: error, border_width: border.md }
    properties_schema:
      type: object
      required: [memberId, memberName]
      properties:
        memberId: { type: integer }
        memberName: { type: string }
        currentBalance: { type: number }
        depositAmount: { type: number }
        currency: { type: string, default: "KES" }
        validationError: { type: string }

  # ────────────────────────────────────────────────────────────────
  # Share-Out Preview Card — per-member distribution summary.
  # ────────────────────────────────────────────────────────────────
  - type: share_out_preview_card
    tier: project
    extends: card
    category: surfaces
    description: >
      Read-only card showing a member's share-out allocation: member name,
      share amount (proportional to savings contributions), pool contribution
      percentage, and any deductions (unpaid fines, outstanding loans).
      Used in share-out-preview screen — read-only phase before execution.
    a11y:
      role: article
      label_source: "{memberName}: share amount {shareAmount}"
      contrast_required: true
    default_style:
      background: surface_container_low
      corner_radius: radius.md
      padding: spacing.md
      elevation: elevation.level1
    slots:
      required: [member_name, share_amount]
      optional: [contribution_percentage, deductions_breakdown, net_amount, avatar]
    properties_schema:
      type: object
      required: [memberId, memberName, shareAmount]
      properties:
        memberId: { type: integer }
        memberName: { type: string }
        shareAmount: { type: number }
        contributionPercentage: { type: number }
        unpaidFines: { type: number }
        outstandingLoan: { type: number }
        netShareOut: { type: number }

  # ────────────────────────────────────────────────────────────────
  # Sync Status Indicator — compact connectivity + queue state chip.
  # ────────────────────────────────────────────────────────────────
  - type: sync_status_indicator
    tier: project
    extends: chip
    category: indicators
    description: >
      Compact chip showing offline/syncing/synced state with pending operation
      count badge. Tappable to navigate to sync-status screen. Shown on
      admin-dashboard and field-officer-dashboard headers.
    a11y:
      role: status
      label_source: "Sync status: {syncState}, {pendingCount} pending"
      contrast_required: true
    default_style:
      corner_radius: radius.full
      padding: "4dp 10dp"
      elevation: elevation.level0
    slots:
      required: [sync_icon, sync_label]
      optional: [pending_count_badge]
    supported_states: [offline, syncing, synced, error]
    state_color_map:
      offline: { background: "#FFF3E0", text: "#E65100", icon: cloud_off }
      syncing: { background: "#E3F2FD", text: "#0D47A1", icon: sync }
      synced: { background: "#E8F5E9", text: "#1B5E20", icon: cloud_done }
      error: { background: "#FFEBEE", text: "#B71C1C", icon: sync_problem }
    on_click:
      action: navigate
      target: sync-status
    properties_schema:
      type: object
      required: [syncState]
      properties:
        syncState: { type: string, enum: [offline, syncing, synced, error] }
        pendingCount: { type: integer }
        lastSyncAt: { type: string, format: datetime }

  # ────────────────────────────────────────────────────────────────
  # Client Type Tile — large touch target for admin vs end-user selection.
  # ────────────────────────────────────────────────────────────────
  - type: client_type_tile
    tier: project
    extends: card
    category: navigation
    description: >
      Full-width card tile for client-type-selector screen. Large touch target
      (min 80dp height) with prominent icon, title, and description. Two variants:
      admin (green, group management icon) and end_user (blue, person icon).
    a11y:
      role: button
      label_source: "{clientTypeTitle}: {clientTypeDescription}"
      contrast_required: true
    default_style:
      background: surface_container
      corner_radius: radius.lg
      padding: spacing.lg
      elevation: elevation.level1
      min_height: 80dp
    slots:
      required: [client_type_icon, client_type_title]
      optional: [client_type_description, selection_indicator]
    supported_states: [idle, pressed, selected, focus_visible]
    state_styles:
      pressed: { elevation: elevation.level2, background: primaryContainer }
      selected: { background: primaryContainer, border: primary, border_width: border.md }
      focus_visible: { border: primary, border_width: border.focus }
    variants:
      admin:
        default_style: { background: "#E8F5E9" }
        icon: admin_panel_settings
        icon_color: "#2E7D32"
      end_user:
        default_style: { background: "#E3F2FD" }
        icon: person
        icon_color: "#1565C0"
    properties_schema:
      type: object
      required: [clientType, title]
      properties:
        clientType: { type: string, enum: [admin, end_user] }
        title: { type: string }
        description: { type: string }
        isSelected: { type: boolean }

  # ────────────────────────────────────────────────────────────────
  # Loan Repayment Schedule Row — due date + amount + overdue state.
  # ────────────────────────────────────────────────────────────────
  - type: loan_repayment_schedule_row
    tier: project
    extends: list_tile
    category: lists
    description: >
      Single row in a loan repayment schedule table. Shows installment number,
      due date, principal + interest breakdown, and overdue indicator (amber/red)
      when past due. Used in loan-detail and personal-loans screens.
    a11y:
      role: row
      label_source: "Installment {number}, due {dueDate}, amount {amount}"
      contrast_required: true
    default_style:
      background: surface
      corner_radius: radius.none
      padding: "8dp 16dp"
      elevation: elevation.level0
      min_height: 48dp
    slots:
      required: [installment_number, due_date, total_amount]
      optional: [principal_amount, interest_amount, overdue_indicator, paid_badge]
    supported_states: [upcoming, overdue, paid, partial]
    state_styles:
      overdue: { background: "#FFEBEE", leading_stripe: error }
      paid: { background: "#E8F5E9", opacity: opacity.muted }
    properties_schema:
      type: object
      required: [installmentNumber, dueDate, totalAmount]
      properties:
        installmentNumber: { type: integer }
        dueDate: { type: string, format: date }
        principalAmount: { type: number }
        interestAmount: { type: number }
        totalAmount: { type: number }
        isPaid: { type: boolean }
        isOverdue: { type: boolean }
        daysOverdue: { type: integer }

  # ────────────────────────────────────────────────────────────────
  # Group Cycle Header — contextual top bar with corpus summary.
  # ────────────────────────────────────────────────────────────────
  - type: group_cycle_header
    tier: project
    extends: top_bar
    category: navigation
    description: >
      Extended top bar for admin screens that shows the group name, current cycle
      number, and a compact corpus balance summary. Replaces the standard top bar
      in group-dashboard, meeting-conduct, and savings-dashboard. Corpus balance
      turns amber/red when approaching/below threshold.
    a11y:
      role: banner
      label_source: "{groupName}, Cycle {cycleNumber}, Corpus {corpusBalance}"
      contrast_required: true
    default_style:
      background: primary
      text_color: onPrimary
      elevation: elevation.level2
      min_height: 64dp
    slots:
      required: [group_name, cycle_number]
      optional: [corpus_balance_chip, sync_status_indicator, back_action, overflow_menu]
    corpus_threshold_colors:
      healthy: { chip_background: "#A6F1A6", chip_text: "#002106" }
      warning: { chip_background: "#FFF3E0", chip_text: "#E65100" }
      critical: { chip_background: "#FFEBEE", chip_text: "#B71C1C" }
    properties_schema:
      type: object
      required: [groupName, cycleNumber]
      properties:
        groupName: { type: string }
        cycleNumber: { type: integer }
        corpusBalance: { type: number }
        corpusThresholdState: { type: string, enum: [healthy, warning, critical] }
        syncState: { type: string, enum: [offline, syncing, synced, error] }

  # ══════════════════════════════════════════════════════════════════
  # Authoring-spelling aliases (project tier)
  #
  # These entries register the exact `components[].type` spellings used in
  # the screen ui.yaml files (hyphenated / project-local variants) so the
  # coherence audit resolves them. Each carries a `name:` (the literal type
  # string as authored) plus a canonical underscore `type:` and an `extends`
  # onto a framework primitive/pattern. Behaviour (a11y, motion, states)
  # inherits from the parent via the registry loader's extends-chain.
  # Added by an /idea-agent foundation-wave coherence heal (component_type_unknown).
  # ══════════════════════════════════════════════════════════════════

  # ── Navigation / app bars ──────────────────────────────────────────
  - name: top-bar
    type: top_bar_alias
    tier: project
    extends: top_app_bar
    category: navigation
    description: Screen top app bar (hyphenated authoring spelling). Alias for top_app_bar.
    a11y: { role: toolbar, semantic_html: header }
    default_style: { background: primary, color: onPrimary, elevation: elevation.level2 }
    supported_states: [idle]

  - name: top-app-bar
    type: top_app_bar_alias
    tier: project
    extends: top_app_bar
    category: navigation
    description: Screen top app bar (hyphenated authoring spelling). Alias for top_app_bar.
    a11y: { role: toolbar, semantic_html: header }
    default_style: { background: primary, color: onPrimary, elevation: elevation.level2 }
    supported_states: [idle]

  - name: navigation-footer
    type: navigation_footer
    tier: project
    extends: row
    category: navigation
    description: Bottom navigation/action footer with Back/Next buttons (wizard flows). Alias for row.
    a11y: { role: contentinfo, semantic_html: footer }
    default_style: { background: surface, padding: spacing.md, gap: spacing.sm }
    supported_states: [idle]

  - name: pull-to-refresh
    type: pull_to_refresh_alias
    tier: project
    extends: pull_to_refresh
    category: containers
    description: Pull-to-refresh scroll wrapper (hyphenated authoring spelling). Alias for pull_to_refresh.
    a11y: { role: region, semantic_html: section }
    default_style: { background: surface }
    supported_states: [idle, loading]

  # ── Tabs ───────────────────────────────────────────────────────────
  - name: tab-row
    type: tab_row_alias
    tier: project
    extends: tab_row
    category: navigation
    description: Horizontal tab strip (hyphenated authoring spelling). Alias for tab_row.
    a11y: { role: tablist, semantic_html: nav }
    default_style: { background: surface }
    supported_states: [idle, selected]

  - name: tab-bar
    type: tab_bar_alias
    tier: project
    extends: tab_row
    category: navigation
    description: Tab bar for switching detail sections (Loan detail schedule/history). Alias for tab_row.
    a11y: { role: tablist, semantic_html: nav }
    default_style: { background: surface }
    supported_states: [idle, selected]

  - name: tab-content
    type: tab_content
    tier: project
    extends: column
    category: containers
    description: Content panel rendered for the active tab. Alias for column.
    a11y: { role: tabpanel, semantic_html: section }
    default_style: { background: surface, padding: spacing.md }
    supported_states: [idle]

  # ── Inputs / forms ─────────────────────────────────────────────────
  - name: text-field
    type: text_field_alias
    tier: project
    extends: text_field
    category: inputs
    description: Single-line text input (hyphenated authoring spelling). Alias for text_field.
    a11y: { role: textbox, semantic_html: input }
    default_style: { background: surface, corner_radius: radius.sm }
    supported_states: [idle, focus, disabled, error]

  - name: text-button
    type: text_button_alias
    tier: project
    extends: text_button
    category: actions
    description: Low-emphasis text button / link-style action (hyphenated authoring spelling). Alias for text_button.
    a11y: { role: button, semantic_html: button }
    default_style: { color: primary }
    supported_states: [idle, pressed, disabled]

  - name: icon-button
    type: icon_button_alias
    tier: project
    extends: icon_button
    category: actions
    description: Icon-only tappable button (hyphenated authoring spelling). Alias for icon_button.
    a11y: { role: button, semantic_html: button }
    default_style: { color: primary }
    supported_states: [idle, pressed, disabled]

  - name: radio-group
    type: radio_group_alias
    tier: project
    extends: radio_group
    category: inputs
    description: Mutually-exclusive radio option group (hyphenated authoring spelling). Alias for radio_group.
    a11y: { role: radiogroup, semantic_html: fieldset }
    default_style: { background: surface, gap: spacing.sm }
    supported_states: [idle, selected, disabled]

  # ── Lists ──────────────────────────────────────────────────────────
  - name: list-item
    type: list_item_alias
    tier: project
    extends: list_item
    category: lists
    description: Single row in a list (hyphenated authoring spelling). Alias for list_item.
    a11y: { role: listitem, semantic_html: li }
    default_style: { background: surface, padding: spacing.sm, min_height: 56dp }
    supported_states: [idle, selected, pressed, disabled]

  - name: list-item-input
    type: list_item_input
    tier: project
    extends: list_item
    category: forms
    description: List row containing an inline input (e.g. per-member savings/attendance entry during meeting conduct). Alias for list_item with an editable trailing slot.
    a11y: { role: listitem, semantic_html: li }
    default_style: { background: surface, padding: spacing.sm, min_height: 56dp }
    supported_states: [idle, focus, error]

  - name: data-table
    type: data_table
    tier: project
    extends: list
    category: lists
    description: Tabular multi-column data list (loan schedule, share-out preview). Alias for list rendered as rows of labelled cells.
    a11y: { role: table, semantic_html: table }
    default_style: { background: surface }
    supported_states: [idle, loading, empty]

  # ── Surfaces / cards ───────────────────────────────────────────────
  - name: kpi_card
    type: kpi_card
    tier: project
    extends: card
    category: surfaces
    description: Compact KPI summary card (value + label + icon) used on dashboards. Alias for card with a stat payload.
    a11y: { role: region, semantic_html: article }
    default_style: { background: primaryContainer, corner_radius: radius.md, padding: spacing.md, elevation: elevation.level0 }
    supported_states: [idle, loading]

  - name: metric_card
    type: metric_card
    tier: project
    extends: card
    category: surfaces
    description: Summary metric card (meeting totals, savings figures) — value + caption. Alias for card.
    a11y: { role: region, semantic_html: article }
    default_style: { background: surface, corner_radius: radius.md, padding: spacing.md, elevation: elevation.level1 }
    supported_states: [idle, loading]

  - name: chart
    type: chart
    tier: project
    extends: box
    category: media
    description: Data-visualisation surface (savings trend line, contribution bars). Renders as a box container that hosts the platform chart canvas.
    a11y: { role: img, semantic_html: figure }
    default_style: { background: surface, corner_radius: radius.md, padding: spacing.md }
    supported_states: [idle, loading, empty]

  # ── Feedback / banners / progress ──────────────────────────────────
  - name: error-state
    type: error_state_alias
    tier: project
    extends: error_state
    category: feedback
    description: Full-screen error state with icon + message + retry CTA (hyphenated authoring spelling). Alias for error_state.
    a11y: { role: alert, semantic_html: section }
    default_style: { background: surface, padding: spacing.lg }
    supported_states: [idle, error]

  - name: loading-indicator
    type: loading_indicator_alias
    tier: project
    extends: loader
    category: feedback
    description: Circular/linear loading spinner (hyphenated authoring spelling). Alias for loader.
    a11y: { role: progressbar, semantic_html: div }
    default_style: { color: primary }
    supported_states: [loading]

  - name: circular-progress
    type: circular_progress_alias
    tier: project
    extends: progress_circular
    category: feedback
    description: Circular determinate/indeterminate progress ring (savings goal, sync). Alias for progress_circular.
    a11y: { role: progressbar, semantic_html: div }
    default_style: { color: primary }
    supported_states: [idle, loading]

  - name: linear-progress
    type: linear_progress_alias
    tier: project
    extends: progress_linear
    category: feedback
    description: Horizontal determinate progress bar (share-out execution steps). Alias for progress_linear.
    a11y: { role: progressbar, semantic_html: div }
    default_style: { color: primary }
    supported_states: [idle, loading]

  - name: info-banner
    type: info_banner
    tier: project
    extends: banner
    category: feedback
    description: Informational inline banner (loan eligibility notice, offline hint). Alias for banner with info styling.
    a11y: { role: status, semantic_html: aside }
    default_style: { background: secondaryContainer, color: onSecondaryContainer, corner_radius: radius.sm, padding: spacing.md }
    supported_states: [idle]

  - name: warning-banner
    type: warning_banner
    tier: project
    extends: banner
    category: feedback
    description: Warning inline banner (corpus insufficient, amount exceeds eligibility). Alias for banner with warning styling.
    a11y: { role: alert, semantic_html: aside }
    default_style: { background: errorContainer, color: onErrorContainer, corner_radius: radius.sm, padding: spacing.md }
    supported_states: [idle, error]

  - name: divider-labeled
    type: divider_labeled_alias
    tier: project
    extends: divider_labeled
    category: containers
    description: Horizontal divider with a centered label ("or") (hyphenated authoring spelling). Alias for divider_labeled.
    a11y: { role: separator, semantic_html: hr }
    default_style: { color: onSurfaceVariant }
    supported_states: [idle]

  # ── Wizard / stepper ───────────────────────────────────────────────
  - name: step-indicator
    type: step_indicator
    tier: project
    extends: stepper
    category: navigation
    description: Multi-step wizard progress indicator (group-create 4-step). Alias for stepper.
    a11y: { role: progressbar, semantic_html: nav }
    default_style: { background: surface, color: primary }
