# DATATABLE_REGISTRY.yaml — the SINGLE source of truth for every MifosSave datatable.
# Group-centric model (see ENTITY_MODEL.yaml): the savings group IS a Fineract Group (m_group).
# EVERYTHING downstream derives from this file — api_manifest.yaml#custom/companion_datatables,
# server-layer/migrations/datatables/datatables.manifest.json, and the apis/*.yaml datatable calls.
# Enforced by mifos-bridge gate MB-6 (name/parent conformance) + MB-7 (single-parent uniqueness).
# RULE-CI-001: idea-layer — authored by Claude Intelligence only.
_schema_version: "1.0"
_generated_by: "API_CONSISTENCY_FIX_PLAN Phase 1.3 — re-parented Center→Group"
_model: group-centric
_fineract_types: "lowercase — string|number|decimal|boolean|date|datetime|text; entitySubType ∈ CLIENT|GROUP|LOAN"

# Cardinality of the active set (MB-8 count gate checks against these):
counts:
  total_active: 21
  by_parent: { m_group: 14, m_client: 5, m_loan: 2 }
  deprecated: 1   # dt_member_invitation → superseded_by dt_companion_invitations

# ── m_group (14): the savings group owns its whole state (keyed by groupId) ──
# The 7 marked `reparented_from: m_center` MOVE here from the old Center model (INV-1/INV-2).
datatables:
  - name: dt_group_config
    parent: m_group
    entitySubType: GROUP
    multi_row: false
    feature: group-management
    reparented_from: m_center
    purpose: Per-group instance rules — cycle, contribution limits, loan multiplier, fines.
    columns:
      - { name: cycle_number, type: number }
      - { name: cycle_length_weeks, type: number }
      - { name: contribution_amount, type: decimal }
      - { name: contribution_min, type: decimal }
      - { name: contribution_max, type: decimal }
      - { name: loan_multiplier, type: decimal }
      - { name: interest_rate, type: decimal }
      - { name: fine_amount, type: decimal }
      - { name: meeting_frequency, type: string, length: 20 }
      - { name: cycle_start_date, type: date }
      - { name: cycle_end_date, type: date }

  - name: dt_group_corpus
    parent: m_group
    entitySubType: GROUP
    multi_row: false
    feature: corpus-tracking
    reparented_from: m_center
    purpose: Running fund balance (truth reconciled against Fineract GSIM savings balances).
    columns:
      - { name: meeting_number, type: number }
      - { name: opening_balance, type: decimal }
      - { name: total_inflows, type: decimal }
      - { name: total_outflows, type: decimal }
      - { name: closing_balance, type: decimal }
      - { name: corpus_balance, type: decimal }
      - { name: cash_on_hand, type: decimal }
      - { name: last_updated_meeting, type: number }
      - { name: last_updated_date, type: date }

  - name: dt_meeting_record
    parent: m_group
    entitySubType: GROUP
    multi_row: true
    feature: meeting-lifecycle
    reparented_from: m_center
    purpose: Per-meeting summary row.
    columns:
      - { name: meeting_number, type: number, mandatory: true }
      - { name: meeting_date, type: date, mandatory: true }
      - { name: opening_balance, type: decimal }
      - { name: closing_balance, type: decimal }
      - { name: total_inflows, type: decimal }
      - { name: total_outflows, type: decimal }
      - { name: total_savings_collected, type: decimal }
      - { name: total_repayments_received, type: decimal }
      - { name: total_loans_disbursed, type: decimal }
      - { name: total_fines_collected, type: decimal }
      - { name: attendance_count, type: number }
      - { name: notes, type: text }

  - name: dt_meeting_schedule
    parent: m_group
    entitySubType: GROUP
    multi_row: true
    feature: meeting-lifecycle
    status: provisional            # confirmed/removed in Phase 1.5 access audit
    access_rationale: >
      AL-RULE fallback — POST /groups/{id}/calendars is NOT reachable at the self-service
      (organizer) access level, so the meeting schedule is modeled as a datatable written by
      the companion. If Phase 1.5 finds the companion can attach a native group calendar with the
      service credential AND the app needs native recurrence, this table is dropped for the calendar.
    purpose: Forward meeting schedule for the group (cadence, next meeting date).
    columns:
      - { name: meeting_number, type: number, mandatory: true }
      - { name: scheduled_date, type: date, mandatory: true }
      - { name: cadence, type: string, length: 20 }
      - { name: status, type: string, length: 20 }

  - name: dt_share_out
    parent: m_group
    entitySubType: GROUP
    multi_row: true
    feature: share-out
    reparented_from: m_center
    purpose: Cycle share-out record.
    columns:
      - { name: cycle_number, type: number, mandatory: true }
      - { name: total_pool, type: decimal }
      - { name: profit_earned, type: decimal }
      - { name: status, type: string, length: 20 }
      - { name: executed_date, type: date }

  - name: dt_social_fund
    parent: m_group
    entitySubType: GROUP
    multi_row: false
    feature: social-fund
    reparented_from: m_center
    purpose: Emergency/social fund balance + disbursements.
    columns:
      - { name: current_balance, type: decimal }
      - { name: total_inflows, type: decimal }
      - { name: total_disbursed, type: decimal }
      - { name: last_updated, type: datetime }

  - name: dt_sync_metadata
    parent: m_group
    entitySubType: GROUP
    multi_row: false
    feature: offline-sync
    reparented_from: m_center
    purpose: Sync state tracking for the group's offline queue.
    columns:
      - { name: last_sync_at, type: datetime }
      - { name: pending_count, type: number }
      - { name: conflict_count, type: number }
      - { name: sync_version, type: number }

  - name: dt_group_loan_policy
    parent: m_group
    entitySubType: GROUP
    multi_row: false
    feature: loan-ceilings
    reparented_from: m_center
    purpose: Per-group loan ceiling policy.
    columns:
      - { name: max_loan_multiplier, type: decimal }
      - { name: max_loan_amount, type: decimal }
      - { name: min_savings_ratio, type: decimal }
      - { name: max_term_weeks, type: number }
      - { name: interest_rate, type: decimal }
      - { name: requires_guarantor, type: boolean }

  - name: dt_group_type_config
    parent: m_group
    entitySubType: GROUP
    multi_row: false
    feature: group-type-config
    note: >
      Archetype registry — DISTINCT from the per-group dt_group_config. entityId=0 = the global
      seed catalogue (9 seeded types). See ARCHITECTURE.md §4 GroupTypeConfig schema (27 cols).
    columns:
      - { name: slug, type: string, length: 40, mandatory: true }
      - { name: display_name, type: string, length: 80, mandatory: true }
      - { name: pool_model, type: string, length: 30 }
      - { name: payout_order_method, type: string, length: 30 }
      - { name: shareout_formula, type: string, length: 30 }
      - { name: contribution_model, type: string, length: 30 }
      - { name: share_value, type: decimal }
      - { name: min_shares_per_meeting, type: number }
      - { name: max_shares_per_meeting, type: number }
      - { name: contribution_amount, type: decimal }
      - { name: internal_lending_enabled, type: boolean }
      - { name: loan_interest_model, type: string, length: 30 }
      - { name: loan_multiplier_cap, type: decimal }
      - { name: loan_max_term_periods, type: number }
      - { name: external_linkage, type: string, length: 30 }
      - { name: joint_liability, type: boolean }
      - { name: share_capital, type: boolean }
      - { name: social_fund_enabled, type: boolean }
      - { name: social_fund_contribution, type: decimal }
      - { name: welfare_only_mode, type: boolean }
      - { name: benefit_waiting_period_days, type: number }
      - { name: cycle_model, type: string, length: 30 }
      - { name: cycle_length_months, type: number }
      - { name: meeting_cadence, type: string, length: 20 }
      - { name: group_size_min, type: number }
      - { name: group_size_max, type: number }
      - { name: formality, type: string, length: 30 }
      - { name: promoter_role, type: string, length: 40 }

  - name: dt_companion_invitations
    parent: m_group
    entitySubType: GROUP
    multi_row: true
    feature: member-invitations, unified-auth
    canonical_for: member-invitations       # THE invite table (MB-7). Supersedes dt_member_invitation.
    note: 6-char alphanumeric token; one live invite seeded by seed-demo.
    columns:
      - { name: token, type: string, length: 12, mandatory: true }
      - { name: group_id, type: number, mandatory: true }
      - { name: inviter_client_id, type: number, mandatory: true }
      - { name: invited_email_phone, type: string, length: 120, mandatory: true }
      - { name: role_to_assign, type: string, length: 20, mandatory: true }
      - { name: expires_at, type: datetime, mandatory: true }
      - { name: accepted_at, type: datetime }

  - name: dt_rosca_rotation
    parent: m_group
    entitySubType: GROUP
    multi_row: true
    feature: pluggable-distribution
    columns:
      - { name: cycle_number, type: number, mandatory: true }
      - { name: position, type: number, mandatory: true }
      - { name: recipient_client_id, type: number, mandatory: true }
      - { name: recipient_name, type: string, length: 100 }
      - { name: amount, type: decimal }
      - { name: scheduled_date, type: date }
      - { name: paid_at, type: datetime }
      - { name: payout_order_method, type: string, length: 20 }

  - name: dt_rosca_auction
    parent: m_group
    entitySubType: GROUP
    multi_row: true
    feature: pluggable-distribution
    columns:
      - { name: cycle_number, type: number, mandatory: true }
      - { name: meeting_number, type: number, mandatory: true }
      - { name: bidder_client_id, type: number, mandatory: true }
      - { name: bid_amount, type: decimal, mandatory: true }
      - { name: bid_status, type: string, length: 20 }
      - { name: bid_at, type: datetime }

  - name: dt_vsla_cycle
    parent: m_group
    entitySubType: GROUP
    multi_row: false
    feature: pluggable-distribution, share-out
    columns:
      - { name: cycle_number, type: number, mandatory: true }
      - { name: share_value, type: decimal, mandatory: true }
      - { name: total_shares_outstanding, type: number }
      - { name: total_interest_earned, type: decimal }
      - { name: cycle_start_date, type: date }
      - { name: cycle_end_date, type: date }
      - { name: status, type: string, length: 20 }

  - name: dt_welfare_fund
    parent: m_group
    entitySubType: GROUP
    multi_row: false
    feature: social-fund
    columns:
      - { name: current_balance, type: decimal, mandatory: true }
      - { name: total_contributions, type: decimal }
      - { name: total_disbursements, type: decimal }
      - { name: per_member_contribution, type: decimal }
      - { name: benefit_waiting_period_days, type: number }
      - { name: last_updated, type: datetime }

  # ── m_client (5): per-member records (keyed by clientId) ──
  - name: dt_member_role
    parent: m_client
    entitySubType: CLIENT
    multi_row: true            # a member can hold a role in >1 group → keyed by (clientId, group_id)
    feature: unified-auth, member-onboarding
    note: >
      group_id column is MANDATORY — the per-(member,group) key the auth + member endpoints depend on.
      Phase 1.5 evaluates replacing the group-role portion with NATIVE Fineract group roles
      (assignRole); client_type (admin|end_user) stays here for post-auth routing.
    columns:
      - { name: role, type: string, length: 20, mandatory: true }
      - { name: client_type, type: string, length: 20 }
      - { name: group_id, type: number, mandatory: true }
      - { name: joined_date, type: date }
      - { name: is_active, type: boolean }

  - name: dt_meeting_attendance
    parent: m_client
    entitySubType: CLIENT
    multi_row: true
    feature: meeting-lifecycle, fines-tracking
    columns:
      - { name: meeting_number, type: number, mandatory: true }
      - { name: status, type: string, length: 10, mandatory: true }
      - { name: fine_amount, type: decimal }
      - { name: savings_collected, type: decimal }
      - { name: repayment_amount, type: decimal }

  - name: dt_loan_request
    parent: m_client
    entitySubType: CLIENT
    multi_row: true
    feature: end-user-dashboard
    columns:
      - { name: amount, type: decimal, mandatory: true }
      - { name: purpose, type: text }
      - { name: duration_weeks, type: number }
      - { name: requested_at, type: datetime }
      - { name: status, type: string, length: 20 }
      - { name: reviewed_at, type: datetime }

  - name: dt_member_ceiling_override
    parent: m_client
    entitySubType: CLIENT
    multi_row: false
    feature: loan-ceilings
    columns:
      - { name: max_loan_amount, type: decimal }
      - { name: max_loan_multiplier, type: decimal }
      - { name: reason, type: text }
      - { name: effective_date, type: date }

  - name: dt_notification
    parent: m_client
    entitySubType: CLIENT
    multi_row: true
    feature: notifications
    note: created_at reserved by Fineract → event_created_at.
    columns:
      - { name: title, type: string, length: 140, mandatory: true }
      - { name: body, type: text }
      - { name: type, type: string, length: 30 }
      - { name: is_read, type: boolean }
      - { name: event_created_at, type: datetime }
      - { name: deep_link, type: string, length: 255 }

  # ── m_loan (2): per-loan records (keyed by loanId) ──
  - name: dt_loan_vote
    parent: m_loan
    entitySubType: LOAN
    multi_row: false
    feature: loan-management
    columns:
      - { name: meeting_number, type: number }
      - { name: votes_for, type: number }
      - { name: votes_against, type: number }
      - { name: votes_abstain, type: number }
      - { name: chairperson_approved, type: boolean }
      - { name: outcome, type: string, length: 20 }

  - name: dt_loan_guarantor
    parent: m_loan
    entitySubType: LOAN
    multi_row: true
    feature: loan-guarantees
    columns:
      - { name: guarantor_client_id, type: number, mandatory: true }
      - { name: guarantor_name, type: string, length: 100 }
      - { name: share_pct, type: decimal }
      - { name: guaranteed_amount, type: decimal }

# ── Deprecated (kept for migration awareness; MB-7 treats these as non-canonical) ──
deprecated:
  - name: dt_member_invitation
    was_parent: m_client
    superseded_by: dt_companion_invitations
    reason: >
      Duplicate invite-token concept. The invite belongs to the GROUP a person is invited to, so the
      canonical table is dt_companion_invitations on m_group. Any dt_member_invitation reads migrate to
      dt_companion_invitations keyed by groupId (+ filter by invited_email_phone).
