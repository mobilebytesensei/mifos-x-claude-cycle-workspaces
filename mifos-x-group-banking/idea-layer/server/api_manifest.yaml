custom_datatables:
  - name: dt_group_config
    attached_to: m_center
    feature: group-management
    purpose: Cycle rules, contribution limits, loan multiplier, fine amounts
    columns: [cycle_length_weeks, contribution_amount, loan_multiplier, fine_amount, cycle_start_date]

  - name: dt_meeting_record
    attached_to: m_center
    feature: meeting-lifecycle
    purpose: Per-meeting summary
    columns: [meeting_number, meeting_date, opening_balance, closing_balance, total_inflows, total_outflows, notes]

  - name: dt_meeting_attendance
    attached_to: m_client
    feature: meeting-lifecycle, fines-tracking
    purpose: Per-member attendance per meeting
    columns: [meeting_number, status, fine_amount, savings_collected, repayment_amount]

  - name: dt_member_role
    attached_to: m_client
    feature: unified-auth, member-onboarding
    purpose: Per-(member, group) role for post-login per-group RBAC routing
    columns: [role, client_type, joined_date, is_active]

  - name: dt_share_out
    attached_to: m_center
    feature: share-out
    purpose: Cycle share-out record
    columns: [cycle_number, total_pool, profit_earned, status, executed_date]

  - name: dt_social_fund
    attached_to: m_center
    feature: social-fund
    purpose: Emergency fund balance and disbursements
    columns: [current_balance, total_inflows, total_disbursed, last_updated]

  - name: dt_loan_vote
    attached_to: m_loan
    feature: loan-management
    purpose: Member voting on loan applications
    columns: [meeting_number, votes_for, votes_against, chairperson_approved, outcome]

  - name: dt_sync_metadata
    attached_to: m_center
    feature: offline-sync
    purpose: Sync state tracking
    columns: [last_sync_at, pending_count, conflict_count, sync_version]

  - name: dt_loan_request
    attached_to: m_client
    feature: end-user-dashboard
    purpose: End-user loan requests for organizer review at meetings
    columns: [amount, purpose, duration_weeks, requested_at, status, reviewed_at]

  - name: dt_group_corpus
    attached_to: m_center
    feature: corpus-tracking
    purpose: Running fund balance
    columns: [meeting_number, opening_balance, total_inflows, total_outflows, closing_balance]

  - name: dt_member_invitation
    attached_to: m_client
    feature: member-invitations
    purpose: Invite token audit trail — code, role, expiry, accepted state
    columns: [token, role_to_assign, expires_at, accepted_at, is_active]

# ── Companion datatables (self-signup pivot — ARCHITECTURE.md §4 + §companion_datatables)
# Surfaced from ../server-layer/API_CONTRACT.yaml#companion_datatables (6 new datatables,
# bridge-260717-002). Attached to m_group; served via the companion API /companion/datatables/*.
companion_datatables:
  - name: group_type_config
    attached_to: m_group
    feature: group-type-config
    purpose: >
      2-axis GroupTypeConfig switchboard — the runtime per-group type registry (9 seeded
      types: VSLA, ROSCA, ASCA, SILC, SHG, SACCO, CBO, Burial/Welfare, JLG). See GroupTypeConfigDto.
    mcp_tool: companion_get_group_type_configs
    contract_ref: COMP-DT-003
    dto: GroupTypeConfigDto
    columns: [slug, display_name, pool_model, payout_order_method, shareout_formula, contribution_model, share_value, min_shares_per_meeting, max_shares_per_meeting, contribution_amount, internal_lending_enabled, loan_interest_model, loan_multiplier_cap, loan_max_term_periods, external_linkage, joint_liability, share_capital, social_fund_enabled, social_fund_contribution, welfare_only_mode, benefit_waiting_period_days, cycle_model, cycle_length_months, meeting_cadence, group_size_min, group_size_max, formality, promoter_role]
    seed_count: 9

  - name: invitations
    attached_to: m_group
    feature: member-invitations, unified-auth
    purpose: >
      Self-signup invite tokens (FR-024) — server-generated 6-char code + deep-link,
      pre-assigned role, accept/revoke lifecycle. See InvitationDto.
    mcp_tool: companion_create_invitation
    contract_ref: COMP-DT-001..COMP-DT-005
    dto: InvitationDto
    multi_row: true
    columns: [token, group_id, inviter_client_id, invited_email_phone, role_to_assign, expires_at, accepted_at]

  - name: rosca_rotation
    attached_to: m_group
    feature: pluggable-distribution
    purpose: >
      ROSCA rotation queue — per-cycle positions, scheduled recipients, paid slots for
      ROTATING_PAYOUT groups. Drives strategy-aware rotation payouts (ShareOutDto.rotationPayout).
    mcp_tool: companion_dt_rosca_rotation
    contract_ref: COMP-DT-006
    multi_row: true
    columns: [cycle_number, position, recipient_client_id, recipient_name, amount, scheduled_date, paid_at, payout_order_method]

  - name: rosca_auction
    attached_to: m_group
    feature: pluggable-distribution
    purpose: >
      ROSCA auction bids — bid records for chit/hui AUCTION payout-order (who wins the pot
      this period). Feeds ShareOutDto.rotationPayout.winningBidAmount.
    mcp_tool: companion_dt_rosca_auction
    contract_ref: COMP-DT-007
    multi_row: true
    columns: [cycle_number, meeting_number, bidder_client_id, bid_amount, bid_status, bid_at]

  - name: vsla_cycle
    attached_to: m_group
    feature: pluggable-distribution, share-out
    purpose: >
      VSLA/SILC/ASCA cycle state — share_value, shares outstanding, interest earned, cycle
      window, status. Parameterizes pro-rata share-out for ACCUMULATING share-based groups.
    mcp_tool: companion_dt_vsla_cycle
    contract_ref: COMP-DT-008
    multi_row: false
    columns: [cycle_number, share_value, total_shares_outstanding, total_interest_earned, cycle_start_date, cycle_end_date, status]

  - name: welfare_fund
    attached_to: m_group
    feature: social-fund
    purpose: >
      Social/welfare fund balance + disbursements for groups with social_fund_enabled=true
      (and the core purpose of Burial/Welfare societies). groupId-resolved companion path.
    mcp_tool: companion_dt_welfare_fund
    contract_ref: COMP-DT-009
    multi_row: false
    columns: [current_balance, total_contributions, total_disbursements, per_member_contribution, benefit_waiting_period_days, last_updated]
