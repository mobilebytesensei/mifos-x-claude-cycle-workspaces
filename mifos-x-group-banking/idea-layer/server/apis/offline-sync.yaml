_group: offline-sync
_feature: offline-sync
_screens: [sync-status]

endpoints:
  - id: batch-sync
    method: POST
    path: /batches
    description: Submit all queued offline operations in one request
    request_body:
      requests:
        - requestId: integer
          relativeUrl: string
          method: string
          body: object
    mcp_tool: send_batch
    used_by_screen: sync-status
    notes: >
      All offline CRUD operations are serialized into the SyncQueue (Room table).
      On connectivity restore, this endpoint sends them in order.
      Conflict resolution UI shown if server responds with 4xx for any item.
