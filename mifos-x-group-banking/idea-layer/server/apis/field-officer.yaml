_group: field-officer
_feature: field-officer-view
_version: v1.1.0
_screens: [field-officer-dashboard]

# Read-only cross-group MFI/NGO field-officer view. Staff-scoped reads over all assigned
# centers/groups + a Fineract report for KPI health rollup. No writes.
endpoints:
  - id: get-centers-for-staff
    method: GET
    path: /centers?staffId={staffId}&paged=true&limit={limit}&offset={offset}
    description: All centers (group containers) assigned to this field-officer staff member
    response:
      totalFilteredRecords: Int
      pageItems:
        - id: Long
          name: String
          status: { id: Int, value: String }
          staffId: Long
          officeId: Long
          officeName: String
    mcp_tool: list_all_centers
    used_by_screen: field-officer-dashboard

  - id: get-groups-for-staff
    method: GET
    path: /groups?staffId={staffId}&paged=true&limit={limit}&offset={offset}
    description: All groups assigned to this field-officer staff member
    response:
      totalFilteredRecords: Int
      pageItems:
        - id: Long
          name: String
          status: { id: Int, value: String }
          officeName: String
          staffName: String
          activeClientCount: Int
    mcp_tool: list_all_groups
    used_by_screen: field-officer-dashboard

  - id: run-field-officer-report
    method: GET
    path: /runreports/FieldOfficerGroupReport?R_staffId={staffId}&output-type=CSV
    description: >
      Generate the group-health KPI report (savings balance, loans outstanding, overdue rate,
      GREEN/AMBER/RED health indicator) across all groups for this field officer.
    mcp_tool: run_fineract_report
    used_by_screen: field-officer-dashboard
    notes: >
      The FieldOfficerGroupReport report definition must exist on the target Fineract. If absent,
      the dashboard falls back to per-group aggregation over get-centers/get-groups + dt_group_corpus.

datatables_used:
  - dt_group_corpus       # per-group balance for the health rollup fallback
  - dt_group_config       # cycle number per group
