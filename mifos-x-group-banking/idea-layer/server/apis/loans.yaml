_group: loans
_feature: loan-management
_screens: [loan-list, loan-apply, loan-detail, meeting-conduct]

endpoints:
  - id: list-group-loans
    method: GET
    path: /groups/{groupId}/loans?associations=repaymentSchedule,guarantors
    description: List all loans for this group
    mcp_tool: list_group_loans
    used_by_screen: loan-list

  - id: list-loans
    method: GET
    path: /loans?groupId={groupId}&loanStatus={status}&limit={limit}&offset={offset}
    description: >
      List active/group loans (meeting-conduct step 4 repayment entry + loan lists).
      FIX S5: the app's get_active_loans calls GET /loans (list) but the contract previously
      had only GET /loans/{loanId} + POST /loans. This is the missing list op.
    response:
      totalFilteredRecords: Int
      pageItems:
        - loanId: String
          clientId: String
          clientName: String
          principal: Long
          outstandingBalance: Long
          isOverdue: Boolean
          numberOfRepayments: Int
          expectedWeeklyRepayment: Long
          status: { id: Int, value: String }
    mcp_tool: list_loans
    used_by_screen: loan-list, meeting-conduct (Step 4)

  - id: get-loan-template
    method: GET
    path: /loans/template?activeOnly=true&clientId={clientId}&groupId={groupId}
    description: Get loan product template for application form
    mcp_tool: get_loan_app_template
    used_by_screen: loan-apply

  - id: submit-loan-application
    method: POST
    path: /loans
    description: Submit loan application for group review
    mcp_tool: create_new_loan
    used_by_screen: loan-apply

  - id: approve-loan
    method: POST
    path: /loans/{loanId}?command=approve
    description: Approve loan application after voting
    # FIX S11: approve/disburse/reject are loan STATE commands on /loans/{loanId}?command=...,
    # NOT /loans/{loanId}/transactions?command=... (that path is for repayment/waiveInterest).
    # The transactions path returns 404 for approve/disburse/reject.
    request_body:
      approvedOnDate: String
      locale: String
      dateFormat: String
    mcp_tool: approve_loan
    used_by_screen: meeting-conduct (Step 5)

  - id: disburse-loan
    method: POST
    path: /loans/{loanId}?command=disburse
    description: Disburse an approved loan (money out). FIX S11 — was /loans/{id}/transactions → 404.
    request_body:
      actualDisbursementDate: String
      note: String
      locale: String
      dateFormat: String
    mcp_tool: disburse_loan
    used_by_screen: meeting-conduct (Step 5)

  - id: reject-loan
    method: POST
    path: /loans/{loanId}?command=reject
    description: Reject loan application (FIX S11 — state command, not /transactions)
    mcp_tool: reject_loan
    used_by_screen: meeting-conduct (Step 5)

  - id: record-loan-vote
    method: POST
    path: /datatables/dt_loan_vote/{loanId}
    description: Record group voting outcome on loan
    mcp_tool: record_loan_vote
    used_by_screen: meeting-conduct (Step 5)

  - id: make-repayment
    method: POST
    path: /loans/{loanId}/transactions?command=repayment
    description: Record loan repayment collected during meeting
    mcp_tool: make_repayment
    used_by_screen: meeting-conduct (Step 3)
