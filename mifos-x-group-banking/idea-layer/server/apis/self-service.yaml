_group: end-user-self-service
_feature: end-user-dashboard
_screens: [personal-dashboard, personal-savings, personal-loans, loan-request]

endpoints:
  - id: get-self-client
    method: GET
    path: /self/clients/{clientId}
    description: Get end-user's own client profile
    mcp_tool: get_self_client
    used_by_screen: personal-dashboard

  - id: list-self-savings
    method: GET
    path: /self/savingsaccounts
    description: List end-user's savings accounts
    mcp_tool: list_self_savings
    used_by_screen: personal-savings

  - id: list-self-loans
    method: GET
    path: /self/loans
    description: List end-user's active loans
    mcp_tool: list_self_loans
    used_by_screen: personal-loans

  - id: submit-loan-request
    method: POST
    path: /datatables/dt_loan_request/{clientId}
    description: Submit end-user loan request for admin review at next meeting
    mcp_tool: submit_loan_request
    used_by_screen: loan-request
