_group: groups-centers
_feature: group-management, corpus-tracking
_screens: [group-list, group-dashboard, group-create]

# Group-centric (ENTITY_MODEL.yaml): the savings group IS a Fineract Group (m_group).
endpoints:
  - id: list-groups
    method: GET
    path: /groups?staffId={staffId}&paged=true&limit=50
    description: List all savings groups (Fineract Groups) for this staff member
    response: { pageItems: [Group], totalFilteredRecords: int }
    mcp_tool: list_all_groups
    used_by_screen: group-list

  - id: get-group
    method: GET
    path: /groups/{groupId}?associations=clientMembers,groupRoles
    description: Get group details including member list and group roles
    mcp_tool: get_group
    used_by_screen: group-dashboard

  - id: get-group-accounts
    method: GET
    path: /groups/{groupId}/accounts
    description: Get all savings accounts for the group (GSIM)
    mcp_tool: list_accounts
    used_by_screen: group-dashboard

  - id: get-group-corpus
    method: GET
    path: /datatables/dt_group_corpus/{groupId}
    description: Get running fund balance for the group
    mcp_tool: get_group_corpus
    used_by_screen: group-dashboard

  - id: get-group-config
    method: GET
    path: /datatables/dt_group_config/{groupId}
    description: Get group rules (contribution, loan multiplier, fines)
    mcp_tool: get_group_config
    used_by_screen: group-dashboard, group-create

  - id: create-group
    method: POST
    path: /groups
    description: Create a new savings group (Group)
    request_body:
      name: string
      officeId: Long
      staffId: Long
      active: boolean
      activationDate: date
    mcp_tool: create_group
    used_by_screen: group-create

  - id: create-group-config
    method: POST
    path: /datatables/dt_group_config/{groupId}
    description: Save group rules after group creation
    mcp_tool: upsert_group_config
    used_by_screen: group-create

  - id: update-group-corpus
    method: PUT
    path: /datatables/dt_group_corpus/{groupId}
    description: Update running fund balance after meeting
    mcp_tool: update_group_corpus
    used_by_screen: meeting-conduct
