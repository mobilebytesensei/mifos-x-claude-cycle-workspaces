_group: groups-centers
_feature: group-management, corpus-tracking
_screens: [group-list, group-dashboard, group-create]

endpoints:
  - id: list-centers
    method: GET
    path: /centers?staffId={staffId}&paged=true&limit=50
    description: List all savings groups (Fineract Centers) for this staff member
    response: { pageItems: [Center], totalFilteredRecords: int }
    mcp_tool: list_all_centers
    used_by_screen: group-list

  - id: get-center
    method: GET
    path: /centers/{centerId}?associations=groupMembers,collectionMeetingCalendar
    description: Get group details including member list
    mcp_tool: get_center
    used_by_screen: group-dashboard

  - id: get-center-accounts
    method: GET
    path: /centers/{centerId}/accounts
    description: Get all savings accounts for the group
    mcp_tool: list_accounts
    used_by_screen: group-dashboard

  - id: get-group-corpus
    method: GET
    path: /datatables/dt_group_corpus/{centerId}
    description: Get running fund balance for the group
    mcp_tool: get_group_corpus
    used_by_screen: group-dashboard

  - id: get-group-config
    method: GET
    path: /datatables/dt_group_config/{centerId}
    description: Get group rules (contribution, loan multiplier, fines)
    mcp_tool: get_group_config
    used_by_screen: group-dashboard, group-create

  - id: create-center
    method: POST
    path: /centers
    description: Create a new savings group (Center)
    request_body:
      name: string
      officeId: Long
      staffId: Long
      active: boolean
      activationDate: date
    mcp_tool: create_lending_group
    used_by_screen: group-create

  - id: create-group-config
    method: POST
    path: /datatables/dt_group_config/{centerId}
    description: Save group rules after center creation
    mcp_tool: upsert_group_config
    used_by_screen: group-create

  - id: update-group-corpus
    method: PUT
    path: /datatables/dt_group_corpus/{centerId}
    description: Update running fund balance after meeting
    mcp_tool: update_group_corpus
    used_by_screen: meeting-conduct
