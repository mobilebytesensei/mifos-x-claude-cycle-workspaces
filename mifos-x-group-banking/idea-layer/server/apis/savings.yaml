_group: savings
_feature: savings-collection, group-linked-savings, corpus-tracking
_screens: [savings-dashboard, meeting-conduct, personal-savings]

# Organizer/treasurer savings views (contribution-model-aware) go through the companion BFF;
# the raw Fineract /savingsaccounts/* endpoints remain the underlying write path used during
# meeting-conduct. Member self-service savings are covered by apis/self-service.yaml.
endpoints:
  - id: get-group-savings-summary
    method: GET
    path: /companion/groups/{groupId}/savings
    description: >
      Group savings summary — contribution-model-aware per-member rows. sharesHeld + shareValue
      for SHARE_BASED_VARIABLE (VSLA/SILC); totalContributed + meetingsContributed for
      FIXED_AMOUNT (ROSCA/SHG). Backed by GSIM savings aggregation + dt_group_config.
    response:
      cycleTarget: Long
      cycleCollected: Long
      totalCollected: Long
      weeklyTrend: "List<WeeklyContributionPoint>"
      memberRows: "List<MemberGroupSavingsRow>"
    mcp_tool: companion_get_group_savings_summary
    used_by_screen: savings-dashboard (Group tab)

  - id: get-individual-savings-summary
    method: GET
    path: /companion/groups/{groupId}/savings/individual
    description: Individual voluntary savings per member for the Individual tab
    response:
      totalBalance: Long
      memberRows: "List<MemberIndividualSavingsRow>"
      weeklyTrend: "List<WeeklyContributionPoint>"
    mcp_tool: companion_get_individual_savings_summary
    used_by_screen: savings-dashboard (Individual tab)

  - id: get-member-savings-detail
    method: GET
    path: /companion/groups/{groupId}/members/{memberId}/savings
    description: Member savings detail — model-aware (sharesHeld/shareValue OR savingsBalance/meetingsContributed) + sparkline + paginated tx history
    mcp_tool: companion_get_member_savings_detail
    used_by_screen: member-savings-detail (drill-down from savings-dashboard)

  - id: create-savings-account
    method: POST
    path: /savingsaccounts
    description: Open a savings account (group-linked mandatory OR individual voluntary) for a member
    request_body:
      clientId: Long
      productId: Long
      submittedOnDate: String
      locale: String
      dateFormat: String
    mcp_tool: create_savings
    used_by_screen: member-add (on member creation), group-create

  - id: approve-activate-savings
    method: POST
    path: /savingsaccounts/{accountId}?command=approve
    description: Approve then activate a savings account (?command=activate follows)
    mcp_tool: approve_activate_savings
    used_by_screen: member-add

  - id: post-savings-deposit
    method: POST
    path: /savingsaccounts/{savingsId}/transactions?command=deposit
    description: Post a savings deposit — one call per member per savings type during meeting-conduct step 2
    request_body:
      transactionDate: String
      transactionAmount: Long
      paymentTypeId: { type: Int, note: "1=Cash" }
      locale: String
      dateFormat: String
    mcp_tool: deposit
    used_by_screen: meeting-conduct (Step 2 savings collection)
    offline_queue: { table: sync_queue, operation: POST_SAVINGS_TRANSACTION, priority: 3 }

  - id: get-savings-transactions
    method: GET
    path: /savingsaccounts/{savingsId}?associations=transactions
    description: Transaction history for a savings account (savings-dashboard drill-down, meeting reconciliation)
    mcp_tool: get_savings_txns
    used_by_screen: savings-dashboard, meeting-conduct

datatables_used:
  - dt_group_corpus     # closing balance reconciliation (see apis/groups-centers.yaml)
  - dt_vsla_cycle       # share_value for SHARE_BASED_VARIABLE summaries
