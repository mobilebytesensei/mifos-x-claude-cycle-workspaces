_group: meetings
_feature: meeting-lifecycle, savings-collection, corpus-tracking
_screens: [meeting-calendar, meeting-conduct, meeting-summary, previous-meeting-review]

endpoints:
  - id: list-meetings
    method: GET
    path: /centers/{centerId}/meetings?fromDate={date}
    description: List scheduled meetings for this group
    mcp_tool: list_meetings
    used_by_screen: meeting-calendar

  - id: record-meeting
    method: POST
    path: /datatables/dt_meeting_record/{centerId}
    description: Save meeting summary record
    request_body:
      meeting_number: integer
      meeting_date: date
      opening_balance: decimal
      closing_balance: decimal
      total_inflows: decimal
      total_outflows: decimal
      notes: string
    mcp_tool: record_meeting
    used_by_screen: meeting-conduct (Step 7 close)

  - id: record-attendance
    method: POST
    path: /datatables/dt_meeting_attendance/{clientId}
    description: Record per-member attendance for meeting
    mcp_tool: record_attendance
    used_by_screen: meeting-conduct (Step 1)

  - id: get-previous-meeting
    method: GET
    path: /datatables/dt_meeting_record/{centerId}?meetingNumber={n-1}
    description: Retrieve last meeting summary for review
    mcp_tool: list_attendance
    used_by_screen: previous-meeting-review

  - id: advance-cycle
    method: POST
    path: /centers/{centerId}/command?command=advanceCycle
    description: Advance group to next meeting cycle
    mcp_tool: advance_cycle
    used_by_screen: meeting-summary (end of cycle)
