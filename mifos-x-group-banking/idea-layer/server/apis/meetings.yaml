_group: meetings
_feature: meeting-lifecycle, savings-collection, corpus-tracking
_screens: [meeting-calendar, meeting-conduct, meeting-summary, previous-meeting-review]

endpoints:
  - id: list-meetings
    method: GET
    path: /datatables/dt_meeting_schedule/{groupId}
    description: >
      List the SCHEDULED (forward) meetings for this group from the dt_meeting_schedule datatable,
      served by the companion (AL-RULE — the native group calendar write is not reachable at the
      self-service level, so the schedule is modeled as a companion-served datatable). This is the
      meeting-calendar's forward schedule read — it is NOT the past-meeting summary datatable.
      (FIX S4/S11: previously mapped to mcp_tool list_meetings which reads dt_meeting_record — the
      wrong source. Scheduled meetings come from dt_meeting_schedule, not the summary table.)
    mcp_tool: get_meeting_schedule           # companion-served /datatables/dt_meeting_schedule/{groupId} (AL-RULE)
    companion_tool: companion_get_meetings   # COMP-CAL-001 — cadence-resolved schedule
    used_by_screen: meeting-calendar

  - id: record-meeting
    method: POST
    path: /datatables/dt_meeting_record/{groupId}
    description: Save meeting summary record
    request_body:
      meeting_number: integer
      meeting_date: date
      opening_balance: decimal
      closing_balance: decimal
      total_inflows: decimal
      total_outflows: decimal
      notes: string
    mcp_tool: record_meeting
    used_by_screen: meeting-conduct (Step 7 close)

  - id: record-attendance
    method: POST
    path: /datatables/dt_meeting_attendance/{clientId}
    description: Record per-member attendance for meeting
    mcp_tool: record_attendance
    used_by_screen: meeting-conduct (Step 1)

  - id: get-previous-meeting
    method: GET
    path: /datatables/dt_meeting_record/{groupId}?meetingNumber={n-1}
    description: Retrieve last meeting SUMMARY for review (from dt_meeting_record)
    # FIX S11: previously mapped to mcp_tool list_attendance (the attendance datatable on
    # m_client) — the wrong table. Previous-meeting summary rows live in dt_meeting_record.
    mcp_tool: list_meetings
    used_by_screen: previous-meeting-review

  - id: advance-cycle
    method: PUT
    path: /datatables/dt_group_config/{groupId}
    description: >
      Advance the group to the next meeting cycle by updating cycle_number + cycle_start_date +
      cycle_end_date on the group-config datatable.
    # FIX S11: previously POST /groups/{groupId}/command?command=advanceCycle — Fineract has no
    # such endpoint (404). advance_cycle is a PUT on the dt_group_config datatable.
    request_body:
      cycle_number: integer
      cycle_start_date: date
      cycle_end_date: date
    mcp_tool: advance_cycle
    used_by_screen: meeting-summary (end of cycle)
