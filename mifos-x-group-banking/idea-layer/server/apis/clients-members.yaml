_group: clients-members
_feature: member-onboarding, member-management
_screens: [member-list, member-profile, member-add]

endpoints:
  - id: get-group-members
    method: GET
    path: /groups/{groupId}/clients?limit={limit}&offset={offset}
    description: Paginated list of clients (members) belonging to the group
    response:
      totalFilteredRecords: Int
      pageItems:
        - id: Long
          displayName: String
          status: { id: Int, value: String }
          mobileNo: String
          savingsAccountBalance: Double
          loanStatus: String
    mcp_tool: list_all_groups   # native — group clients resolved via GET /groups/{id}/clients
    used_by_screen: member-list

  - id: get-client
    method: GET
    path: /clients/{clientId}
    description: Full client (member) profile
    response:
      id: Long
      displayName: String
      firstname: String
      lastname: String
      mobileNo: String
      status: { id: Int, value: String }
      activationDate: String
      officeId: Long
    mcp_tool: get_client
    used_by_screen: member-profile

  - id: get-client-accounts
    method: GET
    path: /clients/{clientId}/accounts
    description: Savings + loan accounts for the member (profile savings history + active loan)
    mcp_tool: get_client_accts
    used_by_screen: member-profile

  - id: get-member-role
    method: GET
    path: /datatables/dt_member_role/{clientId}
    description: Read the member's per-group role from the custom datatable
    response:
      - role: String        # CHAIRPERSON | TREASURER | SECRETARY | MEMBER
        group_id: Long
        joined_date: date
    mcp_tool: get_member_role
    used_by_screen: member-profile

  - id: update-member-role
    method: PUT
    path: /datatables/dt_member_role/{clientId}
    description: Update the member's role (chairperson-only)
    request_body:
      role: String
      group_id: Long
      assignedDate: date
    mcp_tool: assign_member_role
    used_by_screen: member-profile

  - id: create-client
    method: POST
    path: /clients
    description: Create a new Fineract client (group member)
    request_body:
      firstname: String
      lastname: String
      mobileNo: String
      active: Boolean
      activationDate: String
      officeId: Long
      groupId: Long
      locale: String
      dateFormat: String
    response:
      resourceId: Long
      clientId: Long
    mcp_tool: create_new_client
    used_by_screen: member-add
    offline_queue: { table: sync_queue, operation: CREATE_MEMBER }

  - id: assign-member-role
    method: POST
    path: /datatables/dt_member_role/{clientId}
    description: Write the new member's role to the custom datatable
    request_body:
      role: String
      group_id: Long
      assignedDate: date
    mcp_tool: assign_member_role
    used_by_screen: member-add
    offline_queue: { table: sync_queue, operation: ASSIGN_MEMBER_ROLE }

  - id: associate-client-to-group
    method: POST
    path: /groups/{groupId}?command=associateClients
    description: Associate the created client with the group (Fineract group membership)
    request_body:
      clientMembers: "List<Long>"
    mcp_tool: add_member_to_group
    used_by_screen: member-add

  - id: upload-member-photo
    method: POST
    path: /clients/{clientId}/images
    description: Upload member profile photo (multipart)
    mcp_tool: create_datatable_entry   # image upload via generic client image endpoint
    used_by_screen: member-add
    offline_queue: { table: sync_queue, operation: UPLOAD_MEMBER_PHOTO }

datatables_used:
  - dt_member_role   # role per (member, group)
