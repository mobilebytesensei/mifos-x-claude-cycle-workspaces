_group: authentication
_feature: authentication
_screens: [client-type-selector, login]

endpoints:
  - id: staff-authenticate
    method: POST
    path: /authentication
    description: Staff/admin authentication
    request_body:
      username: { type: string, required: true }
      password: { type: string, required: true }
    response:
      userId: Long
      username: string
      authenticated: boolean
      officeId: Long
      token: string
    mcp_tool: authenticate
    used_by_screen: login (admin)

  - id: self-authenticate
    method: POST
    path: /self/authentication
    description: End-user (client) self-service authentication
    request_body:
      username: { type: string, required: true }
      password: { type: string, required: true }
    response:
      clientId: Long
      authenticated: boolean
      selfServiceUserDetails: object
      token: string
    mcp_tool: self_authenticate
    used_by_screen: login (end_user)

  - id: get-member-role
    method: GET
    path: /datatables/dt_member_role/{clientId}
    description: Read client_type and role after auth
    response:
      role: string    # TREASURER | CHAIRPERSON | SECRETARY | MEMBER | FIELD_OFFICER
      client_type: string  # admin | end_user
      group_id: Long   # the (member, group) key for the resolved role
      joined_date: date
    mcp_tool: get_member_role
    used_by_screen: login (post-auth role resolution)
