name: GroupConfigDto
version: "2.0.0"
description: >
  Group cycle rules and configuration DTO for CommonPurse. Sourced from
  dt_group_config datatable attached to m_center. Contains the governing
  rules for contribution amounts, loan eligibility multipliers, fine rates,
  and cycle dates for a savings group. Post self-signup pivot it also carries a
  group_type reference (groupTypeSlug + the 2-axis pool_model / contribution_model)
  so cycle rules are interpreted in the context of the chosen GroupTypeConfig
  archetype (see GroupTypeConfigDto).

source:
  origin: datatable
  endpoint: "GET /datatables/dt_group_config/{groupId}"
  table: dt_group_config
  attached_to: m_center

fields:
  - name: groupId
    type: Long
    description: Fineract Center ID.
  - name: groupTypeSlug
    type: { optional: String }
    required: false
    description: >
      Reference to the group's chosen GroupTypeConfig row (GroupTypeConfigDto.slug).
      Determines which axis semantics apply to the cycle rules below. Null until a
      group type is picked.
  - name: poolModel
    type: { optional: String }
    required: false
    description: >
      Axis A (pool disposition) from the group's GroupTypeConfig. ROTATING_PAYOUT groups
      (ROSCA) rotate the pot to one member per period; ACCUMULATING groups (VSLA/ASCA/SHG)
      grow the pool and share out at cycle end. Null until group_type is chosen.
    values: [ROTATING_PAYOUT, ACCUMULATING, NONE]
  - name: contributionModel
    type: { optional: String }
    required: false
    description: >
      Axis B (contribution) from the group's GroupTypeConfig. FIXED = flat amount per
      meeting; SHARE_BASED_VARIABLE = member buys 1..N shares of share_value. Null until
      group_type is chosen.
    values: [FIXED, SHARE_BASED_VARIABLE]
  - name: cycleRules
    type: String
    description: Human-readable cycle rules summary (e.g. "Weekly, 52 weeks").
  - name: contributionLimit
    type: Double
    description: Maximum allowed savings contribution per member per meeting.
  - name: minimumContribution
    type: { optional: Double }
    required: false
    description: Minimum required savings contribution per meeting. Null if voluntary.
  - name: loanMultiplier
    type: Double
    description: >
      Loan ceiling = memberSavingsBalance × loanMultiplier.
      E.g. 3.0 means a member can borrow up to 3× their savings.
  - name: fineAmount
    type: Double
    description: Standard fine per absence or late arrival (in account currency).
  - name: interestRate
    type: Double
    description: Applicable loan interest rate for this group (annual %).
  - name: cycleStartDate
    type: { optional: String }
    required: false
    description: ISO date when current savings cycle started.
  - name: cycleEndDate
    type: { optional: String }
    required: false
    description: ISO date when current savings cycle is expected to end.
  - name: meetingFrequency
    type: String
    description: How often the group meets.
    values: [weekly, bi_weekly, monthly]

used_by:
  - feature: group-management
    kind: response
    api_id: get_group_config
    role: single
    notes: Group dashboard and meeting-conduct load config for validation rules.
  - feature: loan-management
    kind: response
    api_id: get_loan_policy
    role: single
    notes: Loan-apply uses loanMultiplier to compute ceiling.

capabilities_used: [has_api, has_offline_cache]
tier: critical
tags: [group-config, rules, datatable, fineract, group-type, group-management]
