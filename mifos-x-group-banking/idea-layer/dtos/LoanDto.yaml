name: LoanDto
version: "1.0.0"
description: >
  Fineract Loan DTO for CommonPurse. Represents a group member loan application
  through its full lifecycle: pending approval, approved, disbursed, repaid,
  or defaulted. Used across loan-list, loan-apply, loan-detail, and personal-loans.

source:
  origin: rest
  endpoint: "GET /loans/{loanId}"
  list_endpoint: "GET /loans?groupId={groupId}"
  table: m_loan

fields:
  - name: id
    type: Long
    description: Fineract Loan ID.
  - name: memberId
    type: Long
    description: Fineract client ID of the borrower.
  - name: memberName
    type: String
    description: Borrower display name (denormalized for list performance).
  - name: principal
    type: Double
    description: Approved loan principal amount.
  - name: interestRate
    type: Double
    description: Annual interest rate as percentage (e.g. 15.0 = 15%).
  - name: status
    type: String
    description: Loan lifecycle status.
    values: [pending, approved, disbursed, repaid, defaulted, rejected, withdrawn]
  - name: disbursedOn
    type: { optional: String }
    required: false
    description: ISO date the loan was disbursed. Null until disbursement.
  - name: expectedMaturityDate
    type: { optional: String }
    required: false
    description: Expected full repayment date.
  - name: amountRepaid
    type: { optional: Double }
    required: false
    description: Total amount repaid to date.
  - name: amountOutstanding
    type: { optional: Double }
    required: false
    description: Remaining balance to be repaid.
  - name: loanProductName
    type: { optional: String }
    required: false
    description: Fineract loan product name (e.g. "Standard Group Loan").

used_by:
  - feature: loan-management
    kind: response
    api_id: get_loan
    role: single
    notes: Loan detail screen.
  - feature: loan-management
    kind: response
    api_id: list_all_groups
    role: array_item
    notes: Loan list screen renders name + status + principal + amountOutstanding.
  - feature: end-user-dashboard
    kind: response
    api_id: list_self_loans
    role: array_item
    notes: Personal loans for end-user self-service.

capabilities_used: [has_api, has_offline_cache, has_flow]
tier: critical
tags: [loan, fineract, admin, end_user, loan-management]
