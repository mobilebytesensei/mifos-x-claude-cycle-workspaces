name: ShareOutDto
version: "1.0.0"
description: >
  Share-out cycle distribution DTO for CommonPurse. Sourced from dt_share_out
  datatable attached to m_center. Records the group's annual/cycle share-out
  event: total pool, per-member distribution, and execution status.

source:
  origin: datatable
  endpoint: "GET /datatables/dt_share_out/{groupId}"
  table: dt_share_out
  attached_to: m_center

fields:
  - name: id
    type: Long
    description: Share-out record ID.
  - name: groupId
    type: Long
    description: Fineract Center ID.
  - name: cycleNumber
    type: Int
    description: Savings cycle number this share-out closes.
  - name: totalPool
    type: Double
    description: Total corpus fund to be distributed (savings + interest - loans outstanding).
  - name: status
    type: String
    description: Share-out lifecycle status.
    values: [draft, previewed, executed, cancelled]
  - name: distributionDate
    type: { optional: String }
    required: false
    description: ISO date the share-out was executed. Null until executed.
  - name: memberAllocations
    type: { optional: { list_of: ShareOutAllocation } }
    required: false
    description: Per-member allocation breakdown. Null until distribution calculated.

  # Nested allocation type
  - name: ShareOutAllocation
    type: nested
    fields:
      - { name: memberId, type: Long }
      - { name: memberName, type: String }
      - { name: shareAmount, type: Double }
      - { name: contributionPercentage, type: Double }
      - { name: deductions, type: Double }
      - { name: netShareOut, type: Double }

used_by:
  - feature: share-out
    kind: response
    api_id: list_share_outs
    role: array_item
    notes: Share-out history list.
  - feature: share-out
    kind: request_and_response
    api_id: record_share_out
    role: single
    notes: share-out-execute submits execution; share-out-preview reads preview.

capabilities_used: [has_api, has_flow]
tier: critical
tags: [share-out, distribution, datatable, fineract, share-out-feature]
