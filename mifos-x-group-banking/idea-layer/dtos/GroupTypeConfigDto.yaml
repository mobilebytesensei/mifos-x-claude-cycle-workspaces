name: GroupTypeConfigDto
version: "1.0.0"
description: >
  The 2-axis GroupTypeConfig registry DTO for CommonPurse. Every self-funded group is a
  point in a 2-axis space (Axis A pool_model × Axis B contribution_model), not a bespoke
  type — one config object supports them all, and adding a new type is a
  dt_group_type_config ROW, not code. Sourced from the dt_group_type_config datatable
  attached to m_group; entityId=0 returns the global seed catalogue (the 9 seeded types
  below). Group type is RUNTIME per-group config, never immutable-per-deployment.
  Authoritative source: ARCHITECTURE.md §4 (#group-type-registry) +
  API_CONTRACT.yaml#companion_get_group_type_configs (COMP-DT-003).

source:
  origin: datatable
  endpoint: "GET /companion/datatables/group_type_config/{entityId}"   # entityId=0 → global seed catalogue
  table: dt_group_type_config
  attached_to: m_group
  mcp_tool: companion_get_group_type_configs
  contract_ref: COMP-DT-003

fields:
  - name: slug
    type: String
    description: Stable identifier for the type row (e.g. "vsla", "rosca-tanda", "shg", "sacco").
  - name: displayName
    type: String
    description: Human-readable name shown in the group-type-picker screen.

  # ── AXIS A — pool disposition ────────────────────────────────────────
  - name: poolModel
    type: String
    description: >
      Axis A. ROTATING_PAYOUT = pot rotates to one member each period (ROSCA);
      ACCUMULATING = pool grows, lent internally, shared out at cycle end (VSLA/ASCA/SHG);
      NONE = no internal pool (JLG external borrowing).
    values: [ROTATING_PAYOUT, ACCUMULATING, NONE]
  - name: payoutOrderMethod
    type: String
    description: How the rotation recipient / payout order is decided (rotation groups).
    values: [FIXED_ORDER, LOTTERY, AUCTION, NEED_BASED, NA]
  - name: shareoutFormula
    type: String
    description: Distribution formula applied at share-out / payout.
    values: [NONE, PRORATA_SHARES, PRORATA_SAVINGS, EQUAL, INVESTMENT_PROPORTIONAL]
  - name: residualReturns
    type: String
    description: What residual returns (interest/investment) accrue to members.
    values: [NONE, INTEREST_ONLY, INVESTMENT_RETURNS]

  # ── AXIS B — contribution ────────────────────────────────────────────
  - name: contributionModel
    type: String
    description: >
      Axis B. FIXED_AMOUNT = flat amount per meeting; SHARE_BASED_VARIABLE = member buys
      1..N shares of share_value; FIXED_NEGOTIATED = fixed but group-negotiated.
    values: [FIXED_AMOUNT, SHARE_BASED_VARIABLE, FIXED_NEGOTIATED]
  - name: shareValue
    type: { optional: Double }
    required: false
    description: Money value of one share (SHARE_BASED_VARIABLE only). Null otherwise.
  - name: minSharesPerMeeting
    type: { optional: Int }
    required: false
    description: Minimum shares a member may buy per meeting. Null when not share-based.
  - name: maxSharesPerMeeting
    type: { optional: Int }
    required: false
    description: Maximum shares a member may buy per meeting. Null when not share-based.
  - name: contributionAmount
    type: { optional: Double }
    required: false
    description: Flat contribution amount per meeting (FIXED_AMOUNT). Null when share-based.

  # ── lending ──────────────────────────────────────────────────────────
  - name: internalLendingEnabled
    type: Boolean
    description: Whether the group lends its pool internally to members.
  - name: loanInterestModel
    type: String
    description: Interest model applied to internal loans.
    values: [NONE, FLAT, DECLINING, GROUP_SET, AUCTION_IMPLICIT]
  - name: loanMultiplierCap
    type: { optional: Double }
    required: false
    description: Max loan as multiple of member savings (e.g. 3.0 = 3× savings). Null if no cap.
  - name: loanMaxTermPeriods
    type: { optional: Int }
    required: false
    description: Maximum loan term in cycle periods. Null if unbounded.
  - name: externalLinkage
    type: String
    description: External capital linkage archetype.
    values: [NONE, BANK_LINKAGE, MFI_ONLENDING]
  - name: savingsToLoanRatio
    type: { optional: String }
    required: false
    description: Savings-to-loan ratio band (SHG grading, e.g. "1:1".."1:4"). Null otherwise.
  - name: jointLiability
    type: Boolean
    description: Whether members are jointly liable (JLG / solidarity group).
  - name: shareCapital
    type: Boolean
    description: Whether members hold share capital (SACCO / Credit Union).

  # ── social / welfare fund ────────────────────────────────────────────
  - name: socialFundEnabled
    type: Boolean
    description: Whether the group maintains a social / welfare fund.
  - name: socialFundContribution
    type: { optional: Double }
    required: false
    description: Per-member social-fund contribution per period. Null if no social fund.
  - name: welfareOnlyMode
    type: Boolean
    description: True for burial/welfare societies where the fund IS the purpose.
  - name: benefitWaitingPeriodDays
    type: { optional: Int }
    required: false
    description: Waiting period before a welfare benefit is claimable. Null unless welfare.

  # ── cycle & cadence ──────────────────────────────────────────────────
  - name: cycleModel
    type: String
    description: How the group's cycle is bounded.
    values: [FIXED_DURATION, N_MEMBERS_ROTATION, PERPETUAL_OPEN]
  - name: cycleLengthMonths
    type: { optional: Int }
    required: false
    description: Cycle length in months (FIXED_DURATION). Null for rotation/perpetual.
  - name: meetingCadence
    type: String
    description: Meeting frequency.
    values: [DAILY, WEEKLY, BIWEEKLY, MONTHLY]
  - name: meetingScheduleRule
    type: { optional: String }
    required: false
    description: Free-form schedule rule (e.g. "Every Monday 10:00"). Null if unset.

  # ── governance & discipline ──────────────────────────────────────────
  - name: groupSizeMin
    type: Int
    description: Minimum member count for this type.
  - name: groupSizeMax
    type: Int
    description: Maximum member count for this type.
  - name: managementCommittee
    type: Boolean
    description: Whether an elected management committee governs the group.
  - name: formality
    type: String
    description: Formality / registration level.
    values: [INFORMAL, SEMI_FORMAL, FORMAL_REGISTERED]
  - name: promoterRole
    type: String
    description: Who promotes/sponsors the group.
    values: [NONE, NGO_CARE, NGO_CRS, NGO_SHPI, MFI, COLLECTOR, FOREMAN]
  - name: penaltyRules
    type: { optional: { list_of: PenaltyRule } }
    required: false
    description: Per-reason penalty amounts (absence, late, minimum-share). Null if none.

  # Nested penalty rule type
  - name: PenaltyRule
    type: nested
    fields:
      - { name: reason, type: String }   # ABSENCE | LATE | MIN_SHARE
      - { name: amount, type: Double }

# ── Seeded types (9) — the global seed catalogue (entityId=0) ──────────
# Axis values sourced from ARCHITECTURE.md §4 seeded-types table.
seeded_types:
  - slug: rosca
    displayName: "ROSCA (chit / tanda / susu / tontine / hui / committee)"
    poolModel: ROTATING_PAYOUT
    contributionModel: FIXED_AMOUNT
    payoutOrderMethod: FIXED_ORDER      # also LOTTERY | AUCTION | NEED_BASED per variant
    shareoutFormula: NONE               # pot = contribution × members, rotated
    residualReturns: NONE
    internalLendingEnabled: false
    externalLinkage: NONE
    socialFundEnabled: false            # optional
    welfareOnlyMode: false
    cycleModel: N_MEMBERS_ROTATION
    formality: INFORMAL
    notes: >
      Pot = contribution × members, rotates to one member per period. Variants
      chit/bhishi (IN), tontine (W.Africa), susu (Ghana), tanda (MX), hui (CN),
      committee (PK) differ only by payout_order_method.

  - slug: asca
    displayName: "ASCA (Accumulating Savings & Credit Association)"
    poolModel: ACCUMULATING
    contributionModel: FIXED_AMOUNT     # FIXED or VARIABLE
    shareoutFormula: PRORATA_SAVINGS
    residualReturns: INTEREST_ONLY
    internalLendingEnabled: true
    loanInterestModel: GROUP_SET
    externalLinkage: NONE
    socialFundEnabled: false            # optional
    welfareOnlyMode: false
    cycleModel: FIXED_DURATION          # end-of-cycle or perpetual
    formality: INFORMAL
    notes: End-of-cycle or perpetual; needs bookkeeping. Lends internally at interest.

  - slug: vsla
    displayName: "VSLA (Village Savings & Loan Association — CARE)"
    poolModel: ACCUMULATING
    contributionModel: SHARE_BASED_VARIABLE
    shareoutFormula: PRORATA_SHARES
    residualReturns: INVESTMENT_RETURNS
    internalLendingEnabled: true
    loanInterestModel: FLAT
    loanMultiplierCap: 3.0              # ≤3× savings
    externalLinkage: NONE
    socialFundEnabled: true
    welfareOnlyMode: false
    cycleModel: FIXED_DURATION          # annual cycle
    cycleLengthMonths: 12
    formality: SEMI_FORMAL
    promoterRole: NGO_CARE
    notes: share_value, min/max shares per meeting, annual cycle, share-out pro-rata to shares.

  - slug: silc
    displayName: "SILC (Savings & Internal Lending Communities — CRS)"
    poolModel: ACCUMULATING
    contributionModel: SHARE_BASED_VARIABLE
    shareoutFormula: PRORATA_SHARES
    residualReturns: INVESTMENT_RETURNS
    internalLendingEnabled: true
    loanInterestModel: FLAT
    externalLinkage: NONE
    socialFundEnabled: true
    welfareOnlyMode: false
    cycleModel: FIXED_DURATION
    cycleLengthMonths: 12
    formality: SEMI_FORMAL
    promoterRole: NGO_CRS               # promoter = CRS
    notes: VSLA-equivalent methodology promoted by CRS.

  - slug: shg
    displayName: "SHG (Self-Help Group — India, bank-linked)"
    poolModel: ACCUMULATING
    contributionModel: FIXED_AMOUNT
    shareoutFormula: PRORATA_SAVINGS
    residualReturns: INTEREST_ONLY
    internalLendingEnabled: true
    loanInterestModel: GROUP_SET
    externalLinkage: BANK_LINKAGE      # + bank linkage
    savingsToLoanRatio: "1:4"           # 1:1..1:4, grading
    socialFundEnabled: true            # often
    welfareOnlyMode: false
    cycleModel: PERPETUAL_OPEN
    formality: SEMI_FORMAL             # → FORMAL via bank linkage
    promoterRole: NGO_SHPI
    notes: external_linkage=BANK_LINKAGE, savings_to_loan_ratio grading.

  - slug: sacco
    displayName: "SACCO / Credit Union (formal, registered)"
    poolModel: ACCUMULATING
    contributionModel: FIXED_AMOUNT     # + share capital
    shareoutFormula: PRORATA_SAVINGS
    residualReturns: INTEREST_ONLY
    internalLendingEnabled: true
    loanInterestModel: DECLINING
    externalLinkage: NONE
    shareCapital: true                  # share capital
    managementCommittee: true           # elected board
    socialFundEnabled: false            # optional
    welfareOnlyMode: false
    cycleModel: PERPETUAL_OPEN
    formality: FORMAL_REGISTERED        # legal status, regulated
    notes: share_capital, elected board, legal status, regulated.

  - slug: cbo
    displayName: "CBO / Village Banking (FINCA — MFI on-lending)"
    poolModel: ACCUMULATING
    contributionModel: FIXED_AMOUNT
    shareoutFormula: PRORATA_SAVINGS
    residualReturns: INTEREST_ONLY
    internalLendingEnabled: true        # MFI on-lending
    loanInterestModel: FLAT
    externalLinkage: MFI_ONLENDING      # external loan on-lent alongside internal savings
    socialFundEnabled: false            # optional
    welfareOnlyMode: false
    cycleModel: FIXED_DURATION
    formality: SEMI_FORMAL
    promoterRole: MFI
    notes: external_linkage=MFI_ONLENDING — external loan on-lent to members alongside internal savings.

  - slug: burial-welfare
    displayName: "Burial / Welfare Society"
    poolModel: ACCUMULATING             # welfare
    contributionModel: FIXED_AMOUNT
    shareoutFormula: NONE               # fund is not shared out — it IS the purpose
    residualReturns: NONE
    internalLendingEnabled: false
    externalLinkage: NONE
    socialFundEnabled: true             # fund IS the purpose
    welfareOnlyMode: true
    benefitWaitingPeriodDays: 90
    cycleModel: PERPETUAL_OPEN
    formality: INFORMAL
    notes: >
      welfare_only_mode=true, benefit_waiting_period_days. Can nest inside a VSLA as its
      social fund.

  - slug: jlg
    displayName: "JLG / Solidarity Group (Grameen — external borrowing)"
    poolModel: NONE                     # members borrow, no internal pool
    contributionModel: FIXED_AMOUNT     # minimal
    shareoutFormula: NONE
    residualReturns: NONE
    internalLendingEnabled: false       # external MFI loan
    externalLinkage: MFI_ONLENDING
    jointLiability: true                # mutual guarantee
    socialFundEnabled: false
    welfareOnlyMode: false
    groupSizeMin: 4
    groupSizeMax: 10                    # 4–10 members
    cycleModel: FIXED_DURATION
    formality: SEMI_FORMAL
    promoterRole: MFI
    notes: joint_liability=true, purpose=EXTERNAL_BORROWING; 4–10 members.

# New types (equb [ET], hagbad [SO], stokvel [ZA], chama [KE], kye [KR], …) are
# additional dt_group_type_config rows, not code.

used_by:
  - feature: group-management
    kind: response
    api_id: companion_get_group_type_configs
    role: array_item
    notes: Group-type-picker screen renders the full seeded catalogue for selection.
  - feature: group-management
    kind: response
    api_id: get_group_type_config
    role: single
    notes: Group creation resolves the chosen type's full 2-axis config.

capabilities_used: [has_api, has_offline_cache]
tier: critical
tags: [group-type, registry, 2-axis, pool-model, contribution-model, datatable, companion, self-signup, group-management]
