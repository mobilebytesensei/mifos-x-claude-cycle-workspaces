name: SyncQueueDto
version: "1.0.0"
description: >
  Offline sync queue DTO for CommonPurse. Represents a single pending operation
  that was captured offline and is queued for replay against the Fineract server
  when connectivity is restored. Sourced from dt_sync_metadata datatable.

source:
  origin: datatable
  endpoint: "GET /datatables/dt_sync_metadata/{groupId}"
  table: dt_sync_metadata
  attached_to: m_center

fields:
  - name: id
    type: Long
    description: Local sync queue entry ID.
  - name: entityType
    type: String
    description: Type of entity being synced.
    values: [savings_deposit, attendance_record, loan_repayment, loan_vote, meeting_record]
  - name: entityId
    type: { optional: Long }
    required: false
    description: Fineract ID of the target entity. Null for new entity creates.
  - name: operation
    type: String
    description: Operation to perform.
    values: [create, update, delete]
  - name: payload
    type: String
    description: JSON-serialized request body for the Fineract API call.
  - name: status
    type: String
    description: Current sync status.
    values: [pending, in_progress, completed, failed, conflict]
  - name: createdAt
    type: String
    description: ISO datetime when the operation was queued (offline timestamp).
  - name: syncAttempts
    type: { optional: Int }
    required: false
    description: Number of sync attempts. Used for exponential backoff.
  - name: lastError
    type: { optional: String }
    required: false
    description: Last error message from failed sync attempt. Null on success.

used_by:
  - feature: offline-sync
    kind: response
    api_id: get_sync_state
    role: array_item
    notes: sync-status screen shows pending operations list.
  - feature: offline-sync
    kind: request
    api_id: update_sync_state
    role: single
    notes: Background sync worker marks operations completed/failed.

capabilities_used: [has_api, has_offline_cache]
tier: critical
tags: [sync, offline, datatable, fineract, offline-sync]
