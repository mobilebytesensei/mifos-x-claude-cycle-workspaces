name: LoanRepaymentDto
version: "1.0.0"
description: >
  Fineract Loan Repayment transaction DTO for MifosSave. Records a payment
  made against a loan — either a full or partial repayment, or an interest/fee
  waiver. Used in loan-detail repayment history and loan-repayment-dialog.

source:
  origin: rest
  endpoint: "POST /loans/{loanId}/transactions?command=repayment"
  history_endpoint: "GET /loans/{loanId}/transactions"
  table: m_loan_transaction

fields:
  - name: id
    type: Long
    description: Fineract loan transaction ID.
  - name: loanId
    type: Long
    description: Parent Fineract Loan ID.
  - name: amount
    type: Double
    description: Repayment amount in loan currency.
  - name: date
    type: String
    description: ISO date the repayment was made (YYYY-MM-DD).
  - name: type
    type: String
    description: Transaction classification.
    values: [repayment, partial_repayment, waiver, fee_payment, interest_waiver]
  - name: currency
    type: String
    description: ISO 4217 currency code.
  - name: principalPortion
    type: { optional: Double }
    required: false
    description: Portion of repayment applied to principal.
  - name: interestPortion
    type: { optional: Double }
    required: false
    description: Portion of repayment applied to interest.
  - name: outstandingAfter
    type: { optional: Double }
    required: false
    description: Remaining loan balance after this repayment.

used_by:
  - feature: loan-management
    kind: request_and_response
    api_id: make_repayment
    role: single
    notes: loan-repayment-dialog submits this; response updates LoanDto.status.
  - feature: loan-management
    kind: response
    api_id: get_loan_hist
    role: array_item
    notes: Loan detail repayment history list.

capabilities_used: [has_api, has_flow]
tier: medium
tags: [loan, repayment, transaction, fineract, loan-management]
