name: MemberDto
version: "2.0.0"
description: >
  Canonical member (client) DTO for CommonPurse. Maps to Fineract's Client entity.
  Used across member-list, member-profile, member-add, and meeting attendance screens.
  Post self-signup pivot: there is no global admin/end_user auth tier — every user is a
  member, and capability is derived per-(member, group) from roleInGroup. A member can be
  an organizer of group A and a plain member of group B, so role is conceptually a
  per-(member, group) association sourced from dt_member_role (keyed by group_id) rather
  than a global attribute on the client.

source:
  origin: rest
  endpoint: "GET /clients/{clientId}"
  list_endpoint: "GET /groups/{groupId}/clients"
  table: m_client
  datatable: dt_member_role   # per-(member, group) role rows, keyed by group_id

fields:
  - name: id
    type: Long
    description: Fineract Client ID.
  - name: displayName
    type: String
    description: Full display name (firstName + lastName).
  - name: mobileNo
    type: { optional: String }
    required: false
    description: Primary mobile number. Null if not captured.
  - name: imageId
    type: { optional: Long }
    required: false
    description: Fineract document ID for member photo. Null if no photo uploaded.
  - name: groupId
    type: { optional: Long }
    required: false
    description: >
      Group (Center) this (member, role) association is scoped to. roleInGroup is
      per-(member, group) — the same member may hold different roles in different groups.
      Null in a group-agnostic member context (e.g. global profile).
  - name: roleInGroup
    type: String
    description: >
      Role this member holds WITHIN a specific group (from dt_member_role.role, keyed by
      group_id). Governance capability is derived from this per-group role, not a global
      admin/end_user tier. `organizer` is the self-signup group creator/steward.
    values: [organizer, treasurer, chairperson, secretary, member]
  - name: status
    type: String
    description: Fineract client status.
    values: [active, inactive, pending, closed]
  - name: savingsAccountId
    type: { optional: Long }
    required: false
    description: Linked group savings account ID. Null before account opening.
  - name: joinedDate
    type: { optional: String }
    required: false
    description: ISO date member joined the group.

used_by:
  - feature: member-onboarding
    kind: response
    api_id: search_clients
    role: array_item
    notes: Member list renders displayName + roleInGroup + status.
  - feature: member-onboarding
    kind: response
    api_id: get_client
    role: single
    notes: Member profile loads full MemberDto.
  - feature: meeting-lifecycle
    kind: response
    api_id: list_attendance
    role: array_item
    notes: Meeting attendance uses displayName + roleInGroup.

capabilities_used: [has_api, has_offline_cache]
tier: critical
tags: [member, client, fineract, self-signup, per-group-role, shared]
