name: LoanVoteDto
version: "1.0.0"
description: >
  Loan approval voting DTO for MifosSave. Sourced from dt_loan_vote datatable
  attached to m_loan. Records each member's democratic vote on a loan application
  plus the chairperson's approval gate. Quorum check happens client-side using
  groupConfig.memberCount.

source:
  origin: datatable
  endpoint: "GET /datatables/dt_loan_vote/{loanId}"
  write_endpoint: "POST /datatables/dt_loan_vote/{loanId}"
  table: dt_loan_vote
  attached_to: m_loan

fields:
  - name: loanId
    type: Long
    description: Fineract Loan ID this vote is attached to.
  - name: memberId
    type: Long
    description: Fineract client ID of the voting member.
  - name: memberName
    type: String
    description: Voter display name (denormalized for display).
  - name: vote
    type: String
    description: Member's vote on the loan application.
    values: [for, against, abstain]
  - name: chairpersonApproval
    type: { optional: Boolean }
    required: false
    description: Chairperson override approval. Null until chairperson acts.
  - name: votedAt
    type: String
    description: ISO datetime when vote was cast.
  - name: notes
    type: { optional: String }
    required: false
    description: Optional notes from the voter or chairperson.

used_by:
  - feature: loan-management
    kind: request_and_response
    api_id: record_loan_vote
    role: single
    notes: Meeting conduct loan-votes step submits votes; loan-apply shows tally.
  - feature: loan-management
    kind: response
    api_id: get_loan_vote
    role: array_item
    notes: Loan detail screen shows vote breakdown before disbursement.

capabilities_used: [has_api, has_flow]
tier: medium
tags: [loan, vote, datatable, fineract, loan-management]
