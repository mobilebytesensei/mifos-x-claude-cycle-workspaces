name: AttendanceRecordDto
version: "1.0.0"
description: >
  Per-member attendance record DTO for CommonPurse. Sourced from dt_meeting_attendance
  custom datatable attached to m_client. Records presence/absence/lateness and
  any associated fine for each member in a given meeting.

source:
  origin: datatable
  endpoint: "GET /datatables/dt_meeting_attendance/{clientId}?genericResultSet=true"
  write_endpoint: "POST /datatables/dt_meeting_attendance/{clientId}"
  table: dt_meeting_attendance
  attached_to: m_client

fields:
  - name: meetingId
    type: Long
    description: Reference to dt_meeting_record row ID.
  - name: memberId
    type: Long
    description: Fineract client ID.
  - name: memberName
    type: String
    description: Member display name (denormalized for display performance).
  - name: present
    type: Boolean
    description: True if member attended the meeting.
  - name: late
    type: Boolean
    description: True if member arrived late (may still incur fine).
  - name: fineAmount
    type: { optional: Double }
    required: false
    description: Fine amount levied for absence or lateness. Null if no fine.
  - name: finePaid
    type: { optional: Boolean }
    required: false
    description: Whether the fine was collected during this meeting.

used_by:
  - feature: meeting-lifecycle
    kind: request_and_response
    api_id: record_attendance
    role: array_item
    notes: Meeting conduct attendance step creates/updates these records.
  - feature: fines-tracking
    kind: response
    api_id: list_attendance
    role: array_item
    notes: Fine tracking reads attendance records with fineAmount > 0.

capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [attendance, meeting, datatable, fineract, fines-tracking]
