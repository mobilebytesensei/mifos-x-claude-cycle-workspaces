name: SavingsTransactionDto
version: "1.0.0"
description: >
  Fineract SavingsAccount transaction DTO for MifosSave. Covers both deposit
  (group savings collection during meetings) and withdrawal transactions.
  Used in savings-dashboard, member-savings-detail, and personal-savings screens.

source:
  origin: rest
  endpoint: "GET /savingsaccounts/{accountId}/transactions"
  table: m_savings_transaction

fields:
  - name: id
    type: Long
    description: Fineract savings transaction ID.
  - name: memberId
    type: Long
    description: Fineract client ID of the member this transaction belongs to.
  - name: savingsAccountId
    type: Long
    description: Fineract savings account ID.
  - name: amount
    type: Double
    description: Transaction amount in account currency.
  - name: transactionType
    type: String
    description: Direction of the transaction.
    values: [deposit, withdrawal, interest_posting, fee_deduction]
  - name: date
    type: String
    description: ISO date of the transaction (YYYY-MM-DD).
  - name: currency
    type: String
    description: ISO 4217 currency code (e.g. KES, USD, INR).
  - name: runningBalance
    type: { optional: Double }
    required: false
    description: Account balance after this transaction. Null for older records.
  - name: note
    type: { optional: String }
    required: false
    description: Optional transaction note or reference.

used_by:
  - feature: savings-collection
    kind: response
    api_id: get_savings_txns
    role: array_item
    notes: Savings dashboard transaction history.
  - feature: member-onboarding
    kind: response
    api_id: get_savings
    role: array_item
    notes: Member savings detail screen.
  - feature: end-user-dashboard
    kind: response
    api_id: list_self_savings
    role: array_item
    notes: Personal savings screen for end users.

capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [savings, transaction, fineract, deposit, withdrawal]
