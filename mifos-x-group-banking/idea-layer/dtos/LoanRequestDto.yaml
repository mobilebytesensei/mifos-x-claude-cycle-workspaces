name: LoanRequestDto
version: "1.0.0"
description: >
  End-user loan request DTO for CommonPurse. Sourced from dt_loan_request datatable
  attached to m_client. End users (group members) submit loan requests via the
  self-service app; admins review and create formal Fineract loan applications
  at the next meeting.

source:
  origin: datatable
  endpoint: "GET /datatables/dt_loan_request/{clientId}"
  write_endpoint: "POST /datatables/dt_loan_request/{clientId}"
  table: dt_loan_request
  attached_to: m_client

fields:
  - name: id
    type: Long
    description: Loan request record ID.
  - name: clientId
    type: Long
    description: Fineract client ID of the requesting member.
  - name: requestedAmount
    type: Double
    description: Amount requested by the member.
  - name: purpose
    type: String
    description: Stated purpose for the loan (e.g. "School fees", "Business stock").
  - name: status
    type: String
    description: Request processing status.
    values: [submitted, under_review, approved_for_meeting, rejected, converted_to_loan]
  - name: submittedAt
    type: String
    description: ISO datetime when request was submitted.
  - name: reviewedAt
    type: { optional: String }
    required: false
    description: ISO datetime when admin reviewed the request.
  - name: convertedLoanId
    type: { optional: Long }
    required: false
    description: Fineract Loan ID after admin converts request to formal application.
  - name: adminNotes
    type: { optional: String }
    required: false
    description: Admin review notes. Null until reviewed.

used_by:
  - feature: end-user-dashboard
    kind: request
    api_id: submit_loan_request
    role: single
    notes: personal-loans loan-request screen submits this DTO.
  - feature: loan-management
    kind: response
    api_id: list_loan_requests
    role: array_item
    notes: Admin reviews pending loan requests before meeting.

capabilities_used: [has_api, has_offline_cache]
tier: medium
tags: [loan-request, end-user, datatable, fineract, end-user-dashboard]
