name: GroupDto
version: "2.0.0"
description: >
  Canonical lightweight group (center) DTO for MifosSave. Maps to Fineract's Center
  entity. Used across group-list, group-dashboard, admin-dashboard, and meeting screens.
  Consumers that need richer shapes (corpus details, meeting summary) compose/extend
  via GroupConfigDto and MeetingDto.

source:
  origin: rest
  endpoint: "GET /centers/{centerId}"
  list_endpoint: "GET /centers?staffId={staffId}&orderBy=name"
  table: m_center

fields:
  - name: id
    type: Long
    description: Fineract Center ID.
  - name: name
    type: String
    description: Group/center display name.
  - name: groupTypeSlug
    type: { optional: String }
    required: false
    description: >
      Reference to the group's GroupTypeConfig row (see GroupTypeConfigDto.slug) — the
      chosen self-funded group archetype (e.g. "vsla", "rosca-tanda", "shg", "sacco").
      Resolves to the full 2-axis config in dt_group_type_config. Null until a type is
      picked at group creation.
  - name: poolModel
    type: { optional: String }
    required: false
    description: >
      Axis A (pool disposition) denormalized from the group's GroupTypeConfig for quick
      list/dashboard rendering. Null until group_type is chosen.
    values: [ROTATING_PAYOUT, ACCUMULATING, NONE]
  - name: contributionModel
    type: { optional: String }
    required: false
    description: >
      Axis B (contribution) denormalized from the group's GroupTypeConfig. Null until
      group_type is chosen.
    values: [FIXED, SHARE_BASED_VARIABLE]
  - name: cycleNumber
    type: Int
    description: Current savings cycle number (from dt_group_config).
  - name: corpusBalance
    type: { optional: Double }
    required: false
    description: Running corpus fund balance (from dt_group_corpus). Null when not loaded.
  - name: memberCount
    type: Int
    description: Active member count for this group.
  - name: status
    type: String
    description: Fineract center status (active/inactive/pending).
    values: [active, inactive, pending]
  - name: officeId
    type: Long
    description: Fineract office ID — used to scope staff access.
  - name: nextMeetingDate
    type: { optional: String }
    required: false
    description: ISO date of next scheduled meeting. Null if no meeting scheduled.
  - name: staffId
    type: { optional: Long }
    required: false
    description: Assigned field officer staff ID. Null for self-managed groups.

used_by:
  - feature: group-management
    kind: response
    api_id: list_all_groups
    role: array_item
    notes: Group list screen renders name + memberCount + corpusBalance + status.
  - feature: group-management
    kind: response
    api_id: get_group
    role: single
    notes: Group dashboard consumes full GroupDto + GroupConfigDto for detail.
  - feature: authentication
    kind: response
    api_id: get_center
    role: single
    notes: Admin dashboard loads group context post-login.

capabilities_used: [has_api, has_offline_cache]
tier: critical
tags: [group, center, fineract, group-type, self-signup, shared]
