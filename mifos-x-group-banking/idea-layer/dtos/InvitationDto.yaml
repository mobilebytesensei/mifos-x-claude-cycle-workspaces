name: InvitationDto
version: "1.0.0"
description: >
  Group invitation token DTO for CommonPurse's self-signup flow (FR-024). An organizer
  invites a person into a group via a server-generated 6-char alphanumeric token + a
  deep-link invite URL, pre-assigning the role the invitee will hold in that group. The
  invitee validates the token, then accepts — which associates their client to the group
  with the pre-assigned role and marks the token consumed. Backed by the
  dt_companion_invitations datatable on m_group. Lifecycle: create → list (pending) →
  validate → accept → revoke.
  Authoritative source: idea-plan.yaml §requirements FR-024 +
  API_CONTRACT.yaml companion_create_invitation..companion_revoke_invite (COMP-DT-001..005).

source:
  origin: datatable
  endpoint: "GET /companion/datatables/invitations/{entityId}"   # entityId = 6-char token (validate)
  list_endpoint: "GET /companion/datatables/invitations/{groupId}"  # pending invites for a group
  create_endpoint: "POST /companion/datatables/invitations/{groupId}"
  accept_endpoint: "PUT /companion/datatables/invitations/{entityId}/{rowId}"
  revoke_endpoint: "DELETE /companion/datatables/invitations/{groupId}/{rowId}"
  table: dt_companion_invitations
  attached_to: m_group
  contract_ref: COMP-DT-001..COMP-DT-005

fields:
  - name: rowId
    type: { optional: Long }
    required: false
    description: Datatable row id for this invitation (returned on create; used for accept/revoke).
  - name: token
    type: String
    description: Server-generated 6-char alphanumeric invite code. Also embedded in inviteLink.
  - name: inviteLink
    type: { optional: String }
    required: false
    description: Deep-link URL carrying the token (returned on create). Null when reading a row.
  - name: groupId
    type: Long
    description: Group (m_group / Center) the invitee will join.
  - name: inviterClientId
    type: Long
    description: Fineract Client ID of the organizer who created the invite.
  - name: invitedEmailPhone
    type: String
    description: Email or phone the invite was addressed to.
  - name: roleToAssign
    type: String
    description: >
      Role the invitee will hold in the group once accepted (mirrors MemberDto.roleInGroup,
      minus organizer — the organizer is the inviter, not the invitee).
    values: [member, treasurer, secretary, chairperson]
  - name: status
    type: String
    description: >
      Derived lifecycle status. pending = accepted_at null and not past expiresAt;
      accepted = accepted_at set; expired = past expiresAt and unaccepted;
      revoked = row deleted by organizer.
    values: [pending, accepted, expired, revoked]
  - name: expiresAt
    type: String
    description: ISO-8601 datetime after which the token can no longer be accepted.
  - name: acceptedAt
    type: { optional: String }
    required: false
    description: ISO-8601 datetime the invite was consumed. Null while pending.

used_by:
  - feature: member-onboarding
    kind: request_and_response
    api_id: companion_create_invitation
    role: single
    notes: Organizer creates an invite; response carries token + inviteLink + rowId.
  - feature: member-onboarding
    kind: response
    api_id: companion_list_pending_invites
    role: array_item
    notes: Pending-invites list shows invitedEmailPhone + roleToAssign + expiresAt.
  - feature: authentication
    kind: response
    api_id: companion_validate_invite_token
    role: single
    notes: Self-signup validates the token before showing the accept screen.
  - feature: member-onboarding
    kind: request_and_response
    api_id: companion_mark_invitation_accepted
    role: single
    notes: Accept sets acceptedAt after associate-client-to-group succeeds.
  - feature: member-onboarding
    kind: request
    api_id: companion_revoke_invite
    role: single
    notes: Organizer revokes a pending invite by deleting its row.

capabilities_used: [has_api, has_flow]
tier: critical
tags: [invitation, invite-token, self-signup, deep-link, datatable, companion, member-onboarding]
