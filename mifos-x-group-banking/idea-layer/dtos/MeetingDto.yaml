name: MeetingDto
version: "1.0.0"
description: >
  Per-meeting summary DTO for MifosSave. Sourced from dt_meeting_record custom
  datatable attached to m_group. Captures the financial summary of a completed
  or in-progress meeting: attendance headcount, savings collected, loan votes,
  and opening/closing corpus balance.

source:
  origin: datatable
  endpoint: "GET /datatables/dt_meeting_record/{groupId}"
  table: dt_meeting_record
  attached_to: m_group

fields:
  - name: id
    type: Long
    description: Meeting record ID (datatable row ID).
  - name: groupId
    type: Long
    description: Fineract Group ID this meeting belongs to.
  - name: meetingNumber
    type: Int
    description: Sequential meeting number within the current cycle.
  - name: date
    type: String
    description: ISO date of the meeting (YYYY-MM-DD).
  - name: attendanceCount
    type: Int
    description: Number of members present or late.
  - name: totalCollected
    type: Double
    description: Total savings deposited during this meeting.
  - name: openingBalance
    type: Double
    description: Corpus fund balance at meeting start.
  - name: closingBalance
    type: Double
    description: Corpus fund balance after all transactions were recorded.
  - name: totalFinesCollected
    type: { optional: Double }
    required: false
    description: Total fines collected from late members.
  - name: loansDisbursed
    type: { optional: Double }
    required: false
    description: Total loan amounts disbursed during this meeting.
  - name: status
    type: String
    description: Meeting status.
    values: [in_progress, completed, cancelled]

used_by:
  - feature: meeting-lifecycle
    kind: response
    api_id: list_meetings
    role: array_item
    notes: Meeting calendar shows date + meetingNumber + status.
  - feature: meeting-lifecycle
    kind: response
    api_id: record_meeting
    role: single
    notes: Meeting summary screen renders full MeetingDto post-completion.

capabilities_used: [has_api, has_offline_cache, has_flow]
tier: critical
tags: [meeting, datatable, fineract, admin, meeting-lifecycle]
