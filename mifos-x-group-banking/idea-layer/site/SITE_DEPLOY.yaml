# SITE_DEPLOY.yaml — MifosSave product website deploy record (idea-layer SoT).
# Consumed by /idea-site deploy (core/scripts/idea-site-deploy.sh) to re-publish to the same site.
version: 1

netlify:
  site_name: mifossave                 # → https://mifossave.netlify.app
  site_id: "8939b862-d935-448c-bef5-f8cdcec2db5e"
  account_slug: mobileapptech
  auth_token_alias: netlify_auth_token  # vault: mifos-x-netlify-auth-token (org-shared)
  sso_login: false                      # cleared team-default SSO so the site is public
  dns_provider: netlify                 # subdomain only; no custom domain yet

domains:
  - domain: mifossave.netlify.app
    url: https://mifossave.netlify.app
    status: primary

content:
  # This deploy is the comprehensive single-page product site authored from the idea-layer
  # (IDEA.md value-prop, FEATURES.md 24 features, server/apis 10 surfaces, testers/ROSTER demo users).
  # Source artifact: idea-layer/site/index.html  →  published as the site root (public/index.html).
  source: index.html
  sections:
    - full API documentation (10 surfaces + companion COMP-* tools)
    - product / feature documentation (24 features, epic-grouped)
    - demo access (personas + mifos-bank-2 test credentials + Demo Explore)
    - Mifos-X / Apache Fineract foundation

history:
  - date: "2026-08-05"
    version: "2026.7.5"
    action: initial-deploy
    result: live · HTTP 200 · SSL
    note: >-
      First MifosSave marketing/docs site. Deployed via npx netlify-cli to the mobileapptech
      Netlify team; team-default SSO protection cleared (401 → 200) to make it public.
