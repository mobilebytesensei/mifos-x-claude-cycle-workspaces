# SITE_DEPLOY.yaml — MifosSave product website deploy record (idea-layer SoT).
# Consumed by /idea-site deploy (core/scripts/idea-site-deploy.sh) to re-publish to the same site.
# This IS the site: idea-layer/site/ is the deploy root — as the product grows (new features in
# FEATURES.md, new APIs in server/api_manifest.yaml, new journeys/), re-author the pages from those
# sources (Claude Intelligence, RULE-CI-001) and re-deploy to the same Cloudflare Pages project.
schema_version: 2
project: mifos-x-group-banking
provider: cloudflare-pages

cloudflare:
  project_name: mifossave                          # CF Pages project (auto-created on first deploy-prod)
  api_token_alias:  mifos-x-cloudflare-api-token    # vault alias (verified-resolvable; env CLOUDFLARE_PAGES_API_TOKEN)
  account_id_alias: mifos-x-cloudflare-account-id   # vault alias (verified-resolvable; env CLOUDFLARE_ACCOUNT_ID)

# Prod domain is RESOLVED from the bound workspace at deploy time (deterministic, not stored):
#   mifos-x  → mifossave.pages.dev   (Cloudflare-provided; no custom domain, no DNS step)
#   (mbs projects would resolve to <project>.mobilebytesensei.com via Wix CNAME)
deploy_dir: .                                        # idea-layer/site/ is the deploy root (hand-authored multi-page static)

domains:
  - domain: mifossave.pages.dev
    url: https://mifossave.pages.dev
    status: primary

# Multi-route static site (real routes, not a SPA). Shared assets/ (styles.css + logo.svg).
routes:
  - { path: "/",              file: "index.html",    title: "Home — hero, download buttons, feature docs" }
  - { path: "/api.html",      file: "api.html",      title: "API Docs — 51 endpoints + 21 datatables (via /mifos-bridge)" }
  - { path: "/journeys.html", file: "journeys.html", title: "User Journeys — 15 E2E journeys + demo access" }
  - { path: "/screens.html",  file: "screens.html",  title: "App Screens — 31 designed mockups (phone-framed gallery)" }
  - { path: "/privacy.html",  file: "privacy.html",  title: "Privacy Policy" }
  - { path: "/terms.html",    file: "terms.html",    title: "Terms of Service" }

assets:
  - assets/styles.css                   # shared design system (light/dark, theme toggle)
  - assets/logo.svg                     # branding — logo_dark.svg (VSLA ring, M3 green + amber)
  - assets/mockups/                     # 31 app screen mockups (primary content state per screen)

content_sources:                        # where each page's content is derived from (for regen as we grow)
  home:      [idea-layer/IDEA.md, idea-layer/FEATURES.md]
  api:       [idea-layer/server/api_manifest.yaml, idea-layer/server/apis/*.yaml]  # 51 endpoints, 21 datatables
  journeys:  [idea-layer/journeys/INDEX.md, idea-layer/journeys/*.yaml, idea-layer/testers/ROSTER.yaml]
  screens:   [idea-layer/mockups/*/stitch/*content*/screen.png]  # primary content mockup per screen → assets/mockups/

# regen — the deterministic recipe `/idea-site update` follows (Claude Intelligence, RULE-CI-001).
# Per route: `sources` = idea-layer files to READ; `regenerate` = the ONLY data regions on that page to
# re-author from those sources. Everything else on the page (design, branding, hand-owned copy) is preserved.
# Run: `/idea-site update` → re-author these regions from current sources → STEP 3.CUSTOM deploy → verify live.
regen:
  index.html:
    sources: [idea-layer/IDEA.md, idea-layer/FEATURES.md, idea-layer/server/api_manifest.yaml]
    regenerate:
      - feature-docs cards (epic-grouped, from FEATURES.md)
      - hero chips (feature/journey/endpoint counts)
      - download buttons (from download_channels below)
  api.html:
    sources: [idea-layer/server/api_manifest.yaml, idea-layer/server/apis/*.yaml]
    regenerate:
      - hero chips (endpoint totals, companion count, datatable count — from api_manifest)
      - endpoint-group cards (from api_manifest#endpoint_groups)
      - companion BFF table (COMP-* rows)
      - full endpoint reference table (group·method+path·mcp_tool·used_by_screen, from apis/*.yaml endpoints[])
      - "JSON contracts" schema cards (request_body + response per endpoint, from apis/*.yaml)
      - "Datatable connection flows" cards (datatables grouped by attached_to parent m_group/m_client/m_loan)
      - 21-datatable table (name/attached_to/purpose/columns — from api_manifest#datatables)
  journeys.html:
    sources: [idea-layer/journeys/INDEX.md, idea-layer/journeys/*.yaml, idea-layer/testers/ROSTER.yaml, server-layer/migrations/seed-demo/demo-fixture.json]
    regenerate:
      - hero chips (journey counts by tier)
      - critical + medium journey rows (name/desc/persona/entry→exit flow, from journeys/*.yaml)
      - demo-user roster table (member/role/username/password/what-to-try, from demo-fixture.json + ROSTER.yaml)
      - persona cards (from ROSTER.yaml personas)
  screens.html:
    sources: [idea-layer/screens/*/preview/content.html, idea-layer/mockups/*/stitch/*/code.html]
    regenerate:
      # HIGH-RES: render each screen's HTML at 3x device scale (NOT the 188px stitch thumbnails) →
      # crisp 1170×2532 phone shots. Prefer screens/{screen}/preview/content.html (MifosSave-branded
      # Compose previews); fall back to mockups/{screen}/stitch/*content*/code.html. Once the app is
      # device-verified, replace with REAL on-device screenshots (highest fidelity).
      - render best HTML per screen (viewport 390×844, deviceScaleFactor 3) → assets/mockups/{screen}.png
      - grouped phone-framed gallery (onboarding · groups · meetings · members · savings · loans · share-out · system)
      - .phone frame aspect-ratio matches the render (390/844); hero chip = screen count

download_channels:
  - channel: firebase       status: live         url: https://appdistribution.firebase.dev/i/9684718389eb08ef
  - channel: testflight     status: live         url: https://testflight.apple.com/join/sgvRYhbU   # iOS external public TestFlight link
  - channel: google_play    status: coming_soon
  - channel: app_store      status: coming_soon

