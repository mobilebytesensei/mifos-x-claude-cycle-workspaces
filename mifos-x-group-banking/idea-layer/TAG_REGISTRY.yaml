# Analytics event registry — trackable events across the unified self-signup graph.
# Used by AnalyticsHelper.kt to validate event names at compile time.

tags:
  # Unified auth (self-signup) — single login-signup screen, role auto-resolved per group
  - event: auth_signup_started
    screen: login-signup
    feature: unified-auth
    params: []

  - event: auth_signup_completed
    screen: login-signup
    feature: unified-auth
    params: [is_organizer_default]           # self-signup defaults new user to organizer

  - event: auth_login_attempted
    screen: login-signup
    feature: unified-auth
    params: [has_biometric]

  - event: auth_login_success
    screen: login-signup
    feature: unified-auth
    params: [resolved_group_count, has_organizer_role]   # capabilities auto-resolved per group

  - event: auth_login_failed
    screen: login-signup
    feature: unified-auth
    params: [error_code]

  - event: auth_zero_group_empty_state_shown
    screen: login-signup
    feature: unified-auth
    params: []                                # "create first group / join with code"

  # Self-signup organizer + group-type-config
  - event: organizer_dashboard_viewed
    screen: organizer-dashboard
    feature: self-signup-organizer
    params: [group_count, active_group_id]

  - event: group_type_picker_opened
    screen: group-type-picker
    feature: group-type-config
    params: []

  - event: group_type_selected
    screen: group-type-picker
    feature: group-type-config
    params: [pool_model, contribution_model, seeded_type]  # e.g. ROTATING_PAYOUT/FIXED, VSLA

  # Member invitations
  - event: member_invite_created
    screen: member-invite
    feature: member-invitations
    params: [group_id, role_to_assign, expires_at]

  - event: member_invite_shared
    screen: member-invite
    feature: member-invitations
    params: [group_id, channel]              # channel: link|sms|copy

  - event: join_with_code_entered
    screen: join-with-code
    feature: member-invitations
    params: [code_present]

  - event: join_with_code_accepted
    screen: join-with-code
    feature: member-invitations
    params: [group_id, role_assigned]

  - event: join_with_code_invalid
    screen: join-with-code
    feature: member-invitations
    params: [reason]                         # reason: expired|not_found|already_member

  # Group management
  - event: group_list_viewed
    screen: group-list
    feature: group-management
    params: [group_count]

  - event: group_dashboard_viewed
    screen: group-dashboard
    feature: group-management
    params: [group_id, corpus_balance, member_count]

  - event: group_create_started
    screen: group-create
    feature: group-management
    params: []

  - event: group_create_completed
    screen: group-create
    feature: group-management
    params: [group_id, group_type, cycle_length_weeks, contribution_amount]

  - event: corpus_block_shown
    screen: group-dashboard
    feature: corpus-tracking
    params: [group_id, corpus_balance, threshold]

  # Member management
  - event: member_list_viewed
    screen: member-list
    feature: member-onboarding
    params: [group_id, member_count]

  - event: member_add_started
    screen: member-add
    feature: member-onboarding
    params: [group_id]

  - event: member_add_completed
    screen: member-add
    feature: member-onboarding
    params: [group_id, client_id]

  - event: member_photo_captured
    screen: member-add
    feature: member-onboarding
    params: [group_id, source]                 # source: camera | gallery

  - event: member_role_selected
    screen: member-add
    feature: member-onboarding
    params: [group_id, role]                   # role: chairperson|treasurer|secretary|member

  - event: member_creation_queued
    screen: member-add
    feature: member-onboarding
    params: [group_id]

  - event: member_profile_viewed
    screen: member-profile
    feature: member-onboarding
    params: [group_id, client_id, role]

  # Meeting lifecycle
  - event: meeting_calendar_viewed
    screen: meeting-calendar
    feature: meeting-lifecycle
    params: [group_id, view_mode, upcoming_count]   # view_mode: list|calendar

  - event: meeting_start_initiated
    screen: meeting-calendar
    feature: meeting-lifecycle
    params: [group_id, scheduled_meeting_number]

  - event: past_meeting_opened
    screen: meeting-calendar
    feature: meeting-lifecycle
    params: [group_id, meeting_number]

  - event: meeting_started
    screen: meeting-conduct
    feature: meeting-lifecycle
    params: [group_id, meeting_number, opening_balance]

  - event: meeting_step_completed
    screen: meeting-conduct
    feature: meeting-lifecycle
    params: [group_id, step_number, step_name]

  - event: meeting_attendance_recorded
    screen: meeting-conduct
    feature: meeting-lifecycle
    params: [group_id, present_count, absent_count, late_count]

  - event: meeting_closed
    screen: meeting-summary
    feature: meeting-lifecycle
    params: [group_id, meeting_number, closing_balance, total_collected, total_disbursed]

  - event: previous_meeting_reviewed
    screen: previous-meeting-review
    feature: meeting-lifecycle
    params: [group_id, prev_meeting_number]

  # Savings
  - event: savings_collected
    screen: meeting-conduct
    feature: savings-collection
    params: [group_id, total_savings_collected, member_count]

  - event: savings_dashboard_viewed
    screen: savings-dashboard
    feature: savings-collection
    params: [group_id, group_balance, individual_balance]

  - event: member_savings_detail_viewed
    screen: member-savings-detail
    feature: savings-collection
    params: [group_id, member_id, contribution_model, savings_balance]   # contribution_model: SHARE_BASED_VARIABLE|FIXED_AMOUNT|FIXED_NEGOTIATED

  - event: savings_transaction_filtered
    screen: member-savings-detail
    feature: savings-collection
    params: [group_id, member_id, filter]   # filter: all|deposits|withdrawals

  - event: savings_transaction_opened
    screen: member-savings-detail
    feature: savings-collection
    params: [group_id, member_id, transaction_id]

  # Loans
  - event: loan_list_viewed
    screen: loan-list
    feature: loan-management
    params: [group_id, active_loan_count]

  - event: loan_apply_started
    screen: loan-apply
    feature: loan-management
    params: [group_id, member_id]

  - event: loan_apply_submitted
    screen: loan-apply
    feature: loan-management
    params: [group_id, member_id, amount, term_weeks]

  - event: loan_detail_viewed
    screen: loan-detail
    feature: loan-management
    params: [group_id, loan_id, status]

  - event: loan_vote_cast
    screen: meeting-conduct
    feature: loan-management
    params: [group_id, loan_id, vote]

  - event: loan_approved
    screen: meeting-conduct
    feature: loan-management
    params: [group_id, loan_id, amount]

  - event: loan_rejected
    screen: meeting-conduct
    feature: loan-management
    params: [group_id, loan_id, reason]

  - event: loan_repayment_recorded
    screen: loan-repayment-dialog
    feature: loan-management
    params: [group_id, loan_id, amount_paid]

  - event: loan_marked_defaulted
    screen: loan-mark-defaulted-dialog
    feature: loan-management
    params: [group_id, loan_id]

  # Corpus
  - event: corpus_outflow_blocked
    screen: meeting-conduct
    feature: corpus-tracking
    params: [group_id, requested_amount, available_amount]

  # Share-out (pluggable distribution)
  - event: share_out_preview_viewed
    screen: share-out-preview
    feature: share-out
    params: [group_id, total_pool, member_count, distribution_strategy]  # pro-rata|rotation|auction

  - event: share_out_executed
    screen: share-out-execute
    feature: share-out
    params: [group_id, total_pool, cycle_number, distribution_strategy]

  # Member surface (end-user-dashboard)
  - event: personal_dashboard_viewed
    screen: personal-dashboard
    feature: end-user-dashboard
    params: [client_id, savings_balance, has_active_loan]

  - event: personal_savings_viewed
    screen: personal-savings
    feature: end-user-dashboard
    params: [client_id, savings_balance]

  - event: personal_loans_viewed
    screen: personal-loans
    feature: end-user-dashboard
    params: [client_id, active_loan_count]

  - event: loan_request_submitted
    screen: loan-request
    feature: end-user-dashboard
    params: [client_id, amount, purpose]

  # Offline sync
  - event: sync_started
    screen: sync-status
    feature: offline-sync
    params: [pending_count]

  - event: sync_completed
    screen: sync-status
    feature: offline-sync
    params: [synced_count, conflict_count, duration_ms]

  - event: sync_conflict_shown
    screen: sync-status
    feature: offline-sync
    params: [conflict_count]

  # Platform / multi-language / settings
  - event: settings_language_changed
    screen: settings
    feature: multi-language
    params: [from_language, to_language]

  - event: settings_theme_changed
    screen: settings
    feature: multi-language
    params: [theme]                            # theme: system|light|dark

  - event: settings_biometric_toggled
    screen: settings
    feature: multi-language
    params: [enabled]

  - event: settings_logout_tapped
    screen: settings
    feature: multi-language
    params: []

  - event: settings_logout_confirmed
    screen: settings-logout-dialog
    feature: multi-language
    params: []

  # Field officer (v1.1 supervisory tier — demoted)
  - event: field_officer_dashboard_viewed
    screen: field-officer-dashboard
    feature: field-officer-view
    params: [office_id, group_count]

  - event: field_officer_group_drilldown
    screen: field-officer-dashboard
    feature: field-officer-view
    params: [group_id, health_status]          # health_status: GREEN|AMBER|RED

  - event: field_officer_report_exported
    screen: field-officer-dashboard
    feature: field-officer-view
    params: [group_count]
