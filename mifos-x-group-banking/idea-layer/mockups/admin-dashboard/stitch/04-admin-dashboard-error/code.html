<script>
        // Simple micro-interaction for the Retry button
        document.getElementById('retry-button').addEventListener('click', function() {
            const btn = this;
            const spinner = document.getElementById('loading-spinner');
            
            // Visual feedback
            btn.classList.add('opacity-50', 'pointer-events-none');
            spinner.classList.remove('hidden');
            
            // Simulation of a reconnection attempt
            setTimeout(() => {
                btn.classList.remove('opacity-50', 'pointer-events-none');
                spinner.classList.add('hidden');
                console.log('Retry logic triggered');
                // Normally this would trigger a window.location.reload() or an API fetch
            }, 2000);
        });

        // Handle active state logic (though in an error screen, usually no tab is "active" 
        // unless we mapped it, but per instructions we keep the shell for consistency)
        // Since it's a global error, no specific tab is highlighted to maintain the "hiccup" context.
    </script>
