<style>

            -webkit-tap-highlight-color: transparent;

<body class="font-body-md text-on-surface">
<main class="min-h-screen w-full max-w-[480px] mx-auto bg-surface px-margin-mobile py-stack-lg flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-stack-md">
<img alt="CommonPurse Logo" class="h-12 w-12 object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ugqrH7_8oF19XLbOIW0ZqpOAwsMxRTpk9uDPzs4dOD4skbhlB8xkjVwxqzILPyYNYf71IGbSlZWr-8aKaIJVNkURpMX2PLPfkibJEXQiuT95ySJJ0Tjdd8C_V2g6VY_Dmiv1Ur0U9BcPacBAe23v4gkz5W35B0vb6xh3ER6Im8ESBVDnq8mxwS-xVSha0FcPHxt-BqfRNnljn3B03co7pK1c7NJVo68YhfoteQ2PVgLH4FTYxmWtjUTtv8"/>
</div>
<!-- Title -->
<h1 class="font-title-lg text-title-lg text-on-surface mb-stack-lg text-center">Welcome to CommonPurse</h1>
<!-- Account Selection Tabs -->
<div class="w-full bg-surface-container-low rounded-full p-1 flex mb-stack-lg">
<button class="flex-1 py-2 px-2 text-center rounded-full bg-primary-container text-on-primary-container font-label-lg transition-all shadow-sm">
                grace.wanjiku@example.com
            </button>
<button class="flex-1 py-2 px-2 text-center rounded-full text-on-surface-variant font-label-lg hover:bg-surface-container-high transition-colors">
                +254712345678
            </button>
</div>
<!-- Auth Form -->
<form class="w-full flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="relative">
<label class="absolute -top-2 left-3 bg-surface px-1 text-label-md text-primary font-medium z-10">Full Name</label>
<input class="w-full h-14 bg-transparent border border-outline rounded-lg px-4 text-body-lg focus:outline-none input-focus-ring" placeholder="Grace Wanjiku" type="text"/>
</div>
<!-- Email/Phone Field -->
<div class="relative">
<label class="absolute -top-2 left-3 bg-surface px-1 text-label-md text-outline font-medium z-10">Email or Phone</label>
<input class="w-full h-14 bg-transparent border border-outline rounded-lg px-4 text-body-lg focus:outline-none input-focus-ring" type="text" value="grace.wanjiku@example.com"/>
</div>
<!-- Password Field -->
<div class="relative">
<label class="absolute -top-2 left-3 bg-surface px-1 text-label-md text-outline font-medium z-10">Password</label>
<div class="flex items-center border border-outline rounded-lg input-focus-ring">
<input class="w-full h-14 bg-transparent border-none rounded-lg px-4 text-body-lg focus:ring-0 focus:outline-none" type="password" value="••••••••"/>
<button class="pr-4 text-on-surface-variant flex items-center justify-center active:opacity-60 transition-opacity" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<button class="text-primary font-label-lg hover:underline active:opacity-70 transition-opacity" type="button">Forgot Password?</button>
</div>
<!-- Primary Action Buttons -->
<div class="flex flex-col gap-stack-sm mt-base">
<button class="w-full h-12 bg-primary-container text-on-primary-container font-label-lg rounded-full shadow-sm active:scale-[0.98] transition-transform flex items-center justify-center" type="submit">
                    Sign In
                </button>
<button class="w-full h-12 border border-outline text-primary font-label-lg rounded-full active:bg-surface-container-low transition-colors flex items-center justify-center" type="button">
                    Create Account
                </button>
</div>
<!-- Biometric Entry -->
<div class="flex justify-center py-stack-sm">
<button class="p-4 rounded-full border border-outline-variant hover:bg-surface-container-high transition-colors active:scale-90 duration-150 group" type="button">
<span class="material-symbols-outlined text-[32px] text-primary group-active:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-base my-stack-lg">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="text-label-md text-outline-variant font-bold uppercase tracking-widest">OR</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Onboarding/Empty State Section -->
<div class="w-full flex flex-col items-center text-center">
<div class="mb-stack-md w-full max-w-[280px] aspect-square rounded-2xl overflow-hidden shadow-sm">
<div class="w-full h-full bg-cover bg-center bg-surface-container-high" data-alt="A warm, community-focused digital illustration of diverse rural African group members sitting in a circle under a large acacia tree, discussing finances. The style is modern, minimalist vector art with soft lighting and a palette of earthy greens, deep browns, and warm yellows, reflecting the growth and stability of a Village Savings and Loan Association." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD39l3ihFAAwcIPJaILSU5Mcnt_5v0ZK9DbkZuK-C1T_RR501kIHznjnTzcF50_0ZD2vgApOTgxMcbAy7y7yWbaU9yliTeIVG4XxthXZA3UiYq7sorhH0-QSA4wRIz2RSWJcEiKLHxAP8fMX6y5wY2Gp7jQoA7qoj_gxkFzqh7wQCA_g_w8mj0donm1qZ1xV0IBxOTSH0Rl-tOseWfJbVZ5dcpe7KnXpKNBXNfdy5q4IKGdxYzOvthh00k0v684pLrK-M981w7GpNw')"></div>
</div>
<h2 class="font-title-md text-title-md text-on-surface mb-stack-sm">No groups yet</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg max-w-[240px]">
                Join a VSLA to start saving and growing together.
            </p>
<!-- Onboarding Actions -->
<div class="w-full flex flex-col gap-stack-sm">
<button class="w-full h-12 bg-primary text-on-primary font-label-lg rounded-full flex items-center justify-center gap-2 active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined text-[20px]">group_add</span>
                    Create a Group
                </button>
<button class="w-full h-12 border border-primary text-primary font-label-lg rounded-full flex items-center justify-center gap-2 active:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-[20px]">qr_code_scanner</span>
                    Join with Code
                </button>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for password toggle
        document.querySelector('.material-symbols-outlined').parentElement.addEventListener('click', function() {
            const input = this.previousElementSibling;
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        });

        // Tab switching logic
        const tabs = document.querySelectorAll('.bg-surface-container-low button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-sm');
                tab.classList.remove('text-on-surface-variant');
            });
        });
    </script>
</body></html>
