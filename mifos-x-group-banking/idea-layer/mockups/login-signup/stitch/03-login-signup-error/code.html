<!-- Contextual Logic for Navigation Suppression:

         therefore the global BottomNavBar and NavigationDrawer are suppressed.

<script>
        // Micro-interaction for tabs
        const tabs = document.querySelectorAll('.flex-1');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('tab-active', 'text-on-surface');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('tab-active');
                tab.classList.remove('text-on-surface-variant');
            });
        });

        // Retry simulation
        const retryBtn = document.querySelector('.bg-primary-container');
        retryBtn.addEventListener('click', () => {
            retryBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Reconnecting...';
            retryBtn.disabled = true;
            retryBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                retryBtn.innerHTML = '<span class="material-symbols-outlined">refresh</span> Retry';
                retryBtn.disabled = false;
                retryBtn.classList.remove('opacity-80');
            }, 2000);
        });
    </script>
