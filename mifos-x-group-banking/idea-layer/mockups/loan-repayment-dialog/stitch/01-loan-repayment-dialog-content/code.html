<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Record Repayment — Kwame Asante</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-secondary-fixed-variant": "#004a76",
                    "surface-container-low": "#f5f3f3",
                    "tertiary-container": "#b14b6f",
                    "on-primary-fixed-variant": "#005312",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .drag-handle {
            width: 32px;
            height: 4px;
            border-radius: 2px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-end">
<!-- Bottom Sheet Backdrop (Simulated) -->
<div class="fixed inset-0 bg-black/40 z-40"></div>
<!-- Bottom Sheet Container -->
<main class="relative z-50 w-full max-w-xl mx-auto bg-surface-container-lowest rounded-t-[28px] shadow-lg overflow-hidden flex flex-col max-h-[839px]">
<!-- Handle Bar Header -->
<div class="flex flex-col items-center pt-3 pb-4">
<div class="drag-handle bg-outline-variant mb-4"></div>
<div class="px-margin-mobile w-full flex items-center justify-between">
<h1 class="font-title-lg text-title-lg text-on-surface">Record Repayment — Kwame Asante</h1>
<button class="p-2 hover:bg-surface-variant rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
</div>
<!-- Scrollable Content Area -->
<div class="overflow-y-auto px-margin-mobile pb-8 space-y-6">
<!-- Loan Summary Section -->
<section class="grid grid-cols-2 gap-4">
<div class="p-4 rounded-xl bg-secondary-container/20 border border-secondary-container/30">
<p class="font-label-md text-label-md text-on-secondary-container opacity-80">Outstanding Balance</p>
<p class="font-headline-sm text-headline-sm text-on-secondary-container font-bold">₵ 800</p>
</div>
<div class="p-4 rounded-xl bg-surface-container-high">
<p class="font-label-md text-label-md text-on-surface-variant">Next due</p>
<p class="font-headline-sm text-headline-sm text-primary font-bold">₵ 200</p>
</div>
</section>
<!-- Form Section -->
<section class="space-y-5">
<!-- Amount Input -->
<div class="relative group">
<label class="absolute -top-2 left-3 bg-surface-container-lowest px-1 font-label-md text-label-md text-outline group-focus-within:text-primary transition-colors">Amount</label>
<div class="flex items-center border border-outline rounded-lg px-4 py-4 group-focus-within:border-primary group-focus-within:border-2">
<span class="text-on-surface-variant font-title-md pr-2">₵</span>
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface" placeholder="0.00" type="number" value="200"/>
</div>
</div>
<!-- Payment Date -->
<div class="relative group">
<label class="absolute -top-2 left-3 bg-surface-container-lowest px-1 font-label-md text-label-md text-outline group-focus-within:text-primary transition-colors">Payment Date</label>
<div class="flex items-center border border-outline rounded-lg px-4 py-4 group-focus-within:border-primary group-focus-within:border-2">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface cursor-pointer" readonly="" type="text" value="Oct 24, 2023"/>
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
</div>
</div>
<!-- Payment Method (Segmented Buttons) -->
<div class="space-y-2">
<p class="font-label-md text-label-md text-outline ml-1">Payment Method</p>
<div class="flex w-full border border-outline rounded-full overflow-hidden">
<button class="flex-1 py-2.5 font-label-lg text-label-lg transition-colors bg-primary-container text-on-primary-container flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">payments</span>
                            Cash
                        </button>
<div class="w-[1px] bg-outline"></div>
<button class="flex-1 py-2.5 font-label-lg text-label-lg transition-colors hover:bg-surface-variant text-on-surface-variant flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">smartphone</span>
                            Mobile Money
                        </button>
</div>
</div>
<!-- Reference Number -->
<div class="relative group">
<label class="absolute -top-2 left-3 bg-surface-container-lowest px-1 font-label-md text-label-md text-outline group-focus-within:text-primary transition-colors">Reference Number (Optional)</label>
<div class="flex items-center border border-outline rounded-lg px-4 py-4 group-focus-within:border-primary group-focus-within:border-2">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface" placeholder="Enter Ref #" type="text"/>
<span class="material-symbols-outlined text-on-surface-variant">description</span>
</div>
</div>
</section>
<!-- Receipt Preview Section -->
<section class="bg-secondary-container rounded-xl p-5 border border-on-secondary-container/5">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">receipt</span>
<h3 class="font-title-md text-title-md text-on-secondary-container">Repayment Preview</h3>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center">
<span class="text-on-secondary-container font-body-md opacity-70">Total received</span>
<span class="text-on-secondary-container font-title-md font-bold">₵ 200</span>
</div>
<div class="h-[1px] bg-on-secondary-container/10 border-t border-dashed border-on-secondary-container/30"></div>
<div class="flex justify-between items-center">
<span class="text-on-secondary-container font-body-md opacity-70">Remaining balance</span>
<span class="text-on-secondary-container font-title-md font-bold">₵ 600</span>
</div>
</div>
</section>
<!-- Action Buttons -->
<div class="pt-4 flex flex-col gap-3">
<button class="w-full bg-primary-container text-on-primary-container h-14 rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-primary transition-colors active:scale-95 duration-100 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Record Payment
                </button>
<button class="w-full text-primary h-12 rounded-full font-label-lg text-label-lg hover:bg-surface-variant transition-colors active:scale-95 duration-100">
                    Cancel
                </button>
</div>
</div>
<!-- Safe area padding for mobile -->
<div class="h-6 w-full bg-surface-container-lowest"></div>
</main>
</body></html>
