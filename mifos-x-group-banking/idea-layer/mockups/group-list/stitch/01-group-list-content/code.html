<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Groups - CommonPurse</title>

                    "fontFamily": {

<style>
        body { font-family: 'Noto Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex items-center justify-between px-margin-screen h-16 w-full max-w-full sticky top-0 z-40">
<div class="flex items-center gap-4">
<button class="active:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">menu</span>
</button>
<h1 class="font-title-lg text-title-lg font-bold text-primary dark:text-primary-fixed">My Groups</h1>
</div>
<button class="active:opacity-80 transition-opacity duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">search</span>
</button>
</header>
<main class="flex-1 px-margin-screen pb-32">
<!-- Search Section -->
<section class="mt-unit-medium">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-transparent border border-outline rounded-lg focus:border-primary focus:ring-1 focus:ring-primary font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant" placeholder="Search groups..." type="text"/>
</div>
</section>
<!-- Filters Section -->
<section class="mt-unit-medium overflow-x-auto no-scrollbar">
<div class="flex gap-2 pb-2">
<button class="flex items-center px-4 h-8 bg-secondary-container text-on-secondary-container rounded-lg font-label-lg text-label-lg whitespace-nowrap">
                    All
                </button>
<button class="flex items-center px-4 h-8 border border-outline text-on-surface-variant rounded-lg font-label-lg text-label-lg whitespace-nowrap hover:bg-surface-container-high">
                    Active
                </button>
<button class="flex items-center px-4 h-8 border border-outline text-on-surface-variant rounded-lg font-label-lg text-label-lg whitespace-nowrap hover:bg-surface-container-high">
                    Meeting Today
                </button>
<button class="flex items-center px-4 h-8 border border-outline text-on-surface-variant rounded-lg font-label-lg text-label-lg whitespace-nowrap hover:bg-surface-container-high">
                    Has Overdue
                </button>
</div>
</section>
<!-- Group List Content -->
<section class="mt-unit-medium space-y-unit-small">
<!-- Card 1: Sunrise VSLA -->
<div class="p-unit-medium border border-outline-variant rounded-lg bg-surface flex items-center gap-4 active:scale-[0.98] transition-transform duration-150 cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-title-md">
                    SV
                </div>
<div class="flex-1">
<div class="flex justify-between items-start">
<h3 class="font-title-md text-title-md text-on-surface font-bold">Sunrise VSLA</h3>
<span class="px-2 py-1 bg-[#FFECB3] text-[#6F5200] rounded-sm font-label-sm text-label-sm">Meeting Today</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">18 members · ₵ 4,200</p>
</div>
</div>
<!-- Card 2: Harmony Group -->
<div class="p-unit-medium border border-outline-variant rounded-lg bg-surface flex items-center gap-4 active:scale-[0.98] transition-transform duration-150 cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-title-md">
                    HG
                </div>
<div class="flex-1">
<div class="flex justify-between items-start">
<h3 class="font-title-md text-title-md text-on-surface font-bold">Harmony Group</h3>
<span class="px-2 py-1 bg-[#C8E6C9] text-[#1B5E20] rounded-sm font-label-sm text-label-sm">Active</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">12 members · ₵ 2,800</p>
</div>
</div>
<!-- Card 3: New Dawn VSLA -->
<div class="p-unit-medium border border-outline-variant rounded-lg bg-surface flex items-center gap-4 active:scale-[0.98] transition-transform duration-150 cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-title-md">
                    ND
                </div>
<div class="flex-1">
<div class="flex justify-between items-start">
<h3 class="font-title-md text-title-md text-on-surface font-bold">New Dawn VSLA</h3>
<span class="px-2 py-1 bg-[#C8E6C9] text-[#1B5E20] rounded-sm font-label-sm text-label-sm">Active</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">22 members · ₵ 5,100</p>
</div>
</div>
<!-- Card 4: Unity Circle -->
<div class="p-unit-medium border border-outline-variant rounded-lg bg-surface flex items-center gap-4 active:scale-[0.98] transition-transform duration-150 cursor-pointer">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-title-md">
                    UC
                </div>
<div class="flex-1">
<div class="flex justify-between items-start">
<h3 class="font-title-md text-title-md text-on-surface font-bold">Unity Circle</h3>
<span class="px-2 py-1 bg-error-container text-on-error-container rounded-sm font-label-sm text-label-sm">Overdue</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">9 members · ₵ 1,650</p>
</div>
</div>
</section>
</main>
<!-- Floating Action Button -->
<button class="fixed right-6 bottom-24 w-14 h-14 bg-primary-container text-on-primary-container rounded-xl shadow-lg flex items-center justify-center active:scale-95 transition-transform duration-150 z-50">
<span class="material-symbols-outlined text-[32px]">add</span>
</button>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-unit-small py-unit-small h-20 bg-surface-container dark:bg-surface-container-low border-t border-outline-variant dark:border-outline">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">home</span>
<span class="font-label-lg text-label-lg">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-full px-5 py-1 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-lg text-label-lg">Groups</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-lg text-label-lg">Savings</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline p-2 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">person</span>
<span class="font-label-lg text-label-lg">Account</span>
</button>
</nav>
</body></html>
