<style>

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer {
            background: linear-gradient(90deg, 
                theme('colors.surface-container-high') 25%, 
                theme('colors.surface-container-highest') 37%, 
                theme('colors.surface-container-high') 63%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        .no-tap {
            pointer-events: none;
            user-select: none;
        }

        body {
            font-family: 'Noto Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>

  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar (Skeleton) -->
<header class="flex items-center justify-between px-margin-screen h-16 w-full max-w-full bg-surface border-b border-outline-variant fixed top-0 z-40">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full shimmer no-tap"></div>

</div>
<div class="flex items-center gap-2">

</div>
</header>
<!-- Scrollable Content Column -->
<main class="flex-grow pt-20 pb-24 px-margin-screen space-y-6">
<!-- Large Feature Card Skeleton -->
<section class="w-full">
<div class="h-48 w-full rounded-xl border border-outline-variant shimmer no-tap"></div>
</section>
<!-- Action Button Skeletons Row -->
<section class="flex justify-between items-center gap-4">
<div class="flex-1 h-12 rounded-lg shimmer no-tap"></div>
<div class="flex-1 h-12 rounded-lg shimmer no-tap"></div>
<div class="flex-1 h-12 rounded-lg shimmer no-tap"></div>
</section>
<!-- List of Activity Items -->
<section class="space-y-4">
<div class="w-24 h-6 rounded shimmer no-tap mb-2"></div>

<div class="w-12 h-12 rounded-full shimmer"></div>

</div>

<div class="flex items-center gap-4 p-4 border border-outline-variant rounded-lg no-tap">
<div class="w-12 h-12 rounded-full shimmer"></div>

</div>
</div>

<div class="flex items-center gap-4 p-4 border border-outline-variant rounded-lg no-tap">
<div class="w-12 h-12 rounded-full shimmer"></div>

</div>

</main>
<!-- FAB (Interactive) -->
<div class="fixed bottom-24 right-4 z-50">
<button class="flex items-center gap-2 bg-primary-container text-on-primary-container px-6 py-4 rounded-xl shadow-lg active:scale-95 transition-transform duration-150 hover:opacity-90">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span class="font-label-lg text-label-lg">New Group</span>
</button>
</div>
<!-- BottomNavBar (Interactive) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-unit-small py-unit-small h-20 bg-surface-container border-t border-outline-variant">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-lg text-label-lg">Home</span>
</button>
<!-- Groups -->

</button>
<!-- Savings -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-lg text-label-lg">Savings</span>
</button>
<!-- Account -->
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-lg text-label-lg">Account</span>
</button>
</nav>
<!-- Micro-interaction for FAB ripple simulation -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', function(e) {
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;
                let ripples = document.createElement('span');
                ripples.style.left = x + 'px';
                ripples.style.top = y + 'px';
                this.appendChild(ripples);
                setTimeout(() => { ripples.remove() }, 1000);
            });
        });
    </script>
</body></html>
