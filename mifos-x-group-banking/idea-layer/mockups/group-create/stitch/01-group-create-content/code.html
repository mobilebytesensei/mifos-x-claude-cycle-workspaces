        body { font-family: 'Noto Sans', sans-serif; }

            padding: 0 4px;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar (Based on JSON Shared Component) -->
<header class="w-full top-0 sticky bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline flex justify-between items-center px-margin-screen h-16 z-50">
<div class="flex items-center gap-4">
<button class="p-2 transition-colors duration-200 hover:bg-surface-container-highest dark:hover:bg-surface-variant rounded-full text-on-surface">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary">Create Group</h1>
</div>
<div class="flex items-center">
<button class="p-2 transition-colors duration-200 hover:bg-surface-container-highest dark:hover:bg-surface-variant rounded-full text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="save">save</span>
</button>
</div>
</header>
<main class="flex-grow px-margin-screen py-unit-large max-w-2xl mx-auto w-full">
<!-- Step Indicator -->
<div class="mb-unit-large">
<span class="font-label-lg text-label-lg text-secondary tracking-wider uppercase">Step 1 of 3: Basic Info</span>
<div class="w-full bg-surface-container-high h-1 rounded-full mt-2 overflow-hidden">
<div class="bg-primary w-1/3 h-full transition-all duration-300"></div>
</div>
</div>
<!-- Form Section -->
<div class="flex flex-col gap-unit-large">
<!-- Group Name Field -->
<div class="relative">
<label class="absolute left-3 -top-2.5 px-1 bg-background text-label-sm font-label-sm text-outline transition-all">Group Name *</label>
<input class="w-full bg-transparent border border-outline rounded-lg px-4 py-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/30" placeholder="Enter group name" type="text"/>
</div>
<!-- Description Field -->
<div class="relative">
<label class="absolute left-3 -top-2.5 px-1 bg-background text-label-sm font-label-sm text-outline transition-all">Description</label>
<textarea class="w-full bg-transparent border border-outline rounded-lg px-4 py-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/30 resize-none" placeholder="Brief group purpose..." rows="4"></textarea>
</div>
<!-- Office Dropdown -->
<div class="relative">
<label class="absolute left-3 -top-2.5 px-1 bg-background text-label-sm font-label-sm text-outline transition-all">Office</label>
<div class="relative group">
<select class="w-full appearance-none bg-transparent border border-outline rounded-lg px-4 py-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option selected="" value="head-office">Head Office</option>
<option value="regional">Regional Branch North</option>
<option value="district">District Center West</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
<!-- Loan Product Dropdown -->
<div class="relative">
<label class="absolute left-3 -top-2.5 px-1 bg-background text-label-sm font-label-sm text-outline transition-all">Loan Product</label>
<div class="relative group">
<select class="w-full appearance-none bg-transparent border border-outline rounded-lg px-4 py-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option disabled="" selected="" value="">Select a product</option>
<option value="agri">Agricultural Micro-loan</option>
<option value="sme">Small Business Grant</option>
<option value="emergency">Emergency Relief Fund</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Activation Date Field -->
<div class="relative">
<label class="absolute left-3 -top-2.5 px-1 bg-background text-label-sm font-label-sm text-outline transition-all">Activation Date</label>
<div class="relative">
<input class="w-full bg-transparent border border-outline rounded-lg px-4 py-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Informational Banner (Contextual) -->
<div class="flex items-start gap-4 p-4 rounded-xl border border-outline-variant bg-surface-container-low mt-4">
<span class="material-symbols-outlined text-primary" data-icon="info">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">Basic information helps field officers categorize groups correctly for periodic reporting and loan distribution cycles.</p>
</div>
</div>
</main>
<!-- Fixed Action Buttons Container -->
<footer class="sticky bottom-0 bg-surface border-t border-outline-variant p-4 md:px-margin-screen">
<div class="max-w-2xl mx-auto flex flex-col gap-2">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-primary-container transition-colors shadow-sm active:scale-[0.98]">
<span>Next</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full h-14 bg-transparent text-primary rounded-full font-label-lg text-label-lg flex items-center justify-center hover:bg-surface-variant/50 transition-colors">
                Cancel
            </button>
</div>
</footer>
<!-- BottomNavBar (Hidden for transactional screen per mandate) -->
</body></html>
