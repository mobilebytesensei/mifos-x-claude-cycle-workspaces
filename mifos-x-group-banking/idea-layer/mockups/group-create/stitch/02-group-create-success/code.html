<script>
        document.querySelector('[aria-label="Copy code"]').addEventListener('click', function() {

            const originalIcon = icon.textContent;
            icon.textContent = 'check';
            setTimeout(() => {
                icon.textContent = originalIcon;
            }, 2000);
