<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e9e8e7",
                        "primary": "#0d631b",
                        "background": "#fbf9f8",

                        "on-surface": "#1b1c1c",

                        "error": "#ba1a1a",

                        "on-background": "#1b1c1c",

                        "tertiary-fixed-dim": "#ffb1c7",
                        "inverse-on-surface": "#f2f0f0",
                        "on-primary-fixed": "#002204",
                        "on-primary-container": "#cbffc2",
                        "on-secondary-fixed": "#001d33",
                        "on-tertiary-fixed-variant": "#7f2448",
                        "on-surface-variant": "#40493d",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#88d982",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#303031",
                        "surface-dim": "#dbdad9",
                        "tertiary": "#923357",
                        "surface-bright": "#fbf9f8",
                        "surface-tint": "#1b6d24",
                        "on-tertiary-fixed": "#3f001c",
                        "primary-fixed": "#a3f69c",
                        "on-primary": "#ffffff",
                        "surface": "#fbf9f8",
                        "tertiary-container": "#b14b6f",
                        "on-tertiary-container": "#ffedf0",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#88d982",
                        "surface-container-highest": "#e4e2e2",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#cee5ff",
                        "on-error": "#ffffff",
                        "secondary-fixed-dim": "#96cbff",
                        "surface-variant": "#e4e2e2",
                        "outline-variant": "#bfcaba",
                        "outline": "#707a6c",
                        "primary-container": "#2e7d32",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-tablet": "24px",
                        "component-padding": "12px",
                        "base-unit": "8px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Noto Sans"],
                        "title-md": ["Noto Sans"],
                        "headline-sm": ["Noto Sans"],
                        "headline-lg": ["Noto Sans"],
                        "body-md": ["Noto Sans"],
                        "label-md": ["Noto Sans"],
                        "body-lg": ["Noto Sans"],
                        "display-lg": ["Noto Sans"],
                        "title-lg": ["Noto Sans"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                        "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                        "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                        "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}],
                        "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fbf9f8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen text-on-surface">
<!-- TopAppBar Section -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-4">
<button aria-label="Back" class="material-symbols-outlined text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100 p-2">arrow_back</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed">New Loan Application</h1>
</div>
<div class="flex items-center">
<button aria-label="Account" class="material-symbols-outlined text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-high rounded-full transition-colors active:scale-95 duration-100 p-2">
                account_circle
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-margin-mobile max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-12 gap-8">
<!-- Progress Indicator Section -->
<section class="md:col-span-12">
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<span class="font-label-lg text-label-lg text-primary uppercase tracking-wider">Step 2 of 3</span>
<span class="font-title-md text-title-md text-on-surface-variant">Loan Details</span>
</div>
<div class="w-full h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="w-2/3 h-full bg-primary transition-all duration-500"></div>
</div>
</div>
</section>
<!-- Form Section -->
<section class="md:col-span-8 flex flex-col gap-6">
<!-- Loan Product Dropdown -->
<div class="relative">
<label class="block mb-1 font-label-md text-label-md text-on-surface-variant ml-3">Loan Product</label>
<div class="relative">
<select class="w-full bg-transparent border border-outline rounded-lg h-14 px-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary appearance-none outline-none cursor-pointer">
<option selected="">VSLA Group Loan</option>
<option>Individual Business Loan</option>
<option>Emergency Credit</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<!-- Principal Amount -->
<div class="relative">
<label class="block mb-1 font-label-md text-label-md text-on-surface-variant ml-3">Principal Amount</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-body-lg text-body-lg text-on-surface-variant">₵</span>
<input class="w-full bg-transparent border border-outline rounded-lg h-14 pl-10 pr-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" type="number" value="500"/>
</div>
</div>
<!-- Repayment Frequency Segmented Button -->
<div class="flex flex-col gap-2">
<label class="block font-label-md text-label-md text-on-surface-variant ml-3">Repayment Frequency</label>
<div class="grid grid-cols-3 w-full border border-outline rounded-full overflow-hidden h-12">
<button class="bg-primary text-on-primary font-label-lg text-label-lg h-full transition-colors">Weekly</button>
<button class="bg-transparent text-on-surface-variant font-label-lg text-label-lg h-full border-x border-outline hover:bg-surface-container-low transition-colors">Bi-weekly</button>
<button class="bg-transparent text-on-surface-variant font-label-lg text-label-lg h-full hover:bg-surface-container-low transition-colors">Monthly</button>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Number of Repayments -->
<div class="relative">
<label class="block mb-1 font-label-md text-label-md text-on-surface-variant ml-3">Number of Repayments</label>
<input class="w-full bg-transparent border border-outline rounded-lg h-14 px-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" type="number" value="12"/>
</div>
<!-- Disbursement Date -->
<div class="relative">
<label class="block mb-1 font-label-md text-label-md text-on-surface-variant ml-3">Disbursement Date</label>
<div class="relative">
<input class="w-full bg-transparent border border-outline rounded-lg h-14 px-4 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-4 pointer-events-none text-on-surface-variant">calendar_today</span>
</div>
</div>
</div>
<!-- Purpose -->
<div class="relative">
<label class="block mb-1 font-label-md text-label-md text-on-surface-variant ml-3">Purpose</label>
<textarea class="w-full bg-transparent border border-outline rounded-lg px-4 py-3 font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" rows="3">Small business working capital</textarea>
</div>
</section>
<!-- Summary & Image Sidebar -->
<aside class="md:col-span-4 flex flex-col gap-6">
<!-- Tonal Info Card -->
<div class="bg-secondary-container text-on-secondary-container p-6 rounded-xl flex flex-col gap-3 shadow-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined">info</span>
<h3 class="font-title-md text-title-md">Calculation Summary</h3>
</div>
<div class="flex flex-col gap-1">
<p class="font-body-md text-body-md">Interest: <span class="font-bold">5% flat</span></p>
<p class="font-body-md text-body-md">Total repayable: <span class="font-bold">₵ 525</span></p>
</div>
<p class="font-label-md text-label-md opacity-80 mt-2">Based on the provided principal and repayment terms.</p>
</div>
<!-- Decorative Visual -->
<div class="rounded-2xl overflow-hidden h-64 relative shadow-md">
<img alt="Small business growth" class="w-full h-full object-cover" data-alt="A clean and optimistic photograph of a vibrant small business shop interior in an African urban setting. Soft morning sunlight filters through the windows, illuminating organized shelves of diverse local products. The scene uses a professional, calm color palette of forest green accents and warm wooden tones, emphasizing community commerce, security, and collaborative financial growth." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpgJ1BPKa9Cao4_vtqVTaCfjNn4WkT4TwOov-VoDnVxqlF_v-tmyVToNsiGcAXH5oFRV3GADnJIzseJ65qCkdWr-JuZ547ffeeZCbT8J3Nh7cEZPyPh2-2HptVCerAHGu3TpODTJ79IQZC3TusToxSgeHYpL3pelTYpZljdjlE8cwov2DBXEkJbXj-L03YZVe5cMbXbilKTvlPBNPSqPBVRNusCY2mbN6jyl-J-2UdrjuJZlCLkR033pZVQ-7e3jpSCHUxnk9moTY"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-4">
<p class="text-white font-label-lg text-label-lg">Investing in communal progress since 2021</p>
</div>
</div>
</aside>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container py-4 px-margin-mobile flex justify-center z-40 border-t border-outline-variant md:border-none">
<div class="w-full max-w-[1200px]">
<button class="w-full h-14 bg-primary text-on-primary font-title-lg text-title-lg rounded-full shadow-md hover:opacity-90 transition-all active:scale-[0.98]">
                Review and Submit
            </button>
</div>
</footer>
</body></html>
