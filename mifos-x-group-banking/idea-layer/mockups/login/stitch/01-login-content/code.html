<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#0054a7",

                        "on-primary": "#ffffff",
                        "tertiary-container": "#246dc8",

                        "primary-fixed": "#a3f69c",

                        "surface-dim": "#ddd9de",
                        "on-secondary-fixed-variant": "#6d3a00",
                        "on-secondary-fixed": "#2e1500",

                        "surface-container-high": "#ebe7ec",
                        "secondary-fixed": "#ffdcc2",

                        "tertiary-fixed": "#d6e3ff",
                        "on-primary-fixed": "#002204",
                        "secondary": "#8f4e00",
                        "surface-variant": "#e5e1e7",
                        "on-primary-container": "#cbffc2",
                        "tertiary-fixed-dim": "#a9c7ff",
                        "inverse-surface": "#313034",
                        "outline": "#707a6c",
                        "secondary-container": "#ff8f00",
                        "on-secondary": "#ffffff",

                        "background": "#fdf8fd",
                        "on-background": "#1c1b1f",
                        "surface-container-low": "#f7f2f8",

                        "on-tertiary-fixed": "#001b3d",
                        "on-primary-fixed-variant": "#005312",
                        "inverse-primary": "#88d982",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1c1b1f",
                        "secondary-fixed-dim": "#ffb77a",
                        "surface-container-highest": "#e5e1e7",
                        "surface-bright": "#fdf8fd",
                        "primary": "#0d631b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "4px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "margin-mobile": "16px",
                        "gutter-mobile": "8px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Noto Sans"],
                        "headline-sm": ["Noto Sans"],
                        "title-md": ["Noto Sans"],
                        "label-lg": ["Noto Sans"],
                        "headline-lg": ["Noto Sans"],
                        "body-lg": ["Noto Sans"],
                        "title-lg": ["Noto Sans"],
                        "headline-md": ["Noto Sans"],
                        "label-md": ["Noto Sans"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],

                        "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],

                        "title-lg": ["22px", {"lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "500"}],
                        "headline-md": ["28px", {"lineHeight": "36px", "letterSpacing": "0px", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}]

                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #FAFAFA;
        }
    </style>
</head>
<body class="font-body-md text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface flex items-center px-margin-mobile h-16 w-full">
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile pt-24 pb-stack-lg w-full max-w-md mx-auto">
<!-- Brand Identity -->
<div class="mb-stack-lg flex flex-col items-center gap-base">
<div class="w-20 h-20 mb-stack-md">
<img alt="CommonPurse Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ugqrH7_8oF19XLbOIW0ZqpOAwsMxRTpk9uDPzs4dOD4skbhlB8xkjVwxqzILPyYNYf71IGbSlZWr-8aKaIJVNkURpMX2PLPfkibJEXQiuT95ySJJ0Tjdd8C_V2g6VY_Dmiv1Ur0U9BcPacBAe23v4gkz5W35B0vb6xh3ER6Im8ESBVDnq8mxwS-xVSha0FcPHxt-BqfRNnljn3B03co7pK1c7NJVo68YhfoteQ2PVgLH4FTYxmWtjUTtv8"/>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface text-center">Welcome back</h1>
<!-- Role Indicator Chip -->
<div class="inline-flex items-center px-3 py-1 rounded-lg border border-tertiary text-tertiary bg-white font-label-lg text-label-lg mt-base">
                Field Officer
            </div>
</div>
<!-- Login Form -->
<form class="w-full space-y-stack-md">
<!-- Username Input -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="person">person</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-transparent border border-outline rounded-lg font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant" placeholder="Username" type="text"/>
<label class="absolute -top-2.5 left-3 px-1 bg-[#FAFAFA] font-label-md text-label-md text-outline group-focus-within:text-primary transition-colors">Username</label>
</div>
<!-- Password Input -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-4 bg-transparent border border-outline rounded-lg font-body-lg text-body-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant" placeholder="Password" type="password"/>
<label class="absolute -top-2.5 left-3 px-1 bg-[#FAFAFA] font-label-md text-label-md text-outline group-focus-within:text-primary transition-colors">Password</label>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center" type="button">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Alternative Auth -->
<div class="flex justify-center pt-2">
<button class="font-label-lg text-label-lg text-primary underline decoration-primary underline-offset-4 hover:bg-primary/5 px-2 py-1 rounded-md transition-colors" type="button">
                    Use PIN instead
                </button>
</div>
<!-- Main Action -->
<button class="w-full h-12 bg-[#2E7D32] text-white rounded-lg font-title-md text-title-md font-semibold flex items-center justify-center shadow-sm active:scale-95 transition-transform hover:brightness-110 mt-stack-lg" type="submit">
                Log In
            </button>
</form>
<!-- Footer Links -->
<footer class="mt-auto pt-stack-lg w-full flex flex-col items-center">
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-colors py-2">
                Forgot password?
            </button>
<!-- Contextual Decorative Element (Community VSLA focus) -->
<div class="mt-stack-lg w-full h-32 rounded-xl overflow-hidden relative">
<img class="w-full h-full object-cover" data-alt="A warm, sunlit scene of a diverse rural community gathering under a large acacia tree, emphasizing collective prosperity and digital financial inclusion. The aesthetic is clean and modern, featuring soft lighting and a palette of natural greens and earthy tones that align with the brand's mission of community-led growth." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQiqExGiu_x0aWGGrO9q8qdee64FtR6R4v9Cp-ayblhS229D0STI7MZaw7IRIfmdAyRm-XpqUXWrO9iJGrPCvZ3abu_Bu0CBgTIDMdn_T5PxrnXIGtRmZh2cPadXTy0gu4VGkyoEV0vKXIfjg9Nb05LXqWDQx-h54Rwph8OWuftB-R95QDsIsxE_J9_0wy9pmLaxkVsNQps-TUO9DT5NVj3dB-1D65nVoqUwCOz5ZnkGiCf2hbitTtvZKJw31sUMAQCFkfdRtf7TY"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<div class="absolute bottom-3 left-4 right-4 text-white text-xs opacity-90 italic">
                    Supporting rural growth through collective saving.
                </div>
</div>
</footer>
</main>
</body></html>
