<style>
        body {
            -webkit-tap-highlight-color: transparent;
            scroll-behavior: smooth;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom layout for error centering in scrollable column */
        .error-viewport-center {
            min-height: calc(100vh - 64px - 80px); /* Subtract Header and BottomNav height */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background selection:bg-primary-fixed-dim selection:text-on-primary-fixed">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-surface-dim flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed font-title-lg text-title-lg" data-icon="savings">savings</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface dark:text-on-surface-variant font-bold">Savings Dashboard</h1>
</div>
<button class="font-label-lg text-label-lg text-primary hover:bg-surface-container-high transition-colors px-3 py-2 rounded-lg active:scale-95 transition-transform duration-200">
            Export
        </button>
</header>
<!-- Main Content: Scrollable Column -->
<main class="w-full flex flex-col px-margin-mobile overflow-y-auto">
<div class="error-viewport-center flex flex-col items-center justify-center text-center py-xl">
<!-- Error Illustration -->
<div class="mb-lg">
<div class="w-32 h-32 bg-surface-container-highest rounded-full flex items-center justify-center relative overflow-hidden">
<!-- Subtle background decoration -->
<div class="absolute inset-0 opacity-10 bg-error"></div>
<span class="material-symbols-outlined text-[64px] text-error" data-icon="error_outline">error_outline</span>
</div>
</div>
<!-- Error Copy -->
<h2 class="font-title-lg text-title-lg text-on-surface mb-md">Unable to Load Savings</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mb-xl">
                We're having trouble retrieving the group's savings data right now. Please check your connection and try again.
            </p>
<!-- Tappable Action -->
<button class="bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg px-xl py-3 rounded-full shadow-sm active:scale-95 transition-all duration-200 flex items-center gap-sm">
<span class="material-symbols-outlined text-[18px]" data-icon="refresh">refresh</span>
                Retry
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl shadow-md bg-surface-container dark:bg-surface-container-low flex justify-around items-center h-20 px-2 pb-safe">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 transition-all duration-150 rounded-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Savings (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-fixed-variant text-on-primary-container dark:text-primary-fixed rounded-full px-5 py-1 active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<span class="font-label-md text-label-md">Savings</span>
</a>
<!-- Groups -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 transition-all duration-150 rounded-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="groups">groups</span>
<span class="font-label-md text-label-md">Groups</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest dark:hover:bg-surface-variant transition-colors active:scale-90 transition-all duration-150 rounded-full" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
<!-- Visual Atmosphere: Subtle grainy texture or very light gradient -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[100]" style="background-image: url('https://www.transparenttextures.com/patterns/p6.png');"></div>
<script>
        // Simple micro-interaction for the retry button
        const retryBtn = document.querySelector('button.bg-primary');
        retryBtn.addEventListener('click', () => {
            const icon = retryBtn.querySelector('.material-symbols-outlined');
            icon.classList.add('animate-spin');
            retryBtn.classList.add('opacity-80');
            retryBtn.innerText = 'Retrying...';
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                retryBtn.classList.remove('opacity-80');
                // Normally this would trigger a reload or API fetch
                location.reload();
            }, 1200);
        });
    </script>
</body></html>
