<script>
        // Micro-interaction for the secondary progress bar
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.querySelector('.font-label-md.text-outline.mt-2');
        let progress = 35;
        const messages = [
            "Authenticating membership request",
            "Syncing VSLA constitution",
            "Initializing individual share account",
            "Connecting with group administrators",
            "Finalizing setup"
        ];
        let messageIndex = 0;

        const interval = setInterval(() => {
            progress += Math.random() * 5;
            if (progress > 95) progress = 95;
            progressBar.style.width = `${progress}%`;
            
            if (progress > (messageIndex + 1) * 20 && messageIndex < messages.length - 1) {
                messageIndex++;
                statusText.textContent = messages[messageIndex];
            }
        }, 1000);

        // Simulation stop
        setTimeout(() => {
            clearInterval(interval);
            progressBar.style.width = '100%';
            statusText.textContent = "All set! Redirecting...";
        }, 12000);
    </script>
