<!-- Micro-interaction for simulated completion -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle transition effects for the text
            const statusText = document.querySelector('p.animate-pulse');
            const messages = [
                'Authenticating secure session...',
                'Verifying credentials...',
                'Connecting to VSLA servers...',
                'Finalizing encryption...'
            ];
            let i = 0;
            setInterval(() => {
                i = (i + 1) % messages.length;
                statusText.style.opacity = 0;
                setTimeout(() => {
                    statusText.textContent = messages[i];
                    statusText.style.opacity = 1;
                }, 300);
            }, 3000);
        });
    </script>
