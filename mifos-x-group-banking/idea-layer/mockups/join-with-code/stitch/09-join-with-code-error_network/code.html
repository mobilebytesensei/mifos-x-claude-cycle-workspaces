<script>
        function simulateRetry(btn) {
            const icon = btn.querySelector('.material-symbols-outlined');
            const text = btn.querySelector('span:not(.material-symbols-outlined)');
            
            // Interaction visual feedback
            icon.classList.add('animate-spin');
            text.innerText = 'Connecting...';
            btn.classList.add('opacity-80', 'pointer-events-none');

            // Simulate a failed retry to return to original state
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                text.innerText = 'Retry';
                btn.classList.remove('opacity-80', 'pointer-events-none');
                
                // Add a little bounce to show failure
                btn.animate([
                    { transform: 'translateX(0px)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0px)' }
                ], { duration: 300 });
            }, 2000);
        }

        // Material Symbol weights injection
        document.querySelectorAll('.material-symbols-outlined').forEach(span => {
            if (span.getAttribute('data-weight') === 'fill') {
                span.style.fontVariationSettings = "'FILL' 1";
            }
        });
    </script>
