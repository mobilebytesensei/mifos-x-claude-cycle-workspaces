<!-- Micro-interactions Script -->
<script>
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const btn = this;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Visual feedback for retry
            icon.classList.add('animate-spin');
            btn.classList.add('opacity-80');
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Retrying...`;
            
            // Simulate a brief reload delay
            setTimeout(() => {
                btn.classList.remove('opacity-80');
                btn.innerHTML = `<span class="material-symbols-outlined" data-icon="refresh">refresh</span> Retry`;
            }, 2000);
        });
    </script>
