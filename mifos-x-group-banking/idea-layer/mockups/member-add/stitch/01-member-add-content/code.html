<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary": "#1f6223",
                    "tertiary-fixed": "#acf4a4",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#002203",
                    "on-tertiary-container": "#c8ffbf",
                    "error-container": "#ffdad6",
                    "primary": "#0d631b",
                    "on-tertiary-fixed-variant": "#0c5216",
                    "on-error": "#ffffff",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#88d982",
                    "background": "#fbf9f9",
                    "on-background": "#1b1c1c",
                    "surface-container-lowest": "#ffffff",
                    "inverse-surface": "#303031",
                    "on-primary-container": "#cbffc2",
                    "secondary-fixed": "#98f994",
                    "inverse-on-surface": "#f2f0f0",
                    "on-primary": "#ffffff",
                    "on-primary-fixed-variant": "#005312",
                    "secondary-container": "#98f994",
                    "primary-container": "#2e7d32",
                    "on-surface-variant": "#40493d",
                    "secondary": "#006e1c",
                    "on-surface": "#1b1c1c",
                    "surface-dim": "#dbdad9",
                    "surface": "#fbf9f9",
                    "on-secondary-container": "#0c7521",
                    "error": "#ba1a1a",
                    "surface-container-low": "#f5f3f3",
                    "outline-variant": "#bfcaba",
                    "on-secondary-fixed": "#002204",
                    "tertiary-fixed-dim": "#91d78a",
                    "surface-tint": "#1b6d24",
                    "primary-fixed": "#a3f69c",
                    "tertiary-container": "#3a7b39",
                    "surface-container-highest": "#e3e2e2",
                    "surface-container-high": "#e9e8e7",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed": "#002204",
                    "surface-container": "#efeded",
                    "outline": "#707a6c",
                    "on-secondary-fixed-variant": "#005313",
                    "surface-bright": "#fbf9f9",
                    "surface-variant": "#e3e2e2",
                    "secondary-fixed-dim": "#7ddc7a",
                    "primary-fixed-dim": "#88d982"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-tablet": "24px",
                    "stack-md": "16px",
                    "margin-mobile": "16px",
                    "stack-sm": "4px",
                    "gutter": "16px",
                    "base": "8px",
                    "stack-lg": "24px"
            },
            "fontFamily": {
                    "headline-md": ["Noto Sans"],
                    "title-sm": ["Noto Sans"],
                    "label-md": ["Noto Sans"],
                    "headline-lg": ["Noto Sans"],
                    "title-lg": ["Noto Sans"],
                    "body-lg": ["Noto Sans"],
                    "headline-sm": ["Noto Sans"],
                    "title-md": ["Noto Sans"],
                    "body-md": ["Noto Sans"],
                    "label-lg": ["Noto Sans"],
                    "display-lg": ["Noto Sans"]
            },
            "fontSize": {
                    "headline-md": ["28px", {"lineHeight": "36px", "fontWeight": "400"}],
                    "title-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
                    "title-lg": ["22px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "400"}],
                    "title-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "display-lg": ["57px", {"lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Noto Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar -->
<header class="flex items-center px-margin-mobile h-16 w-full bg-surface shadow-sm sticky top-0 z-50">
<button class="material-symbols-outlined text-primary p-2 mr-2 active:opacity-80 transition-opacity rounded-full hover:bg-surface-container-low" data-icon="arrow_back">arrow_back</button>
<h1 class="font-headline-sm text-headline-sm text-primary flex-1">Add Member</h1>
<button class="material-symbols-outlined text-on-surface-variant p-2 active:opacity-80 transition-opacity rounded-full hover:bg-surface-container-low" data-icon="more_vert">more_vert</button>
</header>
<main class="max-w-md mx-auto px-margin-mobile py-stack-lg">
<!-- Profile Photo Upload -->
<section class="flex flex-col items-center mb-stack-lg">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border-4 border-surface shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant text-5xl" data-icon="person">person</span>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary p-2 rounded-full shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="add_a_photo">add_a_photo</span>
</button>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mt-stack-sm">Add profile photo</p>
</section>
<!-- Member Form -->
<form class="space-y-stack-md">
<!-- Names Grid -->
<div class="grid grid-cols-2 gap-gutter">
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 ml-1">First Name</label>
<input class="w-full bg-surface border border-outline rounded-lg px-4 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" placeholder="e.g. John" type="text"/>
</div>
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 ml-1">Last Name</label>
<input class="w-full bg-surface border border-outline rounded-lg px-4 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" placeholder="e.g. Doe" type="text"/>
</div>
</div>
<!-- Phone Number -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 ml-1">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="call">call</span>
<input class="w-full bg-surface border border-outline rounded-lg pl-12 pr-4 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Date of Birth -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 ml-1">Date of Birth</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-primary" data-icon="calendar_today">calendar_today</span>
<input class="w-full bg-surface border border-outline rounded-lg px-4 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline-variant" placeholder="MM / DD / YYYY" type="text"/>
</div>
</div>
<!-- Gender Segmented Control -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-stack-sm ml-1">Gender</label>
<div class="flex w-full border border-outline rounded-lg overflow-hidden h-12">
<button class="flex-1 font-label-lg text-label-lg bg-secondary-container text-on-secondary-container flex items-center justify-center border-r border-outline" type="button">Male</button>
<button class="flex-1 font-label-lg text-label-lg bg-surface text-on-surface-variant flex items-center justify-center border-r border-outline hover:bg-surface-container-low transition-colors" type="button">Female</button>
<button class="flex-1 font-label-lg text-label-lg bg-surface text-on-surface-variant flex items-center justify-center hover:bg-surface-container-low transition-colors" type="button">Other</button>
</div>
</div>
<!-- Role Dropdown (MD3 Exposed Dropdown) -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 ml-1">Group Role</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="admin_panel_settings">admin_panel_settings</span>
<select class="w-full bg-surface border border-outline rounded-lg pl-12 pr-10 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none transition-all cursor-pointer">
<option value="member">Member</option>
<option value="treasurer">Treasurer</option>
<option value="admin">Admin</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
<p class="font-label-md text-label-md text-outline mt-1 px-1">Defines financial permissions for this member.</p>
</div>
<!-- Advanced Options Toggle -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl mt-stack-lg border border-outline-variant">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary" data-icon="notifications_active">notifications_active</span>
<div>
<p class="font-title-sm text-title-sm text-on-surface">Invite via SMS</p>
<p class="font-label-md text-label-md text-on-surface-variant">Send login link immediately</p>
</div>
</div>
<div class="w-12 h-6 bg-primary-container rounded-full relative p-1 cursor-pointer">
<div class="w-4 h-4 bg-on-primary-container rounded-full absolute right-1 top-1 shadow-sm"></div>
</div>
</div>
<!-- Add Member Button -->
<div class="pt-stack-lg">
<button class="w-full bg-primary-container text-on-primary-container h-14 rounded-full font-title-md text-title-md flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform hover:shadow-md" type="submit">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
                    Add Member
                </button>
</div>
</form>
</main>
<!-- BottomNavBar (Filtered based on "Add Member" sub-page logic, but included for ecosystem context) -->
<nav class="fixed bottom-0 w-full flex justify-around items-center py-3 bg-surface shadow-lg z-50 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined filled-icon" data-icon="group" style="font-variation-settings: 'FILL' 1;">group</span>
<span class="font-label-md text-label-md">Members</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-md text-label-md">Groups</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 px-4 py-1" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
<!-- Visual Polish: Decorative Tonal Shape -->
<div class="fixed top-0 right-0 -z-10 w-64 h-64 bg-primary-container opacity-5 rounded-full -mr-32 -mt-32 blur-3xl"></div>
<div class="fixed bottom-24 left-0 -z-10 w-48 h-48 bg-secondary-container opacity-10 rounded-full -ml-24 blur-3xl"></div>
</body></html>
