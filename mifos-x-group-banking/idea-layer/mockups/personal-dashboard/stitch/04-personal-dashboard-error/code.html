<style>

      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .active-ripple:active {
      transform: scale(0.95);
      transition: transform 100ms;

<body class="bg-background text-on-background selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopAppBar Shell -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface h-16 flex items-center justify-between px-margin-mobile w-full">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A professional close-up profile portrait of Kwame, a friendly young man with a warm smile, set against a soft green background that matches the CommonPurse brand identity. The lighting is bright and modern, creating a trustworthy and welcoming corporate aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjUQm744Ywur9-ZSHhp7UT060cw1bzD-oBt9Cz5q3DFBon060e4WQLBJwo2s9B9jqtMG7PKK0eeOWbB7onIrcwXKgqUcSDvoiS7Vbj3fnXb2HGj_V6XY_Qw3Z1raYGaaRdtWqZmovagCiOKATLorJleewSEtQb-nwV2_Tl5fKpkI1v0Ut7H-37DjN0VdjvxQ7v_XGuKNcNz1Tl_z5ZJOsrI6RjsR5r3ALilgAGGP7r0AmgW84-kmxlpHqVa--oo7hDagr4dYodBL4"/>

<h1 class="font-title-lg text-title-lg font-bold text-primary">CommonPurse</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-28 px-margin-mobile min-h-screen flex flex-col items-center justify-center text-center">
<!-- Error Illustration Section -->
<div class="w-full max-w-sm mb-stack-lg animate-fade-in">
<img class="w-full h-auto drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AP1WRLuQ2V7MI7McVs5i2eYHJeJKoAmaSAFsMICzf2s6JMVNSNNe7g5ixUsv7P7kcS1ly43EKpDc7dzJ29ZNnHpGecWTCAh7NymRmqzzktp6OpUOrnr93pqhvNOqcvONTfrGk6wRwiOfsvQ0P6OerURGPgj-W4xYQhms_zHAU4ACcFuMuNf4KmbM9MoJW6_oM5od6_kP1b9MovjvI1_PdX7_YSMt7QF66K0coq3XTKJk7EZ-PSouu3zpBPkNI8Q"/>
</div>
<!-- Error Messaging -->
<div class="space-y-stack-sm mb-stack-lg max-w-xs">
<h2 class="font-title-lg text-title-lg text-on-surface">Connection Hiccup</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">
        We're having trouble reaching your accounts. Please check your internet and try again.
      </p>
</div>
<!-- Primary Action -->
<button class="flex items-center justify-center gap-2 bg-primary text-on-primary font-label-lg text-label-lg px-8 py-3 rounded-full shadow-sm hover:opacity-90 active:scale-95 transition-all duration-100 cursor-pointer" id="retry-button">
<span class="material-symbols-outlined text-[20px]">refresh</span>
<span>Retry</span>
</button>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container rounded-t-xl shadow-md flex justify-around items-center h-20 px-gutter pb-safe">
<!-- Home (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-100 cursor-pointer">
<span class="material-symbols-outlined">home</span>
<span class="font-label-lg text-label-lg">Home</span>
</div>
<!-- Savings (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-100 cursor-pointer">
<span class="material-symbols-outlined">account_balance_wallet</span>
<span class="font-label-lg text-label-lg">Savings</span>
</div>
<!-- Loans (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-100 cursor-pointer">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-lg text-label-lg">Loans</span>
</div>
<!-- Profile (Inactive - Although common for error screens to not highlight a tab, let's keep them all inactive or highlight Home as base) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1 hover:bg-surface-container-highest transition-all active:scale-90 duration-100 cursor-pointer">
<span class="material-symbols-outlined">person</span>
<span class="font-label-lg text-label-lg">Profile</span>
</div>
</nav>
<script>
    document.getElementById('retry-button').addEventListener('click', function() {
      // Micro-interaction for feedback
      const btn = this;
      const icon = btn.querySelector('.material-symbols-outlined');
      
      icon.style.transition = 'transform 0.5s ease-in-out';
      icon.style.transform = 'rotate(360deg)';
      
      setTimeout(() => {
        icon.style.transform = 'rotate(0deg)';
      }, 500);
    });
  </script>
