<script>
        // Simple micro-interaction for list item deletion simulation
        document.querySelectorAll('button[data-icon="delete"]').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const item = this.closest('.group');
                item.style.opacity = '0';
                item.style.transform = 'translateX(20px)';
                setTimeout(() => {
                    item.remove();
                }, 300);
            });
        });

        // Search bar focus effect
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('scale-[1.01]');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('scale-[1.01]');
        });
    </script>
