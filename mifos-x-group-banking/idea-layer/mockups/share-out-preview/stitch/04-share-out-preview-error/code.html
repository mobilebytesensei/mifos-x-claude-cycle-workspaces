<script>
        function handleRetry() {
            const btn = event.currentTarget;
            const icon = btn.querySelector('.material-symbols-outlined');
            
            // Interaction feedback
            icon.classList.add('animate-spin');
            btn.style.opacity = '0.7';
            btn.disabled = true;
            
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.style.opacity = '1';
                btn.disabled = false;
                // Logic for refresh would go here
            }, 1500);
        }

        // Handle Active states for nav (Visual simulation)
        const navItems = document.querySelectorAll('nav a');
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                navItems.forEach(i => {
                    i.className = "flex flex-col items-center justify-center text-on-secondary-fixed-variant dark:text-secondary-fixed-dim px-4 py-1 hover:bg-secondary-container/50 transition-all";
                    const span = i.querySelector('.material-symbols-outlined');
                    if(span) span.style.fontVariationSettings = "'FILL' 0";
                });
                item.className = "flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-5 py-1 active:scale-90 duration-200 ease-in-out";
                const activeSpan = item.querySelector('.material-symbols-outlined');
                if(activeSpan) activeSpan.style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
