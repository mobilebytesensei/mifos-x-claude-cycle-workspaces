<script>
        // Micro-interaction for the refresh button
        const refreshBtn = document.querySelector('button[aria-label="Refresh content"]');
        refreshBtn.addEventListener('click', () => {
            const icon = refreshBtn.querySelector('.material-symbols-outlined');
            icon.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            icon.style.transform = 'rotate(360deg)';
            
            // Simulating a data reload
            setTimeout(() => {
                icon.style.transition = 'none';
                icon.style.transform = 'rotate(0deg)';
                
                // Add a quick flash to show something "happened"
                const elements = document.querySelectorAll('.shimmer, .shimmer-dark');
                elements.forEach(el => {
                    el.style.opacity = '0.5';
                    setTimeout(() => el.style.opacity = '1', 150);
                });
            }, 600);
        });

        // Navigation Taps
        const navItems = document.querySelectorAll('nav > div');
        navItems.forEach(item => {
            item.addEventListener('click', function() {
                // Remove active classes from all
                navItems.forEach(i => {
                    i.className = 'flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:scale-95 duration-150';
                });
                // Add active state to clicked (this matches the JSON "style_active_navigation")
                this.className = 'flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-xl py-xs active:scale-95 transition-transform duration-150 cursor-pointer';
            });
        });
    </script>
