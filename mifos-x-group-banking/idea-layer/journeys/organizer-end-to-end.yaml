# User journey: organizer-end-to-end
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-07-17 via self-signup pivot regeneration
# PRIMARY persona (Kofi) full path — self-signup to share-out.
# ═══════════════════════════════════════════════════════════════

id: organizer-end-to-end
version: "1.0.0"
name: "Organizer End-to-End: Signup to Share-Out"
description: >
  The PRIMARY journey for CommonPurse post-self-signup-pivot. Kofi downloads the
  app, self-registers (no back-office officer), creates his first group and picks
  its type, invites members, runs a full meeting (attendance → savings → loans →
  close), and at cycle end previews and executes the share-out. This is the
  end-to-end organizer lifecycle — the default path for any new user.

persona:
  archetype: self-signup group organizer (Kofi — primary persona)
  jtbd: "start a savings group from scratch and run its full lifecycle end-to-end"
  context: "brand-new user; no group exists yet; wants to self-serve without a field officer"
  knowledge_level: community leader; comfortable with a smartphone; not a bank employee
  emotional_state: "motivated — wants to get his group running quickly and transparently"

goal: >
  Kofi self-signs-up, creates and configures a typed group, invites members,
  conducts a full meeting, and executes the cycle-end share-out — all without
  any back-office provisioning. Role of organizer is earned on group creation.

success_metric:
  name: organizer_lifecycle_completion_rate
  kind: funnel
  target: ">=70% of self_signup_completed reach share_out_executed across the cycle"
  measurement: |
    Funnel: signup_completed → group_created → members_invited
      → meeting_conducted → share_out_previewed → share_out_executed

screen_sequence:
  - screen_id: login-signup
    feature_id: login-signup
    state: content
    user_intent: "self-register a new account with no back-office involvement"
    success_signal: "account created; lands in zero-group state; taps Create Group"
  - screen_id: group-type-picker
    feature_id: group-type-picker
    state: content
    user_intent: "choose the group model (VSLA, ROSCA, SHG…) that fits the community"
    success_signal: "group type selected; proceeds to the create wizard"
  - screen_id: group-create
    feature_id: group-create
    state: content
    user_intent: "complete the 4-step wizard — name, cycle rules, limits, review"
    success_signal: "wizard submitted; group created; Kofi is now its organizer"
  - screen_id: member-invite
    feature_id: member-invite
    state: content
    user_intent: "generate an invite link/code and share it with community members"
    success_signal: "invite generated; pending invites list shows sent invitations"
  - screen_id: meeting-calendar
    feature_id: meeting-lifecycle
    state: content
    user_intent: "select today's meeting to begin the session"
    success_signal: "taps today's meeting row to start the wizard"
  - screen_id: meeting-conduct
    feature_id: meeting-conduct
    state: content
    user_intent: "run the 7-step meeting — review → attendance → opening → savings → loan review → applications → close"
    success_signal: "all steps completed; meeting submitted; dt_meeting_record written"
  - screen_id: meeting-summary
    feature_id: meeting-lifecycle
    state: content
    user_intent: "review meeting totals and closing corpus balance"
    success_signal: "summary rendered with correct closing balance"
  - screen_id: share-out-preview
    feature_id: share-out
    state: content
    user_intent: "at cycle end, review per-member allocation before the group"
    success_signal: "allocation verified; group confirms; proceeds to execute"
  - screen_id: share-out-execute
    feature_id: share-out
    state: idle
    user_intent: "confirm and execute the cycle-end distribution"
    success_signal: "Execute Share-Out confirmed; dt_share_out written"

expected_outcome: >
  A new self-signed-up user has stood up a group without any back-office setup,
  configured it for its type, onboarded members via invite, recorded a full
  meeting's transactions, and executed the cycle-end share-out. dt_member_role
  carries Kofi as organizer for the group; dt_share_out records the payout.

flows:
  - { feature_id: login-signup, flow_id: self-signup, role: primary }
  - { feature_id: group-create, flow_id: group-creation, role: primary }
  - { feature_id: member-invite, flow_id: member-invitations, role: primary }
  - { feature_id: meeting-conduct, flow_id: meeting, role: primary }
  - { feature_id: share-out, flow_id: share-out, role: primary }

capabilities_used: [has_ui, has_api, has_offline_cache, has_flow]
tier: critical
entry_point: login-signup
exit_point: share-out-execute

preconditions:
  - "App freshly installed; no prior account"
  - "Self-signup enabled (default deployment — no back-office provisioning required)"

failure_modes:
  - cause: "Signup network failure"
    recovery_screen: login-signup
    notes: "Form state preserved; retry button shown."
  - cause: "Group name already exists for this organizer"
    recovery_screen: group-create
    notes: "Inline validation on the name field in step 1."
  - cause: "Network fails mid-meeting"
    recovery_screen: meeting-conduct
    notes: "Steps save to local Room DB first; sync queue retries."
  - cause: "Outstanding loans not resolved at cycle end"
    recovery_screen: share-out-preview
    notes: "Warning: outstanding loans reduce individual shares before execute."

tags: [organizer, self-signup, lifecycle, end-to-end, primary, critical]
