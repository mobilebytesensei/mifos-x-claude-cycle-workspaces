# User journey: end-user-auth-to-dashboard
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-05-08 via /idea-migration reference
# ═══════════════════════════════════════════════════════════════

id: end-user-auth-to-dashboard
version: "1.0.0"
name: "End User Authentication to Personal Dashboard"
description: >
  Sign-in journey for group members (end users) who use the self-service portal
  to check personal savings, loan status, and loan requests. Authenticates via
  Fineract self-service endpoint and lands on personal dashboard.

persona:
  archetype: group member (self-service)
  jtbd: "check my savings balance and loan status between meetings"
  context: "at home, checking app on their own time; not during a meeting"
  knowledge_level: basic smartphone user; may be first-time app user
  emotional_state: "curious about their savings balance"

goal: >
  End user completes self-service authentication and reaches personal-dashboard
  showing savings balance, loan status, and next meeting date.

success_metric:
  name: end_user_auth_completion_rate
  kind: funnel
  target: ">=90% of member_tile_tapped reach personal_dashboard within 45s"
  measurement: |
    Funnel: client_type_selector_viewed → member_tile_tapped
      → login_submitted → self_auth_success → personal_dashboard_rendered

screen_sequence:
  - screen_id: client-type-selector
    feature_id: authentication
    state: idle
    user_intent: "identify as a group member"
    success_signal: "taps Member tile"
  - screen_id: login
    feature_id: authentication
    state: idle
    user_intent: "enter self-service credentials"
    success_signal: "login form submitted successfully"
  - screen_id: personal-dashboard
    feature_id: end-user-dashboard
    state: content
    user_intent: "see personal savings and loan summary"
    success_signal: "savings balance and loan status rendered"

expected_outcome: >
  Fineract self-service token cached. Personal dashboard loaded with individual
  savings balance, active loan amount, next meeting date.

flows:
  - { feature_id: authentication, flow_id: end-user-auth, role: primary }

capabilities_used:
  - has_ui
  - has_api
  - has_flow
  - is_auth_feature

tier: critical

preconditions:
  - "Fineract self-service endpoint is accessible"
  - "Member registered as end_user in dt_member_role"

failure_modes:
  - cause: "Invalid self-service credentials"
    recovery_screen: login
    notes: "Error message shown. User can try again or contact treasurer."
  - cause: "Member not in dt_member_role as end_user"
    recovery_screen: login
    notes: "Show contact-treasurer guidance."

tags:
  - auth-journey
  - end-user
  - critical-funnel
