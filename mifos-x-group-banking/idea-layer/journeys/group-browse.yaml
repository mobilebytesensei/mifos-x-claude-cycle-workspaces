# User journey: group-browse
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-07-31 — covers group-list (journey-missing).
# The organizer's groups landing: browse/search the group list and
# open a group, or start creating a new one. Faithful to
# group-list/flow.yaml: on_group_click → group-dashboard,
# on_create_group → group-create.
# ═══════════════════════════════════════════════════════════════

id: group-browse
version: "1.0.0"
name: "Browse Groups and Open a Group"
description: >
  Everyday organizer navigation: from the group list (the admin/organizer groups
  landing reached after login or from the organizer dashboard), the organizer
  searches or scrolls their groups, then taps a group to open its dashboard — or
  taps the FAB to start creating a new group. This is the recurring browse-to-open
  flow that precedes every group-scoped task (meetings, members, loans, share-out).

persona:
  archetype: returning group organizer with one or more existing groups
  jtbd: "find the group I want and open it so I can act on it"
  context: "opening the app to run a task for a specific group"
  knowledge_level: familiar — has used the app before and manages several groups
  emotional_state: "task-oriented — knows which group they need"

goal: >
  Organizer locates the target group in the list and opens its dashboard, ready to
  begin a group-scoped task.

success_metric:
  name: group_open_rate
  kind: completion
  target: ">=95% of group_list_viewed reach a group_dashboard opened"
  measurement: |
    Funnel: group_list_viewed → group_row_tapped → group_dashboard rendered

screen_sequence:
  - screen_id: group-list
    feature_id: group-list
    state: content
    user_intent: "search or scroll to find the target group"
    success_signal: "taps a group row (or the Create Group FAB for a new group)"
  - screen_id: group-dashboard
    feature_id: group-management
    state: content
    user_intent: "land on the selected group's dashboard to begin a task"
    success_signal: "group dashboard renders with the selected group's corpus + summary"

expected_outcome: >
  Organizer has navigated from the group list into a specific group's dashboard and
  is positioned to run a group-scoped task (meeting, members, loans, share-out).

flows:
  - { feature_id: group-list, flow_id: group-list, role: primary }

capabilities_used: [has_ui, has_api, has_offline_cache, has_flow]
tier: medium
entry_point: group-list
exit_point: group-dashboard

preconditions:
  - "Organizer authenticated (SessionManager)"
  - "At least one group exists for the organizer (else the empty state routes to create)"

failure_modes:
  - cause: "get_centers list fetch fails"
    recovery_screen: group-list
    notes: "show_error state with retry; cached SQLDelight groups shown when available."
  - cause: "No groups yet (zero-group state)"
    recovery_screen: group-list
    notes: "Empty state surfaces Create Group CTA → group-create (see group-creation-flow)."

tags: [group-list, group-management, navigation, browse, organizer, medium]
