id: admin-auth-to-dashboard
version: "1.0.0"
name: "Admin Authentication to Dashboard"
description: >
  Primary sign-in journey for admin users (group treasurers, chairpersons,
  field officers). User selects the Admin tile on the client type selector,
  enters Fineract credentials, and lands on the admin dashboard with corpus
  balance and meeting countdown loaded.

persona:
  archetype: group treasurer or field officer
  jtbd: "authenticate and see my group's financial status immediately"
  context: "opening app at start of meeting day; needs corpus balance before meeting"
  knowledge_level: familiar with basic mobile apps; first-time Fineract users
  emotional_state: "purposeful — has a meeting to conduct"

goal: >
  Admin completes authentication via Fineract staff credentials and reaches
  admin-dashboard with corpus balance, member count, and next meeting visible.

success_metric:
  name: admin_auth_completion_rate
  kind: funnel
  target: ">=95% of admin_tile_tapped reach admin_dashboard within 30s"
  measurement: |
    Funnel: client_type_selector_viewed → admin_tile_tapped
      → login_submitted → auth_success → admin_dashboard_rendered

screen_sequence:
  - screen_id: client-type-selector
    feature_id: authentication
    state: idle
    user_intent: "identify as admin (treasurer/chairperson/field officer)"
    success_signal: "taps Admin tile"
  - screen_id: login
    feature_id: authentication
    state: idle
    user_intent: "enter Fineract username and password"
    success_signal: "login form submitted successfully"
  - screen_id: admin-dashboard
    feature_id: authentication
    state: content
    user_intent: "see group overview before conducting meeting"
    success_signal: "corpus balance card and member count rendered"

expected_outcome: >
  Fineract session token cached. Admin dashboard loaded with group context:
  corpus balance, member count, next meeting date, pending loan count.

flows:
  - { feature_id: authentication, flow_id: admin-auth, role: primary }

capabilities_used:
  - has_ui
  - has_api
  - has_flow
  - is_auth_feature

tier: critical

preconditions:
  - "Fineract server is accessible (online or sandbox)"
  - "Admin client type registered in dt_member_role"

failure_modes:
  - cause: "Invalid Fineract credentials"
    recovery_screen: login
    notes: "Error message shown: 'Invalid username or password'. Retry allowed."
  - cause: "Network timeout during authentication"
    recovery_screen: login
    notes: "Offline login via cached PIN attempted if biometric/PIN enabled."
  - cause: "Account not registered as admin in dt_member_role"
    recovery_screen: login
    notes: "Show: 'Account not authorized as admin. Contact your group administrator.'"

tags:
  - auth-journey
  - admin
  - critical-funnel
