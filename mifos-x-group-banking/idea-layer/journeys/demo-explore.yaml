# User journey: demo-explore
# ═══════════════════════════════════════════════════════════════
# Authored: 2026-08-01 for the demo-explore launch capability (F1 / B1).
# Prospective user tries the app offline via a seeded demo session
# before committing to sign-up or an invitation.
# ═══════════════════════════════════════════════════════════════

id: demo-explore
version: "1.0.0"
name: "Explore CommonPurse as a Demo User"
description: >
  The zero-commitment evaluation path. A prospective organizer opens the app, taps
  "Demo Explore", confirms the demo notice, and is dropped into a fully-seeded offline
  session as the organizer of a sample VSLA (Mwangaza Women's Group). They browse the
  organizer dashboard, open the meeting calendar, review members and savings, and get a
  feel for the full app — all without a live server, an account, or any real data written.

persona:
  archetype: prospective organizer evaluating the app (Kofi — pre-signup)
  jtbd: "see what the app actually does before I create an account or accept an invite"
  context: "just installed the app; no account yet; wants a risk-free look; may be offline"
  knowledge_level: community leader; comfortable with a smartphone; not a bank employee
  emotional_state: "curious but cautious — wants proof the app is real before committing"

goal: >
  A prospective user experiences the full organizer surface through a seeded, offline demo
  session, then can exit to sign up or accept an invitation for real.

success_metric:
  name: demo_explore_to_signup_rate
  kind: funnel
  target: ">=40% of demo_confirm_accepted reach organizer_dashboard and browse >=2 surfaces"
  measurement: |
    Funnel: demo_explore_tapped → demo_confirm_accepted
      → demo_session_seeded → organizer_dashboard_rendered → surface_explored

screen_sequence:
  - screen_id: login-signup
    feature_id: login-signup
    state: content
    user_intent: "try the app without creating an account — tap Demo Explore"
    success_signal: "confirm dialog shown; user accepts the demo notice"
  - screen_id: organizer-dashboard
    feature_id: organizer-dashboard
    state: content
    user_intent: "explore the seeded group's corpus, members, and next meeting"
    success_signal: "dashboard renders in demo mode with the seeded Mwangaza Women's Group"
  - screen_id: meeting-calendar
    feature_id: meeting-lifecycle
    state: content
    user_intent: "see how meetings are scheduled and conducted"
    success_signal: "seeded upcoming + past meetings render for the demo group"
  - screen_id: member-list
    feature_id: member-onboarding
    state: content
    user_intent: "browse the group's members"
    success_signal: "seeded member roster renders"
  - screen_id: savings-dashboard
    feature_id: savings-collection
    state: content
    user_intent: "review the group's savings position"
    success_signal: "seeded savings balances render; user has explored the core surfaces"

expected_outcome: >
  The prospective user has explored the organizer dashboard, meeting calendar, member list,
  and savings dashboard of a seeded demo group entirely offline. No account was created and
  nothing was written to a server. The demo session can be exited back to login-signup to
  sign up or accept an invitation for real.

flows:
  - { feature_id: demo-explore, flow_id: demo-explore, role: primary }
  - { feature_id: meeting-lifecycle, flow_id: meeting, role: sub_flow }

capabilities_used: [has_ui, has_offline_cache, has_flow]
tier: critical
entry_point: login-signup
exit_point: savings-dashboard

preconditions:
  - "App freshly installed; no prior account"
  - "Bundled offline demo data present (PROJECT_DEMO_DATA.yaml)"

failure_modes:
  - cause: "User cancels the demo confirm dialog"
    recovery_screen: login-signup
    notes: "Returns to the auth form; can log in, sign up, or accept an invitation."
  - cause: "User attempts a write while in demo mode"
    recovery_screen: organizer-dashboard
    notes: "Write is a local-only no-op; a 'Sign up to save changes' prompt is shown."

tags: [demo, explore, offline, pre-signup, evaluation, critical]
