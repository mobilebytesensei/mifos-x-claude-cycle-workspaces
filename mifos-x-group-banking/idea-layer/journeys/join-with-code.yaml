# User journey: join-with-code
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-07-17 via self-signup pivot regeneration
# Invitee (new member) path — receives invite, self-registers, lands
# on personal dashboard with a per-group member role.
# ═══════════════════════════════════════════════════════════════

id: join-with-code
version: "1.0.0"
name: "Join a Group with an Invite Code"
description: >
  The invitee path under the self-signup model. A community member receives an
  invite link/code from an organizer, enters it, self-registers with the unified
  signup, and lands on their personal dashboard holding the member role for that
  group. From there they view their savings and loans and can submit a loan
  request for organizer/chairperson review.

persona:
  archetype: prospective group member (Grace — member persona)
  jtbd: "join a savings group I was invited to and see my own financial position"
  context: "received an invite code from an organizer; new to the app; owns a phone"
  knowledge_level: basic smartphone user; low-literacy-friendly UI expected
  emotional_state: "curious and hopeful — wants to participate and verify records"

goal: >
  Invitee redeems an invite code, self-registers, and lands on the personal
  dashboard with a resolved per-group member role. They can view savings/loans
  and submit a loan request that queues for organizer review.

success_metric:
  name: invite_redemption_completion_rate
  kind: funnel
  target: ">=80% of join_code_entered reach personal_dashboard with member role resolved"
  measurement: |
    Funnel: join_code_entered → signup_completed
      → personal_dashboard_rendered → loan_request_submitted (optional)

screen_sequence:
  - screen_id: join-with-code
    feature_id: join-with-code
    state: content
    user_intent: "enter the invite code received from the organizer"
    success_signal: "code validated; invite resolved to a group; proceeds to signup"
  - screen_id: login-signup
    feature_id: login-signup
    state: content
    user_intent: "self-register a new account to accept the invitation"
    success_signal: "account created; membership recorded in dt_member_role for the group"
  # F5 (2026-08-01): the single post-join LANDING is personal-dashboard (per member role).
  # join-with-code/flow.yaml on_confirm_join now emits NavigateToPersonalDashboard (was
  # group-dashboard); loan-request below is the journey's OPTIONAL onward terminal, not a
  # competing landing. All three references (this journey, INDEX, flow.yaml) now agree.
  - screen_id: personal-dashboard
    feature_id: personal-dashboard
    state: content
    user_intent: "see own savings balance, loan status, and group summary"
    success_signal: "dashboard renders with per-group member role and personal figures (post-join landing)"
  - screen_id: personal-savings
    feature_id: end-user-dashboard
    state: content
    user_intent: "review own savings contributions and balance"
    success_signal: "savings history renders for the joined group"
  - screen_id: personal-loans
    feature_id: end-user-dashboard
    state: content
    user_intent: "review own loans; navigate to request a new loan"
    success_signal: "taps Request Loan"
  - screen_id: loan-request
    feature_id: loan-request
    state: idle
    user_intent: "enter loan amount and purpose"
    success_signal: "request submitted; dt_loan_request record created with status submitted"

expected_outcome: >
  A newly invited user is a resolved member of the group (dt_member_role holds
  roleInGroup=member). They view their own savings and loans and have submitted
  a loan request that queues for organizer/chairperson review at the next meeting.

flows:
  - { feature_id: join-with-code, flow_id: member-invitations, role: primary }
  - { feature_id: login-signup, flow_id: self-signup, role: sub_flow }
  - { feature_id: loan-request, flow_id: end-user-loan-request, role: sub_flow }

capabilities_used: [has_ui, has_api, has_flow]
tier: critical
entry_point: join-with-code
exit_point: loan-request

preconditions:
  - "Organizer has generated a valid, unexpired invite code"
  - "Self-signup enabled (default deployment)"

failure_modes:
  - cause: "Invite code invalid or expired"
    recovery_screen: join-with-code
    notes: "Inline error; prompt to request a fresh code from the organizer."
  - cause: "Signup network failure"
    recovery_screen: login-signup
    notes: "Form state preserved; retry button shown."
  - cause: "Request amount exceeds group lending ceiling"
    recovery_screen: loan-request
    notes: "Soft warning shown; submission allowed — group votes on final amount."

tags: [member, join, invite, self-signup, onboarding, critical]
