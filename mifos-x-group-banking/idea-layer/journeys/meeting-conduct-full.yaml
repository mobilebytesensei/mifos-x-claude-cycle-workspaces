# User journey: meeting-conduct-full
# ═══════════════════════════════════════════════════════════════
# Rewritten: 2026-07-17 for self-signup pivot — organizer/treasurer
# conducts the meeting. 7-step wizard grounded in meeting-conduct's
# real currentStep model (step0..step6).
# ═══════════════════════════════════════════════════════════════

id: meeting-conduct-full
version: "2.0.0"
name: "Conduct Full Group Meeting"
description: >
  Core organizer journey for conducting a full savings group meeting. Covers the
  7-step meeting wizard: previous-meeting review → attendance → opening balance →
  savings collection → loan review → loan applications → closing balance & close,
  then the summary. The most complex journey in CommonPurse, touching multiple
  features and many API calls.

persona:
  archetype: group organizer or delegated treasurer
  jtbd: "conduct the weekly meeting and record all financial transactions accurately"
  context: "weekly meeting in session; members present; mobile network may be intermittent"
  knowledge_level: experienced organizer who knows the VSLA meeting process
  emotional_state: "focused and methodical; under social pressure to be accurate"

goal: >
  Organizer/treasurer completes all 7 meeting steps and reaches the meeting
  summary with correct totals and a correct closing corpus balance.

success_metric:
  name: meeting_completion_rate
  kind: funnel
  target: ">=80% of meeting_started reach meeting_summary within 45 minutes"
  measurement: |
    Funnel: meeting_calendar_viewed → meeting_started
      → attendance_completed → savings_completed → meeting_closed → summary_rendered

screen_sequence:
  - screen_id: meeting-calendar
    feature_id: meeting-lifecycle
    state: content
    user_intent: "select today's meeting to begin"
    success_signal: "taps today's meeting row"
  - screen_id: meeting-conduct
    feature_id: meeting-conduct
    state: content
    user_intent: "step 0-1 — review previous meeting, then mark attendance present/late/absent with fines"
    success_signal: "attendance recorded; proceeds through the wizard"
  - screen_id: meeting-conduct
    feature_id: meeting-conduct
    state: content
    user_intent: "step 2-3 — confirm opening balance, then collect savings deposits per member"
    success_signal: "all deposits entered; corpus band updates"
  - screen_id: meeting-conduct
    feature_id: meeting-conduct
    state: content
    user_intent: "step 4-5 — review loans/repayments, then vote on new loan applications"
    success_signal: "votes and repayments recorded"
  - screen_id: meeting-conduct
    feature_id: meeting-conduct
    state: content
    user_intent: "step 6 — review closing corpus balance and close the meeting"
    success_signal: "meeting submitted; dt_meeting_record written"
  - screen_id: meeting-summary
    feature_id: meeting-lifecycle
    state: content
    user_intent: "review meeting totals and share the summary"
    success_signal: "summary rendered with the correct closing balance"

expected_outcome: >
  dt_meeting_record created with the full meeting summary. dt_meeting_attendance
  records created for all members. All savings deposits posted. Loan votes
  recorded. Repayments posted. Corpus balance updated.

flows:
  - { feature_id: meeting-conduct, flow_id: meeting, role: primary }

capabilities_used: [has_ui, has_api, has_offline_cache, has_flow]
tier: critical
entry_point: meeting-calendar
exit_point: meeting-summary

preconditions:
  - "Organizer/treasurer authenticated; holds the role for this group"
  - "Group has active members with savings accounts"
  - "dt_group_config loaded for fines and contribution rules"

failure_modes:
  - cause: "Network fails mid-meeting"
    recovery_screen: meeting-conduct
    notes: "All steps save to local Room DB first. Sync queue handles retry."
  - cause: "Corpus insufficient for loan disbursement"
    recovery_screen: meeting-conduct
    notes: "Disbursement blocked. Corpus card shows deficit. Loan deferred."

tags: [meeting-lifecycle, meeting-conduct, savings-collection, loan-management, corpus-tracking, organizer, critical]
