# User journey: meeting-conduct-full
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-05-08 via /idea-migration reference
# ═══════════════════════════════════════════════════════════════

id: meeting-conduct-full
version: "1.0.0"
name: "Conduct Full Group Meeting"
description: >
  Core admin journey for conducting a full savings group meeting. Covers the
  complete meeting workflow: attendance recording → savings collection → loan
  votes → loan repayments → meeting close and summary. The most complex journey
  in CommonPurse, touching 5 features and 10+ Fineract API calls.

persona:
  archetype: group treasurer
  jtbd: "conduct the weekly meeting and record all financial transactions accurately"
  context: "weekly meeting in session; 15 members present; mobile network may be intermittent"
  knowledge_level: experienced treasurer; knows the VSLA meeting process
  emotional_state: "focused and methodical; under social pressure to be accurate"

goal: >
  Treasurer completes all meeting steps (attendance, savings, loans, repayments)
  and reaches meeting summary with correct totals and closing corpus balance.

success_metric:
  name: meeting_completion_rate
  kind: funnel
  target: ">=80% of meeting_started reach meeting_summary within 45 minutes"
  measurement: |
    Funnel: meeting_calendar_viewed → meeting_started
      → attendance_completed → savings_completed → meeting_closed → summary_rendered

screen_sequence:
  - screen_id: meeting-calendar
    feature_id: meeting-lifecycle
    state: content
    user_intent: "select today's meeting to begin"
    success_signal: "taps today's meeting row"
  - screen_id: meeting-conduct
    feature_id: meeting-lifecycle
    state: attendance_step
    user_intent: "mark each member present/late/absent with fines"
    success_signal: "all members marked; proceed to savings"
  - screen_id: meeting-conduct
    feature_id: savings-collection
    state: savings_step
    user_intent: "enter deposit amount for each member"
    success_signal: "all deposits entered; proceed to loans"
  - screen_id: meeting-conduct
    feature_id: loan-management
    state: loan_votes_step
    user_intent: "vote on pending loan applications"
    success_signal: "all votes recorded"
  - screen_id: meeting-conduct
    feature_id: loan-management
    state: repayments_step
    user_intent: "record loan repayments from members"
    success_signal: "repayments posted"
  - screen_id: meeting-conduct
    feature_id: corpus-tracking
    state: close_step
    user_intent: "review closing corpus balance and close meeting"
    success_signal: "meeting closed; dt_meeting_record written"
  - screen_id: meeting-summary
    feature_id: meeting-lifecycle
    state: content
    user_intent: "review meeting totals and share summary"
    success_signal: "summary rendered with correct closing balance"

expected_outcome: >
  dt_meeting_record created with full meeting summary. dt_meeting_attendance
  records created for all members. All savings deposits posted to Fineract
  savings accounts. Loan votes recorded. Repayments posted. Corpus balance updated.

flows:
  - { feature_id: meeting-lifecycle, flow_id: meeting, role: primary }

capabilities_used: [has_ui, has_api, has_offline_cache, has_flow]
tier: critical
entry_point: meeting-calendar
exit_point: meeting-summary

preconditions:
  - "Admin authenticated"
  - "Group has active members with savings accounts"
  - "dt_group_config loaded for fines and contribution rules"

failure_modes:
  - cause: "Network fails mid-meeting"
    recovery_screen: meeting-conduct
    notes: "All steps save to local Room DB first. Sync queue handles retry."
  - cause: "Corpus insufficient for loan disbursement"
    recovery_screen: meeting-conduct
    notes: "Disbursement blocked. Corpus card shows deficit. Loan deferred."

tags: [meeting-lifecycle, savings-collection, loan-management, corpus-tracking, critical]
