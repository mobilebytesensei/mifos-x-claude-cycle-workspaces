# User journey: end-user-loan-request
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-05-08 via /idea-migration reference
# ═══════════════════════════════════════════════════════════════

id: end-user-loan-request
version: "1.0.0"
name: "End User Loan Request Submission"
description: >
  Self-service journey for group members to submit a loan request for review
  at the next meeting. Member enters amount and purpose; request is saved in
  dt_loan_request for the admin to review during meeting preparation.

persona:
  archetype: group member (self-service end user)
  jtbd: "submit a loan request so the group can vote on it at the next meeting"
  context: "at home between meetings; has a financial need; wants to request before next meeting"
  knowledge_level: basic smartphone user
  emotional_state: "hopeful but slightly nervous about group approval"

goal: >
  End user submits a loan request with amount and purpose. Request saved in
  dt_loan_request with status 'submitted'. Confirmation shown.

success_metric:
  name: loan_request_submission_rate
  kind: funnel
  target: ">=85% of loan_request_form_opened reach loan_request_submitted"

screen_sequence:
  - screen_id: personal-loans
    feature_id: end-user-dashboard
    state: content
    user_intent: "navigate to request a loan"
    success_signal: "taps Request Loan FAB"
  - screen_id: loan-request
    feature_id: end-user-dashboard
    state: idle
    user_intent: "enter loan amount and purpose"
    success_signal: "request submitted; dt_loan_request record created"

expected_outcome: >
  dt_loan_request record created with status 'submitted'. End user sees
  confirmation and request appears in personal-loans with status indicator.

flows:
  - { feature_id: end-user-dashboard, flow_id: end-user-loan-request, role: primary }

capabilities_used: [has_ui, has_api, has_flow]
tier: medium
entry_point: personal-loans
exit_point: loan-request

preconditions:
  - "End user authenticated via self-service"
  - "No existing pending loan request (one at a time)"

failure_modes:
  - cause: "Request amount exceeds group lending ceiling"
    recovery_screen: loan-request
    notes: "Soft warning shown but submission allowed — group votes on final amount."

tags: [end-user-dashboard, loan-request, end-user, medium]
