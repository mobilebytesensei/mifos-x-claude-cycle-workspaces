# User journey: end-user-loan-request
# ═══════════════════════════════════════════════════════════════
# Rewritten: 2026-07-17 for self-signup pivot — member (unified
# identity, member role), not "end user" account type.
# ═══════════════════════════════════════════════════════════════

id: end-user-loan-request
version: "2.0.0"
name: "Member Loan Request Submission"
description: >
  Self-service journey for a group member to submit a loan request for review at
  the next meeting. The member enters amount and purpose; the request is saved in
  dt_loan_request for the organizer/chairperson to review during meeting prep.

persona:
  archetype: group member (unified identity, member role)
  jtbd: "submit a loan request so the group can vote on it at the next meeting"
  context: "at home between meetings; has a financial need; wants to request early"
  knowledge_level: basic smartphone user
  emotional_state: "hopeful but slightly nervous about group approval"

goal: >
  Member submits a loan request with amount and purpose. Request saved in
  dt_loan_request with status 'submitted'. Confirmation shown.

success_metric:
  name: loan_request_submission_rate
  kind: funnel
  target: ">=85% of loan_request_form_opened reach loan_request_submitted"

screen_sequence:
  - screen_id: personal-loans
    feature_id: end-user-dashboard
    state: content
    user_intent: "navigate to request a loan"
    success_signal: "taps Request Loan FAB"
  - screen_id: loan-request
    feature_id: loan-request
    state: idle
    user_intent: "enter loan amount and purpose"
    success_signal: "request submitted; dt_loan_request record created"

expected_outcome: >
  dt_loan_request record created with status 'submitted'. Member sees confirmation
  and the request appears in personal-loans with a status indicator, queued for
  organizer/chairperson review.

flows:
  - { feature_id: loan-request, flow_id: end-user-loan-request, role: primary }

capabilities_used: [has_ui, has_api, has_flow]
tier: medium
entry_point: personal-loans
exit_point: loan-request

preconditions:
  - "Member authenticated via unified self-signup; holds member role in the group"
  - "No existing pending loan request (one at a time)"

failure_modes:
  - cause: "Request amount exceeds group lending ceiling"
    recovery_screen: loan-request
    notes: "Soft warning shown but submission allowed — group votes on final amount."

tags: [end-user-dashboard, loan-request, member, medium]
