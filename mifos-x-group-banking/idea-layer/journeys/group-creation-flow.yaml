# User journey: group-creation-flow
# ═══════════════════════════════════════════════════════════════
# Rewritten: 2026-07-17 for self-signup pivot — organizer self-creates
# a typed group; no back-office officer. Type picker now precedes the
# create wizard (VSLA/ROSCA/SHG… adapt the form).
# ═══════════════════════════════════════════════════════════════

id: group-creation-flow
version: "2.0.0"
name: "Create a New Savings Group (Organizer Self-Serve)"
description: >
  Organizer path to create a new savings group with no back-office involvement.
  From the zero-group state (or the group list), Kofi picks the group type, then
  completes the 4-step create wizard (name + cycle rules + limits + review), and
  lands on the group dashboard ready to invite members. Role of organizer is
  earned on group creation.

persona:
  archetype: self-signup group organizer (Kofi)
  jtbd: "register a new savings group so members can start contributing"
  context: "just signed up; no group yet; wants to self-serve the setup"
  knowledge_level: community leader familiar with his group's savings model
  emotional_state: "task-focused — wants the rules right before the first meeting"

goal: >
  Organizer selects a group type, completes the create wizard with correct cycle
  rules, and lands on the group dashboard ready to onboard members.

success_metric:
  name: group_creation_completion_rate
  kind: funnel
  target: ">=85% of group_type_selected reach group_dashboard"

screen_sequence:
  - screen_id: group-type-picker
    feature_id: group-type-picker
    state: content
    user_intent: "choose the group model (VSLA, ROSCA, SHG…) that fits the community"
    success_signal: "group type selected; proceeds to the create wizard"
  - screen_id: group-create
    feature_id: group-create
    state: content
    user_intent: "complete the 4-step wizard — name, cycle rules, limits, review"
    success_signal: "wizard submitted; group created"
  - screen_id: group-dashboard
    feature_id: group-management
    state: content
    user_intent: "confirm new group created; begin member onboarding"
    success_signal: "group dashboard renders with empty corpus card"

expected_outcome: >
  New group created with dt_group_config populated from the selected type. Group
  dashboard visible with zero corpus, ready for member onboarding. dt_member_role
  records the creator as organizer.

flows:
  - { feature_id: group-type-picker, flow_id: group-type-config, role: primary }
  - { feature_id: group-create, flow_id: group-creation, role: primary }

capabilities_used: [has_ui, has_api, has_flow]
tier: critical
entry_point: group-type-picker
exit_point: group-dashboard

preconditions:
  - "Organizer self-signed-up and authenticated"
  - "Self-signup enabled (default deployment — no back-office provisioning)"

failure_modes:
  - cause: "Group name already exists for this organizer"
    recovery_screen: group-create
    notes: "Validation error inline on the name field in step 1."
  - cause: "Network failure during group creation"
    recovery_screen: group-create
    notes: "Wizard state preserved; retry button shown."

tags: [group-management, group-type-config, creation, organizer, self-signup, critical]
