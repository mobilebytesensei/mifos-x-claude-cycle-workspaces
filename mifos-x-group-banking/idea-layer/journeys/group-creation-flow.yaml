# User journey: group-creation-flow
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-05-08 via /idea-migration reference
# ═══════════════════════════════════════════════════════════════

id: group-creation-flow
version: "1.0.0"
name: "Create New Savings Group"
description: >
  Admin journey to create a new savings group on Fineract. Navigates from the
  group list, fills in the group creation form (name, cycle rules, contribution
  limits), submits to Fineract, and arrives at the new group's dashboard.

persona:
  archetype: field officer or founding treasurer
  jtbd: "register a new savings group so members can start contributing"
  context: "initial group setup; first time creating this group in the system"
  knowledge_level: trained field officer familiar with VSLA rules
  emotional_state: "task-focused — needs to set rules correctly before first meeting"

goal: >
  Field officer creates a new group on Fineract with correct cycle rules and
  lands on the group dashboard ready to onboard members.

success_metric:
  name: group_creation_completion_rate
  kind: funnel
  target: ">=85% of group_create_started reach group_dashboard"

screen_sequence:
  - screen_id: group-list
    feature_id: group-management
    state: content
    user_intent: "navigate to create new group"
    success_signal: "taps FAB or Create Group button"
  - screen_id: group-create
    feature_id: group-management
    state: idle
    user_intent: "fill in group name, cycle rules, contribution limits"
    success_signal: "form submitted; Fineract center created"
  - screen_id: group-dashboard
    feature_id: group-management
    state: content
    user_intent: "confirm new group created; begin member onboarding"
    success_signal: "group dashboard renders with empty corpus card"

expected_outcome: >
  New Fineract Center created with dt_group_config populated. Group dashboard
  visible with zero corpus, ready for member onboarding.

flows:
  - { feature_id: group-management, flow_id: group-creation, role: primary }

capabilities_used: [has_ui, has_api, has_flow]
tier: critical
entry_point: group-list
exit_point: group-dashboard

preconditions:
  - "Admin authenticated with staff credentials"
  - "Fineract office ID available for group assignment"

failure_modes:
  - cause: "Group name already exists in this office"
    recovery_screen: group-create
    notes: "Validation error inline on name field."
  - cause: "Network failure during Fineract center creation"
    recovery_screen: group-create
    notes: "Form state preserved; retry button shown."

tags: [group-management, creation, admin, critical]
