# User journey: loan-repayment
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-05-08 via /idea-migration reference
# ═══════════════════════════════════════════════════════════════

id: loan-repayment
version: "1.0.0"
name: "Record Loan Repayment"
description: >
  Admin journey to post a loan repayment for a group member. Navigates to the
  loan detail screen and opens the repayment dialog to record principal +
  interest payment. Updates loan outstanding balance.

persona:
  archetype: group treasurer
  jtbd: "record a member's loan repayment during or after a meeting"
  context: "member has handed over cash for loan repayment; treasurer needs to record"
  knowledge_level: familiar with repayment process
  emotional_state: "transaction-focused — needs to record accurately"

goal: >
  Treasurer records a loan repayment for a member, updating the loan balance
  and posting the transaction to Fineract.

success_metric:
  name: loan_repayment_completion_rate
  kind: completion
  target: ">=95% of repayment_dialog_opened reach repayment_confirmed"

screen_sequence:
  - screen_id: loan-list
    feature_id: loan-management
    state: content
    user_intent: "find the active loan for the repaying member"
    success_signal: "taps on disbursed loan row"
  - screen_id: loan-detail
    feature_id: loan-management
    state: content
    user_intent: "review outstanding balance; open repayment"
    success_signal: "taps Make Repayment button"
  - screen_id: loan-repayment-dialog
    feature_id: loan-management
    state: idle
    user_intent: "enter repayment amount and confirm"
    success_signal: "repayment confirmed; Fineract transaction posted"

expected_outcome: >
  Fineract loan repayment transaction created. Loan outstanding balance updated.
  If fully repaid, loan status changes to 'repaid'.

flows:
  - { feature_id: loan-management, flow_id: loan-lifecycle, role: sub_flow }

capabilities_used: [has_ui, has_api, has_flow]
tier: medium
entry_point: loan-list
exit_point: loan-repayment-dialog

failure_modes:
  - cause: "Repayment amount exceeds outstanding balance"
    recovery_screen: loan-repayment-dialog
    notes: "Validation error with outstanding balance shown."

tags: [loan-management, repayment, admin, medium]
