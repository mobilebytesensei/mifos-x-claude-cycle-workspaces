# User journey: loan-repayment
# ═══════════════════════════════════════════════════════════════
# Rewritten: 2026-07-17 for self-signup pivot — organizer/treasurer
# records the repayment, not an admin.
# ═══════════════════════════════════════════════════════════════

id: loan-repayment
version: "2.0.0"
name: "Service a Loan: Record Repayment or Mark Defaulted"
description: >
  Organizer/treasurer journey to service a member's loan from the loan detail
  screen. The happy path posts a repayment (principal + interest), updating the
  loan outstanding balance. An alternate collections branch lets the chairperson
  mark a non-performing loan as defaulted via the mark-defaulted confirmation
  dialog. Both paths originate from loan-detail.

persona:
  archetype: group treasurer (delegated role)
  jtbd: "record a member's loan repayment during or after a meeting"
  context: "member has handed over cash for loan repayment; treasurer records it"
  knowledge_level: familiar with the group's repayment process
  emotional_state: "transaction-focused — needs to record accurately"

goal: >
  Treasurer records a loan repayment for a member, updating the loan balance and
  posting the transaction.

success_metric:
  name: loan_repayment_completion_rate
  kind: completion
  target: ">=95% of repayment_dialog_opened reach repayment_confirmed"

screen_sequence:
  - screen_id: loan-list
    feature_id: loan-management
    state: content
    user_intent: "find the active loan for the repaying member"
    success_signal: "taps on the disbursed loan row"
  - screen_id: loan-detail
    feature_id: loan-management
    state: content
    user_intent: "review outstanding balance; open repayment"
    success_signal: "taps Make Repayment button"
  - screen_id: loan-repayment-dialog
    feature_id: loan-management
    state: idle
    user_intent: "enter repayment amount and confirm"
    success_signal: "repayment confirmed; transaction posted"
  - screen_id: loan-mark-defaulted-dialog
    feature_id: loan-mark-defaulted-dialog
    state: content
    user_intent: "ALTERNATE BRANCH — from loan-detail, the chairperson marks a non-performing loan as defaulted (guard canMarkDefaulted); not part of the repayment happy-path"
    success_signal: "confirms; mark_loan_defaulted API succeeds; LoanMarkedDefaulted emitted and dialog dismissed"

expected_outcome: >
  On the repayment path: a loan repayment transaction is created and the outstanding
  balance updated (loan → 'repaid' when fully paid). On the collections branch: the
  loan status transitions to 'defaulted' (mark_loan_defaulted), recorded for the
  group's records.

flows:
  - { feature_id: loan-management, flow_id: loan-lifecycle, role: sub_flow }
  - { feature_id: loan-mark-defaulted-dialog, flow_id: loan-mark-defaulted, role: branch }

capabilities_used: [has_ui, has_api, has_flow]
tier: medium
entry_point: loan-list
exit_point: loan-repayment-dialog

preconditions:
  - "Treasurer/organizer authenticated; holds the delegated role for this group"

failure_modes:
  - cause: "Repayment amount exceeds outstanding balance"
    recovery_screen: loan-repayment-dialog
    notes: "Validation error with outstanding balance shown."
  - cause: "Mark-defaulted API fails"
    recovery_screen: loan-mark-defaulted-dialog
    notes: "submitError set on the dialog; loan status unchanged; user may retry or dismiss."

tags: [loan-management, loan-mark-defaulted-dialog, repayment, default, servicing, treasurer, chairperson, medium]
