# User journey: share-out-cycle
# ═══════════════════════════════════════════════════════════════
# Rewritten: 2026-07-17 for self-signup pivot — organizer/treasurer
# with chairperson confirmation. No admin.
# ═══════════════════════════════════════════════════════════════

id: share-out-cycle
version: "2.0.0"
name: "Annual Share-Out Cycle Distribution"
description: >
  High-stakes organizer journey to distribute the group corpus fund at cycle end.
  Two-step design: preview (read-only distribution matrix) → execute (confirm and
  record). Cannot be undone after execution. Maximum trust + transparency.

persona:
  archetype: group organizer/treasurer with chairperson confirmation
  jtbd: "distribute savings cycle proceeds fairly to all members"
  context: "end of savings cycle; full group present for the annual payout ceremony"
  knowledge_level: organizer knows the process; members watching the screen
  emotional_state: "high stakes — the biggest financial event of the year"

goal: >
  Organizer previews per-member share-out amounts, confirms with the group, and
  executes the distribution. All member shares recorded in dt_share_out.

success_metric:
  name: share_out_execution_rate
  kind: completion
  target: "100% of share_out_previewed reach share_out_executed (no abandonment)"

screen_sequence:
  - screen_id: group-dashboard
    feature_id: group-management
    state: content
    user_intent: "initiate share-out from the cycle-end FAB"
    success_signal: "taps Execute Share-Out button"
  - screen_id: share-out-preview
    feature_id: share-out
    state: content
    user_intent: "review per-member allocation before the group; verify totals"
    success_signal: "organizer and group confirm the allocation is correct"
  - screen_id: share-out-execute
    feature_id: share-out
    state: idle
    user_intent: "confirm and execute the distribution"
    success_signal: "Execute Share-Out confirmed; dt_share_out written"

expected_outcome: >
  dt_share_out record created with status 'executed'. Per-member withdrawal
  transactions posted to savings accounts. Corpus balance reset for the new cycle.

flows:
  - { feature_id: share-out, flow_id: share-out, role: primary }

capabilities_used: [has_ui, has_api, has_flow]
tier: critical
entry_point: group-dashboard
exit_point: share-out-execute

preconditions:
  - "Cycle end conditions met (all loans repaid or carried forward)"
  - "Organizer authenticated; chairperson confirmation captured"
  - "dt_share_out in 'previewed' status before execute"

failure_modes:
  - cause: "Outstanding loans not resolved"
    recovery_screen: share-out-preview
    notes: "Warning shown: outstanding loans will reduce individual shares."
  - cause: "Network failure during execution"
    recovery_screen: share-out-execute
    notes: "Partial execution saved; retry resumes from the last member."

tags: [share-out, cycle-end, organizer, treasurer, chairperson, financial, critical]
