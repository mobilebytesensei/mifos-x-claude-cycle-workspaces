# User journey: savings-review
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-07-31 — covers savings-dashboard AND
# member-savings-detail (both journey-missing). Faithful to
# savings-dashboard/flow.yaml: on_member_tap → navigate
# member-savings-detail, and member-savings-detail/flow.yaml load.
# ═══════════════════════════════════════════════════════════════

id: savings-review
version: "1.0.0"
name: "Review Group Savings and a Member's Savings Detail"
description: >
  Organizer/treasurer journey to review the group's savings position and drill into
  a single member's savings history. From the contribution-model-aware savings
  dashboard (group vs individual tabs, cycle progress, per-member list), the user
  taps a member row to open that member's savings detail — account balances plus a
  filterable, paginated transaction history. Reached from the personal/group
  dashboard's savings entry point.

persona:
  archetype: group organizer or delegated treasurer
  jtbd: "check how the group's savings are tracking and inspect a member's history"
  context: "before or after a meeting; reconciling contributions or answering a member query"
  knowledge_level: familiar — runs the group's savings ledger
  emotional_state: "reconciliation-focused — wants accurate, up-to-date figures"

goal: >
  User reviews group and individual savings totals on the dashboard, then opens a
  specific member's savings detail to inspect their balances and transaction history.

success_metric:
  name: savings_drilldown_rate
  kind: completion
  target: ">=85% of savings_dashboard_viewed reach member_savings_detail opened"
  measurement: |
    Funnel: savings_dashboard_viewed → savings_member_row_tapped
      → member_savings_detail content rendered

screen_sequence:
  - screen_id: savings-dashboard
    feature_id: savings-dashboard
    state: content
    user_intent: "review group + individual savings totals, cycle progress, and the member list"
    success_signal: "dashboard content loaded; taps a member row"
  - screen_id: member-savings-detail
    feature_id: member-savings-detail
    state: content
    user_intent: "inspect the member's savings accounts and filter their transaction history"
    success_signal: "member savings detail rendered; transactions filterable and paginated"

expected_outcome: >
  User has reviewed the group's savings position and inspected a specific member's
  savings accounts and transaction history. No data mutated — this is a read/review
  journey; figures reflect the latest cached-then-fresh sync.

flows:
  - { feature_id: savings-dashboard, flow_id: savings-dashboard, role: primary }
  - { feature_id: member-savings-detail, flow_id: member-savings-detail, role: primary }

capabilities_used: [has_ui, has_api, has_offline_cache, has_flow]
tier: medium
entry_point: savings-dashboard
exit_point: member-savings-detail

preconditions:
  - "User authenticated; holds a role for this group (SessionManager)"
  - "Group has members with savings accounts"
  - "GroupTypeConfig loaded (drives contribution-model display on the dashboard)"

failure_modes:
  - cause: "Savings dashboard API calls fail (no cache)"
    recovery_screen: savings-dashboard
    notes: "Loading skeleton → error; cached-then-fresh renders cached data when present."
  - cause: "Refresh attempted while offline"
    recovery_screen: savings-dashboard
    notes: "Snackbar: 'Cannot refresh — you're offline'; cached figures remain visible."
  - cause: "Member savings detail load fails for the tapped member"
    recovery_screen: member-savings-detail
    notes: "show_error state with retry; on empty accounts → empty state."

tags: [savings-dashboard, member-savings-detail, savings, review, drill-down, treasurer, medium]
