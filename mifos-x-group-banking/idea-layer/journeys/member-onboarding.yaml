# User journey: member-onboarding
# ═══════════════════════════════════════════════════════════════
# Rewritten: 2026-07-17 for self-signup pivot — organizer-driven,
# not admin/field-officer. Two onboarding paths converge: direct add
# by the organizer, and invite redemption (see join-with-code.yaml).
# ═══════════════════════════════════════════════════════════════

id: member-onboarding
version: "2.0.0"
name: "Onboard a New Group Member (Organizer-Driven)"
description: >
  Organizer path to add a member directly to the group. Kofi (or a delegated
  treasurer) creates the member record, opens their savings account, assigns a
  per-group role in dt_member_role, and lands on the member profile confirming
  active status. The companion invite path — where the member self-registers via
  a code — is covered by join-with-code.yaml; both converge on an active member.

persona:
  archetype: group organizer or delegated treasurer
  jtbd: "register a new community member so they can join the savings group"
  context: "new member present at meeting or registration day"
  knowledge_level: organizer running the group; not a bank employee
  emotional_state: "welcoming — a positive community growth event"

goal: >
  Organizer creates the member record, opens their savings account, assigns the
  per-group role, and lands on member profile confirming they are active.

success_metric:
  name: member_onboarding_completion_rate
  kind: funnel
  target: ">=90% of add_member_started reach member_profile with status active"

screen_sequence:
  - screen_id: member-list
    feature_id: member-onboarding
    state: content
    user_intent: "navigate to add a new member"
    success_signal: "taps Add Member FAB"
  - screen_id: member-add
    feature_id: member-onboarding
    state: idle
    user_intent: "enter member name, mobile number, photo, and per-group role"
    success_signal: "member record created and activated"
  - screen_id: member-profile
    feature_id: member-onboarding
    state: content
    user_intent: "confirm member onboarded; view savings account"
    success_signal: "member profile shows active status + savings account"

expected_outcome: >
  Member record created, activated, and added to group. Savings account opened.
  dt_member_role populated with the per-group roleInGroup (member by default).

flows:
  - { feature_id: member-onboarding, flow_id: member-add, role: primary }

capabilities_used: [has_ui, has_api, has_flow]
tier: critical
entry_point: member-list
exit_point: member-profile

preconditions:
  - "Organizer authenticated; holds the organizer role for this group"
  - "Group created (see organizer-end-to-end.yaml)"

failure_modes:
  - cause: "Duplicate mobile number in the group"
    recovery_screen: member-add
    notes: "Validation error; suggest searching existing members."
  - cause: "Savings product not configured"
    recovery_screen: member-add
    notes: "Organizer must configure the group's savings rules first."

tags: [member-onboarding, organizer, creation, critical]
