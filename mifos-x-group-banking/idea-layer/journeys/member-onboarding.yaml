# User journey: member-onboarding
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-05-08 via /idea-migration reference
# ═══════════════════════════════════════════════════════════════

id: member-onboarding
version: "1.0.0"
name: "Add New Group Member"
description: >
  Admin journey to onboard a new member into the savings group. Creates a Fineract
  client, opens a savings account, assigns role in dt_member_role, and navigates
  to the new member's profile to confirm setup.

persona:
  archetype: group treasurer or field officer
  jtbd: "register a new community member so they can join the savings group"
  context: "new member present at meeting or registration day"
  knowledge_level: field officer trained on Fineract client creation
  emotional_state: "welcoming — this is a positive community growth event"

goal: >
  Field officer creates a Fineract client for the new member, opens their savings
  account, and lands on member profile confirming they are active.

success_metric:
  name: member_onboarding_completion_rate
  kind: funnel
  target: ">=90% of add_member_started reach member_profile with status active"

screen_sequence:
  - screen_id: member-list
    feature_id: member-onboarding
    state: content
    user_intent: "navigate to add a new member"
    success_signal: "taps Add Member FAB"
  - screen_id: member-add
    feature_id: member-onboarding
    state: idle
    user_intent: "enter member name, mobile number, photo, role assignment"
    success_signal: "Fineract client created and activated"
  - screen_id: member-profile
    feature_id: member-onboarding
    state: content
    user_intent: "confirm member onboarded; view savings account"
    success_signal: "member profile shows active status + savings account"

expected_outcome: >
  Fineract client created, activated, and added to group. Savings account opened.
  dt_member_role populated with clientType and roleInGroup.

flows:
  - { feature_id: member-onboarding, flow_id: member-add, role: primary }

capabilities_used: [has_ui, has_api, has_flow]
tier: critical
entry_point: member-list
exit_point: member-profile

failure_modes:
  - cause: "Duplicate mobile number in Fineract"
    recovery_screen: member-add
    notes: "Validation error; suggest searching existing clients."
  - cause: "Savings product not configured"
    recovery_screen: member-add
    notes: "Field officer must configure savings product first."

tags: [member-onboarding, admin, creation, critical]
