# User journey: loan-apply-to-approval
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-05-08 via /idea-migration reference
# ═══════════════════════════════════════════════════════════════

id: loan-apply-to-approval
version: "1.0.0"
name: "Loan Application to Approval"
description: >
  Admin journey to create a formal loan application on behalf of a member,
  capture the democratic vote, and view the resulting loan detail. Disbursement
  happens at the next step (meeting-conduct) once corpus is sufficient.

persona:
  archetype: group treasurer
  jtbd: "create a loan application for a requesting member and record group vote"
  context: "during meeting; member has verbally requested a loan; consensus reached"
  knowledge_level: experienced treasurer
  emotional_state: "methodical — needs to capture the vote accurately"

goal: >
  Treasurer creates Fineract loan application for a member and records the
  group's approval vote. Loan status transitions to 'approved' pending disbursement.

success_metric:
  name: loan_application_completion_rate
  kind: funnel
  target: ">=90% of loan_apply_started reach loan_detail with status approved"

screen_sequence:
  - screen_id: loan-list
    feature_id: loan-management
    state: content
    user_intent: "navigate to create new loan for a member"
    success_signal: "taps Apply Loan FAB"
  - screen_id: loan-apply
    feature_id: loan-management
    state: idle
    user_intent: "select member, enter loan amount and purpose"
    success_signal: "loan application submitted to Fineract"
  - screen_id: loan-detail
    feature_id: loan-management
    state: content
    user_intent: "confirm loan created; review vote tally"
    success_signal: "loan detail screen shows status and vote breakdown"

expected_outcome: >
  Fineract loan application created with status 'pending'. dt_loan_vote records
  created for each member's vote. Chairperson approval gate visible.

flows:
  - { feature_id: loan-management, flow_id: loan-lifecycle, role: primary }

capabilities_used: [has_ui, has_api, has_flow]
tier: critical
entry_point: loan-list
exit_point: loan-detail

preconditions:
  - "Admin authenticated"
  - "Member has savings account; corpus sufficient"
  - "Member loan request submitted (optional — may be verbal)"

failure_modes:
  - cause: "Loan amount exceeds member ceiling (savings × multiplier)"
    recovery_screen: loan-apply
    notes: "Validation error with ceiling amount shown."

tags: [loan-management, application, admin, critical]
