# User journey: offline-sync
# ═══════════════════════════════════════════════════════════════
# Rewritten: 2026-07-17 for self-signup pivot — organizer or member
# (unified identity); entry via organizer-dashboard sync chip.
# ═══════════════════════════════════════════════════════════════

id: offline-sync
version: "2.0.0"
name: "Check and Trigger Offline Sync"
description: >
  Journey for any user (organizer or member) to check pending offline operations
  and trigger a manual sync when connectivity is restored. Surfaces from any
  screen via the sync_status_indicator chip in the header.

persona:
  archetype: organizer or member in a low-connectivity area
  jtbd: "verify my offline transactions have been synced to the server"
  context: "returning to network after an offline meeting; wants to confirm sync"
  knowledge_level: basic — understands the sync concept from other apps
  emotional_state: "anxious — worried data may be lost"

goal: >
  User reaches the sync-status screen, sees the pending operations list, triggers
  sync, and confirms all operations completed successfully.

success_metric:
  name: sync_resolution_rate
  kind: completion
  target: ">=99% of pending_operations reach status=completed within 2 minutes of sync"

screen_sequence:
  - screen_id: organizer-dashboard
    feature_id: unified-auth
    state: content
    user_intent: "notice the offline indicator in the header"
    success_signal: "taps the sync_status_indicator chip"
    notes: "Entry point can also be any screen with the chip (e.g. personal-dashboard)."
  - screen_id: sync-status
    feature_id: sync-status
    state: pending
    user_intent: "review pending operations; trigger sync"
    success_signal: "sync completed; all operations show status=completed"

expected_outcome: >
  All pending dt_sync_metadata operations replayed against the server. Sync status
  changes to 'synced'. Operation count badge clears.

flows:
  - { feature_id: sync-status, flow_id: offline-sync, role: primary }

capabilities_used: [has_ui, has_api, has_offline_cache, has_flow]
tier: medium
entry_point: organizer-dashboard
exit_point: sync-status

failure_modes:
  - cause: "Conflict detected (server state differs from offline state)"
    recovery_screen: sync-status
    notes: "Conflict shown per-operation. User can resolve or contact the organizer."

tags: [offline-sync, connectivity, organizer, member, medium]
