# User journey: offline-sync
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-05-08 via /idea-migration reference
# ═══════════════════════════════════════════════════════════════

id: offline-sync
version: "1.0.0"
name: "Check and Trigger Offline Sync"
description: >
  Journey for both admin and end users to check pending offline operations
  and trigger manual sync when connectivity is restored. Surfaces from any
  screen via the sync_status_indicator chip in the header.

persona:
  archetype: admin or end user in low-connectivity area
  jtbd: "verify my offline transactions have been synced to the server"
  context: "returning to network after offline meeting; wants to confirm sync"
  knowledge_level: basic — understands sync concept from other apps
  emotional_state: "anxious — worried data may be lost"

goal: >
  User reaches sync-status screen, sees pending operations list, triggers sync,
  and confirms all operations completed successfully.

success_metric:
  name: sync_resolution_rate
  kind: completion
  target: ">=99% of pending_operations reach status=completed within 2 minutes of sync"

screen_sequence:
  - screen_id: admin-dashboard
    feature_id: authentication
    state: content
    user_intent: "notice offline indicator in header"
    success_signal: "taps sync_status_indicator chip"
    notes: "Entry point can also be any screen with the chip"
  - screen_id: sync-status
    feature_id: offline-sync
    state: pending
    user_intent: "review pending operations; trigger sync"
    success_signal: "sync completed; all operations show status=completed"

expected_outcome: >
  All pending dt_sync_metadata operations replayed against Fineract server.
  Sync status changes to 'synced'. Operation count badge clears.

flows:
  - { feature_id: offline-sync, flow_id: offline-sync, role: primary }

capabilities_used: [has_ui, has_api, has_offline_cache, has_flow]
tier: medium
entry_point: any-screen-with-sync-chip
exit_point: sync-status

failure_modes:
  - cause: "Conflict detected (server state differs from offline state)"
    recovery_screen: sync-status
    notes: "Conflict shown per-operation. User can resolve or contact admin."

tags: [offline-sync, connectivity, both-clients, medium]
