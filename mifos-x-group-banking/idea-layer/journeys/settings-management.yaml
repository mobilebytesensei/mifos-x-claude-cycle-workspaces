# User journey: settings-management
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-07-31 — covers settings AND settings-logout-dialog
# (both journey-missing). The logout dialog is a modal sub-flow of
# settings, added as a terminal step in the parent settings journey
# rather than a standalone journey. Faithful to settings/flow.yaml
# on_logout_tapped → ShowLogoutDialog, and settings-logout-dialog/
# flow.yaml on_confirm_logout → navigate login-signup.
# ═══════════════════════════════════════════════════════════════

id: settings-management
version: "1.0.0"
name: "Manage App Settings and Sign Out"
description: >
  Any authenticated user adjusts their app preferences and, when finished, signs
  out. From the settings screen (reached via the bottom-nav settings tab) the user
  changes language, theme, biometric unlock, notifications, or their PIN — each
  persisted to the local datastore and applied immediately — and finally taps Log
  Out, which raises the logout confirmation dialog; confirming clears the session
  and returns to login. The logout dialog is a modal sub-flow of settings.

persona:
  archetype: any authenticated app user (organizer, treasurer, or member)
  jtbd: "tailor the app to my preferences and securely sign out when done"
  context: "adjusting preferences, changing a PIN, or handing the device to someone else"
  knowledge_level: familiar — knows basic app settings from other apps
  emotional_state: "in-control — routine housekeeping, security-conscious at logout"

goal: >
  User updates one or more preferences (persisted + applied), then confirms logout,
  clearing the session and returning to the login screen.

success_metric:
  name: settings_task_completion_rate
  kind: completion
  target: ">=95% of settings_opened complete a preference change or a confirmed logout"
  measurement: |
    Funnel: settings_opened → (preference_persisted | logout_confirmed)
      → applied / returned to login-signup

screen_sequence:
  - screen_id: settings
    feature_id: settings
    state: content
    user_intent: "change language / theme / biometric / notifications / PIN; each persists + applies"
    success_signal: "preference persisted to datastore and applied; then taps Log Out"
  - screen_id: settings-logout-dialog
    feature_id: settings-logout-dialog
    state: content
    user_intent: "confirm signing out (modal sub-flow of settings)"
    success_signal: "confirms logout; session cleared from datastore; navigates to login-signup"

expected_outcome: >
  User's preferences are persisted and applied (locale/theme/biometric/notifications/PIN),
  or the user has confirmed logout — session cleared from the datastore and the app
  returned to the login-signup screen. Dismissing the dialog instead leaves the
  session intact and returns to settings.

flows:
  - { feature_id: settings, flow_id: settings, role: primary }
  - { feature_id: settings-logout-dialog, flow_id: settings-logout, role: branch }

capabilities_used: [has_ui, has_flow]
tier: medium
entry_point: settings
exit_point: settings-logout-dialog

preconditions:
  - "User authenticated with an active session"
  - "Preferences datastore initialized (language, theme, biometric, notifications)"

failure_modes:
  - cause: "Biometric toggled but hardware unavailable"
    recovery_screen: settings
    notes: "Snackbar: 'Biometric hardware not available on this device'; toggle reverts."
  - cause: "PIN change fails (wrong current PIN / 400)"
    recovery_screen: settings
    notes: "pinChangeError shown in the change-PIN dialog; session preserved."
  - cause: "PIN change returns 401 (session expired)"
    recovery_screen: login-signup
    notes: "Session cleared; user routed to login-signup to re-authenticate."
  - cause: "Logout fails to clear session"
    recovery_screen: settings-logout-dialog
    notes: "logoutError shown: 'Failed to log out. Please try again.'; isLoggingOut reset."

tags: [settings, settings-logout-dialog, preferences, logout, session, medium]
