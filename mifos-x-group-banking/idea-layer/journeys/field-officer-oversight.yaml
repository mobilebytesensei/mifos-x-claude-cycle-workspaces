# User journey: field-officer-oversight
# ═══════════════════════════════════════════════════════════════
# Generated: 2026-07-31 — covers field-officer-dashboard (journey-missing).
# Supervisory-tier persona (David/Sarah) reviews aggregated group
# health and drills into a single group (read-only) from the FO
# dashboard. Faithful to field-officer-dashboard/flow.yaml:
# on_group_tapped → navigate group-dashboard (no mutations).
# ═══════════════════════════════════════════════════════════════

id: field-officer-oversight
version: "1.0.0"
name: "Field Officer Group Oversight"
description: >
  Supervisory journey for a field officer / program manager to monitor the health
  of every group they oversee. The field officer lands on the field-officer
  dashboard, reviews aggregated KPIs (total groups, active members, savings this
  month, loans outstanding), filters by region / status / overdue-rate, optionally
  exports a report, and drills into a single group's dashboard in read-only mode
  (field officers cannot mutate group data). This anchors its own oversight flow,
  distinct from the organizer lifecycle.

persona:
  archetype: field officer / program manager (supervisory tier)
  jtbd: "monitor the health of all my groups and spot the ones needing attention"
  context: "back-office review or a field visit; scanning a portfolio of groups"
  knowledge_level: expert — bank/NGO staff overseeing many groups
  emotional_state: "analytical — watching for overdue rates and at-risk groups"

goal: >
  Field officer reviews portfolio KPIs, filters to the at-risk groups, and opens a
  specific group's dashboard to inspect its health without mutating any data.

success_metric:
  name: field_officer_oversight_rate
  kind: completion
  target: ">=90% of field_officer_dashboard_loaded reach group_dashboard opened"
  measurement: |
    Funnel: field_officer_dashboard_loaded → field_officer_group_tapped
      → group_dashboard rendered (read-only)

screen_sequence:
  - screen_id: field-officer-dashboard
    feature_id: field-officer-dashboard
    state: content
    user_intent: "review aggregated KPIs and filter to at-risk groups by region/status/overdue"
    success_signal: "dashboard loaded; filters applied; taps a group health card"
  - screen_id: group-dashboard
    feature_id: group-management
    state: content
    user_intent: "inspect the selected group's health in read-only mode"
    success_signal: "group dashboard renders; no mutation controls exposed for the FO role"

expected_outcome: >
  Field officer has reviewed portfolio-level KPIs, narrowed to the groups needing
  attention, and inspected a specific group's dashboard read-only. No group data
  was mutated. Optionally a FieldOfficerGroupReport CSV was exported and shared.

flows:
  - { feature_id: field-officer-dashboard, flow_id: field-officer-dashboard, role: primary }

capabilities_used: [has_ui, has_api, has_offline_cache, has_flow]
tier: medium
entry_point: field-officer-dashboard
exit_point: group-dashboard

preconditions:
  - "User authenticated with FIELD_OFFICER or PROGRAM_MANAGER role (SessionManager)"
  - "Field-officer capability enabled for the deployment (fieldOfficerEnabled)"
  - "Staff has assigned centers/groups (staffId resolves to a non-empty portfolio)"

failure_modes:
  - cause: "Parallel centers/groups API calls fail"
    recovery_screen: field-officer-dashboard
    notes: "ScreenState → Error with retry; cached groups (TTL 300s) shown when available."
  - cause: "Export report request fails"
    recovery_screen: field-officer-dashboard
    notes: "ShowSnackbar(export_error); isExporting reset; dashboard remains usable."

tags: [field-officer-dashboard, oversight, supervisory, read-only, medium]
