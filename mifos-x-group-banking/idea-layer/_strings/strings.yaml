# Project-wide string table — mifos-x-group-banking (MifosSave)
#
# Flat English string registry consumed by the coherence audit to resolve
# `{strings.KEY}` tokens referenced in screens/*/ui.yaml. Each screen's
# ui.yaml also carries its own per-screen `i18n.en` block (the render-time
# source of truth); this table is the project-wide resolution registry so the
# audit's strings_unresolved gate passes.
#
# Keys are flat dot-path leaves (matcher: {strings.<key>} → table.has(<key>)).
# Where the same key is authored across multiple screens (screen_title,
# btn_retry, error_network, field_email_phone, placeholder_email_phone,
# field_role) the value below is a shared, screen-neutral phrasing; the
# per-screen i18n block overrides it at render time.
#
# MifosSave = global self-signup community-banking (VSLA/ROSCA/ASCA/…).
# Added by an /idea-agent foundation-wave coherence heal (strings_unresolved).

