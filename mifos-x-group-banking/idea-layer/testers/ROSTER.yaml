journeys:
  - id: demo-explore
    name: Explore CommonPurse as a Demo User
    goal: >
      A prospective user experiences the full organizer surface through a
      seeded, offline demo session, then can exit to sign up or accept an
      invitation for real.
    tier: critical
    file: demo-explore.yaml
    feature_ids:
      - login-signup
      - organizer-dashboard
      - meeting-lifecycle
      - member-onboarding
      - savings-collection
    screen_sequence:
      - screen_id: login-signup
        feature_id: login-signup
        state: content
        user_intent: try the app without creating an account — tap Demo Explore
      - screen_id: organizer-dashboard
        feature_id: organizer-dashboard
        state: content
        user_intent: 'explore the seeded group''s corpus, members, and next meeting'
      - screen_id: meeting-calendar
        feature_id: meeting-lifecycle
        state: content
        user_intent: see how meetings are scheduled and conducted
      - screen_id: member-list
        feature_id: member-onboarding
        state: content
        user_intent: browse the group's members
      - screen_id: savings-dashboard
        feature_id: savings-collection
        state: content
        user_intent: review the group's savings position
  - id: end-user-loan-request
    name: Member Loan Request Submission
    goal: >
      Member submits a loan request with amount and purpose. Request saved in
      dt_loan_request with status 'submitted'. Confirmation shown.
    tier: medium
    file: end-user-loan-request.yaml
    feature_ids:
      - end-user-dashboard
      - loan-request
    screen_sequence:
      - screen_id: personal-loans
        feature_id: end-user-dashboard
        state: content
        user_intent: navigate to request a loan
      - screen_id: loan-request
        feature_id: loan-request
        state: idle
        user_intent: enter loan amount and purpose
  - id: field-officer-oversight
    name: Field Officer Group Oversight
    goal: >
      Field officer reviews portfolio KPIs, filters to the at-risk groups, and
      opens a specific group's dashboard to inspect its health without mutating
      any data.
    tier: medium
    file: field-officer-oversight.yaml
    feature_ids:
      - field-officer-dashboard
      - group-management
    screen_sequence:
      - screen_id: field-officer-dashboard
        feature_id: field-officer-dashboard
        state: content
        user_intent: >-
          review aggregated KPIs and filter to at-risk groups by
          region/status/overdue
      - screen_id: group-dashboard
        feature_id: group-management
        state: content
        user_intent: inspect the selected group's health in read-only mode
  - id: group-browse
    name: Browse Groups and Open a Group
    goal: >
      Organizer locates the target group in the list and opens its dashboard,
      ready to begin a group-scoped task.
    tier: medium
    file: group-browse.yaml
    feature_ids:
      - group-list
      - group-management
    screen_sequence:
      - screen_id: group-list
        feature_id: group-list
        state: content
        user_intent: search or scroll to find the target group
      - screen_id: group-dashboard
        feature_id: group-management
        state: content
        user_intent: land on the selected group's dashboard to begin a task
  - id: group-creation-flow
    name: Create a New Savings Group (Organizer Self-Serve)
    goal: >
      Organizer selects a group type, completes the create wizard with correct
      cycle rules, and lands on the group dashboard ready to onboard members.
    tier: critical
    file: group-creation-flow.yaml
    feature_ids:
      - group-type-picker
      - group-create
      - group-management
    screen_sequence:
      - screen_id: group-type-picker
        feature_id: group-type-picker
        state: content
        user_intent: 'choose the group model (VSLA, ROSCA, SHG…) that fits the community'
      - screen_id: group-create
        feature_id: group-create
        state: content
        user_intent: 'complete the 4-step wizard — name, cycle rules, limits, review'
      - screen_id: group-dashboard
        feature_id: group-management
        state: content
        user_intent: confirm new group created; begin member onboarding
  - id: join-with-code
    name: Join a Group with an Invite Code
    goal: >
      Invitee redeems an invite code, self-registers, and lands on the personal
      dashboard with a resolved per-group member role. They can view
      savings/loans and submit a loan request that queues for organizer review.
    tier: critical
    file: join-with-code.yaml
    feature_ids:
      - join-with-code
      - login-signup
      - personal-dashboard
      - end-user-dashboard
      - loan-request
    screen_sequence:
      - screen_id: join-with-code
        feature_id: join-with-code
        state: content
        user_intent: enter the invite code received from the organizer
      - screen_id: login-signup
        feature_id: login-signup
        state: content
        user_intent: self-register a new account to accept the invitation
      - screen_id: personal-dashboard
        feature_id: personal-dashboard
        state: content
        user_intent: 'see own savings balance, loan status, and group summary'
      - screen_id: personal-savings
        feature_id: end-user-dashboard
        state: content
        user_intent: review own savings contributions and balance
      - screen_id: personal-loans
        feature_id: end-user-dashboard
        state: content
        user_intent: review own loans; navigate to request a new loan
      - screen_id: loan-request
        feature_id: loan-request
        state: idle
        user_intent: enter loan amount and purpose
  - id: loan-apply-to-approval
    name: Loan Application to Approval
    goal: >
      Treasurer creates a loan application for a member and records the group's
      approval vote. Loan status transitions to 'approved' pending disbursement.
    tier: critical
    file: loan-apply-to-approval.yaml
    feature_ids:
      - loan-management
    screen_sequence:
      - screen_id: loan-list
        feature_id: loan-management
        state: content
        user_intent: navigate to create a new loan for a member
      - screen_id: loan-apply
        feature_id: loan-management
        state: idle
        user_intent: 'select member, enter loan amount and purpose'
      - screen_id: loan-detail
        feature_id: loan-management
        state: content
        user_intent: confirm loan created; review vote tally
  - id: loan-repayment
    name: 'Service a Loan: Record Repayment or Mark Defaulted'
    goal: >
      Treasurer records a loan repayment for a member, updating the loan balance
      and posting the transaction.
    tier: medium
    file: loan-repayment.yaml
    feature_ids:
      - loan-management
      - loan-mark-defaulted-dialog
    screen_sequence:
      - screen_id: loan-list
        feature_id: loan-management
        state: content
        user_intent: find the active loan for the repaying member
      - screen_id: loan-detail
        feature_id: loan-management
        state: content
        user_intent: review outstanding balance; open repayment
      - screen_id: loan-repayment-dialog
        feature_id: loan-management
        state: idle
        user_intent: enter repayment amount and confirm
      - screen_id: loan-mark-defaulted-dialog
        feature_id: loan-mark-defaulted-dialog
        state: content
        user_intent: >-
          ALTERNATE BRANCH — from loan-detail, the chairperson marks a
          non-performing loan as defaulted (guard canMarkDefaulted); not part of
          the repayment happy-path
  - id: meeting-conduct-full
    name: Conduct Full Group Meeting
    goal: >
      Organizer/treasurer completes all 7 meeting steps and reaches the meeting
      summary with correct totals and a correct closing corpus balance.
    tier: critical
    file: meeting-conduct-full.yaml
    feature_ids:
      - meeting-lifecycle
      - previous-meeting-review
      - meeting-conduct
    screen_sequence:
      - screen_id: meeting-calendar
        feature_id: meeting-lifecycle
        state: content
        user_intent: select today's meeting to begin
      - screen_id: previous-meeting-review
        feature_id: previous-meeting-review
        state: content
        user_intent: >-
          review the previous meeting's outcomes and any unresolved items before
          starting (launchedFrom == 'conduct')
      - screen_id: meeting-conduct
        feature_id: meeting-conduct
        state: content
        user_intent: >-
          step 0-1 — confirm previous review, then mark attendance
          present/late/absent with fines
      - screen_id: meeting-conduct
        feature_id: meeting-conduct
        state: content
        user_intent: >-
          step 2-3 — confirm opening balance, then collect savings deposits per
          member
      - screen_id: meeting-conduct
        feature_id: meeting-conduct
        state: content
        user_intent: 'step 4-5 — review loans/repayments, then vote on new loan applications'
      - screen_id: meeting-conduct
        feature_id: meeting-conduct
        state: content
        user_intent: step 6 — review closing corpus balance and close the meeting
      - screen_id: meeting-summary
        feature_id: meeting-lifecycle
        state: content
        user_intent: review meeting totals and share the summary
  - id: member-onboarding
    name: Onboard a New Group Member (Organizer-Driven)
    goal: >
      Organizer creates the member record, opens their savings account, assigns
      the per-group role, and lands on member profile confirming they are
      active.
    tier: critical
    file: member-onboarding.yaml
    feature_ids:
      - member-onboarding
    screen_sequence:
      - screen_id: member-list
        feature_id: member-onboarding
        state: content
        user_intent: navigate to add a new member
      - screen_id: member-add
        feature_id: member-onboarding
        state: idle
        user_intent: 'enter member name, mobile number, photo, and per-group role'
      - screen_id: member-profile
        feature_id: member-onboarding
        state: content
        user_intent: confirm member onboarded; view savings account
  - id: offline-sync
    name: Check and Trigger Offline Sync
    goal: >
      User reaches the sync-status screen, sees the pending operations list,
      triggers sync, and confirms all operations completed successfully.
    tier: medium
    file: offline-sync.yaml
    feature_ids:
      - unified-auth
      - sync-status
    screen_sequence:
      - screen_id: organizer-dashboard
        feature_id: unified-auth
        state: content
        user_intent: notice the offline indicator in the header
      - screen_id: sync-status
        feature_id: sync-status
        state: pending
        user_intent: review pending operations; trigger sync
  - id: organizer-end-to-end
    name: 'Organizer End-to-End: Signup to Share-Out'
    goal: >
      Kofi self-signs-up, creates and configures a typed group, invites members,
      conducts a full meeting, and executes the cycle-end share-out — all
      without any back-office provisioning. Role of organizer is earned on group
      creation.
    tier: critical
    file: organizer-end-to-end.yaml
    feature_ids:
      - login-signup
      - group-type-picker
      - group-create
      - member-invite
      - meeting-lifecycle
      - meeting-conduct
      - share-out
    screen_sequence:
      - screen_id: login-signup
        feature_id: login-signup
        state: content
        user_intent: self-register a new account with no back-office involvement
      - screen_id: group-type-picker
        feature_id: group-type-picker
        state: content
        user_intent: 'choose the group model (VSLA, ROSCA, SHG…) that fits the community'
      - screen_id: group-create
        feature_id: group-create
        state: content
        user_intent: 'complete the 4-step wizard — name, cycle rules, limits, review'
      - screen_id: member-invite
        feature_id: member-invite
        state: content
        user_intent: generate an invite link/code and share it with community members
      - screen_id: meeting-calendar
        feature_id: meeting-lifecycle
        state: content
        user_intent: select today's meeting to begin the session
      - screen_id: meeting-conduct
        feature_id: meeting-conduct
        state: content
        user_intent: >-
          run the 7-step meeting — review → attendance → opening → savings →
          loan review → applications → close
      - screen_id: meeting-summary
        feature_id: meeting-lifecycle
        state: content
        user_intent: review meeting totals and closing corpus balance
      - screen_id: share-out-preview
        feature_id: share-out
        state: content
        user_intent: 'at cycle end, review per-member allocation before the group'
      - screen_id: share-out-execute
        feature_id: share-out
        state: idle
        user_intent: confirm and execute the cycle-end distribution
  - id: savings-review
    name: Review Group Savings and a Member's Savings Detail
    goal: >
      User reviews group and individual savings totals on the dashboard, then
      opens a specific member's savings detail to inspect their balances and
      transaction history.
    tier: medium
    file: savings-review.yaml
    feature_ids:
      - savings-dashboard
      - member-savings-detail
    screen_sequence:
      - screen_id: savings-dashboard
        feature_id: savings-dashboard
        state: content
        user_intent: >-
          review group + individual savings totals, cycle progress, and the
          member list
      - screen_id: member-savings-detail
        feature_id: member-savings-detail
        state: content
        user_intent: >-
          inspect the member's savings accounts and filter their transaction
          history
  - id: settings-management
    name: Manage App Settings and Sign Out
    goal: >
      User updates one or more preferences (persisted + applied), then confirms
      logout, clearing the session and returning to the login screen.
    tier: medium
    file: settings-management.yaml
    feature_ids:
      - settings
      - settings-logout-dialog
    screen_sequence:
      - screen_id: settings
        feature_id: settings
        state: content
        user_intent: >-
          change language / theme / biometric / notifications / PIN; each
          persists + applies
      - screen_id: settings-logout-dialog
        feature_id: settings-logout-dialog
        state: content
        user_intent: confirm signing out (modal sub-flow of settings)
  - id: share-out-cycle
    name: Annual Share-Out Cycle Distribution
    goal: >
      Organizer previews per-member share-out amounts, confirms with the group,
      and executes the distribution. All member shares recorded in dt_share_out.
    tier: critical
    file: share-out-cycle.yaml
    feature_ids:
      - group-management
      - share-out
    screen_sequence:
      - screen_id: group-dashboard
        feature_id: group-management
        state: content
        user_intent: initiate share-out from the cycle-end FAB
      - screen_id: share-out-preview
        feature_id: share-out
        state: content
        user_intent: review per-member allocation before the group; verify totals
      - screen_id: share-out-execute
        feature_id: share-out
        state: idle
        user_intent: confirm and execute the distribution
