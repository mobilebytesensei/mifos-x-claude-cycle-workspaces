schema_version: "1.0"
flow: kofi-meeting-conduct-full
# ─────────────────────────────────────────────────────────────────────────────
# READ-ONLY behavior contract. The sibling Maestro flow STOPS at the attendance
# step and never fires SubmitMeeting, so NONE of meeting-conduct's declared write
# side-effects are produced here and none are asserted:
#   - POST /datatables/dt_meeting_record        (record-meeting)
#   - POST /datatables/dt_meeting_attendance    (per member)
#   - POST /savingsaccounts/{id}/transactions   (savings deposits)
#   - POST /loans/{id}/transactions             (repayments)
#   - POST /loans/{id}?command=disburse         (disbursals)
#   - PUT  /datatables/dt_group_corpus/{center} (closing corpus)
# Those call_api / persist_db effects belong to journey steps 4-7, which are
# intentionally NOT walked against the protected live group.
#
# The ONLY side-effect the walked flow triggers is the meeting-conduct screen_init
# parallel READ that loads the real member list (get_group_members → centers).
# Members are required to render the attendance step (api.yaml: 404 blocks the
# wizard), so a rendered attendance step with real members proves this GET → 200.
# ─────────────────────────────────────────────────────────────────────────────
assertions:
  - assert_network_call:
      url_contains: "/api/v1/centers/"
      method: GET
      status: 200
