# Behavior-assertion sibling for kofi-organizer-end-to-end.maestro.yaml
# (RULE-E2E-2WAY-001; schema-valid against core/schemas/behavior-assertion-dsl.schema.json).
#
# READ-ONLY live-fleet scope: this flow deliberately STOPS before every protected
# WRITE (group-create submit, invite generate, meeting submit, share-out execute),
# so those write side-effects (dt_meeting_record / dt_share_out / invitations row /
# group create — flow.yaml effects call_api + persist_db) are NOT asserted here —
# asserting a write the flow never triggers would be a guaranteed false failure.
# The assertions below cover only the side-effects the read-only walk ACTUALLY
# produces: the login auth call and the organizer-dashboard aggregate read that
# renders the live "Mwangaza Women's Group".
schema_version: "1.0"
flow: kofi-organizer-end-to-end.maestro
assertions:
  # STEP 1 login-signup — flow.yaml on_login → api companion_login (effect: call_api)
  - assert_network_call:
      url_contains: "/companion/auth/login"
      method: POST
      status: 200
  # STEP 1→ organizer-dashboard live aggregate read that surfaces the real group
  - assert_network_call:
      url_contains: "/companion/organizer/dashboard"
      method: GET
      status: 200
