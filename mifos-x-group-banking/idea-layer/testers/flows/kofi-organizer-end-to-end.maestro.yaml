# ─────────────────────────────────────────────────────────────────────────────
# Testers Army — persona=kofi (Group Organizer) × journey=organizer-end-to-end
# Full-journey device Maestro flow (SP-02, journey→device bridge).
# Journey source (READ-ONLY): idea-layer/journeys/organizer-end-to-end.yaml
# Selectors triangulated from screens/*/flow.yaml + ui.yaml + source *TestTags.kt.
# ─────────────────────────────────────────────────────────────────────────────
# resolution_confidence_summary: high=6 medium=2 low=1
#
# LIVE-FLEET READ-ONLY MANDATE — real data on mifos-bank-2 via adb-reverse tunnel:
#   • Real organizer creds mifos/password land on organizer_dashboard_screen (an
#     EXISTING organizer of "Mwangaza Women's Group"), NOT the journey's fresh
#     zero-group signup state. The create-funnel steps (group-type-picker,
#     group-create) are walked READ-ONLY via the group-list "+ New Group" FAB; the
#     meeting / share-out steps drill into the REAL Mwangaza group.
#   • Every journey WRITE (group-create submit, invite generate, meeting submit,
#     share-out execute) STOPS at the confirmation/render — the final Confirm/
#     Execute/Generate/Submit is intentionally NOT tapped (protected demo data).
#   • AlertDialog / ModalBottomSheet render in a separate window → asserted by TEXT.
#   • extendedWaitUntil used after every navigation (slow cold companion first-load).
# ─────────────────────────────────────────────────────────────────────────────
appId: org.mifos.groupbanking
tags: [testers-army, persona:kofi, journey:organizer-end-to-end, tier:critical]
---
# App auto-attempts biometric on launch, then falls back to the login form.
- launchApp:
    appId: org.mifos.groupbanking
    clearState: true   # wipe any persisted session so the login screen is deterministic
                       # (else a valid stored session auto-restores mid-login and races the tap)
- extendedWaitUntil:
    visible:
      id: "login_signup_field_email_phone"
    timeout: 20000

# ── STEP 1/9 · login-signup ──────────────────────────────────────────────────
# success_signal: "account created; lands in zero-group state; taps Create Group"
# resolution_confidence: high (login_signup_* TestTags all resolved)
# data-divergence: the seeded organizer mifos/password is NOT a fresh zero-group
#   user — real auth + real membership route to organizer_dashboard_screen. The
#   journey's "Create Group" tap is honored below via the group-list FAB (step 2).
- tapOn:
    id: "login_signup_field_email_phone"
- inputText: "mifos"
- tapOn:
    id: "login_signup_field_password"
- inputText: "password"
- hideKeyboard
- tapOn:
    id: "login_signup_login_button"
- extendedWaitUntil:
    visible:
      id: "organizer_dashboard_screen"
    timeout: 25000
# the REAL group pulled from mifos-bank-2 confirms live-data render
# (extendedWaitUntil, not assertVisible — the organizer dashboard's Today's-Schedule
#  card is populated by a cold companion→Fineract read that can take ~10-15s on first load)
- extendedWaitUntil:
    visible: "Mwangaza Women's Group"
    timeout: 25000

# ── STEP 2/9 · group-type-picker ─────────────────────────────────────────────
# success_signal: "group type selected; proceeds to the create wizard"
# resolution_confidence: high (nav + type card + state assertion all resolved)
# persona test-data: Kofi (community organizer) picks VSLA — the Village Savings
#   & Loan model for his savings group.
- tapOn:
    id: "organizer_dashboard_nav_group_list_card"
- extendedWaitUntil:
    visible:
      id: "group_list_screen"
    timeout: 20000
- tapOn:
    id: "group_list_fab_create"
- extendedWaitUntil:
    visible:
      id: "group_type_picker_screen"
    timeout: 20000
- tapOn:
    id: "group_type_picker_card_vsla"
- extendedWaitUntil:
    visible:
      id: "group_create_screen"
    timeout: 20000

# ── STEP 3/9 · group-create ──────────────────────────────────────────────────
# success_signal: "wizard submitted; group created; Kofi is now its organizer"
# resolution_confidence: high (create-wizard TestTags resolved)
# WRITE-STOP: assert the 4-step wizard renders, then EXIT — the submit_button
#   (POST group create) is intentionally NOT tapped on the protected fleet. The
#   group-name field is left untouched on purpose so the wizard stays pristine and
#   system-back pops cleanly (no unsaved-changes discard dialog). Intended persona
#   input for a real run: name "Kofi Test Circle", type VSLA (selected in step 2).
- assertVisible:
    id: "group_create_type_banner"
- assertVisible:
    id: "group_create_step_indicator"
- assertVisible:
    id: "group_create_field_group_name"
# back out of the create funnel to the group list — the nav stack is
# group_list → group_type_picker → group_create, so TWO backs are needed
# (group_create → group_type_picker → group_list), not one.
- back
- extendedWaitUntil:
    visible:
      id: "group_type_picker_screen"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "group_list_screen"
    timeout: 20000

# ── open the REAL "Mwangaza Women's Group" for the lifecycle-ops steps ─────────
# group_list_card_{groupId} needs a live groupId (not resolvable to a stable tag)
# → select by visible card TEXT instead (text fallback, medium selector).
- assertVisible: "Mwangaza Women's Group"
- tapOn:
    text: "Mwangaza Women's Group"
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 20000

# ── STEP 4/9 · member-invite ─────────────────────────────────────────────────
# success_signal: "invite generated; pending invites list shows sent invitations"
# resolution_confidence: high (dashboard→member-list→invite nav TestTags resolved)
# WRITE-STOP: assert the invite screen renders, then EXIT — generate_button
#   (POST /companion/datatables/invitations/{groupId} → real invite row) is
#   intentionally NOT tapped on the protected fleet.
- tapOn:
    id: "group_dashboard_view_members_button"
- extendedWaitUntil:
    visible:
      id: "member_list_screen"
    timeout: 20000
- tapOn:
    id: "member_list_invite_action"
- extendedWaitUntil:
    visible:
      id: "member_invite_screen"
    timeout: 20000
- assertVisible:
    id: "member_invite_field_email_phone"
- back
- extendedWaitUntil:
    visible:
      id: "member_list_screen"
    timeout: 15000
- back
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 15000

# ── STEP 5/9 · meeting-calendar ──────────────────────────────────────────────
# success_signal: "taps today's meeting row to start the wizard"
# resolution_confidence: medium — meeting_calendar_screen assertion is resolved,
#   but reaching the wizard via the upcoming-meeting Start CTA depends on a
#   meeting being scheduled for today on the live fleet (data-dependent).
- tapOn:
    id: "group_dashboard_view_meetings_button"
- extendedWaitUntil:
    visible:
      id: "meeting_calendar_screen"
    timeout: 20000
- assertVisible:
    id: "meeting_calendar_lazy_column"

# ── STEP 6/9 · meeting-conduct ───────────────────────────────────────────────
# success_signal: "all steps completed; meeting submitted; dt_meeting_record written"
# resolution_confidence: medium — meeting_conduct TestTags resolved, but entry via
#   the Start CTA depends on a live upcoming/in-progress meeting existing.
# WRITE-STOP: assert the 7-step wizard renders, then CLOSE — submit_meeting_btn
#   and the per-member savings / loan-disbursal advances (POST to Fineract) are
#   intentionally NOT tapped on the protected fleet.
- tapOn:
    id: "meeting_calendar_start_meeting_button"
- extendedWaitUntil:
    visible:
      id: "meeting_conduct_screen"
    timeout: 25000
- assertVisible:
    id: "meeting_conduct_stepper"
- tapOn:
    id: "meeting_conduct_close_action"
- extendedWaitUntil:
    visible:
      id: "meeting_calendar_screen"
    timeout: 20000

# ── STEP 7/9 · meeting-summary ───────────────────────────────────────────────
# success_signal: "summary rendered with correct closing balance"
# resolution_confidence: low
# finding: tester-ambiguous-success-signal
# The read-only live-fleet path cannot reach meeting-summary deterministically: it
# is entered either AFTER a real meeting submit (a protected write we must not
# perform) OR by opening a specific PAST meeting whose live dt_meeting_record id is
# not resolvable to a stable TestTag (meeting_calendar_row_{meetingId} needs a
# concrete live meetingId). No selector is fabricated — the gap is surfaced to
# -converge via the intentionally-failing assertion below (device WILL halt here).
- assertVisible:
    text: "RESOLVE: success_signal — summary rendered with correct closing balance (needs a known past-meeting id or a non-protected test group to reach meeting-summary read-only)"

# ── renavigate to the group dashboard for the share-out steps ─────────────────
# (runs once the STEP 7 gap is resolved / on a non-protected test group)
- back
- extendedWaitUntil:
    visible:
      id: "group_dashboard_screen"
    timeout: 20000

# ── STEP 8/9 · share-out-preview ─────────────────────────────────────────────
# success_signal: "allocation verified; group confirms; proceeds to execute"
# resolution_confidence: high (share_out_button → share_out_preview_screen resolved)
- tapOn:
    id: "group_dashboard_share_out_button"
- extendedWaitUntil:
    visible:
      id: "share_out_preview_screen"
    timeout: 25000
- assertVisible:
    id: "share_out_preview_fund_summary_card"

# ── STEP 9/9 · share-out-execute ─────────────────────────────────────────────
# success_signal: "Execute Share-Out confirmed; dt_share_out written"
# resolution_confidence: high (confirm→execute nav + confirmation section resolved)
# WRITE-STOP: assert the double-confirmation section renders, then STOP —
#   execute_button (POST /companion/groups/{groupId}/shareout/execute → dt_share_out,
#   real member payouts) is intentionally NOT tapped on the protected fleet.
- tapOn:
    id: "share_out_preview_confirm_button"
- extendedWaitUntil:
    visible:
      id: "share_out_execute_screen"
    timeout: 20000
- assertVisible:
    id: "share_out_execute_confirmation_section"
