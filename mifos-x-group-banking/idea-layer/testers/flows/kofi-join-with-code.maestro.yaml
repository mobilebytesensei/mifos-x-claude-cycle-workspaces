# ─────────────────────────────────────────────────────────────────────────────
# Testers Army — full-journey device flow
#   persona:  kofi (Group Organizer; also exercises the accept-invitation entry)
#   journey:  join-with-code (tier: critical)
#   target:   LIVE mifos-bank-2 via adb-reverse companion tunnel (READ-ONLY run)
# Generated by journey-maestro-gen from:
#   idea-layer/journeys/join-with-code.yaml (READ-ONLY — never mutated)
#   idea-layer/screens/join-with-code/{flow,ui,api}.yaml + source TestTags
# ─────────────────────────────────────────────────────────────────────────────
# resolution_confidence_summary: high=3 medium=0 low=0
# read_only_boundary: STOP before confirm_join_button — tapping Join writes a real
#   membership (associate_client_to_group POST) on the live server. This flow proves
#   the invitee entry + code-validation read path only.
# write_gated_steps_not_executed: 5 (login-signup account-create, personal-dashboard,
#   personal-savings, personal-loans, loan-request) — post-join / mutation steps that
#   require a real account + membership write; intentionally not run on live data.
#   These are NOT ambiguous signals (all TestTags resolve) — they are device-safety
#   bounded, so no RESOLVE: marker is emitted for them.
appId: "org.mifos.groupbanking"
tags: [testers-army, persona:kofi, journey:join-with-code, tier:critical]
---
# Fresh pre-auth start — accept-invitation is a PRE-AUTH entry, so clearState lands
# us on the login screen's Content state where the accept-invitation button lives.
- launchApp:
    appId: "org.mifos.groupbanking"
    clearState: true
- assertVisible:
    id: "login_signup_screen"

# ── journey step 1a: reach the join-with-code screen ──────────────────────────
# resolution_confidence: high
# source: login-signup ui → LoginSignupTestTags.ACCEPT_INVITATION_BUTTON
#         (first-class PRE-AUTH "Accept an Invitation" button, Content state)
# → LoginSignupRoute.onNavigateToJoinWithCode → join-with-code screen
- extendedWaitUntil:
    visible:
      id: "login_signup_accept_invitation_button"
    timeout: 15000
- tapOn:
    id: "login_signup_accept_invitation_button"
# state assertion: navigation to the join-with-code screen root
- extendedWaitUntil:
    visible:
      id: "join_with_code_screen"
    timeout: 20000

# ── journey step 1b: entry screen renders + code-entry field is present ───────
# resolution_confidence: high
# source: join-with-code ui#components.invite_code_field
#         → JoinWithCodeTestTags.INVITE_CODE_FIELD
- assertVisible:
    id: "join_with_code_invite_code_field"

# ── persona test-data: enter the real live invite code (kofi accepts an invite) ─
# resolution_confidence: high
# NOTE: field-fill only — this exercises validation, NOT the membership write.
- tapOn:
    id: "join_with_code_invite_code_field"
- inputText: "AADBXA"
- hideKeyboard

# ── journey step 1c: success_signal "code validated; invite resolved to a group" ─
# resolution_confidence: high
# source: flow.yaml#on_validate_code (OnValidateCode) → ui#components.validate_button
#         → JoinWithCodeTestTags.VALIDATE_BUTTON ; async call_api transition
#         (VALIDATING → VALID) asserted on the preview-card state root.
- tapOn:
    id: "join_with_code_validate_button"
# async: validate_invite_token GET + get_group_preview GET resolve → Preview state.
# The group preview card rendering IS "invite resolved to a group" on device.
- extendedWaitUntil:
    visible:
      id: "join_with_code_preview_card"
    timeout: 25000

# ═════════════════════════════════════════════════════════════════════════════
# READ-ONLY BOUNDARY — DO NOT tap join_with_code_confirm_join_button beyond here.
# OnConfirmJoin → associate_client_to_group (POST) writes a real membership to
# mifos-bank-2. The remaining journey screen_sequence steps are write-gated and
# deliberately NOT executed on live data:
#   • login-signup   — account-create write (dt_member_role)
#   • personal-dashboard / personal-savings / personal-loans — post-join reads
#     (unreachable without the membership write above)
#   • loan-request   — dt_loan_request write
# Re-enable these against a disposable/mock backend, not the live server.
# ═════════════════════════════════════════════════════════════════════════════
