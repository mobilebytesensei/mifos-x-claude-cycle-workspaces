# Behavior-assertion sibling for kofi-group-creation-flow.maestro.yaml
# DECLARED side-effects of the group-create OnSubmit action_contract
# (group-create/ui.yaml submit_button.on_click.action_contract — effect: call_api,
#  writes_to: [groups_cache, group_type_config_cache, sync_queue, ...]).
# api.yaml#create_group_orchestrate → POST /companion/groups (COMP-GRP-001).
#
# NOTE: On the LIVE mifos-bank-2 device run the final Create/Submit is INTENTIONALLY NOT tapped
# (READ-ONLY guard — see the two `RESOLVE:` markers in the .maestro.yaml). These assertions
# therefore declare the write contract for SP-04 correlation and fire only in a write-enabled
# run (--mode mocked seeds below, or a staging device). They are NOT expected to trigger on the
# read-only live pass.
schema_version: "1.0"
flow: kofi-group-creation-flow
mode_overrides:
  mocked:
    mock_responses:
      - url_contains: "/companion/groups"
        method: POST
        status: 200
        body: '{"groupId":"9001","fineractGroupId":9001,"inviteCode":"KOFI-VSLA-01"}'
assertions:
  # effect: call_api — COMP-GRP-001 orchestration POST
  - assert_network_call:
      url_contains: "/companion/groups"
      method: POST
      status: 200
  # effect: persist_db — new group row written to the offline-first cache on success
  - assert_db_row:
      table: groups_cache
      where: { name: "Kofi VSLA Test Group" }
  # effect: persist_db — dt_group_config provisioned from the selected VSLA typeConfig
  - assert_db_row:
      table: group_type_config_cache
      where: { group_type: "VSLA" }
