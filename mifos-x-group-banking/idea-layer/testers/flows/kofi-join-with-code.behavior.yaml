# Behavior-assertion sibling for kofi-join-with-code.maestro.yaml
# Only the READ path actually exercised by the READ-ONLY device flow is asserted.
# call_api effects triggered by OnValidateCode (join-with-code/flow.yaml#on_validate_code
# → ui#components.validate_button.action_contract.effect: call_api):
#   validate_invite_token GET + get_group_preview GET (both writable:false reads).
#
# INTENTIONALLY OMITTED (write-gated; the flow stops before confirm_join_button):
#   • associate_client_to_group POST /companion/groups/{groupId}/associate-clients
#   • mark_invitation_accepted  PUT  /companion/datatables/invitations/{entityId}/{rowId}
#   • dt_member_role persist_db (journey step login-signup)
#   • dt_loan_request persist_db (journey step loan-request)
# These are not asserted because the read-only flow never triggers them on live data.
schema_version: "1.0"
flow: kofi-join-with-code
assertions:
  # validate_invite_token — resolves the 6-char code against the invitations datatable
  - assert_network_call:
      url_contains: "/companion/datatables/invitations/"
      method: "GET"
      status: 200
  # get_group_preview — populates the preview card after a successful validation
  - assert_network_call:
      url_contains: "/companion/groups/"
      method: "GET"
      status: 200
