# ═══════════════════════════════════════════════════════════════════════════
# Behavior-assertion sibling for kofi-loan-apply-to-approval.maestro.yaml
# Schema: core/schemas/behavior-assertion-dsl.schema.json (RULE-E2E-2WAY-001)
# ───────────────────────────────────────────────────────────────────────────
# Only the READ side-effects that the sibling read-only flow actually triggers are
# asserted here — both verifiable on the live-mifos-bank-2 run:
#   • loan-list load  → GET /groups/{groupId}/loans   (get_group_loans, flow.yaml#on_load)
#   • loan-detail load → GET /loans/{loanId}           (get_loan_detail, flow.yaml#on_load)
#
# DELIBERATELY NOT ASSERTED (protected write withheld by the sibling flow):
#   • loan-apply OnSubmit → POST /loans  (post_loan → creates m_loan pending approval,
#     ui.yaml#submit_button action_contract.effect: call_api). The flow stops before
#     Submit on live Mwangaza, so this write never fires on this run and asserting it
#     would be false. Recorded here for SP-04 / -converge auditability only.
#   • loan-apply OnMemberSelected → get_member_savings (a READ that DOES fire, but the
#     exact companion endpoint path is not confidently resolvable — omitted rather than
#     guessed, per no-silent-guess).
# ═══════════════════════════════════════════════════════════════════════════
schema_version: "1.0"
flow: kofi-loan-apply-to-approval
assertions:
  # loan-list content state — Grace's real loan list read from Fineract
  - assert_network_call: { url_contains: "groups/1/loans", method: GET, status: 200 }
  # loan-detail content state — real loan 13 (Grace Wanjiru) read from Fineract
  - assert_network_call: { url_contains: "loans/13", method: GET, status: 200 }
