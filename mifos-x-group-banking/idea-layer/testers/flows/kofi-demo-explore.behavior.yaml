# Behavior-assertion sibling for kofi-demo-explore.maestro.yaml (RULE-E2E-2WAY-001).
# Schema-valid against core/schemas/behavior-assertion-dsl.schema.json.
#
# Exactly ONE walked screen_sequence step declares a qualifying action_contract.effect:
#   login-signup · OnDemoConfirm · effect: persist_db
#     DemoSessionManager hydrates the bundled PROJECT_DEMO_DATA VSLA fixture (Mwangaza Women's
#     Group / demo-group-001) into the local SQLDelight demo cache under a synthetic demo session
#     token. writes_to (per ui.yaml action_contract): local SQLDelight demo cache
#     {groups, members, savings_accounts, meeting_records, corpus, active_loans, invite_code}.
#
# demo-explore is OFFLINE + READ-ONLY → NO assert_network_call is emitted (no companion/Fineract
# call fires; every browse surface reads from this seeded local cache). The assertions below prove
# the persist_db seed landed so the downstream dashboard/calendar/member/savings surfaces have data.
schema_version: "1.0"
flow: kofi-demo-explore
assertions:
  # seeded demo group (Mwangaza Women's Group VSLA / demo-group-001) persisted to the local demo cache
  - assert_db_row:
      table: groups
      where: { name: "Mwangaza Women's Group" }
      min_rows: 1
  # seeded member roster for the demo group (backs step 4 "seeded member roster renders")
  - assert_db_row:
      table: members
      where: { group_id: "demo-group-001" }
      min_rows: 1
  # seeded savings accounts for the demo group (backs step 5 "seeded savings balances render")
  - assert_db_row:
      table: savings_accounts
      where: { group_id: "demo-group-001" }
      min_rows: 1
  # seeded meeting records — upcoming + past (backs step 3 "seeded upcoming + past meetings render")
  - assert_db_row:
      table: meeting_records
      where: { group_id: "demo-group-001" }
      min_rows: 1
