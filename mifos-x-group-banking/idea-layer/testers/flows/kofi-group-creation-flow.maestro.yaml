appId: "org.mifos.groupbanking"
tags: [testers-army, persona:kofi, journey:group-creation-flow, tier:critical]
# resolution_confidence_summary: high=8 medium=1 low=2
# journey: group-creation-flow (v2.0.0) — Create a New Savings Group (Organizer Self-Serve)
# persona: kofi — Group Organizer (primary). jtbd: register a new savings group.
# generated by: journey-maestro-gen (SP-02, testers-army) — journeys are READ-ONLY; resolved at gen-time.
# READ-ONLY LIVE DEVICE (mifos-bank-2 via adb reverse tunnel): the create WIZARD is WALKED
# (fill + validate + advance) but the final Create/Submit is NEVER tapped — it would write a
# real group to mifos-bank-2. Wizard navigation + validation states are asserted instead.
# Low-confidence journey signals are surfaced as intentionally-failing `RESOLVE:` assertions
# (auditable by -converge / SP-04), never fabricated taps.
---
- launchApp: { appId: "org.mifos.groupbanking", clearState: true }

# ── Login preamble (creds: mifos / password → organizer-dashboard) ────────────────
- extendedWaitUntil:
    visible: { id: "login_signup_screen" }
    timeout: 20000
- tapOn: { id: "login_signup_field_email_phone" }
- inputText: "mifos"
- tapOn: { id: "login_signup_field_password" }
- inputText: "password"
- hideKeyboard
- tapOn: { id: "login_signup_login_button" }
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 25000

# ── Reach the create-group entry: dashboard → group list → FAB ────────────────────
# OrganizerDashboardTestTags.NAV_GROUP_LIST_CARD → group-list;
# GroupListTestTags.FAB_CREATE → group-list flow.yaml on_create_group → navigate group-type-picker.
- tapOn: { id: "organizer_dashboard_nav_group_list_card" }
- extendedWaitUntil:
    visible: { id: "group_list_screen" }
    timeout: 20000
- tapOn: { id: "group_list_fab_create" }
- extendedWaitUntil:
    visible: { id: "group_type_picker_screen" }
    timeout: 20000

# ══ Journey step 1/3 — group-type-picker ══════════════════════════════════════════
# success_signal: "group type selected; proceeds to the create wizard"
# resolved: flow.yaml on_type_card_tap → emit NavigateToGroupCreate (nav_target: group-create)
#           ui.yaml type_card_vsla → GroupTypePickerTestTags.TYPE_CARD_VSLA (group_type_picker_card_vsla)
# persona test-data: Kofi runs a VSLA (Village Savings & Loan) — his flagship savings model.
# resolution_confidence: high
- assertVisible: { id: "group_type_picker_type_list" }
- tapOn: { id: "group_type_picker_card_vsla" }
- extendedWaitUntil:
    visible: { id: "group_create_screen" }
    timeout: 20000

# ══ Journey step 2/3 — group-create (4-step wizard) ═══════════════════════════════
# success_signal: "wizard submitted; group created"  — WRITE-GUARDED: walk + validate, DO NOT submit.
# resolved (step-1 content render + name input): ui.yaml step_1 components → GroupCreateTestTags.
# resolution_confidence: high
- assertVisible: { id: "group_create_step_indicator" }
- assertVisible: { id: "group_create_type_banner" }
- assertVisible: { id: "group_create_field_group_name" }
- tapOn: { id: "group_create_field_group_name" }
- inputText: "Kofi VSLA Test Group"
- hideKeyboard

# validation gate — advancing with office/meeting-day/meeting-time still unset must NOT leave step 1.
# resolved: flow.yaml on_next_step.on_invalid → show_validation_errors (stays on step 1).
# resolution_confidence: medium
# finding: tester-inferred-validation-state (no dedicated per-field validation-error TestTag;
#   assert step-1-only field still visible as proxy for "advance blocked").
- tapOn: { id: "group_create_next_button" }
- assertVisible: { id: "group_create_field_group_name" }

# ── remaining wizard completion — UNRESOLVED on this device ───────────────────────
# resolution_confidence: low
# finding: tester-device-write-guarded-and-datadriven-selectors
# Steps 1-3 require office_dropdown / currency_dropdown / meeting_day_dropdown / meeting_time_picker
# whose OPTIONS are data-driven from the get_offices API (no stable TestTag on menu items), and the
# final submit_button (OnSubmit → POST /companion/groups) writes a real group to mifos-bank-2.
# Not fabricating dropdown-item taps or the Create tap. Behavior contract → sibling .behavior.yaml.
- assertVisible:
    text: "RESOLVE: success_signal — wizard submitted; group created (office/currency/meeting-day dropdown options have no stable selector + final Create is write-guarded on live mifos-bank-2)"

# ══ Journey step 3/3 — group-dashboard ════════════════════════════════════════════
# success_signal: "group dashboard renders with empty corpus card"
# resolution_confidence: low
# finding: tester-device-write-guarded
# The NEW group's dashboard is only reachable AFTER a successful Create (flow.yaml on_submit →
# emit NavigateToGroupDashboard), which is intentionally not executed on the read-only live device.
- assertVisible:
    text: "RESOLVE: success_signal — group dashboard renders with empty corpus card (unreachable without submitting the create wizard; write-guarded on live mifos-bank-2)"
