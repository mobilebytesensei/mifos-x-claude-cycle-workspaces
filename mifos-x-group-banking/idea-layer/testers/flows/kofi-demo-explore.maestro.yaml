# ═══════════════════════════════════════════════════════════════
# Testers Army — persona × journey device flow (SP-02, journey-maestro-gen)
# persona: kofi (Group Organizer — entering via the pre-signup demo path)
# journey: demo-explore (tier: critical) — READ-ONLY, offline demo session
#
# Generated by walking idea-layer/journeys/demo-explore.yaml#screen_sequence and
# triangulating, per success_signal, screens/{screen}/flow.yaml + ui.yaml + source
# TestTags (feature/*/…/{Screen}TestTags.kt). journeys_unchanged: true — the journey
# is read-only; all resolution happened at generation time into this file.
#
# DEMO-EXPLORE IS OFFLINE + READ-ONLY: the demo session is SEEDED into the local
# SQLDelight cache (persist_db) — NO companion API / Fineract network call fires while
# browsing, so no assert_network_call is emitted (the sibling .behavior.yaml asserts the
# local seed persisted instead).
#
# AlertDialog device-lesson (carried from login-signup/maestro/auth-redesign-verify.yaml):
# the Demo Explore confirm dialog renders in a SEPARATE window → its container testTag is
# not surfaced to uiautomator, so it is asserted + its "Continue" button tapped BY TEXT.
#
# resolution_confidence_summary: high=2 medium=1 low=2
# ═══════════════════════════════════════════════════════════════
appId: "org.mifos.groupbanking"
name: "testers-army — kofi × demo-explore (offline demo browse)"
tags:
  - testers-army
  - persona:kofi
  - journey:demo-explore
  - tier:critical
---
- launchApp:
    appId: "org.mifos.groupbanking"
    clearState: true   # demo-explore starts from a fresh login screen (no persisted session)

# ── step 1/5 · login-signup · success_signal: "confirm dialog shown; user accepts the demo notice" ──
# resolution_confidence: high
# resolved: flow.yaml on_demo_explore→OnDemoExplore (showDemoDialog=true) · ui.yaml components.demo_explore_button
#           · TestTag LoginSignupTestTags.DEMO_EXPLORE_BUTTON
- assertVisible: { id: "login_signup_screen" }
- extendedWaitUntil:
    visible: { id: "login_signup_demo_explore_button" }
    timeout: 15000
- tapOn: { id: "login_signup_demo_explore_button" }
# Demo Explore confirm AlertDialog (separate window) — assert by TEXT (demo_dialog_title + demo_dialog_body)
- assertVisible: "Explore as a demo user"
- assertVisible: "This is a demo user logging in to explore the application."
# accept the demo notice — OnDemoConfirm (confirm label "Continue"); AlertDialog button tapped by text
- tapOn: "Continue"

# ── step 2/5 · organizer-dashboard · success_signal: "dashboard renders in demo mode with the seeded Mwangaza Women's Group" ──
# resolution_confidence: high
# resolved: login-signup flow.yaml on_demo_confirm→NavigateToOrganizerDashboard (after DemoSessionManager
#           seeds the offline cache) · TestTag OrganizerDashboardTestTags.SCREEN / .CONTENT
- extendedWaitUntil:
    visible: { id: "organizer_dashboard_screen" }
    timeout: 25000   # absorbs demo-seed hydration (isSeedingDemo) + navigation
- assertVisible: { id: "organizer_dashboard_content" }
# seeded-data proof: the demo VSLA renders (Today's Schedule row headline binds meeting.groupName)
- assertVisible: "Mwangaza Women's Group"

# ── step 3/5 · meeting-calendar · success_signal: "seeded upcoming + past meetings render for the demo group" ──
# resolution_confidence: medium
# resolved: organizer-dashboard flow.yaml on_view_meetings_today→navigate meeting-calendar(center_id)
#           · ui.yaml components.kpi_meetings_today (OnViewMeetingsToday) · TestTag OrganizerDashboardTestTags.KPI_MEETINGS_CARD
# medium: the nav is runtime-guarded (meetingsTodayCount > 0) — depends on the seeded demo having a
#         meeting today; if the seed has none the KPI card is non-interactive and the wait below
#         surfaces the gap to -converge rather than silently passing.
- tapOn: { id: "organizer_dashboard_kpi_meetings_card" }
- extendedWaitUntil:
    visible: { id: "meeting_calendar_screen" }
    timeout: 20000
- assertVisible: { id: "meeting_calendar_lazy_column" }

# ── step 4/5 · member-list · success_signal: "seeded member roster renders" ──
# resolution_confidence: low
# finding: tester-unresolved-nav-edge
# No source resolves a tap: meeting-calendar/flow.yaml navigates_to only {meeting-conduct, previous-meeting-review};
# member-list/ui.yaml entry_point is group-dashboard#view_members. The journey screen_sequence omits the
# group-list→group-dashboard hop, so there is NO direct meeting-calendar→member-list transition to tap.
# NOT fabricated (no-silent-guess) — the failing assertion below surfaces the gap to /idea-testers-run -converge (SP-04).
- assertVisible: { text: "RESOLVE: success_signal — seeded member roster renders (no declared nav edge meeting-calendar->member-list; member-list is reached via group-dashboard#view_members, which the journey screen_sequence skips)" }

# ── step 5/5 · savings-dashboard · success_signal: "seeded savings balances render; user has explored the core surfaces" ──
# resolution_confidence: low
# finding: tester-unresolved-nav-edge
# member-list/flow.yaml navigates_to only {member-profile, member-add, member-invite};
# savings-dashboard/ui.yaml entry_point is group-dashboard#OnViewSavings. No direct member-list->savings-dashboard edge.
- assertVisible: { text: "RESOLVE: success_signal — seeded savings balances render (no declared nav edge member-list->savings-dashboard; savings-dashboard is reached via group-dashboard#OnViewSavings, which the journey screen_sequence skips)" }
