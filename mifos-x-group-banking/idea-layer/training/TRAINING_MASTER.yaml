# ── State Model Patterns ──────────────────────────────────────────
state_patterns:
  mvi_pattern:
    description: "MVI (Model-View-Intent) with sealed interfaces for all ViewModels"
    state_class: "{FeatureName}State — data class with all UI state fields"
    screen_state: "{FeatureName}ScreenState — sealed interface: Idle | Loading | Success | Error"
    event_class: "{FeatureName}Event — sealed interface: NavigateTo* | Show* | Dismiss*"
    action_class: "{FeatureName}Action — sealed interface: On{UserAction}"
    di_pattern: "Repository + Manager classes injected via constructor"
    example: "LoginViewModel, GroupListViewModel, MeetingConductViewModel"

  loading_pattern:
    description: "Cached-then-fresh: show cached data immediately, refresh in background"
    initial_state: "Loading (shimmer) → cached data shown → fresh data replaces"
    offline_state: "Offline banner shown when isOnline == false; cached data still visible"
    error_state: "Error snackbar / inline banner with retry action"

  form_validation_pattern:
    description: "Real-time field validation; CTA disabled until all required fields valid"
    enabled_when: "button.style.enabled_when expression in YAML"
    error_display: "Inline field error text below field; banner for API errors"

  pagination_pattern:
    description: "Load-more at bottom of list"
    trigger: "User scrolls to bottom; load_more_indicator visible"
    used_in: [group-list, member-list, loan-list, meeting-calendar]

  offline_first_pattern:
    description: "All write operations queued to SyncQueue when offline"
    queue_table: "SQLDelight SyncQueue (entity_type, operation, payload_json, status)"
    sync_trigger: "WorkManager network-available constraint; manual tap on sync-status"
    conflict_resolution: "Server wins; local changes marked as conflicted"

# ── API Patterns ──────────────────────────────────────────────────
api_patterns:
  fineract_rest:
    base_path: "/fineract-provider/api/v1"
    auth_header: "Authorization: Basic base64(username:password)"
    content_type: "application/json"
    tenant_header: "X-Fineract-Platform-TenantId: default"
    pagination: "offset + limit query params; response includes totalFilteredRecords"

  self_service:
    base_path: "/fineract-provider/api/v1/self"
    auth_header: "Authorization: Basic base64(username:password)"
    notes: "Used for end-user (member) auth and personal account access only"

  datatables:
    pattern: "/datatables/{tableName}/{entityId}"
    methods: [GET, POST, PUT, DELETE]
    used_tables: [dt_group_config, dt_meeting_record, dt_meeting_attendance, dt_member_role, dt_share_out, dt_loan_vote, dt_sync_metadata, dt_loan_request, dt_group_corpus]

  batch_api:
    endpoint: "/batches"
    method: POST
    purpose: "Bulk-sync queued SyncQueue items when connectivity restored"
    notes: "Used by offline-sync feature only"

  naming_conventions:
    get_list: "get_{entity_plural} → GET /{entities}"
    get_single: "get_{entity} → GET /{entities}/{id}"
    create: "create_{entity} → POST /{entities}"
    update: "update_{entity} → PUT /{entities}/{id}"
    datatable_get: "get_{table_name} → GET /datatables/{table}/{id}"
    datatable_upsert: "upsert_{table_name} → POST or PUT /datatables/{table}/{id}"

