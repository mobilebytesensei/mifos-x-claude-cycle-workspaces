# ═══════════════════════════════════════════════════════════════════
# PHASE 10 — §flows
# ═══════════════════════════════════════════════════════════════════
flows:
  _tag: "§flows"
  _status: approved
  _quality_score: 90
  _last_updated: "2026-05-03T01:00:00Z"
  _enrichment_count: 1
  _source: "wizard"
  content:
    flows:
      - name: "group-creation-flow"
        type: happy
        feature_ref: "group-management"
        steps:
          - "Login → group-list"
          - "Tap + → group-create (step 1: name, cycle length)"
          - "Step 2: meeting frequency, contribution rules"
          - "Step 3: loan policies (multiplier, interest)"
          - "Review & Create → group-dashboard"
          - "Sync to Fineract Center"

      - name: "meeting-flow"
        type: happy
        feature_ref: "meeting-lifecycle"
        source_ref: "CR-003"
        steps:
          - "group-dashboard → Start Meeting (show opening fund balance)"
          - "Step 0 — previous-meeting-review: last meeting summary, balances, action items"
          - "Step 1 — Attendance: roll call, mark present/absent/late, auto-penalty"
          - "Step 2 — Savings Collection: group-linked + individual savings deposits"
          - "Step 3 — Loan Repayments: collect principal + interest"
          - "Step 4 — Withdrawals/Disbursements: blocked if exceeds corpus"
          - "Step 5 — New Loans: application, eligibility, voting, approve/reject"
          - "Step 6 — Notes & Action Items"
          - "Step 7 — Review & Close: opening + inflows - outflows = closing balance"
          - "meeting-summary → Close Meeting"
          - "Sync all transactions"

      - name: "loan-lifecycle-flow"
        type: happy
        feature_ref: "loan-management"
        steps:
          - "member-profile → Request Loan"
          - "loan-apply: eligibility check, amount, terms"
          - "Meeting: loan request presented → group votes"
          - "Approved → disbursement recorded"
          - "loan-detail: repayment tracking"
          - "Meeting: repayment collected → marked paid"
          - "Loan closed when fully repaid"

      - name: "share-out-flow"
        type: happy
        feature_ref: "share-out"
        steps:
          - "group-dashboard → Initiate Share-Out"
          - "Compute profit: loan interest received + fees + penalties"
          - "Compute per-member share: (member_savings / total_savings) * total_pool"
          - "share-out-preview: per-member breakdown with savings return + profit share"
          - "Group reviews and confirms"
          - "share-out-execute: distribute to each member (withdrawal transactions)"
          - "Cycle closed → historical record saved → new cycle started"

      - name: "offline-sync-flow"
        type: happy
        feature_ref: "offline-sync"
        steps:
          - "User works offline (all CRUD operations)"
          - "Transactions queued in sync_queue table"
          - "Connectivity detected → auto-sync triggers"
          - "Batch API sends queued items to Fineract"
          - "Conflicts detected → conflict resolution UI"
          - "sync-status updated with results"

      - name: "admin-auth-flow"
        type: happy
        feature_ref: "authentication"
        steps:
          - "App launch → check for cached token + client_type"
          - "No token → client-type-selector: 'I manage groups' vs 'I am a member'"
          - "Select 'I manage groups' → login with Fineract staff credentials"
          - "Authenticate via /api/v1/authentication → cache token + client_type=admin"
          - "Read dt_member_role → determine role (treasurer/chairperson/field officer)"
          - "Set up local PIN for offline access"
          - "Optional: enable biometric unlock"
          - "Redirect to group-list (admin navigation)"

      - name: "end-user-auth-flow"
        type: happy
        feature_ref: "authentication"
        steps:
          - "App launch → check for cached token + client_type"
          - "No token → client-type-selector: 'I manage groups' vs 'I am a member'"
          - "Select 'I am a member' → login with Fineract self-service client credentials"
          - "Authenticate via /api/v1/self/authentication → cache token + client_type=end_user"
          - "Fetch own client data: savings, loans, group membership"
          - "Set up local PIN for offline access"
          - "Redirect to personal-dashboard (end user navigation)"

      - name: "end-user-loan-request-flow"
        type: happy
        feature_ref: "end-user-dashboard"
        steps:
          - "personal-dashboard → 'Request Loan' button"
          - "loan-request form: enter amount, purpose, duration"
          - "Eligibility auto-calculated: (own_savings * group_loan_multiplier)"
          - "If eligible → submit request (stored in dt_loan_request on m_client)"
          - "Show confirmation: 'Your request will be reviewed at next meeting'"
          - "Request appears in admin's meeting agenda automatically"
          - "End user checks status: personal-loans → loan status badge"

      - name: "sync-conflict-flow"
        type: error
        feature_ref: "offline-sync"
        steps:
          - "Sync detects server version differs from local"
          - "Show conflict resolution UI with both versions"
          - "User selects: keep local / accept server / merge"
          - "Resolution applied, sync retried"
          - "If unresolvable → flag for field officer review"

      - name: "loan-rejection-flow"
        type: edge
        feature_ref: "loan-management"
        steps:
          - "Loan request presented in meeting"
          - "Group votes: majority rejects"
          - "Loan marked as rejected with reason"
          - "Member notified, can re-apply next meeting"

      # ── FLOW FROM COMMUNITY RESEARCH (CR-003) — professionally curated ──

      - name: "corpus-outflow-blocked-flow"
        type: error
        feature_ref: "corpus-tracking"
        source_ref: "CR-003"
        steps:
          - "During meeting withdrawals/disbursements: user attempts cash outflow"
          - "System checks: would corpus go negative after this transaction?"
          - "If yes → show error: 'Insufficient group funds. Available: X, Requested: Y'"
          - "Transaction blocked — user can reduce amount or skip"

# ═══════════════════════════════════════════════════════════════════
# PHASE 11 — §api_surface
# ═══════════════════════════════════════════════════════════════════
api_surface:
  _tag: "§api_surface"
  _status: approved
  _quality_score: 95
  _last_updated: "2026-05-03T01:00:00Z"
  _enrichment_count: 2
  _source: "wizard+mcp_ingest"
  external_api_ref: "API-001"
  content:
    # ─────────────────────────────────────────────────────────────
    # FINERACT DATA TABLES — CUSTOM API DESIGN SYSTEM
    # ─────────────────────────────────────────────────────────────
    # Data Tables are NOT just storage — they are a FULL API DESIGN
    # mechanism. You can CREATE new tables (= design new REST endpoints)
    # attached to any Fineract entity, with typed columns and full CRUD.
    #
    # Capability via MCP:
    #   create_datatable    → POST /datatables (CREATE TABLE with schema)
    #   create_datatable_entry → POST /datatables/{name}/{entityId}
    #   get_datatable_entries  → GET  /datatables/{name}/{entityId}
    #   update_datatable_entry → PUT  /datatables/{name}/{entityId}
    #   delete_datatable_entry → DELETE /datatables/{name}/{entityId}
    #
    # Attachable to: m_client, m_group, m_loan, m_savings_account, m_office, m_center
    # Column types:  string, int, decimal, boolean, date, datetime, text, dropdown
    # ─────────────────────────────────────────────────────────────

    endpoints:
      # ── Authentication ──
      - path: "/fineract-provider/api/v1/authentication"
        method: POST
        description: "Authenticate with Fineract (username/password → base64 basic auth → token)"
        auth_required: false
        source: external_api
        source_ref: "API-001"
        mcp_tool: null

      # ── Centers (= CommonPurse Groups) ──
      - path: "/fineract-provider/api/v1/centers"
        method: POST
        description: "Create a new center (maps to CommonPurse Group entity)"
        auth_required: true
        source: external_api
        mcp_tool: "create_new_center"

      - path: "/fineract-provider/api/v1/centers/{centerId}"
        method: GET
        description: "Get center details with associations (groups, members)"
        auth_required: true
        source: external_api
        mcp_tool: "get_center"

      - path: "/fineract-provider/api/v1/centers"
        method: GET
        description: "List all centers (field officer group listing)"
        auth_required: true
        source: external_api
        mcp_tool: "list_all_centers"

      # ── Groups (Fineract sub-groups within center — for loan products) ──
      - path: "/fineract-provider/api/v1/groups"
        method: POST
        description: "Create lending sub-group within center for group loan products"
        auth_required: true
        source: external_api
        mcp_tool: "create_lending_group"

      - path: "/fineract-provider/api/v1/groups/{groupId}"
        method: GET
        description: "Get group details"
        auth_required: true
        source: external_api
        mcp_tool: "get_group"

      - path: "/fineract-provider/api/v1/groups/{groupId}?command=activate"
        method: POST
        description: "Activate a pending group"
        auth_required: true
        source: external_api
        mcp_tool: "activate_pending_group"

      - path: "/fineract-provider/api/v1/groups/{groupId}?command=associateClients"
        method: POST
        description: "Add a client member to a group"
        auth_required: true
        source: external_api
        mcp_tool: "add_member_to_group"

      # ── Clients (= CommonPurse Members) ──
      - path: "/fineract-provider/api/v1/clients"
        method: POST
        description: "Create a new client (maps to CommonPurse Member entity)"
        auth_required: true
        source: external_api
        mcp_tool: "create_new_client"

      - path: "/fineract-provider/api/v1/clients/{clientId}"
        method: GET
        description: "Get client details with accounts summary"
        auth_required: true
        source: external_api
        mcp_tool: "get_client"

      - path: "/fineract-provider/api/v1/clients/{clientId}?command=activate"
        method: POST
        description: "Activate a pending client"
        auth_required: true
        source: external_api
        mcp_tool: "activate_pending_client"

      - path: "/fineract-provider/api/v1/clients/{clientId}/accounts"
        method: GET
        description: "Get all accounts (savings + loans) for a client"
        auth_required: true
        source: external_api
        mcp_tool: "get_client_accts"

      - path: "/fineract-provider/api/v1/clients/{clientId}/identifiers"
        method: POST
        description: "Add identity document for a client (national ID, etc.)"
        auth_required: true
        source: external_api
        mcp_tool: "add_identifier"

      - path: "/fineract-provider/api/v1/search?query={term}"
        method: GET
        description: "Search clients by name, external ID, or account number"
        auth_required: true
        source: external_api
        mcp_tool: "search_clients"

      # ── Savings Accounts ──
      - path: "/fineract-provider/api/v1/savingsaccounts"
        method: POST
        description: "Create savings account for member (linked to savings product)"
        auth_required: true
        source: external_api
        mcp_tool: "create_savings"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}"
        method: GET
        description: "Get savings account details with balance, status"
        auth_required: true
        source: external_api
        mcp_tool: "get_savings"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}?command=approve"
        method: POST
        description: "Approve and activate a savings account"
        auth_required: true
        source: external_api
        mcp_tool: "approve_activate_savings"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions?command=deposit"
        method: POST
        description: "Record savings deposit (member contribution)"
        auth_required: true
        source: external_api
        mcp_tool: "deposit"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions?command=withdrawal"
        method: POST
        description: "Record savings withdrawal (share-out distribution)"
        auth_required: true
        source: external_api
        mcp_tool: "withdraw"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions"
        method: GET
        description: "Get all transactions for a savings account"
        auth_required: true
        source: external_api
        mcp_tool: "get_savings_txns"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}/charges"
        method: POST
        description: "Apply fee/charge to savings account (fines)"
        auth_required: true
        source: external_api
        mcp_tool: "apply_savings_fee"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}?command=close"
        method: POST
        description: "Close savings account (end of cycle)"
        auth_required: true
        source: external_api
        mcp_tool: "close_savings"

      - path: "/fineract-provider/api/v1/savingsaccounts/{accountId}?command=calculateInterest&command=postInterest"
        method: POST
        description: "Calculate and post interest on savings"
        auth_required: true
        source: external_api
        mcp_tool: "calc_post_interest"

      # ── Loans ──
      - path: "/fineract-provider/api/v1/loans"
        method: POST
        description: "Create loan application (individual member loan)"
        auth_required: true
        source: external_api
        mcp_tool: "create_new_loan"

      - path: "/fineract-provider/api/v1/loans/{loanId}"
        method: GET
        description: "Get loan details with repayment schedule"
        auth_required: true
        source: external_api
        mcp_tool: "get_loan"

      - path: "/fineract-provider/api/v1/loans/{loanId}?command=approve&command=disburse"
        method: POST
        description: "Approve and disburse a pending loan"
        auth_required: true
        source: external_api
        mcp_tool: "approve_disburse_loan"

      - path: "/fineract-provider/api/v1/loans/{loanId}/transactions?command=repayment"
        method: POST
        description: "Record loan repayment"
        auth_required: true
        source: external_api
        mcp_tool: "make_repayment"

      - path: "/fineract-provider/api/v1/loans/{loanId}?command=reject"
        method: POST
        description: "Reject a loan application"
        auth_required: true
        source: external_api
        mcp_tool: "reject_loan"

      - path: "/fineract-provider/api/v1/loans/{loanId}?command=undoapproval"
        method: POST
        description: "Undo loan approval"
        auth_required: true
        source: external_api
        mcp_tool: "undo_approval"

      - path: "/fineract-provider/api/v1/loans/{loanId}?command=undodisbursal"
        method: POST
        description: "Undo loan disbursal"
        auth_required: true
        source: external_api
        mcp_tool: "undo_disbursal"

      - path: "/fineract-provider/api/v1/loans/{loanId}/transactions?command=waiveInterest"
        method: POST
        description: "Waive interest on a loan"
        auth_required: true
        source: external_api
        mcp_tool: "waive_loan_interest"

      - path: "/fineract-provider/api/v1/loans/{loanId}/charges"
        method: POST
        description: "Apply fee/charge to a loan (late penalty)"
        auth_required: true
        source: external_api
        mcp_tool: "apply_loan_fee"

      - path: "/fineract-provider/api/v1/loans/{loanId}/schedule"
        method: GET
        description: "Get repayment schedule for a loan"
        auth_required: true
        source: external_api
        mcp_tool: "get_repayment_sched"

      - path: "/fineract-provider/api/v1/loans/template?clientId={id}"
        method: GET
        description: "Get loan application template with product defaults and charge options"
        auth_required: true
        source: external_api
        mcp_tool: "get_loan_app_template"

      - path: "/fineract-provider/api/v1/clients/{clientId}/loans?status=overdue"
        method: GET
        description: "Get overdue loans for a client"
        auth_required: true
        source: external_api
        mcp_tool: "get_overdue_loans_for_client"

      - path: "/fineract-provider/api/v1/rescheduleloans"
        method: POST
        description: "Reschedule a loan application"
        auth_required: true
        source: external_api
        mcp_tool: "reschedule_loan_app"

      # ── Group Loans ──
      - path: "/fineract-provider/api/v1/loans (group context)"
        method: POST
        description: "Create group loan application for a lending group"
        auth_required: true
        source: external_api
        mcp_tool: "create_group_loan_app"

      # ── Charges (Fees & Fines) ──
      - path: "/fineract-provider/api/v1/charges"
        method: POST
        description: "Create charge definition (appliesTo: 1=Loan, 2=Savings, 3=Client; calcType: 1=Flat, 2=%)"
        auth_required: true
        source: external_api
        mcp_tool: "create_new_charge"

      - path: "/fineract-provider/api/v1/charges/{chargeId}"
        method: GET
        description: "Get charge details"
        auth_required: true
        source: external_api
        mcp_tool: "get_charge"

      - path: "/fineract-provider/api/v1/charges"
        method: GET
        description: "List all charge definitions"
        auth_required: true
        source: external_api
        mcp_tool: "list_all_charges"

      - path: "/fineract-provider/api/v1/charges/{chargeId}"
        method: PUT
        description: "Update an existing charge definition"
        auth_required: true
        source: external_api
        mcp_tool: "update_existing_charge"

      - path: "/fineract-provider/api/v1/clients/{clientId}/charges"
        method: GET
        description: "List charges applied to a client"
        auth_required: true
        source: external_api
        mcp_tool: "list_client_charges"

      # ── Data Tables — CUSTOM API DESIGN ──
      - path: "/fineract-provider/api/v1/datatables"
        method: POST
        description: "CREATE a new data table (= design a custom API endpoint). Attach to m_client/m_group/m_loan/m_savings_account/m_office/m_center. Define columns with types: string, int, decimal, boolean, date, datetime, text, dropdown."
        auth_required: true
        source: external_api
        mcp_tool: "create_datatable"

      - path: "/fineract-provider/api/v1/datatables"
        method: GET
        description: "List all registered data tables (discover custom API surface)"
        auth_required: true
        source: external_api
        mcp_tool: "list_all_datatables"

      - path: "/fineract-provider/api/v1/datatables/{tableName}/{entityId}"
        method: POST
        description: "Create entry in data table for entity (= POST to custom API)"
        auth_required: true
        source: external_api
        mcp_tool: "create_datatable_entry"

      - path: "/fineract-provider/api/v1/datatables/{tableName}/{entityId}"
        method: GET
        description: "Read all entries from data table for entity (= GET from custom API)"
        auth_required: true
        source: external_api
        mcp_tool: "get_datatable_entries"

      - path: "/fineract-provider/api/v1/datatables/{tableName}/{entityId}"
        method: PUT
        description: "Update data table entry for entity (= PUT to custom API)"
        auth_required: true
        source: external_api
        mcp_tool: "update_datatable_entry"

      - path: "/fineract-provider/api/v1/datatables/{tableName}/{entityId}"
        method: DELETE
        description: "Delete data table entries for entity (= DELETE from custom API)"
        auth_required: true
        source: external_api
        mcp_tool: "delete_datatable_entry"

      # ── Reports ──
      - path: "/fineract-provider/api/v1/reports"
        method: POST
        description: "Create custom report definition"
        auth_required: true
        source: external_api
        mcp_tool: "create_report_definition"

      - path: "/fineract-provider/api/v1/reports/{reportId}"
        method: GET
        description: "Get report definition"
        auth_required: true
        source: external_api
        mcp_tool: "get_report_definition"

      - path: "/fineract-provider/api/v1/reports"
        method: GET
        description: "List all report definitions"
        auth_required: true
        source: external_api
        mcp_tool: "list_all_reports"

      - path: "/fineract-provider/api/v1/runreports/{reportName}"
        method: GET
        description: "Run a Fineract report (for field officer dashboards, donor reports)"
        auth_required: true
        source: external_api
        mcp_tool: "run_fineract_report"

      # ── Accounting ──
      - path: "/fineract-provider/api/v1/journalentries"
        method: GET
        description: "List journal entries (financial audit trail)"
        auth_required: true
        source: external_api
        mcp_tool: "list_journal_entries"

      - path: "/fineract-provider/api/v1/journalentries"
        method: POST
        description: "Record manual journal entry"
        auth_required: true
        source: external_api
        mcp_tool: "record_journal_entry"

      # ── Infrastructure ──
      - path: "/fineract-provider/api/v1/offices"
        method: GET
        description: "List all offices (org hierarchy)"
        auth_required: true
        source: external_api
        mcp_tool: "list_all_offices"

      - path: "/fineract-provider/api/v1/staff"
        method: GET
        description: "List all staff (field officers)"
        auth_required: true
        source: external_api
        mcp_tool: "list_all_staff"

      - path: "/fineract-provider/api/v1/codes"
        method: GET
        description: "List system codes (dropdown options, status enums)"
        auth_required: true
        source: external_api
        mcp_tool: "list_system_codes"

      - path: "/fineract-provider/api/v1/codes/{codeId}/codevalues"
        method: GET
        description: "Get code values for a system code"
        auth_required: true
        source: external_api
        mcp_tool: "get_code_values"

      # ── Products ──
      - path: "/fineract-provider/api/v1/loanproducts/{productId}"
        method: GET
        description: "Get loan product details (interest rates, terms, charges)"
        auth_required: true
        source: external_api
        mcp_tool: "get_loan_product_details"

      - path: "/fineract-provider/api/v1/savingsproducts/{productId}"
        method: GET
        description: "Get savings product details (interest, min balance, charges)"
        auth_required: true
        source: external_api
        mcp_tool: "get_savings_product_details"

      # ── Self-Service (End User Auth) ──
      - path: "/fineract-provider/api/v1/self/authentication"
        method: POST
        description: "Self-service client authentication — end user login (separate from staff auth)"
        auth_required: false
        source: external_api

      - path: "/fineract-provider/api/v1/self/clients"
        method: GET
        description: "Self-service: get own client profile data"
        auth_required: true
        source: external_api

      - path: "/fineract-provider/api/v1/self/savingsaccounts"
        method: GET
        description: "Self-service: get own savings accounts"
        auth_required: true
        source: external_api

      - path: "/fineract-provider/api/v1/self/loans"
        method: GET
        description: "Self-service: get own loan accounts"
        auth_required: true
        source: external_api

      # ── Batch API (offline sync) ──
      - path: "/fineract-provider/api/v1/batches"
        method: POST
        description: "Batch API — send multiple operations in single HTTP request. Critical for offline sync: queued operations sent as batch on connectivity."
        auth_required: true
        source: external_api

    # ─────────────────────────────────────────────────────────────
    # CUSTOM DATA TABLES — CommonPurse Domain Extensions
    # ─────────────────────────────────────────────────────────────
    # These tables are DESIGNED via the Data Tables API at app setup.
    # Each table = a custom REST endpoint with full CRUD.
    # Created programmatically via create_datatable MCP tool.
    # ─────────────────────────────────────────────────────────────

    custom_data_tables:
      - table_name: "dt_group_config"
        apptable_name: "m_center"
        feature_ref: "group-management"
        description: "Group cycle rules and policies — the core configuration that drives savings validation, loan eligibility, fine calculation, and cycle lifecycle"
        columns:
          - { name: "cycle_number", type: int, mandatory: true }
          - { name: "cycle_length_months", type: int, mandatory: true }
          - { name: "cycle_start_date", type: date, mandatory: true }
          - { name: "cycle_end_date", type: date, mandatory: true }
          - { name: "meeting_frequency", type: string, length: 20, mandatory: true }
          - { name: "contribution_min", type: decimal, mandatory: true }
          - { name: "contribution_max", type: decimal, mandatory: true }
          - { name: "loan_multiplier", type: decimal, mandatory: true }
          - { name: "interest_rate_per_month", type: decimal, mandatory: true }
          - { name: "max_loan_duration_weeks", type: int, mandatory: false }
          - { name: "fine_late_attendance", type: decimal, mandatory: false }
          - { name: "fine_missed_meeting", type: decimal, mandatory: false }
          - { name: "fine_late_repayment", type: decimal, mandatory: false }
          - { name: "fine_min_savings_not_met", type: decimal, mandatory: false }
          - { name: "social_fund_per_meeting", type: decimal, mandatory: false }
          - { name: "cycle_status", type: string, length: 20, mandatory: true }

      - table_name: "dt_meeting_record"
        apptable_name: "m_center"
        feature_ref: "meeting-lifecycle"
        description: "Per-meeting record — attendance, totals, decisions. One row per meeting per group."
        columns:
          - { name: "meeting_number", type: int, mandatory: true }
          - { name: "meeting_date", type: date, mandatory: true }
          - { name: "status", type: string, length: 20, mandatory: true }
          - { name: "members_present", type: int, mandatory: true }
          - { name: "members_absent", type: int, mandatory: true }
          - { name: "total_savings_collected", type: decimal, mandatory: false }
          - { name: "total_fines_collected", type: decimal, mandatory: false }
          - { name: "loans_approved_count", type: int, mandatory: false }
          - { name: "loans_approved_amount", type: decimal, mandatory: false }
          - { name: "notes", type: text, mandatory: false }

      - table_name: "dt_meeting_attendance"
        apptable_name: "m_client"
        feature_ref: "meeting-lifecycle"
        description: "Per-member per-meeting attendance record — tracks presence, lateness, fines applied"
        columns:
          - { name: "meeting_number", type: int, mandatory: true }
          - { name: "meeting_date", type: date, mandatory: true }
          - { name: "present", type: boolean, mandatory: true }
          - { name: "late", type: boolean, mandatory: false }
          - { name: "fine_applied", type: decimal, mandatory: false }
          - { name: "fine_reason", type: string, length: 50, mandatory: false }

      - table_name: "dt_member_role"
        apptable_name: "m_client"
        feature_ref: "member-onboarding"
        description: "Member role within group — chairperson, treasurer, secretary, member. Drives RBAC in the app."
        columns:
          - { name: "role", type: string, length: 20, mandatory: true }
          - { name: "assigned_date", type: date, mandatory: true }
          - { name: "assigned_by", type: string, length: 100, mandatory: false }

      - table_name: "dt_share_out"
        apptable_name: "m_center"
        feature_ref: "share-out"
        description: "End-of-cycle share-out record — per-group per-cycle, captures the distribution calculation and execution"
        columns:
          - { name: "cycle_number", type: int, mandatory: true }
          - { name: "share_out_date", type: date, mandatory: true }
          - { name: "total_pool", type: decimal, mandatory: true }
          - { name: "total_interest_earned", type: decimal, mandatory: true }
          - { name: "total_fines_collected", type: decimal, mandatory: true }
          - { name: "members_count", type: int, mandatory: true }
          - { name: "distribution_json", type: text, mandatory: true }
          - { name: "status", type: string, length: 20, mandatory: true }

      - table_name: "dt_social_fund"
        apptable_name: "m_center"
        feature_ref: "social-fund"
        description: "Social/emergency fund tracker per group — separate from savings pool, with its own balance and disbursement history"
        columns:
          - { name: "fund_balance", type: decimal, mandatory: true }
          - { name: "contribution_per_meeting", type: decimal, mandatory: true }
          - { name: "last_collection_date", type: date, mandatory: false }
          - { name: "total_disbursed", type: decimal, mandatory: false }
          - { name: "pending_requests", type: int, mandatory: false }

      - table_name: "dt_loan_vote"
        apptable_name: "m_loan"
        feature_ref: "loan-management"
        description: "Loan approval voting record — tracks who voted, approval/rejection, meeting context"
        columns:
          - { name: "meeting_number", type: int, mandatory: true }
          - { name: "votes_for", type: int, mandatory: true }
          - { name: "votes_against", type: int, mandatory: true }
          - { name: "approved", type: boolean, mandatory: true }
          - { name: "approved_by_chairperson", type: boolean, mandatory: true }
          - { name: "notes", type: text, mandatory: false }

      - table_name: "dt_sync_metadata"
        apptable_name: "m_center"
        feature_ref: "offline-sync"
        description: "Sync state tracker per group — last sync timestamp, pending count, conflict status. Read by field officer dashboard."
        columns:
          - { name: "last_sync_at", type: datetime, mandatory: false }
          - { name: "pending_operations", type: int, mandatory: false }
          - { name: "last_sync_status", type: string, length: 20, mandatory: false }
          - { name: "conflict_count", type: int, mandatory: false }
          - { name: "device_id", type: string, length: 50, mandatory: false }

      - table_name: "dt_loan_request"
        apptable_name: "m_client"
        feature_ref: "end-user-dashboard"
        description: "End-user loan requests submitted from personal dashboard. Admin reviews during meeting. Bridges self-service → admin workflow."
        columns:
          - { name: "requested_amount", type: decimal, mandatory: true }
          - { name: "purpose", type: text, mandatory: true }
          - { name: "desired_duration_weeks", type: int, mandatory: true }
          - { name: "eligibility_amount", type: decimal, mandatory: false }
          - { name: "request_date", type: date, mandatory: true }
          - { name: "status", type: string, length: 20, mandatory: true }
          - { name: "reviewed_at_meeting", type: int, mandatory: false }
          - { name: "admin_notes", type: text, mandatory: false }

      # ── DATA TABLE FROM COMMUNITY RESEARCH (CR-003) — professionally curated ──

      - table_name: "dt_group_corpus"
        apptable_name: "m_center"
        feature_ref: "corpus-tracking"
        source_ref: "CR-003"
        description: "Running fund/corpus balance for the group. Updated on every inflow/outflow. Used to block excess cash outflows."
        columns:
          - { name: "current_balance", type: decimal, mandatory: true }
          - { name: "total_inflows", type: decimal, mandatory: true }
          - { name: "total_outflows", type: decimal, mandatory: true }
          - { name: "last_updated_at", type: datetime, mandatory: true }
          - { name: "last_meeting_opening_balance", type: decimal, mandatory: false }
          - { name: "last_meeting_closing_balance", type: decimal, mandatory: false }

    # ─────────────────────────────────────────────────────────────
    # API GAP ANALYSIS (post-ingest)
    # ─────────────────────────────────────────────────────────────
    # With Data Tables as custom API design, coverage jumps to 100%.
    # Every feature gap is resolvable via:
    #   - Native Fineract endpoints (centers, clients, savings, loans)
    #   - Custom Data Tables (meeting records, roles, share-out, votes)
    #   - Fineract Charges API (fines as savings/loan charges)
    #   - Client-only logic (share-out calc, language, offline queue)
    # ─────────────────────────────────────────────────────────────

    api_gap_analysis:
      total_features: 15
      api_covered: 15
      gaps: []
      coverage_percent: 100.0
      resolution_summary:
        - feature: "group-management"
          strategy: "native + data_table"
          detail: "Center API for group CRUD + dt_group_config for cycle rules/policies"
        - feature: "member-onboarding"
          strategy: "native + data_table"
          detail: "Client API for member CRUD + dt_member_role for role assignment"
        - feature: "meeting-lifecycle"
          strategy: "data_table"
          detail: "dt_meeting_record on center + dt_meeting_attendance on client — full meeting state via custom API"
        - feature: "savings-collection"
          strategy: "native"
          detail: "Savings Account API — create, deposit, withdraw, get transactions"
        - feature: "loan-management"
          strategy: "native + data_table"
          detail: "Loan API for full lifecycle + dt_loan_vote for approval voting records"
        - feature: "share-out"
          strategy: "native + data_table + client"
          detail: "Savings withdrawal API for distribution + dt_share_out for cycle record. Profit calculation is client-side from savings/loan data."
        - feature: "offline-sync"
          strategy: "native + data_table"
          detail: "Batch API for bulk operations + dt_sync_metadata for sync state tracking"
        - feature: "authentication"
          strategy: "native"
          detail: "Authentication API + client-side PIN/biometric"
        - feature: "field-officer-view"
          strategy: "native + reports"
          detail: "Center list + Reports API for aggregated dashboards"
        - feature: "fines-tracking"
          strategy: "native + data_table"
          detail: "Charges API for fine definitions + apply_savings_fee for charging fines + dt_meeting_attendance.fine_applied for tracking"
        - feature: "multi-language"
          strategy: "client_only"
          detail: "Compose multiplatform string resources — no API needed"
        - feature: "social-fund"
          strategy: "data_table"
          detail: "dt_social_fund on center for fund balance/disbursement tracking"
        - feature: "end-user-dashboard"
          strategy: "native + data_table"
          detail: "Fineract Self-Service API (/self/clients, /self/savingsaccounts, /self/loans) for own data + dt_loan_request for loan submission"
        - feature: "group-linked-savings"
          strategy: "native"
          detail: "Two Fineract Savings Products: group-linked (mandatory, min/max enforced via dt_group_config) and individual (voluntary). Distinguished by product type. No extra data tables needed."
        - feature: "corpus-tracking"
          strategy: "data_table + client"
          detail: "dt_group_corpus on center for running balance. Client-side computation from savings + loan transactions. Updated on every meeting inflow/outflow."

    mcp_tools:
      total: 65
      mapped_to_features: 45
      categories:
        - name: "Authentication"
          tools: 1
        - name: "Centers (Groups)"
          tools: ["create_new_center", "get_center", "list_all_centers"]
        - name: "Groups (Lending)"
          tools: ["create_lending_group", "get_group", "list_all_groups", "activate_pending_group", "add_member_to_group"]
        - name: "Clients (Members)"
          tools: ["create_new_client", "get_client", "activate_pending_client", "get_client_accts", "add_identifier", "get_identifiers", "search_clients", "update_mobile", "close_client_profile", "apply_client_fee", "list_client_charges", "list_client_txns"]
        - name: "Savings"
          tools: ["create_savings", "get_savings", "approve_activate_savings", "deposit", "withdraw", "get_savings_txns", "apply_savings_fee", "close_savings", "calc_post_interest", "get_savings_product_details"]
        - name: "Loans"
          tools: ["create_new_loan", "create_group_loan_app", "get_loan", "approve_disburse_loan", "make_repayment", "reject_loan", "undo_approval", "undo_disbursal", "waive_loan_interest", "apply_loan_fee", "get_repayment_sched", "get_loan_app_template", "get_loan_hist", "get_loan_product_details", "get_overdue_loans_for_client", "reschedule_loan_app"]
        - name: "Charges"
          tools: ["create_new_charge", "get_charge", "list_all_charges", "update_existing_charge"]
        - name: "Data Tables"
          tools: ["create_datatable", "create_datatable_entry", "get_datatable_entries", "update_datatable_entry", "delete_datatable_entry", "list_all_datatables"]
        - name: "Reports"
          tools: ["create_report_definition", "get_report_definition", "list_all_reports", "run_fineract_report", "update_report_definition"]
        - name: "Infrastructure"
          tools: ["list_all_offices", "get_office", "list_all_staff", "get_staff", "list_system_codes", "get_code_values", "list_documents", "list_journal_entries", "record_journal_entry", "list_accounts"]

