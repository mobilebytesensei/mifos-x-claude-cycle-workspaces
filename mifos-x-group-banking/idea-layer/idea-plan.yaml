# ═══════════════════════════════════════════════════════════════════
# PHASE 13 — §technical_decisions
# ═══════════════════════════════════════════════════════════════════
technical_decisions:
  _tag: "§technical_decisions"
  _status: approved
  _quality_score: 91
  _last_updated: "2026-05-03T01:00:00Z"
  _enrichment_count: 1
  _source: "wizard"
  content:
    architecture: "Clean Architecture + MVI/UDF"
    di_framework: "Koin"
    state_management: "compose-state"
    navigation: "voyager"
    backend_provider: "mifos-fineract"
    platform_targets:
      - "android"
      - "ios"
      - "desktop"
    api_extension_pattern: "Fineract Data Tables — design custom REST endpoints via create_datatable API, attached to core entities (m_center, m_client, m_loan). Full CRUD. No backend code needed."
    offline_strategy: "SQLDelight local cache mirrors all Fineract entities + data tables. SyncQueue table queues pending operations. Batch API for bulk sync on connectivity. Conflict resolution: last-write-wins with manual override."
    sync_architecture: "Two-tier rule: (1) Native Fineract entities sync via standard REST endpoints, (2) Custom domain data syncs via Data Tables CRUD. Both use Batch API wrapper for efficiency."
    mcp_integration: "Mifos MCP Server (65 tools) provides programmatic access to all Fineract operations including data table schema design, enabling CI/CD automation and testing."
    dual_client_architecture: "Two client types with separate auth and navigation graphs. Admin (staff auth → /api/v1/authentication) gets full group management UI. End User (self-service auth → /api/v1/self/authentication) gets personal read-only dashboard with loan request capability. Client type stored locally, determines which Composable navigation graph loads."
    rbac_strategy: "Two-tier RBAC: (1) Client type = admin vs end_user (determines navigation graph), (2) Admin role = treasurer/chairperson/field_officer/program_manager (determines write permissions within admin UI). Role stored in dt_member_role data table. Enforced at ViewModel level — UI actions hidden/disabled based on permissions."
    dual_savings_model: "Two savings types per member: (1) Group-Linked — mandatory, min/max enforced per meeting, tied to group cycle. (2) Individual — voluntary, flexible deposits/withdrawals. Both tracked as separate Fineract Savings Accounts with different product IDs."
    corpus_tracking: "Real-time fund balance per group. Corpus = sum(inflows) - sum(outflows). Stored in dt_group_corpus on m_center. Mobile app maintains local running balance during meetings. Cash outflows blocked when corpus would go negative."

