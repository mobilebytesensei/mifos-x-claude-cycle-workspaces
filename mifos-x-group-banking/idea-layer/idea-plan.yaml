# ═══════════════════════════════════════════════════════════════════
# PHASE 5 — §vision
# ═══════════════════════════════════════════════════════════════════
vision:
  _tag: "§vision"
  _status: approved
  _quality_score: 92
  _last_updated: "2026-05-02T05:15:00Z"
  _enrichment_count: 1
  _source: "wizard"
  content:
    elevator_pitch: "CommonPurse digitizes the full lifecycle of self-funded community banking groups — meetings, savings, lending, and share-out — with offline-first KMP and Mifos Fineract backend."
    problem_statement: "Millions of people in emerging markets organize into community savings groups (VSLA, ROSCA, ASCA, SHG) to pool savings, issue loans, and distribute profits. These groups operate with paper ledgers, leading to record-keeping errors, fraud, limited transparency, and inability to scale. Existing digital solutions are either online-only, lack Fineract integration, or don't support the full group lifecycle."
    success_metrics:
      - "50+ active groups onboarded within 6 months of launch"
      - "90% reduction in meeting duration vs paper-based workflow"
      - "Zero record-keeping disputes in digitized groups"
      - "95% sync success rate on 2G/3G connections"
      - "< 5 minute onboarding time for new group treasurer"
      - "100% data parity between local cache and Fineract backend after sync"
    target_users:
      - "[ADMIN] Group treasurers/secretaries managing VSLA/ROSCA/ASCA/SHG ledgers — full write access to group operations"
      - "[ADMIN] Group chairpersons overseeing meetings and approvals — approval authority + meeting management"
      - "[ADMIN] Field officers from MFIs supervising community groups — read-only cross-group admin view"
      - "[ADMIN] NGO program managers monitoring group performance — analytics and reporting admin"
      - "[END USER] Regular group members contributing savings and requesting loans — see own data + group info based on role"
    solution_statement: "CommonPurse provides a Kotlin Multiplatform mobile app that digitizes every step of the community banking lifecycle — from group creation and member onboarding, through meeting-driven savings collection and loan disbursement, to periodic share-out — all working offline-first with automatic sync to Mifos Fineract when connectivity is available."
    value_propositions:
      - "Offline-first: full functionality without internet — sync when connected"
      - "Meeting-centric workflow: mirrors how real groups operate (attendance → savings → loans → decisions)"
      - "Fineract-backed: enterprise-grade financial record-keeping via proven open-source core banking"
      - "Low-literacy UX: icon-heavy, minimal text, voice prompts, large touch targets"
      - "Transparent: every member can see group balances, loan status, and share-out projections in real-time"
    scope:
      in_scope:
        - "Group creation, member onboarding, role assignment"
        - "Meeting lifecycle (schedule, attendance, agenda)"
        - "Savings collection (regular contributions, fines, social fund)"
        - "Loan application, approval, disbursement, repayment"
        - "Share-out calculation and distribution"
        - "Offline-first with SQLDelight local cache"
        - "Sync engine for Mifos Fineract (batch API)"
        - "Multi-language support (Swahili, French, Hindi, English)"
        - "Field officer supervision dashboard"
      out_of_scope:
        - "Mobile money integration (Phase 2)"
        - "Inter-group lending (Phase 3)"
        - "Credit scoring / ML risk assessment (Phase 3)"
        - "Web admin dashboard (Phase 2)"
        - "SMS notifications (Phase 2)"
    constraints:
      technical:
        - "Offline-first: app must be fully functional without internet"
        - "Sync latency < 30 seconds on 2G connection"
        - "APK size < 15MB for low-end devices"
        - "Support Android API 24+ (Android 7.0)"
        - "Fineract API compatibility: 1.8.x+"
      business:
        - "Open source (MPL-2.0)"
        - "Must work on low-end Android devices ($50-100 smartphones)"
        - "Must support groups of 5-50 members"
        - "Must comply with local financial record-keeping regulations"
      assumptions:
        - "Users have access to Android smartphones"
        - "At least one group member has occasional internet connectivity"
        - "Groups follow a meeting-based operational model"
        - "Mifos Fineract instance is deployed and accessible"
    known_limitations:
      - description: "iOS support deferred to Phase 2 (Android-first)"
        planned_version: "2.0.0"
      - description: "No real-time notifications in offline mode"
        planned_version: "1.1.0"
      - description: "Single-currency per group"
        planned_version: "1.2.0"
      - description: "No photo-based receipt generation"
        planned_version: "1.1.0"
      - description: "No inter-group fund transfer"
        planned_version: "2.0.0"

# ═══════════════════════════════════════════════════════════════════
# PHASE 6 — §personas
# ═══════════════════════════════════════════════════════════════════
personas:
  _tag: "§personas"
  _status: approved
  _quality_score: 92
  _last_updated: "2026-05-03T01:00:00Z"
  _enrichment_count: 1
  _source: "wizard"
  content:
    personas:
      # ── ADMIN CLIENT PERSONAS ──
      # Admins have write access to group operations, can manage meetings,
      # record transactions, approve loans. Login via Fineract staff credentials.

      - name: "Amina"
        role: "Group Treasurer / Secretary"
        client_type: admin
        fineract_role: "staff"
        permissions:
          - "record_savings"
          - "record_loan_repayment"
          - "conduct_meeting"
          - "manage_attendance"
          - "calculate_share_out"
          - "view_all_members"
          - "generate_reports"
        jobs_to_be_done:
          - "Record savings contributions at each meeting"
          - "Track loan disbursements and repayments"
          - "Calculate share-out amounts at end of cycle"
          - "Generate reports for group review"
          - "Mark attendance and apply fines"
        pain_points:
          - "Paper ledger errors cause disputes"
          - "Manual share-out calculations take hours and are error-prone"
          - "No way to verify records between meetings"
        goals:
          - "Accurate, transparent record-keeping"
          - "Faster meeting proceedings (< 1 hour)"
          - "Build trust through verifiable records"

      - name: "Joseph"
        role: "Group Chairperson"
        client_type: admin
        fineract_role: "staff"
        permissions:
          - "approve_loan"
          - "reject_loan"
          - "schedule_meeting"
          - "conduct_meeting"
          - "initiate_share_out"
          - "manage_group_settings"
          - "view_all_members"
          - "generate_reports"
        jobs_to_be_done:
          - "Schedule and conduct group meetings"
          - "Approve or reject loan requests"
          - "Resolve disputes using transaction history"
          - "Report group performance to NGO supervisor"
          - "Initiate share-out at end of cycle"
        pain_points:
          - "Disputes over who paid what"
          - "No visibility into group health between meetings"
          - "Manual reporting to field officers"
        goals:
          - "Smooth, conflict-free meetings"
          - "Real-time group health dashboard"
          - "One-tap reporting"

      - name: "David"
        role: "MFI Field Officer"
        client_type: admin
        fineract_role: "staff"
        permissions:
          - "view_all_groups"
          - "view_all_members"
          - "view_all_transactions"
          - "run_reports"
          - "force_sync"
        restrictions:
          - "read_only — cannot modify group data or record transactions"
          - "cross_group — can see multiple groups assigned to them"
        jobs_to_be_done:
          - "Monitor multiple groups remotely"
          - "Verify group records during field visits"
          - "Upload group data to central Fineract system"
          - "Identify at-risk groups early"
        pain_points:
          - "Must physically visit each group to collect data"
          - "Inconsistent record quality across groups"
          - "Manual data entry into Fineract"
        goals:
          - "Remote monitoring dashboard"
          - "Auto-sync to Fineract"
          - "Early warning indicators"

      - name: "Sarah"
        role: "NGO Program Manager"
        client_type: admin
        fineract_role: "staff"
        permissions:
          - "view_all_groups"
          - "run_reports"
          - "export_data"
          - "view_program_analytics"
        restrictions:
          - "read_only — analytics and reporting only"
        jobs_to_be_done:
          - "Track performance across all groups in program"
          - "Generate donor reports"
          - "Identify best practices and struggling groups"
        pain_points:
          - "Aggregating data from paper records is slow"
          - "Inconsistent metrics across groups"
          - "Limited real-time visibility"
        goals:
          - "Automated program-wide analytics"
          - "Standardized metrics"
          - "Real-time dashboard"

      # ── END USER CLIENT PERSONA ──
      # End users see ONLY their own data + group-level summary info.
      # Login via Fineract self-service / client credentials.
      # Cannot record transactions or manage group operations.

      - name: "Grace"
        role: "Regular Group Member"
        client_type: end_user
        fineract_role: "self_service_client"
        permissions:
          - "view_own_savings"
          - "view_own_loans"
          - "view_own_attendance"
          - "view_group_summary"
          - "view_meeting_schedule"
          - "view_share_out_projection"
          - "request_loan"
          - "view_own_fine_history"
        restrictions:
          - "cannot_record_transactions — only admins (treasurer) can"
          - "cannot_approve_loans — only admins (chairperson) can"
          - "cannot_view_other_members_details — only own data + group totals"
          - "cannot_manage_group — no settings, no meetings, no share-out"
        jobs_to_be_done:
          - "View personal savings balance and contribution history"
          - "View own loan status and repayment schedule"
          - "See projected share-out amount"
          - "Request a new loan (submitted for admin approval)"
          - "View upcoming meeting schedule"
          - "See group summary (total pool, member count — not individual data)"
        pain_points:
          - "Cannot verify own balance between meetings"
          - "Unclear loan terms and remaining balance"
          - "Fear of record manipulation"
          - "No way to request a loan outside of meeting"
        goals:
          - "See own financial position anytime on phone"
          - "Simple, low-literacy interface with icons"
          - "Trust through transparency — verify every transaction"
          - "Submit loan requests before next meeting"

# ═══════════════════════════════════════════════════════════════════
# PHASE 7 — §requirements
# ═══════════════════════════════════════════════════════════════════
requirements:
  _tag: "§requirements"
  _status: enriched
  _quality_score: 95
  _last_updated: "2026-05-03T00:00:00Z"
  _enrichment_count: 1
  _source: "wizard"
  content:
    functional_requirements:
      - id: "FR-001"
        description: "Create and configure a new savings group with name, cycle length, meeting schedule, contribution rules, and loan policies"
        priority: must
        acceptance_criteria:
          - "Group created with all required fields"
          - "Configuration saved locally and synced to Fineract Center entity"
          - "Group visible in member list after creation"

      - id: "FR-002"
        description: "Onboard members with name, photo, phone, and role assignment (chairperson, treasurer, secretary, member)"
        priority: must
        acceptance_criteria:
          - "Member created with photo capture"
          - "Role assigned and reflected in UI"
          - "Synced to Fineract Client entity"

      - id: "FR-003"
        description: "Conduct meetings with attendance tracking, savings collection, loan review, and decision recording"
        priority: must
        acceptance_criteria:
          - "Meeting starts with attendance roll call"
          - "Each member's contribution recorded"
          - "Loan requests reviewed and voted on"
          - "Meeting summary generated and saved"

      - id: "FR-004"
        description: "Collect regular savings contributions with amount validation against group rules"
        priority: must
        acceptance_criteria:
          - "Contribution amount validated against min/max rules"
          - "Receipt generated for contributor"
          - "Running balance updated in real-time"
          - "Synced to Fineract Savings Account"

      - id: "FR-005"
        description: "Process loan applications with eligibility check based on savings multiplier rule"
        priority: must
        acceptance_criteria:
          - "Eligibility auto-calculated (savings * multiplier)"
          - "Loan terms (amount, interest, duration) displayed"
          - "Requires approval by chairperson + majority vote"
          - "Synced to Fineract Loan Product"

      - id: "FR-006"
        description: "Track loan repayments with schedule, overdue detection, and fine calculation"
        priority: must
        acceptance_criteria:
          - "Repayment schedule generated at disbursement"
          - "Overdue loans flagged with fine calculation"
          - "Partial payments supported"

      - id: "FR-007"
        description: "Calculate and execute share-out at end of cycle based on savings ratio + profit distribution"
        priority: must
        acceptance_criteria:
          - "Share-out formula: (member_savings / total_savings) * total_pool"
          - "Preview shown to all members before execution"
          - "Execution creates transactions and closes cycle"

      - id: "FR-008"
        description: "Work fully offline with local SQLDelight database and queue-based sync to Fineract"
        priority: must
        acceptance_criteria:
          - "All CRUD operations work without internet"
          - "Sync queue persists across app restarts"
          - "Conflict resolution for concurrent edits"
          - "Sync status indicator visible in UI"

      - id: "FR-009"
        description: "Field officer can view and supervise multiple groups with read-only access"
        priority: should
        acceptance_criteria:
          - "Field officer sees list of assigned groups"
          - "Can drill into group details, meetings, balances"
          - "Cannot modify group data"

      - id: "FR-010"
        description: "Support multiple languages (English, Swahili, French, Hindi) with runtime switching"
        priority: should
        acceptance_criteria:
          - "All UI strings externalized"
          - "Language picker in settings"
          - "RTL layout support for future Arabic"

      - id: "FR-011"
        description: "Social fund collection and emergency disbursement tracking"
        priority: could
        acceptance_criteria:
          - "Separate social fund balance tracked"
          - "Emergency requests recorded with reason"
          - "Disbursement requires approval"

      - id: "FR-012"
        description: "Fine collection for late attendance, missed meetings, or late loan repayment"
        priority: should
        acceptance_criteria:
          - "Auto-calculated based on group rules"
          - "Fine added to group pool"
          - "Fine history visible to member"

      - id: "FR-013"
        description: "Authenticate users via Fineract credentials with local PIN and optional biometric for offline access"
        priority: must
        acceptance_criteria:
          - "Login via Fineract API authentication endpoint"
          - "Token cached locally for offline re-auth via PIN"
          - "Biometric unlock on supported devices"
          - "Session expires after configurable period"

      - id: "FR-014"
        description: "Two client types: Admin (staff — manage groups, conduct meetings, record transactions) and End User (self-service — view own data, request loans)"
        priority: must
        acceptance_criteria:
          - "Admin login via Fineract staff authentication → full group management UI"
          - "End User login via Fineract self-service client auth → personal dashboard only"
          - "UI adapts entirely based on client_type: different nav, different screens, different actions"
          - "Admin sees: group dashboard, meeting conductor, transaction recorder, member manager"
          - "End User sees: personal dashboard, own savings/loans, group summary (totals only), loan request form"
          - "End User CANNOT: record transactions, approve loans, conduct meetings, manage members, change settings"
          - "End User CAN: view own balance, view own loan schedule, view share-out projection, request new loan"

      - id: "FR-015"
        description: "Admin role-based permissions within admin client: treasurer (record transactions), chairperson (approve loans + manage meetings), field officer (read-only cross-group)"
        priority: must
        acceptance_criteria:
          - "Treasurer: record savings, repayments, fines, attendance. Cannot approve loans."
          - "Chairperson: all treasurer permissions + approve/reject loans + initiate share-out"
          - "Field officer: read-only view of all assigned groups, cannot modify data"
          - "Program manager: read-only analytics + report generation"
          - "Role stored in dt_member_role data table on m_client"

      - id: "FR-016"
        description: "End user can submit loan request from their personal dashboard, which appears as pending in next admin meeting"
        priority: should
        acceptance_criteria:
          - "End user sees 'Request Loan' button on personal dashboard"
          - "Loan request form with amount, purpose, desired duration"
          - "Eligibility auto-calculated and shown (savings * multiplier)"
          - "Submitted request visible to admins in next meeting agenda"
          - "End user sees request status: pending → approved/rejected"

      # ── VALIDATED GAPS FROM COMMUNITY RESEARCH (CR-003) ──
      # Selectively adopted — only what's genuinely needed for a professional VSLA app.
      # Rejected: org-level dashboard (web concern), DEO persona (treasurer = data entry),
      # share-weighted time-proportional math (over-complex), cooperative earnings split (deployment-specific),
      # advanced meeting patterns (over-engineering for v1).

      - id: "FR-017"
        description: "Dual savings: mandatory group savings (collected at meetings, min/max enforced) and voluntary individual savings (flexible deposits/withdrawals anytime)"
        priority: must
        source_ref: "CR-003"
        acceptance_criteria:
          - "Two savings account types per member: group (mandatory) and individual (voluntary)"
          - "Group savings: min/max per meeting enforced per group rules"
          - "Individual savings: no meeting-tied constraints"
          - "Both tracked separately in dashboards — group savings balance vs individual balance"
          - "Group savings contribute to share-out pool; individual savings are fully owned by member"

      - id: "FR-018"
        description: "Real-time fund balance (corpus) for the group — inflows minus outflows, visible during meetings, blocks loan disbursement when insufficient"
        priority: must
        source_ref: "CR-003"
        acceptance_criteria:
          - "Fund balance = deposits + repayments + penalties - withdrawals - disbursals"
          - "Displayed on group dashboard"
          - "Opening balance shown at meeting start, running total during, closing at end"
          - "Loan disbursement blocked if fund balance would go negative"

      - id: "FR-019"
        description: "Enhanced meeting flow: review previous meeting, separate cash inflows from outflows, fund balance visible throughout, close with opening/closing reconciliation"
        priority: must
        source_ref: "CR-003"
        acceptance_criteria:
          - "Step 0: Review previous meeting (summary, balances, action items)"
          - "Step 1: Attendance (present/absent/late with auto-penalty)"
          - "Step 2: Cash inflows (group savings, individual savings, loan repayments, penalties)"
          - "Step 3: Cash outflows (savings withdrawals, loan disbursements) — blocked if exceeds fund"
          - "Step 4: New loan applications + voting"
          - "Step 5: Notes & action items"
          - "Step 6: Close meeting (opening balance + inflows - outflows = closing balance)"
          - "Fund balance visible on every step"

      - id: "FR-020"
        description: "Penalty for member not meeting minimum group savings contribution at a meeting"
        priority: should
        source_ref: "CR-003"
        acceptance_criteria:
          - "Auto-detected when member deposits below group minimum"
          - "Penalty amount defined in group config"
          - "Collected in current or next meeting"
          - "Visible in member fine history"

    data_entities:
      - name: "Group"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "name", type: "String" }
          - { name: "cycle_number", type: "Int" }
          - { name: "cycle_length_months", type: "Int" }
          - { name: "meeting_frequency", type: "Enum(weekly, biweekly, monthly)" }
          - { name: "contribution_min", type: "Decimal" }
          - { name: "contribution_max", type: "Decimal" }
          - { name: "loan_multiplier", type: "Decimal" }
          - { name: "interest_rate", type: "Decimal" }
          - { name: "currency", type: "String" }
          - { name: "fineract_center_id", type: "Long?" }
          - { name: "status", type: "Enum(active, closed, suspended)" }
        relationships:
          - "has_many Members"
          - "has_many Meetings"
          - "has_one SavingsPool"

      - name: "Member"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "name", type: "String" }
          - { name: "phone", type: "String?" }
          - { name: "photo_uri", type: "String?" }
          - { name: "role", type: "Enum(chairperson, treasurer, secretary, member)" }
          - { name: "joined_date", type: "LocalDate" }
          - { name: "fineract_client_id", type: "Long?" }
          - { name: "status", type: "Enum(active, inactive, suspended)" }
        relationships:
          - "belongs_to Group"
          - "has_many SavingsTransactions"
          - "has_many Loans"

      - name: "Meeting"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "meeting_number", type: "Int" }
          - { name: "scheduled_date", type: "LocalDate" }
          - { name: "actual_date", type: "LocalDate?" }
          - { name: "status", type: "Enum(scheduled, in_progress, completed, cancelled)" }
          - { name: "attendance_count", type: "Int" }
          - { name: "total_collected", type: "Decimal" }
          - { name: "notes", type: "String?" }
        relationships:
          - "belongs_to Group"
          - "has_many AttendanceRecords"
          - "has_many SavingsTransactions"

      - name: "SavingsTransaction"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "member_id", type: "UUID" }
          - { name: "meeting_id", type: "UUID" }
          - { name: "amount", type: "Decimal" }
          - { name: "type", type: "Enum(contribution, withdrawal, fine, social_fund)" }
          - { name: "fineract_transaction_id", type: "Long?" }
          - { name: "sync_status", type: "Enum(pending, synced, failed)" }
        relationships:
          - "belongs_to Member"
          - "belongs_to Meeting"

      - name: "Loan"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "member_id", type: "UUID" }
          - { name: "amount", type: "Decimal" }
          - { name: "interest_rate", type: "Decimal" }
          - { name: "duration_weeks", type: "Int" }
          - { name: "status", type: "Enum(requested, approved, disbursed, repaying, closed, defaulted)" }
          - { name: "approved_by", type: "UUID?" }
          - { name: "disbursed_date", type: "LocalDate?" }
          - { name: "fineract_loan_id", type: "Long?" }
          - { name: "sync_status", type: "Enum(pending, synced, failed)" }
        relationships:
          - "belongs_to Member"
          - "has_many LoanRepayments"

      - name: "LoanRepayment"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "loan_id", type: "UUID" }
          - { name: "amount", type: "Decimal" }
          - { name: "meeting_id", type: "UUID?" }
          - { name: "paid_date", type: "LocalDate" }
          - { name: "fineract_transaction_id", type: "Long?" }
          - { name: "sync_status", type: "Enum(pending, synced, failed)" }
        relationships:
          - "belongs_to Loan"

      - name: "AttendanceRecord"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "meeting_id", type: "UUID" }
          - { name: "member_id", type: "UUID" }
          - { name: "present", type: "Boolean" }
          - { name: "late", type: "Boolean" }
          - { name: "fine_amount", type: "Decimal?" }
        relationships:
          - "belongs_to Meeting"
          - "belongs_to Member"

      - name: "SyncQueue"
        fields:
          - { name: "id", type: "UUID" }
          - { name: "entity_type", type: "String" }
          - { name: "entity_id", type: "UUID" }
          - { name: "operation", type: "Enum(create, update, delete)" }
          - { name: "payload_json", type: "String" }
          - { name: "created_at", type: "Instant" }
          - { name: "retry_count", type: "Int" }
          - { name: "last_error", type: "String?" }
          - { name: "status", type: "Enum(pending, in_progress, synced, failed)" }
        relationships:
          - "polymorphic to any entity"

    third_party_services:
      - name: "Mifos Fineract"
        purpose: "Core banking backend — groups (Centers), members (Clients), savings accounts, loan products, transactions"
        integration_type: api
      - name: "SQLDelight"
        purpose: "Local offline database for all entities"
        integration_type: sdk

# ═══════════════════════════════════════════════════════════════════
# PHASE 8 — §features
# ═══════════════════════════════════════════════════════════════════
features:
  _tag: "§features"
  _status: approved
  _quality_score: 93
  _last_updated: "2026-05-03T01:00:00Z"
  _enrichment_count: 1
  _source: "wizard"
  content:
    features:
      - name: "group-management"
        priority: must
        description: "Create, configure, and manage savings groups with cycle parameters and rules"
        requirement_refs: ["FR-001"]
        version: "1.0.0"
        screen_refs: ["group-list", "group-dashboard", "group-create"]
        flow_ref: "group-creation-flow"
        api_refs: ["/fineract-provider/api/v1/centers", "/fineract-provider/api/v1/centers/{centerId}", "/fineract-provider/api/v1/datatables/dt_group_config/{entityId}", "/fineract-provider/api/v1/datatables"]
        acceptance_criteria:
          - "Group creation wizard with all configuration fields"
          - "Edit group settings after creation"
          - "View group dashboard with balance, members, next meeting, sync status"
          - "Group configuration synced to Fineract Center + dt_group_config"

      - name: "member-onboarding"
        priority: must
        description: "Add members with photo, assign roles, manage member lifecycle"
        requirement_refs: ["FR-002"]
        version: "1.0.0"
        screen_refs: ["member-list", "member-profile", "member-add"]
        api_refs: ["/fineract-provider/api/v1/clients", "/fineract-provider/api/v1/clients/{clientId}", "/fineract-provider/api/v1/datatables/dt_member_role/{entityId}"]
        acceptance_criteria:
          - "Add member with camera photo capture"
          - "Assign/change roles (chairperson, treasurer, secretary, member)"
          - "View member profile with savings balance, loans, contribution history"
          - "Member synced to Fineract Client entity"

      - name: "meeting-lifecycle"
        priority: must
        description: "Schedule, conduct, and record meetings with attendance and agenda workflow"
        requirement_refs: ["FR-003"]
        version: "1.0.0"
        screen_refs: ["meeting-calendar", "meeting-conduct", "meeting-summary"]
        flow_ref: "meeting-flow"
        api_refs: ["/fineract-provider/api/v1/datatables/dt_meeting_record/{entityId}", "/fineract-provider/api/v1/datatables/dt_meeting_attendance/{entityId}"]
        acceptance_criteria:
          - "Meeting calendar with scheduling and status indicators"
          - "Step-by-step meeting flow: attendance → savings → loans → notes"
          - "Meeting summary with attendance count, total collected, decisions"
          - "Attendance synced to dt_meeting_attendance data table"

      - name: "savings-collection"
        priority: must
        description: "Record member savings contributions with validation and receipt generation"
        requirement_refs: ["FR-004"]
        version: "1.0.0"
        screen_refs: ["savings-dashboard", "meeting-conduct"]
        flow_ref: "meeting-flow"
        api_refs: ["/fineract-provider/api/v1/savingsaccounts", "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions"]
        acceptance_criteria:
          - "Contribution entry with min/max validation per group rules"
          - "Running balance display per member and group total"
          - "Transaction history per member with date, amount, meeting ref"
          - "Contributions synced to Fineract Savings Account transactions"

      - name: "loan-management"
        priority: must
        description: "Full loan lifecycle: application, eligibility check, approval, disbursement, repayment tracking"
        requirement_refs: ["FR-005", "FR-006"]
        version: "1.0.0"
        screen_refs: ["loan-list", "loan-apply", "loan-detail", "meeting-conduct"]
        flow_ref: "loan-lifecycle-flow"
        api_refs: ["/fineract-provider/api/v1/loans", "/fineract-provider/api/v1/loans/{loanId}", "/fineract-provider/api/v1/loans/{loanId}/transactions"]
        acceptance_criteria:
          - "Loan application with auto-eligibility (savings * multiplier)"
          - "Approval workflow: chairperson + majority vote in meeting"
          - "Repayment schedule auto-generated at disbursement"
          - "Overdue detection with configurable fine calculation"
          - "Loan synced to Fineract Loan Product"

      - name: "share-out"
        priority: must
        description: "End-of-cycle share-out calculation, preview, and execution"
        requirement_refs: ["FR-007"]
        version: "1.0.0"
        screen_refs: ["share-out-preview", "share-out-execute"]
        flow_ref: "share-out-flow"
        api_refs: ["/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions?command=withdrawal", "/fineract-provider/api/v1/datatables/dt_share_out/{entityId}"]
        acceptance_criteria:
          - "Share-out formula: (member_savings / total_savings) * total_pool"
          - "Preview shows per-member breakdown before execution"
          - "Execution creates withdrawal transactions and closes cycle"
          - "New cycle auto-initiated after share-out completion"

      - name: "offline-sync"
        priority: must
        description: "Offline-first SQLDelight cache with queue-based sync to Mifos Fineract"
        requirement_refs: ["FR-008"]
        version: "1.0.0"
        screen_refs: ["sync-status"]
        flow_ref: "offline-sync-flow"
        api_refs: ["/fineract-provider/api/v1/batches"]
        acceptance_criteria:
          - "All CRUD operations work without internet"
          - "Sync queue with exponential backoff retry"
          - "Conflict resolution: last-write-wins with user override for conflicts"
          - "Batch API for efficient multi-operation sync"
          - "Sync status indicator on every screen"

      - name: "field-officer-view"
        priority: should
        description: "Read-only supervision of multiple groups for field officers"
        requirement_refs: ["FR-009"]
        version: "1.1.0"
        screen_refs: ["field-officer-dashboard"]
        api_refs: ["/fineract-provider/api/v1/centers", "/fineract-provider/api/v1/runreports/{reportName}", "/fineract-provider/api/v1/datatables/dt_sync_metadata/{entityId}"]
        acceptance_criteria:
          - "Group list with health indicators (active, at-risk, dormant)"
          - "Drill-down to group details, meetings, balances"
          - "Read-only access — cannot modify group data"
          - "Cross-group summary metrics"

      - name: "multi-language"
        priority: should
        description: "Runtime language switching with support for English, Swahili, French, Hindi"
        requirement_refs: ["FR-010"]
        version: "1.0.0"
        screen_refs: ["settings"]
        acceptance_criteria:
          - "Language picker in settings with 4 languages"
          - "All UI strings externalized via Compose resources"
          - "Immediate UI refresh on language switch"

      - name: "social-fund"
        priority: could
        description: "Separate social fund collection and emergency disbursement"
        requirement_refs: ["FR-011"]
        version: "1.1.0"
        api_refs: ["/fineract-provider/api/v1/datatables/dt_social_fund/{entityId}"]
        acceptance_criteria:
          - "Separate social fund balance tracked per group"
          - "Emergency requests recorded with reason and approval"
          - "Disbursement requires chairperson approval"

      - name: "fines-tracking"
        priority: should
        description: "Auto-calculated fines for attendance/payment violations per group rules"
        requirement_refs: ["FR-012"]
        version: "1.0.0"
        screen_refs: ["meeting-conduct"]
        api_refs: ["/fineract-provider/api/v1/charges", "/fineract-provider/api/v1/savingsaccounts/{accountId}/charges", "/fineract-provider/api/v1/datatables/dt_meeting_attendance/{entityId}"]
        acceptance_criteria:
          - "Auto-calculated based on group fine rules"
          - "Fine added to group pool as SavingsTransaction(type=fine)"
          - "Fine history visible to member in profile"

      - name: "authentication"
        priority: must
        description: "Dual login: Admin (Fineract staff auth) vs End User (self-service client auth). PIN + biometric for offline."
        requirement_refs: ["FR-013", "FR-014", "FR-015"]
        version: "1.0.0"
        screen_refs: ["login", "client-type-selector"]
        api_refs: ["/fineract-provider/api/v1/authentication", "/fineract-provider/api/v1/self/authentication"]
        acceptance_criteria:
          - "Client type selector on login: 'I manage groups' (Admin) vs 'I am a member' (End User)"
          - "Admin login via Fineract staff authentication → admin navigation"
          - "End User login via Fineract self-service client auth → personal dashboard"
          - "Token + client_type cached locally for offline PIN re-auth"
          - "Admin role (treasurer/chairperson/field officer) determined from dt_member_role after login"
          - "Optional biometric unlock on supported devices"

      - name: "end-user-dashboard"
        priority: must
        description: "Personal dashboard for end-user members: own savings, loans, attendance, share-out projection, loan request"
        requirement_refs: ["FR-014", "FR-016"]
        version: "1.0.0"
        screen_refs: ["personal-dashboard", "personal-savings", "personal-loans", "loan-request"]
        acceptance_criteria:
          - "Personal dashboard shows: savings balance, active loans, next meeting, share-out projection"
          - "Savings tab: own contribution history, running balance"
          - "Loans tab: own active/past loans, repayment schedule, status"
          - "Group summary: total pool, member count, next meeting — NO individual member data"
          - "Loan request form: amount, purpose, duration — submitted for admin review"
          - "All data is read-only except loan request submission"

      # ── FEATURES FROM COMMUNITY RESEARCH (CR-003) — professionally curated ──

      - name: "group-linked-savings"
        priority: must
        description: "Dual savings: mandatory group-linked savings (min/max per meeting) separate from voluntary individual savings"
        requirement_refs: ["FR-017", "FR-020"]
        version: "1.0.0"
        screen_refs: ["meeting-conduct", "savings-dashboard", "group-dashboard"]
        api_refs: ["/fineract-provider/api/v1/savingsaccounts", "/fineract-provider/api/v1/savingsaccounts/{accountId}/transactions"]
        source_ref: "CR-003"
        acceptance_criteria:
          - "Two savings products per member: group-linked (mandatory, min/max enforced) and individual (voluntary)"
          - "Group-linked savings collected at every meeting with min/max validation"
          - "Auto-create both savings accounts on member activation"
          - "Separate tracking and balance display for each type"
          - "Penalty auto-triggered if member deposits below minimum"

      - name: "corpus-tracking"
        priority: must
        description: "Real-time group fund/corpus balance — all inflows minus outflows, visible during meetings, blocks excess cash outflows"
        requirement_refs: ["FR-018"]
        version: "1.0.0"
        screen_refs: ["group-dashboard", "meeting-conduct", "meeting-summary"]
        flow_ref: "meeting-flow"
        api_refs: ["/fineract-provider/api/v1/datatables/dt_group_corpus/{entityId}"]
        source_ref: "CR-003"
        acceptance_criteria:
          - "Corpus = deposits + repayments + penalties - withdrawals - disbursals - distributions"
          - "Displayed on group dashboard and during every meeting step"
          - "Opening balance at meeting start, running balance during, closing at end"
          - "Cash outflows blocked when corpus would go negative"

# ═══════════════════════════════════════════════════════════════════
# PHASE 9 — §screens
