# ═══════════════════════════════════════════════════════════════════════════
# idea-plan.yaml — mifos-x-field-officer-app
# ═══════════════════════════════════════════════════════════════════════════
#
# BOOTSTRAPPED by /idea-feature-import STEP 0.3 on 2026-10-02.
#
# Why it was missing: this project has working source (20 feature modules, 1652 .kt at the original
# ref), a registered PROJECT_CONFIG.yaml and a session binding — but no plan. Every per-feature
# idea-layer command requires this file, so the project was unreachable by the pipeline it is meant
# to use. /idea-import does not write it; /idea-plan writes it only via a 15-phase wizard or an
# import mode that registers a NEW project.
#
# DELIBERATELY MINIMAL. A feature-import knows one feature at a time, so vision, personas,
# requirements and release phases are NOT invented here — writing them from a few screens would be
# fabrication wearing a plan's clothes. `/idea-plan` fills them when the operator is ready.
#
# features[] grows one row per `/idea-feature-import` run. `status: imported` means extracted from
# real source with provenance — distinct from `draft` (authored, unreviewed) and `scaffold`
# (structure only, no content).

schema_version: "1.0"
_creation_mode: "feature-import"
_metadata:
  bootstrapped_by: "/idea-feature-import"
  bootstrapped_at: "2026-10-02"
  note: >
    Minimal bootstrap. Sections absent here (vision, personas, requirements, api_surface,
    release_phases) are NOT empty-by-decision — they are unwritten, and must not be read as
    "this app has no requirements".

identity:
  name: mifos-x-field-officer-app
  workspace: mifos-x
  type: kmp
  subtype: kmp-app
  platforms: [android, ios, desktop, web]

repository:
  source_path: "source/mifos-x-field-officer-app"
  migration_reference_ref: "6b66e8a43"   # the ORIGINAL app — the specification being migrated FROM

# ──────────────── FEATURE → MODULE PINS (RULE-KMP-FEATURE-MODULE-PATH-001) ────────────────
# An idea-layer feature id does not have to match its Kotlin module name. Where they differ the pin
# is MANDATORY: without it codegen resolves `signin` → `feature/signin`, scaffolds a second module
# beside the real one, and manufactures the G-IMPL-DUP defect while faithfully following the name.
# This is the sanctioned operator disambiguation, not a workaround.
feature_module_paths:
  # Renamed 2026-10-02: the module was `feature/auth` while the idea-layer feature was `signin` and
  # the plan body said `feature/login` — three names for one thing. Now `feature/signin` end to end.
  # This pin is the operator disambiguation RULE-KMP-FEATURE-MODULE-PATH-001 resolves from, so a
  # stale value here sends codegen into a module that no longer exists.
  signin: feature/signin
  serverConfig: feature/settings
  # Added 2026-10-03 by the source import. Every pin below is a case where the feature id and the
  # Kotlin module name DIFFER, which is exactly when the pin is mandatory: four of these features
  # live inside `feature/settings` or `feature/client`, so an unpinned id would scaffold a new
  # same-named module beside the real one.
  home: feature/home
  profile: feature/profile
  clientList: feature/client
  clientDetail: feature/client
  clientCharges: feature/client
  settings: feature/settings
  notification: feature/settings
  syncAndDrafts: feature/settings

# ──────────────── STORE5 WAIVERS (RULE-IMPLEMENT-STORE5-001, read by framework-verify-store5.sh) ────────────────
# Each entry is a DATED exception — it expires on review_by_date and the gate re-blocks.
store5_excludes:
  # SurveyCommandRepository.submitScore (2026-10-23): S5-12 COMMAND_WITHOUT_LOCAL_EFFECT. A
  # submitted scorecard has NO local reader — no table, no read endpoint, no screen — so there is
  # nothing for a localApply to update. Recording it needs a scorecard read + table first; that
  # lands with the S7 survey-sync slice (feature/settings MIGRATION.md).
  - feature: survey
    sub_check: S5-12
    reason: "submitScore has no local reader to update until the S7 survey slice adds one"
    review_by_date: 2027-01-31

# ──────────────── TEMPLATE-FIX LOCAL WAIVERS (RULE-TEMPLATE-MODULE-FIX-UPSTREAM-001 TU-5) ────────────────
# A fix to template-derived code that deliberately stays in this fork. Dated: on review_by_date the
# decision is looked at again.
template_fix_local_waivers:
  # feature/home topBar slot (2026-10-24, operator: "let's fork own it"). HomeScreen gains an
  # overridable `topBar` so the dashboard shell, which draws ONE bar for every tab, does not stack a
  # second one on Home. customization-surface.yaml already declares `feature/home/**` owner: fork and
  # sync-dirs.sh's is_excluded() preserves fork-owned paths, so a template sync does NOT overwrite it —
  # the queue entry's "sync re-introduces the double bar" premise was wrong.
  - module: feature/home
    reason: "fork owns the home shell's chrome; feature/home/** is owner: fork, so sync preserves it"
    review_by_date: 2027-01-22

# ──────────────── FEATURES ────────────────
# One row per imported feature. The 20 features of the original app are enumerated in
# idea-layer/FEATURES.md; they appear HERE only once actually imported, so this list is a record of
# what has been materialized rather than a claim about what exists.
#
# MIGRATION ORDER is navigation order, top to bottom: signin → serverConfig → home/search →
# profile → client → loan → savings → groups → settings → sync → about.
features:
  - id: signin
    name: Sign in
    status: imported
    priority: P0
    module: feature/signin
    imported_from: "6b66e8a43"
    imported_at: "2026-10-02"
    screens: [signin]
    note: >
      Authenticates against the configured Fineract instance and establishes the session every other
      screen depends on. Hand-ported in S1 and device-verified 2026-10-02 against the live demo;
      this docset is extracted to MATCH the shipped port per FEATURE_LAYER_MIGRATION_SPEC §7.4,
      not to regenerate it.

  - id: serverConfig
    name: Server configuration
    status: imported
    priority: P0
    module: feature/settings
    imported_from: "6b66e8a43"
    imported_at: "2026-10-02"
    screens: [serverConfig]
    depends_on: [signin]
    note: >
      Reachable BEFORE authentication — it sits on the ROOT graph, not the authenticated one,
      because a first-run user whose instance differs from the shipped default cannot otherwise
      sign in. Carries a HIGH-severity known gap: the saved config does not currently reach the
      HTTP client (see screens/serverConfig/api.yaml#configures).

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # SOURCE IMPORT 2026-10-03. The eight rows below were discovered by scanning `source/**`, which
  # holds TEN *Screen.kt across FIVE feature modules; only three were declared here, so the other
  # seven were invisible to every pipeline command.
  #
  # That invisibility is the point. `/idea-agent` drives `features[]`, NOT the source tree:
  # `/idea-feature-import` is source-AWARE (`when: feature source exists`) but not
  # source-DISCOVERING. An undeclared feature is therefore never queued, never audited, and never
  # counted — `APPLICATION_GRAPH#phase_rollup` reported `needs_work: 2` while eight more screens sat
  # on disk, because two is all it had been told about.
  #
  # Declared `status: discovered` — NOT `imported`. Source exists, but no docset has been extracted
  # yet. `/idea-agent` sees a non-terminal capability and dispatches `/idea-feature-import` per
  # feature (its `when:` clause fires, preempting `/idea-plan-add` because source is present). The
  # docsets are produced BY that command, deliberately not hand-authored here: hand-authoring is
  # what produced this session's schema defects, where plausible YAML was written to shapes the
  # consumers never read.
  # ─────────────────────────────────────────────────────────────────────────────────────────────

  - id: home
    name: Home
    status: discovered
    priority: P0
    module: feature/home
    screens: [home]
    depends_on: [signin]
    source_files:
      - feature/home/src/commonMain/kotlin/kpt/feature/home/HomeScreen.kt
      - feature/home/src/commonMain/kotlin/kpt/feature/home/search/SearchBody.kt
      - feature/home/src/commonMain/kotlin/kpt/feature/home/search/SearchViewModel.kt
    note: >
      The authenticated landing surface. In this fork Home IS Fineract search: the screen hosts a
      search body over clients/groups/loans/savings rather than a dashboard, which is why its
      ViewModel is `search/SearchViewModel` and not a `HomeViewModel`. An importer assuming
      one-ViewModel-per-Screen by filename would miss it entirely.

