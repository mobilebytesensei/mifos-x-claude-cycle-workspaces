<!doctype html>
<!-- provenance: locally authored (--fast engine, B1 fallback path). pending_stitch_upgrade=true.
     reason: the Stitch backend returned "accepted but never delivered" (300s poll) on every call,
     and the prior Google render displayed the STALE host demo.mifos.io, which is the exact value
     whose wrong base path caused the 2026-10-01 404. A render that misstates the connection target
     defeats the instance chip's entire purpose, so correct content was preferred over render
     provenance. Upgradeable via the resume ledger once the backend recovers.
     Derived from screens/signin/preview/empty.html at production fidelity. -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in: empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
:root{
  --primary:#4338CA; --on-primary:#FFFFFF;
  --secondary:#059669; --secondary-container:#D1FAE5;
  --background:#FAFAFB; --on-surface:#0F172A;
  --surface-variant:#E2E8F0; --on-surface-variant:#475569;
  --outline:#94A3B8; --outline-variant:#CBD5E1;
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px; --sp-xxl:32px;
  --touch:48px; --elev-low:0 1px 2px rgba(15,23,42,.06);
  --r-md:12px; --r-lg:16px; --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-surface);
  -webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;justify-content:center}
.phone{width:100%;max-width:420px;min-height:100dvh;display:flex;flex-direction:column;padding:var(--sp-xl)}
.sym{font-family:'Material Symbols Rounded';font-weight:400;line-height:1;display:inline-block;white-space:nowrap}
.chip{align-self:center;display:inline-flex;align-items:center;gap:var(--sp-sm);min-height:36px;
  padding:var(--sp-sm) var(--sp-md);border-radius:var(--r-pill);background:var(--surface-variant);
  color:var(--on-surface-variant);border:1px solid var(--outline-variant);cursor:pointer;font-size:13px;font-weight:500}
.chip .sym{font-size:18px} .chip .host{color:var(--on-surface);font-weight:600} .chip .dot{opacity:.45}
.brand{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:var(--sp-lg);padding:var(--sp-xxl) 0}
.logo-tile{width:64px;height:64px;border-radius:var(--r-lg);background:var(--secondary-container);
  display:grid;place-items:center;box-shadow:var(--elev-low)}
.logo-tile .sym{font-size:34px;color:var(--secondary)}
.title{text-align:center;display:flex;flex-direction:column;gap:var(--sp-xs)}
.title h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.title p{font-size:14px;color:var(--on-surface-variant)}
.form{width:100%;display:flex;flex-direction:column;gap:var(--sp-lg)}
.field{position:relative;display:flex;align-items:center;min-height:56px;background:#FFF;
  border:1px solid var(--outline-variant);border-radius:var(--r-md);padding:0 var(--sp-lg);gap:var(--sp-md);
  transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(67,56,202,.12)}
.field > .sym.lead{font-size:20px;color:var(--on-surface-variant)}
.field label{position:absolute;top:-8px;left:var(--sp-md);padding:0 var(--sp-xs);background:var(--background);
  font-size:12px;font-weight:500;color:var(--on-surface-variant)}
.field input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--on-surface);min-height:var(--touch)}
.field input::placeholder{color:var(--outline)}
.toggle{display:grid;place-items:center;width:var(--touch);height:var(--touch);margin-right:calc(var(--sp-sm) * -1);
  border:0;background:transparent;cursor:pointer;color:var(--secondary);border-radius:var(--r-pill)}
.toggle .sym{font-size:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--sp-sm);width:100%;min-height:var(--touch);
  height:52px;border:0;border-radius:var(--r-md);background:var(--primary);color:var(--on-primary);
  font:inherit;font-size:16px;font-weight:600;cursor:pointer;box-shadow:var(--elev-low)}
.btn .sym{font-size:20px}
.consent{margin-top:auto;padding-top:var(--sp-xl);text-align:center;font-size:12px;line-height:1.6;color:var(--on-surface-variant)}
.consent a{color:var(--primary);font-weight:500;text-decoration:none;border-bottom:1px solid rgba(67,56,202,.3);cursor:pointer}
</style>
</head>
<body>
<div class="phone" data-screen="signin" data-state="empty" data-shell="none">

  <!-- #instance_chip states WHERE this sign-in goes. It replaces v1's blind
       "Update Server Configuration" button: that button offered to change a setting
       without ever showing its current value. -->
  <button class="chip" id="instance_chip" data-component-type="assist_chip" data-nav-to="serverConfig">
    <span class="sym">dns</span><span class="host">apis.mifos.community</span>
    <span class="dot">·</span><span>mifos-bank-1</span><span class="sym">chevron_right</span>
  </button>

  <main class="brand">
    <div class="logo-tile" id="logo" data-component-type="image"><span class="sym">account_balance</span></div>
    <div class="title" id="title" data-component-type="text_block">
      <h1>MifosXDroid</h1><p>Please enter your credentials</p>
    </div>

    <form class="form" onsubmit="return false">
      <div class="field" id="username_field" data-component-type="outlined_text_field">
        <span class="sym lead">person</span><label for="u">Username</label>
        <input id="u" type="text" placeholder="Enter username" autocapitalize="off" autocorrect="off" spellcheck="false"/>
      </div>
      <div class="field" id="password_field" data-component-type="outlined_text_field">
        <span class="sym lead">lock</span><label for="p">Password</label>
        <input id="p" type="password" placeholder="Enter password"/>
        <button class="toggle" type="button" data-action="togglePasswordVisibility" aria-label="Show password">
          <span class="sym">visibility</span>
        </button>
      </div>
      <button class="btn" id="login_button" data-component-type="button" data-action="authenticate">
        Login <span class="sym">arrow_forward</span>
      </button>
    </form>
  </main>

  <!-- #consent_text was ABSENT in v1. An app collecting credentials states its terms
       where it collects them. -->
  <p class="consent" id="consent_text" data-component-type="legal_text">
    By signing in you agree to our
    <a data-action="openTerms">Terms of Service</a> and
    <a data-action="openPrivacy">Privacy Policy</a>.
  </p>
</div>
</body>
</html>
