# design-tokens.yaml — mifos-x-field-officer-app
#
# EXTRACTED from the shipped theme on 2026-10-02, not designed.
#
# The app already has a working, device-verified design system in
# `core/designsystem/src/commonMain/kotlin/kpt/core/designsystem/theme/`. Authoring a NEW palette
# here would make every generated mockup diverge from the running app on its first frame — the same
# extraction-over-invention rule the feature import follows (FEATURE_LAYER_MIGRATION_SPEC §7.0),
# applied to the design layer.
#
# Every value below is traceable. Verify with:
#   grep -n "primaryLight = " core/designsystem/.../theme/Color.kt

schema_version: "1.0"

provenance:
  extracted_from: "working-tree"
  extracted_at: "2026-10-02"
  source_files:
    - core/designsystem/src/commonMain/kotlin/kpt/core/designsystem/theme/Color.kt
    - core/designsystem/src/commonMain/kotlin/kpt/core/designsystem/theme/Spacing.kt
    - core/designsystem/src/commonMain/kotlin/kpt/core/designsystem/theme/Elevation.kt
    - core/designsystem/src/commonMain/kotlin/kpt/core/designsystem/theme/Type.kt
    - core/designsystem/src/commonMain/kotlin/kpt/core/designsystem/theme/FinanceColors.kt
    - core/designsystem/src/commonMain/kotlin/kpt/core/designsystem/theme/KptTheme.kt
  extraction: complete

# ──────────────── COLOR — Material 3 light scheme (the default) ────────────────
# `KptTheme` resolves `lightScheme` unless dark/dynamic is requested, so these are what a mockup
# must match. Indigo primary, emerald secondary, amber tertiary on a near-white slate background.
color:
  light:
    primary: "#4338CA"
    onPrimary: "#FFFFFF"
    primaryContainer: "#E0E7FF"
    onPrimaryContainer: "#1F1D75"
    secondary: "#059669"
    onSecondary: "#FFFFFF"
    secondaryContainer: "#D1FAE5"
    onSecondaryContainer: "#064E3B"
    tertiary: "#D97706"
    onTertiary: "#FFFFFF"
    tertiaryContainer: "#FEF3C7"
    onTertiaryContainer: "#78350F"
    error: "#F87171"
    onError: "#FFFFFF"
    errorContainer: "#FFE4E1"
    onErrorContainer: "#9F1239"
    background: "#FAFAFB"
    onBackground: "#0F172A"
    surface: "#FAFAFB"
    onSurface: "#0F172A"
    surfaceVariant: "#E2E8F0"
    onSurfaceVariant: "#475569"
    outline: "#94A3B8"
    outlineVariant: "#CBD5E1"
    scrim: "#000000"
    inverseSurface: "#1E293B"
    inverseOnSurface: "#F1F5F9"

# ──────────────── SEMANTIC FINANCE COLOURS ────────────────
# Domain tokens the generic M3 scheme cannot express. A field-officer app shows money and rates, and
# "positive" is NOT the same token as "primary" — a mockup that paints a credit in indigo is wrong
# even though indigo is the brand colour.
finance:
  light:
    moneyPositive: "#0E7A3B"
    moneyNegative: "#B3261E"
    moneyNeutral: "#5F6368"
    moneyPositiveContainer: "#D7F5E3"
    moneyNegativeContainer: "#FAE9E7"
    moneyNeutralContainer: "#F1F3F4"
    onMoneyPositive: "#003318"
    onMoneyNegative: "#410002"
  provides_via: "LocalFinanceColors"

# ──────────────── SPACING ────────────────
spacing:
  none: 0
  xs: 4
  sm: 8
  md: 12
  lg: 16
  xl: 24
  xxl: 32
  xxxl: 48
  touchTargetMin: 48     # accessibility floor — a mockup must not draw a tap target below this
  unit: dp
  provides_via: "LocalSpacing"

# ──────────────── ELEVATION ────────────────
elevation:
  resting: 0
  low: 1
  medium: 3
  high: 6
  dragging: 12
  unit: dp
  provides_via: "LocalElevation"

# ──────────────── TYPOGRAPHY ────────────────
typography:
  font_family: Outfit
  weights: [Light, Normal, Medium, SemiBold, Bold, Black]
  scale_source: "Material 3 Typography(), re-mapped onto Outfit via toKptTypography(fontFamily)"
  display_sizes_sp: [57, 45, 36]
  headline_sizes_sp: [32, 28, 24]
  note: >
    The scale is stock M3; only the family is brand. A mockup rendered in Roboto or Inter will look
    subtly wrong against the running app — Outfit is geometric and noticeably wider at the same size.

# ──────────────── THEME ENTRY ────────────────
theme:
  composable: KptTheme
  path: core/designsystem/src/commonMain/kotlin/kpt/core/designsystem/theme/KptTheme.kt
  modes: [light, dark, dynamic, androidTheme]
  default: light
  provides:
    - LocalFinanceColors
    - LocalMotion
    - LocalSpacing
    - LocalElevation
    - LocalScreenStateDefaults
  note: >
    LocalScreenStateDefaults is the fork seam for branded loading / empty / error / no-network
    visuals (core/store/AppScreenStateDefaults.kt). Mockups for those states must use it rather than
    inventing their own empty-state art, or the generated screen and the mockup will disagree about
    the most common states in the app.
