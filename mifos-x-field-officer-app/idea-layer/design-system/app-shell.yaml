# app-shell — the project's chrome contract (RULE-APP-SHELL-001 AS1).
#
# SCHEMA NOTE. The keys below are the ones `load-app-shell.ts#AppShellRaw` actually parses —
# `bottom_navigation` / `top_app_bar` / `drawer` / `fab_host` / `snackbar_host` / `safe_area` /
# `defaults`. A first draft of this file invented a plausible-looking `shells:` + `routes:` shape;
# it was valid YAML and completely inert, because nothing reads those keys. Authoring to the
# consumer's schema is the whole point of the file.
#
# Per-screen DEVIATION does not live here — it lives in each screen's `ui.yaml#shell`
# (`UiYamlShellOverride`: bottom_navigation_visible / top_app_bar_visible / fab_visible /
# drawer_accessible / top_app_bar{}). This file is the default; the screen overrides it.
#
# Measured from the running app (OnePlus CPH2423, 2026-10-03), not assumed.

schema_version: "1.0"
project: mifos-x-field-officer-app

# ──────────────── BOTTOM NAVIGATION ────────────────
# Three destinations, in this order, as rendered on device.
bottom_navigation:
  enabled: true
  items:
    - { label: "Home",    icon: home,           target_screen: home,    order: 1 }
    - { label: "Clients", icon: group,          target_screen: clients, order: 2 }
    - { label: "Profile", icon: account_circle, target_screen: profile, order: 3 }

# ──────────────── TOP APP BAR ────────────────
# Centred app-name title with a trailing settings action. `title_source: static` with the fork's
# display name — resolved at build time from app-profile, never a hardcoded brand literal in a
# screen.
top_app_bar:
  enabled: true
  variant: center_aligned
  title_source: static
  static_title: "MifosXDroid"
  leading: auto
  trailing_actions:
    - { id: settings, icon: settings, target_screen: settings }

drawer:
  enabled: false
  items: []

fab_host:
  enabled: false
  per_screen_overrideable: true

snackbar_host:
  enabled: true
  default_position: bottom

safe_area:
  top: respect
  bottom: respect

# ──────────────── DEFAULTS ────────────────
# What a screen gets when it declares no `ui.yaml#shell` override. The authenticated surfaces are
# the majority, so they are the default; the pre-authentication gate opts OUT explicitly.
defaults:
  bottom_navigation_visible: true
  top_app_bar_visible: true
  drawer_accessible: false
