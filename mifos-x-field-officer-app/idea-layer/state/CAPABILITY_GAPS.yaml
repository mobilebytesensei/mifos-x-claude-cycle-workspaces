  - id: 'loan-approval-date-rule-was-inverted'
    kind: carried-over-ui-defect-fixed
    feature: loan
    severity: advisory
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      The original gave BOTH approval date pickers one rule —
      `isSelectableDate { utcTimeMillis >= Clock.System.now() }`, future dates
      only. For the APPROVED-ON date that is wrong twice: the picker's day cells
      are midnight instants, so today's cell is already past by the time the
      dialog opens and today was not selectable at all; and Fineract rejects an
      approval dated in the future, so every date the officer could pick was one
      the server would refuse. The field defaulted to now (valid) and any use of
      the picker made it invalid.
      Approved-on is now restricted the other way (`<= now`), matching both
      Fineract and the fork's existing `clientClosure` screen — retroactive
      approval is normal, a loan approved on paper last week is entered today.
      Expected disbursement is left unrestricted: a future scheduled
      disbursement is the ordinary case and a past one is legitimate when
      paperwork is catching up.
    fix_belongs_in: feature/loan (done)
