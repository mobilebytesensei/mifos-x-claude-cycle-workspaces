  - id: 'two-icon-catalogs-with-conflicting-values'
    kind: duplicated-design-system-surface
    feature: designsystem
    severity: warn
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      `core/designsystem/icon/` holds TWO icon catalogs in the same package —
      `AppIcons` (117 icons, the fork's, formerly MifosIcons, 48 consumers) and
      `KptIcons` (59 icons, the template's, formerly AppIcons, 6 consumers).
      They overlap on 31 names and 13 of those resolve to DIFFERENT icons:
      ArrowBack is `Icons.AutoMirrored.Filled.ArrowBack` in one and
      `Icons.Filled.ChevronLeft` in the other; Language is `ArrowOutward` vs
      `Translate`; Person is `Person` vs `PersonOutline`; plus Camera, Cancel,
      Check, Close, Copy, Delete, Edit, KeyboardArrowDown, Settings, Share.
    not_merged_because: >-
      merging would silently restyle those 13 icons wherever the losing catalog
      is used, which is a visible UI change with no review behind it. §6a keeps
      shipped UI as-is, so the duplication was renamed (de-branded) and recorded
      rather than resolved.
    fix: >-
      pick one catalog per icon with a designer or a visual diff, then delete the
      loser. Best done in the Stitch pass, which is already re-deciding the
      visuals.
    fix_belongs_in: core/designsystem/icon
