  - id: 'no-lock-surface::signin/biometric_ready'
    kind: state-not-device-reachable
    feature: signin
    state: biometric_ready
    severity: error
    raised_at: '2026-10-05T12:30:00.000Z'
    raised_by: device-verify
    status: open
    message: >-
      biometric_action is IMPLEMENTED and covered by three tests, but the
      biometric_ready state cannot be reached on a device: it requires signin to
      be shown WITH a stored session (root state UserLocked), and this app has no
      lock surface to return through. Measured 2026-10-05 on OnePlus CPH2423 —
      force-stop + relaunch with a stored session resolves to UserUnlocked and
      lands on home, never on signin. v1's passcode screen was the lock path and
      was already dead code there (docs.yaml#port_deviations.passcode-routing),
      so the port had nothing to carry over. Verdict recorded as
      pending-device-verify rather than green.
    blocked_by: >-
      a product decision — ship a lock surface (passcode screen or idle timeout)
      so an authenticated session can be locked and returned to.
    covered_by:
      - SignInScreenUiTest.biometricUnlockIsOfferedOnlyWhenItCanActuallySucceed
      - SignInScreenUiTest.biometricUnlockRendersForAReturningOfficerAndIsWithdrawnOnLockout
      - SignInViewModelTest.aStoredSessionIsWhatMakesBiometricUnlockRelevant
  - id: 'access-point-ignores-server-config::signin'
    kind: displayed-value-not-consumed
    feature: signin
    component: instance_chip
    severity: error
    raised_at: '2026-10-05T13:40:00.000Z'
    raised_by: /idea-feature-enrich
    status: open
    message: >-
      The instance chip displays ServerConfig (host + tenant), but no production
      code under core/network READS ServerConfig — the access point's baseUrl is
      a build-time constant. Measured 2026-10-05: the only non-test readers are
      core/datastore (storage), feature/settings (the editor) and
      feature/signin (this display). So editing the server configuration does
      not change where sign-in posts.
    agrees_for_the_default: >-
      ServerConfigAccessPointParityTest pins ServerConfig.DEFAULT equal to the
      `mifos` access point on origin, path and tenant, so the chip is TRUTHFUL
      as shipped and becomes FALSE only after a user edit.
    newly_visible_because: >-
      v1's blind "Update Server Configuration" button showed no value, so it
      could not contradict the constant. Making the value visible did not create
      this bug — it made an invisible one legible, which is the right trade, but
      the chip must not keep stating a value the client ignores.
    fix_belongs_in: core/network
    fix: "resolve the access point from ServerConfig rather than a build constant"
    tracked_in: feature/settings/MIGRATION.md
