    remaining_in_s4: >-
      `groupLoanAccount` · `newLoanAccount` (a 5-page wizard, ~2,900 lines) —
      both CREATE-loan flows, and the only two left.
      Landed: `loanApproval` · `loanRepaymentSchedule` · `loanTransaction` (S4b)
      · `loanRepayment` (S4c) · `loanAccountSummary` (S4d) ·
      `clientLoanAccounts` (S4e, in feature/client) · `loanDisbursement` ·
      `loanCharge` (S4f) · `amountTransfer` (S4g) · `loanChargeForm` (S4h) ·
