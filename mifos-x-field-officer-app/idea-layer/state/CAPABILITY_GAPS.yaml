  - id: 'new-loan-submit-crashed-where-the-preview-did-not'
    kind: carried-over-defect-fixed
    feature: loan
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      The original built its `LoansPayload` TWICE —
      `submitLoanApplication()` and `buildLoansPayloadForSchedulePreview()` —
      and the two had drifted in the dangerous direction. The PREVIEW copy used
      `?.getOrNull(index)?.id` and `.toDoubleOrNull()`; the SUBMIT copy used
      `?.options[index]?.id` and `.toDouble()`. Someone hardened the preview and
      never backported it, so the crashes survived on exactly the path that
      matters: preview a schedule fine, then crash on submit.
      Six of the submit builder's option lookups had no `-1` guard, and all six
      were reachable WITHOUT the officer doing anything unusual, because
      `loadLoanAccountTemplate` resolved them with `indexOfFirst` — which
      returns -1 when the template's own chosen value is not in its own option
      list, a real Fineract response shape. `moveToNextStep()` validated
      nothing at all, so the empty form reached submit too.
      Fixed structurally rather than per-call-site: ONE payload builder, a
      `Map<LoanField, LoanOption>` in place of twelve parallel `Int = -1`
      dropdown-position fields (so "unchosen" and "position -1" cannot be
      confused), `firstOrNull` instead of `indexOfFirst` in the prefill, and
      per-step validation that reports a missing field on the step that owns it.
      Also fixed: the whole selection map is cleared when the product changes —
      the original reset six of twelve, so position 3 of the previous product's
      fund list was submitted against the new product's.
    worth_sweeping: >-
      two duplicated payload builders that have silently diverged is worth
      looking for elsewhere: grep for a type constructed in two places within
      one ViewModel. The drift is invisible at both call sites.
    fix_belongs_in: feature/loan (done)
  - id: 'savings-summary-dereferenced-nullable-active-with-bang-bang'
    kind: carried-over-defect-fixed
    feature: savings
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      `!status?.active!!` appeared at FOUR sites in the original savings account
      summary — the action button's `onClick` selector, its label
      (`getSavingsButtonText`), its visibility predicate
      (`savingsButtonVisibilityStatus`) and the deposit/withdraw visibility
      predicate. `SavingsAccountStatusEntity.active` is `Boolean?` and Fineract
      omits it on an account that has never been activated, which is precisely
      the account an officer opens this screen to approve or activate. All four
      sites are evaluated during COMPOSITION, so such an account did not render
      a broken button — it crashed the screen.
      Same null-handling class as the group-detail `active != true` fix, but
      with `!!` instead of `== false`, so it throws rather than merely
      disagreeing.
      Two further defects in the same cluster: `getSavingsButtonText`'s `else`
      branch was `"Button not visible" as StringResource` — a String cast to a
      resource handle, which survived only because a SECOND function re-derived
      the same `when` chain and happened to return false there; and the closed
      case drew an ENABLED Button labelled "Savings account closed" whose
      `onClick` was `{ }`.
      Fixed by deriving ONE `SavingsAction` (`APPROVE | ACTIVATE | TRANSACT |
      NONE`) from the status with `== true` throughout. The screen reads the
      result and never re-derives it, which is what let the original's four
      copies disagree; `NONE` renders status TEXT, not a dead button.
      Also fixed: the two visibility booleans were `rememberSaveable`, so they
      were computed once from the FIRST account emitted and then saved —
      after approving an account the button kept its old label and old action
      until the screen was recreated. Derived state does not belong in
      `rememberSaveable`.
    worth_sweeping: >-
      `!!` on a Fineract-sourced nullable is worth a sweep across the original
      before each slice: `git grep -n '?\.[a-zA-Z]*!!' <ref>`. Every status flag
      on every account type is nullable, and the crash lands in composition.
    fix_belongs_in: feature/savings (done)
  - id: 'savings-transaction-row-date-crashed-on-the-savings-endpoint'
    kind: carried-over-defect-fixed
    feature: savings
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      The original rendered a transaction row's date as
      `DateHelper.getDateAsString(transaction.date as List<Int>)` — an unchecked
      cast of a `List<Int?>` followed by indexing `[0]`,`[1]`,`[2]`. The savings
      endpoint sends a `{transactionId, year, month, day}` OBJECT
      (`savingsTransactionDate`) and leaves the generic `date` array EMPTY,
      which is also the entity's own default — so the cast passed by erasure and
      the index threw `IndexOutOfBoundsException` inside the composition. Every
      row on a savings account crashed the list rather than showing a blank
      date.
      Fixed by projecting a formatted string in the ViewModel from
      `savingsTransactionDate` when complete, else the generic array when it has
      three non-null elements (`filterNotNull` first, so a partial row is
      refused rather than silently shifted by a position), else blank. Blank is
      the right fallback: a transaction with no usable date still has an amount
      and a running balance the officer needs.
    worth_sweeping: >-
      `as List<Int>` on a `List<Int?>` is worth grepping for across the
      original — the cast is invisible at the call site and erasure makes it
      pass. Both date sources exist on several account entities.
    fix_belongs_in: feature/savings (done)
  - id: 'savings-status-changes-sent-epoch-millis-as-the-date'
    kind: carried-over-defect-fixed
    feature: savings
    severity: error
    raised_at: '2026-10-22T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      BOTH savings status-change screens sent **epoch milliseconds** where
      Fineract expects a formatted date:
        approval: `SavingsApproval(approvedOnDate = approvalDate.toString())`
        activation: `hashMap["activatedOnDate"] = approvalDate.toString()`
      `approvalDate` is a `Long` of millis (it feeds `initialSelectedDateMillis`
      on the picker), so the request carried `"1761000000000"` while declaring
      `dateFormat = "dd MMMM yyyy"` — and the activation screen set that format
      key explicitly, right beside the millis.
      This is the 6th and 7th occurrence of the date/format defect class in this
      migration and its WORST variant: the earlier five were a mismatched
      format (`dd-MM-yyyy` sent as `dd MMM yyyy`), which at least parses to
      something. This is not a date at all. It was invisible on screen, because
      the same value was DISPLAYED through
      `DateHelper.getDateAsStringFromLong` and rendered correctly — only the
      request was wrong.
      Fixed structurally, continuing the pattern used for `LoanApproval` /
      `LoanDisburseInput` / `AccountTransferRequest` / `LoanApplicationInput`:
      new `SavingsApprovalInput` / `SavingsActivationInput` /
      `SavingsTransactionInput` in `core/model` with `locale` and `dateFormat`
      as REQUIRED, non-defaulted parameters, and `SavingsApproval` itself
      tightened the same way (its `locale`/`dateFormat` used to default to
      `DateConstants`, which is what let a caller set a date without deciding
      how it would be parsed).
      Also replaced: `activateSavings` took a `HashMap<String, String>` — three
      string keys assembled at the call site with nothing checking they were
      present or spelled right. The map is now built inside the impl from the
      typed input, since the endpoint's body genuinely is a string map.
      And `processTransaction` took a nullable ROOM ENTITY
      (`SavingsAccountTransactionRequestEntity?`, every field nullable, with an
      `errorMessage` column) as its outbound request body.
    worth_sweeping: >-
      `<dateLong>.toString()` reaching a payload is worth grepping for across
      the original — it is not a format mismatch so it does not look like one,
      and the screen displays the same value correctly. Search for
      `Date.toString()` / `*Date = .*\.toString()` near a payload constructor.
    fix_belongs_in: core/model + core/data + feature/savings (done)
  - id: 'savings-transaction-amount-validation-allowed-negatives-and-used-float'
    kind: carried-over-defect-fixed
    feature: savings
    severity: error
    raised_at: '2026-10-22T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      The deposit/withdraw screen validated its amount with
      `if (amount.toFloat() == 0f) { reject }` inside a `try/catch
      (NumberFormatException)`. Two defects in one predicate:
      (1) the only value rejected is exactly zero, so `"-500"` parses to
      `-500f`, is not `0f`, and submits a NEGATIVE deposit;
      (2) **Float** carries ~7 significant digits, so a ten-million deposit
      became `1.0E7` and lost its cents.
      Replaced by `toDoubleOrNull()` plus `> 0`, with the officer's own string
      sent on the wire so no round-trip re-renders the figure they typed. The
      three error cases are marked ON THE FIELD; the original showed one of
      three snackbars and left the field unmarked, so the officer had to
      remember which input the message was about.
      Two more on the same screen: an unchosen payment type went out as
      `paymentTypeId.toString()` on an Int defaulting to `0` (an id naming no
      row), and the payment-type LABEL was a free TEXT field the officer typed
      while `paymentTypeId` stayed `0` — two unrelated values. The port reads
      the real options from the transaction template store (which existed and
      had no caller) and sends the chosen option's id, omitting it when
      unchosen.
      Also dropped: `Logger.d("builtTransactionRequestAsJson", Throwable(json))`
      serialized the whole request — amount included — and logged it wrapped in
      a `Throwable` purely to pass a string through a signature wanting one.
    worth_sweeping: >-
      `toFloat()` on a money field is worth grepping for across the original;
      so is any validation predicate whose only rejected value is zero.
    fix_belongs_in: feature/savings (done)
  - id: 'savings-review-sheet-confirm-button-said-review'
