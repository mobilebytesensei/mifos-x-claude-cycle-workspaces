  - id: 'document-download-saves-nothing'
    kind: carried-over-ui-defect
    feature: document
    severity: warn
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      The document list's "Download" option fetches the attachment's bytes and
      DISCARDS them. No file is written, nothing is opened, and the officer is
      shown "Download successful". Carried over from the original, which did the
      same via a `downloadDocumentState` flag.
    kept_because: >-
      fixing it means deciding where a downloaded file lands on Android, iOS,
      desktop and web, and whether it opens in a viewer — a product decision, not
      a port. §6a keeps the affordance and records the suspicion.
    partially_narrowed: >-
      a fetch that FAILS now reports failure. The original's flag was set on
      success only but read unconditionally once set, so a failed download could
      still show the success message.
    fix: >-
      a FileKit save-or-share target per platform, or open the bytes in the
      platform viewer (`feature/client/utils/OpenFileInDefaultExternalApp` in the
      original is the half that exists). Decide in the Stitch pass.
    fix_belongs_in: feature/document
  - id: 'group-activation-sent-null-payload'
    kind: unverified-assumption-in-shipped-write
    feature: groups
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      Group activation was done INLINE on the group detail screen, posting
      `ActivatePayload()` with activationDate / dateFormat / locale all null, and
      a code comment asserting "the server defaults the activation date to
      today". That was an assumption, never measured. Fineract's activate command
      takes all three fields, and the original has always collected the date from
      a date picker on a dedicated screen — so the inline write was both a likely
      400 and a §6a divergence.
    resolved_by: >-
      `feature/activate` ported (the original's shared client/centre/group
      screen). Group detail now emits `Activate(groupId)` and navigates; the
      in-flight guard and offline reporting moved with the write and are tested
      there. 8 tests.
    also_fixed: >-
      centre activation, which this gap list recorded as unsurfaced, is now
      wired through the same screen — see `center-group-write-paths-unported`.
    lesson: >-
      the comment asserted server behaviour with no capture behind it. An
      assumption about a remote contract belongs in CAPABILITY_GAPS as a
      question, not in a code comment as a fact.
