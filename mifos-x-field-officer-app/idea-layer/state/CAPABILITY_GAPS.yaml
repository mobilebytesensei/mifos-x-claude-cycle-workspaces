  - id: 'two-short-month-constants-disagree'
    kind: naming-trap
    feature: core/common
    severity: advisory
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      Two constants named `SHORT_MONTH` hold DIFFERENT formats:
      `DateHelper.SHORT_MONTH` is `"dd-MM-yyyy"` ("14-03-2026") and
      `DateFormatPattern.SHORT_MONTH` is `"dd MMM yyyy"` ("14 Mar 2026").
      `DateHelper.getDateAsStringFromLong` formats with the first.
      This is how the date/format mismatch keeps recurring: a reader who checks
      "the helper uses SHORT_MONTH, and the payload declares SHORT_MONTH" sees
      agreement where there is none. It also made this agent describe the
      approval bug with the wrong emitted string before checking the values.
      Note that the loan REPAYMENT payload is one place the pairing is genuinely
      correct — it sends `getDateAsStringFromLong` alongside
      `dateFormat = DateHelper.SHORT_MONTH`, and those two do match.
    fix: >-
      rename to say what they are (`NUMERIC_DASH` vs `SHORT_MONTH_NAME`) or
      collapse onto `DateFormatPattern`, which already carries both as distinct
      entries. Touches every caller of `DateHelper`, so it wants its own slice
      rather than being folded into a feature port.
    fix_belongs_in: core/common
  - id: 'repayment-header-hardcoded-colours'
