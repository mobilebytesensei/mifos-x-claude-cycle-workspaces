    mitigated_by: >-
      the dashboard toolbar's magnifier reaches the same search screen from every
      authenticated screen, so the capability is not lost — only the per-screen
      shortcut.
    fix_belongs_in: >-
      a seam a feature DECLARES and cmp-navigation FILLS, in the shape of
      BackboneRegistry.navigateToSettings — or a `core/ui` navigation interface.
      A design decision, not a port; deferred.
