  - id: 'date-format-mismatch-structurally-prevented-on-disburse'
    kind: carried-over-defect-fixed
    feature: loan
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      FOURTH occurrence of the same defect: a date formatted by one helper sent
      alongside a `dateFormat` field declaring a different format, so Fineract
      was told to parse a string it cannot parse. Previously found in
      `clientClosure`, `clientTransfer` and `loanApproval`; here the
      disbursement sent `DateHelper.getDateAsStringFromLong(date)`
      ("14-03-2026") with `dateFormat` defaulting to "dd MMMM yyyy".
    structural_fix: >-
      `locale` and `dateFormat` are now REQUIRED, non-defaulted parameters of
      `LoanDisburseInput`. A payload that supplies its own format is exactly how
      this kept recurring — the format field was always filled in correctly and
      the DATE was formatted elsewhere. Required parameters move the decision to
      the call site that produces the date string, where the two are read
      together.
      Checked the other three rather than assuming: `ClientCloseRequest` and
      `ProposeTransferRequest` ALREADY require theirs (they were written that way
      when those two screens were ported). Only `LoanApproval` still defaulted —
      and it was a `class` with all-nullable `var`s, so every field including the
      date was optional. Now a `data class` requiring
      `approvedOnDate` + `locale` + `dateFormat`, so no payload in this feature
      can drift again by leaving a format default untouched.
    now_consistent: >-
      all four date-carrying payloads — `ClientCloseRequest`,
      `ProposeTransferRequest`, `LoanApproval`, `LoanDisburseInput` — require
      both fields. The remaining risk is a NEW payload written with defaults; a
      lint or a shared `ApiDateFields` value object would close it structurally.
    related: 'two-short-month-constants-disagree'
    fix_belongs_in: core/model (done for all four)
  - id: 'loan-reschedule-delete-is-really-reject'
    kind: carried-over-mislabel
    feature: loan
    severity: advisory
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      The original's reschedule screen called one of its two actions DELETE —
      the icon, the action (`OnDeleteIconClick` / `ConfirmDelete`), the
      repository method (`deleteReschedule`) and the failure string
      (`feature_loan_reschedule_delete_failed`) all said delete. The wire
      command is `POST rescheduleloans/{id}?command=reject` with a
      `LoanRescheduleRejectionRequest` carrying `rejectedOnDate`, a dateFormat
      and a locale: the server records a REJECTION with a date and a user and
      removes nothing. The row stays in the list, with status "Rejected".
      Renamed to reject throughout the port — the code now says what it does —
      and the confirmation copy states that the reschedule will be recorded as
      rejected.
    why_logged_rather_than_silently_fixed: >-
      the user-facing LABEL changed, which is a product decision rather than a
      porting one: an officer who learned the old button as "delete" will look
      for it. Flagged so that reading is deliberate. The behaviour is identical
      either way — it was always a rejection.
    fix_belongs_in: idea-layer (confirm the label), feature/loan (code done)
  - id: 'while-subscribed-read-off-the-composition-path'
    kind: recurring-defect-class
    feature: loan
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      `stateIn(..., SharingStarted.WhileSubscribed(...))` hands back its INITIAL
      value whenever nothing is collecting. Any code OUTSIDE the composition
      that reads such a flow's `.value` therefore reads the initial value, not
      the current one — and on device the screen happens to be collecting, so
      the bug only shows up where no test or no screen is watching.
      Three occurrences so far, two of them real defects:
      (1) the repayment screen's double-payment guard AND account number, both
      read by the WRITE path — the guard read `false` and the account number
      `null`, so a second repayment could have been taken in the field. Now
      `Eagerly`.
      (2) the client loan-accounts header count, read only by the composition —
      correct as `WhileSubscribed`; the TEST had to collect rather than read
      `.value`.
      (3) the reschedules PENDING precondition guard, read by the ACTION path —
      refused every approve and reject. Now an eagerly-shared `pendingIds`.
    rule: >-
      a flow read by anything other than the composition must not be
      `WhileSubscribed`. Written down in `feature/client/MIGRATION.md` after (2)
      and violated anyway in (3), which is why it belongs here where the next
      slice will see it rather than only in a ledger.
    worth_mechanising: >-
      a detekt rule or a lint over `.value` reads of `WhileSubscribed` flows
      inside non-composable VM code would catch this class outright. Cheap
      compared to the third occurrence.
    fix_belongs_in: feature/** (the three fixed), build-logic (a rule)
  - id: 'loan-transfer-retry-crashed'
    kind: carried-over-defect-fixed
    feature: loan
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      The amount-transfer screen's `submitTransfer` resolved four nullable state
      ids with `!!` (`selectedOfficeId!!`, `selectedClientId!!`,
      `accountTypeId!!`, `accountId!!`) plus an unguarded
      `state.amount.toDouble()`. Safe from the happy path, because
      `validateFields()` checked all four before calling it — but
      `OnRetryClick` called `submitTransfer()` DIRECTLY, skipping validation.
      So the Retry button on a failed transfer threw.
      Fixed by resolving the ids ONCE into a `TransferDraft` at validation and
      having submit take that draft, so retry re-sends something already proven
      complete. `AccountTransferRequest`'s thirteen fields are required now
      (they were all nullable with null defaults), so the compiler enforces it.
    also_fixed_here: >-
