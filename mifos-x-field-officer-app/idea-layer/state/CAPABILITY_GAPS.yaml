  - id: 'client-pinpoint-blocked-on-maps-key'
    kind: external-dep-missing
    feature: client
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      S3c's `clientPinpoint` is the one action screen NOT ported. Its UI is an
      `expect`/`actual` pair (`PinpointMapDialogScreen`, `PinpointLocationItem`)
      whose only real implementation is the 411-line Android actual built on
      Google Maps Compose; the other four actuals are "Not available in
      <platform> yet" placeholders. Porting it needs THREE Gradle deps the fork
      does not have (`maps-compose`, `play-services-maps`,
      `play-services-location`), the `secrets-gradle-plugin`, and a Google Maps
      API key injected into `feature/client/src/androidMain/AndroidManifest.xml`
      — which is how the original wired it (`com.google.android.geo.API_KEY`).
    blocked_by: >-
      a Google Maps API key. Per RULE-SECRETS-VAULT-001 it must enter through the
      vault (`/secrets request mifos-x-maps-api-key`), not be hand-written into
      local.properties, and it cannot be minted by the agent. Porting the screen
      without it would ship a map surface that renders blank.
    not_stubbed_because: >-
      the whole point of the screen is the map. A placeholder would be a dead
      control (RULE-IMPL-DEAD-CLICKABLE-001), so the route is ABSENT rather than
      drawn inert — exactly as the unported drill-downs are handled elsewhere.
    already_done: >-
      the layers BELOW the UI are complete and unblocked — `pinpointLocationsStream`
      on ClientRepository, and add/update/delete on ClientCommandRepository. Only
      the Compose surface is waiting.
    fix_belongs_in: feature/client (androidMain), gradle/libs.versions.toml, vault
  - id: 'idempotency-key-ignored-by-gateway'
    kind: server-contract-not-honoured
    feature: note
    severity: warn
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      `POST {resourceType}/{resourceId}/notes` is sent with an `Idempotency-Key`
      header (Fineract command idempotency), and apis.mifos.community ACCEPTS
      the header but does NOT dedupe on it. Measured 2026-10-21 by pinning the
      key to one constant across two creates — BOTH notes were created and both
      are visible in the list after a cold relaunch.
    first_read_was_wrong: >-
      An earlier reading of the same experiment concluded the opposite, because
      the notes list it was read from was STALE — the same missing re-read that
      made delete look broken (NoteListViewModel now refreshes forceFresh). The
      list was re-opened from a cold start and both rows were there. Recorded
      here so the next person does not trust the retracted claim.
    mitigated_by: >-
      a CLIENT-side pre-check in NoteCommandRepositoryImpl.submitDraft — before
      replaying a CREATE it re-reads the resource's notes and skips the POST if
      an identical text is already present. Conservative on failure: an
      unreadable list sends the note rather than dropping it. Pinned by
      NoteDraftReplayTest (5 tests, RED-proved).
    residual_risk: >-
      the pre-check matches on TEXT, the only identity a create has before the
      server assigns one. An officer deliberately writing the SAME text twice on
      one client while the first is still queued loses the second. Judged
      acceptable against losing work.
    fix_belongs_in: server-side (enable Fineract command idempotency), then drop the pre-check
    tracked_in: feature/note/MIGRATION.md
