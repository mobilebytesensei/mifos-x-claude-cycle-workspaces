    message: >-
      `feature/groups`' detail screen shipped with the ENTIRE chain behind
      Documents and More-Group-Info — `GroupsDetailAction.DocumentsClicked` /
      `DataTablesClicked`, their events, the ViewModel handlers, the nav edges
      in `GroupsNavigation.kt`, even the `GroupsDetailTestTags.DOCUMENTS` /
