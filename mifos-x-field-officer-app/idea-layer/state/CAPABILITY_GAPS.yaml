  - id: 'action-dispatch-sweep-found-21-actions-with-no-control'
    kind: audit-finding
    feature: multiple
    severity: warning
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    resolution: >-
      Drained to ZERO in S5d. Of the 21: nine were the missing-top-bar defect
      (see `client-push-destinations-had-no-top-bar`), one was a dead control
      (`client-identifiers-add-icon-was-not-clickable`), two were an unoffered
      retry (`loan-retry-submit-was-never-offered`), three were genuine dead
      code from an earlier refactor and were DELETED, three were back-navigation
      second paths routed through their action, and TWO were sweep bugs — see
      `action-dispatch-sweep-had-two-bugs-of-its-own`. The triage below is kept
      for the record but TWO of its calls were WRONG; the corrections are in
      that entry.
    message: >-
      Running the new §6a corollary sweep
      (`plan-layer/.../template-port-fresh/checks/action-dispatch-sweep.py`,
      written after the group-detail menu omission and validated RED against
      it) flags 21 declared MVI Action members across 12 features that NO UI
      source dispatches. Triaged into four classes:
      (1) REAL — a capability with no affordance:
      `ClientIdentifiersAction.AddIdentifierClicked` (the identical defect to
      the group menu: action -> event -> `onAddNewIdentifier` callback all
      present, no control, in the already-shipped feature/client) ·
      `LoanTransferAction.OnRetrySubmit` + `LoanRescheduleFormAction.OnRetrySubmit`
      (a failed write can be retried from the ViewModel but the failure dialog's
      button only dismisses) · `SyncAndDraftsAction.PruneExpired` (reachable only
      from a TEST, via the ViewModel's public `pruneExpired()`; the template's
      own guidance says expired drafts should be pruned at app start, so nothing
      prunes them).
      (2) REAL — dead code left by a refactor: `LoanChargesAction.OnRefresh` +
      `LoanReschedulesAction.OnRefresh` + `ClientLoanAccountsAction.Refresh`,
      left behind when the hand-rolled `PullToRefreshBox` was dropped in favour
      of the stream reporting its own freshness. Delete the members.
      (3) FALSE POSITIVE — 12 `NavigateBack` / `BackClicked` members whose
      screens call the hoisted `onBackPressed` callback directly, so the
      action+event path is a dead SECOND route rather than a missing control.
      Harmless; deleting them is tidy-up, not a fix.
      (4) FALSE POSITIVE — `LoanPrimaryAction.OpenAction`: `LoanPrimaryAction`
      is a menu-item VOCABULARY consumed by the nav graph, not an MVI action.
      The sweep matches on the `Action` name suffix and cannot tell.
      Not fixed in S4k, which is the group loan application plus the caller it
      needed; recorded here so the next slice acts on classes (1) and (2)
      rather than rediscovering them.
    worth_sweeping: >-
      run the script at the end of every slice. It is the inverse of the §6a
      two-grep caller check — that one starts from the route and so passes on
      exactly this defect.
    fix_belongs_in: feature/client, feature/loan, feature/settings
  - id: 'action-dispatch-sweep-had-two-bugs-of-its-own'
    kind: tooling-defect-fixed
    feature: multiple
    severity: error
    raised_at: '2026-10-22T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      Draining the 21 findings exposed TWO bugs in the sweep itself, and both had
      already produced a WRONG triage call in
      `action-dispatch-sweep-found-21-actions-with-no-control`:
      (1) **It could not see indirect dispatch.** A ViewModel may expose
      `fun f() = trySendAction(XAction.Y)` and the UI pass `onPrune =
      viewModel::f`. `SyncAndDraftsAction.PruneExpired` is dispatched exactly
      that way from a real OutlinedButton on the Sync & Drafts screen — the
      earlier triage called it REAL ("reachable only from a TEST") because a
      grep for `pruneExpired()` with parentheses cannot match a `::`
      method reference. The script now collects those forwarders and accepts
      `::f` in a UI file as a dispatch.
      (2) **It read a constructor parameter's TYPE as the supertype.** The regex
      `data (?:object|class) (\w+)[^:\n]*: *(\w*Action)` matched
      `data class OpenAction(val action: LoanPrimaryAction, val loanId: Int) :
      LoanProfileEvent` and reported `LoanPrimaryAction.OpenAction` — an EVENT
      mis-read as an action, against a type that is a status-to-action
      vocabulary for the nav graph. The earlier triage recorded it as a
      "not an MVI action" false positive, which described the symptom but
      missed that the parse was simply wrong. The parameter list is now matched
      as a balanced group and discarded.
      After both fixes the sweep reports 0/13 features, and it still flags the
      group-detail defect it was written for when that menu is removed (RED
      re-validated).
    worth_sweeping: >-
      the lesson is about the tool, not the code: a checker that produces one
      wrong row makes its whole list untrustworthy, and both of these bugs
      produced findings that LOOKED plausible enough to triage and write down.
      Re-validate RED after any change to a checker's matching.
    fix_belongs_in: plan-layer checks/action-dispatch-sweep.py (done)
