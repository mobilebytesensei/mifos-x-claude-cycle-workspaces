  - id: 'client-feature-search-icons-unreachable'
    kind: destination-not-reachable-from-feature
    feature: client
    severity: advisory
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: open
    message: >-
      Several ported client screens have a SEARCH icon in their header
      (identifiers is the first) whose destination is `SearchRoute` in
      `cmp-navigation`. A feature module cannot depend on cmp-navigation (the
      dependency runs the other way), and the generated destination signature is
      fixed at `NavGraphBuilder.(NavController) -> Unit`, so it cannot be
