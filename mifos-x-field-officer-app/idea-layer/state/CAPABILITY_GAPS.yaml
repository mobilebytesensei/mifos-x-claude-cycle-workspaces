      This is the INVERSE of the dead-control defect "absent, never inert"
      guards against — not a button that does nothing, but a working
      destination with no button — and it is invisible to a dead-clickable
      audit, which looks for clickables with no handler. The question that
      catches both is the one spec §6a already asks: name the affordance in the
      RUNNING fork that opens this screen.
      Fixed by porting the menu with the three items whose destinations exist
