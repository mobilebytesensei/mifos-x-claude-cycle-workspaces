  - id: 'client-profile-rebuild-reverted'
    kind: ported-ui-diverged-from-original
    feature: client
    severity: error
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: operator
    status: resolved
    message: >-
      The screen the client list opens had been REBUILT rather than ported: a
      Scaffold + TopAppBar, raw Text identity fields, hand-rolled Charges/Notes
      rows and a loan/savings accounts section. The original
      (`clientProfile/ClientProfileScreen.kt`, 222 lines) is a "Profile" label,
      the primary-coloured ProfileCard, an "Actions" label and six MifosRowCard
      rows — and carries NO accounts at all; those live behind the General row
      in `clientGeneral`.
    root_cause: >-
      the earlier pass took "client detail" to mean the original's
      `clientDetails/ClientDetailsScreen.kt` (884 lines) and then rebuilt a
      smaller screen from it. But the client list navigates to
      `navigateToClientProfileRoute` — `clientDetails` is a SEPARATE legacy
