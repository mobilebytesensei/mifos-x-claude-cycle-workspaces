      `feature/client/profile/**` + `feature/client/general/**` ported faithfully;
      the `detail/` package deleted; route renamed ClientDetailRoute ->
      ClientProfileRoute to match the original. 106 tests green.
    prevention: >-
      §6a of FEATURE_LAYER_MIGRATION_SPEC already forbids this. What it did not
      say is that the ported screen must be identified by WHICH destination the
      calling screen actually navigates to, not by name resemblance. Worth
