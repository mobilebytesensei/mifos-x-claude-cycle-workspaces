  - id: 'refreshable-screen-content-had-zero-callers'
    kind: ported-but-unreachable
    feature: multiple
    severity: warning
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      `core-base/ui`'s `RefreshableScreenContent` — which wraps `ScreenContent`
      in a `PullToRefreshBox` and drives the M3 indicator off the stream's own
      `freshnessSignal.isRefreshing` — had ZERO callers anywhere in the fork.
      Another ported-but-unreachable primitive, in the same class as
      `AppBreadcrumbNavBar`, `LoanDisburseInput` and
      `provideGetChargeTemplateStore`.
      Found because the action-dispatch sweep flagged a NEW
      `SavingsSummaryAction.OnRefresh` with no dispatcher: the ViewModel wired
      it to `stream.refresh()` and no control sent it. Rather than delete the
      member (the choice the three pre-existing `OnRefresh` hits in
      feature/loan and feature/client are recorded for), the savings summary now
      uses the existing primitive — which gives the action its dispatcher, the
      screen a pull-to-refresh, and that primitive its first caller.
      `OnRetry` and `OnRefresh` also collapsed into ONE member, because
      `RefreshableScreenContent` routes both the error-state retry and the pull
      gesture to the same callback. Two members would have left one
      undispatched.
    worth_sweeping: >-
      the three pre-existing `OnRefresh`/`Refresh` hits recorded in
      `action-dispatch-sweep-found-21-actions-with-no-control` are the same
      opportunity rather than only dead code — those screens could adopt this
      primitive instead of dropping the member.
    fix_belongs_in: feature/savings (done), feature/loan + feature/client (open)
  - id: 'new-loan-preview-summary-read-the-previous-calculation'
    kind: carried-over-defect-fixed
    feature: loan
    severity: warning
    raised_at: '2026-10-21T00:00:00.000Z'
    raised_by: /implement
    status: resolved
    message: >-
      The original's schedule-summary block computed its principal from
      `state.repaymentSchedule` — the PREVIOUS calculation, or an empty default
      on first run — while the new schedule sat in `dataState.data`, the
      response in hand. So the figures shown belonged to the terms the officer
      had before the last edit, and on the first preview they were zero.
      `installment_paid` was additionally hardcoded to `"0"`.
      The port reads every figure from the response, and an edit to any
