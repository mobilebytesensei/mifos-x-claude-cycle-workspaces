# Per-feature pipeline status. Added 2026-10-05 — this file previously carried ONLY a
# `capabilities:` block, so `phase_rollup` had no per-feature rows to read and reported
# `approval: complete` against `enrichment: complete: 0`. A feature row is what makes the
# matrix non-vacuous.
