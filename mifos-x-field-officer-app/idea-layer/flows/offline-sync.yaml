# offline-sync — the field-preparation flow: choose records, sync them to the device, work offline.
#
# Project-level flow (cross-screen). Per-screen transitions live in `screens/offlineSync/flow.yaml`;
# this file is the graph that joins Offline sync to the screens it opens and the screens that open it.
# Derived by /idea-flows 2026-10-27 from screens/offlineSync/{ui,flow}.yaml.

schema_version: "1.0"
flow_id: offline-sync
name: Offline sync
description: "Settings → choose centres / groups / clients → background download → open them with no network; offline work goes to drafts."
entry_screen: offlineSync

screens:
  - { id: settings,      role: entry,   shell: detail }
  - { id: offlineSync,   role: hub,     shell: detail, note: "no bottom navigation — a Settings sub-screen" }
  - { id: centerDetail,  role: target,  shell: detail }
  - { id: groupsDetail,  role: target,  shell: detail }
  - { id: clientProfile, role: target,  shell: detail }
  - { id: syncAndDrafts, role: handoff, shell: detail, note: "uploads what was done offline" }

connections:
  - { from: settings,     to: offlineSync,   type: push, trigger: "Offline sync row" }
  - { from: centerList,   to: offlineSync,   type: push, trigger: "long-press → Download (job progress shows here)" }
  - { from: groupsList,   to: offlineSync,   type: push, trigger: "long-press → Download (job progress shows here)" }
  - { from: offlineSync,  to: settings,      type: pop,  trigger: "back" }
  - { from: offlineSync,  to: centerDetail,  type: push, trigger: "centre row" }
  - { from: offlineSync,  to: groupsDetail,  type: push, trigger: "group row" }
  - { from: offlineSync,  to: clientProfile, type: push, trigger: "client row" }
  - { from: offlineSync,  to: syncAndDrafts, type: push, trigger: "Sync & Drafts link (offline state)" }

exits:
  - { to: centerDetail,  when: "a synced centre is opened — works with no network" }
  - { to: syncAndDrafts, when: "the officer goes to upload what they did offline" }

failure_modes:
  - { id: read_refused, at: offlineSync, cause: "a downstream read answers 403/404", surfaces_as: result_card, recovery: "Retry failed re-runs only those reads; everything else stays on the device" }
  - { id: no_network,   at: offlineSync, cause: "device offline", surfaces_as: banner, recovery: "Sync now and Download disabled; synced records still open; the job resumes on reconnect" }
  - { id: killed,       at: offlineSync, cause: "process death mid-sync", surfaces_as: none, recovery: "the durable job continues; progress is read back from sync_job on reopen" }
