# account — the officer's own account: who am I signed in as, change my password, sign out.
#
# Project-level flow (cross-screen). Per-screen transitions live in `screens/profile/flow.yaml`;
# this file joins Profile to the screens that open it and the screens it opens.
# Derived by /idea-flows 2026-10-27 from screens/profile/{ui,flow}.yaml.

schema_version: "1.0"
flow_id: account
name: Account
description: "Home avatar → Profile → server settings, change password (stays signed in) or sign out."
entry_screen: profile

screens:
  - { id: home,         role: entry,   shell: tab }
  - { id: profile,      role: hub,     shell: detail, note: "back arrow, no bottom navigation" }
  - { id: serverConfig, role: target,  shell: detail }
  - { id: signin,       role: exit,    shell: none, note: "after sign out, or if re-sign-in after a password change fails" }

connections:
  - { from: home,    to: profile,      type: push,         trigger: "header avatar" }
  - { from: profile, to: home,         type: pop,          trigger: "back" }
  - { from: profile, to: serverConfig, type: push,         trigger: "Server settings" }
  - { from: profile, to: signin,       type: replace_root, trigger: "Sign out confirmed (Settings dialog)" }
  - { from: profile, to: signin,       type: replace_root, trigger: "re-sign-in failed after a password change" }

exits:
  - { to: signin,       when: "the officer signs out" }
  - { to: serverConfig, when: "the officer inspects or switches the server" }

failure_modes:
  - { id: name_unavailable,  at: profile, cause: "users/{id} fails with nothing cached", surfaces_as: inline_error, recovery: "the session identity stays; Retry re-reads" }
  - { id: no_network,        at: profile, cause: "device offline", surfaces_as: banner, recovery: "everything saved at sign-in shows; Change password disabled; Sign out still works" }
  - { id: password_refused,  at: profile, cause: "the server's password policy or repeat-match rejects the new password (400)", surfaces_as: sheet_error, recovery: "each server message under the fields; the old password stays valid" }
  - { id: reauth_failed,     at: profile, cause: "sign-in with the new password fails after the change", surfaces_as: none, recovery: "sign out keeping data, then sign in with the new password" }
