# BatchResponse — one answer in Fineract's POST /batches response list.

schema_version: "1.0"
dto: BatchResponse
kind: response
used_by:
  feature: offlineSync
  endpoint: batch_reads
  also: [home]

fields:
  - { name: requestId,  type: long,   nullable: true, note: "matches BatchRequest.requestId" }
  - { name: statusCode, type: int,    nullable: true, note: "the single request's own HTTP status (200 / 403 / 404 / 501)" }
  - { name: body,       type: string, nullable: true, note: "the single request's JSON body, as a STRING — decoded per row" }

sample:
  note: "Measured on the gateway 2026-10-27: 60 loan schedules, 60 × 200, 4.4 s, 1.4 MB."
  value:
    - { requestId: 1, statusCode: 200, body: "{\"id\":120,\"clientId\":5,\"currency\":{\"code\":\"MXN\"},\"repaymentSchedule\":{\"periods\":[…]}}" }

notes: >
  A non-200 row carries Fineract's own error body (developerMessage / defaultUserMessage / errors[]),
  which ServerErrorParser reads like any single-call failure, so a refused read shows the server's
  message on the dashboard. When every row of a batch fails, the first failure surfaces as the job's
  error; otherwise failed rows are recorded per record and the rest are kept.
