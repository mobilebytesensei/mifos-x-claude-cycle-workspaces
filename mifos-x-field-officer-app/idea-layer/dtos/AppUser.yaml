# AppUser — Fineract GET users/{userId}: the signed-in user's own record.

schema_version: "1.0"
dto: AppUser
kind: response
used_by:
  feature: profile
  endpoint: get_user             # screens/profile/api.yaml
  also: [home]                   # greeting first name + scope (DashboardRepository.userStream)

fields:
  - { name: id,                   type: long,         nullable: false }
  - { name: username,             type: string,       nullable: false }
  - { name: firstname,            type: string,       nullable: true,  note: "the gateway sends upper case ('IRVING') — the UI name-cases it" }
  - { name: lastname,             type: string,       nullable: true }
  - { name: email,                type: string,       nullable: true }
  - { name: officeId,             type: long,         nullable: false }
  - { name: officeName,           type: string,       nullable: true }
  - { name: staff,                type: StaffRef,     nullable: true,  note: "absent when the user has no staff link — then Home's scope is the office" }
  - { name: selectedRoles,        type: "list<Role>", nullable: true,  note: "the user's roles; availableRoles (every role on the tenant) is NOT used" }
  - { name: passwordNeverExpires, type: boolean,      nullable: true }

nested:
  StaffRef:
    - { name: id,          type: long,   nullable: false }
    - { name: displayName, type: string, nullable: true }

sample:
  note: "Measured on the gateway 2026-10-27 (fieldofficer @ apis.mifos.community, tenant mifos-bank-1)."
  value:
    id: 32
    username: "fieldofficer"
    firstname: "IRVING"
    lastname: "ZEPEDA"
    email: "oficial.campo@gmail.com"
    officeId: 1
    officeName: "CENTRAL"
    staff: null
    selectedRoles: [{ name: "OFICIAL DE CAMPO" }]    # id not recorded
    passwordNeverExpires: true
