# Role — a Fineract role carried in PostAuthenticationResponse.roles[].

schema_version: "1.0"
dto: Role
kind: nested
used_by:
  feature: signin
  parent_dto: PostAuthenticationResponse
  parent_field: roles

fields:
  - { name: id,          type: int,     nullable: true }
  - { name: name,        type: string,  nullable: true }
  - { name: description, type: string,  nullable: true }
  - { name: disabled,    type: boolean, nullable: true }

sample:
  note: "From the real captured response, 2026-10-02 (fieldofficer @ apis.mifos.community)."
  value: { id: 12, name: "OFICIAL DE CAMPO", description: "OFICIAL DE CAMPO", disabled: false }

notes: >
  The live demo instance returns role names in Spanish while the rest of the payload is English, so
  anything rendering a role must not assume the app's locale. The sign-in screen does not display
  roles; this DTO exists because the response carries them and a DTO that silently drops a field
  cannot round-trip.

  Nullable throughout for the same reason as the parent: the client does not set `expectSuccess`,
  so a non-2xx body deserializes onto defaults, and a non-null field would make that a crash rather
  than a detectable empty result.
