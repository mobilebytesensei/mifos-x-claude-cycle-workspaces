# BatchRequest — one request inside Fineract's POST /batches (a list of these is the body).

schema_version: "1.0"
dto: BatchRequest
kind: request
used_by:
  feature: offlineSync
  endpoint: batch_reads          # screens/offlineSync/api.yaml
  also: [home]                   # Today's collections fallback (schedules of the officer's loans)

fields:
  - { name: requestId,   type: long,   nullable: false, note: "unique within the batch; echoed back on the response" }
  - { name: relativeUrl, type: string, nullable: false, note: "path + query relative to the API root, e.g. loans/1439?associations=repaymentSchedule" }
  - { name: method,      type: string, nullable: false, note: "GET for every offline-sync read" }

sample:
  note: "Measured on the gateway 2026-10-27 (fieldofficer @ apis.mifos.community, tenant mifos-bank-1)."
  value:
    - { requestId: 1, relativeUrl: "loans/120?associations=repaymentSchedule", method: "GET" }
    - { requestId: 2, relativeUrl: "loans/121?associations=repaymentSchedule", method: "GET" }

notes: >
  Sent with ?enclosingTransaction=false so each request is answered independently and one refusal
  never fails the rest. ≤100 per call bounds one response (~24 KB a schedule). A relativeUrl the batch
  API does not route answers 501 "Resource with method GET and relativeUrl … doesn't exist" — that row
  falls back to its single call.
