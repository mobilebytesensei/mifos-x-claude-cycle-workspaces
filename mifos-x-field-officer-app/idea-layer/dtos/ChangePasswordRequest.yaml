# ChangePasswordRequest — Fineract POST users/{userId}/pwd: the signed-in user changes their own password.

schema_version: "1.0"
dto: ChangePasswordRequest
kind: request
used_by:
  feature: profile
  endpoint: change_password      # screens/profile/api.yaml

fields:
  - { name: password,       type: string, nullable: false, note: "never logged, never cached" }
  - { name: repeatPassword, type: string, nullable: false, note: "the server rejects a mismatch itself (parameterName repeatPassword)" }

server_validation:
  measured: "2026-10-27, gateway (Fineract 1.17.0-SNAPSHOT); probes used mismatched pairs so nothing changed"
  policy: "12 to 50 characters, at least one upper case, one lower case, one digit and one special character, no spaces, no consecutive repeating characters"
  errors:
    - { parameterName: password,       defaultUserMessage: "Password must be 12 to 50 characters long, containing at least one uppercase letter, one lowercase letter, one numeric digit, and one special character, with no spaces or consecutive repeating characters" }
    - { parameterName: repeatPassword, defaultUserMessage: "The parameter `repeatPassword` is not equal to password." }
  envelope: "400 { defaultUserMessage: 'Validation errors exist.', errors[] } — the screen shows errors[].defaultUserMessage, not the envelope"

sample:
  value: { password: "Field#Office2026", repeatPassword: "Field#Office2026" }
