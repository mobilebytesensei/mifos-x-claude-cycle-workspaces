# PostAuthenticationRequest — the credential payload for POST authentication.
#
# idea-layer-first (P4 Q1): this file is the CONTRACT. Server and client implementations must match
# it; divergence is a contract violation, not a local detail.

schema_version: "1.0"
dto: PostAuthenticationRequest
kind: request
used_by:
  feature: signin
  endpoint: authentication
  method: POST

serialization:
  format: json
  content_type: application/json
  note: >
    `Content-Type: application/json` is REQUIRED on the wire. ContentNegotiation only serializes a
    body whose request declares a type it has a converter for, and a Ktorfit `@Body` sets none.
    Without the header Ktor throws before opening a socket, and the screen renders "Login failed"
    with no HTTP log at all. Declared on the access point, not per-call.

fields:
  - name: username
    type: string
    required: true
    constraints:
      min_length: 4
      rule: "kpt.core.domain.validation.CredentialRules.username"
    note: >
      CASE-SENSITIVE on the Fineract side. min_length 4 is v1's own rule (UsernameValidationUseCase);
      an authored replacement used 5 and rejected four-character usernames that signed in on v1.

  - name: password
    type: string
    required: true
    constraints:
      min_length: 6
      rule: "kpt.core.domain.validation.CredentialRules.password"
    handling:
      in_memory: "kpt.core.base.security.SensitiveString (AutoCloseable, zeroes its CharArray)"
      persisted: false
      note: >
        NEVER persisted. v1 wrote the raw password into preferences; nothing read it, because every
        consumer uses `username` or `base64EncodedAuthenticationKey`. Locked by
        `theRawPasswordIsNeverPersisted`.

# ──────────────── CONTRACT PROPERTIES ────────────────
invariants:
  - "Exactly these two fields. The gateway rejects anything else; order is irrelevant, presence is not."
  - "Values are passed through unmodified: no trimming, no case-folding, no re-encoding. A password silently transformed here would fail against a server that accepts it."

locked_by:
  - "core/network AuthDtoContractTest.theRequestSerializesTheTwoFieldsTheGatewayExpects"
  - "core/data AuthCommandRepositoryTest.theCredentialReachesTheEndpointUnmodified"
