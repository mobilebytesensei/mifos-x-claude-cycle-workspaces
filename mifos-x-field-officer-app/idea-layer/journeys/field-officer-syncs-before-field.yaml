# Journey — a field officer syncs a centre before going into the field, then opens it with no signal.
#
# Derived by /idea-flows 2026-10-27 from flows/offline-sync.yaml (entry_screen offlineSync + connections).
# Each step names the screen, the action, and the SUCCESS SIGNAL that proves it happened.

schema_version: "1.0"
journey_id: field-officer-syncs-before-field
name: "Field officer syncs a centre before going into the field"
persona: field-officer
priority: P1
flow_id: offline-sync

description: >
  The morning routine before a meeting in a village with no signal: put the centre on the phone while
  still on the office Wi-Fi, then open it in the field. Download-only — anything the officer records
  out there becomes a draft that Sync & Drafts uploads later.

preconditions:
  - "signed in, online"
  - "Centro Las Flores is not on the device yet"

screen_sequence:
  - step: 1
    screen: settings
    state: content
    action: "tap Offline sync"
    success_signal: "Offline sync opens with no bottom navigation; the header shows the Centres / Groups / Clients counts"

  - step: 2
    screen: offlineSync
    state: content
    action: "tap Add records"
    success_signal: "the picker sheet opens on the Centres tab; centres already on the device show 'On device'"

  - step: 3
    screen: offlineSync
    state: content
    action: "select Centro Las Flores, tap Download 1 for offline"
    success_signal: "the sheet closes and Centro Las Flores appears under Centres as Waiting to sync"

  - step: 4
    screen: offlineSync
    state: syncing
    action: "observe"
    success_signal: "the active job card's read count rises without any refresh, and the row shows Syncing… with a percentage"

  - step: 5
    screen: offlineSync
    state: content
    action: "await job finish"
    success_signal: "Centro Las Flores shows Synced just now; the Groups and Clients tabs gained its 3 groups and 27 clients, each 'via Centro Las Flores'"

  - step: 6
    screen: offlineSync
    state: offline
    action: "turn on airplane mode"
    success_signal: "the offline banner shows; Sync now is disabled; every record still lists"

  - step: 7
    screen: centerDetail
    state: content
    action: "tap Centro Las Flores"
    success_signal: "the centre, a group, a client, a loan (including a closed one) and a document all open with no network error"

  - step: 8
    screen: syncAndDrafts
    state: content
    action: "record a repayment offline, then open Sync & Drafts from the offline-state link"
    success_signal: "the repayment is listed as a draft waiting to upload — not on Offline sync"

failure_paths:
  - { at_step: 5, when: "a read is refused (403)", expect: "partial_failure: the result card names the read and the server message; Retry failed re-runs only it" }
  - { at_step: 4, when: "the app is killed", expect: "on reopen the job is still running or finished — never restarted from zero" }
