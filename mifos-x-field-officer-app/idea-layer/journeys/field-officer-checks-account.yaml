# Journey — a field officer checks who they are signed in as, then changes their password.
#
# Derived by /idea-flows 2026-10-27 from flows/account.yaml (entry_screen profile + connections).
# Each step names the screen, the action, and the SUCCESS SIGNAL that proves it happened.

schema_version: "1.0"
journey_id: field-officer-checks-account
name: "Field officer checks their account and changes their password"
persona: field-officer
priority: P1
flow_id: account

description: >
  An officer handed a shared demo phone wants to be sure whose account and which server it is on, and
  then sets their own password. The password change must not sign them out mid-day.

preconditions:
  - "signed in as fieldofficer on the field officer gateway, online"

screen_sequence:
  - step: 1
    screen: home
    state: content
    action: "tap the IZ avatar beside the greeting"
    success_signal: "Profile opens with a back arrow and no bottom navigation"

  - step: 2
    screen: profile
    state: content
    action: "read the identity and session"
    success_signal: "Irving Zepeda, fieldofficer, OFICIAL DE CAMPO, CENTRAL; 'What Home shows: Office: CENTRAL'; Mifos field officer gateway with Live and tenant mifos-bank-1"

  - step: 3
    screen: profile
    state: change_password
    action: "tap Change password, type two different passwords"
    success_signal: "'Passwords do not match' shows under the second field and Save password stays disabled"

  - step: 4
    screen: profile
    state: change_password
    action: "type a policy-valid password twice, tap Save password"
    success_signal: "the sheet closes with 'Password changed'"

  - step: 5
    screen: home
    state: content
    action: "go back to Home and pull to refresh"
    success_signal: "the cards reload with no sign-in prompt — the new session key is in use"

failure_paths:
  - { at_step: 4, when: "the server rejects the password (policy)", expect: "the server's message under the fields; the sheet stays open; the old password still works" }
  - { at_step: 2, when: "the device is offline", expect: "offline banner; identity from sign-in; Change password disabled with a reason" }
