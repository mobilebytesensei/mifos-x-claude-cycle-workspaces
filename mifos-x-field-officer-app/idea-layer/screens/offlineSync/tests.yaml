# screens/offlineSync/tests.yaml — emitted by /idea-feature-enrich Phase 3 (sub-plan 05 T4)
# schema_version: v1.0.0  source: idea-feature-enrich  feature: offlineSync
# Download-only (operator 2026-10-27): offline actions are drafts — their upload is tested under Sync & Drafts.
schema_version: v1.0.0
feature: offlineSync
state_coverage: [loading, content, syncing, partial_failure, empty, offline]
scenarios:
  - id: loading_initial_render
    preconditions: ["user is signed in", "the local job and record tables are opening"]
    actions: ["open Settings → Offline sync"]
    assertions: ["the header renders at once from local state", "the records list shows shimmer, not a blocking spinner"]
    priority: low
  - id: content_three_level_inventory
    preconditions: ["Centro Arin (3 groups, 31 clients) and Arin Savings (2 groups, 11 clients) are on the device", "Irving Zamora is chosen on his own"]
    actions: ["open Settings → Offline sync", "tap the Groups tab", "tap the Clients tab", "on Centres, expand Centro Arin"]
    assertions: ["the header and tabs show 2 centres · 5 groups · 43 clients", "Groups lists all 5, each 'via' its centre", "Clients lists all 43 with Irving Zamora marked chosen", "Centro Arin expands to its 3 groups with their status"]
    priority: high
  - id: content_dashboard_shows_what_needs_sync
    preconditions: ["Arin Savings is chosen but never synced", "Irving Zamora was synced 2 days ago", "the rest synced 2 h ago"]
    actions: ["open Settings → Offline sync"]
    assertions: ["header shows 3 to sync", "Arin Savings shows Waiting to sync and Irving Zamora shows Out of date, listed first on their levels", "synced records show their synced-at time"]
    priority: high
  - id: content_pick_and_download
    preconditions: ["user is signed in and online", "Centro Las Flores is not on the device"]
    actions: ["tap Add records", "select Centro Las Flores on the Centres tab", "tap Download 1 for offline"]
    assertions: ["the picker closes", "Centro Las Flores appears under Centres as Waiting, then Syncing", "an Active job appears with done/total advancing", "its groups and clients join the Groups and Clients tabs as they sync"]
    priority: high
  - id: content_open_synced_record_offline
    preconditions: ["Centro Arin is synced", "the device is in airplane mode"]
    actions: ["tap Centro Arin under On this device", "open one of its groups, a client, a loan, a closed loan and a document"]
    assertions: ["every screen renders from the device", "no network error is shown"]
    priority: high
  - id: content_offline_action_becomes_draft
    preconditions: ["FOTest Asha is synced", "the device is in airplane mode"]
    actions: ["open FOTest Asha's loan", "record a repayment"]
    assertions: ["the repayment is saved as a draft under Settings → Sync & Drafts", "Offline sync does not list it"]
    priority: high
  - id: syncing_progress_live
    preconditions: ["a download job for 2 records is running"]
    actions: ["stay on the screen for 10 seconds"]
    assertions: ["the active job card's done count increases without a refresh", "the record being synced shows Syncing… with its percentage"]
    priority: high
  - id: syncing_survives_leaving_and_restart
    preconditions: ["a download job is running"]
    actions: ["leave the screen", "kill the app", "reopen Settings → Offline sync"]
    assertions: ["the job is still running or finished — it was not lost", "its progress continued while the screen was closed"]
    priority: high
  - id: syncing_cancel
    preconditions: ["a download job is running"]
    actions: ["tap Cancel on the active job"]
    assertions: ["the job is marked cancelled", "records it already finished stay synced", "the rest return to Waiting to sync"]
    priority: medium
  - id: partial_failure_retry_failed_reads
    preconditions: ["the last job finished with 3 failed reads"]
    actions: ["open the screen", "tap Retry failed"]
    assertions: ["the result card lists each failure with the server's message", "the affected records show N failed and their level tabs carry a dot", "the new job runs only the 3 failed reads"]
    priority: medium
  - id: content_automatic_refresh_schedules
    preconditions: ["sync mode is Manual"]
    actions: ["choose Automatic", "choose Every 6 h", "turn on Wi-Fi only"]
    assertions: ["exactly one periodic job is scheduled with a 6 h period and an unmetered-network constraint", "it re-syncs only the chosen records", "the header shows the next sync time"]
    priority: medium
  - id: content_manual_refresh_cancels_schedule
    preconditions: ["sync mode is Automatic"]
    actions: ["choose Manual"]
    assertions: ["the periodic job is cancelled", "nothing downloads until Sync now is tapped"]
    priority: medium
  - id: content_remove_record_keeps_shared
    preconditions: ["a client is chosen on its own AND is under a synced centre"]
    actions: ["tap Remove on the client", "confirm"]
    assertions: ["the client stays under Clients, now 'via' its group", "its data still opens offline through the centre"]
    priority: low
  - id: empty_first_open
    preconditions: ["nothing on the device"]
    actions: ["open Settings → Offline sync"]
    assertions: ["the three level counts show 0", "the empty explanation is shown", "Add records is the primary action"]
    priority: low
  - id: offline_banner_and_disabled_sync
    preconditions: ["the device has no network", "records are synced"]
    actions: ["open Settings → Offline sync"]
    assertions: ["the offline banner shows", "Sync now and Download are disabled", "all three levels still list and open", "a link points to Sync & Drafts for offline work"]
    priority: medium
