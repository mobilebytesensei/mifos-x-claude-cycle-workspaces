<!doctype html>
<!-- render-hash: os-loading-02 -->
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Offline sync: loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#4338CA;
--background:#FAFAFB;--surface:#FFFFFF;--on-surface:#0F172A;--surface-variant:#E2E8F0;--on-surface-variant:#475569;
--outline-variant:#CBD5E1;
--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;--touch:48px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-surface);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:420px;min-height:100dvh;display:flex;flex-direction:column}
.sym{font-family:'Material Symbols Rounded';line-height:1;display:inline-block;font-size:22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--sp-xs);height:64px;padding:0 var(--sp-xs);background:var(--background)}
.topbar h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.icon-btn{width:var(--touch);height:var(--touch);display:grid;place-items:center;border-radius:var(--r-pill);color:var(--on-surface-variant)}
main{flex:1;padding:0 var(--sp-lg) var(--sp-xl);display:flex;flex-direction:column;gap:var(--sp-lg)}
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--r-lg);box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 12px rgba(15,23,42,.04);padding:var(--sp-lg);display:flex;flex-direction:column;gap:var(--sp-md)}
.sk{background:linear-gradient(90deg,var(--surface-variant) 0%,#F1F5F9 50%,var(--surface-variant) 100%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.chips{display:flex;gap:var(--sp-sm)}
.chip{height:32px;border-radius:var(--r-pill)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-sm)}
.lv{height:70px;border-radius:var(--r-md)}
.line{height:14px}
.btn{height:var(--touch);border-radius:var(--r-pill)}
.tabs{display:flex;gap:var(--sp-sm)}
.tab{height:36px;width:96px}
.row{display:flex;align-items:center;gap:var(--sp-md);padding:var(--sp-sm) 0;border-top:1px solid var(--surface-variant)}
.ava{width:40px;height:40px;border-radius:var(--r-md);flex:none}
.rt{flex:1;display:flex;flex-direction:column;gap:6px}
</style></head>
<body><div class="phone" data-testid="offline_sync_screen">
<header class="topbar"><button class="icon-btn" aria-label="Back"><span class="sym">arrow_back</span></button><h1>Offline sync</h1></header>
<main data-testid="offline_sync_skeleton" aria-busy="true">
  <section class="card" data-testid="offline_sync_header">
    <div class="chips"><span class="sk chip" style="width:84px"></span><span class="sk chip" style="width:96px"></span></div>
    <div class="levels"><span class="sk lv"></span><span class="sk lv"></span><span class="sk lv"></span></div>
    <span class="sk line" style="width:52%"></span>
    <span class="sk btn"></span>
  </section>
  <section class="card">
    <span class="sk line" style="width:38%;height:18px"></span>
    <div class="tabs"><span class="sk tab"></span><span class="sk tab"></span><span class="sk tab"></span></div>
    <div class="row"><span class="sk ava"></span><div class="rt"><span class="sk line" style="width:50%"></span><span class="sk line" style="width:74%;height:12px"></span><span class="sk line" style="width:40%;height:10px"></span></div></div>
    <div class="row"><span class="sk ava"></span><div class="rt"><span class="sk line" style="width:42%"></span><span class="sk line" style="width:66%;height:12px"></span><span class="sk line" style="width:34%;height:10px"></span></div></div>
    <div class="row"><span class="sk ava"></span><div class="rt"><span class="sk line" style="width:56%"></span><span class="sk line" style="width:60%;height:12px"></span><span class="sk line" style="width:38%;height:10px"></span></div></div>
  </section>
</main>
</div></body></html>
