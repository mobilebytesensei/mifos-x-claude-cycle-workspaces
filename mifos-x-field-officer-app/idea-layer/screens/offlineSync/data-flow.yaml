feature: offlineSync
# Download-only (operator 2026-10-27): this screen syncs the officer's CHOSEN records to the device.
# Work done offline is saved as drafts and uploaded by Settings → Sync & Drafts — not read here.
entries:
  - trigger: on_mount
    source: local.sync_jobs           # Room sync_job — the running job and the last finished one
    target_state: content
    loading_state: loading
    note: "observed, not read once — every progress write re-renders the active job card"
  - trigger: on_mount
    source: local.offline_records     # Room offline_record — the chosen records + per-record sync status
    target_state: content
    note: "status ∈ waiting | syncing | synced | out_of_date | failed; out_of_date derived from refreshedAt vs the refresh interval"
  - trigger: on_mount
    source: prefs.offline_refresh     # mode, interval, wifiOnly, chargingOnly
    target_state: content
  - trigger: on_mount
    source: network_monitor.is_online
    target_state: offline
    note: "offline is a banner over content, never a blank screen"
  - trigger: on_open_picker
    source: api.list_centres
    target_state: record_picker
    loading_state: record_picker.loading
    error_state: record_picker.error
    on_error:
      nav_target: null
      error_code: network_error
  - trigger: on_picker_tab
    source: "api.list_groups | api.list_clients"
    target_state: record_picker
derived:
  state_rule: >-
    loading until the three local sources first emit; syncing while a job is RUNNING; partial_failure
    when the last finished job has failures; empty when no records are chosen; offline overlay when
    the device has no network; else content.
