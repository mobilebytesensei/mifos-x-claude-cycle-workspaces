vm_actions:
  - name: SyncNow
    signature: fun syncNow()
    state_mutations: []
    side_effects:
      - OfflineSyncRepository.syncNow() — enqueues a download of every chosen record waiting / out of date / failed
    error_handling:
      Offline: button disabled; nothing enqueued
  - name: CancelJob
    signature: 'fun cancelJob(jobId: Long)'
    state_mutations: []
    side_effects:
      - OfflineSyncRepository.cancel(jobId)
    error_handling: {}
  - name: RetryFailed
    signature: 'fun retryFailed(jobId: Long)'
    state_mutations: []
    side_effects:
      - OfflineSyncRepository.retryFailed(jobId) — new job over the failed reads only
    error_handling: {}
  - name: RecordsLevel
    signature: 'fun recordsLevel(level: RecordLevel)'
    state_mutations:
      - records.level=level
    side_effects: []
    error_handling: {}
  - name: ToggleExpand
    signature: 'fun toggleExpand(record: OfflineRecord)'
    state_mutations:
      - records.expanded ^= record.key
    side_effects: []
    error_handling: {}
  - name: SetRefreshMode
    signature: 'fun setRefreshMode(mode: RefreshMode)'
    state_mutations:
      - refresh.mode=mode
    side_effects:
      - OfflineSyncRepository.setRefresh(settings) — schedule or cancel 'offline-refresh'
    error_handling: {}
  - name: SetRefreshInterval
    signature: 'fun setRefreshInterval(hours: Int)'
    state_mutations:
      - refresh.intervalHours=hours
    side_effects:
      - reschedule 'offline-refresh' (same unique name)
    error_handling: {}
  - name: SetWifiOnly
    signature: 'fun setWifiOnly(on: Boolean)'
    state_mutations:
      - refresh.wifiOnly=on
    side_effects:
      - reschedule 'offline-refresh'
    error_handling: {}
  - name: SetChargingOnly
    signature: 'fun setChargingOnly(on: Boolean)'
    state_mutations:
      - refresh.chargingOnly=on
    side_effects:
      - reschedule 'offline-refresh'
    error_handling: {}
  - name: OpenRecord
    signature: 'fun openRecord(record: OfflineRecord)'
    state_mutations: []
    side_effects:
      - event OpenRecord(kind, id) → centre / group / client detail
    error_handling: {}
  - name: OpenDrafts
    signature: fun openDrafts()
    state_mutations: []
    side_effects:
      - event OpenDrafts → Settings → Sync & Drafts (SyncAndDraftsRoute)
    error_handling: {}
  - name: RefreshRecord
    signature: 'fun refreshRecord(record: OfflineRecord)'
    state_mutations: []
    side_effects:
      - OfflineSyncRepository.enqueueDownload(listOf(record.target))
    error_handling:
      Offline: record marked waiting; runs when online
  - name: RemoveRecord
    signature: 'fun removeRecord(record: OfflineRecord)'
    state_mutations:
      - confirmRemove=null
    side_effects:
      - OfflineSyncRepository.removeFromDevice(record.target) — reference-counted cache delete
    error_handling: {}
  - name: AddRecords
    signature: fun openPicker()
    state_mutations:
      - picker.visible=true
      - picker.tab=CENTRES
    side_effects:
      - start the centres list stream
    error_handling: {}
  - name: PickerTab
    signature: 'fun pickerTab(tab: PickerTab)'
    state_mutations:
      - picker.tab=tab
    side_effects:
      - start that tab's list stream
    error_handling:
      Offline: tab shows the offline state; selection kept
  - name: PickerSearch
    signature: 'fun pickerSearch(query: String)'
    state_mutations:
      - picker.query=query
    side_effects: []
    error_handling: {}
  - name: PickerSelect
    signature: 'fun pickerSelect(target: SyncTarget)'
    state_mutations:
      - picker.selection ^= target
    side_effects: []
    error_handling: {}
  - name: PickerDownload
    signature: fun pickerDownload()
    state_mutations:
      - picker.visible=false
      - picker.selection=empty
    side_effects:
      - OfflineSyncRepository.choose(selection) — rows as waiting
      - OfflineSyncRepository.enqueueDownload(selection)
    error_handling:
      Offline: button disabled
error_cases:
