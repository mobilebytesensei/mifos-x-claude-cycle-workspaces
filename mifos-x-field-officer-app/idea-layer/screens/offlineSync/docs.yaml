decisions:
  - id: download-only
    decision: >-
      Offline sync ONLY brings the chosen records to the device so the officer can work without network. Actions taken
      offline are saved as drafts and Settings → Sync & Drafts uploads them when the network returns. This screen has no
      upload section and makes no writes to the server; in the offline state it links to Sync & Drafts.
    why: >-
      operator 2026-10-27 — "This offline sync only responsible for syncing records locally so field officer can sync
      before going in field and does actions without network and save in draft and sync it later"
  - id: separate-from-drafts
    decision: >-
      Offline sync is its own Settings row and screen; Settings → Sync & Drafts stays the place for drafts and their
      upload.
    why: operator 2026-10-27 — "this is different feature from Settings -> Sync & Draft"
  - id: settings-sub-screen-shell
    decision: >-
      No bottom navigation: a back arrow and the "Offline sync" title only (ui.yaml#shell overrides the app-shell
      default). Layout archetype list_screen — app bar, level chip row, list — never a KPI dashboard hero.
    why: the first Stitch pass on the dashboard archetype invented "99.7% ready" heroes and upload queues (2026-10-27)
  - id: three-level-inventory
    decision: >-
      "On this device" shows the full local (Room) inventory at three levels — Centres / Groups / Clients tabs with
      their counts, and the same three totals in the header. Every record held locally appears at its level, whether
      chosen directly or brought in through a parent (shown "via Centro Arin"); centres expand to their groups and
      groups to their clients. Refresh and Remove sit on chosen records; a via-parent record is managed through its
      parent. The Clients tab has a local search.
    why: >-
      operator 2026-10-27 — "this going to show full dashboard what's in the room locally records wise on three level
      Center, Group, Client"
  - id: sync-status-dashboard
    decision: >-
      Every record shows its sync status — Waiting to sync, Syncing…, Synced <time>, Out of date (older than the refresh
      interval, or 24 h on manual), N failed — needs-sync first; a level tab carries a dot when any record in it failed.
      The header counts records to sync.
    why: operator 2026-10-27 — "user will have dashboard of what need to be synced"
  - id: select-existing-records
    decision: >-
      The officer selects EXISTING server records in a picker (Centres / Groups / Clients tabs, search, multi-select,
      already-on-device marked) and taps Download for offline.
    why: operator 2026-10-27 — the officer decides what to carry into the field
  - id: full-downstream-tree
    decision: >-
      Centre → its record, members, meeting calendar, accounts, notes, datatables → every group. Group → its record,
      associations, accounts, notes, datatables, group loans and savings → every client. Client → its record, image,
      addresses, identifiers, collateral, notes, charges, documents WITH file contents, datatables, all accounts → every
      loan (loan + transactions, repayment schedule, charges, reschedules, notes, documents, datatables, repayment and
      transaction templates) and every savings account (account + transactions, charges, notes, documents, datatables,
      transaction templates). Global templates once per run (loan and savings products, client template, datatable
      definitions, offices, staff). The templates are what lets offline actions be captured as drafts.
    why: operator 2026-10-27 — "it will sync all down stream records ... all type so on"
  - id: closed-accounts-included
    decision: Closed loans and savings accounts are downloaded with their history.
    why: operator 2026-10-27
  - id: documents-with-contents
    decision: Document file contents are downloaded, not only the document list.
    why: operator 2026-10-27
  - id: same-stores-as-screens
    decision: >-
      Every downloaded read goes through the store, with the key, that the record's own screen reads — "synced" means
      the screen opens offline, not that a parallel table was filled. A record shared by two chosen records is fetched
      once.
    why: the existing OfflineDownloadRepository contract, kept
  - id: background-job
    decision: >-
      Work runs in a durable background job (sync/ module, worker-kmp WorkScheduler) — it survives leaving the screen
      and process death, runs one at a time, needs a network, and shows an Android progress notification. Loan and
      datatable reads use Fineract POST /batches; the gateway routes no other GET through batches (501, probed
      2026-10-27), so those go single, 5 in flight.
    why: a centre of 10 groups × 10 clients is ~3,000 reads; loans are the bulk and they batch
  - id: refresh-mode
    decision: >-
      The officer chooses Manual (default — records sync only on Sync now / per-record Refresh) or Automatic (every 1 h,
      6 h, 12 h or 24 h; Wi-Fi only on/off; only while charging on/off). Either way only the CHOSEN records sync — the
      officer controls how much data comes to the device. Automatic is ONE named periodic job, rescheduled on change and
      cancelled on Manual and on sign-out. iOS runs it "at most every N h".
    why: >-
      operator 2026-10-27 — "they want it to manual or automatic as this sync alot of data to device and it only sync
      the user choosen records only"
  - id: list-download-same-path
    decision: >-
      The centre and group lists' long-press download adds the record to the chosen records and enqueues the same
      background job.
    why: a download started from a list must not die when the list is closed
handoff_to_drafts:
  note: >-
    Out of this feature's scope, recorded so it is not lost: today an offline loan repayment goes to loanRepaymentQueue
    (OfflineQueueRepository.enqueueLoanRepayment, dialog "Saved to Sync — Sync from Offline Sync") and nothing ever
    uploads it. Per download-only, that path must become a draft that Sync & Drafts uploads, and the dialog copy must
    point there. Tracked as a Sync & Drafts work item.
permission_model:
  note: >-
    Download needs the READ_* codes of what it reads (READ_CENTER, READ_GROUP, READ_CLIENT, READ_LOAN,
    READ_SAVINGSACCOUNT, READ_DOCUMENT, READ_*NOTE, READ_<datatable>). A read the server refuses is reported per record
    (N failed, with the server's message), never as a whole-job failure.
states_summary:
  - loading
  - content
  - syncing
  - partial_failure
  - empty
  - offline
metadata:
  category: composite
  implementation_ready: true
  impl_ready_at: '2026-10-27T16:30:00Z'
  impl_ready_schema: v2
contracts:
  - capability: background-work
    platform_spec: >-
      worker-kmp unique one-time work 'offline-sync' (KEEP while running) + periodic work 'offline-refresh'; NetworkType
      CONNECTED (UNMETERED when Wi-Fi only), requiresCharging when set; Android foreground progress notification
    permission: post_notifications
    error_cases:
      - WorkCancelled
      - ConstraintNotMet
      - ProcessKilled
  - capability: database
    platform_spec: >-
      Room: sync_job (id, status, done, total, currentLabel, failures, timestamps) + offline_record (kind, id, name,
      parentKind, parentId, chosen, counts, status, refreshedAt, failedCount) — DB v20; the three-level inventory is
      offline_record grouped by kind, parent links give 'via' + expand
    permission: none
    error_cases:
      - DiskFull
      - MigrationFailed
  - capability: network
    platform_spec: >-
      Fineract REST GETs through the existing ScreenDataStream stores; POST /batches (≤100) for loan + datatable reads,
      single calls otherwise; document attachments as bytes
    permission: none
    error_cases:
      - Offline
      - Forbidden403
      - NotFound404
      - ServerError5xx
  - capability: preferences
    platform_spec: 'multiplatform-settings (core/datastore): offline refresh mode, interval hours, wifiOnly, chargingOnly'
    permission: none
    error_cases: []
