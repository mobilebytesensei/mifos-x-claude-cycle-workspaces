schema_version: '3.1'
id: offlineSync
name: Offline sync
description: >
  Settings → Offline sync. Before going into the field, the officer chooses existing server records — centres, groups or
  clients — and syncs them to the device; a background job downloads each one's full downstream tree so every screen of
  those records opens with no network. It is DOWNLOAD-ONLY: what the officer does offline is saved as drafts and
  uploaded later by Settings → Sync & Drafts. The dashboard shows EVERYTHING stored locally at three levels — Centre,
  Group, Client — each record with its sync status (waiting, syncing, synced, out of date, failed), plus the running
  job's progress; the officer chooses whether the chosen records sync manually or automatically — syncing moves a lot of
  data, so only the chosen records come down.
