# offlineSync — demo data (RULE-PROTO-CONTENT-001: realistic, no placeholders).
# Gateway shapes (mifos-bank-1, MXN), names from the field-officer demo tenant.
# `items` carries one entry per card; `inventory` is the on-device (Room) inventory the
# offline_records_section binds to, at three levels; `picker` binds the record picker.
# Download-only — no upload rows (drafts own those).

schema_version: "3.1"
feature: offlineSync

items:
  - id: offline_sync_demo_header
    card: summary_header
    title: "Offline sync"
    subtitle: "Last synced 2 h ago · Manual"
    online: true
    toSync: 3
    levelTotals: { centres: 2, groups: 5, clients: 43 }
    created_at: "2026-03-05T09:10:00Z"
  - id: offline_sync_demo_refresh
    card: refresh_mode_card
    title: "Refresh"
    mode: manual
    interval: 6h
    wifiOnly: true
    chargingOnly: false
    created_at: "2026-03-05T09:10:00Z"
  - id: offline_sync_demo_active
    card: active_job_card
    title: "Downloading 2 records"
    done: 312
    total: 1040
    currentLabel: "Client FOTest Asha · loans"
    created_at: "2026-03-05T09:12:00Z"
  - id: offline_sync_demo_result
    card: job_result_card
    title: "Done · 1,037 synced · 3 failed"
    failedItems:
      - { label: "Loan 000001475 · documents", error: "Access denied (403): User has no authority to: READ_DOCUMENT" }
      - { label: "FOTest Asha · datatable DATOS_CONTACTO", error: "Access denied (403): Not authorised to read datatable: DATOS_CONTACTO" }
      - { label: "Irving Zamora · document “INE frente.jpg”", error: "Not found (404): Document with identifier 88 does not exist" }
    created_at: "2026-03-05T09:40:00Z"

inventory:
  centres:
    - { id: 10, name: "Centro Arin",  detail: "3 groups · 31 clients · 74 accounts", origin: chosen, status: synced,  statusLine: "Synced 2 h ago",
        groups: [ { id: 84, name: "MARIPOSAS MONARCAS", detail: "12 clients", status: synced },
                  { id: 85, name: "Las Margaritas", detail: "10 clients", status: synced },
                  { id: 86, name: "Girasoles", detail: "9 clients", status: failed, statusLine: "2 failed" } ] }
    - { id: 18, name: "Arin Savings", detail: "2 groups · 11 clients", origin: chosen, status: waiting, statusLine: "Waiting to sync · chosen just now" }
  groups:
    - { id: 84, name: "MARIPOSAS MONARCAS", detail: "12 clients · 27 accounts", origin: "via Centro Arin", status: synced, statusLine: "Synced 2 h ago" }
    - { id: 85, name: "Las Margaritas",     detail: "10 clients · 22 accounts", origin: "via Centro Arin", status: synced, statusLine: "Synced 2 h ago" }
    - { id: 86, name: "Girasoles",          detail: "9 clients · 25 accounts",  origin: "via Centro Arin", status: failed, statusLine: "2 failed · synced 2 h ago" }
    - { id: 91, name: "Las Palomas",        detail: "6 clients · 13 accounts",  origin: "via Arin Savings", status: waiting, statusLine: "Waiting to sync" }
    - { id: 92, name: "Colibríes",          detail: "5 clients · 11 accounts",  origin: "via Arin Savings", status: waiting, statusLine: "Waiting to sync" }
  clients:
    - { id: 205, name: "Irving Zamora",          detail: "1 loan · 1 savings",                origin: chosen,                 status: out_of_date, statusLine: "Out of date · synced 2 days ago" }
    - { id: 192, name: "FOTest Asha",            detail: "2 loans · 1 savings · 3 documents", origin: "via MARIPOSAS MONARCAS", status: synced,  statusLine: "Synced 2 h ago" }
    - { id: 310, name: "María Guadalupe Torres", detail: "1 loan · 2 savings",                origin: "via MARIPOSAS MONARCAS", status: synced,  statusLine: "Synced 2 h ago" }
    - { id: 311, name: "José Luis Hernández",    detail: "2 loans · 1 closed",                origin: "via Las Margaritas",     status: synced,  statusLine: "Synced 2 h ago" }
    - { id: 312, name: "Rosa Elena Cruz",        detail: "1 loan · 1 savings · 1 document",   origin: "via Girasoles",          status: failed,  statusLine: "1 failed · synced 2 h ago" }

