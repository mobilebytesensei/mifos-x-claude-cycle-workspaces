# signin — data flow. IMPORTED from source 2026-10-02; REGENERATED by /idea-feature-enrich
# 2026-10-05 (reads are READ from SignInViewModel.kt's constructor + its two init collectors).

schema_version: "3.1"
feature: signin
feature_id: signin

# ──────────────── READS ────────────────
# v1 read almost nothing: sign-in is the call that CREATES the session the rest of the app reads.
# v2 reads two preference streams, and both are COLLECTED rather than sampled once — that choice is
# load-bearing in both cases, so it is recorded per entry.
entries:
  - id: passcode
    source: UserPreferencesRepository.settingsInfo
    shape: "String?"
    consumed_by: "original LoginViewModel only"
    status: dropped_in_port
    note: >
      The original observed the stored passcode to decide HomeActivityIntent vs
      PassCodeActivityIntent. The port moved that decision to RootNavViewModel, so this read leaves
      the screen entirely — an example of a DataState → ScreenState change deleting a code path
      rather than renaming a type.

  - id: server_config
    source: ProjectPreferencesRepository.serverConfig
    shape: ServerConfig
    status: direct               # was `indirect` in v1 — the screen now reads it itself
    consumed_by: "the instance chip (host + tenant), AND separately the HTTP client"
    collected: true
    collected_why: >
      `serverConfig` is a StateFlow, and the chip is the entry point to the screen that EDITS it. A
      user who leaves for serverConfig and returns must see the value they just changed, not the one
      captured when this screen was first composed. Sampling once would make the chip quietly stale
      in exactly the flow it exists to serve.
    known_gap: >
      The value shown and the value USED are not the same binding. No production code under
      `core/network` reads ServerConfig — the access point is a build-time constant. They agree for
      the shipped default (pinned by `ServerConfigAccessPointParityTest`) and diverge the moment a
      user edits. See api.yaml#known_gaps.access-point-ignores-saved-server-config.

  - id: fineract_user
    source: ProjectPreferencesRepository.fineractUser
    shape: User
    status: new_in_v2
    consumed_by: "the biometric affordance gate (SignInState.hasStoredSession)"
    collected: true
    read_field: base64EncodedAuthenticationKey
    collected_why: >
      The session can be written by THIS screen (a successful sign-in) and cleared elsewhere (sign
      out), so the affordance must track it rather than decide once at composition. Keyed on the
      credential being non-blank, not on `isAuthenticated`: biometrics unlocks a STORED session, and
      what makes a session storable is the credential, not the flag.

# ──────────────── WRITES ────────────────
writes:
  - id: authenticate
    target: "POST authentication"
    policy: OnlineRequired
    payload: { username: string, password: string }
    see: api.yaml#endpoints.authenticate

  - id: persist_session
    target: "ProjectPreferencesRepository.updateFineractUser"
    local: true
    persistence_contract: { is_durable: true, storage_backend: shared_prefs }
    writes:
      - "User(username, userId, base64EncodedAuthenticationKey, officeId, officeName, permissions)"
      - "authToken := RAW base64EncodedAuthenticationKey (NOT pre-formatted)"
      - "isAuthenticated := true"
      - "isUnlocked := true"
    note: >
      The raw-token detail is load-bearing: AuthScheme.BASIC.format adds the "Basic " prefix on the
      way to the wire, so storing a pre-formatted value yields `Basic Basic <token>` and 401s every
      authenticated call while sign-in itself still works.

  - id: reaffirm_session_on_biometric_unlock
    target: "ProjectPreferencesRepository.updateFineractUser"
    local: true
    status: new_in_v2
    persistence_contract: { is_durable: true, storage_backend: shared_prefs }
    writes:
      - "isAuthenticated := true (on the ALREADY-STORED user — no new credential is minted)"
    note: >
      Re-affirming `isAuthenticated` is what also sets `isUnlocked` downstream. Omitting it sends an
      authenticated-but-locked user straight back to this screen — the same bounce observed on device
      2026-10-02 for the sign-out → sign-in path, which is why it is written explicitly here too.

# ──────────────── NOT WRITTEN (deliberate) ────────────────
not_written:
  - id: raw_password
    was: "User.password — carried from the original"
    status: CLOSED
    closed_at: '2026-10-02'
    why: >
      Nothing reads it. Every consumer uses `username` or `base64EncodedAuthenticationKey`, and
      `authHeader` derives from the encoded key. Keeping it put a live credential on disk for the
      session's life in exchange for nothing.
    locked_by: "SignInViewModelTest.theRawPasswordIsNeverPersisted"

  - id: failed_attempt_count
    target: "core-base/security FailedAttemptTracker"
    status: DELIBERATELY_UNWIRED
    why: >
      The obvious wiring is refused on purpose. `FailedAttemptTracker.recordFailure()` invokes
      `SecureWiper` at `wipeAfterFailedAttempts: 10` — irreversible local data destruction. Arming
      that for a field officer who mistypes a password is a PRODUCT decision. The screen therefore
      holds the counter in `SignInState` (in-memory, reset on success and on process death) and
      mirrors only the `lockAfterFailedAttempts: 5` half.
    consequence: >
      The throttle does NOT survive a restart. That is the honest cost of not arming the wipe, and it
      is recorded rather than hidden: an attacker with the device can clear the counter by relaunching.
      Persisting it is a separate decision from wiping, and neither is made here.

# ──────────────── DOWNSTREAM ────────────────
# What the rest of the app depends on this screen having written. Recorded because none of it is
# visible from this screen, and all of it breaks silently.
downstream_contract:
  - consumer: AuthHeaderBridge
    needs: "authToken as a COLD flow emission"
    note: >
      The bridge is handed UserPreferencesRepository.observeAuthToken. Passing the repository's
      StateFlow directly left Authorization unset and 401'd every authenticated call; re-emitting
      the identical values through a cold flow fixed it, reproducibly. Root cause sits in the
      bridge (core-base/network) and is raised for upstream.
  - consumer: RootNavViewModel
    needs: "isAuthenticated AND isUnlocked AND a non-empty passcode"
    note: >
      All three are gates; missing any one routes the user back to this screen. MEASURED 2026-10-05:
      in practice an authenticated relaunch resolves to `UserUnlocked` and never returns here, which
      is why `biometric_ready` has no reachable entry point — see docs.yaml#pending_device_verify.

