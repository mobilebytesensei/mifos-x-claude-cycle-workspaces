    - idea-layer/dtos/Role.yaml
  payload_provenance: "real response captured off apis.mifos.community 2026-10-02 (fieldofficer)"
  content_hash: "8843405bc341ba79e3811c486d880be55f446a6f0ed69ad2cbdf2ce9c52eced4"
  content_hash_inputs: [api.yaml, data-flow.yaml]
  content_hash_note: >
    The hash of THIS artifact's DECLARED inputs (api.yaml + data-flow.yaml), computed by
