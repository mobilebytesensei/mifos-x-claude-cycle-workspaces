# signin — demo content. Generated by the post-enrich cascade (/idea-data → idea-data-demo),
# 2026-10-05, from the DTO field shapes in idea-layer/dtos/ and the REAL response captured off
# apis.mifos.community on 2026-10-02.
#
# Curated, not randomized (RULE-TRAINING-001). Every value below is either the actual demo-instance
# value or a realistic field-officer value in the same shape — no `Item 1`, no `Title`, no lorem.
#
# PUBLIC CREDENTIALS NOTE: `fieldofficer` / `password` / `mifos-bank-1` are the credentials the
# Mifos community publishes for its shared demo instance, and the same values the template already
# carries in `fork.properties#demo.username` / `#demo.password`. They are documentation, not
# secrets. No vault alias is involved and none should be created for them.

sibling: demo-data
schema_version: 2.1.0
feature_id: signin
feature: signin

entries:
  # ──────────────── REQUEST ────────────────
  - dto: PostAuthenticationRequest
    role: request
    scope: populated
    count: 3
    items:
      - username: fieldofficer
        password: password
        note: "the published demo credential — the happy path every walkthrough uses"
      - username: fieldofficer
        password: wrongpassword
        note: >
          Drives the rejected path. Both rules PASS locally (>=4 and >=6), so this reaches the
          server and is the only way to exercise `authenticated == false`. Used on device
          2026-10-05 to walk the throttle from warn to locked.
      - username: fo
        password: short
        note: >
          Fails BOTH local rules, so it never opens a socket. Exists to demonstrate that a local
          validation failure does NOT advance the lockout counter.

  # ──────────────── RESPONSE ────────────────
  - dto: PostAuthenticationResponse
    role: response
    scope: populated
    count: 1
    items:
      - username: fieldofficer
        userId: 2
        base64EncodedAuthenticationKey: "ZmllbGRvZmZpY2VyOnBhc3N3b3Jk"
        authenticated: true
        officeId: 1
        officeName: "Oficina Principal"
        roles:
          - { id: 12, name: "OFICIAL DE CAMPO", description: "OFICIAL DE CAMPO", disabled: false }
        permissions_count: 600
        permissions_note: >
          The live response carries roughly 600 entries. They are summarised as a COUNT here rather
          than enumerated: a 600-item literal would dominate this file without teaching anything, and
          the DTO already records that any consumer assuming a small list will be surprised. A
          renderer that needs the real list must read the captured payload, not this file.
        note: >
          The encoded key is Base64 of `fieldofficer:password` — derivable from the published demo
          credential above, so it discloses nothing that is not already public. It is the field whose
          RAW form must be stored: `AuthScheme.BASIC.format` adds the `Basic ` prefix at request
          time, and storing a pre-formatted value produced `Basic Basic <token>` and 401'd every
          authenticated call.

  - dto: PostAuthenticationResponse
    role: response
    scope: error_rejected
    count: 1
    items:
      - username: fieldofficer
        userId: null
        base64EncodedAuthenticationKey: null
        authenticated: false
        officeId: null
        officeName: null
        roles: null
        permissions: null
        note: >
          HTTP 200 with `authenticated: false` — how Fineract reports a BAD CREDENTIAL. This is the
          single most load-bearing item in this file: a client that treats 200 as success admits a
          failed login. Every field is null because the port defaults them, which is also why
          `authenticated` must never be given a `true` default.

  - dto: PostAuthenticationResponse
    role: response
    scope: error_non_2xx
    count: 1
    items:
      - username: null
        userId: null
        base64EncodedAuthenticationKey: null
        authenticated: null
        officeId: null
        officeName: null
        roles: null
        permissions: null
        note: >
          What a 401 error body deserializes to. The client does not set `expectSuccess`, so a
          non-2xx payload parses onto DTO defaults and arrives as a successful EMPTY result. Only the
          explicit `authenticated == true` check distinguishes this from the rejected case above —
          and from a real success. See dtos/PostAuthenticationResponse.yaml#known_gaps.

  # ──────────────── NESTED ────────────────
  - dto: Role
    role: response
    scope: populated
    count: 2
    items:
      - { id: 12, name: "OFICIAL DE CAMPO", description: "OFICIAL DE CAMPO", disabled: false }
      - { id: 1,  name: "Super user",       description: "This role provides all application permissions.", disabled: false }
    note: >
      The live demo instance returns role names in Spanish while the rest of the payload is English.
      Anything that renders a role must not assume the app's locale. Sign-in does not display roles —
      this exists because the response carries them and a DTO that silently drops a field cannot
      round-trip.

# ──────────────── PER-STATE VARIANTS ────────────────
# The eight ui.yaml states, mapped to the data each one needs. Most need NO network data at all,
# which is itself the point: sign-in is a form, and only three of its states involve a response.
state_data:
  empty:            { request: null, response: null, note: "both fields blank; instance chip shows ServerConfig.DEFAULT" }
  validation_error: { request: "entries[0].items[2]", response: null, note: "never reaches the network" }
  submitting:       { request: "entries[0].items[0]", response: "in-flight", note: "modal overlay; fields keep their values" }
  transport_error:  { request: "entries[0].items[1]", response: "scope:error_rejected" }
  offline:          { request: "entries[0].items[0]", response: "none — MutationResult.Blocked(OFFLINE), no call made" }
  locked_out:       { request: "entries[0].items[1]", response: "scope:error_rejected x5", note: "warn branch at 3, locked at 5" }
  biometric_ready:  { request: null, response: null, note: "no network — a STORED session is re-affirmed locally" }
  success:          { request: "entries[0].items[0]", response: "scope:populated" }

