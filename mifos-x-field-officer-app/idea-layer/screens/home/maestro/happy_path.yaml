appId: com.mifos.mifosxdroid
---
# Home is a scrolling dashboard: sections below the fold are reached by scrolling, as a person would.
# Back from a drill-down restores Home's scroll position, so the header is scrolled back into view.
- launchApp
- assertVisible:
    id: "home_header"
- assertVisible:
    id: "home_work_queue"
- scrollUntilVisible:
    element:
      id: "home_portfolio"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "home_quick_actions"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "home_queue_pending_clients"
    direction: UP
- tapOn:
    id: "home_queue_pending_clients"
- back
- scrollUntilVisible:
    element:
      id: "home_header"
    direction: UP
