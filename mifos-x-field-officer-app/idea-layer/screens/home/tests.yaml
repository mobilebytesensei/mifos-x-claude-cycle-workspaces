# screens/home/tests.yaml — emitted by /idea-feature-enrich STEP 5.5 (2026-10-26)
# schema_version: v1.0.0  source: idea-feature-enrich  feature: home
# States: loading · content · partial_failure · error · offline (SCREEN_ARCHETYPES dashboard).

schema_version: v1.0.0
feature: home

scenarios:
  # ── loading ──
  - id: loading_initial_render
    preconditions: ["user is signed in", "dashboard cache is empty", "network responds slowly"]
    actions: ["open the Home tab"]
    assertions: ["header shows greeting, office, business date and live instance immediately", "each permitted card shows a shimmer skeleton", "no card shows stale or zero figures while loading"]
    priority: low

  # ── content ──
  - id: content_happy_path
    preconditions: ["user is signed in with the full field-officer permission set", "every dashboard source responds"]
    actions: ["open the Home tab", "wait for the cards to load"]
    assertions: ["collections, work queue, meetings, portfolio, quick actions and recent cards are visible", "no card shows a loading indicator"]
    priority: high

  - id: content_permission_absent_card_hidden
    preconditions: ["user lacks READ_COLLECTIONSHEET"]
    actions: ["open the Home tab"]
    assertions: ["the collections card is not rendered", "the Collection sheet quick action is not rendered", "no request is made to collectionsheet"]
    priority: high

  - id: content_all_functions_shows_everything
    preconditions: ["user holds ALL_FUNCTIONS only"]
    actions: ["open the Home tab"]
    assertions: ["every card and quick action is rendered"]
    priority: high

  - id: content_checker_super_user_shows_inbox
    preconditions: ["user holds CHECKER_SUPER_USER and no *_CHECKER code"]
    actions: ["open the Home tab"]
    assertions: ["the Checker inbox tasks row is rendered"]
    priority: high

  - id: content_own_scope_with_staff_link
    preconditions: ["user is linked to staff id 1", "loans exist for staff 1 and staff 2 at status 100"]
    actions: ["open the Home tab"]
    assertions: ["'Loans awaiting approval' counts only staff 1's loans", "scope chip reads 'My portfolio'"]
    priority: high

  - id: content_office_scope_without_staff_link
    preconditions: ["user has no staff link", "loans exist submitted by this username and by others"]
    actions: ["open the Home tab"]
    assertions: ["the approval queue counts only loans submitted by this username", "portfolio tiles are office-wide", "scope chip reads 'Office: CENTRAL'"]
    priority: high

  - id: content_drafts_row_hidden_when_zero
    preconditions: ["no form drafts exist"]
    actions: ["open the Home tab"]
    assertions: ["the 'My unsynced drafts' row is not rendered"]
    priority: high

  - id: content_par_computed_not_reported
    preconditions: ["active loans with principalOverdue 1000 and principalOutstanding 10000"]
    actions: ["open the Home tab"]
    assertions: ["PAR tile shows 10.0%", "no runreports request is made"]
    priority: high

  - id: content_mixed_currency_not_summed
    preconditions: ["active loans in MXN and USD"]
    actions: ["open the Home tab"]
    assertions: ["outstanding shows one line per currency, never a single cross-currency total"]
    priority: high

  - id: content_meetings_from_calendar
    preconditions: ["centre A's calendar next date == business date", "centre B's != business date"]
    actions: ["open the Home tab"]
    assertions: ["only centre A is listed under Meetings today", "'Nothing scheduled today' shows when none match"]
    priority: high

  - id: content_tap_queue_row
    preconditions: ["user has READ_LOAN", "4 loans awaiting approval in scope"]
    actions: ["tap 'Loans awaiting approval'"]
    assertions: ["the loan list opens filtered to status 100 and own scope"]
    priority: high

  - id: content_no_account_creates_on_home
    preconditions: ["user holds CREATE_LOAN, CREATE_SAVINGSACCOUNT, CREATE_SHAREACCOUNT and CREATE_CLIENT_COLLATERAL_PRODUCT"]
    actions: ["open the Home tab"]
    assertions: ["quick actions show only New client, New group, New centre, Collection sheet, Run reports and Search", "no New loan, New savings, New share account or New collateral tile is rendered"]
    priority: high

  - id: content_tap_top_bar_search
    preconditions: ["user is signed in"]
    actions: ["tap the top-bar Search icon"]
    assertions: ["the search screen (feature `search`) opens — search is no longer the Home tab body"]
    priority: high

  - id: content_pull_to_refresh
    preconditions: ["cards show content"]
    actions: ["pull down on the Home tab"]
    assertions: ["every visible card re-requests its source (forceFresh)", "cards keep their figures until fresh data arrives"]
    priority: high

  # ── partial_failure ──
  - id: partial_failure_one_card_fails
    preconditions: ["the collection sheet endpoint returns 500", "other sources succeed"]
    actions: ["open the Home tab"]
    assertions: ["the collections card shows its own error with retry", "every other card shows content"]
    priority: medium

  - id: partial_failure_retry_card
    preconditions: ["the collections card is in error", "the endpoint now succeeds"]
    actions: ["tap retry on the collections card"]
    assertions: ["only the collection sheet is re-requested", "the collections card shows content"]
    priority: medium

  # ── error ──
  - id: error_all_sources_failed
    preconditions: ["user is authenticated", "network is unavailable and nothing is cached"]
    actions: ["open the Home tab"]
    assertions: ["one combined error with a single retry replaces the remote cards", "header, quick actions and recent records still render"]
    priority: medium

  - id: error_retry_all
    preconditions: ["home is in the combined error state", "the network is back"]
    actions: ["tap retry on the screen error"]
    assertions: ["every remote card re-requests and the screen leaves the error state"]
    priority: medium

  # ── offline ──
  - id: offline_cached_figures
    preconditions: ["cards were loaded once", "device is offline"]
    actions: ["reopen the Home tab"]
    assertions: ["cached figures render with their age", "the drafts row still counts local drafts"]
    priority: medium

  # ── permission change ──
  - id: content_permission_change_recomputes
    preconditions: ["user signs out and back in with a role lacking READ_LOAN"]
    actions: ["open the Home tab"]
    assertions: ["the loan queue rows and loan portfolio tiles are gone", "no /loans request is made"]
    priority: high

state_coverage:
  loading: [loading_initial_render]
  content: [content_happy_path, content_tap_queue_row, content_no_account_creates_on_home, content_pull_to_refresh]
  partial_failure: [partial_failure_one_card_fails, partial_failure_retry_card]
  error: [error_all_sources_failed, error_retry_all]
  offline: [offline_cached_figures]

