# home — flow contract. AUTHORED via /idea-plan-add 2026-10-26.

schema_version: "3.1"
feature: home

inbound_routes:
  - from: signin
    when: "sign-in succeeds"
    graph: authenticated
    note: "Home tab start destination"
  - from: bottom_nav
    when: "Home tab tapped"

entry_points:
  - route: HomeRoute
    params: {}

transitions:
  - id: load
    from: loading
    trigger: "screen opened"
    to: [content, partial_failure, error, offline]
    decided_by: "each card's ScreenState; the shell aggregates via aggregateDashboardProgress (error = every remote card failed with nothing cached)"
    note: "cards never wait for each other; the header renders from the session at once"

  - id: refresh
    from: [content, partial_failure, offline]
    trigger: "pull to refresh"
    to: [content, partial_failure, error, offline]
    side_effects: ["retry every visible card stream (forceFresh)"]

  - id: retry_card
    from: partial_failure
    trigger: "card error retry tapped"
    to: [content, partial_failure]
    side_effects: ["that card's stream.retry() only"]

  - id: retry_all
    from: error
    trigger: "screen error retry tapped"
    to: [loading]
    side_effects: ["retry every visible card stream (forceFresh)"]

  - id: permission_change
    from: [content, partial_failure, error, offline]
    trigger: "session re-signed in with a different permission set"
    to: loading
    note: "card visibility is recomputed from the new permission list — no stale gated card survives a role change"

outbound_routes:
  - { to: individualCollectionSheet, when: "collections card button / quick action", params: { officeId: "scope.officeId", date: businessDate } }
  - { to: checkerInbox, when: "queue_checker row" }
  - { to: loanAccountList, when: "queue_awaiting_approval / queue_awaiting_disbursal", params: { status: "100|200", scope: own } }
  - { to: clientList, when: "queue_pending_clients", params: { status: pending } }
  - { to: loanReschedules, when: "queue_reschedules" }
  - { to: syncAndDrafts, when: "queue_drafts" }
  - { to: centerDetail, when: "meeting_row (center)", params: { centerId: "meeting.entityId" } }
  - { to: groupDetail, when: "meeting_row (group)", params: { groupId: "meeting.entityId" } }
  - { to: createNewClient, when: "qa_new_client" }
  - { to: createGroup, when: "qa_new_group" }
  - { to: createCenter, when: "qa_new_center" }
  - { to: runReports, when: "qa_run_reports" }
  - { to: search, when: "qa_search or the top-bar Search icon" }
  - { to: "clientDetail | groupDetail | centerDetail | loanSummary", when: "recent_row (by type)" }

dead_ends: []
dead_ends_note: >
  Portfolio tiles are figures, not destinations — no on_click, rendered without a tap affordance.
  Every other interactive element targets an existing destination; the filtered `loanAccountList`
  (status + own scope) is the one NEW piece the implementation must add. Account creates (loan,
  savings, share, collateral) are client-owned and start from the client profile, so Home needs no
  client picker (operator, 2026-10-26).

new_destinations_required:
  - id: loanAccountList (filtered)
    why: "no office-wide loan list exists in the port; the queue rows need status + own-scope filtering"
