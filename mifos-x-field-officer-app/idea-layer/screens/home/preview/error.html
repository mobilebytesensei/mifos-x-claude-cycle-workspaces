<!doctype html>
<!-- render-hash: 71d6052c7f59 -->
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Home: error</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#4338CA;--on-primary:#FFFFFF;--primary-container:#E0E7FF;--on-primary-container:#1F1D75;
--error-container:#FFE4E1;--on-error-container:#9F1239;
--background:#FAFAFB;--surface:#FFFFFF;--on-surface:#0F172A;--surface-variant:#E2E8F0;--on-surface-variant:#475569;
--outline:#94A3B8;--outline-variant:#CBD5E1;
--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;--sp-xxl:32px;--touch:48px;
--r-sm:8px;--r-md:12px;--r-pill:999px}
[data-theme="dark"]{--primary:#C7D2FE;--on-primary:#1F1D75;--primary-container:#312E81;--on-primary-container:#E0E7FF;
--error-container:#7F1D1D;--on-error-container:#FFE4E1;
--background:#0F172A;--surface:#1E293B;--on-surface:#F1F5F9;--surface-variant:#334155;--on-surface-variant:#CBD5E1;
--outline:#64748B;--outline-variant:#334155}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-surface);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:420px;min-height:100dvh;display:flex;flex-direction:column}
.sym{font-family:'Material Symbols Rounded';line-height:1;display:inline-block;font-size:22px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;height:64px;padding:0 var(--sp-xs);background:var(--background)}
.topbar h1{text-align:center;font-size:20px;font-weight:600;letter-spacing:-.01em}
.topbar .acts{display:flex;justify-content:flex-end}
.icon-btn{width:var(--touch);height:var(--touch);display:grid;place-items:center;border-radius:var(--r-pill);color:var(--on-surface-variant)}
main{flex:1;padding:0 var(--sp-lg) var(--sp-xl);display:flex;flex-direction:column;gap:var(--sp-lg)}
.hello{padding:var(--sp-sm) 0 var(--sp-xs);display:flex;flex-direction:column;gap:var(--sp-sm)}
.hello h2{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.ctx{display:flex;flex-wrap:wrap;gap:var(--sp-xs) var(--sp-md);font-size:14px;color:var(--on-surface-variant)}
.ctx span{display:inline-flex;align-items:center;gap:var(--sp-xs)}
.ctx .sym{font-size:18px}
.scope{align-self:flex-start;display:inline-flex;align-items:center;gap:var(--sp-xs);height:32px;padding:0 var(--sp-md);border-radius:var(--r-pill);background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:500}
.scope .sym{font-size:18px}
/* combined screen error: LocalScreenStateDefaults no-network, shown once instead of stacked card errors */
.serr{border-radius:var(--r-md);background:var(--error-container);color:var(--on-error-container);padding:var(--sp-xl) var(--sp-lg);display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-md)}
.serr .ic{width:48px;height:48px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--surface);color:var(--on-error-container)}
.serr h3{font-size:20px;font-weight:600}
.serr p{font-size:15px;line-height:1.45;max-width:34ch}
.retry{min-height:var(--touch);padding:0 var(--sp-xl);border-radius:var(--r-sm);background:var(--primary);color:var(--on-primary);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:var(--sp-sm)}
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--r-md);overflow:hidden}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-md);padding:var(--sp-lg) var(--sp-lg) var(--sp-sm)}
.card-h h3{font-size:17px;font-weight:600}
.rows{list-style:none}
.rows li+li{border-top:1px solid var(--outline-variant)}
.chev{font-size:20px;color:var(--outline)}
.t{display:flex;flex-direction:column;gap:var(--sp-xs);min-width:0}
.t b{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t span{font-size:13px;color:var(--on-surface-variant)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-xs);padding:var(--sp-xs) var(--sp-sm) var(--sp-md)}
.qa{display:flex;flex-direction:column;align-items:center;gap:var(--sp-xs);min-height:76px;padding:var(--sp-sm) var(--sp-xs);border-radius:var(--r-sm);text-align:center;font-size:12px;line-height:1.25;color:var(--on-surface)}
.qa .sym{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--primary-container);color:var(--on-primary-container);font-size:22px}
.rec{display:grid;grid-template-columns:40px 1fr 20px;align-items:center;gap:var(--sp-md);width:100%;min-height:56px;padding:0 var(--sp-lg);text-align:left}
.rec .ic{width:40px;height:40px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--surface-variant);color:var(--on-surface-variant)}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);height:72px;background:var(--surface);border-top:1px solid var(--outline-variant)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-xs);font-size:12px;color:var(--on-surface-variant)}
.nav .pill{width:56px;height:28px;border-radius:var(--r-pill);display:grid;place-items:center}
.nav .on{color:var(--on-surface);font-weight:600}
.nav .on .pill{background:var(--primary-container);color:var(--on-primary-container)}
</style></head>
<body><div class="phone">

<header class="topbar">
  <span></span>
  <h1>MifosXDroid</h1>
  <div class="acts">
    <button class="icon-btn" aria-label="Search" data-action="navigate_search" data-testid="home_topbar_search"><span class="sym" aria-hidden="true">search</span></button>
    <button class="icon-btn" aria-label="Settings" data-action="navigate_settings"><span class="sym" aria-hidden="true">settings</span></button>
  </div>
</header>

<main>
  <section class="hello" data-testid="home_header">
    <h2>Good morning, Irving</h2>
    <div class="ctx">
      <span><span class="sym" aria-hidden="true">apartment</span>CENTRAL</span>
      <span><span class="sym" aria-hidden="true">event</span>Mon 26 Oct 2026</span>
      <span><span class="sym" aria-hidden="true">dns</span>Mifos field officer gateway</span>
    </div>
    <span class="scope" data-testid="home_scope_chip"><span class="sym" aria-hidden="true">badge</span>My portfolio</span>
  </section>

  <section class="serr" role="alert" data-testid="home_screen_error">
    <span class="ic"><span class="sym" aria-hidden="true">wifi_off</span></span>
    <h3>Couldn't load your day</h3>
    <p>Check your connection and try again. Quick actions still work.</p>
    <button class="retry" data-action="retry_all_cards"><span class="sym" aria-hidden="true">refresh</span>Retry</button>
  </section>

  <section class="card" data-testid="home_quick_actions" aria-labelledby="qa-h">
    <div class="card-h"><h3 id="qa-h">Quick actions</h3></div>
    <div class="grid4">
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_client"><span class="sym" aria-hidden="true">person_add</span>New client</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_group"><span class="sym" aria-hidden="true">groups</span>New group</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_center"><span class="sym" aria-hidden="true">domain</span>New centre</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_loan"><span class="sym" aria-hidden="true">request_quote</span>New loan</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_savings"><span class="sym" aria-hidden="true">savings</span>New savings</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_share"><span class="sym" aria-hidden="true">pie_chart</span>New share account</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_collateral"><span class="sym" aria-hidden="true">inventory_2</span>New collateral</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_collection"><span class="sym" aria-hidden="true">fact_check</span>Collection sheet</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_reports"><span class="sym" aria-hidden="true">bar_chart</span>Run reports</button>
      <button class="qa" data-action="open_quick_action" data-testid="home_qa_search"><span class="sym" aria-hidden="true">search</span>Search</button>
    </div>
  </section>

  <section class="card" data-testid="home_recent" aria-labelledby="rc-h">
    <div class="card-h"><h3 id="rc-h">Recently opened</h3></div>
    <ul class="rows">
      <li><button class="rec" data-action="open_recent_record" data-testid="home_recent_row"><span class="ic"><span class="sym" aria-hidden="true">person</span></span><span class="t"><b>FOTest Asha</b><span class="num">Client 000003256</span></span><span class="sym chev" aria-hidden="true">chevron_right</span></button></li>
      <li><button class="rec" data-action="open_recent_record" data-testid="home_recent_row"><span class="ic"><span class="sym" aria-hidden="true">groups</span></span><span class="t"><b>MARIPOSAS MONARCAS</b><span class="num">Group 000000002</span></span><span class="sym chev" aria-hidden="true">chevron_right</span></button></li>
      <li><button class="rec" data-action="open_recent_record" data-testid="home_recent_row"><span class="ic"><span class="sym" aria-hidden="true">request_quote</span></span><span class="t"><b>CREDITO A LA PALABRA, FOTest Asha</b><span class="num">Loan 000001502</span></span><span class="sym chev" aria-hidden="true">chevron_right</span></button></li>
      <li><button class="rec" data-action="open_recent_record" data-testid="home_recent_row"><span class="ic"><span class="sym" aria-hidden="true">domain</span></span><span class="t"><b>Arin</b><span class="num">Centre 000000010</span></span><span class="sym chev" aria-hidden="true">chevron_right</span></button></li>
    </ul>
  </section>
</main>

<nav class="nav" aria-label="Primary">
  <button class="on" aria-current="page" data-action="navigate_home"><span class="pill"><span class="sym" aria-hidden="true">home</span></span>Home</button>
  <button data-action="navigate_clients"><span class="pill"><span class="sym" aria-hidden="true">group</span></span>Clients</button>
  <button data-action="navigate_profile"><span class="pill"><span class="sym" aria-hidden="true">account_circle</span></span>Profile</button>
</nav>
</div></body></html>
