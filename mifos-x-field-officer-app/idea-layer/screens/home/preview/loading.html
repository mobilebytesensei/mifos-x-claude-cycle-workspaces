<!doctype html>
<!-- render-hash: 19b95db20534 -->
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Home: loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#4338CA;--on-primary:#FFFFFF;--primary-container:#E0E7FF;--on-primary-container:#1F1D75;
--background:#FAFAFB;--surface:#FFFFFF;--on-surface:#0F172A;--surface-variant:#E2E8F0;--on-surface-variant:#475569;
--outline:#94A3B8;--outline-variant:#CBD5E1;--shimmer-hi:#F1F5F9;
--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;--touch:48px;--r-sm:8px;--r-md:12px;--r-pill:999px}
[data-theme="dark"]{--primary:#C7D2FE;--on-primary:#1F1D75;--primary-container:#312E81;--on-primary-container:#E0E7FF;
--background:#0F172A;--surface:#1E293B;--on-surface:#F1F5F9;--surface-variant:#334155;--on-surface-variant:#CBD5E1;
--outline:#64748B;--outline-variant:#334155;--shimmer-hi:#475569}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-surface);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:420px;min-height:100dvh;display:flex;flex-direction:column}
.sym{font-family:'Material Symbols Rounded';line-height:1;display:inline-block;font-size:22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;height:64px;padding:0 var(--sp-xs);background:var(--background)}
.topbar h1{text-align:center;font-size:20px;font-weight:600;letter-spacing:-.01em}
.topbar .acts{display:flex;justify-content:flex-end}
.icon-btn{width:var(--touch);height:var(--touch);display:grid;place-items:center;border-radius:var(--r-pill);color:var(--on-surface-variant)}
main{flex:1;padding:0 var(--sp-lg) var(--sp-xl);display:flex;flex-direction:column;gap:var(--sp-lg)}
.hello{padding:var(--sp-sm) 0 var(--sp-xs);display:flex;flex-direction:column;gap:var(--sp-sm)}
.hello h2{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.ctx{display:flex;flex-wrap:wrap;gap:var(--sp-xs) var(--sp-md);font-size:14px;color:var(--on-surface-variant)}
.ctx span{display:inline-flex;align-items:center;gap:var(--sp-xs)}
.ctx .sym{font-size:18px}
.scope{align-self:flex-start;display:inline-flex;align-items:center;gap:var(--sp-xs);height:32px;padding:0 var(--sp-md);border-radius:var(--r-pill);background:var(--primary-container);color:var(--on-primary-container);font-size:13px;font-weight:500}
.scope .sym{font-size:18px}
.skel{display:flex;flex-direction:column;gap:var(--sp-lg)}
.card{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--r-md);padding:var(--sp-lg);display:flex;flex-direction:column;gap:var(--sp-md)}
/* shimmer: one sweep shared by every block, so the screen reads as one load, not twelve */
.sk{border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface-variant) 0%,var(--shimmer-hi) 50%,var(--surface-variant) 100%);background-size:300% 100%;animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{0%{background-position:100% 0}100%{background-position:0 0}}
.line{height:14px}.title{height:18px;width:46%}.big{height:34px;width:58%}.rail{height:10px;border-radius:var(--r-pill)}
.cta{height:var(--touch)}
.row{display:grid;grid-template-columns:40px 1fr 32px;gap:var(--sp-md);align-items:center;min-height:40px}
.row .ic{width:40px;height:40px}.row .cnt{height:28px;border-radius:var(--r-pill)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-md)}
.fig{height:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);height:72px;background:var(--surface);border-top:1px solid var(--outline-variant)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-xs);font-size:12px;color:var(--on-surface-variant)}
.nav .pill{width:56px;height:28px;border-radius:var(--r-pill);display:grid;place-items:center}
.nav .on{color:var(--on-surface);font-weight:600}
.nav .on .pill{background:var(--primary-container);color:var(--on-primary-container)}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style></head>
<body><div class="phone">

<header class="topbar">
  <span></span>
  <h1>MifosXDroid</h1>
  <div class="acts">
    <button class="icon-btn" aria-label="Search" data-action="navigate_search" data-testid="home_topbar_search"><span class="sym" aria-hidden="true">search</span></button>
    <button class="icon-btn" aria-label="Settings" data-action="navigate_settings"><span class="sym" aria-hidden="true">settings</span></button>
  </div>
</header>

<main aria-busy="true">
  <span class="sr" role="status">Loading your day</span>
  <section class="hello" data-testid="home_header">
    <h2>Good morning, Irving</h2>
    <div class="ctx">
      <span><span class="sym" aria-hidden="true">apartment</span>CENTRAL</span>
      <span><span class="sym" aria-hidden="true">event</span>Mon 26 Oct 2026</span>
      <span><span class="sym" aria-hidden="true">dns</span>Mifos field officer gateway</span>
    </div>
    <span class="scope" data-testid="home_scope_chip"><span class="sym" aria-hidden="true">badge</span>My portfolio</span>
  </section>

  <div class="skel" data-testid="home_skeleton" aria-hidden="true">
    <!-- collections ledger -->
    <div class="card"><div class="sk title"></div><div class="sk big"></div><div class="sk rail"></div><div class="two"><div class="sk line"></div><div class="sk line"></div></div><div class="sk cta"></div></div>
    <!-- work queue: six rows -->
    <div class="card"><div class="sk title"></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div class="sk cnt"></div></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div class="sk cnt"></div></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div class="sk cnt"></div></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div class="sk cnt"></div></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div class="sk cnt"></div></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div class="sk cnt"></div></div>
    </div>
    <!-- meetings: three rows -->
    <div class="card"><div class="sk title"></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div></div></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div></div></div>
      <div class="row"><div class="sk ic"></div><div class="sk line"></div><div></div></div>
    </div>
    <!-- portfolio figures -->
    <div class="card"><div class="sk title"></div>
      <div class="two"><div class="sk fig"></div><div class="sk fig"></div></div>
      <div class="sk fig"></div><div class="sk fig"></div>
      <div class="two"><div class="sk fig"></div><div class="sk fig"></div></div>
    </div>
  </div>
</main>

<nav class="nav" aria-label="Primary">
  <button class="on" aria-current="page" data-action="navigate_home"><span class="pill"><span class="sym" aria-hidden="true">home</span></span>Home</button>
  <button data-action="navigate_clients"><span class="pill"><span class="sym" aria-hidden="true">group</span></span>Clients</button>
  <button data-action="navigate_profile"><span class="pill"><span class="sym" aria-hidden="true">account_circle</span></span>Profile</button>
</nav>
</div></body></html>
