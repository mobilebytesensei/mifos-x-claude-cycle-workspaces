schema_version: '3.1'
id: home
name: Home
description: >
  The field officer's daily work surface, and the Home tab. It answers "what needs me today": the day's collections, the
  work queue (checker tasks, loans awaiting approval or disbursal, clients pending activation, reschedule requests,
  unsynced drafts), centre and group meetings due today, a portfolio summary, and quick actions to create records. Every
  card and action is driven by the signed-in user's Fineract permissions — absent, never disabled, when the user lacks
  the right.
