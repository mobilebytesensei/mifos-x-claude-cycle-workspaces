metadata:
  category: composite
  implementation_ready: true
  impl_ready_at: '2026-10-26T17:30:00Z'
  impl_ready_schema: v2
contracts:
  - capability: network
    platform_spec: >-
      Fineract REST over the existing authenticated Ktor client (Basic auth + tenant header from the live instance);
      every card is a Store5 NETWORK_WITH_CACHE stream
    permission: none
    error_cases:
      - NoNetwork
      - ServerError
      - Forbidden
      - Unauthorized
libraries:
  - capability: network
    library: ktor
    version: catalog
    targets:
      - android
      - ios
      - desktop
      - web
  - capability: network
    library: store5
    version: catalog
    targets:
      - android
      - ios
      - desktop
      - web
vm_actions:
  - name: Refresh
    signature: fun onRefresh()
    state_mutations:
      - every visible card ScreenState → loading (keeps last content)
    side_effects:
      - each permitted card stream.retry(forceFresh = true)
    error_handling:
      NoNetwork: card keeps cached figures with their age; offline strip shown
  - name: RetryCard
    signature: 'fun onRetryCard(card: DashboardCard)'
    state_mutations:
      - that card ScreenState → loading
    side_effects:
      - that card's stream.retry() only
    error_handling:
      ServerError: card returns to its own error with retry
  - name: RetryAll
    signature: fun onRetryAll()
    state_mutations:
      - screen error → loading
    side_effects:
      - every permitted card stream.retry(forceFresh = true)
    error_handling:
      NoNetwork: back to the combined error state
  - name: OpenCollectionSheet
    signature: fun onOpenCollectionSheet()
    state_mutations: []
    side_effects:
      - emit NavigateToCollectionSheet(officeId, businessDate)
    error_handling: {}
  - name: OpenCheckerInbox
    signature: fun onOpenCheckerInbox()
    state_mutations: []
    side_effects:
      - emit NavigateToCheckerInbox
    error_handling: {}
  - name: OpenLoansAwaitingApproval
    signature: 'fun onOpenLoans(status: LoanQueue)'
    state_mutations: []
    side_effects:
      - emit NavigateToLoanList(status = 100 | 200, scope = own)
    error_handling: {}
  - name: OpenPendingClients
    signature: fun onOpenPendingClients()
    state_mutations: []
    side_effects:
      - emit NavigateToClientList(status = pending)
    error_handling: {}
  - name: OpenPendingReschedules
    signature: fun onOpenReschedules()
    state_mutations: []
    side_effects:
      - emit NavigateToReschedules
    error_handling: {}
  - name: OpenSyncAndDrafts
    signature: fun onOpenDrafts()
    state_mutations: []
    side_effects:
      - emit NavigateToSyncAndDrafts
    error_handling: {}
  - name: OpenMeetingEntity
    signature: 'fun onOpenMeeting(meeting: MeetingToday)'
    state_mutations: []
    side_effects:
      - emit NavigateToCenter(id) | NavigateToGroup(id) by entityType
    error_handling: {}
  - name: OpenQuickAction
    signature: 'fun onQuickAction(action: QuickAction)'
    state_mutations: []
    side_effects:
      - emit NavigateToCreateClient | CreateGroup | CreateCenter | CollectionSheet | RunReports | Search
    error_handling: {}
  - name: OpenRecentRecord
    signature: 'fun onOpenRecent(record: RecentRecord)'
    state_mutations: []
    side_effects:
      - emit NavigateToClient | Group | Center | Loan by type
    error_handling: {}
error_cases:
  - NoNetwork
  - ServerError
  - Forbidden
  - Unauthorized
error_cases_note: >
  Forbidden should never surface from a gated card (it is not subscribed without its permission); seeing one means the
  permission list is stale — treat as a card error and re-read the session on the next sign-in. Unauthorized follows the
  app's existing session-expiry path.
