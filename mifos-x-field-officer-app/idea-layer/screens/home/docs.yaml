decisions:
  - id: portfolio-scope
    decision: >-
      My portfolio when the signed-in user has a staff link (GET /users/{id} → staff); office-wide (the user's office)
      otherwise.
    why: >-
      Fineract scopes a field officer's book by the STAFF record linked to the user, not by the user; an unlinked user
      still needs a working dashboard.
  - id: own-loan-queues
    decision: >-
      Awaiting-approval and awaiting-disbursal queues show only the officer's own loans: loanOfficerId == staff id, or
      submittedByUsername == username when unlinked.
    why: office-wide the approval queue was 1,118 loans on the gateway — a number no officer can act on.
  - id: dashboard-is-home
    decision: The dashboard IS the Home tab; search (feature `search`) stays on the top-bar Search icon.
    why: the original app's Home was search; a field officer's first screen should be the day's work.
  - id: clean-name
    decision: Feature id `home` (not homeDashboard); the former search row is renamed `search`.
    why: operator 2026-10-26 — the Home tab and its feature carry one name
  - id: no-account-creates-on-home
    decision: >-
      Quick actions offer only standalone creates (client, group, centre) and tools (collection sheet, run reports,
      search). Loan, savings, share and collateral are not on Home.
    why: >-
      operator 2026-10-26 — those accounts are owned by a client and cannot be created on their own; they start from the
      client profile, where the owning client is known. This also removes the client picker Home would otherwise need.
permission_model:
  source: POST /authentication → permissions[] (already persisted as User.permissions at sign-in)
  rule: |
    has(code) = code ∈ permissions
             || "ALL_FUNCTIONS" ∈ permissions
             || (code starts with "READ_" && "ALL_FUNCTIONS_READ" ∈ permissions)
             || (code ends with "_CHECKER" && "CHECKER_SUPER_USER" ∈ permissions)
             || (code is a report read "READ_<report name>" && "REPORTING_SUPER_USER" ∈ permissions)
  absent_not_disabled: a card or action the user cannot use is not rendered (RULE-IMPL-DEAD-CLICKABLE-001)
  reuse: >
    One shared predicate (core layer), consumed by this dashboard AND by every existing screen that offers a gated
    action (repayment, approve, disburse, activate) — so a 403 is prevented at the affordance, not discovered after the
    tap.
  staff_link_source: GET /users/{userId} → staff (null on the gateway demo user 32)
audit:
  sandbox: https://sandbox.mifos.community/fineract-provider — Fineract 1.17.0-SNAPSHOT, 603 paths / 155 tags
  permission_catalog: >-
    GET /permissions — 710 codes in 28 groupings; specials ALL_FUNCTIONS, ALL_FUNCTIONS_READ, CHECKER_SUPER_USER,
    REPORTING_SUPER_USER, BYPASS_TWOFACTOR
  findings:
    - >-
      Stretchy reports are server-dependent: Portfolio at Risk, Aging, Active Loans – Summary, Loans Awaiting Disbursal
      Summary and FieldAgentStats fail with BadSqlGrammarException on the PostgreSQL sandbox. Dashboard figures are
      therefore computed from core APIs, never reports.
    - >-
      GET /centers?meetingDate= does not filter (returned every centre); meetings-today is derived from each
      centre/group collection meeting calendar.
    - >-
      POST /collectionsheet?command=generateCollectionSheet {officeId, transactionDate} returns the day's due clients
      with loans and savings.
    - >-
      Gateway demo role 12 'OFICIAL DE CAMPO' (202 codes) lacks collection sheet, savings/share/collateral create,
      report and checker grants, and user 32 has no staff link — a gateway setup gap, not a design input.
