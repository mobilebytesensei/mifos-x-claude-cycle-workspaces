# profile — flow contract. AUTHORED via /idea-plan-add 2026-10-27.

schema_version: "4.0"
feature: profile

entry_points:
  - type: avatar_tap
    from: home
    route: ProfileRoute
    description: "Home header avatar → Profile (the only entry; the drawer was removed 2026-10-27)"

navigates_to: [home, serverConfig, signin]

flow_logic:
  - { trigger: "back",                         to: home,         type: pop }
  - { trigger: "open_server_config",           to: serverConfig, type: push }
  - { trigger: "sign_out confirmed",           to: signin,       type: replace_root, note: "session cleared; RootNavViewModel routes to sign-in" }
  - { trigger: "reauthenticate failed",        to: signin,       type: replace_root, note: "signed out with data kept" }

transitions:
  - { id: load,            from: loading,          trigger: "GET users/{userId} resolves",          to: [content, error, offline], decided_by: "store result + network monitor; the session identity renders before either" }
  - { id: retry,           from: error,            trigger: "Retry",                                to: loading }
  - { id: refresh,         from: [content, error], trigger: "pull to refresh",                      to: content }
  - { id: open_password,   from: content,          trigger: "Change password",                      to: change_password }
  - { id: cancel_password, from: change_password,  trigger: "Cancel / swipe down",                  to: content }
  - { id: password_ok,     from: change_password,  trigger: "server accepts + re-sign-in succeeds", to: content, side_effects: ["store new session key", "snackbar 'Password changed'"] }
  - { id: password_refused, from: change_password, trigger: "server refuses",                       to: change_password, note: "reason under the fields; old password still valid" }
  - { id: go_offline,      from: [content, error], trigger: "network lost",                         to: offline }
  - { id: go_online,       from: offline,          trigger: "network back",                         to: content }

flow_id: account
journey_ids: [field-officer-checks-account]
