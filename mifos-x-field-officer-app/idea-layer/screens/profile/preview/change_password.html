<!doctype html>

<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Profile: change_password</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#4338CA;--on-primary:#FFFFFF;--primary-container:#E0E7FF;--on-primary-container:#1F1D75;
--secondary:#059669;--secondary-container:#D1FAE5;--on-secondary-container:#064E3B;--tertiary:#D97706;--tertiary-container:#FEF3C7;--on-tertiary-container:#78350F;
--error:#DC2626;--error-container:#FFE4E1;--on-error-container:#9F1239;
--background:#FAFAFB;--surface:#FFFFFF;--on-surface:#0F172A;--surface-variant:#E2E8F0;--on-surface-variant:#475569;
--outline:#94A3B8;--outline-variant:#CBD5E1;--scrim:rgba(15,23,42,.42);
--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;--touch:48px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-pill:999px}
[data-theme="dark"]{--primary:#A5B4FC;--on-primary:#1E1B4B;--primary-container:#312E81;--on-primary-container:#E0E7FF;
--secondary:#34D399;--secondary-container:#064E3B;--on-secondary-container:#D1FAE5;--tertiary:#FBBF24;--tertiary-container:#78350F;--on-tertiary-container:#FEF3C7;
--error:#F87171;--error-container:#7F1D1D;--on-error-container:#FFE4E1;
--background:#0F172A;--surface:#1E293B;--on-surface:#F1F5F9;--surface-variant:#334155;--on-surface-variant:#CBD5E1;--outline:#64748B;--outline-variant:#475569}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-surface);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:420px;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.sym{font-family:'Material Symbols Rounded';line-height:1;display:inline-block;font-size:22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:var(--sp-xs);height:64px;padding:0 var(--sp-xs);background:var(--background)}
.topbar h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.icon-btn{width:var(--touch);height:var(--touch);display:grid;place-items:center;border-radius:var(--r-pill);color:var(--on-surface-variant);flex:none}
main{flex:1;padding:var(--sp-sm) var(--sp-lg) 40px;display:flex;flex-direction:column;gap:var(--sp-xl)}
.hero{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-sm) var(--sp-xs) 0}
.disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--primary-container);color:var(--primary);font-size:26px;font-weight:700}
.who h2{font-size:26px;font-weight:600;letter-spacing:-.02em}
.who p{font-size:14px;color:var(--on-surface-variant);margin-top:4px}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--sp-sm) var(--sp-xl) var(--sp-xl);display:flex;flex-direction:column;gap:var(--sp-lg);box-shadow:0 -8px 32px rgba(15,23,42,.18)}
.grab{width:32px;height:4px;border-radius:var(--r-pill);background:var(--outline-variant);align-self:center;margin:var(--sp-sm) 0}
.sheet h2{font-size:22px;font-weight:600;letter-spacing:-.01em}
.sheet .lead{font-size:14px;color:var(--on-surface-variant);line-height:1.45;margin-top:-8px}
.field{position:relative;display:flex;align-items:center;height:56px;border:1px solid var(--outline);border-radius:var(--r-sm);padding:0 var(--sp-xs) 0 var(--sp-lg)}
.field label{position:absolute;top:-9px;left:12px;padding:0 4px;background:var(--surface);font-size:12px;color:var(--on-surface-variant)}
.field .val{flex:1;font-size:16px;letter-spacing:.2em}
.field.bad{border:2px solid var(--error)}
.field.bad label{color:var(--error)}
.help{font-size:12px;color:var(--on-surface-variant);margin:-10px 0 0 var(--sp-lg);line-height:1.4}
.help.bad{color:var(--error);display:flex;gap:4px;align-items:flex-start}
.help.bad .sym{font-size:16px}
.actions{display:flex;justify-content:flex-end;gap:var(--sp-sm);margin-top:var(--sp-sm)}
.text-btn{height:40px;padding:0 var(--sp-lg);border-radius:var(--r-pill);color:var(--primary);font-weight:600;font-size:14px}
.primary-btn{height:40px;padding:0 var(--sp-xl);border-radius:var(--r-pill);background:var(--primary);color:var(--on-primary);font-weight:600;font-size:14px}
.primary-btn[disabled]{background:var(--surface-variant);color:var(--outline);cursor:default}
</style></head>
<body><div class="phone" data-testid="profile_screen">
<header class="topbar"><button class="icon-btn" aria-label="Back" data-testid="profile_back"><span class="sym">arrow_back</span></button><h1>Profile</h1></header>
<main aria-hidden="true">
  <section class="hero"><div class="disc">IZ</div><div class="who"><h2>Irving Zepeda</h2><p>fieldofficer</p></div></section>
</main>
<div class="scrim" data-od-state="content"></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="pw-title" data-testid="profile_password_sheet">
  <span class="grab" aria-hidden="true"></span>
  <h2 id="pw-title">Change password</h2>
  <p class="lead">You stay signed in on this device after the change.</p>
  <div class="field" data-testid="profile_new_password"><label>New password</label><span class="val">••••••••••••••</span><button class="icon-btn" aria-label="Show password"><span class="sym">visibility</span></button></div>
  <p class="help">12 to 50 characters, with upper and lower case, a number and a symbol</p>
  <div class="field bad" data-testid="profile_repeat_password"><label>Repeat new password</label><span class="val">•••••••••••••</span><button class="icon-btn" aria-label="Show password"><span class="sym">visibility</span></button></div>
  <p class="help bad"><span class="sym">error</span>Passwords do not match</p>
  <div class="actions">
    <button class="text-btn" data-testid="profile_password_cancel" data-od-state="content">Cancel</button>
    <button class="primary-btn" disabled data-testid="profile_password_save" data-action="change_password">Save password</button>
  </div>
</section>
</div></body></html>
