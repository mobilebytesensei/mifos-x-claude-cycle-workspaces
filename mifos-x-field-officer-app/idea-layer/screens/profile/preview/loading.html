<!doctype html>
<!-- render-hash: a0d5fce2b89e -->
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Profile: loading</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet"/>
<style>
:root{--primary:#4338CA;--on-primary:#FFFFFF;--primary-container:#E0E7FF;--on-primary-container:#1F1D75;
--secondary:#059669;--secondary-container:#D1FAE5;--on-secondary-container:#064E3B;--tertiary:#D97706;--tertiary-container:#FEF3C7;--on-tertiary-container:#78350F;
--error:#DC2626;--error-container:#FFE4E1;--on-error-container:#9F1239;
--background:#FAFAFB;--surface:#FFFFFF;--on-surface:#0F172A;--surface-variant:#E2E8F0;--on-surface-variant:#475569;
--outline:#94A3B8;--outline-variant:#CBD5E1;
--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:16px;--sp-xl:24px;--touch:48px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px}
[data-theme="dark"]{--primary:#A5B4FC;--on-primary:#1E1B4B;--primary-container:#312E81;--on-primary-container:#E0E7FF;
--secondary:#34D399;--secondary-container:#064E3B;--on-secondary-container:#D1FAE5;--tertiary:#FBBF24;--tertiary-container:#78350F;--on-tertiary-container:#FEF3C7;
--error:#F87171;--error-container:#7F1D1D;--on-error-container:#FFE4E1;
--background:#0F172A;--surface:#1E293B;--on-surface:#F1F5F9;--surface-variant:#334155;--on-surface-variant:#CBD5E1;--outline:#64748B;--outline-variant:#475569}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--background);color:var(--on-surface);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;min-height:100dvh}
.phone{width:100%;max-width:420px;min-height:100dvh;display:flex;flex-direction:column}
.sym{font-family:'Material Symbols Rounded';line-height:1;display:inline-block;font-size:22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.topbar{display:flex;align-items:center;gap:var(--sp-xs);height:64px;padding:0 var(--sp-xs);background:var(--background)}
.topbar h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
.icon-btn{width:var(--touch);height:var(--touch);display:grid;place-items:center;border-radius:var(--r-pill);color:var(--on-surface-variant)}
main{flex:1;padding:var(--sp-sm) var(--sp-lg) 40px;display:flex;flex-direction:column;gap:var(--sp-xl)}
.hero{display:flex;align-items:center;gap:var(--sp-lg);padding:var(--sp-sm) var(--sp-xs) 0}
.disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--primary-container);color:var(--primary);font-size:26px;font-weight:700;box-shadow:0 0 0 4px var(--surface)}
.who{flex:1;min-width:0}
.who p{font-size:14px;color:var(--on-surface-variant);margin-top:6px}
.group h3{font-size:14px;font-weight:600;color:var(--on-surface-variant);padding:0 var(--sp-xs) var(--sp-sm)}
.list{background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:var(--sp-lg);min-height:56px;padding:var(--sp-sm) var(--sp-lg)}
.item+.item{border-top:1px solid var(--surface-variant)}
.item>.sym{color:var(--on-surface-variant)}
.item .t{flex:1}
.item .t>span{display:block;font-size:13px;color:var(--on-surface-variant)}
.item .t>b{display:block;font-size:15px;font-weight:500;margin-top:1px}
.roles{display:flex;gap:var(--sp-sm);padding:var(--sp-md) var(--sp-lg)}
.role{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 var(--sp-md);border-radius:var(--r-sm);border:1px solid var(--outline-variant);font-size:13px;font-weight:500}
.role .sym{font-size:18px;color:var(--primary)}
.shim{display:block;border-radius:6px;background:linear-gradient(90deg,var(--surface-variant) 0%,var(--background) 50%,var(--surface-variant) 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.shim{animation:none}}
</style></head>
<body><div class="phone" data-testid="profile_screen">
<header class="topbar"><button class="icon-btn" aria-label="Back" data-testid="profile_back" data-od-nav="home"><span class="sym">arrow_back</span></button><h1>Profile</h1></header>
<main aria-busy="true">
  <section class="hero" data-testid="profile_identity">
    <div class="disc" aria-hidden="true">F</div>
    <div class="who">
      <span class="shim" style="width:72%;height:28px" aria-label="Loading name"></span>
      <p>fieldofficer</p>
      <span class="shim" style="width:58%;height:14px;margin-top:8px"></span>
    </div>
  </section>

  <section class="group">
    <div class="list">
      <div class="item"><span class="sym">apartment</span><div class="t"><span>Office</span><b>CENTRAL</b></div></div>
      <div class="item" data-testid="profile_scope"><span class="sym">insights</span><div class="t"><span>What Home shows</span><span class="shim" style="width:46%;height:16px;margin-top:4px"></span></div></div>
    </div>
  </section>

  <section class="group" data-testid="profile_roles">
    <h3>Roles</h3>
    <div class="list"><div class="roles"><span class="role"><span class="sym">badge</span>OFICIAL DE CAMPO</span></div></div>
  </section>

  <section class="group" data-testid="profile_session">
    <h3>Signed in to</h3>
    <div class="list">
      <div class="item"><span class="sym">dns</span><div class="t"><b>Mifos field officer gateway</b></div></div>
      <div class="item"><span class="sym">link</span><div class="t"><span>Server</span><b>https://apis.mifos.community/1.0/field/v1/</b></div></div>
      <div class="item"><span class="sym">tag</span><div class="t"><span>Tenant</span><b>mifos-bank-1</b></div></div>
    </div>
  </section>
</main>
</div></body></html>
