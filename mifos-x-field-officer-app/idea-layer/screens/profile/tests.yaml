# screens/profile/tests.yaml — /idea-feature-enrich 2026-10-27; identities measured on the gateway (users/32).
schema_version: v1.0.0
feature: profile
state_coverage: [loading, content, error, offline, change_password]
scenarios:
  - id: content_opens_from_home_avatar
    preconditions: ["fieldofficer is signed in", "online"]
    actions: ["on Home, tap the IZ avatar"]
    assertions: ["Profile opens with a back arrow and no bottom navigation", "Irving Zepeda, fieldofficer, oficial.campo@gmail.com, CENTRAL and OFICIAL DE CAMPO are shown", "no staff chip (fieldofficer has no staff link)", "back returns to Home"]
    priority: high
  - id: content_scope_matches_home
    preconditions: ["fieldofficer has no staff link", "a staff-linked loan officer exists"]
    actions: ["open Profile as each user"]
    assertions: ["fieldofficer reads 'Office: CENTRAL'", "the staff-linked user reads 'My portfolio' with a Loan officer chip", "each matches the scope chip on their Home"]
    priority: high
  - id: content_session_shows_live_instance
    preconditions: ["signed in to the field officer gateway"]
    actions: ["open Profile", "tap Server settings"]
    assertions: ["the session card shows the gateway name with Live, its URL and tenant mifos-bank-1", "Server settings opens Server config"]
    priority: medium
  - id: loading_session_first
    preconditions: ["users/{userId} is slow"]
    actions: ["open Profile"]
    assertions: ["username, office and roles show at once", "only the full name and email shimmer"]
    priority: low
  - id: error_name_read_fails
    preconditions: ["users/{userId} returns 500", "nothing cached"]
    actions: ["open Profile", "tap Retry after the server recovers"]
    assertions: ["the session identity stays on screen", "the banner shows the server's reason", "Retry loads the full name"]
    priority: medium
  - id: offline_identity_from_session
    preconditions: ["signed in", "airplane mode"]
    actions: ["open Profile"]
    assertions: ["the offline banner shows", "identity, roles, scope and session render", "Change password is disabled with a reason", "Sign out still works"]
    priority: high
  - id: change_password_happy_path
    preconditions: ["online", "a test user whose password may be changed"]
    actions: ["tap Change password", "enter a policy-valid new password twice", "tap Save password"]
    assertions: ["the sheet closes with 'Password changed'", "the next request succeeds without signing in again", "signing in later works with the new password only"]
    priority: high
  - id: change_password_mismatch_blocked
    preconditions: ["the change-password sheet is open"]
    actions: ["enter two different passwords"]
    assertions: ["Save password stays disabled", "'Passwords do not match' shows under the second field", "nothing is sent"]
    priority: medium
  - id: change_password_refused_by_server
    preconditions: ["online"]
    actions: ["enter 'abc' twice", "tap Save password"]
    assertions: ["the server's policy message shows on the sheet (12 to 50 characters …)", "the sheet stays open", "the old password still signs in"]
    priority: high
  - id: sign_out_from_profile
    preconditions: ["signed in"]
    actions: ["tap Sign out", "keep 'Sign out and clear data' ticked", "confirm"]
    assertions: ["the app returns to sign-in", "cached records and drafts are gone", "the same dialog as Settings → Sign out was used"]
    priority: high
