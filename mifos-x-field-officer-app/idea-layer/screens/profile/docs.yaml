decisions:
  - id: opened-from-home-avatar
    decision: The Home avatar is the only entry point; there is no Profile tab and no drawer.
    why: operator 2026-10-27 — 'let connect profile here on home profile icon' after the drawer was removed
  - id: identity-from-two-sources
    decision: >-
      The session saved at sign-in (username, userId, office, roles, permissions) renders at once and offline; GET
      users/{userId} adds the first/last name, email and staff link, cached like every other read. A failed name read
      never blanks the screen.
    why: the session already holds most of the identity; only the name, email and staff link need the network
  - id: scope-is-home-scope
    decision: >-
      The scope line uses exactly Home's rule — staff link → "My portfolio", none → the office — so the profile explains
      the figures on Home rather than computing its own.
    why: one rule, two readers; a second derivation would drift
  - id: change-password-re-signs-in
    decision: >-
      After Fineract accepts a new password the app signs in again with it and stores the new session key, so the
      officer is not thrown out by the next request; if that sign-in fails, the app signs out with data kept.
    why: the stored Basic key is derived from the old password and every later request would be a 401
  - id: password-path
    decision: >-
      POST users/{userId}/pwd is the change-password call; PUT users/{userId} (the admin user-edit path, UPDATE_USER) is
      a fallback only. Each server validation message is shown on its own line; the app shows the policy as a hint but
      never enforces its own copy of it.
    why: >-
      measured 2026-10-27 — both paths route for fieldofficer and answer validation 400s (policy: 12–50 chars, upper,
      lower, digit, symbol, no spaces, no consecutive repeats; plus a server-side repeatPassword match), never 403
  - id: sign-out-shared-with-settings
    decision: >-
      Sign out here is the Settings flow (same dialog, 'Sign out and clear data' ticked by default); Settings keeps its
      row.
    why: one sign-out implementation; the profile is where officers look for it
  - id: detail-shell
    decision: Back arrow + 'Profile' title, no bottom navigation (ui.yaml#shell).
    why: the current screen has no app bar at all — the system back gesture is the only way out
answered_questions:
  - id: password-endpoint
    question: Does the gateway accept a self password change, and on which path?
    answer: >-
      Yes — POST users/{userId}/pwd routes and validates for fieldofficer (400 on policy and on mismatch, not 403).
      Probed with mismatched pairs only; the password never changed (old password re-signed in: 200). The success body
      is not measured.
    answered_at: '2026-10-27T18:45:00Z'
    answered_by: /idea-api-extend
permission_model:
  note: >-
    Nothing on the screen is hidden by permission. users/{id} needs READ_USER (fieldofficer has it — Home's greeting
    reads it); a refusal falls back to the session username. staff/{id} needs READ_STAFF; a refusal labels the chip
    'Staff'. The password change is the server's call — its refusal is shown verbatim.
