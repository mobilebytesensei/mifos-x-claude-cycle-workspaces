id: profile
name: Profile
description: >
  The signed-in field officer's own account, opened from the Home avatar (the navigation drawer whose header used to
  open it was removed 2026-10-27). It answers "who am I signed in as, where, and what can I see": full name, username,
  email, linked staff and whether they are a loan officer, office, roles, the portfolio scope Home uses (my portfolio
  when the user has a staff link, else the whole office), and the live server instance, URL and tenant. Two actions:
  change password and sign out. It is a detail screen with a back arrow and no bottom navigation; offline it still shows
  the identity held from sign-in.
