contracts:
  - capability: network
    platform_spec: >-
      Fineract REST through the existing dashboard user store (GET users/{id}, cached); GET staff/{id}; the password
      change and re-authentication as one-shot calls (never cached)
    permission: none
    error_cases:
      - Offline
      - Forbidden403
      - ValidationError400
      - Unauthorized401
      - ServerError5xx
  - capability: preferences
    platform_spec: >-
      multiplatform-settings (core/datastore): fineractUser session — read at once; key + password replaced after a
      password change
    permission: none
    error_cases: []
