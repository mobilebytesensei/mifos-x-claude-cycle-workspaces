vm_actions:
  - name: Retry
    signature: fun retry()
    state_mutations: []
    side_effects:
      - re-read the users/{id} stream (FetchPolicy.NETWORK_ONLY)
    error_handling:
      Offline: stays on the cached or session identity
  - name: OpenChangePassword
    signature: fun openChangePassword()
    state_mutations:
      - password=PasswordForm()
    side_effects: []
    error_handling:
      Offline: action disabled with the offline reason
  - name: PasswordChanged
    signature: 'fun newPassword(value: String) / fun repeatPassword(value: String)'
    state_mutations:
      - password.new / password.repeat
      - password.mismatch = repeat.isNotEmpty() && repeat != new
    side_effects: []
    error_handling: {}
  - name: SubmitPassword
    signature: fun submitPassword()
    state_mutations:
      - password.submitting=true
    side_effects:
      - ProfileRepository.changePassword(userId, new, repeat) → POST users/{userId}/pwd
      - AuthCommandRepository.signIn(username, new) → store the new session key
      - snackbar 'Password changed'; password=null
    error_handling:
      ValidationError400: password.serverErrors=errors[].defaultUserMessage; sheet stays open
      Forbidden403: password.serverErrors=[defaultUserMessage]
      ReauthFailed: sign out keeping data → sign-in
  - name: DismissPassword
    signature: fun dismissPassword()
    state_mutations:
      - password=null
    side_effects: []
    error_handling: {}
  - name: OpenServerConfig
    signature: fun openServerConfig()
    state_mutations: []
    side_effects:
      - event OpenServerConfig → ServerConfigRoute
    error_handling: {}
  - name: SignOut
    signature: fun signOut()
    state_mutations: []
    side_effects:
      - show feature/settings SignOutDialog (its own SignOutViewModel performs the sign-out)
    error_handling: {}
error_cases:
  - Offline
  - Forbidden403
  - ValidationError400
  - Unauthorized401
  - ServerError5xx
  - ReauthFailed
