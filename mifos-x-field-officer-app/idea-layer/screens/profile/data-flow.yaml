feature: profile
entries:
  - trigger: on_mount
    source: local.session              # ProjectPreferencesRepository.fineractUser — saved at sign-in
    target_state: content
    note: "username, userId, office, roles render at once; this is why offline still shows the identity"
  - trigger: on_mount
    source: api.get_user               # same store + key as Home (DashboardRepository.userStream)
    target_state: content
    loading_state: loading
    error_state: error
    on_error:
      nav_target: null
      error_code: network_error
  - trigger: after get_user (staff present)
    source: api.get_staff
    target_state: content
    note: "Loan officer / Staff label only; a failure leaves 'Staff'"
  - trigger: on_mount
    source: local.server_config        # live instance name + URL + tenant
    target_state: content
  - trigger: on_mount
    source: network_monitor.is_online
    target_state: offline
  - trigger: on_submit_password
    source: api.change_password
    target_state: content
    loading_state: change_password.submitting
    error_state: change_password
    then: api.reauthenticate
derived:
  state_rule: >-
    loading while get_user is in flight with nothing cached; error when it failed with nothing cached; offline overlay
    when the device has no network; change_password while the sheet is open; else content.
  scope_label: "session staff link (users/{userId}.staff) → My portfolio; none → office name (Home's rule)"
