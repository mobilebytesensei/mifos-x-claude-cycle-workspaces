# clientCharges — data flow. IMPORTED from source 2026-10-02.

schema_version: "3.1"
feature: clientCharges

entries:
  - id: charges
    source: "ClientChargeRepository.clientChargesStream(clientId, viewModelScope)"
    shape: "ScreenState<List<ChargesEntity>>"
    cardinality: many
    key: clientId
    is_empty: "it.isEmpty()"
    fetch_policy: NETWORK_WITH_CACHE
    offline: "Room-cached charges render with a staleness signal"

writes: []     # read-only screen

row_shape:
  entity: kpt.core.database.charge.entity.ChargesEntity
  fields_used:
    - name
    - amount
    - amountOutstanding
    - dueDate
    - currency
    - penalty
  fields_ignored:
    - { field: amountPaid, why: "outstanding already expresses the officer-facing fact" }
    - { field: amountWaived, why: "same" }
    - { field: amountWrittenOff, why: "same" }
    - { field: chargeTimeType, why: "not shown in the original's row either" }
    - { field: chargeCalculationType, why: "same" }
  note: >
    `dueDate: List<Int>?` is Fineract's [yyyy, M, d] triple, not a date type. It needs the same
    formatter the rest of the app uses; rendering it raw prints "[2026, 4, 1]".
