# clientCharges — test contract. IMPORTED from source 2026-10-02.

schema_version: "3.1"
feature: clientCharges

existing:
  file: null
  status: not_yet_written
  note: "new screen in this port — tests land with the implementation"

state_coverage:
  - state: loading
    covered: false
  - state: content
    covered: false
    scenarios:
      - "rows render name, amount and outstanding from the entity"
      - "outstanding > 0 paints moneyNegative, not the brand primary"
      - "dueDate [2026,4,1] formats as a date, never as a raw list"
  - state: empty
    covered: false
    scenarios:
      - "an empty page renders the shared empty state, not a bare list"
  - state: error
    covered: false
    scenarios:
      - "retry calls clientChargesStream.retry(), not a no-op lambda"
  - state: offline
    covered: false

proposed:
  - id: non-2xx-is-not-empty
    priority: P1
    why: >
      The shared client does not set expectSuccess, so a 401/502 body deserializes onto Page's
      defaults and reaches the screen as a successful EMPTY page — indistinguishable from "this
      client has no charges". This screen is read-only, so that failure is completely silent here.
      A test that pins an error response to ScreenState.Error would catch it.
  - id: page-serializer-is-the-serializable-one
    priority: P1
    why: >
      Two Page<T> classes existed; the APIs imported the non-@Serializable one and every list
      deserialized to zero items. Deleted 2026-10-02, but nothing asserts which Page the charge
      API binds.

device:
  status: maestro-not-authored
  gap: "spec AC14 — device evidence must be a maestro-executed flow from S3c on"
