# clientCharges — API contract. IMPORTED from source 2026-10-02.

schema_version: "3.1"
feature: clientCharges

endpoints:
  - id: getClientCharges
    method: GET
    path: "clients/{clientId}/charges"
    request:
      path_params:
        clientId: { type: Int, required: true }
      query:
        offset: 0
        limit: 0        # the original's getListOfClientCharges pins ?offset=0&limit=0 = "all"
    response:
      type: "Page<ChargesEntity>"
      items_key: pageItems
      note: >
        Page<T> MUST be the @Serializable one in core/model. A second, non-serializable Page<T>
        existed in core/common and silently deserialized every list to zero items until it was
        deleted on 2026-10-02.
    write_policy: null    # read-only
    cache: Store5

substrate:
  repository: kpt.core.data.charge.ClientChargeRepository
  method: "clientChargesStream(clientId, scope)"
  store: "AppStoreIds.ClientCharges"
  cache_key: "AppCacheKeys.ClientCharges.forClient(clientId)"
  fetch_policy: NETWORK_WITH_CACHE
  fetch_policy_why: >
    NOT the CACHE_FIRST_SWR default. SWR reads cached(refresh=false) and leaves fetching to a
    freshness-band gate that cannot fire on a cold cache, so a first open renders Loading forever
    with zero requests. Fixed across all 17 repositories on 2026-10-02.
  ttl: "AppStoreRegistry.Ttl.CLIENT_CHARGES"
  already_exists: true
  note: "the substrate shipped in S0b; this feature adds only the UI layer"
