schema_version: "3.1"
id: clientCharges
name: Client charges
description: >
  The charges levied on one client — name, amount, outstanding balance and due date. Read-only.
  Reached from client detail, which in the shipped port has no charges destination at all.
feature: clientCharges
flow: client
version: "1.0"
tags: [mvp, client, P1]

module_path: feature/client     # RULE-KMP-FEATURE-MODULE-PATH-001 — lives inside the client module

provenance:
  imported_from: "6b66e8a43"
  imported_at: "2026-10-02"
  imported_by: "/idea-feature-import (hand-rolled)"
  extraction: complete
  source_files:
    - feature/client/src/commonMain/kotlin/com/mifos/feature/client/clientUpcomingCharges/ClientUpcomingChargesScreen.kt
    - feature/client/src/commonMain/kotlin/com/mifos/feature/client/clientUpcomingCharges/ClientUpcomingChargesViewmodel.kt
    - feature/client/src/commonMain/kotlin/com/mifos/feature/client/clientUpcomingCharges/ClientUpcomingChargesRoute.kt
    - feature/client/src/commonMain/kotlin/com/mifos/feature/client/navigation/ClientNavigation.kt   # registering graph
    - core/database/src/commonMain/kotlin/kpt/core/database/charge/entity/ChargesEntity.kt           # row shape

# ──────────────── SCOPE DECISION ────────────────
# The original splits charges across TWO screens and this docset covers only the first:
#
#   clientUpcomingCharges  — the LIST (this feature). Read-only.
#   charges                — a CREATE/UPDATE form (amount, due date, charge option), backed by
#                            GetChargesTemplateUseCase + CreateChargesUseCase.
#
# Confusingly, the original's client DETAIL wires `charges` to the CREATE form, not the list — so a
# field officer tapping "Charges" from a client goes straight to "add a charge" and has no way to
# see existing ones from there. The list is reachable only from clientProfileGeneral.
#
# This port wires detail → LIST, which is what the label promises. Create arrives as a follow-up
# with its own docset; it needs the template fetch, field validation and a MutationGateway write,
# none of which belong in a read screen.
scope:
  covers: [list]
  defers:
    - id: create-charge
      original: feature/client/.../charges/
      why: "template fetch + validation + OnlineRequired mutation — a separate vertical"

status: imported
status_history:
  - from: null
    to: imported
    at: "2026-10-02"
    by: /idea-feature-import

entry_point: false
bottom_nav: false
navigates_to: []

route:
  name: ClientChargesRoute
  original_name: ClientUpcomingChargesRoute
  params:
    clientId: { type: Int, required: true }
  note: >
    The original carried `resourceId` + `resourceType: String` so one screen could serve clients,
    loans and savings. This port takes a typed `clientId` because the only wired caller is client
    detail; a stringly-typed resourceType that only ever holds "clients" is a type hole, not
    flexibility. Loan/savings charges get their own route when those slices land.

entry_points:
  - source: clientDetail
    action: "charges row tapped"
    params: { clientId: "client.id" }

screens:
  - id: clientCharges
    name: ClientChargesScreen
    viewmodel: ClientChargesViewModel

port_deviations:
  - id: detail-opens-list-not-form
    original: "client detail → charges → CREATE form; the list is reachable only from clientProfileGeneral"
    shipped: "client detail → charges → LIST"
    why: "a 'Charges' action that opens an empty create form, with no way to see existing charges, is a mislabelled destination"
  - id: typed-route
    original: "resourceId: Int + resourceType: String"
    shipped: "clientId: Int"
    why: "the only wired caller is a client; see route.note"
  - id: no-dialog-state
    original: "ClientUpcomingChargesDialog renders state.dialogState errors"
    shipped: "ScreenState.Error with retry, via the shared ScreenContent contract"
    why: "the substrate owns the four non-content states; a per-screen dialog duplicates them"
