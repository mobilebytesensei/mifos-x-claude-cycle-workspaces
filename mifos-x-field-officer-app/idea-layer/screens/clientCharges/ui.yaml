# clientCharges — UI contract. IMPORTED from source 2026-10-02.

schema_version: "3.1"
screen_id: clientCharges
name: Client charges
status: imported

feature_profile:
  combo_id: list_read
  facets: [list, read, finance]
  archetype: screen-content
  store_archetype: NETWORK_WITH_CACHE
  recipe_ref: FEATURE_LAYER_BUILD_GUIDE
  heal: auto
  profile_hash: imported-from-source

# ──────────────── STATES ────────────────
# The four non-content states come from the substrate's ScreenState contract, not from this screen.
# The original hand-rolled `isLoading` + a dialog and had no offline branch at all.
states: [loading, content, empty, error, offline]
initial_state: loading     # ES3 — api-backed primary read

state_detail:
  - id: loading
    components: [header]
  - id: content
    components: [header, charge_list]
  - id: empty
    components: [header, empty_card]
    copy: "No charges for this client"
    note: >
      An empty RESULT here means the client genuinely has no charges — unlike the client list,
      there is no filter that can empty it, so Empty and "no data" are the same fact.
  - id: error
    components: [header, error_retry]
  - id: offline
    components: [header, charge_list]
    note: "cached charges still render; the freshness signal marks them stale"

# ──────────────── COMPONENTS ────────────────
components:
  - id: header
    type: header
    label_ref: feature_client_charges_title
    shows_count: true
    note: >
      The original rendered `"$itemCount " + client_savings_item` — reusing the SAVINGS string on a
      charges screen, so the header read "3 Savings Account" above a list of charges. Fixed here
      with its own string; recorded because it is the kind of copy bug that survives review.

  - id: charge_list
    type: lazy_column
    item: charge_row
    data: "charges"

  - id: charge_row
    type: list_item
    fields:
      - { key: name, from: "charge.name" }
      - { key: amount, from: "charge.amount", format: currency, currency_from: "charge.currency" }
      - { key: outstanding, from: "charge.amountOutstanding", format: currency, emphasis: true }
      - { key: dueDate, from: "charge.dueDate", format: date }
    semantic_colour:
      rule: "amountOutstanding > 0 → moneyNegative; else moneyPositive"
      note: >
        Uses LocalFinanceColors, NOT the brand primary. An outstanding balance is the single fact a
        field officer reads this screen for — painting it indigo because indigo is the brand colour
        would bury it (DESIGN.md §"Money is not brand").
    on_click: null
    on_click_note: >
      Deliberately null, not an empty lambda. The original's rows were not interactive either, and
      a charge detail screen does not exist in this port — a tap that silently does nothing is the
      dead-clickable defect (RULE-IMPL-DEAD-CLICKABLE-001).

  - id: empty_card
    type: empty_state
    source: "LocalScreenStateDefaults"

  - id: error_retry
    type: error_state
    source: "LocalScreenStateDefaults"
    on_click:
      action: retry
      target: "clientChargesStream.retry"

# ──────────────── ACCESSIBILITY ────────────────
a11y:
  - "amounts carry a contentDescription including the currency — a bare number read aloud is ambiguous"
  - "row height >= spacing.touchTargetMin (48dp) even though rows are not tappable, for scan legibility"
