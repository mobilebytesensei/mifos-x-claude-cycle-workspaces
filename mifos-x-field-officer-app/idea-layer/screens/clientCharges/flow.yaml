# clientCharges — flow contract. IMPORTED from source 2026-10-02.

schema_version: "3.1"
feature: clientCharges

inbound_routes:
  - from: clientDetail
    when: "charges row tapped"
    graph: authenticated
    params: { clientId: "client.id" }
    status: NEW_IN_PORT
    note: >
      The original wired detail → the CREATE form and left the list reachable only from
      clientProfileGeneral, which this port has not migrated. Wiring detail → list is what makes
      the action match its label (docs.yaml#port_deviations.detail-opens-list-not-form).

entry_points:
  - route: ClientChargesRoute
    params: { clientId: Int }

transitions:
  - id: load
    from: loading
    trigger: "screen opened"
    to: [content, empty, error, offline]
    decided_by: "ScreenState from clientChargesStream"
    note: "the stream decides; the screen renders. No per-screen isLoading flag."

  - id: retry
    from: error
    trigger: "error_retry tapped"
    to: loading
    side_effects: ["clientChargesStream.retry() — forceFresh"]

  - id: back
    from: [content, empty, error, offline]
    trigger: "back pressed"
    to_screen: clientDetail

exits:
  - to: clientDetail
    when: "back"

dead_ends: []
dead_ends_note: >
  charge_row has no on_click by design — a charge detail screen does not exist in this port. Null
  rather than an empty lambda, so the row renders without a tap affordance instead of offering one
  that does nothing.
