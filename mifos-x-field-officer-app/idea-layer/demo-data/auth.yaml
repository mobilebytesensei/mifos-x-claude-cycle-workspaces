# demo-data — auth. Values renderers and previews may show.
#
# Both prompt builds warned "no demo data for `signin`", which is why the renderer invented its own
# plausible content (an "Active Officer ID" row, `demo.mifos.io`). Demo data is how you get
# realistic content WITHOUT the renderer making it up.
#
# ⚠ NO REAL CREDENTIAL IS EVER STORED HERE. A password belongs in the vault and nowhere else
# (RULE-SECRETS-VAULT-001). The password row below is a MASK — the literal characters a preview
# should draw — not a value anything authenticates with. The public Mifos demo credential is
# documented on the public Mifos wiki; it is not duplicated into the repo.

schema_version: "1.0"
collection: auth

# ──────────────── THE INSTANCE THE APP SHIPS AGAINST ────────────────
# Verified live on device 2026-10-03. These are PUBLIC endpoint facts, not secrets.
instance:
  host: "apis.mifos.community"
  tenant: "mifos-bank-1"
  base_path: "1.0/field/v1/"
  display: "apis.mifos.community · mifos-bank-1"
  note: >
    The authoritative copy is `app-profile/app.yaml#network.access_points[id=mifos]`;
    `ServerConfigAccessPointParityTest` fails the build if the screen's default and the access point
    ever diverge again. Earlier docs listed `demo.mifos.io/fineract-provider/api/v1` — the plain
    Fineract path that 404'd on every call.

# ──────────────── FIELD VALUES FOR PREVIEWS ────────────────
credentials:
  username:
    value: "fieldofficer"
    note: "the public Mifos demo officer account; lowercase is load-bearing — the username is case-sensitive"
  password:
    rendered_as: "••••••••"
    note: "A MASK, not a value. A preview draws bullets; it never draws characters, and no credential is stored here."

# ──────────────── WHAT A SUCCESSFUL RESPONSE CARRIES ────────────────
# Shape taken from the real captured response (values trimmed) so previews of the success state
# show believable content of the right kind and magnitude.
session:
  username: "fieldofficer"
  userId: 32
  officeId: 1
  officeName: "CENTRAL"
  roles:
    - { id: 12, name: "OFICIAL DE CAMPO" }
  permissions_count: 2
  note: >
    The live response carries a ~600-entry `permissions[]`. Only the COUNT is modelled here — a
    preview never needs the list, and pasting 600 strings into demo data would bloat every prompt
    that binds this collection.

# ──────────────── FAILURE COPY ────────────────
# The app's own strings, so a preview of an error state shows what the user will really read
# instead of inventing vendor-flavoured copy like "Network Transport Error: Host unreachable".
messages:
  rejected: "Login failed. Check your credentials and try again."
  offline: "You are offline. Signing in needs a connection."
  username_invalid: "Invalid username length"
  password_invalid: "Invalid password length"
  note: >
    `username_invalid` deliberately carries NO number. An earlier replacement read "at least 5
    characters", which hardcoded a threshold into user-facing copy AND hardcoded the wrong one — the
    rule is 4. Copy that names a number drifts from the rule silently.
