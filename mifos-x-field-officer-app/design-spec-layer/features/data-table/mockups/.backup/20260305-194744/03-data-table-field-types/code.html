<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Field Types Showcase</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1975d2",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                    },
                    fontFamily: {
                        "display": ["Inter", "Roboto", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        .md3-input-focus:focus-within label {
            color: #1975d2;
            transform: translateY(-50%) scale(0.85);
            background-color: white;
            padding: 0 4px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark flex justify-center items-start min-h-screen">
<!-- Mobile Container -->
<div class="relative w-full max-w-[420px] min-h-screen bg-background-light dark:bg-background-dark shadow-2xl flex flex-col">
<!-- Header -->
<header class="sticky top-0 z-10 bg-white dark:bg-slate-900 px-4 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100 cursor-pointer">arrow_back</span>
<h1 class="text-[18px] font-bold text-slate-900 dark:text-slate-100 leading-tight tracking-tight">Field Types Showcase</h1>
</header>
<!-- Main Content Area -->
<main class="flex-1 p-4 overflow-y-auto">
<div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-4">
<!-- Grid Layout -->
<div class="grid grid-cols-2 gap-4">
<!-- Row 1: BooleanField & IntegerField -->
<div class="flex flex-col justify-center">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">BooleanField</label>
<div class="flex items-center justify-between p-2 rounded-lg border border-slate-200 dark:border-slate-700 h-[56px]">
<span class="text-sm font-medium text-slate-900 dark:text-slate-100">Active</span>
<label class="relative flex h-[31px] w-[51px] cursor-pointer items-center rounded-full border-none bg-primary p-0.5 justify-end">
<div class="h-full w-[27px] rounded-full bg-white shadow-md"></div>
<input checked="" class="invisible absolute" type="checkbox"/>
</label>
</div>
</div>
<div class="relative group md3-input-focus">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">IntegerField</label>
<div class="relative">
<input class="w-full h-[56px] rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-4 pt-2 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="number" value="42"/>
<span class="absolute left-3 -top-2 px-1 bg-white dark:bg-slate-900 text-[10px] text-slate-500 font-medium">Age</span>
</div>
</div>
<!-- Row 2: DecimalField & StringField -->
<div class="relative group md3-input-focus">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">DecimalField</label>
<div class="relative">
<input class="w-full h-[56px] rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-4 pt-2 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="text" value="1234.56"/>
<span class="absolute left-3 -top-2 px-1 bg-white dark:bg-slate-900 text-[10px] text-slate-500 font-medium">Amount</span>
</div>
</div>
<div class="relative group md3-input-focus">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">StringField</label>
<div class="relative">
<input class="w-full h-[56px] rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-4 pt-2 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="text" value="John Doe"/>
<span class="absolute left-3 -top-2 px-1 bg-white dark:bg-slate-900 text-[10px] text-slate-500 font-medium">Name</span>
</div>
</div>
<!-- Row 3: MultilineTextField & DateField -->
<div class="relative group md3-input-focus">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">MultilineTextField</label>
<div class="relative">
<textarea class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-4 pt-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none" rows="3">Sample text for notes field across multiple lines for demonstration.</textarea>
<span class="absolute left-3 -top-2 px-1 bg-white dark:bg-slate-900 text-[10px] text-slate-500 font-medium">Notes</span>
</div>
</div>
<div class="relative group md3-input-focus">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">DateField</label>
<div class="relative">
<input class="w-full h-[56px] rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent pl-4 pr-10 pt-2 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="text" value="05 Mar 2026"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400">calendar_today</span>
<span class="absolute left-3 -top-2 px-1 bg-white dark:bg-slate-900 text-[10px] text-slate-500 font-medium">Birth Date</span>
</div>
</div>
<!-- Row 4: DateTimeField & DropdownField -->
<div class="relative group md3-input-focus">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">DateTimeField</label>
<div class="relative">
<input class="w-full h-[56px] rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent pl-4 pr-10 pt-2 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="text" value="05 Mar 2026 14:30"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400">schedule</span>
<span class="absolute left-3 -top-2 px-1 bg-white dark:bg-slate-900 text-[10px] text-slate-500 font-medium">Created At</span>
</div>
</div>
<div class="relative group">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1 block">DropdownField</label>
<div class="relative">
<div class="w-full h-[56px] rounded-t-lg border border-primary bg-primary/5 px-4 pt-2 text-slate-900 dark:text-slate-100 flex items-center justify-between cursor-pointer border-b-2">
<span class="pt-2">USA</span>
<span class="material-symbols-outlined text-primary pt-2">arrow_drop_up</span>
</div>
<span class="absolute left-3 -top-2 px-1 bg-white dark:bg-slate-900 text-[10px] text-primary font-medium">Country</span>
<!-- Dropdown Menu -->
<div class="absolute z-20 w-full bg-white dark:bg-slate-800 shadow-xl rounded-b-lg border-x border-b border-primary overflow-hidden">
<div class="px-4 py-3 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 bg-primary/10">USA</div>
<div class="px-4 py-3 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 border-t border-slate-100 dark:border-slate-700">Mexico</div>
<div class="px-4 py-3 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm text-slate-900 dark:text-slate-100 border-t border-slate-100 dark:border-slate-700">Canada</div>
</div>
</div>
</div>
</div>
</div>
<!-- Additional visual spacer for dropdown content -->
<div class="h-32"></div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex justify-around items-center py-2 pb-6">
<a class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill-current">grid_view</span>
<span class="text-[10px] font-medium">Fields</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-medium">Settings</span>
</a>
</nav>
</div>
</body></html>
