<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Personal Data Form Grid</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1972d2",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                        "surface-variant": "#E7E0EC",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex h-screen w-full max-w-[430px] mx-auto flex-col bg-white dark:bg-slate-900 shadow-2xl overflow-hidden border-x border-slate-200 dark:border-slate-800">
<!-- Header Section -->
<div class="bg-surface-variant dark:bg-primary/20 p-4 rounded-t-lg flex items-center justify-between mx-4 mt-6">
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-semibold leading-tight tracking-tight">DATOS_DE_LA_PERSONA</h2>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-primary">edit</span>
</button>
</div>
<!-- Scrollable Form Content -->
<div class="flex-1 overflow-y-auto bg-[#FAFAFA] dark:bg-background-dark/50 px-4 py-6">
<div class="grid grid-cols-2 gap-x-4 gap-y-6">
<!-- Row 1 -->
<div class="flex flex-col gap-2">
<label class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">FECHA_DE_NACIMIENTO</label>
<div class="relative group">
<input class="w-full h-12 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="Select date" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">calendar_month</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">ESTADO_CIVIL</label>
<div class="relative group">
<select class="w-full h-12 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none appearance-none transition-all">
<option disabled="" selected="" value="">Select option</option>
<option>Single</option>
<option>Married</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
</div>
<!-- Row 2 -->
<div class="flex flex-col gap-2">
<label class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">MUNICIPIO</label>
<input class="w-full h-12 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="Enter municipality" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">TIPO_DE_IDENTIFICACION</label>
<input class="w-full h-12 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="Enter ID type" type="text"/>
</div>
<!-- Row 3 -->
<div class="flex flex-col gap-2">
<label class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">MARITAL STATUS</label>
<div class="relative group">
<select class="w-full h-12 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none appearance-none transition-all">
<option disabled="" selected="" value="">Select option</option>
<option>Option 1</option>
<option>Option 2</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">SEXO</label>
<div class="relative group">
<select class="w-full h-12 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none appearance-none transition-all">
<option disabled="" selected="" value="">Select option</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
</div>
<!-- Row 4 -->
<div class="flex flex-col gap-2">
<label class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">EDAD</label>
<input class="w-full h-12 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="0" type="number"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-xs font-medium text-slate-600 dark:text-slate-400 uppercase tracking-wider">NUM_DEPENDIENTES</label>
<input class="w-full h-12 px-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" placeholder="0" type="number"/>
</div>
</div>
<div class="mt-8">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                    Guardar Cambios
                </button>
</div>
</div>
<!-- Bottom Navigation Bar -->
<div class="flex items-center justify-around border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-4 py-3">
<a class="flex flex-1 flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-medium leading-none">Home</p>
</a>
<a class="flex flex-1 flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">description</span>
<p class="text-[10px] font-medium leading-none">Forms</p>
</a>
<a class="flex flex-1 flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-[10px] font-medium leading-none">Profile</p>
</a>
</div>
<!-- iOS Home Indicator -->
<div class="h-6 flex justify-center items-center bg-white dark:bg-slate-900">
<div class="w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</div>
</body></html>
