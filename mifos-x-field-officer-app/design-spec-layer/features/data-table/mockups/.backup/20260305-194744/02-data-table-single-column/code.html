<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Single Column Dynamic Form</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1975d2",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .form-input:focus {
            border-color: #1975d2;
            ring-color: #1975d2;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex justify-center items-start">
<!-- Mobile Container Emulator -->
<div class="relative flex h-full min-h-screen w-full max-w-[430px] flex-col bg-[#FAFAFA] shadow-2xl overflow-x-hidden border-x border-slate-200">
<!-- Top App Bar -->
<div class="flex items-center bg-[#FAFAFA] p-4 pb-2 justify-between sticky top-0 z-10 border-b border-slate-100">
<div class="text-slate-900 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 cursor-pointer">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</div>
<h2 class="text-slate-900 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 ml-2">Dynamic Form</h2>
<div class="text-slate-900 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 cursor-pointer">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
</div>
</div>
<!-- Header Card Section -->
<div class="p-4">
<div class="flex flex-col items-stretch justify-start rounded-xl overflow-hidden bg-[#E7E0EC] border border-primary/10">
<div class="w-full bg-center bg-no-repeat aspect-video bg-cover" data-alt="Abstract professional workspace with office supplies" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCnFXP_6fEbQyyS1ao4zSlMMGQJw2bdROW_lnGOK96b5OMHcjs3AL8qOv0mbDu2Uf47eixjtUQuu8pWJzq0-UF0ukL9Rjl7qnH4A8hhDggCLfwGjHGY8AHPf4W6llcjkrcLl83Y8O5QeqyTHEXds9dNiyBqggK2K_g9HIF8SGL4Y1ITMYAwqU9NhDTBo4b_rmF4TbHWvEUa581YI2HC3T6f92R9npoKN983-IbNc3-sPssP-2FqwjIVkFVVOI5U438Nsytj0dCkKsU");'>
</div>
<div class="flex w-full flex-col items-stretch justify-center gap-1 p-4">
<div class="flex items-center justify-between">
<p class="text-slate-900 text-sm font-semibold leading-tight tracking-wider uppercase">CONDICION</p>
<button class="flex size-8 cursor-pointer items-center justify-center rounded-full bg-white text-primary shadow-sm hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[18px]">edit</span>
</button>
</div>
<p class="text-slate-600 text-sm font-normal leading-normal">Form Preview Header</p>
</div>
</div>
</div>
<!-- Form Fields Container -->
<div class="flex flex-col gap-3 px-4 pb-8">
<!-- Field 1: MONTO_SOLICITADO -->
<div class="flex flex-col w-full">
<label class="flex flex-col flex-1">
<p class="text-slate-700 text-xs font-semibold leading-normal pb-1.5 uppercase tracking-wide">MONTO_SOLICITADO</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 rounded-lg text-slate-900 border border-slate-300 bg-white focus:border-primary focus:ring-1 focus:ring-primary h-14 placeholder:text-slate-400 px-4 text-base font-normal leading-normal transition-all" placeholder="0.00" step="0.01" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium text-sm">USD</span>
</div>
</label>
</div>
<!-- Field 2: SI (Exposed Dropdown) -->
<div class="flex flex-col w-full">
<label class="flex flex-col flex-1">
<p class="text-slate-700 text-xs font-semibold leading-normal pb-1.5 uppercase tracking-wide">SI</p>
<div class="relative group">
<select class="form-input flex w-full min-w-0 flex-1 appearance-none rounded-lg text-slate-900 border border-slate-300 bg-white focus:border-primary focus:ring-1 focus:ring-primary h-14 px-4 text-base font-normal leading-normal transition-all pr-10">
<option disabled="" selected="" value="">Select option</option>
<option value="one">Option one</option>
<option value="two">Option two</option>
<option value="three">Option three</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
                            expand_more
                        </span>
</div>
</label>
</div>
<!-- Field 3: LUGAR (Multiline) -->
<div class="flex flex-col w-full">
<label class="flex flex-col flex-1">
<p class="text-slate-700 text-xs font-semibold leading-normal pb-1.5 uppercase tracking-wide">LUGAR</p>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 border border-slate-300 bg-white focus:border-primary focus:ring-1 focus:ring-primary min-h-[120px] placeholder:text-slate-400 p-4 text-base font-normal leading-normal transition-all" placeholder="Enter location details..."></textarea>
</label>
</div>
<!-- Field 4: ACTIVO (Switch Toggle) -->
<div class="flex items-center justify-between py-3 px-1">
<div class="flex flex-col">
<p class="text-slate-700 text-xs font-semibold leading-normal uppercase tracking-wide">ACTIVO</p>
<p class="text-slate-500 text-[11px]">Enable active status for this entry</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Bottom Spacer -->
<div class="h-10"></div>
<!-- Actions -->
<div class="flex flex-col gap-3 sticky bottom-4">
<button class="flex h-12 w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-primary text-white text-base font-semibold leading-normal shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all">
<span>Submit Data</span>
</button>
<button class="flex h-12 w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-transparent border border-slate-200 text-slate-600 text-base font-medium leading-normal hover:bg-slate-50 transition-all">
<span>Cancel</span>
</button>
</div>
</div>
<!-- iOS Indicator -->
<div class="mt-auto flex justify-center pb-2">
<div class="h-1.5 w-32 rounded-full bg-slate-300"></div>
</div>
</div>
</body></html>
