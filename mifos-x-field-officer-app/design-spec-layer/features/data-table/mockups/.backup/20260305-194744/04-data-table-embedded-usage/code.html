<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Client Details Form View</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1476d2",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 fill=%27none%27 viewBox=%270 0 20 20%27%3e%3cpath stroke=%27%236b7280%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 stroke-width=%271.5%27 d=%27M6 8l4 4 4-4%27/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="sticky top-0 z-50 flex items-center bg-primary p-4 shadow-md h-16">
<button class="flex items-center justify-center text-white mr-4">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-white text-xl font-bold leading-tight tracking-tight">Client Details</h1>
</header>
<main class="flex-1 overflow-y-auto pb-24">
<!-- Section 1: Client Info Card -->
<div class="p-4">
<div class="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-sm flex flex-col items-center border border-slate-200 dark:border-slate-700">
<div class="mb-4">
<div class="size-16 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center overflow-hidden">
<img alt="Maria Garcia profile picture" class="w-full h-full object-cover" data-alt="Circular gray profile avatar of a client" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA777u1iWiii5zG7rT8alPy_-xzIw9CKWCNsAEOhcWyxUZ2moI3jBenVRxXVku35JG4HQ-KZPF_XsF762SDc1--3zTJhUlAfzymCymHBbk7Txjbv_wR-XBsA1p2le3o8DFdoST7An1xs1w5pgp8T72MqgAxoLNux5jRjaRNXnuBUuuunCRXP-tg7_R6oTz4zODt9Hfd4FSCcnMl5k6lhDnW_Iyn8hKZfdv42hu84qpbMqIbsEsEQTXDHnqGdhu6YUZkB0HGaBRwuI8"/>
</div>
</div>
<div class="text-center">
<h2 class="text-2xl font-bold text-slate-900 dark:text-white">Maria Garcia</h2>
<p class="text-slate-500 dark:text-slate-400 font-medium">CLI-2026-0042</p>
</div>
</div>
</div>
<!-- Section 2: DynamicDataTableForm (Expanded) -->
<div class="px-4 mb-4">
<div class="bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700">
<div class="bg-primary/10 dark:bg-primary/20 flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-700">
<h3 class="text-primary font-bold tracking-wider text-sm">DATOS_PERSONALES</h3>
<button class="text-primary p-1 hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="edit">edit</span>
</button>
</div>
<div class="p-4 grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1 col-span-1">
<label class="text-xs font-semibold text-slate-500 dark:text-slate-400">FECHA_NACIMIENTO</label>
<input class="w-full h-12 rounded-lg border-slate-300 dark:border-slate-600 bg-transparent text-sm focus:border-primary focus:ring-1 focus:ring-primary dark:text-slate-200" type="date" value="1990-05-15"/>
</div>
<div class="flex flex-col gap-1 col-span-1">
<label class="text-xs font-semibold text-slate-500 dark:text-slate-400">ESTADO_CIVIL</label>
<select class="custom-select w-full h-12 rounded-lg border-slate-300 dark:border-slate-600 bg-transparent text-sm focus:border-primary focus:ring-1 focus:ring-primary dark:text-slate-200">
<option value="soltero">Soltero/a</option>
<option selected="" value="casado">Casado/a</option>
<option value="divorciado">Divorciado/a</option>
</select>
</div>
<div class="flex flex-col gap-1 col-span-1">
<label class="text-xs font-semibold text-slate-500 dark:text-slate-400">MUNICIPIO</label>
<input class="w-full h-12 rounded-lg border-slate-300 dark:border-slate-600 bg-transparent text-sm focus:border-primary focus:ring-1 focus:ring-primary dark:text-slate-200" type="text" value="San Salvador"/>
</div>
<div class="flex flex-col gap-1 col-span-1">
<label class="text-xs font-semibold text-slate-500 dark:text-slate-400">TIPO_ID</label>
<input class="w-full h-12 rounded-lg border-slate-300 dark:border-slate-600 bg-transparent text-sm focus:border-primary focus:ring-1 focus:ring-primary dark:text-slate-200" type="text" value="DUI"/>
</div>
</div>
</div>
</div>
<!-- Section 3: DynamicDataTableForm (Collapsed) -->
<div class="px-4 mb-8">
<div class="bg-white dark:bg-slate-800 rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-700">
<div class="bg-primary/10 dark:bg-primary/20 flex items-center justify-between px-4 py-4 cursor-pointer">
<h3 class="text-primary font-bold tracking-wider text-sm">DATOS_LABORALES</h3>
<button class="text-primary p-1">
<span class="material-symbols-outlined" data-icon="expand_more">expand_more</span>
</button>
</div>
</div>
</div>
</main>
<!-- Bottom Primary Button -->
<footer class="fixed bottom-0 left-0 right-0 bg-background-light dark:bg-background-dark p-4 border-t border-slate-200 dark:border-slate-800">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="save">save</span>
                Save All Data
            </button>
</footer>
</div>
</body></html>
