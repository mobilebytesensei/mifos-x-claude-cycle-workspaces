<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0e75dd",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-variant": "#E7E0EC",
                        "md-blue": "#1976D2",
                        "md-bg": "#FAFAFA"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "roboto": ["Roboto", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Single Column Form Component Preview</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen font-roboto">
<!-- Mobile Container (393x500 Preview) -->
<div class="w-[393px] h-[500px] bg-md-bg shadow-2xl rounded-xl overflow-hidden flex flex-col border border-slate-300">
<!-- Header Card Component -->
<div class="bg-surface-variant px-4 py-4 flex items-center gap-3">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-white/50 text-md-blue">
<span class="material-symbols-outlined text-[24px]">edit</span>
</div>
<h2 class="text-[#1D1B20] text-lg font-semibold tracking-tight uppercase">CONDICION</h2>
</div>
<!-- Form Content Container -->
<div class="flex-1 overflow-y-auto px-4 py-3">
<div class="flex flex-col gap-[12px]">
<!-- Field 1: MONTO_SOLICITADO -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-700 ml-1">MONTO_SOLICITADO</label>
<div class="relative">
<input class="w-full px-4 py-3.5 bg-transparent border border-slate-400 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-500 text-slate-900" placeholder="0.00" step="0.01" type="number"/>
</div>
</div>
<!-- Field 2: SI -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-700 ml-1">SI</label>
<div class="relative">
<select class="w-full appearance-none px-4 py-3.5 bg-transparent border border-slate-400 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-slate-900">
<option disabled="" selected="" value="">Select option</option>
<option value="option1">Option 1</option>
<option value="option2">Option 2</option>
</select>
<div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-500">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Field 3: LUGAR -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-700 ml-1">LUGAR</label>
<textarea class="w-full px-4 py-3.5 bg-transparent border border-slate-400 rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-500 text-slate-900 resize-none" placeholder="Enter location details" rows="3"></textarea>
</div>
<!-- Field 4: ACTIVO (Switch Row) -->
<div class="flex items-center justify-between py-2 border-t border-slate-200 mt-2">
<span class="text-base font-medium text-slate-700">ACTIVO</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-12 h-7 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
<!-- Bottom Navigation Bar Component (Simulated) -->
<div class="border-t border-slate-200 bg-white px-4 pb-4 pt-2 flex justify-around">
<a class="flex flex-col items-center gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined">list_alt</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Forms</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Settings</span>
</a>
</div>
</div>
</body></html>
