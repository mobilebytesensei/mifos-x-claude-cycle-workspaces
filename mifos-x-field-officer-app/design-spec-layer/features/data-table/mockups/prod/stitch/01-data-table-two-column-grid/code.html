<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1975d2",
                        "surface-variant": "#E7E0EC",
                        "background-light": "#FAFAFA",
                        "background-dark": "#111921",
                        "outline": "#79747E",
                    },
                    fontFamily: {
                        "display": ["Inter", "Roboto", "sans-serif"],
                        "roboto": ["Roboto", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 16px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen p-4">
<!-- Mobile Container (393x600 as requested) -->
<div class="w-[393px] h-[600px] bg-background-light dark:bg-background-dark shadow-2xl rounded-[2rem] overflow-hidden border-[8px] border-slate-900 relative">
<!-- Status Bar Simulation -->
<div class="h-8 w-full flex justify-between items-center px-6 pt-2">
<span class="text-xs font-bold text-slate-900 dark:text-slate-100">9:41</span>
<div class="flex gap-1">
<span class="material-symbols-outlined text-[14px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[14px]">wifi</span>
<span class="material-symbols-outlined text-[14px]">battery_full</span>
</div>
</div>
<!-- Dynamic Form Header Block -->
<div class="px-4 pt-4">
<div class="bg-surface-variant dark:bg-primary/20 rounded-xl p-4 flex items-center gap-3 shadow-sm">
<div class="flex items-center justify-center w-10 h-10 bg-white dark:bg-slate-800 rounded-lg shadow-sm">
<span class="material-symbols-outlined text-primary">edit</span>
</div>
<div class="flex-1">
<h2 class="text-slate-900 dark:text-slate-100 text-base font-semibold tracking-tight leading-tight">DATOS_DE_LA_PERSONA</h2>
<p class="text-xs text-slate-600 dark:text-slate-400">Dynamic Form Block</p>
</div>
<button class="text-slate-600 dark:text-slate-400">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
<!-- Form Content -->
<div class="p-4 space-y-6 overflow-y-auto h-[calc(100%-140px)]">
<div class="form-grid">
<!-- Row 1 -->
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-medium text-primary uppercase tracking-wider px-1">Fecha de Nacimiento</label>
<div class="relative">
<input class="w-full bg-transparent border border-outline/50 rounded-lg h-12 px-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none text-slate-900 dark:text-slate-100" placeholder="YYYY-MM-DD" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-500 text-xl">calendar_today</span>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-medium text-primary uppercase tracking-wider px-1">Estado Civil</label>
<div class="relative">
<select class="w-full bg-transparent border border-outline/50 rounded-lg h-12 px-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none text-slate-900 dark:text-slate-100">
<option value="">Seleccionar</option>
<option>Soltero/a</option>
<option>Casado/a</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-500 pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Row 2 -->
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-medium text-primary uppercase tracking-wider px-1">Municipio</label>
<input class="w-full bg-transparent border border-outline/50 rounded-lg h-12 px-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none text-slate-900 dark:text-slate-100" placeholder="Ciudad" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-medium text-primary uppercase tracking-wider px-1">Tipo Identificación</label>
<input class="w-full bg-transparent border border-outline/50 rounded-lg h-12 px-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none text-slate-900 dark:text-slate-100" placeholder="Ej: C.C." type="text"/>
</div>
<!-- Row 3 -->
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-medium text-primary uppercase tracking-wider px-1">Marital Status</label>
<div class="relative">
<select class="w-full bg-transparent border border-outline/50 rounded-lg h-12 px-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none text-slate-900 dark:text-slate-100">
<option value="">Select</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-500 pointer-events-none">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-medium text-primary uppercase tracking-wider px-1">Sexo</label>
<div class="relative">
<select class="w-full bg-transparent border border-outline/50 rounded-lg h-12 px-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none text-slate-900 dark:text-slate-100">
<option value="">Select</option>
<option>Masculino</option>
<option>Femenino</option>
<option>Otro</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-500 pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Row 4 -->
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-medium text-primary uppercase tracking-wider px-1">Edad</label>
<input class="w-full bg-transparent border border-outline/50 rounded-lg h-12 px-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none text-slate-900 dark:text-slate-100" placeholder="0" type="number"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-[11px] font-medium text-primary uppercase tracking-wider px-1">N. Dependientes</label>
<input class="w-full bg-transparent border border-outline/50 rounded-lg h-12 px-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none text-slate-900 dark:text-slate-100" placeholder="0" type="number"/>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-primary text-white font-bold h-12 rounded-xl shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">save</span>
                    Guardar Cambios
                </button>
</div>
</div>
<!-- Home Indicator -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</body></html>
