<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1975d2",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 flex justify-center items-start min-h-screen">
<div class="relative flex h-[852px] w-[393px] flex-col bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800">
<!-- Top App Bar -->
<div class="flex items-center bg-primary p-4 h-16 shrink-0 shadow-md">
<div class="text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 ml-2">Client Details</h2>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto pb-24">
<!-- Section 1: Client Header Card -->
<div class="p-4">
<div class="flex items-center gap-4 rounded-xl bg-white dark:bg-slate-900 p-5 shadow-sm border border-slate-200 dark:border-slate-800">
<div class="size-16 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="Profile photo of Maria Garcia" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjglAVdpkbxLX_2QprC5mf2USpQfAVi6teTTCwLkvTJURQVYeTErH1Pw12et8nUFnkq3VUubu_KcoIb60LR3KuZmyuJk_HgnuVKSyoDBxbN2ovEzOh_Pwkf2plCfL3hgsMsmRAo9YABr4vI1EmPH9ykCT9Bal1WmOif5nr97zoIZK42YKN04CGAupBXHwN7TgZIq8_C4sD5LqFtjtt7poMBmmX60BjUFm94LYE14gJ2GX-PxHjyKah6aXRLAOVcp6euPO8Nx5VmkSI"/>
</div>
<div class="flex flex-col gap-0.5">
<p class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight">Maria Garcia</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium leading-normal tracking-wide">CLI-2026-0042</p>
</div>
</div>
</div>
<!-- Section 2: Expanded Form (DATOS_PERSONALES) -->
<div class="px-4 py-2">
<div class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden shadow-sm border border-slate-200 dark:border-slate-800">
<!-- Header with Surface Variant Style -->
<div class="bg-primary/10 dark:bg-primary/20 p-4 flex justify-between items-center border-b border-slate-200 dark:border-slate-800">
<h3 class="text-primary text-sm font-bold tracking-widest uppercase">DATOS_PERSONALES</h3>
<span class="material-symbols-outlined text-primary text-xl">edit</span>
</div>
<div class="p-4 grid grid-cols-2 gap-4">
<!-- Date Field -->
<div class="flex flex-col gap-1.5">
<label class="text-slate-500 dark:text-slate-400 text-xs font-semibold ml-1">Date
<div class="relative">
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none" type="text" value="12/05/1992"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 text-lg">calendar_today</span>
</div>
</label></div>
<!-- Dropdown / Category -->
<div class="flex flex-col gap-1.5">
<label class="text-slate-500 dark:text-slate-400 text-xs font-semibold ml-1">Category
<div class="relative">
<select class="w-full appearance-none rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none">
<option>Premium</option>
<option>Standard</option>
<option>VIP</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-400 text-lg pointer-events-none">expand_more</span>
</div>
</label></div>
<!-- Name Text Field -->
<div class="flex flex-col gap-1.5 col-span-2">
<label class="text-slate-500 dark:text-slate-400 text-xs font-semibold ml-1">Name
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none" type="text" value="Maria Garcia"/>
</label></div>
<!-- Integer Field / Age -->
<div class="flex flex-col gap-1.5">
<label class="text-slate-500 dark:text-slate-400 text-xs font-semibold ml-1">Age
<input class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-3 text-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none" type="number" value="31"/>
</label></div>
</div>
</div>
</div>
<!-- Section 3: Collapsed Accordion (DATOS_LABORALES) -->
<div class="px-4 py-2">
<div class="bg-white dark:bg-slate-900 rounded-xl flex items-center justify-between p-4 shadow-sm border border-slate-200 dark:border-slate-800">
<div class="flex flex-col">
<p class="text-slate-900 dark:text-slate-100 text-sm font-bold tracking-widest uppercase">DATOS_LABORALES</p>
<p class="text-slate-500 dark:text-slate-400 text-xs mt-0.5">3 fields</p>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</div>
</div>
</div>
<!-- Fixed Bottom Button -->
<div class="absolute bottom-0 left-0 right-0 p-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">save</span>
                Save All Data
            </button>
</div>
</div>
</body></html>
